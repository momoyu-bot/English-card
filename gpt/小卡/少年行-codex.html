  if(!ac){ac=new AC();bus=outputBus(ac)}
  const ready=ac.state==='running'?Promise.resolve():ac.resume();
  Promise.resolve(ready).then(()=>{
   if(serial!==soundGeneration||!playing||muted)return;
   if(ac.state!=='running'){soundError=true;refresh();return}
   soundError=false;refresh();noteGate=ac.createGain();noteGate.gain.setValueAtTime(.0001,ac.currentTime);noteGate.gain.linearRampToValueAtTime(1,ac.currentTime+.035);noteGate.connect(bus.input);
   const t=position();nextEvent=0;while(nextEvent<EVENTS.length&&EVENTS[nextEvent].t<t){const e=EVENTS[nextEvent++];if(t-e.t<e.d&&t-e.t<3.75)schedule(e,ac.currentTime+.028,t-e.t)}
   audible=true;pump();timer=setInterval(pump,80)
  }).catch(()=>{if(serial===soundGeneration){soundError=true;refresh()}})
 }catch(_){soundError=true;refresh()}
}
function size(px){
 const width=Math.max(1,Math.round(px)),height=Math.round(width*H/W);
 if(width!==pixelWidth||height!==canvas.height){
  canvas.width=width;canvas.height=height;pixelWidth=width;sceneScale=width/W;
  for(const old of backplates.values()){old.width=1;old.height=1}backplates.clear();grainPattern=null
 }
 if(started)render(position());else poster()
}
function resize(){size(Math.max(1,canvas.getBoundingClientRect().width)*Math.min(window.devicePixelRatio||1,3))}
function frame(now){
 if(!playing)return;current=position();
 if(current>=TOTAL){playing=false;current=TOTAL;raf=0;stopSound();render(TOTAL);refresh();return}
 if(now-lastPaint>=1000/30-1){render(current);refresh();lastPaint=now}
 raf=requestAnimationFrame(frame)
}
function play(){
 if(playing)return;if(current>=TOTAL-.01)current=0;started=true;playing=true;anchor=performance.now()-current*1000;lastPaint=-1000;
 startSound();render(current);refresh();raf=requestAnimationFrame(frame)
}
function pause(){
 if(!playing)return;current=position();playing=false;cancelAnimationFrame(raf);raf=0;stopSound();render(current);refresh()
}
function seek(t){
 t=minmax(Number(t)||0,0,TOTAL);started=true;current=t;
 if(playing){if(t>=TOTAL){playing=false;cancelAnimationFrame(raf);stopSound()}else{anchor=performance.now()-t*1000;startSound()}}
 render(t);refresh()
}
function toggle(){if(playing)pause();else play()}
canvas.addEventListener('click',toggle);canvas.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}});
playButton.addEventListener('click',toggle);
muteButton.addEventListener('click',()=>{if(soundError){soundError=false;muted=false}else muted=!muted;if(muted)stopSound();else if(playing)startSound();refresh()});
slider.addEventListener('pointerdown',()=>{dragging=true;resumeDrag=playing;if(playing)pause()});
slider.addEventListener('input',()=>seek(Number(slider.value)));
function releaseDrag(){if(!dragging)return;dragging=false;const resume=resumeDrag;resumeDrag=false;if(resume&&current<TOTAL)play();else refresh()}
slider.addEventListener('change',releaseDrag);window.addEventListener('pointerup',releaseDrag);window.addEventListener('pointercancel',releaseDrag);
document.addEventListener('visibilitychange',()=>{if(document.hidden){resumeDrag=false;if(playing)pause()}});window.addEventListener('pagehide',pause);
if(window.ResizeObserver){new ResizeObserver(resize).observe(canvas)}else{window.addEventListener('resize',resize)}
window.FILM={W,H,TOTAL,canvas,events:EVENTS,cues:CUES,chapters:SCENES.slice(0,-1),synth,setup:size,render,poster,seek,pause,play,get time(){return position()},get playing(){return playing},get muted(){return muted},get audioState(){return ac?ac.state:'idle'}};
resize();refresh()

})();
