$('start').addEventListener('click',play);$('play').addEventListener('click',()=>playing?pause():play());canvas.addEventListener('click',()=>playing?pause():play());$('seek').addEventListener('input',e=>{hasStarted=true;$('start').hidden=true;seek(e.target.value)});$('restart').addEventListener('click',()=>{seek(0);play()});$('sound').addEventListener('click',async()=>{muted=!muted;$('sound').setAttribute('aria-pressed',String(!muted));$('sound').setAttribute('aria-label',muted?'开启声音':'关闭声音');$('sound').style.opacity=muted?.45:1;if(!muted&&playing)try{await enableAudio()}catch{}if(audioRig)audioRig.master.gain.setTargetAtTime(muted?0:.7,ctx.currentTime,.03)});
$('full').addEventListener('click',async()=>{if(document.fullscreenElement){await document.exitFullscreen();return}if(focus){focus=false;$('player').classList.remove('focus-mode');document.body.style.overflow='';$('full').setAttribute('aria-label','展开画面');fit();return}try{if(!$('player').requestFullscreen)throw Error();await $('player').requestFullscreen()}catch{focus=true;$('player').classList.add('focus-mode');document.body.style.overflow='hidden';$('full').setAttribute('aria-label','收起画面');fit()}});
lines.forEach((l,i)=>{const li=document.createElement('li'),b=document.createElement('button'),tm=document.createElement('time'),sp=document.createElement('span');tm.textContent=format(l.s);sp.textContent=l.text;b.append(tm,sp);b.addEventListener('click',()=>{seek(l.s+.1);play();$('player').scrollIntoView({behavior:'smooth',block:'start'})});li.append(b);$('transcript').append(li)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});document.addEventListener('keydown',e=>{if(e.target.matches('input,button,summary'))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight')seek(time+5);if(e.code==='ArrowLeft')seek(time-5);if(e.code==='Escape'&&focus)$('full').click()});

window.FILM={duration:D,width:W,height:H,fps:30,canvas,scenes:scenes.map(({s,e})=>({start:s,end:e})),subtitles:lines.map(l=>({...l})),render:(t,o={})=>render(t,o),seek,pause,play,getTime:()=>time,get playing(){return playing},get audioState(){return ctx?{state:ctx.state,muted,events:soundEvents.length}:null},setSize:(w,h)=>{canvas.width=w;canvas.height=h;baseScale=w/W;render(time)},restoreSize:fit,async audio(){const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!AC)throw Error('Offline audio unavailable');const ac=new AC(2,D*44100,44100),r=rig(ac);r.rainGain.gain.setValueAtTime(.27,0);[[12,.16],[64,.38],[88,.075],[108,.16]].forEach(([t,v])=>r.rainGain.gain.setTargetAtTime(v,t,.4));r.master.gain.setValueAtTime(.7,0);r.master.gain.setValueAtTime(.7,148);r.master.gain.linearRampToValueAtTime(0,D);soundEvents.forEach(e=>tone(ac,r,e,e.t));return ac.startRendering()}};
