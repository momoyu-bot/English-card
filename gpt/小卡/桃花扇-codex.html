<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172d2b">
<title>桃花扇</title>
<meta name="description" content="在梁上撒了许多年桃花的暹罗，头一回坐到了台下。">
<style>
:root{color-scheme:dark;--ink:#142a28;--shell:#203633;--paper:#efdfc3;--muted:#b6bdb0;--gold:#ddbd8a;--line:#425751;--serif:"Songti SC","STSong","Noto Serif CJK SC",serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}
html{min-height:100%;background:var(--ink)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 17%,#39504a 0%,#203834 48%,#122825 100%);font:15px/1.5 var(--sans);color:var(--paper);-webkit-tap-highlight-color:transparent}
button,summary,input{font:inherit}
button{cursor:pointer;background:none;border:0;color:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #f4cd92;outline-offset:1px}
main{padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(18px + env(safe-area-inset-bottom,0px));min-height:100vh}
.wrap{width:100%;max-width:min(456px,calc((100vh - 96px) * .60));margin:auto}
@supports(height:100svh){.wrap{max-width:min(456px,calc((100svh - 96px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .60))}}
#viewer{margin:0 auto;position:relative;scroll-margin-top:8px}
#stage{position:relative;aspect-ratio:3 / 5;overflow:hidden;background:#385850;box-shadow:0 12px 44px #081c1c55,0 0 0 1px #d6bd8c36;border-radius:3px}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#watch{position:absolute;inset:0;padding:0;display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;touch-action:manipulation}
.openlabel{display:flex;align-items:center;gap:.65em;margin-bottom:8%;padding:10px 21px 10px 19px;border-radius:24px;color:#fff0d6;background:#284942f0;border:1px solid #d5c5a4c9;box-shadow:0 3px 12px #263f393f;font:600 15px/1.4 var(--serif);letter-spacing:.11em}
.openlabel svg{width:13px;height:15px}
#viewer:not([data-view=cover]) .openlabel{display:none}
#controls{padding:5px 3px 0;color:#f1e2c8}
#scrub{display:block;appearance:none;-webkit-appearance:none;width:100%;height:21px;margin:0;background:transparent;cursor:pointer;--played:0%;touch-action:pan-y}
#scrub::-webkit-slider-runnable-track{height:3px;border-radius:6px;background:linear-gradient(to right,#dfb789 0 var(--played),#587169 var(--played) 100%)}
#scrub::-moz-range-track{height:3px;border-radius:6px;background:#587169}
#scrub::-moz-range-progress{height:3px;background:#dfb789}
#scrub::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border-radius:50%;background:#ead3ad;box-shadow:0 0 0 1px #0e232835}
#scrub::-moz-range-thumb{height:12px;width:12px;border:0;border-radius:50%;background:#ead3ad}
.controlrow{display:flex;align-items:center;gap:2px;height:41px}
.ctrl{display:grid;place-items:center;min-width:43px;height:43px;padding:9px}
.ctrl:first-child{margin-left:-7px}
.ctrl:last-child{margin-right:-7px}
.ctrl svg{width:20px;height:20px;display:block}
#clock{font:12.5px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.035em;margin-left:2px;display:flex;gap:6px}
.total,.slash{color:var(--muted)}
.endcontrols{margin-left:auto;display:flex;gap:1px}
details{margin-top:12px;border-top:1px solid var(--line);color:var(--paper)}
summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:13px 4px;min-height:44px;list-style:none;font:600 15px var(--serif);letter-spacing:.1em}
summary::-webkit-details-marker{display:none}
summary svg{width:16px;height:16px;transition:transform .2s}
details[open] summary svg{transform:rotate(180deg)}
#lines{display:grid;margin-bottom:4px}
.cue{border-top:1px solid #77908137;text-align:left;padding:12px 5px;display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:baseline;color:#eee6d5;line-height:1.65}
.cue[aria-current=true]{background:#bfc2a50f}
.stamp{color:#d5ba92;font-size:12px;font-variant-numeric:tabular-nums}
.speaker{font-size:11.5px;letter-spacing:.05em;color:#bcc5b5;margin-right:.6em;white-space:nowrap}
.scriptText{font:15px/1.6 var(--serif)}
#notice{margin:.2em 0 .4em;font-size:13px;color:#e9c89c}
[hidden]{display:none!important}
body.theatre{overflow:hidden}
#viewer.theatre{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#10201f;margin:0;padding:env(safe-area-inset-top,0px) 5px env(safe-area-inset-bottom,0px)}
#viewer.theatre #stage{width:min(100%,calc((100vh - 70px) * .6));flex:none;border-radius:0}
#viewer.theatre #controls{width:min(100%,calc((100vh - 70px) * .6));flex:none}
@supports(height:100dvh){#viewer.theatre #stage,#viewer.theatre #controls{width:min(100%,calc((100dvh - 70px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .60))}}
@media(min-width:700px){main{padding-top:13px}.wrap{max-width:min(460px,calc((100vh - 105px)*.60))}details{margin-top:15px}}
@media(max-height:420px) and (orientation:landscape){main{padding-top:4px}.wrap{max-width:min(100%,calc((100vh - 72px)*.60))}.ctrl{min-width:35px}.openlabel{padding:3px 11px;font-size:11px}}
</style>
</head>
<body>
<main><div class="wrap">
<section id="viewer" aria-label="桃花扇播放器" data-view="cover">
<div id="stage"><canvas id="film" width="720" height="1200" role="img" aria-label="桃花扇，小萌物动画短片"></canvas>
<button id="watch" type="button" aria-label="播放桃花扇"><span class="openlabel"><svg viewBox="0 0 14 16" aria-hidden="true"><path d="M2 1 L13 8 L2 15Z" fill="currentColor"/></svg>开映</span></button></div>
<div id="controls"><input id="scrub" type="range" min="0" max="92" step="0.033333" value="0" aria-label="播放进度">
<div class="controlrow"><button type="button" class="ctrl" id="pp" aria-label="播放"></button>
<output id="clock" aria-label="播放时间"><span id="elapsed">0:00</span><span class="slash">/</span><span class="total">1:32</span></output>
<div class="endcontrols"><button type="button" class="ctrl" id="sound" aria-label="静音"></button><button type="button" class="ctrl" id="expand" aria-label="全屏"></button></div></div>
<p id="notice" hidden role="status"></p></div></section>
<details id="script"><summary>字幕本<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4.5 7.5 5.5 5 5.5-5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></summary><div id="lines"></div></details>
<audio id="score" preload="auto" playsinline></audio>
</div></main>

function seeded(seed){return ()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296;};}
function group(fn){g.save();fn();g.restore();}
function fade(alpha,fn){if(alpha<=0)return;group(()=>{g.globalAlpha*=clamp(alpha);fn();});}
function place(x,y,rot,scale,fn){group(()=>{g.translate(x,y);g.rotate(rot);g.scale(scale,scale);fn();});}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h);}

function path(d,fill,stroke=null,width=1){const p=typeof d==='string'?getPath(d):d;if(fill){g.fillStyle=fill;g.fill(p);}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke(p);}}
const paths=new Map();
function getPath(d){let p=paths.get(d);if(!p){p=new Path2D(d);paths.set(d,p);}return p;}
function line(x1,y1,x2,y2,color,width=1){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=color;g.lineWidth=width;g.stroke();}
function curve(x1,y1,x2,y2,x3,y3,x4,y4,color,width=1){g.beginPath();g.moveTo(x1,y1);g.bezierCurveTo(x2,y2,x3,y3,x4,y4);g.strokeStyle=color;g.lineWidth=width;g.stroke();}
function poly(a,fill,stroke=null,width=1){g.beginPath();g.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)g.lineTo(a[i][0],a[i][1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke();}}
function grad(x1,y1,x2,y2,stops){const p=g.createLinearGradient(x1,y1,x2,y2);for(const [k,v] of stops)p.addColorStop(k,v);return p;}
function wash(x,y,r,center,edge){const p=g.createRadialGradient(x,y,0,x,y,r);p.addColorStop(0,center);p.addColorStop(1,edge);return p;}
const serif='"Songti SC","STSong","Noto Serif CJK SC","Noto Serif CJK JP",serif';
function chars(s,x,y,size,color,align='left',weight=500){g.fillStyle=color;g.font=weight+' '+size+'px '+serif;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function layer(w,h,res,fn){const a=document.createElement('canvas');a.width=Math.ceil(w*res);a.height=Math.ceil(h*res);const old=g;try{g=a.getContext('2d');g.scale(res,res);g.lineJoin='round';g.lineCap='round';fn();}finally{g=old;}return a;}
const ink='#293c3b',gold='#ba9b67',brass='#dab67f';
const textureCache=new Map();
function tooth(seed=4){
  if(textureCache.has(seed))return textureCache.get(seed);
  const r=seeded(seed),n=192;const tile=layer(n,n,1,()=>{
    const data=g.createImageData(n,n);
    for(let i=0;i<data.data.length;i+=4){const v=r()<.53?31:249;data.data[i]=v;data.data[i+1]=v-3;data.data[i+2]=v-9;data.data[i+3]=Math.round(5+28*r());}
    g.putImageData(data,0,0);
    for(let i=0;i<150;i++){const x=r()*n,y=r()*n;line(x,y,x+2+r()*9,y-1+r()*2,'rgba(97,66,48,.12)',.45);}
  });textureCache.set(seed,tile);return tile;
}
function grain(x,y,w,h,alpha=0.6){group(()=>{g.globalAlpha*=alpha;g.fillStyle=g.createPattern(tooth(),'repeat');g.fillRect(x,y,w,h);});}
function silkBorder(x,y,w,h,col){
  g.strokeStyle=col;g.lineWidth=.65;g.strokeRect(x,y,w,h);g.strokeRect(x+3,y+3,w-6,h-6);
  for(const [px,py,flipX,flipY] of [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){
    group(()=>{g.translate(px,py);g.scale(flipX,flipY);path('M1 17 H8 V8 H17 V2 M5 24 H11 V13 H24 V6',null,col,.9);});
  }
}
function wood(x,y,w,h,base,dir='h',seed=1){
  rect(x,y,w,h,base);const r=seeded(seed);
  group(()=>{g.beginPath();g.rect(x,y,w,h);g.clip();
    const lines=Math.ceil((dir==='h'?h:w)*.72);
    for(let i=0;i<lines;i++){const a=r(),len=.13+.78*r(),offset=r();
      if(dir==='h'){const yy=y+r()*h,xx=x+(offset-.08)*w;curve(xx,yy,xx+len*w*.25,yy-r()*2,xx+len*w*.72,yy+r()*2,xx+len*w,yy,a>.45?'#e0b9832a':'#291e253c',.3+r()*.8);}
      else{const xx=x+r()*w,yy=y+(offset-.08)*h;curve(xx,yy,xx+r()*2,yy+len*h*.33,xx-r()*1.5,yy+len*h*.7,xx,yy+len*h,a>.45?'#e0b9832c':'#281e263d',.3+r()*.8);}

  });line(x,y+1,x+w,y+1,'#efcd9b47',.9);line(x,y+h-1,x+w,y+h-1,'#1b1c2275',1.3);
}
function blossom(x,y,size,rotation,colors,detail=true){
  group(()=>{g.translate(x,y);g.rotate(rotation);g.scale(size,size);
    for(let i=0;i<5;i++){group(()=>{g.rotate(i*TAU/5+.035*Math.sin(i+x));path('M0 .08 C-.31 -.04 -.66 -.47 -.48 -.76 Q-.33 -1.08 -.08 -.89 Q.21 -1.15 .39 -.85 C.65 -.52 .40 -.15 0 .08Z',colors[i%colors.length]);});}

// Illustration printed across all the pleats. Each sector is projected from the same painting.
const FOLDS=18,spread=1.22,fanSectors=[];
function fanArt(){
  if(fanSectors.length)return;
  const k=3,source=layer(266,146,k,()=>{
    g.translate(133,133);
    rect(-133,-133,266,146,grad(-90,-120,95,0,[[0,'#f2dbac'],[.43,'#f3e3bd'],[1,'#d4b483']]));
    oval(52,-88,13,13,'#f9eccb');
    fade(.59,()=>hills(-134,-105,273,75,18,true));
    place(16,-54,Math.PI-.08,.84,()=>peachBough(16));
    place(-144,-144,.29,.98,()=>peachBough(3));
    place(107,-110,0,.54,()=>{g.scale(-1,1);peachBough(61);});
    for(let i=0;i<4;i++){const xx=-31+i*5,yy=-81+i*6;chars(['落','花','入','座'][i],xx,yy,4.2,'#705f52','center');}
    rect(-21,-58,4.1,4.4,'#ad5d4a');grain(-133,-133,266,146,.9);
    for(const rad of [45,47.7,114.8,117.6]){
      g.beginPath();g.arc(0,0,rad,-Math.PI/2-spread,-Math.PI/2+spread);g.strokeStyle=rad===114.8?'#9d7449':'#b48e59';g.lineWidth=rad===114.8?.9:.45;g.stroke();
    }
  });
  for(let i=0;i<FOLDS;i++){
    const a=-spread+2*spread*i/FOLDS,b=-spread+2*spread*(i+1)/FOLDS;
    const dirs=[a,b].map(q=>[Math.sin(q),-Math.cos(q)]),[v,w]=dirs;
    const points=[[v[0]*44,v[1]*44],[v[0]*120,v[1]*120],[w[0]*120,w[1]*120],[w[0]*44,w[1]*44]];
    const bx=Math.floor(Math.min(...points.map(p=>p[0])))-1,by=Math.floor(Math.min(...points.map(p=>p[1])))-2;
    const bw=Math.ceil(Math.max(...points.map(p=>p[0])))-bx+2,bh=Math.ceil(Math.max(...points.map(p=>p[1])))-by+2;
    const img=layer(bw,bh,k,()=>{g.translate(-bx,-by);
      g.beginPath();g.arc(0,0,120,-Math.PI/2+a-.001,-Math.PI/2+b+.001);g.arc(0,0,44,-Math.PI/2+b+.001,-Math.PI/2+a-.001,true);g.closePath();g.clip();
      g.drawImage(source,-133,-133,266,146);rect(bx,by,bw,bh,i%2?'rgba(89,56,40,.105)':'rgba(255,250,222,.10)');
    });
    fanSectors.push({v,w,bx,by,bw,bh,img,a,b});
  }
