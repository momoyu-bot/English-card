function noiseBuf(ac){

}
function crunchBuf(ac){

  var u=i/sr, env=Math.exp(-u*60)+.7*(u>=.05?Math.exp(-(u-.05)*70):0)+.5*(u>=.1?Math.exp(-(u-.1)*80):0);
  d[i]=(r()*2-1)*env;

}

/* 声音跟着画面走：声音钟停了（锁屏、来电）就隔一秒叫一次，差出去 0.3 秒就重新接上 */
var AC=null, master=null, pumpId=null, audioT0=0, audioF0=0, nextIdx=0, lastTry=0;
function audioNow(){ return audioF0+(AC.currentTime-audioT0); }
function resumeAC(){ try{ var pr=AC.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
function pump(){
 if(!master) return;
 var horizon=audioNow()+.35;
 while(nextIdx<EVENTS.length&&EVENTS[nextIdx].t<horizon){
  var e=EVENTS[nextIdx++];
  if(e.t>=audioF0-.01) synth(AC,master,e,Math.max(AC.currentTime,audioT0+(e.t-audioF0)));
 }
}
function audioStop(){
 if(pumpId){ clearInterval(pumpId); pumpId=null; }
 if(master){ var m=master; master=null; try{ m.gain.setTargetAtTime(0,AC.currentTime,.03); setTimeout(function(){ try{m.disconnect();}catch(e){} },400); }catch(e){} }
}
function audioStart(t){
 if(!soundOn) return;
 try{
  if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; AC=new C(); }
  if(AC.state!=='running') resumeAC();
  audioStop();
  master=AC.createGain(); master.gain.value=1; master.connect(AC.destination);
  audioF0=t; audioT0=AC.currentTime+.06;
  nextIdx=0; while(nextIdx<EVENTS.length&&EVENTS[nextIdx].t<t) nextIdx++;
  pump(); pumpId=setInterval(pump,80);
 }catch(err){ master=null; }
}
function audioFollow(){
 if(!soundOn||!AC) return;
 var n=performance.now();
 if(AC.state!=='running'){ if(n-lastTry>1000){ lastTry=n; resumeAC(); } return; }
 if(master&&Math.abs(audioNow()-cur)<=.3) return;
 if(n-lastTry>1000){ lastTry=n; audioStart(cur); }
}

var player=document.getElementById('player'), screenEl=document.getElementById('screen'),

var playing=false, cur=0, filmT0=0, perfT0=0, raf=0, soundOn=true, started=false;
seek.max=Math.round(TOTAL*10);
function fmt(s){ s=Math.floor(s); return Math.floor(s/60)+':'+('0'+s%60).slice(-2); }
SCENES.forEach(function(sc){
 var b=document.createElement('button'); b.type='button'; b.textContent=sc.chipText;
 b.addEventListener('click',function(){ go(sc.start+.18); });
 sc.chip=b; chips.appendChild(b);
 sc.caps.forEach(function(c){
 function followLine(){ go(sc.start+c.t0+.24); var box=screenEl.getBoundingClientRect(); if(box.top<0||box.bottom>window.innerHeight) screenEl.scrollIntoView({block:'start'}); }
 c.el.addEventListener('click',followLine);
 c.el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();followLine();} });
 });
});
function clock(){ return filmT0+Math.max(0,performance.now()-perfT0)/1000; }
var lastOn=null, lastChip=null;
function ui(){
 timeEl.textContent=fmt(cur)+' / '+fmt(TOTAL);
 seek.value=Math.round(cur*10);
 seek.style.setProperty('--position',(100*cur/TOTAL)+'%');
 pp.textContent=playing?'暂停':'播放';
 var sc=sceneAt(cur), lt=cur-sc.start, on=null;
 if(started) sc.caps.forEach(function(c){ if(lt>=c.t0&&lt<c.t1) on=c.el; });
 if(on!==lastOn){ if(lastOn) lastOn.classList.remove('on'); if(on) on.classList.add('on'); lastOn=on; }
 var chip=started?sc.chip:null;
 if(chip!==lastChip){ if(lastChip) lastChip.classList.remove('on'); if(chip) chip.classList.add('on'); lastChip=chip; }
 player.classList.toggle('playing',playing);
 if(!playing){
  var end=cur>=TOTAL-.05;
  big.textContent=end?'再看一遍':started?'继续播放':'开始放映';
  big.classList.toggle('past',started); big.classList.toggle('again',end);
  big.setAttribute('aria-label',end?'再看一遍':'播放');
 }
}
function tick(){
 if(!playing) return;
 cur=clock();
 if(cur>=TOTAL){ cur=TOTAL; render(cur); pause(); return; }
 render(cur); audioFollow(); ui();
 raf=requestAnimationFrame(tick);
}
function enterFilm(){if(!document.body.classList.contains('watching')){document.body.classList.add('watching');fit();}}
function play(){
 enterFilm();
 if(cur>=TOTAL-.05) cur=0;
 started=true; playing=true;
 filmT0=cur; perfT0=performance.now()+60;
 audioStart(cur);
 cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
 ui();
}
function pause(){
 if(playing) cur=Math.min(TOTAL,clock());
 playing=false; audioStop(); cancelAnimationFrame(raf);
 ui();
}
function go(t){
 enterFilm();
 started=true; cur=Math.max(0,Math.min(TOTAL,t));
 if(playing){ audioStop(); filmT0=cur; perfT0=performance.now()+60; audioStart(cur); }
 render(cur); ui();
}
