function pause(){if(!running)return;cur=now();running=false;generation++;audioStart=null;cancelAnimationFrame(raf);disconnectBus();render(cur,!soundOn);update(cur)}
function seek(v){const n=Number(v);if(!Number.isFinite(n))return;const next=clamp(n,0,TOTAL);started=true;cur=next;if(running&&next>=TOTAL){running=false;generation++;cancelAnimationFrame(raf);disconnectBus();audioStart=null}else if(running){origin=next;wallStart=performance.now();audioStart=null;startAudio(next)}render(next,!soundOn);update(next)}
function togglePlay(){if(running)pause();else play()}
function updateVolume(){volume.innerHTML=icon(soundOn?'sound':'mute');volume.setAttribute('aria-label',soundOn?'静音':'开启声音');volume.setAttribute('aria-pressed',String(!soundOn));gainMaster()}
toggle.addEventListener('click',togglePlay);entrance.addEventListener('click',play);canvas.addEventListener('click',togglePlay);
volume.addEventListener('click',()=>{soundOn=!soundOn;updateVolume();if(started&&!running)render(cur,!soundOn);if(soundOn){unlock().then(ok=>{if(ok&&running&&!bus)startAudio(now())})}});
seekBar.addEventListener('pointerdown',()=>{resumeDrag=running;dragging=true;if(running)pause()});
function release(){if(!dragging)return;dragging=false;const again=resumeDrag;resumeDrag=false;if(again&&cur<TOTAL-.03)play()}
seekBar.addEventListener('input',()=>seek(seekBar.value));seekBar.addEventListener('change',()=>{seek(seekBar.value);release()});window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
document.addEventListener('keydown',ev=>{if(ev.code!=='Space'||ev.repeat||['BUTTON','INPUT','SUMMARY','A'].includes(ev.target.tagName))return;ev.preventDefault();togglePlay()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause()});window.addEventListener('pagehide',pause);
cues.forEach(c=>{const b=document.createElement('button');b.className='cue';b.type='button';const ti=document.createElement('time');ti.textContent=timecode(c[0]);const part=document.createElement('span');const wh=document.createElement('small');wh.textContent=c[2];const line=document.createElement('span');line.className='word';line.textContent=c[3];part.append(wh,line);b.append(ti,part);b.setAttribute('aria-label','从 '+timecode(c[0])+' 播放，'+c[2]+'，'+c[3]);el('lines').appendChild(b);cells.push(b);b.addEventListener('click',()=>{seek(c[0]);if(!running)play();el('stage').scrollIntoView({block:'start',behavior:'auto'})})});
function sizeToScreen(){const box=el('stage').getBoundingClientRect();if(!box.width)return;const px=Math.round(box.width*Math.min(3,window.devicePixelRatio||1));if(canvas.width!==px)setup(px);if(started)render(now(),!soundOn);else poster()}
updateVolume();sizeToScreen();update(0);if(window.ResizeObserver)new ResizeObserver(sizeToScreen).observe(el('stage'));else window.addEventListener('resize',sizeToScreen);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!running)sizeToScreen()});
window.FILM={W,H,TOTAL,canvas,events,synth,setup,render,poster,seek,play,pause,scenes:scenes.map(s=>({id:s.id,start:s.start,duration:s.end-s.start})),state:()=>({cur:now(),playing:running,soundOn,started})};
