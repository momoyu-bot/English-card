 for(const [t,m] of [[75.02,50],[76.45,50],[77.87,55]])add(t,m,.85,'hollow',.32,-.21);
 add(76.45,62,.27,'wood',.175,-.27);add(77.17,69,.30,'wood',.18,-.24);
 add(78.87,0,.32,'paper',.16,.27);add(79.31,74,.60,'lip',.24,.20);add(80.03,69,.33,'wood',.204,-.19);add(80.54,0,.26,'paper',.180,.23);add(80.74,77,.66,'lip',.21,.23);add(81.47,50,.9,'hollow',.25,-.22);add(82.19,69,.39,'wood',.22,-.15);
 const duetBars=[
  [50,62,69],[53,65,69],[48,64,67],[50,62,69],
  [50,65,69],[48,64,72],[46,65,70],[45,64,69],
  [50,65,74],[53,69,77],[48,64,72],[50,65,69]
 ];
 for(let j=0;j<duetBars.length;j++){
 const a=82.80+j*3*.705,[low,mid,hi]=duetBars[j];
 add(a,low,1.05,'hollow',j<2?.225:.265,-.18);
 if(j!==3&&j!==7)add(a+.705,mid,.36,'wood',.196,-.24);
 add(a+1.41,hi,.68,'lip',.213,.18);
 if(j%2===0)add(a+.91,0,.24,'paper',.125,.28);
 if(j>3&&j%3!==1)add(a+1.76,mid+7,.32,'wood',.122,-.08);
 }
 // Near the end one can still hear the step that used to lag behind.
 add(108.25,50,.97,'hollow',.225,-.13);add(108.95,62,.55,'wood',.193,-.10);add(109.90,69,1.1,'lip',.19,.12);
 return list.sort((l,r)=>l.t-r.t)
}
const EVENTS=makeScore();
const noiseCache=new WeakMap(),reverbs=new WeakMap();
function noiseBuffer(ac){
 if(noiseCache.has(ac))return noiseCache.get(ac);
 const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*.64),ac.sampleRate),d=b.getChannelData(0),rr=rng(2591);let lp=0;
 for(let i=0;i<d.length;i++){const n=rr()*2-1;lp=.80*lp+.2*n;d[i]=.64*n+.36*lp}
 noiseCache.set(ac,b);return b
}
function roomReturn(ac,out){
 if(reverbs.has(out))return reverbs.get(out);
 const send=ac.createGain(),filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=3150;send.connect(filter);
 for(const [time,vol] of [[.047,.105],[.092,.077],[.153,.043],[.234,.025]]){
 const delay=ac.createDelay(.32),level=ac.createGain();delay.delayTime.value=time;level.gain.value=vol;
 filter.connect(delay);delay.connect(level);level.connect(out)
 }reverbs.set(out,send);return send
}
function synth(ac,out,e,when){
 const t=Math.max(0,when),v=e.v*1.82,f=440*2**((e.m-69)/12),voice=e.kind;
 const pan=typeof ac.createStereoPanner==='function'?ac.createStereoPanner():ac.createGain();if(pan.pan)pan.pan.value=e.pan;pan.connect(out);pan.connect(roomReturn(ac,out));
 const disposeAt=[];
 function partial(h,amp,decay,attack=.004,drop=0,shape='sine'){
 const os=ac.createOscillator(),env=ac.createGain();os.type=shape;os.frequency.setValueAtTime(Math.min(17000,f*h*(1+drop)),t);
 if(drop)os.frequency.exponentialRampToValueAtTime(Math.max(25,f*h),t+Math.min(.080,decay*.38));
 const end=t+decay;env.gain.setValueAtTime(.00001,t);env.gain.exponentialRampToValueAtTime(Math.max(.00002,v*amp),t+attack);
 env.gain.exponentialRampToValueAtTime(Math.max(.000017,v*amp*.15),t+attack+(decay-attack)*.42);env.gain.exponentialRampToValueAtTime(.00001,end);
 os.connect(env);env.connect(pan);os.start(t);os.stop(end+.018);disposeAt.push(os);
 }
 function noise(level,dur,frequency,type='bandpass',attack=.004){
 const s=ac.createBufferSource(),filt=ac.createBiquadFilter(),amp=ac.createGain();s.buffer=noiseBuffer(ac);filt.type=type;filt.frequency.value=frequency;filt.Q.value=.8;
 amp.gain.setValueAtTime(.00001,t);amp.gain.exponentialRampToValueAtTime(Math.max(.00002,level*v),t+attack);amp.gain.exponentialRampToValueAtTime(.00001,t+dur);
 s.connect(filt);filt.connect(amp);amp.connect(pan);s.start(t,(e.t*.037)%.26,dur);disposeAt.push(s)
 }
 if(voice==='comb'||voice==='combSoft'){
 const soft=voice==='combSoft';partial(1,.77,e.d,.009);partial(2.007,.22,e.d*.70,.004);partial(3.017,soft?.09:.15,e.d*.38);partial(5.37,soft?.045:.10,.113);partial(.501,.13,e.d*.54,.009);noise(.19,.036,3300)
 }else if(voice==='body'){
 partial(1,.70,e.d,.012);partial(2,.285,e.d*.72,.007);partial(3.005,.10,e.d*.43,.007);partial(4.019,.04,e.d*.30,.006)
 }else if(voice==='wood'){
 partial(1,.46,e.d*.8,.002,.33);partial(1.63,.35,e.d*.63,.002,.18);partial(3.11,.20,.065,.002,.12);noise(.66,.046,1690);
 }else if(voice==='hollow'){
 partial(1,.63,e.d,.007,.085);partial(2,.41,e.d*.69,.005,.09);partial(2.72,.18,e.d*.31,.002,.15);noise(.32,.062,670)
 }else if(voice==='lip'){
 partial(1,.67,e.d,.007);partial(1.997,.2,e.d*.75,.006);partial(3.18,.1,e.d*.40,.005);noise(.38,.100,2080,'bandpass',.009)
 }else if(voice==='paper'){noise(1.25,e.d,2580,'bandpass',.052);noise(.36,e.d*.92,6300,'highpass',.036)
 }else if(voice==='axle'){partial(1,.32,.06,.002,.13);noise(.75,.036,970)
 }else{partial(1,.39,.085,.002,.20);partial(3.74,.19,.075,.002);noise(.58,.052,2180)}
 let live=disposeAt.length;for(const src of disposeAt)src.onended=()=>{src.disconnect();if(--live===0)pan.disconnect()}
}
const $=id=>document.getElementById(id);
const play=$('play'),sound=$('sound'),seekBar=$('seek'),elapsed=$('elapsed'),ticket=$('ticket'),surface=$('surface');
const symbols={
 play:'<path d="M7 4.2 20 12 7 19.8Z" fill="currentColor" stroke="none"/>',
 pause:'<path d="M8 5v14m8-14v14" stroke-width="3.5"/>',
 replay:'<path d="M5 9a7.5 7.5 0 1 1-.15 5M5 4v5h5"/>',
 sound:'<path d="M3 9h4l5-4v14l-5-4H3Z"/><path d="M16 8.7q3.3 3.3 0 6.6M18.8 5.6q6.4 6.4 0 12.8"/>',
 mute:'<path d="M3 9h4l5-4v14l-5-4H3Z"/><path d="m16 9 5 6m0-6-5 6"/>'
};
function icon(s){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+symbols[s]+'</svg>'}
function stamp(t){return Math.floor(t/60)+':'+String(Math.floor(t)%60).padStart(2,'0')}
let time=0,started=false,playing=false,muted=false,drag=false,wasPlaying=false,anchor=0,raf=0,drawn=-10;
let ac=null,bus=null,nextNote=0,currentCue=-1;
const rows=cues.map(([t,,lines])=>{
 const li=document.createElement('li'),button=document.createElement('button'),at=document.createElement('time'),txt=document.createElement('span');
 at.textContent=stamp(t);txt.textContent=lines.join('');button.type='button';button.append(at,txt);li.append(button);$('cues').append(li);
 button.addEventListener('click',()=>{drag=false;seekTo(t+.04);begin();window.scrollTo({top:0,behavior:'auto'})});return button
});
$('length').textContent=stamp(TOTAL);seekBar.max=TOTAL;
function parts(){
 const done=time>=TOTAL-.001;play.innerHTML=icon(playing?'pause':done?'replay':'play');
 play.setAttribute('aria-label',playing?'暂停':done?'再看一遍':'播放');
 surface.setAttribute('aria-label',playing?'暂停':done?'再看一遍':started?'继续放映':'开始放映');
 ticket.hidden=started&&!done;$('ticketText').textContent=done?'再看一遍':'开始放映';
 sound.innerHTML=icon(muted?'mute':'sound');sound.setAttribute('aria-label',muted?'打开声音':'关闭声音');sound.setAttribute('aria-pressed',String(!muted));
}
function syncDisplay(){
 if(!drag)seekBar.value=time;seekBar.style.setProperty('--done',(100*time/TOTAL).toFixed(2)+'%');elapsed.textContent=stamp(time);
 seekBar.setAttribute('aria-valuetext',stamp(time)+'，全长'+stamp(TOTAL));
 const ci=cues.findIndex(([a,b])=>time>=a&&time<=b);
 if(ci!==currentCue){if(currentCue>=0)rows[currentCue].removeAttribute('aria-current');if(ci>=0)rows[ci].setAttribute('aria-current','true');currentCue=ci}
}
function lowerBound(t){let l=0,r=EVENTS.length;while(l<r){const m=(l+r)>>1;if(EVENTS[m].t<t)l=m+1;else r=m}return l}
function retireBus(){
 if(!ac||!bus)return;const old=bus;bus=null;const now=ac.currentTime;old.gain.cancelScheduledValues(now);old.gain.setTargetAtTime(.00001,now,.009);
 setTimeout(()=>{try{old.disconnect()}catch(_){}},65)
}
function primeSound(){
 if(muted)return;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 if(!ac){try{ac=new AC();if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){if(!ac)return}}
 if(ac.state!=='running')ac.resume().catch(()=>{});
}
function freshBus(){
 retireBus();nextNote=lowerBound(time-.006);
 if(!muted&&ac){bus=ac.createGain();bus.gain.value=.91;bus.connect(ac.destination)}
}
function schedule(){
 if(!ac||!bus||ac.state!=='running')return;const now=ac.currentTime;
 while(nextNote<EVENTS.length&&EVENTS[nextNote].t<time+.20){const e=EVENTS[nextNote++];if(e.t>=time-.095)synth(ac,bus,e,now+Math.max(.004,e.t-time))}
}
function draw(){
 if(started)render(time);else {g.save();g.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);titleScene(0,true);g.restore()}syncDisplay()
}
function seekTo(t){
 time=clamp(t,0,TOTAL);started=true;anchor=performance.now()-time*1000;drawn=-10;if(playing)freshBus();draw();parts()
}
function tick(now){
 if(!playing)return;time=clamp((now-anchor)/1000,0,TOTAL);
 schedule();if(time-drawn>=1/30-.002||time>=TOTAL){draw();drawn=time}
 if(time>=TOTAL){playing=false;retireBus();parts();return}
 raf=requestAnimationFrame(tick)
}
function begin(){
 if(time>=TOTAL-.02)time=0;started=true;primeSound();cancelAnimationFrame(raf);playing=true;anchor=performance.now()-time*1000;drawn=-10;freshBus();parts();draw();raf=requestAnimationFrame(tick)
}
function pause(){
 if(playing){time=clamp((performance.now()-anchor)/1000,0,TOTAL);playing=false;cancelAnimationFrame(raf);retireBus();draw();parts()}
}
function toggle(){if(playing)pause();else begin()}
play.addEventListener('click',toggle);surface.addEventListener('click',toggle);
sound.addEventListener('click',()=>{muted=!muted;if(muted)retireBus();else{primeSound();if(playing)freshBus()}parts()});
seekBar.addEventListener('input',()=>{const target=Number(seekBar.value);if(!drag){wasPlaying=playing;pause();drag=true}seekTo(target)});
function finishScrub(){if(!drag)return;drag=false;if(wasPlaying&&time<TOTAL)begin();else{draw();parts()}}
seekBar.addEventListener('change',finishScrub);seekBar.addEventListener('pointerup',()=>setTimeout(finishScrub,0));seekBar.addEventListener('blur',finishScrub);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',pause);
function fit(){const w=Math.round(canvas.getBoundingClientRect().width*Math.min(window.devicePixelRatio||1,3));if(w>0&&canvas.width!==w){setup(w);draw()}}
window.FILM={W,H,TOTAL,events:EVENTS,canvas,setup,render,synth};
setup(W*2);fit();draw();parts();
if(window.ResizeObserver)new ResizeObserver(fit).observe($('screen'));else window.addEventListener('resize',fit);
</script>
