<main class="sheet">
  <header class="mast">
    <div class="series"><svg aria-hidden="true"><use href="#i-phone"/></svg><span>Clawd 的第五通电话</span></div>
    <button type="button" id="sound" class="sound" aria-label="关闭声音" aria-pressed="true"><svg aria-hidden="true"><use id="soundIcon" href="#i-sound"/></svg><span id="soundLabel">声音开</span></button>
  </header>
  <div class="spread">
    <div class="heading"><h1>翻个面</h1><span class="line"><i></i>线还通着</span></div>
    <figure class="picture">
      <canvas id="scene" width="700" height="444" role="img" aria-label="桌上一台装着红磁带的录音机。Clawd 用左钳夹着电话听筒。"></canvas>

    </section>
    <div class="actions">

<script>
'use strict';
const Drawing = (() => {
  const paper = document.getElementById('scene');
  const trace = document.getElementById('trace');
  const w = 700, h = 444;
  const serif = '"Songti SC","Noto Serif CJK SC",STSong,Georgia,serif';
  const sans = '"PingFang SC","Noto Sans CJK SC",Arial,sans-serif';
  const mono = '"SFMono-Regular",Consolas,monospace';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let back, grain, scale = 1, ratio = 1, tw = 1, th = 1;
  let rng = 72;
  function rand() { rng = (Math.imul(rng,1664525) + 1013904223) >>> 0; return rng / 4294967296; }
  function path(c, d, fill, stroke, width = 1) {
    const p = new Path2D(d);
    if (fill) { c.fillStyle = fill; c.fill(p); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.stroke(p); }
  }
  function rect(c,x,y,w,h,col) { c.fillStyle=col; c.fillRect(x,y,w,h); }
  function box(c,x,y,w,h,r,col,edge,line=1) {
    r = Math.min(r,w/2,h/2);
    c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r);
    c.closePath(); if(col){c.fillStyle=col;c.fill();} if(edge){c.strokeStyle=edge;c.lineWidth=line;c.stroke();}
  }
  function oval(c,x,y,rx,ry,col,edge,line=1) {
    c.beginPath(); c.ellipse(x,y,rx,ry,0,0,Math.PI*2);
    if(col){c.fillStyle=col;c.fill();} if(edge){c.strokeStyle=edge;c.lineWidth=line;c.stroke();}
  }
  function line(c,x1,y1,x2,y2,col,sw=1){
    c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=sw;c.stroke();
  }
  function text(c,t,x,y,size,col,font=mono,weight=500,align='left'){
    c.save();c.font=weight+' '+size+'px '+font;c.fillStyle=col;c.textAlign=align;c.textBaseline='alphabetic';c.fillText(t,x,y);c.restore();
  }
  function grad(c,x1,y1,x2,y2,stops){
    const g=c.createLinearGradient(x1,y1,x2,y2);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;
  }
  function makeGrain(){
    const tile=document.createElement('canvas');tile.width=tile.height=152;
    const k=tile.getContext('2d'), img=k.createImageData(152,152);
    for(let i=0;i<img.data.length;i+=4){
      const n=rand();const light=n>.48;
      img.data[i]=light?255:18;img.data[i+1]=light?247:28;img.data[i+2]=light?205:22;
      img.data[i+3]=Math.floor(3+Math.abs(n-.48)*65);
    }
    k.putImageData(img,0,0);return tile;
  }
  function paperSlip(c){
    c.save();c.translate(554,53);c.rotate(.132);
    path(c,'M-58 -35 L94 -37 L97 39 L-58 41 Z','#1a342c70');
    path(c,'M-65 -40 L88 -40 L89 33 L81 34 L76 32 L69 35 L63 33 L57 34 L48 33 L43 36 L33 33 L29 35 L21 34 L15 36 L9 34 L3 35 L-5 33 L-11 35 L-18 34 L-24 35 L-31 34 L-39 35 L-47 33 L-53 35 L-62 33 Z','#e4d5ac');
    c.save();c.globalAlpha=.5;
    for(let x=-56;x<86;x+=12)line(c,x,-39,x,32,'#9aada0',.65);
    for(let y=-32;y<33;y+=12)line(c,-64,y,88,y,'#9aada0',.65);
    c.restore();line(c,-47,-39,-47,32,'#be795c',1.1);
    text(c,'给 宝',-37,-13,14,'#455147',serif,650);
    c.save();c.rotate(-.035);text(c,'826 731',-39,15,24,'#38453a','Georgia,'+serif,700);c.restore();
    path(c,'M-37 20 Q-6 17 49 19',null,'#9b5844',1.4);
    path(c,'M36 -46 l32 -3 2 13-32 4z','rgba(217,177,97,.55)');c.restore();
  }
  function pencil(c,x=90,y=78,angle=-.19,size=1,atTip=false) {
    c.save();c.translate(x,y);c.rotate(angle);c.scale(size,size);
    if(atTip)c.translate(-209,-3);
    c.lineJoin='round';
    path(c,'M-24 7 L196 8 L218 13 L196 18 L-24 18 Z','#1c37303f');
    path(c,'M-18 -2 L184 -2 L209 3 L184 8 L-18 8 Z','#9a552f');
    rect(c,-17,-2,201,4,'#f1be62');rect(c,-17,2,201,3,'#daa050');rect(c,-17,5,201,3,'#aa6a39');
    path(c,'M183 -2 L209 3 L183 8 L187 5 L184 3 L187 1 Z','#dbaf7e');
    path(c,'M202 1.7 L210 3 L202 4.6 Z','#3a3c31');
    rect(c,-23,-2,10,10,'#a1a393');rect(c,-21,-2,1.5,10,'#d2c9ad');rect(c,-16,-2,1.3,10,'#626e60');box(c,-31,-2,9,10,2,'#b97864');
    c.restore();
  }
  function background(c){
    rng=1937;
    rect(c,0,0,w,h,grad(c,0,0,630,520,[[0,'#819584'],[.36,'#5c7b6b'],[1,'#31564f']]));
    path(c,'M-20 -5 H446 L26 444 H-20 Z','#a7ad89');
    path(c,'M350 -8 H417 L-26 437 V364 Z','#bdbe98');
    path(c,'M-35 110 L94 -12 L120 -12 L-35 139 Z M-35 273 L254 -15 L267 -15 L-35 284 Z','#728a73');
    path(c,'M45 -10 H187 L0 175 V49 Z','#c9c39a');
    path(c,'M-22 193 L198 -11 L209 -11 L-22 207 Z','#536f5d');
    path(c,'M-11 20 L58 -5 H80 L-11 75 Z','#4e6e5d40');
    path(c,'M700 167 L700 444 L423 444 Z','#244d4730');
    for(let i=0;i<290;i++){
      const x=rand()*w,y=rand()*h,len=4+rand()*75;
      path(c,'M'+x+' '+y+'q'+len*.48+' '+(-1-rand()*2)+' '+len+' '+(-len*.055),null,i%3?'#284d3f18':'#fff1b421',.4+rand()*.8);
    }
    for(let i=0;i<115;i++){const x=rand()*w,y=rand()*h;rect(c,x,y,.6+rand()*1.6,.6+rand(),i%2?'#eee5b652':'#344b3d48');}
    // The small contact slip sits under the far edge of the handset's shadow.
    paperSlip(c);
    c.save();c.fillStyle=c.createPattern(grain,'repeat');c.globalAlpha=.84;c.fillRect(0,0,w,h);c.restore();
  }
  function screw(c,x,y,r,angle,col='#6d7665'){
    oval(c,x,y+.8,r,r,'#415046');oval(c,x,y-.3,r-.4,r-.4,col,'#d6d0ae',.55);
    c.save();c.translate(x,y);c.rotate(angle);line(c,-r*.57,0,r*.57,0,'#36443a',Math.max(.8,r*.32));c.restore();
  }
  function hub(c,x,y,angle,amount){
    oval(c,x,y,28.5,26.5,'#212e29');
    oval(c,x,y,amount,amount*.95,'#6e513a','#8c6647',.85);
    for(let j=0;j<3;j++)oval(c,x,y,amount-1-j*1.65,(amount-1-j*1.65)*.95,null,j%2?'#604735':'#8e7051',.6);
    oval(c,x,y,17.4,17.4,'#bbb59a','#292f2a',2.1);
    oval(c,x,y,14.3,14.3,'#e6dbc1');
    c.save();c.translate(x,y);c.rotate(angle);
    for(let i=0;i<6;i++){
      c.rotate(Math.PI/3);
      path(c,'M-3.1 -13.7 Q0 -14.8 3.1 -13.7 L2.1 -9.2 L-2.1 -9.2z','#5b6558');
    }
    oval(c,0,0,7.7,7.7,'#283c35');oval(c,0,0,3.1,3.1,'#637567');c.restore();
  }
  // Eight graphite strokes. The pencil follows the very line it leaves behind.
  const strokes=[
    [[8.6,0],[10.1,2.4]],
    [[2.7,3.5],[2.1,5.6],[1.6,7.8]],
    [[3.1,4.8],[10.1,4.2],[17.9,4.3],[16.3,7.2]],
    [[4.7,9.1],[9.9,8.9],[15.1,8.5]],
    [[5.5,13.2],[10.2,12.9],[14.7,12.4]],
    [[10.1,8.9],[10.2,13.2],[10.0,18.3]],
    [[3.5,18.8],[9.9,18.3],[16.8,17.9]],
    [[13.9,14.6],[16,16.1]]
  ];
  function vertex(row,t){
    const n=Math.min(row.length-1, Math.max(0,t)*(row.length-1));
    const i=Math.min(row.length-2,Math.floor(n)),mix=n-i;
    return [row[i][0]+(row[i+1][0]-row[i][0])*mix,row[i][1]+(row[i+1][1]-row[i][1])*mix];
  }
  function writingTip(progress){
    const n=Math.max(0,Math.min(7.9999,progress*8)),idx=Math.floor(n),f=n-idx;
    if(idx>0&&f<.19){
      const last=strokes[idx-1],a=last[last.length-1],b=strokes[idx][0],v=f/.19;
      return [a[0]+(b[0]-a[0])*v,a[1]+(b[1]-a[1])*v-1.4*Math.sin(v*Math.PI)];
    }
    return vertex(strokes[idx],Math.max(0,(f-.19)/.81));
  }
  function writeName(c,progress){
    if(progress<=0)return;
    c.save();c.translate(75,13.2);c.rotate(-.075);c.lineCap='round';c.lineJoin='round';c.strokeStyle='#4c4c3b';c.lineWidth=1.55;
    strokes.forEach((row,i)=>{
      const f=Math.min(1,Math.max(0,(progress*8-i-.19)/.81));if(f<=0)return;
      const v=vertex(row,f);c.beginPath();c.moveTo(row[0][0],row[0][1]);
      for(let j=1;j<row.length-1&&j/(row.length-1)<=f;j++)c.lineTo(row[j][0],row[j][1]);
      c.lineTo(v[0],v[1]);c.stroke();
    });c.restore();
  }
  function cassette(c,side,rotation,ink,turn){
    const b=side==='B';
    c.save();
    if(turn>0&&turn<1) {
      const lift=Math.sin(Math.PI*turn);
      c.translate(124,69-31*lift);c.scale(1+.065*lift,Math.max(.038,Math.abs(Math.cos(turn*Math.PI))));c.translate(-124,-69);
    }
    box(c,2,4,244,137,7,'#512e29');
    box(c,0,0,244,137,7,grad(c,0,0,0,143,[[0,'#d77950'],[.55,'#c26443'],[1,'#ac503a']]),'#793e30',1.4);

const Sound = (() => {

    scheduled.forEach(src=>{try{src.stop();}catch(_){}});
    scheduled.clear();
  }
  function clearSequence(){disconnectSequence();planned=null;}
  function armSequence(){
    if(!planned||channel||hidden||!enabled||!ac||ac.state!=='running')return;
    const elapsed=planned.elapsed(),now=ac.currentTime;
    channel=ac.createGain();channel.connect(master);
    planned.hits.forEach((ms,i)=>{
      if(ms+45>=elapsed)knock(planned.kind,i,now+.006+Math.max(0,ms-elapsed)/1000,channel);

      const a=noise.getChannelData(0);let prev=0;

      bedGain=ac.createGain();bedGain.gain.value=0;

      ac.onstatechange=()=>{if(ac.state==='running')armSequence();else disconnectSequence();};
    }catch(_){ac=null;}
  }

  }

  function flip(target,next){
    flipTo=target;flipNext=next;
    if(mode==='rest')signed=true;
    enter('flip');Sound.key('flip');
  }
  function startA(){
    take=null;hits=[];side='A';signed=false;showPrevious=false;
    enter('sideA');Sound.key('start');
  }
  function fromPrevious(){
    if(!previous)return;
    take={duration:previous.duration,hits:previous.hits.slice()};signed=true;showPrevious=true;
    flip('B','playB');
  }
  function prepareNew(){take=null;signed=false;showPrevious=false;enter('ready');}
  function startRecording(quiet){
    hits=[];take=null;signed=false;showPrevious=false;quietStart=quiet;
    enter('record');Sound.key('start');
    if(!quiet){hits.push(0);strike('finger',0);}
    paint(true);
  }
  function tap(){
    if(mode==='ready'){startRecording(false);return;}
    if(mode!=='record')return;
    const t=age();if(t>=limit){finish();return;}
    if(hits.length>=256)return;
    hits.push(Math.round(t));strike('finger',hits.length-1);paint(true);
  }
  function finish(){
    if(mode!=='record')return;
    const duration=Math.round(Math.min(limit,Math.max(650,age(),hits.length?hits[hits.length-1]+135:0)));
    take={duration,hits:hits.slice()};previous={duration,hits:hits.slice()};
    write(key,JSON.stringify({v:1,duration,hits:take.hits}));
    enter('rewind');Sound.key('stop');
  }
  function playback(){side='B';enter('playB');Sound.key('start');}
  function finishLine(){
    const a=take.hits;
    if(!a.length)return ['它把这段安静也学会了。','陪你坐完这几秒，它才捡起铅笔，在 B 面歪歪地写了一个「宝」。'];
    if(a.length===1)return ['一下。它也只敲了一下。','那一声是从桌沿传过来的。它捡起铅笔，在 B 面歪歪地写了一个「宝」。'];
    const waited=a.some((v,i)=>i>0&&v-a[i-1]>=900);
    return [waited?'连中间那一小会儿，它也等了。':'最后那一遍，是它敲的。','两个白轮子早就停了。它捡起铅笔，在 B 面歪歪地写了一个「宝」。'];
  }
  function enter(name){
    Sound.clearSequence();mode=name;ageStart=performance.now();seq=0;drive('stop');
    switch(name){
      case 'idle':
        side='A';signed=false;
        say('听筒那头，多了一台录音机。','Clawd 把听筒夹在左钳里。红磁带上贴着纸签，A 面写的是它自己的名字。');
        control('拿起听筒','phone',startA,previous?'听上回留下的 B 面':'',previous?fromPrevious:null);
        describe('桌上一台装着红磁带的录音机。Clawd 用左钳夹着电话听筒。');break;
      case 'sideA':
        drive('play');Sound.sequence('tapeA',aHits,age);say('听，是你认得的声音。','两个白轮子转起来。Clawd 的右钳还搭在桌沿上。');
        control('正在放 A 面','ear',null);
        describe('A 面正在转。听筒里传来敲击声，Clawd 的右钳没有动。');break;
      case 'afterA':
        say('「'+aMeaning+'」','刚才那'+words[aCount]+'下，是磁带替它敲的。它按停机器，用钳尖把红磁带挑起来一点。');
        control('翻到 B 面','flip',()=>flip('B','ready'),'再听一次 A 面',startA);
        describe('两只带轮停住了，红磁带等着翻面。');break;
      case 'flip':
        say(flipTo==='B'?'红磁带翻了个身。':'它把红磁带翻回正面。',flipTo==='B'?(showPrevious?'那张写着「宝」的纸签，又朝上了。':'纸签也翻了过去。'):'写着 Clawd 的纸签朝上了。');
        control('翻面中','flip',null);describe('磁带在带仓上方转过半圈。');break;
      case 'ready':
        side='B';signed=false;showPrevious=false;
        say('B 面还空着。','轻敲听筒就会开录，最多八秒。你敲几下、在中间停多久，都能留下来。');
        control('敲一下听筒','tap',tap,'录一小段安静',()=>startRecording(true));
        describe('B 面纸签空着。可以敲听筒，也可以让磁带录一段安静。');break;
      case 'record':
        drive('record');
        say(quietStart?'白轮子悄悄地转。':'红键按下去了。',quietStart?'它跟你一起听着。想敲的时候，听筒还在手边。':'你的指尖一落，听筒里就笃地响一声。敲够了，随时可以收带。');
        control('敲一下听筒','tap',tap,'录好了',finish);
        describe('红灯亮着，白轮子在转。敲击会在带尺上留下印记。');break;
      case 'rewind':
        drive('rewind');say('它按住了倒带键。','白轮子沿着刚才走过的那一截，飞快地转回去。');
        control('正在倒带','flip',null);describe('磁带正在倒回开头。');break;
      case 'sealed':
        say('带头到了。',take.hits.length?'你刚才敲的那几下都在里面了。它把听筒往录音机旁边挪了一点。':'那几秒安安静静地卷在里面。它把听筒往录音机旁边挪了一点。');
        control('放给它听','play',playback,'重新录一段',prepareNew);describe('B 面已经倒好。放音键就在指尖下。');break;
      case 'playB':
        drive('play');Sound.sequence('tapeB',take.hits,age);say('它凑过去听。',take.hits.length?'你的声音从录音机的小喇叭里出来了。它的两只眼睛盯着转动的白轮子。':'小喇叭里有磁带轻轻的沙沙声。它把听筒夹稳了些。');
        control('正在放 B 面','ear',null);describe('B 面正在转动。磁带回放原来的节奏，Clawd 在听。');break;
      case 'gap':
        say('嗒。放音键弹起来了。','两个白轮子都停住。Clawd 把右钳从桌沿上抬起来。');
        control('听筒还通着','ear',null);describe('放音键弹起，带轮停转。');break;
      case 'echo':
        Sound.sequence('claw',take.hits,age);say(take.hits.length?'听筒里，又来了一遍。':'听筒里，静了一会儿。',take.hits.length?'红磁带安安稳稳地躺着。这回的声音，比刚才脆了一点。':'它把钳子搁在听筒旁边，陪你坐着。');
        control('听着它','ear',null);describe(take.hits.length?'带轮静止，Clawd 的右钳照着你的节奏敲桌沿。':'带轮静止，Clawd 安静地陪着你。');break;
      case 'sign':
        say(finishLine()[0],'它把短铅笔横在钳子里，爬上了带仓。纸签上还差一个名字。');
        control('听筒还通着','ear',null);describe('钳尖扶着铅笔，一笔一笔地在纸签上写字。');break;
      case 'rest':{
        const hadName=signed;signed=true;const ending=finishLine();
        say(ending[0],hadName?'纸签上那个歪歪的「宝」还在。它又把听筒往身边挪了一点。':ending[1]);
        control('再听一遍 B 面','play',playback,'翻回 A 面',()=>flip('A','sideA'));
        describe('B 面纸签上多了一个歪歪的「宝」。Clawd 还夹着听筒。');break;
      }
    }
    paint(true);if(started)wake();
  }
  function invoke(fn){
    if(!fn)return;Sound.unlock();fn();
  }
  main.addEventListener('click',()=>invoke(primaryAction));
  second.addEventListener('click',()=>invoke(secondAction));
  // The drawn handset is also a tap surface. Buttons provide the same keyboard actions.
  scene.addEventListener('click',e=>{
    const b=scene.getBoundingClientRect(),x=(e.clientX-b.left)*700/b.width,y=(e.clientY-b.top)*444/b.height;
    if(x>389&&x<684&&y>113&&y<335){
      if(mode==='idle')invoke(startA);else if(mode==='ready'||mode==='record')invoke(tap);
    }else if(mode==='afterA'&&x>34&&x<452&&y>94&&y<372)invoke(()=>flip('B','ready'));
  });
  el('sound').addEventListener('click',()=>{
    const on=Sound.toggle();
    el('sound').setAttribute('aria-pressed',String(on));
    el('sound').setAttribute('aria-label',on?'关闭声音':'打开声音');
    el('soundLabel').textContent=on?'声音开':'静音';
    use('soundIcon',on?'sound':'mute');
  });
  function process(t){
    if(mode==='sideA'||mode==='playB'||mode==='echo'){
      const sideA=mode==='sideA', echo=mode==='echo';
      const events=sideA?aHits:take.hits, duration=sideA?aDuration:take.duration;
      while(seq<events.length&&events[seq]<=t){strike(sideA?'tapeA':echo?'claw':'tapeB',seq);seq++;}
      if(t>=duration+(echo?320:0)){
        if(!echo)Sound.key('stop');
        enter(sideA?'afterA':echo?(signed?'rest':'sign'):'gap');
      }
    }else if(mode==='flip'&&t>=790){
      side=flipTo;
      if(flipNext==='sideA')startA();
      else if(flipNext==='playB')playback();
      else prepareNew();
    }else if(mode==='record'&&t>=limit)finish();
    else if(mode==='rewind'&&t>=820)enter('sealed');
    else if(mode==='gap'&&t>=1080)enter('echo');
    else if(mode==='sign'){
      while(seq<8&&t>=220+seq*262){Sound.graphite(seq);seq++;}
      if(t>=2570)enter('rest');
    }
  }
  function paint(force){
    const now=performance.now(),t=age(),active=motor!=='stop'||mode==='flip'||mode==='echo'||mode==='gap'||mode==='sign';
    const interval=active?32:now-Math.max(pawAt,nearAt,levelAt)<370?35:120;
    if(!force&&now-lastPaint<interval)return;
    lastPaint=now;
    const turning=mode==='flip'?Math.min(1,t/780):0;
    const shownSide=turning>.5?flipTo:side;
    const a=shownSide==='A',data=take||blankTake();
    const trackLength=a?aDuration:mode==='record'||mode==='ready'?limit:data.duration;
    let marks=a?aHits:mode==='record'?hits:data.hits;
    let head=null,ms=0;
    if(mode==='sideA'||mode==='playB'||mode==='record'){head=Math.min(t,trackLength);ms=head;}
    else if(mode==='rewind'){ms=Math.max(0,data.duration*(1-t/820));head=ms;}
    else if(mode==='afterA'||mode==='echo'||mode==='rest'||mode==='gap'||mode==='sign'){ms=trackLength;}
    if(mode==='sideA'||mode==='playB'||mode==='echo')marks=marks.slice(0,seq);
    const sincePaw=now-pawAt;
    const paw=mode==='echo'&&sincePaw>=0&&sincePaw<200?(sincePaw<95?1:.5):mode==='gap'&&t>540 ? .58:0;
    const nowLabel='0:'+String(Math.floor(ms/1000)).padStart(2,'0');
    if(nowLabel!==lastTimer){el('time').textContent=nowLabel;lastTimer=nowLabel;}
    if(lastFace!==shownSide){el('face').textContent=shownSide;lastFace=shownSide;}
    Drawing.draw({side:shownSide,drive:motor,rotation:Drawing.reduce.matches?Math.floor(rotation*3)/3:rotation,
      level:Math.max(0,.97-(now-levelAt)/340),near:Math.max(0,1-(now-nearAt)/210),paw,
      signed:(signed||mode==='sign')&&shownSide==='B',
      ink:mode==='sign'?Math.max(0,Math.min(1,(t-190)/2100)):signed?1:0,
      close:mode==='sign'?(Drawing.reduce.matches?1:Math.max(0,Math.min(1,t/145,(2570-t)/170))):0,
      turn:Drawing.reduce.matches?0:turning,blink:now+1700,
      echo:mode==='echo',marks,head,trackLength});
  }
  function wake(){
    if(idleTimer){clearTimeout(idleTimer);idleTimer=0;}
    if(!anim&&concealed===null)anim=requestAnimationFrame(tick);
  }
  function tick(now){
    anim=0;if(concealed!==null)return;
    const dt=Math.max(0,Math.min(75,now-lastFrame));lastFrame=now;
    rotation+=dt*(motor==='rewind'?-.012:motor==='record'||motor==='play' ? .0028:0);
    process(age());paint(false);
    if(anim)return;
    if(['idle','afterA','sealed','ready','rest'].includes(mode)){
      const blink=(now+1700)%5900;
      const nap=Drawing.reduce.matches?5900:blink<145?150-blink:5900-blink;
      idleTimer=setTimeout(()=>{idleTimer=0;wake();},Math.max(30,nap));
    }else wake();
  }
  function changeVisibility(isHidden){
    const now=performance.now();
    if(isHidden&&concealed===null){
      concealed=now;cancelAnimationFrame(anim);clearTimeout(idleTimer);idleTimer=0;anim=0;Sound.visibility(true);
    }else if(!isHidden&&concealed!==null){
      const lost=now-concealed;ageStart+=lost;levelAt+=lost;pawAt+=lost;nearAt+=lost;
      concealed=null;lastFrame=now;Sound.visibility(false);paint(true);
      if(!anim)anim=requestAnimationFrame(tick);
    }
  }
  document.addEventListener('visibilitychange',()=>changeVisibility(document.hidden));
  window.addEventListener('pagehide',()=>changeVisibility(true));
  window.addEventListener('pageshow',()=>changeVisibility(document.hidden));
  function resize(){Drawing.resize();paint(true);}
  window.addEventListener('resize',resize);
  if(window.ResizeObserver)new ResizeObserver(resize).observe(document.querySelector('.picture'));
  Drawing.resize();enter('idle');started=true;
  if(!document.hidden)anim=requestAnimationFrame(tick);else changeVisibility(true);
})();

</script>
</body>
</html>
