<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111e23">
<meta name="description" content="困困宝在书边缝了第二十五格。千年后，清醒宝在它的保证书上添了一行字。">
<title>借你一刻</title>
<style>
:root{color-scheme:dark;--ink:#111e23;--paper:#f3e6c8;--brass:#c5a678;--line:#456064}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--paper);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;background:radial-gradient(ellipse at 50% 29%,#254049 0%,#15272d 36%,#101d22 74%);background-attachment:fixed}
main{margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom));width:100%;max-width:580px}
.player{width:min(100%,calc((100vh - 117px) * .63492));margin:auto}
@supports(height:100svh){.player{width:min(100%,calc((100svh - 117px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .63492))}}
.stage{isolation:isolate;position:relative;aspect-ratio:40/63;background:#162f37;overflow:hidden;border-radius:3px;box-shadow:0 0 0 1px #64716c77,0 13px 42px #050e1080}
canvas{width:100%;height:100%;display:block}
button,summary,input{touch-action:manipulation;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #efc876;outline-offset:3px}
#enter{position:absolute;left:50%;bottom:5.9%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #d9c18f;background:#e8d6ad;color:#28383a;font:600 15px/1.1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.14em;border-radius:3px;padding:12px 19px;min-height:40px;box-shadow:0 2px 8px #09191b55}
#enter svg{width:12px;height:12px}
[hidden],#enter[hidden]{display:none}
.transport{display:flex;align-items:center;gap:4px;margin:7px auto 0;min-height:44px}
.icon{position:relative;display:grid;place-items:center;width:40px;height:44px;flex-shrink:0;background:transparent;border:0;padding:9px;color:#e5d6b9}
.icon svg{width:21px;height:21px;display:block}
#seek{--pos:0%;width:0;min-width:20px;flex:1;height:32px;cursor:pointer;appearance:none;-webkit-appearance:none;background:transparent;margin:0 6px 0 0}
#seek::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,#e4c495 var(--pos),#577072 var(--pos));border-radius:2px}
#seek::-webkit-slider-thumb{-webkit-appearance:none;background:#efdbad;border:1px solid #f2dfb9;border-radius:50%;width:12px;height:12px;margin-top:-4.5px}
#seek::-moz-range-track{height:3px;background:#577072}
#seek::-moz-range-progress{height:3px;background:#e4c495}
#seek::-moz-range-thumb{background:#efdbad;border:0;width:12px;height:12px;border-radius:50%}
.time{font:11.5px/1.2 ui-monospace,"SFMono-Regular","DejaVu Sans Mono",monospace;color:#e3d6bd;white-space:nowrap;font-variant-numeric:tabular-nums}
details{max-width:462px;margin:5px auto 0;border-top:1px solid #71848055}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;color:#ddd4be;font-size:14px;letter-spacing:.08em}
summary::-webkit-details-marker{display:none}
summary svg{width:17px;height:17px;transition:transform .2s}details[open] summary svg{transform:rotate(180deg)}
#cues{padding:0 0 12px}#cues button{display:grid;grid-template-columns:45px 1fr;gap:7px;border:0;border-top:1px solid #697f812d;background:transparent;text-align:left;width:100%;padding:12px 4px;font-size:15px;line-height:1.6}
#cues button[aria-current=true]{color:#f6d286;background:#20383d}#cues time{font:12px/2 ui-monospace,monospace;color:#c3b394}#cues small{display:block;font-size:11px;color:#c3b394}
.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media(max-height:480px) and (orientation:landscape){.player{min-width:192px}}
</style>
</head>
<body>
<main>
<h1 class="sr">借你一刻</h1>
<div class="player">
<div class="stage"><canvas id="screen" width="800" height="1260" role="img" aria-label="借你一刻。字符兔困困宝与字符猫清醒宝的月下故事。"></canvas>
<button id="enter" type="button" aria-label="开始放映借你一刻"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3 1.8 14 8 3 14.2Z"/></svg><span>开卷放映</span></button></div>
<div class="transport" aria-label="播放控制"><button class="icon" id="play" type="button" aria-label="播放"></button><input id="seek" type="range" min="0" max="205" step=".05" value="0" aria-label="影片进度"><span class="time" id="clock">0:00 / 3:25</span><button class="icon" id="volume" type="button" aria-label="静音"></button></div>
<div class="sr" id="spoken" aria-live="off"></div>
<details id="transcript"><summary>翻翻字幕本<svg aria-hidden="true" viewBox="0 0 20 20"><path d="m4 7 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></summary><div id="cues"></div></details>
</div>
</main>
<script>
'use strict';
(() => {
const W=400, H=630, ART=524, TOTAL=205;
const cv=document.getElementById('screen'), output=cv.getContext('2d',{alpha:false});
let c=output, ratio=2;
const TAU=2*Math.PI, sin=Math.sin, cos=Math.cos;
const SER='"Songti SC","Noto Serif CJK SC","STSong","PMingLiU",serif';
const SANS='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif';
const MONO='"Menlo","DejaVu Sans Mono","Courier New",monospace';
const ink='#273c3e', gold='#dcbd80';
const clamp=(n,lo=0,hi=1)=>Math.max(lo,Math.min(hi,n));
const mix=(a,b,v)=>a+(b-a)*v;
const ease=n=>(n=clamp(n),n*n*(3-2*n));
const between=(t,a,b)=>ease((t-a)/(b-a));
function rng(seed){let n=seed>>>0;return()=>{n=(Math.imul(1664525,n)+1013904223)>>>0;return n/4294967296;};}
function withState(fn){c.save();fn();c.restore();}
function place(x,y,s,fn,angle=0){withState(()=>{c.translate(x,y);c.rotate(angle);c.scale(s,s);fn();});}
function alpha(a,fn){if(a<=.001)return;withState(()=>{c.globalAlpha*=clamp(a);fn();});}
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function path(d,fill=null,stroke=null,w=1){const p=typeof d==='string'?new Path2D(d):d;if(fill){c.fillStyle=fill;c.fill(p);}if(stroke){c.strokeStyle=stroke;c.lineWidth=w;c.lineJoin='round';c.lineCap='round';c.stroke(p);}}
function line(x1,y1,x2,y2,col,w=1){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke();}
function ellipse(x,y,rx,ry,col,outline=null,lw=1,rot=0){if(rx<=0||ry<=0)return;c.beginPath();c.ellipse(x,y,rx,ry,rot,0,TAU);if(col){c.fillStyle=col;c.fill();}if(outline){c.strokeStyle=outline;c.lineWidth=lw;c.stroke();}}
function type(str,x,y,size,color,font=SER,align='center',weight=400){c.font=weight+' '+size+'px '+font;c.textAlign=align;c.textBaseline='alphabetic';c.fillStyle=color;c.fillText(str,x,y);}
function grad(x1,y1,x2,y2,stops){const g=c.createLinearGradient(x1,y1,x2,y2);stops.forEach(([at,col])=>g.addColorStop(at,col));return g;}
function glow(x,y,r,inner,outer){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,inner);g.addColorStop(1,outer);rect(x-r,y-r,2*r,2*r,g);}
function pointsPath(points){const p=new Path2D();points.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));return p;}
function tint(a,b,v){const m=k=>Math.round(mix(parseInt(a.substring(k,k+2),16),parseInt(b.substring(k,k+2),16),clamp(v)));return 'rgb('+[1,3,5].map(m).join(',')+')';}
const cache=new Map(), tiles=new Map();
function surface(id,fn,w=W,h=ART){
 if(!cache.has(id)){const buf=document.createElement('canvas'),r=Math.min(2.25,Math.max(1,ratio));buf.width=Math.ceil(w*r);buf.height=Math.ceil(h*r);const prior=c;c=buf.getContext('2d');c.scale(buf.width/w,buf.height/h);try{fn();}finally{c=prior;}cache.set(id,buf);}
 return cache.get(id);
}
function layer(id,fn,w=W,h=ART){c.drawImage(surface(id,fn,w,h),0,0,w,h);}
function grain(seed=51,light=false){
 const key=seed+'-'+light;
 if(!tiles.has(key)){const el=document.createElement('canvas');el.width=el.height=160;const q=el.getContext('2d'),im=q.createImageData(160,160),rand=rng(seed);
 for(let i=0;i<im.data.length;i+=4){const n=rand(),val=n<.49?(light?66:3):(light?255:236);im.data[i]=val;im.data[i+1]=val;im.data[i+2]=light?Math.max(0,val-10):val;im.data[i+3]=Math.floor(rand()*(light?23:21));}q.putImageData(im,0,0);tiles.set(key,el);}
 c.fillStyle=c.createPattern(tiles.get(key),'repeat');c.fillRect(0,0,W,H);
}
const STAR=(()=>{const r=rng(86);return Array.from({length:102},()=>({x:r()*430-15,y:r()*500,r:.26+r()*.83,k:r()*6}));})();
function stars(h,amt=1){alpha(amt,()=>{for(const s of STAR){if(s.y<h){ellipse(s.x,s.y,s.r,s.r,'#dfd7b5');if(s.r>1){line(s.x-2.2,s.y,s.x+2.2,s.y,'#cfbc9088',.5);line(s.x,s.y-2.4,s.x,s.y+2.4,'#cfbc9088',.5);}}}});}

/* 印版：月面的套色、山上的刻线与桂枝都在画布里制成。 */
function makeMoon(){
 const size=256,mid=128,r=116,R=rng(209);
 c.save();c.beginPath();c.arc(mid,mid,r,0,TAU);c.clip();
 rect(0,0,size,size,grad(44,13,220,244,[[0,'#fbebbc'],[.52,'#e5c488'],[1,'#bd9461']]));
 const seas=[
 'M16 130 Q39 88 69 109 T117 112 Q151 81 153 57 Q183 35 208 53 Q199 84 174 98 Q148 122 147 150 Q149 173 117 173 Q97 155 70 166 Q37 176 16 151Z',
 'M139 11 Q173 24 185 42 Q175 57 163 45 Q140 46 134 61 Q115 56 125 42 Q143 31 139 11Z',
 'M196 118 Q235 95 249 101 L253 167 Q222 173 209 191 Q198 205 167 205 Q162 178 177 157Z',
 'M27 154 Q60 173 78 169 Q102 165 112 185 Q99 199 85 196 Q61 208 47 193Z'];
 seas.forEach((d,i)=>path(d,['#cfa973','#d9b57e','#c49f6d','#d0ae7a'][i]));
 for(let i=0;i<270;i++){const x=R()*254,y=R()*251,w=2+R()*24,a=.1+R()*.2;path('M'+x+' '+y+'q'+(w*.54)+' '+(-1-R()*4)+' '+w+' '+(-2-R()*4.5),null,'rgba(122,90,51,'+a+')',.38+R()*.5);}
 for(let i=0;i<82;i++){const x=R()*245,y=R()*245,rr=.8+Math.pow(R(),2.1)*7;ellipse(x,y,rr,rr*(.4+R()*.45),null,'#9b7b513f',.62,-.32);if(rr>4.7)path('M'+(x-rr)+' '+y+'q'+rr+' '+(-rr*.65)+' '+(rr*1.62)+' '+(-rr*.18),null,'#fff0c67a',.8);}
 const holes=[[89,87,20],[162,79,9],[185,179,13],[100,201,7],[54,171,6],[214,114,17],[134,156,7]];
 holes.forEach(([x,y,rr])=>{ellipse(x,y,rr,rr*.72,'#af8e5e23','#ad875c68',.9,-.35);ellipse(x-1,y+1,rr*.77,rr*.43,null,'#f6dca377',.8,-.34);});
 for(let i=0;i<2600;i++){const x=R()*255,y=R()*255;rect(x,y,.35+R()*.8,.3+R()*.9,i%4?'#76563724':'#fff6d13a');}
 c.restore();ellipse(mid,mid,r,r,null,'#f2d7a3',1.37);
}
function moon(x,y,r,halo=true){if(halo){glow(x,y,r*1.33,'#e6c78613','#e6c78600');ellipse(x,y,r*1.065,r*1.065,null,'#dfc49140',.65);ellipse(x,y,r*1.099,r*1.099,null,'#dfc49120',.5);}const im=surface('moon',makeMoon,256,256);c.drawImage(im,x-r*128/116,y-r*128/116,r*256/116,r*256/116);}
function hill(y,am,col,edge,seed,rows=12,offset=0,bottom=540){
 const R=rng(seed),p1=R()*5,p2=R()*4,knots=[];for(let i=0;i<13;i++)knots.push(R());
 function shape(x){const k=(x+90)/46,ix=clamp(Math.floor(k),0,11),f=ease(k-Math.floor(k));return (sin(x/69+p1)*.29+sin(x/32+p2)*.10+(mix(knots[ix],knots[ix+1],f)-.48)*.78)*am;}
 const pts=[];for(let x=-5;x<=408;x+=4)pts.push([x,y+shape(x+offset)]);const body=pointsPath(pts);body.lineTo(410,bottom);body.lineTo(-5,bottom);body.closePath();path(body,col);path(pointsPath(pts),null,edge,1.1);
 withState(()=>{c.clip(body);for(let j=0;j<rows;j++){const pp=[];for(let x=-6;x<=410;x+=5){pp.push([x,y+shape(x+offset+j*1.2)*(1-.01*j)+4+j*4.6+sin(x*.036+j*.39)*(2+j*.24)]);}path(pointsPath(pp),null,edge,j%4===0?.66:.4);}
 for(let i=0;i<200;i++){const x=R()*408,y1=y+shape(x+offset)+R()*55;line(x,y1,x+2+R()*8,y1-1.3-R()*3,edge,.35);}});
}
function cloud(x,y,s,col){
 place(x,y,s,()=>{for(let k=0;k<3;k++){const j=k*4;path('M-76 '+(6+j)+' C-52 '+(8+j)+' -39 '+(5+j)+' -27 '+(-3+j)+' C-18 '+(-11+j)+' -2 '+(-10+j)+' 7 '+(-3+j)+' C16 '+(3+j)+' 28 '+(3+j)+' 44 '+(-1+j)+' C57 '+(-5+j)+' 69 '+(-3+j)+' 78 '+(1+j),null,col,k===0?1.1:.62);}});}
function roof(x,y,s,far=false){
 place(x,y,s,()=>{const dark=far?'#314c51':'#203d43',light=far?'#79928a':'#b69b71';
 path('M-57 -4 Q-42 -2 -23 -18 Q-10 -28 -4 -36 Q-3 -39 0 -42 Q2 -38 4 -36 Q21 -13 43 -7 Q56 -1 62 -6 L55 2 Q35 9 0 7 Q-41 9 -56 3Z',dark,light,1.3);
 for(let i=-6;i<=6;i++){const end=i*8.8,st=i*1.1;path('M'+st+' -31 Q'+(end*.4)+' -12 '+end+' 1',null,light,.65);}
 path('M-51 4 Q0 13 55 2M-45 9H47',null,light,.83);
 rect(-40,10,3,40,light);rect(-24,11,2.2,39,light);rect(23,11,2.2,39,light);rect(40,9,3,40,light);
 for(let i=-34;i<43;i+=8){rect(i,37,1.6,13,light);}rect(-47,36,95,2,light);rect(-48,49,98,3,dark);line(-48,51,49,51,light,1);
 path('M-5 -37Q-11 -44 -8 -46 M4 -37Q11 -44 9 -46',null,light,.95);});
}
function flower(x,y,s,col='#efd29c',seed=0,petals=4){
 place(x,y,s,()=>{c.rotate(seed);for(let i=0;i<petals;i++){c.rotate(TAU/petals);path('M0 -.3 C-2 -1 -3 -3 -2.1 -4.8 Q-.7 -6.2 0 -4.8 Q1.3 -6.1 2.4 -4.6 Q3.1 -2.4 0 -.3Z',col);}ellipse(0,0,1.1,1.1,'#ad7954');});
}
const twigs=[
 [0,0,-33,-7,-58,-33,-97,-33,-164,-49],[-49,-19,-45,-47,-65,-64,-87,-69,-102,-83],
 [-80,-32,-100,-23,-125,-16,-151,-23,-177,-21],[-99,-33,-111,-51,-136,-58,-162,-80,-180,-79],
 [-30,-11,-41,8,-52,14,-79,21,-99,36],[-68,-60,-67,-82,-78,-95,-83,-103,-89,-115],
 [-122,-54,-126,-76,-135,-78,-139,-88,-149,-93],[-126,-20,-149,-13,-154,-6,-167,-2,-174,1],
 [-58,15,-64,31,-72,33,-81,46,-93,50]];
function branch(x,y,s,angle=0,bloom=1,palette='gold'){
 const col=palette==='spring'?'#d6ac9a':palette==='light'?'#806e51':'#c6a675',fl=palette==='spring'?'#f0b6b0':palette==='light'?'#e6a893':'#e8cca1';
 place(x,y,s,()=>{const r=rng(177);twigs.forEach((a,i)=>{const p='M'+a[0]+' '+a[1]+' Q'+a[2]+' '+a[3]+' '+a[4]+' '+a[5]+' T'+a[8]+' '+a[9];path(p,null,col,i===0?3.7:i<5?1.95:1.15);if(i===0)path('M0 -1.4Q-35 -9 -57 -33T-163 -49',null,fl,.55);
 for(let j=1;j<=5;j++){const f=j/5,ax=mix(a[0],a[8],f),ay=mix(a[1],a[9],f)+sin(f*Math.PI)*(i%2?3:-3),side=(j+i)%2?1:-1,ex=ax-5-r()*7,ey=ay+side*(3+r()*7);path('M'+ax+' '+ay+'Q'+(ax-4)+' '+ey+' '+ex+' '+ey,null,col,.8);const size=.3+r()*.54;
 if((j+i)%3!==0){place(ex+2,ey-1,1,()=>{c.rotate(side*.6);path('M0 0Q-4 -4 -10 -2Q-5 2 0 0Z',col);});}if(bloom>.018&&((j+i)%2===0||j===5)){flower(ex,ey,size*bloom,fl,r()*4,palette==='spring'?5:4);if(bloom>.65&&j%3===0)flower(ex-4,ey-2,.39*bloom,fl,0,palette==='spring'?5:4);}}});},angle);
}
function starscape(){rect(0,0,W,ART,grad(0,0,100,510,[[0,'#102b36'],[.54,'#30545b'],[1,'#839188']]));stars(335,.8);}
function chamber(){
 rect(0,0,W,ART,grad(0,0,390,500,[[0,'#263c40'],[.65,'#58635a'],[1,'#967358']]));
 for(let i=0;i<12;i++){line(12+i*37,0,12+i*37,281,'#d9c09022',.7);}
 const ox=248,oy=113,ww=108;
 withState(()=>{c.beginPath();c.arc(ox,oy,ww,0,TAU);c.clip();rect(0,0,W,265,grad(0,0,0,240,[[0,'#1c404c'],[1,'#a5aa8c']]));stars(140,.65);moon(275,75,34);hill(152,52,'#668082','#aec0a076',10,7,0,241);roof(303,144,.60,true);hill(200,42,'#3b6063','#8d9e8f99',30,5,0,260);branch(365,101,.51,-.32,.72);});
 for(const [r,col,w] of [[110,'#b29870',3],[114,'#243d42',5],[119,'#bc9d702e',1]])ellipse(ox,oy,r,r,null,col,w);
 for(let j=0;j<2;j++){const x=11+j*22;rect(x,0,3,242,'#152e32');for(let i=0;i<5;i++)rect(x,11+i*40,23,2,'#b49b753f');}
 path('M0 247 Q124 234 251 242 L400 231V524H0Z',grad(0,230,0,524,[[0,'#b09068'],[.18,'#b59a75'],[1,'#927557']]));line(0,250,400,235,'#d9b789',2.2);wood(250,526,false);grain(91);
}
function wood(y0,y1,dark){
 const R=rng(73),col=dark?'#b3926b35':'#694c3a32';for(let i=0;i<89;i++){const x=R()*460-49,y=mix(y0,y1,R()),l=15+R()*115;path('M'+x+' '+y+'q'+(l*.38)+' '+(-3+R()*7)+' '+l+' '+(-2+R()*3),null,col,.4+R()*.65);}
}
function wideBook(){
 const L='M-174 -58 Q-104 -84 -4 -62 L-2 63 Q-91 44 -176 67Z',R='M-4 -62 Q78 -83 169 -53 L173 68 Q86 46 -2 63Z';
 path('M-181 -52Q-93 -79 -5 -57Q92 -81 175 -49L180 76Q91 54 -2 73Q-93 55 -183 77Z','#374f50','#be9864',2);
 for(let i=4;i>0;i--){withState(()=>{c.translate(0,i*1.3);path(L,'#cfb58a','#967956',.75);path(R,'#cfb58a','#967956',.75);});}
 path(L,grad(-176,0,-2,0,[[0,'#dfc69c'],[.64,'#f4e1b7'],[1,'#c4a87b']]),'#b19468',1.05);path(R,grad(-2,0,173,0,[[0,'#c8a97c'],[.11,'#e9d3a9'],[.78,'#f5e4bf'],[1,'#dac19a']]),'#b19468',1.05);
 for(let k=0;k<6;k++){const y=-39+15*k;path('M-163 '+(y+1)+'Q-96 '+(y-19)+' -13 '+(y-2),null,'#a08c6848',.76);path('M8 '+(y-2)+'Q90 '+(y-17)+' 159 '+(y+1),null,'#a08c6848',.76);}
 path('M-4 -62Q-11 3 -2 64',null,'#795e44a8',1);path('M0 60Q15 76 2 99L-7 95L-12 97Q1 78 -6 64Z','#ad5142');
}

 if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();seek(current()+(e.key==='ArrowRight'?5:-5));}});
cues.forEach(([start,end,speaker,words])=>{const btn=document.createElement('button'),time=document.createElement('time'),body=document.createElement('span');btn.type='button';time.textContent=fmt(start);body.textContent=words;
 if(speaker){const who=document.createElement('small');who.textContent=speaker;body.prepend(who);}btn.append(time,body);
 btn.addEventListener('click',()=>{seek(start+.3);begin();document.querySelector('.stage').scrollIntoView({block:'start',behavior:'auto'});});cueList.append(btn);});
window.FILM={W,H,TOTAL,canvas:cv,events,synth,setup:manualSize,render:draw};
fit();controls(true);
if('ResizeObserver'in window)new ResizeObserver(fit).observe(cv);
else window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
