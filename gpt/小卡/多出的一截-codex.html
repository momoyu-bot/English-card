<script>
(()=>{'use strict';
const media={score:'多出的一截-codex/score.m4a',valley:'多出的一截-codex/valley.webp',soft:'多出的一截-codex/soft.webp',blush:'多出的一截-codex/blush.webp',paper:'多出的一截-codex/paper.webp',linen:'多出的一截-codex/linen.webp'};
function mediaURL(name,mime){
  return media[name];
}
const embedded={};for(const name of ['valley','soft','blush','paper','linen'])embedded[name]=mediaURL(name,'image/webp');
document.getElementById('track').src=mediaURL('score','audio/mp4');
const scoreBytes=fetch(mediaURL('score','audio/mp4')).then(r=>{if(!r.ok)throw Error(r.status);return r.arrayBuffer()}).then(buf=>{const el=document.getElementById('track');if(el.paused&&!el.currentTime)el.src=URL.createObjectURL(new Blob([buf],{type:'audio/mp4'}));return buf});
const W=384,H=640,TOTAL=86,TAU=Math.PI*2;
const cv=document.getElementById('frame');
let g=cv.getContext('2d',{alpha:false}), scale=1;
const paint={}, photos={}, spriteCache=new Map();
const serif='"Songti SC","STSong","Noto Serif CJK SC",serif';
const sans='"PingFang SC","Noto Sans CJK SC",sans-serif';
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
const blend=(a,b,u)=>a+(b-a)*u;
const ease=(a,b,t)=>{const u=clamp((t-a)/(b-a));return u*u*(3-2*u)};
function save(fn){g.save();fn();g.restore()}
function place(x,y,s,a,fn){save(()=>{g.translate(x,y);g.rotate(a||0);g.scale(s,s);fn()})}
function path(points,close=false){g.beginPath();g.moveTo(points[0][0],points[0][1]);for(const p of points.slice(1))g.lineTo(p[0],p[1]);if(close)g.closePath()}
function polygon(points,fill){path(points,true);g.fillStyle=fill;g.fill()}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function oval(x,y,rx,ry,color,angle=0){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,angle,0,TAU);g.fill()}
function stroke(active,col,width=1){g.strokeStyle=col;g.lineWidth=width;g.lineJoin='round';g.lineCap='round';g.stroke(active)}
function line(points,col,width=1){path(points);g.strokeStyle=col;g.lineWidth=width;g.lineJoin='round';g.lineCap='round';g.stroke()}
function curve(data,col,width=1){stroke(new Path2D(data),col,width)}
function shape(data,col){g.fillStyle=col;g.fill(new Path2D(data))}
function grad(x0,y0,x1,y1,stops){const z=g.createLinearGradient(x0,y0,x1,y1);for(const [at,col] of stops)z.addColorStop(at,col);return z}
function textAt(str,x,y,size,color,align='left',family=serif){g.font='500 '+size+'px '+family;g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(str,x,y)}
function seed(v){let x=v|0;return ()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296}}
function shade(x,y,rx,ry,a=.17){for(let i=3;i>0;i--)oval(x,y,rx*(.46+i*.18),ry*(.52+i*.16),'rgba(57,50,39,'+(a/(i+1))+')')}
function textile(name,x,y,w,h){g.drawImage(paint[name],x,y,w,h)}
function landscape(x,y,w,h,dx=0,dy=0,dw=W,dh=H,material='valley',blush=0){
  function layer(im){const kx=im.width/952,ky=im.height/720;g.drawImage(im,x*kx,y*ky,w*kx,h*ky,dx,dy,dw,dh)}
  layer(paint[material]);if(blush>0)save(()=>{g.globalAlpha*=blush;layer(paint.blush)})
}
function redCord(data,width=2.7){const p=new Path2D(data);stroke(p,'#77452f',width+1.1);stroke(p,'#b74932',width);save(()=>{g.setLineDash([width*.7,width*2]);stroke(p,'#df8b62',width*.34)})}
const cards={
  fox:['.D..........D.......','.DM........MD.......','.MCM......MCM...CC..','.MMMMMMMMMMMM..CCCC.','.MMEEMMMMEEMM..MMMM.','.MMEEMMMMEEMM..MMMMM','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'],
  cat:['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','.....X.MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................']};
const palette={fox:{M:'#E2552B',C:'#FFF3E3',D:'#3B2520',E:'#3B2520'},cat:{M:'#F3E7D6',X:'#4E382E',E:'#79C0F0'}};
function critterTile(id,eye,tail){
  const key=[id,eye,tail].join('-');if(spriteCache.has(key))return spriteCache.get(key);
  const tile=document.createElement('canvas');tile.width=22;tile.height=14;const c=tile.getContext('2d');
  const grid=cards[id].map(r=>r.split(''));const pal=palette[id];
  if(id==='fox'&&tail===1){
    grid[2]='.MCM......MCM.CC....'.split('');grid[3]='.MMMMMMMMMMMM.CCCC..'.split('');
  }
  if(id==='cat'&&tail===1){
    grid[6][5]='.';grid[6][4]='X';
    grid[5][4]='X';
  }
  if(id==='cat'&&tail===2){
    const raised=['....................','........X........X..','.....X.XXX......XXX.','....X...MMMMMMMMMM..','....X..MMMMMMMMMMMM.','....X..MEEMMMMMMEEM.','....X..MEEMXXXXMEEM.','.....X.MMMMMXXMMMMM.','......X.MMMMMMMMMM..','.......XMMMMMMMMMM..','........XMMMMMMMM...','.........XXM..MXX...','....................'];
    for(let i=0;i<grid.length;i++)grid[i]=raised[i].split('');
  }
  for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++){const a=grid[y][x];if(pal[a]){c.fillStyle=pal[a];c.fillRect(x,y,1,1)}}
  if(eye!=='open'){
    const ey=id==='fox'?4:5;for(const ex of id==='fox'?[3,9]:[8,16]){
      c.fillStyle=pal.M;c.fillRect(ex,ey,2,2);c.fillStyle=id==='fox'?pal.D:pal.X;
      if(eye==='blink'){c.fillRect(ex,ey+1,2,1)}
      if(eye==='look'){c.fillStyle=pal.E;c.fillRect(ex+(id==='fox'?1:-1),ey,2,2)}
      if(eye==='soft'){c.fillRect(ex,ey,2,1);c.fillRect(ex-1,ey+1,1,1);c.fillRect(ex+2,ey+1,1,1)}
    }
  }
  spriteCache.set(key,tile);return tile;
}
function critter(id,x,feet,p,t,op={}){
  const blink=(t+.73*(id==='fox'?1:2))%5.63<.14;
  const state=blink?'blink':op.eye||'open';
  const tail=op.tail!==undefined?op.tail:((t+(id==='fox'?.3:1.22))%4.3<.29?1:0);
  if(op.shade!==false)shade(x,feet+1,p*7,p*1.23,.19);
  save(()=>{g.translate(x,feet+(op.bob||0));g.rotate(op.tilt||0);g.scale(op.flip?-1:1,1);g.imageSmoothingEnabled=false;
    const tile=critterTile(id,state,tail);g.drawImage(tile,-p*10,-p*12,p*22,p*14);});
}
const orbColors={pink:'#ff309b',violet:'#9159fe',black:'#000000'};
function orbTile(id,blink){
  const key=id+(blink?'~':'');if(spriteCache.has(key))return spriteCache.get(key);
  const el=document.createElement('canvas');el.width=el.height=172;const c=el.getContext('2d');c.translate(86,86);c.scale(82,82);
  c.fillStyle=orbColors[id];c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.globalCompositeOperation='destination-out';
  for(const [cx,cy,width] of [[.194,-.416,.194],[.626,-.497,.129]]){
    c.save();c.translate(cx,cy);c.rotate(-.458);c.lineWidth=width;c.lineCap='round';c.beginPath();
    const straight=blink?.024:(.418-width);c.moveTo(0,-straight/2);c.lineTo(0,straight/2);c.stroke();c.restore();
  }
  spriteCache.set(key,el);return el;
}
function orb(id,x,feet,r,t,tilt=0,shadow=true){
  if(shadow)shade(x,feet+1,r*.86,r*.16,.19);
  const blink=(t+(id==='pink'?.5:id==='black'?2.2:3.8))%5.7<.13;
  place(x,feet-r,1,tilt,()=>g.drawImage(orbTile(id,blink),-r*1.049,-r*1.049,r*2.098,r*2.098));
}
function clawd(x,feet,s,t,op={}){
  if(op.shade!==false)shade(x,feet+1,91*s,13*s,.19);
  place(x,feet,s,op.tilt||0,()=>{
    const col='#d47f59';rect(-73.5,-119,147,98,col);
    rect(-97.5,-70+(op.left||0),24.2,21,col);rect(73.3,-70+(op.right||0),25,21,col);
    for(const lx of [-73.5,-49.5,34.5,58.5])rect(lx,-21,15,21,col);
    const blink=(t+.45)%5.98<.15;for(const ex of [-47.5,40.5])rect(ex,blink?-77:-91,8,blink?7:21,'#302725');
  })
}
function maple(x,y,s,a,color='#bb5839'){
  place(x,y,s,a,()=>{shape('M0 8 L-1 2 -7 3 -5 0 -11 -3 -6 -4 -8 -9 -3 -7 -1 -16 2 -8 5 -11 5 -5 11 -7 8 -2 12 -2 6 2 2 3 Z',color);
    curve('M-1 8 Q0 2 -1 -11 M0 1 L7 -4 M0 0 L-6 -4','#88543e',.52);line([[-1,7],[-3,11]],'#80563d',.76)})
}
function air(t,power=1,near=false){
  const rr=seed(814);const n=near?7:11;
  for(let i=0;i<n;i++){
    const period=rr()*7+7,offset=rr()*period,y0=rr()*(near?420:390)+48;
    const u=((t*power+offset)%period)/period;const x=-32+u*462;
    const y=y0+u*(42+rr()*65)+Math.sin(u*9+i)*12;const a=u*5+i;
    const base=(near?.49:.19)+rr()*(near?.43:.23);
    save(()=>{g.translate(x,y);g.rotate(a);g.scale(.45+Math.abs(Math.sin(i+u*6))*.55,1);maple(0,0,base,0,['#b66341','#cb8650','#aa6847','#d6ad61'][i%4])})
  }
}
function geese(t,x,y,s=1){
  const offsets=[[0,0],[-17,-6],[-32,-14],[-47,-19],[-63,-27],[-17,6],[-34,9],[-50,13]];
  for(let i=0;i<offsets.length;i++){const [dx,dy]=offsets[i];const flap=Math.sin(t*3.3-i*.67);const k=s*(1-i*.025);
    place(x+dx*s,y+dy*s,k,-.08,()=>{
      const q=-2.2+flap*2.3;
      shape('M-1 0 Q-4 '+(q-1.1)+' -8 '+(q-.5)+' Q-4 '+(q+1)+' -1 1 L1 1 Q3 '+(q+.6)+' 6 '+(q-1.1)+' Q2 '+(q-1.4)+' 0 -.5 Q2 -.4 3.8 .1 L4.6 .7 L1.8 .5 Z','#4c6460')
    })
  }
}
function flowerHead(x,y,r,t,phase=0){
  place(x,y,1,Math.sin(t*.8+phase)*.035,()=>{
    for(let j=0;j<17;j++){const a=j*TAU/17+phase;const rad=r*(.72+.28*Math.sin(j*12.3+phase)**2);
      place(0,0,1,a,()=>{shape('M0 0 Q'+(-rad*.25)+' '+(-rad*.65)+' 0 '+(-rad)+' Q'+(rad*.24)+' '+(-rad*.73)+' 0 0',j%3===0?'#f5d479':j%3===1?'#dca63d':'#ebba4d')})}
    oval(0,0,r*.28,r*.23,'#98753a');for(let k=0;k<6;k++)oval(Math.cos(k)*r*.19,Math.sin(k)*r*.13,r*.045,r*.04,'#dbb95f')
  });
}
function stem(x,foot,h,t,phase=0,bend=0){
  const wind=Math.sin(t*1.05+phase)*h*.022+bend,p={x:x-h*.18+wind,y:foot-h+Math.abs(bend)*.23};
  const mx=x-h*.08+wind*.26;
  curve('M'+x+' '+foot+' Q'+mx+' '+(foot-h*.56)+' '+p.x+' '+p.y,'#51684b',Math.max(.8,h*.023));
  for(const [v,side] of [[.22,-1],[.38,1],[.55,-1],[.71,1]]){
    const xx=blend(x,p.x,v*.82),yy=foot-h*v+.13*Math.abs(bend);
    place(xx,yy,h*.010,side*.32,()=>{g.scale(side,1);shape('M0 0 Q5 -5 8 -5 L7 -8 15 -9 13 -11 22 -15 Q17 -4 12 -2 L10 -3 Q4 1 0 0','#728259');curve('M0 0 L17 -11','#526c4e',.72)})
  }
  flowerHead(p.x,p.y,h*.112,t,phase);return p;
}
function blooms(t,side='both',y=H){
  if(side==='left'||side==='both'){
    for(const [x,h,p] of [[-3,90,2],[16,66,1],[24,40,4],[38,80,2.6],[51,48,.1]])stem(x,y+7,h,t,p);
  }
  if(side==='right'||side==='both'){
    for(const [x,h,p] of [[342,55,4],[356,103,1],[370,74,.6],[387,111,2.5],[405,57,.8]])stem(x,y+6,h,t,p);
