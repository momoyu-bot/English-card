<main>
<h1>镜花水月 · 小萌物短片</h1>
<div class="frame">
<canvas id="screen" width="720" height="1096" aria-label="镜花水月，六只小萌物和一只粉蝶的动画短片">粉蝶还在。小粉想借一张捕梦网，再等它头一回飞回来。</canvas>
<button id="coverButton" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.8 14 8 3 14.2Z"/></svg><span>放映</span></button>
</div>
<div class="controls" aria-label="播放控制">

</div>

<details id="book"><summary>字幕本<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4.5L12.5 6"/></svg></summary>
<div id="lines">
<button class="cue" type="button" data-start="1" data-end="6.9"><time>0:01</time><span>那年春天，它们把一只粉蝶荡过了墙。</span></button>
<button class="cue" type="button" data-start="8" data-end="12.8"><time>0:08</time><span>到了傍晚，小粉又在墙头开成一朵花。</span></button>
<button class="cue" type="button" data-start="14" data-end="20.5"><time>0:14</time><span>墙外那么多花。它偏偏飞回来，<br>落在小粉头上。</span></button>
<button class="cue" type="button" data-start="23" data-end="28.2"><time>0:23</time><span>今夜，粉蝶睡在一片叶子上。</span></button>
<button class="cue" type="button" data-start="29" data-end="34.7"><time>0:29</time><span>水里也有一只，正要飞回来。<br>小粉想再等它一回。</span></button>
<button class="cue" type="button" data-start="35.4" data-end="40.4"><time>0:35</time><span>Clawd 放下捕梦网，狐狸在岸上收线。</span></button>
<button class="cue" type="button" data-start="42" data-end="47.5"><time>0:42</time><span>网起来了。那个春天沿着网眼，<br>滴回水里。</span></button>
<button class="cue" type="button" data-start="50" data-end="54.9"><time>0:50</time><span>暹罗叼着湿网，钻进小黑掀开的窗帘。</span></button>
<button class="cue" type="button" data-start="56.1" data-end="61.6"><time>0:56</time><span>小紫把帘角举高。午后的光，进来了。</span></button>
<button class="cue" type="button" data-start="63" data-end="68.4"><time>1:03</time><span>亮到能看清每根线的时候，<br>网里的月亮没了。</span></button>
<button class="cue" type="button" data-start="71" data-end="75.4"><time>1:11</time><span>狐狸用尾尖，拨了拨网弦。</span></button>
<button class="cue" type="button" data-start="76.2" data-end="81.9"><time>1:16</time><span>「墙里秋千墙外道。」</span></button>
<button class="cue" type="button" data-start="82.7" data-end="87.3"><time>1:22</time><span>唱到「秋千」，两根旧绳子垂了下来。</span></button>
<button class="cue" type="button" data-start="89" data-end="93.6"><time>1:29</time><span>小黑挨着小粉坐好。<br>老玩法，数到三就荡过墙。</span></button>
<button class="cue" type="button" data-start="94.6" data-end="98.3"><time>1:34</time><span>一。二……</span></button>
<button class="cue" type="button" data-start="99.3" data-end="104.7"><time>1:39</time><span>第三下还没到，小粉已经把头偏好了。</span></button>
<button class="cue" type="button" data-start="105.8" data-end="110.3"><time>1:45</time><span>头一回等它的时候，<br>谁知道它会落在哪边呢。</span></button>
<button class="cue" type="button" data-start="112" data-end="117.2"><time>1:52</time><span>水里，那个还没等到蝴蝶的小粉，<br>仰着头。</span></button>
<button class="cue" type="button" data-start="118.4" data-end="123.1"><time>1:58</time><span>小粉放下红绳，和它拉了个勾。</span></button>
<button class="cue" type="button" data-start="124.1" data-end="128.6"><time>2:04</time><span>「拉勾，上吊，一百年不许变。」</span></button>
<button class="cue" type="button" data-start="130" data-end="134.4"><time>2:10</time><span>提起来，只有自己手里的这一截。</span></button>
<button class="cue" type="button" data-start="135.2" data-end="140.5"><time>2:15</time><span>最是人间留不住，朱颜辞镜花辞树。</span></button>
<button class="cue" type="button" data-start="142.2" data-end="147.2"><time>2:22</time><span>天亮了。那片叶子轻了一点。</span></button>
<button class="cue" type="button" data-start="148.4" data-end="153.7"><time>2:28</time><span>小粉闭上眼，等着头上轻轻的一下。</span></button>
<button class="cue" type="button" data-start="155.9" data-end="160.7"><time>2:35</time><span>先不敢动的，却是狐狸。</span></button>
<button class="cue" type="button" data-start="162" data-end="166.6"><time>2:42</time><span>小粉挪过来，替它托住了尾巴。</span></button>
</div>
<p class="credit">秋千和粉蝶来自店里的<a href="https://momoyu-bot.github.io/English-card/claude/小卡/蝶恋花.html">《蝶恋花》</a>。片中琴曲为这次重逢新作。</p>
<p class="credit">词句据维基文库　<a href="https://zh.wikisource.org/zh-hans/蝶戀花_(春景)">苏轼《蝶恋花·春景》</a> · <a href="https://zh.wikisource.org/zh-hans/蝶戀花_(王國維)">王国维《蝶恋花》</a></p>

function score() {
  const items=[];
  const note=(t,midi,d,w='string',v=.12,p=0)=>items.push({t,f:hz(midi),d,w,v,p});
  const phrase=(at,pitches,gaps,kind='felt',level=.14,pan=.08)=>{
    pitches.forEach((pitch,i)=>{
      const gap=i+1<gaps.length?gaps[i+1]-gaps[i]:2.2;
      note(at+gaps[i],pitch,clamp(gap*1.4,.7,3.7),kind,level*(i%3===0?1:.82),pan);
    });
  };
  // Harmony changes at the cuts. Notes continue underneath the final held image.
  const harmony=[
    [0,[50,57,61,64]],[6.6,[47,54,59,62]],[13.4,[55,62,66,69]],
    [20.2,[50,57,64,66]],[25.4,[47,54,57,62]],[31.6,[43,50,57,59]],
    [37.8,[45,52,57,62]],[44.1,[47,54,61,62]],[49.1,[52,59,62,66]],
    [56,[55,62,66,69]],[62.6,[45,52,57,64]],[68,[50,57,59,64]],
    [73.3,[50,57,62,64]],[81.7,[55,62,64,69]],[88.2,[50,57,61,64]],
    [94.1,[47,54,59,62]],[101,[55,62,66,69]],[107,[45,52,57,62]],
    [111.4,[47,54,61,62]],[118.1,[43,50,57,59]],[124.5,[50,57,61,64]],
    [131.4,[47,54,59,62]],[136.5,[43,50,54,59]],[141.4,[52,59,62,66]],
    [147.6,[55,62,66,69]],[154,[50,57,61,64]],[161.1,[55,62,64,69]],
    [167.2,[50,57,62,66]]
  ];
  harmony.forEach(([start,chord],i)=>{
    const quiet=(start>=70&&start<88)||(start>=118&&start<141);
    note(start+.08,chord[0],quiet?3.0:4.7,'bow',quiet?.075:.092,-.25);
    note(start+.38,chord[1],3.2,'felt',.08,-.28);
    note(start+1.43,chord[2],2.6,'string',quiet?.055:.084,.25);
    if(!quiet)note(start+3.14,chord[3],2.7,'felt',.071,.19);
  });
  const motif=[69,74,76,78,76,71,69],timing=[0,.8,1.6,2.75,3.65,5.15,6.65];
  phrase(.8,motif,timing,'string',.153,-.04);
  phrase(10.2,[66,69,71,73,74],[0,1.4,2.8,4,5.9],'reed',.107,.20);
  phrase(18,[78,76,74],[0,1.7,3.3],'felt',.13);
  phrase(24.1,[69,66,64,62],[0,2.3,4.7,6.4],'reed',.085);
  phrase(33.2,[66,69,71,66],[0,1.65,3.25,5.7],'string',.119);
  phrase(41.3,[78,76,71,69],[0,1.1,2.8,4.9],'glass',.115);
  for(const [off,pitch] of [[42.8,86],[43.7,83],[44.8,81]])note(off,pitch,.65,'drop',.13,.30);
  phrase(49.5,[64,66,69,71,69],[0,1.2,3.3,4.4,6.3],'felt',.134);
  phrase(57.8,[74,78,76],[0,2.8,4.7],'reed',.092);
  phrase(64,[81,78,76],[0,1.7,3.65],'glass',.092);
  note(73.15,62,2,'string',.17,-.20);
  lyricTimes.forEach((t,i)=>note(70+t,motif[i],2.35,'string',i===3?.205:.169,mix(-.28,.25,i/6)));
  phrase(83.7,[66,64,62],[0,1.2,2.8],'reed',.12);
  phrase(88.4,motif.slice(0,5),timing.slice(0,5),'felt',.15);
  [94.6,97.0,102.3].forEach((t,i)=>note(t,67+i*2,.40,'wood',.135,-.18));
  phrase(96.2,[66,69,71],[0,2.7,5.4],'reed',.094);
  phrase(104.5,[78,76,74,69],[0,1.1,2.6,4.9],'string',.148);
  phrase(112.1,[66,69,71,69],[0,1.8,4.3,6.1],'felt',.121);
  phrase(121,[74,73,69],[0,2.8,6.2],'reed',.089);
  note(130.8,83,1,'drop',.12,.19);
  phrase(134,[71,69,66],[0,2.2,4.4],'felt',.124);
  phrase(142,[64,66,69,71],[0,1.55,3.75,5.8],'string',.134);
  phrase(149.7,[74,76,78],[0,1.68,4.1],'reed',.089);
  note(155.6,81,2.6,'glass',.11,.22);
  phrase(157.1,[78,76,71,69],[0,1.1,3.2,5.7],'felt',.14);
  phrase(163.8,[66,69,74],[0,2.1,4.6],'string',.13);
  note(170.15,66,2.58,'felt',.10);note(170.72,74,2.1,'glass',.060,.15);
  return items.sort((a,b)=>a.t-b.t);
}
const EVENTS=score();
const rooms=new WeakMap(),attackNoise=new WeakMap();
function resonance(ac,destination) {
  if(rooms.has(destination))return rooms.get(destination);
  const input=ac.createGain(),air=ac.createBiquadFilter();air.type='lowpass';air.frequency.value=1900;
  input.connect(air);
  for(const [time,gain] of [[.057,.12],[.129,.083],[.239,.054],[.36,.030]]){
    const delay=ac.createDelay(.5),level=ac.createGain();
    delay.delayTime.value=time;level.gain.value=gain;
    air.connect(delay);delay.connect(level);level.connect(destination);
  }
  rooms.set(destination,input);return input;
}
function timbreNoise(ac) {
  if(attackNoise.has(ac))return attackNoise.get(ac);
  const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*.15),ac.sampleRate),a=b.getChannelData(0),r=rng(2781);
  for(let n=0;n<a.length;n++)a[n]=r()*2-1;
  attackNoise.set(ac,b);return b;
}
function synth(ac,destination,e,when) {
  const node=ac.createGain(),duration=Math.max(.12,e.d);
  let dest=node;
  if(ac.createStereoPanner){
    const pan=ac.createStereoPanner();pan.pan.value=e.p||0;node.connect(pan);dest=pan;
  }
  dest.connect(destination);
  dest.connect(resonance(ac,destination));
  const smooth=e.w==='bow'||e.w==='reed';
  const attack=smooth?Math.min(.65,duration*.26):e.w==='felt'?.025:.009;
  const env=node.gain;env.setValueAtTime(.0001,when);
  env.exponentialRampToValueAtTime(e.v,when+attack);
  if(smooth){
    env.linearRampToValueAtTime(e.v*.79,when+Math.max(attack+.02,duration*.65));
  }else{
    env.exponentialRampToValueAtTime(Math.max(.0002,e.v*.43),when+Math.min(.24,duration*.45));
  }
  env.exponentialRampToValueAtTime(.0001,when+duration);
  const spectra={
    string:[[1,1],[2.001,.34],[3.003,.18],[4.007,.085]],
    felt:[[1,1],[2.0006,.30],[3.0015,.11]],
    bow:[[1,1],[2,.26],[3,.12]],
    reed:[[1,1],[2,.17],[3,.075]],
    glass:[[1,1],[2.01,.21],[3.94,.14]],
    wood:[[1,1],[1.48,.25],[2.8,.23]],drop:[[1,1],[2.73,.18]]
  };
  const partials=spectra[e.w]||spectra.felt;
  if(e.w==='string'||e.w==='wood'){
    const source=ac.createBufferSource(),band=ac.createBiquadFilter(),touch=ac.createGain();
    source.buffer=timbreNoise(ac);band.type='bandpass';band.frequency.value=e.f*(e.w==='wood'?3.4:5);band.Q.value=1.6;
    touch.gain.setValueAtTime(e.w==='wood'?.19:.115,when);
    touch.gain.exponentialRampToValueAtTime(.0003,when+.065);
    source.connect(band);band.connect(touch);touch.connect(node);source.start(when);source.stop(when+.073);
    source.onended=()=>{source.disconnect();band.disconnect();touch.disconnect();};
  }
  let remaining=partials.length;
  for(const [ratio,amplitude] of partials){
    const osc=ac.createOscillator(),part=ac.createGain();osc.type='sine';
    const frequency=e.f*ratio;
    osc.frequency.setValueAtTime(e.w==='drop'?frequency*1.42:frequency,when);
    if(e.w==='drop')osc.frequency.exponentialRampToValueAtTime(frequency,when+.11);
    if(e.w==='reed'&&ratio===1){
      osc.detune.setValueAtTime(-8,when);osc.detune.linearRampToValueAtTime(1.5,when+attack);
      const vibrato=ac.createOscillator(),depth=ac.createGain();vibrato.frequency.value=4.6;
      depth.gain.setValueAtTime(0,when);depth.gain.linearRampToValueAtTime(8,when+attack);
      vibrato.connect(depth);depth.connect(osc.detune);vibrato.start(when);vibrato.stop(when+duration);
      vibrato.onended=()=>{vibrato.disconnect();depth.disconnect();};
    }
    part.gain.setValueAtTime(amplitude,when);
    if(!smooth&&ratio>1)part.gain.exponentialRampToValueAtTime(.008,when+duration*(ratio>2?.52:.82));
    osc.connect(part);part.connect(node);
    osc.onended=()=>{osc.disconnect();part.disconnect();if(--remaining===0){node.disconnect();if(dest!==node)dest.disconnect();}};
    osc.start(when);osc.stop(when+duration+.015);
  }
}

const cueNodes=Array.from(document.querySelectorAll('.cue'));
const cues=cueNodes.map(el=>({
  at:Number(el.dataset.start),end:Number(el.dataset.end),
  lines:el.querySelector('span').innerHTML.split(/<br\s*\/?\s*>/i).map(s=>{
    const box=document.createElement('span');box.innerHTML=s;return box.textContent;
  }),el
}));
const visibleCue=t=>cues.find(c=>c.at<=t&&t<c.end);
function subtitle(cue,t) {
  rect(0,408,W,140,gradient(0,408,0,548,[[0,'#112c2b00'],[.38,'#183431d6'],[.63,'#1a322ff7'],[1,'#182e2d']]));
  if(!cue)return;
  // Keep the same text inside the export canvas, on the phone and in the cue book.
  const opacity=clamp((t-cue.at)/.17)*clamp((cue.end-t)/.15);
  alpha(opacity,()=>{
    const size=16.2;
    ctx.font='500 '+size+'px '+serif;
    const textLines=[];
    for(const raw of cue.lines){
      if(ctx.measureText(raw).width<=326){textLines.push(raw);continue;}
      let split=Math.ceil(raw.length/2);
      const pauses=Array.from(raw).map((c,i)=>/[，。；？、]/.test(c)?i+1:0).filter(i=>i>3&&i<raw.length-2);
      if(pauses.length)split=pauses.reduce((a,b)=>Math.abs(a-split)<Math.abs(b-split)?a:b);
      textLines.push(raw.slice(0,split),raw.slice(split));
    }
    const first=497-(textLines.length-1)*13;
    textLines.forEach((l,i)=>words(l,W/2,first+i*26,size,'#f5ead7'));
    if(cue.at===76.2){
      const full=cue.lines[0],startX=(W-ctx.measureText(full).width)/2;
      lyricTimes.forEach((onset,i)=>{
        const age=t-70-onset;
        if(age>=0&&age<.92){
          const x=startX+ctx.measureText(full.slice(0,i+1)).width;
          alpha(1-age/.92,()=>words(full[i+1],x,first,size,'#ffc88f','left'));
        }
      });
    }
  });
}
let heldFrame=null,heldIndex=-1;
function render(t) {
  t=clamp(Number(t)||0,0,TOTAL);const {idx,shot,local}=filmShot(t);
  ctx.setTransform(scale,0,0,scale,0,0);ctx.lineJoin='round';ctx.lineCap='round';
  shot.draw(local);
  if(idx>0&&local<.64){
    if(heldIndex!==idx||!heldFrame){
      const live=ctx;heldFrame=sheet(canvas.width,canvas.height);ctx=heldFrame.getContext('2d');
      ctx.setTransform(scale,0,0,scale,0,0);ctx.lineJoin='round';ctx.lineCap='round';
      const previous=shots[idx-1];previous.draw(shot.at-previous.at-1/30);ctx=live;heldIndex=idx;
    }
    alpha(1-fade(0,.64,local),()=>ctx.drawImage(heldFrame,0,0,W,H));
  }
  subtitle(visibleCue(t),t);
}
function setup(pixelWidth) {
  const width=Math.max(1,Math.round(pixelWidth));
  if(canvas.width!==width||Math.abs(scale-width/W)>.00001){
    canvas.width=width;canvas.height=Math.round(width*H/W);scale=width/W;
    backdropCache.clear();heldFrame=null;heldIndex=-1;
  }
  ctx.setTransform(scale,0,0,scale,0,0);ctx.lineJoin='round';ctx.lineCap='round';
}
const $=id=>document.getElementById(id);
const playBtn=$('toggle'),soundBtn=$('sound'),coverBtn=$('coverButton'),seek=$('seek'),clock=$('clock');
const drawIcon=d=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+d+'</svg>';
const icons={
  play:drawIcon('<path d="M7 3.8 20 12 7 20.2Z" fill="currentColor" stroke="none"/>'),
  pause:drawIcon('<path d="M7 4.5v15m10-15v15" stroke-width="3.6"/>'),
  volume:drawIcon('<path d="M3 9h4l5-4v14l-5-4H3Z"/><path d="M16 8q4 4 0 8m3-11q7 7 0 14"/>'),
  mute:drawIcon('<path d="M3 9h4l5-4v14l-5-4H3Z"/><path d="m16 9 5 6m0-6-5 6"/>')
};
const stamp=t=>Math.floor(t/60)+':'+String(Math.floor(t)%60).padStart(2,'0');
let started=false,playing=false,audible=true,position=0,anchor=0,animation=0,lastFrame=-1;
let ac=null,bus=null,nextNote=0,activeCue=null,frameSize=0;
function firstEventAt(t) {
  let left=0,right=EVENTS.length;while(left<right){const mid=(left+right)>>1;if(EVENTS[mid].t<t)left=mid+1;else right=mid;}return left;
}
function resetBus() {
  if(bus&&ac){
    const old=bus;const now=ac.currentTime;old.gain.cancelScheduledValues(now);
    old.gain.setValueAtTime(old.gain.value,now);old.gain.setTargetAtTime(.0001,now,.012);
    setTimeout(()=>old.disconnect(),70);
  }
  bus=null;
  if(ac){bus=ac.createGain();bus.gain.value=1;bus.connect(ac.destination);}
  nextNote=firstEventAt(position-.003);
}
function enableAudio() {
  if(!audible)return;
  try{
    if(!ac){
      const Type=window.AudioContext||window.webkitAudioContext;
      if(!Type)return;
      ac=new Type();resetBus();
    }
    if(ac.state!=='running')ac.resume().catch(()=>{});
  }catch(_){/* All of the film's action also reads in silence. */}
}
function schedule(t) {
  if(!audible||!ac||ac.state!=='running'||!bus)return;
  const now=ac.currentTime;
  while(nextNote<EVENTS.length&&EVENTS[nextNote].t<=t+.24){
    const e=EVENTS[nextNote++];
    if(e.t>=t-.12)synth(ac,bus,e,now+Math.max(.005,e.t-t));
  }
}
function syncLabels() {
  playBtn.innerHTML=playing?icons.pause:icons.play;
  playBtn.setAttribute('aria-label',playing?'暂停':position>=TOTAL?'重映':'播放');
  soundBtn.innerHTML=audible?icons.volume:icons.mute;
  soundBtn.setAttribute('aria-pressed',String(audible));
  soundBtn.setAttribute('aria-label',audible?'静音':'打开声音');
  coverBtn.hidden=started&&position<TOTAL;
  coverBtn.querySelector('span').textContent=started?'重映':'放映';
}
function syncTime() {
  seek.value=String(position);seek.style.setProperty('--progress',(position/TOTAL*100)+'%');
  const label=stamp(position)+' / '+stamp(TOTAL);
  if(clock.textContent!==label){clock.textContent=label;seek.setAttribute('aria-valuetext',label);}
  const c=started?visibleCue(position):null;
  if(c!==activeCue){
    if(activeCue)activeCue.el.removeAttribute('aria-current');
    if(c)c.el.setAttribute('aria-current','true');
    $('accessibleCue').textContent=c?c.lines.join(''):'';
    activeCue=c;
  }
}
function showFrame() {
  if(started)render(position);else poster();syncTime();
}
function fit() {
  const width=Math.round(canvas.parentElement.getBoundingClientRect().width*Math.min(window.devicePixelRatio||1,3));
  if(width===frameSize||width<1)return;
  frameSize=width;setup(width);showFrame();
}
function tick(now) {
  if(!playing)return;
  position=clamp((now-anchor)/1000,0,TOTAL);
  const frame=Math.floor(position*30);
  if(frame!==lastFrame){showFrame();lastFrame=frame;}
  schedule(position);
  if(position>=TOTAL){playing=false;syncLabels();syncTime();return;}
  animation=requestAnimationFrame(tick);
}
function pause() {
  if(playing)position=clamp((performance.now()-anchor)/1000,0,TOTAL);
  playing=false;cancelAnimationFrame(animation);resetBus();syncLabels();showFrame();
}
function play() {
  if(playing)return;
  if(position>=TOTAL-.001)position=0;
  started=true;playing=true;enableAudio();resetBus();lastFrame=-1;
  anchor=performance.now()-position*1000;syncLabels();tick(performance.now());
}
function jump(t,startPlaying=false) {
  position=clamp(t,0,TOTAL);started=true;lastFrame=-1;
  anchor=performance.now()-position*1000;resetBus();
  if(position===TOTAL){playing=false;cancelAnimationFrame(animation);}
  syncLabels();showFrame();
  if(startPlaying)play();
}
playBtn.onclick=()=>playing?pause():play();coverBtn.onclick=play;
canvas.addEventListener('click',()=>playing?pause():play());
soundBtn.onclick=()=>{
  audible=!audible;
  if(audible)enableAudio();
  resetBus();syncLabels();
};
seek.addEventListener('input',()=>jump(Number(seek.value)));
cueNodes.forEach((el,i)=>el.addEventListener('click',()=>{
  if(canvas.getBoundingClientRect().top<0)window.scrollTo(0,0);
  jump(cues[i].at+.19,true);
}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause();});
window.addEventListener('pagehide',()=>{if(playing)pause();});
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(canvas.parentElement);
window.FILM={W,H,TOTAL,events:EVENTS,canvas,setup,render,synth};
syncLabels();fit();

})();
</script>
