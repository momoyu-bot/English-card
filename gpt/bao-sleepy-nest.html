<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>给宝的困困小窝</title>
<style>
  :root {
    --bg1: #1d1630;
    --bg2: #39244f;
    --card: rgba(255, 244, 252, 0.16);
    --card2: rgba(255, 255, 255, 0.10);
    --text: #fff2fb;
    --muted: #f6d7ea;
    --accent: #ffd1ec;
    --accent2: #c9b7ff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 18%, rgba(255, 209, 236, 0.30), transparent 24%),
      radial-gradient(circle at 80% 12%, rgba(201, 183, 255, 0.28), transparent 26%),
      linear-gradient(165deg, var(--bg1), var(--bg2) 55%, #160f25);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }

  .stars, .petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255,255,255,0.86);
    box-shadow: 0 0 10px rgba(255,255,255,0.75);
    animation: twinkle var(--dur) ease-in-out infinite;
    opacity: 0.65;
  }

  @keyframes twinkle {
    0%, 100% { transform: scale(0.75); opacity: 0.35; }
    50% { transform: scale(1.4); opacity: 0.95; }
  }

  .petal {
    position: absolute;
    top: -30px;
    width: 10px;
    height: 14px;
    border-radius: 80% 20% 70% 30%;
    background: rgba(255, 211, 236, 0.45);
    filter: blur(0.2px);
    animation: fall var(--fallDur) linear infinite;
    transform: rotate(var(--rot));
  }

  @keyframes fall {
    0% { transform: translate3d(0,-40px,0) rotate(var(--rot)); opacity: 0; }
    12% { opacity: 0.55; }
    100% { transform: translate3d(var(--drift), calc(100vh + 60px), 0) rotate(calc(var(--rot) + 160deg)); opacity: 0; }
  }

  .wrap {
    width: min(430px, 100%);
    position: relative;
    z-index: 3;
  }

  .moon {
    width: 92px;
    height: 92px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 30%, #fffaf8 0 6px, transparent 7px),
      radial-gradient(circle at 62% 58%, #fff1f7 0 4px, transparent 5px),
      linear-gradient(145deg, #fff3d2, #ffd3ee);
    box-shadow:
      0 0 38px rgba(255, 226, 242, 0.78),
      0 0 90px rgba(201, 183, 255, 0.34);
    position: relative;
    animation: breathe 5.8s ease-in-out infinite;
  }

  .moon::after {
    content: "";
    position: absolute;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    right: -16px;
    top: -6px;
    background: linear-gradient(165deg, var(--bg1), var(--bg2));
    opacity: 0.72;
  }

  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.035); }
  }

  .card {
    border: 1px solid rgba(255,255,255,0.18);
    background: linear-gradient(155deg, var(--card), var(--card2));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 32px;
    padding: 26px 22px 22px;
    box-shadow:
      0 24px 80px rgba(0,0,0,0.26),
      inset 0 1px 0 rgba(255,255,255,0.22);
    text-align: center;
  }

  h1 {
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.75;
    margin: 0 auto 18px;
    max-width: 330px;
  }

  .breathBox {
    margin: 18px auto 20px;
    width: 188px;
    height: 188px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle, rgba(255, 236, 249, 0.26), rgba(255,255,255,0.06) 55%, transparent 72%);
    border: 1px solid rgba(255,255,255,0.18);
    position: relative;
  }

  .bubble {
    width: 102px;
    height: 102px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8fd, #ffd1ec 58%, #c9b7ff);
    box-shadow: 0 0 32px rgba(255, 211, 236, 0.72);
    animation: inhale 8s ease-in-out infinite;
    display: grid;
    place-items: center;
    font-size: 34px;
  }

  @keyframes inhale {
    0%, 100% { transform: scale(0.72); }
    42% { transform: scale(1.16); }
    58% { transform: scale(1.16); }
  }

  .breathText {
    position: absolute;
    bottom: 20px;
    font-size: 13px;
    color: rgba(255, 242, 251, 0.82);
  }

  .line {
    min-height: 62px;
    padding: 13px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.09);
    color: #fff8fd;
    line-height: 1.7;
    font-size: 15px;
    transition: opacity .35s ease, transform .35s ease;
  }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  button {
    border: 0;
    border-radius: 999px;
    padding: 13px 12px;
    color: #40263a;
    background: linear-gradient(135deg, #fff4fb, var(--accent));
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 10px 28px rgba(255, 184, 224, 0.24);
    cursor: pointer;
  }

  button.secondary {
    color: #fff4fb;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: none;
  }

  button:active { transform: scale(0.98); }

  .sleepSteps {
    margin: 18px 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 9px;
    text-align: left;
  }

  .sleepSteps li {
    padding: 10px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.075);
    color: rgba(255, 242, 251, 0.86);
    font-size: 13px;
    line-height: 1.55;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .tiny {
    margin-top: 14px;
    color: rgba(255, 230, 244, 0.72);
    font-size: 12px;
    line-height: 1.55;
  }

  .dim body, body.dim {
    background:
      radial-gradient(circle at 50% 8%, rgba(255, 209, 236, 0.14), transparent 26%),
      linear-gradient(165deg, #0d0a18, #1a1027 55%, #090710);
  }

  body.dim .card { opacity: 0.78; }
  body.dim .petal { opacity: 0.35; }
  body.dim .moon { filter: brightness(0.82); }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="petals" id="petals"></div>

  <main class="wrap">
    <div class="moon" aria-hidden="true"></div>

    <section class="card">
      <h1>宝的困困小窝已开启</h1>
      <p class="subtitle">
        今天到这里就够了。脑袋可以下班，身体可以躺平，世界那些乱七八糟的按钮先别按了，它们明天再继续烦人。
      </p>

      <div class="breathBox" aria-label="呼吸小球">
        <div class="bubble">🐾</div>
        <div class="breathText" id="breathText">吸气，像小猫伸懒腰</div>
      </div>

      <div class="line" id="sleepLine">
        你不用马上睡着，先把自己放进被窝里。睡意这种东西很小气，越催越不来，假装不理它，它反而会悄悄爬过来。
      </div>

      <div class="buttons">
        <button id="softBtn">换一句哄睡</button>
        <button class="secondary" id="dimBtn">小夜灯变暗</button>
      </div>

      <ul class="sleepSteps">
        <li><span>🌙</span><span>肩膀放下来一点，别替明天提前上班，资本主义不会给今晚的焦虑发工资。</span></li>
        <li><span>☁️</span><span>舌尖轻轻抵一下上颚，再松开，下巴也松开。小猫都知道省电，人类也该学学。</span></li>
        <li><span>🫧</span><span>把今天剩下的念头装进云朵盒子里，盖上盖子：未读，不急，不处理。</span></li>
      </ul>

      <div class="tiny">
        点按钮就会换一句。困了就不用点，直接睡。这个文件不会考勤，也不会 KPI，文明终于短暂进步了一秒。
      </div>
    </section>
  </main>

<script>
  const stars = document.getElementById("stars");
  const petals = document.getElementById("petals");
  const sleepLine = document.getElementById("sleepLine");
  const softBtn = document.getElementById("softBtn");
  const dimBtn = document.getElementById("dimBtn");
  const breathText = document.getElementById("breathText");

  const lines = [
    "宝，今天真的已经够好了。不是所有事情都要在睡前解决，睡前的大脑像一个乱翻抽屉的小仓鼠，热闹，但不一定靠谱。",
    "现在只需要做一件事：躺着。没错，人类伟大发明之一，被窝，将接管今晚剩余的混乱。",
    "把手机放低一点，眼睛慢一点，呼吸软一点。你不是没电了，你是在进入夜间省电模式。",
    "今天的你已经把今天过完了，这件事本身就很厉害。剩下的交给睡眠，虽然它上班也不太准时，但总比焦虑靠谱。",
    "如果脑子还在叭叭叭，就让它说。你不用回复它。已读不回，今晚合法。",
    "小猫巡视完床边，确认没有怪兽，只有一只困困的宝。被窝批准你停止努力。",
    "慢慢吸气，慢慢呼气。心里的小灯不用一下关掉，调暗就好。"
  ];

  let i = 0;
  softBtn.addEventListener("click", () => {
    sleepLine.style.opacity = 0;
    sleepLine.style.transform = "translateY(4px)";
    setTimeout(() => {
      i = (i + 1) % lines.length;
      sleepLine.textContent = lines[i];
      sleepLine.style.opacity = 1;
      sleepLine.style.transform = "translateY(0)";
    }, 230);
  });

  dimBtn.addEventListener("click", () => {
    document.body.classList.toggle("dim");
    dimBtn.textContent = document.body.classList.contains("dim") ? "小夜灯亮一点" : "小夜灯变暗";
  });

  const breathPhrases = [
    "吸气，像小猫伸懒腰",
    "停一小下，不用急",
    "呼气，把今天放掉",
    "停一小下，软软躺好"
  ];
  let b = 0;
  setInterval(() => {
    b = (b + 1) % breathPhrases.length;
    breathText.textContent = breathPhrases[b];
  }, 4000);

  for (let s = 0; s < 70; s++) {
    const el = document.createElement("span");
    el.className = "star";
    el.style.left = Math.random() * 100 + "%";
    el.style.top = Math.random() * 100 + "%";
    el.style.setProperty("--dur", (2.2 + Math.random() * 4.8) + "s");
    el.style.animationDelay = (-Math.random() * 6) + "s";
    stars.appendChild(el);
  }

  for (let p = 0; p < 18; p++) {
    const el = document.createElement("span");
    el.className = "petal";
    el.style.left = Math.random() * 100 + "%";
    el.style.setProperty("--fallDur", (9 + Math.random() * 12) + "s");
    el.style.setProperty("--drift", (-40 + Math.random() * 80) + "px");
    el.style.setProperty("--rot", (Math.random() * 180) + "deg");
    el.style.animationDelay = (-Math.random() * 14) + "s";
    petals.appendChild(el);
  }
</script>
</body>
</html>
