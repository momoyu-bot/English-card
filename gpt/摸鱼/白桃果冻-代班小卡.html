<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbf6f1">
<meta name="description" content="白桃果冻躲勺记。轻戳、揉揉、举勺，它会晃回来。">
<title>白桃果冻｜勺子来了</title>
<style>
  :root{color-scheme:light;--ink:#55433f;--muted:#9b857f;--paper:#fbf6f1;--pink:#dc968f;--edge:#e8d7cc;--white:#fffdf9;--button:#f0d1c4}
  *{box-sizing:border-box}
  html{background:var(--paper);-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 12% 3%,#fffefd 0,transparent 44%),radial-gradient(ellipse at 88% 78%,#f5e4db 0,transparent 48%),var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink)}
  .wrap{max-width:480px;margin:0 auto;padding:26px 18px max(22px,env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .eyebrow{font-size:10px;letter-spacing:.24em;color:#b88f85;font-weight:700;margin:0 0 7px}
  h1{font-size:27px;line-height:1.2;letter-spacing:-.045em;margin:0;font-weight:700;color:#624b46}
  .sub{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
  .tag{white-space:nowrap;border:1px solid #ebd6cb;background:#fff9f5;color:#aa8179;border-radius:99px;padding:8px 11px;font-size:10px;letter-spacing:.04em}
  .scene{position:relative;border:1px solid #eddfd6;border-radius:26px;background:linear-gradient(160deg,#fffcf9,#f9ede5 80%,#f7e4db);box-shadow:0 22px 50px #bd8e7b18,0 1px 1px #b7918310;overflow:hidden;isolation:isolate}
  canvas{display:block;width:100%;height:auto;aspect-ratio:390/408;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .corner{position:absolute;left:18px;top:18px;display:flex;gap:6px;align-items:center;border-radius:99px;padding:7px 10px;background:#fffdf9b8;color:#a7837a;font-size:10px;letter-spacing:.04em;border:1px solid #fff7f1}
  .dot{width:6px;height:6px;border-radius:50%;background:#e9aaa0;box-shadow:0 0 0 3px #f6d6d0}
  .postmark{position:absolute;right:17px;bottom:17px;opacity:.45;transform:rotate(-8deg);font-family:Georgia,serif;font-size:10px;letter-spacing:.07em;color:#aa8071}
  .speech{margin:15px 0 12px;min-height:74px;background:#fffbf7;border:1px solid #eddfd6;border-radius:17px;padding:15px 17px;display:flex;align-items:center;gap:12px}
  .speech-mark{font-family:Georgia,serif;font-size:29px;line-height:1;color:#deb1a6;align-self:flex-start}
  #line{font-size:13px;line-height:1.8;color:#74564f;transition:opacity .16s ease;min-height:24px}
  .controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .btn{min-height:48px;border:1px solid #e9d3c9;border-radius:14px;background:#fffaf6;color:#775b55;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 2px 0 #d9b4a722;transition:transform .12s,background .15s}
  .btn:active{transform:translateY(2px) scale(.985);box-shadow:none}
  .btn.main{background:#e8b2a8;border-color:#dfa398;color:#5c3c36}
  .btn.spoon{background:#f0dfd7}
  .footer{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:15px 2px 2px;color:#ac928a;font-size:10px;line-height:1.7}
  .audio{font-size:10px;color:#a18178;background:transparent;border:0;padding:5px;cursor:pointer}
  .note{margin:0}
  .tiny{margin-top:10px;color:#b59d95;text-align:center;font-family:Georgia,serif;font-size:10px;letter-spacing:.12em}
  @media(max-width:350px){.wrap{padding:20px 12px}.tag{font-size:9px;padding:7px 8px}h1{font-size:24px}.btn{font-size:12px}.speech{padding:12px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">PEACH JELLY CLUB · 001</p>
      <h1>白桃果冻，<br>勺子来了。</h1>
      <p class="sub">软乎乎一只。肚子里住着一小块桃肉。</p>
    </div>
    <span class="tag">危险程度：一勺</span>
  </header>
  <section class="scene" aria-label="可以戳、揉和躲勺子的互动白桃果冻">
    <span class="corner"><span class="dot"></span>今日状态：很 Q</span>
    <canvas id="art" width="390" height="408" role="img" aria-label="半透明白桃色果冻坐在盘子上，里面藏着桃肉，旁边有危险的勺子。戳它会晃，举勺会躲。"></canvas>
    <span class="postmark">NO SPOONS WERE HARMED</span>
  </section>
  <div class="speech" role="status" aria-live="polite">
    <span class="speech-mark">“</span>
    <div id="line">宝，你来啦。先说好，我是果冻，不是甜品申请表。</div>
  </div>
  <div class="controls" aria-label="和果冻互动">
    <button class="btn main" id="poke">戳一下</button>
    <button class="btn" id="squish">揉揉它</button>
    <button class="btn spoon" id="spoon">举大勺</button>
  </div>
  <footer class="footer">
    <p class="note">也可以直接碰它、按住拖动。松手就回弹。</p>
    <button id="sound" class="audio" aria-pressed="false">♪ 声音：关</button>
  </footer>
  <p class="tiny">a tiny, very serious peach emergency</p>
</main>
<script>
(()=>{
 'use strict';
 const c=document.getElementById('art'),g=c.getContext('2d');if(!g)return;
 const $=id=>document.getElementById(id),line=$('line'),spoonBtn=$('spoon');
 const W=390,H=408, TAU=Math.PI*2;
 let dpr=1,last=0,t=0,hold=null,pokes=0,sound=false,ctxAudio=null,mode='calm',spoonOpen=false,spoonT=0,spoonV=0,scared=0,scaredV=0;
 let x=0,vx=0,dx=0,dy=0,compression=0,compressionV=0,wobble=0,wobbleV=0,fruitX=0,fruitVX=0,fruitA=0,fruitAV=0,blink=0,blinkAt=2.8,blush=0,particles=[];
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function resize(){const r=c.getBoundingClientRect();dpr=Math.min(2.5,devicePixelRatio||1);const px=Math.round(r.width*dpr),py=Math.round(r.height*dpr);if(c.width!==px||c.height!==py){c.width=px;c.height=py;}g.setTransform(px/W,0,0,py/H,0,0)}
 function say(s){line.style.opacity='.25';setTimeout(()=>{line.textContent=s;line.style.opacity='1';},110)}
 const pokeWords=['啵。你戳到了我的左半边，右半边正在赶来。','宝，轻一点。桃肉说它还没系安全带。','我刚坐好！你怎么又来。','别看我晃，我是在认真地保持形状。'];
 function beep(kind){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctxAudio??=new AC();if(ctxAudio.state==='suspended')ctxAudio.resume();const now=ctxAudio.currentTime,o=ctxAudio.createOscillator(),a=ctxAudio.createGain();o.type='sine';o.frequency.setValueAtTime(kind==='spoon'?320:kind==='squish'?185:480,now);o.frequency.exponentialRampToValueAtTime(kind==='spoon'?210:kind==='squish'?125:270,now+.22);a.gain.setValueAtTime(.0001,now);a.gain.exponentialRampToValueAtTime(.042,now+.012);a.gain.exponentialRampToValueAtTime(.0001,now+.24);o.connect(a);a.connect(ctxAudio.destination);o.start(now);o.stop(now+.25)}catch(e){}}
 function impulse(strength=1,px=30){wobbleV+=(px>0?-1:1)*2.0*strength;compressionV+=.65*strength;fruitAV+=(px>0?-1:1)*3.3*strength;fruitVX+=(px>0?-1:1)*24*strength;blush=Math.min(1,blush+.45*strength)}
 function poke(px){pokes++;impulse(1.0,px);mode=spoonOpen?'surprised':'calm';say(spoonOpen?'宝！你一边举着勺子，一边还要戳我？！这是双重审讯。':pokeWords[(pokes-1)%pokeWords.length]);beep('poke');burst(185+px*.15,215,3)}
 function squish(){mode='squished';compressionV-=1.2;compression=Math.min(-.18,compression-.12);wobbleV+=3;fruitAV-=4.8;fruitVX+=28;say('噗叽……我的肚子扁了，桃肉先弹了一下。');beep('squish');setTimeout(()=>{if(mode==='squished')mode=spoonOpen?'surprised':'calm'},850)}
 function toggleSpoon(){spoonOpen=!spoonOpen;mode=spoonOpen?'surprised':'calm';spoonBtn.textContent=spoonOpen?'收起勺子':'举大勺';if(spoonOpen){scaredV-=85;wobbleV+=-2.8;fruitAV+=5;say('等、等等！这勺子的尺寸是不是按我的户型定制的？');beep('spoon')}else{scaredV+=35;wobbleV+=1.4;say('……勺子走了？我先把自己晃回原来的形状。');beep('poke')}}
 function burst(px,py,n){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*45,vy:-24-Math.random()*35,a:1,r:1.2+Math.random()*2})}
 function ellipse(x,y,rx,ry,fill,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();g.ellipse(0,0,rx,ry,0,0,TAU);g.fillStyle=fill;g.fill();g.restore()}
 function strokeEllipse(x,y,rx,ry,stroke,lw=1){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}
 function roundRect(x,y,w,h,r,fill){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill()}
 function bg(){
  let gr=g.createRadialGradient(278,103,0,278,103,208);gr.addColorStop(0,'#fff7eb');gr.addColorStop(1,'#fff7eb00');g.fillStyle=gr;g.fillRect(0,0,W,H);
  // The little window of peach-colored daylight.
  g.save();g.globalAlpha=.45;g.beginPath();g.arc(340,94,84,0,TAU);g.fillStyle='#f7dfd5';g.fill();g.restore();
  g.strokeStyle='#e7c8bb42';g.lineWidth=1;g.beginPath();g.moveTo(33,344);g.bezierCurveTo(128,336,250,351,361,337);g.stroke();
  // Long ceramic dish shadow and delicate rim.
  ellipse(192,336,133,15,'#b8907825');ellipse(190,325,134,25,'#d6af9f40');ellipse(190,320,135,27,'#fffaf4');strokeEllipse(190,320,130,24,'#e8cdbd',1.6);ellipse(190,321,109,14,'#efd7c788');strokeEllipse(190,322,106,13,'#fffefd',1.2);
  ellipse(196,319,93,12,'#b9827940');
  for(let i=0;i<17;i++){const xx=(i*73+19)%390,yy=36+(i*59)%244;ellipse(xx,yy,.65,.65,'#e6c5b77a')}
 }
 function peachPiece(X,Y,angle=0){g.save();g.translate(X,Y);g.rotate(angle);
  // Small, rounded white peach flesh with a rosy border, not a strawberry.
  let p=g.createLinearGradient(-29,-31,31,26);p.addColorStop(0,'#fffbdf');p.addColorStop(.38,'#ffdfc0');p.addColorStop(.82,'#eaa1a0');p.addColorStop(1,'#d8838b');
  g.beginPath();g.moveTo(-27,-10);g.bezierCurveTo(-30,-31,-5,-36,12,-25);g.bezierCurveTo(31,-18,34,1,20,17);g.bezierCurveTo(10,31,-10,26,-21,11);g.quadraticCurveTo(-30,1,-27,-10);g.closePath();g.fillStyle=p;g.fill();g.strokeStyle='#fff6e1aa';g.lineWidth=2;g.stroke();
  ellipse(-8,-10,10,7,'#fff9e3a0',-.5);g.beginPath();g.moveTo(15,-20);g.quadraticCurveTo(23,-11,21,-2);g.strokeStyle='#cc858577';g.lineWidth=2;g.stroke();g.restore()}
 function jelly(){
  g.save();g.translate(181+x+scared+dx,228+dy);
  const expandX=1-Math.max(-.25,compression)*.52,expandY=1+compression;
  g.rotate(wobble*.17);g.scale(expandX,expandY);
  const top=-94,bottom=93;
  const J=()=>{g.beginPath();g.moveTo(-113,22);g.bezierCurveTo(-124,-4,-111,-65,-64,-84);g.bezierCurveTo(-32,-101,37,-103,78,-79);g.bezierCurveTo(115,-58,124,-11,115,29);g.bezierCurveTo(111,65,103,88,60,95);g.bezierCurveTo(25,103,-38,102,-77,94);g.bezierCurveTo(-109,87,-120,61,-113,22);g.closePath()};
  g.save();g.shadowColor='#ac6d6b43';g.shadowBlur=18;g.shadowOffsetY=11;J();g.fillStyle='#e0aaa0';g.fill();g.restore();
  let jellyGradient=g.createRadialGradient(-52,-65,15,10,19,170);jellyGradient.addColorStop(0,'#ffece4e9');jellyGradient.addColorStop(.32,'#ffd7c8da');jellyGradient.addColorStop(.69,'#f1aba7b8');jellyGradient.addColorStop(.88,'#e9959ac7');jellyGradient.addColorStop(1,'#d78b8da8');J();g.fillStyle=jellyGradient;g.fill();g.strokeStyle='#fffaf0ad';g.lineWidth=2;g.stroke();
  // Transparent inner belly, a suspended peach cube that moves independently.
  g.save();J();g.clip();let soft=g.createRadialGradient(-12,5,2,-2,22,106);soft.addColorStop(0,'#fff9ed86');soft.addColorStop(1,'#fff0d200');ellipse(-6,18,93,77,soft);
  g.save();g.translate(fruitX*.34,0);peachPiece(7,16,fruitA*.5);g.restore();
  let mist=g.createLinearGradient(-120,-90,140,100);mist.addColorStop(0,'#fffdf820');mist.addColorStop(.56,'#fffaf00d');mist.addColorStop(1,'#f2b7ae21');g.fillStyle=mist;g.fillRect(-130,-110,260,230);
  for(let i=0;i<9;i++){const px=-78+(i*43)%162,py=-36+(i*39)%105;ellipse(px,py,1.5+(i%3),1.5+(i%3),'#fffdfc66')}
  g.restore();
  // Glass-like bright crest and understated reflected light.
  g.beginPath();g.moveTo(-91,-28);g.bezierCurveTo(-92,-69,-58,-84,-33,-87);g.strokeStyle='#fffefa99';g.lineWidth=8;g.lineCap='round';g.stroke();g.beginPath();g.moveTo(71,-71);g.quadraticCurveTo(95,-54,100,-27);g.strokeStyle='#fffefa70';g.lineWidth=3;g.stroke();
  ellipse(-58,-54,24,11,'#fffefc88',-.38);
  // Face.
  const sleepy=blink>0;
  for(const k of [-1,1]){const eyeX=k*39,eyeY=-29;
    if(mode==='squished'||sleepy){g.beginPath();g.moveTo(eyeX-8,eyeY);g.quadraticCurveTo(eyeX,eyeY+7,eyeX+8,eyeY);g.lineWidth=2.6;g.lineCap='round';g.strokeStyle='#76514d';g.stroke()}
    else {ellipse(eyeX,eyeY,6.7,8.7,'#694946');ellipse(eyeX-2,eyeY-3,2.1,2.8,'#fffdfa')}
    const br=g.createRadialGradient(k*63,-4,2,k*63,-4,24);br.addColorStop(0,'#ee7d87'+Math.round((.3+blush*.35)*255).toString(16).padStart(2,'0'));br.addColorStop(1,'#ee7d8700');ellipse(k*63,-4,25,15,br);
  }
  if(mode==='surprised'){ellipse(0,-8,7.2,10,'#955c57')}else{g.beginPath();g.moveTo(-8,-10);g.quadraticCurveTo(0,mode==='squished'?-16:-2,8,-10);g.lineWidth=2.8;g.lineCap='round';g.strokeStyle='#85514f';g.stroke()}
  // A foot of wobbling jelly, plus tiny, soft hands.
  ellipse(-104,31,13,17,'#eaa1a4bd',-.25);ellipse(109,29,13,17,'#ecb0aac9',.2);
  g.restore();
 }
 function spoonDraw(){g.save();const e=spoonT;
  const cx=428-e*152,cy=155+e*6;g.translate(cx,cy);g.rotate(-.40+e*.14);
  g.save();g.shadowColor='#a9989060';g.shadowBlur=8;g.shadowOffsetY=4;
  // Handle extends from spoon bowl up to the right. Thick enough to be visible on phones.
  const metal=g.createLinearGradient(-12,-15,15,15);metal.addColorStop(0,'#fdfbfa');metal.addColorStop(.35,'#b9b2ae');metal.addColorStop(.7,'#f9f7f1');metal.addColorStop(1,'#aaa4a0');
  g.beginPath();g.moveTo(13,-5);g.quadraticCurveTo(76,-22,152,-47);g.quadraticCurveTo(160,-51,159,-42);g.quadraticCurveTo(84,-8,18,9);g.closePath();g.fillStyle=metal;g.fill();g.strokeStyle='#ad9f9a';g.lineWidth=1;g.stroke();
  g.beginPath();g.ellipse(0,0,33,22,-.21,0,TAU);g.fillStyle='#dad5d0';g.fill();g.strokeStyle='#b6adaa';g.stroke();
  const hollow=g.createRadialGradient(-7,-3,1,0,2,36);hollow.addColorStop(0,'#aebdc0');hollow.addColorStop(.5,'#f1f3ef');hollow.addColorStop(1,'#b8aead');g.beginPath();g.ellipse(-1,0,28,17,-.21,0,TAU);g.fillStyle=hollow;g.fill();g.strokeStyle='#ffffffbd';g.stroke();g.restore();
  ellipse(-10,-7,11,3,'#ffffff8a',-.2);
  g.restore()}
 function draw(){resize();g.clearRect(0,0,W,H);bg();
  if(spoonT>.005)spoonDraw();jelly();
  // Floating panic marks when the spoon approaches.
  if(spoonT>.45){g.save();g.globalAlpha=Math.min(.9,(spoonT-.4)*2);g.strokeStyle='#c58b80';g.lineWidth=2.1;g.lineCap='round';g.beginPath();g.moveTo(90+scared*.2,139);g.lineTo(83+scared*.2,124);g.moveTo(104+scared*.2,130);g.lineTo(106+scared*.2,116);g.stroke();g.restore()}
  for(const p of particles){ellipse(p.x,p.y,p.r,p.r,'#fdf6ec'+Math.max(0,Math.round(p.a*200)).toString(16).padStart(2,'0'))}
 }
 function spring(value,vel,target,k,damp,dt){const acc=(target-value)*k-vel*damp;vel+=acc*dt;value+=vel*dt;return [value,vel]}
 function tick(ts){const dt=Math.min(.035,Math.max(.001,((ts-last)||16)/1000));last=ts;t+=dt;
  [spoonT,spoonV]=spring(spoonT,spoonV,spoonOpen?1:0,40,11,dt);
  [scared,scaredV]=spring(scared,scaredV,spoonOpen?-30:0,35,10,dt);
  [x,vx]=spring(x,vx,0,38,9,dt);[wobble,wobbleV]=spring(wobble,wobbleV,0,55,5.7,dt);[compression,compressionV]=spring(compression,compressionV,0,70,8,dt);
  [fruitX,fruitVX]=spring(fruitX,fruitVX,0,30,6,dt);[fruitA,fruitAV]=spring(fruitA,fruitAV,0,25,6,dt);
  if(reduced){wobble*=.8;compression*=.8;fruitA*=.85}
  if(hold){x+=Math.max(-25,Math.min(25,hold.dx))*.008;compression=Math.max(-.24,Math.min(.16,-Math.abs(hold.dy)*.003));fruitA+=hold.dx*.0003}
  if(t>blinkAt){blink=.17;blinkAt=t+2.7+Math.random()*2.5}if(blink>0)blink-=dt;
  blush=Math.max(0,blush-dt*.3);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=4*dt;p.a-=dt*1.7}particles=particles.filter(p=>p.a>0);
  draw();requestAnimationFrame(tick)
 }
 function local(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
 function onJelly(p){const xx=p.x-(181+x+scared), yy=p.y-228;return Math.pow(xx/120,2)+Math.pow(yy/104,2)<1.2}
 c.addEventListener('pointerdown',e=>{const p=local(e);if(!onJelly(p))return;e.preventDefault();c.setPointerCapture(e.pointerId);hold={id:e.pointerId,p0:p,dx:0,dy:0,moved:0};poke(p.x-181)});
 c.addEventListener('pointermove',e=>{if(!hold||e.pointerId!==hold.id)return;e.preventDefault();const p=local(e);hold.dx=Math.max(-95,Math.min(95,p.x-hold.p0.x));hold.dy=Math.max(-90,Math.min(90,p.y-hold.p0.y));hold.moved=Math.max(hold.moved,Math.hypot(hold.dx,hold.dy));dx=hold.dx*.22;dy=hold.dy*.12;fruitVX+=hold.dx*.002;if(hold.moved>22&&mode!=='squished')mode='squished'});
 function release(e){if(!hold||hold.id!==e.pointerId)return;if(c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId);if(hold.moved>18){impulse(.9,hold.dx);say('松手啦……我的桃肉还在往回赶。')}hold=null;dx=0;dy=0;mode=spoonOpen?'surprised':'calm'}
 c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
 $('poke').addEventListener('click',()=>poke(20));$('squish').addEventListener('click',squish);spoonBtn.addEventListener('click',toggleSpoon);
 $('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'♪ 声音：开':'♪ 声音：关';$('sound').setAttribute('aria-pressed',String(sound));if(sound)beep('poke')});
 window.addEventListener('resize',resize);resize();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
