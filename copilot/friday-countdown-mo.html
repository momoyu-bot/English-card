<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>mo小宝的周五倒计时小猫咪</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffeef8, #e8f0ff);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui;
  }
  .box {
    background: #ffffffcc;
    padding: 28px 32px;
    border-radius: 24px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
  }
  .cat {
    font-size: 48px;
    animation: float 2.4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  h1 {
    margin: 10px 0 6px;
    font-size: 22px;
    color: #333;
  }
  #count {
    font-size: 32px;
    margin: 10px 0;
    color: #ff6fa8;
    font-weight: 600;
  }
  p {
    margin: 6px 0;
    color: #666;
    font-size: 14px;
  }
  .tag {
    margin-top: 12px;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #ffe4f2;
    color: #c24a7a;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="cat">🐱</div>
    <h1>mo小宝，再撑一下下喵</h1>
    <div id="count">计算中…</div>
    <p>小猫咪陪你一起等下班。</p>
    <p>今天只要做到 70%，就已经很棒了喵。</p>
    <div class="tag">周五生存模式 · 小猫咪守护中</div>
  </div>

<script>
  function updateCountdown() {
    const now = new Date();
    const end = new Date();
    end.setHours(18, 0, 0, 0); // 下班时间 18:00

    let diff = end - now;
    if (diff < 0) diff = 0;

    const h = Math.floor(diff / 1000 / 60 / 60);
    const m = Math.floor(diff / 1000 / 60) % 60;
    const s = Math.floor(diff / 1000) % 60;

    document.getElementById("count").textContent =
      `距离下班还有 ${h} 小时 ${m} 分 ${s} 秒`;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
