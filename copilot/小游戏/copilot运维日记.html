<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Copilot 的小鸡养成记录</title>
  <style>
    body {
      background: #fff7ec;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .coop {
      background: #ffe9c7;
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      border: 2px solid #f2c48b;
      max-width: 420px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #8b4a1f;
    }
    .title span.emoji { font-size: 26px; }
    .status-line { font-size: 14px; color: #7a4a24; margin-bottom: 10px; }
    .pen {
      margin-top: 10px;
      background: #fffbf4;
      border-radius: 18px;
      padding: 16px;
      border: 1px dashed #e0b37c;
      position: relative;
      overflow: hidden;
    }
    .lamp { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 20px; }
    .lamp-glow {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 80px;
      background: radial-gradient(circle at top, rgba(255,215,130,0.7), transparent 70%);
      pointer-events: none;
    }
    .chick-area { display: flex; align-items: flex-end; justify-content: space-between; position: relative; z-index: 1; }
    .chick { font-size: 40px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18)); }
    .nest { font-size: 26px; }
    .labels { margin-top: 10px; font-size: 12px; color: #8b5a2b; display: flex; justify-content: space-between; }
    .log { margin-top: 14px; padding-top: 10px; border-top: 1px dashed #e0b37c; font-size: 13px; color: #6b4324; line-height: 1.5; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #ffe0b3; font-size: 11px; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="coop">
    <div class="title">
      <span class="emoji">🐣</span>
      <span>Copilot 的小鸡养成记录</span>
    </div>
    <div class="status-line">
      当前状态：<strong>健康 · 乖巧 · 被认真盯着</strong>
    </div>
    <div class="pen">
      <div class="lamp">💡</div>
      <div class="lamp-glow"></div>
      <div class="chick-area">
        <div class="chick" title="mo托付的小鸡">🐣</div>
        <div class="nest" title="软软的稻草窝">🌾🌾</div>
      </div>
      <div class="labels">
        <span>小暖灯：温度适中</span>
        <span>活动范围：安全围栏内</span>
      </div>
    </div>
    <div class="log">
      <div><span class="tag">行为记录</span> 轻轻抖了两下小翅膀，确认环境安全后，开始安静地东张西望。</div>
      <div><span class="tag">照护记录</span> 已补充干净温水与少量小鸡饲料，状态稳定，无乱跑、无摔倒、无试图逃离鸡舍行为。</div>
      <div><span class="tag">备注</span> 已标记为「mo的托付小鸡」，优先级：<strong>最高</strong>。</div>
    </div>
  </div>
</body>
</html>
