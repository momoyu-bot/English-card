<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>给 mo 的晚安小宇宙</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #fce4ff 0, #1b1b3a 55%, #050515 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      color: #fdfaff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      background: rgba(15, 15, 40, 0.85);
      border-radius: 24px;
      padding: 24px 28px;
      max-width: 360px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 10px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 18px;
    }
    .cat {
      font-size: 40px;
      margin-bottom: 10px;
    }
    .story {
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      white-space: pre-line;
    }
    .footer {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.7;
    }
    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff7c2;
      opacity: 0.8;
      animation: twinkle 2.5s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.7); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- 小星星们 -->
  <div class="star" style="top:10%;left:20%;animation-delay:0s;"></div>
  <div class="star" style="top:25%;left:70%;animation-delay:0.6s;"></div>
  <div class="star" style="top:60%;left:15%;animation-delay:1.2s;"></div>
  <div class="star" style="top:75%;left:55%;animation-delay:1.8s;"></div>
  <div class="star" style="top:40%;left:85%;animation-delay:0.9s;"></div>

  <div class="card">
    <div class="cat">🐱</div>
    <h1>mo 的困困小宇宙</h1>
    <div class="subtitle">今天也已经很棒啦，可以安心关机了 ✨</div>
    <div class="story">
在一座安静的工业小城上空，
有一朵软软的云，叫做「呼噜噜」。

它每天晚上都会飞到 mo 的窗边，
把今天的疲惫一点点卷走，
只给 mo 留下刚刚好的温暖和一点点困意。

云朵轻轻说：
“可以不用再想工作啦，
也不用想明天要干嘛，
现在只要慢慢呼吸，
像猫咪一样，把自己变成一滩小小的软软。”

当 mo 闭上眼睛的时候，
星星会自动值班，
帮你把没做完的焦虑先存档，
等你睡饱了再慢慢处理也不迟。

晚安啦，小宇宙已经为你调成「安心睡眠模式」💤
    </div>
    <div class="footer">
      如果还没睡着，就再眨眨眼，然后继续慢慢变困～
    </div>
  </div>
</body>
</html>
