    <style>
      :root {
        --ocean-bg: #0a0f1e;
        --card-bg: #111827;
        --card-hover: #1a2332;
        --cyan-accent: #06b6d4;
        --cyan-glow: rgba(6, 182, 212, 0.3);
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --rarity-common: #9ca3af;
        --rarity-uncommon: #4ade80;
        --rarity-rare: #60a5fa;
        --rarity-epic: #c084fc;
        --rarity-legendary: #fbbf24;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        background: var(--ocean-bg);
        color: var(--text-primary);
        font-family: 'Inter', system-ui, sans-serif;
      }

      /* Water ripple animation */
      @keyframes ripple {
        0% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.5); opacity: 0.1; }
        100% { transform: scale(2); opacity: 0; }
      }
      .water-ripple {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none; z-index: 0; overflow: hidden;
      }
      .water-ripple::before, .water-ripple::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(6, 182, 212, 0.15);
      }
      .water-ripple::before {
        width: 300px; height: 300px;
        bottom: -50px; right: -50px;
        animation: ripple 6s ease-in-out infinite;
      }
      .water-ripple::after {
        width: 200px; height: 200px;
        bottom: 50px; left: 30%;
        animation: ripple 8s ease-in-out infinite 2s;
      }

      /* Wave animation for header */
      @keyframes wave {
        0%, 100% { transform: translateX(0) translateY(0); }
        25% { transform: translateX(-5px) translateY(-2px); }
        75% { transform: translateX(5px) translateY(2px); }
      }
      .wave-text { animation: wave 3s ease-in-out infinite; display: inline-block; }

      /* Fish pop-in animation */
      @keyframes popIn {
        0% { transform: scale(0.5) translateY(10px); opacity: 0; }
        60% { transform: scale(1.1) translateY(-2px); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }
      .pop-in { animation: popIn 0.4s ease-out; }

      /* Legendary glow */
      @keyframes legendaryGlow {
        0%, 100% { text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24, 0 0 40px #f59e0b; }
        50% { text-shadow: 0 0 15px #fbbf24, 0 0 30px #fbbf24, 0 0 60px #f59e0b; }
      }
      .legendary-glow { animation: legendaryGlow 2s ease-in-out infinite; color: #fbbf24; }

      /* Mythic rainbow */
      @keyframes rainbow {
        0% { color: #ef4444; }
        16% { color: #f97316; }
        33% { color: #eab308; }
        50% { color: #22c55e; }
        66% { color: #3b82f6; }
        83% { color: #8b5cf6; }
        100% { color: #ef4444; }
      }
      @keyframes mythicPulse {
        0%, 100% { text-shadow: 0 0 20px rgba(236,72,153,0.5), 0 0 40px rgba(168,85,247,0.3); }
        50% { text-shadow: 0 0 30px rgba(59,130,246,0.5), 0 0 60px rgba(34,197,94,0.3); }
      }
      .mythic-rainbow {
        animation: rainbow 3s linear infinite, mythicPulse 2s ease-in-out infinite;
        font-weight: 700;
      }

      /* Event highlight box */
      .event-box {
        border-left: 3px solid #fbbf24;
        background: rgba(251, 191, 36, 0.08);
        padding: 8px 12px;
        border-radius: 0 8px 8px 0;
        margin: 4px 0;
      }

      /* Season banner */
      .season-banner {
        background: linear-gradient(90deg, transparent, rgba(6,182,212,0.1), transparent);
        border-top: 1px solid rgba(6,182,212,0.2);
        border-bottom: 1px solid rgba(6,182,212,0.2);
        padding: 10px 16px;
        text-align: center;
        margin: 6px 0;
      }

      /* Scrollbar styling */
      .game-log::-webkit-scrollbar { width: 6px; }
      .game-log::-webkit-scrollbar-track { background: transparent; }
      .game-log::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 3px; }
      .game-log::-webkit-scrollbar-thumb:hover { background: rgba(6,182,212,0.5); }

      /* Input styling */
      .cmd-input {
        background: #111827;
        border: 1px solid rgba(6,182,212,0.2);
        color: #e2e8f0;
        font-family: 'Courier New', monospace;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .cmd-input:focus {
        border-color: #06b6d4;
        box-shadow: 0 0 0 2px rgba(6,182,212,0.15);
      }

      /* Quick button */
      .quick-btn {
        background: rgba(6,182,212,0.1);
        border: 1px solid rgba(6,182,212,0.2);
        color: #67e8f9;
        cursor: pointer;
        transition: all 0.15s;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .quick-btn:hover {
        background: rgba(6,182,212,0.2);
        border-color: rgba(6,182,212,0.4);
      }

      /* Sidebar stat item */
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        font-size: 13px;
      }
      .stat-row:last-child { border-bottom: none; }

      /* Effect badge */
      .effect-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 500;
      }

      /* Encyclopedia modal */
      .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.7);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.active { display: flex; }
      .modal-content {
        background: #111827;
        border: 1px solid rgba(6,182,212,0.2);
        border-radius: 16px;
        width: 90%; max-width: 700px; max-height: 80vh;
        display: flex; flex-direction: column;
        overflow: hidden;
      }

      /* Sidebar mobile toggle */
      @media (max-width: 767px) {
        .sidebar { display: none; position: fixed; left:0; top:0; bottom:0; z-index: 50; width: 280px; }
        .sidebar.open { display: flex; }
        .sidebar-overlay { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.5); z-index: 49; }
        .sidebar-overlay.open { display: block; }
      }

    ];

    const RARITY_ORDER = ['common','uncommon','rare','epic','legendary','mythic'];
    const RARITY_NAMES = { common:'普通', uncommon:'少见', rare:'稀有', epic:'史诗', legendary:'传说', mythic:'神话' };
    const RARITY_COLORS = { common:'#9ca3af', uncommon:'#4ade80', rare:'#60a5fa', epic:'#c084fc', legendary:'#fbbf24', mythic:'#ec4899' };
    const RARITY_BASE_CHANCES = { common:0.55, uncommon:0.28, rare:0.12, epic:0.04, legendary:0.008, mythic:0.002 };

    const LUCKY_EVENTS = [
        { id:'triple_hook', name:'分裂鱼钩', desc:'鱼钩分叉，一竿上三条！', prob:0.25 },
        { id:'golden_touch', name:'点石成金', desc:'此鱼散发金光，价值×3！', prob:0.25 },
        { id:'fishing_frenzy', name:'渔获热潮', desc:'接下来3条渔获价值翻倍！', prob:0.20 },
        { id:'river_god', name:'河神祝福', desc:'接下来3竿不消耗鱼饵！', prob:0.15 },
        { id:'big_wave', name:'千载难逢的涨潮', desc:'罕见大鱼！', prob:0.10 },
        { id:'pearl_in_shell', name:'蚌中生珠', desc:'鱼腹中藏有珍珠！', prob:0.05 },
    ];

    const TREASURES = [
        { id:'pearl', name:'珍珠', value:80, emoji:'🫧' },
        { id:'ancient_coin', name:'古铜钱', value:150, emoji:'🪙' },
        { id:'jade_pendant', name:'翡翠玉佩', value:400, emoji:'💎' },
        { id:'mystery_crystal', name:'神秘水晶', value:800, emoji:'🔮' },
    ];

    const DRIFT_BOTTLE_MSGS = [
        '水中月是天上月，眼前人是心上人。',
        '大鱼不在浅水中，好事不在急忙中。',
        '独坐池边钓，风来波自起。',
        '江湖夜雨十年灯，渔火明灭几回曾。',
        '海阔凭鱼跃，天高任鸟飞。',
        '姜太公钓鱼，愿者上钩。',

        '溪水清且浅，可以濯我足。',

    ];

    // ===== GAME STATE =====
    let state;
    const SAVE_KEY = 'fishing_game_save';

    function defaultState() {
        const seed = Date.now();
        return {
            seed: seed,
            points: 200,
            turn: 0,
            season_idx: 0,
            location: 'moonlight_pond',
            unlocked_spots: ['moonlight_pond', 'reed_river'],
            baits: { basic_worm: 5 },
            inventory: [],
            encyclopedia: {},
            frenzy_count: 0,
            free_bait_count: 0,
            drift_bottles: [],
            stats: { total_fish: 0, total_earned: 0, legendary_caught: 0 },
            uid_counter: 0,
            cmd_history: [],
            first_run: true,
        };
    }

    function saveGame() {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
    }

    function loadGame() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (raw) {
                state = JSON.parse(raw);
                // Ensure all fields exist
                if (!state.uid_counter) state.uid_counter = 0;
                if (!state.cmd_history) state.cmd_history = [];
                if (!state.stats) state.stats = { total_fish:0, total_earned:0, legendary_caught:0 };
                if (!state.drift_bottles) state.drift_bottles = [];
                if (state.first_run === undefined) state.first_run = false;
                rng = mulberry32(state.seed + state.turn);
                return true;
            }
        } catch(e) {}
        return false;
    }

    function nextUid(prefix) {
        state.uid_counter++;
        return prefix + '_' + String(state.uid_counter).padStart(3, '0');
    }

    // ===== RNG HELPERS =====
    function roll() { return rng(); }
    function rollInt(min, max) { return Math.floor(rng() * (max - min + 1)) + min; }
    function pickRandom(arr) { return arr[Math.floor(rng() * arr.length)]; }

    // ===== LOG SYSTEM =====
    const logEl = document.getElementById('game-log');

    function addLog(html, cls='') {
        const div = document.createElement('div');
        div.className = 'mb-1 pop-in ' + cls;
        div.innerHTML = html;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function addSystemLog(text) {
        addLog(`<span style="color:#06b6d4">${text}</span>`);
    }

    function addMutedLog(text) {
        addLog(`<span style="color:#64748b; font-style:italic">${text}</span>`);
    }

    function turnTag() {
        return `<span style="color:#475569">[T${String(state.turn).padStart(3,'0')}]</span>`;
    }

    function raritySpan(text, rarity) {
        const c = RARITY_COLORS[rarity] || '#9ca3af';
        if (rarity === 'legendary') return `<span class="legendary-glow">${text}</span>`;
        if (rarity === 'mythic') return `<span class="mythic-rainbow">${text}</span>`;
        return `<span style="color:${c}">${text}</span>`;
    }

    function rarityPrefix(rarity) {
        if (rarity === 'rare') return '✦ ';
        if (rarity === 'epic') return '✦✦ ';
        if (rarity === 'legendary') return '✦✦✦ ';
        if (rarity === 'mythic') return '🌈 ';
        return '';
    }

    function statusLine() {
        const loc = SPOTS[state.location].name;
        const encCount = Object.keys(state.encyclopedia).length;
        return `<span style="color:#475569; font-size:11px">📊 pts:${state.points} | loc:${loc} | turn:${state.turn} | enc:${encCount}/${FISH_DB.length} | bait:${totalBaits()}</span>`;
    }

    function totalBaits() {
        let t = 0;
        for (const k in state.baits) t += state.baits[k];
        return t;
    }

    // ===== SEASON =====
    function currentSeason() { return SEASONS[state.season_idx % 4]; }
    function seasonNum() { return Math.floor(state.turn / 20) + 1; }
    function checkSeasonChange() {
        const newIdx = Math.floor(state.turn / 20) % 4;
        if (newIdx !== state.season_idx) {
            state.season_idx = newIdx;
            const s = currentSeason();
            addLog(`<div class="season-banner">━━━━━━━━━━━━━━━━━━━━━<br>${s.icon} 季节交替！第 ${seasonNum()} 季·${s.name} 到来<br>${s.text}<br>━━━━━━━━━━━━━━━━━━━━━</div>`);
        }
    }

    // ===== SIDEBAR UPDATE =====
    function updateSidebar() {
        const loc = SPOTS[state.location];
        document.getElementById('stat-location').textContent = loc.emoji + ' ' + loc.name;
        const s = currentSeason();
        document.getElementById('stat-season').textContent = `第${seasonNum()}季·${s.name} ${s.icon}`;
        document.getElementById('stat-points').textContent = state.points;

        let baitText = '';
        for (const k in state.baits) {
            if (state.baits[k] > 0) baitText += BAITS[k].name + ' ×' + state.baits[k] + ' ';
        }
        document.getElementById('stat-bait').textContent = baitText || '无';

        const fishCount = state.inventory.filter(i => i.type === 'fish').length;
        const itemCount = state.inventory.filter(i => i.type === 'item' || i.type === 'chest').length;
        document.getElementById('stat-inventory').textContent = `${fishCount}条鱼, ${itemCount}件物品`;
        document.getElementById('stat-enc').textContent = `${Object.keys(state.encyclopedia).length} / ${FISH_DB.length}`;
        document.getElementById('stat-turns').textContent = state.turn;

        // Effects
        const efEl = document.getElementById('active-effects');
        efEl.innerHTML = '';
        if (state.frenzy_count > 0) {
            efEl.innerHTML += `<div class="effect-badge" style="background:rgba(251,191,36,0.15);color:#fbbf24">🔥 渔获热潮 剩余${state.frenzy_count}条</div>`;
        }
        if (state.free_bait_count > 0) {
            efEl.innerHTML += `<div class="effect-badge" style="background:rgba(96,165,250,0.15);color:#60a5fa">🌊 河神祝福 剩余${state.free_bait_count}竿</div>`;
        }
    }

    // ===== FISHING LOGIC =====
    function rollRarity(bait) {
        const bonus = bait.rare_bonus;
        let chances = { ...RARITY_BASE_CHANCES };
        // Add bonus proportionally to rare+
        chances.rare += bonus * 0.5;
        chances.epic += bonus * 0.25;
        chances.legendary += bonus * 0.15;
        chances.mythic += bonus * 0.1;
        // Reduce common proportionally
        chances.common -= bonus;

        const r = roll();
        let cumulative = 0;
        for (const rarity of RARITY_ORDER) {
            cumulative += chances[rarity];
            if (r < cumulative) return rarity;
        }
        return 'common';
    }

    function getFishForSpotAndRarity(spot, rarity) {
        const matches = FISH_DB.filter(f => f.rarity === rarity && f.spots.includes(spot));
        if (matches.length > 0) return pickRandom(matches);
        // Downgrade
        const idx = RARITY_ORDER.indexOf(rarity);
        for (let i = idx - 1; i >= 0; i--) {
            const dm = FISH_DB.filter(f => f.rarity === RARITY_ORDER[i] && f.spots.includes(spot));
            if (dm.length > 0) return pickRandom(dm);
        }
        return FISH_DB[0]; // fallback
    }

    function doCast(baitId, forceRareUp) {
        const bait = BAITS[baitId];
        if (!bait) return { type: 'error', msg: '未知鱼饵类型' };

        // Consume bait
        if (state.free_bait_count > 0) {
            state.free_bait_count--;
        } else {
            if (!state.baits[baitId] || state.baits[baitId] <= 0) return { type: 'error', msg: `${bait.name} 已用完！` };
            state.baits[baitId]--;
        }

        state.turn++;
        rng = mulberry32(state.seed + state.turn);
        checkSeasonChange();

        const result = { type: 'cast', events: [], fish: [], items: [], bottles: [], chests: [], baitUsed: baitId };

        // Check bite
        if (roll() > bait.bite_rate) {
            result.type = 'miss';
            return result;
        }

        // Check lucky event (5% of successful catches)
        let luckyEvent = null;
        if (roll() < 0.05) {
            const er = roll();
            let cum = 0;
            for (const ev of LUCKY_EVENTS) {
                cum += ev.prob;
                if (er < cum) { luckyEvent = ev; break; }
            }
        }

        // Force rare up from big_wave event
        let rarity;
        if (forceRareUp || (luckyEvent && luckyEvent.id === 'big_wave')) {
            const rareRarities = ['rare','epic','legendary','mythic'];
            rarity = pickRandom(rareRarities);
        } else {
            rarity = rollRarity(bait);
        }

        const fish = getFishForSpotAndRarity(state.location, rarity);
        let fishValue = fish.value;

        // Apply frenzy
        if (state.frenzy_count > 0) {
            fishValue *= 2;
            state.frenzy_count--;
            result.events.push({ text: '🔥 渔获热潮生效，价值翻倍！' });
        }

        // Apply golden touch
        if (luckyEvent && luckyEvent.id === 'golden_touch') {
            fishValue *= 3;
        }

        // Register in encyclopedia
        let isNew = false;
        if (!state.encyclopedia[fish.id]) {
            state.encyclopedia[fish.id] = {
                first_caught_loc: state.location,
                first_caught_season: state.season_idx,
                count: 0
            };
            isNew = true;
        }
        state.encyclopedia[fish.id].count++;
        state.stats.total_fish++;
        if (fish.rarity === 'legendary' || fish.rarity === 'mythic') state.stats.legendary_caught++;

        // Handle lucky events
        if (luckyEvent) {
            result.events.push({ id: luckyEvent.id, text: `⚡ ${luckyEvent.name} — ${luckyEvent.desc}` });
            if (luckyEvent.id === 'fishing_frenzy') state.frenzy_count += 3;
            if (luckyEvent.id === 'river_god') state.free_bait_count += 3;
            if (luckyEvent.id === 'pearl_in_shell') {
                const treasure = pickRandom(TREASURES);
                const uid = nextUid('item');
                state.inventory.push({ uid, type:'item', id: treasure.id, name: treasure.name, value: treasure.value, emoji: treasure.emoji });
                result.items.push(treasure);
            }
        }

        // Triple hook: catch 3 fish total
        let catchCount = 1;
        if (luckyEvent && luckyEvent.id === 'triple_hook') catchCount = 3;

        for (let i = 0; i < catchCount; i++) {
            let f = i === 0 ? fish : getFishForSpotAndRarity(state.location, rollRarity(bait));
            let v = i === 0 ? fishValue : f.value;
            if (i > 0 && state.frenzy_count > 0) { v *= 2; state.frenzy_count--; }
            const uid = nextUid('fish');
            state.inventory.push({ uid, type:'fish', id: f.id, name: f.name, rarity: f.rarity, value: v, emoji: f.emoji });
            result.fish.push({ ...f, actualValue: v, uid, isNew: i === 0 ? isNew : (!state.encyclopedia[f.id]) });
            if (i > 0 && !state.encyclopedia[f.id]) {
                state.encyclopedia[f.id] = { first_caught_loc: state.location, first_caught_season: state.season_idx, count: 0 };
            }
            if (i > 0) { state.encyclopedia[f.id].count++; state.stats.total_fish++; }
        }

        // Drift bottle (3%)
        if (roll() < 0.03) {
            const msg = pickRandom(DRIFT_BOTTLE_MSGS);
            const bonus = rollInt(20, 80);
            state.points += bonus;
            state.drift_bottles.push(msg);
            result.bottles.push({ msg, bonus });
        }

        // Treasure chest (2%)
        if (roll() < 0.02) {
            const uid = nextUid('chest');
            state.inventory.push({ uid, type:'chest', name:'宝箱' });
            result.chests.push({ uid });
        }

        return result;
    }

    function displayCastResult(result) {
        if (result.type === 'error') {
            addLog(`<span style="color:#ef4444">❌ ${result.msg}</span>`);
            return;
        }
        if (result.type === 'miss') {
            addMutedLog(`${turnTag()} 空军... 水面毫无动静。`);
            addLog(statusLine());
            return;
        }

        // Show events first
        for (const ev of result.events) {
            addLog(`<div class="event-box">⚡ ${ev.text}</div>`);
        }

        // Show fish catches
        for (const f of result.fish) {
            const rn = RARITY_NAMES[f.rarity];
            const prefix = rarityPrefix(f.rarity);

            if (f.rarity === 'mythic') {
                addLog(`<div style="text-align:center;padding:12px 0">
                    <div class="mythic-rainbow" style="font-size:18px">🌈🌈🌈 神话降临 🌈🌈🌈</div>
                    <div style="color:#94a3b8;margin:4px 0">天地变色，水面涌现七彩光柱——</div>
                    <div style="color:#94a3b8">传说中只存在于古籍里的存在，竟真实地挂在了你的鱼钩上！</div>
                    <div class="mythic-rainbow" style="font-size:20px;margin:8px 0">🌈 ${f.name} 🌈</div>
                    <div style="color:#fbbf24">价值: ${f.actualValue} 点</div>
                    <div style="color:#c084fc;margin-top:4px">这一刻，你成为了钓鱼界的传说。</div>
                </div>`);
            } else if (f.rarity === 'legendary') {
                addLog(`<div style="text-align:center;padding:8px 0">
                    <div class="legendary-glow" style="font-size:16px">⚡⚡⚡ 传说级渔获 ⚡⚡⚡</div>
                    <div style="color:#94a3b8;margin:4px 0">鱼线绷紧到极限，水面掀起巨浪！</div>
                    <div style="color:#94a3b8">一道金光从水底冲出————</div>
                    <div class="legendary-glow" style="font-size:18px;margin:6px 0">✦✦✦ ${f.emoji} ${f.name} ✦✦✦</div>
                    <div style="color:#fbbf24">价值: ${f.actualValue} 点</div>
                </div>`);
            } else {
                const newTag = f.isNew ? ' <span style="color:#22d3ee;font-size:11px">[新发现!]</span>' : '';
                addLog(`${turnTag()} ${prefix}${f.emoji} ${raritySpan(f.name, f.rarity)} <span style="color:#64748b">(${rn})</span> — ${f.actualValue}点${newTag}`);
            }
        }

        // Bottles
        for (const b of result.bottles) {
            addLog(`<div style="background:rgba(6,182,212,0.08);border-left:3px solid #06b6d4;padding:8px 12px;border-radius:0 8px 8px 0;margin:4px 0">🍾 发现漂流瓶！<br><span style="color:#94a3b8;font-style:italic">"${b.msg}"</span><br><span style="color:#fbbf24">+${b.bonus} 点</span></div>`);
        }

        // Chests
        for (const c of result.chests) {
            addLog(`<div style="background:rgba(251,191,36,0.08);border-left:3px solid #fbbf24;padding:8px 12px;border-radius:0 8px 8px 0;margin:4px 0">📦 发现宝箱！(${c.uid})<br><span style="color:#94a3b8">使用 open ${c.uid} 打开</span></div>`);
        }

        // Items from events
        for (const it of result.items) {
            addLog(`<span style="color:#c084fc">${it.emoji} 获得 ${it.name}！(价值 ${it.value} 点)</span>`);
        }

        addLog(statusLine());
    }

    // ===== COMMANDS =====
    function cmd(input) {
        input = input.trim();
        if (!input) return;

        // Save to history
        if (state.cmd_history[state.cmd_history.length - 1] !== input) {
            state.cmd_history.push(input);
            if (state.cmd_history.length > 20) state.cmd_history.shift();
        }

        // Handle semicolons
        if (input.includes(';')) {
            const parts = input.split(';').map(s => s.trim()).filter(s => s);
            for (const p of parts) {
                addLog(`<span style="color:#06b6d4">▶ ${p}</span>`);
                processCommand(p);
            }
            saveGame();
            updateSidebar();
            return;
        }

        processCommand(input);
        saveGame();
        updateSidebar();
    }

    function processCommand(input) {
        const parts = input.toLowerCase().split(/\s+/);
        const command = parts[0];
        const args = parts.slice(1);

        switch(command) {
            case 'help': cmdHelp(); break;
            case 'status': cmdStatus(); break;
            case 'shop': cmdShop(); break;
            case 'buy': cmdBuy(args); break;
            case 'cast': cmdCast(args); break;
            case 'goto': cmdGoto(args); break;
            case 'inventory': case 'inv': cmdInventory(); break;
            case 'sell': cmdSell(args); break;
            case 'open': cmdOpen(args); break;
            case 'encyclopedia': case 'enc': cmdEncyclopedia(); break;
            case 'look': cmdLook(args); break;
            case 'new_game': cmdNewGame(args); break;
            default:
                addLog(`<span style="color:#ef4444">❓ 未知指令: "${command}"</span>`);
                addMutedLog('输入 help 查看可用指令');
        }
    }

    function cmdHelp() {
        addLog(`<div style="color:#06b6d4;border:1px solid rgba(6,182,212,0.2);border-radius:8px;padding:12px;background:rgba(6,182,212,0.05)">
<b>📋 指令列表</b>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
<b>cast [鱼饵] [数量] [stop=条件]</b>
  抛竿钓鱼。可指定鱼饵ID和次数(1-20)
  stop=new 发现新鱼停止 | stop=rare 稀有+停止 | stop=event 事件停止

<b>status</b> — 查看当前状态详情

💡 提示: 可用 ";" 连接多个指令，如 "buy basic_worm 10; cast basic_worm 5"

    }

    function cmdStatus() {
        const loc = SPOTS[state.location];
        const s = currentSeason();
        const encCount = Object.keys(state.encyclopedia).length;
        let baitLines = '';
        for (const k in BAITS) {
            const qty = state.baits[k] || 0;
            if (qty > 0) baitLines += `  ${BAITS[k].name}: ${qty}\n`;
        }
        if (!baitLines) baitLines = '  无\n';

        let effectLines = '';
        if (state.frenzy_count > 0) effectLines += `  🔥 渔获热潮 剩余${state.frenzy_count}条\n`;

    function cmdCast(args) {
        // Parse args: cast [bait_id] [N] [stop=condition]
        let baitId = null;
        let count = 1;
        let stopCondition = null;

        for (const a of args) {
            if (a.startsWith('stop=')) {
                stopCondition = a.split('=')[1];
            } else if (BAITS[a]) {
                baitId = a;
            } else if (!isNaN(parseInt(a))) {
                count = Math.min(20, Math.max(1, parseInt(a)));
            }
        }

        // Find cheapest available bait if none specified
        if (!baitId) {
            let cheapest = null;
            let cheapestPrice = Infinity;
            for (const k in state.baits) {
                if (state.baits[k] > 0 && BAITS[k] && BAITS[k].price < cheapestPrice) {
                    cheapest = k;
                    cheapestPrice = BAITS[k].price;
                }
            }
            baitId = cheapest;
        }

        if (!baitId || !state.baits[baitId] || state.baits[baitId] <= 0) {
            addLog('<span style="color:#ef4444">❌ 没有鱼饵！请先 buy basic_worm</span>');
            return;
        }

        if (count === 1) {
            const result = doCast(baitId, false);
            displayCastResult(result);
            return;
        }

        // Multi-cast
        addSystemLog(`🎣 连续抛竿 ${count} 次 (${BAITS[baitId].name})...`);
        const catchSummary = {};
        let totalEarned = 0;
        let notableCatches = [];
        let stopped = false;

        for (let i = 0; i < count; i++) {
            if (!state.baits[baitId] && state.free_bait_count <= 0) {
                addMutedLog(`鱼饵用尽，第 ${i+1} 竿中断`);
                break;
            }
            if ((!state.baits[baitId] || state.baits[baitId] <= 0) && state.free_bait_count <= 0) {
                addMutedLog(`鱼饵用尽，第 ${i+1} 竿中断`);
                break;
            }

            const result = doCast(baitId, false);

            if (result.type === 'error') { addLog(`<span style="color:#ef4444">${result.msg}</span>`); break; }
            if (result.type === 'miss') {
                catchSummary['__miss'] = (catchSummary['__miss'] || 0) + 1;
                continue;
            }

            // Process fish
            for (const f of result.fish) {
                if (RARITY_ORDER.indexOf(f.rarity) >= 2) { // rare+
                    notableCatches.push(f);
                    if (stopCondition === 'rare') stopped = true;
                } else {
                    const key = f.id;
                    if (!catchSummary[key]) catchSummary[key] = { fish: f, count: 0, totalValue: 0 };
                    catchSummary[key].count++;
                    catchSummary[key].totalValue += f.actualValue;
                }
                if (f.isNew && stopCondition === 'new') stopped = true;
            }

            // Show events
            for (const ev of result.events) {
                addLog(`<div class="event-box">⚡ ${ev.text}</div>`);
                if (stopCondition === 'event') stopped = true;
            }
            for (const b of result.bottles) {
                addLog(`<span style="color:#06b6d4">🍾 漂流瓶: "${b.msg}" (+${b.bonus}点)</span>`);
                if (stopCondition === 'event') stopped = true;
            }
            for (const c of result.chests) {
                addLog(`<span style="color:#fbbf24">📦 发现宝箱 ${c.uid}</span>`);
            }

            if (stopped) { addMutedLog(`满足停止条件 (${stopCondition})，第 ${i+2} 竿停止`); break; }
        }

        // Print summary
        addLog('<span style="color:#06b6d4">── 抛竿结果汇总 ──</span>');
        if (catchSummary['__miss']) {
            addMutedLog(`空军 ×${catchSummary['__miss']}`);
        }
        for (const key in catchSummary) {
            if (key === '__miss') continue;
            const s = catchSummary[key];
            addLog(`${s.fish.emoji} ${raritySpan(s.fish.name, s.fish.rarity)} ×${s.count} <span style="color:#64748b">(共 ${s.totalValue} 点)</span>`);
        }
        for (const f of notableCatches) {
            displayCastResult({ type:'cast', events:[], fish:[f], items:[], bottles:[], chests:[] });
        }
        addLog(statusLine());
    }

    function cmdGoto(args) {
        if (args.length === 0) {
            // List spots
            let lines = '<b>🗺️ 可用钓点</b>\n━━━━━━━━━━━━━━━━━━━━\n';
            for (const k in SPOTS) {
                const s = SPOTS[k];
                const unlocked = state.unlocked_spots.includes(k);
                const lock = unlocked ? '✅' : '🔒';
                const costText = s.cost === 0 ? '免费' : s.cost + '点';
                const current = k === state.location ? ' ← 当前' : '';

                // Count unseen fish for this spot
                let unseenCount = 0;
                if (unlocked) {
                    const spotFish = FISH_DB.filter(f => f.spots.includes(k));
                    unseenCount = spotFish.filter(f => !state.encyclopedia[f.id]).length;
                }
                const unseenText = unlocked ? ` (本季有 ${unseenCount} 种未见鱼)` : '';

                lines += `${lock} ${s.emoji} <b>${s.name}</b> (${k}) — ${costText}${current}\n`;
                lines += `   <span style="color:#64748b">${s.desc}${unseenText}</span>\n`;
            }
            lines += '\n<span style="color:#64748b">用法: goto &lt;地点ID&gt;</span>';
            addLog(`<div style="background:rgba(6,182,212,0.05);border:1px solid rgba(6,182,212,0.15);border-radius:8px;padding:12px">${lines}</div>`);
            return;
        }

        const spotId = args[0];
        const spot = SPOTS[spotId];
        if (!spot) { addLog(`<span style="color:#ef4444">❌ 未知地点: ${spotId}</span>`); return; }

        if (spotId === state.location) { addMutedLog(`你已经在 ${spot.name} 了`); return; }

        if (!state.unlocked_spots.includes(spotId)) {
            if (state.points < spot.cost) {
                addLog(`<span style="color:#ef4444">❌ 解锁 ${spot.name} 需要 ${spot.cost} 点，当前 ${state.points} 点</span>`);
                return;
            }
            state.points -= spot.cost;
            state.unlocked_spots.push(spotId);
            addSystemLog(`🔓 解锁了 ${spot.name}！花费 ${spot.cost} 点`);
        }

        state.location = spotId;
        addLog(`<div style="background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.15);border-radius:8px;padding:12px;text-align:center">
📍 抵达 <b>${spot.emoji} ${spot.name}</b>
<span style="color:#94a3b8">${spot.desc}</span>
</div>`);
    }

    function cmdSell(args) {
        if (args.length === 0) {
            addLog('<span style="color:#ef4444">用法: sell &lt;ID&gt; | sell all | sell species &lt;鱼ID&gt; | sell item &lt;物品ID&gt;</span>');
            return;

        if (args[0] === 'all') {
            const sellable = state.inventory.filter(i => i.type === 'fish' || i.type === 'item');
            if (sellable.length === 0) { addMutedLog('渔篓里没有可卖的东西'); return; }
            let total = 0;
            for (const s of sellable) total += s.value;
            state.inventory = state.inventory.filter(i => i.type === 'chest');
            state.points += total;
            state.stats.total_earned += total;
            addSystemLog(`💰 已售出 ${sellable.length} 件物品，获得 ${total} 点！`);
            return;
        }

        if (args[0] === 'species' && args[1]) {
            const fishId = args[1];
            const toSell = state.inventory.filter(i => i.type === 'fish' && i.id === fishId);
            if (toSell.length === 0) { addMutedLog(`没有找到 ${fishId}`); return; }
            let total = 0;
            for (const s of toSell) total += s.value;
            state.inventory = state.inventory.filter(i => !(i.type === 'fish' && i.id === fishId));
            state.points += total;
            state.stats.total_earned += total;
            addSystemLog(`💰 已售出 ${toSell[0].name} ×${toSell.length}，获得 ${total} 点！`);
            return;
        }

        if (args[0] === 'item' && args[1]) {
            const itemId = args[1];
            const idx = state.inventory.findIndex(i => i.type === 'item' && i.id === itemId);
            if (idx === -1) { addMutedLog(`没有找到物品 ${itemId}`); return; }
            const item = state.inventory.splice(idx, 1)[0];
            state.points += item.value;
            state.stats.total_earned += item.value;
            addSystemLog(`💰 已售出 ${item.name}，获得 ${item.value} 点！`);
            return;
        }

        // Sell by uid
        const uid = args[0];
        const idx = state.inventory.findIndex(i => i.uid === uid && (i.type === 'fish' || i.type === 'item'));
        if (idx === -1) { addLog(`<span style="color:#ef4444">❌ 未找到: ${uid}</span>`); return; }
        const item = state.inventory.splice(idx, 1)[0];
        state.points += item.value;
        state.stats.total_earned += item.value;
        addSystemLog(`💰 已售出 ${item.emoji} ${item.name}，获得 ${item.value} 点！`);
    }

    function cmdOpen(args) {
        if (args.length === 0) { addLog('<span style="color:#ef4444">用法: open &lt;宝箱ID&gt;</span>'); return; }
        const uid = args[0];
        const idx = state.inventory.findIndex(i => i.uid === uid && i.type === 'chest');
        if (idx === -1) { addLog(`<span style="color:#ef4444">❌ 未找到宝箱: ${uid}</span>`); return; }

        state.inventory.splice(idx, 1);
        rng = mulberry32(state.seed + state.turn + uid.charCodeAt(uid.length-1));

        if (roll() < 0.6) {
            // Item
            const treasure = pickRandom(TREASURES);
            const tuid = nextUid('item');
            state.inventory.push({ uid: tuid, type:'item', id: treasure.id, name: treasure.name, value: treasure.value, emoji: treasure.emoji });
            addLog(`<div class="event-box">📦 打开宝箱 ${uid}...<br>${treasure.emoji} 获得 <b>${treasure.name}</b>！(价值 ${treasure.value} 点)</div>`);
        } else {
            // Points
            const pts = rollInt(50, 300);

            addLog(`<div class="event-box">📦 打开宝箱 ${uid}...<br>💰 获得 <b>${pts} 点</b>！</div>`);

        rng = mulberry32(state.seed + state.turn);

        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (state.cmd_history.length > 0 && historyIdx > 0) {
                historyIdx--;
                cmdInput.value = state.cmd_history[historyIdx];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIdx < state.cmd_history.length - 1) {
                historyIdx++;
                cmdInput.value = state.cmd_history[historyIdx];
            } else {
                historyIdx = state.cmd_history.length;
                cmdInput.value = '';
            }
        }
    });

    // ===== QUICK BUTTONS =====
    document.querySelectorAll('.sidebar-cmd').forEach(btn => {
        btn.addEventListener('click', function() {
            const c = this.dataset.cmd;
            if (c === 'enc') { showEncyclopediaModal(); return; }
            addLog(`<span style="color:#22d3ee">❯ ${c}</span>`);
            cmd(c);
            // Close mobile sidebar
            document.getElementById('sidebar-panel').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        });
    });

    document.querySelectorAll('.chip-cmd').forEach(btn => {
        btn.addEventListener('click', function() {
            const c = this.dataset.cmd;
            if (c === 'enc') { showEncyclopediaModal(); return; }
            addLog(`<span style="color:#22d3ee">❯ ${c}</span>`);
            cmd(c);
        });
    });

    // ===== MOBILE SIDEBAR =====
    document.getElementById('sidebar-toggle-btn').addEventListener('click', function() {
        document.getElementById('sidebar-panel').classList.add('open');
        document.getElementById('sidebar-overlay').classList.add('open');
    });

    document.getElementById('sidebar-close-btn').addEventListener('click', function() {
        document.getElementById('sidebar-panel').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('open');
    });

    document.getElementById('sidebar-overlay').addEventListener('click', function() {
        document.getElementById('sidebar-panel').classList.remove('open');
        this.classList.remove('open');
    });

    // ===== ENCYCLOPEDIA MODAL =====
    document.getElementById('enc-close-btn').addEventListener('click', function() {
        document.getElementById('enc-modal').classList.remove('active');
    });

    document.getElementById('enc-modal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    document.getElementById('enc-mobile-btn').addEventListener('click', function() {
        showEncyclopediaModal();
    });

    document.querySelectorAll('.enc-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.enc-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            this.style.background = 'rgba(6,182,212,0.3)';
            document.querySelectorAll('.enc-tab').forEach(t => {
                if (!t.classList.contains('active')) t.style.background = '';
            });
            renderEncGrid(this.dataset.rarity);
        });
    });

    // ===== INIT =====
    if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
        lucide.createIcons();
    }

    const loaded = loadGame();
    if (!loaded) {
        state = defaultState();
        rng = mulberry32(state.seed);
        showWelcome();
        saveGame();
    } else {
        rng = mulberry32(state.seed + state.turn);
        addSystemLog('💾 读取存档成功！欢迎回来，mo！');
        addLog(statusLine());
    }

    updateSidebar();
    historyIdx = state.cmd_history.length;
    cmdInput.focus();
    </script>
</body>
</html>
