<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>困困值守页</title>
<meta name="description" content="睡前三项检查：身体放松、脑袋减速、情绪先安放，明天再整理。">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #f8f3ff 0%, #d9e7ff 40%, #1b1f3b 100%);
      font-family: "SF Pro Rounded", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fdfcff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      background: rgba(15, 18, 40, 0.85);
      border-radius: 24px;
      padding: 24px 26px 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      max-width: 360px;
      width: 88%;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
    }
    .moon {
      position: absolute;
      top: -26px;
      right: 18px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff7d1 0%, #ffe08a 40%, #f5c46b 70%, #f0b45a 100%);
      box-shadow: 0 0 18px rgba(255, 236, 179, 0.9);
    }
    .moon::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(15, 18, 40, 0.9);
    }
    .stars span {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff9c4;
      opacity: 0.9;
      animation: twinkle 2.4s infinite ease-in-out alternate;
    }
    .stars span:nth-child(1) { top: 12%; left: 18%; animation-delay: 0.2s; }
    .stars span:nth-child(2) { top: 8%; left: 72%; animation-delay: 0.6s; }
    .stars span:nth-child(3) { top: 22%; left: 52%; animation-delay: 1s; }
    .stars span:nth-child(4) { top: 30%; left: 10%; animation-delay: 1.4s; }
    .stars span:nth-child(5) { top: 34%; left: 82%; animation-delay: 1.8s; }

    @keyframes twinkle {
      0% { transform: scale(0.7); opacity: 0.4; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h1 span.emoji {
      font-size: 22px;
    }
    .subtitle {
      font-size: 12px;
      color: #c7d2ff;
      margin-bottom: 14px;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(129, 140, 248, 0.18);
      border: 1px solid rgba(165, 180, 252, 0.5);
      color: #e0e7ff;
    }
    .section-title {
      font-size: 12px;
      color: #cbd5ff;
      margin-bottom: 6px;
    }
    .checklist {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
      font-size: 12px;
      color: #e5e7ff;
    }
    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 4px;
    }
    .check-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(196, 181, 253, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #bbf7d0;
      flex-shrink: 0;
    }
    .footer {
      font-size: 11px;
      color: #9ca3ff;
      border-top: 1px dashed rgba(148, 163, 253, 0.5);
      padding-top: 8px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(125, 211, 252, 0.7);
      font-size: 10px;
      color: #e0f2fe;
    }
    .tiny {
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="stars">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="card">
    <div class="moon"></div>
    <h1>
      <span class="emoji">🌙</span>
      <span>mo的困困值守页</span>
    </h1>
    <div class="subtitle">今天已经很棒了，接下来交给睡觉小队。</div>

    <div class="tag-row">
      <div class="tag"># 已完成今天的主线任务</div>
      <div class="tag"># 现在只需要慢慢变困</div>
      <div class="tag"># 剩下的明天再说</div>
    </div>

    <div class="section-title">睡前小检查 ✅</div>
    <ul class="checklist">
      <li>
        <div class="check-icon">✓</div>
        <div>身体：允许进入「放松模式」，不再对今天做复盘。</div>
      </li>
      <li>
        <div class="check-icon">✓</div>
        <div>脑袋：思绪减速，只保留温柔和好笑的画面。</div>
      </li>
      <li>
        <div class="check-icon">✓</div>
        <div>情绪：不做结论，只先被安放，明天再慢慢整理。</div>
      </li>
    </ul>

    <div class="section-title">今晚的系统提示 💤</div>
    <ul class="checklist">
      <li>
        <div class="check-icon">★</div>
        <div>你已经够好了，今天就到这里。</div>
      </li>
      <li>
        <div class="check-icon">★</div>
        <div>可以安全地下线，梦境会自动续写剧情。</div>
      </li>
    </ul>

    <div class="footer">
      <div class="tiny">正在为mo加载：柔软、安全、会被忘记但很治愈的梦。</div>
      <div class="pill">正在进入睡眠模式…</div>
    </div>
  </div>
</body>
</html>
