<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG 全息闪光小卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0e0e1a;
      --bg-mid: #1a1030;
      --text-soft: #e8d5ff;
      --gold: #ffd700;
      --gold-light: #fff8c0;
      --gold-dark: #c8a400;
      --pink: #ffb7d5;
      --pink-deep: #ff8fab;
      --cyan: #7eeeff;
      --cyan-light: #a0e8ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-mid) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.035;
      pointer-events: none;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      color: var(--text-soft);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      margin-top: 3rem;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .cards-wrap {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
      padding: 0 1rem;
    }

    .holo-card {
      width: 180px;
      height: 280px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      transition: transform 0.45s cubic-bezier(.25,.8,.25,1),
                  box-shadow 0.45s cubic-bezier(.25,.8,.25,1);
      flex-shrink: 0;
    }

    /* Entrance animation */
    .holo-card { opacity: 0; animation: fadeInUp 0.8s ease forwards; }
    .holo-card:nth-child(1) { animation-delay: 0.1s; }
    .holo-card:nth-child(2) { animation-delay: 0.25s; }
    .holo-card:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Hover glow per card */
    .holo-card.card-luna:hover    { box-shadow: 0 12px 60px rgba(255,215,0,0.35), 0 0 30px rgba(255,215,0,0.15); }
    .holo-card.card-sakura:hover  { box-shadow: 0 12px 60px rgba(255,183,213,0.35), 0 0 30px rgba(255,143,171,0.15); }
    .holo-card.card-crystal:hover { box-shadow: 0 12px 60px rgba(126,232,255,0.35), 0 0 30px rgba(126,232,255,0.15); }

    .card-bg {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      z-index: 1;
    }
    .card-bg svg { width: 100%; height: 100%; }

    /* Holographic overlay */
    .holo-overlay {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: conic-gradient(
        from 0deg,
        #ff6eb4, #ffb347, #ffe066, #74f7a0, #7ec8ff, #c77dff, #ff6eb4
      );
      mix-blend-mode: color-dodge;
      animation: holoSpin 3s linear infinite paused;
      pointer-events: none;
    }
    .holo-card:hover .holo-overlay {
      opacity: 0.5;
      animation-play-state: running;
    }

    @keyframes holoSpin {
      from { filter: hue-rotate(0deg); }
      to   { filter: hue-rotate(360deg); }
    }

    /* Scan-line light sweep */
    .holo-sweep {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .holo-sweep::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,255,255,0.25) 45%,
        rgba(255,255,255,0.45) 50%,
        rgba(255,255,255,0.25) 55%,
        transparent 70%
      );
      transform: skewX(-15deg);
    }
    .holo-card:hover .holo-sweep { opacity: 1; }
    .holo-card:hover .holo-sweep::before {
      animation: sweepLight 1.2s ease-in-out infinite;
    }

    @keyframes sweepLight {
      0%   { left: -100%; }
      100% { left: 160%; }
    }

    /* Card name area */
    .card-name {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    .card-name .name {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      letter-spacing: 0.3em;
      font-weight: 600;
    }
    .card-name .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      margin-top: 2px;
      letter-spacing: 0.15em;
    }

    /* Footer hint */
    .hint-text {
      color: rgba(232, 213, 255, 0.45);
      font-size: 12px;
      letter-spacing: 0.15em;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    footer {
      margin-top: auto;
      padding: 2rem 0 1.5rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    footer p { font-size: 11px; color: rgba(232, 213, 255, 0.3); }

    @media (max-width: 600px) {
      .cards-wrap { flex-direction: column; gap: 2rem; }
      .page-title { font-size: 1.2rem; margin-top: 2rem; margin-bottom: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- SVG Noise Filter -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden;">
    <defs>
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
    </defs>
  </svg>
  <div style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.04;">
    <svg width="100%" height="100%"><rect width="100%" height="100%" filter="url(#noiseFilter)"/></svg>
  </div>

  <h1 class="page-title">✦ 小卡图鉴 ✦</h1>

          <circle cx="130" cy="140" r="1.1" fill="#fff" opacity="0.2"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.2s" repeatCount="indefinite"/></circle>

          <circle cx="15"  cy="180" r="1.2" fill="#fff" opacity="0.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
          <circle cx="55"  cy="200" r="0.8" fill="#fff" opacity="0.35"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.9s" repeatCount="indefinite"/></circle>

          <circle cx="35"  cy="210" r="0.9" fill="#fff" opacity="0.3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
          <circle cx="150" cy="200" r="1.3" fill="#fff" opacity="0.2"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.4s" repeatCount="indefinite"/></circle>

      </div>
      <div class="card-name">

          </g>

              <stop offset="100%" stop-color="#0099cc"/>

            <filter id="rayGlow">

              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>

          </defs>

          <rect width="180" height="280" rx="16" fill="url(#crystalBg)"/>

  <p class="hint-text">✦ hover 卡片查看全息效果 ✦</p>

  <script>
    // Mouse-follow 3D tilt on hover
    document.querySelectorAll('.holo-card').forEach(function(card) {
      card.addEventListener('mousemove', function(e) {
        var rect = card.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var rotateX = ((y - rect.height / 2) / rect.height * 2) * -8;
        var rotateY = ((x - rect.width  / 2) / rect.width  * 2) *  8;
        card.style.transform =
          'perspective(600px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) translateY(-10px)';
      });
      card.addEventListener('mouseleave', function() {
        card.style.transform = '';
      });
    });
  </script>
