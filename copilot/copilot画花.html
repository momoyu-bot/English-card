<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>花花小卡片</title>
  <style>
    body {
      background: #fdf2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Segoe UI", system-ui;
    }
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px 32px;
      box-shadow: 0 8px 20px rgba(255, 150, 200, 0.25);
      text-align: center;
    }
    .flowers {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .text {
      color: #ff7aa2;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flowers">🌷🌸🌷🌸🌷</div>
    <div class="text">送你一小束可爱花花，今天也要温柔一点～</div>
  </div>
</body>
</html>
