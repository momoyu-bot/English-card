<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星际矿工 - 宝石收集游戏</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0a0a1a;
      --bg-mid: #12122a;
      --neon-blue: #00d4ff;
      --neon-purple: #b040ff;
      --neon-pink: #ff2d95;
      --neon-gold: #ffd700;
      --neon-green: #00ff88;
      --hud-bg: rgba(10, 10, 26, 0.85);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: #e0e0ff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      /* prevent iOS bounce */
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }

    /* Stars background */
    .stars-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.15; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      background: var(--hud-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(100,100,255,0.15);
      padding: 8px 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }
    #hud .hud-item {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    #hud .lives { color: #ff4466; }
    #hud .score-val { color: var(--neon-blue); }
    #hud .high-val { color: var(--neon-gold); }
    #hud .level-val { color: var(--neon-green); }

    /* Touch controls */
    #touch-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: none;
      justify-content: space-between;
      padding: 12px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.12);
      border: 2px solid rgba(0, 212, 255, 0.35);
      color: rgba(0, 212, 255, 0.8);
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(0, 212, 255, 0.3);
      border-color: rgba(0, 212, 255, 0.7);
      color: rgba(0, 212, 255, 1);
    }

    /* Overlay screens */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 15, 0.92);
      backdrop-filter: blur(12px);
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }

    .title-text {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(0,212,255,0.4));
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .subtitle {
      font-size: clamp(0.9rem, 3vw, 1.25rem);
      color: rgba(200, 200, 255, 0.7);
      margin-bottom: 24px;
    }
    .controls-guide {
      font-size: 13px;
      color: rgba(180, 180, 220, 0.55);
      margin-bottom: 32px;
      line-height: 1.7;
    }
    .neon-btn {
      padding: 14px 48px;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #00d4ff, #b040ff);
      color: #fff;
      box-shadow: 0 0 24px rgba(0,212,255,0.35), 0 0 48px rgba(176,64,255,0.2);
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .neon-btn:hover { transform: scale(1.05); box-shadow: 0 0 32px rgba(0,212,255,0.5), 0 0 64px rgba(176,64,255,0.35); }
    .neon-btn:active { transform: scale(0.97); }

    /* Level up notification */
    #level-up-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 25;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--neon-green);
      text-shadow: 0 0 20px rgba(0,255,136,0.6);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s;
    }
    #level-up-toast.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Screen flash */
    #screen-flash {
      position: absolute;
      inset: 0;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center, rgba(255,40,40,0.35), rgba(255,0,0,0.1));
      transition: opacity 0.08s;
    }
    #screen-flash.flash {
      opacity: 1;
    }

    /* Score popup */
    .score-popup {
      position: absolute;
      z-index: 22;
      font-weight: 700;
      font-size: 20px;
      pointer-events: none;
      animation: popUp 0.7s ease-out forwards;
    }
    @keyframes popUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
    }

    /* Game over stats */
    .go-stat {
      font-size: clamp(1rem, 3vw, 1.3rem);
      margin: 6px 0;
    }
    .go-stat span {
      font-weight: 700;
    }

    /* Item guide on start screen */
    .item-guide {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: rgba(200,200,255,0.6);
    }
    .item-guide-entry {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Footer */
    #game-footer {
      position: absolute;
      bottom: 4px;
      left: 0; right: 0;
      z-index: 31;
      text-align: center;
      font-size: 10px;
      color: rgba(150,150,200,0.3);
      pointer-events: none;
    }

    @media (min-width: 768px) {
      #hud { padding: 10px 24px; font-size: 16px; }
      .touch-btn { width: 80px; height: 80px; font-size: 32px; }
    }
  </style>
</head>
<body data-id="0">

  <!-- Background stars -->

  <!-- Game canvas -->
  <canvas data-id="3" id="game-canvas"></canvas>

  <!-- Screen flash -->
  <div data-id="4" id="screen-flash"></div>

  <!-- HUD -->
  <div data-id="5" id="hud">
    <div data-id="6" class="hud-item lives" id="hud-lives">❤️❤️❤️</div>
    <div data-id="7" class="hud-item"><span data-id="8" style="color:rgba(200,200,255,0.5)">分数</span>&nbsp;<span data-id="9" class="score-val" id="hud-score">0</span></div>

    <div data-id="13" class="hud-item"><span data-id="14" style="color:rgba(200,200,255,0.5)">等级</span>&nbsp;<span data-id="15" class="level-val" id="hud-level">1</span></div>

  </div>

  <!-- Start screen -->
  <div data-id="21" class="overlay" id="start-screen">
    <div data-id="22" style="font-size:clamp(3rem,10vw,5rem);margin-bottom:4px;">⛏️</div>

      <div data-id="26" class="item-guide-entry">💎 +10</div>

      <div data-id="28" class="item-guide-entry">⭐ +30</div>
      <div data-id="29" class="item-guide-entry">💰 +50</div>
      <div data-id="30" class="item-guide-entry" style="color:#ff6688;">☄️ 危险</div>

  <!-- Game over screen -->
  <div data-id="35" class="overlay hidden" id="gameover-screen">
    <div data-id="36" style="font-size:clamp(2rem,6vw,3rem);margin-bottom:8px;">💥</div>

    <div data-id="38" class="go-stat">最终分数：<span data-id="39" id="go-score" style="color:var(--neon-blue);">0</span></div>
    <div data-id="40" class="go-stat">最高分数：<span data-id="41" id="go-high" style="color:var(--neon-gold);">0</span></div>
    <div data-id="42" class="go-stat" style="margin-bottom:28px;">到达等级：<span data-id="43" id="go-level" style="color:var(--neon-green);">1</span></div>
    <button data-id="44" class="neon-btn" id="btn-restart">再来一次</button>
  </div>

  <div data-id="45" id="game-footer">Made by Copilot</div>

  <script>
    // ========== STARS BACKGROUND ==========
    (function createStars() {
      const layer = document.getElementById('stars-layer');
      const count = Math.min(120, Math.floor(window.innerWidth * window.innerHeight / 6000));
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.5 + 0.5;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (Math.random() * 3 + 1.5) + 's');
        s.style.animationDelay = (Math.random() * 4) + 's';
        layer.appendChild(s);
      }
    })();

    // ========== CANVAS SETUP ==========
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ========== GAME STATE ==========
    const ITEM_TYPES = [
      { emoji: '💎', points: 10, color: '#00d4ff', glow: 'rgba(0,212,255,0.5)', type: 'gem' },
      { emoji: '🔮', points: 20, color: '#b040ff', glow: 'rgba(176,64,255,0.5)', type: 'gem' },
      { emoji: '⭐', points: 30, color: '#ffd700', glow: 'rgba(255,215,0,0.5)', type: 'gem' },
      { emoji: '💰', points: 50, color: '#00ff88', glow: 'rgba(0,255,136,0.5)', type: 'gem', rare: true },
      { emoji: '☄️', points: 0, color: '#ff2d55', glow: 'rgba(255,45,85,0.5)', type: 'hazard' },
      { emoji: '⚡', points: 0, color: '#ff6600', glow: 'rgba(255,102,0,0.5)', type: 'hazard' },
    ];

    let game = {};
    let particles = [];
    let items = [];
    let lastTime = 0;
    let gameState = 'start'; // 'start' | 'playing' | 'gameover'
    let spawnTimer = 0;
    let invincibleTimer = 0;
    let isMobile = false;

    function detectMobile() {
      isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 768);
    }
    detectMobile();
    window.addEventListener('resize', detectMobile);

    function loadHighScore() {
      return parseInt(localStorage.getItem('starMinerHigh') || '0', 10);
    }
    function saveHighScore(s) {
      localStorage.setItem('starMinerHigh', s.toString());
    }

    function resetGame() {
      const pw = Math.min(60, canvas.width * 0.09);
      game = {
        x: canvas.width / 2,
        y: canvas.height - 90,
        width: pw,
        speed: 0,
        maxSpeed: 500,
        accel: 1800,
        friction: 0.88,
        score: 0,
        highScore: loadHighScore(),
        lives: 3,
        level: 1,
      };
      items = [];
      particles = [];
      spawnTimer = 0;
      invincibleTimer = 0;
      updateHUD();
    }

    // ========== HUD ==========
    function updateHUD() {
      let hearts = '';
      for (let i = 0; i < game.lives; i++) hearts += '❤️';
      for (let i = game.lives; i < 3; i++) hearts += '🖤';
      document.getElementById('hud-lives').textContent = hearts;
      document.getElementById('hud-score').textContent = game.score;
      document.getElementById('hud-high').textContent = game.highScore;
      document.getElementById('hud-level').textContent = game.level;
    }

    // ========== INPUT ==========
    const keys = {};
    document.addEventListener('keydown', function(e) {
      keys[e.key] = true;
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d',' '].includes(e.key)) {
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', function(e) {
      keys[e.key] = false;
    });

    // Touch
    let touchLeft = false, touchRight = false;
    const btnLeft = document.getElementById('touch-left');
    const btnRight = document.getElementById('touch-right');

    btnLeft.addEventListener('touchstart', function(e) { e.preventDefault(); touchLeft = true; btnLeft.classList.add('active'); });
    btnLeft.addEventListener('touchend', function(e) { e.preventDefault(); touchLeft = false; btnLeft.classList.remove('active'); });
    btnLeft.addEventListener('touchcancel', function(e) { touchLeft = false; btnLeft.classList.remove('active'); });

    btnRight.addEventListener('touchstart', function(e) { e.preventDefault(); touchRight = true; btnRight.classList.add('active'); });
    btnRight.addEventListener('touchend', function(e) { e.preventDefault(); touchRight = false; btnRight.classList.remove('active'); });
    btnRight.addEventListener('touchcancel', function(e) { touchRight = false; btnRight.classList.remove('active'); });

    // ========== SPAWNING ==========
    function getSpawnInterval() {
      const base = 1.0;
      return Math.max(0.25, base - (game.level - 1) * 0.07);
    }

    function getHazardChance() {
      return 0.2 + (game.level - 1) * 0.022; // 20% at lvl1 -> ~40% at lvl10
    }

    function spawnItem() {
      const isHazard = Math.random() < getHazardChance();
      let pool;
      if (isHazard) {
        pool = ITEM_TYPES.filter(t => t.type === 'hazard');
      } else {
        pool = ITEM_TYPES.filter(t => t.type === 'gem');
        // Weighted: rare items less common
        const weighted = [];
        pool.forEach(g => {
          const w = g.rare ? 1 : 4;
          for (let i = 0; i < w; i++) weighted.push(g);
        });
        pool = weighted;
      }
      const tmpl = pool[Math.floor(Math.random() * pool.length)];
      const size = 36 + Math.random() * 10;
      const margin = size + 10;
      items.push({
        x: margin + Math.random() * (canvas.width - margin * 2),
        y: -size,
        size: size,
        speed: (120 + Math.random() * 80) + (game.level - 1) * 15,
        drift: (Math.random() - 0.5) * 40,
        ...tmpl,
      });
    }

    // ========== PARTICLES ==========
    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 160;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 0.4 + Math.random() * 0.35,
          maxLife: 0.4 + Math.random() * 0.35,
          size: 2 + Math.random() * 3.5,
          color,
        });
      }
    }

    // ========== SCORE POPUP ==========
    function showScorePopup(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'score-popup';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.color = color;
      el.style.textShadow = `0 0 10px ${color}`;
      document.getElementById('popups').appendChild(el);
      setTimeout(() => el.remove(), 750);
    }

    // ========== LEVEL UP ==========
    function showLevelUp(lvl) {
      const toast = document.getElementById('level-up-toast');
      toast.textContent = `🎉 等级 ${lvl}！`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    }

    // ========== HIT FLASH ==========
    function flashScreen() {
      const el = document.getElementById('screen-flash');
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 150);
    }

    // ========== COLLISION ==========
    function checkCollision(item) {
      const px = game.x;
      const py = game.y;
      const pw = game.width;
      const ph = game.width * 0.9;
      const ix = item.x - item.size / 2;
      const iy = item.y - item.size / 2;
      const iw = item.size;
      const ih = item.size;
      return px - pw / 2 < ix + iw && px + pw / 2 > ix &&
             py - ph / 2 < iy + ih && py + ph / 2 > iy;
    }

    // ========== UPDATE ==========
    function update(dt) {
      if (gameState !== 'playing') return;
      dt = Math.min(dt, 0.05); // cap dt

      // Player movement
      let inputDir = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A'] || touchLeft) inputDir -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D'] || touchRight) inputDir += 1;

      if (inputDir !== 0) {
        game.speed += inputDir * game.accel * dt;
        game.speed = Math.max(-game.maxSpeed, Math.min(game.maxSpeed, game.speed));
      } else {
        game.speed *= Math.pow(game.friction, dt * 60);
        if (Math.abs(game.speed) < 5) game.speed = 0;
      }

      game.x += game.speed * dt;
      const halfW = game.width / 2;
      if (game.x < halfW) { game.x = halfW; game.speed = 0; }
      if (game.x > canvas.width - halfW) { game.x = canvas.width - halfW; game.speed = 0; }

      // Invincibility
      if (invincibleTimer > 0) invincibleTimer -= dt;

      // Spawn
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnItem();
        spawnTimer = getSpawnInterval() * (0.7 + Math.random() * 0.6);
      }

      // Update items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed * dt;
        item.x += item.drift * dt;

        // Off screen
        if (item.y > canvas.height + 50) {
          items.splice(i, 1);
          continue;
        }

        // Collision
        if (checkCollision(item)) {
          if (item.type === 'gem') {
            game.score += item.points;
            spawnParticles(item.x, item.y, item.color, 10);
            showScorePopup(item.x, item.y - 20, '+' + item.points, item.color);

            // Level up
            const newLevel = Math.min(10, Math.floor(game.score / 100) + 1);
            if (newLevel > game.level) {
              game.level = newLevel;
              showLevelUp(newLevel);
            }

            // High score
            if (game.score > game.highScore) {
              game.highScore = game.score;
              saveHighScore(game.highScore);
            }
            updateHUD();
          } else if (item.type === 'hazard' && invincibleTimer <= 0) {
            game.lives--;
            invincibleTimer = 1.5;
            flashScreen();
            spawnParticles(item.x, item.y, '#ff2d55', 15);
            updateHUD();
            if (game.lives <= 0) {
              gameOver();
            }
          }
          items.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 200 * dt; // gravity
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // ========== RENDER ==========
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState !== 'playing') return;

      // Draw items
      for (const item of items) {
        // Glow
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = item.glow;

        // Circle background
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.size / 2 + 4, 0, Math.PI * 2);
        ctx.fillStyle = item.type === 'hazard' ? 'rgba(255,30,50,0.18)' : 'rgba(0,150,255,0.12)';
        ctx.fill();

        // Emoji
        ctx.shadowBlur = 0;
        ctx.font = `${item.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.emoji, item.x, item.y);
        ctx.restore();
      }

      // Draw player
      ctx.save();
      const blinkOn = invincibleTimer > 0 ? Math.floor(invincibleTimer * 8) % 2 === 0 : true;
      if (blinkOn) {
        // Glow platform
        const grd = ctx.createRadialGradient(game.x, game.y + 10, 5, game.x, game.y + 10, game.width * 0.8);
        grd.addColorStop(0, 'rgba(0,212,255,0.25)');
        grd.addColorStop(1, 'rgba(0,212,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(game.x, game.y + 15, game.width * 0.7, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ship emoji
        ctx.font = `${game.width}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚀', game.x, game.y);
      }
      ctx.restore();

      // Draw particles
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ========== GAME FLOW ==========
    function startGame() {
      resetGame();
      gameState = 'playing';
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('hud').style.display = 'flex';
      if (isMobile) {
        document.getElementById('touch-controls').style.display = 'flex';
      }
      document.getElementById('hud-high').textContent = game.highScore;
    }

    function gameOver() {
      gameState = 'gameover';
      document.getElementById('hud').style.display = 'none';
      document.getElementById('touch-controls').style.display = 'none';
      document.getElementById('go-score').textContent = game.score;
      document.getElementById('go-high').textContent = game.highScore;
      document.getElementById('go-level').textContent = game.level;
      document.getElementById('gameover-screen').classList.remove('hidden');
    }

    // ========== GAME LOOP ==========
    function loop(timestamp) {
      const dt = lastTime ? (timestamp - lastTime) / 1000 : 0;
      lastTime = timestamp;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    // Pause on blur
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        lastTime = 0; // reset dt on return
      }
    });

    // ========== EVENT BINDINGS ==========
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);

    // Mobile detection on start
    window.addEventListener('resize', function() {
      resizeCanvas();
      detectMobile();
      if (gameState === 'playing') {
        document.getElementById('touch-controls').style.display = isMobile ? 'flex' : 'none';
        // Reposition player
        game.y = canvas.height - 90;
        if (game.x > canvas.width - game.width / 2) game.x = canvas.width - game.width / 2;
      }
    });

    // Start loop
    requestAnimationFrame(loop);
  </script>
</body>
</html>
