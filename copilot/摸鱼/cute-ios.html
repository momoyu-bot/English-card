<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>今天也要温柔对自己</title>
<meta name="description" content="心情面板、今日小目标，或者只是一个让自己微笑的角落。点一下还能得到一只喵。">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at top,#ffe6f7 0,#ffeef9 30%,#fdfbff 60%,#f3f6ff 100%);
      font-family: "PingFang SC","Hiragino Sans GB","SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,"Helvetica Neue",Arial;
      -webkit-text-size-adjust:100%;color:#444;padding:18px;
    }
    .card{
      width:100%;max-width:420px;padding:22px;border-radius:22px;
      background:rgba(255,255,255,0.95);box-shadow:0 14px 36px rgba(255,153,204,0.18);
      backdrop-filter:blur(10px);
    }
    .tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,182,222,0.18);color:#ff6fae;font-weight:700;font-size:12px}
    .tag-dot{width:8px;height:8px;border-radius:50%;background:#ff6fae;box-shadow:0 0 0 4px rgba(255,111,174,0.18)}
    .title-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
    h1{font-size:22px;color:#333;line-height:1.1}
    h1 span{background:linear-gradient(120deg,#ff7ac4,#ffb86c);-webkit-background-clip:text;color:transparent}
    .kawaii-cat{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#fff5fb,#ffe0f3);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(255,153,204,0.22);animation:floaty 2.6s ease-in-out infinite}
    .cat-face{position:relative;width:40px;height:32px;background:#fff;border-radius:18px;box-shadow:0 4px 10px rgba(255,153,204,0.18)}
    .cat-ear{position:absolute;width:14px;height:14px;background:#fff;top:-7px;border-radius:60% 40% 0 0}
    .cat-ear.left{left:2px;transform:rotate(-10deg)}
    .cat-ear.right{right:2px;transform:rotate(10deg)}
    .cat-ear-inner{position:absolute;inset:3px;background:#ffd1ec;border-radius:inherit}
    .cat-eye{position:absolute;top:12px;width:7px;height:7px;background:#333;border-radius:50%;box-shadow:0 0 0 2px #fff}
    .cat-eye.left{left:9px}.cat-eye.right{right:9px}
    .cat-eye::after{content:"";position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;top:1px;left:1px;opacity:.95}
    .cat-mouth{position:absolute;top:18px;left:50%;width:12px;height:8px;transform:translateX(-50%);border-bottom:2px solid #ff7ac4;border-radius:0 0 12px 12px}
    .cat-blush{position:absolute;top:19px;width:8px;height:4px;background:rgba(255,153,204,0.5);border-radius:999px;filter:blur(.8px)}
    .cat-blush.left{left:4px}.cat-blush.right{right:4px}
    .subtitle{margin-top:10px;color:#666;font-size:14px;line-height:1.5}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.95);color:#ff5fae;border:1px solid rgba(255,182,222,0.7);font-size:13px}
    .btn-row{display:flex;gap:10px;margin-top:12px}
    .btn{flex:1;padding:12px;border-radius:999px;border:none;font-weight:700;font-size:15px;cursor:pointer;touch-action:manipulation}
    .btn-primary{background:linear-gradient(135deg,#ff7ac4,#ff9acb);color:#fff;box-shadow:0 10px 20px rgba(255,140,198,0.35)}
    .btn-ghost{background:#fff;color:#ff6fae;border:1px solid rgba(255,182,222,0.9)}
    .footer-note{margin-top:12px;font-size:12px;color:#999;display:flex;align-items:center;gap:8px}
    .heart{width:12px;height:12px;background:radial-gradient(circle at 30% 30%,#fff,#ff7ac4 40%,#ff4fa3 80%);transform:rotate(-45deg);border-radius:2px 2px 6px 6px;position:relative}
    .heart::before,.heart::after{content:"";position:absolute;width:12px;height:12px;background:inherit;border-radius:50%}
    .heart::before{top:-6px;left:0}.heart::after{left:6px;top:0}
    @keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-5px)}100%{transform:translateY(0)}}
    @media (max-width:420px){.card{padding:18px}.kawaii-cat{width:58px;height:58px}.h1{font-size:20px}}
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="tag"><span class="tag-dot"></span><span>super kawaii mode</span></div>
    <div class="title-row">
      <h1>你好呀，<span>小可爱</span> ✨</h1>
      <div class="kawaii-cat" aria-hidden="true">
        <div class="cat-face">
          <div class="cat-ear left"><div class="cat-ear-inner"></div></div>
          <div class="cat-ear right"><div class="cat-ear-inner"></div></div>
          <div class="cat-eye left"></div>
          <div class="cat-eye right"></div>
          <div class="cat-mouth"></div>
          <div class="cat-blush left"></div>
          <div class="cat-blush right"></div>
        </div>
      </div>
    </div>
    <p class="subtitle">这是一个为你量身定制的超萌小页面。你可以把它当作心情面板、今日小目标，或者只是一个让自己微笑的角落。</p>
    <div class="chips">
      <div class="chip">今天也要温柔对自己</div>
      <div class="chip">多喝水 · 多休息</div>
      <div class="chip">允许自己慢一点</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="alert('喵～今天也要加一点点喜欢自己的勇气哦！')">点我获得一只喵</button>
      <button class="btn btn-ghost" onclick="alert('已为你悄悄收藏这份可爱 (*ฅ́˘ฅ̀*)')">收藏这份可爱</button>
    </div>
    <div class="footer-note"><div class="heart" aria-hidden="true"></div><span>小提示：你已经很棒啦，不用和任何人比。</span></div>
  </div>
</body>
</html>
