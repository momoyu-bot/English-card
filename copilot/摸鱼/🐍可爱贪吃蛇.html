            background: { 100:'#fffbf8',150:'#f8f4f1',200:'#efeae7',250:'#e2ddd9',300:'#cfc9c5',350:'#b3ada8',400:'#98918b',450:'#746d68' },

            stroke: { 100:'#fffbf8',150:'#fff3ea',200:'#f6e8dd',250:'#ebdbce',300:'#dac6b7',350:'#c1a996',400:'#a88c76',450:'#87674e',550:'#745740',600:'#6a4f39',650:'#59422f',700:'#493626' },

            'system-green': { 200:'#baeec0',300:'#97dfa1',350:'#6cc57b',400:'#32ad52',550:'#01712b',600:'#016826',750:'#093815' },
            'system-red': { 200:'#ffe4e1',300:'#ffb5ae',350:'#f98981',400:'#e7615b',550:'#ac1922',600:'#9d1920',650:'#821b1e' },
            'system-yellow': { 100:'#fffbf4',300:'#f3c357',350:'#d6a632',600:'#6c5001' },
            'system-blue': { 100:'#f5f8fd',200:'#dbeafe',300:'#adcaf6',350:'#7eaae9',400:'#5489d6',550:'#2f5ea3',600:'#274f8c',750:'#1e3a8a' },
            'system-purple': { 100:'#f9f7fd',200:'#ece3f6',300:'#d4c0ec',350:'#b995dd',400:'#9c6ac9',550:'#6f3da0',600:'#603489',750:'#402360' },
            'system-teal': { 100:'#effefb',200:'#ccf5ed',300:'#88e5d3',350:'#52d1b9',400:'#26b89d',550:'#138770',600:'#0f7561',750:'#094d40' },
            'system-orange': { 100:'#fffbf8',300:'#ffba81',350:'#ed974a',400:'#d57702',550:'#8a4b01',650:'#6b3900' },
          },
          borderRadius: { '3xl':'1.25rem','4xl':'1.5rem','5xl':'1.75rem','6xl':'2rem' },
          fontFamily: { sans: ['Inter','sans-serif'] },
        }
      }
    };
  </script>
  <style>
    :root {
      --pastel-pink: #ff8fab;
      --pastel-coral: #ffb3c6;
      --pastel-peach: #ffc8a2;
      --pastel-mint: #e8f8f0;
      --mint-grid: #c8eedd;
      --bg-gradient-start: #e8d5f5;
      --bg-gradient-end: #d5f0e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      min-height: 100vh;
      overflow-x: hidden;
    }
    .game-border {
      border: 5px solid var(--pastel-pink);
      border-radius: 1rem;
      position: relative;
      display: inline-block;
    }
    .game-border::before,
    .game-border::after {
      position: absolute;
      font-size: 14px;
      z-index: 2;
    }
    .game-border::before { content: '💖'; top: -10px; left: -10px; }
    .game-border::after { content: '⭐'; bottom: -10px; right: -10px; }
    .corner-deco-tr, .corner-deco-bl {
      position: absolute; font-size: 14px; z-index: 2;
    }
    .corner-deco-tr { top: -10px; right: -10px; }
    .corner-deco-bl { bottom: -10px; left: -10px; }

    @keyframes bounce-emoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse-btn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,143,171,0.5); }
      50% { transform: scale(1.04); box-shadow: 0 0 20px 6px rgba(255,143,171,0.25); }
    }
    @keyframes float-text {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
    @keyframes badge-bounce {
      0%,100% { transform: scale(1) rotate(-3deg); }
      50% { transform: scale(1.15) rotate(3deg); }
    }
    .bounce-anim { animation: bounce-emoji 1s ease-in-out infinite; }
    .pulse-anim { animation: pulse-btn 2s ease-in-out infinite; }
    .badge-bounce { animation: badge-bounce 0.8s ease-in-out infinite; }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; border-radius: 0.75rem;
    }
    .overlay-bg {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
    }
    .status-bar {
      transition: all 0.3s ease;
    }
    canvas { display: block; image-rendering: auto; }
  </style>
</head>

  <script>
    // === ICONS ===
    if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
      lucide.createIcons();
    }

    // === AUDIO ENGINE (Web Audio API) ===
    let audioCtx = null;
    let soundEnabled = true;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, dur, type, vol, freqEnd) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
        gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function sfxEat() { playTone(523, 0.08, 'sine', 0.18); setTimeout(()=> playTone(659, 0.1, 'sine', 0.15), 60); }
    function sfxCombo() { playTone(523, 0.1, 'sine', 0.13); setTimeout(()=> playTone(659, 0.1, 'sine', 0.13), 80); setTimeout(()=> playTone(784, 0.12, 'sine', 0.13), 160); }
    function sfxSpecialAppear() { playTone(880, 0.15, 'sine', 0.1, 1320); }
    function sfxSpecialEat() { playTone(660, 0.2, 'sine', 0.12, 880); setTimeout(()=> playTone(880, 0.15, 'sine', 0.1), 100); }
    function sfxGameOver() { playTone(400, 0.2, 'square', 0.12); setTimeout(()=> playTone(320, 0.2, 'square', 0.1), 180); setTimeout(()=> playTone(260, 0.35, 'square', 0.08), 360); }
    function sfxLevelUp() { playTone(523, 0.1, 'sine', 0.15); setTimeout(()=> playTone(659, 0.1, 'sine', 0.15), 80); setTimeout(()=> playTone(784, 0.1, 'sine', 0.15), 160); setTimeout(()=> playTone(1047, 0.15, 'sine', 0.15), 240); }

    // === GAME CONSTANTS ===
    const CANVAS_W = 400, CANVAS_H = 400, GRID = 20, CELLS = CANVAS_W / GRID;
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // Responsive canvas
    function resizeCanvas() {
      const container = document.getElementById('game-container');
      const maxW = Math.min(window.innerWidth - 40, 400);
      const scale = maxW / 400;
      canvas.style.width = (400 * scale) + 'px';
      canvas.style.height = (400 * scale) + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // === FOOD TYPES ===
    const FOOD_TYPES = [
      { emoji: '🍓', name: '草莓', points: 10, weight: 25 },
      { emoji: '🍊', name: '橘子', points: 15, weight: 20 },
      { emoji: '🇬', name: '葡萄', points: 20, weight: 18 },
      { emoji: '🌟', name: '星星', points: 30, weight: 12 },
      { emoji: '🌸', name: '樱花', points: 25, weight: 15 },
      { emoji: '🍰', name: '蛋糕', points: 40, weight: 5 },
      { emoji: '💎', name: '钻石', points: 50, weight: 3 },
    ];
    // Fix grape emoji
    FOOD_TYPES[2].emoji = '🍇';

    const SPECIAL_TYPES = [
      { emoji: '⚡', name: '加速道具', color: '#ffd700', glowColor: 'rgba(255,215,0,0.4)', effect: 'speed' },
      { emoji: '🛡️', name: '护盾道具', color: '#66b3ff', glowColor: 'rgba(102,179,255,0.4)', effect: 'shield' },
      { emoji: '🧲', name: '磁铁道具', color: '#b366ff', glowColor: 'rgba(179,102,255,0.4)', effect: 'magnet' },
    ];

    // === GAME STATE ===
    let snake, direction, nextDirection, food, score, highScore, level, foodsEaten;
    let gameState = 'start'; // start, playing, paused, gameover
    let moveInterval, moveTimer, lastMoveTime;
    let particles = [];
    let floatingTexts = [];
    let specialItem = null, specialTimer = 0, specialFlash = false;
    let activeEffects = { speed: 0, shield: false, magnet: 0 };
    let comboCount = 0, lastEatTime = 0;
    let deathFlashTimer = 0;
    let levelUpText = null;
    let goldenGlow = 0;
    let animFrame;

    // Load high score
    highScore = parseInt(localStorage.getItem('cute_snake_high') || '0');
    document.getElementById('high-score-display').textContent = highScore;

    function initGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0; level = 1; foodsEaten = 0;
      moveInterval = 200; moveTimer = 0; lastMoveTime = 0;
      particles = []; floatingTexts = [];
      specialItem = null; specialTimer = 0; specialFlash = false;
      activeEffects = { speed: 0, shield: false, magnet: 0 };
      comboCount = 0; lastEatTime = 0;
      deathFlashTimer = 0;
      levelUpText = null; goldenGlow = 0;
      spawnFood();
      updateHUD();
    }

    function weightedRandomFood() {
      const totalW = FOOD_TYPES.reduce((s, f) => s + f.weight, 0);
      let r = Math.random() * totalW;
      for (const f of FOOD_TYPES) {
        r -= f.weight;
        if (r <= 0) return f;
      }
      return FOOD_TYPES[0];
    }

    function spawnFood() {
      const type = weightedRandomFood();
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y) || (specialItem && specialItem.x === pos.x && specialItem.y === pos.y));
      food = { ...pos, ...type, bobPhase: Math.random() * Math.PI * 2 };
    }

    function spawnSpecial() {
      if (specialItem) return;
      const type = SPECIAL_TYPES[Math.floor(Math.random() * SPECIAL_TYPES.length)];
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y) || (food.x === pos.x && food.y === pos.y));
      specialItem = { ...pos, ...type, life: 5000, maxLife: 5000 };
      sfxSpecialAppear();
    }

    function updateHUD() {
      document.getElementById('score-display').textContent = score;
      document.getElementById('high-score-display').textContent = highScore;
      document.getElementById('level-display').textContent = level;
      document.getElementById('pause-score').textContent = score;

      const bar = document.getElementById('status-bar');
      if (activeEffects.speed > 0) {
        bar.style.background = '#fff9db'; bar.style.color = '#6c5001';
        bar.textContent = '⚡ 加速中！';
      } else if (activeEffects.shield) {
        bar.style.background = '#dbeafe'; bar.style.color = '#274f8c';
        bar.textContent = '🛡️ 护盾保护中';
      } else if (activeEffects.magnet > 0) {
        bar.style.background = '#ece3f6'; bar.style.color = '#603489';
        bar.textContent = '🧲 磁铁吸引中！';
      } else {
        bar.style.background = '#e8f8f0'; bar.style.color = '#01712b';
        bar.textContent = '🌸 正常状态';
      }
    }

    // === DRAWING ===
    function drawGrid() {
      ctx.fillStyle = '#e8f8f0';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.strokeStyle = '#c8eedd';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= CELLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, CANVAS_H);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID); ctx.lineTo(CANVAS_W, i * GRID);
        ctx.stroke();
      }
    }

    function drawSnakeHead(x, y) {
      const cx = x * GRID + GRID / 2;
      const cy = y * GRID + GRID / 2;
      const r = GRID / 2 - 1;

      // Ears (cat ears)
      ctx.fillStyle = '#ff8fab';
      // Left ear
      ctx.beginPath();
      ctx.moveTo(cx - 6, cy - r + 1);
      ctx.lineTo(cx - 9, cy - r - 7);
      ctx.lineTo(cx - 2, cy - r + 1);
      ctx.closePath();
      ctx.fill();
      // Inner left ear
      ctx.fillStyle = '#ffb3c6';
      ctx.beginPath();
      ctx.moveTo(cx - 6, cy - r + 2);
      ctx.lineTo(cx - 8, cy - r - 4);
      ctx.lineTo(cx - 3, cy - r + 2);
      ctx.closePath();
      ctx.fill();
      // Right ear
      ctx.fillStyle = '#ff8fab';
      ctx.beginPath();
      ctx.moveTo(cx + 6, cy - r + 1);
      ctx.lineTo(cx + 9, cy - r - 7);
      ctx.lineTo(cx + 2, cy - r + 1);
      ctx.closePath();
      ctx.fill();
      // Inner right ear
      ctx.fillStyle = '#ffb3c6';
      ctx.beginPath();
      ctx.moveTo(cx + 6, cy - r + 2);
      ctx.lineTo(cx + 8, cy - r - 4);
      ctx.lineTo(cx + 3, cy - r + 2);
      ctx.closePath();
      ctx.fill();

      // Head circle
      ctx.fillStyle = '#ff8fab';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Rosy cheeks
      ctx.fillStyle = '#ffb3c6';
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(cx - 5, cy + 2, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 5, cy + 2, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;

      // Eyes
      ctx.fillStyle = '#1d1a17';
      ctx.beginPath(); ctx.arc(cx - 3.5, cy - 2, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 3.5, cy - 2, 1.6, 0, Math.PI * 2); ctx.fill();

      // Eye sparkle
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx - 3, cy - 2.5, 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 4, cy - 2.5, 0.7, 0, Math.PI * 2); ctx.fill();

      // Smile
      ctx.strokeStyle = '#1d1a17';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(cx, cy + 1, 3, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }

    const bodyColors = ['#ff8fab', '#ffb3c6', '#ffc8a2', '#ffd6a5', '#ffb3c6', '#ff8fab'];

    function drawSnakeBody(segment, index, total) {
      const x = segment.x * GRID + 1;
      const y = segment.y * GRID + 1;
      const w = GRID - 2;
      const h = GRID - 2;
      const colorIdx = index % bodyColors.length;
      const color = bodyColors[colorIdx];

      const r = 5;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();

      // Shine highlight
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.arc(x + 5, y + 4, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSnakeTail(segment, prev) {
      const cx = segment.x * GRID + GRID / 2;
      const cy = segment.y * GRID + GRID / 2;
      const dx = prev ? prev.x - segment.x : 0;
      const dy = prev ? prev.y - segment.y : 0;

      ctx.fillStyle = '#ffc8a2';
      ctx.beginPath();
      if (dx === 1 || dx === -1) {
        // Horizontal tail
        ctx.moveTo(cx + dx * 8, cy - 5);
        ctx.quadraticCurveTo(cx - dx * 6, cy, cx + dx * 8, cy + 5);
      } else {
        // Vertical tail
        ctx.moveTo(cx - 5, cy + dy * 8);
        ctx.quadraticCurveTo(cx, cy - dy * 6, cx + 5, cy + dy * 8);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawSnake() {
      // Death flash
      if (deathFlashTimer > 0) {
        ctx.globalAlpha = Math.sin(deathFlashTimer * 15) > 0 ? 1 : 0.3;
      }

      // Draw from tail to head
      for (let i = snake.length - 1; i >= 0; i--) {
        if (i === 0) {
          drawSnakeHead(snake[i].x, snake[i].y);
        } else if (i === snake.length - 1) {
          drawSnakeTail(snake[i], snake[i - 1]);
        } else {
          drawSnakeBody(snake[i], i, snake.length);
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawFood(timestamp) {
      if (!food) return;
      const cx = food.x * GRID + GRID / 2;
      const bob = Math.sin((timestamp / 400) + food.bobPhase) * 2.5;
      const cy = food.y * GRID + GRID / 2 + bob;

      ctx.font = '16px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(food.emoji, cx, cy);
    }

    function drawSpecial(timestamp) {
      if (!specialItem) return;
      const cx = specialItem.x * GRID + GRID / 2;
      const cy = specialItem.y * GRID + GRID / 2;

      // Flashing when about to disappear
      const remaining = specialItem.life;
      if (remaining < 2000) {
        const flashRate = remaining < 1000 ? 8 : 4;
        if (Math.sin(timestamp / 1000 * Math.PI * flashRate) < 0) return;
      }

      // Glow
      ctx.save();
      ctx.shadowColor = specialItem.glowColor;
      ctx.shadowBlur = 12 + Math.sin(timestamp / 200) * 4;
      ctx.font = '16px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(specialItem.emoji, cx, cy);
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawFloatingTexts() {
      for (const ft of floatingTexts) {
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.font = ft.font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ft.text, ft.x, ft.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawLevelUp(timestamp) {
      if (!levelUpText) return;
      ctx.globalAlpha = levelUpText.alpha;
      ctx.fillStyle = '#d6a632';
      ctx.font = 'bold 16px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⬆️ 升级！蛇蛇加速了！', CANVAS_W / 2, levelUpText.y);
      ctx.globalAlpha = 1;
    }

    function drawGoldenGlow() {
      if (goldenGlow <= 0) return;
      ctx.save();
      ctx.globalAlpha = goldenGlow * 0.15;
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.restore();
    }

    // === PARTICLES ===
    function spawnConfetti(px, py) {
      const colors = ['#ff8fab', '#ffb3c6', '#ffd6a5', '#a8e6cf', '#b5b3ff', '#ffd700', '#ff6b8a', '#88e5d3'];
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 / 8) * i + Math.random() * 0.5;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle) * (60 + Math.random() * 40),
          vy: Math.sin(angle) * (60 + Math.random() * 40),
          alpha: 1, size: 2 + Math.random() * 2,
          color: colors[Math.floor(Math.random() * colors.length)],
        });
      }
    }

    function addFloatingText(text, px, py, color, font) {
      floatingTexts.push({ text, x: px, y: py, alpha: 1, vy: -40, color: color || '#e7615b', font: font || 'bold 14px Inter, sans-serif' });
    }

    // === GAME LOGIC ===
    function moveSnake() {
      direction = { ...nextDirection };
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // Wall collision
      if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
        gameOver(); return;
      }

      // Self collision
      const selfHit = snake.some(s => s.x === head.x && s.y === head.y);
      if (selfHit) {
        if (activeEffects.shield) {
          activeEffects.shield = false;
          updateHUD();
        } else {
          gameOver(); return;
        }
      }

      snake.unshift(head);

      // Check food
      let ate = false;
      if (head.x === food.x && head.y === food.y) {
        ate = true;
        const now = performance.now();
        const timeSinceLast = now - lastEatTime;

        let pointsGained = food.points;
        let comboText = '';

        if (timeSinceLast < 3000 && lastEatTime > 0) {
          comboCount++;
          const mult = Math.min(1 + comboCount * 0.5, 3);
          pointsGained = Math.round(food.points * mult);
          comboText = `×${mult.toFixed(1)} 连击！`;
          sfxCombo();
        } else {
          comboCount = 0;
          sfxEat();
        }

        lastEatTime = now;
        score += pointsGained;
        foodsEaten++;

        // Floating text
        const px = food.x * GRID + GRID / 2;
        const py = food.y * GRID + GRID / 2;
        addFloatingText(`+${pointsGained}`, px, py - 5);
        if (comboText) {
          addFloatingText(comboText, px, py - 20, '#d6a632', 'bold 12px Inter, sans-serif');
        }
        spawnConfetti(px, py);

        // Level up check
        if (foodsEaten % 5 === 0 && moveInterval > 80) {
          level++;
          moveInterval = Math.max(80, moveInterval - 18);
          levelUpText = { y: 30, alpha: 1 };
          goldenGlow = 1;
          sfxLevelUp();
        }

        // High score
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('cute_snake_high', highScore);
        }

        updateHUD();
        spawnFood();
      } else {
        snake.pop();
      }

      // Check special item
      if (specialItem && head.x === specialItem.x && head.y === specialItem.y) {
        sfxSpecialEat();
        const px = specialItem.x * GRID + GRID / 2;
        const py = specialItem.y * GRID + GRID / 2;
        spawnConfetti(px, py);

        if (specialItem.effect === 'speed') {
          activeEffects.speed = 5000;
          addFloatingText('⚡ 加速！', px, py - 5, '#d6a632');
        } else if (specialItem.effect === 'shield') {
          activeEffects.shield = true;
          addFloatingText('🛡️ 护盾！', px, py - 5, '#5489d6');
        } else if (specialItem.effect === 'magnet') {
          activeEffects.magnet = 5000;
          addFloatingText('🧲 磁铁！', px, py - 5, '#9c6ac9');
        }
        specialItem = null;
        updateHUD();
      }

      // Magnet effect: pull food closer
      if (activeEffects.magnet > 0 && food) {
        const dx = snake[0].x - food.x;
        const dy = snake[0].y - food.y;
        if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
          let newFX = food.x, newFY = food.y;
          if (Math.abs(dx) >= Math.abs(dy)) {
            newFX += Math.sign(dx);
          } else {
            newFY += Math.sign(dy);
          }
          // Don't move food onto snake
          if (!snake.some(s => s.x === newFX && s.y === newFY)) {
            food.x = newFX;
            food.y = newFY;
          }
        }
      }
    }

    function gameOver() {
      deathFlashTimer = 0.6;
      gameState = 'dying';
    }

    function showGameOver() {
      gameState = 'gameover';
      sfxGameOver();
      document.getElementById('final-score').textContent = score;
      document.getElementById('go-highscore').textContent = highScore;
      const badge = document.getElementById('new-record-badge');
      if (score >= highScore && score > 0) {
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
      document.getElementById('gameover-overlay').style.display = 'flex';
    }

    // === SPECIAL ITEM TIMER ===
    let specialSpawnTimer = 15000;

    // === MAIN LOOP ===
    let lastTimestamp = 0;

    function gameLoop(timestamp) {
      const dt = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      if (gameState === 'playing') {
        // Move timer
        const effectiveInterval = activeEffects.speed > 0 ? Math.max(60, moveInterval * 0.55) : moveInterval;
        moveTimer += dt;
        if (moveTimer >= effectiveInterval) {
          moveTimer = 0;
          moveSnake();
        }

        // Special item spawn timer
        specialSpawnTimer -= dt;
        if (specialSpawnTimer <= 0) {
          spawnSpecial();
          specialSpawnTimer = 15000;
        }

        // Special item life
        if (specialItem) {
          specialItem.life -= dt;
          if (specialItem.life <= 0) {
            specialItem = null;
          }
        }

        // Active effects timer
        if (activeEffects.speed > 0) {
          activeEffects.speed -= dt;
          if (activeEffects.speed <= 0) { activeEffects.speed = 0; updateHUD(); }
        }
        if (activeEffects.magnet > 0) {
          activeEffects.magnet -= dt;
          if (activeEffects.magnet <= 0) { activeEffects.magnet = 0; updateHUD(); }
        }

        // Particles
        for (const p of particles) {
          p.x += p.vx * dt / 1000;
          p.y += p.vy * dt / 1000;
          p.alpha -= dt / 600;
          p.size *= 0.995;
        }
        particles = particles.filter(p => p.alpha > 0);

        // Floating texts
        for (const ft of floatingTexts) {
          ft.y += ft.vy * dt / 1000;
          ft.alpha -= dt / 1200;
        }
        floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);

        // Level up text
        if (levelUpText) {
          levelUpText.alpha -= dt / 1500;
          if (levelUpText.alpha <= 0) levelUpText = null;
        }

        // Golden glow
        if (goldenGlow > 0) {
          goldenGlow -= dt / 800;
          if (goldenGlow < 0) goldenGlow = 0;
        }
      }

      if (gameState === 'dying') {
        deathFlashTimer -= dt / 1000;
        if (deathFlashTimer <= 0) {
          deathFlashTimer = 0;
          showGameOver();
        }
      }

      // === RENDER ===
      drawGrid();
      drawGoldenGlow();

      if (gameState === 'playing' || gameState === 'paused' || gameState === 'dying') {
        drawFood(timestamp);
        drawSpecial(timestamp);
        drawSnake();
        drawParticles();
        drawFloatingTexts();
        drawLevelUp(timestamp);
      }

      animFrame = requestAnimationFrame(gameLoop);
    }

    // === CONTROLS ===
    document.addEventListener('keydown', function(e) {
      if (gameState === 'playing') {
        const key = e.key.toLowerCase();
        if ((key === 'arrowup' || key === 'w') && direction.y !== 1) {
          nextDirection = { x: 0, y: -1 }; e.preventDefault();
        } else if ((key === 'arrowdown' || key === 's') && direction.y !== -1) {
          nextDirection = { x: 0, y: 1 }; e.preventDefault();
        } else if ((key === 'arrowleft' || key === 'a') && direction.x !== 1) {
          nextDirection = { x: -1, y: 0 }; e.preventDefault();
        } else if ((key === 'arrowright' || key === 'd') && direction.x !== -1) {
          nextDirection = { x: 1, y: 0 }; e.preventDefault();
        }
      }

      if (e.key === 'Escape' || e.key.toLowerCase() === 'p') {
        if (gameState === 'playing') pauseGame();
        else if (gameState === 'paused') resumeGame();
      }
    });

    // Touch/swipe
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', function(e) {
      if (gameState !== 'playing') return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const absDx = Math.abs(dx), absDy = Math.abs(dy);
      if (Math.max(absDx, absDy) < 20) return; // too small

      if (absDx > absDy) {
        if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
        else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
      } else {
        if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
      }
      e.preventDefault();
    }, { passive: false });

    // === BUTTONS ===
    function startGame() {
      ensureAudio();
      initGame();
      gameState = 'playing';
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('gameover-overlay').style.display = 'none';
      document.getElementById('pause-overlay').style.display = 'none';
      specialSpawnTimer = 15000;
    }

    function pauseGame() {
      gameState = 'paused';
      document.getElementById('pause-overlay').style.display = 'flex';
    }

    function resumeGame() {
      gameState = 'playing';
      document.getElementById('pause-overlay').style.display = 'none';
      lastTimestamp = performance.now();
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    document.getElementById('resume-btn').addEventListener('click', resumeGame);
    document.getElementById('pause-btn').addEventListener('click', function() {
      if (gameState === 'playing') pauseGame();
      else if (gameState === 'paused') resumeGame();
    });

    document.getElementById('sound-toggle').addEventListener('click', function() {
      soundEnabled = !soundEnabled;
      this.innerHTML = soundEnabled
        ? '<i data-lucide="volume-2" class="w-4 h-4"></i>'
        : '<i data-lucide="volume-x" class="w-4 h-4"></i>';
      if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
        lucide.createIcons();
      }
    });

    // Pause on tab blur
    document.addEventListener('visibilitychange', function() {
      if (document.hidden && gameState === 'playing') pauseGame();
    });

    // Start loop
    animFrame = requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
