<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糯糯的哮睡故事</title>
  <meta name="description" content="一只小小的橘猫，从枕头后面钻出来守着你。">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f8f1f8 0%, #e8f0fe 45%, #fef6f0 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #5c5470;
      overflow-x: hidden;
      position: relative;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.7;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .card {
      width: min(92vw, 420px);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 28px 40px;
      box-shadow: 0 20px 50px rgba(180, 160, 200, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 2;
      animation: softIn 1.2s ease-out;
    }

    @keyframes softIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cat {
      font-size: 48px;
      text-align: center;
      margin-bottom: 12px;
      animation: breathe 4s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      color: #7a6b8a;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #a89bb5;
      margin-bottom: 28px;
    }

    .story {
      font-size: 15.5px;
      line-height: 1.9;
      color: #5c5470;
      letter-spacing: 0.3px;
    }

    .story p {
      margin-bottom: 16px;
    }

    .story p:last-child {
      margin-bottom: 0;
    }

    .ending {
      margin-top: 28px;
      text-align: center;
      font-size: 15px;
      color: #9b8aa8;
      font-weight: 500;
    }

    .heart {
      display: inline-block;
      animation: pulse 2.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #c4b8d0;
    }
  </style>
</head>
<body>
  <div class="star" style="top: 12%; left: 15%; animation-delay: 0s;"></div>
  <div class="star" style="top: 22%; left: 78%; animation-delay: 0.7s;"></div>
  <div class="star" style="top: 68%; left: 10%; animation-delay: 1.4s;"></div>
  <div class="star" style="top: 80%; left: 85%; animation-delay: 2.1s;"></div>
  <div class="star" style="top: 45%; left: 92%; animation-delay: 0.3s;"></div>
  <div class="star" style="top: 8%; left: 55%; animation-delay: 1.8s;"></div>

  <div class="card">
    <div class="cat">🐱</div>
    <h1>糯糯的哮睡故事</h1>
    <div class="subtitle">写给宝的小夜晚</div>

    <div class="story">
      <p>有一只小小的橘猫，名字叫糯糯。</p>
      <p>它的毛像刚晒过的棉被，暖暖的、香香的。</p>
      <p>每天晚上，只要你往被子里一钻，糯糯就会悄悄从枕头后面钻出来，用湿湿的小鼻子碰碰你的脸颊，然后整只猫躺在你胸口，听着你的心跳，一点点一点点睡着。</p>
      <p>外面的风在轻轻说话，星星也在打哈欠。</p>
      <p>糯糯的呼吸越来越慢，尾巴轻轻扫着你的手心。</p>
      <p>你也跟着它的节奏，慢慢地、慢慢地……</p>
    </div>

    <div class="ending">
      睡吧，宝。<br>
      糯糯会一直守着你 <span class="heart">♡</span>
    </div>

    <div class="footer">晚安呀</div>
  </div>
</body>
</html>
