<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>我做我做我做·一年老鸟自救屋</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .do-btn { transition: transform 0.1s ease; }
  .do-btn:active { transform: scale(0.92); }
  .milestone { transition: all 0.4s ease; }
</style>
</head>
<body class="bg-gradient-to-br from-amber-100 via-orange-50 to-sky-100 min-h-screen py-8 px-4">
  <div id="card" class="max-w-xl mx-auto bg-white/95 backdrop-blur rounded-3xl shadow-2xl border border-orange-200 p-8 relative overflow-hidden">
    
    <!-- 标题 -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 bg-white px-5 py-1 rounded-2xl border border-orange-200 shadow-sm">
        <span class="text-3xl">🐣</span>
        <span class="font-bold text-2xl text-orange-500 tracking-tight">我做我做我做</span>
        <span class="text-3xl">🦅</span>
      </div>
      <p class="text-orange-400 text-sm mt-2">上班一年 · 伪新人自救屋</p>
    </div>

    <!-- 当前状态 -->
    <div class="text-center mb-6">
      <div id="status-text" class="text-xl font-medium text-orange-500 mb-1">你已经努力做了 0 次</div>
      <div class="text-xs text-orange-300">但你其实已经不是新人了，只是任务变难了</div>
    </div>

    <!-- 超级大的“我做”按钮 -->
    <div class="flex justify-center mb-6">
      <button onclick="doIt()" 
              class="do-btn w-56 h-56 bg-gradient-to-br from-orange-400 to-amber-500 hover:from-orange-500 hover:to-amber-600 text-white rounded-full flex flex-col items-center justify-center shadow-xl active:shadow-lg">
        <div class="text-6xl mb-1">💪</div>
        <div class="text-2xl font-bold tracking-wider">我做我做我做</div>
        <div class="text-xs mt-1 opacity-90">点我释放努力值</div>
      </button>
    </div>

    <!-- 老鸟能量条 -->
    <div class="mb-6">
      <div class="flex justify-between text-xs text-orange-400 mb-1 px-1">
        <div>伪新人能量</div>
        <div id="energy-text" class="font-semibold">12%</div>
      </div>
      <div class="h-3 bg-orange-100 rounded-full overflow-hidden">
        <div id="energy-bar" class="h-3 rounded-full transition-all duration-500" 
             style="width:12%; background: linear-gradient(to right, #fb923c, #f59e0b);"></div>
      </div>
    </div>

    <!-- 里程碑 -->
    <div class="grid grid-cols-3 gap-2 mb-6">
      <div onclick="unlockMilestone(0)" class="milestone text-center p-3 bg-white border border-orange-200 rounded-2xl cursor-pointer hover:border-orange-300">
        <div class="text-2xl mb-1">📅</div>
        <div class="text-xs text-orange-400">第30天</div>
        <div id="m0" class="text-[10px] text-orange-300">已解锁</div>
      </div>
      <div onclick="unlockMilestone(1)" class="milestone text-center p-3 bg-white border border-orange-200 rounded-2xl cursor-pointer hover:border-orange-300">
        <div class="text-2xl mb-1">📈</div>
        <div class="text-xs text-orange-400">第180天</div>
        <div id="m1" class="text-[10px] text-orange-300">已解锁</div>
      </div>
      <div onclick="unlockMilestone(2)" class="milestone text-center p-3 bg-white border border-orange-200 rounded-2xl cursor-pointer hover:border-orange-300">
        <div class="text-2xl mb-1">🏆</div>
        <div class="text-xs text-orange-400">第365天</div>
        <div id="m2" class="text-[10px] text-orange-300">今日达成</div>
      </div>
    </div>

    <!-- 写下今天像新人的事 -->
    <div class="mb-5">
      <div class="text-xs text-orange-400 mb-1.5 px-1">今天让我感觉又变回新人的事（写下来融掉它）</div>
      <textarea id="newbie-vent" rows="3" 
                class="w-full p-4 text-sm border border-orange-200 focus:border-orange-400 rounded-2xl bg-white resize-y placeholder:text-orange-300"
                placeholder="比如：又不会用那个新工具了 / 被问到细节我支支吾吾 / 感觉自己什么都不会"></textarea>
      <button onclick="meltNewbieFeeling()" 
              class="mt-2 w-full py-2.5 bg-orange-400 hover:bg-orange-500 text-white text-sm rounded-2xl flex items-center justify-center gap-2">
        <span>🫧</span> <span>把这个“又变新人”的感觉融掉</span>
      </button>
    </div>

    <!-- 消息区 -->
    <div id="message" class="min-h-[36px] text-center text-sm font-medium text-emerald-500 mb-4"></div>

    <!-- 底部 -->
    <div class="text-center text-xs text-orange-300 pt-3 border-t border-orange-100">
      你不是退步了<br>
      你只是在经历“会做更多更难的事”的阶段<br>
      <span class="text-orange-400">我做我做我做……你已经很厉害了</span>
    </div>
  </div>

<script>
let doCount = 0;
let energy = 12;

function updateEnergy(newVal) {
  energy = Math.max(5, Math.min(100, newVal));
  const bar = document.getElementById('energy-bar');
  const txt = document.getElementById('energy-text');
  bar.style.width = energy + '%';
  txt.textContent = energy + '%';
  
  if (energy > 75) {
    bar.style.background = 'linear-gradient(to right, #34d399, #60a5fa)';
    txt.style.color = '#10b981';
  } else if (energy > 45) {
    bar.style.background = 'linear-gradient(to right, #fbbf24, #fb923c)';
    txt.style.color = '#f59e0b';
  } else {
    bar.style.background = 'linear-gradient(to right, #fb923c, #f59e0b)';
    txt.style.color = '#f59e0b';
  }
}

function updateStatus() {
  const status = document.getElementById('status-text');
  if (doCount === 0) {
    status.innerHTML = '你已经努力做了 <span class="font-bold">0</span> 次';
  } else if (doCount < 10) {
    status.innerHTML = `你已经努力做了 <span class="font-bold text-orange-600">${doCount}</span> 次`;
  } else if (doCount < 30) {
    status.innerHTML = `你已经努力做了 <span class="font-bold text-orange-600">${doCount}</span> 次！`;
  } else {
    status.innerHTML = `你已经努力做了 <span class="font-bold text-emerald-600">${doCount}</span> 次！<br><span class="text-xs">真的很努力了</span>`;
  }
}

function doIt() {
  doCount++;
  updateStatus();
  
  // 每点击增加能量
  const add = doCount % 5 === 0 ? 8 : 3;
  updateEnergy(energy + add);
  
  // 特殊里程碑消息
  let msg = '';
  if (doCount === 1) msg = '第一下！已经比躺着强很多了';
  else if (doCount === 10) msg = '第十下！老鸟能量正在缓慢恢复';
  else if (doCount === 25) msg = '25下了……你其实已经在坚持很久了';
  else if (doCount === 50) msg = '50下了！可以给自己一个奖励了';
  else if (doCount % 20 === 0) msg = `${doCount}下了……真的很努力了`;
  
  if (msg) showMessage(msg);
  
  // 偶尔给小心心
  if (doCount % 7 === 0) createHearts(3);
}

function unlockMilestone(type) {
  const el = document.getElementById(`m${type}`);
  if (el.textContent.includes('已解锁') || el.textContent.includes('达成')) return;
  
  if (type === 0) {
    el.innerHTML = '✓ 已解锁<br><span class="text-[9px]">第一个月我活下来了</span>';
    updateEnergy(energy + 15);
    showMessage('第一个月你就已经很勇敢了');
  } else if (type === 1) {
    el.innerHTML = '✓ 已解锁<br><span class="text-[9px]">半年后我开始独立了</span>';
    updateEnergy(energy + 18);
    showMessage('半年后你已经不再是纯新人了');
  } else if (type === 2) {
    el.innerHTML = '★ 今日达成<br><span class="text-[9px]">一年了，你还在努力</span>';
    updateEnergy(energy + 25);
    showMessage('365天……你真的坚持下来了');
  }
  createHearts(5);
}

function meltNewbieFeeling() {
  const textarea = document.getElementById('newbie-vent');
  const val = textarea.value.trim();
  
  let msg = '这个感觉已经被温柔融掉了';
  if (val) {
    if (val.length > 20) msg = '写下来就好……你不是一个人在面对这些';
    else msg = '被看到、被接住了';
  }
  
  updateEnergy(energy + 14);
  showMessage(msg);
  createHearts(6);
  textarea.value = '';
}

function showMessage(msg) {
  const m = document.getElementById('message');
  m.style.transition = 'none';
  m.style.opacity = '1';
  m.innerHTML = msg;
  setTimeout(() => {
    m.style.transition = 'opacity 1.2s ease';
    m.style.opacity = '0';
  }, 2600);
}

function createHearts(num = 5) {
  const container = document.getElementById('card');
  for (let i = 0; i < num; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.textContent = ['💪','🫂','🌟','🦋'][Math.floor(Math.random()*4)];
      h.style.cssText = `position:absolute;left:${Math.random()*70+15}%;bottom:30%;font-size:1.1rem;z-index:30;pointer-events:none;`;
      container.appendChild(h);
      setTimeout(() => {
        h.style.transition = 'all 1.4s cubic-bezier(0.23,1,0.32,1)';
        h.style.transform = `translateY(-${130 + Math.random()*60}px)`;
        h.style.opacity = '0';
      }, 40);
      setTimeout(() => h.remove(), 1600);
    }, i * 55);
  }
}

function init() {
  updateStatus();
  updateEnergy(12);
  
  // 初始小提示
  setTimeout(() => {
    const m = document.getElementById('message');
    m.style.opacity = '0.6';
    m.innerHTML = '可以一直点“我做我做我做”按钮，直到心里舒服为止';
    setTimeout(() => m.style.opacity = '0', 3800);
  }, 1800);
}

init();
</script>
</body>
</html>
