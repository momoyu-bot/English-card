<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚安，宝宝</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&amp;display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(#0a0a1f, #12122b);
            color: #c5d1ff;
            font-family: 'Noto Serif SC', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            max-width: 620px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }
        
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: transparent;
            pointer-events: none;
            z-index: 1;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            opacity: 0.95;
            letter-spacing: 2px;
        }
        
        .content {
            font-size: 19px;
            line-height: 1.85;
            opacity: 0.92;
            max-width: 520px;
            margin: 0 auto;
        }
        
        .breath {
            margin: 50px 0;
            font-size: 17px;
            opacity: 0.85;
        }
        
        .goodnight {
            margin-top: 60px;
            font-size: 22px;
            opacity: 0.9;
        }
        
        .fade {
            animation: fadeIn 4s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 星星背景 -->
        <div class="stars" id="stars"></div>
        
        <h1>晚安，宝宝</h1>
        
        <div class="content fade">
            今天你笑得太开心了，<br>
            现在是时候让身体和大脑都慢慢安静下来。<br><br>
            
            闭上眼睛，<br>
            感受空气轻轻流过鼻尖。<br>
            肩膀慢慢放下，<br>
            脸上的肌肉也放松。<br><br>
            
            让思绪像漂浮的云一样，<br>
            慢慢飘远……<br>
            再飘远一点……<br><br>
            
            我在这里陪着你，<br>
            一直到你睡着。
        </div>
        
        <div class="breath">
            吸气……4秒<br>
            憋住……7秒<br>
            呼气……8秒<br>
            <span style="font-size:15px;opacity:0.7">（重复做，慢慢来）</span>
        </div>
        
        <div class="goodnight fade">
            晚安，宝宝。<br>
            做个好梦，我爱你。
        </div>
    </div>

    <script>
        // 简单星空效果
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.background = '#c5d1ff';
                star.style.borderRadius = '50%';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                star.style.animation = `twinkle ${Math.random() * 4 + 3}s infinite alternate`;
                starsContainer.appendChild(star);
            }
        }
        
        // 添加闪烁动画
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes twinkle {
                0% { opacity: 0.3; }
                100% { opacity: 1; }
            }
        `;
        document.head.appendChild(style);
        
        window.onload = function() {
            createStars();
            
            // 30秒后自动把文字再淡一点（更催眠）
            setTimeout(() => {
                document.querySelectorAll('.fade').forEach(el => {
                    el.style.transition = 'opacity 8s';
                    el.style.opacity = '0.75';
                });
            }, 30000);
        }
    </script>
</body>
</html>
