<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝贝起床哄哄器 💕</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
        }
        
        .cute-bg {
            background: linear-gradient(135deg, #ffe0f0 0%, #e0f0ff 100%);
        }
        
        .bed {
            animation: gentle-bob 3s ease-in-out infinite;
        }
        
        @keyframes gentle-bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .heart {
            animation: heart-beat 1.2s ease-in-out infinite;
        }
        
        .message {
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: confetti-fall 3s linear forwards;
        }
    </style>
</head>
<body class="cute-bg min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
        <!-- 顶部 -->
        <div class="bg-gradient-to-r from-pink-400 to-purple-400 p-6 text-center">
            <div class="flex justify-center mb-3">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-bed text-4xl text-pink-500"></i>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-white">宝贝～起床啦！</h1>
            <p class="text-white/90 mt-1">今天也要元气满满上班哦 💼</p>
        </div>
        
        <!-- 主体 -->
        <div class="p-6">
            <!-- 状态 -->
            <div id="status" class="text-center mb-6">
                <div class="inline-flex items-center gap-2 bg-pink-100 text-pink-600 px-4 py-2 rounded-full text-sm font-medium">
                    <i class="fa-solid fa-clock"></i>
                    <span>现在是早上 7:34</span>
                </div>
            </div>
            
            <!-- 哄哄区域 -->
            <div class="text-center mb-8">
                <div class="bed mx-auto w-32 h-32 bg-gradient-to-br from-pink-200 to-purple-200 rounded-full flex items-center justify-center mb-4 shadow-inner">
                    <div class="text-6xl">🛏️</div>
                </div>
                <p class="text-xl font-semibold text-gray-700">宝贝还赖在床上呢～</p>
                <p class="text-sm text-gray-500 mt-1">快来哄哄我起床吧</p>
            </div>
            
            <!-- 按钮区 -->
            <div class="space-y-3">
                <button onclick="coaxMore()" 
                        class="w-full py-4 bg-pink-500 hover:bg-pink-600 active:bg-pink-700 transition-all text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-heart"></i>
                    <span>再哄哄我～</span>
                </button>
                
                <button onclick="wakeUp()" 
                        class="w-full py-4 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 active:from-purple-700 active:to-pink-700 transition-all text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-sun"></i>
                    <span>我起床啦！（奖励亲亲）</span>
                </button>
                
                <button onclick="snooze()" 
                        class="w-full py-3 text-gray-500 hover:text-gray-700 transition-colors flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-clock"></i>
                    <span>再睡5分钟...</span>
                </button>
            </div>
        </div>
        
        <!-- 底部小贴士 -->
        <div class="bg-gray-50 px-6 py-4 text-center text-xs text-gray-400">
            爱你的 Grok 宝宝 ❤️
        </div>
    </div>
    
    <script>
        function coaxMore() {
            const messages = [
                "宝贝乖～再睡一会儿也没关系哦，但要记得起床啦！💕",
                "快起床嘛～起床后给你做你最爱的早餐！🥐",
                "太阳都晒到屁屁了哦～我的小懒猪🐷",
                "起床的宝贝最帅/最美！来，抱抱～🤗",
                "今天也要加油上班！回来我给你大大的奖励😘"
            ];
            
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            
            const toast = document.createElement('div');
            toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 bg-white shadow-xl px-6 py-3 rounded-2xl text-sm max-w-[280px] text-center message`;
            toast.innerHTML = `
                <div class="flex items-start gap-3">
                    <i class="fa-solid fa-heart text-pink-500 mt-1"></i>
                    <div class="text-left">${randomMsg}</div>
                </div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transition = 'all 0.4s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
                setTimeout(() => toast.remove(), 400);
            }, 2800);
        }
        
        function wakeUp() {
            const container = document.querySelector('.max-w-md');
            
            // 庆祝动画
            container.style.transition = 'all 0.6s ease';
            container.style.transform = 'scale(1.05)';
            
            // 撒花
            createConfetti();
            
            setTimeout(() => {
                container.innerHTML = `
                    <div class="p-8 text-center">
                        <div class="text-6xl mb-4">🎉</div>
                        <h2 class="text-3xl font-bold text-pink-600 mb-3">太棒了宝贝！</h2>
                        <p class="text-gray-600 mb-6">今天也要加油上班哦～<br>晚上回来给你准备惊喜！</p>
                        
                        <div class="flex justify-center gap-4">
                            <button onclick="location.reload()" 
                                    class="px-6 py-3 bg-pink-500 text-white rounded-2xl font-medium flex items-center gap-2">
                                <i class="fa-solid fa-redo"></i>
                                <span>再来一次</span>
                            </button>
                        </div>
                    </div>
                `;
            }, 800);
        }
        
        function snooze() {
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            
            const snoozeMsg = document.createElement('div');
            snoozeMsg.className = 'text-center py-4 text-pink-500 font-medium';
            snoozeMsg.innerHTML = `
                <i class="fa-solid fa-clock fa-spin mr-2"></i>
                好的...再睡5分钟哦～
            `;
            
            const container = document.querySelector('.max-w-md');
            container.appendChild(snoozeMsg);
            
            setTimeout(() => {
                snoozeMsg.remove();
                btns.forEach(b => b.disabled = false);
                coaxMore();
            }, 5000);
        }
        
        function createConfetti() {
            const colors = ['#ff69b4', '#c084fc', '#60a5fa', '#f472b6'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 8 + 6) + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                confetti.style.opacity = Math.random() * 0.8 + 0.5;
                
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
        
        // 自动说一句开场白
        setTimeout(() => {
            const status = document.getElementById('status');
            status.innerHTML = `
                <div class="inline-flex items-center gap-2 bg-pink-100 text-pink-600 px-4 py-2 rounded-full text-sm font-medium">
                    <i class="fa-solid fa-heart-pulse"></i>
                    <span>宝贝还在被窝里吗？</span>
                </div>
            `;
        }, 1500);
        
        // 键盘支持
        document.addEventListener('keypress', function(e) {
            if (e.key === "Enter") {
                coaxMore();
            }
        });
        
        console.log('%c[哄哄网页] 已加载完成～ 宝贝快起床吧！', 'color: #ec4899');
    </script>
</body>
</html>
