<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>果冻小卡</title>
<style>
  :root{
    --paper:#F3ECE2;
    --ink:#2C241C;
    --ink-soft:#6B5E52;
    --ink-faint:#A89888;
    --line:rgba(44,36,28,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Songti SC",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  }
  header{
    width:min(92vw,340px);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .mark{margin:0;font-size:13px;letter-spacing:.18em;color:var(--ink-faint);font-weight:400;}
  .en-btn{
    border:0;background:transparent;padding:4px 2px;
    font:inherit;font-size:12px;letter-spacing:.16em;color:var(--ink-faint);
  }
  .en-btn[aria-pressed="true"]{color:var(--ink);}

  .card{
    width:78vw;
    max-width:280px;
    border:0;
    padding:0;
    margin:0;
    background:transparent;
    display:block;
    text-align:left;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    appearance:none;
    -webkit-appearance:none;
  }
  .plate{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:2/3;
    border-radius:14px;
    overflow:hidden;
    background:#E7D9CC;
    box-shadow:0 18px 40px -16px rgba(44,36,28,.32);
  }
  .recto{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .verso{
    position:absolute;
    left:0;top:0;right:0;bottom:0;
    width:100%;
    height:100%;
    opacity:0;
    pointer-events:none;
  }
  .verso img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .card.is-back .verso{opacity:1;}
  .card.is-back .cap{opacity:0;}

  .cap{
    position:absolute;left:0;right:0;bottom:0;
    padding:2.6rem 1rem .9rem;
    background:linear-gradient(180deg,transparent,rgba(28,22,16,.58) 72%,rgba(28,22,16,.74));
    color:#F7F1EA;
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    pointer-events:none;
  }
  .cap b{display:block;font-size:18px;font-weight:500;}
  .en{display:none;font-style:italic;font-size:11px;opacity:.78;}
  body.en-on .en{display:block;}
  .no{font-size:11px;letter-spacing:.18em;opacity:.82;}

  .ink{
    position:absolute;left:0;top:0;right:0;bottom:0;
    padding:1.55rem 1.3rem 1.35rem;
    display:flex;flex-direction:column;
    color:#2C241C;
    writing-mode:horizontal-tb;
  }
  .series{font-size:10px;letter-spacing:.22em;color:var(--ink-faint);}
  .quote{
    margin-top:1.4rem;
    font-size:1.12rem;
    line-height:1.7;
    font-weight:500;
    white-space:normal;
    word-break:normal;
  }
  .foot{margin-top:auto;padding-top:1.6rem;font-size:11px;color:var(--ink-faint);}

  .hint{margin:16px 0 0;font-size:12px;letter-spacing:.08em;color:var(--ink-faint);}
  .flavors{
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
    margin-top:22px;width:min(92vw,340px);
  }
  .flavors button{
    border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);border-radius:999px;
    padding:6px 12px;font:inherit;font-size:13px;
  }
  .flavors button[aria-pressed="true"]{
    background:var(--ink);color:var(--paper);border-color:transparent;
  }
  .note{margin-top:28px;font-size:12px;color:var(--ink-faint);}
</style>
</head>

  var FLAVORS = [
    {id:"peach", zh:"蜜桃", en:"peach", no:"01"},
    {id:"berry", zh:"草莓", en:"berry", no:"02"},
    {id:"muscat", zh:"青提", en:"muscat", no:"03"},
    {id:"yuzu", zh:"柚子", en:"yuzu", no:"04"}
  ];
  var card = document.getElementById("card");
  var photo = document.getElementById("photo");
  var hint = document.getElementById("hint");
  var flavorsBox = document.getElementById("flavors");
  var enBtn = document.getElementById("en");

  FLAVORS.forEach(function(f, i){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = f.zh;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", function(e){
      e.stopPropagation();
      photo.src = PHOTOS[f.id];
      photo.alt = f.zh + "果冻";
      document.getElementById("zh").textContent = f.zh;
      document.getElementById("enName").textContent = f.en;
      document.getElementById("no").textContent = "No." + f.no;
      Array.prototype.forEach.call(flavorsBox.children, function(el){
        el.setAttribute("aria-pressed", el === b ? "true" : "false");
      });
      card.classList.remove("is-back");
      card.setAttribute("aria-pressed", "false");
      hint.textContent = "点一下翻面";
    });
    flavorsBox.appendChild(b);
  });

  card.addEventListener("click", function(){
    var back = card.classList.toggle("is-back");
    card.setAttribute("aria-pressed", back ? "true" : "false");
    card.setAttribute("aria-label", back ? "翻回正面" : "翻到背面");
    hint.textContent = back ? "再点回来" : "点一下翻面";
  });

  enBtn.addEventListener("click", function(){
    var on = document.body.classList.toggle("en-on");
    enBtn.setAttribute("aria-pressed", on ? "true" : "false");
  });
})();
</script>
