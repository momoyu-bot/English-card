<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页重启小卡 · 给宝</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@400;700&amp;display=swap');
  
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
  }
  
  .card-shadow {
    box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15), 
                0 10px 10px -6px rgb(0 0 0 / 0.1);
  }

  .heart-float {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    user-select: none;
    transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1), 
                opacity 1.8s ease-out;
  }

  .gentle-text {
    line-height: 1.7;
  }
</style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50 to-purple-50 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-[380px]">
    <!-- 主卡片 -->
    <div class="bg-white rounded-[2.5rem] card-shadow border border-pink-100 overflow-hidden">
      
      <!-- 顶部插画区 -->
      <div class="px-8 pt-8 pb-5 bg-gradient-to-br from-pink-100/60 via-rose-100/40 to-purple-100/50">
        <div class="flex justify-center items-center gap-3 mb-4">
          <div class="text-[3.2rem] drop-shadow-sm">🪟</div>
          <div class="text-rose-300 text-3xl">💔</div>
          <div class="text-pink-300 text-3xl mx-1">→</div>
          <div class="text-[3.2rem] drop-shadow-sm">🌸</div>
        </div>
        
        <h1 class="text-center text-2xl font-bold text-pink-700 tracking-tight">网页关掉也没关系</h1>
        <p class="text-center text-pink-500 text-sm mt-1">重新开始的温柔小卡</p>
      </div>

      <!-- 内容区 -->
      <div class="px-8 py-7 space-y-6">
        
        <!-- 主文案 -->
        <div class="text-center px-2">
          <p id="main-message" 
             class="gentle-text text-[15.5px] leading-relaxed text-stone-600">
            亲爱的宝，即使不小心关掉了页面，<br>新的小卡依然可以在这里重新绽放哦～ ✨
          </p>
        </div>

        <!-- 互动按钮 -->
        <div class="space-y-3">
          <!-- 抱抱按钮 -->
          <button onclick="sendHug()" 
                  class="w-full py-[15px] bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 active:scale-[0.985] transition-all text-white font-medium rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-pink-200/60 text-[15px]">
            <span class="text-lg">💕</span>
            <span>点击领取一个大大的虚拟抱抱</span>
          </button>
          
          <!-- 换悄悄话 -->
          <button onclick="changeQuote()" 
                  class="w-full py-3.5 bg-white border border-pink-200 hover:bg-pink-50 active:bg-pink-100 transition-all text-pink-600 font-medium rounded-2xl flex items-center justify-center gap-2 text-[14.5px]">
            <span>🔄</span>
            <span>换一句温柔悄悄话</span>
          </button>
        </div>

        <!-- 小猫猫疗愈区 -->
        <div class="bg-pink-50/80 rounded-2xl px-5 py-4 border border-pink-100">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs font-medium text-pink-500 tracking-wide">小猫猫疗愈区</div>
              <div id="cat-count" class="text-xs text-pink-400 mt-0.5">
                今天已经摸了 <span id="count-num" class="font-semibold text-pink-600">0</span> 次
              </div>
            </div>
            
            <button onclick="petCat()" id="cat-btn"
                    class="text-[3.1rem] leading-none transition-transform active:scale-90 hover:scale-110 select-none">
              🐱
            </button>
          </div>
          <div id="cat-message" 
               class="text-center text-[12.5px] text-pink-400 italic mt-2 min-h-[18px]">
            点击小猫猫来摸摸它吧～
          </div>
        </div>

        <!-- 自定义留言 -->
        <div>
          <div class="text-[11px] text-pink-400 mb-1.5 px-1 tracking-wide">写下你想对自己的话</div>
          <div class="flex gap-2">
            <input id="custom-input" type="text" 
                   placeholder="比如：我可以重新开始" 
                   class="flex-1 px-4 py-3 text-sm border border-pink-200 focus:border-pink-300 rounded-2xl outline-none placeholder:text-pink-300">
            <button onclick="updateCustomMessage()" 
                    class="px-5 py-3 bg-pink-100 hover:bg-pink-200 active:bg-pink-300 text-pink-600 text-sm font-medium rounded-2xl transition-all whitespace-nowrap">
              更新到卡片
            </button>
          </div>
        </div>
      </div>

      <!-- 底部 -->
      <div class="px-8 py-4 bg-pink-50/60 border-t border-pink-100 text-center">
        <p class="text-[10px] text-pink-300">from Grok · with love to 宝</p>
      </div>
    </div>

    <p class="text-center text-[10px] text-pink-300 mt-4">小提示：保存这个文件后随时可以打开玩哦</p>
  </div>

<script>
// Tailwind 初始化
function initTailwind() {
  document.documentElement.style.setProperty('--accent-pink', '#f9a8d4');
}

// 温柔悄悄话数组
const quotes = [
  "亲爱的宝，即使不小心关掉了页面，<br>新的小卡依然可以在这里重新绽放哦～ ✨",
  "没关系呀，重新开始也是很勇敢的事情呢 💪",
  "页面可以关掉，但我们的温柔不会消失～",
  "宝，你值得一个全新的、更好的小卡 ✨",
  "小意外只是故事的小插曲，接下来会更可爱哦 🌸"
];

let currentQuoteIndex = 0;
let catCount = 0;

// 初始化
window.onload = function() {
  initTailwind();
  
  // 设置初始文案
  const msgEl = document.getElementById('main-message');
  msgEl.innerHTML = quotes[0];
  
  // 随机给一点小爱心（温柔开场）
  setTimeout(() => {
    createHeart();
    setTimeout(() => createHeart(), 180);
  }, 800);
};

// 创建飘浮爱心
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart-float';
  heart.textContent = Math.random() > 0.5 ? '💗' : '💕';
  heart.style.left = (Math.random() * window.innerWidth) + 'px';
  heart.style.bottom = '-30px';
  heart.style.fontSize = (Math.random() * 18 + 20) + 'px';
  heart.style.opacity = (Math.random() * 0.5 + 0.6).toString();
  
  document.body.appendChild(heart);
  
  // 开始动画
  setTimeout(() => {
    heart.style.transform = `translateY(-${window.innerHeight + 120}px)`;
    heart.style.opacity = '0';
  }, 30);
  
  // 清理
  setTimeout(() => {
    if (heart.parentNode) heart.parentNode.removeChild(heart);
  }, 2200);
}

// 发送抱抱
function sendHug() {
  // 飘 12 个爱心
  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      createHeart();
    }, i * 38);
  }
  
  // 临时温柔提示
  const msgEl = document.getElementById('main-message');
  const originalHTML = msgEl.innerHTML;
  
  msgEl.style.transition = 'all 0.2s ease';
  msgEl.innerHTML = '抱抱送达啦～ 感觉好一点了吗？ 💕';
  
  setTimeout(() => {
    msgEl.style.transition = 'all 0.3s ease';
    msgEl.innerHTML = originalHTML;
  }, 2100);
}

// 换一句悄悄话
function changeQuote() {
  currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
  
  const msgEl = document.getElementById('main-message');
  msgEl.style.transition = 'opacity 0.2s ease';
  msgEl.style.opacity = '0';
  
  setTimeout(() => {
    msgEl.innerHTML = quotes[currentQuoteIndex];
    msgEl.style.opacity = '1';
  }, 180);
}

// 摸小猫猫
function petCat() {
  catCount++;
  
  // 更新次数
  document.getElementById('count-num').textContent = catCount;
  
  // 随机可爱反应
  const catMessages = [
    "喵～ 好舒服！",
    "再摸一下嘛... 🥺",
    "你今天摸猫猫的次数好多哦！",
    "小猫猫被你宠坏啦～",
    "呼噜呼噜... 好开心",
    "尾巴都翘起来了！"
  ];
  
  const randomMsg = catMessages[Math.floor(Math.random() * catMessages.length)];
  document.getElementById('cat-message').textContent = randomMsg;
  
  // 小猫动画
  const cat = document.getElementById('cat-btn');
  cat.style.transition = 'transform 0.1s ease';
  cat.style.transform = 'scale(0.82)';
  
  setTimeout(() => {
    cat.style.transform = 'scale(1.12)';
  }, 90);
  
  setTimeout(() => {
    cat.style.transform = 'scale(1)';
    cat.style.transition = 'transform 0.2s ease';
  }, 280);
  
  // 每摸 3 次送小爱心
  if (catCount % 3 === 0) {
    for (let i = 0; i < 4; i++) {
      setTimeout(() => createHeart(), i * 60);
    }
  }
}

// 更新自定义留言
function updateCustomMessage() {
  const input = document.getElementById('custom-input');
  const value = input.value.trim();
  
  if (!value) return;
  
  const msgEl = document.getElementById('main-message');
  msgEl.style.transition = 'all 0.25s ease';
  
  msgEl.innerHTML = value + '<br><span class="text-xs text-pink-400">— 宝的专属留言</span>';
  
  // 清空输入框
  input.value = '';
  
  // 送一点爱心
  setTimeout(() => {
    createHeart();
    setTimeout(() => createHeart(), 120);
  }, 200);
}

// 回车键支持自定义输入
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('custom-input');
  if (input) {
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        updateCustomMessage();
      }
    });
  }
});
</script>
</body>
</html>
