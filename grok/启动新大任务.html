<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>宝的新大任务启动仪式 ✨</title>
<meta name="description" content="只做第一步。五分钟规则。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;family=Comic+Neue:wght@700&amp;display=swap');
  body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  .kawaii { font-family: 'Comic Neue', cursive; }
  .task-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .task-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
  .soft-glow { box-shadow: 0 0 15px rgba(251, 207, 232, 0.4); }
</style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full">
    <!-- 头部 -->
    <div class="text-center mb-8">
      <div class="text-6xl mb-3">🌸</div>
      <h1 class="text-3xl font-bold text-purple-700 kawaii tracking-wider">宝的新大任务</h1>
      <p class="text-purple-500 mt-1">启动仪式 ✨</p>
      <p class="text-sm text-purple-400 mt-2">今天已经很用力清小任务了～<br>现在温柔地开启新篇章吧</p>
    </div>

    <!-- 主卡片 -->
    <div class="bg-white/90 backdrop-blur rounded-3xl p-8 shadow-xl task-card border border-pink-100">
      <div class="text-center mb-6">
        <div class="inline-block px-4 py-1 bg-pink-100 text-pink-600 rounded-full text-sm mb-4">只做第一步 · 5分钟规则</div>
        <h2 class="text-2xl font-bold text-gray-700">新大任务的名字是？</h2>
      </div>

      <!-- 输入 -->
      <div class="mb-6">
        <input id="taskName" type="text" placeholder="比如：写那个长期报告 / 学新技能 / 整理生活系统..." 
               class="w-full px-5 py-3 rounded-2xl border border-pink-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-200 outline-none text-lg placeholder:text-purple-300">
      </div>

      <!-- 启动按钮 -->
      <button onclick="startRitual()" 
              class="w-full py-4 bg-gradient-to-r from-purple-400 to-pink-400 hover:from-purple-500 hover:to-pink-500 text-white font-bold text-xl rounded-3xl shadow-lg active:scale-[0.985] transition-all flex items-center justify-center gap-3">
        <span>🌟</span> 
        <span>点击我，只做第一小步！</span>
      </button>

      <!-- 结果区（默认隐藏） -->
      <div id="result" class="hidden mt-8 pt-6 border-t border-pink-100">
        <div class="text-center">
          <div class="text-4xl mb-3">🦋</div>
          <p id="encourage" class="text-lg text-purple-600 font-medium mb-4"></p>
          
          <div class="bg-purple-50 rounded-2xl p-5 text-left mb-4">
            <p class="text-sm text-purple-500 mb-2">你的第一步可以是（任选一个）：</p>
            <div class="space-y-2 text-sm">
              <div onclick="chooseStep(this)" class="cursor-pointer px-4 py-2 bg-white rounded-xl border border-purple-100 hover:border-purple-300">📂 打开/新建一个文档或文件夹</div>
              <div onclick="chooseStep(this)" class="cursor-pointer px-4 py-2 bg-white rounded-xl border border-purple-100 hover:border-purple-300">✏️ 写下任务的3个关键词或大纲</div>
              <div onclick="chooseStep(this)" class="cursor-pointer px-4 py-2 bg-white rounded-xl border border-purple-100 hover:border-purple-300">⏱️ 设置一个25分钟计时器（番茄钟）</div>
              <div onclick="chooseStep(this)" class="cursor-pointer px-4 py-2 bg-white rounded-xl border border-purple-100 hover:border-purple-300">🧠 脑dump 5分钟：把脑子里所有相关想法写下来</div>
            </div>
          </div>

          <button onclick="finishFirstStep()" 
                  class="mt-2 px-8 py-2.5 text-sm bg-white border border-purple-200 hover:bg-purple-50 text-purple-600 rounded-2xl font-medium transition-all">
            我完成了第一步！（点这里庆祝）
          </button>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-purple-300 mt-6">慢慢来 · 不急 · 我在这儿陪你</p>
  </div>

<script>
function startRitual() {
  const nameInput = document.getElementById('taskName');
  const result = document.getElementById('result');
  const encourage = document.getElementById('encourage');
  
  let taskName = nameInput.value.trim() || '这个新大任务';
  
  result.classList.remove('hidden');
  encourage.innerHTML = `好的～「${taskName}」已经温柔地被看见了。<br>现在我们只迈出第一小步，好吗？`;
  
  // 滚动到结果区
  result.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function chooseStep(element) {
  // 视觉反馈
  document.querySelectorAll('#result .bg-white').forEach(el => el.classList.remove('!border-purple-400', '!bg-purple-50'));
  element.classList.add('!border-purple-400', '!bg-purple-50');
  
  setTimeout(() => {
    const encourage = document.getElementById('encourage');
    encourage.innerHTML = `太好了！这个小步已经足够温柔。<br>大脑现在应该已经启动了～ 继续保持这个节奏就好。`;
  }, 600);
}

function finishFirstStep() {
  const result = document.getElementById('result');
  result.innerHTML = `
    <div class="text-center py-4">
      <div class="text-5xl mb-4">🌷</div>
      <p class="text-xl font-bold text-purple-600 mb-2">第一步完成！</p>
      <p class="text-purple-500">你已经比大多数人更进一步了。<br>今天可以骄傲地休息或继续一点点～</p>
      <div class="mt-6 text-sm text-purple-400">周末见！新大任务已经有了开端，它会等你的。</div>
    </div>
  `;
}
</script>
</body>
</html>
