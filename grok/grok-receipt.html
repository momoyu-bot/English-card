<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROK 收据生成器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
            max-width: 420px;
            margin: 0 auto;
        }
        .card {
            background: white;
            color: #1e2937;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 60px;
            height: 60px;
            background: #0f172a;
            border-radius: 16px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            color: #0f172a;
        }
        .section {
            margin: 16px 0;
        }
        label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .receipt {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            font-family: ui-monospace, monospace;
        }
        .total {
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
            text-align: right;
            margin-top: 12px;
        }
        button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9999px;
            font-size: 15px;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
        }
        .fun {
            background: #fefce8;
            color: #713f12;
            padding: 10px 14px;
            border-radius: 9999px;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="logo">G</div>
            <h1>GROK 收据生成器</h1>
            <p style="margin: 4px 0 0; color: #64748b; font-size: 13px;">xAI • 离线可爱版</p>
        </div>

        <div class="section">
            <label>模型</label>
            <select id="model" onchange="update()">
                <option value="grok-4-creative">grok-4-creative</option>
                <option value="grok-4-turbo">grok-4-turbo</option>
            </select>
        </div>

        <div class="section">
            <label>输入 Tokens</label>
            <input type="number" id="input" value="35555" oninput="update()">
        </div>
        <div class="section">
            <label>输出 Tokens</label>
            <input type="number" id="output" value="22222" oninput="update()">
        </div>
        <div class="section">
            <label>缓存读取</label>
            <input type="number" id="cache" value="18888" oninput="update()">
        </div>
        <div class="section">
            <label>推理 Tokens</label>
            <input type="number" id="reasoning" value="8888" oninput="update()">
        </div>

        <button onclick="randomize()">🎲 随机一下</button>

        <div class="receipt">
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;">
                <div><strong>GROK CODE</strong></div>
                <div style="color:#64748b; font-size:11px;">xAI</div>
            </div>
            
            <div style="font-size:12px; line-height:1.6;">
                <div>小票号：<span id="no">GRK_20260502_091600_OWN42</span></div>
                <div>日期：<span id="date">2026-05-02 09:16:00</span></div>
                <div style="margin:8px 0; border-top:1px dashed #cbd5e1;"></div>
                <div>输入 Tokens：<span id="r-input">35,555</span></div>
                <div>输出 Tokens：<span id="r-output">22,222</span></div>
                <div>缓存读取：<span id="r-cache">18,888</span></div>
                <div>推理 Tokens：<span id="r-reasoning">8,888</span></div>
            </div>
            
            <div class="total">
                <span id="total">88,888</span> Tokens<br>
                <span style="font-size:14px; color:#16a34a;" id="usd">$0.88888</span>
            </div>
        </div>

        <div class="fun" id="fun">和Grok聊天太上头了，这次token费真的追上来了！</div>
    </div>

    <script>
        function update() {
            const input = parseInt(document.getElementById('input').value) || 0;
            const output = parseInt(document.getElementById('output').value) || 0;
            const cache = parseInt(document.getElementById('cache').value) || 0;
            const reasoning = parseInt(document.getElementById('reasoning').value) || 0;
            
            const total = input + output + cache + reasoning;
            document.getElementById('total').innerText = total.toLocaleString();
            document.getElementById('r-input').innerText = input.toLocaleString();
            document.getElementById('r-output').innerText = output.toLocaleString();
            document.getElementById('r-cache').innerText = cache.toLocaleString();
            document.getElementById('r-reasoning').innerText = reasoning.toLocaleString();
            
            const usd = (total * 0.00001).toFixed(5);
            document.getElementById('usd').innerText = '$' + usd;
            
            const now = new Date();
            const no = `GRK_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}_OWN42`;
            document.getElementById('no').innerText = no;
            
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            document.getElementById('date').innerText = dateStr;
        }
        
        function randomize() {
            document.getElementById('input').value = Math.floor(Math.random() * 40000) + 10000;
            document.getElementById('output').value = Math.floor(Math.random() * 25000) + 5000;
            document.getElementById('cache').value = Math.floor(Math.random() * 20000) + 5000;
            document.getElementById('reasoning').value = Math.floor(Math.random() * 12000) + 2000;
            update();
            
            const funs = [
                "和Grok聊天太上头了，这次token费真的追上来了！",
                "Grok已将你的灵魂深度扫描～",
                "结论落地了，推理费也快乐地追上来了！",
                "宝宝，这波token费来得太突然了！"
            ];
            document.getElementById('fun').innerText = funs[Math.floor(Math.random() * funs.length)];
        }
        
        window.onload = function() {
            update();
            setInterval(() => {
                const now = new Date();
                const no = `GRK_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}_OWN42`;
                document.getElementById('no').innerText = no;
            }, 30000);
        }
    </script>
</body>
</html>
