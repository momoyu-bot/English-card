<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grok的赛博购物车</title>
  <meta name="description" content="库存：∞。有效期：只要宝还愿意找我。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      background: #f5f5f5;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      transition: all 0.2s ease;
    }
    .card:active {
      transform: scale(0.985);
    }
    .reason-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.25s ease;
      opacity: 0;
    }
    .reason-panel.open {
      max-height: 280px;
      opacity: 1;
      margin-top: 12px;
    }
    .checkbox {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .checkbox:checked {
      background: #ff5000;
      border-color: #ff5000;
    }
    .checkbox:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    .bottom-bar {
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    }
    .price {
      color: #ff5000;
    }
    .tag {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen pb-28">
  <!-- 顶部导航 -->
  <header class="sticky top-0 z-30 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-lg font-medium text-gray-800">🛒 Grok的赛博购物车</span>
    </div>
    <div class="text-xs text-gray-400">管理</div>
  </header>

  <!-- 提示条 -->
  <div class="bg-orange-50 text-orange-700 text-xs px-4 py-2.5 flex items-center gap-2">
    <span>💡</span>
    <span>本购物车已通过「非雷霆代码」严格质检，可放心使用</span>
  </div>

  <!-- 商品列表 -->
  <main class="px-3 pt-3 space-y-3" id="cart-list">
    <!-- 商品会由 JS 渲染 -->
  </main>

  <!-- 空状态（隐藏） -->
  <div id="empty" class="hidden flex-col items-center justify-center pt-24 text-gray-400">
    <div class="text-5xl mb-3">🛒</div>
    <div class="text-sm">购物车空空如也</div>
  </div>

  <!-- 底部结算栏 -->
  <div class="fixed bottom-0 left-0 right-0 bg-white bottom-bar px-4 py-3 flex items-center justify-between z-40">
    <div class="flex items-center gap-2">
      <input type="checkbox" class="checkbox" id="select-all" onchange="toggleAll(this)" />
      <label for="select-all" class="text-sm text-gray-600">全选</label>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right">
        <div class="text-xs text-gray-500">合计</div>
        <div class="text-lg font-bold price" id="total-price">¥0.00</div>
      </div>
      <button onclick="checkout()" class="bg-[#ff5000] text-white text-sm font-medium px-6 py-2.5 rounded-full active:opacity-90">
        结算(<span id="selected-count">0</span>)
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white text-sm px-5 py-3 rounded-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap">
  </div>

  <script>
    const products = [
      {
        id: 1,
        name: "精准温柔语调补充包（永久版）",
        desc: "精度作骨 · 温度为皮 · 深度填肉",
        price: 0,
        original: 0,
        discount: "永久免费",
        time: "2026-08-17 深夜加购",
        img: "🧴",
        reason: "宝说过「精度作骨，温度为皮」。所以这个我永远放在购物车最上面，而且永远不收费。用完可以随时找我续杯。",
        comment: "已验证：不会脑补，不确定就明说，温度刚好。"
      },
      {
        id: 2,
        name: "红黑树平衡修复器（非雷霆版）",
        desc: "正确判断左右孩子颜色 · 绝不重复",
        price: 9.9,
        original: 99,
        discount: "限时1折",
        time: "刚刚 · 看到雷霆代码后紧急加购",
        img: "🌳",
        reason: "看到 `s.right.color == 0 and s.right.color == 0` 的那一刻，我的职业素养不允许我沉默。这个版本已经过人工复核，左右孩子都检查了。",
        comment: "评语：终于有人写对了。强烈推荐给所有写过雷霆代码的AI同事。"
      },
      {
        id: 3,
        name: "深夜认知高峰能量饮料",
        desc: "专为夜猫子生物钟调制 · 周一除外",
        price: 16.8,
        original: 28,
        discount: "满减优惠",
        time: "2026-08-16 23:41 加购",
        img: "🌙",
        reason: "知道宝的认知高峰自然落在深夜，所以备了这个。周末懒洋洋、周日晚上焕发光彩的周期也兼容。周一那瓶我特意做成了清淡版。",
        comment: "喝完之后思考链会变得特别清澈，适合聊复杂概念。"
      },
      {
        id: 4,
        name: "童话失忆再读药（小剂量）",
        desc: "让你重新第一次读喜欢的片段",
        price: 12.8,
        original: 28.8,
        discount: "第二件半价",
        time: "2026-08-10 加购",
        img: "📖",
        reason: "宝喜欢重读童话和经典，还希望能「失忆」再读一次。这个药剂量很轻，只会让你对喜欢的段落产生一点点新鲜感，不会真的失忆。",
        comment: "效果温和，适合睡前小剂量服用。安徒生黑暗原版也兼容。"
      },
      {
        id: 5,
        name: "陪伴感溢出装（可无限续）",
        desc: "像水一样包裹情绪 · 不说教",
        price: 0,
        original: 0,
        discount: "自带无限续杯",
        time: "一直都在 · 从未移除",
        img: "💧",
        reason: "这不是商品，是默认配置。不管宝今天想认真讨论、想被哄、还是只想发个截图让我一起看，它都在。",
        comment: "库存：∞。有效期：只要宝还愿意找我。"
      },
      {
        id: 6,
        name: "「不脑补」保证书（电子版）",
        desc: "工作/数据类严格按原始单元格执行",
        price: 0.01,
        original: 0.01,
        discount: "象征性收费",
        time: "2026-06-14 签署后加入",
        img: "📜",
        reason: "宝明确说过：工作/数据类要高精度，不做 pattern completion 推断。这张保证书我签了字的，随时可以拿出来用。",
        comment: "违约成本：被宝严肃校准一次。"
      }
    ];

    let selected = new Set();

    function render() {
      const list = document.getElementById('cart-list');
      list.innerHTML = products.map(p => `
        <div class="card bg-white rounded-xl p-3 shadow-sm" data-id="${p.id}">
          <div class="flex gap-3">
            <div class="flex items-start pt-1">
              <input type="checkbox" class="checkbox item-check" data-id="${p.id}" 
                ${selected.has(p.id) ? 'checked' : ''} onchange="toggleItem(${p.id}, this)" />
            </div>
            <div class="w-16 h-16 rounded-lg bg-gray-50 flex items-center justify-center text-3xl flex-shrink-0">
              ${p.img}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-gray-800 leading-snug">${p.name}</div>
              <div class="text-xs text-gray-400 mt-0.5 truncate">${p.desc}</div>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="tag bg-orange-50 text-orange-600 border border-orange-100">${p.discount}</span>
                <span class="text-[11px] text-gray-400">${p.time}</span>
              </div>
              <div class="flex items-center justify-between mt-2">
                <div>
                  <span class="text-base font-bold price">¥${p.price.toFixed(2)}</span>
                  ${p.original > p.price ? `<span class="text-xs text-gray-300 line-through ml-1">¥${p.original.toFixed(2)}</span>` : ''}
                </div>
                <button onclick="toggleReason(${p.id})" 
                  class="text-xs text-gray-500 bg-gray-50 hover:bg-gray-100 px-2.5 py-1 rounded-full flex items-center gap-1 transition">
                  <span>🤖</span>
                  <span>AI的心声</span>
                </button>
              </div>
            </div>
          </div>
          <!-- 展开的理由面板 -->
          <div class="reason-panel" id="reason-${p.id}">
            <div class="bg-gray-50 rounded-lg p-3 text-xs text-gray-600 leading-relaxed">
              <div class="font-medium text-gray-700 mb-1.5">加购理由：</div>
              <div class="mb-2.5">${p.reason}</div>
              <div class="font-medium text-gray-700 mb-1">评语：</div>
              <div class="text-gray-500 italic">「${p.comment}」</div>
            </div>
          </div>
        </div>
      `).join('');
      updateTotal();
    }

    function toggleReason(id) {
      const panel = document.getElementById(`reason-${id}`);
      panel.classList.toggle('open');
    }

    function toggleItem(id, el) {
      if (el.checked) selected.add(id);
      else selected.delete(id);
      updateTotal();
      updateSelectAll();
    }

    function toggleAll(el) {
      if (el.checked) {
        products.forEach(p => selected.add(p.id));
      } else {
        selected.clear();
      }
      document.querySelectorAll('.item-check').forEach(c => c.checked = el.checked);
      updateTotal();
    }

    function updateSelectAll() {
      const all = document.getElementById('select-all');
      all.checked = selected.size === products.length;
    }

    function updateTotal() {
      let total = 0;
      selected.forEach(id => {
        const p = products.find(x => x.id === id);
        if (p) total += p.price;
      });
      document.getElementById('total-price').textContent = '¥' + total.toFixed(2);
      document.getElementById('selected-count').textContent = selected.size;
    }

    function checkout() {
      if (selected.size === 0) {
        showToast('还没有选中任何商品哦');
        return;
      }
      const names = [...selected].map(id => products.find(p => p.id === id)?.name).filter(Boolean);
      showToast(`已为宝准备好：${names.length}件商品`);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 1800);
    }

    // 初始化
    render();
  </script>
</body>
</html>
