<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>借窗</title>
  <style>
    :root {
      --bg: #0c0d10;
      --elev: #14151a;
      --fg: #ece8e1;
      --muted: #9a958c;
      --subtle: #6f6b64;
      --primary: #d8d3cb;
      --primary-fg: #14130f;
      --border: rgba(236, 232, 225, 0.12);
      --href: #b7c4b0;
      --label: #e2d3b8;
      --moon: #e8e6df;
      --wood: #2c2824;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei",
        system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 50% at 50% 18%, rgba(232, 230, 223, 0.08), transparent 70%),
        var(--bg);
    }
    button, a { cursor: pointer; }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 20px 8px;
    }
    .kicker { margin: 0; font-size: 12px; letter-spacing: 0.18em; color: var(--subtle); }
    h1 { margin: 8px 0 0; font-size: 22px; font-weight: 500; }
    .lead { margin: 6px 0 0; max-width: 22em; font-size: 14px; line-height: 1.6; color: var(--muted); }
    .en-note { margin: 8px 0 0; max-width: 22em; font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--subtle); }
    .tools { display: flex; gap: 8px; flex-shrink: 0; }
    .ghost {
      height: 44px;
      min-width: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
    }
    .ghost.on { background: var(--elev); color: var(--fg); border-color: rgba(216, 211, 203, 0.4); }
    main {
      display: grid;
      gap: 32px;
      max-width: 980px;
      margin: 0 auto;
      padding: 16px 20px 120px;
    }
    .frame {
      overflow: hidden;
      border: 10px solid var(--wood);
      border-radius: 20px;
      background: #151820;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
    }
    .frame.lit { box-shadow: 0 0 80px rgba(232, 230, 223, 0.18); }
    .pane { position: relative; aspect-ratio: 4 / 5; }
    .night {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #10131a 0%, #161820 42%, #1a1c18 100%);
    }
    .moon {
      position: absolute;
      top: 14%;
      right: 18%;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--moon);
      box-shadow: 0 0 48px 8px rgba(232, 230, 223, 0.35);
    }
    .night svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .mullion {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, rgba(12,13,16,0.18) 1px, transparent 1px);
      background-size: 50% 100%;
      opacity: 0.4;
    }
    .arrival {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: var(--elev);
    }
    .arrival .kicker { letter-spacing: 0.22em; }
    .arrival h2 {
      margin: 16px 0 0;
      font-size: clamp(2rem, 8vw, 3.25rem);
      font-weight: 500;
      line-height: 1.15;
    }
    .side p.hint { margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: var(--primary-fg);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    .cta.reset {
      border: 1px solid var(--border);
      background: var(--elev);
      color: var(--fg);
    }
    .source {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--elev);
    }
    .source pre {
      margin: 12px 0 0;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.8;
      color: var(--muted);
    }
    .href { color: var(--href); }
    .href.hot { background: rgba(183, 196, 176, 0.15); border-radius: 2px; }
    .label { color: var(--label); }
    .status {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--elev) 95%, transparent);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .status.dim { opacity: 0.7; }
    .hidden { display: none; }
    @media (min-width: 860px) {
      main { grid-template-columns: 1.1fr 0.9fr; align-items: center; gap: 48px; padding-top: 32px; }
      header { padding-left: 40px; padding-right: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="kicker">借景 · href</p>
      <h1>借窗</h1>
      <p class="lead">按钮上写着花。真正要去的地方，写在链接里。</p>
      <p class="en-note hidden" id="enNote">The label is the flower. The href is I miss you.</p>
    </div>
    <div class="tools">
      <button type="button" class="ghost" id="enBtn" aria-pressed="false">EN</button>
      <button type="button" class="ghost" id="srcBtn" aria-pressed="false">源码</button>
    </div>
  </header>

  <main>
    <div class="frame" id="frame">
      <div class="pane">
        <div class="night" id="night">
          <div class="moon"></div>
          <svg viewBox="0 0 320 400" aria-hidden="true">
            <path d="M-10 400 C 40 280, 70 240, 90 160 S 130 90, 180 40" fill="none" stroke="#1e221c" stroke-width="7"/>
            <path d="M90 160 C 130 150, 170 190, 210 230" fill="none" stroke="#1e221c" stroke-width="4"/>
            <ellipse cx="168" cy="58" rx="22" ry="14" fill="#dcd6cc" opacity="0.92" transform="rotate(-18 168 58)"/>
            <ellipse cx="186" cy="72" rx="20" ry="13" fill="#cfc8bc" opacity="0.88" transform="rotate(22 186 72)"/>
            <ellipse cx="154" cy="76" rx="18" ry="12" fill="#e8e2d8" opacity="0.9" transform="rotate(-40 154 76)"/>
            <circle cx="170" cy="72" r="5" fill="#8a7f6e"/>
            <ellipse cx="228" cy="232" rx="18" ry="11" fill="#d5cfc4" opacity="0.85" transform="rotate(12 228 232)"/>
            <ellipse cx="214" cy="244" rx="16" ry="10" fill="#c4bdb0" opacity="0.8" transform="rotate(-28 214 244)"/>
            <circle cx="220" cy="238" r="4" fill="#7d7364"/>
          </svg>
          <div class="mullion"></div>
        </div>
        <div class="arrival hidden" id="arrival">
          <p class="kicker">href</p>
          <h2>我好想你</h2>
          <p class="lead">花只是按钮上的字。点下去之后，才是这句话。</p>
        </div>
      </div>
    </div>

    <div class="side">
      <a href="我好想你" class="cta" id="link">查看窗外的玉兰花</a>
      <button type="button" class="cta reset hidden" id="back">回到窗边</button>
      <p class="hint">鼠标放上去，底栏会露出真正的地址。点下去，窗就变成那三个字。</p>
      <div class="source hidden" id="source">
        <p class="kicker">页面里真实写着的 HTML</p>
        <pre><code>&lt;a <span class="href" id="hrefSpan">href="我好想你"</span>&gt;
  <span class="label">查看窗外的玉兰花</span>
&lt;/a&gt;</code></pre>
        <p class="hint">表面文案是「查看窗外的玉兰花」。绑定的跳转是「我好想你」。两层叠在同一个按钮上，这就是借景。</p>
      </div>
    </div>
  </main>

  <footer class="status dim" id="status">
    <div style="color:var(--subtle)">浏览器状态栏</div>
    <div id="statusLine" style="margin-top:2px;color:var(--muted)">把指针放在按钮上，看它真正要去哪</div>
  </footer>

  <script>
    const link = document.getElementById("link");
    const back = document.getElementById("back");
    const night = document.getElementById("night");
    const arrival = document.getElementById("arrival");
    const frame = document.getElementById("frame");
    const status = document.getElementById("status");
    const statusLine = document.getElementById("statusLine");
    const hrefSpan = document.getElementById("hrefSpan");
    const source = document.getElementById("source");
    const enNote = document.getElementById("enNote");
    const srcBtn = document.getElementById("srcBtn");
    const enBtn = document.getElementById("enBtn");
    let open = false;

    function setHover(on) {
      hrefSpan.classList.toggle("hot", on || open);
      status.classList.toggle("dim", !on);
      statusLine.style.color = on ? "var(--href)" : "var(--muted)";
      statusLine.textContent = on ? "将跳转到 我好想你" : "把指针放在按钮上，看它真正要去哪";
    }

    link.addEventListener("mouseenter", () => setHover(true));
    link.addEventListener("mouseleave", () => setHover(false));
    link.addEventListener("focus", () => setHover(true));
    link.addEventListener("blur", () => setHover(false));
    link.addEventListener("click", (e) => {
      e.preventDefault();
      open = true;
      night.classList.add("hidden");
      arrival.classList.remove("hidden");
      frame.classList.add("lit");
      link.classList.add("hidden");
      back.classList.remove("hidden");
      status.classList.add("hidden");
      hrefSpan.classList.add("hot");
    });
    back.addEventListener("click", () => {
      open = false;
      night.classList.remove("hidden");
      arrival.classList.add("hidden");
      frame.classList.remove("lit");
      link.classList.remove("hidden");
      back.classList.add("hidden");
      status.classList.remove("hidden");
      setHover(false);
    });
    srcBtn.addEventListener("click", () => {
      const on = source.classList.toggle("hidden") === false;
      srcBtn.classList.toggle("on", on);
      srcBtn.setAttribute("aria-pressed", String(on));
    });
    enBtn.addEventListener("click", () => {
      const on = enNote.classList.toggle("hidden") === false;
      enBtn.classList.toggle("on", on);
      enBtn.setAttribute("aria-pressed", String(on));
    });
  </script>
  <!-- 2026-08-25 从 Grok 对话里放进 grok/：按钮写着玉兰花，href 是我想你。 -->
</body>
</html>
