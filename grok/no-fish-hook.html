<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>不被组长钓走自救屋</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-teal-100 via-cyan-50 to-sky-100 min-h-screen py-8 px-4">
  <div class="max-w-xl mx-auto bg-white/95 backdrop-blur rounded-3xl shadow-2xl border border-teal-200 p-8">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2">
        <span class="text-3xl">🎣</span>
        <span class="font-bold text-2xl text-teal-500">不被钓走自救屋</span>
      </div>
      <p class="text-teal-400 text-sm mt-1">每次被拉走，都记录一下，让自己看见真实情况</p>
    </div>

    <!-- 计数器 -->
    <div class="flex justify-center gap-6 mb-6">
      <div class="text-center">
        <div id="today-count" class="text-5xl font-bold text-teal-500">0</div>
        <div class="text-xs text-teal-400">今天被钓走</div>
      </div>
      <div class="text-center">
        <div id="week-count" class="text-5xl font-bold text-teal-400">0</div>
        <div class="text-xs text-teal-400">本周累计</div>
      </div>
    </div>

    <!-- 记录突发任务 -->
    <div class="mb-5">
      <div class="text-sm text-teal-400 mb-2 px-1">刚被钓走的突发任务是什么？</div>
      <div class="flex gap-2">
        <input id="task-input" type="text" 
               class="flex-1 p-3 text-sm border border-teal-200 focus:border-teal-400 rounded-2xl bg-white"
               placeholder="比如：临时改一个页面 / 紧急对齐一个需求">
        <button onclick="logSuddenTask()" 
                class="px-6 bg-teal-500 hover:bg-teal-600 text-white rounded-2xl text-sm font-medium">记录</button>
      </div>
    </div>

    <!-- 已记录列表 -->
    <div id="task-list-area" class="mb-6">
      <div class="text-xs text-teal-400 mb-2 px-1">已记录的突发任务（点击处理方式）</div>
      <div id="task-list" class="space-y-2"></div>
    </div>

    <!-- 保护今日 -->
    <button onclick="protectToday()" 
            class="w-full py-3.5 bg-white border border-teal-300 hover:bg-teal-50 text-teal-500 rounded-2xl text-sm font-medium flex items-center justify-center gap-2 mb-4">
      <span>🛡️</span> <span>给我一个今日防钓鱼保护块</span>
    </button>

    <!-- 话术区 -->
    <div id="script-area" class="hidden bg-teal-50 border border-teal-200 rounded-2xl p-4 text-sm text-teal-600 mb-4">
      <div class="font-medium mb-1">可以这样回复组长（不硬刚）：</div>
      <div id="script-text"></div>
    </div>

    <div id="message" class="min-h-[28px] text-center text-sm text-emerald-500"></div>
  </div>

<script>
let todayCount = 0;
let weekCount = 0;
let tasks = [];

function updateCounts() {
  document.getElementById('today-count').textContent = todayCount;
  document.getElementById('week-count').textContent = weekCount;
}

function logSuddenTask() {
  const input = document.getElementById('task-input');
  const val = input.value.trim();
  if (!val) return;

  const task = {
    id: Date.now(),
    text: val,
    time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})
  };
  tasks.unshift(task);
  todayCount++;
  weekCount++;
  
  input.value = '';
  renderTasks();
  updateCounts();
  showMessage('已记录～ 看见它被拉走的感觉很重要');
}

function renderTasks() {
  const container = document.getElementById('task-list');
  container.innerHTML = '';
  
  if (tasks.length === 0) {
    container.innerHTML = `<div class="text-xs text-teal-300 px-2">还没有记录～</div>`;
    return;
  }
  
  tasks.forEach((task, index) => {
    const div = document.createElement('div');
    div.className = `flex items-center justify-between gap-3 p-3 bg-white border border-teal-200 rounded-2xl text-sm`;
    div.innerHTML = `
      <div class="flex-1">
        <div class="text-gray-600">${task.text}</div>
        <div class="text-[10px] text-teal-300">${task.time}</div>
      </div>
      <div class="flex gap-1">
        <button onclick="handleTask(${index}, 'now')" class="text-xs px-2.5 py-1 bg-teal-100 hover:bg-teal-200 text-teal-600 rounded-xl">现在做</button>
        <button onclick="handleTask(${index}, 'defer')" class="text-xs px-2.5 py-1 bg-white border border-teal-200 hover:bg-teal-50 text-teal-500 rounded-xl">稍后</button>
        <button onclick="handleTask(${index}, 'priority')" class="text-xs px-2.5 py-1 bg-white border border-teal-200 hover:bg-teal-50 text-teal-500 rounded-xl">问优先级</button>
      </div>
    `;
    container.appendChild(div);
  });
}

function handleTask(index, action) {
  const task = tasks[index];
  let msg = '';
  let script = '';

  if (action === 'now') {
    msg = '好的，先处理这个突发任务';
  } else if (action === 'defer') {
    msg = '已记录，稍后安排';
    script = `“我现在手头有计划中的任务，这个突发需求我记录下来，确认优先级后尽快处理，您看可以吗？”`;
  } else if (action === 'priority') {
    msg = '已建议问优先级';
    script = `“我正在做XX，这个新任务我先记下来，能告诉我它的优先级吗？这样我可以合理安排时间。”`;
  }

  // 移除已处理的任务
  tasks.splice(index, 1);
  renderTasks();

  if (script) {
    document.getElementById('script-area').classList.remove('hidden');
    document.getElementById('script-text').innerHTML = script;
  }
  
  showMessage(msg);
}

function protectToday() {
  document.getElementById('script-area').classList.remove('hidden');
  document.getElementById('script-text').innerHTML = 
    `“今天我计划专注处理XX（主线任务），如果有突发需求可以发给我，我会记录并在主线告一段落后处理。这样能保证计划推进，您看可以吗？”`;
  
  showMessage('已经给你一个保护块了～ 试试发给组长');
}

function showMessage(msg) {
  const m = document.getElementById('message');
  m.style.transition = 'none';
  m.style.opacity = '1';
  m.innerHTML = msg;
  setTimeout(() => {
    m.style.transition = 'opacity 1s ease';
    m.style.opacity = '0';
  }, 2000);
}

function init() {
  updateCounts();
  document.getElementById('task-list').innerHTML = `<div class="text-xs text-teal-300 px-2">还没有记录～</div>`;
  
  setTimeout(() => {
    const m = document.getElementById('message');
    m.style.opacity = '0.5';
    m.innerHTML = '每次被钓走就记录一下，你会慢慢看见真实情况';
    setTimeout(() => m.style.opacity = '0', 2800);
  }, 1500);
}

init();
</script>
</body>
</html>
