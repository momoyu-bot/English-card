<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>每周盘问自救 + 集中还是关联小屋</title>
<meta name="description" content="集中还是关联，不用二选一。先看哪种让你不那么融化。">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-violet-100 via-purple-50 to-sky-100 min-h-screen py-8 px-4">
  <div class="max-w-2xl mx-auto bg-white/95 backdrop-blur rounded-3xl shadow-2xl border border-purple-200 p-8">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2">
        <span class="text-3xl">🌀</span>
        <span class="font-bold text-2xl text-purple-500">集中还是关联？</span>
      </div>
      <p class="text-purple-400 text-sm mt-1">不用二选一，先试试看哪种让你不那么融化</p>
    </div>

    <div class="mb-5">
      <div class="text-sm text-purple-400 mb-2 px-1">把你这次被盘问的计划粘贴/写在这里</div>
      <textarea id="plan-input" rows="6" 
                class="w-full p-4 text-sm border border-purple-200 focus:border-purple-400 rounded-2xl bg-white resize-y"
                placeholder="周一：需求评审 + 写周报 + 跟进A项目&#10;周二：优化B流程 + 准备C会议 + 研究新工具..."></textarea>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-6">
      <button onclick="generateFocusVersion()" 
              class="py-4 bg-gradient-to-r from-purple-500 to-violet-500 text-white rounded-2xl font-medium flex items-center justify-center gap-2">
        <span>🎯</span> <span>生成集中版（组长友好）</span>
      </button>
      <button onclick="generateConnectVersion()" 
              class="py-4 bg-white border border-purple-300 hover:border-purple-400 text-purple-500 rounded-2xl font-medium flex items-center justify-center gap-2">
        <span>🧩</span> <span>生成关联版（保留你的思考）</span>
      </button>
    </div>

    <!-- 输出区 -->
    <div id="output-area" class="hidden">
      <div class="flex items-center gap-2 mb-3 px-1">
        <div id="version-title" class="font-medium text-purple-500"></div>
      </div>
      <div id="output-content" class="bg-white border border-purple-200 rounded-2xl p-5 text-sm leading-relaxed mb-4 whitespace-pre-line"></div>
      
      <div class="text-xs text-purple-400 mb-2 px-1">想对组长怎么说？（可直接复制）</div>
      <div id="reply-script" class="bg-purple-50 border border-purple-200 rounded-2xl p-4 text-sm text-purple-600 mb-4"></div>
    </div>

    <div id="message" class="min-h-[32px] text-center text-sm text-emerald-500"></div>
  </div>

<script>
function showMessage(msg) {
  const m = document.getElementById('message');
  m.style.transition = 'none';
  m.style.opacity = '1';
  m.innerHTML = msg;
  setTimeout(() => {
    m.style.transition = 'opacity 1s ease';
    m.style.opacity = '0';
  }, 2200);
}

function generateFocusVersion() {
  const input = document.getElementById('plan-input').value.trim();
  if (!input) { showMessage('先把计划写进来～'); return; }
  
  const lines = input.split('\n').filter(l => l.trim());
  if (lines.length === 0) return;
  
  // 简单取前3条作为主线
  const top3 = lines.slice(0, 3);
  const rest = lines.slice(3);
  
  let html = `本周主线（集中）：
`;
  top3.forEach((l, i) => html += `• ${l}\n`);
  
  if (rest.length > 0) {
    html += `\n关联支持任务（仅在主线完成后进行）：
`;
    rest.forEach(l => html += `• ${l}\n`);
  }
  
  document.getElementById('output-area').classList.remove('hidden');
  document.getElementById('version-title').innerHTML = '🎯 集中版（推荐给组长看）';
  document.getElementById('output-content').innerHTML = html;
  
  document.getElementById('reply-script').innerHTML = 
    `“我理解您希望我更聚焦，本周我把XX和XX作为主线，其他关联任务会作为支持，等主线有进展后再推进。您看这样可以吗？”`;
  
  showMessage('集中版已生成～ 这样被盘问的点会少很多');
}

function generateConnectVersion() {
  const input = document.getElementById('plan-input').value.trim();
  if (!input) { showMessage('先把计划写进来～'); return; }
  
  const lines = input.split('\n').filter(l => l.trim());
  
  let html = `本周整体关联路径：
我把所有任务都服务于「XXX目标」（你可以自己填核心目标），它们是互相支持的：

`;
  lines.forEach((l, i) => {
    html += `• ${l}\n`;
    if (i < lines.length - 1) html += `   ↳ 与下一项关联：共同服务于主目标\n`;
  });
  
  document.getElementById('output-area').classList.remove('hidden');
  document.getElementById('version-title').innerHTML = '🧩 关联版（保留你的思考方式）';
  document.getElementById('output-content').innerHTML = html;
  
  document.getElementById('reply-script').innerHTML = 
    `“我意识到上周任务看起来比较分散，本周我会明确一条主线，其他任务都会写清楚它们如何支持这条主线。这样既能保持关联性，也更聚焦。您觉得呢？”`;
  
  showMessage('关联版已生成～ 这是你真实的感觉，没必要完全否定它');
}

function init() {
  setTimeout(() => {
    const m = document.getElementById('message');
    m.style.opacity = '0.6';
    m.innerHTML = '试试生成两种版本，对比一下哪种让你心里更舒服';
    setTimeout(() => m.style.opacity = '0', 3000);
  }, 1800);
}

init();
</script>
</body>
</html>
