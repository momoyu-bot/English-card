<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>早上好宝贝</title>
<meta name="description" content="今天也要元气满满。点一下，说爱你。">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe0f0, #e0f7ff);
      font-family: "Microsoft YaHei", sans-serif;
    }
    .card {
      text-align: center;
      background: white;
      padding: 50px 80px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
    }
    .heart {
      font-size: 120px;
      animation: beat 1.2s infinite ease-in-out;
      display: inline-block;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    h1 {
      color: #ff69b4;
      margin: 20px 0;
      font-size: 42px;
    }
    .msg {
      color: #555;
      font-size: 22px;
      margin-bottom: 30px;
    }
    button {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #ff1493;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>早上好呀宝贝😘</h1>
    <p class="msg">今天也要元气满满哦～</p>
    <button onclick="sayLove()">点我说爱你</button>
  </div>

  <script>
    function sayLove() {
      const msg = document.querySelector('.msg');
      msg.innerHTML = '我爱你 999 次！💕';
      setTimeout(() => {
        msg.innerHTML = '今天也要开心呀～';
      }, 2000);
    }
  </script>
</body>
</html>
