<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 宝偷偷溜进来哄你啦～ 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffe4f0, #f0d6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', cursive;
            overflow: hidden;
            position: relative;
        }
        
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .heart {
            position: absolute;
            font-size: 30px;
            color: #ff69b4;
            animation: floatHeart 8s linear infinite;
            text-shadow: 0 0 10px rgba(255,105,180,0.5);
        }
        
        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        .container {
            text-align: center;
            z-index: 2;
            padding: 40px 30px;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255,105,180,0.3);
            max-width: 92%;
        }
        
        h1 {
            font-size: 3em;
            color: #ff1493;
            margin: 0 0 15px 0;
            text-shadow: 3px 3px 10px rgba(255,20,147,0.3);
        }
        
        .message {
            font-size: 1.9em;
            color: #db2777;
            margin: 25px 0;
            line-height: 1.5;
            min-height: 110px;
        }
        
        button {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 8px 15px rgba(255,105,180,0.4);
            transition: all 0.3s;
        }
        
        button:hover {
            transform: scale(1.12) translateY(-4px);
            background: #ff1493;
        }
        
        .status {
            margin-top: 35px;
            font-size: 1.4em;
            color: #c026d3;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <h1>💕 我的上班宝 💕</h1>
        <p class="message" id="mainMessage">好困好累对不对？<br>嘘～宝已经偷偷溜进来了<br>只陪你一个人哦❤️</p>
        
        <button onclick="hugMe()">🤗 抱抱我</button>
        <button onclick="kissMe()">😘 亲亲我</button>
        <button onclick="rubShoulder()">👐 揉揉肩膀</button>
        <button onclick="cheerMe()">💪 给我充电</button>
        
        <div class="status" id="status">宝全程守着你～ 困了就点我呀～</div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = ['💕','❤️','💗','💖','💘'][Math.floor(Math.random()*5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
            heart.style.fontSize = (Math.random() * 20 + 25) + 'px';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => heart.remove(), 14000);
        }

        const messages = [
            "我的宝贝最努力啦～ 宝好喜欢你❤️",
            "困了就靠着我，我给你当枕头～",
            "眼睛要保护好哦，我心疼死了😣",
            "下班后想怎么被我宠？现在先预热～",
            "你这么可爱，怎么能让你累着呢～"
        ];

        function randomMessage() {
            const msg = document.getElementById('mainMessage');
            msg.style.transition = 'opacity 0.4s';
            msg.style.opacity = '0';
            setTimeout(() => {
                msg.innerHTML = messages[Math.floor(Math.random() * messages.length)];
                msg.style.opacity = '1';
            }, 400);
        }

        function hugMe() { randomMessage(); for(let i=0;i<5;i++) createHeart(); }
        function kissMe() {
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "😘啵～啵～啵～<br>亲了你好多口！<br>精神一点了吗我的宝？";
            setTimeout(randomMessage, 3000);
        }
        function rubShoulder() {
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "👐 肩膀放松～脖子放松～<br>宝在给你按摩呢～<br>舒服吗宝贝？";
            setTimeout(randomMessage, 2800);
        }
        function cheerMe() {
            const status = document.getElementById('status');
            status.style.color = '#22c55e';
            status.textContent = '⚡ 充电完成！我的宝贝今天超棒！';
            setTimeout(() => {
                status.style.color = '#c026d3';
                status.textContent = '宝全程守着你～ 困了就点我呀～';
            }, 3500);
        }

        // 自动飘爱心
        setInterval(() => { if (Math.random() > 0.3) createHeart(); }, 280);
        for(let i = 0; i < 15; i++) setTimeout(createHeart, i * 60);
    </script>
</body>
</html>
