<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瓷光小脸蛋</title>
<meta name="description" content="白瓷、小粉、小紫挨着同一侧光。眼缝是反斜杠，右缝窄一档。">
<meta name="theme-color" content="#000000">
<style>
  :root { --fg:#f3f3f3; --muted:#9a9a9a; --dim:#6f6f6f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--fg); }
  body {
    overflow: hidden;
    font-family: "PingFang SC","Hiragino Sans GB","WenQuanYi Zen Hei","Noto Sans SC","Microsoft YaHei",sans-serif;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 1px solid var(--muted); outline-offset: 3px; }
  .stage { position: relative; height: 100dvh; width: 100%; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .chrome {
    position: absolute; z-index: 2; top: 0; left: 0; right: 0;
    padding: max(1rem, env(safe-area-inset-top)) 1.25rem 0;
    pointer-events: none;
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  h1 { margin: 0; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.04em; }
  .hint { margin: 0.35rem 0 0; color: var(--dim); font-size: 0.75rem; line-height: 1.4; letter-spacing: 0.04em; }
  .mats, .shapes { pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; }
  .mats { gap: 0.25rem 1rem; justify-content: flex-end; }
  .shapes { gap: 0; margin-top: 0.75rem; }
  .chip {
    min-height: 2.75rem; padding: 0 0.35rem; border: 0; background: transparent;
    color: var(--dim); font-size: 0.875rem; letter-spacing: 0.04em;
  }
  .shapes .chip { padding: 0 0.6rem; }
  .chip[aria-pressed="true"] { color: var(--fg); }
  .chip:active { opacity: 0.7; }
  @media (hover: hover) and (pointer: fine) {
    .chip:hover { color: var(--muted); }
    .chip[aria-pressed="true"]:hover { color: var(--fg); }
  }
  .fallback {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 1.5rem; text-align: center; color: var(--muted);
  }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="film" aria-label="侧光里的小脸蛋。按住转动，点一下眨眼，双击回到正面。"></canvas>
  <p class="fallback" id="err" hidden>这块屏幕画不出这层釉。</p>
  <div class="chrome">
    <div class="row">
      <div>
        <h1>小脸蛋</h1>
        <p class="hint">按住转动，点一下眨眼，双击回位</p>
      </div>
      <div class="mats" role="group" aria-label="釉色" id="mats"></div>
    </div>
    <div class="shapes" role="group" aria-label="脸的形状" id="shapes"></div>
  </div>
  <p class="sr" id="status">现在是圆，白瓷。</p>
</main>
<script>
const VERT = "#version 300 es\nlayout(location=0) in vec2 a;\nvoid main() { gl_Position = vec4(a, 0.0, 1.0); }\n";

(-fw, fw, e)) * front;\n  col = mix(col, vec3(0.0), eye);\n  col *= cover;\n  float dither = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);\n  col += (dither - 0.5) / 255.0;\n  return clamp(col, 0.0, 1.0);\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;\n  float dist = mix(2.5, 3.4, uFit);\n  vec3 roW = vec3(0.0, 0.0, dist);\n  vec3 rdW = normalize(vec3(uv.x * 0.9, uv.y * 0.9, -1.0));\n  vec3 center = vec3(0.0, mix(-0.4, -0.04, uFit), 0.0);\n  vec3 roO = toObj(roW - center);\n  vec3 rdO = toObj(rdW);\n\n  if (uAnalytic > 0.5) {\n    float b = dot(roO, rdO);\n    float c = dot(roO, roO) - 1.0;\n    float h = b * b - c;\n    float fw = max(fwidth(h), 0.001);\n    float cover = smoothstep(-fw, fw, h);\n    if (h < -fw) {\n      fragColor = vec4(0.0, 0.0, 0.0, 1.0);\n      return;\n    }\n    float s = sqrt(max(h, 0.0));\n    float t = -b - s;\n    if (t < 0.0) t = -b + s;\n    if (t < 0.0) {\n      fragColor = vec4(0.0, 0.0, 0.0, 1.0);\n      return;\n    }\n    vec3 p = roO + rdO * t;\n    vec3 n = normalize(p);\n    fragColor = vec4(finish(p, n, rdW, cover), 1.0);\n    return;\n  }\n\n  float t = 0.0;\n  float closest = 1e5;\n  bool hit = false;\n  for (int i = 0; i < 72; i++) {\n    float d = map(roO + rdO * t);\n    closest = min(closest, d);\n    if (d < 0.0007) { hit = true; break; }\n    t += d;\n    if (t > 10.0) break;\n  }\n  float px = 0.0022;\n  float cover = hit ? 1.0 : (1.0 - smoothstep(0.0, px, closest));\n  if (cover <= 0.001) {\n    fragColor = vec4(0.0, 0.0, 0.0, 1.0);\n    return;\n  }\n  vec3 p = roO + rdO * max(t, 0.0);\n  if (!hit) {\n    for (int i = 0; i < 6; i++) {\n      float d = map(p);\n      p -= rdO * d;\n    }\n  }\n  vec2 e = vec2(0.0012, 0.0);\n  vec3 n = normalize(vec3(\n    map(p + e.xyy) - map(p - e.xyy),\n    map(p + e.yxy) - map(p - e.yxy),\n    map(p + e.yyx) - map(p - e.yyx)\n  ));\n  fragColor = vec4(finish(p, n, rdW, cover), 1.0);\n}\n";
const SHAPES = ["圆","方","胶囊","三角","六边","云","水滴"];
const MATS = ["白瓷","小粉","小紫"];
const YAW_LIMIT = 1.15, PITCH_LIMIT = 0.62;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const live = {
  yaw:0, pitch:0, yawT:0, pitchT:0, yawV:0, pitchV:0,
  from:0, to:0, mix:1, mixStart:0,
  pink:0, pinkT:0, violet:0, violetT:0,
  blink:0, phase:"wait", holdUntil:0, nextBlink:0,
  fit:0, fitT:0, fitFrom:0, fitStart:0,
  dragging:false, lastX:0, lastY:0, lastTs:0, moved:0, tapTimer:0,
  reduced: matchMedia("(prefers-reduced-motion: reduce)").matches,

const status = document.getElementById("status");
function say() { status.textContent = "现在是" + SHAPES[live.shape] + "，" + MATS[live.mat] + "。"; }
function chip(label, pressed, on) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = label;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.addEventListener("click", on);
  return b;
}
const matBtns = MATS.map((label, i) => {
  const b = chip(label, i===0, () => chooseMat(i));
  document.getElementById("mats").appendChild(b);
  return b;
});
const shapeBtns = SHAPES.map((label, i) => {
  const b = chip(label, i===0, () => chooseShape(i));
  document.getElementById("shapes").appendChild(b);
  return b;
});
function paintPressed() {
  matBtns.forEach((b,i) => b.setAttribute("aria-pressed", i===live.mat ? "true" : "false"));
  shapeBtns.forEach((b,i) => b.setAttribute("aria-pressed", i===live.shape ? "true" : "false"));
  say();
}
function chooseMat(id) {
  live.mat = id;
  live.pinkT = id===1 ? 1 : 0;
  live.violetT = id===2 ? 1 : 0;
  paintPressed();
}
function chooseShape(id) {
  if (id === live.to && live.mix >= 1) return;
  live.from = live.mix >= 0.999 ? live.to : live.from;
  live.to = id;
  live.shape = id;
  live.mixStart = performance.now();
  live.mix = live.reduced ? 1 : 0;
  if (live.reduced) live.from = id;

  if (live.reduced) return;
  if (live.phase === "wait" || live.phase === "open") live.phase = "close";

  live.yawT = 0; live.pitchT = 0; live.yawV = 0; live.pitchV = 0;

const canvas = document.getElementById("film");
const gl = canvas.getContext("webgl2", { alpha:false, antialias:false, depth:false, powerPreference:"high-performance" });

    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

      gl.uniform1f(loc.uTo, live.to);

      gl.uniform1f(loc.uViolet, live.violet);

  }
}
canvas.addEventListener("pointerdown", (e) => {
  live.dragging = true; live.lastX = e.clientX; live.lastY = e.clientY;
  live.lastTs = performance.now(); live.moved = 0; live.yawV = 0; live.pitchV = 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!live.dragging) return;
  const dx = e.clientX - live.lastX, dy = e.clientY - live.lastY;
  live.moved += Math.abs(dx) + Math.abs(dy);
  const now = performance.now();
  const dt = Math.max(0.008, (now - live.lastTs) / 1000);
  live.lastTs = now; live.lastX = e.clientX; live.lastY = e.clientY;
  const prevYaw = live.yawT, prevPitch = live.pitchT;
  live.yawT = clamp(live.yawT + dx * 0.006, -YAW_LIMIT, YAW_LIMIT);
  live.pitchT = clamp(live.pitchT - dy * 0.006, -PITCH_LIMIT, PITCH_LIMIT);
  live.yawV = (live.yawT - prevYaw) / dt;
  live.pitchV = (live.pitchT - prevPitch) / dt;
});
function pointerUp() {
  if (!live.dragging) return;
  live.dragging = false;
  if (live.moved > 8) return;
  const now = performance.now();
  if (live.tapTimer) { clearTimeout(live.tapTimer); live.tapTimer = 0; resetPose(); return; }
  live.tapTimer = setTimeout(() => { live.tapTimer = 0; if (performance.now() - now >= 250) blinkNow(); }, 280);
}
canvas.addEventListener("pointerup", pointerUp);
canvas.addEventListener("pointercancel", pointerUp);
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
document.getElementById("stage").addEventListener("keydown", (e) => {
  const step = 0.12;
  if (e.key === "ArrowLeft") { live.yawT = clamp(live.yawT - step, -YAW_LIMIT, YAW_LIMIT); live.yawV = 0; }
  else if (e.key === "ArrowRight") { live.yawT = clamp(live.yawT + step, -YAW_LIMIT, YAW_LIMIT); live.yawV = 0; }
  else if (e.key === "ArrowUp") { live.pitchT = clamp(live.pitchT + step, -PITCH_LIMIT, PITCH_LIMIT); live.pitchV = 0; }
  else if (e.key === "ArrowDown") { live.pitchT = clamp(live.pitchT - step, -PITCH_LIMIT, PITCH_LIMIT); live.pitchV = 0; }
  else if (e.key === "Home" || e.key === "0") resetPose();
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); blinkNow(); }
  else if (e.key >= "1" && e.key <= "7") chooseShape(Number(e.key) - 1);
});
</script>
