<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EDE4">
<title>这一台嘟嘟机</title>
<meta name="description" content="先给你看。喇叭在正中，按一下是嘟，三下有人接。">
<style>
  :root{
    --bg:#F3EDE4; --bg2:#E7DFD2; --fg:#2C281F; --muted:#7A7266; --faint:#A89F93;
    --sheet:#FBF7F0; --edge:#D4C9B8; --horn:#C2786C; --lip:#A86458; --on:#FBF7F0;
    --shadow:rgba(44,40,31,.12); --shadow2:rgba(44,40,31,.08);
    --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
    --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC",Georgia,serif;
    --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  }
  html.night{
    --bg:#1A1714; --bg2:#141210; --fg:#EDE6D9; --muted:#9A9186; --faint:#6E675E;
    --sheet:#24201C; --edge:#3A342C; --horn:#D4897C; --lip:#A86B62; --on:#1A1714;
    --shadow:rgba(0,0,0,.4); --shadow2:rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  button{font:inherit;color:inherit;touch-action:manipulation}
  button:focus{outline:none}
  button:focus-visible{outline:2px solid var(--horn);outline-offset:3px}
  body{
    background:linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--fg);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:calc(var(--safe-top) + 18px) 20px calc(var(--safe-bot) + 18px);
  }
  .wrap{width:min(400px,100%);margin:auto;display:flex;flex-direction:column;align-items:center}
  header{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h1{margin:0;font-size:17px;font-weight:500;letter-spacing:.18em;font-family:var(--serif)}
  .clock{margin:0;font-size:11px;letter-spacing:.14em;color:var(--faint);font-variant-numeric:tabular-nums}

  .rig{position:relative;width:min(280px,100%);margin-top:18px}
  .rig.ringing{animation:jitter .72s ease-in-out infinite}
  .waves{position:absolute;left:0;right:0;top:6px;height:44px;z-index:3;pointer-events:none}
  .waves i{
    position:absolute;top:4px;width:12px;height:34px;opacity:0;
    border:1.5px solid transparent;
  }
  .waves i.l{border-left-color:var(--horn);border-radius:999px 0 0 999px}
  .waves i.r{border-right-color:var(--horn);border-radius:0 999px 999px 0}
  .waves i:nth-child(1){left:34px}
  .waves i:nth-child(2){left:20px}
  .waves i:nth-child(3){right:34px}
  .waves i:nth-child(4){right:20px}
  .waves.on i{animation:wave 1.6s ease-out infinite}
  .waves.on i:nth-child(2),.waves.on i:nth-child(4){animation-delay:.22s}

  .handset{
    position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    width:156px;height:44px;margin:0 auto;padding:0;border:1px solid var(--edge);
    background:var(--sheet);border-radius:999px;cursor:pointer;
    box-shadow:0 8px 16px var(--shadow2);
    transform-origin:86% 80%;
    transition:transform .45s cubic-bezier(.22,1,.36,1);
  }
  .handset.up{transform:translate(16px,-28px) rotate(-14deg)}
  .ear{width:28px;height:34px;margin:0 5px;border-radius:12px;background:var(--bg2);border:1px solid var(--edge)}
  .grip{width:52px;height:10px;border-radius:999px;background:var(--edge)}
  .cradle{width:108px;height:8px;margin:-6px auto 0;border-radius:999px;background:var(--edge);opacity:.7}

  .body{
    position:relative;z-index:1;margin-top:2px;padding:16px 18px 14px;border-radius:36px;
    background:var(--sheet);border:1px solid var(--edge);
    box-shadow:0 18px 36px var(--shadow);
  }
  .led-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .led{width:8px;height:8px;border-radius:999px;background:var(--horn);opacity:.25;flex:none}
  .led.on{animation:blink .78s ease-in-out infinite}
  .led.talk{animation:pulse 3s ease-in-out infinite}
  .lcd{
    flex:1;height:28px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;border:1px solid var(--edge);background:var(--bg2);
    font-size:12px;letter-spacing:.28em;color:var(--muted);
  }
  .horn{
    position:relative;display:block;width:140px;height:148px;margin:0 auto;padding:0;
    border:0;background:transparent;cursor:pointer;
  }
  .horn-lip{
    position:absolute;left:0;right:0;top:8px;bottom:0;border-radius:999px;background:var(--lip);
  }
  .horn-move{
    position:absolute;inset:0 0 8px 0;border-radius:999px;
    transition:transform .08s ease;
  }
  .horn.down .horn-move,.horn:active .horn-move{transform:translateY(7px)}
  .horn-ring{position:absolute;inset:0;border-radius:999px;background:var(--horn)}
  .horn.pulse .horn-ring{animation:hp 1.35s ease-in-out infinite}
  .horn-face{
    position:absolute;inset:18px;border-radius:999px;background:var(--sheet);border:1px solid var(--edge);
  }
  .horn-dot{
    position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:999px;
    background:var(--horn);transform:translate(-50%,-50%);
  }
  .cap{margin:2px 0 8px;text-align:center;font-size:11px;letter-spacing:.32em;color:var(--faint)}
  .grille{display:flex;justify-content:center;gap:7px;height:8px}
  .grille i{width:5px;height:5px;border-radius:999px;background:var(--edge);display:block}
  .rig.hit .grille i{background:var(--horn)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin-top:12px;padding:0 8px 2px}
  .keys span{
    height:16px;display:flex;align-items:center;justify-content:center;
    border-radius:999px;border:1px solid var(--edge);color:var(--faint);font-size:10px;
  }
  .du{
    position:absolute;left:50%;top:8px;pointer-events:none;z-index:3;
    font-family:var(--serif);font-size:20px;letter-spacing:.2em;color:var(--horn);
    animation:duUp .6s ease forwards;
  }
  .seat{
    width:68%;height:18px;margin:4px auto 0;
    background:radial-gradient(ellipse at center, var(--shadow2), transparent 70%);
  }

  .stage{width:100%;min-height:6.6rem;text-align:center;padding-top:6px}
  .kicker{margin:12px 0 0;font-size:11px;letter-spacing:.24em;color:var(--faint)}
  .who{margin:6px 0 0;font-size:22px;font-weight:500;letter-spacing:.08em;font-family:var(--serif)}
  .say{
    margin:10px auto 0;max-width:16em;font-family:var(--serif);
    font-size:20px;line-height:1.65;letter-spacing:.04em;
  }
  .en{display:none;margin-top:4px;font-family:var(--sans);font-size:12.5px;font-style:italic;color:var(--muted);letter-spacing:0;line-height:1.5}
  html.en-on .en{display:block}
  .dudu{margin:8px 0 0;font-size:13px;letter-spacing:.42em;color:var(--horn);height:18px}
  .dudu span{display:inline-block;opacity:.25;animation:dudu 1.5s ease-in-out infinite}
  .dudu span:nth-child(2){animation-delay:.26s}
  .slip{
    margin:12px auto 0;max-width:18em;text-align:left;padding:12px 14px;border-radius:16px;
    background:var(--sheet);border:1px solid var(--edge);
  }
  .slip .say{margin:0;font-size:16px}

  .acts{display:flex;gap:10px;justify-content:center;min-height:48px;margin-top:14px}
  .txt{
    border:1px solid var(--edge);background:var(--sheet);color:var(--fg);
    font-size:14px;letter-spacing:.12em;padding:11px 18px;border-radius:999px;cursor:pointer;min-height:44px;
  }
  .txt.solid{background:var(--fg);color:var(--on);border-color:transparent}
  .txt:active{transform:translateY(1px)}

  footer{margin-top:8px;display:flex;gap:4px;align-items:center;justify-content:center}
  footer button{
    border:0;background:none;color:var(--muted);font-size:11px;letter-spacing:.16em;
    height:44px;padding:0 12px;cursor:pointer;
  }

  @keyframes jitter{0%,100%{transform:none}18%{transform:rotate(-1.2deg) translateY(-2px)}42%{transform:rotate(1deg) translateY(-1px)}}
  @keyframes wave{0%{opacity:.2;transform:scale(.88)}35%{opacity:.75}100%{opacity:.12;transform:scale(1.18)}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes hp{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  @keyframes dudu{0%,70%,100%{opacity:.25}18%,40%{opacity:1}}
  @keyframes duUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-28px)}}
  @media (prefers-reduced-motion:reduce){
    .rig.ringing,.waves.on i,.led.on,.led.talk,.horn.pulse .horn-ring,.dudu span,.du{animation:none}
    .handset,.horn-move{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>这一台</h1>
    <p class="clock" id="clock"></p>
  </header>

  <div class="rig" id="rig">
    <div class="waves" id="waves" aria-hidden="true"><i class="l"></i><i class="l"></i><i class="r"></i><i class="r"></i></div>
    <button type="button" class="handset" id="handset" aria-label="听筒">
      <span class="ear"></span><span class="grip"></span><span class="ear"></span>
    </button>
    <div class="cradle"></div>
    <div class="body">
      <div class="led-row">
        <span class="led" id="led"></span>
        <span class="lcd" id="lcd">凉着</span>
      </div>
      <button type="button" class="horn" id="horn" aria-label="喇叭">
        <span class="horn-lip" aria-hidden="true"></span>
        <span class="horn-move" aria-hidden="true">
          <span class="horn-ring"></span>
          <span class="horn-face"><span class="horn-dot"></span></span>
        </span>
      </button>
      <p class="cap">喇叭</p>
      <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="keys" aria-hidden="true">
        <span>1</span><span>2</span><span>3</span>
        <span>4</span><span>5</span><span>6</span>
        <span>7</span><span>8</span><span>9</span>
        <span>*</span><span>0</span><span>#</span>
      </div>
    </div>
    <div class="seat" aria-hidden="true"></div>
  </div>

  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="acts" id="acts"></div>
  <footer>
    <button type="button" id="lamp">灯·自动</button>
    <button type="button" id="mute">静音</button>
    <button type="button" id="en">英文</button>
  </footer>
</div>
<script>
(function(){
  var CALLS = [
    {who:"这头", zh:"接了。你按得正好。", en:"Picked up. Right on time.",
      vm:"你在看。留言就一句：在。", vmen:"You were looking. One line: here."},
    {who:"夜班", zh:"这头灯还开着。", en:"The lamp on this end is still on.",
      vm:"灯还开着。回来再按。", vmen:"The lamp is on. Press when you are back."},
    {who:"对讲", zh:"你按，我应。", en:"You press. I answer.",
      vm:"没人接。听筒还在原处。", vmen:"No one answered. The receiver is still in place."}
  ];
  var DIALS = [
    {who:"这头", zh:"接了。三下我都数着。", en:"Picked up. I counted all three."},
    {who:"这头", zh:"来了。你那边的喇叭还热。", en:"Here. The horn on your side is still warm."},
    {who:"喇叭", zh:"听到了。你按得挺齐。", en:"Heard you. Your presses were even."},
    {who:"夜班", zh:"灯开着。一句就够。", en:"The lamp is on. One line is enough."}
  ];
  var TWO = [
    {zh:"听到了。", en:"Heard you."},
    {zh:"两下，齐。", en:"Two. Even."},
    {zh:"在。", en:"Here."},
    {zh:"短的，不是铃声。", en:"Short. Not a ringtone."}
  ];
  var BACK = [
    {zh:"嗯。", en:"Mm."},
    {zh:"还在。", en:"Still here."},
    {zh:"嘟。", en:"Toot."}
  ];

  var state = {phase:"look", screen:"凉着", kicker:"先看", who:"", zh:"喇叭在正中。", en:"The horn is in the middle.", slip:false};
  var call = null, muted = false, unlocked = false, theme = "auto";
  var taps = 0, tapGen = 0, tapTimer = 0, lookTimer = 0, missTimer = 0, ringId = 0, ctx = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function pick(list){ return list[Math.floor(Math.random()*list.length)]; }

  function shHour(){
    var p = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Shanghai",hour:"numeric",hourCycle:"h23"}).formatToParts(new Date());
    var h = p.filter(function(x){ return x.type==="hour"; })[0];
    return Number(h && h.value);
  }
  function isNight(){ var h = shHour(); return theme==="auto" ? (h>=21 || h<6) : theme==="night"; }
  function applyTheme(){
    document.documentElement.classList.toggle("night", isNight());
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = isNight() ? "#1A1714" : "#F3EDE4";
    $("lamp").textContent = theme==="auto" ? "灯·自动" : theme==="night" ? "灯·夜" : "灯·日";
  }
  function tickClock(){
    var p = new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
    function g(t){ var x = p.filter(function(n){ return n.type===t; })[0]; return x ? x.value : ""; }
    $("clock").textContent = g("weekday") + " " + g("hour") + ":" + g("minute");
  }

  function unlock(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!ctx) ctx = new AC();
      unlocked = true;
      if (ctx.state === "suspended") return ctx.resume();
    }catch(e){}
    return null;
  }
  function whenReady(fn){
    var p = unlock();
    if (p && p.then) p.then(function(){ fn(); }).catch(function(){ fn(); });
    else fn();
  }
  function tootAt(when){
    if (muted || !ctx || ctx.state === "suspended") return;
    var t0 = ctx.currentTime + (when || 0);
    var o = ctx.createOscillator(), o2 = ctx.createOscillator();
    var g = ctx.createGain(), g2 = ctx.createGain();
    o.type = "triangle"; o2.type = "sine";
    o.frequency.setValueAtTime(494, t0);
    o.frequency.exponentialRampToValueAtTime(330, t0 + 0.16);
    o2.frequency.setValueAtTime(247, t0);
    o2.frequency.exponentialRampToValueAtTime(165, t0 + 0.15);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.05, t0 + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    o.connect(g); g.connect(ctx.destination);
    o2.connect(g2); g2.connect(ctx.destination);
    o.start(t0); o.stop(t0 + 0.2);
    o2.start(t0); o2.stop(t0 + 0.18);
  }
  function thunk(){
    if (muted || !ctx || ctx.state === "suspended") return;
    var t0 = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(180, t0);
    o.frequency.exponentialRampToValueAtTime(70, t0 + 0.08);
    g.gain.setValueAtTime(0.07, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + 0.1);
  }
  function startRing(){
    stopRing();
    if (muted || !unlocked) return;
    tootAt(0); tootAt(0.18);
    ringId = setInterval(function(){ tootAt(0); tootAt(0.18); }, 1400);
  }
  function stopRing(){ if (ringId){ clearInterval(ringId); ringId = 0; } }

  function pop(){
    var horn = $("horn");
    horn.classList.add("down");
    $("rig").classList.add("hit");
    setTimeout(function(){ horn.classList.remove("down"); $("rig").classList.remove("hit"); }, 120);
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var el = document.createElement("span");
    el.className = "du";
    el.textContent = "嘟";
    el.style.marginLeft = (Math.random()*18 - 9) + "px";
    horn.appendChild(el);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 620);
    try{ if (navigator.vibrate) navigator.vibrate(12); }catch(e){}
  }

  function resetTaps(){
    taps = 0;
    tapGen++;
    clearTimeout(tapTimer);
  }
  function setLine(o){
    state.zh = o.zh;
    state.en = o.en;
    state.slip = !!o.slip;
    state.who = o.who || "";
    state.kicker = o.kicker || "";
    state.screen = o.screen;
    state.phase = o.phase;
  }

  function render(){
    $("lcd").textContent = state.screen;
    $("rig").classList.toggle("ringing", state.phase==="ring");
    $("waves").classList.toggle("on", state.phase==="ring");
    $("handset").classList.toggle("up", state.phase==="up");
    $("led").className = "led" + (state.phase==="ring" ? " on" : "") + (state.phase==="up" ? " talk" : "");
    $("horn").classList.toggle("pulse", state.phase==="ring");

    var html = "";
    if (state.kicker) html += '<p class="kicker">' + esc(state.kicker) + "</p>";
    if (state.who) html += '<h2 class="who">' + esc(state.who) + "</h2>";
    if (state.phase==="ring") html += '<p class="dudu" aria-hidden="true"><span>嘟</span><span>嘟</span></p>';
    var say = '<p class="say">' + esc(state.zh) + '<span class="en">' + esc(state.en) + "</span></p>";
    html += state.slip ? '<div class="slip">' + say + "</div>" : say;
    $("stage").innerHTML = html;

    var acts = "";
    if (state.phase==="look") acts = '<button type="button" class="txt" data-a="wait">等它响</button>';
    else if (state.phase==="ring") acts = '<button type="button" class="txt" data-a="no">不接</button><button type="button" class="txt solid" data-a="yes">接</button>';
    else if (state.phase==="up") acts = '<button type="button" class="txt" data-a="hang">搁回去</button>';
    else acts = '<button type="button" class="txt" data-a="wait">再等一通</button>';
    $("acts").innerHTML = acts;
  }

  function armLook(){
    clearTimeout(lookTimer);
    lookTimer = setTimeout(function(){
      if (state.phase==="look") incoming();
    }, 10000);
  }
  function incoming(){
    resetTaps();
    clearTimeout(lookTimer);
    clearTimeout(missTimer);
    stopRing();
    call = pick(CALLS);
    setLine({
      phase:"ring", screen:"来电", kicker:"有人打来", who:call.who,
      zh: unlocked ? "按喇叭就能接。" : "按一下，这头才出声。",
      en: unlocked ? "Press the horn to pick up." : "Press once, and this end makes a sound.",
      slip:false
    });
    if (unlocked && !muted) whenReady(function(){ if (state.phase==="ring" && !muted) startRing(); });
    missTimer = setTimeout(function(){
      if (state.phase==="ring") miss();
    }, 18000);
    render();
  }
  function answer(){
    if (state.phase!=="ring" || !call) return;
    stopRing();
    clearTimeout(missTimer);
    resetTaps();
    setLine({phase:"up", screen:call.who, kicker:"通着", who:call.who, zh:call.zh, en:call.en, slip:false});
    render();
  }
  function miss(){
    if (!call) return;
    stopRing();
    clearTimeout(missTimer);
    resetTaps();
    setLine({phase:"note", screen:"未接", kicker:"未接", who:call.who, zh:call.vm, en:call.vmen, slip:true});
    render();
  }
  function decline(){
    whenReady(function(){ thunk(); });
    miss();
  }
  function dial(){
    resetTaps();
    clearTimeout(lookTimer);
    clearTimeout(missTimer);
    stopRing();
    var line = pick(DIALS);
    call = line;
    setLine({phase:"up", screen:line.who, kicker:"通着", who:line.who, zh:line.zh, en:line.en, slip:false});
    render();
  }
  function hang(){
    if (state.phase!=="up") return;
    stopRing();
    whenReady(function(){ thunk(); });
    resetTaps();
    setLine({phase:"rest", screen:"还热", kicker:"搁好了", who:"", zh:"听筒搁回去了。", en:"The receiver is back.", slip:false});
    render();
  }
  function showCount(n){
    state.screen = n>=2 ? "嘟嘟" : "嘟";
    $("lcd").textContent = state.screen;
  }
  function settle(n){
    if (state.phase==="ring" || state.phase==="up") return;
    var line = n>=2 ? pick(TWO) : {zh:"一声。机子热了。", en:"One. The machine is warm."};
    setLine({phase:"warm", screen:n>=2?"嘟嘟":"嘟", kicker:"响过", who:"", zh:line.zh, en:line.en, slip:false});
    render();
  }
  function reply(){
    var line = pick(BACK);
    state.zh = line.zh;
    state.en = line.en;
    render();
  }

  function onHorn(){
    pop();
    clearTimeout(lookTimer);
    if (state.phase==="ring"){
      whenReady(function(){ tootAt(0); });
      answer();
      return;
    }
    if (state.phase==="up"){
      whenReady(function(){ tootAt(0); });
      reply();
      return;
    }
    taps++;
    whenReady(function(){ tootAt(0); });
    showCount(taps);
    var gen = ++tapGen;
    clearTimeout(tapTimer);
    if (taps>=3){
      taps = 0;
      dial();
      return;
    }
    tapTimer = setTimeout(function(){
      if (gen!==tapGen) return;
      var n = taps;
      taps = 0;
      settle(n);
    }, 560);
  }

  function act(name){
    clearTimeout(lookTimer);
    if (name==="wait") { unlock(); incoming(); }
    else if (name==="yes"){ pop(); whenReady(function(){ tootAt(0); }); answer(); }
    else if (name==="no") decline();
    else if (name==="hang") hang();
  }

  $("horn").addEventListener("click", onHorn);
  $("handset").addEventListener("click", function(){
    if (state.phase==="ring"){ clearTimeout(lookTimer); pop(); whenReady(function(){ tootAt(0); }); answer(); }
    else if (state.phase==="up") hang();
  });
  $("acts").addEventListener("click", function(e){
    var b = e.target.closest("[data-a]");
    if (!b) return;
    act(b.getAttribute("data-a"));
  });
  $("mute").addEventListener("click", function(){
    muted = !muted;
    $("mute").textContent = muted ? "开声" : "静音";
    if (muted) stopRing();
    else if (state.phase==="ring") whenReady(function(){ if (state.phase==="ring" && !muted) startRing(); });
  });
  $("en").addEventListener("click", function(){
    document.documentElement.classList.toggle("en-on");
    $("en").textContent = document.documentElement.classList.contains("en-on") ? "英文开" : "英文";
  });
  $("lamp").addEventListener("click", function(){
    theme = theme==="auto" ? "night" : theme==="night" ? "day" : "auto";
    applyTheme();
  });
  document.addEventListener("pointerdown", function(e){
    if (e.target.closest("#horn") || e.target.closest("#handset") || e.target.closest("[data-a]") || e.target.closest("footer")) return;
    if (state.phase!=="ring") { unlock(); return; }
    state.zh = "按喇叭就能接。";
    state.en = "Press the horn to pick up.";
    render();
    if (!muted) whenReady(function(){ if (state.phase==="ring" && !muted) startRing(); });
  }, {once:true});

  applyTheme();
  tickClock();
  setInterval(function(){ tickClock(); applyTheme(); }, 15000);
  render();
  armLook();
})();
</script>
</body>
</html>
