function release() { if (!dragging) return; dragging = false; const again = resumeDrag; resumeDrag = false; if (again && cur < TOTAL - 0.03) play(); }
seekBar.addEventListener('input', () => seek(seekBar.value));
seekBar.addEventListener('change', () => { seek(seekBar.value); release(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
document.addEventListener('keydown', ev => {
  if (ev.code !== 'Space' || ev.repeat || /^(BUTTON|INPUT|SUMMARY|A)$/.test(ev.target.tagName)) return;
  ev.preventDefault(); togglePlay();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
window.addEventListener('pagehide', pause);
cues.forEach(c => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'cue';
  const ti = document.createElement('time');
  ti.textContent = timecode(c[0]); ti.dateTime = 'PT' + Math.floor(c[0]) + 'S';
  const part = document.createElement('span');
  const wh = document.createElement('small'); wh.textContent = c[2];
  const line = document.createElement('span'); line.className = 'word'; line.textContent = c[3];
  part.append(wh, line); b.append(ti, part);
  b.setAttribute('aria-label', '从 ' + timecode(c[0]) + ' 播放，' + c[2] + '，' + c[3]);
  el('lines').appendChild(b); cells.push(b);
  b.addEventListener('click', () => { seek(c[0]); if (!running) play(); el('stage').scrollIntoView({ block: 'start', behavior: 'auto' }); });
});
scenes.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = s.id;
  b.addEventListener('click', () => { seek(s.start); if (!running) play(); el('stage').scrollIntoView({ block: 'start', behavior: 'auto' }); });
  el('chips').appendChild(b);
});
function setup(pxW) {
  canvas.width = Math.max(180, Math.min(2160, Math.round(pxW)));
  canvas.height = Math.round(canvas.width * H / W);
  scale = canvas.width / W;
  g = canvas.getContext('2d', { alpha: false });
  g.lineCap = 'round'; g.lineJoin = 'round';
}
function sizeToScreen() {
  const frame = el('stage').getBoundingClientRect();
  if (!frame.width) return;
  const px = Math.round(frame.width * Math.min(3, window.devicePixelRatio || 1));
  if (Math.abs(canvas.width - px) > 1) setup(px);
  render(started ? now() : 0);
}
updateVolume(); sizeToScreen(); update(0);
if (window.ResizeObserver) new ResizeObserver(sizeToScreen).observe(el('stage'));
else window.addEventListener('resize', sizeToScreen);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!running) sizeToScreen(); });
window.FILM = {
  W: W, H: H, TOTAL: TOTAL, canvas: canvas, events: events, synth: synth,
  setup: setup, render: render, poster: () => render(0),
  seek: seek, play: play, pause: pause,
  scenes: scenes.map(s => ({ id: s.id, start: s.start, duration: +(s.end - s.start).toFixed(3) })),
  state: () => ({ cur: now(), playing: running, soundOn: soundOn, started: started })
};
</script>
</body>
