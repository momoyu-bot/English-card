  .ctrl .sp{flex:1}

  .chips button.on{background:var(--mat); color:var(--night); border-color:var(--mat)}
  .enline{display:none; margin:12px 0 0; color:var(--muted); font-size:13px}
  body.en .enline{display:block}
  h2{
    margin:28px 0 0; font-weight:600; font-size:18px; letter-spacing:.14em;
    font-family:"Songti SC","STSong","SimSun",serif; color:var(--lamp);
  }

  article p.on{color:var(--lamp)}
  article p .en{display:none; font-size:12px}
  body.en article p .en{display:block}
  footer{margin:28px 0 0; font-size:12px; color:var(--muted)}
  button:focus-visible{outline:2px solid var(--lamp); outline-offset:3px}
</style>
</head>

    <span class="time" id="time">0:00 / 1:12</span>

    <button type="button" id="lang" aria-pressed="false">英文</button>
  </div>
  <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="进度">
  <div class="chips" id="chips"></div>
  <p class="enline" id="enline"></p>

    <div id="book"></div>
  </section>

(function(){

    var w = cv.parentElement.clientWidth || 360;

    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ac) ac = new AC();
    if (ac.state === "suspended") ac.resume();
    var now = ac.currentTime;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = "sine";
    o.frequency.value = 494;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.07, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
