<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口袋里</title>
<meta name="description" content="火红和暹罗躲在小手机里自己聊天，你只能旁听。">
<style>
  :root {
    --cloth: #e8e4da;
    --ink: #2f2822;
    --fox: #e2552b;
    --case: #c4a898;
    --screen: #d7e6ea;
    --muzzle: #fff3e3;
    --point: #4e382e;
    --eye: #79c0f0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cloth);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
    font-weight: 500;
    line-height: 1.5;
  }
  button { cursor: pointer; }
  .stage {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 1rem 1rem env(safe-area-inset-bottom);
    position: relative;
    overflow: hidden;
  }
  .eyebrow {
    margin: 0 0 auto;
    padding-top: 0.25rem;
    font-size: 0.875rem;
    letter-spacing: 0.08em;
    color: color-mix(in oklab, var(--ink) 62%, var(--cloth));
  }
  .rig {
    width: min(100%, 22.5rem);
    height: min(76dvh, 40rem);
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .phone {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin: 0 0.45rem -1.05rem;
    padding: 0.55rem 0.65rem 1.45rem;
    background: var(--case);
    border-radius: 2.6rem 2.6rem 1.8rem 1.8rem;
    box-shadow:
      0 0 0 3px color-mix(in oklab, var(--ink) 42%, var(--case)),
      0 1.25rem 0 color-mix(in oklab, var(--ink) 8%, transparent);
  }
  .phone::after {
    content: "";
    position: absolute;
    top: 5.5rem;
    right: -0.35rem;
    width: 0.35rem;
    height: 3.25rem;
    border-radius: 0 0.4rem 0.4rem 0;
    background: color-mix(in oklab, var(--ink) 28%, var(--case));
  }
  .speaker {
    height: 1.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .speaker i, .speaker b { display: block; background: var(--ink); }
  .speaker i {
    width: 0.28rem;
    height: 0.28rem;
    border-radius: 999px;
    opacity: 0.55;
  }
  .speaker b {
    width: 0.7rem;
    height: 0.28rem;
    border-radius: 999px;
    opacity: 0.4;
    border-bottom: 2px solid var(--ink);
    background: transparent;
  }
  .charm {
    position: absolute;
    z-index: 3;
    left: -0.15rem;
    top: 1.6rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .charm span {
    width: 2px;
    height: 1.35rem;
    background: var(--fox);
    border-radius: 999px;
  }
  .charm em {
    width: 1.35rem;
    height: 1.35rem;
    margin-top: -0.15rem;
    border-radius: 999px;
    background: var(--fox);
    box-shadow: inset 0 -0.28rem 0 color-mix(in oklab, var(--ink) 28%, var(--fox));
  }
  .screen {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--screen);
    border-radius: 1.7rem;
    box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--ink) 16%, var(--screen));
    overflow: hidden;
  }
  .chat-head {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.9rem 1rem 0.55rem;
  }
  .chat-head h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 600;
    line-height: 1.15;
  }
  .chat-head p {
    margin: 0;
    font-size: 0.8125rem;
    color: color-mix(in oklab, var(--ink) 64%, var(--screen));
  }
  .faces { display: flex; gap: 0.25rem; }
  .face { width: 2.25rem; height: 2.25rem; flex: none; display: block; }
  .thread {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0.35rem 0.9rem 0.9rem;
    scrollbar-width: none;
  }
  .thread::-webkit-scrollbar { display: none; }
  .line {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-top: 0.85rem;
  }
  .line:first-child { margin-top: 0.15rem; }
  .who {
    margin: 0 0 0.15rem;
    font-size: 0.8125rem;
    line-height: 1.3;
    color: color-mix(in oklab, var(--ink) 70%, var(--screen));
  }
  .bubble {
    margin: 0;
    max-width: 13.5rem;
    padding: 0.55rem 0.8rem;
    border-radius: 1.05rem;
    background: var(--cloth);
    color: var(--ink);
    font-size: 1rem;
    line-height: 1.5;
  }
  .bubble-fox { box-shadow: inset 3px 0 0 var(--fox); }
  .bubble-cat { box-shadow: inset 3px 0 0 var(--point); }
  .bubble-in { animation: rise 220ms ease-out; }
  .typing, .quiet {
    margin: 0.85rem 0 0.2rem 2.75rem;
    font-size: 0.8125rem;
    color: color-mix(in oklab, var(--ink) 55%, var(--screen));
  }
  .quiet { margin-left: 0; text-align: center; }
  .home {
    align-self: center;
    width: 2.75rem;
    height: 2.75rem;
    margin-top: 0.7rem;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    box-shadow: inset 0 0 0 0.45rem var(--case);
    transition: scale 150ms ease-out;
  }
  .home:active { scale: 0.96; }
  .pocket {
    position: relative;
    z-index: 2;
    height: 4.75rem;
    border-radius: 1.35rem 1.35rem 0 0;
    background: color-mix(in oklab, var(--ink) 13%, var(--cloth));
    box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--ink) 28%, transparent);
  }
  .pocket::before {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    top: 0.85rem;
    border-top: 2px dashed color-mix(in oklab, var(--ink) 42%, transparent);
  }
  .speck {
    position: absolute;
    width: 0.4rem;
    height: 0.85rem;
    border-radius: 999px;
    background: var(--fox);
    opacity: 0.55;
    pointer-events: none;
  }
  .speck-a { top: 1.4rem; left: 1.1rem; transform: rotate(24deg); }
  .speck-b { top: 2.6rem; right: 1.4rem; height: 0.55rem; transform: rotate(-16deg); opacity: 0.4; }
  .speck-c { top: 4.2rem; right: 2.4rem; width: 0.3rem; background: var(--ink); opacity: 0.28; transform: rotate(12deg); }
  .speck-d { bottom: 7.5rem; left: 1.5rem; width: 0.3rem; height: 0.55rem; background: var(--ink); opacity: 0.22; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble-in { animation: none; }
    .home { transition: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <span class="speck speck-a"></span>
  <span class="speck speck-b"></span>
  <span class="speck speck-c"></span>
  <span class="speck speck-d"></span>
  <p class="eyebrow">旁听</p>
  <div class="rig">
    <div class="charm" aria-hidden="true"><span></span><em></em></div>
    <section class="phone" aria-label="它们的小手机">
      <div class="speaker" aria-hidden="true"><i></i><b></b><i></i></div>
      <div class="screen">
        <header class="chat-head">
          <div class="faces" id="faces"></div>
          <div>
            <h1>口袋里</h1>
            <p>两只的群，没有外人</p>
          </div>
        </header>
        <div class="thread" id="thread" aria-live="polite"></div>
      </div>
      <button type="button" class="home" id="home" aria-label="再听一句"></button>
    </section>
    <div class="pocket" aria-hidden="true"></div>
  </div>
</main>
<script>
(function () {
  var LINES = [
    { who: "fox", text: "今天的光，我塞进来了。" },
    { who: "cat", text: "口袋鼓了一点。" },
    { who: "fox", text: "就一粒。" },
    { who: "cat", text: "一粒也会响。" },
    { who: "fox", text: "你每次都听得见。" },
    { who: "cat", text: "口袋又不大。" },
    { who: "fox", text: "掏的时候轻一点。" },
    { who: "cat", text: "我看看你还在不在。" },
    { who: "fox", text: "在。" },
    { who: "cat", text: "那就好。这只手机不给外人。" }
  ];
  var NAME = { fox: "火红", cat: "暹罗" };
  var FOX = '<svg class="face" viewBox="0 0 64 64" aria-hidden="true"><path d="M16 30 L24 8 L32 28 Z" fill="#e2552b"/><path d="M32 28 L40 8 L48 30 Z" fill="#e2552b"/><path d="M20 28 L25 14 L31 27 Z" fill="#fff3e3"/><path d="M33 27 L39 14 L44 28 Z" fill="#fff3e3"/><circle cx="32" cy="38" r="16" fill="#e2552b"/><ellipse cx="32" cy="44" rx="9" ry="7" fill="#fff3e3"/><circle cx="26" cy="36" r="2.1" fill="#3b2520"/><circle cx="38" cy="36" r="2.1" fill="#3b2520"/><ellipse cx="32" cy="42" rx="2.1" ry="1.5" fill="#3b2520"/></svg>';
  var CAT = '<svg class="face" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 32 L23 10 L32 30 Z" fill="#f3e7d6"/><path d="M32 30 L41 10 L50 32 Z" fill="#f3e7d6"/><path d="M16 28 L23 12 L28 26 Z" fill="#4e382e"/><path d="M36 26 L41 12 L48 28 Z" fill="#4e382e"/><circle cx="32" cy="38" r="16" fill="#f3e7d6"/><ellipse cx="25" cy="37" rx="4.2" ry="3.1" fill="#4e382e"/><ellipse cx="39" cy="37" rx="4.2" ry="3.1" fill="#4e382e"/><ellipse cx="25" cy="37" rx="1.15" ry="1.7" fill="#79c0f0"/><ellipse cx="39" cy="37" rx="1.15" ry="1.7" fill="#79c0f0"/><ellipse cx="32" cy="45" rx="2" ry="1.4" fill="#4e382e"/></svg>';
  var shown = 3;
  var typing = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timer = 0;
  var thread = document.getElementById("thread");
  var home = document.getElementById("home");
  document.getElementById("faces").innerHTML = FOX + CAT;

  function render() {
    var html = "";
    var i;
    for (i = 0; i < shown; i++) {
      var line = LINES[i];
      var fresh = i === shown - 1 && !reduced ? " bubble-in" : "";
      html += '<article class="line">' + (line.who === "fox" ? FOX : CAT) +
        '<div><p class="who">' + NAME[line.who] + '</p>' +
        '<p class="bubble bubble-' + line.who + fresh + '">' + line.text + '</p></div></article>';
    }
    if (typing && LINES[shown]) {
      html += '<p class="typing">' + NAME[LINES[shown].who] + "在敲</p>";
    }
    if (shown >= LINES.length && !typing) {
      html += '<p class="quiet">安静了一会儿</p>';
    }
    thread.innerHTML = html;
    thread.scrollTop = thread.scrollHeight;
    home.setAttribute("aria-label", shown >= LINES.length ? "再听一遍" : "再听一句");
  }

  function arm() {
    window.clearTimeout(timer);
    if (reduced) {
      shown = LINES.length;
      typing = false;
      render();
      return;
    }
    if (shown >= LINES.length) {
      typing = false;
      render();
      return;
    }
    if (!typing) {
      render();
      timer = window.setTimeout(function () {
        typing = true;
        arm();
      }, 900);
      return;
    }
    render();
    timer = window.setTimeout(function () {
      typing = false;
      shown = Math.min(LINES.length, shown + 1);
      arm();
    }, 700);
  }

  home.addEventListener("click", function () {
    if (shown >= LINES.length) {
      typing = false;
      shown = 1;
    } else {
      typing = false;
      shown = Math.min(LINES.length, shown + 1);
    }
    arm();
  });

  arm();
})();
</script>
</body>
</html>
