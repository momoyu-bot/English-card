<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FetchMo的第二通电话</title>
<meta name="description" content="号码记下了。这一通没有转接，没说出口的晚安由它自己拨来。">
<meta name="theme-color" content="#1A1412">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 格子照抄 momoyu 造型宪法里的 FetchMo。眼睛、尾巴、腮红按那一页换，不改底模。 -->
<style>
  :root {
    --night: #1a1412;
    --ink: #f6efe6;
    --muted: #d2c3b4;
    --dim: #a89484;
    --line: #f3e7d6;
    --blue: #79c0f0;
    --lamp: #f0c27a;
    --mat: #e7f2fb;
    --mat-edge: #c5d8ea;
    --phone: #f4e7d6;
    --phone-dark: #4e382e;
    --cord: #6e5348;
    --hang: #c45c4e;
    --ok: #d7efe4;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(90% 50% at 50% -10%, rgba(240, 194, 122, .16), transparent 55%),
      var(--night);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .where {
    margin: 0;
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--muted);
  }
  .pill {
    appearance: none;
    border: 1px solid rgba(210, 195, 180, .45);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    min-height: 36px;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: .06em;
  }
  .pill[aria-pressed="true"] {
    color: #143024;
    background: var(--ok);
    border-color: transparent;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 700;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 14px;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    background: rgba(243, 231, 214, .08);
    border: 1px solid rgba(243, 231, 214, .12);
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--lamp);
    box-shadow: 0 0 8px var(--lamp);
  }
  .badge.talk .dot { background: #6dcaa0; box-shadow: 0 0 8px #6dcaa0; }
  .badge.down .dot { background: var(--dim); box-shadow: none; }
  .clock { color: var(--ink); }
  .stage {
    position: relative;
    height: 308px;
    border-radius: 26px;
    overflow: hidden;
    background: #241916;
    box-shadow: inset 0 0 0 1px rgba(243, 231, 214, .08);
  }
  .sky {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 58%;
    background:
      radial-gradient(circle at 18% 36%, rgba(240, 194, 122, .28), transparent 46%),
      linear-gradient(180deg, #32241e 0%, #1c1513 100%);
  }
  .lamp {
    position: absolute;
    left: 26px;
    top: 32px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lamp);
    box-shadow: 0 0 0 7px rgba(240, 194, 122, .16), 0 0 22px 6px rgba(240, 194, 122, .32);
  }
  .door {
    position: absolute;
    left: 50%;
    top: 54px;
    width: 150px;
    height: 150px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #4e382f 0%, #3c2b26 14%, #3c2b26 88%, #2a1d19 100%);
    border-radius: 4px 4px 0 0;
  }
  .slit {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(180deg, #ffe7b8, #f0b45a);
    box-shadow: 10px 0 16px rgba(240, 180, 90, .28);
    animation: slit 2.4s steps(3, end) infinite;
  }
  .stage.warm .slit { width: 10px; box-shadow: 16px 0 22px rgba(240, 180, 90, .42); }
  .knob {
    position: absolute;
    right: 16px;
    top: 78px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c6a07a;
  }
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 46%;
    background: linear-gradient(180deg, #3a2924 0 8px, #2a1d19 8px);
  }
  .mat {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    width: min(92%, 360px);
    height: 132px;
    background: var(--mat);
    border-radius: 18px 18px 12px 12px;
    box-shadow: 0 10px 0 var(--mat-edge);
    z-index: 2;
  }
  .cast {
    position: absolute;
    left: 0; right: 0; bottom: 8px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    padding: 0 12px;
  }
  .catbtn {
    position: relative;
    appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    line-height: 0;
  }
  .catbtn.hop { animation: hop .7s steps(2, end) infinite; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .toast {
    position: absolute;
    left: 50%;
    top: -4px;
    transform: translate(-50%, 6px);
    background: var(--phone-dark);
    color: var(--line);
    border: 2px solid #f7efe4;
    border-radius: 999px;
    font-size: 12px;
    line-height: 1.3;
    padding: 3px 9px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .phone {
    position: relative;
    width: 74px;
    height: 112px;
    border: 0;
    padding: 0;
    background: transparent;
    flex: 0 0 auto;
  }
  .phone.ring { animation: shake .42s steps(2, end) infinite; }
  .hand {
    position: absolute;
    left: 16px;
    bottom: 10px;
    width: 40px;
    height: 82px;
    background: var(--phone);
    border: 3px solid var(--phone-dark);
    border-radius: 18px;
    transform: rotate(-16deg);
    transform-origin: 50% 82%;
  }
  .phone.down .hand { transform: rotate(72deg) translate(-6px, 10px); }
  .cup {
    position: absolute;
    left: 8px;
    width: 22px;
    height: 14px;
    background: var(--phone-dark);
    border-radius: 8px;
  }
  .cup.ear { top: 6px; }
  .cup.mouth { bottom: 6px; }
  .cord {
    position: absolute;
    left: -2px;
    bottom: 6px;
    width: 34px;
    height: 26px;
    border: 3px solid var(--cord);
    border-top: 0;
    border-radius: 0 0 16px 16px;
    transform: rotate(18deg);
  }
  .phone.down .cord { opacity: .35; }
  .yarn {
    position: absolute;
    left: 16px;
    bottom: 16px;
    width: 16px;
    height: 16px;
    border: 3px solid #f3e7d6;
    border-right-color: var(--blue);
    border-radius: 50%;
    transform: rotate(-24deg);
    z-index: 3;
  }
  .who {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin: 14px 0 0;
  }
  .who strong { font-size: 18px; font-weight: 700; }
  .who span { color: var(--dim); font-size: 13px; }
  .line {
    min-height: 4.8em;
    margin: 8px 0 0;
    font-size: 17px;
    line-height: 1.65;
    color: var(--ink);
  }
  .more {
    margin: -4px 0 0;
    color: var(--muted);
    font-size: 15px;
  }
  .pocket {
    appearance: none;
    margin-top: 4px;
    border: 1px solid rgba(121, 192, 240, .45);
    background: rgba(121, 192, 240, .12);
    color: #e7f6ff;
    border-radius: 999px;
    min-height: 36px;
    padding: 6px 12px;
    font-size: 13px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .actions button {
    appearance: none;
    min-height: 44px;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid rgba(246, 239, 230, .28);
    background: transparent;
    color: var(--ink);
    font-size: 15px;
  }
  .actions button.primary {
    background: var(--ok);
    color: #1a1412;
    border-color: transparent;
    font-weight: 650;
  }
  .actions button.hang { flex-basis: 100%; background: var(--hang); color: #fff; border-color: transparent; }
  .actions button[aria-pressed="true"] {
    background: rgba(121, 192, 240, .16);
    border-color: rgba(121, 192, 240, .55);
    color: #e7f6ff;
  }
  .foot {
    margin: 22px 0 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--dim);
  }
  .foot a { color: var(--lamp); text-decoration: none; }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3px); }
  }
  @keyframes slit {
    0%, 100% { opacity: .78; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .catbtn.hop, .phone.ring, .slit { animation: none; }
    .toast { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="where">店门口 · 夜里</p>
    <button class="pill" id="sound" type="button" aria-pressed="false">听铃声</button>
  </div>
  <h1>FetchMo的第二通电话</h1>
  <p class="badge" id="badge"><i class="dot" id="dot"></i><span id="status">响着</span><span class="clock" id="clock" hidden></span></p>

  <div class="stage" id="stage">
    <div class="sky"></div>
    <div class="lamp"></div>
    <div class="door" aria-hidden="true"><div class="slit"></div><div class="knob"></div></div>
    <div class="ground"></div>
    <div class="mat">
      <span class="yarn" aria-hidden="true"></span>
      <div class="cast">
        <button class="catbtn hop" id="catbtn" type="button" aria-label="FetchMo，点一下摸耳朵">
          <canvas id="cat" width="160" height="104"></canvas>
          <span class="toast" id="toast"></span>
        </button>
        <button class="phone ring" id="phone" type="button" aria-label="听筒">
          <span class="cord"></span>
          <span class="hand"><span class="cup ear"></span><span class="cup mouth"></span></span>
        </button>
      </div>
    </div>
  </div>

  <p class="who"><strong>FetchMo</strong><span id="sub">暹罗在门口</span></p>
  <p class="line" id="line" aria-live="polite">又响了。拨号盘是暗的，它没低头看。</p>
  <p class="more" id="more" hidden></p>
  <button class="pocket" id="pocket" type="button" hidden>口袋里 · 一颗糖</button>
  <div class="actions" id="actions"></div>
  <p class="foot">
    第一通：<a href="../../gemini/%E5%B0%8F%E5%8D%A1/carbon_studio%E5%98%9F%E5%98%9F1.html">FetchMo的第一通电话</a><br>
    窗台：<a href="../%E5%B0%8F%E6%B8%B8%E6%88%8F/StashYu%E7%9A%84%E7%AC%AC%E4%B8%80%E9%80%9A%E7%94%B5%E8%AF%9D.html">StashYu的第一通电话</a>
    · <a href="../../gemini/%E5%B0%8F%E5%8D%A1/StashYu%E7%9A%84%E7%AC%AC%E4%BA%8C%E9%80%9A%E7%94%B5%E8%AF%9D-gemini.html">StashYu的第二通电话</a>
  </p>
</div>
<script>
const FRAMES = {
  body: [
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    ".....X.MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ],
  up: [
    "....................",
    "........X........X..",
    ".....X.XXX......XXX.",
    "....X...MMMMMMMMMM..",
    "....X..MMMMMMMMMMMM.",
    "....X..MEEMMMMMMEEM.",
    "....X..MEEMXXXXMEEM.",
    ".....X.MMMMMXXMMMMM.",
    "......X.MMMMMMMMMM..",
    ".......XMMMMMMMMMM..",
    "........XMMMMMMMM...",
    ".........XXM..MXX...",
    "...................."
  ],
  straight: [
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    "....X..MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ],
  out: [
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    "...X...MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ]
};
const PAL = { M: "#F3E7D6", X: "#4E382E", E: "#79C0F0", L: "#4E382E", B: "#F2B8B0" };
const EYES = [[8, 5], [16, 5]];
const MARK = {
  normal: [[0, 0], [1, 0], [0, 1], [1, 1]],
  blink: [[0, 1], [1, 1]],
  happy: [[-1, 1], [0, 0], [1, 0], [2, 1]],
  glance: [[0, 0], [1, 0], [0, 1], [1, 1]]
};
const COPY = {
  ring: "又响了。拨号盘是暗的，它没低头看。",
  hello: "「喂。是我。这回没按到鱼干，旁边的键也没压住。」",
  half: "「上次那句晚安，我收成一颗糖，搁在口袋里。糖还在。话没说。」",
  said: "「宝，晚安。不是碎片上的字。是我现在说的这一句。」",
  fox: "「窗台那只有自己的线。这一通没有转接。想跟你说话的是我。」",
  again: "「第一通把号码试通了。这一通没有新碎片，也没有分机。我就是还想打。」",
  all: "「口袋里还是那一颗糖。多出来的只有这句。听筒放下就好，我在门口坐着。」",
  sugar: "「糖还是甜的。那句晚安说过了，不收回。」",
  down: "听筒放下了。门口的垫子上还坐着一只，蓝眼睛没关，尾巴尖钩着。"
};

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("cat");
const ctx = cv.getContext("2d");
const lineEl = document.getElementById("line");
const moreEl = document.getElementById("more");
const actionsEl = document.getElementById("actions");
const badgeEl = document.getElementById("badge");
const statusEl = document.getElementById("status");
const clockEl = document.getElementById("clock");
const subEl = document.getElementById("sub");
const stageEl = document.getElementById("stage");
const phoneEl = document.getElementById("phone");
const catbtn = document.getElementById("catbtn");
const toastEl = document.getElementById("toast");
const pocketEl = document.getElementById("pocket");
const soundBtn = document.getElementById("sound");

let cell = 8;
let state = "ring";
let focus = "ring";
let half = 0;
let heardFox = false;
let heardAgain = false;
let blinkOn = false;
let tickN = 0;
let flickStep = 0;
let flickHold = 0;
let petUntil = 0;
let audioOn = false;
let actx = null;
let ringTimer = 0;
let clockTimer = 0;
let clockStart = 0;
let toastTimer = 0;

function fitCanvas() {
  const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
  const n = 8;
  cell = n * dpr;
  cv.width = 20 * cell;
  cv.height = 13 * cell;
  cv.style.width = (20 * n) + "px";
  cv.style.height = (13 * n) + "px";
  ctx.imageSmoothingEnabled = false;
}

function paintCell(g, x, y, ch) {
  if (y < 0 || y >= g.length || x < 0 || x >= g[y].length) return;
  if (g[y][x] === ".") return;
  g[y][x] = ch;
}

function draw() {
  const key = frameKey();
  const g = FRAMES[key].map((row) => row.split(""));
  const mode = eyeMode();
  EYES.forEach((origin, index) => {
    const [ox, oy] = origin;
    for (let dy = 0; dy < 2; dy++) {
      for (let dx = 0; dx < 2; dx++) paintCell(g, ox + dx, oy + dy, "M");
    }
    let use = mode;
    let shift = 0;
    if (mode === "wink") use = index === 0 ? "normal" : "happy";
    if (mode === "glance") shift = -1;
    const marks = MARK[use] || MARK.normal;
    const ch = (use === "happy" || use === "blink") ? "L" : "E";
    for (const [dx, dy] of marks) paintCell(g, ox + shift + dx, oy + dy, ch);
  });
  if (Date.now() < petUntil || focus === "said" || focus === "sugar" || allHeard()) {
    paintCell(g, 8, 7, "B");
    paintCell(g, 17, 7, "B");
  }
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < g.length; y++) {
    for (let x = 0; x < g[y].length; x++) {
      const color = PAL[g[y][x]];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }
  }
}

function allHeard() {
  return half >= 2 && heardFox && heardAgain;
}

function frameKey() {
  if (state === "down") return "up";
  if (focus === "half" && !reduced) return flickKey();
  if (focus === "fox") return "body";
  if (state === "talk") return "up";
  return "body";
}

function flickKey() {
  const seq = ["body", "straight", "out", "straight"];
  return seq[flickStep % seq.length];
}

function eyeMode() {
  if (state === "ring") return blinkOn ? "blink" : "normal";
  if (focus === "fox" || focus === "half") return blinkOn ? "blink" : "glance";
  if (focus === "again") return "wink";
  if (focus === "hello" || focus === "said" || focus === "sugar" || focus === "all") {
    return blinkOn ? "blink" : "happy";
  }
  return "normal";
}

function advanceFlick() {
  const hold = [6, 1, 1, 1];
  flickHold++;
  if (flickHold >= hold[flickStep % hold.length]) {
    flickHold = 0;
    flickStep = (flickStep + 1) % 4;
  }
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

function btn(label, act, cls, pressed) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.dataset.act = act;
  if (cls) b.className = cls;
  if (pressed) b.setAttribute("aria-pressed", "true");
  return b;
}

function render() {
  const talking = state === "talk";
  badgeEl.className = "badge" + (talking ? " talk" : state === "down" ? " down" : "");
  phoneEl.classList.toggle("ring", state === "ring" && !reduced);
  phoneEl.classList.toggle("down", state === "down");
  catbtn.classList.toggle("hop", state === "ring" && !reduced);
  stageEl.classList.toggle("warm", half >= 2);
  pocketEl.hidden = half < 2;
  if (state === "ring") {
    statusEl.textContent = "响着";
    clockEl.hidden = true;
    subEl.textContent = "暹罗在门口";
    lineEl.textContent = COPY.ring;
    moreEl.hidden = true;
  } else if (talking) {
    statusEl.textContent = "通话中";
    clockEl.hidden = false;
    subEl.textContent = "通着";
    lineEl.textContent = COPY[focus] || COPY.hello;
    if (allHeard()) {
      moreEl.hidden = false;
      moreEl.textContent = COPY.all;
    } else {
      moreEl.hidden = true;
    }
  } else {
    statusEl.textContent = "放下了";
    clockEl.hidden = true;
    subEl.textContent = "还坐着";
    if (focus === "sugar") lineEl.textContent = COPY.sugar;
    else lineEl.textContent = COPY.down;
    moreEl.hidden = true;
  }
  actionsEl.replaceChildren();
  if (state === "ring") {
    actionsEl.append(btn("接起来", "answer", "primary"));
  } else if (talking) {
    actionsEl.append(btn(half === 1 ? "听它说完" : "那半句晚安", "half", half === 1 ? "primary" : "", half >= 2));
    actionsEl.append(btn("狐狸呢", "fox", "", heardFox));
    actionsEl.append(btn("怎么又打来", "again", "", heardAgain));
    actionsEl.append(btn("放下听筒", "hang", "hang"));
  } else {
    actionsEl.append(btn("让它再打来", "redial", "primary"));
  }
  draw();
}

function answer() {
  if (state !== "ring") return;
  state = "talk";
  focus = "hello";
  stopRing();
  startClock();
  render();
}

function hang() {
  if (state !== "talk") return;
  state = "down";
  focus = "down";
  stopClock();
  render();
}

function redial() {
  state = "ring";
  focus = "ring";
  half = 0;
  heardFox = false;
  heardAgain = false;
  flickStep = 0;
  flickHold = 0;
  stopClock();
  render();
  if (audioOn) startRing();
}

function choose(act) {
  if (state !== "talk") return;
  if (act === "half") {
    if (half === 0) {
      half = 1;
      focus = "half";
    } else if (half === 1) {
      half = 2;
      focus = "said";
    } else {
      focus = "said";
    }
  } else if (act === "fox") {
    heardFox = true;
    focus = "fox";
  } else if (act === "again") {
    heardAgain = true;
    focus = "again";
  }
  render();
}

function pet() {
  petUntil = Date.now() + 1600;
  if (state === "ring") showToast("先接。我正在打。");
  else if (state === "talk") showToast("耳朵热了一下。");
  else showToast("垫子还暖。它没回屋。");
  draw();
}

function startClock() {
  clockStart = Date.now();
  clearTimeout(clockTimer);
  const step = () => {
    if (state !== "talk") return;
    const s = Math.floor((Date.now() - clockStart) / 1000);
    clockEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    clockTimer = setTimeout(step, 250);
  };
  step();
}

function stopClock() {
  clearTimeout(clockTimer);
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!actx) actx = new AC();
  if (actx.state === "suspended") actx.resume();
  return actx;
}

function blip() {
  const c = ensureAudio();
  if (!c) return;
  const now = c.currentTime;
  [620, 480].forEach((freq) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.03, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    o.connect(g);
    g.connect(c.destination);
    o.start(now);
    o.stop(now + 0.17);
  });
}

function startRing() {
  stopRing();
  if (!audioOn || state !== "ring") return;
  let n = 0;
  const loop = () => {
    if (!audioOn || state !== "ring") return;
    if (n % 8 === 0 || n % 8 === 2) blip();
    n++;
    ringTimer = setTimeout(loop, 200);
  };
  loop();
}

function stopRing() {
  clearTimeout(ringTimer);
}

actionsEl.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "answer") answer();
  else if (act === "hang") hang();
  else if (act === "redial") redial();
  else choose(act);
});

phoneEl.addEventListener("click", () => {
  if (state === "ring") answer();
  else if (state === "talk") hang();
});

catbtn.addEventListener("click", pet);
pocketEl.addEventListener("click", () => {
  if (half < 2) return;
  focus = "sugar";
  petUntil = Date.now() + 1200;
  render();
});

soundBtn.addEventListener("click", () => {
  audioOn = !audioOn;
  soundBtn.setAttribute("aria-pressed", audioOn ? "true" : "false");
  soundBtn.textContent = audioOn ? "听筒开着" : "听铃声";
  if (audioOn) {
    ensureAudio();
    if (state === "ring") startRing();
  } else {
    stopRing();
  }
});

window.addEventListener("resize", () => { fitCanvas(); draw(); });

setInterval(() => {
  tickN++;
  if (!reduced) {
    blinkOn = tickN % 6 === 0;
    if (state === "talk" && focus === "half") advanceFlick();
  }
  draw();
}, 140);

fitCanvas();
render();
</script>
</body>
</html>
