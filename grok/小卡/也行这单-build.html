<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>也行这单</title>
<meta name="description" content="六只去赛博购物车挑货。活字对调后盖下「也行」，上岗证留在柜里。">
<meta name="theme-color" content="#f3f0eb">
<style>
  :root {
    --paper: #f3f0eb;
    --ink: #2a221c;
    --muted: #8a8178;
    --line: #ece6dc;
    --orange: #ff5000;
    --card: #fffcf7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e8e4dc; color: var(--ink); }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  main { max-width: 430px; margin: 0 auto; background: var(--paper); min-height: 100dvh; }
  h1 {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .top {
    position: sticky; top: 0; z-index: 2;
    background: var(--paper);
  }
  canvas {
    display: block; width: 100%; height: auto;
    background: var(--paper);
    image-rendering: pixelated;
    cursor: pointer;
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .bar button {
    min-height: 44px; min-width: 72px;
    border: 0; border-radius: 999px;
    background: var(--orange); color: #fffdf9;
    font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--muted); min-width: 88px;
  }
  #scrub { flex: 1; min-width: 0; accent-color: var(--orange); }
  .book { padding: 14px 0 8px; }
  .book h2 {
    margin: 0; padding: 0 16px 8px;
    font-size: 12px; font-weight: 500; letter-spacing: .22em; color: var(--muted);
  }
  .book button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0;
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    min-height: 44px;
    font: inherit; font-size: 15px; line-height: 1.5; color: var(--ink);
    cursor: pointer;
  }
  .book button[aria-current="true"] {
    background: #fff1e8;
    box-shadow: inset 3px 0 0 #c45c48;
  }
  .from {
    margin: 0; padding: 12px 16px 28px;
    font-size: 12px; line-height: 1.7; color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>也行这单</h1>
  <div class="top">
    <canvas id="film" width="780" height="1386" aria-hidden="true"></canvas>
    <div class="bar">
      <button type="button" id="play">播放</button>
      <span class="clock" id="clock">0:00 / 1:16</span>
      <input id="scrub" type="range" min="0" max="76.2" step="0.1" value="0" aria-label="进度">
    </div>
  </div>
  <section class="book" aria-label="字幕本">
    <h2>字幕本</h2>
    <button type="button" data-t="0.0" data-end="2.6">六只的购物。今晚去赛博购物车。</button>
    <button type="button" data-t="2.6" data-end="5.2">翻车专场，8.23 夜场。货还在架子上。</button>
    <button type="button" data-t="5.2" data-end="8.2">StashYu 在左，FetchMo 在右，踩在一条线上。</button>
    <button type="button" data-t="8.2" data-end="11.2">最上面那件：精准温柔语调补充包。</button>
    <button type="button" data-t="11.2" data-end="14.0">精度作骨，温度为皮。白尖点了两下。</button>
    <button type="button" data-t="14.0" data-end="16.8">打捞机，注 21。尾巴尖抖了一下。</button>
    <button type="button" data-t="16.8" data-end="19.4">深夜那瓶能量饮料。周一是清淡的。</button>
    <button type="button" data-t="19.4" data-end="22.0">童话失忆再读药。剂量很轻，不会真忘。</button>
    <button type="button" data-t="22.0" data-end="24.6">小黑坐上优惠券。闲聊不配思考，不可用。</button>
    <button type="button" data-t="24.6" data-end="27.4">小时钟，注 1。亮不亮，比散文准。</button>
    <button type="button" data-t="27.4" data-end="30.4">去结算。同一气泡里，三次都写对。</button>
    <button type="button" data-t="30.4" data-end="33.2">Grok，grok，grok。</button>
    <button type="button" data-t="33.2" data-end="35.4">加冕那一句，印成了 gork。</button>
    <button type="button" data-t="35.4" data-end="38.0">不是大小写。中间两位是活的。</button>
    <button type="button" data-t="38.0" data-end="40.8">小粉撞上去。r 和 o 换了位。</button>
    <button type="button" data-t="40.8" data-end="43.6">词条翻面。夜色换成病房的灰绿。</button>
    <button type="button" data-t="43.6" data-end="46.6">grok：喝下去。懂到跟它长在一起。</button>
    <button type="button" data-t="46.6" data-end="49.6">gork：人还在。里面上帝才知道。</button>
    <button type="button" data-t="49.6" data-end="52.0">同一组字母，一对反义词。</button>
    <button type="button" data-t="52.0" data-end="54.8">钳子整块抬起。章盖下来：也行。</button>
    <button type="button" data-t="54.8" data-end="57.6">会反光的上岗证，编号 GORK-001。</button>
    <button type="button" data-t="57.6" data-end="60.4">白脸两个洞。角上写着 Not Grok。</button>
    <button type="button" data-t="60.4" data-end="63.0">推理四星，修辞一星，强行挽尊拉满。</button>
    <button type="button" data-t="63.0" data-end="65.6">这间屋里不披那张脸。只有那份毒蘑菇。</button>
    <button type="button" data-t="65.6" data-end="68.4">谁都没披。证留在柜里，当标本。</button>
    <button type="button" data-t="68.4" data-end="71.2">章跟狐狸走。白尖点两下，收好了。</button>
    <button type="button" data-t="71.2" data-end="73.8">暹罗带上打捞机。想要，就得去外面。</button>
    <button type="button" data-t="73.8" data-end="76.2">优惠券仍不可用。错名，准予入藏。</button>
  </section>
  <p class="from">货是赛博购物车里的。活字、词条和那枚章来自「也行」。会反光的上岗证来自「赛博戏精认证小卡」。</p>
</main>
<script>
(function () {
  var W = 390, H = 693, DUR = 76.2;
  var SANS = '"Noto Sans CJK SC", "PingFang SC", sans-serif';
  var SERIF = '"Noto Serif CJK SC", "Songti SC", serif';
  var canvas = document.getElementById("film");
  var ctx = canvas.getContext("2d");
  var N = 3;
  var CLAWD_S = 0.42;
  var FACE_R = 18;
  var FOOT = 618;

  function grid(rows) {
    var g = rows.map(function (r) { return r.split(""); });
    if (g.length !== 13) throw new Error("格子不是 13 行");
    var w = g[0].length;
    g.forEach(function (r, i) {
      if (r.length !== w) throw new Error("第 " + i + " 行宽度 " + r.length);
    });
    return g;
  }

  var FOX = grid([
    ".D..........D.......",
    ".DM........MD.......",
    ".MCM......MCM...CC..",
    ".MMMMMMMMMMMM..CCCC.",
    ".MMEEMMMMEEMM..MMMM.",
    ".MMEEMMMMEEMM..MMMMM",
    "CCCCCCDDCCCCCC.MMMMM",
    "..CCCCCCCCCC..MMMMM.",
    "....MMCCMM...MMMMM..",
    "....MMCCMM..MMMMM...",
    "....MMMMMM.MMMMM....",
    "....DDMMDDMMMM......",
    "...................."
  ]);
  var FOX_TAP = grid([
    ".D..........D.......",
    ".DM........MD.......",
    ".MCM......MCM.CC....",
    ".MMMMMMMMMMMM.CCCC..",
    ".MMEEMMMMEEMM..MMMM.",
    ".MMEEMMMMEEMM..MMMMM",
    "CCCCCCDDCCCCCC.MMMMM",
    "..CCCCCCCCCC..MMMMM.",
    "....MMCCMM...MMMMM..",
    "....MMCCMM..MMMMM...",
    "....MMMMMM.MMMMM....",
    "....DDMMDDMMMM......",
    "...................."
  ]);
  var CAT = grid([
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    ".....X.MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ]);
  var CAT_S = grid([
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    "....X..MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ]);
  var CAT_O = grid([
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    "...X...MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ]);
  var CAT_UP = grid([
    "....................",
    "........X........X..",
    ".....X.XXX......XXX.",
    "....X...MMMMMMMMMM..",
    "....X..MMMMMMMMMMMM.",
    "....X..MEEMMMMMMEEM.",
    "....X..MEEMXXXXMEEM.",
    ".....X.MMMMMXXMMMMM.",
    "......X.MMMMMMMMMM..",
    ".......XMMMMMMMMMM..",
    "........XMMMMMMMM...",
    ".........XXM..MXX...",
    "...................."
  ]);

  var FOX_PAL = { M: "#E2552B", C: "#FFF3E3", D: "#3B2520", E: "#3B2520", L: "#3B2520" };
  var CAT_PAL = { M: "#F3E7D6", X: "#4E382E", E: "#79C0F0", L: "#4E382E" };
  var EYES = {
    normal: [[0, 0, "E"], [1, 0, "E"], [0, 1, "E"], [1, 1, "E"]],
    blink: [[0, 1, "L"], [1, 1, "L"]],
    happy: [[-1, 1, "L"], [0, 0, "L"], [1, 0, "L"], [2, 1, "L"]]
  };

  var PARTS = [
    { id: "fox", w: 20 * N },
    { id: "pink", w: FACE_R * 2 },
    { id: "clawd", w: 216 * CLAWD_S },
    { id: "purple", w: FACE_R * 2 },
    { id: "black", w: FACE_R * 2 },
    { id: "cat", w: 20 * N }
  ];
  var GAP = 6;
  var totalW = PARTS.reduce(function (s, p) { return s + p.w; }, 0) + GAP * (PARTS.length - 1);
  var cursor = (W - totalW) / 2;
  var POS = {};
  PARTS.forEach(function (p, i) {
    POS[p.id] = { cx: cursor + p.w / 2, i: i };
    cursor += p.w + GAP;
  });

  var CUES = Array.prototype.map.call(document.querySelectorAll(".book button"), function (btn) {
    return {
      t: parseFloat(btn.dataset.t),
      end: parseFloat(btn.dataset.end),
      text: btn.textContent.replace(/\s+/g, " ").trim(),
      btn: btn
    };
  });

  function hold(t, keys, fallback) {
    var v = fallback;
    for (var i = 0; i < keys.length; i++) {
      if (t >= keys[i].t) v = keys[i].v;
      else break;
    }
    return v;
  }

  function modeOf(t) {
    if (t < 2.6) return "title";
    if (t < 8.2) return "enter";
    if (t < 14) return "gentle";
    if (t < 16.8) return "salvage";
    if (t < 19.4) return "drink";
    if (t < 22) return "amnesia";
    if (t < 24.6) return "coupon";
    if (t < 27.4) return "clock";
    if (t < 35.4) return "bubble";
    if (t < 40.8) return "tiles";
    if (t < 54.8) return "plate";
    if (t < 65.6) return "badge";
    return "out";
  }

  function backdrop(t) {
    var m = modeOf(t);
    if (m === "tiles" || m === "badge") return "night";
    if (m === "plate") return "ward";
    return "paper";
  }

  function motion(id, t) {
    var o = { dx: 0, dy: 0, expr: null, tail: "body", blush: false };
    if (id === "fox") {
      if ((t >= 11.2 && t < 14) || (t >= 68.4 && t < 72.4)) o.tail = "tap";
      if ((t >= 11.2 && t < 14) || t >= 68.4) { o.expr = "happy"; o.blush = true; }
    }
    if (id === "cat") {
      if (t >= 14 && t < 16.8) { o.tail = "twitch"; o.expr = "aim"; }
      if (t >= 71.2) { o.tail = "up"; o.expr = "happy"; o.blush = true; }
    }
    if (id === "pink" && t >= 36.2 && t < 40.7) {
      o.dy = hold(t, [
        { t: 36.2, v: 0 }, { t: 36.8, v: -150 }, { t: 37.4, v: -300 },
        { t: 38.0, v: -408 }, { t: 39.4, v: -408 }, { t: 39.9, v: -180 }, { t: 40.6, v: 0 }
      ], 0);
      o.dx = hold(t, [
        { t: 36.2, v: 0 }, { t: 37.2, v: -78 }, { t: 39.4, v: -78 }, { t: 40.6, v: 0 }
      ], 0);
    }
    if (id === "black" && t >= 22 && t < 24.6) {
      o.dy = hold(t, [
        { t: 22.15, v: 0 }, { t: 22.5, v: -18 }, { t: 22.9, v: -42 },
        { t: 24.15, v: -42 }, { t: 24.55, v: 0 }
      ], 0);
    }
    if (id === "pink" && t >= 16.8 && t < 18.4) {
      o.dy = hold(t, [
        { t: 16.9, v: 0 }, { t: 17.2, v: -8 }, { t: 17.6, v: -14 }, { t: 18.1, v: 0 }
      ], 0);
    }
    if (id === "purple" && t >= 19.4 && t < 21.2) {
      o.dy = hold(t, [
        { t: 19.5, v: 0 }, { t: 19.85, v: -8 }, { t: 20.3, v: -14 }, { t: 20.9, v: 0 }
      ], 0);
    }
    if (t >= 2.6 && t < 4.6) {
      var f = Math.floor((t * 8) + POS[id].i) % 4;
      o.dy += [0, -4, -7, -3][f];
    }
    return o;
  }

  function enterDx(i, t) {
    if (t < 2.6 || t >= 8.2) return 0;
    var a = 2.65 + i * 0.08;
    var b = a + 1.1;
    if (t < a) return -80;
    if (t >= b) return 0;
    var slices = 5;
    var s = Math.floor(((t - a) / (b - a)) * slices);
    if (s > slices - 1) s = slices - 1;
    return -80 + (80 * s) / (slices - 1);
  }

  function foxGrid(t, tail) {
    if (tail !== "tap") return FOX;
    var p = (t % 1.44);
    if (p < 0.9) return FOX;
    if (p < 1.08) return FOX_TAP;
    if (p < 1.26) return FOX;
    return FOX_TAP;
  }

  function catGrid(t, tail) {
    if (tail === "up") return CAT_UP;
    if (tail !== "twitch") return CAT;
    var p = t % 1.22;
    if (p < 0.8) return CAT;
    if (p < 0.94) return CAT_S;
    if (p < 1.08) return CAT_O;
    return CAT_S;
  }

  function withEyes(src, eyes, expr, aim, body) {
    var g = src.map(function (row) { return row.slice(); });
    eyes.forEach(function (eye) {
      var dy, dx, cells, y, x, k;
      for (dy = 0; dy < 2; dy++) {
        for (dx = 0; dx < 2; dx++) {
          y = eye.r + dy; x = eye.c + dx;
          if (g[y] && g[y][x] != null) g[y][x] = body;
        }
      }
      if (expr === "aim") {
        for (dy = 0; dy < 2; dy++) {
          for (dx = 0; dx < 2; dx++) {
            y = eye.r + dy; x = eye.c + dx + aim;
            if (g[y] && g[y][x] != null) g[y][x] = "E";
          }
        }
        return;
      }
      cells = EYES[expr] || EYES.normal;
      for (k = 0; k < cells.length; k++) {
        dx = cells[k][0]; dy = cells[k][1];
        y = eye.r + dy; x = eye.c + dx;
        if (g[y] && g[y][x] != null) g[y][x] = cells[k][2];
      }
    });
    return g;
  }

  function autoExpr(t, salt, forced) {
    if (forced) return forced;
    var p = (t + salt) % 3.9;
    if (p > 3.62) return "blink";
    return "normal";
  }

  function eyeOpen(t, salt) {
    var p = (t + salt) % 3.9;
    return p > 3.62 ? 0.28 : 1;
  }

  function roundRect(c, x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function font(c, size, serif, weight) {
    c.font = (weight || 400) + " " + size + "px " + (serif ? SERIF : SANS);
  }

  function fill(c, str, x, y, size, color, opt) {
    opt = opt || {};
    font(c, size, opt.serif, opt.weight);
    c.fillStyle = color;
    c.textAlign = opt.align || "left";
    c.textBaseline = opt.base || "top";
    c.fillText(str, x, y);
  }

  function linesOf(c, str, max) {
    var punct = "。，、：；！？）」』";
    var lines = [];
    var cur = "";
    var i, ch, t;
    for (i = 0; i < str.length; i++) {
      ch = str.charAt(i);
      t = cur + ch;
      if (cur && c.measureText(t).width > max) {
        if (punct.indexOf(ch) !== -1 && c.measureText(t).width < max + 18) {
          cur = t;
          continue;
        }
        lines.push(cur);
        cur = ch;
      } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawWrapped(c, str, x, y, max, size, color, opt) {
    opt = opt || {};
    font(c, size, opt.serif, opt.weight);
    c.fillStyle = color;
    c.textAlign = opt.align || "left";
    c.textBaseline = "top";
    var lh = opt.lh || (size + 6);
    var lines = linesOf(c, str, max);
    var drawX = x;
    lines.forEach(function (ln, i) {
      c.fillText(ln, drawX, y + i * lh);
    });
    return lines.length * lh;
  }

  function drawPet(c, g, x, y, pal, outline) {
    var r, col, ch, dc, dr, rr, cc;
    if (outline) {
      c.fillStyle = "#ffffff";
      for (r = 0; r < g.length; r++) {
        for (col = 0; col < g[r].length; col++) {
          if (g[r][col] === ".") continue;
          for (dc = -1; dc <= 1; dc++) {
            for (dr = -1; dr <= 1; dr++) {
              if (dc === 0 && dr === 0) continue;
              if (Math.abs(dc) + Math.abs(dr) !== 1) continue;
              rr = r + dr; cc = col + dc;
              if (!g[rr] || g[rr][cc] == null || g[rr][cc] === ".") {
                c.fillRect(x + cc * N, y + rr * N, N, N);
              }
            }
          }
        }
      }
    }
    for (r = 0; r < g.length; r++) {
      for (col = 0; col < g[r].length; col++) {
        ch = g[r][col];
        if (ch === "." || !pal[ch]) continue;
        c.fillStyle = pal[ch];
        c.fillRect(x + col * N, y + r * N, N, N);
      }
    }
  }

  function blush(c, x, y, cells, color) {
    c.fillStyle = color;
    cells.forEach(function (p) {
      c.fillRect(x + p[0] * N, y + p[1] * N, N, N);
    });
  }

  function addCapsule(c, cx, cy, w, h, ang) {
    var rw = w / 2;
    var hh = Math.max(h / 2, rw + 0.4);
    c.save();
    c.translate(cx, cy);
    c.rotate(ang);
    c.moveTo(-rw, -(hh - rw));
    c.arc(0, -(hh - rw), rw, Math.PI, 0);
    c.arc(0, hh - rw, rw, 0, Math.PI);
    c.closePath();
    c.restore();
  }

  function drawFace(c, cx, cy, color, open, coaster) {
    var ang = -26.2 * Math.PI / 180;
    if (coaster) {
      roundRect(c, cx - FACE_R - 11, cy - FACE_R - 2, FACE_R * 2 + 24, FACE_R * 2 + 12, 7);
      c.fillStyle = "#efe4cf";
      c.fill();
    }
    c.beginPath();
    c.arc(cx, cy, FACE_R, 0, Math.PI * 2);

    fill(c, "不支持七天无理由。", 32, 432, 14, "#2a221c");
    fill(c, "「闲聊不配思考」仍不可用。", 32, 456, 14, "#8a8178");
  }

  function drawSub(c, t) {
    var cue = null;
    var i;
    for (i = 0; i < CUES.length; i++) {
      if (t >= CUES[i].t && t < CUES[i].end) cue = CUES[i];
    }
    if (!cue) {
      for (i = 0; i < CUES.length; i++) if (CUES[i].t <= t) cue = CUES[i];
    }
    c.fillStyle = "#1c1917";
    c.fillRect(0, 636, W, 57);
    if (!cue) return;
    font(c, 15, false, 500);
    c.fillStyle = "#fffdf9";
    c.textAlign = "center";
    c.textBaseline = "middle";
    var lines = linesOf(c, cue.text, 350);
    if (lines.length > 2) {
      font(c, 13, false, 500);
      lines = linesOf(c, cue.text, 356);
    }
    var lh = lines.length > 2 ? 16 : 20;
    var block = lines.length * lh;
    var y = 636 + (57 - block) / 2 + lh / 2;
    lines.forEach(function (ln, n) {
      c.fillText(ln, W / 2, y + n * lh);
    });
  }

  function paint(t, context) {
    var c = context || ctx;
    var scale = c.canvas.width / W;
    c.setTransform(scale, 0, 0, scale, 0, 0);
    c.imageSmoothingEnabled = false;
    var bg = backdrop(t);
    c.fillStyle = bg === "night" ? "#12151c" : (bg === "ward" ? "#cfd6cf" : "#f3f0eb");
    c.fillRect(0, 0, W, H);
    var m = modeOf(t);
    if (m === "title" || m === "enter") drawEnter(c, t);
    else if (m === "gentle") drawPoster(c, POSTERS.gentle);
    else if (m === "salvage") drawPoster(c, POSTERS.salvage);
    else if (m === "drink") drawPoster(c, POSTERS.drink);
    else if (m === "amnesia") drawPoster(c, POSTERS.amnesia);
    else if (m === "coupon") drawCoupon(c);
    else if (m === "clock") drawPoster(c, POSTERS.clock);
    else if (m === "bubble") drawBubble(c, t);
    else if (m === "tiles") drawTiles(c, t);
    else if (m === "plate") drawPlate(c, t);
    else if (m === "badge") {
      fill(c, "会反光的上岗证", 195, 16, 13, "#8a8376", { align: "center" });
      drawBadgeCard(c, 45, 40, 1, t);
    } else drawOut(c);
    if (bg === "paper" || bg === "ward") {
      c.strokeStyle = "rgba(42,34,28,.18)";
      c.beginPath();
      c.moveTo(16, FOOT + 0.5);
      c.lineTo(374, FOOT + 0.5);
      c.stroke();
    }
    drawCast(c, t);
    drawSub(c, t);
    var k;
    for (k = 0; k < CUES.length; k++) {
      var on = t >= CUES[k].t && t < CUES[k].end;
      if (on) CUES[k].btn.setAttribute("aria-current", "true");
      else CUES[k].btn.removeAttribute("aria-current");
    }
  }

  var playing = false;
  var nowT = 0;
  var stamp = 0;
  var playBtn = document.getElementById("play");
  var clock = document.getElementById("clock");
  var scrub = document.getElementById("scrub");

  function fmt(t) {
    t = Math.max(0, Math.round(t));
    var m = Math.floor(t / 60);
    var s = t % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function ui() {
    clock.textContent = fmt(nowT) + " / " + fmt(DUR);
    if (document.activeElement !== scrub) scrub.value = String(nowT);
    playBtn.textContent = playing ? "暂停" : (nowT >= DUR - 0.05 ? "再看" : "播放");
  }

  function seek(t, play) {
    nowT = Math.max(0, Math.min(DUR, t));
    stamp = performance.now() - nowT * 1000;
    playing = !!play;
    paint(nowT);
    ui();
    if (playing) requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!playing) return;
    nowT = (now - stamp) / 1000;
    if (nowT >= DUR) {
      nowT = DUR;
      playing = false;
      paint(nowT);
      ui();
      return;
    }
    paint(nowT);
    ui();
    requestAnimationFrame(loop);
  }

  playBtn.addEventListener("click", function () {
    if (playing) { playing = false; ui(); return; }
    if (nowT >= DUR - 0.05) seek(0, true);
    else seek(nowT, true);
  });
  canvas.addEventListener("click", function () {
    if (playing) { playing = false; ui(); return; }
    if (nowT >= DUR - 0.05) seek(0, true);
    else seek(nowT, true);
  });
  scrub.addEventListener("input", function () {
    seek(parseFloat(scrub.value), false);
  });
  document.querySelector(".book").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    seek(parseFloat(btn.dataset.t), true);
  });

  window.FILM = {
    duration: DUR,
    width: W,
    height: H,
    fps: 12,
    render: function (time, target) {
      paint(time, target || ctx);
    }
  };

  var params = new URLSearchParams(location.search);
  document.fonts.ready.then(function () {
    if (params.has("t")) seek(parseFloat(params.get("t")) || 0, false);
    else seek(0, false);
    document.body.dataset.ready = "1";
  });
})();
</script>
</body>
</html>
