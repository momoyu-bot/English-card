<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>长相见</title>
<meta name="description" content="阁楼上，最短的应许只写三个字。天亮纸还在，有一个位子空了。">
<meta name="theme-color" content="#14241e">
<style>
  :root{
    --bg:#14241e; --bg-deep:#0e1a16; --paper:#f3e6c8; --ink:#1c2a24;
    --gold:#e0bd79; --dim:#b7c0ae; --line:#3d5248;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 50% 0%, #24382f 0%, transparent 58%),
      var(--bg);
    color:var(--paper);
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.5;
  }
  button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
  .wrap{
    width:min(100% - 20px, 440px);
    margin:0 auto;
    padding:max(18px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
  }
  header{text-align:center;margin-bottom:12px}
  .tag{font-size:12px;letter-spacing:.22em;color:var(--dim)}
  h1{
    margin:4px 0 6px;font-weight:600;font-size:28px;letter-spacing:.28em;text-indent:.28em;
    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  }
  .lede{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
  .screen{position:relative;width:100%;aspect-ratio:360/468;background:#1a2e28;overflow:hidden;box-shadow:0 10px 28px #06110e66}
  .screen canvas{width:100%;height:100%;display:block}
  .open{
    position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7%;
  }
  .open[hidden]{display:none}
  .ticket{
    min-height:44px;min-width:112px;padding:8px 22px;background:var(--paper);color:var(--ink);
    font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:700;letter-spacing:.16em;font-size:16px;
  }
  .now{
    min-height:4.6em;margin:12px 2px 0;text-align:center;
    font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:18px;line-height:1.55;
  }
  .transport{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--line)}
  .transport button{min-height:44px;min-width:52px;color:var(--paper);font-size:14px}
  #sound{color:var(--dim);font-size:13px}
  .clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
  input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--gold)}
  details{margin-top:4px}
  summary{
    min-height:48px;display:flex;align-items:center;justify-content:space-between;
    font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;letter-spacing:.08em;cursor:pointer;
  }
  ol{list-style:none;margin:0;padding:0}
  .cue{
    width:100%;display:grid;grid-template-columns:48px 1fr;gap:8px;text-align:left;
    min-height:44px;padding:8px 4px;border-top:1px solid #3d524866;line-height:1.55;font-size:15px;
  }
  .cue time{color:var(--gold);font-size:12px;padding-top:4px}
  .cue[aria-current="true"]{background:#e0bd7914;box-shadow:inset 2px 0 var(--gold)}
  .credit{color:var(--dim);font-size:12px;line-height:1.7;margin:12px 2px 0}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="tag">小萌物短片</div>
    <h1>长相见</h1>
    <p class="lede">阁楼上，最短的应许只写三个字。天亮纸还在，有一个位子空了。</p>
  </header>
  <div class="screen">
    <canvas id="c" width="720" height="936" role="img" aria-label="长相见。阁楼的一夜。字幕在画面下面，也可以逐句查看。"></canvas>
    <button class="open" id="open" type="button"><span class="ticket">开演</span></button>
  </div>
  <p class="now" id="now" aria-live="polite"></p>
  <div class="transport">
    <button id="play" type="button">播放</button>
    <input id="seek" type="range" min="0" max="100" step="0.05" value="0" aria-label="播放进度">
    <span class="clock" id="clock">0:00 / 1:40</span>
    <button id="sound" type="button" aria-pressed="true">声音开</button>
  </div>
  <details>
    <summary>字幕本</summary>
    <ol id="book"></ol>
    <p class="credit">出演　狐狸、暹罗、小粉、小紫、小黑、Clawd<br>三个字是这一夜写下的。没有引原词。天亮以后，没有人把纸拿起来。</p>
  </details>
</main>
