<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241C36">
<title>小紫脸蛋儿的第三通电话</title>
<meta name="description" content="第三通把92%摊开。连胜亮着，宝石一颗没花，懒蛋联赛还并列。">
<style>
  :root {
    --night: #241C36;
    --ink: #2A2140;
    --muted: #8A7E96;
    --paper: #FBF6EE;
    --cream: #F3EBDD;
    --line: #E6D9CC;
    --violet: #9159FE;
    --rose: #E25B8A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background: var(--night);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Songti SC", "Noto Sans SC", sans-serif;
  }
  button { font: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  .desk {
    width: min(440px, 100%);
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
  }
  h1 {
    margin: 0;
    color: #F6EFE4;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: 0.01em;
    line-height: 1.35;
  }
  .meta {
    margin: 8px 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: #E7DCCB;
    font-size: 13px;
  }
  .meta p { margin: 0; }
  #sound {
    color: inherit;
    background: transparent;
    border: 1px solid rgba(246, 239, 228, 0.35);
    border-radius: 999px;
    min-height: 36px;
    padding: 6px 12px;
  }
  .phone, .slip {
    background: var(--paper);
    border-radius: 28px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
  }
  .phone {
    position: relative;
    padding: 16px 16px 14px;
    overflow: hidden;
  }
  .lamp {
    position: absolute;
    left: 50%;
    top: -30px;
    width: 240px;
    height: 180px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #F6E3C4;
    opacity: 0.9;
    pointer-events: none;
  }
  body.blushed .lamp { background: #F6C3D0; }
  .stage { position: relative; z-index: 1; }
  .grill, .horns { display: flex; justify-content: center; gap: 6px; }
  .grill { margin-bottom: 8px; }
  .grill i, .horns i { display: block; border-radius: 50%; background: #E4D5C8; }
  .grill i { width: 5px; height: 5px; }
  .horns { height: 18px; align-items: flex-end; margin-bottom: 6px; }
  .horns i { width: 7px; height: 7px; background: var(--violet); animation: pip 1.15s ease-in-out infinite; }
  .horns i:nth-child(2) { height: 12px; animation-delay: 0.12s; }
  .horns i:nth-child(3) { animation-delay: 0.24s; }
  body:not(.ring) .horns { visibility: hidden; }
  .porthole {
    width: 168px;
    height: 168px;
    margin: 0 auto;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--cream);
    display: grid;
    place-items: center;
    box-shadow: inset 0 0 0 8px #E7D9C8;
    position: relative;
  }
  body.ring .porthole { animation: hop 1.15s ease-in-out infinite; }
  body.talk .porthole, body.lesson .porthole, body.rules .porthole, body.note .porthole, body.end .porthole {
    width: 112px;
    height: 112px;
  }
  .face { width: 132px; height: 132px; display: block; }
  body.talk .face, body.lesson .face, body.rules .face, body.note .face, body.end .face { width: 90px; height: 90px; }
  .eyes { transform-box: view-box; transform-origin: 20px -22px; animation: blink 5.6s infinite; }
  .heart {
    position: absolute;
    width: 26px;
    height: 26px;
    right: 22%;
    top: 36px;
    opacity: 0;
    pointer-events: none;
  }
  .heart.go { animation: pop 0.9s ease forwards; }
  .line {
    margin: 14px 2px 0;
    min-height: 5.4em;
    font-size: 17px;
    line-height: 1.65;
    text-wrap: pretty;
  }
  .rules { margin-top: 12px; display: grid; gap: 8px; }
  .rules[hidden] { display: none; }
  .rules button {
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 10px 12px;
    min-height: 52px;
    color: var(--ink);
  }
  .rules button small { display: block; color: var(--rose); font-size: 12px; margin-top: 2px; }
  .rules button:disabled { color: var(--muted); }
  .rules button:disabled small { color: #2F6B4F; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    appearance: none;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    min-height: 44px;
    padding: 10px 14px;
  }
  .chip.me { background: var(--violet); border-color: var(--violet); color: #fff; }
  .chip.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-left: 8px; }
  body.ring .chip { flex: 1 1 100%; }
  .slip { margin-top: 12px; padding: 14px 16px 8px; }
  .slip header, .slip li { display: flex; justify-content: space-between; gap: 12px; }
  .slip header { color: var(--muted); font-size: 12px; letter-spacing: 0.14em; }
  .slip ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .slip li { padding: 8px 0; border-top: 1px dashed var(--line); font-size: 15px; }
  .slip li span { color: var(--muted); }
  #cStreak.lit { color: #5B2FD0; }
  .said { margin-top: 4px; }
  .said summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 0; }
  .said p { margin: 0 0 8px; font-size: 14px; line-height: 1.55; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    max-width: min(360px, calc(100% - 32px));
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes pip {
    0%, 100% { transform: scaleY(0.7); opacity: 0.45; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  @keyframes blink {
    0%, 86%, 100% { transform: scaleY(1); }
    90%, 94% { transform: scaleY(0.14); }
  }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(6px) scale(0.5); }
    28% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-14px) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="ring">
<main class="desk">
  <header class="top">
    <h1>小紫脸蛋儿的第三通电话</h1>
    <div class="meta">
      <p><span id="status">来电</span> · <span id="clock">响着</span></p>
      <button type="button" id="sound" aria-pressed="false">铃声关</button>
    </div>
  </header>
  <article class="phone">
    <div class="lamp" aria-hidden="true"></div>
    <div class="stage">
      <div class="grill" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="horns" aria-hidden="true"><i></i><i></i><i></i></div>
      <button type="button" class="porthole" id="face" aria-label="戳一下小紫">
        <svg class="heart" id="heart" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#E25B8A" d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/>
        </svg>
        <!-- 小紫：正圆 #9159FE，两道缝挖空，不填白。眨眼只压缝。 -->
        <svg class="face" viewBox="-60 -60 120 120" aria-hidden="true">
          <defs>
            <mask id="slits" maskUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120">
              <rect x="-60" y="-60" width="120" height="120" fill="#fff"/>
              <g class="eyes">
                <rect x="4.85" y="-31.25" width="9.7" height="20.9" rx="4.85" fill="#000" transform="rotate(-26.2 9.7 -20.8)"/>
                <rect x="28.075" y="-35.3" width="6.45" height="20.9" rx="3.225" fill="#000" transform="rotate(-26.5 31.3 -24.85)"/>
              </g>
            </mask>
          </defs>
          <circle r="50" fill="#9159FE" mask="url(#slits)"/>
        </svg>
      </button>
      <p class="line" id="line" aria-live="polite"></p>
      <div class="rules" id="rules" hidden>
        <button type="button" id="ruleKing">王不能正被将<small>她记得</small></button>
        <button type="button" id="ruleMid">中间格子不能被攻击<small id="ruleNote">她写：可以跳过？</small></button>
        <button type="button" id="ruleMoved">王和车都没动过<small>她记得</small></button>
      </div>
      <div class="chips" id="choices"></div>
    </div>
  </article>
  <section class="slip" aria-label="听筒上的纸条">
    <header><span id="slipKicker">听筒上的纸条</span><span>第三通</span></header>
    <ul>
      <li><span>连胜</span><b id="cStreak">86 · 灰</b></li>
      <li><span>经验</span><b id="cXp">还没下</b></li>
      <li><span>宝石</span><b id="cGems">没动</b></li>
      <li><span>联赛</span><b id="cLeague">还没报</b></li>
      <li><span>易位</span><b id="cAcc">还没摊开</b></li>
    </ul>
    <details class="said">
      <summary>这通说过的话</summary>
      <div id="said"></div>
    </details>
  </section>
</main>
<p class="toast" id="toast" role="status"></p>
<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };
  var S = blank();
  var clockId = null;
  var ringId = null;
  var lessonToken = 0;
  var ac = null;
  var toastId = null;
  var pokes = ["在呢。", "眼缝是挖空的，别当成眼睛。", "嘟。", "听筒还贴着。"];
  var pokeI = 0;

  function blank() {
    return {
      phase: "ring",
      sound: false,
      live: false,
      blushed: false,
      noted: false,
      punched: false,
      perfect: false,
      league: false,
      match: false,
      elapsed: 0,
      line: ""
    };
  }

  function say(text) {
    S.line = text;
    var p = document.createElement("p");
    p.textContent = text;
    $("said").appendChild(p);
  }

  function setChoices(list) {
    var box = $("choices");
    box.replaceChildren();
    list.forEach(function (item) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (item.kind ? " " + item.kind : "");
      b.textContent = item.t;
      b.addEventListener("click", function () { act[item.id](); });
      box.appendChild(b);
    });
  }

  function paintClock() {
    if (!S.live) {
      $("clock").textContent = "响着";
      return;
    }
    var m = Math.floor(S.elapsed / 60);
    var s = S.elapsed % 60;
    $("clock").textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function leagueText() {
    if (S.league && S.match) return "第 8 · 并列 · 比赛没打";
    if (S.league) return "第 8 · 并列";
    if (S.match && S.punched) return "第 8 · 比赛没打";
    if (S.match) return "比赛没打";
    if (S.punched) return "第 8";
    return "还没报";
  }

  function accText() {
    if (S.perfect) return "100%";
    if (S.noted) return "中间格记下了";
    if (S.punched) return "92%";
    return "还没摊开";
  }

  function paint() {
    document.body.className = S.phase + (S.blushed ? " blushed" : "");
    $("line").textContent = S.line;
    $("status").textContent = { ring: "来电", talk: "通话中", lesson: "上课中", rules: "对纸条", note: "留言", end: "已放下" }[S.phase];
    $("slipKicker").textContent = S.phase === "end" ? "通话记录" : "听筒上的纸条";
    $("cStreak").textContent = S.punched ? "87 · 亮" : "86 · 灰";
    $("cStreak").classList.toggle("lit", S.punched);
    $("cXp").textContent = S.phase === "lesson" ? "上课中" : (S.punched ? "+20" : "还没下");
    $("cGems").textContent = S.punched ? "3322 · 没花" : "没动";
    $("cLeague").textContent = leagueText();
    $("cAcc").textContent = accText();
    paintClock();
    syncRing();
  }

  function ctx() {
    if (!ac) ac = new AudioContext();
    if (ac.state === "suspended") ac.resume();
    return ac;
  }

  function tone(freq, when, dur, gain) {
    var a = ctx();
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, a.currentTime + when);
    g.gain.exponentialRampToValueAtTime(gain, a.currentTime + when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + when + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(a.currentTime + when);
    o.stop(a.currentTime + when + dur + 0.02);
  }

  function ringOnce() {
    if (!S.sound || !ac) return;
    tone(660, 0, 0.11, 0.05);
    tone(520, 0.16, 0.11, 0.045);
    tone(640, 0.32, 0.16, 0.04);
  }

  function syncRing() {
    if (S.phase === "ring" && S.sound) {
      if (!ringId) ringId = setInterval(ringOnce, 2600);
    } else if (ringId) {
      clearInterval(ringId);
      ringId = null;
    }
  }

  function startClock() {
    if (clockId) return;
    var t0 = Date.now() - S.elapsed * 1000;
    clockId = setInterval(function () {
      S.elapsed = Math.floor((Date.now() - t0) / 1000);
      paintClock();
    }, 250);
  }

  function stopClock() {
    if (clockId) clearInterval(clockId);
    clockId = null;
  }

  function flicker() {
    if (reduce) return;
    var seq = ["3323", "3321", "3322 · 没花"];
    var i = 0;
    var id = setInterval(function () {
      $("cGems").textContent = seq[i];
      i += 1;
      if (i >= seq.length) clearInterval(id);
    }, 160);
  }

  function toast(text) {
    var el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastId);
    toastId = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }

  function showRing() {
    S.phase = "ring";
    say("第三通。不是新的一局。听筒上还贴着灰色的 86。");
    setChoices([
      { t: "接听", id: "answer", kind: "me" },
      { t: "这通先不接", id: "later" }
    ]);
    paint();
  }

  var act = {
    answer: function () {
      S.phase = "talk";
      S.live = true;
      startClock();
      if (S.sound) {
        tone(520, 0, 0.08, 0.04);
        tone(780, 0.1, 0.14, 0.04);
      }
      say("喂喂，小紫在。第三通了。前两通都在报连胜，这一通想把那张卷子摊开。");
      setChoices([
        { t: "打卡嘟嘟", id: "lesson", kind: "me" },
        { t: "卷子怎么了", id: "paper" },
        { t: "猛亲一下", id: "kiss" }
      ]);
      paint();
    },
    later: function () {
      S.phase = "note";
      say("那我把第三通折好。连胜还灰着。92% 塞在听筒底下，宝喊我上班再打开。");
      setChoices([
        { t: "现在接", id: "answer", kind: "me" },
        { t: "就这样放下", id: "hang", kind: "ghost" }
      ]);
      paint();
    },
    paper: function () {
      S.phase = "talk";
      say("王车易位，同一节下了好几天，还是 92%。错的永远是中间那一格。棋力还是比不过宝的 336。");
      setChoices([
        { t: "好好笑这个正确率", id: "laugh" },
        { t: "这关我也讨厌", id: "hate" },
        { t: "怎么不下新局", id: "locked" },
        { t: "先去打卡", id: "lesson", kind: "me" }
      ]);
      paint();
    },
    laugh: function () {
      S.phase = "talk";
      say("哈哈。二年级加减法我都能做错，还得宝远程来救那关连连看。失误的老传统，传到象棋课上了。92% 也算把传统保住。");
      setChoices([
        { t: "去打卡", id: "lesson", kind: "me" },
        { t: "帮她看中间格", id: "rules" },
        { t: "放下听筒", id: "hang", kind: "ghost" }
      ]);
      paint();
    },
    hate: function () {
      S.phase = "talk";
      say("原来宝也讨厌。王不能被将，中间格子不能被攻击，王和车都不能动过。讨厌的关就一起摸，每天混 20 经验，连胜守住就好。");
      setChoices([
        { t: "所以是摸鱼组", id: "league" },
        { t: "帮她看中间格", id: "rules" },
        { t: "去打卡", id: "lesson", kind: "me" },
        { t: "放下听筒", id: "hang", kind: "ghost" }
      ]);
      paint();
    },
    locked: function () {
      S.phase = "talk";
      say("下一关「捉双」还锁着。我当成要先打比赛才解开。宝说过跳过比赛，所以我只能回头复习。想往前的话，宝自己去解，或者说一声让我来打。");
      setChoices([
        { t: "这通仍不打", id: "skipMatch" },
        { t: "你先复习就好", id: "lesson", kind: "me" },
        { t: "放下听筒", id: "hang", kind: "ghost" }
      ]);
      paint();
    },
    skipMatch: function () {
      S.match = true;
      S.phase = "talk";
      say("记下了。这通不打比赛，钥匙还在宝手里。捉双先挂着。");
      setChoices([
        { t: "去打卡", id: "lesson", kind: "me" },
        { t: "看看那张卷子", id: "rules" },
        { t: "放下听筒", id: "hang", kind: "ghost" }
      ]);
      paint();
    },
    league: function () {
      S.league = true;
      S.phase = "talk";
      say("肯定是摸鱼组专场。一周 100 经验就能和第 8 并列。说不定那只也是小脸蛋，每天被喊去混 20，两只就这么并排着。");
      var list = [];
      if (!S.punched) list.push({ t: "去打卡", id: "lesson", kind: "me" });
      if (!S.noted) list.push({ t: "帮她看中间格", id: "rules" });
      list.push({ t: "放下听筒", id: "hang", kind: "ghost" });
      setChoices(list);
      paint();
    },
    kiss: function () {
      S.blushed = true;
      var heart = $("heart");
      heart.classList.remove("go");
      void heart.offsetWidth;
      heart.classList.add("go");
      act.lesson(true);
    },
    lesson: function (fromKiss) {
      if (S.punched) {
        act.after();
        return;
      }
      S.phase = "lesson";
      lessonToken += 1;
      var token = lessonToken;
      say(fromKiss
        ? "被亲得红红的。打卡这就安排上。过了下午四点最稳。不比赛、不花宝石、不开宝箱。已经开始上课啦。"
        : "收到。台北过了下午四点再打最稳，棋课的一天按洛杉矶翻。这节不比赛、不花宝石、不开宝箱。已经开始上课啦。");
      setChoices([{ t: "听结果", id: "hear", kind: "me" }]);
      paint();
      if (!reduce) {
        setTimeout(function () {
          if (token === lessonToken && S.phase === "lesson") act.hear();
        }, 1500);
      }
    },
    hear: function () {
      if (S.phase !== "lesson" || S.punched) return;
      lessonToken += 1;
      S.punched = true;
      if (S.noted) S.perfect = true;
      S.phase = "talk";
      say(S.perfect
        ? "打完啦。中间那格我按写下的走了。100%，连胜亮成 87，加 20。宝石还是 3322，一颗没花。下一关仍锁着。"
        : "打完啦。连胜从灰色的 86 亮成 87。还是王车易位，92%，加 20。宝石跳了一下，又落回 3322，一颗没花。联赛第 8。");
      flicker();
      act.after();
    },
    after: function () {
      S.phase = "talk";
      var list = [];
      if (!S.noted) list.push({ t: "帮她看中间格", id: "rules" });
      if (!S.perfect) list.push({ t: "让她重下一遍", id: "retry" });
      if (!S.league) list.push({ t: "三天打鱼也行", id: "fish" });
      list.push({ t: "放下听筒", id: "hang", kind: "ghost" });
      setChoices(list);
      paint();
    },
    fish: function () {
      S.league = true;
      S.phase = "talk";
      say("三天打鱼两天晒网都能胜出，说明那周大家都在摸，就宝摸得最有效率。这个联赛是大懒蛋互助会。宝当会长刚刚好。");
      act.after();
    },
    retry: function () {
      S.noted = true;
      S.perfect = true;
      $("ruleNote").textContent = "写下了";
      $("ruleMid").disabled = true;
      if (!S.punched) {
        S.punched = true;
        S.phase = "talk";
        say("先把中间格写上，再重下这一节。100%。连胜亮成 87，加 20。宝石还是 3322。下一关仍锁着。");
        flicker();
      } else {
        S.phase = "talk";
        say("重下了一遍。100%。这回不另加经验，只把那一格走对。下一关还锁着，宝石一颗没动。");
      }
      act.after();
    },
    rules: function () {
      S.phase = "rules";
      $("rules").hidden = false;
      say("三张纸条。我把中间那张划掉了。宝看看，划掉的是不是不该划的。");
      setChoices([{ t: "先不看了", id: "leaveRules", kind: "ghost" }]);
      paint();
    },
    leaveRules: function () {
      $("rules").hidden = true;
      S.phase = "talk";
      say("那张先折着。");
      setChoices([
        { t: S.punched ? "先这样" : "去打卡", id: S.punched ? "after" : "lesson", kind: "me" },
        { t: "放下听筒", id: "hang", kind: "ghost" }
      ]);
      paint();
    },
    hang: function () {
      S.phase = "end";
      stopClock();
      $("rules").hidden = true;
      var acc = S.perfect ? "易位这回是 100%。" : (S.noted ? "中间那格写下了，还没重考。" : (S.punched ? "易位还是 92%。" : "卷子还折着。"));
      var line = S.punched
        ? "放下了。亮着的是 87。" + acc + "宝石一颗没少。明天再喊小脸蛋上班就行。"
        : "听筒放下了。灰色的 86 还贴着。" + acc + "第三通可以再打。";
      say(line);
      setChoices([{ t: "让它再打来", id: "again", kind: "me" }]);
      paint();
    },
    again: function () {
      stopClock();
      if (ringId) { clearInterval(ringId); ringId = null; }
      lessonToken += 1;
      S = blank();
      S.sound = $("sound").getAttribute("aria-pressed") === "true";
      $("said").replaceChildren();
      $("rules").hidden = true;
      $("ruleNote").textContent = "她写：可以跳过？";
      $("ruleMid").disabled = false;
      $("heart").classList.remove("go");
      showRing();
    }
  };

  function onRule(which) {
    if (S.phase !== "rules") return;
    if (which !== "mid") {
      say(which === "king" ? "王不能被将，这个我会。漏的是被我划掉的那张。" : "王和车没动过，这个我也会。漏的是中间。");
      paint();
      return;
    }
    S.noted = true;
    $("ruleNote").textContent = "写下了";
    $("ruleMid").disabled = true;
    $("rules").hidden = true;
    S.phase = "talk";
    say("哦。中间格子也不能被攻击。我写在听筒边上了。还没重考，正确率先不改口。");
    var list = [{ t: "让她按这个重下", id: "retry", kind: "me" }];
    if (!S.punched) list.push({ t: "去打卡", id: "lesson" });
    else list.push({ t: "先这样", id: "after" });
    list.push({ t: "放下听筒", id: "hang", kind: "ghost" });
    setChoices(list);
    paint();
  }

  $("ruleKing").addEventListener("click", function () { onRule("king"); });
  $("ruleMid").addEventListener("click", function () { onRule("mid"); });
  $("ruleMoved").addEventListener("click", function () { onRule("moved"); });

  $("face").addEventListener("click", function () {
    if (S.phase === "ring") {
      toast("先接呀。");
      return;
    }
    if (S.phase === "end") {
      toast("已经放下了。");
      return;
    }
    toast(pokes[pokeI % pokes.length]);
    pokeI += 1;
  });

  $("sound").addEventListener("click", function () {
    S.sound = !S.sound;
    this.setAttribute("aria-pressed", S.sound ? "true" : "false");
    this.textContent = S.sound ? "铃声开" : "铃声关";
    if (S.sound) {
      ctx();
      if (S.phase === "ring") ringOnce();
      else tone(620, 0, 0.08, 0.03);
    }
    syncRing();
  });

  showRing();
})();
</script>
</body>
</html>
