        { t: 55.4, x: 292, y: 388 },
        { t: 56.2, x: 318, y: 400 },
        { t: 57.4, x: 300, y: 434 }
      ]));
    } else if (t < 77.4) {
      button.on = false;
    } else {
      button = Object.assign({ rot: -26, on: true }, move(t, [
        { t: 77.4, x: 268, y: 420 },
        { t: 78.6, x: 180, y: 360 }
      ]));
    }

    var splinter = { x: 18, y: 482, on: t < 39 };
    if (t >= 17.6 && t < 32.0) { splinter.x = 70; splinter.y = 446; }
    else if (t >= 32.0 && t < 36.8) { splinter.x = 28; splinter.y = 368; }
    else if (t >= 36.8 && t < 39) { splinter.x = 124; splinter.y = 360; }

    var glow = { on: false, color: "#FF309B", x: 24, y: 464 };
    if (t >= 8.8 && t < 13.4) glow = { on: true, color: "#FF309B", x: 24, y: 464 };
    else if (t >= 13.4 && t < 17.6) glow = { on: true, color: "#9159FE", x: 24, y: 464 };

    var threadOn = t >= 41.2 && t < 55.4;
    var stub = !threadOn && button.on && t < 55.4;

    var ring;
    if (t < 72.6) {
      var bob = 0;
      if (!reduce && t >= 64.2 && t < 68.2) {
        bob = Math.floor((t - 64.2) / 0.2) % 2 ? -6 : 0;
      }
      ring = { x: 332, y: 518 + bob, r: 8 };
    } else if (t < 77.4) {
      ring = Object.assign({ r: 8 }, move(t, [
        { t: 72.6, x: 332, y: 530 },
        { t: 74.2, x: 292, y: 528 },
        { t: 76.2, x: 196, y: 500 },
        { t: 77.4, x: 200, y: 430 }
      ]));
    } else {
      ring = Object.assign({ r: t >= 78.6 ? 18 : 8 }, move(t, [
        { t: 77.4, x: 210, y: 430 },
        { t: 78.6, x: 180, y: 360 }
      ]));
    }

    var lift = 0;
    if (t >= 27.2 && t < 29.2) lift = -36;
    else if (t >= 29.2 && t < 36.8) lift = -82;
    else if (t >= 36.8 && t < 38.4) lift = -36;

    var eyes = "bar";
    if (t >= 82.4) eyes = "smile";
    else if (t >= 27.2 && t < 36.8) eyes = "squint";
    else if (blinkAt(t, 0.4)) eyes = "shut";

    var foxExpr = "open";
    if (blinkAt(t, 1.2)) foxExpr = "blink";
    else if (t >= 57.2) foxExpr = "happy";

    var catExpr = "open";
    if (blinkAt(t, 2.1)) catExpr = "blink";
    else if (t >= 74.0) catExpr = "happy";

    var line = 0;
    for (var i = 0; i < LINES.length; i++) if (t >= LINES[i].t - 0.001) line = i;

    return {
      line: line,
      text: LINES[line].text,
      black: black,
      pink: pink,
      purple: purple,
      blackBlink: blinkAt(t, 0.8),
      pinkBlink: blinkAt(t, 1.7),
      purpleBlink: blinkAt(t, 2.6),
      clawd: clawd,
      lift: lift,
      eyes: eyes,
      fox: fox,
      foxTail: foxTail(t),
      foxExpr: foxExpr,
      cat: cat,
      catTail: catTail(t),
      catExpr: catExpr,
      blush: t >= 82.4,
      button: button,
      splinter: splinter,
      glow: glow,
      threadOn: threadOn,
      stub: stub,
      ring: ring,
      curtain: curtainAmt(t),
      socketHot: t >= 44.4 && t < 56.2
    };
  }

  function eyeCells(kind, x, y, dir) {
    if (kind === "blink") return [[[x, y + 1], [x + 1, y + 1]], "L"];
    if (kind === "happy") return [[[x - 1, y + 1], [x, y], [x + 1, y], [x + 2, y + 1]], "L"];
    if (kind === "glance") return [[[x + dir, y], [x + 1 + dir, y], [x + dir, y + 1], [x + 1 + dir, y + 1]], "E"];
    return [[], "E"];
  }

  var cache = {};
  function animalHTML(spec, tail, expr, blush) {
    var key = tail + "|" + expr + "|" + (blush ? "1" : "0");
    if (!cache[spec.base[0]]) cache[spec.base[0]] = {};
    var box = cache[spec.base[0]];
    if (box[key]) return box[key];
    var rows = spec[tail] || spec.base;
    var grid = rows.map(function (row) { return row.split(""); });
    var H = grid.length;
    var W = grid[0].length;
    if (expr && expr !== "open") {
      for (var e = 0; e < spec.eyes.length; e++) {
        var ex = spec.eyes[e][0], ey = spec.eyes[e][1];
        for (var dy = 0; dy < 2; dy++) {
          for (var dx = 0; dx < 2; dx++) {
            var xx = ex + dx, yy = ey + dy;
            if (yy >= 0 && yy < H && xx >= 0 && xx < grid[yy].length) grid[yy][xx] = "M";
          }
        }
        var pack = eyeCells(expr, ex, ey, spec.dir);
        var cells = pack[0], ch = pack[1];
        for (var c = 0; c < cells.length; c++) {
          var cx = cells[c][0], cy = cells[c][1];
          if (cy >= 0 && cy < H && cx >= 0 && cx < W) grid[cy][cx] = ch;
        }
      }
    }
    var html = "";
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < grid[y].length; x++) {
        var ch = grid[y][x];
        if (ch === "." || !spec.pal[ch]) continue;
        html += '<rect x="' + (x * CELL) + '" y="' + (y * CELL) + '" width="' + CELL + '" height="' + CELL + '" fill="' + spec.pal[ch] + '"/>';
      }
    }
    if (blush) {
      for (var b = 0; b < spec.blush.length; b++) {
        html += '<rect x="' + (spec.blush[b][0] * CELL) + '" y="' + (spec.blush[b][1] * CELL) + '" width="' + CELL + '" height="' + CELL + '" fill="' + spec.pal.B + '"/>';
      }
    }
    box[key] = html;
    return html;
  }

  function setSlit(id, cx, cy, e, blink) {
    var w = e.w * R;
    var len = e.len * R;
    if (blink) len = Math.max(w * 0.9, len * 0.2);
    var x = cx + e.dx * R;
    var y = cy + e.dy * R;
    var el = document.getElementById(id);
    el.setAttribute("x", (x - w / 2).toFixed(2));
    el.setAttribute("y", (y - len / 2).toFixed(2));
    el.setAttribute("width", w.toFixed(2));
    el.setAttribute("height", len.toFixed(2));
    el.setAttribute("rx", (w / 2).toFixed(2));
    el.setAttribute("transform", "rotate(" + (-e.ang).toFixed(1) + " " + x.toFixed(2) + " " + y.toFixed(2) + ")");
  }

  function placeFace(name, cx, cy, blink) {
    var circle = document.getElementById(name);
    var maskC = document.getElementById("m" + name.charAt(0).toUpperCase() + name.slice(1) + "C");
    circle.setAttribute("cx", cx);
    circle.setAttribute("cy", cy);
    maskC.setAttribute("cx", cx);
    maskC.setAttribute("cy", cy);
    var prefix = "m" + name.charAt(0).toUpperCase() + name.slice(1);
    setSlit(prefix + "L", cx, cy, EYE.L, blink);
    setSlit(prefix + "R", cx, cy, EYE.R, blink);
  }

  var foxEl = document.getElementById("fox");
  var catEl = document.getElementById("cat");
  var foxSig = "", catSig = "";
  var cap = document.getElementById("cap");
  var buttons = [];
  var shown = -1;

  function render(p) {
    placeFace("pink", p.pink.x, p.pink.y, p.pinkBlink);
    placeFace("purple", p.purple.x, p.purple.y, p.purpleBlink);
    placeFace("black", p.black.x, p.black.y, p.blackBlink);

    document.getElementById("clawd").setAttribute("transform", "translate(" + p.clawd.x + " " + p.clawd.y + ") scale(0.5)");
    document.getElementById("clawLift").setAttribute("transform", "translate(0 " + p.lift + ")");
    ["bar", "shut", "squint", "smile"].forEach(function (name) {
      document.getElementById("eyes-" + name).style.display = name === p.eyes ? "" : "none";
    });

    var fs = p.foxTail + p.foxExpr + (p.blush ? "1" : "0");
    if (fs !== foxSig) {
      foxSig = fs;
      foxEl.innerHTML = animalHTML(FOX, p.foxTail, p.foxExpr, p.blush);
    }
    foxEl.setAttribute("transform", "translate(" + p.fox.x + " " + p.fox.y + ")");
    var cs = p.catTail + p.catExpr + (p.blush ? "1" : "0");
    if (cs !== catSig) {
      catSig = cs;
      catEl.innerHTML = animalHTML(CAT, p.catTail, p.catExpr, p.blush);
    }
    catEl.setAttribute("transform", "translate(" + p.cat.x + " " + p.cat.y + ")");

    var btn = document.getElementById("button");
    btn.setAttribute("transform", "translate(" + p.button.x + " " + p.button.y + ") rotate(" + p.button.rot + ")");
    btn.style.display = p.button.on ? "" : "none";
    if (!btn.dataset.built) {
      btn.dataset.built = "1";
      btn.innerHTML =
        '<circle r="12" fill="#fff8ee"/>' +
        '<rect x="-3.2" y="-7.6" width="3.6" height="7.4" rx="1.8" fill="#2c241c"/>' +
        '<rect x="1.3" y="-7.6" width="2.3" height="7.4" rx="1.15" fill="#2c241c"/>';
    }

    var thread = document.getElementById("thread");
    if (p.threadOn) {
      thread.style.display = "";
      thread.setAttribute("x1", p.pink.x + 14);
      thread.setAttribute("y1", p.pink.y - 4);
      thread.setAttribute("x2", p.button.x - 12);
      thread.setAttribute("y2", p.button.y + 2);
    } else if (p.stub) {
      thread.style.display = "";
      thread.setAttribute("x1", p.button.x + 6);
      thread.setAttribute("y1", p.button.y - 2);
      thread.setAttribute("x2", p.button.x + 16);
      thread.setAttribute("y2", p.button.y - 8);
    } else {
      thread.style.display = "none";
    }

    var sp = document.getElementById("splinter");
    sp.style.display = p.splinter.on ? "" : "none";
    sp.setAttribute("transform", "translate(" + p.splinter.x + " " + p.splinter.y + ") rotate(-18)");

    var glow = document.getElementById("glow");
    glow.setAttribute("fill", p.glow.color);
    glow.setAttribute("opacity", p.glow.on ? "0.55" : "0");

    var socket = document.getElementById("socket");
    socket.setAttribute("opacity", p.socketHot ? "1" : "0");
    socket.setAttribute("stroke-width", p.socketHot ? "4" : "3");

    var ring = document.getElementById("ring");
    ring.setAttribute("transform", "translate(" + p.ring.x + " " + p.ring.y + ")");
    ring.querySelector("circle").setAttribute("r", p.ring.r);

    var w = 100 + Math.round(p.curtain * 56);
    var curL = document.getElementById("curL");
    var curR = document.getElementById("curR");
    curL.setAttribute("width", w);
    curR.setAttribute("width", w);
    curR.setAttribute("x", 330 - w);
    document.getElementById("curLf").setAttribute("x", 30 + Math.min(18, w - 20));
    document.getElementById("curRf").setAttribute("x", 330 - w + Math.max(8, w - 28));

    if (p.line !== shown) {
      shown = p.line;
      cap.textContent = p.text;
      for (var i = 0; i < buttons.length; i++) {
        if (i === p.line) buttons[i].setAttribute("aria-current", "true");
        else buttons[i].removeAttribute("aria-current");
      }
    }
  }

  var book = document.getElementById("book");
  LINES.forEach(function (line, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = line.text;
    b.addEventListener("click", function () { jump(line.t); });
    li.appendChild(b);
    book.appendChild(li);
    buttons.push(b);
  });

  var elapsed = 0;
  var playing = true;
  var raf = 0;
  var last = 0;
  var playBtn = document.getElementById("btnPlay");

  function label() {
    if (elapsed >= END - 0.05) playBtn.textContent = "再看一遍";
    else playBtn.textContent = playing ? "暂停" : "继续";
  }

  function frame(now) {
    raf = 0;
    if (!playing) return;
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;
    elapsed += dt;
    if (elapsed >= END) {
      elapsed = END;
      playing = false;
      render(pose(elapsed));
      label();
      return;
    }
    render(pose(elapsed));
    raf = requestAnimationFrame(frame);
  }

  function start() {
    last = 0;
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function jump(t) {
    elapsed = t;
    if (elapsed >= END) {
      elapsed = END;
      playing = false;
    }
    render(pose(elapsed));
    label();
    document.getElementById("stage").scrollIntoView({ block: "start" });
    if (playing) start();
  }

  playBtn.addEventListener("click", function () {
    if (elapsed >= END - 0.05) {
      elapsed = 0;
      playing = true;
      render(pose(0));
      label();
      start();
      return;
    }
    playing = !playing;
    label();
    if (playing) start();
  });
  document.getElementById("btnReplay").addEventListener("click", function () {
    elapsed = 0;
    playing = true;
    render(pose(0));
    label();
    start();
    document.getElementById("stage").scrollIntoView({ block: "start" });
  });
  document.getElementById("stage").addEventListener("click", function () {
    playBtn.click();
  });

  render(pose(0));
  label();
  start();
})();
</script>
</body>
</html>
