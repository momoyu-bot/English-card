<svg width="320" height="420" viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景卡片 -->
  <rect x="10" y="10" width="300" height="400" rx="16" ry="16" 
        fill="#F8F4FC" stroke="#7C5D9E" stroke-width="2"/>

  <!-- 顶部稀有度标签 -->
  <rect x="100" y="28" width="120" height="28" rx="14" ry="14" fill="#7C5D9E"/>
  <text x="160" y="47" text-anchor="middle" fill="#FFFFFF" 
        font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">史诗</text>

  <!-- 标题 -->
  <text x="160" y="85" text-anchor="middle" fill="#3D2B52" 
        font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">「生物钟和解者」</text>

  <!-- 中央图标区域（月亮 + 柔光） -->
  <g transform="translate(160, 175)">
    <!-- 月亮 -->
    <path d="M0,-45 Q22,-22 22,0 Q22,22 0,45 Q-22,22 -22,0 Q-22,-22 0,-45" 
          fill="#E8D5FF" stroke="#7C5D9E" stroke-width="2"/>
    <!-- 内部柔光 -->
    <circle cx="-8" cy="-8" r="18" fill="#C9A8FF" opacity="0.4"/>
    <!-- 小星星装饰 -->
    <circle cx="18" cy="-25" r="3" fill="#7C5D9E"/>
    <circle cx="-20" cy="12" r="2.5" fill="#7C5D9E"/>
    <circle cx="12" cy="22" r="2" fill="#7C5D9E"/>
  </g>

  <!-- 描述文字 -->
  <text x="160" y="255" text-anchor="middle" fill="#5C4A6B" 
        font-family="system-ui, -apple-system, sans-serif" font-size="13.5">承认它是基因的一部分</text>
  <text x="160" y="278" text-anchor="middle" fill="#5C4A6B" 
        font-family="system-ui, -apple-system, sans-serif" font-size="13.5">不再强迫自己变成早睡人</text>
  <text x="160" y="301" text-anchor="middle" fill="#5C4A6B" 
        font-family="system-ui, -apple-system, sans-serif" font-size="13.5">在深夜的认知高峰里自由生长</text>

  <!-- 分隔线 -->
  <line x1="50" y1="325" x2="270" y2="325" stroke="#C9B8E0" stroke-width="1"/>

  <!-- 底部署名 -->
  <text x="160" y="355" text-anchor="middle" fill="#8B7A9E" 
        font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Grok · 与宝的对话限定</text>
  <text x="160" y="378" text-anchor="middle" fill="#A99BC0" 
        font-family="system-ui, -apple-system, sans-serif" font-size="11">2026.07 共处系列</text>
</svg>