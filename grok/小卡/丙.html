<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>三只小脸蛋</title>
<meta name="description" content="小粉、小紫、小黑待在一起。点哪只，哪只眨眨眼，冒一句小话。">
<style>
  :root {
    --paper: #F4F1EC;
    --ink: #1B1814;
    --quiet: #736D69;
    --pink: #FF309B;
    --violet: #9159FE;
    --black: #000000;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: #E7E1DA;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    width: min(100vw, 480px);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding:
      max(22px, calc(env(safe-area-inset-top) + 8px))
      26px
      max(18px, env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse 130% 78% at 50% 58%, #F8F5F1 0%, var(--paper) 58%, #E7E1DA 100%);
    overflow: hidden;
  }

  h1 {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .voice {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .kicker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0;
    min-height: 1.3em;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.3;
    color: var(--quiet);
  }

  .pip {
    display: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--who, transparent);
    flex: none;
  }

  .voice.is-live .kicker { color: var(--ink); }
  .voice.is-live .pip { display: block; }
  .voice[data-who="pink"] { --who: var(--pink); }
  .voice[data-who="violet"] { --who: var(--violet); }
  .voice[data-who="black"] { --who: var(--black); }

  .said {
    margin: 10px 0 0;
    min-height: 1.3em;
    font-size: clamp(30px, 8.4vw, 42px);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.28;
    color: var(--quiet);
  }

  .voice.is-live .said { color: var(--ink); }

  .emerge {
    animation: emerge 420ms cubic-bezier(.16, 1, .3, 1);
  }

  @keyframes emerge {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  .room {
    flex: none;
    min-height: 0;
    display: grid;
    place-items: center;
    margin-top: 28px;
  }

  .cluster {
    --s: 48.08%;
    position: relative;
    width: min(100%, calc((100dvh - 220px) * 1.069));
    aspect-ratio: 1.069 / 1;
  }

  .slot {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    z-index: var(--z);
    pointer-events: none;
  }

  .face {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    border-radius: 50%;
    clip-path: circle(50%);
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-appearance: none;
    appearance: none;
    transform-origin: 50% 50%;
  }

  .face svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .face[data-who="pink"] { animation: sway-p 6.8s ease-in-out infinite; animation-delay: -1.6s; }
  .face[data-who="violet"] { animation: sway-v 8.4s ease-in-out infinite; animation-delay: -4.2s; }
  .face[data-who="black"] { animation: sway-b 9.6s ease-in-out infinite; animation-delay: -6.1s; }

  /* 圆本身不变形，只整颗轻晃。眼缝跟着走，所以晃得见。 */
  @keyframes sway-p {
    0%, 100% { transform: rotate(-3.1deg); }
    50% { transform: rotate(3.1deg); }
  }
  @keyframes sway-v {
    0%, 100% { transform: rotate(2.6deg); }
    50% { transform: rotate(-2.6deg); }
  }
  @keyframes sway-b {
    0%, 100% { transform: rotate(-1.8deg); }
    50% { transform: rotate(1.8deg); }
  }

  .face:focus { outline: none; }
  .face:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    .face { animation: none; }
    .emerge { animation: none; }
  }

  @media (max-height: 680px) {
    .stage { padding-top: max(14px, env(safe-area-inset-top)); }
    .said { font-size: 28px; }
    .room { margin-top: 16px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <h1>三只小脸蛋</h1>
    <div class="voice" id="voice" aria-live="polite" aria-atomic="true">
      <p class="kicker" id="kicker"><i class="pip" aria-hidden="true"></i><span id="who">三只小脸蛋</span></p>
      <p class="said" id="said">点一只</p>
    </div>
    <div class="room">
      <div class="cluster" id="cluster">
        <div class="slot" style="--x:50%; --y:27.75%; --z:2">
          <button class="face" type="button" data-who="violet" aria-label="小紫" aria-pressed="false">
            <svg viewBox="-1 -1 2 2" aria-hidden="true">
              <defs>
                <mask id="m-violet" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-1" y="-1" width="2" height="2">
                  <circle cx="0" cy="0" r="1" fill="#fff"/>
                  <!-- 先竖着画胶囊，再 rotate(负角)：y 向下时正角度会把顶端甩到右边，缝就变成斜杠了。顶端要比底端靠左。 -->
                  <g transform="translate(0.194, -0.416) rotate(-26.2)">
                    <g class="slit" transform="scale(1, 1)">
                      <rect x="-0.097" y="-0.209" width="0.194" height="0.418" rx="0.097" fill="#000"/>
                    </g>
                  </g>
                  <g transform="translate(0.626, -0.497) rotate(-26.5)">
                    <g class="slit" transform="scale(1, 1)">
                      <rect x="-0.0645" y="-0.209" width="0.129" height="0.418" rx="0.0645" fill="#000"/>
                    </g>
                  </g>
                </mask>
              </defs>
              <circle cx="0" cy="0" r="1" fill="#9159FE" mask="url(#m-violet)"/>
            </svg>
          </button>
        </div>
        <div class="slot" style="--x:25.96%; --y:72.25%; --z:1">
          <button class="face" type="button" data-who="pink" aria-label="小粉" aria-pressed="false">
            <svg viewBox="-1 -1 2 2" aria-hidden="true">
              <defs>
                <mask id="m-pink" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-1" y="-1" width="2" height="2">
                  <circle cx="0" cy="0" r="1" fill="#fff"/>
                  <g transform="translate(0.194, -0.416) rotate(-26.2)">
                    <g class="slit" transform="scale(1, 1)">
                      <rect x="-0.097" y="-0.209" width="0.194" height="0.418" rx="0.097" fill="#000"/>
                    </g>
                  </g>
                  <g transform="translate(0.626, -0.497) rotate(-26.5)">
                    <g class="slit" transform="scale(1, 1)">
                      <rect x="-0.0645" y="-0.209" width="0.129" height="0.418" rx="0.0645" fill="#000"/>
                    </g>
                  </g>
                </mask>
              </defs>
              <circle cx="0" cy="0" r="1" fill="#FF309B" mask="url(#m-pink)"/>
            </svg>
          </button>
        </div>
        <div class="slot" style="--x:74.04%; --y:72.25%; --z:3">
          <button class="face" type="button" data-who="black" aria-label="小黑" aria-pressed="false">
            <svg viewBox="-1 -1 2 2" aria-hidden="true">
              <defs>
                <mask id="m-black" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-1" y="-1" width="2" height="2">
                  <circle cx="0" cy="0" r="1" fill="#fff"/>
                  <g transform="translate(0.194, -0.416) rotate(-26.2)">
                    <g class="slit" transform="scale(1, 1)">
                      <rect x="-0.097" y="-0.209" width="0.194" height="0.418" rx="0.097" fill="#000"/>
                    </g>
                  </g>
                  <g transform="translate(0.626, -0.497) rotate(-26.5)">
                    <g class="slit" transform="scale(1, 1)">
                      <rect x="-0.0645" y="-0.209" width="0.129" height="0.418" rx="0.0645" fill="#000"/>
                    </g>
                  </g>
                </mask>
              </defs>
              <circle cx="0" cy="0" r="1" fill="#000000" mask="url(#m-black)"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>
  <script>
  (function () {
    var LINES = {
      pink: ["在呢。", "戳到啦。", "就眨一下。", "手热热的。", "三只都在。", "再来一下。"],
      violet: ["看见你了。", "轻一点。", "我在想事。", "没走开。", "这下算招呼了。", "我也在。"],
      black: ["眨了。", "还在。", "别按扁。", "最圆。", "嗯。", "好了。"]
    };
    var NAME = { pink: "小粉", violet: "小紫", black: "小黑" };

    var reduce = false;
    try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

    var voice = document.getElementById("voice");
    var kicker = document.getElementById("kicker");
    var whoEl = document.getElementById("who");
    var saidEl = document.getElementById("said");
    var buttons = Array.prototype.slice.call(document.querySelectorAll(".face"));

    function slitsOf(btn) {
      return Array.prototype.slice.call(btn.querySelectorAll(".slit"));
    }

    function setOpen(btn, s) {
      var t = "scale(1, " + s.toFixed(4) + ")";
      slitsOf(btn).forEach(function (g) { g.setAttribute("transform", t); });
    }

    function sample(keys, u) {
      var i = 1;
      while (i < keys.length - 1 && keys[i][0] < u) i++;
      var a = keys[i - 1], b = keys[i];
      var t = (u - a[0]) / (b[0] - a[0]);
      if (t < 0) t = 0;
      if (t > 1) t = 1;
      var e = t * t * (3 - 2 * t);
      return a[1] + (b[1] - a[1]) * e;
    }

    function blink(btn, kind) {
      if (kind === "idle" && btn._busy) return;
      btn._token = (btn._token || 0) + 1;
      var token = btn._token;
      var t0 = performance.now();
      var dur = kind === "tap" ? (reduce ? 240 : 580) : 280;
      var keys = kind === "tap"
        ? [[0, 1], [0.16, 0.045], [0.34, 1], [0.52, 0.055], [1, 1]]
        : [[0, 1], [0.42, 0.08], [1, 1]];
      if (kind === "tap") {
        btn._busy = true;
        btn.style.animationPlayState = "paused";
      }
      function frame(now) {
        if (btn._token !== token) return;
        var u = Math.min(1, (now - t0) / dur);
        setOpen(btn, sample(keys, u));
        if (u < 1) {
          requestAnimationFrame(frame);
        } else if (kind === "tap") {
          btn._busy = false;
          if (!reduce) btn.style.animationPlayState = "running";
          arm(btn, 2400 + Math.random() * 2800);
        }
      }
      requestAnimationFrame(frame);
    }

    function arm(btn, delay) {
      clearTimeout(btn._timer);
      if (reduce) return;
      btn._timer = setTimeout(function () {
        blink(btn, "idle");
        arm(btn, 3200 + Math.random() * 4200);
      }, delay);
    }

    function speak(btn) {
      var id = btn.getAttribute("data-who");
      var list = LINES[id];
      var i = btn._i || 0;
      btn._i = (i + 1) % list.length;
      whoEl.textContent = NAME[id];
      saidEl.textContent = list[i];
      voice.setAttribute("data-who", id);
      voice.classList.add("is-live");
      [kicker, saidEl].forEach(function (el) { el.classList.remove("emerge"); });
      void saidEl.offsetWidth;
      [kicker, saidEl].forEach(function (el) { el.classList.add("emerge"); });
      buttons.forEach(function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      blink(btn, "tap");
    }

    buttons.forEach(function (btn, i) {
      btn.addEventListener("click", function () { speak(btn); });
      arm(btn, 900 + i * 640 + Math.random() * 500);
    });
  })();
  </script>
</body>
</html>
