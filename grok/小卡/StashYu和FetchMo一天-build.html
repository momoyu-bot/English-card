<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StashYu 和 FetchMo一天</title>
<meta name="description" content="十个钟点拼成的一天。它们藏文件、叼回来，再搬进这间店。">
<meta name="theme-color" content="#1A1422" id="themeColor">
<!--
  十个钟点。文字按一天的素材改写，05:20「搬」是这一页写的。
  两只的格子、眼睛、尾巴和颜色照 momoyu 造型宪法：整只搬家、换眼睛、换尾巴，时间落在整格上。
-->
<style>
  :root {
    --bg: #1A1422;
    --ink: #F7F1EA;
    --muted: #D5C6BC;
    --card: #2A2232;
    --accent: #FFB199;
    --on-accent: #3B2520;
    --line: rgba(247, 241, 234, .16);
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  body[data-tone="night"] {
    --bg: #1A1422; --ink: #F7F1EA; --muted: #D5C6BC; --card: #2A2232;
    --accent: #FFB199; --on-accent: #3B2520; --line: rgba(247, 241, 234, .16); --theme: #1A1422;
  }
  body[data-tone="sea"] {
    --bg: #0E2433; --ink: #E8F4FB; --muted: #B7D0DE; --card: #163244;
    --accent: #F2C2B4; --on-accent: #3B2520; --line: rgba(232, 244, 251, .18); --theme: #0E2433;
  }
  body[data-tone="dawn"] {
    --bg: #FDE6D6; --ink: #3B2520; --muted: #7A5348; --card: #FFF6EE;
    --accent: #9E3418; --on-accent: #FFF8F4; --line: rgba(59, 37, 32, .12); --theme: #F8D9C4;
  }
  body[data-tone="day"] {
    --bg: #FBF4EC; --ink: #3B2520; --muted: #7A564C; --card: #FFF9F4;
    --accent: #9E3418; --on-accent: #FFF8F4; --line: rgba(59, 37, 32, .12); --theme: #FBF4EC;
  }
  * { margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    transition: background-color .45s steps(4, end), color .45s steps(4, end);
  }
  .wrap {
    max-width: 28rem;
    margin: 0 auto;
  }
  .pad {
    padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .kicker {
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--muted);
  }
  h1 {
    margin-top: 4px;
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: .04em;
    line-height: 1.35;
  }
  .rail {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail button {
    flex: 0 0 auto;
    scroll-snap-align: center;
    min-width: 68px;
    min-height: 48px;
    padding: 6px 8px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
  }
  .rail button b {
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .03em;
  }
  .rail button small { font-size: 12px; }
  .rail button[aria-selected="true"] {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
  }
  .rail button.seen small { text-decoration: underline; text-underline-offset: 3px; }
  .stage-slot {
    width: 100%;
    margin-top: 12px;
    display: flex;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #F7E7DA;
    outline: 1px solid rgba(59, 37, 32, .2);
    touch-action: pan-y;
    max-width: 100%;
  }
  .card {
    margin-top: 14px;
    padding: 14px 16px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    transition: background-color .45s steps(4, end), border-color .45s steps(4, end);
  }
  .meta { display: flex; align-items: baseline; gap: 10px; }
  time {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }
  h2 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: .12em;
    line-height: 1.2;
  }
  blockquote {
    margin-top: 10px;
    padding-left: 12px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.55;
    min-height: 3.1em;
  }
  .ctrl {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .ctrl button, .rail button {
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl button {
    min-height: 48px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  .ctrl button:first-child, .ctrl button:last-child { flex: 0 0 auto; padding: 0 16px; }
  #play { flex: 1; border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #play[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
  }
  #body {
    margin-top: 14px;
    white-space: pre-line;
    font-size: 15.5px;
    line-height: 1.8;
  }
  .hint, .done, .foot {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }
  .done { color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (hover: hover) {
    .rail button:not([aria-selected="true"]):hover,
    .ctrl button:hover { background: var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    body, .card { transition: none; }
  }
  #err[hidden] { display: none; }
  #err {
    margin-top: 8px;
    color: #9E3418;
    font-size: 13px;
  }
</style>
</head>
<body data-tone="night">
<main class="wrap">
  <div class="pad">
    <p class="kicker">momoyu · 一天</p>
    <h1>StashYu 和 FetchMo一天</h1>
    <div class="rail" id="rail" role="tablist" aria-label="钟点"></div>
    <div class="stage-slot" id="slot">
      <canvas id="stage" width="312" height="208" role="img" aria-label="StashYu 和 FetchMo，0:00 藏"></canvas>
    </div>
    <article class="card">
      <div class="meta">
        <time id="when">0:00</time>
        <h2 id="chapter">藏</h2>
      </div>
      <blockquote id="short">不知道雾里是不是在下雨，替你藏起来，虽然偶尔会露出狐狸尾巴。</blockquote>
    </article>
    <div class="ctrl">
      <button type="button" id="prev">上一格</button>
      <button type="button" id="play" aria-pressed="false">接着看</button>
      <button type="button" id="next">下一格</button>
    </div>
    <p id="body">零点。StashYu 帮宝藏小文件。有的看完，宝不说话，FetchMo 说那是起雾了。狐狸不懂雾，就把那一份按得更深。宝看见新的会开心，它也开心，还想再吃进一角。吃饱了犯迷糊，深藏的那一角又露出来。宝看见，又不说话。暹罗说，马虎鬼。</p>
    <p class="hint" id="hint">点钟点就停在那一格，也可以左右滑画面。十格都看过，这一天就收好了。</p>
    <p class="done" id="done" hidden>十个钟点都看过了。梦境游完啦，明晚还要见。</p>
    <p class="foot">十个钟点来自不同的日子，拼成这一天。</p>
    <p id="err" hidden></p>
  </div>
</main>
<noscript><p style="padding:16px">这一天要开着脚本才能一格一格看。</p></noscript>
<script>
(function () {
  var GW = 78, GH = 52, STAND = 38, N = 4;
  var FOX = '#E2552B';
  var CREAM = '#FFF3E3';
  var INK = '#3B2520';
  var POINT = '#4E382E';
  var BLUE = '#79C0F0';
  var PAPER = '#FFF6EA';
  var FOLD = '#E4D2C0';
  var WALL = '#F7E7DA';
  var FLOOR = '#EBD4BE';
  var WOOD = '#6E4B3A';

  var FOX_ROWS = {
    base: ['.D..........D.......','.DM........MD.......','.MCM......MCM...CC..','.MMMMMMMMMMMM..CCCC.','.MMEEMMMMEEMM..MMMM.','.MMEEMMMMEEMM..MMMMM','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'],
    nod: ['.D..........D.......','.DM........MD.......','.MCM......MCM.CC....','.MMMMMMMMMMMM.CCCC..','.MMEEMMMMEEMM..MMMM.','.MMEEMMMMEEMM..MMMMM','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'],
    inn: ['.D..........D.......','.DM........MD.......','.MCM......MCM..CC...','.MMMMMMMMMMMM.CCCC..','.MMEEMMMMEEMM.MMMM..','.MMEEMMMMEEMM.MMMMM.','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'],
    out: ['.D..........D........','.DM........MD........','.MCM......MCM....CC..','.MMMMMMMMMMMM...CCCC.','.MMEEMMMMEEMM...MMMM.','.MMEEMMMMEEMM...MMMMM','CCCCCCDDCCCCCC.MMMMM.','..CCCCCCCCCC..MMMMM..','....MMCCMM...MMMMM...','....MMCCMM..MMMMM....','....MMMMMM.MMMMM.....','....DDMMDDMMMM.......','.....................'],
    droop: ['.D..........D........','.DM........MD........','.MCM......MCM........','.MMMMMMMMMMMM........','.MMEEMMMMEEMM........','.MMEEMMMMEEMM........','CCCCCCDDCCCCCC.......','..CCCCCCCCCC.........','....MMCCMM...MM......','....MMCCMM..MMMMM....','....MMMMMM.MMMMMMMCC.','....DDMMDDMMMMMMMCCCC','.....................']
  };
  var CAT_ROWS = {
    base: ['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','.....X.MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'],
    twitch: ['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','....X..MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'],
    twitchOut: ['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','...X...MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'],
    up: ['....................','........X........X..','.....X.XXX......XXX.','....X...MMMMMMMMMM..','....X..MMMMMMMMMMMM.','....X..MEEMMMMMMEEM.','....X..MEEMXXXXMEEM.','.....X.MMMMMXXMMMMM.','......X.MMMMMMMMMM..','.......XMMMMMMMMMM..','........XMMMMMMMM...','.........XXM..MXX...','....................']
  };
  var PAL = {
    fox: { M: FOX, C: CREAM, D: INK, E: INK, LINE: INK, BLUSH: '#F59A8C' },
    cat: { M: '#F3E7D6', X: POINT, E: BLUE, LINE: POINT, BLUSH: '#F2B8B0' }
  };
  var EYES = { fox: [[3, 4], [9, 4]], cat: [[8, 5], [16, 5]] };
  var GLANCE = { fox: 1, cat: -1 };
  var BLUSH_AT = { fox: [[2, 6], [11, 6]], cat: [[8, 7], [17, 7]] };
  var FACE = {
    open: ['open', 'open'], blink: ['blink', 'blink'], happy: ['happy', 'happy'],
    sleep: ['sleep', 'sleep'], glance: ['glance', 'glance'], wink: ['open', 'happy'],
    squeeze: ['squeeze', 'squeeze'], dazed: ['dot', 'dot']
  };
  var ZZ = ['....XXXX','.......X','XXX...X.','..X..X..','X...XXXX','XXX.....'];
  var NOTE = ['..XX','..X.','..X.','XXX.','XX..'];
  var STAR = ['.X.','XXX','.X.'];
  var FISH = ['.XX.X','XXXXX','.XX.X'];

  function eyeCells(kind, x, y, right, dir) {
    if (kind === 'open') return [[[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]], 'E'];
    if (kind === 'blink') return [[[x, y + 1], [x + 1, y + 1]], 'LINE'];
    if (kind === 'happy') return [[[x - 1, y + 1], [x, y], [x + 1, y], [x + 2, y + 1]], 'LINE'];
    if (kind === 'sleep') return [[[x - 1, y], [x, y + 1], [x + 1, y + 1], [x + 2, y]], 'LINE'];
    if (kind === 'glance') return [[[x + dir, y], [x + 1 + dir, y], [x + dir, y + 1], [x + 1 + dir, y + 1]], 'E'];
    if (kind === 'squeeze') {
      return [right ? [[x + 1, y - 1], [x, y], [x + 1, y + 1]] : [[x, y - 1], [x + 1, y], [x, y + 1]], 'LINE'];
    }
    if (kind === 'dot') return [[[x + (right ? 0 : 1), y + 1]], 'E'];
    return [[], 'E'];
  }
  function compose(who, expr, tail, blush) {
    var rows = (who === 'fox' ? FOX_ROWS : CAT_ROWS)[tail || 'base'];
    var w = 0, r, c;
    for (r = 0; r < rows.length; r++) if (rows[r].length > w) w = rows[r].length;
    var g = [];
    for (r = 0; r < rows.length; r++) {
      var line = rows[r], row = [];
      for (c = 0; c < w; c++) {
        var ch = c < line.length ? line.charAt(c) : '.';
        if (ch === '.' ) row.push(null);
        else if (ch === 'E') row.push('M');
        else row.push(ch);
      }
      g.push(row);
    }
    var kinds = FACE[expr] || FACE.open;
    for (var i = 0; i < 2; i++) {
      var at = EYES[who][i];
      var pack = eyeCells(kinds[i], at[0], at[1], i === 1, GLANCE[who]);
      var cells = pack[0], key = pack[1];
      for (var k = 0; k < cells.length; k++) {
        var cx = cells[k][0], cy = cells[k][1];
        if (cy >= 0 && cy < g.length && cx >= 0 && cx < g[0].length) g[cy][cx] = key;
      }
    }
    if (blush) {
      var spots = BLUSH_AT[who];
      for (var s = 0; s < spots.length; s++) {
        var bx = spots[s][0], by = spots[s][1];
        if (g[by] && bx >= 0 && bx < g[by].length) g[by][bx] = 'BLUSH';
      }
    }
    return g;
  }

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var slot = document.getElementById('slot');

  function fit() {
    var max = slot.clientWidth || 320;
    var n = Math.max(2, Math.floor(max / GW));
    if (n === N && canvas.getAttribute('data-n') === String(n)) return;
    N = n;
    var cssW = GW * N, cssH = GH * N;
    var dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.setAttribute('data-n', String(n));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * N, y * N, w * N, h * N);
  }
  function blob(cx, cy, rad, color) {
    for (var y = -rad; y <= rad; y++) {
      for (var x = -rad; x <= rad; x++) {
        if (x * x + y * y <= rad * rad) rect(cx + x, cy + y, 1, 1, color);
      }
    }
  }
  function icon(rows, color, x, y) {
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < rows[r].length; c++) {
        if (rows[r].charAt(c) === 'X') rect(x + c, y + r, 1, 1, color);
      }
    }
  }
  function faceOf(expr, t) {
    if (expr === 'sleep' || expr === 'squeeze' || expr === 'dazed' || expr === 'blink') return expr;
    var u = t % 4.8;
    if (u > 4.45) return 'blink';
    return expr;
  }
  function actor(who, x, y, o) {
    o = o || {};
    if (pokeUntil && performance.now() < pokeUntil) y -= 1;
    var expr = faceOf(o.expr || 'open', o.t || 0);
    if (o.forceBlink) expr = 'blink';
    var grid = compose(who, expr, o.tail || null, o.blush !== false);
    var pal = PAL[who];
    var h = grid.length, w = grid[0].length, r, c;
    if (o.edge) {
      ctx.fillStyle = '#FFF8F0';
      for (r = 0; r < h; r++) {
        for (c = 0; c < w; c++) {
          if (!grid[r][c]) continue;
          var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
          for (var n = 0; n < 4; n++) {
            var rr = r + nb[n][1], cc = c + nb[n][0];
            if (rr < 0 || cc < 0 || rr >= h || cc >= w || !grid[rr][cc]) {
              ctx.fillRect((x + cc) * N, (y + rr) * N, N, N);
            }
          }
        }
      }
    }
    for (r = 0; r < h; r++) {
      for (c = 0; c < w; c++) {
        var key = grid[r][c];
        if (!key) continue;
        ctx.fillStyle = pal[key];
        ctx.fillRect((x + c) * N, (y + r) * N, N, N);
      }
    }
  }
  function hopY(t, every, on) {
    if (!on) return 0;
    return Math.floor(t / every) % 2 === 0 ? 0 : -1;
  }
  function slide(t, a, b, from, to) {
    if (t <= a) return from;
    if (t >= b) return to;
    var steps = Math.max(1, Math.abs(to - from));
    var s = Math.floor(((t - a) / (b - a)) * steps);
    if (s >= steps) s = steps - 1;
    return from + (to > from ? 1 : -1) * s;
  }
  function paper(x, y, blank) {
    rect(x, y, 7, 8, PAPER);
    rect(x + 5, y, 2, 2, FOLD);
    if (!blank) {
      rect(x + 1, y + 3, 4, 1, FOLD);
      rect(x + 1, y + 5, 3, 1, FOLD);
    }
  }
  function letter(x, y, open) {
    rect(x, y, 9, 7, PAPER);
    rect(x, y, 9, 2, '#F3E6D4');
    if (open) rect(x + 2, y - 2, 5, 2, '#F7EDE0');
    rect(x + 3, y + 3, 2, 2, '#C0587A');
  }
  function chat(x, y) {
    rect(x, y, 20, 14, '#FFF9F3');
    rect(x, y, 20, 3, '#E7D5C6');
    rect(x + 2, y + 1, 2, 1, '#E07A7A');
    rect(x + 5, y + 1, 2, 1, '#E1A93A');
    rect(x + 8, y + 1, 2, 1, '#7EA36A');
    rect(x + 2, y + 6, 12, 1, FOLD);
    rect(x + 2, y + 8, 9, 1, FOLD);
    rect(x + 2, y + 10, 11, 1, FOLD);
  }
  function door(x, y, glow) {
    rect(x, y, 14, 36, WOOD);
    rect(x + 2, y + 2, 10, 32, glow ? '#F6C98A' : '#2A1C18');
    rect(x + 2, y + 3, 10, 8, glow ? '#FBE3B0' : '#3A2A24');
    rect(x + 10, y + 20, 1, 1, '#E1A93A');
  }
  function room(wall, floor, win, winX) {
    rect(0, 0, GW, 44, wall || WALL);
    rect(0, 44, GW, GH - 44, floor || FLOOR);
    rect(0, 44, GW, 1, '#E2CDB8');
    if (win) {
      var x = winX == null ? 56 : winX;
      rect(x, 5, 16, 12, '#FFF9F3');
      rect(x + 1, 6, 14, 10, win);
      rect(x + 1, 11, 14, 1, '#FFF9F3');
      rect(x + 7, 6, 1, 10, '#FFF9F3');
    }
  }
  function moonIn(winX) {
    blob((winX == null ? 56 : winX) + 5, 9, 2, '#F6E3B4');
  }

  function drawHide(t) {
    room('#F3E3DC', '#EBD3C0', '#1C1430', 56);
    moonIn(56);
    rect(6, 16, 22, 2, WOOD);
    rect(6, 18, 2, 10, WOOD);
    rect(26, 18, 2, 10, WOOD);
    paper(8, 10, false);
    paper(14, 11, false);
    var sunk = t > 2.1 && t < 5.1;
    var popped = t > 5.2;
    paper(34, sunk ? 46 : 44, false);
    paper(42, popped ? 40 : 45, false);
    if (t > 1.6 && t < 5.4) {
      ctx.globalAlpha = 0.16;
      rect(0, 24, GW, 6, '#D5E2F0');
      rect(0, 32, GW, 4, '#E4EEF6');
      ctx.globalAlpha = 1;
    }

    expect(FOX_ROWS.out, 21, 'out');
    expect(FOX_ROWS.droop, 21, 'droop');
    expect(CAT_ROWS.base, 20, 'cat');
    expect(CAT_ROWS.twitch, 20, 'twitch');
    expect(CAT_ROWS.twitchOut, 20, 'twitchOut');
    expect(CAT_ROWS.up, 20, 'up');
    var g = compose('fox', 'open', null, false);
    if (g[3][1] !== 'M' || g[4][3] !== 'E' || g[4][9] !== 'E') throw new Error('狐狸眼睛');
    var c = compose('cat', 'open', null, true);
    if (c[5][8] !== 'E' || c[5][16] !== 'E' || c[7][8] !== 'BLUSH') throw new Error('暹罗眼睛');
    var sleep = compose('fox', 'sleep', 'droop', false);
    if (sleep.length !== 13 || sleep[0].length !== 21) throw new Error('垂尾');
  }

  var index = 0;
  var playing = false;
  var timer = 0;
  var seen = {};
  var reduceQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduce = reduceQ.matches;
  var pokeUntil = 0;
  var params = new URLSearchParams(location.search);
  var still = params.has('still') || reduce;
  var rail = document.getElementById('rail');
  var whenEl = document.getElementById('when');
  var chapterEl = document.getElementById('chapter');
  var shortEl = document.getElementById('short');
  var bodyEl = document.getElementById('body');
  var playBtn = document.getElementById('play');
  var hintEl = document.getElementById('hint');
  var doneEl = document.getElementById('done');
  var errEl = document.getElementById('err');
  var themeMeta = document.getElementById('themeColor');
  var typeTimer = 0;

  reduceQ.addEventListener('change', function () {
    reduce = reduceQ.matches;
    still = params.has('still') || reduce;
    if (!reduce) requestAnimationFrame(loop);
    else render(SCENES[index].hero);
  });

  function typeShort(text) {
    clearInterval(typeTimer);
    if (still) { shortEl.textContent = text; return; }
    var k = 0;
    shortEl.textContent = '';
    typeTimer = setInterval(function () {
      k += 1;
      shortEl.textContent = text.slice(0, k);
      if (k >= text.length) clearInterval(typeTimer);
    }, 42);
  }
  function paintUI() {
    var s = SCENES[index];
    document.body.setAttribute('data-tone', s.tone);
    if (themeMeta) themeMeta.setAttribute('content', getComputedStyle(document.body).getPropertyValue('--theme').trim() || '#1A1422');
    whenEl.textContent = s.hm;
    whenEl.setAttribute('datetime', s.hm);
    chapterEl.textContent = s.ch;
    bodyEl.textContent = s.text;
    typeShort(s.short);
    canvas.setAttribute('aria-label', 'StashYu 和 FetchMo，' + s.hm + ' ' + s.ch);
    var buttons = rail.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-selected', i === index ? 'true' : 'false');
      buttons[i].classList.toggle('seen', !!seen[i]);
    }
    if (buttons[index] && buttons[index].scrollIntoView) {
      buttons[index].scrollIntoView({ inline: 'center', block: 'nearest' });
    }
    var all = true;
    for (var j = 0; j < SCENES.length; j++) if (!seen[j]) all = false;
    doneEl.hidden = !all;
  }
  function render(t) {
    try {
      fit();
      ctx.clearRect(0, 0, GW * N, GH * N);
      SCENES[index].draw(t);
      errEl.hidden = true;
    } catch (e) {
      errEl.hidden = false;
      errEl.textContent = e && e.message ? e.message : '这一格没画出来';
    }
  }
  function sceneT(now) {
    if (still) return SCENES[index].hero;
    return (now / 1000) % SCENES[index].dur;
  }
  function go(i) {
    index = (i + SCENES.length) % SCENES.length;
    seen[index] = 1;
    paintUI();
    if (still) render(SCENES[index].hero);
    try { history.replaceState(null, '', '#' + SCENES[index].ch); } catch (e) {}
    if (playing) schedule();
  }
  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    timer = setTimeout(function () { go(index + 1); }, SCENES[index].hold * 1000);
  }
  function setPlaying(on) {
    playing = on;
    playBtn.textContent = playing ? '停在这里' : '接着看';
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    if (playing) schedule();
    else clearTimeout(timer);
  }

  for (var i = 0; i < SCENES.length; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.innerHTML = '<b>' + SCENES[i].hm + '</b><small>' + SCENES[i].ch + '</small>';
    (function (n) { b.addEventListener('click', function () { setPlaying(false); go(n); }); })(i);
    rail.appendChild(b);
  }
  document.getElementById('prev').addEventListener('click', function () { setPlaying(false); go(index - 1); });
  document.getElementById('next').addEventListener('click', function () { setPlaying(false); go(index + 1); });
  playBtn.addEventListener('click', function () { setPlaying(!playing); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { setPlaying(false); go(index + 1); }
    else if (e.key === 'ArrowLeft') { setPlaying(false); go(index - 1); }
    else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  });
  var sx = 0, sy = 0, st = 0, down = false;
  slot.addEventListener('pointerdown', function (e) {
    down = true; sx = e.clientX; sy = e.clientY; st = Date.now();
  });
  slot.addEventListener('pointerup', function (e) {
    if (!down) return;
    down = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4 && Date.now() - st < 700) {
      setPlaying(false);
      go(index + (dx < 0 ? 1 : -1));
    } else if (Math.hypot(dx, dy) < 12) {
      pokeUntil = performance.now() + 480;
    }
  });
  window.addEventListener('resize', function () {
    canvas.removeAttribute('data-n');
    render(sceneT(performance.now()));
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) setPlaying(false);
  });

  try { checkGrids(); }
  catch (e) {
    errEl.hidden = false;
    errEl.textContent = e.message;
  }
  var hash = decodeURIComponent((location.hash || '').replace('#', ''));
  for (var h = 0; h < SCENES.length; h++) {
    if (SCENES[h].ch === hash || SCENES[h].hm === hash) index = h;
  }
  seen[index] = 1;
  paintUI();
  if (params.has('scan')) {
    var notes = [];
    var back = index;
    for (var si = 0; si < SCENES.length; si++) {
      index = si;
      try {
        fit();
        ctx.clearRect(0, 0, GW * N, GH * N);
        SCENES[si].draw(SCENES[si].hero);
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var red = 0, blue = 0, p;
        for (p = 0; p < img.data.length; p += 4) {
          if (img.data[p] === 226 && img.data[p + 1] === 85 && img.data[p + 2] === 43) red++;
          if (img.data[p] === 121 && img.data[p + 1] === 192 && img.data[p + 2] === 240) blue++;
        }
        notes.push(SCENES[si].ch + ' 红' + red + ' 蓝' + blue);
        if (!red || !blue) notes[notes.length - 1] += ' 缺';
      } catch (err) {
        notes.push(SCENES[si].ch + ' 失败');
      }
    }
    index = back;
    hintEl.textContent = notes.join(' · ');
    render(SCENES[index].hero);
  }
  function loop(now) {
    render(sceneT(now));
    if (!still) requestAnimationFrame(loop);
  }
  if (still) render(SCENES[index].hero);
  else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
