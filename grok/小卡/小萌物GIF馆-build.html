<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ecdf">
<title>小萌物 GIF 馆</title>
<meta name="description" content="短片里软的一下，和柜里新画的，收成能单独带走的 GIF。">
<!--
  添一件：往脚本里的 PIECES 加一格，放在私藏前面。
  从短片取出的，film、file、quote 用原片标题、文件名、字幕原句。
  馆里新画的，这三项留空。
  cast 写这一下里有谁，给上面那排名字用。fresh 为真时，没看过会标「新」。
-->
<style>
  :root {
    --bg: #f3ecdf;
    --ink: #2a221c;
    --muted: #7d6d5e;
    --paper: #fffaf3;
    --line: #e6d8c6;
    --accent: #E2552B;
    --on: #fffaf3;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  * { \62ox-sizing: border-\62ox; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .kicker {
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--muted);
  }
  .title-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }
  h1 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: .06em;
    line-height: 1.25;
  }
  #seal {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: var(--serif);
    font-size: 16px;
    transform: rotate(-8deg);
  }
  #seal[data-on="1"] { background: var(--accent); color: var(--on); }
  .lede, .hint, .foot, .from, .sign { color: var(--muted); }
  .lede { margin-top: 8px; }
  .stat { margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .modes, .turn { display: flex; gap: 8px; margin-top: 14px; }
  .modes button, .turn button, .sheet-bar button {
    min-height: 44px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 0 14px;
  }
  .modes button { flex: 1; }
  .turn button { flex: 1; }
  .modes button[aria-selected="true"], .sheet-bar button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on);
  }
  .times {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .times::-webkit-scrollbar { display: none; }
  .times button {
    flex: 0 0 auto;
    scroll-snap-align: start;
    min-height: 44px;
    max-width: 220px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    line-height: 1.3;
    text-align: left;
  }
  .times button[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on);
  }
  .times button .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: currentColor;
    vertical-align: middle;
  }
  .ticket {
    margin-top: 14px;
    background: var(--paper);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .stage {
    display: block;
    width: 100%;
    border: 0;
    background: #f6f1e6;
    padding: 0;
    position: relative;
    touch-action: pan-y;
  }
  canvas, img.shot {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #f6f1e6;
  }
  .cap { padding: 12px 14px 14px; }
  .cap h2 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .04em;
    line-height: 1.3;
  }
  .from { margin-top: 2px; font-size: 13px; }
  .hint { margin-top: 12px; font-size: 14px; min-height: 1.65em; }
  .foot { margin-top: 22px; font-size: 13px; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (hover: hover) {
    .modes button:not([aria-selected="true"]):hover,
    .turn button:hover,
    .times button:not([aria-selected="true"]):hover,
    .sheet-bar button:hover { background: #f3e6d4; }
  }
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: var(--bg);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .sheet[hidden] { display: none !important; }
  .sheet-in {
    max-width: 440px;
    margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .sheet-bar { display: flex; gap: 8px; }
  .sheet-bar button { flex: 1; }
  .sheet h2 {
    margin-top: 14px;
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .label {
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .quote {
    margin-top: 4px;
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.6;
    white-space: pre-line;
  }
  .sign { margin-top: 8px; }
  .shot { margin-top: 8px; border-radius: 12px; }
  a.go {
    display: inline-block;
    margin-top: 10px;
    min-height: 44px;
    line-height: 44px;
    color: var(--accent);
  }
  @media (prefers-reduced-motion: reduce) {
    .ticket { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main>
  <p class="kicker">打烊以后的小柜</p>
  <div class="title-row">
    <h1>小萌物 GIF 馆</h1>
    <button type="button" id="seal" aria-label="馆印">藏</button>
  </div>
  <p class="lede">会动的一下收在这里。可以按只找，可以抽，点开就能单独存成 GIF。</p>
  <p class="stat" id="stat"></p>
  <div class="modes" role="tablist" aria-label="怎么看">
    <button type="button" id="tab-all" role="tab" aria-selected="true">馆藏</button>
    <button type="button" id="tab-pack" role="tab" aria-selected="false">盲盒</button>
    <button type="button" id="tab-film" role="tab" aria-selected="false">原片</button>
  </div>
  <div class="times" id="who" role="tablist" aria-label="看谁"></div>
  <div class="times" id="chips"></div>
  <article class="ticket">
    <button type="button" class="stage" id="open" aria-label="展开这件">
      <canvas id="view" width="320" height="224"></canvas>
    </button>
    <div class="cap">
      <h2 id="name"></h2>
      <p class="from" id="from"></p>
    </div>
  </article>
  <div class="turn" id="turn">
    <button type="button" id="prev">上一件</button>
    <button type="button" id="next">下一件</button>
  </div>
  <div class="turn">
    <button type="button" id="pet">摸一摸</button>
    <button type="button" id="draw">抽一只</button>
  </div>
  <p class="hint" id="hint"></p>
  <p class="foot" id="foot">这一柜还会再添。</p>
</main>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-bar">
      <button type="button" id="close">收回展柜</button>
      <button type="button" class="primary" id="save">单独保存 GIF</button>
    </div>
    <canvas id="big" width="320" height="224"></canvas>
    <img class="shot" id="shot" alt="" hidden>
    <h2 id="s-name"></h2>
    <p class="from" id="s-from"></p>
    <p class="label" id="s-label"></p>
    <p class="quote" id="s-quote"></p>
    <p class="sign" id="s-sign"></p>
    <p class="hint" id="s-hint"></p>
    <a class="go" id="s-go" hidden>去看原片</a>
  </div>
</div>
<script>
(function () {
  var W = 320, H = 224, FLOOR = 186;
  var fb = new Uint8ClampedArray(W * H * 4);
  var hexCache = Object.create(null);

  function rgb(hex) {
    var c = hexCache[hex];
    if (!c) {
      var n = parseInt(hex.slice(1), 16);
      c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      hexCache[hex] = c;
    }
    return c;
  }
  function fillRect(x, y, w, h, color) {
    var c = rgb(color);
    var x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
    var x1 = Math.min(W, (x | 0) + (w | 0));
    var y1 = Math.min(H, (y | 0) + (h | 0));
    var yy, xx, p;
    for (yy = y0; yy < y1; yy++) {
      p = (yy * W + x0) * 4;
      for (xx = x0; xx < x1; xx++) {
        fb[p] = c[0]; fb[p + 1] = c[1]; fb[p + 2] = c[2]; fb[p + 3] = 255;
        p += 4;
      }
    }
  }
  function fillCircle(cx, cy, r, color) {
    var c = rgb(color), r2 = r * r;
    var x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
    var y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
    var y, x, dx, dy, p;
    for (y = y0; y <= y1; y++) {
      for (x = x0; x <= x1; x++) {
        dx = x + 0.5 - cx; dy = y + 0.5 - cy;
        if (dx * dx + dy * dy <= r2) {
          p = (y * W + x) * 4;
          fb[p] = c[0]; fb[p + 1] = c[1]; fb[p + 2] = c[2]; fb[p + 3] = 255;
        }
      }
    }
  }
  function ring(cx, cy, r, t, color) {
    var c = rgb(color), r2 = r * r, i2 = (r - t) * (r - t);
    var x0 = Math.max(0, Math.floor(cx - r - 1)), x1 = Math.min(W - 1, Math.ceil(cx + r + 1));
    var y0 = Math.max(0, Math.floor(cy - r - 1)), y1 = Math.min(H - 1, Math.ceil(cy + r + 1));
    var y, x, dx, dy, d, p;
    for (y = y0; y <= y1; y++) {
      for (x = x0; x <= x1; x++) {
        dx = x + 0.5 - cx; dy = y + 0.5 - cy; d = dx * dx + dy * dy;
        if (d <= r2 && d >= i2) {
          p = (y * W + x) * 4;
          fb[p] = c[0]; fb[p + 1] = c[1]; fb[p + 2] = c[2]; fb[p + 3] = 255;
        }
      }
    }
  }
  function slit(cx, cy, r, ox, oy, w, len, hole, only) {
    var c = rgb(hole);
    var keep = only ? rgb(only) : null;
    var px = cx + ox * r, py = cy + oy * r;
    var theta = -26.2 * Math.PI / 180;
    var cos = Math.cos(theta), sin = Math.sin(theta);
    var rad = (w * r) / 2;
    var half = Math.max(0, (len * r) / 2 - rad);
    var reach = half + rad + 1.5;
    var x0 = Math.max(0, Math.floor(px - reach)), x1 = Math.min(W - 1, Math.ceil(px + reach));
    var y0 = Math.max(0, Math.floor(py - reach)), y1 = Math.min(H - 1, Math.ceil(py + reach));
    var y, x, dx, dy, lx, ly, yy, p;
    for (y = y0; y <= y1; y++) {
      for (x = x0; x <= x1; x++) {
        dx = x + 0.5 - px; dy = y + 0.5 - py;
        lx = dx * cos + dy * sin;
        ly = -dx * sin + dy * cos;
        yy = Math.abs(ly) - half;
        if (yy < 0) yy = 0;
        if (lx * lx + yy * yy <= rad * rad) {
          p = (y * W + x) * 4;
          if (keep && (fb[p] !== keep[0] || fb[p + 1] !== keep[1] || fb[p + 2] !== keep[2])) continue;
          fb[p] = c[0]; fb[p + 1] = c[1]; fb[p + 2] = c[2]; fb[p + 3] = 255;
        }
      }
    }
  }
  function face(cx, cy, r, color, hole, blink) {
    fillCircle(cx, cy, r, color);
    var len = blink ? 0.418 * 0.22 : 0.418;
    slit(cx, cy, r, 0.194, -0.416, 0.194, len, hole, color);
    slit(cx, cy, r, 0.626, -0.497, 0.129, len, hole, color);
  }
  function shelf() {
    fillRect(0, 0, W, H, "#f6f1e6");
    fillRect(0, FLOOR, W, H - FLOOR, "#efe2d2");
    fillRect(0, FLOOR, W, 3, "#e4d3c0");
  }
  function paint(rows, ox, oy, n, map) {
    var y, x, ch, col;
    for (y = 0; y < rows.length; y++) {
      for (x = 0; x < rows[y].length; x++) {
        ch = rows[y].charAt(x);
        if (ch === ".") continue;
        col = map[ch];
        if (!col) continue;
        fillRect(ox + x * n, oy + y * n, n, n, col);
      }
    }
  }
  function cells(ox, oy, n, ax, ay, list, color) {
    var i, dx, dy;
    for (i = 0; i < list.length; i++) {
      dx = list[i][0]; dy = list[i][1];
      fillRect(ox + (ax + dx) * n, oy + (ay + dy) * n, n, n, color);
    }
  }
  function eyes(ox, oy, n, anchors, mode, ink, body, dir) {
    if (mode === "normal") return;
    var i, ax, ay, dy, dx;
    var two = [[0, 0], [1, 0], [0, 1], [1, 1]];
    for (i = 0; i < anchors.length; i++) {
      ax = anchors[i][0]; ay = anchors[i][1];
      cells(ox, oy, n, ax, ay, two, body);
      if (mode === "blink") cells(ox, oy, n, ax, ay, [[0, 1], [1, 1]], ink);
      else if (mode === "happy") cells(ox, oy, n, ax, ay, [[-1, 1], [0, 0], [1, 0], [2, 1]], ink);
      else if (mode === "sleep") cells(ox, oy, n, ax, ay, [[-1, 0], [0, 1], [1, 1], [2, 0]], ink);
      else if (mode === "look") {
        for (dy = 0; dy < 2; dy++) for (dx = 0; dx < 2; dx++) {
          fillRect(ox + (ax + dx + dir) * n, oy + (ay + dy) * n, n, n, ink);
        }
      }
    }
  }
  function blushFox(ox, oy, n) {
    fillRect(ox + 2 * n, oy + 6 * n, n, n, "#F59A8C");
    fillRect(ox + 11 * n, oy + 6 * n, n, n, "#F59A8C");
  }
  function blushCat(ox, oy, n) {
    fillRect(ox + 8 * n, oy + 7 * n, n, n, "#F2B8B0");
    fillRect(ox + 17 * n, oy + 7 * n, n, n, "#F2B8B0");
  }

  var FOX = { M: "#E2552B", C: "#FFF3E3", D: "#3B2520", E: "#3B2520" };
  var CAT = { M: "#F3E7D6", X: "#4E382E", E: "#79C0F0" };
  var FOX_EYE = [[3, 4], [9, 4]];
  var CAT_EYE = [[8, 5], [16, 5]];
  var FOX_BASE = [
    ".D..........D.......",
    ".DM........MD.......",
    ".MCM......MCM...CC..",
    ".MMMMMMMMMMMM..CCCC.",
    ".MMEEMMMMEEMM..MMMM.",
    ".MMEEMMMMEEMM..MMMMM",
    "CCCCCCDDCCCCCC.MMMMM",
    "..CCCCCCCCCC..MMMMM.",
    "....MMCCMM...MMMMM..",
    "....MMCCMM..MMMMM...",
    "....MMMMMM.MMMMM....",
    "....DDMMDDMMMM......",
    "...................."
  ];
  var FOX_TAP = [
    ".D..........D.......",
    ".DM........MD.......",
    ".MCM......MCM.CC....",
    ".MMMMMMMMMMMM.CCCC..",
    ".MMEEMMMMEEMM..MMMM.",
    ".MMEEMMMMEEMM..MMMMM",
    "CCCCCCDDCCCCCC.MMMMM",
    "..CCCCCCCCCC..MMMMM.",
    "....MMCCMM...MMMMM..",
    "....MMCCMM..MMMMM...",
    "....MMMMMM.MMMMM....",
    "....DDMMDDMMMM......",
    "...................."
  ];
  var FOX_IN = [
    ".D..........D.......",
    ".DM........MD.......",
    ".MCM......MCM..CC...",
    ".MMMMMMMMMMMM.CCCC..",
    ".MMEEMMMMEEMM.MMMM..",
    ".MMEEMMMMEEMM.MMMMM.",
    "CCCCCCDDCCCCCC.MMMMM",
    "..CCCCCCCCCC..MMMMM.",
    "....MMCCMM...MMMMM..",
    "....MMCCMM..MMMMM...",
    "....MMMMMM.MMMMM....",
    "....DDMMDDMMMM......",
    "...................."
  ];
  var FOX_OUT = [
    ".D..........D........",
    ".DM........MD........",
    ".MCM......MCM....CC..",
    ".MMMMMMMMMMMM...CCCC.",
    ".MMEEMMMMEEMM...MMMM.",
    ".MMEEMMMMEEMM...MMMMM",
    "CCCCCCDDCCCCCC.MMMMM.",
    "..CCCCCCCCCC..MMMMM..",
    "....MMCCMM...MMMMM...",
    "....MMCCMM..MMMMM....",
    "....MMMMMM.MMMMM.....",
    "....DDMMDDMMMM.......",
    "....................."
  ];
  var FOX_HANG = [
    ".D..........D........",
    ".DM........MD........",
    ".MCM......MCM........",
    ".MMMMMMMMMMMM........",
    ".MMEEMMMMEEMM........",
    ".MMEEMMMMEEMM........",
    "CCCCCCDDCCCCCC.......",
    "..CCCCCCCCCC.........",
    "....MMCCMM...MM......",
    "....MMCCMM..MMMMM....",
    "....MMMMMM.MMMMMMMCC.",
    "....DDMMDDMMMMMMMCCCC",
    "....................."
  ];
  var CAT_BASE = [
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    ".....X.MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ];
  var CAT_UP = [
    "....................",
    "........X........X..",
    ".....X.XXX......XXX.",
    "....X...MMMMMMMMMM..",
    "....X..MMMMMMMMMMMM.",
    "....X..MEEMMMMMMEEM.",
    "....X..MEEMXXXXMEEM.",
    ".....X.MMMMMXXMMMMM.",
    "......X.MMMMMMMMMM..",
    ".......XMMMMMMMMMM..",
    "........XMMMMMMMM...",
    ".........XXM..MXX...",
    "...................."
  ];
  var ROSE = [".R.", "RRR", ".Y.", ".G.", ".G."];
  var ROSE_MAP = { R: "#E2552B", Y: "#FFF3E3", G: "#5f8f62" };

  function checkGrid(name, rows, w, letters) {
    var y, x, ch;
    if (rows.length !== 13 && name.indexOf("ROSE") !== 0) throw new Error(name);
    for (y = 0; y < rows.length; y++) {
      if (rows[y].length !== w) throw new Error(name + " " + y);
      for (x = 0; x < rows[y].length; x++) {
        ch = rows[y].charAt(x);
        if (letters.indexOf(ch) < 0) throw new Error(name + " " + ch);
      }
    }
  }
  checkGrid("base", FOX_BASE, 20, ".DMCE");
  checkGrid("tap", FOX_TAP, 20, ".DMCE");
  checkGrid("in", FOX_IN, 20, ".DMCE");
  checkGrid("out", FOX_OUT, 21, ".DMCE");
  checkGrid("hang", FOX_HANG, 21, ".DMCE");
  checkGrid("cat", CAT_BASE, 20, ".MXE");
  checkGrid("up", CAT_UP, 20, ".MXE");

  function foxAt(rows, n, ox, yOff, mode, blush) {
    var oy = FLOOR - 13 * n + yOff;
    paint(rows, ox, oy, n, FOX);
    eyes(ox, oy, n, FOX_EYE, mode, "#3B2520", "#E2552B", 1);
    if (blush) blushFox(ox, oy, n);
  }
  function catAt(rows, n, ox, yOff, mode, blush) {
    var oy = FLOOR - 13 * n + yOff;

    if (blush) blushCat(ox, oy, n);
  }
  function foxCenter(rows, n, yOff, mode, blush) {
    foxAt(rows, n, Math.round((W - 20 * n) / 2), yOff, mode, blush);
  }
  function clawd(lift) {
    var ox = 24, oy = FLOOR - 169, s = "#d47f59";
    var legs = [44, 68, 152, 176], i;
    fillRect(ox + 44, oy + 50, 147, 98, s);
    fillRect(ox + 20, oy + 99 - lift, 24, 21, s);
    fillRect(ox + 191, oy + 99 - lift, 25, 21, s);
    for (i = 0; i < legs.length; i++) fillRect(ox + legs[i], oy + 148, 15, 21, s);
    fillRect(ox + 70, oy + 78, 8, 21, "#000000");
    fillRect(ox + 158, oy + 78, 8, 21, "#000000");
    ring(286, FLOOR - 20, 16, 3, "#E2552B");

    packNote = "";
    petLeft = 0;
    frame = 0;
    closeSheet();
    sync();
  });
  document.getElementById("tab-film").addEventListener("click", function () {
    mode = "film";
    petLeft = 0;
    if (!film) film = filmNames()[0];
    index = 0;
    frame = 0;
    closeSheet();
    sync();
  });
  document.getElementById("pet").addEventListener("click", function () {
    var p = current();
    if (!p || (mode === "pack" && sealed)) return;
    petLeft = p.delays.length;
    frame = 0;
    acc = 0;
    sync();
  });
  document.getElementById("draw").addEventListener("click", pull);
  document.getElementById("seal").addEventListener("click", function () {
    store.sealTaps = (store.sealTaps || 0) + 1;
    if (!store.secret && store.sealTaps >= 4) {
      store.secret = true;
      if (deck.indexOf("keep") < 0) deck.push("keep");
      persist();
      mode = "all";
      who = "";
      frame = 0;
      closeSheet();
      focusId("keep");
      sync();
      document.getElementById("hint").textContent = "私藏拿出来了。这件没有原片。";
      return;
    }
    if (!store.secret) document.getElementById("hint").textContent = "馆印还热着。";
  });
  document.getElementById("save").addEventListener("click", function () {
    var p = current();
    if (!p) return;
    var hint = document.getElementById("s-hint");
    var bytes = (baked && bakedId === p.id) ? baked : null;
    if (!bytes) {
      try { bytes = gifOf(p); baked = bytes; bakedId = p.id; }
      catch (err) { hint.textContent = "这张没装订上，再试一次。"; return; }
    }
    var blob = new Blob([bytes], { type: "image/gif" });
    var fileName = p.title + ".gif";
    var file = null;
    if (shotUrl) URL.revokeObjectURL(shotUrl);
    shotUrl = URL.createObjectURL(blob);
    shot.src = shotUrl;
    shot.alt = p.title + "，GIF";
    shot.hidden = false;
    big.hidden = true;
    hint.textContent = "下面这张已经是 GIF。没弹出保存的话，长按它也能存。";
    try { file = new File([blob], fileName, { type: "image/gif" }); }
    catch (err2) { file = null; }
    var shareFiles = false;
    try { shareFiles = !!(file && navigator.canShare && navigator.canShare({ files: [file] })); }
    catch (err3) { shareFiles = false; }
    if (shareFiles) {
      navigator.share({ files: [file], title: p.title }).catch(function (e) {
        if (e && e.name === "AbortError") return;
        var a = document.createElement("a");
        a.href = shotUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
      return;
    }
    var a = document.createElement("a");
    a.href = shotUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !sheet.hidden) { closeSheet(); sync(); }
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });

  if (!film) film = filmNames()[0];
  sync();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
