function icon(k){return '<svg width="24" height="24" aria-hidden="true">'+icons[k]+'</svg>'}
function timecode(t){const s=Math.max(0,Math.floor(t+.0001));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
let cur=0,running=false,started=false,soundOn=true,ac=null,master=null,bus=null,timer=0,raf=0,wallStart=0,audioStart=null,origin=0,idx=0,generation=0;
let cells=[],active=-2,buttonState='',clockText='',dragging=false,resumeDrag=false;
function now(){if(!running)return cur;if(audioStart!==null&&ac&&ac.state==='running')return clamp(origin+ac.currentTime-audioStart,0,TOTAL);return clamp(origin+(performance.now()-wallStart)/1000,0,TOTAL)}
function disconnectBus(){if(bus){try{bus.disconnect()}catch(e){}bus=null}clearInterval(timer)}
function gainMaster(){if(!master||!ac)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(soundOn?1:0,ac.currentTime,.012)}
function unlock(){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return Promise.resolve(false);
try{if(!ac){ac=new AudioCtx();master=ac.createGain();master.gain.value=soundOn?1:0;master.connect(ac.destination);ac.addEventListener('statechange',()=>{if(running&&(ac.state==='interrupted'||ac.state==='suspended'))pause()})}
if(ac.state==='running')return Promise.resolve(true);return ac.resume().then(()=>ac.state==='running').catch(()=>false)}catch(e){return Promise.resolve(false)}}
function startAudio(from){disconnectBus();if(!ac||ac.state!=='running')return;bus=ac.createGain();bus.connect(master);audioStart=ac.currentTime;origin=from;wallStart=performance.now();idx=0;
while(idx<events.length&&events[idx].t<from){const e=events[idx++];if(from-e.t<e.len-.012)synth(ac,bus,e,ac.currentTime+.004,from-e.t)}
function pump(){if(!running||!bus)return;const n=now(),base=ac.currentTime;while(idx<events.length&&events[idx].t<n+.45){const e=events[idx++],d=e.t-n;if(d+e.len>.012)synth(ac,bus,e,Math.max(base+.003,base+d),Math.max(0,-d))}}
pump();timer=setInterval(pump,90)}
function update(t){const st=running?'pause':(started&&cur>=TOTAL-.02?'replay':'play');
if(st!==buttonState){buttonState=st;toggle.innerHTML=icon(st);toggle.setAttribute('aria-label',st==='pause'?'暂停':st==='replay'?'重播':'播放')}
const clock=timecode(t)+' / '+timecode(TOTAL);if(clock!==clockText){clockText=clock;el('clock').textContent=clock;seekBar.setAttribute('aria-valuetext',clock)}
if(!dragging)seekBar.value=String(t);seekBar.style.setProperty('--pos',(t*100/TOTAL).toFixed(2)+'%');
let i=started?getCue(t):-1;if(i!==active){if(cells[active])cells[active].removeAttribute('aria-current');if(cells[i])cells[i].setAttribute('aria-current','true');active=i}
entrance.hidden=started&&(running||cur<TOTAL-.02);const again=started&&cur>=TOTAL-.02;entrance.querySelector('span').textContent=again?'再看一回':'放映';entrance.setAttribute('aria-label',again?'重新放映':'放映短片')}
function frame(){if(!running)return;cur=now();render(cur,!soundOn);if(cur>=TOTAL-.01){cur=TOTAL;running=false;generation++;audioStart=null;disconnectBus();update(cur);return}update(cur);raf=requestAnimationFrame(frame)}
function play(){if(running)return;if(cur>=TOTAL-.02)cur=0;started=true;running=true;origin=cur;wallStart=performance.now();audioStart=null;const stamp=++generation;const ok=unlock();
render(cur,!soundOn);update(cur);ok.then(ready=>{if(ready&&running&&stamp===generation)startAudio(now())});cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function pause(){if(!running)return;cur=now();running=false;generation++;audioStart=null;cancelAnimationFrame(raf);disconnectBus();render(cur,!soundOn);update(cur)}
function seek(v){const n=Number(v);if(!Number.isFinite(n))return;const next=clamp(n,0,TOTAL);started=true;cur=next;if(running&&next>=TOTAL-.001){running=false;generation++;cancelAnimationFrame(raf);disconnectBus();audioStart=null}else if(running){origin=next;wallStart=performance.now();audioStart=null;startAudio(next)}render(next,!soundOn);update(next)}
function togglePlay(){if(running)pause();else play()}
function updateVolume(){volume.innerHTML=icon(soundOn?'sound':'mute');volume.setAttribute('aria-label',soundOn?'静音':'开启声音');volume.setAttribute('aria-pressed',String(!soundOn));gainMaster()}
toggle.addEventListener('click',togglePlay);entrance.addEventListener('click',play);canvas.addEventListener('click',togglePlay);
volume.addEventListener('click',()=>{soundOn=!soundOn;updateVolume();if(started&&!running)render(cur,!soundOn);if(soundOn)unlock().then(ok=>{if(ok&&running&&!bus)startAudio(now())})});
seekBar.addEventListener('pointerdown',()=>{resumeDrag=running;dragging=true;if(running)pause()});
function release(){if(!dragging)return;dragging=false;const again=resumeDrag;resumeDrag=false;if(again&&cur<TOTAL-.03)play()}
seekBar.addEventListener('input',()=>seek(seekBar.value));seekBar.addEventListener('change',()=>{seek(seekBar.value);release()});
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
document.addEventListener('keydown',ev=>{if(ev.code!=='Space'||ev.repeat||/^(BUTTON|INPUT|SUMMARY|A)$/.test(ev.target.tagName))return;ev.preventDefault();togglePlay()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause()});
window.addEventListener('pagehide',pause);
cues.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='cue';const ti=document.createElement('time');ti.textContent=timecode(c[0]);ti.dateTime='PT'+Math.floor(c[0])+'S';const part=document.createElement('span');const wh=document.createElement('small');wh.textContent=c[2];const line=document.createElement('span');line.className='word';line.textContent=c[3];part.append(wh,line);b.append(ti,part);b.setAttribute('aria-label','从 '+timecode(c[0])+' 播放，'+c[2]+'，'+c[3]);el('lines').appendChild(b);cells.push(b);b.addEventListener('click',()=>{seek(c[0]);if(!running)play();el('stage').scrollIntoView({block:'start',behavior:'auto'})})});
function sizeToScreen(){const frame=el('stage').getBoundingClientRect();if(!frame.width)return;const px=Math.round(frame.width*Math.min(3,window.devicePixelRatio||1));if(Math.abs(canvas.width-px)>1)setup(px);if(started)render(now(),!soundOn);else poster()}
updateVolume();sizeToScreen();update(0);
if(window.ResizeObserver)new ResizeObserver(sizeToScreen).observe(el('stage'));else window.addEventListener('resize',sizeToScreen);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!running)sizeToScreen()});
window.FILM={W,H,TOTAL,canvas,events,synth,setup,render,poster,seek,play,pause,scenes:scenes.map(s=>({id:s.id,start:s.start,duration:+(s.end-s.start).toFixed(3)})),state:()=>({cur:now(),playing:running,soundOn,started})};
</script>
</body>
