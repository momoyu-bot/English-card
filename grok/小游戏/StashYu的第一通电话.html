<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StashYu的第一通电话</title>
<meta name="description" content="听筒比它大。只有一只，第一声喂是你帮接的。">
<meta name="theme-color" content="#141226">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 格子图照抄 claude/小科普/momoyu造型宪法.html 的狐狸，一格没改。
     动的是整只的位置和眼睛。时间函数用 steps()。grok 做的 · 2026.09 -->
<style>
  :root {
    --night: #141226;
    --sky: #2c2558;
    --sky-2: #1b1738;
    --ink: #f6efe6;
    --muted: #b7aec9;
    --sill: #3a2924;
    --sill-edge: #2a1c19;
    --mat: #f6ebdd;
    --mat-edge: #e4d3bf;
    --lamp: #f0b45a;
    --phone: #f4e7d6;
    --phone-dark: #3b2520;
    --cord: #8c4a3a;
    --rain: rgba(186, 206, 242, .72);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(120% 70% at 50% -10%, #32285f 0%, transparent 55%),
      var(--night);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.65;
  }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 18px 48px;
  }
  .where {
    margin: 0 0 4px;
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--muted);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 700;
  }
  .line {
    min-height: 3.3em;
    margin: 0 0 16px;
    color: var(--ink);
    font-size: 15px;
  }
  .en {
    display: none;
    margin: -8px 0 16px;
    color: var(--muted);
    font-size: 13px;
    font-family: ui-serif, "Iowan Old Style", Palatino, "Songti SC", serif;
  }
  body.en .en { display: block; }
  .stage {
    position: relative;
    height: 300px;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 58%, var(--sill) 58%, var(--sill-edge) 100%);
  }
  .lamp {
    position: absolute;
    left: 28px;
    top: 36px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--lamp);
    box-shadow: 0 0 0 8px rgba(240, 180, 90, .18), 0 0 28px 10px rgba(240, 180, 90, .35);
  }
  .rain {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 58%;
    pointer-events: none;
  }
  .drop {
    position: absolute;
    top: -12px;
    width: 1px;
    height: 10px;
    background: var(--rain);
    animation: fall 1.2s steps(6, end) infinite;
  }
  .sill-line {
    position: absolute;
    left: 0; right: 0;
    top: 58%;
    height: 8px;
    background: #4a342c;
  }
  .mat {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    width: min(92%, 340px);
    height: 118px;
    background: var(--mat);
    border-radius: 16px 16px 10px 10px;
    box-shadow: 0 10px 0 var(--mat-edge);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    padding: 0 12px 8px;
  }
  .foxwrap {
    width: 168px;
    height: 108px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .foxwrap.hop { animation: hop .7s steps(2, end) infinite; }
  canvas {
    width: 160px;
    height: 96px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .phone {
    position: relative;
    width: 74px;
    height: 108px;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .phone.ring { animation: shake .45s steps(2, end) infinite; }
  .hand {
    position: absolute;
    left: 18px;
    bottom: 8px;
    width: 38px;
    height: 78px;
    background: var(--phone);
    border: 3px solid var(--phone-dark);
    border-radius: 18px;
    transform: rotate(-18deg);
    transform-origin: 50% 80%;
  }
  .cup {
    position: absolute;
    left: 6px;
    width: 20px;
    height: 14px;
    background: var(--phone-dark);
    border-radius: 8px;
  }
  .cup.ear { top: 6px; }
  .cup.mouth { bottom: 6px; }
  .cord {
    position: absolute;
    left: -6px;
    bottom: 4px;
    width: 36px;
    height: 28px;
    border: 3px solid var(--cord);
    border-top: 0;
    border-radius: 0 0 16px 16px;
    transform: rotate(12deg);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  button.act, button.choice, button.lang {
    font: inherit;
    font-size: 15px;
    color: var(--night);
    background: var(--mat);
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.choice { background: transparent; color: var(--ink); border: 1px solid rgba(246, 239, 230, .35); }
  button.lang {
    margin-left: auto;
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(183, 174, 201, .35);
    font-size: 12px;
    letter-spacing: .08em;
    padding: 8px 12px;
  }
  button.lang[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
  .foot {
    margin: 22px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3px); }
  }
  @keyframes fall {
    to { transform: translateY(190px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .foxwrap.hop, .phone.ring, .drop { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="where">窗台 · 夜里</p>
  <h1>StashYu的第一通电话</h1>
  <p class="line" id="line" aria-live="polite">电话响了。这一头只有它。</p>
  <p class="en" id="enline">The phone is ringing. Only the fox is here.</p>

  <div class="stage" aria-hidden="false">
    <div class="lamp"></div>
    <div class="rain" id="rain"></div>
    <div class="sill-line"></div>
    <div class="mat">
      <div class="foxwrap hop" id="foxwrap">
        <canvas id="fox" width="160" height="96" role="img" aria-label="StashYu"></canvas>
      </div>
      <button class="phone ring" id="phone" type="button" aria-label="听筒">
        <span class="cord"></span>
        <span class="hand"><span class="cup ear"></span><span class="cup mouth"></span></span>
      </button>
    </div>
  </div>

  <div class="actions" id="actions">
    <button class="act" id="act" type="button">接起来</button>
    <button class="lang" id="lang" type="button" aria-pressed="false">EN</button>
  </div>
  <p class="foot">只有这一只。听筒放下以后，它还坐在窗台上。</p>
</div>
<script>
const ROWS = [
  ".D..........D.......",
  ".DM........MD.......",
  ".MCM......MCM...CC..",
  ".MMMMMMMMMMMM..CCCC.",
  ".MMEEMMMMEEMM..MMMM.",
  ".MMEEMMMMEEMM..MMMMM",
  "CCCCCCDDCCCCCC.MMMMM",
  "..CCCCCCCCCC..MMMMM.",
  "....MMCCMM...MMMMM..",
  "....MMCCMM..MMMMM...",
  "....MMMMMM.MMMMM....",
  "....DDMMDDMMMM......"
];
const PAL = { M: "#E2552B", C: "#FFF3E3", D: "#3B2520", E: "#3B2520" };
const EYES = [[3, 4], [9, 4]];
const MARK = {
  normal: [[0, 0], [1, 0], [0, 1], [1, 1]],
  blink: [[0, 1], [1, 1]],
  happy: [[-1, 1], [0, 0], [1, 0], [2, 1]],
  asleep: [[-1, 0], [0, 1], [1, 1], [2, 0]],
  glance: [[1, 0], [2, 0], [1, 1], [2, 1]]
};

const cv = document.getElementById("fox");
const ctx = cv.getContext("2d");
const CELL = 8;

function draw(mode) {
  const g = ROWS.map((r) => r.split(""));
  for (const [ox, oy] of EYES) {
    for (let dy = 0; dy < 2; dy++) {
      for (let dx = 0; dx < 2; dx++) {
        const x = ox + dx, y = oy + dy;
        if (g[y] && g[y][x] && g[y][x] !== ".") g[y][x] = "M";
      }
    }
    for (const [dx, dy] of MARK[mode]) {
      const x = ox + dx, y = oy + dy;
      if (g[y] && x >= 0 && x < g[y].length && g[y][x] !== ".") g[y][x] = "E";
    }
  }
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < g.length; y++) {
    for (let x = 0; x < g[y].length; x++) {
      const color = PAL[g[y][x]];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
}

const rain = document.getElementById("rain");
for (let i = 0; i < 14; i++) {
  const d = document.createElement("i");
  d.className = "drop";
  d.style.left = (6 + (i * 37) % 90) + "%";
  d.style.animationDelay = ((i * 0.17) % 1.1) + "s";
  d.style.opacity = String(0.35 + (i % 4) * 0.15);
  rain.appendChild(d);
}

const line = document.getElementById("line");
const enline = document.getElementById("enline");
const act = document.getElementById("act");
const phone = document.getElementById("phone");
const foxwrap = document.getElementById("foxwrap");
const actions = document.getElementById("actions");
const lang = document.getElementById("lang");

const COPY = {
  ring: ["电话响了。这一头只有它。", "The phone is ringing. Only the fox is here."],
  hello: ["「喂。」对面先没有声音。", "Hello. The other side is quiet."],
  window: ["那边说，外面也在下雨。先别挂。", "It's raining there too. Don't hang up yet."],
  lamp: ["那边说，灯还亮着就行。不用报名字。", "Leave the light on. No need to say a name."],
  quiet: ["那边没有催。它把眼睛眯起来听。", "Nobody rushes. It listens with its eyes nearly shut."],
  down: ["听筒放回去了。它还坐在窗台上。", "The receiver is down. The fox is still on the sill."]
};

let state = "ring";
let blinkOn = false;
let timer = 0;

function say(key) {
  line.textContent = COPY[key][0];
  enline.textContent = COPY[key][1];
}

function clearChoices() {
  actions.querySelectorAll(".choice").forEach((n) => n.remove());
}

function setEyes() {
  if (state === "ring") draw(blinkOn ? "blink" : "normal");
  else if (state === "hello") draw("glance");
  else if (state === "window" || state === "lamp") draw("happy");
  else if (state === "quiet") draw("asleep");
  else draw("normal");
}

function tick() {
  if (state !== "ring") return;
  blinkOn = !blinkOn;
  setEyes();
}

function go(next) {
  state = next;
  blinkOn = false;
  foxwrap.classList.toggle("hop", next === "ring");
  phone.classList.toggle("ring", next === "ring");
  clearChoices();
  if (next === "ring") {
    act.textContent = "接起来";
    act.hidden = false;
    say("ring");
  } else if (next === "hello") {
    act.hidden = true;
    say("hello");
    for (const [k, label] of [["window", "看窗外"], ["lamp", "把灯留着"], ["quiet", "先不说话"]]) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      b.textContent = label;
      b.addEventListener("click", () => go(k));
      actions.insertBefore(b, lang);
    }
  } else if (next === "down") {
    act.hidden = false;
    act.textContent = "再让它响一次";
    say("down");
  } else {
    act.hidden = false;
    act.textContent = "把听筒放回去";
    say(next);
  }
  setEyes();
}

act.addEventListener("click", () => {
  if (state === "ring") go("hello");
  else if (state === "down") go("ring");
  else go("down");
});
phone.addEventListener("click", () => {
  if (state === "ring") go("hello");
  else if (state !== "hello") go("down");
});
lang.addEventListener("click", () => {
  const on = document.body.classList.toggle("en");
  lang.setAttribute("aria-pressed", on ? "true" : "false");
});

draw("normal");
timer = setInterval(tick, 700);
</script>
</body>
</html>
