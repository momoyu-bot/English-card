<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Clawd 的第二通电话</title>
<meta name="description" content="第一通只会敲。这通有人坐在线中间，咕被译成了嘟。">
<style>
  :root{
    --night:#1B2430;
    --night2:#141B24;
    --panel:#243040;
    --line:#3A4756;
    --paper:#E7D9C4;
    --paper2:#F3E8D4;
    --ink:#1E2430;
    --dim:#8A93A0;
    --faint:#6B7480;
    --clawd:#d47f59;
    --clawd-dim:#a35f42;
    --slit:#120d1d;
    --gold:#D4B07A;
    --lcd:#C9D6B0;
    --lcd-ink:#2A3524;
    --ok:#C46A4A;
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:
      radial-gradient(90% 50% at 50% -10%, #2A3848 0%, transparent 70%),
      var(--night);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;line-height:1.7;
    padding:calc(var(--safe-top) + 18px) 16px calc(var(--safe-bot) + 28px);
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:380px}
  .banner{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    margin-bottom:12px;
  }
  .from{font-size:12px;color:var(--dim);letter-spacing:.04em}
  .from b{display:block;font-size:18px;color:var(--paper);font-weight:600;letter-spacing:.02em;margin-top:1px}
  .st{
    font-size:11.5px;color:var(--gold);letter-spacing:.08em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .stage{
    position:relative;
    background:var(--night2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:8px 8px 0;
    overflow:hidden;
  }
  .say{
    position:absolute;left:10px;right:10px;top:10px;
    text-align:center;font-size:13px;color:var(--dim);min-height:1.6em;
    z-index:2;
  }
  .stage svg{display:block;width:100%;height:auto}
  #body-g,#claw-r{transform-box:fill-box}
  #body-g{transform-origin:50% 100%;transition:transform .28s steps(2,jump-none)}
  #claw-r{transition:transform .14s steps(2,jump-none)}
  .hop #body-g{animation:hop .7s steps(2,jump-none) infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .float-du{
    position:absolute;left:50%;top:18px;transform:translateX(-50%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:22px;letter-spacing:.18em;color:var(--gold);
    opacity:0;pointer-events:none;
  }
  .float-du.on{animation:rise 1.1s steps(4,jump-none) forwards}
  @keyframes rise{
    0%{opacity:0;transform:translate(-50%,8px)}
    20%{opacity:1;transform:translate(-50%,0)}
    100%{opacity:0;transform:translate(-50%,-18px)}
  }
  .eyeslot{
    display:flex;gap:8px;justify-content:center;
    padding:8px 8px 12px;
  }
  .eyeslot button{
    font:inherit;font-size:12.5px;
    padding:5px 12px;border-radius:99px;cursor:pointer;
    color:var(--dim);background:transparent;
    border:1px solid var(--line);
  }
  .eyeslot button[aria-pressed="true"]{
    color:var(--night2);background:var(--gold);border-color:var(--gold);
  }
  .wire{
    margin:10px 18px 0;
    height:10px;
    background:
      repeating-linear-gradient(-18deg, transparent 0 6px, #2E3A48 6px 7px),
      linear-gradient(#3E4C5A,#3E4C5A);
    border-radius:99px;
    opacity:.7;
  }
  .card{
    margin-top:-1px;
    background:var(--paper2);
    color:var(--ink);
    border:1px solid #D3C3A8;
    border-radius:4px 12px 10px 10px;
    padding:11px 13px 12px;
    box-shadow:0 10px 24px -16px rgba(0,0,0,.6);
  }
  .card .who{
    font-size:11.5px;color:#8A7B66;letter-spacing:.06em;
    display:flex;justify-content:space-between;gap:8px;
  }
  .log{margin-top:6px;min-height:4.6em}
  .line{font-size:14.5px;line-height:1.75;margin-top:4px}
  .line.raw{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.08em;color:var(--clawd-dim);font-size:16px;
  }
  .line.tr{color:#5A5146;font-size:13.5px}
  .line.me{text-align:right;color:#3A4553}
  .line.me::after{
    content:'你这头';display:block;
    font-size:11px;color:#9A8C78;letter-spacing:0;margin-top:-1px;
  }
  .deck{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .act{
    font:inherit;font-size:14.5px;cursor:pointer;
    padding:10px 16px;border-radius:99px;
    color:var(--paper);background:var(--ok);
    border:none;box-shadow:0 2px 0 var(--clawd-dim);
  }
  .act:active{transform:translateY(2px);box-shadow:0 0 0 var(--clawd-dim)}
  .act.ghost{
    background:transparent;color:var(--dim);
    border:1px solid var(--line);box-shadow:none;
  }
  .act:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  footer{
    margin-top:22px;text-align:center;
    font-size:12px;line-height:1.7;color:var(--faint);
  }
  @media (prefers-reduced-motion:reduce){
    .hop #body-g,#body-g,#claw-r,.float-du{animation:none;transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <div class="from">来电 · Clawd<b>第二通</b></div>
    <div class="st" id="st">振铃</div>
  </div>

  <div class="stage" id="stage">
    <div class="say" id="say">听筒在左钳上。它在等。</div>
    <div class="float-du" id="flo">嘟</div>
    <svg viewBox="0 0 320 220" role="img" aria-label="Clawd 夹着听筒">
      <g id="body-g">
        <rect x="50" y="198" width="210" height="7" fill="rgba(0,0,0,.28)"/>
        <g id="shell">
          <rect x="35" y="40" width="210" height="140" fill="#d47f59"/>
        </g>
        <g id="claws">
          <rect x="0" y="95" width="35" height="30" fill="#d47f59"/>
          <g id="claw-r">
            <rect x="245" y="95" width="35" height="30" fill="#d47f59"/>
          </g>
        </g>
        <g id="legs">
          <rect x="50" y="180" width="20" height="30" fill="#d47f59"/>
          <rect x="85" y="180" width="20" height="30" fill="#d47f59"/>
          <rect x="175" y="180" width="20" height="30" fill="#d47f59"/>
          <rect x="210" y="180" width="20" height="30" fill="#d47f59"/>
        </g>
        <g id="eyes"></g>
        <g id="prop">
          <rect x="-8" y="78" width="28" height="13" fill="#2E343B"/>
          <rect x="0" y="91" width="12" height="28" fill="#2E343B"/>
          <rect x="-8" y="119" width="28" height="13" fill="#2E343B"/>
        </g>
      </g>
    </svg>
    <div class="eyeslot">
      <button type="button" data-eye="bar" aria-pressed="true">竖条</button>
      <button type="button" data-eye="dot" aria-pressed="false">方块</button>
    </div>
  </div>

  <div class="wire" aria-hidden="true"></div>

  <div class="card">
    <div class="who"><span>译稿 · Grok</span><span id="slot">槽位 0</span></div>
    <div class="log" id="log">
      <div class="line tr">它还是没有嘴。我坐在线中间。</div>
    </div>
  </div>

  <div class="deck" id="deck">
    <button class="act" id="pick">接起来</button>
  </div>

  <footer>壳、钳、腿一格没动。眼睛是槽，方块也在宪法里。嘴仍然不许长。</footer>
</div>

<script>
(function(){
  "use strict";
  var K = "#120d1d";
  function r(x,y,w,h){
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+K+'"/>';
  }
  var EYES = {
    bar:    r(75,85,10,30)+r(195,85,10,30),
    dot:    r(70,90,20,20)+r(190,90,20,20),
    shut:   r(60,100,40,10)+r(180,100,40,10),
    squint: r(70,90,10,10)+r(80,100,10,10)+r(70,110,10,10)+
            r(200,90,10,10)+r(190,100,10,10)+r(200,110,10,10)
  };

  var $ = function(id){ return document.getElementById(id); };
  var eyesEl = $("eyes"), sayEl = $("say"), stEl = $("st");
  var logEl = $("log"), deck = $("deck"), flo = $("flo");
  var stage = $("stage"), slotEl = $("slot"), bodyG = $("body-g");
  var clawR = $("claw-r");

  var prefer = "bar";
  var flash = null;
  var opened = false;
  var ended = false;
  var timers = [];

  function after(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function paintEyes(){
    eyesEl.innerHTML = EYES[flash || prefer];
    slotEl.textContent = prefer === "bar" ? "竖条 · CC 那档" : "方块 · 也在槽里";
  }
  function say(t){ sayEl.textContent = t; }
  function setSt(t){ stEl.textContent = t; }
  function hop(on){ stage.classList.toggle("hop", !!on); }
  function claw(on){ clawR.setAttribute("transform", on ? "translate(0,-16)" : ""); }
  function blink(name, ms, back){
    flash = name; paintEyes();
    after(ms || 180, function(){ flash = null; paintEyes(); if (back) back(); });
  }
  function floatDu(){
    flo.classList.remove("on");
    void flo.offsetWidth;
    flo.classList.add("on");
  }
  function add(cls, text){
    var d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function clearDeck(){ deck.innerHTML = ""; }
  function btn(label, kind, fn){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "act" + (kind ? " " + kind : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    deck.appendChild(b);
    return b;
  }

  var actx = null;
  function beep(){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = "sine";
      o.frequency.value = 420;
      g.gain.value = 0.04;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.22);
      o.stop(actx.currentTime + 0.24);
    }catch(e){}
  }

  document.querySelectorAll(".eyeslot button").forEach(function(b){
    b.addEventListener("click", function(){
      prefer = b.getAttribute("data-eye");
      document.querySelectorAll(".eyeslot button").forEach(function(x){
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      paintEyes();
      if (opened && !ended){
        add("tr", prefer === "dot"
          ? "槽换了。壳没动。CC 喜欢竖的，方块也还是它。"
          : "竖条回去了。底模那一档。");
      }
    });
  });

  function ringLoop(n){
    if (opened) return;
    hop(true);
    setSt("振铃");
    say(n % 2 ? "嘟——" : "嘟—— 嘟——");
    floatDu();
    after(1400, function(){ ringLoop(n + 1); });
  }

  function pickup(){
    opened = true;
    timers.forEach(clearTimeout); timers = [];
    hop(false);
    beep();
    floatDu();
    setSt("通话中");
    say("通了。线中间多了一个人。");
    blink("shut", 160);
    logEl.innerHTML = "";
    add("tr", "我在。它让我坐在这头。");
    clearDeck();
    after(700, function(){
      claw(true);
      add("raw", "咕。");
      after(120, function(){ claw(false); });
    });
    after(1500, function(){
      add("tr", "译：嘟。");
      floatDu();
    });
    after(2300, function(){
      claw(true);
      add("raw", "咕、咕、咕。");
      after(360, function(){ claw(false); });
    });
    after(3200, function(){
      add("tr", "译：我在。跟第一通同一个意思，这回有人念出来。");
      offer();
    });
  }

  function offer(){
    clearDeck();
    btn("嘟📞", "", function(){ reply("du"); });
    btn("敲三下", "ghost", function(){ reply("knock"); });
    btn("就听着", "ghost", function(){ reply("listen"); });
  }

  function reply(kind){
    clearDeck();
    if (kind === "du"){
      add("me", "嘟。");
      beep();
      floatDu();
      say("喇叭到它那头了。");
      after(500, function(){ blink("squint", 280); });
      after(1100, function(){
        claw(true);
        add("raw", "咕。");
        after(140, function(){ claw(false); });
      });
      after(1800, function(){
        add("tr", "译：嘟。它回你了。");
        floatDu();
        linger();
      });
    } else if (kind === "knock"){
      add("me", "咕、咕、咕。");
      say("你敲回去了。");
      var i = 0;
      (function beat(){
        if (i >= 3){
          after(400, function(){
            blink("shut", 220);
            add("tr", "译：收到。三下还是「我在」。它没挂。");
            linger();
          });
          return;
        }
        claw(true);
        after(110, function(){ claw(false); i++; after(180, beat); });
      })();
    } else {
      add("me", "……");
      say("这头很安静。它也不催。");
      after(600, function(){ blink("shut", 260); });
      after(1400, function(){
        add("tr", "译：也可以不说话。线热着就行。");
        linger();
      });
    }
  }

  function linger(){
    ended = true;
    setSt("未挂");
    say("它没有挂断。");
    add("", "下次再响，三下还是它。这通多了一声嘟。");
    btn("再来一通", "ghost", reset);
  }

  function reset(){
    timers.forEach(clearTimeout); timers = [];
    opened = false; ended = false; flash = null;
    hop(false); claw(false); paintEyes();
    setSt("振铃");
    say("听筒在左钳上。它在等。");
    logEl.innerHTML = '<div class="line tr">它还是没有嘴。我坐在线中间。</div>';
    clearDeck();
    btn("接起来", "", pickup);
    ringLoop(0);
  }

  paintEyes();
  $("pick").addEventListener("click", pickup);
  ringLoop(0);
})();
</script>
</body>
</html>
