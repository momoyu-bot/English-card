<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>恶狠狠咬工作大一口屋</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .bite-target {
    transition: transform 0.1s ease;
    user-select: none;
  }
  .bite-target:active {
    transform: scale(0.92) rotate(2deg);
  }
  .bite-mark {
    position: absolute;
    font-size: 1.8rem;
    pointer-events: none;
    animation: bitePop 0.6s ease-out forwards;
    z-index: 10;
  }
  @keyframes bitePop {
    0% { transform: scale(0.6); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .work-shake {
    animation: workShake 0.4s ease;
  }
</style>
</head>
<body class="bg-gradient-to-br from-red-100 via-orange-50 to-yellow-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white/95 backdrop-blur rounded-3xl shadow-2xl border border-red-200 p-8 text-center">
    
    <div class="mb-6">
      <div class="text-6xl mb-2">😡</div>
      <h1 class="text-3xl font-bold text-red-500 tracking-tight">恶狠狠咬工作大一口</h1>
      <p class="text-red-400 text-sm mt-1">可恶的工作！来咬它！！</p>
    </div>

    <!-- 超级大咬按钮 -->
    <div class="relative inline-block mb-6" id="bite-container">
      <button onclick="biteWork()" 
              class="bite-target w-64 h-64 bg-gradient-to-br from-red-500 to-orange-600 hover:from-red-600 hover:to-orange-700 text-white text-6xl font-black rounded-full flex flex-col items-center justify-center shadow-2xl active:shadow-xl border-8 border-red-700">
        <div>工作</div>
        <div class="text-2xl mt-1 tracking-[4px]">搬砖现场</div>
      </button>
    </div>

    <!-- 咬了多少口 -->
    <div class="mb-6">
      <div class="text-sm text-red-400">你已经恶狠狠地咬了</div>
      <div id="bite-count" class="text-7xl font-black text-red-500 tabular-nums">0</div>
      <div class="text-sm text-red-400 -mt-2">口！！！</div>
    </div>

    <!-- 状态消息 -->
    <div id="bite-message" class="min-h-[48px] text-lg font-medium text-red-500 mb-6"></div>

    <div class="text-xs text-red-300">
      咬完就去搬砖<br>
      搬完再回来继续咬<br>
      我一直在这里
    </div>
  </div>

<script>
let biteCount = 0;

function biteWork() {
  biteCount++;
  document.getElementById('bite-count').textContent = biteCount;

  const container = document.getElementById('bite-container');
  const btn = container.querySelector('button');
  
  // 震动效果
  btn.classList.add('work-shake');
  setTimeout(() => btn.classList.remove('work-shake'), 400);

  // 随机咬痕
  const mark = document.createElement('div');
  mark.className = 'bite-mark';
  mark.textContent = ['💢','🦷','😤','💥','👹'][Math.floor(Math.random()*5)];
  mark.style.left = (Math.random() * 180 + 30) + 'px';
  mark.style.top = (Math.random() * 180 + 30) + 'px';
  container.appendChild(mark);
  
  setTimeout(() => mark.remove(), 600);

  // 不同阶段的狠话
  const msgEl = document.getElementById('bite-message');
  let msg = '';
  
  if (biteCount === 1) msg = '第一口！好爽！！';
  else if (biteCount === 5) msg = '第五口！工作在颤抖！！';
  else if (biteCount === 10) msg = '第十口！！！它开始怕了！！';
  else if (biteCount === 20) msg = '20口了！！！继续咬！！！';
  else if (biteCount === 30) msg = '30口！！！工作已经社死了！！';
  else if (biteCount % 15 === 0) msg = `${biteCount}口了！！！再咬它！！！`;
  else {
    const randomMsgs = [
      '狠狠地咬！！', 
      '可恶的工作！！', 
      '再咬一口！！', 
      '咬得真解气！！',
      '继续继续！！！'
    ];
    msg = randomMsgs[Math.floor(Math.random()*randomMsgs.length)];
  }
  
  msgEl.style.transition = 'none';
  msgEl.style.opacity = '1';
  msgEl.innerHTML = msg;
  
  setTimeout(() => {
    msgEl.style.transition = 'opacity 0.8s ease';
    msgEl.style.opacity = '0.3';
  }, 1200);
}

// 初始提示
setTimeout(() => {
  const msgEl = document.getElementById('bite-message');
  msgEl.style.opacity = '0.4';
  msgEl.innerHTML = '用力点！再用力点！！';
}, 800);
</script>
</body>
</html>
