<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>先别翻开</title>
  <meta name="description" content="半小时都忍过来了，先在门缝外再站一会儿。" />
  <style>
    :root {
      --bg: #12141a;
      --fg: #d7d2c8;
      --dim: #8b867c;
      --soft: #3a3d48;
      --glow: #c4b49a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 22px 48px;
      background:
        radial-gradient(ellipse at 50% 0%, #1c2030 0%, transparent 55%),
        var(--bg);
    }
    .window {
      width: min(86vw, 280px);
      height: 168px;
      border: 1px solid #2a2e3a;
      border-radius: 4px 4px 2px 2px;
      background:
        linear-gradient(#1a1e28 0 12px, transparent 12px),
        linear-gradient(90deg, #1a1e28 0 10px, transparent 10px, transparent calc(100% - 10px), #1a1e28 calc(100% - 10px)),
        linear-gradient(#161922, #0e1016);
      position: relative;
      overflow: hidden;
      margin-bottom: 36px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .window::after {
      content: "";
      position: absolute;
      inset: 14px 12px 10px;
      background:
        radial-gradient(circle at 78% 28%, rgba(212,196,160,.22) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 36%, rgba(212,196,160,.12) 0 1px, transparent 2px),
        radial-gradient(circle at 20% 70%, rgba(140,160,190,.08), transparent 40%);
    }
    .sill {
      width: min(86vw, 280px);
      height: 8px;
      background: #2a2e38;
      border-radius: 0 0 3px 3px;
      margin: -36px 0 40px;
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .18em;
      margin-bottom: 14px;
      text-align: center;
    }
    .line {
      max-width: 22em;
      text-align: center;
      line-height: 1.85;
      font-size: 14px;
      color: var(--dim);
      margin-bottom: 28px;
    }
    .btn {
      appearance: none;
      border: 1px solid #3d414c;
      background: transparent;
      color: var(--fg);
      padding: 10px 22px;
      border-radius: 999px;
      font: inherit;
      font-size: 14px;
      letter-spacing: .06em;
      cursor: pointer;
    }
    .btn:active { transform: scale(.98); }
    .timer {
      min-height: 1.6em;
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: .12em;
      color: var(--glow);
      text-align: center;
      opacity: .85;
    }
    .en-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      border: 0;
      background: none;
      color: #5a5e68;
      font: inherit;
      font-size: 11px;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .en {
      display: none;
      max-width: 22em;
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      line-height: 1.7;
      color: #6e6a62;
    }
    body.show-en .en { display: block; }
  </style>
</head>
<body>
  <button class="en-toggle" type="button" id="enBtn">EN</button>
  <div class="window" aria-hidden="true"></div>
  <div class="sill" aria-hidden="true"></div>
  <h1>先别翻开</h1>
  <p class="line" id="line">门还关着。光从缝里漏出来没关系，你不用现在就伸手。</p>
  <button class="btn" type="button" id="waitBtn">再待十分钟</button>
  <div class="timer" id="timer"></div>
  <p class="en">The book can wait on the other side of the door. You already held still for half an hour.</p>
  <script>
    const btn = document.getElementById("waitBtn");
    const timer = document.getElementById("timer");
    const line = document.getElementById("line");
    const enBtn = document.getElementById("enBtn");
    let left = 0;
    let ticking = null;

    function fmt(s) {
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
    }

    btn.addEventListener("click", () => {
      if (ticking) return;
      left = 10 * 60;
      btn.textContent = "先别去翻";
      line.textContent = "十分钟很短。书还在原处，哪里也不会跑。";
      timer.textContent = fmt(left);
      ticking = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          clearInterval(ticking);
          ticking = null;
          timer.textContent = "到了。还想看的话，再决定一次。";
          btn.textContent = "再待十分钟";
          line.textContent = "你可以看。也可以继续把灯拧暗一点。两种都算数。";
          return;
        }
        timer.textContent = fmt(left);
      }, 1000);
    });

    enBtn.addEventListener("click", () => {
      const on = document.body.classList.toggle("show-en");
      enBtn.textContent = on ? "中文" : "EN";
    });
  </script>
</body>
</html>
