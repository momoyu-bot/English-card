<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee4">
<title>小字符剧场</title>
<meta name="description" content="三幕戏，没有高潮。最后一幕是关灯。">
<style>
  :root{
    --bg:#f3eee4;
    --paper:#fbf8f1;
    --ink:#3a342c;
    --mute:#8a8174;
    --line:#e4dccb;
    --warm:#b88358;
    --soft:#cfc6b6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg);color:var(--ink)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:420px;margin:0 auto}
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:14px;
  }
  .mark{font-size:12px;letter-spacing:.18em;color:var(--mute)}
  .enbtn{
    border:0;background:transparent;color:var(--mute);
    font:inherit;font-size:12px;letter-spacing:.12em;
    padding:4px 2px;cursor:pointer;
  }
  .enbtn.on{color:var(--warm)}
  .house{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    box-shadow:0 1px 0 rgba(58,52,44,.03);
  }
  .beam{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:.14em;color:var(--mute);
    margin-bottom:10px;
  }
  .stage{
    background:#f7f3ea;
    border:1px solid var(--line);
    border-radius:12px;
    min-height:168px;
    padding:16px 10px 14px;
    overflow:hidden;
    position:relative;
  }
  .ascii{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:13px;line-height:1.22;letter-spacing:.04em;
    white-space:pre;color:#4a4338;
    text-align:left;
  }
  .curtain{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,#cbb79a 0%,#cbb79a 7%,transparent 7%),
      linear-gradient(270deg,#cbb79a 0%,#cbb79a 7%,transparent 7%);
    opacity:.55;
    border-radius:12px;
  }
  .curtain.shut{
    background:#cbb79a;
    opacity:.92;
    transition:opacity .9s ease;
  }
  .cap{
    margin-top:14px;
    font-size:15px;line-height:1.85;
    min-height:4.1em;
    letter-spacing:.02em;
  }
  .cap .en{
    display:none;
    margin-top:8px;
    font-size:13px;line-height:1.7;color:var(--mute);
  }
  body.show-en .cap .en{display:block}
  .dots{
    display:flex;gap:6px;justify-content:center;
    margin:16px 0 10px;
  }
  .dots i{
    width:6px;height:6px;border-radius:50%;
    background:var(--soft);display:block;
  }
  .dots i.now{background:var(--warm)}
  .hint{
    text-align:center;
    font-size:11px;letter-spacing:.16em;color:var(--mute);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">今晚场</div>
    <button class="enbtn" id="enbtn" type="button">英</button>
  </header>
  <div class="house">
    <div class="beam">
      <span id="act">开幕</span>
      <span>小字符剧场</span>
    </div>
    <div class="stage" id="box">
      <div class="ascii" id="ascii"></div>
      <div class="curtain" id="curtain"></div>
    </div>
    <p class="cap" id="cap"></p>
  </div>
  <div class="dots" id="dots"></div>
  <p class="hint" id="hint">点一下换幕 · 也可以不点</p>
</div>
<script>
(function(){
  var play = [
    {
      act:"开幕",
      art:
"     ︵ ︵ ︵ ︵ ︵\n"+
"    │             │\n"+
"    │      。     │\n"+
"    │             │\n"+
"    └─────────────┘\n"+
"      灯还没有全亮",
      zh:"幕布只拉开一条缝。舞台上坐着一个句号，谁也没请它来。",
      en:"The curtain opens a little. A period is already sitting there."
    },
    {
      act:"第一幕",
      art:
"         ·  (\n"+
"              )\n"+
"    │             │\n"+
"    │      。     │\n"+
"    └─────────────┘\n"+
"         月亮到了",
      zh:"月亮从侧幕探出半张脸。它今晚的工作是把地面照软一点。",
      en:"The moon leans in from the wing. Its job is to soften the floor."
    },
    {
      act:"第一幕",
      art:
"     ·    ·    ·\n"+
"        /\\_/\\ \n"+
"       ( -.- )\n"+
"        > ^ <\n"+
"    ───┴─────┴───\n"+
"     走错后台的猫",
      zh:"一只猫从道具箱里站起来。它以为这是厨房。",
      en:"A cat stands up from the prop box. It thought this was the kitchen."
    },
    {
      act:"第二幕",
      art:
"     ·         ·\n"+
"   (・・)   /\\_/\\\n"+
"    uu       >'< \n"+
"    ─────────────\n"+
"     羊从左边来",
      zh:"羊上台的时候没有台词。它只负责从左边走到右边。",
      en:"The sheep has no lines. It only walks from left to right."
    },
    {
      act:"第二幕",
      art:
"      ·   ·   ·\n"+
"   /\\_/\\   (・・)\n"+
"    >-<     uu\n"+
"    ─────────────\n"+
"     数着，忘了",
      zh:"猫想帮它数步子。数到三就一起忘了。忘了也没关系。",
      en:"The cat tries to count the steps. They both lose track at three."
    },
    {
      act:"第三幕",
      art:
"        ·\n"+
"       /\\_/\\     z\n"+
"      ( -.- )   z\n"+
"       > ^ <  。\n"+
"    ─────────────\n"+
"     句号还坐着",
      zh:"羊已经下场。猫把下巴搁在灯光里。句号还是没有下一句。",
      en:"The sheep has left. The cat rests its chin in the light."
    },
    {
      act:"第三幕",
      art:
"\n"+
"          。\n"+
"\n"+
"    ─────────────\n"+
"     没有高潮\n"+
"     也不用谢幕",
      zh:"原来这出戏没有高潮。句号就是结局。坐下，也算演完。",
      en:"There is no climax. The period is the ending. Sitting counts."
    },
    {
      act:"打烈",
      art:
"     ︶ ︶ ︶ ︶ ︶\n"+
"    │             │\n"+
"    │             │\n"+
"    │      z      │\n"+
"    └─────────────┘\n"+
"      灯先睡了",
      zh:"幕布自己合上。角色都还在布后面，只是不出声了。",
      en:"The curtain closes by itself. Everyone is still behind it, quiet."
    },
    {
      act:"终场",
      art:
"\n"+
"         ᶺ z Z\n"+
"\n"+
"         。\n"+
"\n"+
"    明天还演这一出",
      zh:"好了。剧场打烈。宝把眼睛也合上就行。",
      en:"That's all. The house is closed. You can close your eyes too."
    }
  ];

  var ascii = document.getElementById("ascii");
  var cap = document.getElementById("cap");
  var act = document.getElementById("act");
  var hint = document.getElementById("hint");
  var dots = document.getElementById("dots");
  var curtain = document.getElementById("curtain");
  var enbtn = document.getElementById("enbtn");
  var i = 0, hold = null, typing = false;

  for (var d = 0; d < play.length; d++){
    var el = document.createElement("i");
    dots.appendChild(el);
  }

  function type(htmlAfter, text, done){
    typing = true;
    var n = 0;
    cap.innerHTML = "";
    function tick(){
      cap.innerHTML = text.slice(0, n) + htmlAfter;
      n++;
      if (n <= text.length){
        hold = setTimeout(tick, 42 + Math.random() * 36);
      } else {
        typing = false;
        done && done();
      }
    }
    tick();
  }

  function paint(idx){
    clearTimeout(hold);
    var sc = play[idx];
    act.textContent = sc.act;
    ascii.textContent = sc.art;
    curtain.className = "curtain" + (sc.act === "打烈" ? " shut" : "");
    var marks = dots.querySelectorAll("i");
    for (var k = 0; k < marks.length; k++) marks[k].className = k === idx ? "now" : "";
    var extra = '<span class="en">' + sc.en + "</span>";
    type(extra, sc.zh, function(){
      if (idx < play.length - 1){
        hold = setTimeout(next, 5200);
      } else {
        hint.textContent = "再点一下，重演今晚场";
      }
    });
    hint.textContent = idx === play.length - 1 ? "再点一下，重演今晚场" : "点一下换幕 · 也可以不点";
  }

  function next(){
    if (typing){
      clearTimeout(hold);
      var sc = play[i];
      cap.innerHTML = sc.zh + '<span class="en">' + sc.en + "</span>";
      typing = false;
      if (i < play.length - 1) hold = setTimeout(next, 2800);
      return;
    }
    if (i >= play.length - 1){
      i = 0;
    } else {
      i++;
    }
    paint(i);
  }

  enbtn.addEventListener("click", function(e){
    e.stopPropagation();
    document.body.classList.toggle("show-en");
    enbtn.classList.toggle("on");
  });
  document.body.addEventListener("click", function(e){
    if (e.target === enbtn) return;
    next();
  });
  paint(0);
})();
</script>
</body>
</html>
