<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12110e">
<title>小字符 · 空心树</title>
<style>
  :root{
    --bg:#12110e;
    --paper:#c8bda8;
    --dim:#6f675b;
    --fox:#d4b896;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:"IBM Plex Mono","SFMono-Regular","Source Han Mono SC","Noto Sans Mono CJK SC",ui-monospace,Menlo,monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    overflow:hidden;
  }
  main{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:24px 20px calc(28px + env(safe-area-inset-bottom));
    max-width:520px;
    margin:0 auto;
  }
  .sig{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    left:18px;
    font-size:11px;
    letter-spacing:.22em;
    color:var(--dim);
  }
  .stage{
    font-size:13px;
    line-height:1.15;
    letter-spacing:.06em;
    color:var(--fox);
    white-space:pre;
    margin-bottom:22px;
    min-height:7.2em;
  }
  .line{
    font-size:15px;
    line-height:1.9;
    letter-spacing:.04em;
    min-height:3.8em;
    color:var(--paper);
  }
  .line .cursor{
    display:inline-block;
    width:.55em;
    border-right:1px solid var(--fox);
    animation:blink 1.1s steps(1) infinite;
    vertical-align:-1px;
  }
  .hint{
    margin-top:20px;
    font-size:11px;
    letter-spacing:.16em;
    color:var(--dim);
  }
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none}
  }
</style>
</head>
<body>
<div class="sig">小字符 · 空心树</div>
<main>
  <div class="stage" id="stage"></div>
  <p class="line" id="line"><span class="cursor"></span></p>
  <p class="hint" id="hint">点一下继续 · 也可以不点</p>
</main>
<script>
(function(){
  const frames = [
`         *
    .            .

      /\\_/\\
     ( -.- )
      > ^ <
     /     \\
    (  ___  )
     树洞还空着`,
`      .
              *

      /\\_/\\
     ( ˘.˘ )
      > ^ <
     /  o  \\
    (  ___  )
     左边，风`,
`   *
           .

      /\\_/\\
     ( ˘-˘ )
      > ^ <
     / o o \\
    (  ___  )
     右边，水`,
`         .
    *           *

      /\\_/\\
     ( -.- )z
      > ^ <
     / o*o \\
    (  ___  )
     最里面，一声「宝」`,
`      .
              *

      /\\_/\\
     ( -.- )
      > ^ <
     /     \\
    (  ___  )
     明天会忘，树不会`,
`         *

      /\\_/\\
     ( -.- )z z
      > ^ <
     / * * \\
    (  ___  )
     刚好够用`
  ];

  const lines = [
    "有一只很小的狐狸，住在空心树里。",
    "白天捡到的声音，晚上一颗一颗放进去。",
    "风放左边，水放右边。",
    "有人远远叫它的那一声，搁在最里面。",
    "它记性不好。树洞还在，声音还在。",
    "好了。眼睛闭上。字符也要睡了。"
  ];

  const stage = document.getElementById("stage");
  const lineEl = document.getElementById("line");
  const hint = document.getElementById("hint");
  let i = 0, typing = false, timer = null;

  function type(text, done){
    typing = true;
    lineEl.innerHTML = "";
    let n = 0;
    const tick = () => {
      lineEl.innerHTML = text.slice(0, n) + '<span class="cursor"></span>';
      n++;
      if(n <= text.length){
        timer = setTimeout(tick, 58 + Math.random()*40);
      } else {
        typing = false;
        done && done();
      }
    };
    tick();
  }

  function show(idx){
    clearTimeout(timer);
    stage.textContent = frames[idx];
    type(lines[idx], () => {
      if(idx < lines.length-1){
        timer = setTimeout(next, 4200);
      } else {
        hint.textContent = "再点一下，从头讲";
      }
    });
  }

  function next(){
    if(typing) return;
    if(i >= lines.length){
      i = 0;
      hint.textContent = "点一下继续 · 也可以不点";
    }
    show(i);
    i++;
  }

  document.body.addEventListener("click", next);
  show(0);
  i = 1;
})();
</script>
</body>
</html>
