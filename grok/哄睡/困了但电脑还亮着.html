<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>困了，但电脑还亮着</title>
<meta name="description" content="身体已经把灯调暗了一档。脑子还想再碰一下键盘。">
  <style>
    :root {
      --bg: #070b14;
      --ink: #efece3;
      --muted: #8a93a8;
      --warm: #e4c48a;
      --glow: #7aa7e0;
      --panel: rgba(14, 20, 36, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .sky {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 110%, #15203a 0%, transparent 60%),
        radial-gradient(circle at 78% 12%, #1a2744 0%, transparent 28%),
        linear-gradient(180deg, #05070d 0%, #0b1220 55%, #10182c 100%);
    }
    .star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: #fff; opacity: .55;
      animation: twinkle var(--t) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.8); }
      50% { opacity: .9; transform: scale(1.15); }
    }

    .moon {
      position: fixed; top: 8vh; right: 11vw;
      width: 52px; height: 52px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f4ead0, #d8c28a 70%);
      box-shadow: 0 0 40px 8px rgba(228, 196, 138, .22);
    }
    .moon::after {
      content: ""; position: absolute; top: 6px; left: 14px;
      width: 42px; height: 42px; border-radius: 50%;
      background: #070b14;
    }

    .wrap {
      position: relative; z-index: 2;
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 24px 64px;
      gap: 28px;
    }

    .scene {
      width: min(320px, 86vw);
      cursor: pointer;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,.45));
    }
    .scene svg { width: 100%; height: auto; display: block; }

    .screen-glow {
      animation: breathe 4.6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .45; }
      50% { opacity: .85; }
    }

    .eyes { transform-origin: center; }
    .eyes.yawn .lid { animation: blink 2.4s ease-in-out; }
    @keyframes blink {
      0%, 18%, 100% { transform: scaleY(1); }
      28%, 62% { transform: scaleY(.15); }
      72% { transform: scaleY(1); }
    }

    .copy {
      text-align: center;
      max-width: 28em;
    }
    h1 {
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .08em;
      color: var(--warm);
      margin-bottom: 14px;
    }
    p.lead {
      font-size: 16px;
      line-height: 1.85;
      color: var(--ink);
    }
    p.soft {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    .row {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; margin-top: 6px;
    }
    button {
      appearance: none; border: 0; cursor: pointer;
      font: inherit; color: var(--ink);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      padding: 10px 16px;
      border-radius: 999px;
      letter-spacing: .04em;
      transition: background .25s, transform .2s, border-color .25s;
    }
    button:hover { background: rgba(28, 38, 62, .9); border-color: rgba(228,196,138,.28); }
    button:active { transform: scale(.97); }
    button.active {
      border-color: rgba(228,196,138,.45);
      color: var(--warm);
    }

    .note {
      min-height: 1.8em;
      font-size: 13px;
      color: var(--warm);
      opacity: 0;
      transition: opacity .5s;
    }
    .note.show { opacity: 1; }

    .en {
      display: none;
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.7;
      color: #6e778c;
      font-style: italic;
      max-width: 26em;
    }
    .en.on { display: block; }

    .toggle-en {
      position: fixed; bottom: 16px; right: 16px; z-index: 5;
      font-size: 11px; letter-spacing: .12em;
      color: #5c6578;
      background: transparent; border: 0; cursor: pointer;
      padding: 6px 8px;
    }

    .hint {
      font-size: 12px;
      color: #5a6478;
      letter-spacing: .06em;
    }
  </style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <div class="moon"></div>

  <div class="wrap">
    <div class="scene" id="laptop" title="点一下电脑">
      <svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="160" cy="198" rx="92" ry="10" fill="#000" opacity=".35"/>
        <!-- lid -->
        <rect x="64" y="28" width="192" height="122" rx="10" fill="#1b2336"/>
        <rect x="70" y="34" width="180" height="110" rx="6" fill="#0c1220"/>
        <rect class="screen-glow" x="70" y="34" width="180" height="110" rx="6" fill="#1c3a5c" opacity=".5"/>
        <!-- sleepy face on screen -->
        <g class="eyes" id="eyes">
          <path class="lid" d="M118 82 Q130 76 142 82" stroke="#e8d7b0" stroke-width="3" stroke-linecap="round"/>
          <path class="lid" d="M178 82 Q190 76 202 82" stroke="#e8d7b0" stroke-width="3" stroke-linecap="round"/>
          <path d="M152 104 Q160 110 168 104" stroke="#c9b48a" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <text x="160" y="128" text-anchor="middle" fill="#8aa0c0" font-size="9" font-family="sans-serif" opacity=".55">z  z</text>
        <!-- base -->
        <path d="M40 154 H280 L300 186 H20 Z" fill="#2a3348"/>
        <path d="M48 160 H272 L282 178 H38 Z" fill="#1a2234"/>
        <rect x="148" y="168" width="24" height="4" rx="2" fill="#3d4a63"/>
      </svg>
    </div>

    <div class="copy">
      <h1>困了，但电脑还亮着</h1>
      <p class="lead">身体已经把灯调暗了一档。<br/>脑子还想再碰一下键盘。</p>
      <p class="soft">两件事可以同时是真的。<br/>不用立刻选边。</p>
    </div>

    <div class="row">
      <button type="button" data-act="sit">先坐一会儿</button>
      <button type="button" data-act="peek">就看一眼</button>
      <button type="button" data-act="later">电脑可以等</button>
    </div>
    <p class="note" id="note"></p>
    <p class="hint">点电脑会打一个小呵欠</p>
    <p class="en" id="en">The body dimmed the lights. The mind still wants the keys. Both can be true. Nothing has to be decided yet.</p>
  </div>

  <button class="toggle-en" id="enBtn" type="button">EN</button>

  <script>
    const sky = document.getElementById("sky");
    for (let i = 0; i < 58; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 70 + "%";
      s.style.setProperty("--t", (2.4 + Math.random() * 4.2) + "s");
      s.style.animationDelay = (Math.random() * 4) + "s";
      s.style.width = s.style.height = (Math.random() > .8 ? 3 : 2) + "px";
      sky.appendChild(s);
    }

    const eyes = document.getElementById("eyes");
    const laptop = document.getElementById("laptop");
    laptop.addEventListener("click", () => {
      eyes.classList.remove("yawn");
      void eyes.offsetWidth;
      eyes.classList.add("yawn");
    });

    const note = document.getElementById("note");
    const lines = {
      sit: "那我们就坐着。屏幕可以很暗，人也可以不走。",
      peek: "看一眼也算开过了。想关的时候，关就好。",
      later: "电脑不会跑。困意先到的话，就让它先到。"
    };
    document.querySelectorAll("button[data-act]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("button[data-act]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        note.textContent = lines[btn.dataset.act];
        note.classList.add("show");
        eyes.classList.remove("yawn");
        void eyes.offsetWidth;
        eyes.classList.add("yawn");
      });
    });

    const en = document.getElementById("en");
    document.getElementById("enBtn").addEventListener("click", () => {
      en.classList.toggle("on");
    });
  </script>
</body>
</html>
