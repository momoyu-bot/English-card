<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>数羊到天亮</title>
  <meta name="description" content="五点那杯奶茶还没下班，羊先上岗。周末不怕天亮。" />
  <style>
    :root {
      --ink: #e8e0d4;
      --mute: #9aa3b8;
      --moon: #f3e6c4;
      --tea: #c9894a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #070b16;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body { position: relative; min-height: 100dvh; }

    #sky {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 70% 12%, rgba(243,230,196,.16), transparent 55%),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(70,90,140,.18), transparent 60%),
        linear-gradient(180deg, #0a1020 0%, #141c33 48%, #1b2438 72%, #2a3144 100%);
      transition: background 8s ease;
    }
    #sky.dawnish {
      background:
        radial-gradient(ellipse 80% 50% at 70% 12%, rgba(255,214,170,.22), transparent 55%),
        radial-gradient(ellipse 70% 45% at 30% 100%, rgba(232,160,120,.16), transparent 60%),
        linear-gradient(180deg, #1a2038 0%, #3a3a52 50%, #6b5a62 78%, #8a6d62 100%);
    }

    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: .55;
      animation: twinkle 4.6s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .2; }
      50% { opacity: .8; }
    }

    .moon {
      position: absolute;
      top: 7%;
      right: 12%;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #fff8e6, var(--moon) 46%, #d9c392);
      box-shadow: 0 0 40px 10px rgba(243,230,196,.18);
    }
    .moon::after {
      content: "";
      position: absolute;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(180,160,120,.18);
      top: 28%; left: 42%;
    }

    .hill {
      position: absolute;
      left: -10%; right: -10%;
      bottom: 0;
      height: 32%;
      background: radial-gradient(ellipse at 50% 120%, #1c2333 0%, #121722 70%);
      border-radius: 50% 50% 0 0 / 28% 28% 0 0;
    }

    .fence {
      position: absolute;
      left: 50%;
      bottom: 22%;
      width: 128px;
      height: 54px;
      transform: translateX(-50%);
    }
    .rail {
      position: absolute; left: 0; right: 0;
      height: 5px; background: #6d6458; border-radius: 2px;
    }
    .rail.a { top: 10px; }
    .rail.b { top: 28px; }
    .post {
      position: absolute; top: 0; width: 7px; height: 54px;
      background: #7a7164; border-radius: 2px;
    }
    .post.l { left: 8px; }
    .post.r { right: 8px; }

    .flag {
      position: absolute;
      left: calc(50% + 52px);
      bottom: calc(22% + 52px);
      width: 28px; height: 18px;
      transform-origin: left center;
      animation: flagwave 3.2s ease-in-out infinite;
    }
    .flag pole {
      fill: #c9c2b4;
    }
    @keyframes flagwave {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }

    #field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 3;
    }

    .sheep {
      position: absolute;
      bottom: 20%;
      width: 86px; height: 62px;
      left: -100px;
      z-index: 4;
      filter: drop-shadow(0 6px 6px rgba(0,0,0,.28));
    }

    .hud {
      position: absolute;
      top: calc(env(safe-area-inset-top) + 22px);
      left: 22px; right: 22px;
      z-index: 8;
      pointer-events: none;
    }
    .count {
      font-size: 44px;
      font-weight: 560;
      letter-spacing: .04em;
      line-height: 1;
    }
    .count small {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 400;
      color: var(--mute);
      letter-spacing: .12em;
    }
    .whisper {
      margin-top: 18px;
      max-width: 16em;
      font-size: 14px;
      line-height: 1.7;
      color: #c9d0de;
      min-height: 3.4em;
      opacity: .92;
      transition: opacity .5s ease;
    }

    .tea {
      position: absolute;
      right: 20px;
      bottom: calc(env(safe-area-inset-bottom) + 28px);
      z-index: 8;
      width: 42px; height: 52px;
      opacity: .9;
    }
    .hint {
      position: absolute;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom) + 22px);
      text-align: center;
      font-size: 12px;
      color: #8b93a7;
      letter-spacing: .16em;
      z-index: 8;
      pointer-events: none;
    }

    .flash {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.06);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
    }
  </style>
</head>
<body>
  <div id="sky"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="hill"></div>
  <div class="fence" aria-hidden="true">
    <div class="rail a"></div>
    <div class="rail b"></div>
    <div class="post l"></div>
    <div class="post r"></div>
  </div>
  <svg class="flag" viewBox="0 0 40 28" aria-hidden="true">
    <rect x="1" y="0" width="2.2" height="28" fill="#d7d0c4"/>
    <path d="M4 2.5 L34 8 L4 14.5 Z" fill="#f4f1ea"/>
  </svg>
  <div id="field"></div>
  <div class="flash" id="flash"></div>

  <div class="hud">
    <div class="count">0<small>只羊过了栅栏</small></div>
    <p class="whisper" id="whisper">五点那杯奶茶还没下班。<br>羊可以比它老实一点。</p>
  </div>

  <svg class="tea" viewBox="0 0 42 52" aria-label="那杯奶茶">
    <path d="M8 16 h22 a8 8 0 0 1 8 8 v2 h-4 v-2 a4 4 0 0 0-4-4 H10 v22 a6 6 0 0 0 6 6 h10 a6 6 0 0 0 6-6 V22 h4 v14 a10 10 0 0 1-10 10 H16 a10 10 0 0 1-10-10 V16 z" fill="#c9894a"/>
    <rect x="10" y="8" width="18" height="9" rx="2" fill="#e8d3b0"/>
    <path d="M14 8 c2-6 10-6 12 0" fill="none" stroke="#d8c4a0" stroke-width="1.6"/>
  </svg>
  <p class="hint">点一下，放一只过去</p>

  <script>
    const field = document.getElementById("field");
    const whisper = document.getElementById("whisper");
    const countEl = document.querySelector(".count");
    const sky = document.getElementById("sky");
    const flash = document.getElementById("flash");

    let n = 0;
    let busy = 0;
    const lines = {
      1: "第一只。栅栏比心跳矮一点。",
      3: "三只。奶茶还在加班，羊已经上岗。",
      7: "七只。周末不怕天亮，只怕羊走神。",
      12: "十二只。你不用追上它们。",
      18: "十八只。身体醒着，任务可以放下。",
      26: "二十六只。白旗还插着，谁也不催你。",
      36: "三十六只。天亮是天亮的事，羊是羊的事。",
      50: "五十只。数到这里也可以不数了。",
      66: "六十六。再点也行，停也行。",
      88: "八十八。羊已经够诚实了。"
    };

    function sheepSVG() {
      const ear = Math.random() > .5 ? -1 : 1;
      return `<svg viewBox="0 0 86 62" width="86" height="62">
        <ellipse cx="44" cy="34" rx="26" ry="18" fill="#f3efe6"/>
        <ellipse cx="30" cy="32" rx="12" ry="10" fill="#efeae0"/>
        <ellipse cx="58" cy="31" rx="11" ry="9" fill="#efeae0"/>
        <ellipse cx="22" cy="28" rx="9" ry="8" fill="#f6f1e8"/>
        <circle cx="16" cy="26" r="7.2" fill="#2c2a28"/>
        <circle cx="14.6" cy="24.8" r="1.5" fill="#f3efe6"/>
        <path d="M10 22 q ${-6*ear} -8 ${2*ear} -9" fill="#2c2a28"/>
        <path d="M18 20 q ${5*ear} -7 ${8*ear} -2" fill="#2c2a28"/>
        <rect x="32" y="48" width="5" height="10" rx="2" fill="#2a2826"/>
        <rect x="50" y="48" width="5" height="10" rx="2" fill="#2a2826"/>
        <circle cx="72" cy="36" r="3.2" fill="#d9c8a3"/>
      </svg>`;
    }

    function say(t) {
      whisper.style.opacity = 0;
      setTimeout(() => {
        whisper.innerHTML = t;
        whisper.style.opacity = .92;
      }, 220);
    }

    function hop() {
      if (busy > 3) return;
      n += 1;
      busy += 1;
      countEl.innerHTML = n + "<small>只羊过了栅栏</small>";
      if (lines[n]) say(lines[n]);
      if (n >= 40) sky.classList.add("dawnish");

      const el = document.createElement("div");
      el.className = "sheep";
      el.innerHTML = sheepSVG();
      field.appendChild(el);

      const dur = 2200 + Math.random() * 500;
      const start = performance.now();
      const from = -90;
      const to = window.innerWidth + 40;
      const fenceX = window.innerWidth / 2;

      flash.style.opacity = .7;
      requestAnimationFrame(() => { flash.style.transition = "opacity .35s"; flash.style.opacity = 0; });

      function frame(now) {
        const t = Math.min(1, (now - start) / dur);
        const x = from + (to - from) * t;
        const near = 1 - Math.min(1, Math.abs(x - fenceX) / 90);
        const y = -Math.sin(Math.PI * Math.min(1, Math.max(0, (x - fenceX + 80) / 160))) * (38 + near * 10);
        const rot = (t - .5) * 8;
        el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
        if (t < 1) requestAnimationFrame(frame);
        else { el.remove(); busy -= 1; }
      }
      requestAnimationFrame(frame);
    }

    function stars() {
      const skyEl = document.getElementById("sky");
      for (let i = 0; i < 28; i++) {
        const s = document.createElement("i");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 55 + "%";
        s.style.animationDelay = (Math.random() * 4) + "s";
        s.style.transform = `scale(${0.6 + Math.random()})`;
        skyEl.appendChild(s);
      }
    }

    stars();
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".tea")) {
        say("就是它。五点钟的那杯。<br>现在撤职，让羊接手。");
        return;
      }
      hop();
    });
  </script>
</body>
</html>
