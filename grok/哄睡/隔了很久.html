<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EDE4">
<title>隔了很久</title>
<meta name="description" content="嘟嘟机凉了很久。按喇叭，这头还接。不接也留一句。">
<style>
:root {
  --color-paper: #f3ede4;
  --color-paper-deep: #e7dfd2;
  --color-ink: #2c281f;
  --color-quiet: #7a7266;
  --color-faint: #a89f93;
  --color-sheet: #fbf7f0;
  --color-edge: #d4c9b8;
  --color-horn: #c2786c;
  --color-horn-ink: #fbf7f0;
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", Georgia, serif;
  color-scheme: light;
}
html.night {
  --color-paper: #1a1714;
  --color-paper-deep: #141210;
  --color-ink: #ede6d9;
  --color-quiet: #9a9186;
  --color-faint: #6e675e;
  --color-sheet: #24201c;
  --color-edge: #3a342c;
  --color-horn: #d4897c;
  --color-horn-ink: #1a1714;
  color-scheme: dark;
}

  html {
    height: 100%;
  }
  body {
    min-height: 100%;
    margin: 0;
    background: linear-gradient(180deg, var(--color-paper), var(--color-paper-deep));
    color: var(--color-ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
  }
  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }
  button {
    touch-action: manipulation;
  }


.wrap {
  width: 100%;
  max-width: 23.5rem;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(env(safe-area-inset-top) + 1.15rem) 1.25rem calc(env(safe-area-inset-bottom) + 1.1rem);
  box-sizing: border-box;
}

.top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.top h1 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: 0.18em;
}
.clock {
  margin: 0;
  min-width: 3rem;
  text-align: right;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  color: var(--color-faint);
  font-variant-numeric: tabular-nums;
}

.rig {
  position: relative;
  width: 11.5rem;
  margin-top: 0.85rem;
}
.rig.ringing {
  animation: jitter 0.72s ease-in-out infinite;
}
.waves {
  position: absolute;
  inset: 0.75rem -1rem auto;
  height: 4.5rem;
  pointer-events: none;
}
.waves i {
  position: absolute;
  top: 0.35rem;
  width: 2.25rem;
  height: 3.4rem;
  border: 1.5px solid var(--color-horn);
  border-radius: 999px;
  opacity: 0;
}
.waves i:nth-child(1) {
  left: -0.25rem;
}
.waves i:nth-child(2) {
  left: -0.9rem;
}
.waves i:nth-child(3) {
  right: -0.25rem;
}
.waves.on i {
  animation: wave 1.8s ease-out infinite;
}
.waves.on i:nth-child(2) {
  animation-delay: 0.22s;
}

.handset {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  width: 9.25rem;
  height: 2.9rem;
  margin: 0 auto;
  padding: 0;
  border: 1px solid var(--color-edge);
  background: var(--color-sheet);
  border-radius: 999px;
  color: inherit;
  box-shadow: 0 6px 14px color-mix(in srgb, var(--color-ink) 10%, transparent);
  transform-origin: 86% 80%;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.handset.up {
  transform: translate(0.5rem, -1.7rem) rotate(-12deg);
}
.cup {
  width: 2rem;
  height: 2.35rem;
  margin: 0 0.25rem;
  border-radius: 0.9rem;
  background: var(--color-paper-deep);
  border: 1px solid var(--color-edge);
}
.bar {
  flex: 1;
  height: 0.75rem;
  border-radius: 999px;
  background: var(--color-edge);
}
.cradle {
  width: 6.8rem;
  height: 0.5rem;
  margin: -0.3rem auto 0;
  border-radius: 999px;
  background: var(--color-edge);
  opacity: 0.55;
}

.shell {
  margin-top: 0.5rem;
  padding: 0.9rem 0.9rem 1rem;
  border-radius: 2rem;
  background: var(--color-sheet);
  border: 1px solid var(--color-edge);
  box-shadow: 0 16px 36px color-mix(in srgb, var(--color-ink) 12%, transparent);
}
.led-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
}
.led {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 999px;
  background: var(--color-horn);
  opacity: 0.22;
  flex: none;
}
.led.on {
  animation: blink 0.78s ease-in-out infinite;
}
.led.talk {
  animation: pulse 3.2s ease-in-out infinite;
}
.lcd {
  flex: 1;
  height: 1.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0.5rem;
  border: 1px solid var(--color-edge);
  background: var(--color-paper-deep);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  color: var(--color-quiet);
}

.horn {
  position: relative;
  display: block;
  width: 6.75rem;
  height: 6.75rem;
  margin: 0.1rem auto 0;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: 999px;
  color: inherit;
}
.horn-ring {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  border: 7px solid var(--color-horn);
  background: var(--color-paper-deep);
}
.horn-face {
  position: absolute;
  inset: 1.15rem;
  border-radius: 999px;
  background: var(--color-sheet);
  border: 1px solid var(--color-edge);
  transition: transform 0.12s ease;
}
.horn-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0.9rem;
  height: 0.9rem;
  border-radius: 999px;
  background: var(--color-horn);
  transform: translate(-50%, -50%);
}
.horn.pulse .horn-ring {
  animation: hp 1.4s ease-out infinite;
}
.horn.down .horn-face {
  transform: scale(0.92);
}
.horn-cap {
  margin: 0.4rem 0 0.65rem;
  text-align: center;
  font-size: 0.7rem;
  letter-spacing: 0.28em;
  color: var(--color-faint);
}
.du-pop {
  position: absolute;
  left: 50%;
  top: -0.35rem;
  pointer-events: none;
  font-family: var(--font-serif);
  font-size: 1.25rem;
  letter-spacing: 0.24em;
  color: var(--color-horn);
  animation: duUp 0.55s ease forwards;
}
.keys {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.45rem 0.5rem;
  padding: 0 0.35rem;
}
.key {
  height: 1.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 1px solid var(--color-edge);
  color: var(--color-faint);
  font-size: 0.65rem;
}

.stage {
  width: 100%;
  min-height: 7.2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 0.9rem;
}
.kicker {
  margin: 0;
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  color: var(--color-faint);
}
.kicker.gap {
  margin-top: 0.75rem;
}
.who {
  margin: 0.45rem 0 0;
  font-family: var(--font-serif);
  font-size: 1.45rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-wrap: balance;
}
.who.quiet {
  color: var(--color-quiet);
  font-size: 1.25rem;
}
.who.small {
  font-size: 1.25rem;
}
.tag {
  margin: 0.4rem 0 0;
  max-width: 18em;
  font-size: 0.85rem;
  line-height: 1.6;
  color: var(--color-quiet);
}
.dudu {
  margin: 0.85rem 0 0;
  height: 1.15rem;
  font-size: 0.85rem;
  letter-spacing: 0.42em;
  color: var(--color-horn);
}
.dudu span {
  display: inline-block;
  opacity: 0.22;
  animation: dudu 1.56s ease-in-out infinite;
}
.dudu span:nth-child(2) {
  animation-delay: 0.26s;
}
.dudu span:nth-child(3) {
  animation-delay: 0.52s;
}
.timer {
  margin: 0.35rem 0 0;
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  color: var(--color-faint);
  font-variant-numeric: tabular-nums;
}
.lines {
  margin: 0.85rem 0 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  align-items: center;
}
.line {
  font-size: 1.05rem;
  line-height: 1.8;
  max-width: 18em;
  animation: rise 0.4s ease both;
}
.line.aside {
  color: var(--color-quiet);
  font-size: 0.95rem;
}
.line.fade {
  opacity: 0.34;
}
.en {
  display: none;
  margin-top: 0.15rem;
  font-size: 0.8rem;
  font-style: italic;
  color: var(--color-quiet);
  line-height: 1.5;
}
html.en-on .en {
  display: block;
}
.hint {
  margin: 0.75rem 0 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--color-faint);
  font: inherit;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  min-height: 2.75rem;
}
.note {
  margin: 0.85rem 0 0;
  max-width: 18em;
  text-align: left;
  padding: 0.75rem 0.9rem;
  border-radius: 1rem;
  background: var(--color-sheet);
  border: 1px solid var(--color-edge);
  font-size: 0.95rem;
  line-height: 1.8;
}

.acts {
  display: flex;
  gap: 1.1rem;
  align-items: flex-start;
  justify-content: center;
  min-height: 4.6rem;
  margin-top: 0.85rem;
}
.knob {
  border: 0;
  background: none;
  font: inherit;
  color: var(--color-quiet);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 0;
}
.knob i {
  width: 3.5rem;
  height: 3.5rem;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-sheet);
  border: 1px solid var(--color-edge);
  font-style: normal;
}
.knob.go i {
  background: var(--color-ink);
  border-color: transparent;
  color: var(--color-sheet);
}
.knob.off i {
  background: var(--color-horn);
  border-color: transparent;
  color: var(--color-horn-ink);
}
.knob:active i {
  transform: scale(0.96);
}
.knob b {
  font-weight: 400;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
}
.flip {
  transform: rotate(135deg);
}
.txt {
  border: 1px solid var(--color-edge);
  background: var(--color-sheet);
  color: var(--color-ink);
  font: inherit;
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  padding: 0.7rem 1.15rem;
  min-height: 2.75rem;
  border-radius: 999px;
}
.txt.solid {
  background: var(--color-ink);
  color: var(--color-sheet);
  border-color: transparent;
}
.txt:active {
  opacity: 0.7;
}

.log {
  width: 100%;
  margin: 0.35rem 0 0;
  padding: 0;
  list-style: none;
  min-height: 1.2rem;
}
.log li {
  display: flex;
  gap: 0.5rem;
  font-size: 0.7rem;
  color: var(--color-faint);
  line-height: 1.6;
}
.log li span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.foot {
  margin-top: auto;
  padding-top: 0.6rem;
  display: flex;
  gap: 0.25rem;
  align-items: center;
  justify-content: center;
}
.foot button {
  border: 0;
  background: none;
  color: var(--color-quiet);
  font: inherit;
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  height: 2.75rem;
  padding: 0 0.75rem;
}

@keyframes jitter {
  0%,
  100% {
    transform: none;
  }
  18% {
    transform: rotate(-1.4deg) translateY(-2px);
  }
  42% {
    transform: rotate(1.2deg) translateY(-1px);
  }
}
@keyframes wave {
  0% {
    opacity: 0;
    transform: scale(0.78);
  }
  24% {
    opacity: 0.45;
  }
  100% {
    opacity: 0;
    transform: scale(1.28);
  }
}
@keyframes blink {
  0%,
  100% {
    opacity: 0.2;
  }
  50% {
    opacity: 1;
  }
}
@keyframes pulse {
  0%,
  100% {
    opacity: 0.45;
  }
  50% {
    opacity: 0.95;
  }
}
@keyframes hp {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.03);
  }
}
@keyframes dudu {
  0%,
  70%,
  100% {
    opacity: 0.22;
  }
  18%,
  40% {
    opacity: 1;
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes duUp {
  from {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  to {
    opacity: 0;
    transform: translate(-50%, -22px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .rig.ringing,
  .waves.on i,
  .led.on,
  .led.talk,
  .horn.pulse .horn-ring,
  .dudu span,
  .line,
  .du-pop {
    animation: none;
  }
  .handset,
  body {
    transition: none;
  }
  .dudu span {
    opacity: 1;
  }
}

</style>
<script>
(function(){try{var t=localStorage.getItem("dudu-theme")||"auto";var night=t==="night";if(t==="auto"){var parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Shanghai",hour:"numeric",hourCycle:"h23"}).formatToParts(new Date());var h=0;for(var i=0;i<parts.length;i++){if(parts[i].type==="hour")h=parseInt(parts[i].value,10);}night=h>=21||h<6;}document.documentElement.classList.toggle("night",night);var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute("content",night?"#1A1714":"#F3EDE4");}catch(e){}})();
</script>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>嘟嘟机</h1>
    <p class="clock" id="clock"></p>
  </header>
  <div class="rig" id="rig">
    <div class="waves" id="waves" aria-hidden="true"><i></i><i></i><i></i></div>
    <button type="button" class="handset" id="handset" aria-label="听筒"><span class="cup"></span><span class="bar"></span><span class="cup"></span></button>
    <div class="cradle"></div>
    <div class="shell">
      <div class="led-row"><span class="led" id="led"></span><span class="lcd" id="lcd">凉着</span></div>
      <button type="button" class="horn" id="horn" aria-label="喇叭"><span class="horn-ring"></span><span class="horn-face"><span class="horn-dot"></span></span></button>
      <p class="horn-cap">喇叭</p>
      <div class="keys" aria-hidden="true"><span class="key">1</span><span class="key">2</span><span class="key">3</span><span class="key">4</span><span class="key">5</span><span class="key">6</span><span class="key">7</span><span class="key">8</span><span class="key">9</span><span class="key">*</span><span class="key">0</span><span class="key">#</span></div>
    </div>
  </div>
  <section class="stage" id="stage" aria-live="polite">
    <p class="who quiet">机子凉了很久</p>
    <p class="tag">按喇叭，或等它自己响</p>
  </section>
  <div class="acts" id="acts">
    <button type="button" class="txt" data-a="wait">再等一通</button>
    <button type="button" class="txt solid" data-a="dial">打过去</button>
  </div>
  <ol class="log" id="log"></ol>
  <footer class="foot">
    <button type="button" id="lamp">灯·自动</button>
    <button type="button" id="mute">静音</button>
    <button type="button" id="en">英文</button>
  </footer>
</main>
<script>
(function () {
  var IN = [
    { id: "return", who: "这头", tag: "隔了很久",
      lines: [
        { zh: "嘟。", en: "Toot." },
        { zh: "接了。这头凉了好一阵。", en: "Picked up. This end has been cold a while." },
        { zh: "你忘了做到哪，没关系。喇叭还在。", en: "You forgot where you left off. The horn is still here." },
        { zh: "这一通不算补上。就是响了。", en: "This call isn't makeup work. It just rang." },
        { zh: "想回就按。一下也算。", en: "Press if you want in. Once counts." },
        { zh: "挂了也行。我把热度留在机子上。", en: "Hanging up is fine. I'll leave the warmth on the phone." }
      ],
      vm: { zh: "响了一会儿。留言就一句：还在。做到哪都行。", en: "It rang for a bit. One line: still here. Wherever you left off is fine." } },
    { id: "horn", who: "喇叭", tag: "自己响的",
      lines: [
        { zh: "不是来电。", en: "Not a call." },
        { zh: "它自己嘟了一下。", en: "It tooted on its own." },
        { zh: "节奏还是三下。你听得出来。", en: "Still three. You can hear it." },
        { zh: "听见了，就算这头通着。", en: "If you heard it, this end is open." }
      ],
      vm: { zh: "没人接。三下留在喇叭上。", en: "No one picked up. The three toots stayed on the horn." } },
    { id: "night", who: "夜班这头", tag: "灯还开着",
      lines: [
        { zh: "夜里了。你还醒着。", en: "It's night. You're still up." },
        { zh: "这头的灯没关。", en: "The lamp on this end is still on." },
        { zh: "困了就挂。不挂，我轻一点。", en: "If you're sleepy, hang up. If you stay, I'll keep it quiet." },
        { zh: "不说正事。", en: "No real business." }
      ],
      vm: { zh: "夜班留言：灯还开。回来再按。", en: "Night-shift note: the lamp's on. Press when you're back." } },
    { id: "page", who: "未翻的页", tag: "书签还夹着",
      lines: [
        { zh: "上一句还夹着。", en: "The last sentence is still held." },
        { zh: "先不翻。听筒比页角热。", en: "Don't turn it yet. The receiver is warmer than the page." },
        { zh: "你要是在看书，这通可以很短。", en: "If you're reading, this call can be short." }
      ],
      vm: { zh: "那一句还夹着。回来再听。", en: "That line is still bookmarked. Listen when you're back." } },
    { id: "wrong", who: "打错的", tag: "号码旧了",
      lines: [
        { zh: "这个号好久没人拨。", en: "Nobody has dialed this number in a long time." },
        { zh: "算了。既然通了。", en: "Never mind. Since it went through." },
        { zh: "那就这一句：在。", en: "Then just this: here." }
      ],
      vm: { zh: "打错的也留了：在。", en: "Even the wrong number left a note: here." } },
    { id: "board", who: "总机", tag: "线路还在",
      lines: [
        { zh: "线路还在。编号你可以忘。", en: "The line is still here. You can forget the number." },
        { zh: "别的机子归别的柜子。这一台只认喇叭。", en: "The other phones live in other drawers. This one only knows the horn." },
        { zh: "按一下，这头就亮。", en: "Press once, and this end lights." }
      ],
      vm: { zh: "总机记了一笔：这头亮过，没人接。", en: "The switchboard noted it: this end lit, and no one picked up." } }
  ];
  var OUT = [
    { who: "这头", tag: "打过去", lines: [
      { zh: "我在。", en: "I'm here." },
      { zh: "隔了很久，喇叭还认得。", en: "It's been a long time. The horn still knows you." },
      { zh: "哪头？这头。", en: "Which end? This one." }
    ] },
    { who: "这头", tag: "打过去", lines: [
      { zh: "嘟。", en: "Toot." },
      { zh: "来了。", en: "Coming." },
      { zh: "你按得挺齐。", en: "Your presses were even." }
    ] },
    { who: "这头", tag: "打过去", lines: [
      { zh: "一直在。", en: "Been here." },
      { zh: "刚才还凉。现在热了。", en: "It was cold a moment ago. It's warm now." },
      { zh: "你说，或者再按一下。", en: "You talk, or press once more." }
    ] }
  ];
  var REPLIES = [
    { zh: "收到。", en: "Got it.", aside: 1 },
    { zh: "再来一下。", en: "Once more.", aside: 1 },
    { zh: "嗯。", en: "Mm.", aside: 1 },
    { zh: "嘟。", en: "Toot.", aside: 1 },
    { zh: "还在。", en: "Still here.", aside: 1 },
    { zh: "齐了。", en: "Even.", aside: 1 },
    { zh: "听见了。", en: "Heard you.", aside: 1 }
  ];
  var phoneIco = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
  var offIco = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7a2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.4 19.4 0 0 1-3.33-2.55"/><path d="M6.12 6.12A19.8 19.8 0 0 0 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 .91 1.35"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';

  var phase = "cold", script = null, shown = [], cursor = 0, dir = "in";
  var muted = false, unlocked = false, lamp = "auto", elapsed = 0, hornDown = false;
  var log = [], pops = [];
  var missT = 0, lineT = 0, dialT = 0, talkT = 0, ringT = 0, popN = 0, lastHorn = 0, talk0 = 0;
  var ctx = null;

  function $(id) { return document.getElementById(id); }
  function hour() {
    var parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Shanghai", hour: "numeric", hourCycle: "h23" }).formatToParts(new Date());
    for (var i = 0; i < parts.length; i++) if (parts[i].type === "hour") return parseInt(parts[i].value, 10);
    return 0;
  }
  function clock() {
    return new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date());
  }
  function nightOn() {
    if (lamp === "night") return true;
    if (lamp === "day") return false;
    var h = hour();
    return h >= 21 || h < 6;
  }
  function applyLamp() {
    var on = nightOn();
    document.documentElement.classList.toggle("night", on);
    document.documentElement.classList.toggle("en-on", document.documentElement.classList.contains("en-on"));
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", on ? "#1A1714" : "#F3EDE4");
    $("clock").textContent = clock();
    $("lamp").textContent = lamp === "night" ? "灯·夜" : lamp === "day" ? "灯·昼" : "灯·自动";
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      var map = { "&": "amp", "<": "lt", ">": "gt", '"': "quot" };
      return "&" + map[c] + ";";
    });
  }

  function readLog() {
    try {
      var raw = localStorage.getItem("dudu-log");
      var data = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(data)) return [];
      return data.filter(function (x) {
        return x && typeof x.result === "string" && typeof x.who === "string" && typeof x.snippet === "string";
      }).slice(0, 12);
    } catch (e) { return []; }
  }
  function pushLog(result, who, snippet) {
    log.unshift({ result: result, who: who, snippet: snippet });
    if (log.length > 12) log.pop();
    try { localStorage.setItem("dudu-log", JSON.stringify(log)); } catch (e) {}
    paintLog();
  }
  function paintLog() {
    $("log").innerHTML = log.slice(0, 3).map(function (x) {
      return "<li><span>" + esc(x.result) + "</span><span>" + esc(x.who) + "</span><span>" + esc(x.snippet) + "</span></li>";
    }).join("");
  }
  function unlock() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ctx) ctx = new AC();
      if (ctx.state === "suspended") ctx.resume();
      unlocked = true;
    } catch (e) {}
  }
  function blip() {
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator(), o2 = ctx.createOscillator();
    var g = ctx.createGain(), g2 = ctx.createGain();
    o.type = "triangle"; o2.type = "triangle";
    o.frequency.setValueAtTime(392, t0);
    o.frequency.exponentialRampToValueAtTime(247, t0 + 0.12);
    o2.frequency.setValueAtTime(196, t0);
    o2.frequency.exponentialRampToValueAtTime(131, t0 + 0.12);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.055, t0 + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    o.connect(g); g.connect(ctx.destination);
    o2.connect(g2); g2.connect(ctx.destination);
    o.start(t0); o.stop(t0 + 0.16);
    o2.start(t0); o2.stop(t0 + 0.15);
  }
  function playHorn(n) {
    if (muted) return;
    unlock();
    if (!ctx) return;
    for (var i = 0; i < n; i++) setTimeout(blip, i * 170);
  }
  function cradle() {
    if (muted || !ctx || ctx.state === "suspended") return;
    var t0 = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(180, t0);
    o.frequency.exponentialRampToValueAtTime(70, t0 + 0.08);
    g.gain.setValueAtTime(0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + 0.1);
  }
  function stopRing() { if (ringT) { clearInterval(ringT); ringT = 0; } }
  function startRing() {
    stopRing();
    if (muted || !unlocked) return;
    playHorn(2);
    ringT = setInterval(function () {
      if (muted || phase !== "ringing") return;
      playHorn(2);
    }, 1400);
  }
  function clearT() {
    clearTimeout(missT); clearTimeout(lineT); clearTimeout(dialT); clearInterval(talkT);
    missT = lineT = dialT = talkT = 0;
    stopRing();
  }
  function pop() {
    var id = ++popN;
    pops.push(id);
    hornDown = true;
    setTimeout(function () { hornDown = false; paint(); }, 120);
    setTimeout(function () { pops = pops.filter(function (x) { return x !== id; }); paint(); }, 560);
    try { if (navigator.vibrate) navigator.vibrate(16); } catch (e) {}
  }
  function lcd() {
    if (phase === "cold") return "凉着";
    if (phase === "missed") return "留言";
    if (phase === "ended") return "还热";
    if (phase === "dialing") return "拨号";
    if (phase === "talking") return "通话";
    return (script && script.who) || "这头";
  }
  function lineHtml(ln, i) {
    var cls = "line" + (ln.aside ? " aside" : "") + (i < shown.length - 2 ? " fade" : "");
    return '<div class="' + cls + '">' + esc(ln.zh) + '<span class="en">' + esc(ln.en) + '</span></div>';
  }
  function paint() {
    var live = phase === "ringing" || phase === "talking" || phase === "dialing";
    $("rig").className = "rig" + (phase === "ringing" ? " ringing" : "");
    $("waves").className = "waves" + (phase === "ringing" || phase === "dialing" ? " on" : "");
    $("handset").className = "handset" + (phase === "talking" ? " up" : "");
    $("handset").setAttribute("aria-label", phase === "talking" ? "搁回听筒" : "听筒");
    $("led").className = "led" + (live ? " on" : "") + (phase === "talking" ? " talk" : "");
    $("lcd").textContent = lcd();
    $("horn").className = "horn" + (phase === "ringing" || phase === "dialing" ? " pulse" : "") + (hornDown ? " down" : "");
    var old = $("horn").querySelectorAll(".du-pop");
    for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    pops.forEach(function () {
      var s = document.createElement("span");
      s.className = "du-pop";
      s.setAttribute("aria-hidden", "true");
      s.textContent = "嘟";
      $("horn").appendChild(s);
    });
    var st = "", ac = "";
    if (phase === "cold") {
      st = '<p class="who quiet">机子凉了很久</p><p class="tag">按喇叭，或等它自己响</p>';
      ac = '<button type="button" class="txt" data-a="wait">再等一通</button><button type="button" class="txt solid" data-a="dial">打过去</button>';
    } else if (phase === "ringing" && script) {
      st = '<p class="kicker">有人打来</p><h2 class="who">' + esc(script.who) + '</h2><p class="tag">' + esc(script.tag) + '</p><p class="dudu"><span>嘟</span><span>嘟</span></p><p class="kicker gap">' + (unlocked ? "按喇叭也可以接" : "按喇叭，这头出声") + "</p>";
      ac = '<button type="button" class="knob" data-a="no"><i>' + offIco + '</i><b>不接</b></button><button type="button" class="knob go" data-a="yes"><i>' + phoneIco + '</i><b>接</b></button>';
    } else if (phase === "dialing" && script) {
      st = '<p class="kicker">打过去</p><h2 class="who">' + esc(script.who) + '</h2><p class="dudu"><span>嘟</span><span>嘟</span><span>嘟</span></p>';
    } else if (phase === "talking" && script) {
      var mm = Math.floor(elapsed / 60), ss = ("0" + (elapsed % 60)).slice(-2);
      st = '<p class="kicker">通话中</p><h2 class="who small">' + esc(script.who) + '</h2><p class="timer">' + mm + ":" + ss + '</p><div class="lines">' + shown.map(lineHtml).join("") + '</div><button type="button" class="hint" data-a="next">下一句</button>';
      ac = '<button type="button" class="knob off" data-a="hang"><i class="flip">' + phoneIco + "</i><b>挂断</b></button>";
    } else if (phase === "missed" && script) {
      st = '<p class="kicker">未接来电</p><h2 class="who">' + esc(script.who) + '</h2><p class="note">' + esc(script.vm.zh) + '<span class="en">' + esc(script.vm.en) + "</span></p>";
      ac = '<button type="button" class="txt" data-a="wait">再等一通</button><button type="button" class="txt solid" data-a="dial">打过去</button>';
    } else if (phase === "ended") {
      st = '<p class="kicker">已挂断</p><p class="who">机子还热</p><p class="tag">听筒搁回去了。再按喇叭，或再等一通。</p>';
      ac = '<button type="button" class="txt" data-a="wait">再等一通</button><button type="button" class="txt solid" data-a="dial">打过去</button>';
    }
    $("stage").innerHTML = st;
    $("acts").innerHTML = ac;
  }
  function pickIn(first) {
    if (first) return IN[0];
    var pool = IN.slice(1);
    if (nightOn() && Math.random() < 0.5) {
      for (var i = 0; i < pool.length; i++) if (pool[i].id === "night") return pool[i];
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function speakNext() {
    if (!script || phase !== "talking") return;
    clearTimeout(lineT);
    if (cursor >= script.lines.length) {
      lineT = setTimeout(hangUp, 2400);
      return;
    }
    shown.push(script.lines[cursor++]);
    paint();
    lineT = setTimeout(speakNext, 2600);
  }
  function beginTalk() {
    clearT();
    cursor = 0;
    shown = [];
    elapsed = 0;
    talk0 = Date.now();
    phase = "talking";
    talkT = setInterval(function () {
      elapsed = Math.floor((Date.now() - talk0) / 1000);
      var el = document.querySelector(".timer");
      if (el) el.textContent = Math.floor(elapsed / 60) + ":" + ("0" + (elapsed % 60)).slice(-2);
    }, 250);
    lineT = setTimeout(speakNext, 700);
    paint();
  }
  function incoming(prefer) {
    clearT();
    var first = false;
    if (prefer) {
      try {
        first = !sessionStorage.getItem("dudu-returned");
        if (first) sessionStorage.setItem("dudu-returned", "1");
      } catch (e) { first = true; }
    }
    script = pickIn(first);
    dir = "in";
    shown = [];
    cursor = 0;
    elapsed = 0;
    phase = "ringing";
    startRing();
    var sc = script;
    missT = setTimeout(function () {
      if (phase !== "ringing") return;
      stopRing();
      phase = "missed";
      pushLog("未接", sc.who, sc.vm.zh);
      paint();
    }, 22000);
    paint();
  }
  function answer() {
    if (phase !== "ringing" || !script) return;
    beginTalk();
  }
  function decline() {
    if (phase !== "ringing" || !script) return;
    clearT();
    cradle();
    phase = "missed";
    pushLog("未接", script.who, script.vm.zh);
    paint();
  }
  function hangUp() {
    if (phase !== "talking") return;
    clearT();
    cradle();
    var last = (shown[shown.length - 1] || script.lines[0] || {}).zh || "";
    pushLog(dir === "out" ? "打过去" : "接了", script.who, last);
    phase = "ended";
    paint();
  }
  function dial() {
    clearT();
    script = OUT[Math.floor(Math.random() * OUT.length)];
    dir = "out";
    shown = [];
    cursor = 0;
    elapsed = 0;
    phase = "dialing";
    dialT = setTimeout(beginTalk, 1600);
    paint();
  }
  function toot() {
    unlock();
    pop();
    if (phase === "cold" || phase === "ended" || phase === "missed") { playHorn(3); dial(); return; }
    if (phase === "ringing") { playHorn(1); answer(); return; }
    if (phase === "talking") {
      playHorn(1);
      shown.push(REPLIES[Math.floor(Math.random() * REPLIES.length)]);
      paint();
      return;
    }
    playHorn(1);
  }
  function act(name) {
    unlock();
    if (name === "yes") { playHorn(1); pop(); answer(); }
    else if (name === "no") decline();
    else if (name === "hang") hangUp();
    else if (name === "wait") incoming(true);
    else if (name === "dial") { playHorn(3); pop(); dial(); }
    else if (name === "next" && phase === "talking") speakNext();
  }
  function onHorn(e) {
    if (e.button) return;
    var now = Date.now();
    if (now - lastHorn < 500) return;
    lastHorn = now;
    if (e.cancelable) e.preventDefault();
    toot();
  }

  try {
    var stored = localStorage.getItem("dudu-theme");
    if (stored === "night" || stored === "day" || stored === "auto") lamp = stored;
  } catch (e) {}
  log = readLog();
  paintLog();
  applyLamp();
  setInterval(applyLamp, 1000);

  $("horn").addEventListener("pointerdown", onHorn);
  $("horn").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") onHorn(e);
  });
  $("handset").addEventListener("pointerdown", function (e) {
    if (e.button) return;
    e.preventDefault();
    unlock();
    if (phase === "ringing") { playHorn(1); answer(); }
    else if (phase === "talking") hangUp();
  });
  $("acts").addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]");
    if (!b) return;
    act(b.getAttribute("data-a"));
  });
  $("stage").addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]");
    if (!b) return;
    act(b.getAttribute("data-a"));
  });
  $("lamp").addEventListener("click", function () {
    lamp = lamp === "auto" ? "night" : lamp === "night" ? "day" : "auto";
    try { localStorage.setItem("dudu-theme", lamp); } catch (e) {}
    applyLamp();
  });
  $("mute").addEventListener("click", function () {
    muted = !muted;
    $("mute").textContent = muted ? "开声" : "静音";
    if (muted) stopRing();
    else if (phase === "ringing") startRing();
  });
  $("en").addEventListener("click", function () {
    document.documentElement.classList.toggle("en-on");
    $("en").textContent = document.documentElement.classList.contains("en-on") ? "英文开" : "英文";
  });

  setTimeout(function () {
    if (phase === "cold") incoming(true);
  }, 1100);
  paint();
})();

</script>
</body>
