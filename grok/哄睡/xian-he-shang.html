<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>先合上</title>
  <meta name="description" content="读得太烫了。把书扣在枕边，这一页明天再咬。" />
  <style>
    :root {
      --night: #12182a;
      --deeper: #0b1020;
      --ink: #d7dcec;
      --mute: #8b93ab;
      --lamp: #e4b36a;
      --lamp-soft: rgba(228, 179, 106, 0.28);
      --jelly: #7fd0c8;
      --rose: #c98aa0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--deeper);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Songti SC", "Songti TC", "STSong", serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% 115%, rgba(201, 138, 160, 0.12), transparent 55%),
        radial-gradient(circle at 18% 12%, rgba(127, 208, 200, 0.08), transparent 32%),
        radial-gradient(circle at 82% 18%, var(--lamp-soft), transparent 36%),
        var(--deeper);
    }
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #eef2ff;
      opacity: 0.35;
    }
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
    }
    .sky-copy {
      position: absolute;
      top: 12%;
      left: 0;
      right: 0;
      text-align: center;
      padding: 0 28px;
    }
    .sky-copy h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 10px;
    }
    .sky-copy p {
      font-size: 14px;
      line-height: 1.85;
      color: var(--mute);
      letter-spacing: 0.04em;
    }
    .en {
      display: none;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.7;
      color: #6f7893;
      font-style: italic;
    }
    body.show-en .en { display: block; }
    .stage {
      width: min(360px, 92vw);
      height: 280px;
      position: relative;
      margin-bottom: 18px;
    }
    .table {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 18px;
      height: 14px;
      border-radius: 8px;
      background: linear-gradient(90deg, #1a2238, #2a3148 40%, #1c2438);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .lamp {
      position: absolute;
      right: 18%;
      bottom: 30px;
      width: 54px;
      height: 90px;
    }
    .shade {
      width: 54px;
      height: 28px;
      background: #c9a36a;
      clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
      opacity: 0.95;
      transition: opacity 1.6s ease;
    }
    .glow {
      position: absolute;
      left: 50%;
      top: 26px;
      width: 90px;
      height: 90px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(228,179,106,0.45), transparent 68%);
      filter: blur(6px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }
    .stem {
      width: 4px;
      height: 42px;
      margin: 0 auto;
      background: #8a7a62;
    }
    .base {
      width: 28px;
      height: 6px;
      margin: 0 auto;
      border-radius: 3px;
      background: #6d6456;
    }
    body.dim .shade { opacity: 0.35; }
    body.dim .glow { opacity: 0.2; transform: translateX(-50%) scale(0.7); }
    .book {
      position: absolute;
      left: 16%;
      bottom: 32px;
      width: 132px;
      height: 92px;
      cursor: pointer;
      transform-origin: left center;
      transition: transform 1.1s cubic-bezier(.2,.7,.2,1);
    }
    .cover {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #5c3a48, #3a2430);
      border-radius: 2px 6px 6px 2px;
      box-shadow:
        3px 6px 0 #2a1820,
        0 16px 28px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cover span {
      color: #e7c4cf;
      font-size: 13px;
      letter-spacing: 0.28em;
      writing-mode: vertical-rl;
    }
    .page {
      position: absolute;
      left: 6px;
      top: 6px;
      right: -18px;
      bottom: 8px;
      background: #efe6d6;
      border-radius: 0 4px 4px 0;
      box-shadow: 2px 2px 0 #d9cbb6;
      opacity: 1;
      transform-origin: left center;
      transition: transform 1.1s cubic-bezier(.2,.7,.2,1), opacity 0.8s ease;
    }
    .page::before, .page::after {
      content: "";
      display: block;
      margin: 16px 12px 0;
      height: 3px;
      background: repeating-linear-gradient(90deg, #cbbba4 0 18px, transparent 18px 26px);
      opacity: 0.7;
    }
    .page::after { margin-top: 10px; width: 70%; }
    body.closed .page {
      transform: perspective(400px) rotateY(-88deg);
      opacity: 0.15;
    }
    body.closed .book { transform: translateY(2px); }
    .period {
      position: absolute;
      left: 52%;
      bottom: 118px;
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--jelly);
      border-radius: 50%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1.4s ease 0.4s, transform 1.4s ease 0.4s;
      box-shadow: 0 0 16px rgba(127, 208, 200, 0.35);
    }
    body.closed .period {
      opacity: 0.9;
      transform: translateY(0);
      animation: floaty 4.6s ease-in-out infinite 1.2s;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .breath {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 1px solid rgba(215, 220, 236, 0.18);
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      animation: breathe 7.2s ease-in-out infinite;
    }
    .breath i {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f0e6c8, var(--lamp) 40%, #b8874a);
      opacity: 0.75;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.92); opacity: 0.55; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--mute);
      min-height: 2.6em;
      line-height: 1.7;
      letter-spacing: 0.04em;
    }
    .bar {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }
    .bar button {
      border: 0;
      background: rgba(255,255,255,0.06);
      color: #a9b0c6;
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 999px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="bar">
    <button type="button" id="enBtn" aria-pressed="false">英文</button>
  </div>
  <canvas id="stars"></canvas>
  <div class="wrap">
    <div class="sky-copy">
      <h1>先合上</h1>
      <p id="line">书还烫着。不必今晚咬完。</p>
      <p class="en" id="enLine">The page can wait. Put it down warm.</p>
    </div>
    <div class="stage">
      <div class="glow"></div>
      <div class="period" title="句号"></div>
      <div class="book" id="book" role="button" aria-label="合上书">
        <div class="page"></div>
        <div class="cover"><span>未完</span></div>
      </div>
      <div class="lamp">
        <div class="shade"></div>
        <div class="stem"></div>
        <div class="base"></div>
      </div>
      <div class="table"></div>
    </div>
    <div class="breath" aria-hidden="true"><i></i></div>
    <p class="hint" id="hint">点那本小书。轻轻扣上就好。</p>
  </div>
  <script>
    const lines = [
      ["书还烫着。不必今晚咬完。", "The page can wait. Put it down warm."],
      ["字会在那里。人先去睡。", "The words will stay. You can sleep first."],
      ["缓过的那一张，也算读过。", "The pause counts. It was reading too."],
      ["灯可以再暗一点。", "The lamp can go quieter."],
      ["明天的牙齿还在。", "Tomorrow still has teeth."]
    ];
    const hints = [
      "点那本小书。轻轻扣上就好。",
      "扣上了。灯自己会暗。",
      "句号在旁边漂着。不用数它。",
      "呼吸跟着圆圈走就行。",
      "兴奋可以留在书脊里过夜。"
    ];
    let i = 0;
    const book = document.getElementById("book");
    const line = document.getElementById("line");
    const enLine = document.getElementById("enLine");
    const hint = document.getElementById("hint");
    const enBtn = document.getElementById("enBtn");

    book.addEventListener("click", () => {
      document.body.classList.add("closed", "dim");
      i = (i + 1) % lines.length;
      line.textContent = lines[i][0];
      enLine.textContent = lines[i][1];
      hint.textContent = hints[Math.min(i, hints.length - 1)];
    });

    enBtn.addEventListener("click", () => {
      const on = document.body.classList.toggle("show-en");
      enBtn.setAttribute("aria-pressed", on ? "true" : "false");
    });

    const cvs = document.getElementById("stars");
    const ctx = cvs.getContext("2d");
    const stars = [];
    function resize() {
      cvs.width = innerWidth * devicePixelRatio;
      cvs.height = innerHeight * devicePixelRatio;
      cvs.style.width = innerWidth + "px";
      cvs.style.height = innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    function seed() {
      stars.length = 0;
      const n = 48;
      for (let s = 0; s < n; s++) {
        stars.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight * 0.62,
          r: Math.random() * 1.2 + 0.3,
          a: Math.random() * 0.5 + 0.12,
          p: Math.random() * Math.PI * 2,
          v: 0.004 + Math.random() * 0.008
        });
      }
    }
    function draw(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) {
        const tw = s.a + Math.sin(t * s.v + s.p) * 0.12;
        ctx.beginPath();
        ctx.fillStyle = "rgba(238,242,255," + tw + ")";
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    resize();
    seed();
    addEventListener("resize", () => { resize(); seed(); });
    requestAnimationFrame(draw);
  </script>
</body>
</html>
