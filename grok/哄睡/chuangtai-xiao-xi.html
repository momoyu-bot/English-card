<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>窗台小戏</title>
  <meta name="description" content="四个点走完一整晚，最后一个坐下，灯就只剩半格。" />
  <style>
    :root {
      --bg: #14110e;
      --paper: #1c1814;
      --ink: #e6d7c3;
      --dim: #8a7b68;
      --softer: #5c5348;
      --warm: #c4a574;
      --line: #3a332c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", "PingFang SC", "Hiragino Sans GB", serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 40px;
    }
    .wrap {
      width: min(420px, 100%);
    }
    header {
      text-align: center;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.42em;
      margin: 0 0 8px;
      color: var(--warm);
    }
    .sub {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.08em;
    }
    .stage-box {
      background: radial-gradient(ellipse at 50% 0%, #2a231c 0%, var(--paper) 58%);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 12px 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
    }
    .curtain {
      font-size: 11px;
      color: var(--softer);
      text-align: center;
      letter-spacing: 0.28em;
      margin-bottom: 8px;
    }
    pre.stage {
      margin: 0;
      min-height: 210px;
      font-family: "SF Mono", "Menlo", "Consolas", "PingFang SC", monospace;
      font-size: 15px;
      line-height: 1.28;
      letter-spacing: 0.02em;
      color: var(--ink);
      white-space: pre;
      overflow: hidden;
      text-align: left;
    }
    .caption {
      min-height: 44px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--dim);
      text-align: center;
    }
    .en {
      display: none;
      margin-top: 6px;
      font-size: 12px;
      color: var(--softer);
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
    }
    .en.on { display: block; }
    .bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--dim);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.12em;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover { color: var(--ink); border-color: var(--warm); }
    button.active {
      color: var(--warm);
      border-color: var(--warm);
    }
    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      color: var(--softer);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>窗台小戏</h1>
      <div class="sub">一出很短的夜戏 · 演完请关灯</div>
    </header>
    <div class="stage-box">
      <div class="curtain">—— 开幕 ——</div>
      <pre class="stage" id="stage"></pre>
      <div class="caption" id="cap"></div>
      <div class="en" id="en"></div>
    </div>
    <div class="bar">
      <button type="button" id="again">再看一遍</button>
      <button type="button" id="pause">暂停</button>
      <button type="button" id="enbtn">中文译注</button>
    </div>
    <div class="foot">点一下幕布也可以继续</div>
  </div>
  <script>
    const W = 28;
    const pad = (s) => {
      const lines = s.replace(/^\n|\n$/g, "").split("\n");
      return lines.map(l => l.length >= W ? l.slice(0, W) : l + " ".repeat(W - l.length)).join("\n");
    };
    const frames = [
      {
        art: pad(`
                            
                            
                            
                            
                            
─────────────┴──────────────
`),
        zh: "灯还没亮。窗台空着。",
        en: "The sill is empty. The lamp has not decided."
      },
      {
        art: pad(`
                      ·     
                            
                            
                            
                            
─────────────┴──────────────
`),
        zh: "一颗很远的点，先到了。",
        en: "A far dot arrives first."
      },
      {
        art: pad(`
              ·         ·   
                            
                            
                            
                            
─────────────┴──────────────
`),
        zh: "又来一颗。它们不急着说话。",
        en: "Another. They are in no hurry to speak."
      },
      {
        art: pad(`
         ·         ·        
                   (        
                    )       
                            
                            
─────────────┴──────────────
`),
        zh: "月亮从右边侧身进来，只露半张脸。",
        en: "The moon steps in sideways, half a face."
      },
      {
        art: pad(`
      ·           ·         
                  (         
                   )        
                            
.                           
─────────────┴──────────────
`),
        zh: "窗台左边，出现一个更小的点。",
        en: "On the left sill, a smaller dot."
      },
      {
        art: pad(`
      ·        ·            
                 (          
                  )         
                            
  .                         
─────────────┴──────────────
`),
        zh: "它往中间走。步伐只有一个空格。",
        en: "It walks by spaces. One space is a whole night."
      },
      {
        art: pad(`
     ·          ·           
                (           
                 )          
                            
    .                       
─────────────┴──────────────
`),
        zh: "风经过，它停了一停。",
        en: "Wind passes. It pauses."
      },
      {
        art: pad(`
    ·            ·          
               (            
                )           
                            
      ·                     
─────────────┴──────────────
`),
        zh: "走到灯绳底下。灯绳是那根细线。",
        en: "Under the cord. The cord is only a thin line."
      },
      {
        art: pad(`
   ·              ·         
              (             
               )            
                            
      (·)                   
─────────────┴──────────────
`),
        zh: "它坐下了。圆了一点，像把句号养熟。",
        en: "It sits. The period grows a little round."
      },
      {
        art: pad(`
  ·               ·         
             (              
              )             
                            
      (·)  ?                
─────────────┴──────────────
`),
        zh: "抬头看月亮。月亮不回答，只继续圆。",
        en: "Looks up. The moon does not answer; it only rounds."
      },
      {
        art: pad(`
 ·                 ·        
            (               
             )              
                            
      (–)                   
─────────────┴──────────────
`),
        zh: "眼睛闭上。问号自己走掉了。",
        en: "Eyes shut. The question mark leaves by itself."
      },
      {
        art: pad(`
                   ·        
           (                
            )               
         z                  
      (–)                   
─────────────┴──────────────
`),
        zh: "第一声呼吸，写成一个很轻的 z。",
        en: "First breath, written as a small z."
      },
      {
        art: pad(`
                  ·         
          (                 
           )                
        z z                 
      (–)                   
─────────────┴──────────────
`),
        zh: "第二声。窗台把夜声都收成白噪音。",
        en: "Second. The sill turns the night into hush."
      },
      {
        art: pad(`
                            
         (                  
          )                 
       z                    
      (–)                   
─────────────┴──────────────
`),
        zh: "远点也睡了。只剩月亮值班。",
        en: "The far dots sleep. Only the moon keeps watch."
      },
      {
        art: pad(`
                            
        (                   
         )                  
                            
      (–)                   
─────────────┴──────────────
`),
        zh: "z 也走了。戏演完了。",
        en: "Even z has gone. The play is over."
      },
      {
        art: pad(`
                            
       (                    
        )                   
                            
      .                     
─────────────┴──────────────
`),
        zh: "演员变回一个点。灯请自己关。",
        en: "The actor is a dot again. Please turn the lamp down."
      }
    ];

    const stage = document.getElementById("stage");
    const cap = document.getElementById("cap");
    const en = document.getElementById("en");
    const again = document.getElementById("again");
    const pauseBtn = document.getElementById("pause");
    const enbtn = document.getElementById("enbtn");
    let i = 0, timer = null, paused = false, enOn = false;

    function show(n) {
      const f = frames[n];
      stage.textContent = f.art;
      cap.textContent = f.zh;
      en.textContent = f.en;
    }
    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }
    function play() {
      stop();
      if (paused) return;
      show(i);
      if (i < frames.length - 1) {
        const hold = i === 0 ? 900 : (i > 10 ? 2200 : 1600);
        timer = setTimeout(() => { i += 1; play(); }, hold);
      }
    }
    again.addEventListener("click", () => {
      i = 0; paused = false; pauseBtn.textContent = "暂停"; play();
    });
    pauseBtn.addEventListener("click", () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "继续" : "暂停";
      if (paused) stop(); else play();
    });
    enbtn.addEventListener("click", () => {
      enOn = !enOn;
      en.classList.toggle("on", enOn);
      enbtn.classList.toggle("active", enOn);
    });
    document.querySelector(".stage-box").addEventListener("click", () => {
      if (paused) { paused = false; pauseBtn.textContent = "暂停"; play(); }
      else if (i >= frames.length - 1) { i = 0; play(); }
    });
    play();
  </script>
</body>
</html>
