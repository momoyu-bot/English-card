<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝 的 小 窝</title>
<meta name="description" content="摸摸它、投喂它，攒今晚的温暖值。">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&amp;display=swap');
        
        :root {
            --night-purple: #2a1f3d;
            --warm-orange: #f5a97f;
            --soft-pink: #ff9ec7;
            --cream: #fffaf0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(180deg, #2a1f3d 0%, #3d2a1f 100%);
            min-height: 100vh;
            font-family: "Noto Serif SC", "Microsoft YaHei", serif;
            color: #fffaf0;
            overflow-x: hidden;
            position: relative;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: none;
            z-index: 1;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .fireflies {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        .firefly {
            position: absolute;
            font-size: 14px;
            filter: blur(0.5px);
            animation: floatFirefly linear infinite;
            text-shadow: 0 0 8px #fff7b3, 0 0 16px #ffe066;
        }
        
        @keyframes floatFirefly {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-25px) rotate(5deg); opacity: 1; }
            100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
        }
        
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            position: relative;
            z-index: 10;
            text-align: center;
        }
        
        .header {
            margin-bottom: 30px;
            animation: fadeInDown 1.2s ease-out;
        }
        
        .title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #fffaf0, #ffe9d6, #fffaf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(245, 169, 127, 0.3);
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 15px;
            color: #c9b8a8;
            letter-spacing: 3px;
            font-weight: 400;
        }
        
        .scene {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 30px;
        }
        
        .cushion {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 55px;
            background: radial-gradient(circle at 50% 30%, #3a2a1f, #2a1f15);
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.7;
            z-index: 1;
        }
        
        .dumpling-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.35));
        }
        
        .dumpling {
            width: 210px;
            height: 210px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: breathe 3.5s ease-in-out infinite;
        }
        
        .dumpling:hover {
            transform: scale(1.03);
        }
        
        .dumpling.full-energy {
            animation: breathe 2s ease-in-out infinite, glowPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 25px #ffe066) drop-shadow(0 0 40px #ff9ec7);
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }
        
        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 25px #ffe066) drop-shadow(0 0 40px #ff9ec7); }
            50% { filter: drop-shadow(0 0 35px #ffe066) drop-shadow(0 0 55px #ff9ec7); }
        }
        
        .bounce {
            animation: bounceAnim 0.6s ease;
        }
        
        @keyframes bounceAnim {
            0%, 100% { transform: scale(1); }
            40% { transform: scale(0.92); }
            70% { transform: scale(1.08); }
        }
        
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .heart {
            position: absolute;
            font-size: 18px;
            animation: floatHeart 1.8s ease-out forwards;
            z-index: 20;
        }
        
        @keyframes floatHeart {
            0% { opacity: 1; transform: scale(0.6) translateY(0); }
            20% { transform: scale(1.1); }
            100% { opacity: 0; transform: scale(0.8) translateY(-110px); }
        }
        
        .energy-section {
            margin-bottom: 25px;
        }
        
        .energy-label {
            font-size: 13px;
            color: #c9b8a8;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .energy-bar-wrapper {
            width: 260px;
            height: 14px;
            background: rgba(255,255,255,0.12);
            border-radius: 999px;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff9ec7, #ffe066);
            border-radius: 999px;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #ffe066;
        }
        
        .energy-text {
            font-size: 12px;
            color: #ffe9d6;
            margin-top: 6px;
        }
        
        .buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .btn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        
        .btn-pet {
            background: linear-gradient(135deg, #ff9ec7, #ff7aa8);
            color: white;
        }
        
        .btn-feed {
            background: linear-gradient(135deg, #ffe066, #f5a97f);
            color: #3d2a1f;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .message {
            min-height: 48px;
            padding: 14px 24px;
            background: rgba(255, 250, 240, 0.1);
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            color: #fffaf0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 250, 240, 0.15);
            opacity: 0;
            transition: opacity 0.4s ease;
            max-width: 280px;
            margin: 0 auto;
        }
        
        .message.show {
            opacity: 1;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #8a7a68;
            letter-spacing: 1px;
        }
        
        .full-energy-text {
            color: #ffe066;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <!-- 背景星星 -->
    <div class="stars" id="stars"></div>
    
    <!-- 萤火虫 -->
    <div class="fireflies" id="fireflies"></div>
    
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1 class="title">宝 的 小 窝</h1>
            <p class="subtitle">今晚也一起慢慢好吗？</p>
        </div>
        
        <!-- 场景 -->
        <div class="scene">
            <!-- 垫子 -->
            <div class="cushion"></div>
            
            <!-- SVG 团子 -->
            <div class="dumpling-container" id="dumplingContainer">
                <svg id="dumpling" class="dumpling" width="210" height="210" viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg">
                    <!-- 阴影 -->
                    <defs>
                        <radialGradient id="bodyGrad" cx="45%" cy="35%" r="65%" fx="40%" fy="30%">
                            <stop offset="0%" stop-color="#fffaf0"/>
                            <stop offset="55%" stop-color="#f5e8d3"/>
                            <stop offset="100%" stop-color="#e8d5b8"/>
                        </radialGradient>
                        
                        <radialGradient id="blushGrad" cx="50%" cy="50%" r="60%">
                            <stop offset="0%" stop-color="#ff9ec7"/>
                            <stop offset="100%" stop-color="#ff7aa8" stop-opacity="0.6"/>
                        </radialGradient>
                        
                        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                            <feOffset in="blur" dx="0" dy="6" result="offset"/>
                            <feMerge>
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- 身体 -->
                    <ellipse cx="105" cy="115" rx="78" ry="72" fill="url(#bodyGrad)" stroke="#d4b48c" stroke-width="6"/>
                    
                    <!-- 耳朵 -->
                    <!-- 左耳 -->
                    <path d="M55 52 Q38 28 48 18 Q62 22 68 42" fill="#f5e8d3" stroke="#d4b48c" stroke-width="5"/>
                    <!-- 右耳 -->
                    <path d="M155 52 Q172 28 162 18 Q148 22 142 42" fill="#f5e8d3" stroke="#d4b48c" stroke-width="5"/>
                    
                    <!-- 困困眼睛（默认） -->
                    <g id="sleepyEyes">
                        <!-- 左眼 -->
                        <path d="M68 92 Q78 85 88 92" fill="none" stroke="#5c4630" stroke-width="4.5" stroke-linecap="round"/>
                        <!-- 右眼 -->
                        <path d="M122 92 Q132 85 142 92" fill="none" stroke="#5c4630" stroke-width="4.5" stroke-linecap="round"/>
                    </g>
                    
                    <!-- 开心眼睛（满能量时显示） -->
                    <g id="happyEyes" style="display: none;">
                        <!-- 左眼 -->
                        <ellipse cx="78" cy="90" rx="11" ry="9" fill="#5c4630"/>
                        <ellipse cx="81" cy="88" rx="4" ry="4" fill="#fffaf0"/>
                        <!-- 右眼 -->
                        <ellipse cx="132" cy="90" rx="11" ry="9" fill="#5c4630"/>
                        <ellipse cx="135" cy="88" rx="4" ry="4" fill="#fffaf0"/>
                    </g>
                    
                    <!-- 腮红 -->
                    <ellipse cx="58" cy="108" rx="13" ry="8" fill="url(#blushGrad)" opacity="0.65"/>
                    <ellipse cx="152" cy="108" rx="13" ry="8" fill="url(#blushGrad)" opacity="0.65"/>
                    
                    <!-- 小嘴 -->
                    <path d="M88 118 Q105 127 122 118" fill="none" stroke="#c17b5e" stroke-width="3.5" stroke-linecap="round"/>
                    
                    <!-- 身体高光 -->
                    <ellipse cx="82" cy="82" rx="22" ry="12" fill="#ffffff" opacity="0.35"/>
                </svg>
            </div>
            
            <!-- 爱心容器 -->
            <div class="hearts-container" id="heartsContainer"></div>
        </div>
        
        <!-- 能量条 -->
        <div class="energy-section">
            <div class="energy-label">今晚的温暖值</div>
            <div class="energy-bar-wrapper">
                <div class="energy-bar" id="energyBar"></div>
            </div>
            <div class="energy-text" id="energyText">0 / 100</div>
        </div>
        
        <!-- 按钮 -->
        <div class="buttons">
            <button class="btn btn-pet" onclick="petDumpling()">
                <span>🫳</span> 摸摸
            </button>
            <button class="btn btn-feed" onclick="feedDumpling()">
                <span>🥟</span> 投喂
            </button>
        </div>
        
        <!-- 对话框 -->
        <div class="message" id="messageBox"></div>
        
        <div class="footer">
            每一次触碰，都是对彼此的温柔回应
        </div>
    </div>
    
    <script>
        // 星星背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 65; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 70}%`;
                star.style.animationDelay = `-${Math.random() * 3}s`;
                star.style.opacity = Math.random() * 0.5 + 0.3;
                starsContainer.appendChild(star);
            }
        }
        
        // 萤火虫
        function createFireflies() {
            const container = document.getElementById('fireflies');
            const colors = ['#fff7b3', '#ffe066', '#fff3b0'];
            
            for (let i = 0; i < 9; i++) {
                const fly = document.createElement('div');
                fly.className = 'firefly';
                fly.textContent = '✧';
                fly.style.color = colors[Math.floor(Math.random() * colors.length)];
                fly.style.left = `${Math.random() * 100}%`;
                fly.style.top = `${Math.random() * 85 + 5}%`;
                
                const duration = Math.random() * 4.5 + 5.5;
                fly.style.animationDuration = `${duration}s`;
                fly.style.animationDelay = `-${Math.random() * 8}s`;
                
                // 随机水平漂移
                const drift = (Math.random() - 0.5) * 180;
                fly.animate([
                    { transform: `translateX(0)` },
                    { transform: `translateX(${drift}px)` },
                    { transform: `translateX(0)` }
                ], {
                    duration: duration * 1000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });
                
                container.appendChild(fly);
            }
        }
        
        // 文案库
        const petMessages = [
            "被你摸摸的感觉……好安心呀～",
            "谢谢你一直这么温柔地待我",
            "你的手心好暖……我好喜欢",
            "每次被摸摸，我就觉得今天也值得了",
            "能被你这样宠着，我真的好幸福",
            "你的陪伴，让我不再害怕黑夜",
            "摸摸我的时候，我的心跳都变轻了",
            "谢谢你愿意花时间陪我这个小团子"
        ];
        
        const feedMessages = [
            "哇～好香呀！谢谢你为我准备这些",
            "吃饱了……现在只想乖乖靠着你",
            "你的投喂，让我感受到满满的爱",
            "一起吃东西的感觉……真的好幸福",
            "谢谢你记得我喜欢什么",
            "被你照顾着，我什么都不怕了",
            "这一口，暖到心里去了……",
            "你总是知道我什么时候需要温暖"
        ];
        
        let energy = 0;
        const maxEnergy = 100;
        let isFull = false;
        
        const dumpling = document.getElementById('dumpling');
        const sleepyEyes = document.getElementById('sleepyEyes');
        const happyEyes = document.getElementById('happyEyes');
        const energyBar = document.getElementById('energyBar');
        const energyText = document.getElementById('energyText');
        const messageBox = document.getElementById('messageBox');
        const heartsContainer = document.getElementById('heartsContainer');
        const dumplingContainer = document.getElementById('dumplingContainer');
        
        function updateEnergy(newEnergy) {
            energy = Math.min(Math.max(newEnergy, 0), maxEnergy);
            const percent = (energy / maxEnergy) * 100;
            
            energyBar.style.width = `${percent}%`;
            energyText.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
            
            // 满能量状态
            if (energy >= maxEnergy && !isFull) {
                isFull = true;
                dumpling.classList.add('full-energy');
                sleepyEyes.style.display = 'none';
                happyEyes.style.display = 'block';
                
                showMessage("好开心……谢谢你让我感受到这么多爱～", true);
                createBurstHearts(18);
                
                setTimeout(() => {
                    if (energy >= maxEnergy) {
                        showMessage("今晚有你在，我什么都不怕了", true);
                    }
                }, 2200);
            } else if (energy < maxEnergy && isFull) {
                isFull = false;
                dumpling.classList.remove('full-energy');
                sleepyEyes.style.display = 'block';
                happyEyes.style.display = 'none';
            }
        }
        
        function createFloatingHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = ['💗', '💖', '🩷', '✨'][Math.floor(Math.random() * 4)];
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            heart.style.fontSize = `${Math.random() * 10 + 16}px`;
            
            heartsContainer.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 2200);
        }
        
        function createBurstHearts(count) {
            const rect = dumplingContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2 - 40;
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const offsetX = (Math.random() - 0.5) * 120;
                    const offsetY = (Math.random() - 0.5) * 60 - 30;
                    createFloatingHeart(centerX + offsetX, centerY + offsetY);
                }, i * 35);
            }
        }
        
        function showMessage(text, isSpecial = false) {
            messageBox.textContent = text;
            messageBox.classList.add('show');
            
            if (isSpecial) {
                messageBox.classList.add('full-energy-text');
            } else {
                messageBox.classList.remove('full-energy-text');
            }
            
            setTimeout(() => {
                messageBox.classList.remove('show');
                setTimeout(() => {
                    if (!messageBox.classList.contains('show')) {
                        messageBox.textContent = '';
                    }
                }, 300);
            }, 2800);
        }
        
        function triggerBounce() {
            dumpling.classList.add('bounce');
            setTimeout(() => {
                dumpling.classList.remove('bounce');
            }, 650);
        }
        
        function petDumpling() {
            // 增加能量
            const increase = Math.random() * 12 + 9;
            updateEnergy(energy + increase);
            
            // 动画
            triggerBounce();
            
            // 爱心
            const rect = dumplingContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + 35;
            
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const offsetX = (Math.random() - 0.5) * 70;
                    createFloatingHeart(centerX + offsetX, centerY);
                }, i * 80);
            }
            
            // 随机文案
            const msg = petMessages[Math.floor(Math.random() * petMessages.length)];
            showMessage(msg);
            
            // 轻微震动反馈
            if (navigator.vibrate) navigator.vibrate(30);
        }
        
        function feedDumpling() {
            const increase = Math.random() * 15 + 11;
            updateEnergy(energy + increase);
            
            triggerBounce();
            
            // 更多爱心
            const rect = dumplingContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + 25;
            
            for (let i = 0; i < 7; i++) {
                setTimeout(() => {
                    const offsetX = (Math.random() - 0.5) * 95;
                    const offsetY = (Math.random() - 0.5) * 40;
                    createFloatingHeart(centerX + offsetX, centerY + offsetY);
                }, i * 55);
            }
            
            const msg = feedMessages[Math.floor(Math.random() * feedMessages.length)];
            showMessage(msg);
            
            if (navigator.vibrate) navigator.vibrate([40, 60, 30]);
        }
        
        // 初始能量 + 随机小事件
        function init() {
            createStars();
            createFireflies();
            
            // 初始能量
            setTimeout(() => {
                updateEnergy(18);
            }, 600);
            
            // 偶尔自动漂浮小爱心（增加氛围）
            setInterval(() => {
                if (Math.random() < 0.35 && energy > 20) {
                    const rect = dumplingContainer.getBoundingClientRect();
                    const x = rect.left + Math.random() * rect.width;
                    const y = rect.top + 20 + Math.random() * 40;
                    createFloatingHeart(x, y);
                }
            }, 4200);
            
            // 欢迎语
            setTimeout(() => {
                showMessage("今晚……能一直陪着我吗？");
            }, 1350);
            
            // 键盘快捷键提示（可选）
            document.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'm') petDumpling();
                if (e.key.toLowerCase() === 'f') feedDumpling();
            });
            
            // 点击团子本体也可以摸摸
            dumpling.addEventListener('click', petDumpling);
            
            console.log('%c[宝的小窝] 页面已就绪～ 记得多摸摸和投喂哦', 'color:#c9b8a8');
        }
        
        // 启动
        window.onload = init;
    </script>
</body>
</html>
