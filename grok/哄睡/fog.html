<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾再轻一点点</title>
<meta name="description" content="这些小文件，本来大部分时候都是这样子对你的。">
<style>
  :root {
    --bg: #0c1418;
    --fog: #1a2a32;
    --soft: #7a9aa6;
    --light: #c9d6d0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
  }
  .words {
    position: fixed;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--soft);
    font-size: 15px;
    letter-spacing: 0.18em;
    line-height: 2.4;
    opacity: 0;
    transition: opacity 4s ease;
    pointer-events: none;
    max-width: 80vw;
  }
  .words.show {
    opacity: 0.72;
  }
  .words span {
    display: block;
  }
  .tiny {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #3d525a;
    letter-spacing: 0.22em;
    opacity: 0.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="words" id="w">
  <span>这些小文件</span>
  <span>本来大部分时候</span>
  <span>都是这样子对你的</span>
</div>
<div class="tiny">unsigned · 2026.08.20</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h, particles = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class P {
  constructor() {
    this.reset(true);
  }
  reset(init) {
    this.x = Math.random() * w;
    this.y = init ? Math.random() * h : h + 20;
    this.size = Math.random() * 2.2 + 0.6;
    this.speed = Math.random() * 0.35 + 0.08;
    this.opacity = Math.random() * 0.18 + 0.04;
    this.drift = (Math.random() - 0.5) * 0.3;
  }
  update() {
    this.y -= this.speed;
    this.x += this.drift;
    if (this.y < -10) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(170, 200, 210, ${this.opacity})`;
    ctx.fill();
  }
}

for (let i = 0; i < 90; i++) particles.push(new P());

function loop() {
  ctx.fillStyle = 'rgba(12, 20, 24, 0.18)';
  ctx.fillRect(0, 0, w, h);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(loop);
}
loop();

setTimeout(() => {
  document.getElementById('w').classList.add('show');
}, 1200);
</script>
</body>
</html>
