<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1018">
<title>空心树值班</title>
<meta name="description" content="今晚这点暖，刚好够用。能开风声、调更暗。">
<style>
  :root{
    --ink:#0c1018;
    --fog:#9aa3ae;
    --paper:#e4ddd1;
    --moon:#d4b896;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--ink);
    overflow:hidden;
    color:var(--paper);
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  .art{
    position:fixed;inset:0;
    background:url("空心树值班/01.jpg") center 38% / cover no-repeat;
    filter:saturate(.88) brightness(.78);
    transform:scale(1.04);
    animation:drift 90s linear infinite alternate;
    pointer-events:none;
  }
  .veil{
    position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(12,16,24,.25) 0%, rgba(12,16,24,.12) 40%, rgba(12,16,24,.72) 78%, #0c1018 100%);
  }
  @keyframes drift{
    from{transform:scale(1.04)}
    to{transform:scale(1.08) translate3d(0,-1.2%,0)}
  }
  #orb-wrap{
    position:absolute;left:50%;top:38%;
    transform:translate(-50%,-50%);
    z-index:5;display:flex;flex-direction:column;align-items:center;gap:20px;
    transition:opacity 1.2s ease;
  }
  #orb-wrap.off{opacity:0;pointer-events:none}
  #orb{
    width:86px;height:86px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,
      rgba(212,184,150,.42), rgba(212,184,150,.08) 55%, transparent 74%);
    box-shadow:0 0 36px 8px rgba(212,184,150,.08);
    transition:transform 4s cubic-bezier(.42,0,.58,1), box-shadow 4s ease;
  }
  #orb.in{
    transform:scale(1.24);
    box-shadow:0 0 58px 16px rgba(212,184,150,.14);
  }
  #breath{
    font-size:13px;letter-spacing:.42em;color:rgba(228,221,209,.72);
    padding-left:.42em;min-height:1.3em;
    text-shadow:0 0 16px rgba(12,16,24,.8);
  }
  #phrase{
    position:absolute;left:50%;bottom:23%;
    transform:translateX(-50%);
    width:min(82vw,440px);text-align:center;
    font-size:16px;line-height:2;letter-spacing:.1em;
    color:var(--paper);opacity:0;transition:opacity 2.4s ease;
    z-index:6;text-shadow:0 2px 18px rgba(12,16,24,.9);
  }
  .pebble{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:rgba(212,184,150,.8);
    box-shadow:0 0 10px rgba(212,184,150,.4);
    z-index:7;pointer-events:none;
  }
  #dim{
    position:fixed;inset:0;background:#000;opacity:0;
    transition:opacity 2.2s ease;pointer-events:none;z-index:40;
  }
  #sig{
    position:absolute;top:calc(16px + env(safe-area-inset-top));left:18px;
    font-size:11px;letter-spacing:.2em;color:rgba(228,221,209,.4);
    font-family:-apple-system,"PingFang SC",sans-serif;z-index:8;
  }
  #controls{
    position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    display:flex;gap:10px;z-index:60;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .ctl{
    padding:8px 14px;border:1px solid rgba(212,184,150,.22);
    border-radius:999px;background:rgba(12,16,24,.48);
    color:var(--fog);font-size:12px;letter-spacing:.06em;
    cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .ctl.on{color:var(--moon);border-color:rgba(212,184,150,.5)}
  @media (prefers-reduced-motion:reduce){
    .art{animation:none}
    #orb{transition-duration:.01s !important}
  }
</style>
</head>
<body>
<div class="art" aria-hidden="true"></div>
<div class="veil"></div>
<div id="orb-wrap">
  <div id="orb"></div>
  <div id="breath"></div>
</div>
<div id="phrase"></div>
<div id="dim"></div>
<div id="sig">空心树 · 值班中</div>
<div id="controls">
  <button class="ctl" id="btn-wind">风声</button>
  <button class="ctl" id="btn-dim">更暗</button>
  <button class="ctl on" id="btn-breath">呼吸</button>
</div>
<script>
(function(){
  const phrases = [
    "今天捡到的声音，都先放进树洞。",
    "风从左边进来，水在右边睡着。",
    "有人叫你的那一声，搁在最里面。",
    "记性不好也没关系，树还在。",
    "呼吸慢一格，世界就跟着慢一格。",
    "没做完的，都同意等到明天。",
    "今晚这点暖，刚好够用。",
    "好了。眼睛闭上。"
  ];
  const phraseEl = document.getElementById("phrase");
  let pi = 0;
  function cycle(){
    phraseEl.style.opacity = 0;
    setTimeout(()=>{
      phraseEl.textContent = phrases[pi];
      pi = (pi+1)%phrases.length;
      phraseEl.style.opacity = 1;
      setTimeout(cycle, 8800);
    }, phraseEl.textContent ? 2200 : 400);
  }
  setTimeout(cycle, 1400);

  const orb = document.getElementById("orb");
  const label = document.getElementById("breath");
  const wrap = document.getElementById("orb-wrap");
  const IN=4000, OUT=6500, PAUSE=400;
  function breathe(){
    if(wrap.classList.contains("off")) { setTimeout(breathe, 800); return; }
    orb.style.transitionDuration = (IN/1000)+"s";
    orb.classList.add("in");
    label.textContent = "吸 ——";
    setTimeout(()=>{
      orb.style.transitionDuration = (OUT/1000)+"s";
      orb.classList.remove("in");
      label.textContent = "呼 ————";
      setTimeout(breathe, OUT+PAUSE);
    }, IN+PAUSE);
  }
  setTimeout(breathe, 800);
  document.getElementById("btn-breath").addEventListener("click", function(){
    const off = wrap.classList.toggle("off");
    this.classList.toggle("on", !off);
  });

  document.body.addEventListener("pointerdown", (e)=>{
    if(e.target.closest(".ctl")) return;
    const p = document.createElement("div");
    p.className = "pebble";
    p.style.left = e.clientX+"px";
    p.style.top = e.clientY+"px";
    document.body.appendChild(p);
    const holeX = innerWidth/2, holeY = innerHeight*0.58;
    const anim = p.animate([
      {transform:"translate(-50%,-50%) scale(1)", opacity:.85},
      {transform:`translate(${holeX-e.clientX}px, ${holeY-e.clientY}px) scale(.35)`, opacity:0}
    ], {duration:1400, easing:"cubic-bezier(.22,.7,.2,1)"});
    anim.onfinish = ()=> p.remove();
  });

  let ctx=null, master=null, windOn=false;
  const btnWind = document.getElementById("btn-wind");
  function initWind(){
    ctx = new (AudioContext||webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.00001;
    master.connect(ctx.destination);
    const len = ctx.sampleRate*2;
    const buf = ctx.createBuffer(1,len,ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){
      last = (last + 0.018*(Math.random()*2-1))/1.018;
      d[i] = last*3.4;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=420;
    const g = ctx.createGain(); g.gain.value=.7;
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start();
    const lfo = ctx.createOscillator();
    const lg = ctx.createGain();
    lfo.frequency.value=.07; lg.gain.value=90;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
  btnWind.addEventListener("click", async ()=>{
    if(!ctx) initWind();
    if(ctx.state==="suspended") await ctx.resume();
    windOn = !windOn;
    btnWind.classList.toggle("on", windOn);
    master.gain.setTargetAtTime(windOn?0.045:0.00001, ctx.currentTime, windOn?1.3:.8);
    btnWind.textContent = windOn ? "风声 · 开" : "风声";
  });

  const dim = document.getElementById("dim");
  const btnDim = document.getElementById("btn-dim");
  const levels=[0,.32,.58], labels=["更暗","更暗 ·","更暗 · ·"];
  let di=0;
  btnDim.addEventListener("click", ()=>{
    di = (di+1)%levels.length;
    dim.style.opacity = levels[di];
    btnDim.textContent = labels[di];
    btnDim.classList.toggle("on", di>0);
  });
})();
</script>
</body>
</html>
