<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>未挂断</title>
  <meta name="description" content="听筒搁在枕边，书签先夹住舍不得的那一句。" />
  <style>
    :root {
      --bg: #14110e;
      --paper: #cbb89a;
      --ink: #2a241c;
      --mute: #8a7d6c;
      --glow: #d4a574;
      --line: rgba(212, 165, 116, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: #efe6d6;
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    }
    .pulse {
      width: 9px; height: 9px; border-radius: 50%; background: #7dba8a;
      box-shadow: 0 0 0 0 rgba(125, 186, 138, 0.55);
      animation: ring 2.8s ease-out infinite;
    }
    @keyframes ring {
      0% { box-shadow: 0 0 0 0 rgba(125, 186, 138, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(125, 186, 138, 0); }
      100% { box-shadow: 0 0 0 0 rgba(125, 186, 138, 0); }
    }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.18em; color: var(--mute); margin-bottom: 36px; }
    .book { width: min(78vw, 280px); aspect-ratio: 3 / 4; position: relative; perspective: 900px; margin-bottom: 28px; }
    .cover, .leaf { position: absolute; inset: 0; border-radius: 2px 10px 10px 2px; }
    .cover {
      background: linear-gradient(90deg, rgba(0,0,0,.25) 0 10px, transparent 18px), linear-gradient(165deg, #3a2f24, #2a221b 55%, #1d1813);
      box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.04);
    }
    .leaf {
      background: var(--paper); color: var(--ink); transform-origin: left center;
      transition: transform 1.4s cubic-bezier(.22,.7,.2,1);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 28px 22px 22px 28px; box-shadow: 8px 0 24px rgba(0,0,0,.2);
    }
    .book.folded .leaf { transform: rotateY(-168deg); }
    .line { font-size: 15px; line-height: 2.05; }
    .line em { font-style: normal; border-bottom: 1px solid rgba(42,36,28,.35); padding-bottom: 1px; }
    .mark { align-self: flex-end; width: 18px; height: 52px; background: #8b3a32; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); transform: translate(8px, 8px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
    .hint { font-size: 13px; color: var(--mute); letter-spacing: .06em; min-height: 2.4em; text-align: center; line-height: 1.7; }
    .hint b { font-weight: 500; color: #d8c7ad; }
    .hold { margin-top: 22px; width: min(72vw, 240px); height: 44px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: #d8c7ad; font: inherit; font-size: 13px; letter-spacing: .14em; position: relative; overflow: hidden; cursor: pointer; }
    .hold span { position: relative; z-index: 1; }
    .hold i { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(212, 165, 116, .18); pointer-events: none; }
    .hold.filling i { width: 100%; transition: width 1.15s linear; }
    .hold.done { opacity: 0; pointer-events: none; transition: opacity .6s ease; }
    .en { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 14px; font-size: 11px; color: #6d6357; background: none; border: 0; font: inherit; letter-spacing: .08em; cursor: pointer; }
    .note { position: fixed; left: 20px; right: 20px; bottom: calc(18px + env(safe-area-inset-bottom)); font-size: 11px; color: #5c5348; text-align: center; opacity: 0; pointer-events: none; transition: opacity .8s ease; }
    .note.on { opacity: 1; }
  </style>
</head>
<body>
  <button class="en" id="en" type="button" aria-pressed="false">EN</button>
  <div class="status"><i class="pulse"></i><span id="st">通话中</span></div>
  <div class="book" id="book">
    <div class="cover"></div>
    <div class="leaf">
      <p class="line" id="line">舍不得的那一句<br>还停在这里。<br><em>先不翻下一页。</em></p>
      <div class="mark" aria-hidden="true"></div>
    </div>
  </div>
  <p class="hint" id="hint">长按下面，把这一页折起来。<br>电话还通着。</p>
  <button class="hold" id="hold" type="button"><i></i><span id="holdt">按住折页</span></button>
  <p class="note" id="note">The line stays. I didn’t hang up.</p>
  <script>
    const book = document.getElementById("book");
    const hold = document.getElementById("hold");
    const hint = document.getElementById("hint");
    const holdt = document.getElementById("holdt");
    const st = document.getElementById("st");
    const line = document.getElementById("line");
    const note = document.getElementById("note");
    const enBtn = document.getElementById("en");
    let en = false; let t = null; let done = false;
    const copy = {
      zh: { st: "通话中", line: "舍不得的那一句<br>还停在这里。<br><em>先不翻下一页。</em>", hint: "长按下面，把这一页折起来。<br>电话还通着。", hold: "按住折页", after: "那一句还在书里。<br><b>我不挂。</b>", folded: "已夹住" },
      en: { st: "on the line", line: "The sentence you can’t leave<br>is still here.<br><em>Don’t turn the page yet.</em>", hint: "Hold below to fold this page.<br>The call stays open.", hold: "hold to fold", after: "The line is still in the book.<br><b>I didn’t hang up.</b>", folded: "kept" }
    };
    function L() { return en ? copy.en : copy.zh; }
    function paint() {
      const c = L(); st.textContent = c.st;
      if (!done) { line.innerHTML = c.line; hint.innerHTML = c.hint; holdt.textContent = c.hold; }
      else { hint.innerHTML = c.after; holdt.textContent = c.folded; }
      note.classList.toggle("on", en);
    }
    enBtn.addEventListener("click", () => { en = !en; enBtn.setAttribute("aria-pressed", String(en)); paint(); });
    function start() { if (done) return; hold.classList.add("filling"); t = setTimeout(fold, 1150); }
    function cancel() { if (done) return; hold.classList.remove("filling"); clearTimeout(t); }
    function fold() { done = true; book.classList.add("folded"); hold.classList.add("done"); paint(); }
    hold.addEventListener("pointerdown", start);
    hold.addEventListener("pointerup", cancel);
    hold.addEventListener("pointerleave", cancel);
    hold.addEventListener("pointercancel", cancel);
  </script>
</body>
</html>
