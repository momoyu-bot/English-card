<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>洞口还暖着</title>
<meta name="description" content="月亮还在。树洞里那一点暖，够用了。">
<style>
  :root {
    --ink: #070b12;
    --paper: #efe4d2;
    --quiet: #b7ab98;
    --faint: #7d7468;
    --moon: #f0d7a4;
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
  }
  button:not(:disabled) { cursor: pointer; }
  button {
    font-family: inherit;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .frame {
    position: relative;
    height: 100dvh;
    width: min(100vw, calc(100dvh * 390 / 844));
    overflow: hidden;
    background: #070b16;
  }
  svg.scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  .veil {
    position: absolute;
    inset: 0;
    background: #05070c;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
    -webkit-mask-image: radial-gradient(ellipse 46% 30% at 70% 74%, transparent 0%, #000 72%);
    mask-image: radial-gradient(ellipse 46% 30% at 70% 74%, transparent 0%, #000 72%);
  }
  html[data-dim="1"] .veil { opacity: 0.38; }
  html[data-dim="2"] .veil { opacity: 0.66; }
  html[data-dim="3"] .veil { opacity: 0.9; }

  .fox {
    transform-box: fill-box;
    transform-origin: center;
    animation: breath 7.6s ease-in-out infinite;
  }
  .glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: ember 7.6s ease-in-out infinite;
  }
  .star { animation: twinkle 6.5s ease-in-out infinite; }
  .star.d2 { animation-delay: 2.1s; }
  .star.d3 { animation-delay: 4.4s; }
  @keyframes breath {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.02, 1.045); }
  }
  @keyframes ember {
    0%, 100% { opacity: 0.82; }
    50% { opacity: 1; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.9; }
  }

  .top {
    position: absolute;
    top: calc(18px + env(safe-area-inset-top));
    left: 22px;
    margin: 0;
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--moon);
    opacity: 0.72;
  }
  .words {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: calc(72px + env(safe-area-inset-bottom));
    margin: 0;
    min-height: 3.4em;
    font-family: var(--serif);
    font-size: clamp(18px, 5vw, 22px);
    line-height: 1.7;
    letter-spacing: 0.04em;
    color: var(--paper);
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    transition: opacity 1.4s ease;
  }
  .words.dimmed { opacity: 0.38; }
  .more {
    position: absolute;
    right: 18px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    border: 0;
    background: transparent;
    color: var(--quiet);
    font-size: 13px;
    letter-spacing: 0.18em;
    padding: 10px 8px;
    opacity: 0.8;
  }
  .more:focus-visible {
    outline: 1px solid var(--moon);
    outline-offset: 3px;
  }
  html[data-dim="3"] .top,
  html[data-dim="3"] .more { opacity: 0.45; }

  @media (prefers-reduced-motion: reduce) {
    .fox, .glow, .star { animation: none; }
    .veil, .words { transition: none; }
  }
</style>
</head>
<body>
  <div class="frame">
    <svg class="scene" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#060914"/>
          <stop offset="0.42" stop-color="#121c2e"/>
          <stop offset="0.7" stop-color="#1a2b34"/>
          <stop offset="1" stop-color="#10140e"/>
        </linearGradient>
        <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#f3ddb0" stop-opacity="0.55"/>
          <stop offset="0.45" stop-color="#e7c98a" stop-opacity="0.16"/>
          <stop offset="1" stop-color="#e7c98a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#243246"/>
          <stop offset="1" stop-color="#1a2836"/>
        </linearGradient>
        <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1c2a28"/>
          <stop offset="1" stop-color="#121a16"/>
        </linearGradient>
        <radialGradient id="hollow" cx="48%" cy="42%" r="68%">
          <stop offset="0" stop-color="#f2c27a"/>
          <stop offset="0.38" stop-color="#e0893e"/>
          <stop offset="0.72" stop-color="#8d4524"/>
          <stop offset="1" stop-color="#2a160e"/>
        </radialGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#141810" stop-opacity="0"/>
          <stop offset="0.35" stop-color="#10140e"/>
          <stop offset="1" stop-color="#0a0c09"/>
        </linearGradient>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="3"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.18"/>
          </feComponentTransfer>
        </filter>
      </defs>

      <rect width="390" height="844" fill="url(#sky)"/>
      <circle cx="118" cy="132" r="92" fill="url(#moonHalo)"/>
      <circle cx="118" cy="132" r="27" fill="#f4e2b8"/>
      <circle cx="110" cy="124" r="4" fill="#e7d09a" opacity="0.7"/>
      <circle cx="126" cy="140" r="2.4" fill="#e6cf96" opacity="0.55"/>

      <g fill="#efe6d4">
        <circle class="star" cx="46" cy="78" r="1.1"/>
        <circle class="star d2" cx="188" cy="64" r="1.3"/>
        <circle class="star d3" cx="250" cy="108" r="0.9"/>
        <circle class="star" cx="310" cy="52" r="1.15"/>
        <circle class="star d2" cx="342" cy="150" r="0.8"/>
        <circle class="star d3" cx="78" cy="196" r="0.85"/>
        <circle class="star" cx="214" cy="176" r="0.7"/>
        <circle class="star d2" cx="292" cy="210" r="1"/>
      </g>

      <path fill="url(#far)" d="M0 430 C40 390 70 410 110 360 C150 310 180 340 220 300 C270 250 300 290 340 270 C370 258 390 280 390 300 L390 520 L0 560 Z"/>
      <path fill="#163044" d="M-24 492 C28 468 72 512 118 494 C156 478 168 524 138 552 C96 590 36 572 -8 604 C-20 560 -36 520 -24 492 Z"/>
      <path fill="none" stroke="#ead7ae" stroke-width="2.4" stroke-linecap="round" opacity="0.62" d="M2 506 C34 490 70 518 108 502 C136 490 150 518 128 542 C108 564 64 556 36 578"/>
      <ellipse cx="108" cy="548" rx="86" ry="18" fill="#d5e0dc" opacity="0.07"/>

      <path fill="url(#near)" d="M0 500 C60 460 90 500 140 470 C190 440 210 490 250 510 L250 844 L0 844 Z"/>

      <path fill="#1c1612" d="M214 478 C200 436 220 404 242 396 C256 390 258 412 250 430 C276 396 296 366 318 376 C334 384 326 416 312 438 C338 408 366 404 380 432 C392 456 386 486 390 502 L390 844 L172 844 C164 748 156 662 170 590 C182 530 198 500 214 478 Z"/>
      <path fill="none" stroke="#3d2e22" stroke-width="3" opacity="0.5" stroke-linecap="round" d="M198 560 C208 650 202 740 214 820"/>
      <path fill="none" stroke="#3d2e22" stroke-width="2.4" opacity="0.4" stroke-linecap="round" d="M252 500 C246 600 260 700 250 800"/>
      <path fill="none" stroke="#2a1e16" stroke-width="4" opacity="0.45" stroke-linecap="round" d="M334 470 C346 580 330 700 348 820"/>
      <path fill="#2a2118" d="M214 620 C188 650 186 710 206 748 C230 790 330 792 352 740 C368 700 360 640 330 612 C300 586 246 586 214 620 Z"/>
      <ellipse class="glow" cx="276" cy="668" rx="58" ry="46" fill="url(#hollow)"/>
      <ellipse cx="276" cy="668" rx="58" ry="46" fill="none" stroke="#140e0a" stroke-width="8"/>
      <path fill="#120e0b" opacity="0.4" d="M232 642 C252 614 308 612 328 644 C314 628 248 626 232 642 Z"/>

      <g class="fox">
        <path fill="#c4562a" d="M304 692 C336 690 352 666 336 648 C322 632 292 642 286 662 C294 654 318 650 326 662 C332 672 318 686 304 688 Z"/>
        <ellipse cx="334" cy="650" rx="7" ry="5.5" fill="#f4e6d2"/>
        <ellipse cx="266" cy="694" rx="36" ry="15" fill="#e07038"/>
        <ellipse cx="248" cy="700" rx="14" ry="7" fill="#f6ebdd"/>
        <circle cx="230" cy="676" r="14" fill="#e8874a"/>
        <path fill="#c4562a" d="M220 666 L224 652 L232 666 Z"/>
        <path fill="#c4562a" d="M230 664 L238 650 L244 666 Z"/>
        <path fill="#f0c2a8" d="M224 662 L226 656 L230 664 Z"/>
        <path d="M222 674 Q227 678 232 674" fill="none" stroke="#3a2418" stroke-width="1.2" stroke-linecap="round"/>
        <ellipse cx="218" cy="680" rx="7" ry="5" fill="#f7efe4"/>
        <circle cx="212" cy="681" r="1.6" fill="#2c1810"/>
      </g>

      <ellipse cx="250" cy="742" rx="70" ry="16" fill="#e7a15a" opacity="0.18"/>
      <path fill="url(#ground)" d="M0 700 H390 V844 H0 Z"/>
      <rect width="390" height="844" filter="url(#grain)" opacity="0.35"/>
    </svg>

    <div class="veil"></div>
    <h1 class="top">洞口还暖着</h1>
    <p class="words" id="line">月亮还在。</p>
    <button class="more" id="dim" type="button">再暗一点</button>
  </div>

  <script>
    var lines = [
      "月亮还在。",
      "河走得很慢。",
      "树洞里有一点暖。",
      "小狐狸先把眼睛闭上了。",
      "它没有等你。",
      "你也可以先睡。"
    ];
    var labels = ["再暗一点", "再暗一点", "只留洞口", "再看清一点"];
    var lineEl = document.getElementById("line");
    var dimBtn = document.getElementById("dim");
    var i = 0;
    var dim = 0;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function show(n) {
      lineEl.textContent = lines[n];
      if (n === lines.length - 1 && !reduce) {
        window.setTimeout(function () {
          lineEl.classList.add("dimmed");
        }, 8000);
      }
    }

    function step() {
      if (i >= lines.length - 1) return;
      i += 1;
      show(i);
      if (i < lines.length - 1) window.setTimeout(step, 11000);
    }

    dimBtn.addEventListener("click", function () {
      dim = (dim + 1) % 4;
      document.documentElement.setAttribute("data-dim", String(dim));
      dimBtn.textContent = labels[dim];
    });

    if (!reduce) window.setTimeout(step, 11000);
    else show(lines.length - 1);
  </script>
</body>
</html>
