<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#100c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>霸道尾巴强制爱版</title>
<meta name="description" content="尾巴借你，压在枕头底下。戳尾巴也可以。">
<style>
:root{
  --night-1:#0f0b11;
  --night-2:#1a1219;
  --night-3:#241722;
  --warm:#e79a5c;
  --fur:#e08a4a;
  --fur-dark:#c26c33;
  --fur-deep:#a4551f;
  --fur-light:#f0a869;
  --cream:#f7e8d6;
  --cream-dim:#e3cdb4;
  --ink:#3b2820;
  --text:#cbb39c;
  --text-dim:#8d7563;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
         system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;background:var(--night-1)}
body{
  min-height:100%;height:100%;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 78%, rgba(231,154,92,.13) 0%, rgba(231,154,92,0) 62%),
    linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 48%,var(--night-3) 100%);
  font-family:var(--font);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:calc(var(--safe-top) + 18px) 20px calc(var(--safe-bottom) + 22px);
  transition:filter 2.4s ease;
  position:relative;
}
body.asleep{filter:brightness(.62) saturate(.86)}

#motes{position:fixed;inset:0;pointer-events:none;z-index:1}
.mote{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,224,180,.75),rgba(255,214,160,0) 70%);
  animation:drift var(--d) linear infinite;
  opacity:0;
}
@keyframes drift{
  0%{transform:translate(0,0);opacity:0}
  12%{opacity:var(--o)}
  88%{opacity:var(--o)}
  100%{transform:translate(var(--dx),var(--dy));opacity:0}
}

.title{
  position:relative;z-index:3;
  font-size:14px;letter-spacing:.22em;
  color:var(--text-dim);
  margin-bottom:6px;
  transition:opacity 1.6s ease;
}
body.asleep .title{opacity:.45}

.stage{
  position:relative;z-index:2;
  width:100%;max-width:412px;
  margin:2px 0 0;
}
.halo{
  position:absolute;left:50%;top:52%;
  width:116%;padding-bottom:72%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(231,154,92,.20) 0%,
    rgba(231,154,92,.09) 34%,
    rgba(231,154,92,0) 66%);
  animation:halo 7.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes halo{0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(1)}
                50%{opacity:1;transform:translate(-50%,-50%) scale(1.055)}}
svg.fox{display:block;width:100%;height:auto;position:relative;cursor:pointer;touch-action:manipulation}
#breath{transform-origin:214px 268px;animation:breathe 5.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.017,1.028)}}
body.asleep #breath{animation-duration:7.6s}

#tail{transform-origin:318px 198px;animation:sweep 8.2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2.6deg)}}
body.asleep #tail{animation-duration:12s}
#tail.swish{animation:swish .72s ease-in-out}
@keyframes swish{
  0%{transform:rotate(0)}
  28%{transform:rotate(-12deg)}
  56%{transform:rotate(5deg)}
  100%{transform:rotate(0)}
}

#ear-far{transform-origin:184px 162px}
#ear-near{transform-origin:128px 172px}
.twitch{animation:twitch .82s ease-in-out}
@keyframes twitch{0%{transform:rotate(0)}22%{transform:rotate(-9deg)}
                  48%{transform:rotate(5deg)}72%{transform:rotate(-3deg)}100%{transform:rotate(0)}}

#puff{opacity:0}
.puffing{animation:puff 2.2s ease-out}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}
                18%{opacity:.55}
                100%{opacity:0;transform:translate(-26px,-30px) scale(1.5)}}

.line{
  position:relative;z-index:3;
  min-height:2.6em;
  margin-top:10px;
  font-size:16.5px;line-height:1.8;letter-spacing:.04em;
  color:var(--text);
  text-align:center;
  transition:opacity .9s ease;
}
.line.fade{opacity:0}
.hint{
  position:relative;z-index:3;
  margin-top:2px;
  font-size:12.5px;letter-spacing:.16em;
  color:var(--text-dim);opacity:.62;
  transition:opacity 1.4s ease;
}
body.asleep .hint{opacity:0}
@media (max-height:640px){
  .line{font-size:15.5px}
  .stage{max-width:330px}
}
</style>
</head>
<body>
<div id="motes"></div>

<div class="title">霸道尾巴强制爱版</div>

<div class="stage">
  <div class="halo"></div>
  <svg class="fox" viewBox="42 84 362 228" role="img" aria-label="一只尾巴很霸道的小狐狸">
    <defs>
      <radialGradient id="g-body" cx="38%" cy="26%" r="80%">
        <stop offset="0%" stop-color="#f2ac6c"/>
        <stop offset="60%" stop-color="#e08a4a"/>
        <stop offset="100%" stop-color="#bf6931"/>
      </radialGradient>
      <radialGradient id="g-tail" cx="72%" cy="26%" r="88%">
        <stop offset="0%" stop-color="#ec9c5e"/>
        <stop offset="68%" stop-color="#cf7a3c"/>
        <stop offset="100%" stop-color="#a0521d"/>
      </radialGradient>
      <radialGradient id="g-head" cx="44%" cy="30%" r="76%">
        <stop offset="0%" stop-color="#f6b57c"/>
        <stop offset="64%" stop-color="#e28d4d"/>
        <stop offset="100%" stop-color="#c56e2d"/>
      </radialGradient>
      <radialGradient id="g-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(0,0,0,.40)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>
    </defs>

    <ellipse cx="214" cy="290" rx="150" ry="20" fill="url(#g-shadow)"/>

    <g id="breath">
      <path d="M104,214
               C98,146 148,100 214,100
               C284,100 338,146 338,206
               C338,246 306,264 262,264
               L152,264
               C118,264 107,244 104,214 Z"
            fill="url(#g-body)"/>

      <g id="ear-far">
        <path d="M160,164 C168,142 178,124 188,116
                 C196,126 203,142 207,160
                 C192,155 175,157 160,164 Z" fill="#b0642a"/>
      </g>

      <g id="tail">
        <path d="M305,138
                 C368,150 394,214 350,260
                 C318,298 214,306 158,286
                 C136,276 132,256 148,248
                 C164,270 206,282 248,284
                 C294,286 334,260 344,218
                 C354,180 334,148 305,138 Z"
              fill="url(#g-tail)"/>
        <path d="M148,248
                 C132,256 136,276 158,286
                 C176,294 196,298 216,298
                 C192,286 170,270 158,256
                 C154,252 150,249 148,248 Z"
              fill="var(--cream-dim)"/>
      </g>

      <g id="head">
        <g id="ear-near">
          <path d="M98,174 C102,142 111,116 122,104
                   C137,118 154,142 162,162
                   C142,152 118,158 98,174 Z" fill="var(--fur)"/>
          <path d="M111,164 C114,142 120,124 127,116
                   C136,127 146,142 152,157
                   C138,152 124,155 111,164 Z" fill="#9a4f3c" opacity=".55"/>
        </g>
        <circle cx="150" cy="196" r="56" fill="url(#g-head)"/>

        <path d="M130,188
                 C110,194 80,210 70,220
                 C61,229 65,240 80,245
                 C99,251 130,252 150,246
                 C165,241 171,228 167,213
                 C154,211 138,200 130,188 Z"
              fill="var(--cream)"/>
        <path d="M132,182 C112,188 88,202 76,213
                 C92,209 114,201 138,196 Z"
              fill="var(--fur-light)" opacity=".92"/>

        <path d="M104,250 C104,243 113,239 124,239
                 C135,239 143,243 143,250
                 C143,256 135,259 124,259
                 C113,259 104,256 104,250 Z"
              fill="#f2e0c9" stroke="rgba(120,64,28,.18)" stroke-width="1.6"/>
        <path d="M138,253 C138,246 147,242 158,242
                 C169,242 177,246 177,253
                 C177,259 169,262 158,262
                 C147,262 138,259 138,253 Z"
              fill="#e8d3ba" stroke="rgba(120,64,28,.18)" stroke-width="1.6"/>

        <ellipse cx="72" cy="217" rx="8.5" ry="6.5" fill="var(--ink)"
                 transform="rotate(-16 72 217)"/>
        <path d="M78,229 Q88,236 98,230" stroke="var(--ink)" stroke-width="3"
              stroke-linecap="round" fill="none" opacity=".5"/>

        <path d="M106,184 Q120,196 136,184" stroke="var(--ink)" stroke-width="4.8"
              stroke-linecap="round" fill="none"/>
        <path d="M162,178 Q174,188 187,177" stroke="var(--ink)" stroke-width="4.2"
              stroke-linecap="round" fill="none" opacity=".78"/>

        <ellipse cx="178" cy="200" rx="11" ry="6.5" fill="#e07a6a" opacity=".17"/>
      </g>

      <g id="puff">
        <circle cx="54" cy="211" r="6.5" fill="rgba(255,232,205,.8)"/>
        <circle cx="40" cy="201" r="4" fill="rgba(255,232,205,.5)"/>
      </g>
    </g>
  </svg>
</div>

<p class="line" id="line">尾巴借你，压在枕头底下。</p>
<p class="hint" id="hint">戳尾巴也可以</p>

<script>
(function(){
  var box = document.getElementById('motes'), i, m;
  for(i=0;i<26;i++){
    m = document.createElement('div');
    m.className = 'mote';
    var s = 1.4 + Math.random()*3.2;
    m.style.width = m.style.height = s.toFixed(1)+'px';
    m.style.left = (Math.random()*100).toFixed(2)+'%';
    m.style.top  = (Math.random()*100).toFixed(2)+'%';
    m.style.setProperty('--d', (16+Math.random()*22).toFixed(1)+'s');
    m.style.setProperty('--o', (.14+Math.random()*.34).toFixed(2));
    m.style.setProperty('--dx', (-40+Math.random()*80).toFixed(0)+'px');
    m.style.setProperty('--dy', (-70-Math.random()*110).toFixed(0)+'px');
    m.style.animationDelay = (-Math.random()*30).toFixed(1)+'s';
    box.appendChild(m);
  }

  var lines = [
    '尾巴借你，压在枕头底下。',
    '今天到这儿就行了，剩下的明天再说。',
    '我守着，你先睡。',
    '窗外有风，但吹不进来。',
    '不数羊了，数呼吸。',
    '手机放远一点，我不会跑。',
    '灯我来关，你闭眼就好。',
    '被子拉到下巴，这样最暖。',
    '没做完的事，它们也睡了。',
    '睡着了也没关系，我还在。'
  ];
  var tailLines = [
    '哎，那是借你盖的，不是让你戳的。',
    '尾巴有点痒。',
    '……好吧，这一下算你的。'
  ];
  var lineEl = document.getElementById('line'),
      hintEl = document.getElementById('hint'),
      earN   = document.getElementById('ear-near'),
      earF   = document.getElementById('ear-far'),
      puff   = document.getElementById('puff'),
      tail   = document.getElementById('tail'),
      bag    = [], tailBag = [], touched = 0, timer, lock = 0;

  function shuffleDraw(src, hold){
    if(!hold.length){
      hold.push.apply(hold, src);
      for(var j=hold.length-1;j>0;j--){
        var k = Math.floor(Math.random()*(j+1));
        var t = hold[j]; hold[j] = hold[k]; hold[k] = t;
      }
      if(hold[hold.length-1] === lineEl.textContent && hold.length > 1){
        hold.unshift(hold.pop());
      }
    }
    return hold.pop();
  }

  function replay(el, cls){
    if(!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function wake(){
    document.body.classList.remove('asleep');
    clearTimeout(timer);
    timer = setTimeout(function(){ document.body.classList.add('asleep'); }, 45000);
  }

  function pet(onTail){
    var now = Date.now();
    if(now - lock < 280) return;
    lock = now;
    wake();
    touched++;
    if(onTail){
      replay(tail,'swish');
      setTimeout(function(){ tail.classList.remove('swish'); }, 740);
    } else {
      replay(earN,'twitch');
      setTimeout(function(){ replay(earF,'twitch'); }, 120);
      replay(puff,'puffing');
    }
    lineEl.classList.add('fade');
    setTimeout(function(){
      lineEl.textContent = onTail ? shuffleDraw(tailLines, tailBag) : shuffleDraw(lines, bag);
      lineEl.classList.remove('fade');
    }, 620);
    if(touched === 1){
      hintEl.style.opacity = 0;
      setTimeout(function(){ hintEl.textContent = ''; }, 1500);
    }
  }

  function fromEvent(e){
    var n = e.target;
    return !!(n && n.closest && n.closest('#tail'));
  }

  document.addEventListener('pointerdown', function(e){
    e.preventDefault();
    pet(fromEvent(e));
  }, {passive:false});

  wake();
})();
</script>
</body>
</html>
