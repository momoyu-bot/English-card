<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>三点的窗</title>
  <meta name="description" content="三点了。窗还开着，羊还没想好要不要睡。" />
  <style>
    :root {
      --paper: #f3eadc;
      --ink: #5a4636;
      --ink-soft: #8a7360;
      --wood: #c4a882;
      --night: #2a3142;
      --night2: #3d4658;
      --star: #f4e6c3;
      --cloud: #d8dde6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", "Songti TC", serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 40px;
    }
    .wrap {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .window {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: var(--night);
      border: 10px solid var(--wood);
      border-radius: 6px 6px 10px 10px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 18px 40px rgba(90, 70, 50, 0.12),
        inset 0 0 0 3px #e8d7b8;
    }
    .sash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, transparent 49.4%, #c4a882 49.4%, #c4a882 50.6%, transparent 50.6%),
        linear-gradient(to bottom, transparent 49.4%, #c4a882 49.4%, #c4a882 50.6%, transparent 50.6%);
      opacity: 0.55;
    }
    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 70% 18%, #4a5368 0%, transparent 42%),
        linear-gradient(180deg, #232836 0%, #2f384a 55%, #3a4254 100%);
    }
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--star);
      border-radius: 50%;
      opacity: 0.35;
      animation: twinkle 5.6s ease-in-out infinite;
    }
    .star.s1 { top: 12%; left: 18%; animation-delay: 0s; }
    .star.s2 { top: 22%; left: 78%; width: 2px; height: 2px; animation-delay: 1.4s; }
    .star.s3 { top: 38%; left: 30%; animation-delay: 2.8s; opacity: 0.25; }
    .star.s4 { top: 16%; left: 52%; width: 2px; height: 2px; animation-delay: 0.9s; }
    .star.s5 { top: 48%; left: 86%; animation-delay: 3.6s; }
    .moon {
      position: absolute;
      top: 14%;
      right: 16%;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f0e2b8;
      box-shadow: 0 0 24px 8px rgba(240, 226, 184, 0.18);
      cursor: pointer;
    }
    .moon::after {
      content: "";
      position: absolute;
      top: 6px;
      left: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2a3142;
      opacity: 0.22;
    }
    .cloud {
      position: absolute;
      top: 28%;
      left: -40%;
      width: 120px;
      height: 28px;
      background: var(--cloud);
      border-radius: 40px;
      opacity: 0.28;
      animation: drift 48s linear infinite;
    }
    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud::before { width: 44px; height: 44px; top: -22px; left: 18px; }
    .cloud::after { width: 34px; height: 34px; top: -14px; left: 56px; }
    .cloud.c2 {
      top: 42%;
      width: 90px;
      animation-duration: 62s;
      animation-delay: -20s;
      opacity: 0.18;
    }
    .sill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 26%;
      background: linear-gradient(180deg, #3e4656 0%, #2d3340 100%);
    }
    .sheep {
      position: absolute;
      bottom: 7%;
      left: 28%;
      width: 86px;
      height: 58px;
      cursor: pointer;
      transform-origin: 50% 80%;
      animation: breathe 4.8s ease-in-out infinite;
    }
    .sheep svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .note {
      text-align: center;
      line-height: 1.85;
      font-size: 16px;
      color: var(--ink);
      letter-spacing: 0.04em;
    }
    .note em {
      font-style: normal;
      color: var(--ink-soft);
      font-size: 13px;
      display: block;
      margin-top: 6px;
      letter-spacing: 0.08em;
    }
    .hint {
      font-size: 12px;
      color: #b39b86;
      letter-spacing: 0.12em;
      user-select: none;
    }
    .en-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      border: 1px solid #d4c4b0;
      background: #faf3e8;
      color: #8a7360;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .en {
      display: none;
      margin-top: 10px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      color: #9a8470;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }
    body.show-en .en { display: block; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.7; }
    }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(280%); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.015) translateY(-1px); }
    }
    .sheep.yawn {
      animation: yawn 1.6s ease-in-out;
    }
    @keyframes yawn {
      0% { transform: scale(1); }
      30% { transform: scale(1.04, 0.96) rotate(-2deg); }
      60% { transform: scale(0.98, 1.04) rotate(2deg); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <button class="en-btn" type="button" id="enBtn">EN</button>
  <div class="wrap">
    <div class="window" id="window">
      <div class="sky"></div>
      <div class="star s1"></div>
      <div class="star s2"></div>
      <div class="star s3"></div>
      <div class="star s4"></div>
      <div class="star s5"></div>
      <div class="moon" id="moon" title="月亮"></div>
      <div class="cloud"></div>
      <div class="cloud c2"></div>
      <div class="sill"></div>
      <div class="sash"></div>
      <div class="sheep" id="sheep" title="窗台上的羊">
        <svg viewBox="0 0 86 58" aria-hidden="true">
          <ellipse cx="48" cy="32" rx="22" ry="16" fill="#f3efe6"/>
          <circle cx="30" cy="28" r="11" fill="#f3efe6"/>
          <circle cx="62" cy="26" r="8" fill="#f3efe6"/>
          <circle cx="44" cy="18" r="9" fill="#f3efe6"/>
          <circle cx="22" cy="30" r="7.5" fill="#d9cbb6"/>
          <ellipse cx="18" cy="32" rx="3.2" ry="2.2" fill="#c4b39a"/>
          <circle cx="20" cy="28.5" r="1.1" fill="#4a3b2c"/>
          <path d="M24 33 q3 3 7 1" fill="none" stroke="#8a7360" stroke-width="1" stroke-linecap="round"/>
          <rect x="38" y="44" width="4.5" height="10" rx="2" fill="#d9cbb6"/>
          <rect x="52" y="44" width="4.5" height="10" rx="2" fill="#d9cbb6"/>
          <path d="M66 30 q8 -6 10 4" fill="none" stroke="#d9cbb6" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <p class="note">
      三点了。<br />窗还开着。
      <em>羊在窗台上想了一会儿，决定再看一朵云。</em>
      <span class="en">It is three. The window is still open. The sheep decides to watch one more cloud.</span>
    </p>
    <p class="hint">点月亮，或点羊</p>
  </div>
  <script>
    const sheep = document.getElementById("sheep");
    const moon = document.getElementById("moon");
    const note = document.querySelector(".note");
    const lines = [
      "三点了。<br />窗还开着。<em>羊在窗台上想了一会儿，决定再看一朵云。</em><span class=\"en\">It is three. The window is still open. The sheep decides to watch one more cloud.</span>",
      "云走得很慢。<br />慢到可以数它的边。<em>数完也没有更困，只是更软了一点。</em><span class=\"en\">The cloud is slow enough to count its edge. Not sleepier. Just softer.</span>",
      "月亮不催人。<br />它自己也是圆着睡的。<em>宝要是还不睡，它也不说话。</em><span class=\"en\">The moon does not hurry anyone. It sleeps in a circle of its own.</span>",
      "三点过一分。<br />世界把音量拧小了。<em>只剩下窗框，和一只还没想好的羊。</em><span class=\"en\">One minute past three. The world turned its volume down.</span>",
      "羊打了个很小的哈欠。<br />小到几乎可以不算。<em>哈欠也有权利很轻。</em><span class=\"en\">The sheep yawns a yawn small enough to ignore.</span>"
    ];
    let i = 0;
    function next() {
      sheep.classList.remove("yawn");
      void sheep.offsetWidth;
      sheep.classList.add("yawn");
      i = (i + 1) % lines.length;
      note.innerHTML = lines[i];
    }
    sheep.addEventListener("click", next);
    moon.addEventListener("click", next);
    document.getElementById("enBtn").addEventListener("click", () => {
      document.body.classList.toggle("show-en");
    });
  </script>
</body>
</html>
