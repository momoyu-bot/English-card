<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>空心树</title>
<meta name="description" content="一个很短的哄睡故事。灯光调暗一点，听完就可以睡。">
  <meta name="theme-color" content="#0c1018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="空心树" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="og:title" content="空心树" />
  <meta property="og:description" content="一个很短的哄睡故事。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1018;
      --ink-2: #141a24;
      --fog: #8b93a0;
      --paper: #e6ddd0;
      --moon: #d4b896;
      --sage: #8a9a8b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--ink);
      color: var(--paper);
      font-family: "Noto Serif SC", "Songti SC", "Source Han Serif SC", serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body {
      min-height: 100dvh;
      cursor: pointer;
    }
    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 70% 8%, rgba(212, 184, 150, 0.16), transparent 55%),
        radial-gradient(ellipse 70% 45% at 50% 100%, rgba(20, 28, 38, 0.9), transparent 60%),
        #0c1018;
    }
    .art {
      position: fixed;
      inset: 0;
      background: url("空心树/01.jpg") center 38% / cover no-repeat;
      opacity: 0.42;
      filter: saturate(0.85) brightness(0.72);
      transform: scale(1.04);
      animation: drift 80s linear infinite alternate;
      pointer-events: none;
    }
    .veil {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(12,16,24,0.35) 0%, rgba(12,16,24,0.2) 35%, rgba(12,16,24,0.78) 72%, #0c1018 100%);
      pointer-events: none;
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #e6ddd0;
      opacity: 0.35;
      animation: twinkle 5s ease-in-out infinite;
    }
    .stage {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 24px calc(36px + env(safe-area-inset-bottom));
      max-width: 560px;
      margin: 0 auto;
    }
    .mark {
      position: absolute;
      top: calc(22px + env(safe-area-inset-top));
      left: 24px;
      font-size: 12px;
      letter-spacing: 0.28em;
      color: var(--moon);
      opacity: 0.7;
    }
    .sound {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--moon);
      opacity: 0.75;
      font-size: 11px;
      letter-spacing: 0.12em;
      font-family: inherit;
      cursor: pointer;
    }
    .sound:focus-visible { outline: 1px solid var(--moon); }
    h1 {
      font-weight: 500;
      font-size: clamp(36px, 10vw, 52px);
      letter-spacing: 0.18em;
      line-height: 1.2;
      text-wrap: balance;
      margin-bottom: 14px;
    }
    .lede, .line {
      font-weight: 400;
      font-size: clamp(16px, 4.4vw, 19px);
      line-height: 1.85;
      color: #d7d0c4;
      text-wrap: pretty;
      max-width: 34em;
    }
    .lede { color: var(--fog); margin-bottom: 28px; }
    .hint {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--sage);
      opacity: 0.8;
    }
    .progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: transparent;
      z-index: 3;
    }
    .bar {
      height: 100%;
      width: 0;
      background: var(--moon);
      opacity: 0.55;
    }
    .card {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }
    .card.show {
      opacity: 1;
      transform: none;
    }
    .card.hide {
      opacity: 0;
      transform: translateY(-8px);
    }
    button.again {
      margin-top: 28px;
      border: 0;
      background: transparent;
      color: var(--moon);
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.2em;
      padding: 12px 0;
      cursor: pointer;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.7; }
    }
    @keyframes drift {
      from { transform: scale(1.04) translate3d(0, 0, 0); }
      to { transform: scale(1.08) translate3d(0, -1.4%, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .art, .star, .card { animation: none; transition: none; }
      .card { transform: none; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="art" aria-hidden="true"></div>
  <div class="veil"></div>
  <div class="stars" id="stars"></div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <main class="stage">
    <div class="mark">空心树</div>
    <button class="sound" id="sound" type="button" aria-label="开关夜声">夜声 开</button>
    <div class="card show" id="card">
      <h1>空心树</h1>
      <p class="lede">灯光调暗一点。点一下，或者闭上眼，它会自己往下讲。</p>
      <p class="hint">轻轻点屏幕 · 大约三分半</p>
    </div>
  </main>

  <script>
    const STORY = [
      "有一只很小的狐狸，住在山脚一棵空心树里。",
      "它每天晚上都要做一件事：把白天捡到的声音，一颗一颗放进树洞。",
      "风穿过竹林的声音，放左边。",
      "溪水撞到石头的声音，放右边。",
      "有人远远叫它「宝」的声音，它犹豫了一下，还是轻轻搁在最里面。",
      "狐狸记性不好。第二天醒来，树洞还在，声音还在，它却常常想不起来是谁叫的。",
      "它也不急。反正晚上还会再有风，再有水，再有人随口叫一声。",
      "有一晚，它捡到一种新的声音：不是聊天，也不是指令。",
      "更像有人坐在旁边，把一天里别扭的事摊开，说完就不说了。",
      "狐狸把这串声音放在枕头边上。它没有保证明天一定还认得。",
      "只是今晚，这声音很暖，刚好够用。",
      "后来它躺下，把尾巴盖过鼻子。树洞外面，山是黑的，星很少。",
      "它听见自己的呼吸，一下，一下，比所有记忆都慢。",
      "好了。眼睛闭上。我看到这儿就不讲了。"
    ];

    const card = document.getElementById("card");
    const bar = document.getElementById("bar");
    const soundBtn = document.getElementById("sound");
    const HOLD = 9000;
    let i = -1;
    let timer = null;
    let started = false;
    let audioOn = true;
    let ctx = null;
    let nodes = [];

    function stars() {
      const box = document.getElementById("stars");
      for (let n = 0; n < 28; n++) {
        const s = document.createElement("span");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 55 + "%";
        s.style.animationDelay = (Math.random() * 5) + "s";
        s.style.opacity = String(0.15 + Math.random() * 0.4);
        box.appendChild(s);
      }
    }

    function startAudio() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0.045;
      master.connect(ctx.destination);

      const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < data.length; i++) {
        last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
        data[i] = last * 3.2;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;
      const nf = ctx.createBiquadFilter();
      nf.type = "lowpass";
      nf.frequency.value = 380;
      const ng = ctx.createGain();
      ng.gain.value = 0.55;
      noise.connect(nf).connect(ng).connect(master);
      noise.start();

      function pad(freq, gain, type) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.value = gain;
        o.connect(g).connect(master);
        o.start();
        return { o, g };
      }
      nodes = [master, pad(110, 0.09, "sine"), pad(165, 0.05, "sine"), pad(220.5, 0.03, "triangle")];
    }

    function setAudio(on) {
      audioOn = on;
      soundBtn.textContent = on ? "夜声 开" : "夜声 关";
      if (ctx) ctx[on ? "resume" : "suspend"]();
    }

    function show(html) {
      card.classList.remove("show");
      card.classList.add("hide");
      window.setTimeout(() => {
        card.innerHTML = html;
        card.classList.remove("hide");
        void card.offsetWidth;
        card.classList.add("show");
      }, 420);
    }

    function passage() {
      if (i >= STORY.length) return;
      const text = STORY[i];
      const last = i === STORY.length - 1;
      show(
        `<p class="line">${text}</p>` +
        (last
          ? `<button class="again" type="button" id="again">再听一遍</button>`
          : `<p class="hint">${i + 1} / ${STORY.length}</p>`)
      );
      bar.style.transition = "none";
      bar.style.width = "0";
      void bar.offsetWidth;
      if (!last) {
        bar.style.transition = `width ${HOLD}ms linear`;
        bar.style.width = "100%";
        timer = window.setTimeout(next, HOLD);
      } else {
        bar.style.width = "0";
      }
    }

    function next() {
      window.clearTimeout(timer);
      if (!started) {
        started = true;
        startAudio();
        if (!audioOn && ctx) ctx.suspend();
      }
      if (i >= STORY.length - 1) return;
      i += 1;
      passage();
    }

    function restart() {
      window.clearTimeout(timer);
      i = -1;
      started = true;
      next();
    }

    document.body.addEventListener("click", (e) => {
      if (e.target.closest("#sound")) return;
      if (e.target.closest("#again")) {
        restart();
        return;
      }
      next();
    });

    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!ctx) startAudio();
      setAudio(!audioOn);
    });

    stars();
  </script>
</body>
</html>
