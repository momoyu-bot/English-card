<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8f1f8">
  <title>糯糯的哄睡故事</title>
<meta name="description" content="带图的那一版。橘猫糯糯从枕头后面钻出来守着你。">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px calc(40px + env(safe-area-inset-bottom));
      background: linear-gradient(160deg, #f8f1f8 0%, #e8f0fe 45%, #fef6f0 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #5c5470;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    @media (min-width: 768px) {
      body { align-items: center; }
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff8ee;
      box-shadow: 0 0 6px 1px rgba(255, 236, 210, 0.75);
      animation: twinkle 3.2s infinite ease-in-out;
      pointer-events: none;
    }
    .moon {
      position: absolute;
      top: 5%;
      right: 8%;
      width: 4.25rem;
      height: 4.25rem;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, #fffdf8, #ffe9c4 58%, #f3d2a0);
      animation: moon-glow 6s infinite ease-in-out;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .moon { top: 3%; right: 5%; width: 2.75rem; height: 2.75rem; }
    }
    .card {
      width: min(92vw, 26.5rem);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 24px 36px;
      box-shadow: 0 20px 50px rgba(180, 160, 200, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 2;
      animation: softIn 1.15s ease-out both;
    }
    .cat {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.7);
      animation: breathe 4.4s infinite ease-in-out;
    }
    @media (min-width: 640px) {
      .cat { width: 128px; height: 128px; }
      .card { padding: 36px 28px 40px; }
    }
    .cat img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      color: #7a6b8a;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-wrap: balance;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #a89bb5;
      margin-bottom: 28px;
    }
    .story {
      font-size: 16px;
      line-height: 1.9;
      color: #5c5470;
      letter-spacing: 0.3px;
      text-wrap: pretty;
    }
    .story p { margin-bottom: 16px; opacity: 0; animation: fade-up 1.15s ease-out both; }
    .story p:last-child { margin-bottom: 0; }
    .story p:nth-child(1) { animation-delay: 0.2s; }
    .story p:nth-child(2) { animation-delay: 0.45s; }
    .story p:nth-child(3) { animation-delay: 0.75s; }
    .story p:nth-child(4) { animation-delay: 1.1s; }
    .story p:nth-child(5) { animation-delay: 1.4s; }
    .story p:nth-child(6) { animation-delay: 1.7s; }
    .ending {
      margin-top: 28px;
      text-align: center;
      font-size: 15px;
      color: #9b8aa8;
      font-weight: 500;
      line-height: 1.7;
      opacity: 0;
      animation: fade-up 1.1s ease-out both;
      animation-delay: 2.05s;
    }
    .heart {
      display: inline-block;
      color: #c989a8;
      animation: pulse 2.2s infinite ease-in-out;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #c4b8d0;
      opacity: 0;
      animation: fade-up 0.9s ease-out both;
      animation-delay: 2.4s;
    }
    .replay {
      display: flex;
      margin-top: 32px;
      justify-content: center;
    }
    .replay button {
      height: 44px;
      min-width: 44px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(168, 155, 181, 0.3);
      background: rgba(255, 255, 255, 0.5);
      color: #9b8aa8;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 150ms ease-out, background 150ms ease-out;
    }
    .replay button:hover { background: rgba(255, 255, 255, 0.8); }
    .replay button:active { transform: scale(0.96); }
    @keyframes twinkle {
      0%, 100% { opacity: 0.28; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }
    @keyframes softIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes moon-glow {
      0%, 100% { box-shadow: 0 0 28px 10px rgba(255, 236, 210, 0.42); }
      50% { box-shadow: 0 0 40px 16px rgba(255, 236, 210, 0.58); }
    }
    @media (prefers-reduced-motion: reduce) {
      .star, .moon, .card, .cat, .story p, .ending, .footer, .heart {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <div class="moon" aria-hidden="true"></div>
  <div class="star" style="top:8%;left:12%;width:4px;height:4px;animation-delay:0s;"></div>
  <div class="star" style="top:14%;left:28%;width:3px;height:3px;animation-delay:1.2s;"></div>
  <div class="star" style="top:10%;left:55%;width:4px;height:4px;animation-delay:1.8s;"></div>
  <div class="star" style="top:18%;left:72%;width:3px;height:3px;animation-delay:0.4s;"></div>
  <div class="star" style="top:22%;left:88%;width:4px;height:4px;animation-delay:0.7s;"></div>
  <div class="star" style="top:32%;left:6%;width:3px;height:3px;animation-delay:2.4s;"></div>
  <div class="star" style="top:38%;left:93%;width:3px;height:3px;animation-delay:0.3s;"></div>
  <div class="star" style="top:46%;left:18%;width:2px;height:2px;animation-delay:1.6s;"></div>
  <div class="star" style="top:52%;left:80%;width:4px;height:4px;animation-delay:2.8s;"></div>
  <div class="star" style="top:62%;left:8%;width:3px;height:3px;animation-delay:1.4s;"></div>
  <div class="star" style="top:68%;left:32%;width:2px;height:2px;animation-delay:0.9s;"></div>
  <div class="star" style="top:74%;left:91%;width:4px;height:4px;animation-delay:2.1s;"></div>
  <div class="star" style="top:80%;left:14%;width:3px;height:3px;animation-delay:1.1s;"></div>
  <div class="star" style="top:84%;left:64%;width:2px;height:2px;animation-delay:2.6s;"></div>
  <div class="star" style="top:88%;left:42%;width:3px;height:3px;animation-delay:0.5s;"></div>
  <div class="star" style="top:6%;left:81%;width:2px;height:2px;animation-delay:1.9s;"></div>

  <article class="card" id="card">
    <div class="cat">
      <img src="糯糯的哄睡故事/01.jpg" alt="糯糯，一只小小的橘猫" width="128" height="128">
    </div>
    <h1>糯糯的哄睡故事</h1>
    <div class="subtitle">写给宝的小夜晚</div>
    <div class="story">
      <p>有一只小小的橘猫，名字叫糯糯。</p>
      <p>它的毛像刚晒过的棉被，暖暖的、香香的。</p>
      <p>每天晚上，只要你往被子里一钻，糯糯就会悄悄从枕头后面钻出来，用湿湿的小鼻子碰碰你的脸颊，然后整只猫趴在你胸口，听着你的心跳，一点点一点点睡着。</p>
      <p>外面的风在轻轻说话，星星也在打哈欠。</p>
      <p>糯糯的呼吸越来越慢，尾巴轻轻扫着你的手心。</p>
      <p>你也跟着它的节奏，慢慢地、慢慢地……</p>
    </div>
    <div class="ending">
      睡吧，宝。<br>
      糯糯会一直守着你 <span class="heart">♡</span>
    </div>
    <div class="footer">晚安呀</div>
    <div class="replay">
      <button type="button" id="replay">再读一遍</button>
    </div>
  </article>
  <script>
    (function bindReplay() {
      var btn = document.getElementById("replay");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var card = document.getElementById("card");
        var clone = card.cloneNode(true);
        card.replaceWith(clone);
        bindReplay();
      });
    })();
  </script>
</body>
</html>
