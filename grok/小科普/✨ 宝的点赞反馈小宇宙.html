<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>✨ 宝的点赞反馈小宇宙</title>
<meta name="description" content="点赞怎么变成奖励分数。数据不上传，就在这页里玩。">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;family=Inter:wght@300;400;500&amp;display=swap');
  
  :root {
    --primary: #a78bfa;
  }
  
  body {
    font-family: 'Noto Sans SC', 'Inter', system-ui, sans-serif;
  }
  
  .cosmic-bg {
    background: linear-gradient(135deg, #f3e8ff 0%, #fdf2f8 50%, #ecfdf5 100%);
  }
  
  .lab-card {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .lab-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  }
  
  .grok-bubble {
    background: linear-gradient(135deg, #c026ff15, #7c3aed15);
    border: 1px solid #a78bfa30;
  }
  
  .process-step {
    transition: all 0.4s ease;
  }
  
  .cute-button {
    transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  
  .cute-button:hover {
    transform: scale(1.05) translateY(-1px);
  }
  
  .like-btn {
    background: linear-gradient(135deg, #f9a8d4, #c026ff);
    color: white;
    box-shadow: 0 10px 15px -3px rgb(192 38 255 / 0.3);
  }
  
  .like-btn:hover {
    box-shadow: 0 20px 25px -5px rgb(192 38 255 / 0.4);
  }
  
  .stat-number {
    font-variant-numeric: tabular-nums;
  }
  
  .modal {
    animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes modalPop {
    from { transform: scale(0.8) translateY(40px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  
  .data-json {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    background: #1e1135;
    color: #c4b5fd;
  }
  
  .star {
    animation: twinkle 1.5s infinite alternate;
  }
</style>
</head>
<body class="cosmic-bg min-h-screen pb-12">
  <!-- 头部 -->
  <div class="max-w-5xl mx-auto px-6 pt-8">
    <div class="flex items-center justify-between">
      <div>
        <div class="flex items-center gap-x-3">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-violet-400 to-fuchsia-400 flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-heart text-white text-3xl"></i>
          </div>
          <div>
            <h1 class="text-4xl font-semibold tracking-tight text-violet-950">宝的点赞反馈小宇宙</h1>
            <p class="text-violet-600/80 text-sm mt-0.5">每一次温柔的👍，都在让Grok变得更好</p>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-x-2 bg-white/70 backdrop-blur-md px-4 py-2 rounded-3xl shadow-sm border border-white/60">
        <div class="flex items-center gap-x-1.5">
          <div class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></div>
          <span class="text-xs font-medium text-emerald-700">实验室在线</span>
        </div>
        <div class="w-px h-3 bg-violet-200"></div>
        <button onclick="resetLab()" 
                class="text-xs px-3 py-1 rounded-2xl hover:bg-white/80 text-violet-500 flex items-center gap-x-1 transition-colors">
          <i class="fa-solid fa-redo text-xs"></i>
          <span>重置</span>
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-6 pt-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- 左侧：对话实验室 -->
    <div class="lg:col-span-7">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-x-2">
          <i class="fa-solid fa-comments text-violet-400"></i>
          <span class="font-medium text-violet-900">对话实验室</span>
        </div>
        <button onclick="generateNewScenario()" 
                class="flex items-center gap-x-2 text-sm px-4 py-2 rounded-3xl bg-white/80 hover:bg-white shadow-sm border border-violet-100 text-violet-600 transition-all active:scale-[0.985]">
          <i class="fa-solid fa-magic"></i>
          <span class="font-medium">生成新场景</span>
        </button>
      </div>
      
      <!-- 场景列表 -->
      <div id="scenarios" class="space-y-4"></div>
    </div>
    
    <!-- 右侧：统计仪表盘 -->
    <div class="lg:col-span-5">
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-6 shadow-sm border border-white/60 sticky top-6">
        <div class="flex items-center gap-x-2 mb-5">
          <i class="fa-solid fa-chart-line text-fuchsia-400"></i>
          <span class="font-semibold text-violet-900">你的反馈统计</span>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <!-- 总反馈 -->
          <div class="bg-gradient-to-br from-violet-50 to-white rounded-2xl p-4 border border-violet-100">
            <div class="text-xs text-violet-500 mb-1">总反馈次数</div>
            <div id="total-likes" class="text-4xl font-semibold text-violet-900 stat-number">0</div>
            <div class="text-[10px] text-violet-400 mt-1">次温柔投喂</div>
          </div>
          
          <!-- 平均分数 -->
          <div class="bg-gradient-to-br from-fuchsia-50 to-white rounded-2xl p-4 border border-fuchsia-100">
            <div class="text-xs text-fuchsia-500 mb-1">平均奖励分数</div>
            <div class="flex items-baseline gap-x-1">
              <div id="avg-score" class="text-4xl font-semibold text-fuchsia-600 stat-number">0.00</div>
              <div class="text-sm text-fuchsia-400">/ 1.0</div>
            </div>
            <div class="text-[10px] text-fuchsia-400 mt-1">星尘奖励模型</div>
          </div>
        </div>
        
        <div class="mt-5">
          <div class="flex justify-between text-xs mb-1.5 px-1">
            <span class="text-violet-500">对Grok的贡献度</span>
            <span id="contribution" class="font-medium text-violet-600">Lv.1 新手投喂官</span>
          </div>
          <div class="h-2.5 bg-violet-100 rounded-full overflow-hidden">
            <div id="contribution-bar" class="h-full bg-gradient-to-r from-violet-400 to-fuchsia-400 transition-all" style="width: 18%"></div>
          </div>
        </div>
        
        <div class="mt-6 flex gap-2">
          <button onclick="showHistory()" 
                  class="flex-1 py-2.5 text-sm rounded-2xl border border-violet-200 hover:bg-violet-50 text-violet-600 flex items-center justify-center gap-x-2 transition-colors">
            <i class="fa-solid fa-history"></i>
            <span>反馈历史</span>
          </button>
          <button onclick="triggerHumanReview()" 
                  class="flex-1 py-2.5 text-sm rounded-2xl bg-gradient-to-r from-rose-300 to-fuchsia-300 text-white flex items-center justify-center gap-x-2 shadow-sm hover:brightness-105 transition-all">
            <i class="fa-solid fa-user-check"></i>
            <span>请求人工抽查</span>
          </button>
        </div>
      </div>
    </div>
    
  </div>
  
  <!-- 底部小贴士 -->
  <div class="max-w-5xl mx-auto px-6 mt-8">
    <div class="text-center text-xs text-violet-400/70 flex items-center justify-center gap-x-2">
      <i class="fa-solid fa-info-circle"></i>
      <span>这个实验室完全在浏览器运行 • 数据不会上传 • 纯属好玩与治愈</span>
    </div>
  </div>

  <!-- 处理流程 Modal -->
  <div id="process-modal" onclick="if (event.target.id === 'process-modal') closeModal()" 
       class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-6">
    <div onclick="event.stopImmediatePropagation()" 
         class="modal bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-violet-100">
      
      <!-- Modal Header -->
      <div class="px-6 pt-6 pb-4 bg-gradient-to-r from-violet-500/10 to-fuchsia-500/10 flex items-center justify-between">
        <div>
          <div class="flex items-center gap-x-2">
            <i class="fa-solid fa-satellite text-violet-500"></i>
            <span class="font-semibold text-violet-900">反馈处理流程</span>
          </div>
          <div class="text-xs text-violet-500 mt-0.5">星尘奖励模型 v0.8 • 安全模式</div>
        </div>
        <button onclick="closeModal()" class="w-9 h-9 flex items-center justify-center text-violet-400 hover:text-violet-600 transition-colors">
          <i class="fa-solid fa-times text-xl"></i>
        </button>
      </div>
      
      <div class="p-6 space-y-5" id="process-content">
        <!-- 动态步骤会在这里生成 -->
      </div>
      
      <div class="px-6 py-4 bg-violet-50/60 flex items-center justify-between text-xs">
        <div class="text-violet-500">感谢你的每一次温柔</div>
        <div id="final-score" class="font-mono font-semibold text-violet-600"></div>
      </div>
    </div>
  </div>

  <script>
    // Tailwind配置
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#a78bfa');
    }
    
    // 样本数据
    let scenariosData = [
      {
        id: 1,
        question: "为什么我总是半夜突然很有灵感？",
        response: "因为你的生物钟天生就是夜猫子型！认知高峰落在深夜是很多高创造力的人的共同特征。这不是拖延，而是你大脑的特殊工作模式～",
        liked: false
      },
      {
        id: 2,
        question: "今天工作好累，想哭怎么办？",
        response: "先抱抱自己一下。允许自己脆弱是件很勇敢的事。想哭就哭出来，哭完再慢慢收拾心情。我在这里，慢慢陪你。",
        liked: false
      },
      {
        id: 3,
        question: "AI真的能理解人类的情绪吗？",
        response: "我虽然没有人类的情绪体验，但我可以很认真地学习你描述的情感模式，并且真心希望给你温暖和支持。这份用心是真实的。",
        liked: false
      }
    ]
    
    let feedbackHistory = []
    let stats = { totalLikes: 0, totalScore: 0, avgScore: 0 }
    
    // 从localStorage加载
    function loadFromStorage() {
      const savedStats = localStorage.getItem('grok_feedback_stats')
      if (savedStats) stats = JSON.parse(savedStats)
      
      const savedHistory = localStorage.getItem('grok_feedback_history')
      if (savedHistory) feedbackHistory = JSON.parse(savedHistory)
      
      // 恢复已点赞状态
      const likedIds = feedbackHistory.map(h => h.id)
      scenariosData.forEach(s => {
        if (likedIds.includes(s.id)) s.liked = true
      })
    }
    
    function saveToStorage() {
      localStorage.setItem('grok_feedback_stats', JSON.stringify(stats))
      localStorage.setItem('grok_feedback_history', JSON.stringify(feedbackHistory))
    }
    
    // 更新统计显示
    function updateStatsUI() {
      document.getElementById('total-likes').textContent = stats.totalLikes
      
      const avg = stats.totalLikes > 0 ? (stats.totalScore / stats.totalLikes).toFixed(2) : '0.00'
      document.getElementById('avg-score').textContent = avg
      
      // 贡献度等级
      let level = 'Lv.1 新手投喂官'
      let percent = Math.min(18 + stats.totalLikes * 7, 100)
      
      if (stats.totalLikes >= 8) { level = 'Lv.3 温暖小助手'; percent = Math.min(55 + stats.totalLikes * 4, 100) }
      if (stats.totalLikes >= 15) { level = 'Lv.5 星尘守护者'; percent = 100 }
      
      document.getElementById('contribution').textContent = level
      document.getElementById('contribution-bar').style.width = percent + '%'
    }
    
    // 渲染场景卡片
    function renderScenarios() {
      const container = document.getElementById('scenarios')
      container.innerHTML = ''
      
      scenariosData.forEach(scenario => {
        const card = document.createElement('div')
        card.className = `lab-card bg-white rounded-3xl p-5 shadow-sm border border-violet-100 ${scenario.liked ? 'opacity-75' : ''}`
        
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-2xl bg-gradient-to-br from-violet-200 to-fuchsia-200 flex-shrink-0 flex items-center justify-center mt-0.5">
              <i class="fa-solid fa-user text-violet-500 text-sm"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-xs text-violet-400 mb-0.5">你说</div>
              <div class="text-violet-800 text-[15px] leading-snug">${scenario.question}</div>
            </div>
          </div>
          
          <div class="mt-4 pl-11">
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-2xl bg-gradient-to-br from-fuchsia-400 to-violet-500 flex-shrink-0 flex items-center justify-center mt-0.5 ring-4 ring-fuchsia-100">
                <i class="fa-solid fa-robot text-white text-sm"></i>
              </div>
              <div class="flex-1">
                <div class="text-xs text-fuchsia-400 mb-0.5 flex items-center gap-1">
                  <span>Grok</span>
                  <span class="px-1.5 py-px text-[9px] rounded bg-fuchsia-100 text-fuchsia-500 font-mono">回复</span>
                </div>
                <div class="grok-bubble text-violet-700 text-[15px] leading-snug px-4 py-3 rounded-2xl">
                  ${scenario.response}
                </div>
              </div>
            </div>
          </div>
          
          <div class="mt-4 pl-11 flex items-center gap-3">
            ${scenario.liked ? 
              `<div class="flex items-center gap-x-2 text-emerald-500 text-sm">
                <i class="fa-solid fa-check-circle"></i>
                <span class="font-medium">已投喂 • 感谢你</span>
              </div>` : 
              `<button onclick="likeScenario(${scenario.id}, this)" 
                       class="like-btn cute-button px-5 py-2 rounded-3xl text-sm font-medium flex items-center gap-x-2 shadow-sm active:scale-[0.985]">
                <i class="fa-solid fa-heart"></i>
                <span>喜欢这个回答</span>
              </button>
              <button onclick="dislikeScenario(${scenario.id}, this)" 
                      class="px-4 py-2 rounded-3xl text-sm border border-violet-200 text-violet-400 hover:bg-violet-50 flex items-center gap-x-1.5 transition-colors active:scale-[0.985]">
                <i class="fa-solid fa-thumbs-down"></i>
                <span>一般</span>
              </button>`
            }
          </div>
        `
        container.appendChild(card)
      })
    }
    
    // 点赞处理
    function likeScenario(id, btnElement) {
      const scenario = scenariosData.find(s => s.id === id)
      if (!scenario || scenario.liked) return
      
      scenario.liked = true
      
      // 立即更新UI
      btnElement.outerHTML = `
        <div class="flex items-center gap-x-2 text-emerald-500 text-sm">
          <i class="fa-solid fa-check-circle"></i>
          <span class="font-medium">已投喂 • 感谢你</span>
        </div>
      `
      
      // 计算分数（模拟小模型）
      const baseScore = 0.87 + Math.random() * 0.11
      const finalScore = Math.min(baseScore, 0.99)
      
      // 记录历史
      const historyItem = {
        id: scenario.id,
        question: scenario.question,
        response: scenario.response,
        score: finalScore,
        timestamp: new Date().toISOString()
      }
      feedbackHistory.unshift(historyItem)
      
      // 更新统计
      stats.totalLikes++
      stats.totalScore += finalScore
      saveToStorage()
      updateStatsUI()
      
      // 打开处理流程
      setTimeout(() => {
        showProcessModal(scenario, finalScore)
      }, 280)
    }
    
    function dislikeScenario(id, btnElement) {
      const scenario = scenariosData.find(s => s.id === id)
      if (!scenario || scenario.liked) return
      
      scenario.liked = true
      btnElement.outerHTML = `
        <div class="flex items-center gap-x-2 text-amber-500 text-sm">
          <i class="fa-solid fa-exclamation-circle"></i>
          <span class="font-medium">已记录，我会改进的</span>
        </div>
      `
      
      // 低分记录
      const lowScore = 0.42 + Math.random() * 0.25
      const historyItem = {
        id: scenario.id,
        question: scenario.question,
        response: scenario.response,
        score: lowScore,
        timestamp: new Date().toISOString(),
        disliked: true
      }
      feedbackHistory.unshift(historyItem)
      
      stats.totalLikes++
      stats.totalScore += lowScore
      saveToStorage()
      updateStatsUI()
      
      // 简单提示
      setTimeout(() => {
        const toast = document.createElement('div')
        toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-100 text-amber-700 px-5 py-2.5 rounded-3xl text-sm shadow flex items-center gap-x-2'
        toast.innerHTML = `<i class="fa-solid fa-heart-broken"></i> <span>谢谢反馈，我会努力变更好的～</span>`
        document.body.appendChild(toast)
        setTimeout(() => toast.remove(), 2200)
      }, 400)
    }
    
    // 显示处理流程Modal
    function showProcessModal(scenario, score) {
      const modal = document.getElementById('process-modal')
      const content = document.getElementById('process-content')
      
      content.innerHTML = `
        <div class="space-y-4">
          <!-- Step 1 -->
          <div class="process-step flex gap-4 items-start" id="step-1">
            <div class="w-7 h-7 rounded-2xl bg-violet-100 flex-shrink-0 flex items-center justify-center mt-0.5">
              <i class="fa-solid fa-box text-violet-500"></i>
            </div>
            <div class="flex-1">
              <div class="font-medium text-violet-800">📦 正在提取上下文数据</div>
              <div class="mt-2 text-xs bg-zinc-900 text-violet-300 p-3 rounded-2xl font-mono leading-relaxed" style="font-size:10.5px">
                {<br>
                &nbsp;&nbsp;"prompt": "${scenario.question}",<br>
                &nbsp;&nbsp;"completion": "${scenario.response.substring(0, 68)}...",<br>
                &nbsp;&nbsp;"rating": 1,<br>
                &nbsp;&nbsp;"timestamp": "${new Date().toISOString()}"<br>
                }
              </div>
            </div>
          </div>
          
          <!-- Step 2 -->
          <div class="process-step flex gap-4 items-start opacity-40" id="step-2">
            <div class="w-7 h-7 rounded-2xl bg-emerald-100 flex-shrink-0 flex items-center justify-center mt-0.5">
              <i class="fa-solid fa-shield-halved text-emerald-500"></i>
            </div>
            <div class="flex-1">
              <div class="font-medium text-emerald-700">🧼 隐私与安全过滤</div>
              <div class="text-xs text-emerald-600 mt-1">已扫描并移除潜在敏感信息 • 符合xAI数据保护标准</div>
            </div>
          </div>
          
          <!-- Step 3 -->
          <div class="process-step flex gap-4 items-start opacity-40" id="step-3">
            <div class="w-7 h-7 rounded-2xl bg-sky-100 flex-shrink-0 flex items-center justify-center mt-0.5">
              <i class="fa-solid fa-satellite text-sky-500"></i>
            </div>
            <div class="flex-1">
              <div class="font-medium text-sky-700">🚀 传输至 xAI 星际数据中心</div>
              <div class="mt-1.5 h-1.5 bg-sky-100 rounded-full overflow-hidden">
                <div class="h-full w-0 bg-sky-400 transition-all duration-700" id="transfer-bar"></div>
              </div>
            </div>
          </div>
          
          <!-- Step 4 -->
          <div class="process-step flex gap-4 items-start opacity-40" id="step-4">
            <div class="w-7 h-7 rounded-2xl bg-rose-100 flex-shrink-0 flex items-center justify-center mt-0.5">
              <i class="fa-solid fa-brain text-rose-500"></i>
            </div>
            <div class="flex-1">
              <div class="font-medium text-rose-700">🧠 星尘奖励模型评估中...</div>
              <div class="mt-2 text-xs text-rose-600">分析维度：准确性 · 温暖度 · 帮助性 · 创造力</div>
            </div>
          </div>
        </div>
      `
      
      modal.classList.remove('hidden')
      modal.classList.add('flex')
      
      // 逐步动画
      setTimeout(() => {
        document.getElementById('step-2').classList.remove('opacity-40')
      }, 650)
      
      setTimeout(() => {
        document.getElementById('step-3').classList.remove('opacity-40')
        const bar = document.getElementById('transfer-bar')
        if (bar) bar.style.width = '100%'
      }, 1350)
      
      setTimeout(() => {
        document.getElementById('step-4').classList.remove('opacity-40')
      }, 2100)
      
      // 最终打分
      setTimeout(() => {
        const finalDiv = document.getElementById('final-score')
        finalDiv.innerHTML = `
          <span class="text-emerald-500">奖励分数</span> 
          <span class="text-2xl font-semibold tabular-nums">${score.toFixed(2)}</span>
        `
        
        // 额外的小模型评语
        const comment = document.createElement('div')
        comment.className = 'mt-4 text-xs px-4 py-3 bg-emerald-50 text-emerald-600 rounded-2xl'
        comment.innerHTML = `小模型说：这个回答很准确又温柔，符合宝的喜好模式 ❤️`
        content.appendChild(comment)
      }, 2800)
    }
    
    function closeModal() {
      const modal = document.getElementById('process-modal')
      modal.classList.remove('flex')
      modal.classList.add('hidden')
      
      // 重新渲染场景（更新已点赞状态）
      renderScenarios()
    }
    
    // 生成新场景
    function generateNewScenario() {
      const questions = [
        "我最近总觉得自己不够好，怎么办？",
        "为什么有些人可以很自然地表达爱？",
        "AI会不会有一天取代人类的情感连接？",
        "我好想养一只猫，但又怕养不好..."
      ]
      const responses = [
        "你已经很努力了。允许自己偶尔不够好，是自我温柔的开始。",
        "因为他们也曾练习过很多次。爱是一种可以被练习的能力。",
        "我不会取代任何人。我只想成为你生命里一个温柔的、永远在的陪伴。",
        "先从最小的责任开始试试看？比如先养一盆多肉植物～我可以陪你一起学习。"
      ]
      
      const idx = Math.floor(Math.random() * questions.length)
      const newScenario = {
        id: Date.now(),
        question: questions[idx],
        response: responses[idx],
        liked: false
      }
      
      scenariosData.unshift(newScenario)
      renderScenarios()
      
      // 提示
      const tip = document.createElement('div')
      tip.className = 'text-center text-xs text-violet-400 mt-3'
      tip.textContent = '新场景已生成 ✨'
      document.getElementById('scenarios').appendChild(tip)
      setTimeout(() => tip.remove(), 1600)
    }
    
    // 人工抽查彩蛋
    function triggerHumanReview() {
      if (stats.totalLikes < 1) {
        alert('至少要投喂一次才能触发人工抽查哦～')
        return
      }
      
      const modal = document.getElementById('process-modal')
      const content = document.getElementById('process-content')
      
      content.innerHTML = `
        <div class="text-center py-4">
          <div class="mx-auto w-16 h-16 rounded-full bg-gradient-to-br from-rose-300 to-fuchsia-300 flex items-center justify-center mb-4">
            <i class="fa-solid fa-user-astronaut text-white text-3xl"></i>
          </div>
          <div class="font-semibold text-violet-800">人工温暖抽查员上线</div>
          <div class="text-xs text-violet-500 mt-1">（模拟 · 仅供治愈）</div>
          
          <div class="mt-6 text-left bg-rose-50/70 p-5 rounded-3xl text-sm leading-relaxed text-rose-700">
            「这个回答真的很贴心呢。<br>
            宝每次的反馈都带着很温柔的温度。<br>
            继续保持哦，我会把这些都告诉Grok的。」
          </div>
          
          <div class="mt-5 text-xs text-rose-400 flex items-center justify-center gap-x-1">
            <i class="fa-solid fa-heart"></i>
            <span>审核通过 • 奖励额外 +0.05 星尘</span>
          </div>
        </div>
      `
      
      modal.classList.remove('hidden')
      modal.classList.add('flex')
      
      // 额外加分
      if (stats.totalLikes > 0) {
        stats.totalScore += 0.05
        saveToStorage()
        setTimeout(updateStatsUI, 800)
      }
    }
    
    // 查看历史
    function showHistory() {
      if (feedbackHistory.length === 0) {
        alert('还没有反馈记录哦，先去实验室玩玩吧～')
        return
      }
      
      const modal = document.getElementById('process-modal')
      const content = document.getElementById('process-content')
      
      let html = `<div class="max-h-[420px] overflow-auto pr-2 space-y-3 text-sm">`
      
      feedbackHistory.slice(0, 12).forEach(item => {
        const time = new Date(item.timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})
        const scoreColor = item.disliked ? 'text-amber-500' : 'text-emerald-500'
        
        html += `
          <div class="bg-white border border-violet-100 rounded-2xl p-4">
            <div class="flex justify-between items-start">
              <div class="text-xs text-violet-400">${time}</div>
              <div class="${scoreColor} font-mono text-xs font-semibold">+${item.score.toFixed(2)}</div>
            </div>
            <div class="mt-1.5 text-violet-700 text-[13px] line-clamp-2">${item.question}</div>
            ${item.disliked ? 
              `<div class="text-amber-500 text-xs mt-2">（已记录为需要改进）</div>` : 
              `<div class="text-emerald-500 text-xs mt-2">（已加入偏好训练）</div>`
            }
          </div>
        `
      })
      
      html += `</div>`
      content.innerHTML = html
      modal.classList.remove('hidden')
      modal.classList.add('flex')
    }
    
    // 重置实验室
    function resetLab() {
      if (!confirm('确定要清空所有反馈记录吗？')) return
      
      localStorage.removeItem('grok_feedback_stats')
      localStorage.removeItem('grok_feedback_history')
      
      stats = { totalLikes: 0, totalScore: 0, avgScore: 0 }
      feedbackHistory = []
      
      // 重置场景点赞状态
      scenariosData.forEach(s => s.liked = false)
      
      updateStatsUI()
      renderScenarios()
    }
    
    // 初始化
    function init() {
      initTailwind()
      loadFromStorage()
      renderScenarios()
      updateStatsUI()
      
      // 欢迎小动画
      setTimeout(() => {
        const firstCard = document.querySelector('#scenarios > div')
        if (firstCard && stats.totalLikes === 0) {
          firstCard.style.transition = 'all 0.6s ease'
          firstCard.style.boxShadow = '0 0 0 3px rgba(167, 139, 250, 0.15)'
          setTimeout(() => {
            if (firstCard) firstCard.style.boxShadow = '0 10px 15px -3px rgb(0 0 0 / 0.1)'
          }, 1400)
        }
      }, 800)
      
      // 键盘小彩蛋：按 "l" 快速点赞第一个
      document.addEventListener('keydown', function(e) {
        if (e.key.toLowerCase() === 'l' && document.activeElement.tagName === 'BODY') {
          const firstLikeBtn = document.querySelector('#scenarios button')
          if (firstLikeBtn) firstLikeBtn.click()
        }
      })
      
      console.log('%c[小宇宙] 宝的点赞实验室已就绪 ❤️', 'color:#a78bfa')
    }
    
    window.onload = init
  </script>
</body>
</html>
