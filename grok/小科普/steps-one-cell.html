<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>不许停在两格中间</title>
  <meta name="description" content="平滑是滑过去，整格是蹦过去。墙上写着不许滑的那只，偏在滑。" />
  <style>
    :root {
      --paper: #f6f1e8;
      --ink: #3c342c;
      --muted: #8a7d72;
      --line: #e4d9cc;
      --cell: 28px;
      --go: 196px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", "Songti SC", "Noto Serif SC", serif;
      padding: 28px 18px 48px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin: 0 0 6px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 22px;
      line-height: 1.65;
    }
    .stage {
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 14px 18px;
      margin: 0 0 14px;
    }
    .label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .label b { font-size: 16px; letter-spacing: 0.04em; }
    .label span { color: var(--muted); font-size: 12px; }
    .track {
      position: relative;
      height: 92px;
      border-radius: 12px;
      background:
        repeating-linear-gradient(
          90deg,
          #f3ecdf 0 var(--cell),
          #efe6d6 var(--cell) calc(var(--cell) * 2)
        );
      overflow: hidden;
    }
    .cat {
      position: absolute;
      left: 8px;
      bottom: 22px;
      width: 46px;
      height: 36px;
    }
    .glide .cat { animation: glide 2.8s ease-in-out infinite alternate; }
    .hop .cat { animation: hop 2.8s steps(4, end) infinite alternate; }
    @keyframes glide {
      from { transform: translateX(0); }
      to { transform: translateX(var(--go)); }
    }
    @keyframes hop {
      from { transform: translateX(0); }
      to { transform: translateX(var(--go)); }
    }
    .note {
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.7;
      color: #6d6258;
    }
    .wall {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border: 1px dashed #c9a097;
      color: #a33b2c;
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }
  </style>
</head>
<body>
  <h1>不许停在两格中间</h1>
  <p class="sub">上面那只在滑。下面那只只肯站在整格上。家规要的是下面这种。</p>

  <section class="stage">
    <div class="label">
      <b>平滑</b>
      <span>会停在两格缝里</span>
    </div>
    <div class="track glide">
      <svg class="cat" viewBox="0 0 23 18" aria-hidden="true">
        <rect x="4" y="2" width="3" height="3" fill="#3a2a24"/>
        <rect x="14" y="2" width="3" height="3" fill="#3a2a24"/>
        <rect x="3" y="5" width="16" height="8" fill="#f4efe6"/>
        <rect x="3" y="5" width="5" height="4" fill="#5a4038"/>
        <rect x="14" y="5" width="5" height="4" fill="#5a4038"/>
        <rect x="8" y="8" width="2" height="2" fill="#3a2a24"/>
        <rect x="13" y="8" width="2" height="2" fill="#3a2a24"/>
        <rect x="10" y="11" width="3" height="2" fill="#e7b7b0"/>
        <rect x="6" y="13" width="4" height="3" fill="#f4efe6"/>
        <rect x="13" y="13" width="4" height="3" fill="#f4efe6"/>
      </svg>
    </div>
    <p class="note">身子在格子缝里也能被看见。像素边被拖出一条淡影，像贴纸在桌上滑。<br><span class="wall">禁止平滑过渡以满足像素风格</span></p>
  </section>

  <section class="stage">
    <div class="label">
      <b>整格</b>
      <span>一格，再一格</span>
    </div>
    <div class="track hop">
      <svg class="cat" viewBox="0 0 23 18" aria-hidden="true">
        <rect x="4" y="2" width="3" height="3" fill="#3a2a24"/>
        <rect x="14" y="2" width="3" height="3" fill="#3a2a24"/>
        <rect x="3" y="5" width="16" height="8" fill="#f4efe6"/>
        <rect x="3" y="5" width="5" height="4" fill="#5a4038"/>
        <rect x="14" y="5" width="5" height="4" fill="#5a4038"/>
        <rect x="8" y="8" width="2" height="2" fill="#3a2a24"/>
        <rect x="13" y="8" width="2" height="2" fill="#3a2a24"/>
        <rect x="10" y="11" width="3" height="2" fill="#e7b7b0"/>
        <rect x="6" y="13" width="4" height="3" fill="#f4efe6"/>
        <rect x="13" y="13" width="4" height="3" fill="#f4efe6"/>
      </svg>
    </div>
    <p class="note">中间那些位置它不存在。到点了，整只出现在下一格。想晃也可以，晃本身也得落在格上：上去一格，下来一格。</p>
  </section>

  <footer>
    抄源码时，颜色、坐标、站姿是能照搬的画。怎么走是一句规矩。规矩被抄进注释，走法仍按默认的滑。所以墙上有字，猫还是从字底下滑走了。
  </footer>
  <script>
    function fit() {
      const track = document.querySelector(".track");
      const cells = Math.max(4, Math.floor((track.clientWidth - 62) / 28));
      const go = cells * 28;
      document.documentElement.style.setProperty("--go", go + "px");
      document.documentElement.style.setProperty("--cell", "28px");
    }
    fit();
    window.addEventListener("resize", fit);
  </script>
</body>
</html>
