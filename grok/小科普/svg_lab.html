<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 几何属性实时映射</title>
<meta name="description" content="拖滑块改小猫的脸。几何属性和画面绑在一起。">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f5f0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #f0e9df;
        }
        .header {
            padding: 22px 32px 18px;
            background: #faf8f3;
            border-bottom: 1px solid #f0e9df;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #3a3a3a;
            margin: 0;
        }
        .status {
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 11px;
            border-radius: 9999px;
        }
        .canvas {
            padding: 28px 32px 20px;
            background: #fff;
        }
        .svg-box {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #f0e9df;
            overflow: hidden;
        }
        .controls {
            padding: 24px 32px 32px;
            background: #faf8f3;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
        }
        .card {
            background: white;
            border: 1px solid #f0e9df;
            border-radius: 14px;
            padding: 14px 18px 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .label {
            font-size: 0.875rem;
            color: #555;
        }
        .value {
            font-size: 1.05rem;
            font-weight: 700;
            color: #3a3a3a;
        }
        .slider {
            width: 100%;
            height: 5px;
            background: #e8e0d5;
            border-radius: 9999px;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            background: white;
            border: 3px solid #ff8a65;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(255,138,101,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部标题 -->
        <div class="header">
            <h1>SVG 几何属性实时映射</h1>
            <div class="status">自由调节中</div>
        </div>

        <!-- SVG 画布 -->
        <div class="canvas">
            <div class="svg-box">
                <svg id="svg" width="620" height="420" viewBox="0 0 620 420">
                    <defs>
                        <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
                            <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f0e9df" stroke-width="1"/>
                        </pattern>
                        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
                            <feOffset dx="3" dy="6"/>
                            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    
                    <!-- 网格背景 -->
                    <rect width="620" height="420" fill="url(#grid)"/>
                    
                    <!-- 小猫脸 -->
                    <g>
                        <!-- 脸 -->
                        <circle id="head" cx="310" cy="210" r="85" 
                                fill="#ffcc80" stroke="#e67e22" stroke-width="14" filter="url(#shadow)"/>
                        
                        <!-- 左耳 -->
                        <polygon id="left-ear" points="235,135 265,68 285,138" 
                                 fill="#ffcc80" stroke="#e67e22" stroke-width="11"/>
                        
                        <!-- 右耳 -->
                        <polygon id="right-ear" points="385,135 355,68 335,138" 
                                 fill="#ffcc80" stroke="#e67e22" stroke-width="11"/>
                        
                        <!-- 眼睛 -->
                        <circle id="left-eye" cx="275" cy="195" r="16" fill="#2c3e50"/>
                        <circle id="right-eye" cx="345" cy="195" r="16" fill="#2c3e50"/>
                        <circle cx="280" cy="190" r="5.5" fill="#fff"/>
                        <circle cx="350" cy="190" r="5.5" fill="#fff"/>
                        
                        <!-- 鼻子 -->
                        <polygon id="nose" points="310,218 300,232 320,232" fill="#e74c3c"/>
                        
                        <!-- 嘴巴 -->
                        <path id="mouth" d="M 292 245 Q 310 262 328 245" 
                              fill="none" stroke="#2c3e50" stroke-width="4.5" stroke-linecap="round"/>
                        
                        <!-- 腮红 -->
                        <ellipse cx="255" cy="218" rx="14" ry="8" fill="#ff9a9e" opacity="0.4"/>
                        <ellipse cx="365" cy="218" rx="14" ry="8" fill="#ff9a9e" opacity="0.4"/>
                    </g>
                </svg>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="controls">
            <div class="grid">
                <!-- cx -->
                <div class="card">
                    <div class="card-header">
                        <span class="label">脸部中心 X (cx)</span>
                        <span class="value" id="val-cx">310</span>
                    </div>
                    <input type="range" id="cx" class="slider" min="180" max="440" value="310">
                </div>
                
                <!-- cy -->
                <div class="card">
                    <div class="card-header">
                        <span class="label">脸部中心 Y (cy)</span>
                        <span class="value" id="val-cy">210</span>
                    </div>
                    <input type="range" id="cy" class="slider" min="130" max="310" value="210">
                </div>
                
                <!-- r -->
                <div class="card">
                    <div class="card-header">
                        <span class="label">脸部半径 (r)</span>
                        <span class="value" id="val-r">85</span>
                    </div>
                    <input type="range" id="r" class="slider" min="55" max="115" value="85">
                </div>
                
                <!-- 耳朵锐度 -->
                <div class="card">
                    <div class="card-header">
                        <span class="label">耳朵锐度</span>
                        <span class="value" id="val-ear">1.0</span>
                    </div>
                    <input type="range" id="ear" class="slider" min="0.4" max="1.8" step="0.05" value="1.0">
                </div>
                
                <!-- 眼距 -->
                <div class="card">
                    <div class="card-header">
                        <span class="label">眼距</span>
                        <span class="value" id="val-eye">70</span>
                    </div>
                    <input type="range" id="eye" class="slider" min="30" max="110" value="70">
                </div>
            </div>
        </div>
    </div>

    <script>
        const svg = document.getElementById('svg');
        const head = document.getElementById('head');
        const leftEar = document.getElementById('left-ear');
        const rightEar = document.getElementById('right-ear');
        const leftEye = document.getElementById('left-eye');
        const rightEye = document.getElementById('right-eye');
        const nose = document.getElementById('nose');
        const mouth = document.getElementById('mouth');
        
        const sliders = {
            cx: document.getElementById('cx'),
            cy: document.getElementById('cy'),
            r: document.getElementById('r'),
            ear: document.getElementById('ear'),
            eye: document.getElementById('eye')
        };
        
        const vals = {
            cx: document.getElementById('val-cx'),
            cy: document.getElementById('val-cy'),
            r: document.getElementById('val-r'),
            ear: document.getElementById('val-ear'),
            eye: document.getElementById('val-eye')
        };
        
        function update() {
            const cx = parseFloat(sliders.cx.value);
            const cy = parseFloat(sliders.cy.value);
            const r = parseFloat(sliders.r.value);
            const earSharp = parseFloat(sliders.ear.value);
            const eyeDist = parseFloat(sliders.eye.value);
            
            // 更新数值显示
            vals.cx.textContent = Math.round(cx);
            vals.cy.textContent = Math.round(cy);
            vals.r.textContent = Math.round(r);
            vals.ear.textContent = earSharp.toFixed(1);
            vals.eye.textContent = Math.round(eyeDist);
            
            // 脸
            head.setAttribute('cx', cx);
            head.setAttribute('cy', cy);
            head.setAttribute('r', r);
            
            // 耳朵（锐度控制尖锐程度）
            const baseY = cy - r * 0.55;
            const tipY = cy - r * 1.05 * earSharp;
            leftEar.setAttribute('points', `${cx - r*0.55},${baseY} ${cx - r*0.35},${tipY} ${cx - r*0.15},${baseY}`);
            rightEar.setAttribute('points', `${cx + r*0.55},${baseY} ${cx + r*0.35},${tipY} ${cx + r*0.15},${baseY}`);
            
            // 眼睛
            const eyeY = cy - r * 0.12;
            const eyeR = r * 0.185;
            const half = eyeDist / 2;
            leftEye.setAttribute('cx', cx - half);
            leftEye.setAttribute('cy', eyeY);
            leftEye.setAttribute('r', eyeR);
            rightEye.setAttribute('cx', cx + half);
            rightEye.setAttribute('cy', eyeY);
            rightEye.setAttribute('r', eyeR);
            
            // 鼻子
            const noseY = cy + r * 0.08;
            nose.setAttribute('points', `${cx},${noseY} ${cx - r*0.12},${noseY + r*0.16} ${cx + r*0.12},${noseY + r*0.16}`);
            
            // 嘴巴
            const mY = cy + r * 0.22;
            mouth.setAttribute('d', `M ${cx - r*0.18} ${mY} Q ${cx} ${cy + r*0.32} ${cx + r*0.18} ${mY}`);
        }
        
        // 绑定所有滑块
        Object.values(sliders).forEach(slider => {
            slider.addEventListener('input', update);
        });
        
        // 初始化
        function init() {
            update();
            
            // 点击小猫脸随机小变化
            svg.addEventListener('click', () => {
                sliders.r.value = Math.max(55, Math.min(115, parseFloat(sliders.r.value) + (Math.random()-0.5)*14));
                sliders.ear.value = Math.max(0.4, Math.min(1.8, parseFloat(sliders.ear.value) + (Math.random()-0.5)*0.4));
                update();
            });
            
            // 按 R 重置
            document.addEventListener('keydown', e => {
                if (e.key.toLowerCase() === 'r') {
                    sliders.cx.value = 310;
                    sliders.cy.value = 210;
                    sliders.r.value = 85;
                    sliders.ear.value = 1.0;
                    sliders.eye.value = 70;
                    update();
                }
            });
        }
        
        window.onload = init;
    </script>
</body>
</html>
