<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墙上的颜色</title>
<meta name="description" content="仓库里近来不大刷的墙色。点色块复制色号。">
<style>
  :root {
    --ink: #1c2430;
    --mute: #5c6570;
    --line: #d8dde4;
    --page: #eef1f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 16px 80px;
  }
  header {
    max-width: 720px;
    margin: 0 auto 22px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--mute);
    margin-bottom: 8px;
  }
  h1 {
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 600;
    letter-spacing: .04em;
    line-height: 1.15;
  }
  .lead {
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--mute);
    max-width: 34em;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: #1c2430;
    color: #f3f0ea;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 20;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .grid {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    border-radius: 16px;
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 210px;
  }
  .card.light { box-shadow: 0 1px 0 rgba(28,36,48,.06); }
  .name {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .name b {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .06em;
  }
  .name span {
    font-size: 11px;
    letter-spacing: .08em;
    opacity: .7;
    flex-shrink: 0;
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    flex: 1;
  }
  .swatches.five { grid-template-columns: repeat(5, 1fr); }
  button.sw {
    appearance: none;
    border: 0;
    border-radius: 10px;
    min-height: 72px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 7px 6px;
    text-align: left;
    position: relative;
  }
  button.sw:active { transform: scale(.97); }
  button.sw code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: .02em;
    background: transparent;
  }
  .bar {
    display: flex;
    height: 10px;
    border-radius: 99px;
    overflow: hidden;
  }
  .bar i { flex: 1; display: block; }

  footer {
    max-width: 720px;
    margin: 26px auto 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--mute);
  }
</style>
</head>

</header>

<div class="grid" id="grid"></div>
<div class="toast" id="toast">已复制</div>
<footer>色号是给这一页备的，不是全店校服。题目是纸就用纸，题目是墙再来这里拿。</footer>

const grid = document.getElementById("grid");
const toast = document.getElementById("toast");
let hideT;

function copy(hex) {
  const t = hex.toUpperCase();
  navigator.clipboard.writeText(t).then(() => show(t + " 已复制")).catch(() => show(t));
}
function show(msg) {
  toast.textContent = msg;
  toast.classList.add("on");
  clearTimeout(hideT);
  hideT = setTimeout(() => toast.classList.remove("on"), 1400);
}

sets.forEach(s => {
  const card = document.createElement("article");
  card.className = "card light";
  card.style.background = s.wall;
  card.style.color = s.ink;
  const five = s.five || s.colors.length === 5;
  card.innerHTML = `
    <div class="name"><b>${s.name}</b><span>${s.tag}</span></div>
    <div class="swatches${five ? " five" : ""}"></div>
    <div class="bar"></div>
  `;
  const sw = card.querySelector(".swatches");
  const bar = card.querySelector(".bar");
  s.colors.forEach((hex, i) => {
    const b = document.createElement("button");
    b.className = "sw";
    b.type = "button";
    b.style.background = hex;
    b.setAttribute("aria-label", hex);
    const code = document.createElement("code");
    code.textContent = hex.toUpperCase();
    code.style.color = s.darkInk[i] ? "#2a2430" : "#f6f1ea";
    b.appendChild(code);
    b.addEventListener("click", () => copy(hex));
    sw.appendChild(b);
    const sl = document.createElement("i");
    sl.style.background = hex;
    bar.appendChild(sl);
  });
  grid.appendChild(card);
});
