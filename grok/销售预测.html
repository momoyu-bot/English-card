<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>FY26-Q3-销售预测.xlsx</title>
  <style>
    :root {
      --green: #217346;
      --green-dark: #185a36;
      --paper: #fff;
      --header: #f3f3f3;
      --ink: #212121;
      --muted: #6b6b6b;
      --grid: #d4d4d4;
      --col: #e6e6e6;
      --select: #e2efda;
      --food: #fff2cc;
      --stripe: #fafafa;
      --title: #eef6ea;
      --pos: #375623;
      --neg: #c0504d;
      --banner: #fff4ce;
      --banner-ink: #3d3200;
      --banner-line: #e0c36a;
      --warn: #d83b01;
      --heat1: #e2efda;
      --heat2: #c6e0b4;
      --heat3: #a9d08e;
      --heat4: #70ad47;
      --heat5: #548235;
      --heat6: #375623;
      --cell-h: 26px;
      --rowhead: 36px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: var(--header);
      user-select: none; overflow: hidden;
    }
    button { font: inherit; cursor: pointer; }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    .titlebar {
      display: flex; align-items: center; height: 32px;
      background: var(--green); color: #fff; flex-shrink: 0;
    }
    .titlebar .logo {
      display: flex; align-items: center; gap: 6px;
      height: 100%; padding: 0 8px; border: 0; background: none; color: #fff;
    }
    .titlebar .logo:hover { background: var(--green-dark); }
    .titlebar .name { flex: 1; text-align: center; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .caps { display: flex; height: 100%; }
    .caps button {
      width: 44px; border: 0; background: none; color: #fff; font-size: 16px;
    }
    .caps button:hover { background: var(--green-dark); }
    .caps .x:hover { background: var(--neg); }
    .menubar {
      display: flex; align-items: center; gap: 2px; height: 28px;
      background: var(--green); color: #fff; padding: 0 4px; flex-shrink: 0; position: relative;
    }
    .menubar > button, .menubar > span {
      height: 24px; border: 0; background: none; color: #fff; padding: 0 10px; font-size: 12px; border-radius: 2px;
    }
    .menubar > button:hover, .menubar > button.on { background: #fff; color: var(--ink); }
    .menubar .on-tab { border-bottom: 2px solid #fff; }
    .menu {
      display: none; position: absolute; top: 100%; left: 4px; z-index: 40;
      width: 220px; background: #fff; color: var(--ink);
      border: 1px solid var(--grid); box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 4px 0;
    }
    .menu.open { display: block; }
    .menu button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      padding: 7px 12px; font-size: 12px;
    }
    .menu button:hover { background: var(--select); }
    .menu hr { border: 0; border-top: 1px solid var(--grid); margin: 4px 0; }
    .ribbon {
      display: flex; align-items: center; gap: 4px; height: 48px;
      background: var(--header); border-bottom: 1px solid var(--grid); padding: 0 8px; flex-shrink: 0;
    }
    .ribbon button {
      width: 32px; height: 32px; border: 0; border-radius: 2px; background: none; color: var(--ink); font-size: 14px;
    }
    .ribbon button:hover { background: var(--select); }
    .ribbon button:disabled { opacity: .35; }
    .sep { width: 1px; height: 28px; background: var(--grid); margin: 0 4px; }
    .formula {
      display: flex; align-items: center; height: 28px; background: #fff;
      border-bottom: 1px solid var(--grid); flex-shrink: 0;
    }
    .addr { width: 64px; text-align: center; font-size: 12px; border-right: 1px solid var(--grid); }
    .fx { width: 22px; text-align: center; font: italic 700 11px Georgia, serif; color: var(--muted); }
    .fval { flex: 1; font: 12px Consolas, monospace; overflow: hidden; white-space: nowrap; padding-right: 8px; }
    .caret { display: inline-block; width: 1px; height: 14px; background: var(--ink); margin-right: 4px; vertical-align: middle; animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .banner {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      background: var(--banner); color: var(--banner-ink);
      border-bottom: 1px solid var(--banner-line); padding: 6px 12px; font-size: 12px; flex-shrink: 0;
    }
    .banner .dot {
      width: 16px; height: 16px; border-radius: 50%; background: var(--warn); color: #fff;
      font-size: 10px; font-weight: 700; display: grid; place-items: center;
    }
    .banner p { margin: 0; flex: 1; min-width: 180px; }
    .banner button {
      border: 1px solid var(--banner-line); background: #fff; color: var(--ink);
      padding: 4px 10px; font-size: 12px; border-radius: 2px;
    }
    .gridwrap { flex: 1; overflow: auto; background: #fff; min-height: 0; }
    table.xl { border-collapse: collapse; min-width: 640px; width: 100%; }
    table.xl th, table.xl td {
      border: 1px solid var(--grid); height: var(--cell-h); padding: 0 6px;
      font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    table.xl th {
      background: var(--col); color: var(--muted); font-weight: 500; text-align: center;
      position: sticky; z-index: 2;
    }
    table.xl thead th { top: 0; }
    table.xl th.rh { left: 0; width: var(--rowhead); min-width: var(--rowhead); z-index: 3; }
    table.xl td { background: #fff; overflow: hidden; max-width: 120px; text-overflow: ellipsis; }
    td.header { background: var(--col); font-weight: 600; }
    td.title { background: var(--title); font-weight: 600; }
    td.select { background: var(--select); }
    td.food { background: var(--food); font-weight: 600; }
    td.stripe { background: var(--stripe); }
    td.total { background: var(--select); font-weight: 600; }
    td.snake { background: var(--select); }
    td.head { background: var(--green); color: #fff; font-weight: 600; }
    td.heat1 { background: var(--heat1); }
    td.heat2 { background: var(--heat2); }
    td.heat3 { background: var(--heat3); }
    td.heat4 { background: var(--heat4); color: #fff; font-weight: 600; }
    td.heat5 { background: var(--heat5); color: #fff; font-weight: 600; }
    td.heat6 { background: var(--heat6); color: #fff; font-weight: 600; }
    td.right { text-align: right; }
    td.green { color: var(--pos); }
    td.red { color: var(--neg); }
    td.muted { color: var(--muted); }
    td.sel { outline: 2px solid var(--green); outline-offset: -2px; }
    td.pop { animation: pop .18s ease; }
    @keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .bar { position: relative; }
    .bar::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0);
      background: #c6e0b4; z-index: 0;
    }
    .bar span { position: relative; z-index: 1; }
    .tabs {
      display: flex; align-items: flex-end; height: 28px;
      background: var(--header); border-top: 1px solid var(--grid); flex-shrink: 0; overflow-x: auto;
    }
    .tabs button {
      height: 24px; border: 1px solid transparent; border-bottom: 0;
      background: none; color: var(--muted); padding: 0 12px; font-size: 12px;
    }
    .tabs button.on { background: #fff; color: var(--green); font-weight: 600; border-color: var(--grid); }
    .status {
      display: flex; align-items: center; gap: 12px; height: 24px;
      background: var(--green); color: #fff; padding: 0 8px; font-size: 11px; flex-shrink: 0;
    }
    .status .ml { margin-left: auto; }
    .status .save {
      border: 0; background: rgba(255,255,255,.15); color: #fff;
      padding: 1px 8px; border-radius: 2px; font-size: 11px;
    }
    .mask {
      position: absolute; inset: 0; background: rgba(33,33,33,.25);
      display: grid; place-items: center; z-index: 50; padding: 16px;
    }
    .dlg { width: 100%; max-width: 400px; background: #fff; border: 1px solid #8a8a8a; box-shadow: 0 12px 40px rgba(0,0,0,.22); }
    .dlg-bar { display: flex; justify-content: space-between; align-items: center; background: var(--header); padding: 6px 12px; font-size: 13px; font-weight: 600; }
    .dlg-bar button { border: 0; background: none; width: 24px; height: 24px; }
    .dlg-bar button:hover { background: var(--neg); color: #fff; }
    .dlg-body { display: flex; gap: 12px; padding: 16px; }
    .bang { width: 32px; height: 32px; border-radius: 50%; background: var(--warn); color: #fff; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
    .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; background: var(--header); border-top: 1px solid var(--grid); }
    .dlg-foot button { min-width: 76px; padding: 4px 12px; font-size: 12px; border: 1px solid var(--grid); background: #fff; }
    .dlg-foot .pri { background: var(--green); color: #fff; border-color: var(--green); }
    .hide { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .caret, td.pop { animation: none; }
    }
  </style>
</head>

<script>
const TABS = [
  { id: "merge", label: "预算合并" },
  { id: "snake", label: "销售管道" },
  { id: "cover", label: "区域汇总" },
  { id: "notes", label: "说明" },
];
const DEPTS = ["市场部", "销售部", "研发部", "运营部"];
const QUARTERS = ["Q1实际", "Q2实际", "Q3预测", "Q4规划"];
const SIZES = { merge: [8, 12], snake: [16, 14], cover: [9, 22], notes: [6, 22] };
const FOOD = [8000, 12000, 15000, 18000, 22000, 28000, 35000, 50000];
const KEY = "fy26-card-v1";

function colLetter(i) {
  let n = i, s = "";
  while (n >= 0) { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; }
  return s;
}
function addr(r, c) { return colLetter(c) + (r + 1); }
function fmt(n) {
  if (!n) return "0";
  if (Math.abs(n) >= 1e6) { const m = n / 1e6; return (m >= 10 ? m.toFixed(0) : m.toFixed(1)) + "M"; }
  return Math.round(n).toLocaleString("en-US");
}
function budget(tile) {
  if (tile <= 0) return "";
  return fmt(tile * 1000);
}
function heat(t) {
  if (t <= 0) return "";
  if (t <= 2) return "heat1";
  if (t <= 4) return "heat2";
  if (t <= 8) return "heat3";
  if (t <= 16) return "heat4";
  if (t <= 64) return "heat5";
  return "heat6";
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

const REGIONS = [
  ["华东", "云计算", "1,284,000", "1,422,000", "1,680,000", "96,000", "+18%", "王磊", "推进中"],

  ["西南", "医疗", "198,000", "210,000", "248,000", "31,000", "+18%", "赵敏", "推进中"],
  ["海外", "SaaS", "720,000", "805,000", "940,000", "55,000", "+21%", "A. Cole", "推进中"],
  ["海外", "渠道", "312,000", "298,000", "305,000", "28,000", "−2%", "A. Cole", "关注"],
  ["华北", "能源", "455,000", "470,000", "510,000", "16,000", "+8%", "陈可", "正常"],
  ["华东", "教育", "166,000", "174,000", "190,000", "12,000", "+9%", "王磊", "正常"],
];
const PIPE = [
  ["华东-阿里云", "企业订阅", "承诺", "168,000", "王磊", "9/12 评审", "80%", "09-20"],
  ["华南-拼多多", "广告增补", "强意向", "220,000", "林晓", "等法务", "50%", "09-28"],
  ["华北-工行", "专线扩容", "评估", "96,000", "陈可", "招标中", "20%", "10-15"],
  ["海外-Notion", "国际渠道", "承诺", "84,000", "A. Cole", "已PO", "80%", "09-08"],
  ["西南-华西", "医疗云", "强意向", "61,000", "赵敏", "试点中", "50%", "10-02"],
  ["华东-盒马", "门店SaaS", "评估", "48,000", "王磊", "对比竞品", "20%", "10-22"],

  ["华北-国电", "巡检AI", "关注", "55,000", "陈可", "预算冻结", "10%", "11-01"],
  ["海外-Canva", "席位扩建", "强意向", "73,000", "A. Cole", "Q3可签", "50%", "09-30"],
  ["西南-地铁", "乘客分析", "评估", "39,000", "赵敏", "等立项", "20%", "10-18"],
];
const BUDGET = [
  ["428,000", "452,000", "490,000", "510,000", "1,880,000", "+7%"],
  ["612,000", "640,000", "705,000", "720,000", "2,677,000", "+11%"],
  ["880,000", "902,000", "940,000", "955,000", "3,677,000", "+4%"],
  ["196,000", "210,000", "228,000", "236,000", "870,000", "+9%"],
  ["154,000", "162,000", "178,000", "185,000", "679,000", "+12%"],
  ["98,000", "101,000", "104,000", "108,000", "411,000", "+3%"],
];
const DEPT_COVER = ["市场部", "销售部", "研发部", "运营部", "客户成功", "综合管理"];

function cell(text, extra) { return Object.assign({ text: text || "" }, extra); }

function coverMap() {
  const m = {};
  const set = (r, c, v) => { m[r + "," + c] = v; };
  set(0, 0, cell("2026 年第三季度销售预测 · 机密 · 仅供内部传阅", { cls: "title" }));
  set(1, 0, cell("更新 2026-08-18 18:40", { cls: "muted" }));
  set(1, 2, cell("编制：销售运营部", { cls: "muted" }));
  set(1, 4, cell("版本 v3.2", { cls: "muted" }));
  ["区域", "客户行业", "Q1实际", "Q2实际", "Q3预测", "Q3缺口", "YoY", "负责人", "状态"].forEach((h, c) => {
    set(3, c, cell(h, { cls: "header" + (c >= 2 && c <= 6 ? " right" : "") }));
  });
  REGIONS.forEach((row, i) => {
    row.forEach((t, c) => {
      const yoyNeg = row[6].startsWith("−");
      const watch = row[8] === "关注";
      let cls = (i % 2 ? "stripe" : "") + (c >= 2 && c <= 6 ? " right" : "");
      if (c === 6) cls += yoyNeg ? " red" : " green";
      if (c === 8 && watch) cls += " red";
      set(4 + i, c, cell(t, { cls, bar: c === 4 ? 0.35 + (i % 5) * 0.12 : 0 }));
    });
  });
  const tr = 16;
  set(tr, 0, cell("合计", { cls: "total" }));
  set(tr, 2, cell("7,761,000", { cls: "total right" }));
  set(tr, 3, cell("8,269,000", { cls: "total right" }));
  set(tr, 4, cell("9,313,000", { cls: "total right" }));
  set(tr, 5, cell("543,000", { cls: "total right" }));
  set(tr, 6, cell("+13%", { cls: "total right green" }));
  set(18, 0, cell("假设：Q3 增速取区域历史中位数；已剔除一次性大单与渠道返利。", { cls: "muted" }));
  set(19, 0, cell("数据源：CRM 机会导出 / ERP 回款确认。缺口 = 预测 − 已锁定。", { cls: "muted" }));
  return m;
}
function notesMap() {
  const lines = [
    ["字段与计算口径", "title"],
    [""],
    ["Q1 / Q2 实际", "header"],
    ["取已关账收入，不含税。跨期确认以 ERP 入账日为准。", "muted"],
    [""],
    ["Q3 预测", "header"],
    ["已锁定合同 + 加权管道（承诺 80% / 强意向 50% / 评估 20%）。", "muted"],
    [""],
    ["选区快捷方式", "header"],
    ["方向键移动活动单元格。Esc 立即保存当前工作簿视图。", "muted"],
    ["文件 → 恢复未保存的工作簿，或 Ctrl+Shift+E 恢复上次编辑会话。", "muted"],
    [""],
    ["修订记录  v3.2  同步华南电商大单；下调华北制造。", "muted"],
  ];
  const m = {};
  lines.forEach((x, i) => { m[i + ",0"] = cell(x[0], { cls: x[1] || "" }); });
  return m;
}
function mergeCoverMap() {
  const m = {};

function emptyBoard() { return [0, 0, 0, 0].map(() => [0, 0, 0, 0]); }

function slide(line) {

function doMerge(dir) {

  state.mergeUndo = { board: state.merge, score: state.mergeScore };
  state.merge = res.board;
  state.mergeScore += res.score * 1000;
  state.pops = new Set(res.marks.map((p) => p.r + "," + p.c));
  if (res.spawned) state.pops.add(res.spawned.r + "," + res.spawned.c);

  if ((e.ctrlKey || e.metaKey) && (e.key === "`" || e.code === "Backquote")) { e.preventDefault(); unlock(); return; }

function loop(now) {
  if (!last) last = now;
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (playing() && state.sheet === "snake" && state.snake.alive) {
    acc += dt;
    const step = state.snake.stepMs / 1000;
    let dirty = false, died = null;
    while (acc >= step) {
      acc -= step;
      const prev = state.snake;
      if (!prev.alive) break;
      const next = stepSnake(prev);
      state.snake = next;
      dirty = true;
      if (prev.alive && !next.alive) died = next;
    }
    if (dirty) render();
    if (died) {
      state.best.snake = Math.max(state.best.snake, died.score);
      saveBest();
      state.dialog = { kind: "snake", body: "无法计算公式。引用的单元格区域无效。", detail: "本管道累计 " + fmt(died.score) + "（最高 " + fmt(state.best.snake) + "）", pri: "重试", sec: "关闭" };
      render();
    }
  } else acc = 0;
  raf = requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
render();
</script>
</body>
