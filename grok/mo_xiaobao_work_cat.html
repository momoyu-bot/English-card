<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mo_xiaobao_work_cat • v1.3 实况版</title>
<meta name="description" content="实况版。能量条在顶上慢慢回。还是只做最低必要量。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
        body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
        .soft-bg { background: linear-gradient(135deg, #fff0f5 0%, #f0e6ff 100%); }
        .cute-card { box-shadow: 0 25px 50px -12px rgb(249 168 212 / 0.25); }
        .cat-float { animation: cat-float 3s ease-in-out infinite; }
        @keyframes cat-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .live-activity {
            animation: live-pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 10px 30px -10px rgb(249 168 212 / 0.4);
        }
        .cat-bubble {
            animation: bubble-pop 0.5s ease forwards;
        }
        .work-btn { transition: all 0.2s cubic-bezier(0.4,0,0.2,1); }
        .work-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="soft-bg min-h-screen flex items-center justify-center p-4">
    <div class="max-w-[380px] w-full mx-auto">
        
        <!-- 顶部实况活动栏 -->
        <div id="live-activity" class="hidden mb-3 bg-white/90 backdrop-blur-md border border-pink-200 rounded-3xl px-4 py-3 flex items-center gap-x-3 shadow-lg live-activity">
            <div class="flex-shrink-0">
                <div class="w-9 h-9 bg-gradient-to-br from-pink-400 to-purple-400 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-cat text-white"></i>
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-semibold text-sm text-gray-800">mo小宝 · 实况中</div>
                        <div id="live-status" class="text-xs text-pink-500">正在缓缓工作... 能量缓慢恢复中</div>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-bold text-pink-600" id="live-energy">68%</div>
                        <div class="text-[9px] text-gray-400 -mt-1">当前能量</div>
                    </div>
                </div>
            </div>
            <button onclick="toggleLiveActivity()" class="text-xs px-3 py-1 bg-pink-100 text-pink-600 rounded-2xl font-medium active:scale-95">关闭</button>
        </div>

        <!-- 主卡片 -->
        <div class="cute-card bg-white rounded-3xl shadow-2xl overflow-hidden border border-pink-100">
            
            <!-- Header -->
            <div class="bg-gradient-to-r from-pink-50 to-purple-50 px-6 py-4 flex items-center justify-between border-b border-pink-100">
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-gradient-to-br from-pink-400 to-purple-400 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-cat text-white text-xl"></i>
                    </div>
                    <div>
                        <div class="font-bold text-gray-800 text-lg">mo_xiaobao_work_cat</div>
                        <div class="text-[10px] text-pink-500 -mt-1">v1.3 实况魔法版</div>
                    </div>
                </div>
                <div onclick="toggleLiveActivity()" class="cursor-pointer px-3 py-1 bg-emerald-100 text-emerald-600 text-xs font-medium rounded-full flex items-center gap-x-1 active:scale-95">
                    <i class="fas fa-play"></i>
                    <span>实况</span>
                </div>
            </div>
            
            <!-- Cat -->
            <div class="flex justify-center pt-8 pb-4">
                <div class="relative">
                    <div id="cat-avatar" class="text-[92px] cat-float drop-shadow-lg cursor-pointer">🐱</div>
                    <div class="absolute -top-2 -right-2 w-8 h-8 bg-yellow-300 rounded-full flex items-center justify-center">
                        <i class="fas fa-heart text-red-400 text-sm"></i>
                    </div>
                </div>
            </div>
            
            <!-- Mode Tabs -->
            <div class="px-6 pb-2">
                <div class="flex bg-pink-50 rounded-3xl p-1 text-sm">
                    <div onclick="switchMode('low')" id="tab-low" class="nav-tab flex-1 text-center py-2.5 rounded-3xl font-medium cursor-pointer active bg-white shadow text-pink-600">
                        <i class="fas fa-battery-quarter mr-1.5"></i><span>低能耗模式</span>
                    </div>
                    <div onclick="switchMode('survive')" id="tab-survive" class="nav-tab flex-1 text-center py-2.5 rounded-3xl font-medium cursor-pointer text-gray-600">
                        <i class="fas fa-heartbeat mr-1.5"></i><span>续命模式</span>
                    </div>
                </div>
            </div>
            
            <!-- Content -->
            <div id="content-area" class="px-6 pb-8 min-h-[260px]">
                <!-- Low Energy -->
                <div id="low-content">
                    <div class="text-center mb-6">
                        <div class="inline-flex items-center gap-x-2 bg-pink-100 text-pink-600 px-4 py-1 rounded-2xl text-sm font-medium mb-4">
                            <i class="fas fa-clock"></i><span>周五低能耗模式 · 允许只发挥 70%</span>
                        </div>
                        <h2 class="text-3xl font-bold text-gray-800 leading-tight mb-4">mo小宝，<br>上班缓缓来就好</h2>
                        <div class="text-gray-600 text-[15px] leading-relaxed max-w-[260px] mx-auto">
                            困困也可以工作，但只做“最低必要量”就好。<br>把任务拆小，像小猫咪啃饼干一样。
                        </div>
                    </div>
                    <button onclick="coaxMe()" class="work-btn w-full py-4 bg-gradient-to-r from-pink-400 via-rose-400 to-orange-400 text-white font-semibold text-lg rounded-3xl shadow-lg flex items-center justify-center gap-x-2">
                        <span>再哄我一句</span><i class="fas fa-magic"></i>
                    </button>
                    <div id="coax-message" class="hidden mt-4 p-4 bg-pink-50 border border-pink-200 rounded-2xl text-sm text-pink-700"></div>
                </div>
                
                <!-- Survival Mode -->
                <div id="survive-content" class="hidden">
                    <div class="text-center mb-6">
                        <div class="text-4xl font-bold text-red-500 mb-1">宝，再撑一下</div>
                        <div class="text-gray-600 text-[15px] leading-relaxed max-w-[260px] mx-auto mb-5">
                            你不是不想工作。<br>你只是一个凌晨三点睡觉的人类。
                        </div>
                        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm text-amber-700 mb-5">
                            <div class="flex items-start gap-x-3">
                                <i class="fas fa-lightbulb text-amber-500 mt-1"></i>
                                <div class="text-left">现在请温柔地打开亚马逊后台。<br>随便写一点。<br><span class="font-medium">写一点就算赢。</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex justify-between text-xs text-gray-500 mb-1.5 px-1">
                            <div>当前能量</div>
                            <div id="energy-text">42%</div>
                        </div>
                        <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                            <div id="energy-bar" class="energy-bar h-full bg-gradient-to-r from-red-400 to-pink-500 rounded-full" style="width:42%"></div>
                        </div>
                    </div>
                    
                    <button onclick="renewLife()" class="work-btn w-full py-4 bg-gradient-to-r from-red-400 to-pink-500 text-white font-semibold text-lg rounded-3xl shadow-lg flex items-center justify-center gap-x-2">
                        <span>点我续命</span><i class="fas fa-heartbeat"></i>
                    </button>
                    <div id="renew-status" class="hidden mt-3 text-center text-sm text-red-500 font-medium"></div>
                </div>
            </div>
            
            <!-- Daily Tip -->
            <div class="px-6 pb-5">
                <div class="bg-gradient-to-r from-purple-50 to-pink-50 border border-purple-200 rounded-2xl p-3 text-xs text-purple-700 flex items-start gap-x-2">
                    <i class="fas fa-lightbulb mt-0.5 text-purple-400"></i>
                    <div><span class="font-medium">今日小贴士：</span><span id="daily-tip"></span></div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4 text-xs text-pink-400">mo小宝专属 · Grok v1.3 实况魔法版 🐱</div>
    </div>

    <script>
        let energy = 42;
        let isLiveActive = false;
        let liveInterval = null;
        let bubbleInterval = null;
        let catClickCount = 0;
        
        const dailyTips = ["小猫咪今天也想被你摸摸头哦～","写代码前先给猫咪（自己）倒杯水","困了就允许自己眯5分钟","今天只做最重要的一件事就够了","亚马逊后台不会自己长草，先打开再说","你已经比昨天多活了一天，赢了"];
        
        function updateEnergyBar() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            if (bar && text) {
                bar.style.width = energy + '%';
                text.textContent = energy + '%';
            }
            // 同步实况活动能量
            const liveEnergy = document.getElementById('live-energy');
            if (liveEnergy) liveEnergy.textContent = energy + '%';
        }
        
        function saveEnergy() {
            localStorage.setItem('mo_xiaobao_energy', energy);
        }
        
        function loadEnergy() {
            const saved = localStorage.getItem('mo_xiaobao_energy');
            if (saved) {
                energy = parseInt(saved);
                updateEnergyBar();
            }
        }
        
        function autoRecoverEnergy() {
            if (energy < 100) {
                energy = Math.min(100, energy + 2);
                updateEnergyBar();
                saveEnergy();
            }
        }
        
        function showCatBubble(message) {
            const container = document.getElementById('content-area');
            const bubble = document.createElement('div');
            bubble.className = 'cat-bubble absolute bg-white border border-pink-300 text-pink-600 text-xs px-3 py-1.5 rounded-2xl shadow-md flex items-center gap-x-1.5';
            bubble.style.cssText = `top: 20%; left: ${30 + Math.random()*40}%; transform: translateX(-50%); z-index: 30;`;
            bubble.innerHTML = `<i class="fas fa-comment-dots text-pink-400"></i> <span>${message}</span>`;
            container.appendChild(bubble);
            
            setTimeout(() => {
                bubble.style.transition = 'all 0.4s';
                bubble.style.opacity = '0';
                bubble.style.transform = 'translate(-50%, -15px)';
                setTimeout(() => bubble.remove(), 400);
            }, 2200);
        }
        
        function startLiveActivity() {
            const live = document.getElementById('live-activity');
            live.classList.remove('hidden');
            isLiveActive = true;
            
            // 每20秒自动恢复一点能量
            if (liveInterval) clearInterval(liveInterval);
            liveInterval = setInterval(() => {
                autoRecoverEnergy();
            }, 20000);
            
            // 每45秒随机冒泡
            if (bubbleInterval) clearInterval(bubbleInterval);
            bubbleInterval = setInterval(() => {
                if (isLiveActive) {
                    const messages = ["我还在呢～","慢慢来不急","今天也要加油哦","困了就休息一下","你最棒了"];
                    showCatBubble(messages[Math.floor(Math.random()*messages.length)]);
                }
            }, 45000);
        }
        
        function stopLiveActivity() {
            const live = document.getElementById('live-activity');
            live.classList.add('hidden');
            isLiveActive = false;
            if (liveInterval) clearInterval(liveInterval);
            if (bubbleInterval) clearInterval(bubbleInterval);
        }
        
        function toggleLiveActivity() {
            if (isLiveActive) {
                stopLiveActivity();
            } else {
                startLiveActivity();
            }
        }
        
        function switchMode(mode) {
            const low = document.getElementById('low-content');
            const survive = document.getElementById('survive-content');
            const tabLow = document.getElementById('tab-low');
            const tabSurvive = document.getElementById('tab-survive');
            
            if (mode === 'low') {
                low.classList.remove('hidden');
                survive.classList.add('hidden');
                tabLow.classList.add('active','bg-white','shadow','text-pink-600');
                tabLow.classList.remove('text-gray-600');
                tabSurvive.classList.remove('active','bg-white','shadow','text-pink-600');
                tabSurvive.classList.add('text-gray-600');
            } else {
                low.classList.add('hidden');
                survive.classList.remove('hidden');
                tabSurvive.classList.add('active','bg-white','shadow','text-pink-600');
                tabSurvive.classList.remove('text-gray-600');
                tabLow.classList.remove('active','bg-white','shadow','text-pink-600');
                tabLow.classList.add('text-gray-600');
            }
        }
        
        const coaxMessages = ["宝，你今天已经很努力了哦～","小猫咪也要慢慢来呀","困困没关系，先抱抱","周五允许只发挥70%！","写一点点就赢了"];
        
        function coaxMe() {
            const box = document.getElementById('coax-message');
            box.innerHTML = `<div class="flex gap-x-2"><i class="fas fa-comment-dots text-pink-400 mt-0.5"></i><div>${coaxMessages[Math.floor(Math.random()*coaxMessages.length)]}</div></div>`;
            box.classList.remove('hidden');
            
            energy = Math.min(100, energy + 6);
            updateEnergyBar();
            saveEnergy();
            
            const cat = document.getElementById('cat-avatar');
            if (cat) {
                cat.style.transform = 'scale(1.2) rotate(10deg)';
                setTimeout(() => cat.style.transform = 'translateY(0)', 500);
            }
        }
        
        function renewLife() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            const status = document.getElementById('renew-status');
            
            const gain = Math.floor(Math.random()*15) + 10;
            energy = Math.min(100, energy + gain);
            bar.style.width = energy + '%';
            text.textContent = energy + '%';
            saveEnergy();
            
            status.innerHTML = `✨ 续命成功！+${gain}% 能量`;
            status.classList.remove('hidden');
            status.style.color = '#e11d48';
            
            const cat = document.getElementById('cat-avatar');
            if (cat) cat.style.transform = 'scale(1.3) rotate(-15deg)';
            setTimeout(() => { if (cat) cat.style.transform = 'scale(1)'; }, 400);
            
            setTimeout(() => {
                if (status) status.style.opacity = '0';
                setTimeout(() => { if (status) { status.style.opacity = '1'; status.classList.add('hidden'); } }, 300);
            }, 2200);
        }
        
        function setupCat() {
            const cat = document.getElementById('cat-avatar');
            cat.addEventListener('click', () => {
                catClickCount++;
                cat.style.transform = `scale(${1 + catClickCount*0.08}) rotate(${catClickCount*10}deg)`;
                
                if (catClickCount >= 5) {
                    catClickCount = 0;
                    energy = Math.min(100, energy + 20);
                    updateEnergyBar();
                    saveEnergy();
                    showCatBubble("猫咪超级开心！能量大涨！");
                }
                setTimeout(() => { cat.style.transform = 'translateY(0)'; }, 300);
            });
            cat.style.cursor = 'pointer';
        }
        
        function init() {
            loadEnergy();
            document.getElementById('daily-tip').textContent = dailyTips[Math.floor(Math.random()*dailyTips.length)];
            
            document.getElementById('low-content').classList.remove('hidden');
            document.getElementById('survive-content').classList.add('hidden');
            updateEnergyBar();
            
            setupCat();
            
            // 自动启动实况活动（第一次打开）
            setTimeout(() => {
                const live = document.getElementById('live-activity');
                if (!live.classList.contains('hidden')) return;
                startLiveActivity();
            }, 1800);
            
            // 键盘快捷键
            document.addEventListener('keydown', e => {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    document.getElementById('low-content').classList.contains('hidden') ? renewLife() : coaxMe();
                }
            });
            
            console.log('%c[mo_xiaobao] v1.3 实况版已就绪～', 'color:#f9a8d4');
        }
        
        window.onload = init;
    </script>
</body>
</html>
