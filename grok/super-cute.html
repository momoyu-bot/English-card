<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超萌小页面 ✨</title>
<meta name="description" content="今天也要温柔对自己。点一下，领一只喵。">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe6f7 0%, #f0e6ff 50%, #e6f7ff 100%);
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    
    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.95);
      border-radius: 28px;
      padding: 32px 28px 36px;
      box-shadow: 0 20px 60px rgba(255, 105, 180, 0.25),
                  0 0 0 1px rgba(255,255,255,0.8);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #ffb6e6 0%, transparent 70%);
      opacity: 0.6;
    }
    
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff0f7;
      color: #ff6fae;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    
    .title span {
      background: linear-gradient(90deg, #ff7ac4, #ffb86c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .cat {
      width: 78px;
      height: 78px;
      background: linear-gradient(145deg, #fff5fb, #ffe0f3);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 12px 25px rgba(255, 105, 180, 0.35);
      margin: 10px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .cat::before {
      content: '';
      position: absolute;
      width: 52px;
      height: 42px;
      background: white;
      border-radius: 50% 50% 40% 40%;
      box-shadow: 0 4px 10px rgba(255, 153, 204, 0.3);
    }
    
    .cat-eye {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #333;
      border-radius: 50%;
      top: 28px;
    }
    
    .cat-eye.left { left: 22px; }
    .cat-eye.right { right: 22px; }
    
    .cat-blush {
      position: absolute;
      width: 10px;
      height: 5px;
      background: #ff9ec7;
      border-radius: 50%;
      top: 35px;
      filter: blur(1px);
    }
    
    .cat-blush.left { left: 18px; }
    .cat-blush.right { right: 18px; }
    
    .subtitle {
      color: #666;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 22px;
    }
    
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    
    .chip {
      background: #fff0f7;
      color: #ff6fae;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 10px;
    }
    
    .btn-pink {
      background: linear-gradient(135deg, #ff7ac4, #ff9acb);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
    }
    
    .btn-white {
      background: white;
      color: #ff6fae;
      border: 2px solid #ffd1f2;
    }
    
    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #aaa;
    }
    
    .heart {
      display: inline-block;
      color: #ff6fae;
      animation: beat 1.5s infinite;
    }
    
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">✨ super kawaii mode</div>
    
    <div style="text-align: center;">
      <div class="cat">
        <!-- 可爱猫咪 -->
        <div class="cat-eye left"></div>
        <div class="cat-eye right"></div>
        <div class="cat-blush left"></div>
        <div class="cat-blush right"></div>
      </div>
    </div>
    
    <h1 class="title">你好呀，<span>小可爱</span></h1>
    
    <p class="subtitle">
      这是一个专门为你准备的超萌小页面。<br>
      希望它能让你每天都多一点点温柔和快乐～
    </p>
    
    <div class="chips">
      <div class="chip">今天也要温柔对自己</div>
      <div class="chip">多喝水 · 多休息</div>
      <div class="chip">允许自己慢一点</div>
    </div>
    
    <button class="btn btn-pink" onclick="alert('喵～今天也要加一点喜欢自己的勇气哦！💕')">
      点我获得一只喵
    </button>
    
    <button class="btn btn-white" onclick="alert('已偷偷收藏这份可爱 (*ฅ́˘ฅ̀*)')">
      收藏这份可爱
    </button>
    
    <div class="footer">
      <span class="heart">💗</span> 小提示：你已经很棒啦
    </div>
  </div>
</body>
</html>
