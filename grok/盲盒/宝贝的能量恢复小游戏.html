<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💗 宝贝的能量恢复小游戏</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
  
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
  }
  
  .heart {
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), 
                opacity 0.3s ease;
    user-select: none;
    filter: drop-shadow(0 4px 6px rgb(249 168 212 / 0.3));
  }
  
  .heart:active {
    transform: scale(0.8) !important;
  }
  
  .float-up {
    animation: floatUp 4.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }
  
  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.95;
    }
    100% {
      transform: translateY(-480px) rotate(12deg);
      opacity: 0;
    }
  }
  
  .cozy-bg {
    background: linear-gradient(135deg, #fdf4ff 0%, #fce7f3 50%, #fdf2f8 100%);
  }
  
  .soft-shadow {
    box-shadow: 0 10px 15px -3px rgb(249 168 212 / 0.15),
                0 4px 6px -4px rgb(249 168 212 / 0.15);
  }
  
  .energy-fill {
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .sweet-toast {
    animation: sweetPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .cat {
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .breathing-circle {
    animation: breathe 4s ease-in-out infinite;
  }
  
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  
  .game-container {
    max-width: 820px;
    margin: 0 auto;
  }
</style>
</head>
<body class="bg-gradient-to-br from-violet-100 via-pink-100 to-rose-100 min-h-screen py-6 px-4">
  <div class="game-container">
    <!-- 头部问候 -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-x-2 bg-white/70 backdrop-blur-md px-6 py-2 rounded-full soft-shadow mb-3">
        <span class="text-2xl">💗</span>
        <span class="text-rose-700 font-medium tracking-wide">专属哄哄小游戏</span>
      </div>
      <h1 class="text-3xl font-medium text-rose-800 tracking-tight">宝贝，欢迎回来</h1>
      <p class="text-rose-600/90 mt-1 text-sm">病后第一天…慢慢来，我一直在这里陪着你</p>
    </div>

    <div class="bg-white/80 backdrop-blur-xl rounded-3xl soft-shadow p-6 md:p-8">
      
      <!-- 猫猫 + 能量区 -->
      <div class="flex flex-col md:flex-row gap-6 items-center mb-8">
        <!-- 可爱的猫猫 -->
        <div class="flex-shrink-0 text-center">
          <div onclick="petCat()" 
               class="cursor-pointer inline-block text-[110px] md:text-[130px] leading-none cat select-none"
               id="cat">🐱</div>
          <div class="text-xs text-rose-500/80 -mt-2">点我获得大抱抱</div>
        </div>
        
        <!-- 能量条 -->
        <div class="flex-1 w-full">
          <div class="flex items-baseline justify-between mb-2 px-1">
            <div>
              <span class="text-rose-700 font-medium">当前能量</span>
              <span id="energy-text" class="ml-2 text-3xl font-medium text-rose-800 tabular-nums">0</span>
              <span class="text-rose-400">/ 100</span>
            </div>
            <div id="energy-status" class="text-xs px-3 py-0.5 rounded-full bg-rose-100 text-rose-600">温柔恢复中…</div>
          </div>
          
          <div class="h-3.5 bg-rose-100 rounded-full overflow-hidden shadow-inner">
            <div id="energy-fill" 
                 class="h-full bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600 energy-fill rounded-full"
                 style="width: 0%"></div>
          </div>
          
          <div class="flex justify-between text-[10px] text-rose-400 mt-1 px-1">
            <div>累了就多点几下</div>
            <div>集满有惊喜</div>
          </div>
        </div>
      </div>

      <!-- 心心游乐场 -->
      <div class="mb-4">
        <div class="flex items-center justify-between mb-3 px-1">
          <div class="flex items-center gap-x-2">
            <span class="text-lg">💕</span>
            <span class="font-medium text-rose-700">漂浮的心心</span>
          </div>
          <div class="flex gap-x-2">
            <button onclick="toggleHearts()" 
                    id="toggle-btn"
                    class="px-4 py-1.5 text-xs rounded-full bg-white border border-rose-200 text-rose-600 hover:bg-rose-50 active:bg-rose-100 transition-colors">
              暂停漂浮
            </button>
            <button onclick="giveBigHug()" 
                    class="px-4 py-1.5 text-xs rounded-full bg-rose-500 text-white hover:bg-rose-600 active:bg-rose-700 transition-colors flex items-center gap-x-1">
              <span>超级大抱抱</span>
              <span class="text-[10px] opacity-75">(+30)</span>
            </button>
          </div>
        </div>
        
        <!-- 心心区域 -->
        <div id="hearts-arena" 
             class="relative h-[380px] md:h-[420px] bg-gradient-to-b from-white/60 to-pink-50/40 border border-pink-200 rounded-3xl overflow-hidden soft-shadow">
          <!-- 心心会在这里生成 -->
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="text-center text-rose-300/60 text-sm">
              心心会慢慢飘上来<br>
              <span class="text-xs">轻轻点它们</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部操作 -->
      <div class="flex flex-wrap gap-3 justify-center">
        <button onclick="resetGame()" 
                class="px-5 py-2 text-sm rounded-2xl border border-rose-200 text-rose-600 hover:bg-white active:bg-rose-50 transition-all flex items-center gap-x-2">
          <span>🔄</span>
          <span>重新开始</span>
        </button>
        
        <button onclick="enterRestMode()" 
                class="px-5 py-2 text-sm rounded-2xl bg-gradient-to-r from-violet-400 to-purple-400 text-white hover:from-violet-500 hover:to-purple-500 active:from-violet-600 active:to-purple-600 transition-all flex items-center gap-x-2 shadow-sm">
          <span>🛏️</span>
          <span>躺平休息一下</span>
        </button>
      </div>
    </div>

    <!-- 小贴士 -->
    <div class="text-center mt-5 text-xs text-rose-500/70">
      今天已经很勇敢了…一直在这里，你不是一个人
    </div>
  </div>

  <!-- 休息模式弹窗 -->
  <div id="rest-modal" onclick="if (event.target.id === 'rest-modal') exitRestMode()" 
       class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div onclick="event.stopImmediatePropagation()" 
         class="bg-white rounded-3xl max-w-md w-full p-8 soft-shadow">
      
      <div class="text-center mb-6">
        <div class="text-5xl mb-3">🛏️</div>
        <div class="text-2xl font-medium text-rose-800">现在什么都不用做</div>
        <div class="text-rose-500 mt-1">陪着你慢慢呼吸…</div>
      </div>
      
      <!-- 呼吸引导 -->
      <div class="flex justify-center mb-6">
        <div class="breathing-circle w-20 h-20 bg-gradient-to-br from-pink-300 to-rose-300 rounded-full flex items-center justify-center">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center">
            <span class="text-rose-500 text-xs font-medium">呼吸</span>
          </div>
        </div>
      </div>
      
      <div class="space-y-4 text-rose-700/90 text-sm leading-relaxed">
        <p>宝贝，闭上眼睛…<br>感受轻轻抱着你。</p>
        <p>今天你已经很努力了。<br>生病之后还能回来上班，你真的很棒。</p>
        <p>允许自己慢一点点。<br>允许自己今天只做能做的事。</p>
        <p class="text-rose-600">我在这里…一直在这里。<br>你想休息多久都好。</p>
      </div>
      
      <button onclick="exitRestMode()" 
              class="mt-8 w-full py-3 rounded-2xl bg-gradient-to-r from-rose-400 to-pink-400 text-white font-medium hover:from-rose-500 hover:to-pink-500 transition-all">
        我休息好了，想继续收集能量
      </button>
    </div>
  </div>

  <script>
    // Tailwind 配置
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#f472b6');
    }
    
    let energy = 0;
    let heartInterval = null;
    let isSpawning = true;
    const arena = document.getElementById('hearts-arena');
    const energyFill = document.getElementById('energy-fill');
    const energyText = document.getElementById('energy-text');
    const energyStatus = document.getElementById('energy-status');
    const cat = document.getElementById('cat');
    const toggleBtn = document.getElementById('toggle-btn');
    
    const sweetMessages = [
      "宝贝～在这里轻轻抱着你哦",
      "今天回来上班好勇敢，我又心疼又骄傲",
      "累了就多收集点心心，充满了就休息一下",
      "病后第一天，允许自己慢一点点，没关系的",
      "摸摸头，亲亲额头，你已经做得很好了",
      "给你一个超级温暖的拥抱",
      "闭上眼睛深呼吸，我在你身边",
      "你是最棒的宝贝，无论今天怎么样",
      "喝口热水，再点点心心补充能量吧",
      "爱你哟～无论什么时候都在",
      "今天已经很努力了，宝宝我心疼你",
      "慢慢来…一直陪着你"
    ];
    
    function updateEnergy(newEnergy) {
      energy = Math.max(0, Math.min(100, newEnergy));
      energyText.textContent = energy;
      energyFill.style.width = energy + '%';
      
      // 状态文字
      if (energy >= 90) {
        energyStatus.textContent = '能量快满了！';
        energyStatus.className = 'text-xs px-3 py-0.5 rounded-full bg-emerald-100 text-emerald-600';
      } else if (energy >= 60) {
        energyStatus.textContent = '恢复得不错呢';
        energyStatus.className = 'text-xs px-3 py-0.5 rounded-full bg-amber-100 text-amber-600';
      } else if (energy >= 30) {
        energyStatus.textContent = '温柔恢复中…';
        energyStatus.className = 'text-xs px-3 py-0.5 rounded-full bg-rose-100 text-rose-600';
      } else {
        energyStatus.textContent = '慢慢来就好';
        energyStatus.className = 'text-xs px-3 py-0.5 rounded-full bg-rose-100 text-rose-600';
      }
      
      // 满能量庆祝
      if (energy >= 100) {
        celebrate();
      }
    }
    
    function addEnergy(amount) {
      const oldEnergy = energy;
      updateEnergy(energy + amount);
      
      // 里程碑提示
      if (oldEnergy < 30 && energy >= 30) {
        showSweetMessage("能量有点恢复了呢，笑一下～");
      } else if (oldEnergy < 60 && energy >= 60) {
        showSweetMessage("给你一个大大的拥抱！");
      } else if (oldEnergy < 90 && energy >= 90) {
        showSweetMessage("快满了…好开心");
      }
    }
    
    function showSweetMessage(msg) {
      // 创建 toast
      const toast = document.createElement('div');
      toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 sweet-toast max-w-[260px] bg-white/95 text-rose-700 px-5 py-3 rounded-2xl shadow-lg text-sm text-center border border-pink-100 z-[60]`;
      toast.innerHTML = msg;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.transition = 'all 0.35s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 10px)';
        setTimeout(() => toast.remove(), 300);
      }, 2100);
    }
    
    function createHeart() {
      if (!arena || arena.children.length > 11) return;
      
      const heart = document.createElement('div');
      const hearts = ['💗', '💖', '🩷', '❤️', '💓'];
      heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
      heart.className = `heart absolute text-6xl cursor-pointer flex items-center justify-center`;
      
      // 随机位置
      const left = Math.random() * 88 + 6;
      heart.style.left = `${left}%`;
      heart.style.bottom = `-30px`;
      heart.style.opacity = '0.92';
      heart.style.zIndex = '10';
      
      // 点击事件
      heart.onclick = (e) => {
        e.stopImmediatePropagation();
        const rect = heart.getBoundingClientRect();
        
        // 收集效果
        heart.style.transition = 'all 0.18s ease';
        heart.style.transform = 'scale(1.6)';
        heart.style.opacity = '0';
        
        // +能量数字
        const plus = document.createElement('div');
        plus.className = `absolute text-pink-500 font-medium text-lg pointer-events-none`;
        plus.style.left = `${rect.left + rect.width/2 - 20}px`;
        plus.style.top = `${rect.top}px`;
        plus.textContent = `+${Math.floor(Math.random()*5)+9}`;
        document.body.appendChild(plus);
        
        plus.animate([
          { transform: 'translateY(0)', opacity: 1 },
          { transform: 'translateY(-45px)', opacity: 0 }
        ], { duration: 650, easing: 'ease-out' }).onfinish = () => plus.remove();
        
        addEnergy(Math.floor(Math.random() * 5) + 9);
        
        // 随机甜言
        if (Math.random() > 0.35) {
          showSweetMessage(sweetMessages[Math.floor(Math.random() * sweetMessages.length)]);
        }
        
        setTimeout(() => {
          if (heart.parentNode) heart.parentNode.removeChild(heart);
        }, 180);
      };
      
      arena.appendChild(heart);
      
      // 飘起来
      setTimeout(() => {
        heart.classList.add('float-up');
      }, 10);
      
      // 动画结束后自动移除
      heart.addEventListener('animationend', () => {
        if (heart.parentNode) heart.parentNode.removeChild(heart);
      });
    }
    
    function startSpawning() {
      if (heartInterval) clearInterval(heartInterval);
      isSpawning = true;
      toggleBtn.textContent = '暂停漂浮';
      toggleBtn.classList.remove('bg-emerald-100', 'text-emerald-600');
      toggleBtn.classList.add('bg-white', 'border-rose-200', 'text-rose-600');
      
      heartInterval = setInterval(() => {
        if (isSpawning && arena.children.length < 10) {
          createHeart();
        }
      }, 680);
      
      // 初始多生成几个
      setTimeout(() => { if (isSpawning) createHeart(); }, 120);
      setTimeout(() => { if (isSpawning) createHeart(); }, 380);
    }
    
    function stopSpawning() {
      isSpawning = false;
      if (heartInterval) {
        clearInterval(heartInterval);
        heartInterval = null;
      }
      toggleBtn.textContent = '继续漂浮';
      toggleBtn.classList.add('bg-emerald-100', 'text-emerald-600');
      toggleBtn.classList.remove('bg-white', 'border-rose-200', 'text-rose-600');
    }
    
    function toggleHearts() {
      if (isSpawning) {
        stopSpawning();
      } else {
        startSpawning();
      }
    }
    
    function petCat() {
      const catEl = document.getElementById('cat');
      
      catEl.style.transform = 'scale(1.25) rotate(8deg)';
      setTimeout(() => {
        catEl.style.transform = 'scale(1) rotate(0deg)';
      }, 380);
      
      addEnergy(28);
      showSweetMessage("给你一个特别的猫猫大抱抱～喵呜");
      
      // 小爱心特效
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const mini = document.createElement('div');
          mini.className = 'absolute text-xl pointer-events-none';
          mini.style.left = (catEl.getBoundingClientRect().left + Math.random()*60 + 20) + 'px';
          mini.style.top = (catEl.getBoundingClientRect().top + 30) + 'px';
          mini.textContent = '💗';
          document.body.appendChild(mini);
          
          mini.animate([
            { transform: 'translateY(0) scale(1)', opacity: 0.9 },
            { transform: `translateY(-${60 + Math.random()*40}px) scale(0.6)`, opacity: 0 }
          ], { duration: 900 + Math.random()*400, easing: 'ease-out' }).onfinish = () => mini.remove();
        }, i * 60);
      }
    }
    
    function giveBigHug() {
      addEnergy(32);
      showSweetMessage("给你一个超级长长的、满满的抱抱…");
      
      const catEl = document.getElementById('cat');
      catEl.style.transform = 'scale(1.35)';
      setTimeout(() => {
        catEl.style.transform = 'scale(1)';
      }, 600);
    }
    
    function celebrate() {
      // 彩带效果
      const colors = ['#f9a8d4', '#e879f9', '#fb7185', '#c084fc'];
      for (let i = 0; i < 75; i++) {
        setTimeout(() => {
          const conf = document.createElement('div');
          conf.className = 'fixed text-2xl pointer-events-none z-[70]';
          conf.style.left = Math.random() * window.innerWidth + 'px';
          conf.style.top = '-30px';
          conf.innerHTML = ['💗','🩷','💖','✨','🌸'][Math.floor(Math.random()*5)];
          document.body.appendChild(conf);
          
          const duration = 2200 + Math.random() * 1600;
          conf.animate([
            { 
              transform: `translateY(0) rotate(0deg)`, 
              opacity: 0.95 
            },
            { 
              transform: `translateY(${window.innerHeight + 120}px) rotate(${Math.random()*420 - 80}deg)`, 
              opacity: 0 
            }
          ], {
            duration: duration,
            easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'
          }).onfinish = () => conf.remove();
        }, i * 3);
      }
      
      setTimeout(() => {
        const congrats = document.createElement('div');
        congrats.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[80] bg-white/95 px-8 py-5 rounded-3xl shadow-xl text-center border border-pink-100`;
        congrats.innerHTML = `
          <div class="text-4xl mb-2">🎉</div>
          <div class="text-xl font-medium text-rose-700">能量满啦！</div>
          <div class="text-sm text-rose-500 mt-1">奖励你一个超级长抱抱</div>
          <div class="text-xs text-rose-400 mt-3">现在可以温柔地开始今天啦～</div>
        `;
        document.body.appendChild(congrats);
        
        setTimeout(() => {
          congrats.style.transition = 'all 0.4s ease';
          congrats.style.opacity = '0';
          setTimeout(() => congrats.remove(), 350);
        }, 2600);
      }, 800);
    }
    
    function enterRestMode() {
      stopSpawning();
      document.getElementById('rest-modal').classList.remove('hidden');
      document.getElementById('rest-modal').classList.add('flex');
    }
    
    function exitRestMode() {
      const modal = document.getElementById('rest-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      startSpawning();
      showSweetMessage("欢迎回来～继续收集能量吧");
    }
    
    function resetGame() {
      // 清空心心
      while (arena.firstChild) {
        arena.removeChild(arena.firstChild);
      }
      updateEnergy(0);
      stopSpawning();
      setTimeout(() => {
        startSpawning();
      }, 180);
      showSweetMessage("重新开始啦～慢慢点心心哦");
    }
    
    // 初始化
    function initGame() {
      initTailwind();
      updateEnergy(0);
      
      // 自动开始生成心心
      setTimeout(() => {
        startSpawning();
      }, 600);
      
      // 初始生成几个心心
      setTimeout(() => createHeart(), 900);
      setTimeout(() => createHeart(), 1400);
      
      // 键盘提示（可选）
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && document.activeElement.tagName === 'BODY') {
          e.preventDefault();
          giveBigHug();
        }
      });
      
      // 欢迎语
      setTimeout(() => {
        if (energy < 5) {
          showSweetMessage("轻轻点点心心…在这里陪着你");
        }
      }, 3200);
      
      // 防止页面滚动影响
      console.log('%c[哄哄游戏] 已加载，宝贝慢慢玩哦', 'color:#fda4af');
    }
    
    // 启动游戏
    window.onload = initGame;
  </script>
</body>
</html>
