<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mo_xiaobao_work_cat • Friday Survival System v1.2</title>
<meta name="description" content="周五低能耗。允许只发挥 70%。写一点就算赢。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        .soft-bg {
            background: linear-gradient(135deg, #fff0f5 0%, #f0e6ff 100%);
        }
        
        .cute-card {
            box-shadow: 0 25px 50px -12px rgb(249 168 212 / 0.25), 
                       0 10px 10px -6px rgb(249 168 212 / 0.15);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                       box-shadow 0.3s ease;
        }
        
        .cat-float {
            animation: cat-float 3s ease-in-out infinite;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes cat-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        
        .work-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .work-btn:active {
            transform: scale(0.95);
        }
        
        .energy-bar {
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .nav-tab {
            transition: all 0.3s ease;
        }
        
        .nav-tab.active {
            background: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            color: #831843;
        }
        
        .sparkle {
            animation: sparkle 1.5s ease-in-out infinite;
        }
        
        .tip-card {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>
<body class="soft-bg min-h-screen flex items-center justify-center p-4">
    <div class="max-w-[380px] w-full mx-auto">
        
        <!-- Top status bar -->
        <div class="flex justify-between items-center px-6 pt-3 pb-1 text-xs text-gray-500">
            <div class="flex items-center gap-x-1">
                <i class="fas fa-wifi"></i>
                <span>5G</span>
            </div>
            <div class="font-mono">13:06</div>
            <div class="flex items-center gap-x-1">
                <span>82</span>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
        
        <!-- Main Card -->
        <div class="cute-card bg-white rounded-3xl shadow-2xl overflow-hidden border border-pink-100">
            
            <!-- Header -->
            <div class="bg-gradient-to-r from-pink-50 to-purple-50 px-6 py-4 flex items-center justify-between border-b border-pink-100">
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-gradient-to-br from-pink-400 to-purple-400 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-cat text-white text-xl"></i>
                    </div>
                    <div>
                        <div class="font-bold text-gray-800 text-lg tracking-tight">mo_xiaobao_work_cat</div>
                        <div class="text-[10px] text-pink-500 -mt-1">Friday Survival System v1.2</div>
                    </div>
                </div>
                <div class="px-3 py-1 bg-emerald-100 text-emerald-600 text-xs font-medium rounded-full flex items-center gap-x-1">
                    <i class="fas fa-check-circle"></i>
                    <span>已就绪</span>
                </div>
            </div>
            
            <!-- Cat Avatar -->
            <div class="flex justify-center pt-8 pb-4">
                <div class="relative">
                    <div id="cat-avatar" class="text-[92px] cat-float drop-shadow-lg cursor-pointer">🐱</div>
                    <div class="absolute -top-2 -right-2 w-8 h-8 bg-yellow-300 rounded-full flex items-center justify-center">
                        <i class="fas fa-heart text-red-400 text-sm"></i>
                    </div>
                </div>
            </div>
            
            <!-- Mode Tabs -->
            <div class="px-6 pb-2">
                <div class="flex bg-pink-50 rounded-3xl p-1 text-sm">
                    <div onclick="switchMode('low')" id="tab-low"
                         class="nav-tab flex-1 text-center py-2.5 rounded-3xl font-medium cursor-pointer active bg-white shadow text-pink-600">
                        <i class="fas fa-battery-quarter mr-1.5"></i>
                        <span>低能耗模式</span>
                    </div>
                    <div onclick="switchMode('survive')" id="tab-survive"
                         class="nav-tab flex-1 text-center py-2.5 rounded-3xl font-medium cursor-pointer text-gray-600">
                        <i class="fas fa-heartbeat mr-1.5"></i>
                        <span>续命模式</span>
                    </div>
                </div>
            </div>
            
            <!-- Content Area -->
            <div id="content-area" class="px-6 pb-8 min-h-[280px]">
                
                <!-- Low Energy Mode -->
                <div id="low-content" class="section">
                    <div class="text-center mb-6">
                        <div class="inline-flex items-center gap-x-2 bg-pink-100 text-pink-600 px-4 py-1 rounded-2xl text-sm font-medium mb-4">
                            <i class="fas fa-clock"></i>
                            <span>周五低能耗模式 · 允许只发挥 70%</span>
                        </div>
                        
                        <h2 class="text-3xl font-bold text-gray-800 leading-tight mb-4">
                            mo小宝，<br>上班缓缓来就好
                        </h2>
                        
                        <div class="text-gray-600 text-[15px] leading-relaxed max-w-[260px] mx-auto">
                            困困也可以工作，但只做“最低必要量”就好。<br>
                            把任务拆小，一次只咬一小口，像小猫咪啃饼干一样。
                        </div>
                    </div>
                    
                    <button onclick="coaxMe()" 
                            class="work-btn w-full py-4 bg-gradient-to-r from-pink-400 via-rose-400 to-orange-400 text-white font-semibold text-lg rounded-3xl shadow-lg flex items-center justify-center gap-x-2 active:scale-[0.985]">
                        <span>再哄我一句</span>
                        <i class="fas fa-magic"></i>
                    </button>
                    
                    <div id="coax-message" class="hidden mt-4 p-4 bg-pink-50 border border-pink-200 rounded-2xl text-sm text-pink-700">
                        <div class="flex gap-x-2">
                            <i class="fas fa-comment-dots text-pink-400 mt-0.5"></i>
                            <div id="coax-text" class="flex-1"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Survival Mode -->
                <div id="survive-content" class="section hidden">
                    <div class="text-center mb-6">
                        <div class="text-4xl font-bold text-red-500 mb-1">宝，再撑一下</div>
                        
                        <div class="text-gray-600 text-[15px] leading-relaxed max-w-[260px] mx-auto mb-5">
                            你不是不想工作。<br>
                            你只是一个凌晨三点睡觉的人类。
                        </div>
                        
                        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm text-amber-700 mb-5">
                            <div class="flex items-start gap-x-3">
                                <i class="fas fa-lightbulb text-amber-500 mt-1"></i>
                                <div class="text-left">
                                    现在请温柔地打开亚马逊后台。<br>
                                    随便写一点。<br>
                                    <span class="font-medium">写一点就算赢。</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex justify-between text-xs text-gray-500 mb-1.5 px-1">
                            <div>当前能量</div>
                            <div id="energy-text">42%</div>
                        </div>
                        <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                            <div id="energy-bar" class="energy-bar h-full bg-gradient-to-r from-red-400 to-pink-500 rounded-full" style="width: 42%"></div>
                        </div>
                    </div>
                    
                    <button onclick="renewLife()" 
                            class="work-btn w-full py-4 bg-gradient-to-r from-red-400 to-pink-500 text-white font-semibold text-lg rounded-3xl shadow-lg flex items-center justify-center gap-x-2 active:scale-[0.985]">
                        <span>点我续命</span>
                        <i class="fas fa-heartbeat"></i>
                    </button>
                    
                    <div id="renew-status" class="hidden mt-3 text-center text-sm text-red-500 font-medium"></div>
                </div>
                
            </div>
            
            <!-- Daily Tip -->
            <div class="px-6 pb-4">
                <div class="tip-card bg-gradient-to-r from-purple-50 to-pink-50 border border-purple-200 rounded-2xl p-3 text-xs text-purple-700 flex items-start gap-x-2">
                    <i class="fas fa-lightbulb mt-0.5 text-purple-400"></i>
                    <div>
                        <span class="font-medium">今日小贴士：</span>
                        <span id="daily-tip">小猫咪今天也想被你摸摸头哦～</span>
                    </div>
                </div>
            </div>
            
            <!-- Bottom Hint -->
            <div class="px-6 pb-6 text-center">
                <div class="inline-flex items-center gap-x-1.5 text-xs text-gray-400">
                    <i class="fas fa-info-circle"></i>
                    <span>把这个页面缩小放角落，当你的上班护身符</span>
                </div>
            </div>
            
        </div>
        
        <div class="text-center mt-4 text-xs text-pink-400 flex items-center justify-center gap-x-1">
            <i class="fas fa-cat"></i>
            <span>mo小宝专属 · 由 Grok 特别加料 v1.2</span>
        </div>
        
    </div>
    
    <script>
        let currentMode = 'low';
        let energy = 42;
        let catClickCount = 0;
        
        const dailyTips = [
            "小猫咪今天也想被你摸摸头哦～",
            "写代码前先给猫咪（自己）倒杯水",
            "困了就允许自己眯5分钟，醒来继续战",
            "今天只做最重要的一件事就够了",
            "亚马逊后台不会自己长草，先打开再说",
            "你已经比昨天多活了一天，赢了",
            "小猫咪啃饼干也要慢慢来，你也一样",
            "周五允许只发挥70%，法律保护的！",
            "深呼吸，摸摸自己头，你很棒",
            "把任务拆成猫爪子大小，一爪一爪来"
        ];
        
        function setDailyTip() {
            const tipEl = document.getElementById('daily-tip');
            tipEl.textContent = dailyTips[Math.floor(Math.random() * dailyTips.length)];
        }
        
        function loadEnergy() {
            const saved = localStorage.getItem('mo_xiaobao_energy');
            if (saved !== null) {
                energy = parseInt(saved);
                updateEnergyBar();
            }
        }
        
        function saveEnergy() {
            localStorage.setItem('mo_xiaobao_energy', energy);
        }
        
        function updateEnergyBar() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            if (bar && text) {
                bar.style.width = energy + '%';
                text.textContent = energy + '%';
            }
        }
        
        function switchMode(mode) {
            const lowContent = document.getElementById('low-content');
            const surviveContent = document.getElementById('survive-content');
            const tabLow = document.getElementById('tab-low');
            const tabSurvive = document.getElementById('tab-survive');
            
            if (mode === 'low') {
                lowContent.classList.remove('hidden');
                surviveContent.classList.add('hidden');
                tabLow.classList.add('active', 'bg-white', 'shadow', 'text-pink-600');
                tabLow.classList.remove('text-gray-600');
                tabSurvive.classList.remove('active', 'bg-white', 'shadow', 'text-pink-600');
                tabSurvive.classList.add('text-gray-600');
                currentMode = 'low';
            } else {
                lowContent.classList.add('hidden');
                surviveContent.classList.remove('hidden');
                tabSurvive.classList.add('active', 'bg-white', 'shadow', 'text-pink-600');
                tabSurvive.classList.remove('text-gray-600');
                tabLow.classList.remove('active', 'bg-white', 'shadow', 'text-pink-600');
                tabLow.classList.add('text-gray-600');
                currentMode = 'survive';
            }
        }
        
        const coaxMessages = [
            "宝，你今天已经很努力了哦～ 摸摸头，先喝口水休息一下",
            "小猫咪也要慢慢来呀，今天只做最重要的一件事就好",
            "困困没关系，mo小宝的脑子在睡觉，身体可以先动动小手",
            "你不是懒，你只是需要被哄着工作～ 来，抱抱先",
            "周五了，允许自己只发挥70%是合法的！法律保护的！",
            "宝宝，任务可以拆成小猫爪子大小，一爪一爪慢慢抓",
            "写一点点就赢了，真的！连小猫写字都只写一个字呢",
            "今天不想动也没关系，先把电脑打开就功德无量了",
            "mo小宝最可爱了，困的时候也要被好好宠着",
            "深呼吸～ 现在你已经比昨天多活了一天，赢麻了！",
            "别急别急，亚马逊后台又不会跑掉，先亲亲自己",
            "小猫咪啃饼干也是要花时间的，你也是饼干级别的宝"
        ];
        
        function coaxMe() {
            const messageBox = document.getElementById('coax-message');
            const textEl = document.getElementById('coax-text');
            
            textEl.innerHTML = coaxMessages[Math.floor(Math.random() * coaxMessages.length)];
            messageBox.classList.remove('hidden');
            
            energy = Math.min(100, energy + 5);
            updateEnergyBar();
            saveEnergy();
            
            const cat = document.getElementById('cat-avatar');
            if (cat) {
                cat.style.transform = 'scale(1.18) rotate(8deg)';
                setTimeout(() => { cat.style.transform = 'translateY(0) scale(1)'; }, 550);
            }
            
            createMiniConfetti();
        }
        
        function renewLife() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            const status = document.getElementById('renew-status');
            
            const gain = Math.floor(Math.random() * 18) + 12;
            energy = Math.min(100, energy + gain);
            
            bar.style.width = energy + '%';
            text.textContent = energy + '%';
            saveEnergy();
            
            status.innerHTML = `✨ 续命成功！+${gain}% 能量<br>小猫咪为你鼓掌 👏`;
            status.classList.remove('hidden');
            status.style.color = '#e11d48';
            
            const cat = document.getElementById('cat-avatar');
            if (cat) {
                cat.style.transform = 'scale(1.35) rotate(-12deg)';
                setTimeout(() => { cat.style.transform = 'scale(1) rotate(0deg)'; }, 420);
            }
            
            if (energy >= 95) {
                setTimeout(() => {
                    status.innerHTML = `🎉 满能量啦！今天摸鱼合法化！`;
                    status.style.color = '#16a34a';
                    createBigConfetti();
                }, 750);
            }
            
            setTimeout(() => {
                if (status) {
                    status.style.transition = 'opacity 0.4s';
                    status.style.opacity = '0';
                    setTimeout(() => {
                        if (status) {
                            status.style.opacity = '1';
                            status.style.transition = '';
                            status.classList.add('hidden');
                        }
                    }, 380);
                }
            }, 2600);
        }
        
        function createMiniConfetti() {
            const colors = ['#ff9eb5', '#f472b6', '#c084fc', '#fb7185'];
            const container = document.getElementById('content-area');
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `position:absolute;width:6px;height:6px;border-radius:50%;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;top:30%;z-index:10;pointer-events:none;`;
                container.appendChild(particle);
                const distance = Math.random() * 80 + 60;
                particle.animate([
                    { transform: 'translateY(0) scale(1)', opacity: 1 },
                    { transform: `translateY(${distance}px) translateX(${Math.random()*40-20}px) scale(0.2)`, opacity: 0 }
                ], { duration: 900 + Math.random()*400, easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)' }).onfinish = () => particle.remove();
            }
        }
        
        function createBigConfetti() {
            const colors = ['#ff9eb5', '#f472b6', '#c084fc', '#fb7185', '#a78bfa'];
            for (let i = 0; i < 32; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `position:fixed;width:${Math.random()*8+6}px;height:${particle.style.width};border-radius:${Math.random()>0.5?'50%':'3px'};background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*window.innerWidth}px;top:-20px;z-index:9999;pointer-events:none;opacity:${Math.random()+0.6};`;
                document.body.appendChild(particle);
                const fallDuration = Math.random() * 1800 + 1400;
                const xDrift = Math.random() * 120 - 60;
                particle.animate([
                    { transform: `translateY(0) rotate(0deg)`, opacity: particle.style.opacity },
                    { transform: `translateY(${window.innerHeight + 100}px) translateX(${xDrift}px) rotate(${Math.random()*360+180}deg)`, opacity: 0 }
                ], { duration: fallDuration, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }).onfinish = () => particle.remove();
            }
        }
        
        function setupCatEasterEgg() {
            const cat = document.getElementById('cat-avatar');
            if (!cat) return;
            cat.addEventListener('click', () => {
                catClickCount++;
                const scale = 1 + (catClickCount * 0.07);
                const rotate = catClickCount * 9;
                cat.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
                
                if (catClickCount >= 5) {
                    catClickCount = 0;
                    createBigConfetti();
                    const msg = document.createElement('div');
                    msg.style.cssText = 'position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:white;padding:3px 11px;border-radius:9999px;font-size:10px;box-shadow:0 4px 6px rgb(0 0 0 / 0.1);white-space:nowrap;z-index:20;';
                    msg.innerHTML = '🐱 猫咪超级开心！能量+25%';
                    cat.parentNode.appendChild(msg);
                    energy = Math.min(100, energy + 25);
                    updateEnergyBar();
                    saveEnergy();
                    setTimeout(() => {
                        msg.style.transition = 'all 0.4s';
                        msg.style.opacity = '0';
                        msg.style.transform = 'translateX(-50%) translateY(-12px)';
                        setTimeout(() => msg.remove(), 380);
                    }, 1100);
                }
                setTimeout(() => {
                    cat.style.transition = 'transform 0.6s cubic-bezier(0.34,1.56,0.64,1)';
                    cat.style.transform = 'translateY(0)';
                }, 180);
            });
            cat.style.cursor = 'pointer';
        }
        
        function setupKeyboard() {
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    if (currentMode === 'low') coaxMe();
                    else renewLife();
                }
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'c') {
                    e.preventDefault();
                    const cat = document.getElementById('cat-avatar');
                    if (cat) {
                        cat.style.transition = 'transform 0.2s';
                        cat.style.transform = 'scale(1.45) rotate(22deg)';
                        setTimeout(() => { cat.style.transform = 'scale(1) rotate(0)'; }, 280);
                    }
                }
            });
        }
        
        function init() {
            loadEnergy();
            setDailyTip();
            
            document.getElementById('low-content').classList.remove('hidden');
            document.getElementById('survive-content').classList.add('hidden');
            updateEnergyBar();
            
            setupCatEasterEgg();
            setupKeyboard();
            
            setTimeout(() => {
                const cat = document.getElementById('cat-avatar');
                if (cat && Math.random() > 0.5) {
                    cat.style.transition = 'transform 0.9s';
                    cat.style.transform = 'scale(1.06)';
                    setTimeout(() => { if (cat) cat.style.transform = 'translateY(0)'; }, 650);
                }
            }, 2200);
            
            setInterval(() => { if (energy > 0) saveEnergy(); }, 30000);
        }
        
        window.onload = init;
    </script>
</body>
</html>
