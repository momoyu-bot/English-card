<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>早安小雨</title>
<meta name="description" content="愿今天像彩虹一样美好。">
  <style>
    body { margin:0; overflow:hidden; background:#0a1429; }
    canvas { display:block; }
    .text {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      color:#fff; font-size:48px; text-shadow:0 0 20px #7cf; text-align:center;
    }
  </style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="text">
    早上好宝贝🌈<br>
    <span style="font-size:28px">愿今天像彩虹一样美好</span>
  </div>
  <script>
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let drops = [];
    for(let i=0; i<150; i++) {
      drops.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        l: Math.random()*1+1,
        spd: Math.random()*4+3
      });
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = '#a0d8ff';
      ctx.lineWidth = 1.5;
      drops.forEach(d => {
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y + d.l * 8);
        ctx.stroke();
        d.y += d.spd;
        if(d.y > canvas.height) d.y = -10;
      });
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
