<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小粉脸蛋儿</title>
  <meta name="description" content="点一下换一个，短发长发都在。" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #f6f1ef;
      color: #2b2b2b;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 36px;
    }
    .stage { width: min(360px, 92vw); }
    .card {
      background: #fff;
      border-radius: 32px;
      box-shadow: 0 16px 40px rgba(40, 30, 20, 0.07);
      overflow: hidden;
    }
    .card svg { display: block; width: 100%; height: auto; }
    .meta {
      text-align: center;
      padding: 4px 16px 18px;
    }
    .meta .name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .meta .idx {
      margin-top: 4px;
      font-size: 12px;
      color: #8a8480;
    }
    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .draw {
      flex: 1;
      height: 48px;
      border-radius: 999px;
      background: #ffb6c8;
      color: #5a2438;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .draw:active { transform: scale(0.98); }
    .blink-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      color: #c45e86;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(40, 30, 20, 0.06);
    }
    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .eye { transform-box: fill-box; transform-origin: center; }
    .blink .eye { animation: blink 0.26s ease-in-out; }
    @keyframes blink {
      0%, 100% { transform: scaleY(1); }
      45%, 55% { transform: scaleY(0.08); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>小粉脸蛋儿</h1>
    <div class="card" id="card">
      <div id="art"></div>
      <div class="meta">
        <div class="name" id="name"></div>
        <div class="idx" id="idx"></div>
      </div>
    </div>
    <div class="actions">
      <button class="draw" id="draw" type="button">再抽一个</button>
      <button class="blink-btn" id="wink" type="button" aria-label="眨眼">眨</button>
    </div>
  </div>

  <script>
    const HAIR = "#ffb6c8";
    const HAIR2 = "#f59ab3";
    const FACE = "#fff4ee";
    const BLUSH = "#ffc5d2";
    const EYE = "#2a2a2a";
    const SHIRT = "#c45e86";
    const SNACK = "#f0c24a";
    const SNACK2 = "#e3942a";

    function eyes(lx, rx, y) {
      return `
        <rect class="eye" x="${lx}" y="${y}" width="22" height="38" rx="11" fill="${EYE}"/>
        <rect class="eye" x="${rx}" y="${y}" width="22" height="38" rx="11" fill="${EYE}"/>
        <ellipse class="eye" cx="${lx + 7}" cy="${y + 10}" rx="4.2" ry="5.6" fill="#fff"/>
        <ellipse class="eye" cx="${rx + 7}" cy="${y + 10}" rx="4.2" ry="5.6" fill="#fff"/>`;
    }
    function blush(lx, rx, y) {
      return `
        <ellipse cx="${lx}" cy="${y}" rx="17" ry="10" fill="${BLUSH}"/>
        <ellipse cx="${rx}" cy="${y}" rx="17" ry="10" fill="${BLUSH}"/>`;
    }
    function snack() {
      return `
        <path d="M112 208 C108 200 122 192 138 194 C150 186 170 186 182 194 C198 192 214 202 208 214 C214 230 196 246 160 248 C124 246 106 228 112 208 Z" fill="${SNACK}"/>
        <path d="M124 214 C128 204 150 200 160 204 C176 200 196 208 198 218 C192 232 176 238 160 238 C140 238 122 226 124 214 Z" fill="${SNACK2}" opacity=".35"/>
        <ellipse cx="126" cy="248" rx="16" ry="13" fill="${FACE}"/>
        <rect x="120" y="240" width="3.2" height="12" rx="1.5" fill="#e6c2ae"/>
        <rect x="126" y="240" width="3.2" height="12" rx="1.5" fill="#e6c2ae"/>
        <ellipse cx="194" cy="248" rx="16" ry="13" fill="${FACE}"/>
        <rect x="188" y="240" width="3.2" height="12" rx="1.5" fill="#e6c2ae"/>
        <rect x="194" y="240" width="3.2" height="12" rx="1.5" fill="#e6c2ae"/>`;
    }
    function shirt() {
      return `<path d="M118 250 C130 234 190 234 202 250 L214 320 H106 Z" fill="${SHIRT}"/>`;
    }

    const faces = [
      {
        name: "短发",
        svg: `
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <rect width="320" height="320" fill="#fff"/>
            <path d="M46 158 C34 86 96 18 160 16 C228 14 290 80 276 158 C286 210 248 250 210 258 L202 270 C176 280 144 280 118 270 L110 258 C72 250 38 210 46 158 Z" fill="${HAIR}"/>
            <path d="M170 16 C200 2 230 22 232 56 C218 22 190 14 170 18 Z" fill="${HAIR}"/>
            ${shirt()}
            <circle cx="160" cy="156" r="84" fill="${FACE}"/>
            <path d="M78 130 C88 62 124 46 160 46 C198 46 234 64 242 130 C218 104 196 98 174 104 C160 92 160 92 146 104 C124 98 100 104 78 130 Z" fill="${HAIR}"/>
            ${blush(100, 220, 176)}
            ${eyes(114, 184, 128)}
            ${snack()}
          </svg>`
      },
      {
        name: "长发",
        svg: `
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <rect width="320" height="320" fill="#fff"/>
            <path d="M48 132 C42 52 108 8 160 8 C216 8 280 52 272 132 L292 320 H216 L208 244 160 252 112 244 104 320 H28 Z" fill="${HAIR}"/>
            <path d="M28 320 C18 230 36 160 70 128 C48 190 36 250 44 320 Z" fill="${HAIR2}"/>
            <path d="M292 320 C302 230 284 160 250 128 C272 190 284 250 276 320 Z" fill="${HAIR2}"/>
            ${shirt()}
            <circle cx="160" cy="158" r="86" fill="${FACE}"/>
            <path d="M96 108 C108 58 132 44 160 44 C188 44 214 58 224 108 C200 96 180 94 160 94 C140 94 120 96 96 108 Z" fill="${HAIR}"/>
            ${blush(98, 222, 178)}
            ${eyes(114, 184, 128)}
            ${snack()}
          </svg>`
      },
      {
        name: "双马尾",
        svg: `
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <rect width="320" height="320" fill="#fff"/>
            <path d="M64 168 C36 214 44 286 86 318 C58 268 52 214 78 168 Z" fill="${HAIR}"/>
            <path d="M256 168 C284 214 276 286 234 318 C262 268 268 214 242 168 Z" fill="${HAIR}"/>
            <path d="M52 150 C44 78 104 18 160 16 C220 18 278 78 268 150 C274 198 240 236 200 244 L192 256 C172 266 148 266 128 256 L120 244 C80 236 46 198 52 150 Z" fill="${HAIR}"/>
            <circle cx="72" cy="170" r="11" fill="${HAIR2}"/>
            <circle cx="248" cy="170" r="11" fill="${HAIR2}"/>
            ${shirt()}
            <circle cx="160" cy="156" r="82" fill="${FACE}"/>
            <path d="M80 124 C90 56 126 42 160 42 C196 42 232 58 240 124 C214 110 186 114 160 114 C134 114 106 110 80 124 Z" fill="${HAIR}"/>
            ${blush(102, 218, 176)}
            ${eyes(114, 184, 128)}
            ${snack()}
          </svg>`
      },
      {
        name: "姬发",
        svg: `
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <rect width="320" height="320" fill="#fff"/>
            <path d="M54 128 C48 48 110 8 160 8 C214 8 274 48 266 128 L282 320 H214 L206 246 160 254 114 246 106 320 H38 Z" fill="${HAIR}"/>
            ${shirt()}
            <circle cx="160" cy="158" r="86" fill="${FACE}"/>
            <path d="M74 112 C86 46 128 34 160 34 C194 34 236 46 246 112 Z" fill="${HAIR}"/>
            ${blush(98, 222, 178)}
            ${eyes(114, 184, 128)}
            ${snack()}
          </svg>`
      },
      {
        name: "一撮翘",
        svg: `
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <rect width="320" height="320" fill="#fff"/>
            <path d="M58 168 C50 96 100 28 160 24 C224 20 274 90 264 168 C270 214 236 246 200 250 L194 262 C172 272 148 272 126 262 L120 250 C84 246 52 214 58 168 Z" fill="${HAIR}"/>
            <path d="M176 18 C214 -4 248 28 246 70 C232 28 196 16 176 22 Z" fill="${HAIR}"/>
            ${shirt()}
            <circle cx="160" cy="160" r="80" fill="${FACE}"/>
            <path d="M84 134 C94 72 128 54 160 54 C196 54 228 74 236 134 C210 108 186 102 160 104 C134 102 108 108 84 134 Z" fill="${HAIR}"/>
            ${blush(102, 218, 180)}
            ${eyes(114, 184, 132)}
            ${snack()}
          </svg>`
      }
    ];

    let i = 0;
    const art = document.getElementById("art");
    const card = document.getElementById("card");
    const nameEl = document.getElementById("name");
    const idxEl = document.getElementById("idx");

    function render(n) {
      i = (n + faces.length) % faces.length;
      art.innerHTML = faces[i].svg;
      nameEl.textContent = faces[i].name;
      idxEl.textContent = (i + 1) + " / " + faces.length;
    }
    function wink() {
      card.classList.remove("blink");
      void card.offsetWidth;
      card.classList.add("blink");
    }
    document.getElementById("draw").addEventListener("click", () => {
      render(i + 1);
      wink();
    });
    document.getElementById("wink").addEventListener("click", wink);
    art.addEventListener("click", wink);
    render(0);
  </script>
</body>
</html>
