<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>网上的结</title>
  <meta name="description" content="碰网上的结，去那场。中间的孔随便走。" />
  <style>
    :root {
      --bg: #14131a;
      --ink: #ece6d6;
      --mute: #8d8896;
      --wood: #9a7d55;
      --wood-dark: #6e5538;
      --thread: #d5cbb6;
      --thread-dim: #8a8172;
      --warm: #f0ddb0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(28px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom));
    }
    header { width: min(420px, 100%); }
    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.42em;
      margin-left: 0.2em;
    }
    .lead {
      margin-top: 14px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      font-size: 14px;
      line-height: 1.75;
      color: var(--mute);
      max-width: 22em;
    }
    .stage {
      width: min(420px, 100%);
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg { width: 100%; height: auto; touch-action: manipulation; }
    .hoop-outer { fill: none; stroke: var(--wood); stroke-width: 7; }
    .hoop-inner { fill: none; stroke: var(--wood-dark); stroke-width: 1.2; opacity: .55; }
    .web { fill: none; stroke: var(--thread); stroke-width: 1.05; stroke-linejoin: round; stroke-linecap: round; }
    .web.dim { stroke: var(--thread-dim); }
    .knot {
      fill: var(--thread);
      opacity: 0;
      pointer-events: none;
    }
    .knot.on { opacity: 1; }
    .hit { fill: transparent; cursor: pointer; }
    .hit:focus { outline: none; }
    .hole-ring { fill: none; stroke: var(--thread); stroke-width: 1.1; opacity: .7; }
    .hole-hit { fill: transparent; cursor: pointer; }
    .feather { fill: none; stroke: var(--thread); stroke-width: .9; opacity: .85; }
    footer {
      width: min(420px, 100%);
      min-height: 3.2em;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      font-size: 13px;
      line-height: 1.7;
      color: var(--mute);
    }
    footer b {
      font-weight: 500;
      color: var(--warm);
    }
  </style>
</head>
<body>
  <header>
    <h1>网上的结</h1>
    <p class="lead">四十二场梦，167页。都是一条一条认出来的，没有一条是猜的。</p>
  </header>
  <div class="stage">
    <svg id="net" viewBox="0 0 400 520" role="img" aria-label="捕梦网">
      <g id="draw"></g>
    </svg>
  </div>
  <footer id="say">碰网上的结，去那场梦。中间的孔，随便带你走。</footer>
  <script>
    const svg = document.getElementById("draw");
    const say = document.getElementById("say");
    const NS = "http://www.w3.org/2000/svg";
    const cx = 200, cy = 228, R = 148;
    const N = 7, RINGS = 6;
    const HOLE = 26;

    function el(name, attrs) {
      const n = document.createElementNS(NS, name);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    function pt(ring, i, jitter) {
      const t = (i + ring * 0.5) / N * Math.PI * 2 - Math.PI / 2;
      const span = R - HOLE;
      const rad = R - span * (ring / (RINGS - 0.15));
      const j = jitter ? (Math.sin(i * 3.1 + ring * 1.7) * 1.2) : 0;
      return [cx + Math.cos(t) * (rad + j), cy + Math.sin(t) * (rad + j)];
    }

    const hoop = el("circle", { cx, cy, r: R, class: "hoop-outer" });
    const hoop2 = el("circle", { cx, cy, r: R - 4.2, class: "hoop-inner" });
    svg.appendChild(hoop);
    svg.appendChild(hoop2);

    const web = el("path", { class: "web" });
    let d = "";
    for (let r = 0; r < RINGS - 1; r++) {
      for (let i = 0; i < N; i++) {
        const a = pt(r, i, true);
        const b = pt(r, i + 1, true);
        const m = pt(r + 1, i, true);
        d += "M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + " L" + m[0].toFixed(1) + " " + m[1].toFixed(1) + " L" + b[0].toFixed(1) + " " + b[1].toFixed(1) + " ";
      }
    }
    web.setAttribute("d", d);
    svg.appendChild(web);

    svg.appendChild(el("circle", { cx, cy, r: HOLE, class: "hole-ring" }));

    const knots = [];
    for (let r = 0; r < RINGS; r++) {
      for (let i = 0; i < N; i++) {
        const p = pt(r, i, true);
        knots.push({ x: p[0], y: p[1], n: r * N + i + 1, r: r });
      }
    }

    knots.forEach(function (k) {
      const mark = el("circle", { cx: k.x, cy: k.y, r: 1.7, class: "knot" });
      svg.appendChild(mark);
      const hit = el("circle", { cx: k.x, cy: k.y, r: 16, class: "hit" });
      hit.setAttribute("tabindex", "0");
      hit.setAttribute("role", "button");
      hit.setAttribute("aria-label", "第" + k.n + "场");
      hit.addEventListener("click", function () { pick(k.n, mark); });
      hit.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") pick(k.n, mark); });
      svg.appendChild(hit);
    });

    const holeHit = el("circle", { cx: cx, cy: cy, r: HOLE + 10, class: "hole-hit" });
    holeHit.setAttribute("tabindex", "0");
    holeHit.setAttribute("role", "button");
    holeHit.setAttribute("aria-label", "中间的孔");
    holeHit.addEventListener("click", through);
    holeHit.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") through(); });
    svg.appendChild(holeHit);

    function feather(x1, y1, lean, len) {
      const g = el("g", { class: "feather" });
      const x2 = x1 + lean, y2 = y1 + len;
      g.appendChild(el("line", { x1: x1, y1: y1, x2: x2, y2: y2 }));
      for (let i = 1; i <= 7; i++) {
        const t = i / 8;
        const px = x1 + (x2 - x1) * t;
        const py = y1 + (y2 - y1) * t;
        const w = 7 + i * 0.9;
        const side = (i % 2 ? 1 : -1);
        g.appendChild(el("line", {
          x1: px, y1: py,
          x2: px + w * side + lean * 0.15,
          y2: py + 3.5
        }));
      }
      return g;
    }
    const baseY = cy + R;
    svg.appendChild(feather(cx - 28, baseY + 2, -7, 62));
    svg.appendChild(feather(cx, baseY + 4, 1.5, 84));
    svg.appendChild(feather(cx + 30, baseY + 3, 9, 58));

    let lit = null;
    function pick(n, mark) {
      if (lit) lit.classList.remove("on");
      mark.classList.add("on");
      lit = mark;
      say.innerHTML = "第 <b>" + n + "</b> 场。还在网上，一条一条认出来的。";
    }
    function through() {
      if (lit) lit.classList.remove("on");
      lit = null;
      const n = 1 + Math.floor(Math.random() * 42);
      say.innerHTML = "从孔里漏下去，到了第 <b>" + n + "</b> 场。不是拣的。";
    }
  </script>
</body>
</html>
