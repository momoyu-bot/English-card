<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>周计划抱抱屋 🫂</title>
<meta name="description" content="这里不会盘问你，只会轻轻抱住你的计划。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .task-card { transition: all 0.2s cubic-bezier(0.23,1,0.32,1); }
  .task-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(251 113 133 / 0.1); }
  .heart-float { animation: floatHeart 1.4s ease-out forwards; }
  @keyframes floatHeart { to { transform: translateY(-120px); opacity: 0; } }
</style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-50 to-sky-100 min-h-screen py-8 px-4">
  <div id="card" class="max-w-2xl mx-auto bg-white/95 backdrop-blur rounded-3xl shadow-2xl border border-pink-200 p-8 relative overflow-hidden">
    
    <!-- 标题 -->
    <div class="flex items-center justify-center gap-3 mb-2">
      <span class="text-4xl">🫂</span>
      <h1 class="text-3xl font-bold tracking-tight text-rose-500">周计划抱抱屋</h1>
    </div>
    <p class="text-center text-rose-400 text-sm mb-6">这里不会盘问你，只会轻轻抱住你的计划</p>

    <!-- 安心度 -->
    <div class="mb-6">
      <div class="flex justify-between items-baseline mb-1 px-1">
        <div class="text-sm text-rose-400">当前安心度</div>
        <div id="comfort-text" class="text-xl font-semibold text-rose-500">38%</div>
      </div>
      <div class="h-3 bg-pink-100 rounded-full overflow-hidden">
        <div id="comfort-bar" class="h-3 rounded-full transition-all duration-700" 
             style="width:38%; background: linear-gradient(to right, #fb7185, #f472b6);"></div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="mb-5">
      <div class="text-sm font-medium text-rose-400 mb-2 flex items-center gap-2">
        <span>📝</span> 
        <span>把这周的计划写在这里（一行一个任务最好）</span>
      </div>
      <textarea id="plan-input" rows="6" 
                class="w-full p-5 text-sm border border-pink-200 focus:border-pink-400 rounded-2xl bg-white resize-y placeholder:text-gray-400"
                placeholder="周一：完成需求评审&#10;周二：写周报 + 跟进A项目&#10;周三：开会2场...&#10;（直接粘贴你写的也行）"></textarea>
    </div>

    <!-- 两个主按钮 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
      <button onclick="meltAnxiety()" 
              class="cute-btn flex items-center justify-center gap-2 py-4 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-2xl font-medium shadow-md active:scale-[0.985]">
        <span class="text-xl">🫧</span>
        <span>融化被盘问的焦虑</span>
      </button>
      
      <button onclick="generateStarPlan()" 
              class="cute-btn flex items-center justify-center gap-2 py-4 bg-white border border-pink-300 hover:border-pink-400 text-rose-500 rounded-2xl font-medium active:scale-[0.985]">
        <span class="text-xl">🌟</span>
        <span>生成小星星版计划</span>
      </button>
    </div>

    <!-- 生成的星星计划区 -->
    <div id="star-plan-area" class="hidden mb-6">
      <div class="text-sm font-medium text-rose-400 mb-3 px-1 flex items-center gap-2">
        <span>✨</span> <span>你的计划已经变成不会咬人的小星星啦</span>
      </div>
      <div id="star-plan-list" class="grid grid-cols-1 gap-2"></div>
    </div>

    <!-- 消息区 -->
    <div id="message" class="min-h-[42px] text-center text-sm font-medium text-emerald-500 mb-4 transition-opacity"></div>

    <!-- 底部温柔区 -->
    <div class="text-center pt-4 border-t border-pink-100">
      <div onclick="giveBigHug()" 
           class="inline-flex items-center gap-2 px-6 py-2 bg-white border border-pink-200 hover:bg-pink-50 rounded-2xl text-sm text-rose-400 cursor-pointer active:scale-95">
        <span>今天已经很努力了</span>
        <span class="text-lg">💕</span>
      </div>
      <div class="text-[10px] text-rose-300 mt-3 tracking-widest">写不完也没关系 • 被问到也可以温柔地保护自己</div>
    </div>
  </div>

<script>
let comfort = 38;

function updateComfort(newVal) {
  comfort = Math.max(0, Math.min(100, newVal));
  const bar = document.getElementById('comfort-bar');
  const txt = document.getElementById('comfort-text');
  bar.style.width = comfort + '%';
  txt.textContent = comfort + '%';
  
  if (comfort > 85) {
    bar.style.background = 'linear-gradient(to right, #34d399, #60a5fa)';
    txt.style.color = '#10b981';
  } else if (comfort > 60) {
    bar.style.background = 'linear-gradient(to right, #fbbf24, #fb7185)';
    txt.style.color = '#f59e0b';
  } else {
    bar.style.background = 'linear-gradient(to right, #fb7185, #f472b6)';
    txt.style.color = '#f472b6';
  }
}

function showMessage(msg, duration = 2800) {
  const m = document.getElementById('message');
  m.style.transition = 'none';
  m.style.opacity = '1';
  m.innerHTML = msg;
  setTimeout(() => {
    m.style.transition = 'opacity 1s ease';
    m.style.opacity = '0';
  }, duration);
}

function createHearts(num = 6) {
  const container = document.getElementById('card');
  for (let i = 0; i < num; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.textContent = ['💕','🫧','🌸','✨'][Math.floor(Math.random()*4)];
      h.style.cssText = `position:absolute;left:${Math.random()*75+12}%;bottom:25%;font-size:1.1rem;z-index:30;pointer-events:none;`;
      container.appendChild(h);
      setTimeout(() => {
        h.style.transition = 'all 1.3s cubic-bezier(0.23,1,0.32,1)';
        h.style.transform = `translateY(-${140 + Math.random()*70}px)`;
        h.style.opacity = '0';
      }, 30);
      setTimeout(() => h.remove(), 1500);
    }, i * 45);
  }
}

function meltAnxiety() {
  const input = document.getElementById('plan-input').value.trim();
  let msg = '';
  
  if (!input) {
    msg = '没关系～ 就算什么都不写，我也会抱住你';
  } else if (input.length < 30) {
    msg = '被盘问的时候你可以温柔地说：“我把精力优先放在了最关键的几件事上”';
  } else {
    const replies = [
      '你可以回答：“这个任务我评估后发现需要更多时间，目前进度是XX，我正在调整”',
      '被问到的时候记得：计划是给你自己看的，不是给别人审核的工具',
      '做不完很正常。你可以直接说：“我已经尽力了，如果要调整优先级我可以重新排”',
      '下次被问的时候试试先深呼吸，再说“让我先整理一下思路”——给你自己争取缓冲'
    ];
    msg = replies[Math.floor(Math.random()*replies.length)];
  }
  
  updateComfort(comfort + 18);
  showMessage(msg);
  createHearts(5);
}

function generateStarPlan() {
  const input = document.getElementById('plan-input').value.trim();
  const area = document.getElementById('star-plan-area');
  const list = document.getElementById('star-plan-list');
  list.innerHTML = '';
  
  if (!input) {
    showMessage('先写一点计划吧～ 哪怕只有一行');
    return;
  }
  
  const lines = input.split('\n').filter(l => l.trim());
  if (lines.length === 0) return;
  
  area.classList.remove('hidden');
  
  lines.forEach((line, index) => {
    const card = document.createElement('div');
    card.className = `task-card flex items-start gap-3 bg-white border border-pink-200 rounded-2xl p-4 cursor-pointer`;
    card.innerHTML = `
      <div class="pt-0.5">
        <div class="w-5 h-5 rounded-full border-2 border-pink-300 flex items-center justify-center text-pink-400 text-xs" id="check-${index}">☆</div>
      </div>
      <div class="flex-1 text-sm leading-snug text-gray-600">${line}</div>
    `;
    
    card.onclick = () => {
      const check = document.getElementById(`check-${index}`);
      if (check.textContent === '☆') {
        check.textContent = '★';
        check.className = 'w-5 h-5 rounded-full bg-pink-400 text-white flex items-center justify-center text-xs font-bold';
        updateComfort(comfort + 7);
        showMessage('完成一颗小星星！奖励你一个深呼吸～');
        createHearts(2);
      } else {
        check.textContent = '☆';
        check.className = 'w-5 h-5 rounded-full border-2 border-pink-300 flex items-center justify-center text-pink-400 text-xs';
        updateComfort(comfort - 4);
      }
    };
    
    list.appendChild(card);
  });
  
  updateComfort(comfort + 12);
  showMessage('你的计划已经变成会发光的小星星了 ✨');
  createHearts(4);
}

function giveBigHug() {
  updateComfort(comfort + 22);
  showMessage('今天已经很努力了。计划写不完也没关系，你值得被温柔对待 💕');
  createHearts(8);
}

// 初始化
function init() {
  updateComfort(38);
  // 随机小提示
  setTimeout(() => {
    const m = document.getElementById('message');
    m.style.opacity = '0.5';
    m.innerHTML = '写完计划后可以点“生成小星星版”，它会把一切变得可爱一点';
    setTimeout(() => m.style.opacity = '0', 3200);
  }, 2200);
}

init();
</script>
</body>
</html>
