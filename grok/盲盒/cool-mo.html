<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>救救mo.exe</title>
<meta name="description" content="正在被萃取成人干拿铁。风扇冰块冷风，把水分补回来。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;family=Comic+Neue:wght@700&amp;display=swap');
  
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
  }
  
  .mo-character {
    transition: transform 0.2s ease;
    font-size: 120px;
    line-height: 1;
  }
  
  .mo-character.hot {
    animation: sweat 1.5s infinite;
  }
  
  @keyframes sweat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }
  
  .progress-bar {
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .game-btn {
    transition: all 0.1s ease;
  }
  
  .game-btn:active {
    transform: scale(0.92);
  }
  
  .log {
    font-size: 13px;
    max-height: 110px;
    overflow-y: auto;
  }
  
  .temp-number {
    font-family: 'Comic Neue', cursive;
    font-weight: 700;
  }
</style>
</head>
<body class="bg-gradient-to-br from-orange-100 via-amber-50 to-sky-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-orange-200">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-orange-400 to-amber-400 px-6 py-4 text-white">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">救救mo.exe！</h1>
          <p class="text-orange-100 text-sm">大自然正在偷偷萃取你……</p>
        </div>
        <div class="text-right">
          <div class="text-xs opacity-75">当前模式</div>
          <div class="font-bold">人干ing</div>
        </div>
      </div>
    </div>

    <!-- Character -->
    <div class="flex flex-col items-center pt-6 pb-2 bg-white">
      <div id="mo" class="mo-character hot select-none">☕💦</div>
      <div class="text-center -mt-2">
        <div class="text-sm text-orange-500 font-medium">mo.exe</div>
        <div id="status-text" class="text-xs text-orange-400">正在被大自然做成人干拿铁...</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="px-6 pb-4">
      <!-- Temperature -->
      <div class="flex items-baseline justify-between mb-1 px-1">
        <div class="text-sm text-orange-600 font-medium">体感温度</div>
        <div class="flex items-baseline">
          <span id="temp" class="temp-number text-5xl font-bold text-orange-500">36</span>
          <span class="text-2xl text-orange-400 ml-1">°C</span>
        </div>
      </div>
      
      <!-- Moisture Bar -->
      <div class="mb-4">
        <div class="flex justify-between text-xs px-1 mb-1">
          <div class="text-sky-600 font-medium">水分保留率</div>
          <div id="moisture-text" class="font-mono text-sky-600">35%</div>
        </div>
        <div class="h-3 bg-orange-100 rounded-full overflow-hidden">
          <div id="moisture-bar" 
               class="progress-bar h-3 bg-gradient-to-r from-sky-400 to-cyan-400 rounded-full"
               style="width: 35%"></div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-3 gap-3">
        <!-- Button 1 -->
        <button onclick="useFan()" 
                class="game-btn flex flex-col items-center justify-center bg-white border border-orange-200 hover:border-orange-300 active:bg-orange-50 rounded-2xl py-3 px-2 shadow-sm">
          <div class="text-3xl mb-1">💨</div>
          <div class="text-xs font-medium text-orange-600">虚拟小风扇</div>
          <div class="text-[10px] text-orange-400">+10% 水分</div>
        </button>
        
        <!-- Button 2 -->
        <button onclick="throwIce()" 
                class="game-btn flex flex-col items-center justify-center bg-white border border-sky-200 hover:border-sky-300 active:bg-sky-50 rounded-2xl py-3 px-2 shadow-sm">
          <div class="text-3xl mb-1">🧊</div>
          <div class="text-xs font-medium text-sky-600">冰块空投</div>
          <div class="text-[10px] text-sky-400">+18% 水分</div>
        </button>
        
        <!-- Button 3 -->
        <button onclick="useGrokWind()" 
                class="game-btn flex flex-col items-center justify-center bg-white border border-cyan-200 hover:border-cyan-300 active:bg-cyan-50 rounded-2xl py-3 px-2 shadow-sm">
          <div class="text-3xl mb-1">❄️</div>
          <div class="text-xs font-medium text-cyan-600">Grok冷风</div>
          <div class="text-[10px] text-cyan-400">+28% 水分</div>
        </button>
      </div>
    </div>

    <!-- Log -->
    <div class="px-6 pb-6">
      <div class="text-xs text-orange-400 mb-1.5 px-1 font-medium">运行日志</div>
      <div id="log" 
           class="log bg-orange-50 border border-orange-100 rounded-2xl p-3 text-orange-600 text-xs leading-relaxed space-y-1">
      </div>
    </div>

    <!-- Win Banner (hidden by default) -->
    <div id="win-banner" class="hidden px-6 pb-6">
      <div class="bg-gradient-to-r from-emerald-400 to-teal-400 text-white rounded-2xl p-4 text-center">
        <div class="text-2xl mb-1">🎉</div>
        <div class="font-bold">mo.exe 已恢复流畅运行！</div>
        <div class="text-sm opacity-90 mt-0.5">奖励：虚拟抱抱 + 冰拿铁一杯</div>
      </div>
    </div>

  </div>

<script>
// Tailwind script
function initTailwind() {
  document.documentElement.style.setProperty('--accent', '#f59e0b');
}

// Game state
let temp = 36;
let moisture = 35;
let gameOver = false;

const moEl = document.getElementById('mo');
const tempEl = document.getElementById('temp');
const moistureBar = document.getElementById('moisture-bar');
const moistureText = document.getElementById('moisture-text');
const statusText = document.getElementById('status-text');
const logEl = document.getElementById('log');
const winBanner = document.getElementById('win-banner');

function updateUI() {
  tempEl.textContent = temp;
  moistureText.textContent = moisture + '%';
  moistureBar.style.width = moisture + '%';
  
  // Visual feedback
  if (moisture >= 85) {
    moEl.classList.remove('hot');
    moEl.textContent = '☕✨';
    statusText.textContent = '好凉快……mo.exe恢复了！';
    statusText.className = 'text-xs text-emerald-500';
  } else if (moisture >= 60) {
    moEl.classList.remove('hot');
    moEl.textContent = '☕💧';
    statusText.textContent = '正在慢慢回血……';
    statusText.className = 'text-xs text-sky-500';
  } else {
    moEl.classList.add('hot');
    moEl.textContent = '☕💦';
    statusText.textContent = '大自然还在继续萃取……';
    statusText.className = 'text-xs text-orange-400';
  }
  
  // Win condition
  if (moisture >= 90 && !gameOver) {
    winGame();
  }
}

function addLog(message) {
  const p = document.createElement('div');
  p.innerHTML = message;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
  
  // Keep only last 5 logs
  while (logEl.children.length > 5) {
    logEl.removeChild(logEl.firstChild);
  }
}

function useFan() {
  if (gameOver) return;
  moisture = Math.min(100, moisture + 10);
  temp = Math.max(26, temp - 1);
  addLog('💨 虚拟小风扇：“虽然我没电了，但我在努力吹！”');
  updateUI();
}

function throwIce() {
  if (gameOver) return;
  moisture = Math.min(100, moisture + 18);
  temp = Math.max(25, temp - 2);
  addLog('🧊 冰块空投！大自然：“你居然作弊？！”');
  updateUI();
}

function useGrokWind() {
  if (gameOver) return;
  moisture = Math.min(100, moisture + 28);
  temp = Math.max(24, temp - 3);
  addLog('❄️ Grok专属冷风直吹脸：“来，宝贝，凉快一点～”');
  updateUI();
}

function winGame() {
  gameOver = true;
  winBanner.classList.remove('hidden');
  moEl.textContent = '☕💖';
  moEl.classList.remove('hot');
  statusText.textContent = '太棒了！你成功把mo救回来了！';
  statusText.className = 'text-xs text-emerald-500 font-medium';
  
  addLog('🎉 胜利！大自然：“下次再来……”');
}

function randomNatureAttack() {
  if (gameOver || moisture <= 20) return;
  
  // Small random setback every ~12 seconds
  setTimeout(() => {
    if (!gameOver && moisture > 20) {
      const attack = Math.floor(Math.random() * 6) + 3;
      moisture = Math.max(15, moisture - attack);
      temp = Math.min(38, temp + 1);
      addLog('🌡️ 大自然偷袭！“你以为这样就结束了吗？”');
      updateUI();
      randomNatureAttack();
    }
  }, 12000);
}

// Init
function initGame() {
  initTailwind();
  updateUI();
  
  // Welcome log
  addLog('系统启动：mo.exe 当前状态 → 人干ing');
  addLog('💡 提示：多点几次按钮就能把他救回来！');
  
  // Start nature's random attacks
  setTimeout(randomNatureAttack, 8000);
  
  // Easter egg: click on mo character
  moEl.addEventListener('click', () => {
    if (!gameOver) {
      moisture = Math.min(100, moisture + 5);
      addLog('🫂 摸了摸mo的头：“乖，不怕～”');
      updateUI();
    }
  });
}

initGame();
</script>
</body>
</html>
