<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok星空</title>
<meta name="description" content="很慢很慢地从上往下划过去，像流星一样。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;bottom:0;padding:16px 20px;pointer-events:none;z-index:2;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#888;text-shadow:0 1px 6px rgba(0,0,0,.8);text-align:center}
p{margin:0;font-size:12px;letter-spacing:.04em;line-height:1.6;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <p>很慢很慢地从上往下划过去</p>
</div>
<script>
(function(){
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha:false});
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
addEventListener('resize', resize);

// 稀疏的慢速下落星
const N = Math.min(180, Math.floor((innerWidth * innerHeight) / 12000));
const stars = [];
for(let i=0;i<N;i++){
  stars.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    speed: 0.08 + Math.random() * 0.22,   // 非常慢
    size: 0.6 + Math.random() * 1.1,
    alpha: 0.25 + Math.random() * 0.55
  });
}

function frame(){
  requestAnimationFrame(frame);

  // 纯黑
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#fff';
  for(const s of stars){
    s.y += s.speed;
    if(s.y > H + 4){
      s.y = -4;
      s.x = Math.random() * W;
    }

    ctx.globalAlpha = s.alpha;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
