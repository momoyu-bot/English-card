<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok星空</title>
<meta name="description" content="点大小不均，有快有慢，偶尔突然滑一下，但整体很安静。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;bottom:0;padding:16px 20px;pointer-events:none;z-index:2;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#888;text-shadow:0 1px 6px rgba(0,0,0,.8);text-align:center}
p{margin:0;font-size:12px;letter-spacing:.04em;line-height:1.6;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <p>点大小不均，有快有慢，偶尔突然滑一下</p>
</div>
<script>
(function(){
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha:false});
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
addEventListener('resize', resize);

// 稀疏、大小不一、速度不一的星
const N = Math.min(160, Math.floor((innerWidth * innerHeight) / 14000));
const stars = [];
for(let i=0;i<N;i++){
  const fast = Math.random() < 0.12; // 少数会突然快一点
  stars.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    speed: fast ? (0.6 + Math.random()*1.4) : (0.06 + Math.random()*0.28),
    size: 0.4 + Math.random()*1.8,          // 大小不均
    alpha: 0.18 + Math.random()*0.62,
    born: Math.random() * 8000               // 延迟出现，有些晚一点才浮现
  });
}

let start = performance.now();

function frame(now){
  requestAnimationFrame(frame);
  const t = now - start;

  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#fff';
  for(const s of stars){
    if(t < s.born) continue; // 还没到出现时间

    s.y += s.speed;
    if(s.y > H + 6){
      s.y = -6;
      s.x = Math.random() * W;
      // 偶尔重新决定是不是快的
      if(Math.random() < 0.08) s.speed = 0.5 + Math.random()*1.6;
      else s.speed = 0.05 + Math.random()*0.3;
    }

    // 很轻微的淡入
    const age = t - s.born;
    const fade = Math.min(1, age / 1800);
    ctx.globalAlpha = s.alpha * fade;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
