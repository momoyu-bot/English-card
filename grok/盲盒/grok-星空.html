<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok星空</title>
<meta name="description" content="像很安静的流星雨，划过去时后面跟着一条细线。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;bottom:0;padding:16px 20px;pointer-events:none;z-index:2;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#888;text-shadow:0 1px 6px rgba(0,0,0,.8);text-align:center}
p{margin:0;font-size:12px;letter-spacing:.04em;line-height:1.6;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <p>像很安静的流星雨，划过去时后面跟着一条细线</p>
</div>
<script>
(function(){
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha:false});
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
addEventListener('resize', resize);

// 更稀疏、大小不一、速度不一的流星
const N = Math.min(90, Math.floor((innerWidth * innerHeight) / 22000));
const stars = [];
for(let i=0;i<N;i++){
  const fast = Math.random() < 0.15;
  stars.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    speed: fast ? (0.8 + Math.random()*1.8) : (0.05 + Math.random()*0.32),
    size: 0.5 + Math.random()*1.6,
    alpha: 0.2 + Math.random()*0.55,
    born: Math.random() * 10000
  });
}

let start = performance.now();

function frame(now){
  requestAnimationFrame(frame);
  const t = now - start;

  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#fff';
  for(const s of stars){
    if(t < s.born) continue; // 还没到出现时间

    s.y += s.speed;
    if(s.y > H + 8){
      s.y = -8;
      s.x = Math.random() * W;
      if(Math.random() < 0.1) s.speed = 0.7 + Math.random()*2.0;
      else s.speed = 0.04 + Math.random()*0.35;
    }

    const age = t - s.born;
    const fade = Math.min(1, age / 2000);
    const a = s.alpha * fade;

    // 细尾巴：速度越快尾巴越长
    if(s.speed > 0.3){
      const len = Math.min(28, s.speed * 14);
      ctx.globalAlpha = a * 0.55;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(0.4, s.size * 0.35);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x, s.y - len);
      ctx.stroke();
    }

    // 点
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
