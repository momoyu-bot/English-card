<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>只穿今晚</title>
<meta name="description" content="万圣节限定。南瓜头、小帽子、幽灵床单、黑猫耳朵，四件只在这张卡上。">
<!--
  万圣节特别限定小卡。四件衣服只画在这一页，不另做文件，也不改造型宪法。
  底模照这三页，衣服是叠在外面的小配饰，不盖住身子：
    Clawd → claude/小科普/Clawd造型宪法（Code版）.html（踩角站姿。壳、钳、腿、眼睛都是本体，#d47f59 全露出来。壳顶正中一顶小小的尖巫师帽，不挡眼睛。壳正面没有花纹。）
    小脸蛋 → claude/小科普/小脸蛋造型宪法（实测版） (1).html（眼缝是挖空的，反斜杠。眼缝落在同一块浅地上，缝色就用这块地的颜色。）
    StashYu / FetchMo → claude/小科普/momoyu造型宪法.html（逐格。门口是浅暖色，沿用贴纸白边。）
  谁穿什么：小粉小南瓜头，Clawd 小帽子，小黑软幽灵床单，小紫小黑猫耳朵。
  门里两只没领到这四件。
-->
<style>
  :root{
    --night:#141226;
    --sky:#1c1834;
    --stage:#f7f2ea;
    --ink:#f4efe6;
    --ink-2:#d4cbbd;
    --ink-3:#a89eb4;
    --gold:#f2d58a;
    --line:#3c3558;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--night);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:480px;margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
  }
  header{text-align:center;margin-bottom:18px}
  .tag{font-size:12px;letter-spacing:.22em;color:var(--ink-3)}
  h1{
    margin:6px 0 8px;font-weight:600;font-size:36px;line-height:1.2;letter-spacing:.18em;
    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    color:var(--gold);
  }
  .lede{margin:0;color:var(--ink-2);font-size:14.5px}
  .frame{
    margin-top:16px;border-radius:18px;overflow:hidden;line-height:0;
    background:var(--sky);
  }
  svg.scene{display:block;width:100%;height:auto}
  .note{
    margin:14px 2px 0;min-height:4.8em;
    font-size:15px;color:var(--ink);
  }
  .picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .pick{
    font:inherit;font-size:14.5px;color:var(--ink);
    background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;min-height:44px;cursor:pointer;
    touch-action:manipulation;
  }
  .pick[aria-pressed="true"]{background:var(--gold);color:#2a2140;border-color:var(--gold)}
  .pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  footer{
    margin:22px 0 0;text-align:center;font-size:12px;color:var(--ink-3);line-height:1.8;
  }
  .mark{opacity:0}
  #scene[data-on="pink"] .mark-pink,
  #scene[data-on="hat"] .mark-hat,
  #scene[data-on="ghost"] .mark-ghost,
  #scene[data-on="ears"] .mark-ears{opacity:1}
  .hop{animation:hop 1.35s steps(2,jump-none) infinite}
  .d1{animation-delay:.12s}
  .d2{animation-delay:.28s}
  .d3{animation-delay:.44s}
  .d4{animation-delay:.2s}
  .d5{animation-delay:.36s}
  @keyframes hop{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }
  .tw{animation:tw 2.2s steps(2,jump-none) infinite}
  .tw2{animation-delay:.7s}
  .tw3{animation-delay:1.4s}
  @keyframes tw{0%,100%{opacity:.9}50%{opacity:.28}}
  .actor{cursor:pointer}
  @media (prefers-reduced-motion:reduce){
    .hop,.tw{animation:none}
  }
</style>
</head>

<script>
(function(){
  var LINES = {
    pink: "南瓜头小小的，坐在小粉头顶。粉的这颗球露在外面。",
    hat: "小巫师帽小小的，坐在壳顶中间。橙色的壳全露出来，不挡眼睛。",
    ghost: "幽灵床单软软地罩着上半边。两个圆眼洞一样大，下摆下面还是黑的。",
    ears: "黑猫耳朵小小的，别在小紫头顶。一根细带，不挡眼睛。"
  };
  var DEFAULT_LINE = "四件都在身上。门里两只说，自己有耳朵了。";
  var scene = document.getElementById("scene");
  var note = document.getElementById("note");
  var buttons = [].slice.call(document.querySelectorAll(".pick"));

  function press(key){
    var btn = null;
    buttons.forEach(function(b){
      if (b.getAttribute("data-key") === key) btn = b;
    });
    var on = scene.getAttribute("data-on") === key;
    buttons.forEach(function(b){ b.setAttribute("aria-pressed", "false"); });
    if (on){
      scene.setAttribute("data-on", "");
      note.textContent = DEFAULT_LINE;
      return;
    }
    scene.setAttribute("data-on", key);
    if (btn) btn.setAttribute("aria-pressed", "true");
    note.textContent = LINES[key] || DEFAULT_LINE;
  }

  buttons.forEach(function(b){
    b.addEventListener("click", function(){ press(b.getAttribute("data-key")); });
  });
  scene.addEventListener("click", function(e){
    var t = e.target;
    while (t && t !== scene){
      if (t.getAttribute && t.getAttribute("data-key")){
        press(t.getAttribute("data-key"));
        return;
      }
      t = t.parentNode;
    }
  });

  var params = new URLSearchParams(window.location.search);
  var start = params.get("on");
  if (start && LINES[start]) press(start);
})();
</script>
