<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gemini流星</title>
<meta name="description" content="五角星带着彗星尾巴自己淌，划得越快推得越深。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070f;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.ui{position:fixed;left:0;right:0;top:0;padding:18px 22px;pointer-events:none;z-index:2;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#d4def0;text-shadow:0 1px 10px rgba(0,0,0,.7)}
h1{font-size:14px;font-weight:500;letter-spacing:.22em;margin:0;opacity:.85}
p{margin:7px 0 0;font-size:11.5px;color:#7a8aaa;letter-spacing:.05em;max-width:20em;line-height:1.65}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <h1>GEMINI 流星</h1>
  <p>五角星带着彗星尾巴自己淌。<br>划得越快，推得越深。</p>
</div>
<script>
(function(){
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha:false});
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
addEventListener('resize', resize);

// 五角星路径（中心在 0,0，外接圆半径 r）
function starPath(r){
  const p = new Path2D();
  const spikes = 5;
  const inner = r * 0.42;
  for(let i=0;i<spikes*2;i++){
    const rad = (i * Math.PI / spikes) - Math.PI/2;
    const dist = i%2===0 ? r : inner;
    const x = Math.cos(rad) * dist;
    const y = Math.sin(rad) * dist;
    if(i===0) p.moveTo(x,y); else p.lineTo(x,y);
  }
  p.closePath();
  return p;
}

const N = Math.min(140, Math.floor((innerWidth*innerHeight)/28000));
const stars = [];
for(let i=0;i<N;i++){
  const r = 3.2 + Math.random()*4.8;
  stars.push({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    vx: (Math.random()-0.5)*0.6,
    vy: (Math.random()-0.5)*0.6,
    r,
    path: starPath(r),
    rot: Math.random()*Math.PI*2,
    rotV: (Math.random()-0.5)*0.4,
    hue: 195 + Math.random()*40,
    trail: []   // 记录最近位置画彗星尾
  });
}

let mx=-9999, my=-9999, pmx=-9999, pmy=-9999, down=false, lastT=0;

cv.addEventListener('pointermove', e=>{ pmx=mx; pmy=my; mx=e.clientX; my=e.clientY; });
cv.addEventListener('pointerdown', e=>{ down=true; mx=e.clientX; my=e.clientY; pmx=mx; pmy=my; });
addEventListener('pointerup', ()=>down=false);
cv.addEventListener('pointerleave', ()=>{mx=my=-9999;});

let flowT = 0;
function flow(x,y,t){
  const a = Math.sin(x*0.0035 + t*0.12) * Math.cos(y*0.0028 - t*0.09);
  const b = Math.cos(x*0.0026 - t*0.08) * Math.sin(y*0.0042 + t*0.14);
  return [a*0.42, b*0.36];
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.032, (now-lastT)/1000 || 0.016);
  lastT = now;
  flowT += dt;

  // 深空背景
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#05070f');
  bg.addColorStop(0.5,'#0a1020');
  bg.addColorStop(1,'#120818');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // 指针速度
  let svx=0, svy=0, sp=0;
  if(mx>-9000){
    svx = mx-pmx; svy = my-pmy;
    sp = Math.hypot(svx,svy);
    if(sp>50){ const k=50/sp; svx*=k; svy*=k; sp=50; }
  }

  for(const s of stars){
    // 记录轨迹（彗星尾）
    s.trail.unshift({x:s.x, y:s.y});
    if(s.trail.length > 18) s.trail.pop();

    // 环境流
    const f = flow(s.x, s.y, flowT);
    s.vx += f[0] * 22 * dt;
    s.vy += f[1] * 22 * dt;

    // 触摸推力：越快越深
    if(mx>-9000){
      const dx = s.x - mx, dy = s.y - my;
      const d2 = dx*dx + dy*dy;
      const R = down ? 180 : 140;
      if(d2 < R*R && d2 > 9){
        const d = Math.sqrt(d2);
        const w = (1 - d/R);
        const force = w*w * (down?110:48) * (1 + sp*0.055);
        s.vx += (dx/d) * force * dt;
        s.vy += (dy/d) * force * dt;
      }
    }

    // 阻尼
    s.vx *= 0.965;
    s.vy *= 0.965;
    s.x += s.vx;
    s.y += s.vy;
    s.rot += s.rotV * dt;

    // 边界环绕 —— 绕边时清空尾巴，避免画出横穿屏幕的线
    let wrapped = false;
    if(s.x < -40){ s.x = W+40; wrapped = true; }
    if(s.x > W+40){ s.x = -40; wrapped = true; }
    if(s.y < -40){ s.y = H+40; wrapped = true; }
    if(s.y > H+40){ s.y = -40; wrapped = true; }
    if(wrapped) s.trail.length = 0;

    // 画彗星尾（从远到近渐隐）—— 跳过过长的线段
    if(s.trail.length > 2){
      ctx.lineCap = 'round';
      for(let i=1;i<s.trail.length;i++){
        const t = s.trail[i];
        const prev = s.trail[i-1];
        const dist = Math.hypot(t.x - prev.x, t.y - prev.y);
        if(dist > 80) continue;   // 太长的不连，防止残影线
        const alpha = (1 - i/s.trail.length) * 0.55;
        const width = s.r * (1 - i/s.trail.length) * 0.7;
        ctx.strokeStyle = `hsla(${s.hue},80%,75%,${alpha})`;
        ctx.lineWidth = Math.max(0.4, width);
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(t.x, t.y);
        ctx.stroke();
      }
    }

    // 画五角星
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = `hsla(${s.hue},70%,78%,0.92)`;
    ctx.shadowColor = `hsla(${s.hue},90%,70%,0.6)`;
    ctx.shadowBlur = 8;
    ctx.fill(s.path);
    ctx.restore();
  }

  pmx = mx; pmy = my;
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
