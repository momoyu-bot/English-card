<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>今天也要好好摸鱼</title>
<meta name="description" content="点小鱼攒摸鱼积分。老板还在开会，继续。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
    height: 100vh;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  #header {
    text-align: center;
    padding: 18px 0 8px;
    color: #006064;
  }
  #header h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 2px;
  }
  #score {
    font-size: 16px;
    margin-top: 6px;
    color: #00838f;
  }
  #msg {
    height: 28px;
    font-size: 14px;
    color: #455a64;
    margin-top: 4px;
    transition: opacity 0.3s;
  }
  #pool {
    position: relative;
    width: 100%;
    height: calc(100vh - 110px);
  }
  .fish {
    position: absolute;
    font-size: 42px;
    cursor: pointer;
    transition: transform 0.15s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    animation: float 3s ease-in-out infinite;
  }
  .fish:hover {
    transform: scale(1.25);
  }
  .fish:active {
    transform: scale(0.85);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  #footer {
    position: fixed;
    bottom: 12px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #607d8b;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div id="header">
    <h1>🐟 偷偷摸摸的摸鱼时间</h1>
    <div id="score">摸鱼积分：0</div>
    <div id="msg">轻轻点小鱼，积攒摸鱼能量～</div>
  </div>
  <div id="pool"></div>
  <div id="footer">宝再坚持一会儿就下班啦 · 今天也辛苦了</div>

<script>
  const pool = document.getElementById('pool');
  const scoreEl = document.getElementById('score');
  const msgEl = document.getElementById('msg');
  let score = 0;

  const phrases = [
    "再摸一小会儿……没人发现的",
    "老板还在开会，继续！",
    "这条鱼味道不错（假的）",
    "摸鱼使人快乐，科学证实",
    "你已经比刚才更放松了",
    "下班倒计时ing……",
    "今天的小鱼都很乖",
    "悄悄的，不要被发现哦",
    "积分越高，下班越香",
    "宝今天已经很努力了"
  ];

  function randomPhrase() {
    return phrases[Math.floor(Math.random() * phrases.length)];
  }

  function createFish() {
    const fish = document.createElement('div');
    fish.className = 'fish';
    const icons = ['🐟', '🐠', '🐡', '🐬', '🦈', '🐙'];
    fish.textContent = icons[Math.floor(Math.random() * icons.length)];
    
    const x = Math.random() * 88 + 4;
    const y = Math.random() * 78 + 6;
    fish.style.left = x + '%';
    fish.style.top = y + '%';
    fish.style.animationDelay = (Math.random() * 2) + 's';

    fish.onclick = () => {
      score++;
      scoreEl.textContent = `摸鱼积分：${score}`;
      msgEl.textContent = randomPhrase();
      msgEl.style.opacity = 0;
      setTimeout(() => msgEl.style.opacity = 1, 50);
      
      fish.style.transform = 'scale(0)';
      fish.style.opacity = '0';
      setTimeout(() => fish.remove(), 180);
      
      // 偶尔多刷一条
      if (Math.random() > 0.6) setTimeout(createFish, 300);
    };

    pool.appendChild(fish);

    // 鱼自己慢慢游走（防止一直待着）
    setTimeout(() => {
      if (fish.parentNode) {
        fish.style.transition = 'all 1.2s ease';
        fish.style.opacity = '0';
        fish.style.transform = 'scale(0.3) translateY(-30px)';
        setTimeout(() => fish.remove(), 1200);
      }
    }, 5000 + Math.random() * 4000);
  }

  // 初始放几条
  for (let i = 0; i < 6; i++) {
    setTimeout(createFish, i * 200);
  }

  // 持续刷鱼
  setInterval(() => {
    if (document.querySelectorAll('.fish').length < 9) {
      createFish();
    }
  }, 1800);
</script>
</body>
</html>
