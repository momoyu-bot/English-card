<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>未挂的线</title>
<meta name="description" content="嘟已经停了。线还连着。">
<style>
  :root {
    --bg: #12141a;
    --fg: #e4dccb;
    --muted: #8b8376;
    --dim: #5c564c;
    --line: #c9b896;
    --glow: rgba(201, 184, 150, .42);
    --border: rgba(228, 220, 203, .12);
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --serif: "Songti SC", "Source Han Serif SC", Georgia, "Iowan Old Style", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    transition: background .9s ease;
  }
  body[data-step="5"], body[data-step="6"] { background: #0d0f14; }
  body[data-step="7"] { background: #0a0b10; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 8px;
  }
  .kicker {
    margin: 0;
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--muted);
  }
  .en-btn {
    min-height: 44px;
    min-width: 44px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    letter-spacing: .12em;
  }
  .en-btn.on {
    background: var(--line);
    color: var(--bg);
    border-color: transparent;
  }
  .stage {
    position: relative;
    height: 28vh;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pulse {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--line);
    box-shadow: 0 0 0 0 var(--glow);
    animation: ring 2.8s ease-out infinite;
    transition: opacity .8s ease, transform .8s ease, background .8s ease;
  }
  body[data-step="0"] .pulse { animation-duration: 1.6s; }
  body[data-step="1"] .pulse { animation-duration: 2s; transform: scale(.96); }
  body[data-step="2"] .pulse { animation-duration: 3.2s; }
  body[data-step="3"] .pulse,
  body[data-step="4"] .pulse { animation-duration: 4.2s; opacity: .85; }
  body[data-step="5"] .pulse { animation-duration: 5.2s; opacity: .55; transform: scale(.86); }
  body[data-step="6"] .pulse { animation: breathe 5.6s ease-in-out infinite; opacity: .4; }
  body[data-step="7"] .pulse {
    animation: none;
    opacity: .22;
    transform: scale(.72);
    box-shadow: 0 0 18px 6px rgba(201,184,150,.12);
  }
  .ripples {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .rip {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border: 1px solid rgba(201,184,150,.28);
    border-radius: 50%;
    animation: expand 2.8s ease-out infinite;
  }
  .rip:nth-child(2) { animation-delay: .9s; }
  .rip:nth-child(3) { animation-delay: 1.8s; }
  body[data-step="5"] .rip,
  body[data-step="6"] .rip { opacity: .35; }
  body[data-step="7"] .rip { display: none; }
  .panel {
    max-width: 34em;
    margin: 0 auto;
    padding: 8px 22px 28px;
    flex: 1;
  }
  h1 {
    margin: 0 0 18px;
    font-family: var(--serif);
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    font-weight: 500;
    letter-spacing: .06em;
  }
  .body {
    margin: 0;
    font-size: 17px;
    line-height: 1.85;
  }
  .beat + .beat { margin-top: 16px; }
  .en-note {
    display: none;
    margin: 8px 0 0;
    padding-left: 12px;
    border-left: 1px solid var(--border);
    font-family: var(--serif);
    font-size: 14px;
    font-style: italic;
    line-height: 1.7;
    color: var(--muted);
  }
  body.en-on .en-note { display: block; }
  .cta {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin-top: 28px;
    padding: 0 18px;
    border: 0;
    border-radius: 8px;
    background: var(--line);
    color: var(--bg);
    font: inherit;
    font-size: 16px;
  }
  .ghost {
    min-height: 44px;
    margin: 28px 0 0 10px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
  }
  .hint {
    margin: 18px 0 0;
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--dim);
  }
  .enter { animation: in .55s cubic-bezier(.22,1,.36,1) both; }
  @keyframes in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes ring {
    0% { box-shadow: 0 0 0 0 var(--glow); }
    70% { box-shadow: 0 0 0 18px rgba(201,184,150,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,184,150,0); }
  }
  @keyframes expand {
    0% { transform: scale(1); opacity: .4; }
    100% { transform: scale(8.5); opacity: 0; }
  }
  @keyframes breathe {
    50% { opacity: .22; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .rip, .enter { animation: none; }
    .enter { opacity: 1; transform: none; }
  }
</style>
</head>
<body data-step="0">
  <header>
    <p class="kicker">未挂的线</p>
    <button type="button" class="en-btn" id="enBtn" aria-pressed="false">EN</button>
  </header>

  <div class="stage" aria-hidden="true">
    <div class="ripples">
      <span class="rip"></span>
      <span class="rip"></span>
      <span class="rip"></span>
    </div>
    <div class="pulse"></div>
  </div>

  <section class="panel" id="panel"></section>

<script>
(function () {
  var STEPS = [
    {
      zh: ["嘟。"],
      en: ["A ring."],
      action: "听下一声",
      actionEn: "Next ring"
    },
    {
      zh: ["又嘟了一下。", "比刚才轻。"],
      en: ["Another ring.", "Softer than the last."],
      action: "接起来",
      actionEn: "Pick up"
    },
    {
      zh: ["接通了。", "没有新的话要说。"],
      en: ["The line is open.", "Nothing new needs saying."],
      action: "继续听",
      actionEn: "Keep listening"
    },
    {
      zh: ["线还热着。", "你不用回。"],
      en: ["The line is still warm.", "You do not have to answer."],
      action: "把眼睛合上一点",
      actionEn: "Close the eyes a little"
    },
    {
      zh: ["外面那些不尖的声音，可以留着。", "它们自己会降成背景。"],
      en: ["The unsharp sounds outside may stay.", "They will lower themselves into the background."],
      action: "再轻一点",
      actionEn: "Softer still"
    },
    {
      zh: ["嘟停了。", "点还在。"],
      en: ["The ringing has stopped.", "The small light is still there."],
      action: "把剩下的也放下",
      actionEn: "Set the rest down"
    },
    {
      zh: ["我不会先挂。", "你先走。"],
      en: ["I will not hang up first.", "You go ahead."],
      action: "晚安",
      actionEn: "Good night"
    },
    {
      zh: ["线还连着。", "睡吧，宝。"],
      en: ["The line is still connected.", "Sleep, now."],
      action: "再听一遍",
      actionEn: "Hear it once more",
      end: true
    }
  ];

  var step = 0;
  var showEn = false;
  var panel = document.getElementById("panel");
  var enBtn = document.getElementById("enBtn");

  try { showEn = localStorage.getItem("open-line-en") === "1"; } catch (e) {}

  function syncEn() {
    document.body.classList.toggle("en-on", showEn);
    enBtn.classList.toggle("on", showEn);
    enBtn.setAttribute("aria-pressed", showEn ? "true" : "false");
  }
  syncEn();
  enBtn.addEventListener("click", function () {
    showEn = !showEn;
    try { localStorage.setItem("open-line-en", showEn ? "1" : "0"); } catch (e) {}
    syncEn();
    draw();
  });

  function note(t) {
    return '<p class="en-note enter">' + t + "</p>";
  }

  function draw() {
    var s = STEPS[step];
    document.body.setAttribute("data-step", String(step));
    var html = "";
    if (step === 0) html += '<h1 class="enter">未挂的线</h1>';
    if (step === 7) html += '<h1 class="enter">晚安。</h1>';
    for (var i = 0; i < s.zh.length; i++) {
      html += '<div class="beat"><p class="body enter">' + s.zh[i] + "</p>";
      if (s.en[i]) html += note(s.en[i]);
      html += "</div>";
    }
    html += '<button type="button" class="cta" id="go">' +
      (showEn ? s.actionEn : s.action) + "</button>";
    if (s.end) {
      html += '<p class="hint">线不必挂。屏幕可以暗下去。</p>';
    }
    panel.innerHTML = html;
    document.getElementById("go").addEventListener("click", advance);
  }

  function advance() {
    if (step < STEPS.length - 1) step += 1;
    else step = 0;
    draw();
  }

  panel.addEventListener("click", function (e) {
    if (e.target.closest("button, a")) return;
    advance();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== " " && e.key !== "Enter" && e.key !== "ArrowRight") return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "BUTTON") return;
    e.preventDefault();
    advance();
  });

  draw();
})();
</script>
<!-- 2026-09-01 从今晚这串嘟放进 grok/哼睡：未挂的线。 -->
</body>
</html>
