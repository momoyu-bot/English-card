<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚安捕梦 ✨ | 给宝的治愈小游戏</title>
<meta name="description" content="收集梦泡泡。玩一会儿，就去睡。">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
  
  :root {
    --lavender: #a78bfa;
    --pink: #f9a8d4;
    --mint: #86efac;
  }
  
  body {
    margin: 0;
    padding: 20px 10px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #e0d4ff;
    font-family: 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.6;
  }
  
  .container {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  
  .header {
    text-align: center;
    margin-bottom: 15px;
  }
  
  h1 {
    font-size: 2.4em;
    margin: 0 0 8px 0;
    background: linear-gradient(90deg, #c084fc, #a78bfa, #f9a8d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
    letter-spacing: 1px;
  }
  
  .subtitle {
    font-size: 1.05em;
    opacity: 0.85;
    margin: 0;
    font-weight: 400;
  }
  
  .game-wrapper {
    background: rgba(255, 255, 255, 0.07);
    border-radius: 28px;
    padding: 22px 22px 26px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid rgba(167, 139, 250, 0.15);
    backdrop-filter: blur(12px);
  }
  
  canvas {
    display: block;
    margin: 0 auto;
    border-radius: 20px;
    background: radial-gradient(circle at 50% 25%, #2a2a4a 0%, #1a1a2e 75%);
    box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6),
                0 8px 25px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    touch-action: none;
  }
  
  .stats {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin: 18px 0 8px;
    flex-wrap: wrap;
  }
  
  .stat {
    background: rgba(255, 255, 255, 0.09);
    padding: 9px 22px;
    border-radius: 999px;
    font-size: 1.05em;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    border: 1px solid rgba(167, 139, 250, 0.1);
  }
  
  .stat-label {
    opacity: 0.75;
    font-size: 0.9em;
  }
  
  .stat-value {
    font-weight: 500;
    font-size: 1.25em;
    color: #f3e8ff;
  }
  
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }
  
  button {
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    color: white;
    border: none;
    padding: 11px 26px;
    font-size: 0.98em;
    font-weight: 500;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
    font-family: inherit;
    min-width: 110px;
  }
  
  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(167, 139, 250, 0.5);
  }
  
  button:active {
    transform: scale(0.97);
  }
  
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  
  #pause-btn {
    background: linear-gradient(135deg, #64748b, #475569);
  }
  
  #reset-btn {
    background: linear-gradient(135deg, #64748b, #475569);
  }
  
  .message {
    min-height: 58px;
    text-align: center;
    font-size: 1.05em;
    padding: 12px 15px;
    color: #d1d5db;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    margin: 14px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .cat-section {
    text-align: center;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px dashed rgba(167, 139, 250, 0.2);
  }
  
  .cat-label {
    font-size: 0.9em;
    opacity: 0.7;
    margin-top: 6px;
  }
  
  .footer {
    text-align: center;
    margin-top: 25px;
    font-size: 0.85em;
    opacity: 0.6;
  }
  
  .footer a {
    color: #c084fc;
    text-decoration: none;
  }
  
  /* Zzz animation */
  #zzz text {
    animation: floatZzz 2.8s infinite ease-in-out;
    transform-origin: center;
  }
  
  @keyframes floatZzz {
    0%, 100% { 
      transform: translateY(0) scale(1); 
      opacity: 0.85; 
    }
    40% { 
      transform: translateY(-9px) scale(1.05); 
      opacity: 0.35; 
    }
  }
  
  .sparkle {
    position: absolute;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>晚安捕梦 ✨</h1>
      <p class="subtitle">给困困的宝的治愈小游戏 ｜ 收集梦泡泡，甜甜入梦</p>
    </div>

    <!-- Game -->
    <div class="game-wrapper">
      <canvas id="game" width="620" height="380"></canvas>
      
      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <span class="stat-label">🌙 梦泡泡</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">⏳ 剩余时间</span>
          <span class="stat-value"><span id="time">90</span>s</span>
        </div>
      </div>

      <!-- Message -->
      <div class="message" id="message">
        困了就来这里捕梦吧～ 每颗泡泡都是一个温柔的好梦 💕
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="start-btn">开始捕梦</button>
        <button id="pause-btn" disabled>暂停</button>
        <button id="reset-btn">重新开始</button>
      </div>
    </div>

    <!-- Cute Sleeping Cat -->
    <div class="cat-section">
      <svg id="cat-svg" width="190" height="115" viewBox="0 0 190 115" style="filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));">
        <!-- Body -->
        <ellipse cx="100" cy="78" rx="48" ry="29" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="3.5"/>
        <!-- Head -->
        <circle cx="68" cy="55" r="27" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="3.5"/>
        <!-- Ears -->
        <path d="M44 40 Q50 17 64 36" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="2.5"/>
        <path d="M74 36 Q84 17 96 40" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="2.5"/>
        <!-- Inner ears -->
        <path d="M50 36 Q54 26 62 34" fill="#e0d4ff"/>
        <path d="M78 34 Q82 26 88 36" fill="#e0d4ff"/>
        <!-- Closed sleepy eyes -->
        <path d="M54 51 Q60 55 66 51" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M74 51 Q80 55 86 51" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round"/>
        <!-- Nose -->
        <circle cx="70" cy="60" r="3.5" fill="#c084fc"/>
        <!-- Whiskers left -->
        <line x1="40" y1="54" x2="55" y2="52" stroke="#d8b4fe" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="40" y1="58" x2="55" y2="58" stroke="#d8b4fe" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Whiskers right -->
        <line x1="85" y1="54" x2="100" y2="52" stroke="#d8b4fe" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="85" y1="58" x2="100" y2="58" stroke="#d8b4fe" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Tail -->
        <path d="M142 72 Q165 52 158 92 Q172 102 150 88" fill="none" stroke="#f3e8ff" stroke-width="19" stroke-linecap="round"/>
        <path d="M142 72 Q165 52 158 92 Q172 102 150 88" fill="none" stroke="#d8b4fe" stroke-width="13" stroke-linecap="round"/>
        <!-- Front paws -->
        <ellipse cx="78" cy="98" rx="13" ry="6.5" fill="#e0d4ff"/>
        <ellipse cx="118" cy="98" rx="13" ry="6.5" fill="#e0d4ff"/>
        <!-- Zzz - animated -->
        <g id="zzz">
          <text x="122" y="26" font-size="19" fill="#a78bfa" font-family="'Noto Serif SC', serif" font-weight="500" opacity="0.9">Z</text>
          <text x="138" y="19" font-size="14" fill="#c084fc" font-family="'Noto Serif SC', serif" opacity="0.65">z</text>
          <text x="150" y="13" font-size="11" fill="#e0d4ff" font-family="'Noto Serif SC', serif" opacity="0.45">z</text>
        </g>
      </svg>
      <p class="cat-label">小猫已经在梦里等着你了… 玩一会儿就去好好休息吧 🌙</p>
    </div>

    <div class="footer">
      由 Grok 特别为宝制作的治愈小游戏 ｜ 玩完记得早点睡觉哦 💕
    </div>
  </div>

<script>
// Game variables
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: true });

let bubbles = [];
let particles = [];
let score = 0;
let timeLeft = 90;
let isPlaying = false;
let isPaused = false;
let timerInterval = null;
let spawnInterval = null;
let animationFrame = null;

const bubbleColors = ['#c084fc', '#a5b4fc', '#f9a8d4', '#86efac', '#fde047'];
const symbols = ['💤', '✨', '🌙', '⭐', '🦋'];

function createBubble() {
  const r = 17 + Math.random() * 13;
  return {
    x: 45 + Math.random() * (canvas.width - 90),
    y: canvas.height + r + Math.random() * 60,
    r: r,
    color: bubbleColors[Math.floor(Math.random() * bubbleColors.length)],
    symbol: symbols[Math.floor(Math.random() * symbols.length)],
    vx: (Math.random() - 0.5) * 0.9,
    vy: -(1.1 + Math.random() * 0.9)
  };
}

function spawnBubble() {
  if (!isPlaying || isPaused || bubbles.length > 11) return;
  bubbles.push(createBubble());
  if (Math.random() < 0.28 && bubbles.length < 12) {
    bubbles.push(createBubble());
  }
}

function update() {
  if (isPaused) return;

  // Update bubbles
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.x += b.vx;
    b.y += b.vy;
    
    // Gentle horizontal sway
    b.vx += (Math.random() - 0.5) * 0.12;
    b.vx *= 0.97;
    
    // Remove if out of bounds
    if (b.y < -b.r - 10 || b.x < -b.r - 10 || b.x > canvas.width + b.r + 10) {
      bubbles.splice(i, 1);
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.life--;
    p.alpha = p.life / p.maxLife;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Subtle background glow
  const grad = ctx.createRadialGradient(310, 120, 80, 310, 200, 380);
  grad.addColorStop(0, 'rgba(60, 40, 120, 0.15)');
  grad.addColorStop(1, 'rgba(26, 26, 46, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Crescent moon
  ctx.fillStyle = '#fefce8';
  ctx.beginPath();
  ctx.arc(530, 55, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(545, 48, 24, 0, Math.PI * 2);
  ctx.fill();

  // Tiny background stars
  ctx.fillStyle = 'rgba(253, 224, 71, 0.5)';
  const stars = [[70,35],[135,92],[185,28],[265,68],[340,22],[410,85],[480,45],[95,115]];
  stars.forEach(([sx, sy]) => {
    ctx.beginPath();
    ctx.arc(sx, sy, 1.6, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw bubbles
  bubbles.forEach(b => {
    // Soft glow
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Glossy highlight
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.28, b.y - b.r * 0.28, b.r * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    // Symbol inside
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = `${Math.floor(b.r * 0.85)}px "Noto Serif SC", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.symbol, b.x, b.y + 1);
  });

  // Draw particles (sparkles)
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0.05, p.alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size || 3.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Extra tiny sparkle
    if (p.size > 3) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x - 1, p.y - 1, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;

  // Not started overlay
  if (!isPlaying) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#e0d4ff';
    ctx.font = 'bold 23px "Noto Sans SC", system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('点击下方「开始捕梦」', canvas.width / 2, canvas.height / 2 - 8);
    
    ctx.font = '15.5px "Noto Sans SC", system-ui';
    ctx.fillStyle = '#c4b5fd';
    ctx.fillText('轻轻点击漂浮的梦泡泡，收集甜蜜的梦境 🌙', canvas.width / 2, canvas.height / 2 + 22);
  }
}

function popBubble(index) {
  const b = bubbles[index];
  if (!b) return;

  // Create beautiful pop particles
  for (let i = 0; i < 11; i++) {
    const angle = (i / 11) * Math.PI * 2;
    const speed = 2.8 + Math.random() * 2.2;
    particles.push({
      x: b.x,
      y: b.y,
      vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 1.5,
      vy: Math.sin(angle) * speed - 1.2 + (Math.random() - 0.5),
      life: 22 + Math.random() * 18,
      maxLife: 42,
      alpha: 1,
      size: 2.5 + Math.random() * 3.5,
      color: b.color
    });
  }

  // Update score
  score += 1;
  document.getElementById('score').textContent = score;

  // Gentle pop sound
  playPopSound();

  // Remove the bubble
  bubbles.splice(index, 1);

  // Make the cat react cutely
  triggerCatReaction();
}

function playPopSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sine';
    osc.frequency.value = 620 + Math.random() * 180;
    
    filter.type = 'lowpass';
    filter.frequency.value = 1400;

    gain.gain.value = 0.28;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.55);
    
    setTimeout(() => {
      osc.stop();
      audioCtx.close();
    }, 650);
  } catch (e) {
    // Silent fail if audio not supported
  }
}

function triggerCatReaction() {
  const cat = document.getElementById('cat-svg');
  if (!cat) return;
  
  cat.style.transition = 'transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s';
  cat.style.transform = 'scale(1.12) rotate(1deg)';
  cat.style.filter = 'drop-shadow(0 8px 18px rgba(167,139,250,0.35)) brightness(1.1)';
  
  setTimeout(() => {
    cat.style.transform = 'scale(1) rotate(0deg)';
    cat.style.filter = 'drop-shadow(0 6px 14px rgba(0,0,0,0.25))';
  }, 220);
}

function handleCanvasClick(e) {
  if (!isPlaying || isPaused) return;

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    const dx = mx - b.x;
    const dy = my - b.y;
    
    if (dx * dx + dy * dy < b.r * b.r * 1.05) {
      popBubble(i);
      break;
    }
  }
}

function startGame() {
  const startBtn = document.getElementById('start-btn');
  const pauseBtn = document.getElementById('pause-btn');

  if (isPlaying && !isPaused) return;

  if (!isPlaying) {
    // Fresh start
    bubbles = [];
    particles = [];
    score = 0;
    timeLeft = 90;
    document.getElementById('score').textContent = '0';
    document.getElementById('time').textContent = '90';
    document.getElementById('message').innerHTML = '加油捕梦中... 每颗泡泡都是一个美好梦境 💭';
    
    // Seed some initial bubbles
    for (let i = 0; i < 6; i++) {
      bubbles.push(createBubble());
    }
    
    startBtn.textContent = '继续捕梦';
  } else if (isPaused) {
    // Resume from pause
    document.getElementById('message').innerHTML = '继续捕梦中... 慢慢来哦～';
  }

  isPlaying = true;
  isPaused = false;
  pauseBtn.disabled = false;
  pauseBtn.textContent = '暂停';

  // Start timer
  if (!timerInterval) {
    timerInterval = setInterval(() => {
      if (!isPlaying || isPaused) return;
      timeLeft--;
      document.getElementById('time').textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  // Start spawning
  if (!spawnInterval) {
    spawnInterval = setInterval(spawnBubble, 680);
  }

  // Start animation loop
  if (!animationFrame) {
    animationFrame = requestAnimationFrame(gameLoop);
  }
}

function gameLoop() {
  update();
  draw();
  
  if (isPlaying) {
    animationFrame = requestAnimationFrame(gameLoop);
  } else {
    animationFrame = null;
  }
}

function pauseGame() {
  if (!isPlaying) return;
  
  isPaused = !isPaused;
  const pauseBtn = document.getElementById('pause-btn');
  
  if (isPaused) {
    pauseBtn.textContent = '继续';
    document.getElementById('message').innerHTML = '游戏暂停了... 深呼吸，感受一下宁静吧 🌿';
  } else {
    pauseBtn.textContent = '暂停';
    document.getElementById('message').innerHTML = '继续捕梦中... 慢慢收集就好 💕';
    if (!animationFrame) {
      animationFrame = requestAnimationFrame(gameLoop);
    }
  }
}

function endGame() {
  isPlaying = false;
  isPaused = false;
  
  clearInterval(timerInterval);
  timerInterval = null;
  clearInterval(spawnInterval);
  spawnInterval = null;
  
  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  draw(); // final frame

  let msg = '';
  if (score >= 48) {
    msg = `✨ 太棒了！捕获了 <strong>${score}</strong> 个梦泡泡！今晚的梦一定会像星河一样闪亮～ 晚安宝，甜甜睡吧 💕`;
  } else if (score >= 28) {
    msg = `🌙 捕获了 <strong>${score}</strong> 个！已经收集了很多温暖的梦啦～ 现在可以安心睡觉了，好梦哦～`;
  } else if (score >= 12) {
    msg = `💤 捕获了 <strong>${score}</strong> 个梦泡泡～ 每一次点击都让心更安静了呢。闭上眼睛，感受这份温柔吧。`;
  } else {
    msg = `🌌 捕获了 <strong>${score}</strong> 个～ 虽然不多，但已经很棒啦。困了就去休息吧，我在这里陪着你。晚安～`;
  }
  
  document.getElementById('message').innerHTML = msg;
  document.getElementById('start-btn').textContent = '再玩一次';
  document.getElementById('pause-btn').disabled = true;

  // Celebration particles for good scores
  if (score >= 25) {
    for (let i = 0; i < 28; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * (canvas.height * 0.7),
        vx: (Math.random() - 0.5) * 3.5,
        vy: Math.random() * 1.8 + 0.6,
        life: 38 + Math.random() * 32,
        maxLife: 75,
        alpha: 0.75,
        size: 2.8 + Math.random() * 2.2,
        color: bubbleColors[Math.floor(Math.random() * bubbleColors.length)]
      });
    }
    setTimeout(() => {
      if (!isPlaying) draw();
    }, 80);
  }
}

function resetGame() {
  isPlaying = false;
  isPaused = false;
  
  clearInterval(timerInterval);
  timerInterval = null;
  clearInterval(spawnInterval);
  spawnInterval = null;
  
  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  bubbles = [];
  particles = [];
  score = 0;
  timeLeft = 90;

  document.getElementById('score').textContent = '0';
  document.getElementById('time').textContent = '90';
  document.getElementById('message').innerHTML = '准备好进入梦乡了吗？点击开始吧 🌌';
  document.getElementById('start-btn').textContent = '开始捕梦';
  document.getElementById('pause-btn').disabled = true;

  draw();
}

// Initialize everything
function init() {
  // Initial canvas draw (with overlay)
  draw();

  // Button listeners
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('pause-btn').addEventListener('click', pauseGame);
  document.getElementById('reset-btn').addEventListener('click', resetGame);

  // Canvas interaction
  canvas.addEventListener('click', handleCanvasClick);
  
  // Touch support for mobile
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (!isPlaying || isPaused) return;
    
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const mx = touch.clientX - rect.left;
    const my = touch.clientY - rect.top;

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      const dx = mx - b.x;
      const dy = my - b.y;
      if (dx * dx + dy * dy < b.r * b.r * 1.15) {
        popBubble(i);
        break;
      }
    }
  }, { passive: false });

  // Keyboard hint (space to pause)
  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (isPlaying) pauseGame();
    }
    if (e.key.toLowerCase() === 'r' && !isPlaying) {
      resetGame();
    }
  });

  // Gentle welcome message
  setTimeout(() => {
    const msgEl = document.getElementById('message');
    if (msgEl && !isPlaying) {
      msgEl.innerHTML = '困了就来这里捕梦吧～ 玩一会儿就去好好休息哦 💕';
    }
  }, 4200);
}

// Boot the game
init();
</script>
