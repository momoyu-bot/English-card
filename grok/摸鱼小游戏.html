<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>摸鱼小游戏 🐟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    
    body {
      font-family: 'Noto Sans SC', system-ui, sans-serif;
    }
    
    .fish-btn {
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    
    .fish-btn:active {
      transform: scale(0.92);
      box-shadow: 0 10px 15px -3px rgb(16 185 129 / 0.3);
    }
    
    .floating-text {
      animation: floatUp 0.9s ease-out forwards;
      text-shadow: 0 2px 4px rgb(0 0 0 / 0.3);
    }
    
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-70px); opacity: 0; }
    }
    
    .upgrade-card {
      transition: all 0.2s ease;
    }
    
    .upgrade-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.2);
    }
    
    .log-item {
      animation: fadeIn 0.3s ease;
    }
    
    .stat-value {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="max-w-lg mx-auto p-5">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="flex items-center justify-center gap-x-3 mb-1">
        <span class="text-5xl">🐟</span>
        <h1 class="text-4xl font-bold tracking-tight">摸鱼小游戏</h1>
        <span class="text-5xl">🐟</span>
      </div>
      <p class="text-emerald-400 text-sm">上班偷偷玩 · 快乐每一天</p>
      <div class="mt-1 text-[10px] text-zinc-500">已自动保存进度 · 刷新不丢</div>
    </div>

    <!-- Main Card -->
    <div class="bg-zinc-900 rounded-3xl p-6 shadow-2xl border border-zinc-800">
      
      <!-- Score -->
      <div class="text-center mb-5">
        <div class="text-xs text-zinc-400 tracking-widest">当前摸鱼值</div>
        <div id="score" 
             class="text-7xl font-bold text-emerald-400 tabular-nums transition-all">0</div>
      </div>

      <!-- Big Fish Button -->
      <div id="btn-container" class="relative flex justify-center mb-6">
        <button id="moyu-btn"
                class="fish-btn group w-44 h-44 bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-600 
                       hover:from-emerald-400 hover:via-teal-400 hover:to-cyan-500 
                       rounded-full flex flex-col items-center justify-center shadow-xl shadow-emerald-900/40 
                       active:shadow-lg border-4 border-emerald-300/30">
          <div class="text-[72px] mb-0.5 transition-transform group-active:scale-90">🐟</div>
          <div class="text-white font-bold text-xl tracking-[2px]">摸鱼一下</div>
          <div class="text-[10px] text-emerald-100/70 mt-0.5">点击获得摸鱼值</div>
        </button>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-zinc-800 rounded-2xl px-4 py-3 text-center">
          <div class="text-[10px] text-zinc-400">点击威力</div>
          <div id="click-power" class="text-3xl font-semibold text-amber-400 stat-value">1</div>
        </div>
        <div class="bg-zinc-800 rounded-2xl px-4 py-3 text-center">
          <div class="text-[10px] text-zinc-400">每秒自动</div>
          <div id="auto-per-sec" class="text-3xl font-semibold text-sky-400 stat-value">0</div>
        </div>
        <div class="bg-zinc-800 rounded-2xl px-4 py-3 text-center">
          <div class="text-[10px] text-zinc-400">总点击</div>
          <div id="total-clicks" class="text-3xl font-semibold text-zinc-300 stat-value">0</div>
        </div>
      </div>

      <!-- Upgrades -->
      <div class="mb-5">
        <div class="flex items-center justify-between mb-3 px-1">
          <div class="font-semibold text-lg flex items-center gap-x-2">
            <span>🛠️</span> 
            <span>摸鱼升级</span>
          </div>
          <div class="text-[10px] px-2.5 py-0.5 bg-zinc-800 rounded-full text-zinc-400">点击购买</div>
        </div>

        <!-- Upgrade 1: 小鱼助手 -->
        <div class="upgrade-card bg-zinc-800 hover:bg-zinc-700 rounded-2xl p-4 mb-2.5 flex items-center justify-between">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-x-2">
              <span class="text-xl">🐠</span>
              <span class="font-medium">小鱼助手</span>
            </div>
            <div class="text-xs text-zinc-400 mt-0.5">每秒自动 +1 摸鱼值</div>
            <div class="text-[10px] text-emerald-400 mt-1">已拥有 <span id="owned1" class="font-mono">0</span></div>
          </div>
          <button id="buy1"
                  class="shrink-0 px-5 py-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 
                         transition-colors rounded-2xl text-sm font-medium flex items-center gap-x-1.5">
            <span>购买</span>
            <span id="cost1" class="font-mono text-emerald-200">50</span>
          </button>
        </div>

        <!-- Upgrade 2: 专业摸鱼手套 -->
        <div class="upgrade-card bg-zinc-800 hover:bg-zinc-700 rounded-2xl p-4 mb-2.5 flex items-center justify-between">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-x-2">
              <span class="text-xl">🧤</span>
              <span class="font-medium">专业摸鱼手套</span>
            </div>
            <div class="text-xs text-zinc-400 mt-0.5">点击威力 +1</div>
            <div class="text-[10px] text-amber-400 mt-1">已拥有 <span id="owned2" class="font-mono">0</span></div>
          </div>
          <button id="buy2"
                  class="shrink-0 px-5 py-2 bg-amber-600 hover:bg-amber-500 active:bg-amber-700 
                         transition-colors rounded-2xl text-sm font-medium flex items-center gap-x-1.5">
            <span>购买</span>
            <span id="cost2" class="font-mono text-amber-200">80</span>
          </button>
        </div>

        <!-- Upgrade 3: 超级咸鱼模式 -->
        <div class="upgrade-card bg-zinc-800 hover:bg-zinc-700 rounded-2xl p-4 flex items-center justify-between">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-x-2">
              <span class="text-xl">🚀</span>
              <span class="font-medium">超级咸鱼模式</span>
            </div>
            <div class="text-xs text-zinc-400 mt-0.5">所有收益永久 ×2（一次性）</div>
            <div id="upgrade3-status" class="text-[10px] text-purple-400 mt-1">未激活</div>
          </div>
          <button id="buy3"
                  class="shrink-0 px-5 py-2 bg-purple-600 hover:bg-purple-500 active:bg-purple-700 
                         transition-colors rounded-2xl text-sm font-medium flex items-center gap-x-1.5">
            <span>购买</span>
            <span id="cost3" class="font-mono text-purple-200">300</span>
          </button>
        </div>
      </div>

      <!-- 摸鱼日记 -->
      <div>
        <div class="flex items-center justify-between mb-2 px-1">
          <div class="font-medium flex items-center gap-x-2 text-sm">
            <span>📝</span> 
            <span>摸鱼日记</span>
          </div>
          <button onclick="clearLog()" 
                  class="text-xs px-3 py-1 text-zinc-400 hover:text-zinc-200 transition-colors">清空</button>
        </div>
        <div id="log" 
             class="bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-sm h-28 overflow-y-auto text-zinc-300 space-y-1">
          <!-- 日志内容由JS动态添加 -->
        </div>
      </div>

    </div>

    <!-- Footer tip -->
    <div class="text-center mt-4 text-xs text-zinc-500">
      提示：买了自动升级后可以最小化窗口，让它自己摸鱼～<br>
      玩得开心，但要注意老板哦！
    </div>
  </div>

  <script>
    // Tailwind script
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#10b981');
    }

    // 游戏数据
    let score = 0;
    let clickPower = 1;
    let autoPerSecond = 0;
    let multiplier = 1;
    let totalClicks = 0;

    // 升级数据
    let upgrade1Cost = 50;
    let upgrade1Owned = 0;
    let upgrade2Cost = 80;
    let upgrade2Owned = 0;
    let upgrade3Bought = false;

    const funnyMessages = [
      "啊～好舒服！",
      "继续摸，继续摸！",
      "今天又白摸了一天鱼～",
      "老板在开会，安全！",
      "咸鱼本色不改！",
      "摸鱼使我快乐！",
      "再来一下下～",
      "鱼生巅峰！",
      "偷偷的，嘿嘿",
      "工作？不存在的",
      "舒服到起飞！",
      "又摸到一条大鱼",
      "今天摸鱼任务完成！",
      "咸鱼翻身就靠现在"
    ];

    function randomMessage() {
      return funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
    }

    function updateUI() {
      // 分数
      document.getElementById('score').textContent = Math.floor(score).toLocaleString();
      
      // 统计
      const effectiveClick = Math.floor(clickPower * multiplier);
      const effectiveAuto = Math.floor(autoPerSecond * multiplier);
      
      document.getElementById('click-power').textContent = effectiveClick;
      document.getElementById('auto-per-sec').textContent = effectiveAuto;
      document.getElementById('total-clicks').textContent = totalClicks;

      // 升级拥有数量
      document.getElementById('owned1').textContent = upgrade1Owned;
      document.getElementById('owned2').textContent = upgrade2Owned;

      // 第三个升级状态
      const statusEl = document.getElementById('upgrade3-status');
      if (upgrade3Bought) {
        statusEl.textContent = '已激活 ×2';
        statusEl.className = 'text-[10px] text-emerald-400 mt-1';
        document.getElementById('buy3').disabled = true;
        document.getElementById('buy3').classList.add('opacity-50', 'cursor-not-allowed');
        document.getElementById('buy3').innerHTML = '<span>已拥有</span>';
      }

      // 保存游戏
      saveGame();
    }

    function updateCosts() {
      document.getElementById('cost1').textContent = upgrade1Cost;
      document.getElementById('cost2').textContent = upgrade2Cost;
    }

    function addScore(amount) {
      const gained = Math.floor(amount * multiplier);
      score += gained;
      updateUI();
    }

    function showFloatingText(amount) {
      const container = document.getElementById('btn-container');
      const floatEl = document.createElement('div');
      
      floatEl.textContent = `+${Math.floor(amount * multiplier)}`;
      floatEl.className = `floating-text absolute text-emerald-400 font-bold text-3xl pointer-events-none select-none`;
      
      // 随机位置
      const randomX = 45 + Math.random() * 20;
      floatEl.style.left = `${randomX}%`;
      floatEl.style.top = `25%`;
      
      container.appendChild(floatEl);
      
      setTimeout(() => {
        floatEl.style.transition = 'all 0.85s cubic-bezier(0.4, 0, 1, 1)';
        floatEl.style.transform = 'translateY(-75px)';
        floatEl.style.opacity = '0';
      }, 20);
      
      setTimeout(() => {
        floatEl.remove();
      }, 950);
    }

    function addLogMessage(msg) {
      const logContainer = document.getElementById('log');
      
      // 最多保留 8 条
      while (logContainer.children.length >= 8) {
        logContainer.removeChild(logContainer.firstChild);
      }
      
      const item = document.createElement('div');
      item.className = 'log-item text-xs flex items-start gap-x-2 text-zinc-300';
      item.innerHTML = `
        <span class="text-emerald-400 mt-0.5">•</span>
        <span>${msg}</span>
      `;
      
      logContainer.appendChild(item);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    // 购买小鱼助手
    function buyUpgrade1() {
      if (score >= upgrade1Cost) {
        score -= upgrade1Cost;
        autoPerSecond += 1;
        upgrade1Owned++;
        upgrade1Cost = Math.max(15, Math.floor(upgrade1Cost * 1.18));
        
        addLogMessage("招募了一条小鱼助手！🐠");
        updateUI();
        updateCosts();
      } else {
        const btn = document.getElementById('buy1');
        btn.classList.add('!bg-red-500');
        setTimeout(() => btn.classList.remove('!bg-red-500'), 600);
      }
    }

    // 购买摸鱼手套
    function buyUpgrade2() {
      if (score >= upgrade2Cost) {
        score -= upgrade2Cost;
        clickPower += 1;
        upgrade2Owned++;
        upgrade2Cost = Math.max(25, Math.floor(upgrade2Cost * 1.18));
        
        addLogMessage("摸鱼手感更好了！🧤");
        updateUI();
        updateCosts();
      } else {
        const btn = document.getElementById('buy2');
        btn.classList.add('!bg-red-500');
        setTimeout(() => btn.classList.remove('!bg-red-500'), 600);
      }
    }

    // 购买超级咸鱼模式（一次性）
    function buyUpgrade3() {
      if (upgrade3Bought) return;
      
      if (score >= 300) {
        score -= 300;
        multiplier = 2;
        upgrade3Bought = true;
        
        addLogMessage("🚀 超级咸鱼模式启动！所有收益翻倍！");
        updateUI();
        updateCosts();
      } else {
        const btn = document.getElementById('buy3');
        btn.classList.add('!bg-red-500');
        setTimeout(() => btn.classList.remove('!bg-red-500'), 600);
      }
    }

    function saveGame() {
      const data = {
        score,
        clickPower,
        autoPerSecond,
        multiplier,
        totalClicks,
        upgrade1Cost,
        upgrade1Owned,
        upgrade2Cost,
        upgrade2Owned,
        upgrade3Bought
      };
      localStorage.setItem('moyuGameSave', JSON.stringify(data));
    }

    function loadGame() {
      const saved = localStorage.getItem('moyuGameSave');
      if (!saved) return;

      try {
        const d = JSON.parse(saved);
        score = d.score || 0;
        clickPower = d.clickPower || 1;
        autoPerSecond = d.autoPerSecond || 0;
        multiplier = d.multiplier || 1;
        totalClicks = d.totalClicks || 0;
        upgrade1Cost = d.upgrade1Cost || 50;
        upgrade1Owned = d.upgrade1Owned || 0;
        upgrade2Cost = d.upgrade2Cost || 80;
        upgrade2Owned = d.upgrade2Owned || 0;
        upgrade3Bought = d.upgrade3Bought || false;
      } catch (e) {
        console.log('读取存档失败');
      }
    }

    function initGame() {
      initTailwind();
      loadGame();

      // 初始日志
      const log = document.getElementById('log');
      log.innerHTML = `<div class="text-xs text-zinc-500 px-1">今天也要快乐摸鱼哦～</div>`;

      // 绑定大按钮
      const btn = document.getElementById('moyu-btn');
      btn.addEventListener('click', () => {
        const gained = clickPower;
        addScore(gained);
        totalClicks++;
        
        showFloatingText(gained);
        
        // 随机添加日记（避免太频繁）
        if (Math.random() < 0.75) {
          addLogMessage(randomMessage());
        }
        
        updateUI();
      });

      // 绑定升级按钮
      document.getElementById('buy1').addEventListener('click', buyUpgrade1);
      document.getElementById('buy2').addEventListener('click', buyUpgrade2);
      document.getElementById('buy3').addEventListener('click', buyUpgrade3);

      // 自动摸鱼（每秒）
      setInterval(() => {
        if (autoPerSecond > 0) {
          const gained = autoPerSecond * multiplier;
          score += gained;
          updateUI();
        }
      }, 1000);

      // 初始更新界面
      updateUI();
      updateCosts();

      // 欢迎提示
      setTimeout(() => {
        if (score === 0 && totalClicks === 0) {
          addLogMessage("快点我摸鱼吧！🐟");
        }
      }, 1200);

      // 控制台彩蛋
      console.log('%c[摸鱼小游戏] 宝贝专属版本加载完成～', 'color:#64748b');
    }

    // 启动游戏
    window.onload = initGame;
  </script>
</body>
</html>
