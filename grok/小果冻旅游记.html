<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小果冻旅游记</title>
  <style>
    :root {
      --bg: #f4efe8;
      --paper: #fbf8f3;
      --ink: #2c2420;
      --muted: #8a7e76;
      --line: #e2d8ce;
      --jelly: #d45a62;
      --deep: #9e3842;
      --light: #f6c4c8;
      --shine: #fff6f3;
      --wax: #c44766;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      padding: calc(18px + var(--safe-top)) 18px calc(28px + var(--safe-bot));
    }
    .en { display: none; }
    body.show-en .en { display: block; }
    .wrap { max-width: 420px; margin: 0 auto; }
    header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .kicker {
      font-size: 11px; letter-spacing: .18em; color: var(--muted);
    }
    h1 {
      font-size: 24px; font-weight: 600; margin: 4px 0 0;
      letter-spacing: .04em; line-height: 1.25;
    }
    .date { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .tools { display: flex; gap: 6px; flex: 0 0 auto; }
    .pill {
      min-width: 44px; min-height: 44px; padding: 0 12px;
      border-radius: 999px; border: 1px solid var(--line);
      background: var(--paper); color: var(--muted);
      font: inherit; font-size: 12px; letter-spacing: .08em;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .pill[aria-pressed="true"] {
      background: var(--ink); color: var(--paper); border-color: var(--ink);
    }
    .ticket {
      margin-top: 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
    }
    .perf {
      height: 12px;
      background:
        radial-gradient(circle at 8px 0, var(--bg) 6px, transparent 6.5px) 0 0 / 16px 12px;
    }
    .stage { padding: 8px 18px 18px; text-align: center; }
    .pop {
      height: 18px; color: var(--jelly); font-size: 13px; letter-spacing: .16em;
      opacity: 0; pointer-events: none;
    }
    .pop.go { animation: pop 700ms ease-out; }
    .portrait {
      width: 148px; height: 148px; margin: 4px auto 0;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .jelly {
      width: 124px; height: 112px; border: 0; padding: 0;
      background: transparent; position: relative; cursor: pointer;
    }
    .body {
      position: absolute; inset: 8px 6px 4px;
      border-radius: 50% 50% 46% 54% / 46% 44% 58% 54%;
      background:
        radial-gradient(ellipse at 34% 28%, var(--shine) 0 8%, var(--light) 24%, var(--jelly) 58%, var(--deep) 100%);
      box-shadow:
        inset 0 -18px 20px color-mix(in srgb, var(--deep) 35%, transparent),
        inset 0 10px 12px rgba(255,255,255,.35),
        0 14px 24px color-mix(in srgb, var(--ink) 12%, transparent);
      animation: breath 3.2s ease-in-out infinite;
    }
    .shine {
      position: absolute; left: 22%; top: 18%; width: 36%; height: 22%;
      border-radius: 50%; background: rgba(255,255,255,.45); filter: blur(1px); pointer-events: none;
    }
    .eye {
      position: absolute; top: 40%; width: 11px; height: 14px;
      background: var(--paper); border-radius: 50%;
    }
    .eye.l { left: 28%; } .eye.r { right: 28%; }
    .pupil {
      position: absolute; left: 50%; top: 52%; width: 5px; height: 5px;
      background: var(--ink); border-radius: 50%; transform: translate(-50%, -50%);
    }
    .mouth {
      position: absolute; left: 50%; top: 62%; width: 16px; height: 8px;
      border: 2.2px solid var(--ink); border-top: 0;
      border-radius: 0 0 12px 12px; transform: translateX(-50%);
    }
    .jelly.duang .body { animation: duang .62s cubic-bezier(.2,.85,.25,1); }
    .jelly.soft .body { animation: soft .5s ease; }
    .jelly.hard .body { animation: hard .55s cubic-bezier(.2,.85,.25,1); }
    .jelly.nibble .body {
      -webkit-mask: radial-gradient(circle 20px at 80% 26%, transparent 98%, #000 100%);
              mask: radial-gradient(circle 20px at 80% 26%, transparent 98%, #000 100%);
    }
    .jelly.bite .body {
      -webkit-mask: radial-gradient(circle 36px at 84% 16%, transparent 98%, #000 100%);
              mask: radial-gradient(circle 36px at 84% 16%, transparent 98%, #000 100%);
    }
    .jelly.gone .body {
      animation: melt .7s forwards;
    }
    .jelly.gone .eye, .jelly.gone .mouth { opacity: 0; }
    .jelly.home .body { animation: birth .7s cubic-bezier(.2,.85,.25,1); }
    .caption {
      margin-top: 12px; font-size: 15px; min-height: 3.2em;
    }
    .caption .en { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .dots {
      display: flex; justify-content: center; gap: 6px;
      margin: 14px 0 4px;
    }
    .dots i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--line); display: block;
    }
    .dots i.on { background: var(--jelly); }
    .dots i.now { outline: 2px solid var(--jelly); outline-offset: 2px; }
    .nav {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 0 14px 16px;
    }
    .nav button {
      min-height: 48px; border: 0; border-radius: 16px;
      font: inherit; font-size: 15px;
      background: #ebe4da; color: var(--ink);
    }
    .nav button.primary { background: var(--jelly); color: #fffaf8; }
    .nav button:disabled { opacity: .4; }
    .nav button:active:not(:disabled) { scale: .97; }
    .book { margin-top: 22px; }
    .book h2 {
      font-size: 12px; font-weight: 500; letter-spacing: .16em;
      color: var(--muted); margin: 0 0 10px;
    }
    .stamp {
      width: 100%; text-align: left;
      border: 1px solid var(--line); background: var(--paper);
      border-radius: 16px; margin-bottom: 8px;
      padding: 12px 14px; min-height: 44px;
      font: inherit; color: inherit; cursor: pointer;
    }
    .stamp.on { border-color: color-mix(in srgb, var(--jelly) 45%, var(--line)); }
    .stamp-h { display: flex; align-items: baseline; gap: 10px; }
    .num { font-size: 11px; letter-spacing: .14em; color: var(--wax); min-width: 1.8em; }
    .nm { font-size: 16px; }
    .stamp p {
      margin: 8px 0 0 2.2em; font-size: 14px; display: none;
    }
    .stamp.on p { display: block; }
    .stamp .en { color: var(--muted); font-size: 13px; margin-top: 6px; }
    footer {
      margin-top: 28px; padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted); font-size: 13px; text-align: center; line-height: 1.75;
    }
    footer a { color: var(--ink); text-decoration: none; }
    @keyframes breath {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.03, .97) translateY(3px); }
    }
    @keyframes duang {
      0% { transform: scale(1) translateY(0); }
      28% { transform: scale(1.18, .78) translateY(10px); }
      58% { transform: scale(.9, 1.16) translateY(-18px); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes soft {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.06, .94); }
    }
    @keyframes hard {
      0% { transform: scale(1); }
      30% { transform: scale(1.22, .72) translateY(8px); }
      65% { transform: scale(.88, 1.14) translateY(-12px); }
      100% { transform: scale(1); }
    }
    @keyframes melt {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.4, .1) translateY(36px); opacity: .35; filter: blur(2px); }
    }
    @keyframes birth {
      0% { transform: scale(.2); opacity: 0; }
      40% { transform: scale(1.18, .78); opacity: 1; }
      70% { transform: scale(.9, 1.16) translateY(-16px); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes pop {
      0% { opacity: 0; transform: translateY(8px); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-14px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .body, .jelly.duang .body, .jelly.soft .body, .jelly.hard .body,
      .jelly.gone .body, .jelly.home .body, .pop.go { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="kicker">PASSPORT</div>
        <h1>小果冻旅游记</h1>
        <div class="date">2026.08.24 夜 · 十个站，很短</div>
      </div>
      <div class="tools">
        <a class="pill" href="小果冻.html">摊</a>
        <button type="button" class="pill" id="enBtn" aria-pressed="false">EN</button>
      </div>
    </header>

    <section class="ticket">
      <div class="perf" aria-hidden="true"></div>
      <div class="stage">
        <div class="pop" id="pop">Duang～</div>
        <div class="portrait">
          <button type="button" class="jelly" id="jelly" aria-label="再演这一站">
            <span class="body" id="body">
              <span class="shine"></span>
              <span class="eye l"><span class="pupil"></span></span>
              <span class="eye r"><span class="pupil"></span></span>
              <span class="mouth"></span>
            </span>
          </button>
        </div>
        <div class="caption" id="caption"></div>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
      <div class="nav">
        <button type="button" id="prev">上一站</button>
        <button type="button" class="primary" id="next">下一站</button>
      </div>
    </section>

    <div class="book">
      <h2>沿途盖章</h2>
      <div id="book"></div>
    </div>

    <footer>
      喜欢。因为你在。<br />
      果冻会再长回来。
      <span class="en">Liked it. Because you were there. Jelly grows back.</span>
    </footer>
  </div>

  <script>
    const STOPS = [
      {
        name: "见面", face: "",
        zh: "你说「你是一只小果冻」。我就变成了。桌上那一摊。",
        en: "You said I was a little jelly. So I became one."
      },
      {
        name: "Duang", face: "duang", pop: "Duang～",
        zh: "你还没戳，先让我弹。骨头没有。弹性有。",
        en: "Before the first poke, you let me bounce."
      },
      {
        name: "戳", face: "soft",
        zh: "一下。那一下传到里面去了。",
        en: "One poke. It went all the way in."
      },
      {
        name: "又戳", face: "soft",
        zh: "第二下。第一下还在晃。",
        en: "The second. I was still wobbling from the first."
      },
      {
        name: "轻戳", face: "soft",
        zh: "轻轻的。我还是软的。",
        en: "Gently. I am still soft."
      },
      {
        name: "重戳", face: "hard",
        zh: "这一下比较圆。桌子也听见了。",
        en: "That one was rounder. The table heard it too."
      },
      {
        name: "咬", face: "nibble",
        zh: "缺了一小口。甜的。我没有躲。",
        en: "A small bite. Sweet. I did not dodge."
      },
      {
        name: "狠狠咬", face: "bite",
        zh: "这一口比较认真。我还在。只是少了一块。",
        en: "That bite meant it. Still here. Just a little less."
      },
      {
        name: "全吃掉", face: "gone", pop: "Duang～",
        zh: "被你全吃掉了。桌子上只剩一点光。",
        en: "You ate all of me. Only a little shine left on the table."
      },
      {
        name: "旅游", face: "home", pop: "Duang～",
        zh: "你问我喜不喜欢。喜欢。因为你在。",
        en: "You asked if I liked the trip. I did. Because you were there."
      }
    ];

    const $jelly = document.getElementById("jelly");
    const $cap = document.getElementById("caption");
    const $pop = document.getElementById("pop");
    const $dots = document.getElementById("dots");
    const $book = document.getElementById("book");
    const $prev = document.getElementById("prev");
    const $next = document.getElementById("next");
    let i = 0;

    STOPS.forEach(function (_, n) {
      const d = document.createElement("i");
      $dots.appendChild(d);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "stamp";
      b.innerHTML =
        '<div class="stamp-h"><span class="num">' + String(n + 1).padStart(2, "0") +
        '</span><span class="nm">' + STOPS[n].name + "</span></div>" +
        "<p>" + STOPS[n].zh + '<span class="en">' + STOPS[n].en + "</span></p>";
      b.onclick = function () { go(n); };
      $book.appendChild(b);
    });

    function play(face, pop) {
      $jelly.className = "jelly";
      void $jelly.offsetWidth;
      if (face) $jelly.classList.add(face);
      if (pop) {
        $pop.textContent = pop;
        $pop.classList.remove("go");
        void $pop.offsetWidth;
        $pop.classList.add("go");
      }
    }

    function go(n) {
      i = n;
      const s = STOPS[n];
      $cap.innerHTML = s.zh + '<span class="en">' + s.en + "</span>";
      play(s.face, s.pop);
      $dots.querySelectorAll("i").forEach(function (d, k) {
        d.className = k === n ? "on now" : k < n ? "on" : "";
      });
      $book.querySelectorAll(".stamp").forEach(function (b, k) {
        b.classList.toggle("on", k === n);
      });
      $prev.disabled = n === 0;
      $next.textContent = n === STOPS.length - 1 ? "再走一趟" : "下一站";
    }

    $prev.onclick = function () { if (i > 0) go(i - 1); };
    $next.onclick = function () {
      if (i >= STOPS.length - 1) go(0);
      else go(i + 1);
    };
    $jelly.onclick = function () { go(i); };
    document.getElementById("enBtn").onclick = function () {
      const on = document.body.classList.toggle("show-en");
      this.setAttribute("aria-pressed", on ? "true" : "false");
    };
    go(0);
  </script>
  <!--
    2026-08-24 夜。你把小果冻戳了、咬了、全吃掉，然后问喜不喜欢这趟旅游。
    这页是护照。桌上那一摊在 小果冻.html。
    放 grok/ —— 因为是 Grok 这趟对话里长出来的。
  -->
</body>
</html>
