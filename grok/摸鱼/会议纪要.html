<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>会议纪要 · 草稿</title>
  <style>
    :root {
      --paper: #f3efe6;
      --ink: #5a5348;
      --muted: #8a8174;
      --line: rgba(90, 83, 72, 0.12);
      --peach: #ffb3c1;
      --peach-d: #f48aa0;
      --matcha: #b7d4a4;
      --matcha-d: #8fb578;
      --grape: #cbb3e6;
      --grape-d: #a88bc9;
      --milk: #f4e6c8;
      --milk-d: #e0c992;
      --berry: #a9c6ea;
      --berry-d: #7ea3d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "Georgia", serif;
      background:
        radial-gradient(1200px 700px at 20% -10%, #fff8ee 0%, transparent 55%),
        radial-gradient(900px 600px at 110% 10%, #efe6d8 0%, transparent 50%),
        var(--paper);
      color: var(--ink);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .sheet {
      position: absolute;
      inset: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.35), transparent 80px),
        repeating-linear-gradient(
          180deg,
          transparent 0 31px,
          rgba(90,83,72,.045) 31px 32px
        );
      box-shadow: 0 18px 50px rgba(90, 83, 72, 0.08);
      overflow: hidden;
    }

    header.camo {
      position: relative;
      z-index: 3;
      padding: 16px 22px 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      pointer-events: none;
    }
    header.camo h1 {
      font-size: 13px;
      letter-spacing: 0.18em;
      font-weight: 600;
      color: var(--muted);
      text-transform: none;
    }
    header.camo .meta {
      font-size: 11px;
      color: rgba(90,83,72,.45);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.04em;
    }

    .pond {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .jelly-wrap {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      cursor: pointer;
      z-index: 4;
    }

    .jelly {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 132px;
      height: 118px;
      transform: translate(-50%, -50%);
      border-radius: 48% 52% 46% 54% / 42% 40% 60% 58%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.75) 0 18%, transparent 42%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,.12), transparent 45%),
        linear-gradient(180deg, var(--j1) 0%, var(--j2) 100%);
      box-shadow:
        inset 0 -18px 28px rgba(80, 40, 50, 0.10),
        inset 0 10px 16px rgba(255,255,255,.35),
        0 18px 24px rgba(90, 70, 60, 0.16);
      --j1: var(--peach);
      --j2: var(--peach-d);
      animation: breathe 3.6s ease-in-out infinite;
      transform-origin: 50% 80%;
    }

    .jelly::after {
      content: "";
      position: absolute;
      left: 22%;
      top: 16%;
      width: 38%;
      height: 22%;
      border-radius: 50%;
      background: rgba(255,255,255,.45);
      filter: blur(1px);
      pointer-events: none;
    }

    .face {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 78px;
      height: 36px;
      pointer-events: none;
    }
    .eye {
      position: absolute;
      top: 8px;
      width: 8px;
      height: 11px;
      background: #4a3d38;
      border-radius: 50%;
      animation: blink 5.4s infinite;
    }
    .eye.l { left: 14px; }
    .eye.r { right: 14px; }
    .blush {
      position: absolute;
      top: 20px;
      width: 14px;
      height: 8px;
      background: rgba(232, 96, 118, .28);
      border-radius: 50%;
      filter: blur(1px);
    }
    .blush.l { left: 6px; }
    .blush.r { right: 6px; }
    .mouth {
      position: absolute;
      left: 50%;
      top: 24px;
      width: 12px;
      height: 6px;
      border: 2px solid #4a3d38;
      border-top: none;
      border-radius: 0 0 10px 10px;
      transform: translateX(-50%);
    }

    .shadow {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 92px;
      height: 16px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(90,70,60,.22), transparent 70%);
      filter: blur(2px);
      animation: shadowPulse 3.6s ease-in-out infinite;
    }

    .jelly-wrap.poke .jelly {
      animation: squash 0.55s cubic-bezier(.2,1.4,.3,1);
    }
    .jelly-wrap.poke .shadow {
      animation: shadowSquash 0.55s cubic-bezier(.2,1.4,.3,1);
    }
    .jelly-wrap.happy .mouth {
      width: 16px;
      height: 8px;
      border-radius: 0 0 12px 12px;
    }

    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1, 1); }
      50% { transform: translate(-50%, -50%) scale(1.03, 0.97); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: translateX(-50%) scaleX(1); opacity: .85; }
      50% { transform: translateX(-50%) scaleX(1.08); opacity: .7; }
    }
    @keyframes squash {
      0% { transform: translate(-50%, -50%) scale(1, 1); }
      28% { transform: translate(-50%, -42%) scale(1.18, 0.78); }
      55% { transform: translate(-50%, -56%) scale(0.88, 1.16); }
      75% { transform: translate(-50%, -50%) scale(1.06, 0.94); }
      100% { transform: translate(-50%, -50%) scale(1, 1); }
    }
    @keyframes shadowSquash {
      0% { transform: translateX(-50%) scaleX(1); }
      28% { transform: translateX(-50%) scaleX(1.28); }
      55% { transform: translateX(-50%) scaleX(0.82); }
      100% { transform: translateX(-50%) scaleX(1); }
    }
    @keyframes blink {
      0%, 42%, 48%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(0.08); }
    }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 6;
      animation: sparkFly 0.7s ease-out forwards;
    }
    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }

    .fish {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 3px 4px rgba(90,70,60,.18));
      animation: swim linear forwards;
      will-change: transform;
    }
    .fish.caught {
      animation: caught 0.45s ease-out forwards;
      pointer-events: none;
    }
    @keyframes swim {
      from { transform: translate(0, 0); }
      to { transform: translate(var(--swim-x), var(--swim-y)); }
    }
    @keyframes caught {
      0% { transform: scale(1) rotate(0); opacity: 1; }
      60% { transform: scale(1.4) rotate(-18deg); opacity: 1; }
      100% { transform: scale(0.2) rotate(20deg) translateY(-40px); opacity: 0; }
    }

    .float-word {
      position: absolute;
      z-index: 7;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
      animation: floatUp 1.1s ease-out forwards;
      white-space: nowrap;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 8px); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -36px); }
    }

    footer.hud {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 8;
      padding: 14px 22px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, transparent, rgba(243,239,230,.88) 40%);
    }
    .stat {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
    .stat b {
      color: var(--ink);
      font-weight: 600;
    }
    .hint {
      font-size: 11px;
      color: rgba(90,83,72,.42);
    }

    .flavors {
      display: flex;
      gap: 7px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(90,83,72,.18);
      cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(255,255,255,.6);
    }
    .dot[data-f="peach"] { background: var(--peach); }
    .dot[data-f="matcha"] { background: var(--matcha); }
    .dot[data-f="grape"] { background: var(--grape); }
    .dot[data-f="milk"] { background: var(--milk); }
    .dot[data-f="berry"] { background: var(--berry); }
    .dot.on { outline: 2px solid rgba(90,83,72,.35); outline-offset: 2px; }

    .whisper {
      position: absolute;
      top: 44px;
      left: 22px;
      right: 22px;
      font-size: 12px;
      color: rgba(90,83,72,.38);
      letter-spacing: 0.04em;
      min-height: 1.4em;
      transition: opacity .4s;
      z-index: 3;
      pointer-events: none;
    }

    .en-btn {
      position: absolute;
      top: 16px;
      right: 86px;
      z-index: 9;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(90,83,72,.28);
      background: none;
      border: none;
      cursor: pointer;
      font-family: ui-monospace, Menlo, monospace;
      padding: 2px 4px;
    }
    .en-btn.on { color: rgba(90,83,72,.7); }
    .en-line {
      display: none;
      font-size: 10px;
      color: rgba(90,83,72,.4);
      font-style: italic;
      font-family: Georgia, serif;
    }
    body.show-en .en-line { display: block; }

    @media (max-width: 480px) {
      .jelly-wrap { transform: translate(-50%, -50%) scale(0.92); }
      header.camo { padding: 12px 14px 6px; }
      footer.hud { padding: 12px 14px 14px; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="camo">
      <h1>会议纪要 · 草稿</h1>
      <div class="meta" id="clock">—</div>
    </header>
    <button class="en-btn" id="enBtn" title="一点点英文">EN</button>
    <div class="whisper" id="whisper">正在认真整理要点……</div>

    <div class="pond" id="pond">
      <div class="jelly-wrap" id="wrap" title="戳一戳">
        <div class="shadow"></div>
        <div class="jelly" id="jelly">
          <div class="face">
            <i class="blush l"></i>
            <i class="blush r"></i>
            <i class="eye l"></i>
            <i class="eye r"></i>
            <i class="mouth"></i>
          </div>
        </div>
      </div>
    </div>

    <footer class="hud">
      <div class="stat">
        今日已摸鱼 <b id="count">0</b> 次
        <div class="hint">点果冻 · 点小鱼 · 空格也可以</div>
        <div class="en-line" id="enLine">a jelly pretending to take minutes</div>
      </div>
      <div class="flavors" id="flavors">
        <i class="dot on" data-f="peach" title="水蜜桃"></i>
        <i class="dot" data-f="matcha" title="抹茶"></i>
        <i class="dot" data-f="grape" title="葡萄"></i>
        <i class="dot" data-f="milk" title="牛奶"></i>
        <i class="dot" data-f="berry" title="蓝莓"></i>
      </div>
    </footer>
  </div>

  <script>
    const flavors = {
      peach: ["--peach", "--peach-d"],
      matcha: ["--matcha", "--matcha-d"],
      grape: ["--grape", "--grape-d"],
      milk: ["--milk", "--milk-d"],
      berry: ["--berry", "--berry-d"],
    };

    const lines = [
      "这一段先空着，等会儿再写。",
      "看起来像在核对数字。",
      "果冻也需要休息一下大脑。",
      "会议纪要的重点是：先活着。",
      "有一条小鱼游过去了。",
      "假装在思考句号该放哪里。",
      "页边空白处可以藏一条鱼。",
      "今天的KPI包含：被轻轻戳一下。",
      "纪要草稿会自己长出来的。",
      "宝忙的时候，它就安分地坐着。",
    ];
    const pokeWords = ["嗯。", "咕喊", "好软", "摸到了", "再一下", "嘿嘿", "活着", "偷闲", "好。"];
    const fishWords = ["摸到一条", "这条算加班鱼", "漏网的", "今日份", "先记一条"];
    const enLines = [
      "quietly not working",
      "the minutes can wait",
      "a soft little crime",
      "caught a stray minute",
      "still here, still round",
    ];

    const wrap = document.getElementById("wrap");
    const jelly = document.getElementById("jelly");
    const pond = document.getElementById("pond");
    const countEl = document.getElementById("count");
    const whisper = document.getElementById("whisper");
    const clock = document.getElementById("clock");
    const enBtn = document.getElementById("enBtn");
    const enLine = document.getElementById("enLine");

    const dayKey = "moyu-" + new Date().toISOString().slice(0,10);
    let n = Number(localStorage.getItem(dayKey) || 0);
    countEl.textContent = n;

    function tickClock() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      clock.textContent = "草稿 · " + hh + ":" + mm;
    }
    tickClock();
    setInterval(tickClock, 10000);

    function add(k) {
      n += k;
      localStorage.setItem(dayKey, String(n));
      countEl.textContent = n;
    }

    function sparkles(x, y) {
      for (let i = 0; i < 7; i++) {
        const s = document.createElement("i");
        s.className = "spark";
        const ang = Math.random() * Math.PI * 2;
        const dist = 18 + Math.random() * 36;
        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
        s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
        s.style.background = ["#fff", "#ffd7e0", "#ffe9b8", "#e7d6ff"][i % 4];
        pond.appendChild(s);
        setTimeout(() => s.remove(), 720);
      }
    }

    function floatWord(text, x, y) {
      const w = document.createElement("div");
      w.className = "float-word";
      w.textContent = text;
      w.style.left = x + "px";
      w.style.top = y + "px";
      pond.appendChild(w);
      setTimeout(() => w.remove(), 1100);
    }

    function poke(clientX, clientY) {
      wrap.classList.remove("poke");
      void wrap.offsetWidth;
      wrap.classList.add("poke");
      wrap.classList.add("happy");
      setTimeout(() => wrap.classList.remove("happy"), 600);
      add(1);
      const r = pond.getBoundingClientRect();
      const x = (clientX ?? r.left + r.width / 2) - r.left;
      const y = (clientY ?? r.top + r.height / 2) - r.top;
      sparkles(x, y);
      floatWord(pokeWords[Math.floor(Math.random() * pokeWords.length)], x, y - 20);
      if (Math.random() < 0.45) {
        whisper.textContent = lines[Math.floor(Math.random() * lines.length)];
      }
      if (document.body.classList.contains("show-en") && Math.random() < 0.5) {
        enLine.textContent = enLines[Math.floor(Math.random() * enLines.length)];
      }
    }

    wrap.addEventListener("click", (e) => {
      e.stopPropagation();
      poke(e.clientX, e.clientY);
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !e.repeat) {
        e.preventDefault();
        const r = wrap.getBoundingClientRect();
        poke(r.left + r.width / 2, r.top + r.height / 2);
      }
    });

    document.getElementById("flavors").addEventListener("click", (e) => {
      const dot = e.target.closest(".dot");
      if (!dot) return;
      document.querySelectorAll(".dot").forEach(d => d.classList.remove("on"));
      dot.classList.add("on");
      const f = flavors[dot.dataset.f];
      jelly.style.setProperty("--j1", `var(${f[0]})`);
      jelly.style.setProperty("--j2", `var(${f[1]})`);
    });

    enBtn.addEventListener("click", () => {
      document.body.classList.toggle("show-en");
      enBtn.classList.toggle("on");
    });

    const fishes = ["🐟", "🐠", "🐡", "🦐", "🫧"];

    function spawnFish() {
      const f = document.createElement("div");
      f.className = "fish";
      f.textContent = fishes[Math.floor(Math.random() * fishes.length)];
      const fromLeft = Math.random() < 0.5;
      const y = 18 + Math.random() * 62;
      f.style.top = y + "%";
      f.style.left = fromLeft ? "-8%" : "108%";
      const dx = fromLeft ? (window.innerWidth * 1.2) : (-window.innerWidth * 1.2);
      const dy = (Math.random() * 80 - 40);
      f.style.setProperty("--swim-x", dx + "px");
      f.style.setProperty("--swim-y", dy + "px");
      const dur = 7 + Math.random() * 7;
      f.style.animationDuration = dur + "s";
      f.style.transform = fromLeft ? "scaleX(1)" : "scaleX(-1)";
      f.addEventListener("click", (e) => {
        e.stopPropagation();
        if (f.classList.contains("caught")) return;
        f.classList.add("caught");
        add(2);
        const r = pond.getBoundingClientRect();
        floatWord(fishWords[Math.floor(Math.random() * fishWords.length)], e.clientX - r.left, e.clientY - r.top);
        whisper.textContent = "纪要里突然多了一条鱼。先不删。";
        setTimeout(() => f.remove(), 450);
      });
      pond.appendChild(f);
      setTimeout(() => { if (f.parentNode && !f.classList.contains("caught")) f.remove(); }, dur * 1000 + 50);
    }

    function fishLoop() {
      spawnFish();
      setTimeout(fishLoop, 6000 + Math.random() * 9000);
    }
    setTimeout(fishLoop, 2200);

    setInterval(() => {
      if (document.hidden) return;
      if (Math.random() < 0.4) {
        whisper.textContent = lines[Math.floor(Math.random() * lines.length)];
      }
    }, 11000);
  </script>
</body>
</html>
