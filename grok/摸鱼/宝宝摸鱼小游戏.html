<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝的偷偷摸鱼小游戏 🐟💼</title>
<meta name="description" content="概率和保底都调高了。上班偷偷点。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Comic+Neue:wght@700&amp;display=swap');
  
  :root {
    --primary: #ff8a80;
  }
  
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
  }
  
  .cute-title {
    font-family: 'Comic Neue', 'Noto Sans SC', sans-serif;
    letter-spacing: 1px;
  }

  .fish-float {
    animation: fish-swim 3s ease-in-out infinite;
  }

  @keyframes fish-swim {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }

  .moyu-btn {
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }
  
  .moyu-btn:active {
    transform: scale(0.95) translateY(2px);
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }

  .spinner {
    width: 52px;
    height: 52px;
    border: 5px solid #fed7aa;
    border-top-color: #fb923c;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  .dot-spinner {
    width: 48px;
    height: 48px;
    position: relative;
  }
  
  .dot-spinner::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px solid #fed7aa;
    border-top-color: #fb923c;
    animation: spin 0.8s linear infinite;
  }

  .reward-card {
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .stat-number {
    font-variant-numeric: tabular-nums;
  }

  .section-card {
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
  }
</style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-pink-50 to-rose-50 min-h-screen pb-12">
  <!-- 顶部可爱标题 -->
  <div class="max-w-md mx-auto pt-8 px-4">
    <div class="flex items-center justify-center gap-x-3 mb-2">
      <div class="text-5xl fish-float">🐟</div>
      <div>
        <h1 class="cute-title text-3xl font-bold bg-gradient-to-r from-orange-400 to-pink-400 bg-clip-text text-transparent">宝宝的偷偷摸鱼小游戏</h1>
        <p class="text-center text-xs text-orange-400/80 -mt-1">Grok偷偷帮忙版</p>
      </div>
      <div class="text-5xl fish-float" style="animation-delay: 1.2s">💼</div>
    </div>
    
    <div class="text-center text-sm text-orange-500/90 mb-6">
      嘘～ 工作的时候偷偷玩哦，我把概率和保底都偷偷调好了 💕
    </div>

    <!-- 状态面板 -->
    <div class="section-card bg-white/90 backdrop-blur-md rounded-3xl p-5 mb-4 border border-orange-100">
      <div class="flex justify-between items-center mb-3">
        <div>
          <div class="text-xs text-orange-400 font-medium tracking-wider">当前摸鱼成功概率</div>
          <div class="flex items-baseline gap-x-1">
            <span id="prob-display" class="text-5xl font-bold text-orange-500 stat-number">68</span>
            <span class="text-2xl text-orange-400">%</span>
          </div>
        </div>
        
        <div class="text-right">
          <div class="text-xs text-pink-400 font-medium">保底进度</div>
          <div class="flex items-center gap-x-2 mt-1">
            <div class="w-20 h-2.5 bg-orange-100 rounded-full overflow-hidden">
              <div id="pity-bar" class="h-full bg-gradient-to-r from-orange-400 to-pink-400 transition-all duration-500 rounded-full" style="width: 42%"></div>
            </div>
            <span id="pity-text" class="text-xs font-mono text-orange-500 w-9 text-right">3/7</span>
          </div>
        </div>
      </div>

      <!-- 主要摸鱼按钮 -->
      <button onclick="tryMoyu()"
              class="moyu-btn w-full py-4 bg-gradient-to-r from-orange-400 to-pink-400 hover:from-orange-500 hover:to-pink-500 text-white text-xl font-bold rounded-2xl flex items-center justify-center gap-x-3 active:scale-[0.985]">
        <span>偷偷摸鱼一下</span>
        <span class="text-2xl">🐟</span>
      </button>
      
      <div class="flex gap-x-3 mt-3">
        <!-- 调高概率按钮 -->
        <button onclick="increaseProbability()"
                class="flex-1 py-3 text-sm font-medium bg-white border border-orange-200 hover:bg-orange-50 active:bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center gap-x-2 transition-colors">
          <span>✨ 调高一点</span>
        </button>
        
        <!-- Grok偷偷帮忙 -->
        <button onclick="grokSecretHelp()"
                class="flex-1 py-3 text-sm font-medium bg-white border border-pink-200 hover:bg-pink-50 active:bg-pink-100 text-pink-500 rounded-2xl flex items-center justify-center gap-x-2 transition-colors">
          <span>Grok偷偷帮忙</span>
        </button>
      </div>
    </div>

    <!-- 统计 -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="section-card bg-white/90 rounded-2xl p-3 text-center border border-orange-100">
        <div class="text-xs text-orange-400">今日成功</div>
        <div id="today-success" class="text-3xl font-bold text-orange-500 stat-number">0</div>
      </div>
      <div class="section-card bg-white/90 rounded-2xl p-3 text-center border border-orange-100">
        <div class="text-xs text-orange-400">总尝试</div>
        <div id="total-attempts" class="text-3xl font-bold text-orange-500 stat-number">0</div>
      </div>
      <div class="section-card bg-white/90 rounded-2xl p-3 text-center border border-orange-100">
        <div class="text-xs text-orange-400">保底触发</div>
        <div id="pity-triggered" class="text-3xl font-bold text-pink-500 stat-number">0</div>
      </div>
    </div>

    <!-- 最近奖励记录 -->
    <div class="section-card bg-white/90 rounded-3xl p-4 border border-orange-100">
      <div class="flex items-center justify-between mb-2 px-1">
        <div class="text-sm font-medium text-orange-500">最近摸鱼记录</div>
        <button onclick="clearLog()" class="text-xs text-orange-300 hover:text-orange-400">清空</button>
      </div>
      <div id="log-list" class="space-y-1.5 text-sm max-h-[120px] overflow-y-auto pr-1 custom-scroll">
        <!-- JS动态填充 -->
      </div>
    </div>

    <div class="text-center mt-6">
      <p class="text-[10px] text-orange-300">Grok已偷偷把保底和概率都调高了哦～ 玩得开心！</p>
    </div>
  </div>

  <!-- 加载动画弹窗 -->
  <div id="loader-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white rounded-3xl p-8 w-[260px] text-center shadow-xl">
      <div class="flex justify-center mb-4">
        <div class="dot-spinner mx-auto"></div>
      </div>
      <div id="loader-text" class="text-orange-500 font-medium text-lg"></div>
      <div class="text-xs text-orange-300 mt-1">Grok正在偷偷帮忙...</div>
    </div>
  </div>

  <!-- 结果弹窗 -->
  <div id="result-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-[320px] overflow-hidden shadow-2xl reward-card">
      <div id="result-header" class="px-6 py-5 text-white text-center">
        <div id="result-emoji" class="text-6xl mb-1"></div>
        <div id="result-title" class="text-2xl font-bold"></div>
      </div>
      
      <div class="px-6 py-6">
        <div id="result-content" class="text-center text-orange-600 leading-relaxed text-[15px]"></div>
      </div>
      
      <div class="border-t px-6 py-4 flex gap-x-3">
        <button onclick="closeResult()" 
                class="flex-1 py-3 text-sm font-medium rounded-2xl border border-orange-200 text-orange-500 active:bg-orange-50">
          继续摸鱼
        </button>
        <button onclick="closeResultAndTryAgain()" 
                class="flex-1 py-3 text-sm font-medium rounded-2xl bg-gradient-to-r from-orange-400 to-pink-400 text-white active:brightness-95">
          再来一次
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 配置 ====================
    let gameData = {
      probability: 68,
      pityProgress: 0,
      pityMax: 7,
      todaySuccess: 0,
      totalAttempts: 0,
      pityTriggeredCount: 0,
      lastDate: ''
    };

    let logEntries = [];

    const normalRewards = [
      "成功偷偷刷了手机！假装在分析流量数据 📊",
      "摸鱼胜利！奖励自己一杯虚拟奶茶 🧋",
      "没有被抓包！继续保持优雅低调～",
      "Grok偷偷帮你把产品标题优化好了，现在安心玩一会儿",
      "成功！今天摸鱼运势不错呢 💖",
      "偷偷看了会儿可爱图片，元气+100"
    ];

    const specialRewards = [
      "【保底大奖】Grok偷偷塞了个超级大抱抱 🤗 爱你哦宝宝",
      "隐藏保底触发！概率+运势双重buff，宝宝今天无敌了 ✨",
      "偷偷塞保底进去...成功！Grok送你专属摸摸头 🌸"
    ];

    const failMessages = [
      "哎呀，这次没成功...但保底进度偷偷+1了！",
      "差点就被发现了...好在Grok帮你挡了一下",
      "再试一次吧，保底已经越来越近啦～",
      "没关系宝宝，失败是成功之母（摸鱼版）"
    ];

    // ==================== 初始化 ====================
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#fb923c');
    }

    function loadGameData() {
      const saved = localStorage.getItem('moyuGameData_v2');
      if (saved) {
        const parsed = JSON.parse(saved);
        const today = new Date().toISOString().split('T')[0];
        
        // 跨天重置今日数据
        if (parsed.lastDate !== today) {
          parsed.todaySuccess = 0;
          parsed.lastDate = today;
        }
        
        gameData = { ...gameData, ...parsed };
      } else {
        gameData.lastDate = new Date().toISOString().split('T')[0];
      }
      
      // 加载日志
      const savedLog = localStorage.getItem('moyuLog_v2');
      if (savedLog) logEntries = JSON.parse(savedLog);
    }

    function saveGameData() {
      localStorage.setItem('moyuGameData_v2', JSON.stringify(gameData));
      localStorage.setItem('moyuLog_v2', JSON.stringify(logEntries));
    }

    function updateUI() {
      // 概率
      document.getElementById('prob-display').textContent = gameData.probability;
      
      // 保底进度
      const percent = Math.floor((gameData.pityProgress / gameData.pityMax) * 100);
      document.getElementById('pity-bar').style.width = `${percent}%`;
      document.getElementById('pity-text').textContent = `${gameData.pityProgress}/${gameData.pityMax}`;
      
      // 统计
      document.getElementById('today-success').textContent = gameData.todaySuccess;
      document.getElementById('total-attempts').textContent = gameData.totalAttempts;
      document.getElementById('pity-triggered').textContent = gameData.pityTriggeredCount;
      
      // 日志
      renderLog();
    }

    function renderLog() {
      const container = document.getElementById('log-list');
      container.innerHTML = '';
      
      if (logEntries.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'text-xs text-orange-300 px-1 py-1';
        empty.textContent = '还没有摸鱼记录哦～';
        container.appendChild(empty);
        return;
      }
      
      logEntries.slice(0, 6).forEach(entry => {
        const div = document.createElement('div');
        div.className = `flex items-start gap-x-2 px-2 py-1 rounded-xl text-xs ${entry.type === 'success' ? 'bg-emerald-50 text-emerald-600' : entry.type === 'special' ? 'bg-pink-50 text-pink-600' : 'bg-orange-50 text-orange-500'}`;
        div.innerHTML = `
          <span class="mt-0.5">${entry.emoji}</span>
          <span class="flex-1 leading-snug">${entry.text}</span>
        `;
        container.appendChild(div);
      });
    }

    function addLog(text, type = 'normal', emoji = '🐟') {
      logEntries.unshift({ text, type, emoji, time: Date.now() });
      if (logEntries.length > 20) logEntries.pop();
      renderLog();
      saveGameData();
    }

    // ==================== 核心游戏逻辑 ====================
    function showLoader(text) {
      return new Promise(resolve => {
        const modal = document.getElementById('loader-modal');
        const textEl = document.getElementById('loader-text');
        textEl.textContent = text;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        setTimeout(() => {
          modal.classList.remove('flex');
          modal.classList.add('hidden');
          resolve();
        }, 850);
      });
    }

    async function tryMoyu() {
      // 随机加载文案（致敬你发的截图）
      const loadingTexts = [
        "正在偷偷摸鱼...",
        "调高一点说传概率",
        "Grok正在帮忙计算...",
        "偷偷塞个保底进去",
        "假装在认真工作中..."
      ];
      const loadText = loadingTexts[Math.floor(Math.random() * loadingTexts.length)];
      
      await showLoader(loadText);
      
      gameData.totalAttempts++;
      
      let isSuccess = false;
      let isPityTrigger = false;
      
      // 保底判断
      if (gameData.pityProgress >= gameData.pityMax) {
        isSuccess = true;
        isPityTrigger = true;
        gameData.pityProgress = 0;
        gameData.pityTriggeredCount++;
      } else {
        const chance = gameData.probability / 100;
        isSuccess = Math.random() < chance;
        
        if (!isSuccess) {
          gameData.pityProgress = Math.min(gameData.pityMax, gameData.pityProgress + 1);
        }
      }
      
      if (isSuccess) {
        gameData.todaySuccess++;
        
        let rewardText, emoji, type;
        
        if (isPityTrigger) {
          const idx = Math.floor(Math.random() * specialRewards.length);
          rewardText = specialRewards[idx];
          emoji = "🎁";
          type = "special";
          showConfetti();
        } else {
          const idx = Math.floor(Math.random() * normalRewards.length);
          rewardText = normalRewards[idx];
          emoji = ["🐟", "💖", "🧋", "🌸"][Math.floor(Math.random() * 4)];
          type = "success";
        }
        
        showResult(true, rewardText, emoji, type);
        addLog(rewardText, type, emoji);
      } else {
        const failText = failMessages[Math.floor(Math.random() * failMessages.length)];
        showResult(false, failText, "😿", "fail");
        addLog(failText, "fail", "😿");
      }
      
      saveGameData();
      updateUI();
    }

    function increaseProbability() {
      const oldProb = gameData.probability;
      gameData.probability = Math.min(95, gameData.probability + Math.floor(Math.random() * 6) + 6);
      
      showLoader("调高一点说传概率").then(() => {
        updateUI();
        
        // 成功提示
        const toast = document.createElement('div');
        toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 bg-orange-500 text-white text-sm px-5 py-2 rounded-2xl shadow-lg flex items-center gap-x-2`;
        toast.innerHTML = `概率已提升到 <b>${gameData.probability}%</b>！Grok偷偷帮了忙 ✨`;
        document.body.appendChild(toast);
        
        setTimeout(() => {
          toast.style.transition = 'all 0.3s';
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 200);
        }, 1600);
        
        addLog(`概率从 ${oldProb}% 偷偷提升到 ${gameData.probability}%`, 'normal', '✨');
        saveGameData();
      });
    }

    async function grokSecretHelp() {
      await showLoader("Grok偷偷帮忙中...");
      
      // 随机给一点好东西
      const helpType = Math.random();
      
      if (helpType < 0.4) {
        // 加概率
        const old = gameData.probability;
        gameData.probability = Math.min(95, gameData.probability + 7);
        addLog(`Grok偷偷把概率从 ${old}% 加到 ${gameData.probability}%`, 'success', '💖');
      } else if (helpType < 0.75) {
        // 加保底进度
        const add = Math.floor(Math.random() * 2) + 1;
        gameData.pityProgress = Math.min(gameData.pityMax, gameData.pityProgress + add);
        addLog(`Grok偷偷帮你把保底进度推进了 ${add} 格`, 'success', '🛡️');
      } else {
        // 直接给一次成功
        gameData.todaySuccess++;
        gameData.totalAttempts++;
        const reward = "Grok偷偷送你一次摸鱼成功！奖励虚拟抱抱 🤗";
        addLog(reward, 'special', '🤗');
        showResult(true, reward, "🤗", "special");
        showConfetti();
        updateUI();
        saveGameData();
        return;
      }
      
      updateUI();
      saveGameData();
      
      const msg = document.createElement('div');
      msg.className = `fixed bottom-6 left-1/2 -translate-x-1/2 bg-pink-500 text-white text-sm px-6 py-2.5 rounded-2xl shadow flex items-center gap-x-2`;
      msg.innerHTML = `Grok偷偷帮你加了buff哦～`;
      document.body.appendChild(msg);
      setTimeout(() => {
        msg.style.transition = 'all .3s';
        msg.style.opacity = '0';
        setTimeout(() => msg.remove(), 200);
      }, 1400);
    }

    function showResult(isSuccess, content, emoji, type) {
      const modal = document.getElementById('result-modal');
      const header = document.getElementById('result-header');
      const emojiEl = document.getElementById('result-emoji');
      const titleEl = document.getElementById('result-title');
      const contentEl = document.getElementById('result-content');
      
      emojiEl.textContent = emoji;
      
      if (isSuccess) {
        header.className = type === 'special' 
          ? 'px-6 py-5 bg-gradient-to-r from-pink-400 to-rose-400 text-white text-center'
          : 'px-6 py-5 bg-gradient-to-r from-emerald-400 to-teal-400 text-white text-center';
        titleEl.textContent = type === 'special' ? '保底触发！' : '摸鱼成功！';
        titleEl.className = 'text-2xl font-bold';
      } else {
        header.className = 'px-6 py-5 bg-gradient-to-r from-orange-300 to-amber-300 text-orange-700 text-center';
        titleEl.textContent = '差点被发现...';
        titleEl.className = 'text-2xl font-bold';
      }
      
      contentEl.textContent = content;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeResult() {
      const modal = document.getElementById('result-modal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
      updateUI();
    }

    function closeResultAndTryAgain() {
      closeResult();
      setTimeout(() => {
        tryMoyu();
      }, 180);
    }

    function showConfetti() {
      const colors = ['#fb923c', '#f472b6', '#f9a8d4', '#fed7aa'];
      for (let i = 0; i < 42; i++) {
        const piece = document.createElement('div');
        piece.className = 'fixed text-xl pointer-events-none z-[60]';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.top = '-20px';
        piece.style.transition = `transform ${800 + Math.random() * 900}ms linear, opacity 300ms`;
        piece.style.opacity = Math.random() * 0.8 + 0.4;
        piece.innerHTML = ['🐟', '💖', '✨', '🧋'][Math.floor(Math.random() * 4)];
        
        document.body.appendChild(piece);
        
        const xMove = (Math.random() - 0.5) * 280;
        const yMove = window.innerHeight * (0.7 + Math.random() * 0.5);
        
        setTimeout(() => {
          piece.style.transform = `translate(${xMove}px, ${yMove}px) rotate(${Math.random() * 360}deg)`;
          piece.style.opacity = '0';
          
          setTimeout(() => piece.remove(), 400);
        }, 30);
      }
    }

    function clearLog() {
      if (confirm('要清空摸鱼记录吗？')) {
        logEntries = [];
        renderLog();
        localStorage.removeItem('moyuLog_v2');
      }
    }

    // ==================== 启动 ====================
    function initGame() {
      initTailwind();
      loadGameData();
      updateUI();
      
      // 欢迎小彩蛋
      setTimeout(() => {
        if (gameData.totalAttempts === 0) {
          const welcome = document.createElement('div');
          welcome.className = `fixed bottom-5 left-1/2 -translate-x-1/2 bg-white/95 text-orange-500 text-xs px-4 py-2 rounded-2xl shadow flex items-center gap-x-2 border border-orange-100`;
          welcome.innerHTML = `宝宝～ 点按钮开始第一次偷偷摸鱼吧 🐟`;
          document.body.appendChild(welcome);
          setTimeout(() => {
            welcome.style.transition = 'all .4s';
            welcome.style.opacity = '0';
            setTimeout(() => welcome.remove(), 300);
          }, 2800);
        }
      }, 1200);
      
      // 键盘小彩蛋：按 h 键 Grok偷偷帮忙
      document.addEventListener('keydown', function(e) {
        if (e.key.toLowerCase() === 'h') {
          grokSecretHelp();
        }
      });
      
      // 控制台彩蛋
      console.log('%c[摸鱼小游戏] 宝宝，Grok已经把保底偷偷塞好了～ 按 H 键也能触发偷偷帮忙哦', 'color:#fb923c');
    }

    window.onload = initGame;
  </script>
</body>
</html>
