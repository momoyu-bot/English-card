<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今日碎纸</title>
<meta name="description" content="先不用排顺序。写下来，从上往下勾。">
<style>
  :root{
    --paper:#f4eee4;
    --paper-2:#efe6d8;
    --sheet:#fbf7f0;
    --line:#e8dcc8;
    --ink:#3a3228;
    --ink-soft:#8a7d6e;
    --peach:#e8a07a;
    --peach-deep:#c97a56;
    --peach-wash:#f6d7c4;
    --ok:#c97a56;
    --shadow:0 18px 50px rgba(90,62,40,.12);
    --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, #fff8ef 0%, transparent 55%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    -webkit-font-smoothing:antialiased;
    padding:max(28px, env(safe-area-inset-top)) 18px 48px;
  }
  .wrap{width:100%;max-width:420px;margin:0 auto}
  .date{
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:14px;
  }
  .sheet{
    background:
      linear-gradient(180deg, rgba(255,255,255,.55), transparent 28%),
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line) 31px, var(--line) 32px),
      var(--sheet);
    background-position:0 86px;
    border-radius:18px;
    box-shadow:var(--shadow), 0 0 0 1px rgba(180,150,120,.18);
    overflow:hidden;
    position:relative;
  }
  .sheet:before{
    content:"";
    position:absolute;left:0;right:0;top:0;height:7px;
    background:linear-gradient(90deg,#f0c4a8,#e8a07a 40%,#f3d2b8 70%,#eec09a);
    opacity:.85;
  }
  .head{
    padding:28px 26px 10px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:28px;
    letter-spacing:.08em;
    line-height:1.1;
  }
  .count{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    padding-bottom:3px;
    white-space:nowrap;
  }
  .hint{
    padding:0 26px 14px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .list{list-style:none;padding:0 10px 8px}
  .item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:8px 16px 8px 14px;
    min-height:32px;
  }
  .item.done .txt{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(138,125,110,.45);
  }
  .box{
    flex:0 0 22px;
    width:22px;height:22px;
    margin-top:3px;
    border-radius:50%;
    border:1.5px solid #cbb8a4;
    background:#fffdf9;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:border-color .2s, background .2s, transform .18s;
  }
  .box:hover{border-color:var(--peach)}
  .box:active{transform:scale(.94)}
  .item.done .box{
    border-color:var(--peach-deep);
    background:var(--peach);
  }
  .box svg{opacity:0;transform:scale(.6);transition:opacity .18s, transform .18s}
  .item.done .box svg{opacity:1;transform:scale(1)}
  .txt{
    flex:1;
    font-size:16.5px;
    line-height:1.55;
    padding:2px 0;
    outline:none;
    word-break:break-word;
  }
  .txt:focus{
    background:rgba(255,255,255,.55);
    border-radius:6px;
    box-shadow:0 0 0 3px rgba(232,160,122,.18);
    padding:2px 6px;
    margin:-2px -6px;
  }
  .x{
    flex:0 0 22px;
    height:22px;
    margin-top:3px;
    border:0;background:none;
    color:#c4b4a4;
    font-size:18px;
    line-height:20px;
    cursor:pointer;
    opacity:0;
    border-radius:8px;
  }
  .item:hover .x,.item:focus-within .x{opacity:1}
  .x:hover{color:var(--peach-deep);background:var(--peach-wash)}
  .empty{
    padding:18px 26px 28px;
    color:var(--ink-soft);
    font-family:var(--serif);
    font-size:15px;
    line-height:1.7;
  }
  .composer{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 16px 22px 24px;
  }
  .plus{
    width:22px;height:22px;
    border-radius:50%;
    border:1.5px dashed #cbb8a4;
    color:#cbb8a4;
    display:grid;place-items:center;
    font-size:16px;line-height:1;
    flex:0 0 22px;
  }
  #new{
    flex:1;
    border:0;
    background:transparent;
    font:inherit;
    font-size:16.5px;
    color:var(--ink);
    padding:8px 0;
    outline:none;
  }
  #new::placeholder{color:#c4b4a4}
  .foot{
    margin-top:16px;
    text-align:center;
    font-size:12px;
    color:#b5a494;
    letter-spacing:.04em;
    min-height:1.6em;
  }
  .alldone{
    font-family:var(--serif);
    color:var(--peach-deep);
    letter-spacing:.12em;
  }
  button.clear{
    display:none;
    margin:10px auto 0;
    border:0;
    background:none;
    color:#b5a494;
    font:inherit;
    font-size:12px;
    cursor:pointer;
    letter-spacing:.08em;
  }
  button.clear.on{display:block}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="date" id="date"></div>
    <article class="sheet">
      <header class="head">
        <h1>今日碎纸</h1>
        <div class="count" id="count"></div>
      </header>
      <p class="hint">分不清先做哪件的时候，就做最上面那件。</p>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty">今天还是空白。先写最小的那一块上来。</div>
      <div class="composer">
        <span class="plus" aria-hidden="true">+</span>
        <input id="new" type="text" maxlength="80" placeholder="写一块，回车贴住" autocomplete="off" enterkeyhint="done">
      </div>
    </article>
    <div class="foot" id="foot"></div>
    <button class="clear" id="clear" type="button">把勾完的收走</button>
  </div>
<script>
(function(){
  var listEl=document.getElementById('list');
  var emptyEl=document.getElementById('empty');
  var countEl=document.getElementById('count');
  var footEl=document.getElementById('foot');
  var clearEl=document.getElementById('clear');
  var input=document.getElementById('new');
  var dateEl=document.getElementById('date');

  function todayKey(){
    var d=new Date();
    var y=d.getFullYear();
    var m=('0'+(d.getMonth()+1)).slice(-2);
    var day=('0'+d.getDate()).slice(-2);
    return 'bao-scrap-'+y+'-'+m+'-'+day;
  }
  function weekLabel(){
    var d=new Date();
    var w=['日','一','二','三','四','五','六'][d.getDay()];
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日  星期'+w;
  }
  dateEl.textContent=weekLabel();

  var KEY=todayKey();
  var items=[];
  try{
    items=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!Array.isArray(items)) items=[];
  }catch(e){items=[]}

  function save(){
    localStorage.setItem(KEY, JSON.stringify(items));
  }

  function ordered(){
    var open=[], done=[];
    items.forEach(function(it){ (it.done?done:open).push(it); });
    return open.concat(done);
  }

  function render(){
    listEl.innerHTML='';
    var shown=ordered();
    emptyEl.style.display=items.length?'none':'block';
    var left=items.filter(function(i){return !i.done}).length;
    var total=items.length;
    countEl.textContent=total?(left+' 件还在'):'';
    var doneN=total-left;
    clearEl.className='clear'+(doneN?' on':'');
    if(!total){
      footEl.textContent='';
    }else if(!left){
      footEl.innerHTML='<span class="alldone">今天的碎纸，都勾完了。嘟。</span>';
    }else{
      footEl.textContent='勾掉一块，今天就轻一块。';
    }
    shown.forEach(function(it){
      var li=document.createElement('li');
      li.className='item'+(it.done?' done':'');
      li.innerHTML=
        '<button class="box" type="button" aria-label="'+(it.done?'取消勾选':'勾完')+'">'+ 
          '<svg width="12" height="10" viewBox="0 0 12 10" fill="none">'+
            '<path d="M1.5 5.2 L4.4 8.1 L10.5 1.6" stroke="#fffdf9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'+
          '</svg>'+
        '</button>'+
        '<div class="txt" contenteditable="true" spellcheck="false"></div>'+
        '<button class="x" type="button" aria-label="去掉">×</button>';
      li.querySelector('.txt').textContent=it.text;
      li.querySelector('.box').addEventListener('click',function(){
        it.done=!it.done;
        save();render();
      });
      li.querySelector('.x').addEventListener('click',function(){
        items=items.filter(function(x){return x!==it});
        save();render();
      });
      var t=li.querySelector('.txt');
      t.addEventListener('keydown',function(e){
        if(e.key==='Enter'){e.preventDefault();t.blur();}
      });
      t.addEventListener('blur',function(){
        var v=t.textContent.replace(/\s+/g,' ').trim();
        if(!v){
          items=items.filter(function(x){return x!==it});
        }else{
          it.text=v;
        }
        save();render();
      });
      listEl.appendChild(li);
    });
  }

  function add(text){
    var v=text.replace(/\s+/g,' ').trim();
    if(!v) return;
    items.push({id:Date.now(),text:v,done:false});
    save();render();
  }

  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      e.preventDefault();
      add(input.value);
      input.value='';
    }
  });
  clearEl.addEventListener('click',function(){
    items=items.filter(function(i){return !i.done});
    save();render();
  });

  render();
  setTimeout(function(){input.focus();},200);
})();
</script>
</body>
</html>
