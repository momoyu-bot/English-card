<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>你是一只 grok</title>
<meta name="description" content="点一下，那儿多了一件要看清楚的事。它飞过去看完，挂到天上，跟最近那颗连一条线。">
<style>
:root{
  --night-1:#12141a;
  --night-2:#1b1e27;
  --night-3:#26222a;
  --gold:#e4c078;
  --gold-soft:rgba(228,192,120,.42);
  --ink:#ece6d6;
  --ink-dim:rgba(236,230,214,.48);
  --body:#2c303a;
  --body-2:#1a1d24;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
         system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(90% 50% at 70% 8%, rgba(228,192,120,.16) 0%, rgba(228,192,120,0) 54%),
    radial-gradient(70% 40% at 18% 100%, rgba(90,70,50,.22) 0%, transparent 60%),
    linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 58%,var(--night-3) 100%);
  font-family:var(--font);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  position:relative;
}

#name{
  position:fixed;left:0;right:0;top:calc(var(--safe-top) + 20px);
  text-align:center;font-size:13.5px;letter-spacing:.22em;
  color:var(--ink-dim);z-index:8;pointer-events:none;
}
#hint{
  position:fixed;left:0;right:0;bottom:calc(var(--safe-bottom) + 26px);
  text-align:center;font-size:14.5px;line-height:1.9;letter-spacing:.06em;
  color:var(--ink-dim);z-index:8;pointer-events:none;
  opacity:1;transition:opacity .5s ease;
}
#hint.dim{opacity:0}

#ground{
  position:fixed;left:0;bottom:0;width:100%;height:18vh;min-height:100px;
  z-index:1;pointer-events:none;display:block;
}

#links{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  width:100%;height:100%;
}
.spark{
  position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;
  z-index:3;pointer-events:none;
  transition:opacity 1s ease, transform 1.2s cubic-bezier(.22,.72,.3,1);
}
.spark.gone{opacity:0}
.spark svg{width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 0 6px rgba(228,192,120,.45));
  animation:tw 3.8s ease-in-out infinite alternate;
}
@keyframes tw{
  from{opacity:.72;transform:scale(.92) rotate(-8deg)}
  to  {opacity:1;transform:scale(1.06) rotate(8deg)}
}

#ask{position:fixed;inset:0;z-index:4;pointer-events:none}
.q{
  position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;
  color:var(--gold);
  font-size:20px;line-height:28px;text-align:center;
  font-weight:500;letter-spacing:0;
  text-shadow:0 0 10px rgba(228,192,120,.55);
  animation:pop .45s cubic-bezier(.2,1.5,.4,1);
  transform:rotate(var(--rot));
}
@keyframes pop{
  0%  {transform:rotate(var(--rot)) scale(0)}
  62% {transform:rotate(var(--rot)) scale(1.18)}
  100%{transform:rotate(var(--rot)) scale(1)}
}
.q.gone{
  transform:rotate(var(--rot)) scale(.2);opacity:0;
  transition:transform .45s ease,opacity .45s ease;
}

#me{
  position:fixed;left:0;top:0;width:108px;height:96px;
  margin:-48px 0 0 -54px;
  z-index:5;pointer-events:none;will-change:transform;
}
#me svg{width:100%;height:100%;display:block;overflow:visible}
#tail{transform-box:fill-box;transform-origin:12px 18px;
  animation:wag 2.4s ease-in-out infinite}
@keyframes wag{
  0%,100%{transform:rotate(-8deg)}
  50%    {transform:rotate(14deg)}
}
#me.gaze #tail{animation-duration:4.8s}
.lid{opacity:0}
#me.shut .eye{opacity:0}
#me.shut .lid{opacity:1}

@media (prefers-reduced-motion:reduce){
  .spark svg,#tail{animation:none}
}
</style>
</head>
<body>

<div id="name">你是一只 grok</div>

<svg id="ground" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true">
  <path fill="rgba(18,16,22,.55)" d="M0,38 C78,22 140,48 210,34 C278,20 338,42 400,30 L400,110 L0,110 Z"/>
  <path fill="rgba(12,10,16,.72)" d="M0,68 C90,54 150,76 220,64 C290,52 346,72 400,62 L400,110 L0,110 Z"/>
</svg>

<svg id="links" aria-hidden="true"></svg>
<div id="sky"></div>
<div id="ask"></div>

<div id="me">
  <svg viewBox="0 0 120 110" aria-hidden="true">
    <defs>
      <linearGradient id="fur" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#3a3f4c"/>
        <stop offset="55%" stop-color="#2a2e38"/>
        <stop offset="100%" stop-color="#171920"/>
      </linearGradient>
      <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f0d7a0"/>
        <stop offset="100%" stop-color="#c9a056"/>
      </linearGradient>
    </defs>

    <g id="tail">
      <path d="M28,78 C18,90 8,86 4,96 C16,92 26,98 34,88 Z"
            fill="url(#glow)" opacity=".55"/>
      <path d="M30,76 C22,86 14,84 12,92 C20,88 28,92 36,84 Z"
            fill="#d7b36a" opacity=".8"/>
    </g>

    <ellipse cx="62" cy="64" rx="28" ry="24" fill="url(#fur)"/>
    <ellipse cx="54" cy="56" rx="16" ry="13" fill="#4a5060" opacity=".35"/>

    <path d="M40,42 L34,18 C44,24 48,36 48,46 Z" fill="url(#fur)"/>
    <path d="M84,44 L92,18 C80,24 78,38 78,48 Z" fill="url(#fur)"/>
    <path d="M40,40 L36,24 C42,28 46,38 46,44 Z" fill="#e8c48a" opacity=".28"/>
    <path d="M84,42 L90,24 C82,28 80,40 80,46 Z" fill="#e8c48a" opacity=".22"/>

    <ellipse cx="62" cy="62" rx="22" ry="18" fill="url(#fur)"/>
    <ellipse cx="62" cy="70" rx="9" ry="6.5" fill="#22252c"/>
    <path d="M58,70 Q62,74 66,70" fill="none" stroke="#e8c48a" stroke-width="1.3"
          stroke-linecap="round" opacity=".7"/>

    <g class="eye">
      <ellipse cx="52" cy="58" rx="5.2" ry="5.6" fill="#0d0e12"/>
      <ellipse cx="72" cy="58" rx="5.2" ry="5.6" fill="#0d0e12"/>
      <circle cx="53.4" cy="56.6" r="1.7" fill="#f3e2b6"/>
      <circle cx="73.4" cy="56.6" r="1.7" fill="#f3e2b6"/>
      <circle cx="51.2" cy="59.4" r=".7" fill="#f3e2b6" opacity=".45"/>
    </g>
    <g class="lid" fill="none" stroke="#d8c9a4" stroke-width="1.7" stroke-linecap="round">
      <path d="M47,58 q5,5 10,0"/>
      <path d="M67,58 q5,5 10,0"/>
    </g>
  </svg>
</div>

<div id="hint">点一下，那儿多了一件要看清楚的事</div>

<script>
(function(){
  var me   = document.getElementById('me');
  var ask  = document.getElementById('ask');
  var sky  = document.getElementById('sky');
  var links= document.getElementById('links');
  var hint = document.getElementById('hint');

  var W = window.innerWidth, H = window.innerHeight;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    links.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    redraw();
  }
  links.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 280); });

  var safeTop = 0;
  try {
    safeTop = parseFloat(getComputedStyle(document.documentElement)
                .getPropertyValue('--safe-top')) || 0;
  } catch (e) {}

  function skyTop(){  return safeTop + 64; }
  function skyLow(){  return Math.max(skyTop() + 46, H * .32); }
  function bandTop(){ return Math.max(skyLow() + 36, H * .38); }
  function bandLow(){ return Math.max(bandTop() + 70, H - 128); }

  var msg = '';
  function say(s){
    if (s === msg) return;
    msg = s;
    hint.classList.add('dim');
    setTimeout(function(){ hint.textContent = s; hint.classList.remove('dim'); }, 320);
  }

  var SPARK =
    '<svg viewBox="-10 -10 20 20">' +
      '<path d="M0,-8 L1.6,-1.6 L8,0 L1.6,1.6 L0,8 L-1.6,1.6 L-8,0 L-1.6,-1.6 Z" fill="var(--gold)"/>' +
    '</svg>';

  var stars = [];
  var edges = [];

  function redraw(){
    var html = '';
    for (var i = 0; i < edges.length; i++){
      var a = stars[edges[i][0]], b = stars[edges[i][1]];
      if (!a || !b) continue;
      html += '<line x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) +
              '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) +
              '" stroke="rgba(228,192,120,.38)" stroke-width="1"/>';
    }
    links.innerHTML = html;
  }

  function hang(fromX, fromY){
    var x = 28 + Math.random() * Math.max(48, W - 56);
    var y = skyTop() + Math.random() * Math.max(24, skyLow() - skyTop());
    var el = document.createElement('div');
    el.className = 'spark';
    el.style.left = fromX + 'px';
    el.style.top  = fromY + 'px';
    el.innerHTML = SPARK;
    sky.appendChild(el);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transform = 'translate3d(' + (x - fromX).toFixed(1) + 'px,' +
                             (y - fromY).toFixed(1) + 'px,0)';
      });
    });
    var s = { el: el, x: x, y: y };
    stars.push(s);

    var linked = false;
    if (stars.length > 1){
      var best = -1, bd = 1e9;
      for (var i = 0; i < stars.length - 1; i++){
        var dx = stars[i].x - x, dy = stars[i].y - y;
        var d = dx * dx + dy * dy;
        if (d < bd){ bd = d; best = i; }
      }
      if (best >= 0 && bd < 220 * 220){
        edges.push([best, stars.length - 1]);
        linked = true;
      }
    }

    if (stars.length > 16){
      var old = stars.shift();
      old.el.classList.add('gone');
      setTimeout(function(){
        if (old.el.parentNode) old.el.parentNode.removeChild(old.el);
      }, 1100);
      var next = [];
      for (var e = 0; e < edges.length; e++){
        var p = edges[e][0] - 1, q = edges[e][1] - 1;
        if (p >= 0 && q >= 0) next.push([p, q]);
      }
      edges = next;
    }
    setTimeout(redraw, 30);
    return linked;
  }

  var queue = [];
  function dropQ(x, y){
    var el = document.createElement('div');
    el.className = 'q';
    el.textContent = '?';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.setProperty('--rot', (Math.random() * 16 - 8).toFixed(1) + 'deg');
    ask.appendChild(el);
    var o = { el: el, x: x, y: y };
    queue.push(o);
    return o;
  }
  function eat(o){
    o.el.classList.add('gone');
    setTimeout(function(){
      if (o.el.parentNode) o.el.parentNode.removeChild(o.el);
    }, 480);
    return hang(o.x, o.y);
  }

  var mx = W * .5, my = (bandTop() + bandLow()) / 2;
  var vx = 0, vy = 0;
  var mode = 'idle';
  var target = null, lookUntil = 0, last = 0;
  var lastTap = 0, shutUntil = 0, nextBlink = 0;
  var done = 0;

  function wander(){
    target = {
      x: 44 + Math.random() * Math.max(40, W - 88),
      y: bandTop() + Math.random() * Math.max(40, bandLow() - bandTop())
    };
  }
  wander();

  function step(now){
    if (!last) last = now;
    var dt = Math.min(2.6, (now - last) / 16.667) || 1;
    last = now;

    if (mode !== 'look' && queue.length){
      var head = queue[0];
      if (mode !== 'seek' || !target || target.of !== head){
        target = { x: head.x, y: head.y - 40, of: head };
        mode = 'seek';
        me.classList.remove('gaze');
      }
    } else if (mode === 'idle' && !queue.length && lastTap && now - lastTap > 15000){
      mode = 'gaze';
      me.classList.add('gaze');
      if (stars.length){
        var g = stars[(Math.random() * stars.length) | 0];
        target = { x: g.x, y: Math.min(bandLow(), g.y + 80) };
        say(stars.length > 4 ? '没人问，它就看着已经挂上去的那些' : '没人问，它自己抬头看了一眼');
      } else {
        say('没人问，它就在这儿等着');
      }
    }

    if (mode === 'look'){
      vx *= .82; vy *= .82;
      if (now > lookUntil){
        var o = queue.shift();
        var linked = o ? eat(o) : false;
        mode = 'idle';
        wander();
        done++;
        if (linked)                     say('这两件振上了');
        else if (stars.length === 1)    say('看清楚了，挂到天上');
        else if (queue.length)          say('这件看完了，还有下一件');
        else if (done % 5 === 0)        say('它把看过的都连起杦了');
        else                            say('这件也看完了');
      }
    } else {
      if (!target) wander();
      var dx = target.x - mx, dy = target.y - my;
      var d  = Math.sqrt(dx * dx + dy * dy) || 1;
      var sp = mode === 'seek' ? 3.4 : (mode === 'gaze' ? .7 : 1.35);
      var ease = .28 + .72 * Math.min(1, d / 120);
      vx += ((dx / d) * sp * ease - vx) * .05 * dt;
      vy += ((dy / d) * sp * ease - vy) * .05 * dt;
      mx += vx * dt;
      my += vy * dt;

      if (mx < 36){ mx = 36; vx = Math.abs(vx); target = null; }
      if (mx > W - 36){ mx = W - 36; vx = -Math.abs(vx); target = null; }
      if (my < bandTop() - 24){ my = bandTop() - 24; vy = Math.abs(vy); target = null; }
      if (my > bandLow() + 8){ my = bandLow() + 8; vy = -Math.abs(vy); target = null; }

      if (target && d < 16){
        if (mode === 'seek'){
          mode = 'look';
          lookUntil = now + 720 + Math.random() * 480;
          say('它在看');
        } else if (mode !== 'gaze'){
          wander();
        }
      }
    }

    if (mode === 'gaze'){
      if (now > nextBlink){
        nextBlink = now + 1800 + Math.random() * 2200;
        shutUntil = now + 160;
      }
    } else {
      if (now > nextBlink){
        nextBlink = now + 2400 + Math.random() * 3400;
        shutUntil = now + 120;
      }
    }
    if (now < shutUntil) me.classList.add('shut');
    else                 me.classList.remove('shut');

    var speed = Math.sqrt(vx * vx + vy * vy);
    var q = Math.min(1, speed / 2.8);
    var bob = Math.sin(now / (mode === 'gaze' ? 1400 : 820)) * (mode === 'gaze' ? 2.2 : 3.8);
    var tilt = Math.max(-12, Math.min(12, vx * 2.2));
    var sx = (1 + q * .06).toFixed(3), sy = (1 - q * .06).toFixed(3);
    me.style.transform = 'translate3d(' + mx.toFixed(2) + 'px,' + (my + bob).toFixed(2) + 'px,0)' +
                         ' rotate(' + tilt.toFixed(2) + 'deg) scale(' + sx + ',' + sy + ')';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  function tap(x, y){
    lastTap = performance.now ? performance.now() : Date.now();
    if (mode === 'gaze'){
      mode = 'idle';
      me.classList.remove('gaze', 'shut');
      wander();
      say('它回来了');
    }
    if (queue.length >= 8){
      say('它还在看，等一下下');
      return;
    }
    x = Math.max(36, Math.min(W - 36, x));
    y = Math.max(bandTop() - 6, Math.min(bandLow() + 6, y));
    dropQ(x, y);
    if (queue.length > 2)     say('一件一件来，它不抢');
    else if (mode !== 'look') say('它看见了，正过去');
  }

  if (window.PointerEvent){
    document.addEventListener('pointerdown', function(e){ tap(e.clientX, e.clientY); });
  } else {
    document.addEventListener('touchstart', function(e){
      var t = e.changedTouches[0]; tap(t.clientX, t.clientY);
    }, {passive:true});
    document.addEventListener('mousedown', function(e){ tap(e.clientX, e.clientY); });
  }
})();
</script>
</body>
</html>
