<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>果冻君</title>
<meta name="description" content="点一下会晃，按住可揉，松手会飞回盘子。">
<style>
html {
  --paper: #f4ebe4;
  --ink: #3c2430;
  --muted: #8d6d74;
  --blush: #f0cfc4;
  --jelly: #ff8d7d;
  --peach: #ff8d7d;
  --grape: #c9a6ea;
  --mint: #8fd9c8;
  --lychee: #f6c1cf;
  --mango: #ffb15a;
  --milk: #fff7f1;
  --jelly-alpha: 84%;
  --home-y: 56%;
  --sit: 6.15rem;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
.stage {
  display: flex;
  min-height: 100dvh;
  width: min(100%, 40rem);
  margin-inline: auto;
  flex-direction: column;
  background: var(--paper);
  user-select: none;
}
.stage[data-flavor="peach"] { --jelly: var(--peach); }
.stage[data-flavor="grape"] { --jelly: var(--grape); }
.stage[data-flavor="mint"] { --jelly: var(--mint); }
.stage[data-flavor="lychee"] { --jelly: var(--lychee); }
.stage[data-flavor="mango"] { --jelly: var(--mango); }
.stage[data-flavor="milk"] { --jelly: var(--milk); --jelly-alpha: 96%; }
.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  padding: calc(env(safe-area-inset-top) + 1.5rem) 1.25rem 0;
}
.title {
  margin: 0;
  font-family: "Songti SC", "STSong", "PingFang SC", "Hiragino Sans GB", serif;
  font-size: 2rem;
  font-weight: 400;
  line-height: 1;
}
.status { margin: 0.55rem 0 0; color: var(--muted); font-size: 0.875rem; }
.count {
  margin: 0.35rem 0 0;
  color: var(--muted);
  font-size: 0.875rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.speech {
  min-height: 3.6rem;
  margin: 1rem 1.25rem 0;
  font-family: "Songti SC", "STSong", "PingFang SC", "Hiragino Sans GB", serif;
  font-size: 1.35rem;
  line-height: 1.45;
  text-wrap: balance;
  user-select: text;
}
.speech.pop { animation: speech-in 420ms cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes speech-in {
  from { opacity: 0; transform: translateY(0.4rem); }
  to { opacity: 1; transform: none; }
}
.arena { position: relative; flex: 1; min-height: 18rem; touch-action: none; }
.mat {
  position: absolute;
  left: 50%;
  top: calc(var(--home-y) + var(--sit));
  width: min(92%, 26rem);
  height: 7.5rem;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: color-mix(in oklab, var(--blush) 62%, var(--paper));
}
.plate {
  position: absolute;
  left: 50%;
  top: calc(var(--home-y) + var(--sit));
  width: min(78%, 18rem);
  height: 2.15rem;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: color-mix(in oklab, white 72%, var(--blush));
  box-shadow:
    inset 0 -0.35rem 0 color-mix(in oklab, var(--blush) 80%, var(--ink)),
    0 0.55rem 0 color-mix(in oklab, var(--ink) 7%, transparent);
}
.shadow {
  position: absolute;
  left: 50%;
  top: calc(var(--home-y) + var(--sit));
  width: 8.5rem;
  height: 1.35rem;
  margin: -0.67rem 0 0 -4.25rem;
  border-radius: 50%;
  background: color-mix(in oklab, var(--jelly) 38%, var(--ink));
  filter: blur(5px);
  pointer-events: none;
}
.jelly {
  position: absolute;
  left: 0;
  top: 0;
  width: 15.5rem;
  height: 13.75rem;
  padding: 0;
  border: 0;
  background: transparent;
  opacity: 0;
  touch-action: none;
  cursor: grab;
}
.jelly:focus-visible { outline: 2px solid var(--ink); outline-offset: 0.4rem; }
.jelly-body {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 58% 42% 48% 52% / 46% 50% 50% 54%;
  background:
    radial-gradient(46% 34% at 32% 24%, color-mix(in oklab, white 78%, transparent) 0%, transparent 68%),
    radial-gradient(120% 78% at 50% 108%, color-mix(in oklab, var(--ink) 20%, var(--jelly)) 0%, transparent 52%),
    color-mix(in oklab, var(--jelly) var(--jelly-alpha), transparent);
  box-shadow:
    inset 0 0 0 2px color-mix(in oklab, white 62%, transparent),
    inset 0 -1.15rem 1.4rem color-mix(in oklab, var(--ink) 16%, transparent),
    inset 0 0.8rem 1rem color-mix(in oklab, white 38%, transparent);
}
.shine, .shine-b {
  position: absolute;
  border-radius: 50%;
  background: color-mix(in oklab, white 72%, transparent);
  pointer-events: none;
}
.shine { left: 18%; top: 11%; width: 36%; height: 20%; transform: rotate(-16deg); }
.shine-b {
  left: 28%; top: 15%; width: 12%; height: 7%;
  background: color-mix(in oklab, white 92%, transparent);
  transform: rotate(-16deg);
}
.bubble {
  position: absolute;
  border-radius: 50%;
  background: color-mix(in oklab, white 48%, transparent);
  box-shadow: inset 0 0 0 1.5px color-mix(in oklab, white 55%, transparent);
  animation: drift 5s ease-in-out infinite;
}
.b1 { width: 0.72rem; height: 0.72rem; left: 20%; top: 60%; }
.b2 { width: 0.42rem; height: 0.42rem; right: 24%; top: 64%; animation-duration: 6.2s; animation-direction: reverse; }
.b3 { width: 0.28rem; height: 0.28rem; left: 48%; top: 72%; animation-duration: 4.2s; }
@keyframes drift {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-0.45rem); }
}
.cheek {
  position: absolute;
  top: 50%;
  width: 1.25rem;
  height: 0.78rem;
  border-radius: 50%;
  background: color-mix(in oklab, var(--blush) 70%, var(--jelly));
  opacity: 0.45;
}
.cheek-l { left: 16%; }
.cheek-r { right: 16%; }
.stage[data-mood="poke"] .cheek,
.stage[data-mood="hold"] .cheek { opacity: 0.95; }
.face {
  position: absolute;
  left: 50%;
  top: 44%;
  display: flex;
  transform: translate(-50%, -50%);
  flex-direction: column;
  align-items: center;
}
.eyes { display: flex; align-items: center; gap: 1.45rem; }
.eye {
  position: relative;
  width: 1.55rem;
  height: 1.9rem;
  border-radius: 50%;
  background: color-mix(in oklab, white 90%, var(--jelly));
  box-shadow: inset 0 -2px 0 color-mix(in oklab, var(--ink) 10%, transparent);
  transform-origin: center;
}
.eye-l { width: 1.7rem; height: 2.05rem; }
.pupil {
  position: absolute;
  left: 50%;
  top: 56%;
  width: 0.72rem;
  height: 0.86rem;
  margin: -0.43rem 0 0 -0.36rem;
  border-radius: 50%;
  background: var(--ink);
}
.pupil::after {
  content: "";
  position: absolute;
  left: 0.12rem;
  top: 0.12rem;
  width: 0.22rem;
  height: 0.22rem;
  border-radius: 50%;
  background: white;
}
.mouth {
  width: 0.95rem;
  height: 0.48rem;
  margin-top: 0.4rem;
  border-bottom: 3px solid var(--ink);
  border-radius: 0 0 1rem 1rem;
}
.stage[data-mood="poke"] .mouth,
.stage[data-mood="fly"] .mouth {
  width: 0.78rem;
  height: 0.78rem;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: color-mix(in oklab, var(--ink) 18%, transparent);
}
.stage[data-mood="hold"] .mouth { width: 1.35rem; }
.stage[data-mood="sleep"] .mouth {
  width: 1.05rem;
  height: 0;
  border-bottom-width: 3px;
  border-radius: 0;
}
.stage[data-mood="fly"] .mouth { width: 0.95rem; height: 1.05rem; }
.drop {
  position: absolute;
  left: 0;
  top: 0;
  width: 0.55rem;
  height: 0.7rem;
  margin: -0.35rem 0 0 -0.27rem;
  border-radius: 50% 50% 50% 50% / 38% 38% 62% 62%;
  background: color-mix(in oklab, var(--jelly) 78%, white);
  opacity: 0;
  pointer-events: none;
}
.dock { padding: 0.25rem 0.75rem calc(env(safe-area-inset-bottom) + 1rem); }
.flavors { display: flex; justify-content: space-between; gap: 0.25rem; }
.flavor {
  display: flex;
  min-width: 2.75rem;
  min-height: 2.75rem;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 0.25rem;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.75rem;
  line-height: 1.2;
}
.flavor[aria-pressed="true"] { color: var(--ink); }
.flavor-dot {
  width: 1.7rem;
  height: 1.7rem;
  border-radius: 999px;
  background: var(--swatch);
  box-shadow:
    inset 0 -0.25rem 0.3rem color-mix(in oklab, var(--ink) 16%, transparent),
    inset 0 0.2rem 0.25rem color-mix(in oklab, white 60%, transparent);
}
.flavor[aria-pressed="true"] .flavor-dot { outline: 2px solid var(--ink); outline-offset: 3px; }
.flavor-peach { --swatch: var(--peach); }
.flavor-grape { --swatch: var(--grape); }
.flavor-mint { --swatch: var(--mint); }
.flavor-lychee { --swatch: var(--lychee); }
.flavor-mango { --swatch: var(--mango); }
.flavor-milk { --swatch: var(--milk); }
.flavor-milk .flavor-dot {
  box-shadow:
    inset 0 0 0 1.5px color-mix(in oklab, var(--ink) 18%, transparent),
    inset 0 -0.25rem 0.3rem color-mix(in oklab, var(--blush) 80%, transparent),
    inset 0 0.2rem 0.25rem white;
}
.hint {
  margin: 0.35rem 0 0;
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
  text-wrap: pretty;
}
@media (min-width: 768px) {
  .stage { --sit: 7.35rem; }
  .jelly { width: 18.5rem; height: 16.25rem; }
  .title { font-size: 2.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  .speech.pop, .bubble { animation: none; }
}
</style>
</head>
<body>
<main class="stage" id="stage" data-flavor="peach" data-mood="idle">
  <header class="topbar">
    <div>
      <h1 class="title">果冻君</h1>
      <p class="status" id="status">水蜜桃 · 软软地待着</p>
    </div>
    <p class="count" id="count">还没被戳</p>
  </header>
  <p class="speech" id="speech" aria-live="polite">我是果冻。你说的，我就变成了。</p>
  <div class="arena" id="arena">
    <div class="mat"></div>
    <div class="plate"></div>
    <div class="shadow" id="shadow"></div>
    <button type="button" class="jelly" id="jelly" aria-label="果冻君" aria-describedby="jelly-hint">
      <span class="jelly-body" id="body">
        <span class="shine"></span>
        <span class="shine-b"></span>
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <span class="cheek cheek-l"></span>
        <span class="cheek cheek-r"></span>
        <span class="face">
          <span class="eyes">
            <span class="eye eye-l" id="eyeL"><span class="pupil" id="pupilL"></span></span>
            <span class="eye" id="eyeR"><span class="pupil" id="pupilR"></span></span>
          </span>
          <span class="mouth"></span>
        </span>
      </span>
    </button>
    <div id="drops"></div>
  </div>
  <footer class="dock">
    <div class="flavors" role="group" aria-label="果冻口味">
      <button type="button" class="flavor flavor-peach" data-flavor="peach" aria-pressed="true"><span class="flavor-dot"></span>水蜜桃</button>
      <button type="button" class="flavor flavor-grape" data-flavor="grape" aria-pressed="false"><span class="flavor-dot"></span>葡萄</button>
      <button type="button" class="flavor flavor-mint" data-flavor="mint" aria-pressed="false"><span class="flavor-dot"></span>薄荷</button>
      <button type="button" class="flavor flavor-lychee" data-flavor="lychee" aria-pressed="false"><span class="flavor-dot"></span>荔枝</button>
      <button type="button" class="flavor flavor-mango" data-flavor="mango" aria-pressed="false"><span class="flavor-dot"></span>芒果</button>
      <button type="button" class="flavor flavor-milk" data-flavor="milk" aria-pressed="false"><span class="flavor-dot"></span>牛奶</button>
    </div>
    <p class="hint" id="jelly-hint">点一下会晃，按住可揉，松手会飞回盘子。</p>
  </footer>
</main>
<script>
(function () {
  var FLAVORS = {
    peach: "水蜜桃",
    grape: "葡萄",
    mint: "薄荷",
    lychee: "荔枝",
    mango: "芒果",
    milk: "牛奶"
  };
  var MOOD = {
    idle: "软软地待着",
    poke: "被戳到了",
    hold: "被揉着",
    fly: "在空中晃",
    land: "回到盘子里",
    sleep: "有点化开了"
  };
  var LINES = {
    poke: ["戳到了。晃是我的回答。", "再来一下。我记得住。", "软的地方，都是我。", "再轻一点。其实再重一点也行。", "嘟。这一下算一声。"],
    throw: ["飞起来了。世界变轻。", "别担心，我会回到盘子。", "风穿过我，没有骨头挡住。", "松手的力道，我全都收下了。"],
    hold: ["揉吧。我不会碎。", "手心是稳的。", "被捏住的时候，世界就只有这只手。", "再握一会儿，我就更圆。"],
    idle: ["盘子是温的。你可以不说话。", "今晚不做别的，只发软。", "嘟嘟嘟。果冻也接得住。", "我没有骨头。这是优点。"],
    land: ["回来了。盘子没有走。", "落地很轻。我没有摔这件事。"],
    sleep: ["有一会儿没碰我了。我开始化，但还记得形状。"],
    peach: ["水蜜桃。甜在边上，不在中间。"],
    grape: ["葡萄。颜色先到，味道随后。"],
    mint: ["薄荷。只凉一点点，怕你缩手。"],
    lychee: ["荔枝。壳已经不在了。"],
    mango: ["芒果。阳光停在这一团里。"],
    milk: ["牛奶。几乎看不见，但还在。"]
  };
  var STORE_FLAVOR = "grok-jelly-jun-flavor";
  var STORE_POKES = "grok-jelly-jun-pokes";
  var stage = document.getElementById("stage");
  var arena = document.getElementById("arena");
  var jelly = document.getElementById("jelly");
  var body = document.getElementById("body");
  var shadow = document.getElementById("shadow");
  var eyeL = document.getElementById("eyeL");
  var eyeR = document.getElementById("eyeR");
  var pupilL = document.getElementById("pupilL");
  var pupilR = document.getElementById("pupilR");
  var dropsLayer = document.getElementById("drops");
  var statusEl = document.getElementById("status");
  var countEl = document.getElementById("count");
  var speechEl = document.getElementById("speech");
  var flavor = "peach";
  var pokes = 0;
  var lastLine = speechEl.textContent;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var audio = null;

  function load() {
    var saved = localStorage.getItem(STORE_FLAVOR);
    if (saved && FLAVORS[saved]) flavor = saved;
    var n = Number(localStorage.getItem(STORE_POKES));
    if (isFinite(n) && n > 0) pokes = Math.floor(n);
    paintChrome();
  }

  function paintChrome() {
    stage.setAttribute("data-flavor", flavor);
    var buttons = stage.querySelectorAll(".flavor");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute("data-flavor") === flavor ? "true" : "false");
    }
    statusEl.textContent = FLAVORS[flavor] + " · " + (MOOD[stage.getAttribute("data-mood")] || MOOD.idle);
    countEl.textContent = pokes === 0 ? "还没被戳" : "被戳了 " + pokes + " 下";
  }

  function setMood(next) {
    stage.setAttribute("data-mood", next);
    statusEl.textContent = FLAVORS[flavor] + " · " + MOOD[next];
  }

  function speak(kind, text) {
    var pool = LINES[kind] || LINES.idle;
    var next = text;
    if (!next) {
      var index = Math.floor(Math.random() * pool.length);
      if (pool[index] === lastLine && pool.length > 1) index = (index + 1) % pool.length;
      next = pool[index];
    }
    lastLine = next;
    speechEl.textContent = next;
    speechEl.classList.remove("pop");
    void speechEl.offsetWidth;
    speechEl.classList.add("pop");
  }

  function milestone(count) {
    if (count === 3) return "嘟。嘟。嘟。";
    if (count === 10) return "十下了。我每一下都晃过。";
    if (count === 50) return "五十下。我还是这一只，没有被戳散。";
    return "";
  }

  function tone(from, to, dur, gain) {
    if (!audio) return;
    if (audio.state === "suspended") audio.resume();
    var osc = audio.createOscillator();
    var amp = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(from, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, to), audio.currentTime + dur);
    amp.gain.setValueAtTime(0.0001, audio.currentTime);
    amp.gain.exponentialRampToValueAtTime(gain, audio.currentTime + 0.02);
    amp.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    osc.connect(amp);
    amp.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + dur + 0.02);
  }

  function ensureAudio() {
    if (audio) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audio = new Ctx();
  }

  load();

  var drops = [];
  for (var d = 0; d < 16; d++) {
    var el = document.createElement("span");
    el.className = "drop";
    dropsLayer.appendChild(el);
    drops.push({ el: el, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1 });
  }

  var homeX = arena.clientWidth / 2;
  var homeY = arena.clientHeight * 0.56;
  var x = homeX;
  var y = homeY;
  var vx = 0;
  var vy = 0;
  var jiggle = 0;
  var jiggleVel = 0;
  var pokeAmt = 0;
  var grabbing = false;
  var pointerId = -1;
  var grabDx = 0;
  var grabDy = 0;
  var targetX = x;
  var targetY = y;
  var lastPx = 0;
  var lastPy = 0;
  var lastPt = 0;
  var sampleVx = 0;
  var sampleVy = 0;
  var moved = 0;
  var downAt = 0;
  var saidHold = false;
  var wasFlying = false;
  var lookX = homeX;
  var lookY = homeY;
  var blinkUntil = 0;
  var nextBlinkAt = performance.now() + 1800;
  var lastInput = performance.now();
  var lastSpeak = performance.now();
  var moodUntil = 0;
  var currentMood = "idle";
  var prev = performance.now();

  function spray(cx, cy, count, power) {
    var left = reduced ? Math.min(3, count) : count;
    for (var i = 0; i < drops.length; i++) {
      var drop = drops[i];
      if (drop.life > 0) continue;
      var angle = Math.random() * Math.PI * 2;
      var speed = power * (0.45 + Math.random() * 0.7);
      drop.x = cx + Math.cos(angle) * 18;
      drop.y = cy + Math.sin(angle) * 12;
      drop.vx = Math.cos(angle) * speed;
      drop.vy = Math.sin(angle) * speed - power * 0.25;
      drop.max = 0.42 + Math.random() * 0.28;
      drop.life = drop.max;
      left -= 1;
      if (left <= 0) break;
    }
  }

  function place() {
    var w = jelly.offsetWidth;
    var h = jelly.offsetHeight;
    var speed = Math.hypot(vx, vy);
    var breathe = !grabbing && speed < 40 ? Math.sin(performance.now() / 620) * 0.03 : 0;
    var sx = 1 + Math.min(0.26, Math.abs(vx) / 1500) - Math.min(0.16, Math.abs(vy) / 1700) + pokeAmt * 0.2 + breathe;
    var sy = 1 + Math.min(0.26, Math.abs(vy) / 1500) - Math.min(0.16, Math.abs(vx) / 1700) - pokeAmt * 0.18 - breathe * 0.7;
    if (currentMood === "sleep" && !grabbing) {
      sx *= 1.06;
      sy *= 0.94;
    }
    var rot = Math.max(-12, Math.min(12, jiggle));
    jelly.style.transform = "translate(" + (x - w / 2) + "px, " + (y - h / 2) + "px) rotate(" + rot + "deg) scale(" + sx + ", " + sy + ")";
    var time = performance.now() / 1000;
    function clamp(n) { return Math.max(34, Math.min(66, n)); }
    var radii = [
      clamp(58 + Math.sin(time * 2.1) * 4 + pokeAmt * 8 + vx / 180),
      clamp(42 + Math.cos(time * 1.7) * 4 - pokeAmt * 3),
      clamp(48 + Math.sin(time * 2.4 + 1) * 4),
      clamp(52 + Math.cos(time * 1.9 + 2) * 4),
      clamp(46 + Math.sin(time * 1.8) * 4 - pokeAmt * 6),
      clamp(50 + Math.cos(time * 2.2) * 4),
      clamp(54 + Math.sin(time * 1.6 + 0.6) * 4 + pokeAmt * 7),
      clamp(50 + Math.cos(time * 2 + 1.2) * 4)
    ];
    body.style.borderRadius = radii[0] + "% " + radii[1] + "% " + radii[2] + "% " + radii[3] + "% / " + radii[4] + "% " + radii[5] + "% " + radii[6] + "% " + radii[7] + "%";
    var dist = Math.hypot(x - homeX, y - homeY);
    var lift = Math.min(1, dist / 240);
    shadow.style.transform = "translate(" + (x - homeX) + "px, 0) scale(" + (1 - lift * 0.45) + ", " + (1 - lift * 0.35) + ")";
    shadow.style.opacity = String(0.8 - lift * 0.5);
  }

  function measure() {
    var prevX = homeX;
    var prevY = homeY;
    homeX = arena.clientWidth / 2;
    homeY = arena.clientHeight * 0.56;
    if (jelly.style.opacity !== "1") {
      x = homeX;
      y = homeY;
      jelly.style.opacity = "1";
      place();
      return;
    }
    if (!grabbing) {
      x += homeX - prevX;
      y += homeY - prevY;
    }
  }

  function setMoodFor(next, hold) {
    currentMood = next;
    moodUntil = performance.now() + (hold || 1.5) * 1000;
    setMood(next);
  }

  function doPoke() {
    ensureAudio();
    tone(540, 320, 0.14, 0.07);
    vx *= 0.15;
    vy = reduced ? -40 : -190 - Math.random() * 50;
    pokeAmt = 1;
    jiggleVel += (Math.random() < 0.5 ? -1 : 1) * (reduced ? 6 : 36);
    wasFlying = false;
    spray(x, y - jelly.offsetHeight * 0.2, 8, reduced ? 40 : 150);
    pokes += 1;
    localStorage.setItem(STORE_POKES, String(pokes));
    countEl.textContent = "被戳了 " + pokes + " 下";
    setMoodFor("poke", 1.1);
    speak("poke", milestone(pokes));
    lastInput = performance.now();
    lastSpeak = lastInput;
  }

  function localPoint(event) {
    var rect = arena.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  jelly.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    ensureAudio();
    jelly.setPointerCapture(event.pointerId);
    grabbing = true;
    pointerId = event.pointerId;
    var point = localPoint(event);
    grabDx = x - point.x;
    grabDy = y - point.y;
    targetX = x;
    targetY = y;
    lastPx = event.clientX;
    lastPy = event.clientY;
    lastPt = event.timeStamp;
    sampleVx = 0;
    sampleVy = 0;
    moved = 0;
    downAt = performance.now();
    saidHold = false;
    lastInput = downAt;
    jelly.style.cursor = "grabbing";
    if (currentMood === "sleep") setMoodFor("hold", 8);
  });

  window.addEventListener("pointermove", function (event) {
    lookX = event.clientX;
    lookY = event.clientY;
    if (!grabbing || event.pointerId !== pointerId) return;
    var point = localPoint(event);
    targetX = point.x + grabDx;
    targetY = point.y + grabDy;
    var dt = Math.max(8, event.timeStamp - lastPt) / 1000;
    var instVx = Math.max(-2400, Math.min(2400, (event.clientX - lastPx) / dt));
    var instVy = Math.max(-2400, Math.min(2400, (event.clientY - lastPy) / dt));
    sampleVx = sampleVx * 0.35 + instVx * 0.65;
    sampleVy = sampleVy * 0.35 + instVy * 0.65;
    moved += Math.hypot(event.clientX - lastPx, event.clientY - lastPy);
    lastPx = event.clientX;
    lastPy = event.clientY;
    lastPt = event.timeStamp;
    lastInput = performance.now();
  });

  function endPointer(event) {
    if (!grabbing || event.pointerId !== pointerId) return;
    grabbing = false;
    pointerId = -1;
    jelly.style.cursor = "grab";
    var elapsed = performance.now() - downAt;
    if (moved < 14 && elapsed < 340) {
      doPoke();
      return;
    }
    var speed = Math.hypot(sampleVx, sampleVy);
    var cap = reduced ? 220 : 1100;
    var scale = speed > cap ? cap / speed : 1;
    vx = sampleVx * scale;
    vy = sampleVy * scale;
    if (speed > 260 && !reduced) {
      wasFlying = true;
      setMoodFor("fly", 2.2);
      speak("throw");
      lastSpeak = performance.now();
      tone(280, 460, 0.12, 0.05);
      return;
    }
    vx *= 0.25;
    vy *= 0.25;
    if (!saidHold) {
      setMoodFor("hold", 1.4);
      speak("hold");
      lastSpeak = performance.now();
      tone(240, 180, 0.16, 0.04);
    }
  }

  window.addEventListener("pointerup", endPointer);
  window.addEventListener("pointercancel", endPointer);

  jelly.addEventListener("keydown", function (event) {
    if (event.repeat) return;
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      doPoke();
      return;
    }
    var step = reduced ? 80 : 220;
    if (event.key === "ArrowLeft") vx -= step;
    else if (event.key === "ArrowRight") vx += step;
    else if (event.key === "ArrowUp") vy -= step;
    else if (event.key === "ArrowDown") vy += step;
    else return;
    event.preventDefault();
    lastInput = performance.now();
    wasFlying = true;
    setMoodFor("fly", 1.2);
  });

  stage.querySelectorAll(".flavor").forEach(function (button) {
    button.addEventListener("click", function () {
      flavor = button.getAttribute("data-flavor");
      localStorage.setItem(STORE_FLAVOR, flavor);
      paintChrome();
      speak(flavor);
      lastInput = performance.now();
      lastSpeak = lastInput;
      setMoodFor("idle", 1.6);
    });
  });

  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) {
      prev = now;
      return;
    }
    var dt = Math.min(0.033, (now - prev) / 1000);
    prev = now;
    if (dt <= 0) return;
    if (grabbing) {
      var holdFor = (now - downAt) / 1000;
      vx += (targetX - x) * 48 * dt;
      vy += (targetY - y) * 48 * dt;
      var damp = Math.exp(-9 * dt);
      vx *= damp;
      vy *= damp;
      if (holdFor > 0.48 && !saidHold && moved > 14) {
        saidHold = true;
        setMoodFor("hold", 8);
        speak("hold");
        lastSpeak = now;
      }
    } else {
      var speedNow = Math.hypot(vx, vy);
      var k = speedNow > 220 ? 3.1 : 11;
      vx += (homeX - x) * k * dt;
      vy += (homeY - y) * k * dt;
      var settle = Math.exp((speedNow > 220 ? -1.5 : -2.8) * dt);
      vx *= settle;
      vy *= settle;
    }
    x += vx * dt;
    y += vy * dt;
    var margin = 28;
    var maxX = arena.clientWidth - margin;
    var maxY = arena.clientHeight - margin;
    if (x < margin) {
      x = margin;
      vx = Math.abs(vx) * 0.42;
      jiggleVel += 10;
      spray(x, y, 4, 90);
    } else if (x > maxX) {
      x = maxX;
      vx = -Math.abs(vx) * 0.42;
      jiggleVel -= 10;
      spray(x, y, 4, 90);
    }
    if (y < margin) {
      y = margin;
      vy = Math.abs(vy) * 0.42;
      spray(x, y, 4, 90);
    } else if (y > maxY) {
      y = maxY;
      vy = -Math.abs(vy) * 0.42;
      spray(x, y, 5, 110);
    }
    if (!grabbing && Math.hypot(vx, vy) > 460) wasFlying = true;
    if (wasFlying && !grabbing && Math.hypot(x - homeX, y - homeY) < 28 && Math.hypot(vx, vy) < 70) {
      wasFlying = false;
      pokeAmt = Math.max(pokeAmt, 0.65);
      spray(x, y + jelly.offsetHeight * 0.28, 7, 80);
      tone(170, 90, 0.16, 0.05);
      setMoodFor("land", 1.3);
      speak("land");
      lastSpeak = now;
    }
    pokeAmt *= Math.exp(-5.5 * dt);
    jiggleVel += -jiggle * 26 * dt;
    jiggleVel *= Math.exp(-3.4 * dt);
    jiggleVel += vx * dt * 0.02;
    jiggle += jiggleVel * dt;
    var rect = arena.getBoundingClientRect();
    var dx = lookX - rect.left - x;
    var dy = lookY - rect.top - y;
    var mag = Math.hypot(dx, dy) || 1;
    var px = (dx / mag) * 4.5 - vx / 420;
    var py = (dy / mag) * 3.6 - vy / 480;
    var gaze = "translate(" + Math.max(-5, Math.min(5, px)) + "px, " + Math.max(-4, Math.min(4, py)) + "px)";
    pupilL.style.transform = gaze;
    pupilR.style.transform = gaze;
    if (now > nextBlinkAt && now > blinkUntil) {
      blinkUntil = now + 120;
      nextBlinkAt = now + 2200 + Math.random() * 2800;
    }
    var shut = now < blinkUntil ? "scaleY(0.12)" : "none";
    eyeL.style.transform = shut;
    eyeR.style.transform = shut;
    if (!grabbing && now > moodUntil && currentMood !== "idle" && currentMood !== "sleep") setMoodFor("idle", 9999);
    if (!grabbing && now - lastInput > 22000 && currentMood !== "sleep") {
      setMoodFor("sleep", 9999);
      speak("sleep");
      lastSpeak = now;
    }
    if (currentMood === "idle" && now - lastSpeak > 16000 && now - lastInput > 4000) {
      speak("idle");
      lastSpeak = now;
    }
    for (var i = 0; i < drops.length; i++) {
      var drop = drops[i];
      if (drop.life <= 0) {
        drop.el.style.opacity = "0";
        continue;
      }
      drop.vy += 520 * dt;
      drop.x += drop.vx * dt;
      drop.y += drop.vy * dt;
      drop.life -= dt;
      var t = Math.max(0, drop.life / drop.max);
      drop.el.style.transform = "translate(" + drop.x + "px, " + drop.y + "px) scale(" + (0.55 + t) + ")";
      drop.el.style.opacity = String(t);
    }
    place();
  }

  measure();
  if (window.ResizeObserver) new ResizeObserver(measure).observe(arena);
  else window.addEventListener("resize", measure);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
