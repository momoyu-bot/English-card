<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>缓缓眨眼</title>
  <meta name="description" content="眼睛还没完全醒来，先慢慢眨给你看。" />
  <style>
    :root {
      --bg0: #f6efe6;
      --bg1: #f3e4d4;
      --paper: #fffaf4;
      --ink: #3a2f28;
      --muted: #8b7a6e;
      --line: #eadfd3;
      --peach: #f3c4b0;
      --blush: #e8a090;
      --lid: #3a2f28;
      --white: #fffdf9;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(255, 214, 170, .55), transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(232, 196, 176, .4), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--ink);
      font-family: var(--font);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(28px + var(--safe-top)) 20px calc(28px + var(--safe-bot));
    }
    .en { display: none; }
    body.show-en .en { display: block; }
    header {
      width: min(420px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    .en-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      letter-spacing: .08em;
    }
    .en-btn[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .stage {
      width: min(420px, 100%);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .speech {
      min-height: 56px;
      max-width: 92%;
      text-align: center;
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink);
    }
    .speech .en {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .face-wrap {
      width: min(280px, 78vw);
      aspect-ratio: 1;
      position: relative;
    }
    .face {
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .blob {
      transform-origin: 50% 70%;
      animation: breath 4.6s ease-in-out infinite;
    }
    .face.blink .lid-l,
    .face.blink .lid-r {
      animation: none;
    }
    @keyframes breath {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(1.025, .975) translateY(3px); }
    }
    .lid-l { animation: blinkL 7.4s ease-in-out infinite; transform-origin: 78px 118px; }
    .lid-r { animation: blinkR 7.4s ease-in-out infinite; transform-origin: 162px 118px; }
    /* 缓缓：合上很慢，停一下，再慢慢睁开一点点，右眼晚半拍 */
    @keyframes blinkL {
      0%, 18% { transform: scaleY(.22); }
      32% { transform: scaleY(1); }
      42% { transform: scaleY(1); }
      58% { transform: scaleY(.28); }
      72%, 100% { transform: scaleY(.22); }
    }
    @keyframes blinkR {
      0%, 22% { transform: scaleY(.18); }
      36% { transform: scaleY(1); }
      46% { transform: scaleY(1); }
      64% { transform: scaleY(.24); }
      78%, 100% { transform: scaleY(.18); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob, .lid-l, .lid-r { animation: none; }
    }
    .dock {
      width: min(420px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .dock button {
      min-height: 48px;
      border: 0;
      border-radius: 16px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      box-shadow: 0 0 0 1px var(--line);
    }
    .dock button:active { transform: scale(.97); }
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>缓缓眨眼</h1>
      <div class="sub">好困 · 早上刚醒</div>
    </div>
    <button type="button" class="en-btn" id="enBtn" aria-pressed="false">EN</button>
  </header>

  <div class="stage">
    <div class="speech" id="speech">
      眼睛先回来。身体再慢一点。
      <span class="en">Eyes first. The body can wait.</span>
    </div>

    <div class="face-wrap">
      <button type="button" class="face" id="face" aria-label="点一下，再眨一次">
        <svg viewBox="0 0 240 240" width="100%" height="100%" aria-hidden="true">
          <defs>
            <radialGradient id="skin" cx="38%" cy="30%">
              <stop offset="0%" stop-color="#fff8f2"/>
              <stop offset="55%" stop-color="#f3c4b0"/>
              <stop offset="100%" stop-color="#d98978"/>
            </radialGradient>
            <radialGradient id="cheek" cx="50%" cy="50%">
              <stop offset="0%" stop-color="#f0a090" stop-opacity=".85"/>
              <stop offset="100%" stop-color="#f0a090" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g class="blob">
            <ellipse cx="120" cy="132" rx="78" ry="72" fill="url(#skin)"/>
            <ellipse cx="78" cy="148" rx="16" ry="11" fill="url(#cheek)"/>
            <ellipse cx="162" cy="148" rx="16" ry="11" fill="url(#cheek)"/>
            <!-- 眼白 -->
            <ellipse cx="78" cy="118" rx="18" ry="16" fill="var(--white)"/>
            <ellipse cx="162" cy="118" rx="18" ry="16" fill="var(--white)"/>
            <!-- 瞳 -->
            <circle cx="80" cy="122" r="6.5" fill="#2b221c"/>
            <circle cx="164" cy="123" r="6.5" fill="#2b221c"/>
            <circle cx="78" cy="119" r="2" fill="#fff"/>
            <circle cx="162" cy="120" r="2" fill="#fff"/>
            <!-- 眼皮：从中间往下盖，默认几乎合着 -->
            <rect class="lid-l" x="58" y="100" width="40" height="22" rx="11" fill="#e8b09e"/>
            <rect class="lid-r" x="142" y="100" width="40" height="22" rx="11" fill="#e8b09e"/>
            <!-- 睫毛一线 -->
            <path d="M62 118 Q78 112 94 118" stroke="#3a2f28" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M146 118 Q162 111 178 118" stroke="#3a2f28" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <!-- 小嘴 -->
            <path d="M110 162 Q120 168 130 162" stroke="#b56a5c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="dock">
      <button type="button" id="slow">再眨一次</button>
      <button type="button" id="half">睁一点点</button>
      <button type="button" id="close">先闭着</button>
    </div>
    <div class="hint">点脸也可以。右眼会晚半拍。</div>
  </div>

  <script>
    const LINES = {
      greet: [
        ["眼睛先回来。身体再慢一点。", "Eyes first. The body can wait."],
        ["还没完全醒。先把这一下眨完。", "Not quite awake. Let this blink finish."],
        ["光进来了。眼皮还在商量。", "The light is in. The lids are still talking."]
      ],
      blink: [
        ["这一下比较长。", "That one took a while."],
        ["右眼晚了半拍。它总是这样。", "The right eye lagged. It always does."],
        ["眨完了。还是困。", "Done blinking. Still sleepy."],
        ["你看见了。那就算醒过一次。", "You saw it. That counts as waking once."]
      ],
      half: [
        ["只开一条缝。够用了。", "Just a slit. That is enough."],
        ["世界先以细线的样子进来。", "The world can come in as a thin line."],
        ["再多一点会晃。先这样。", "Any more and it wobbles. Stay here."]
      ],
      close: [
        ["好。先闭着。", "Alright. Closed for now."],
        ["眼皮比脑子诚实。", "The lids are more honest than the mind."],
        ["闭着也算在场。", "Closed still counts as being here."]
      ]
    };

    const $speech = document.getElementById("speech");
    const $face = document.getElementById("face");
    const $l = $face.querySelector(".lid-l");
    const $r = $face.querySelector(".lid-r");
    let last = "";
    let mode = "auto";

    function say(kind) {
      const list = LINES[kind];
      let next = list[Math.floor(Math.random() * list.length)];
      if (next[0] === last && list.length > 1) next = list[Math.floor(Math.random() * list.length)];
      last = next[0];
      $speech.innerHTML = next[0] + '<span class="en">' + next[1] + "</span>";
    }

    function resetAnim(el) {
      el.style.animation = "none";
      void el.offsetWidth;
    }

    function blinkOnce() {
      mode = "once";
      resetAnim($l);
      resetAnim($r);
      $l.style.animation = "blinkL 2.8s ease-in-out 1";
      $r.style.animation = "blinkR 2.8s ease-in-out 1";
      say("blink");
      setTimeout(function () {
        if (mode !== "once") return;
        $l.style.animation = "";
        $r.style.animation = "";
      }, 2900);
    }

    function hold(opennessL, opennessR, kind) {
      mode = "hold";
      $l.style.animation = "none";
      $r.style.animation = "none";
      $l.style.transform = "scaleY(" + opennessL + ")";
      $r.style.transform = "scaleY(" + opennessR + ")";
      say(kind);
    }

    function auto() {
      mode = "auto";
      $l.style.transform = "";
      $r.style.transform = "";
      $l.style.animation = "";
      $r.style.animation = "";
    }

    $face.addEventListener("click", blinkOnce);
    document.getElementById("slow").onclick = blinkOnce;
    document.getElementById("half").onclick = function () { hold(.28, .24, "half"); };
    document.getElementById("close").onclick = function () { hold(1, 1, "close"); };

    document.getElementById("enBtn").onclick = function () {
      const on = document.body.classList.toggle("show-en");
      this.setAttribute("aria-pressed", on ? "true" : "false");
    };

    say("greet");
  </script>
</body>
</html>
