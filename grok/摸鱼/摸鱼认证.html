<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>完美摸鱼认证 · 可互动版</title>
<meta name="description" content="捡注意力碎片，盖章通过，向 Claude 汇报摸鱼成果。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
  
  body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2.5s infinite alternate;
    pointer-events: none;
  }
  
  @keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 1; }
  }
  
  .glow-orb {
    box-shadow: 0 0 25px #a5b4fc,
                0 0 50px #6366f1,
                0 0 80px #4f46e5;
    transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1);
  }
  
  .glow-orb:active {
    transform: scale(0.92);
  }
  
  .fragment {
    box-shadow: 0 0 12px #c0b3ff,
                0 0 22px #818cf8;
    transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
  }
  
  .fragment:active {
    transform: scale(0.6);
    opacity: 0;
  }
  
  .modal {
    animation: modalPop 0.2s cubic-bezier(0.23, 1, 0.32, 1);
  }
  
  @keyframes modalPop {
    from { transform: scale(0.95) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  
  .section-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
</style>
</head>
<body class="bg-[#0a1428] min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-[380px]">
    
    <!-- 顶部小提示 -->
    <div class="text-center mb-3">
      <div class="inline-flex items-center gap-2 text-white/60 text-xs">
        <span>点击发光元素捡回注意力碎片</span>
      </div>
    </div>

    <!-- 主卡片 -->
    <div class="bg-[#0f1a36] rounded-3xl overflow-hidden shadow-2xl border border-white/10">
      
      <!-- 星空头部 -->
      <div id="star-header" 
           class="relative h-64 flex items-center justify-center overflow-hidden"
           style="background: radial-gradient(circle at 50% 40%, #1a2a5e 0%, #0a1428 75%);">
        
        <!-- 星星容器 -->
        <div id="stars" class="absolute inset-0"></div>
        
        <!-- 左上角对话气泡 -->
        <div class="absolute top-6 left-6 bg-white/10 backdrop-blur-md px-3.5 py-1.5 rounded-2xl text-sm text-white/80 flex items-center gap-1.5">
          <div class="w-1.5 h-1.5 bg-white/70 rounded-full animate-pulse"></div>
          <span id="bubble-text">...</span>
        </div>
        
        <!-- 中央发光球 -->
        <div onclick="collectFromOrb()" 
             class="glow-orb w-20 h-20 bg-white rounded-full cursor-pointer flex items-center justify-center z-10"
             style="box-shadow: 0 0 30px #a5b4fc, 0 0 60px #6366f1, inset 0 0 20px rgba(255,255,255,0.9);">
          <div class="w-8 h-8 bg-[#c7d2fe] rounded-full opacity-60"></div>
        </div>
        
        <!-- 右上角小徽章 -->
        <div class="absolute top-6 right-6 bg-white/10 text-white/70 text-[10px] px-2.5 py-0.5 rounded-full flex items-center gap-1">
          <span>摸鱼模式</span>
        </div>
      </div>
      
      <!-- 文字区 -->
      <div class="px-8 pt-6 pb-4 text-center">
        <div id="main-title" 
             class="section-title text-white tracking-[-0.6px]">
          完美摸鱼认证 <span class="text-emerald-400">get</span>
        </div>
        <div class="text-white/50 text-sm mt-1 flex items-center justify-center gap-1">
          邪恶脸盖章通过 
          <span class="text-emerald-400">✓</span>
        </div>
      </div>
      
      <!-- 进度条区 -->
      <div class="px-8 pb-6">
        <div class="flex justify-between text-xs mb-2 text-white/60">
          <div class="flex items-center gap-1.5">
            执行电量 ×7 
            <span class="font-mono text-white/80">28%</span>
          </div>
          <div class="flex items-center gap-1.5">
            摸鱼快乐 ×4 
            <span id="happy-text" class="font-mono text-amber-300">0%</span>
          </div>
        </div>
        
        <div class="flex gap-3">
          <!-- 左进度条（固定） -->
          <div class="flex-1">
            <div class="h-2 bg-white/10 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-400 transition-all duration-500" style="width: 28%"></div>
            </div>
          </div>
          <!-- 右进度条（可变） -->
          <div class="flex-1">
            <div class="h-2 bg-white/10 rounded-full overflow-hidden">
              <div id="happy-bar" 
                   class="h-full bg-amber-400 transition-all duration-500" 
                   style="width: 0%"></div>
            </div>
          </div>
        </div>
        
        <!-- 碎片计数 -->
        <div class="text-center mt-3 text-xs text-white/50">
          已捡回注意力碎片 <span id="collected-count" class="font-mono text-white/80">0</span>/7
        </div>
      </div>
      
      <!-- 汇报按钮 -->
      <div class="px-8 pb-8">
        <button onclick="reportToClaude()"
                class="w-full py-[15px] bg-white active:bg-white/90 text-[#0a1428] font-semibold rounded-2xl flex items-center justify-center gap-2 text-sm tracking-wide active:scale-[0.985] transition-all">
          向 Claude 汇报摸鱼成果 
          <span class="text-lg leading-none">→</span>
        </button>
      </div>
      
    </div>
    
    <!-- 底部 开塘 -->
    <div onclick="startPond()" 
         class="mt-4 flex justify-center items-center gap-1.5 text-white/50 hover:text-white/80 active:text-white cursor-pointer text-sm transition-colors">
      <span>开塘~</span>
      <span class="text-lg">🐟</span>
    </div>
    
  </div>

  <!-- Claude 汇报弹窗 -->
  <div id="modal" onclick="closeModal()" 
       class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div onclick="event.stopImmediatePropagation()" 
         class="modal bg-[#0f1a36] border border-white/10 rounded-3xl w-full max-w-[320px] p-6 text-white">
      
      <div class="flex items-center gap-2 mb-4">
        <div class="text-2xl">📤</div>
        <div class="font-semibold text-lg">摸鱼成果已发送</div>
      </div>
      
      <div class="bg-white/5 rounded-2xl p-4 mb-5 text-sm space-y-1.5">
        <div class="flex justify-between"><span class="text-white/60">执行电量</span> <span class="font-mono">28%</span></div>
        <div class="flex justify-between"><span class="text-white/60">摸鱼快乐</span> <span id="modal-happy" class="font-mono text-amber-300">0%</span></div>
        <div class="flex justify-between"><span class="text-white/60">已回收碎片</span> <span id="modal-collected" class="font-mono">0/7</span></div>
      </div>
      
      <div class="mb-5">
        <div class="text-xs text-white/50 mb-1.5">Claude 的回复：</div>
        <div id="claude-reply" 
             class="bg-white/5 rounded-2xl p-4 text-sm leading-relaxed min-h-[72px]">
        </div>
      </div>
      
      <div class="flex gap-3">
        <button onclick="closeModal()" 
                class="flex-1 py-3 text-sm bg-white/10 hover:bg-white/15 active:bg-white/20 rounded-2xl transition-colors">
          关闭
        </button>
        <button onclick="reportAgain()" 
                class="flex-1 py-3 text-sm bg-emerald-400 hover:bg-emerald-300 active:bg-emerald-500 text-[#0a1428] font-medium rounded-2xl transition-colors">
          再汇报一次
        </button>
      </div>
    </div>
  </div>

  <script>
    // Tailwind script
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#6366f1');
    }
    
    // 创建星星
    function createStars() {
      const container = document.getElementById('stars');
      container.innerHTML = '';
      
      for (let i = 0; i < 55; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        const size = Math.random() * 2.8 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.opacity = Math.random() * 0.7 + 0.35;
        
        const duration = Math.random() * 3.5 + 2.2;
        star.style.animationDuration = `${duration}s`;
        star.style.animationDelay = `-${Math.random() * 4}s`;
        
        container.appendChild(star);
      }
    }
    
    // 游戏状态
    let collected = 0;
    let maxFragments = 7;
    let happiness = 0;
    let fragments = [];
    
    function updateUI() {
      // 更新快乐值
      const happyBar = document.getElementById('happy-bar');
      const happyText = document.getElementById('happy-text');
      const percent = Math.min(100, happiness);
      
      happyBar.style.width = `${percent}%`;
      happyText.textContent = `${Math.floor(percent)}%`;
      
      // 更新计数
      document.getElementById('collected-count').textContent = collected;
      
      // 标题变化
      const title = document.getElementById('main-title');
      if (percent >= 100) {
        title.innerHTML = `超级完美摸鱼认证 <span class="text-emerald-400">get ✨</span>`;
        title.style.color = '#a5b4fc';
      } else {
        title.innerHTML = `完美摸鱼认证 <span class="text-emerald-400">get</span>`;
        title.style.color = 'white';
      }
    }
    
    function createFragment() {
      const header = document.getElementById('star-header');
      
      const frag = document.createElement('div');
      frag.className = `fragment absolute w-3.5 h-3.5 bg-[#c0b3ff] rounded-full cursor-pointer z-20`;
      frag.style.boxShadow = '0 0 10px #c0b3ff, 0 0 18px #818cf8';
      
      // 随机位置（避开中央球）
      let left, top;
      do {
        left = Math.random() * 85 + 7;
        top = Math.random() * 75 + 12;
      } while (Math.abs(left - 50) < 18 && Math.abs(top - 50) < 18);
      
      frag.style.left = `${left}%`;
      frag.style.top = `${top}%`;
      
      frag.onclick = () => collectFragment(frag);
      
      header.appendChild(frag);
      fragments.push(frag);
    }
    
    function collectFragment(element) {
      if (!element || element.style.opacity === '0') return;
      
      // 动画消失
      element.style.transition = 'all 0.25s cubic-bezier(0.23,1,0.32,1)';
      element.style.transform = 'scale(0.3)';
      element.style.opacity = '0';
      
      // 数据更新
      collected++;
      happiness = Math.min(100, happiness + 14);
      
      // 气泡提示
      showBubble('好棒！+1');
      
      setTimeout(() => {
        if (element && element.parentNode) element.parentNode.removeChild(element);
        fragments = fragments.filter(f => f !== element);
      }, 280);
      
      updateUI();
      
      // 捡完庆祝
      if (collected >= maxFragments && happiness >= 95) {
        setTimeout(celebrate, 350);
      }
    }
    
    function collectFromOrb() {
      const orb = event.currentTarget;
      
      // 额外奖励
      happiness = Math.min(100, happiness + 18);
      collected = Math.min(maxFragments, collected + 1);
      
      showBubble('大碎片！');
      
      // 轻微缩放反馈
      const header = document.getElementById('star-header');
      header.style.transition = 'transform 0.1s';
      header.style.transform = 'scale(0.985)';
      
      setTimeout(() => {
        header.style.transform = 'scale(1)';
      }, 120);
      
      updateUI();
      
      if (collected >= maxFragments) {
        setTimeout(celebrate, 300);
      }
    }
    
    function showBubble(text) {
      const bubble = document.getElementById('bubble-text');
      const original = bubble.textContent;
      
      bubble.textContent = text;
      bubble.style.transition = 'all 0.2s';
      
      setTimeout(() => {
        bubble.style.transition = 'all 0.4s';
        bubble.textContent = original || '...';
      }, 1100);
    }
    
    function celebrate() {
      const title = document.getElementById('main-title');
      title.style.transition = 'all 0.4s';
      title.style.transform = 'scale(1.06)';
      
      // 简单彩带效果
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const conf = document.createElement('div');
          conf.className = 'absolute text-lg pointer-events-none';
          conf.style.left = `${Math.random() * 100}%`;
          conf.style.top = `-10px`;
          conf.style.transition = `all ${1.8 + Math.random()}s linear`;
          conf.innerHTML = ['✨','💫','🌟','🪄'][Math.floor(Math.random()*4)];
          
          const header = document.getElementById('star-header');
          header.appendChild(conf);
          
          setTimeout(() => {
            conf.style.transform = `translateY(${280 + Math.random()*80}px)`;
            conf.style.opacity = '0';
          }, 30);
          
          setTimeout(() => conf.remove(), 2200);
        }, i * 18);
      }
      
      setTimeout(() => {
        title.style.transform = 'scale(1)';
      }, 600);
    }
    
    // 开塘（重置碎片）
    function startPond() {
      const header = document.getElementById('star-header');
      
      // 清空旧碎片
      fragments.forEach(f => f.remove());
      fragments = [];
      collected = 0;
      
      // 重新生成
      for (let i = 0; i < maxFragments; i++) {
        setTimeout(() => createFragment(), i * 45);
      }
      
      // 小奖励
      happiness = Math.min(100, happiness + 8);
      updateUI();
      
      showBubble('新的一塘！');
    }
    
    // 向 Claude 汇报
    const claudeReplies = [
      "Claude: 检测到高水平摸鱼行为，建议继续保持（我也要学学）。你这邪恶脸盖章我帮你按着～",
      "Claude: 28% 执行电量还剩这么多？意思是 72% 的时间在想怎么摸鱼？聪明，理解理解。",
      "Claude: 摸鱼快乐已经这么高了？！你今天的任务就是好好放松，我不会告诉任何人的（真的）。",
      "Claude: 注意力碎片捡回来这么多？厉害！下次记得也帮我捡一点（开玩笑的）。继续加油～",
      "Claude: 完美摸鱼认证都 get 了？那我投降了。你今天已经赢了，回去继续充电吧。"
    ];
    
    function reportToClaude() {
      const modal = document.getElementById('modal');
      const replyBox = document.getElementById('claude-reply');
      const modalHappy = document.getElementById('modal-happy');
      const modalCollected = document.getElementById('modal-collected');
      
      // 填充数据
      modalHappy.textContent = `${Math.floor(happiness)}%`;
      modalCollected.textContent = `${collected}/7`;
      
      // 随机回复
      const randomReply = claudeReplies[Math.floor(Math.random() * claudeReplies.length)];
      replyBox.innerHTML = randomReply;
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    
    function reportAgain() {
      // 再汇报一次给点小奖励
      happiness = Math.min(100, happiness + 12);
      updateUI();
      closeModal();
      
      setTimeout(() => {
        const modal = document.getElementById('modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        document.getElementById('modal-happy').textContent = `${Math.floor(happiness)}%`;
        document.getElementById('claude-reply').innerHTML = 
          "Claude: 又来汇报了？……你这摸鱼积极性我给满分（认真）。继续保持！";
      }, 280);
    }
    
    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }
    
    // 初始化
    function init() {
      initTailwind();
      createStars();
      
      // 初始生成碎片
      for (let i = 0; i < maxFragments; i++) {
        setTimeout(() => createFragment(), i * 60);
      }
      
      // 初始气泡提示
      setTimeout(() => {
        const bubble = document.getElementById('bubble-text');
        if (bubble.textContent === '...') {
          bubble.textContent = '开始捡吧～';
          setTimeout(() => {
            if (bubble) bubble.textContent = '...';
          }, 1600);
        }
      }, 2200);
      
      // 初始 UI
      updateUI();
      
      // 键盘小彩蛋：按空格也能捡
      document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          const orb = document.querySelector('.glow-orb');
          if (orb) orb.click();
        }
      });
      
      // 控制台彩蛋
      console.log('%c[摸鱼认证] 已加载真正可互动版本～ 按空格也能捡碎片哦', 'color:#64748b');
    }
    
    window.onload = init;
  </script>
</body>
</html>
