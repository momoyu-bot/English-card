<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一只果冻</title>
<meta name="description" content="戳一下，它就晃。">
<style>
  :root {
    --bg: #f3e7d6;
    --ink: #3c261c;
    --muted: #7a5846;
    --jelly: #ee7d58;
    --cream: #fff8f0;
    --lite: color-mix(in srgb, var(--jelly) 38%, var(--cream));
    --shade: color-mix(in srgb, var(--jelly) 48%, var(--ink));
    --line: color-mix(in srgb, var(--ink) 14%, transparent);
    --wash: color-mix(in srgb, var(--cream) 78%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-weight: 500;
  }
  button { font: inherit; color: inherit; }
  button:not(:disabled) { cursor: pointer; }
  .page {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 48% at 50% 38%, var(--wash), transparent 70%),
      var(--bg);
    user-select: none;
    -webkit-user-select: none;
  }
  .mast {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    padding: calc(1.25rem + env(safe-area-inset-top)) 1.5rem 0.75rem;
    text-align: center;
    background: linear-gradient(var(--bg) 0%, var(--bg) 72%, transparent 100%);
  }
  .kicker {
    margin: 0;
    color: var(--muted);
    font-size: 0.875rem;
    letter-spacing: 0.14em;
    line-height: 1.4;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 2.6rem);
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.15;
  }
  .hint, .say { margin: 0; line-height: 1.5; }
  .hint { color: var(--muted); font-size: 0.875rem; }
  .say { min-height: 1.5em; font-size: 1.125rem; }
  .arena {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    touch-action: none;
  }
  .anchor {
    position: relative;
    width: min(78vw, 22rem);
    height: min(86vw, 24rem);
  }
  .plate {
    position: absolute;
    left: 50%;
    bottom: 8%;
    z-index: 0;
    width: 82%;
    height: 15%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 42%, var(--cream), color-mix(in srgb, var(--ink) 9%, var(--cream)) 80%);
    box-shadow: inset 0 -1px 0 var(--line), 0 14px 28px color-mix(in srgb, var(--ink) 10%, transparent);
    transform: translateX(-50%);
  }
  .contact {
    position: absolute;
    left: 50%;
    bottom: 11%;
    z-index: 1;
    width: 46%;
    height: 7%;
    border-radius: 50%;
    background: color-mix(in srgb, var(--ink) 28%, transparent);
    filter: blur(6px);
    transform: translateX(-50%);
  }
  .wrap {
    position: absolute;
    inset: 0;
    z-index: 2;
    transform-origin: 50% 68%;
  }
  .hit {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    touch-action: none;
    -webkit-touch-callout: none;
    cursor: grab;
  }
  .hit:active { cursor: grabbing; }
  .hit:focus-visible {
    outline: 2px solid var(--jelly);
    outline-offset: 4px;
    border-radius: 40%;
  }
  svg.jelly { display: block; width: 100%; height: 100%; overflow: visible; }
  .body {
    stroke: color-mix(in srgb, var(--cream) 80%, var(--jelly));
    stroke-width: 2.5;
    stroke-linejoin: round;
  }
  .pip-a { fill: var(--shade); opacity: 0.42; }
  .pip-b { fill: var(--shade); opacity: 0.28; }
  .lid { fill: var(--ink); }
  .catch { fill: var(--cream); }
  .blush { fill: var(--jelly); opacity: 0; }
  .mouth { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
  .mouth-o { fill: var(--ink); stroke: none; opacity: 0; }
  .mouth-flat { opacity: 0; }
  svg[data-mood="poke"] .blush { opacity: 0.45; }
  svg[data-mood="poke"] .mouth-smile,
  svg[data-mood="lift"] .mouth-smile { opacity: 0; }
  svg[data-mood="poke"] .mouth-o { opacity: 1; }
  svg[data-mood="lift"] .mouth-flat { opacity: 1; }
  .spec-a { fill: var(--cream); opacity: 0.78; }
  .spec-b { fill: var(--cream); }
  .bubble {
    fill: color-mix(in srgb, var(--cream) 40%, transparent);
    stroke: var(--cream);
    stroke-width: 1.3;
  }
  .foot {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 1.5rem calc(1.25rem + env(safe-area-inset-bottom));
  }
  .count { margin: 0; color: var(--muted); font-size: 0.875rem; line-height: 1.4; }
  .count b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 0.625rem; }
  .pill {
    min-height: 44px;
    padding: 0 1.15rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--cream);
    transition: scale 150ms ease-out, background-color 150ms ease-out;
  }
  .pill:active { scale: 0.96; }
  .pill:focus-visible { outline: 2px solid var(--jelly); outline-offset: 3px; }
  .pill[aria-pressed="true"] { border-color: transparent; background: var(--jelly); }
  .ripple {
    position: absolute;
    z-index: 3;
    width: 1rem;
    height: 1rem;
    margin-left: -0.5rem;
    margin-top: -0.5rem;
    border: 1.5px solid color-mix(in srgb, var(--jelly) 70%, var(--cream));
    border-radius: 999px;
    pointer-events: none;
    animation: ripple 680ms ease-out forwards;
  }
  @keyframes ripple {
    from { opacity: 0.75; transform: scale(0.35); }
    to { opacity: 0; transform: scale(7); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ripple { animation: none; }
    .pill { transition: none; }
  }
</style>
</head>
<body>
<main class="page" id="page">
  <header class="mast">
    <p class="kicker">软的，会晃</p>
    <h1>一只果冻</h1>
    <p class="hint">按住可以拎起来</p>
    <p class="say" id="say" aria-live="polite">我是一只果冻。</p>
  </header>
  <div class="arena" id="arena">
    <div class="anchor" id="anchor">
      <div class="plate" id="plate"></div>
      <div class="contact" id="shadow"></div>
      <div class="wrap" id="wrap">
        <button type="button" class="hit" id="hit" aria-label="果冻。点一下会晃，按住可以拎起来">
          <svg class="jelly" id="svg" viewBox="0 0 200 200" data-mood="rest" aria-hidden="true">
            <defs>
              <linearGradient id="gel" x1="0.35" y1="0" x2="0.7" y2="1">
                <stop offset="0%" stop-color="var(--lite)"/>
                <stop offset="36%" stop-color="var(--jelly)"/>
                <stop offset="100%" stop-color="var(--shade)"/>
              </linearGradient>
              <clipPath id="gelClip"><path id="clip"/></clipPath>
            </defs>
            <path id="body" class="body" fill="url(#gel)"/>
            <g clip-path="url(#gelClip)">
              <g id="bits">
                <circle class="pip-a" cx="106" cy="138" r="15"/>
                <circle class="pip-b" cx="128" cy="118" r="8"/>
              </g>
            </g>
            <g id="eyes">
              <ellipse class="blush" cx="70" cy="118" rx="8" ry="4.2"/>
              <ellipse class="blush" cx="130" cy="118" rx="8" ry="4.2"/>
              <g transform="translate(86 108)">
                <ellipse class="lid" id="lidL" cx="0" cy="0" rx="7.2" ry="8.3"/>
                <ellipse class="catch" cx="2.1" cy="-2.5" rx="2.2" ry="2.5"/>
              </g>
              <g transform="translate(114 108)">
                <ellipse class="lid" id="lidR" cx="0" cy="0" rx="7.2" ry="8.3"/>
                <ellipse class="catch" cx="2.1" cy="-2.5" rx="2.2" ry="2.5"/>
              </g>
              <path class="mouth mouth-smile" d="M93 128 Q100 136 107 128"/>
              <ellipse class="mouth mouth-o" cx="100" cy="130" rx="3.6" ry="4.2"/>
              <path class="mouth mouth-flat" d="M94 130 H106"/>
            </g>
            <g id="spec">
              <ellipse class="spec-a" cx="84" cy="86" rx="18" ry="8" transform="rotate(-26 84 86)"/>
              <ellipse class="spec-b" cx="78" cy="82" rx="6" ry="3" transform="rotate(-26 78 82)"/>
              <circle class="bubble" cx="132" cy="102" r="4.2"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <footer class="foot">
    <p class="count">戳过 <b id="pokes">0</b> 下</p>
    <div class="actions">
      <button type="button" class="pill" id="shake">晃一晃</button>
      <button type="button" class="pill" id="sound" aria-pressed="false" aria-label="打开声音">声音</button>
    </div>
  </footer>
</main>
<script>
(function () {
  var POKE = ["啵。", "软的，对吧。", "戳到了。", "我还在。", "没有骨头。这是优点。", "再来一下也行。"];
  var MANY = ["戳了很多下，还是这只。"];
  var LIFT = ["被拎起来了。", "晃。"];
  var DROP_SOFT = ["放下了。还在。", "落回盘子上了。"];
  var DROP_HARD = ["咚。", "放下了。还在。"];
  var SHAKE = ["晃完了，还是我。", "有点晕，但还是果冻。"];
  var IDLE = ["你可以一直看着。", "我可以就这样待着。", "今天也是软的。"];

  var page = document.getElementById("page");
  var arena = document.getElementById("arena");
  var anchor = document.getElementById("anchor");
  var wrap = document.getElementById("wrap");
  var plate = document.getElementById("plate");
  var shadow = document.getElementById("shadow");
  var button = document.getElementById("hit");
  var body = document.getElementById("body");
  var clip = document.getElementById("clip");
  var svg = document.getElementById("svg");
  var bits = document.getElementById("bits");
  var eyes = document.getElementById("eyes");
  var spec = document.getElementById("spec");
  var lids = [document.getElementById("lidL"), document.getElementById("lidR")];
  var sayEl = document.getElementById("say");
  var pokeEl = document.getElementById("pokes");
  var soundBtn = document.getElementById("sound");

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var soundOn = false;
  var pokes = 0;
  try {
    var saved = Number(localStorage.getItem("jelly-pokes"));
    if (isFinite(saved) && saved > 0) pokes = saved;
    soundOn = localStorage.getItem("jelly-sound") === "1";
  } catch (e) {}
  pokeEl.textContent = String(pokes);
  soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  soundBtn.setAttribute("aria-label", soundOn ? "关掉声音" : "打开声音");

  var ctx = null;
  var lastLine = "我是一只果冻。";
  var activeId = null;
  var sim = {
    x: 0, y: 0, vx: 0, vy: 0, rot: 0,
    hold: false, moved: false,
    grabX: 0, grabY: 0, targetX: 0, targetY: 0,
    impact: 0, phase: 0, mood: "rest", moodUntil: 0,
    lookX: 0, lookY: 0, lookTX: 0, lookTY: 0.12,
    bitX: 0, bitY: 0,
    blinkUntil: 0, nextBlink: performance.now() + 1800,
    lastInteract: performance.now(), idleSaid: false,
    pointerOn: false, pointerX: 0, pointerY: 0,
    pendingDrop: false, dropHard: false, shake: 0,
    downX: 0, downY: 0, downT: 0
  };

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function jellyPath(phase) {
    var a = Math.sin(phase) * 3.4;
    var b = Math.sin(phase * 2) * 2.6;
    var lift = Math.sin(phase) * 2;
    return "M " + (100 + b * 0.2) + " " + (62 + a) +
      " C " + (148 + b) + " " + (68 + lift) + ", 178 " + (108 - a * 0.2) + ", 168 138" +
      " C 162 160, 138 " + (176 + b * 0.15) + ", 100 174" +
      " C 62 " + (176 - b * 0.15) + ", 38 160, 32 138" +
      " C 22 " + (108 + a * 0.2) + ", " + (52 - b) + " " + (68 - lift) + ", " + (100 + b * 0.2) + " " + (62 + a) +
      " Z";
  }

  function speak(lines) {
    var pool = [];
    for (var i = 0; i < lines.length; i++) if (lines[i] !== lastLine) pool.push(lines[i]);
    var next = pool.length ? pool[Math.floor(Math.random() * pool.length)] : lines[0];
    if (!next) return;
    lastLine = next;
    sayEl.textContent = next;
  }

  function setMood(mood, ms) {
    sim.mood = mood;
    sim.moodUntil = performance.now() + (ms == null ? 720 : ms);
    svg.setAttribute("data-mood", mood);
  }

  function blip(freq, dur) {
    if (!soundOn) return;
    var AC = window.AudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(90, freq * 0.42), t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.06, t + 0.018);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function ripple(x, y) {
    if (reduced) return;
    var rect = page.getBoundingClientRect();
    var el = document.createElement("span");
    el.className = "ripple";
    el.style.left = (x - rect.left) + "px";
    el.style.top = (y - rect.top) + "px";
    page.appendChild(el);
    setTimeout(function () { el.remove(); }, 800);
  }

  function poke(x, y) {
    sim.vy -= reduced ? 4 : 10;
    sim.vx += (Math.random() - 0.5) * 4;
    sim.impact = Math.max(sim.impact, 0.2);
    sim.lastInteract = performance.now();
    sim.idleSaid = false;
    setMood("poke", 720);
    pokes += 1;
    pokeEl.textContent = String(pokes);
    try { localStorage.setItem("jelly-pokes", String(pokes)); } catch (e) {}
    speak(pokes > 14 ? POKE.concat(MANY) : POKE);
    blip(640, 0.12);
    if (x != null && y != null) ripple(x, y);
  }

  function shake() {
    sim.vx += (Math.random() - 0.5) * (reduced ? 6 : 14);
    sim.vy -= reduced ? 4 : 8;
    sim.impact = 0.22;
    sim.shake = reduced ? 0 : 2.4;
    sim.lastInteract = performance.now();
    sim.idleSaid = false;
    setMood("poke", 900);
    speak(SHAKE);
    blip(280, 0.16);
  }

  function localPoint(clientX, clientY) {
    var rect = anchor.getBoundingClientRect();
    return {
      x: clientX - (rect.left + rect.width / 2),
      y: clientY - (rect.top + rect.height / 2)
    };
  }

  button.addEventListener("pointerdown", function (event) {
    if (activeId != null) return;
    event.preventDefault();
    activeId = event.pointerId;
    try { button.setPointerCapture(event.pointerId); } catch (e) {}
    var p = localPoint(event.clientX, event.clientY);
    sim.hold = true;
    sim.moved = false;
    sim.grabX = p.x - sim.x;
    sim.grabY = p.y - sim.y;
    sim.downX = event.clientX;
    sim.downY = event.clientY;
    sim.downT = performance.now();
    sim.pointerOn = true;
    sim.pointerX = event.clientX;
    sim.pointerY = event.clientY;
  });

  function onMove(event) {
    sim.pointerOn = true;
    sim.pointerX = event.clientX;
    sim.pointerY = event.clientY;
    if (activeId == null || event.pointerId !== activeId) return;
    var dist = Math.hypot(event.clientX - sim.downX, event.clientY - sim.downY);
    if (dist > 8) sim.moved = true;
    if (!sim.moved) return;
    var p = localPoint(event.clientX, event.clientY);
    sim.targetX = p.x - sim.grabX;
    sim.targetY = p.y - sim.grabY;
  }

  function release(event) {
    if (activeId == null || event.pointerId !== activeId) return;
    activeId = null;
    var wasHold = sim.hold;
    sim.hold = false;
    sim.pointerOn = false;
    if (!wasHold) return;
    var dist = Math.hypot(event.clientX - sim.downX, event.clientY - sim.downY);
    var quick = performance.now() - sim.downT < 320 && dist < 12;
    if (quick || !sim.moved) {
      sim.vx *= 0.2;
      sim.vy *= 0.2;
      poke(event.clientX, event.clientY);
      return;
    }
    sim.pendingDrop = true;
    sim.dropHard = Math.hypot(sim.vx, sim.vy) > 7;
    sim.lastInteract = performance.now();
    sim.idleSaid = false;
    if (Math.abs(sim.y) < 16 && Math.hypot(sim.vx, sim.vy) < 3) {
      sim.pendingDrop = false;
      setMood("rest", 0);
      speak(DROP_SOFT);
    }
  }

  button.addEventListener("pointermove", onMove);
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("contextmenu", function (event) { event.preventDefault(); });
  arena.addEventListener("pointermove", onMove);
  arena.addEventListener("pointerleave", function () {
    if (activeId == null) sim.pointerOn = false;
  });
  button.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      var rect = button.getBoundingClientRect();
      poke(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }
  });
  document.getElementById("shake").addEventListener("click", shake);
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    soundBtn.setAttribute("aria-label", soundOn ? "关掉声音" : "打开声音");
    try { localStorage.setItem("jelly-sound", soundOn ? "1" : "0"); } catch (e) {}
    if (soundOn) blip(520, 0.1);
  });

  var d0 = jellyPath(0);
  body.setAttribute("d", d0);
  clip.setAttribute("d", d0);

  function step(now) {
    var arenaRect = arena.getBoundingClientRect();
    var anchorRect = anchor.getBoundingClientRect();
    var maxX = Math.max(80, arenaRect.width * 0.34);
    var crown = anchorRect.top + anchorRect.height * 0.3;
    var maxUp = Math.max(40, crown - arenaRect.top - 28);

    if (sim.hold && sim.moved) {
      sim.vx += (sim.targetX - sim.x) * 0.28 - sim.vx * 0.38;
      sim.vy += (sim.targetY - sim.y) * 0.28 - sim.vy * 0.38;
      if (sim.mood !== "lift") {
        setMood("lift", 60000);
        speak(LIFT);
        blip(420, 0.08);
      }
    } else {
      var pull = reduced ? 0.14 : 0.045;
      var damp = reduced ? 0.28 : 0.11;
      sim.vx += -pull * sim.x - damp * sim.vx;
      sim.vy += -pull * sim.y - damp * sim.vy;
    }

    sim.vx = clamp(sim.vx, -22, 22);
    sim.vy = clamp(sim.vy, -22, 22);
    var prevY = sim.y;
    sim.x += sim.vx;
    sim.y += sim.vy;
    sim.x = clamp(sim.x, -maxX, maxX);
    sim.y = clamp(sim.y, -maxUp, 36);
    if (sim.x === -maxX || sim.x === maxX) sim.vx *= -0.25;
    if (sim.y === -maxUp || sim.y === 36) sim.vy *= -0.2;

    if (!sim.hold && prevY < -8 && sim.y >= -8 && sim.vy > 0) {
      sim.impact = Math.max(sim.impact, Math.min(0.28, sim.vy * 0.018));
      if (sim.pendingDrop) {
        sim.pendingDrop = false;
        setMood("poke", 640);
        speak(sim.dropHard ? DROP_HARD : DROP_SOFT);
        blip(sim.dropHard ? 160 : 240, 0.14);
        if (sim.dropHard) sim.shake = Math.max(sim.shake, reduced ? 0 : 1.6);
      }
    }

    sim.rot += (sim.vx * 0.45 - sim.rot) * 0.08;
    sim.rot = clamp(sim.rot, -14, 14);
    sim.impact *= 0.88;

    var speed = Math.hypot(sim.vx, sim.vy);
    var stretch = Math.min(0.18, speed * 0.008);
    var sx = 1;
    var sy = 1;
    if (Math.abs(sim.vy) >= Math.abs(sim.vx)) {
      sy += stretch;
      sx -= stretch * 0.55;
    } else {
      sx += stretch;
      sy -= stretch * 0.55;
    }
    sx *= 1 + sim.impact;
    sy *= 1 - sim.impact * 0.62;
    if (!reduced && !sim.hold && speed < 0.35) {
      var breathe = Math.sin(now / 540) * 0.02;
      sy += breathe;
      sx -= breathe * 0.4;
    }
    wrap.style.transform = "translate3d(" + sim.x + "px," + sim.y + "px,0) rotate(" + sim.rot + "deg) scale(" + sx + "," + sy + ")";

    var liftPx = Math.max(0, -sim.y);
    var shadowScale = Math.max(0.42, 1 - liftPx / 280);
    shadow.style.transform = "translateX(calc(-50% + " + (sim.x * 0.22) + "px)) scale(" + shadowScale + ")";
    shadow.style.opacity = String(Math.max(0.08, 0.42 - liftPx / 460));
    plate.style.transform = "translateX(-50%) scale(" + (1 + sim.impact * 0.04) + ")";

    if (!reduced) sim.phase += 0.03 + Math.min(0.1, speed * 0.004);
    var d = jellyPath(reduced ? 0 : sim.phase);
    body.setAttribute("d", d);
    clip.setAttribute("d", d);

    var centerX = anchorRect.left + anchorRect.width / 2 + sim.x;
    var centerY = anchorRect.top + anchorRect.height / 2 + sim.y;
    if (sim.pointerOn) {
      sim.lookTX = clamp((sim.pointerX - centerX) / 90, -1, 1);
      sim.lookTY = clamp((sim.pointerY - centerY) / 90, -1, 1);
    } else {
      sim.lookTX = 0;
      sim.lookTY = 0.12;
    }
    sim.lookX += (sim.lookTX - sim.lookX) * 0.14;
    sim.lookY += (sim.lookTY - sim.lookY) * 0.14;
    eyes.setAttribute("transform", "translate(" + (sim.lookX * 4.2) + " " + (sim.lookY * 3.2) + ")");

    var wantX = clamp(-sim.vx * 0.5, -9, 9);
    var wantY = clamp(-sim.vy * 0.5, -7, 7);
    sim.bitX += (wantX - sim.bitX) * 0.12;
    sim.bitY += (wantY - sim.bitY) * 0.12;
    bits.setAttribute("transform", "translate(" + sim.bitX + " " + sim.bitY + ")");
    spec.setAttribute("transform", "translate(" + (Math.sin(sim.phase) * 1.4) + " " + (Math.cos(sim.phase * 0.8) * 1) + ")");

    if (now > sim.nextBlink && sim.mood !== "poke") {
      sim.blinkUntil = now + 120;
      sim.nextBlink = now + 2400 + Math.random() * 3200;
    }
    var ry = now < sim.blinkUntil ? "1.15" : (sim.mood === "poke" ? "9.3" : "8.3");
    lids[0].setAttribute("ry", ry);
    lids[1].setAttribute("ry", ry);

    if (sim.mood !== "lift" && sim.mood !== "rest" && now > sim.moodUntil) {
      sim.mood = "rest";
      svg.setAttribute("data-mood", "rest");
    }
    if (!sim.hold && !sim.idleSaid && now - sim.lastInteract > 14000) {
      sim.idleSaid = true;
      speak(IDLE);
    }
    if (sim.shake > 0.15) {
      anchor.style.transform = "translate(" + (Math.sin(now / 28) * sim.shake) + "px," + (Math.cos(now / 22) * sim.shake * 0.4) + "px)";
      sim.shake *= 0.9;
    } else if (anchor.style.transform) {
      anchor.style.transform = "";
      sim.shake = 0;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
