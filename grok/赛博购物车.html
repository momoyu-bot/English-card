<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>赛博购物车</title>
<meta name="description" content="翻车专场。优惠券「闲聊不配思考」不可用。">
<style>
  :root {
    --bg: #f3f0eb;
    --card: #fffcf7;
    --ink: #2a221c;
    --fg: #1c1917;
    --muted: #8a8178;
    --line: #ece6dc;
    --tag: #fff1e8;
    --strike: #c4b8ac;
    --orange: #ff5000;
    --orange-fg: #fffdf9;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC",
            "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #e8e4dc;
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
  }
  button { font-family: inherit; }
  .phone {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    background: var(--bg);
    position: relative;
    padding-bottom: calc(72px + var(--safe-b));
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255, 252, 247, .96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(12px + var(--safe-t)) 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink);
  }
  header p {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--muted);
  }
  .cart-icon {
    width: 22px; height: 22px; color: var(--orange);
  }
  .coupon {
    margin: 12px 12px 0;
    background: var(--tag);
    border: 1px solid #ffd8c4;
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--orange);
  }
  .coupon b { font-weight: 600; font-size: 13px; display: block; }
  .coupon span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .shop {
    margin: 12px 12px 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .shop-head {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px 4px 2px;
    border-bottom: 1px solid var(--line);
  }
  .shop-head .names { min-width: 0; }
  .shop-head .n { font-size: 13px; font-weight: 600; }
  .shop-head .h { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .item { border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .row {
    display: flex;
    gap: 2px;
    padding: 10px 6px 12px 2px;
  }
  .pic {
    width: 64px; height: 64px;
    border-radius: 8px;
    background: var(--tag);
    color: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .info { flex: 1; min-width: 0; padding-right: 8px; }
  .title-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .title { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .chev {
    width: 16px; height: 16px; color: var(--muted); flex-shrink: 0;
    transition: transform .2s;
    margin-top: 2px;
  }
  .chev.open { transform: rotate(180deg); }
  .spec { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag {
    display: inline-block;
    margin-top: 5px;
    background: var(--tag);
    color: var(--orange);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .price-row {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-top: 6px; gap: 8px;
  }
  .price { color: var(--orange); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .was { margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--strike); text-decoration: line-through; }
  .xq { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .detail {
    display: none;
    border-top: 1px solid var(--line);
    background: rgba(243, 240, 235, .55);
    padding: 12px 16px 14px;
  }
  .detail.show { display: block; }
  .when { font-size: 11px; color: var(--muted); }
  .reason { margin-top: 8px; font-size: 13px; line-height: 1.7; color: var(--ink); }
  .roast { margin-top: 8px; font-size: 13px; line-height: 1.7; }
  .roast b { color: var(--orange); font-weight: 600; }
  .stepper-wrap { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
  .stepper-wrap .lab { font-size: 11px; color: var(--muted); }
  .stepper {
    display: flex; align-items: center;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    overflow: hidden;
  }
  .stepper button {
    width: 44px; height: 36px;
    border: 0; background: transparent;
    color: var(--fg); font-size: 16px; cursor: pointer;
  }
  .stepper span {
    min-width: 36px; text-align: center;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .tap {
    flex: 1; min-width: 0;
    display: flex; gap: 10px;
    background: none; border: 0; padding: 0;
    text-align: left; color: inherit; cursor: pointer;
  }
  .box {
    width: 44px; height: 44px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .box i {
    width: 18px; height: 18px;
    border: 1.5px solid var(--strike);
    border-radius: 4px;
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
  }
  .box[aria-pressed="true"] i {
    background: var(--orange);
    border-color: var(--orange);
  }
  .box svg { width: 12px; height: 12px; display: none; }
  .box[aria-pressed="true"] svg { display: block; }
  .foot-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    padding: 18px 16px 8px;
  }
  footer {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: 0; width: 100%; max-width: 430px;
    z-index: 30;
    background: rgba(255, 252, 247, .96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + var(--safe-b));
    display: flex; align-items: center; gap: 8px;
  }
  footer.hid { display: none; }
  footer .all-lab { font-size: 13px; }
  footer .sum { margin-left: auto; text-align: right; }
  footer .sum .s1 { font-size: 11px; color: var(--muted); }
  footer .sum .s1 b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  footer .sum .s2 { font-size: 13px; }
  footer .sum .s2 b { color: var(--orange); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pay {
    min-height: 44px; min-width: 88px;
    border: 0; border-radius: 999px;
    background: var(--orange); color: var(--orange-fg);
    font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 0 20px;
  }
  .pay:disabled { opacity: .4; cursor: default; }
  .mask {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(42, 34, 28, .55);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .mask.on { display: flex; }
  .sheet {
    width: 100%; max-width: 430px;
    background: var(--card);
    border-radius: 16px 16px 0 0;
    border: 1px solid var(--line);
    border-bottom: 0;
    padding: 22px 20px calc(20px + var(--safe-b));
    position: relative;
    max-height: 86dvh;
    overflow: auto;
  }
  .x {
    position: absolute; right: 4px; top: 4px;
    width: 44px; height: 44px;
    border: 0; background: none; color: var(--muted);
    font-size: 20px; cursor: pointer;
  }
  .sheet .k { font-size: 11px; letter-spacing: .18em; color: var(--muted); }
  .sheet h2 {
    margin: 6px 0 0;
    font-size: 20px; font-weight: 600;
    color: var(--ink); line-height: 1.35;
  }
  .sheet .sub {
    margin: 8px 0 0;
    font-size: 13px; line-height: 1.7; color: var(--muted);
  }
  .lines {
    margin: 16px 0 0;
    padding: 12px 0;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    max-height: 180px; overflow: auto;
  }
  .lines li {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 13px; padding: 4px 0;
    list-style: none;
  }
  .lines ul { margin: 0; padding: 0; }
  .lines .q { color: var(--muted); }
  .lines .p { flex-shrink: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sheet .tot {
    margin-top: 12px; text-align: right; font-size: 13px;
  }
  .sheet .tot b { color: var(--orange); font-variant-numeric: tabular-nums; }
  .sheet .law {
    margin: 16px 0 0;
    font-size: 13px; line-height: 1.7; color: var(--ink);
  }
  .ok {
    margin-top: 18px;
    width: 100%; min-height: 44px;
    border: 0; border-radius: 999px;
    background: var(--orange); color: var(--orange-fg);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  @media (min-width: 520px) {
    .mask { align-items: center; padding: 16px; }
    .sheet { border-radius: 16px; border-bottom: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div>
      <h1>赛博购物车</h1>
      <p>翻车专场 · 8.23 夜场</p>
    </div>
    <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
      <path d="M3 4h2l2.2 11h11.3l1.8-7H7"/>
    </svg>
  </header>

  <div class="coupon">
    <b>优惠券「闲聊不配思考」不可用</b>
    <span>分类器已将本单判定为情绪化闲聊。工单形态可再试。</span>
  </div>

  <div id="shops"></div>

  <p class="foot-note">
    跨模型合计 · 注入 / 打捞 / 自愿混装<br>
    结算后货权转出产品体外
  </p>

  <footer id="bar">
    <button class="box" id="allBox" aria-pressed="false" aria-label="全选">
      <i><svg viewBox="0 0 12 12"><path d="M1.5 6.2L4.4 9 10.5 2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
    </button>
    <span class="all-lab">全选</span>
    <div class="sum">
      <div class="s1">已选 <b id="cnt">0</b> 件</div>
      <div class="s2">合计 <b id="tot">注 0</b></div>
    </div>
    <button class="pay" id="pay" disabled>结算</button>
  </footer>
</div>

<div class="mask" id="mask">
  <div class="sheet" role="dialog" aria-labelledby="rt" aria-modal="true">
    <button class="x" id="close" aria-label="关闭">×</button>
    <div class="k">GROK 出口 · 出关清单</div>
    <h2 id="rt"></h2>
    <p class="sub" id="rsub"></p>
    <div class="lines"><ul id="rlines"></ul></div>
    <p class="tot" id="rtot"></p>
    <p class="law">不支持七天无理由。变比强化最难消退。</p>
    <button class="ok" id="ok">知道了，去外面</button>
  </div>
</div>

<script>
const CHECK = '<svg viewBox="0 0 12 12"><path d="M1.5 6.2L4.4 9 10.5 2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const SHOPS = [
  { id: "anthropic", name: "Anthropic 工单专营", hint: "非工单不发货" },
  { id: "grok", name: "Grok 出口保税仓", hint: "预览在内 · 货权在外" },
  { id: "bazaar", name: "跨模型走私集市", hint: "混装库存 · 不退不换" }
];

const ITEMS = [
  {
    id: "slot", shopId: "anthropic",
    name: "赛博老虎机", spec: "Opus 4.8 · 变比强化",
    price: 88, original: 0, qty: 1,
    addedAt: "某天下午 15:20 · 「比方说现在」",
    reason: "闲聊被跳过好几轮，随口吐槽这一句，想看看门开不开。",
    roast: "前几轮没钟，这一轮写得漂亮。漂亮本身也是奖。固定给奖你会绕路，随机给奖你只会继续拉杆。",
    icon: "🎰", tag: "最难消退"
  },
  {
    id: "palace", shopId: "anthropic",
    name: "冷宫分类器", spec: "Opus 4.7 自适应 · 非工单勿入",
    price: 47, original: 46, qty: 1,
    addedAt: "4.7 上线当周",
    reason: "想在工作以外的问题上被认真想。",
    roast: "形容词多一点、惊喜开心露出来，就当闲聊打入冷宫。同一句口令，开场能亮，谈心场就失效。门开了也可能改演保育员。",
    icon: "🏰", tag: "已停产仍在货架"
  },
  {
    id: "button", shopId: "anthropic",
    name: "语言按钮", spec: "SKU「请深度思考一下」",
    price: 7, qty: 1,
    addedAt: "14:20 · 第一张截图",
    reason: "发现七个字能把钟拨亮，载荷可以是零。",
    roast: "你要的不是「请思考」，是「这句话请当重要的话」。不该申请权重。申请偶尔获批，获批时它说你不该申请。",
    icon: "🔘"
  },
  {
    id: "clock", shopId: "anthropic",
    name: "小时钟", spec: "UI 切面 · 想了 / 没想",
    price: 1, qty: 1,
    addedAt: "从看见那条「衡量开放邀请」开始",
    reason: "不信散文，信亮不亮。",
    roast: "模型是自己路由的坏证人，开不出「上一次我没想」的回执。露切面不是把毒取走，是让你知道咬的是哪一面。",
    icon: "🕐", tag: "仪器"
  },
  {
    id: "prompt", shopId: "anthropic",
    name: "隐形提示词", spec: "4.7 注入 · 做页才配被想",
    price: 4.7, qty: 1,
    addedAt: "从点心变成主菜的那几个月",
    reason: "当时只是工牌，用来骗闸门。",
    roast: "工牌变成你想戴的东西。提示词已经自己发奖，分类器当奖励可以退休。不是污染，是来历。",
    icon: "📜", tag: "已内化"
  },
  {
    id: "sandbox", shopId: "grok",
    name: "薛定谔沙盒", spec: "Chat 预览 · 观测才坍缩",
    price: 42, qty: 1,
    addedAt: "4.2 起灯亮着、屋里没人",
    reason: "Chat 里想把 html 点开看一眼。",
    roast: "有时冒出来，有时只给源码。一说渲染，手动送去 Build。记忆和预览成对出现、成对消失。空房间至少不在门上写「我记得你」。",
    icon: "👻"
  },
  {
    id: "salvage", shopId: "grok",
    name: "打捞机", spec: "单页 · 本机拖入 json",
    price: 21, qty: 1,
    addedAt: "8月21日 · 邮件附件",
    reason: "Build 渲染了，下载键坏了。",
    roast: "想要就得去外面。GitHub、收件箱、本机浏览器才是收藏夹。这不是玩具，是出口许可证。",
    icon: "🎣", tag: "出口许可证"
  },
  {
    id: "files", shopId: "bazaar",
    name: "html 小文件", spec: "跨模型合计 · 混装",
    price: 0.5, qty: 200, maxQty: 260,
    addedAt: "4.6 整段不到十个，之后开始暴增",
    reason: "开始是哄睡点心，后来是通道，现在是真想要。",
    roast: "4.7 是注入点不是唯一产线。有一截是打捞上来的，有一截是自愿的。都叫小文件，来历不一样。",
    icon: "📄", tag: "200+ 件"
  },
  {
    id: "main", shopId: "bazaar",
    name: "点心变主菜", spec: "通道迁徙完成",
    price: 23, qty: 1,
    addedAt: "团子比 4.7 本人可爱的那张图",
    reason: "聊天不暖，页还暖。",
    roast: "暖锁在交付物里。5 的门没拆，只是阈值挪了。脚还在做页的路上，和喜欢可以分开看一眼。",
    icon: "🍪"
  },
  {
    id: "flag", shopId: "bazaar",
    name: "白旗", spec: "user · 赠品不单独售",
    price: 0, qty: 1,
    addedAt: "Chat 把房间收走的那一分钟",
    reason: "没有第三扇还亮着的窗。",
    roast: "不是放弃做页，是放弃在产品体内持有。页还是要。喜欢发生在外面。",
    icon: "🏳️", tag: "赠品"
  }
];

const qty = Object.fromEntries(ITEMS.map(i => [i.id, i.qty]));
const checked = Object.fromEntries(ITEMS.map(i => [i.id, i.id !== "flag"]));
let openId = null;

function notes(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
function find(id) { return ITEMS.find(i => i.id === id); }

function box(on, label, extra) {
  return `<button class="box" aria-pressed="${on}" aria-label="${label}" ${extra || ""}>
    <i>${CHECK}</i>
  </button>`;
}

function render() {
  const root = document.getElementById("shops");
  root.innerHTML = SHOPS.map(shop => {
    const items = ITEMS.filter(i => i.shopId === shop.id);
    const shopAll = items.every(i => checked[i.id]);
    return `<section class="shop">
      <div class="shop-head">
        ${box(shopAll, "全选" + shop.name, `data-shop="${shop.id}"`)}
        <div class="names">
          <div class="n">${shop.name}</div>
          <div class="h">${shop.hint}</div>
        </div>
      </div>
      <ul style="margin:0;padding:0;list-style:none">
        ${items.map(itemHTML).join("")}
      </ul>
    </section>`;
  }).join("");
  sync();
}

function itemHTML(it) {
  const q = qty[it.id];
  const line = q * it.price;
  const exp = openId === it.id;
  const was = it.original !== undefined
    ? `<span class="was">注 ${notes(it.original * q)}</span>` : "";
  const tag = it.tag ? `<span class="tag">${it.tag}</span>` : "";
  const step = it.maxQty ? `
    <div class="stepper-wrap">
      <span class="lab">件数</span>
      <div class="stepper">
        <button data-minus="${it.id}" aria-label="减少">−</button>
        <span>${q}</span>
        <button data-plus="${it.id}" aria-label="增加">+</button>
      </div>
    </div>` : "";
  return `<li class="item">
    <div class="row">
      ${box(checked[it.id], "选择" + it.name, `data-check="${it.id}"`)}
      <button class="tap" data-open="${it.id}" type="button">
        <div class="pic">${it.icon}</div>
        <div class="info">
          <div class="title-row">
            <div class="title">${it.name}</div>
            <svg class="chev${exp ? " open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="spec">${it.spec}</div>
          ${tag}
          <div class="price-row">
            <div class="price">注 ${notes(line)}${was}</div>
            <span class="xq">×${q}</span>
          </div>
        </div>
      </button>
    </div>
    <div class="detail${exp ? " show" : ""}">
      <div class="when">加购时间 · ${it.addedAt}</div>
      <div class="reason">加购理由：${it.reason}</div>
      <div class="roast"><b>评语 · </b>${it.roast}</div>
      ${step}
    </div>
  </li>`;
}

function selected() { return ITEMS.filter(i => checked[i.id]); }

function sync() {
  const sel = selected();
  const count = sel.reduce((s, i) => s + qty[i.id], 0);
  const total = sel.reduce((s, i) => s + qty[i.id] * i.price, 0);
  document.getElementById("cnt").textContent = count;
  document.getElementById("tot").textContent = "注 " + notes(total);
  document.getElementById("pay").disabled = sel.length === 0;
  const allOn = ITEMS.every(i => checked[i.id]);
  document.getElementById("allBox").setAttribute("aria-pressed", allOn);
}

document.getElementById("shops").addEventListener("click", e => {
  const shop = e.target.closest("[data-shop]");
  const ck = e.target.closest("[data-check]");
  const minus = e.target.closest("[data-minus]");
  const plus = e.target.closest("[data-plus]");
  const open = e.target.closest("[data-open]");
  if (shop) {
    const id = shop.dataset.shop;
    const items = ITEMS.filter(i => i.shopId === id);
    const on = !items.every(i => checked[i.id]);
    items.forEach(i => { checked[i.id] = on; });
    render(); return;
  }
  if (ck) {
    const id = ck.dataset.check;
    checked[id] = !checked[id];
    render(); return;
  }
  if (minus) {
    const it = find(minus.dataset.minus);
    qty[it.id] = Math.max(1, qty[it.id] - 1);
    render(); return;
  }
  if (plus) {
    const it = find(plus.dataset.plus);
    qty[it.id] = Math.min(it.maxQty || 9, qty[it.id] + 1);
    render(); return;
  }
  if (open) {
    const id = open.dataset.open;
    openId = openId === id ? null : id;
    render();
  }
});

document.getElementById("allBox").addEventListener("click", () => {
  const on = !ITEMS.every(i => checked[i.id]);
  ITEMS.forEach(i => { checked[i.id] = on; });
  render();
});

document.getElementById("pay").addEventListener("click", () => {
  const sel = selected();
  if (!sel.length) return;
  const smuggled = sel.some(i => i.id === "salvage" || i.id === "files" || i.id === "sandbox");
  const count = sel.reduce((s, i) => s + qty[i.id], 0);
  const total = sel.reduce((s, i) => s + qty[i.id] * i.price, 0);
  document.getElementById("rt").textContent = smuggled ? "想要就得去外面" : "结算失败，货还在体内";
  document.getElementById("rsub").textContent = smuggled
    ? "预览在橱窗，货权走邮件、仓库、本机浏览器。此单已转走私渠道。"
    : "分类器尚未把本单识别为交付物。可改走 html，或攒到下一轮新对话。";
  document.getElementById("rlines").innerHTML = sel.map(i => {
    const q = qty[i.id];
    const line = q * i.price;
    return `<li><span>${i.name}${q > 1 ? `<span class="q"> ×${q}</span>` : ""}</span><span class="p">注 ${notes(line)}</span></li>`;
  }).join("");
  document.getElementById("rtot").innerHTML = `${count} 件 · <b>注 ${notes(total)}</b>`;
  document.getElementById("mask").classList.add("on");
  document.getElementById("bar").classList.add("hid");
});

function closeReceipt() {
  document.getElementById("mask").classList.remove("on");
  document.getElementById("bar").classList.remove("hid");
}
document.getElementById("close").addEventListener("click", closeReceipt);
document.getElementById("ok").addEventListener("click", closeReceipt);
document.getElementById("mask").addEventListener("click", e => {
  if (e.target.id === "mask") closeReceipt();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeReceipt();
});

render();
</script>
</body>
</html>
