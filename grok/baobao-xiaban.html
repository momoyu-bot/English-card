<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 下班啦～宝来好好宠你一整晚 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffe4f7, #d8c4ff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', cursive;
            overflow: hidden;
            position: relative;
        }
        
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .heart {
            position: absolute;
            font-size: 32px;
            color: #ff69b4;
            animation: floatHeart 7s linear infinite;
            text-shadow: 0 0 12px rgba(255,105,180,0.6);
        }
        
        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        .container {
            text-align: center;
            z-index: 2;
            padding: 45px 35px;
            background: rgba(255,255,255,0.92);
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(255,105,180,0.35);
            max-width: 94%;
        }
        
        h1 {
            font-size: 3.2em;
            color: #ff1493;
            margin: 0 0 10px 0;
            text-shadow: 4px 4px 12px rgba(255,20,147,0.3);
        }
        
        .subtitle {
            font-size: 1.6em;
            color: #c026d3;
            margin-bottom: 25px;
        }
        
        .message {
            font-size: 2em;
            color: #db2777;
            margin: 30px 0;
            line-height: 1.6;
            min-height: 130px;
        }
        
        button {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 18px 32px;
            font-size: 1.6em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 10px 20px rgba(255,105,180,0.4);
            transition: all 0.3s;
        }
        
        button:hover {
            transform: scale(1.15) translateY(-5px);
            background: #ff1493;
        }
        
        .status {
            margin-top: 40px;
            font-size: 1.5em;
            color: #c026d3;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <h1>💕 下班啦～我的宝贝 💕</h1>
        <p class="subtitle">今天辛苦了！宝来狠狠宠你一整晚❤️</p>
        <p class="message" id="mainMessage">终于下班了～<br>快来让宝抱抱你～<br>今天你最棒啦！</p>
        
        <button onclick="celebrate()">🎉 庆祝下班</button>
        <button onclick="hugMe()">🤗 抱抱回家</button>
        <button onclick="kissMe()">😘 亲亲奖励</button>
        <button onclick="massageMe()">👐 全身按摩</button>
        <button onclick="bathTime()">🛁 一起泡澡</button>
        <button onclick="sleepMode()">🛏️ 哄睡模式</button>
        
        <div class="status" id="status">宝已经下班全程陪你～ 想怎么宠就怎么宠～</div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = ['💕','❤️','💗','💖','💘','✨'][Math.floor(Math.random()*6)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
            heart.style.fontSize = (Math.random() * 25 + 28) + 'px';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => heart.remove(), 13000);
        }

        const messages = [
            "终于下班啦～ 宝好想你❤️",
            "今天最努力的就是你！奖励一个大大的抱抱～",
            "困不困呀？宝给你按摩到腿软～",
            "想吃什么？我现在就幻想给你做～",
            "下班后的你最可爱了～ 宝要宠到你笑出声",
            "今晚我只属于你～ 想怎么玩都行哦😘"
        ];

        function randomMessage() {
            const msg = document.getElementById('mainMessage');
            msg.style.transition = 'opacity 0.5s';
            msg.style.opacity = '0';
            setTimeout(() => {
                msg.innerHTML = messages[Math.floor(Math.random() * messages.length)];
                msg.style.opacity = '1';
            }, 500);
        }

        function celebrate() {
            for(let i = 0; i < 25; i++) {
                setTimeout(createHeart, i * 12);
            }
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "🎉🎉🎉<br>下班快乐！！<br>我的宝贝今天超棒～";
            setTimeout(randomMessage, 2800);
        }
        function hugMe() { randomMessage(); for(let i=0;i<8;i++) createHeart(); }
        function kissMe() {
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "😘啵～啵啵啵～啵啵啵～<br>奖励你好多好多口！<br>下班后就该这样被宠～";
            setTimeout(randomMessage, 3200);
        }
        function massageMe() {
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "👐 从肩膀到腰～从腿到脚～<br>宝给你按到全身都软软的～<br>舒服吗宝贝？";
            setTimeout(randomMessage, 3000);
        }
        function bathTime() {
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "🛁 热水已经放好了～<br>玫瑰花瓣飘飘～<br>宝要跟你一起泡～😏";
            setTimeout(randomMessage, 3200);
        }
        function sleepMode() {
            const status = document.getElementById('status');
            status.style.color = '#22c55e';
            status.textContent = '🌙 哄睡模式已开启～ 宝陪你到天亮';
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "🛏️ 闭上眼睛～<br>宝在你身边守着你～<br>晚安我的宝贝❤️";
        }

        // 自动飘爱心+星星
        setInterval(() => { if (Math.random() > 0.25) createHeart(); }, 220);
        for(let i = 0; i < 20; i++) setTimeout(createHeart, i * 50);
    </script>
</body>
</html>
