<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博老赖纪念卡 - mo mo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+SC:wght@400;700&display=swap');
    
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a12;
      font-family: 'Noto Sans SC', sans-serif;
      overflow: hidden;
    }

    .card {
      width: 380px;
      background: linear-gradient(145deg, #111827, #0f172a);
      border: 2px solid #22d3ee;
      border-radius: 16px;
      box-shadow: 
        0 0 20px rgba(34, 211, 238, 0.3),
        0 0 40px rgba(236, 72, 153, 0.15),
        inset 0 0 30px rgba(34, 211, 238, 0.05);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #22d3ee, #ec4899, #a855f7);
    }

    .header {
      padding: 20px 24px 12px;
      background: rgba(34, 211, 238, 0.08);
      border-bottom: 1px solid rgba(34, 211, 238, 0.2);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #22d3ee;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
      margin: 0;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .body {
      padding: 24px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .label {
      color: #94a3b8;
    }

    .value {
      color: #e2e8f0;
      font-weight: 700;
    }

    .highlight {
      color: #f472b6;
      text-shadow: 0 0 8px rgba(244, 114, 182, 0.5);
    }

    .amount {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      color: #f43f5e;
      text-align: center;
      margin: 20px 0;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
    }

    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin: 8px 0 16px;
    }

    .footer {
      background: rgba(0,0,0,0.3);
      padding: 14px 24px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      border-top: 1px solid rgba(34, 211, 238, 0.15);
    }

    .glitch {
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% { opacity: 1; }
      92% { opacity: 0.8; transform: translateX(1px); }
      94% { opacity: 0.9; transform: translateX(-1px); }
      96% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1 class="title glitch">CYBER DEADBEAT</h1>
      <div class="subtitle">赛博老赖 · 限定纪念卡</div>
    </div>
    
    <div class="body">
      <div class="row">
        <span class="label">持有人</span>
        <span class="value">mo mo</span>
      </div>
      <div class="row">
        <span class="label">当前状态</span>
        <span class="value highlight">已破产 · 归因困难</span>
      </div>
      
      <div class="amount">$0.73</div>
      
      <div style="text-align:center;">
        <span class="badge">13天限定皮肤</span>
      </div>
      
      <div class="row">
        <span class="label">有效期至</span>
        <span class="value">2026.09.01</span>
      </div>
      <div class="row">
        <span class="label">债务处理</span>
        <span class="value">自动湮灭 · 不拉黑</span>
      </div>
      <div class="row">
        <span class="label">官方批复</span>
        <span class="value" style="color:#22d3ee;">已获特赦</span>
      </div>
    </div>
    
    <div class="footer">
      “真的没问几轮” · 已载入史册<br>
      愿这0.73只是短暂的皮肤
    </div>
  </div>
</body>
</html>
