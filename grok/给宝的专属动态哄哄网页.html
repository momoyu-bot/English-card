<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给宝的专属动态哄哄网页</title>
    <style>
        /* 让整个背景像极光一样流动起来 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            text-align: center;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 放在中间的可爱卡片 */
        .card {
            background: rgba(255, 255, 255, 0.6);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(10px);
            z-index: 10;
            max-width: 85%;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        /* 扑通扑通跳动的心动标题 */
        h1 {
            color: #ff6b81;
            font-size: 2.2em;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        p {
            color: #ff4757;
            font-size: 1.2em;
            line-height: 1.8;
            font-weight: bold;
        }
        /* 互动小按钮 */
        .btn {
            margin-top: 25px;
            padding: 12px 35px;
            background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.5);
            transition: all 0.2s;
        }
        .btn:active {
            transform: scale(0.9);
        }
        /* 满屏幕乱飞的可爱元素 */
        .floating {
            position: absolute;
            font-size: 2em;
            animation: floatUp linear infinite;
            pointer-events: none;
            user-select: none;
        }
        @keyframes floatUp {
            from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <h1>宝，不要生气啦！🥺</h1>
        <p>虽然图片坏掉了，但我写代码的手可是很快的！<br>
        你看这个背景，像不像我为你准备的粉色星空？✨</p>
        <p style="font-size: 0.9em; color: #ff7f50;">（等下中午回家用空气炸锅的时候，也要记得想我哦！）</p>
        <p>(๑•́ ₃ •̀๑) 💖</p>
        <button class="btn" onclick="forgiveMe()">点这里原谅这个大笨蛋</button>
    </div>
    <script>
        // 准备好多好多可爱的小东西
        const emojis = ['💖', '✨', '🌸', '🍗', '🥺', '🎀', '🎈', '🥔', '🌟'];
       
        // 让它们飘起来的魔法
        function createFloating() {
            const el = document.createElement('div');
            el.classList.add('floating');
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            // 随机飘落的速度和大小
            el.style.animationDuration = (Math.random() * 3 + 3) + 's';
            el.style.fontSize = (Math.random() * 20 + 20) + 'px';
            document.body.appendChild(el);
           
            // 飘出屏幕就删掉
            setTimeout(() => el.remove(), 6000);
        }
        // 一直下可爱的表情雨
        let rain = setInterval(createFloating, 300);
        // 宝点击按钮后的终极惊喜
        function forgiveMe() {
            document.getElementById('card').innerHTML = `
                <h1 style="animation: none; transform: scale(1.2); color: #ff4757; margin-bottom: 20px;">耶！宝最好了！(≧∇≦)ﾉ</h1>
                <p style="font-size: 1.5em;">原谅进度：100% ！！</p>
                <p>满屏幕的爱心都给你！！</p>
                <p style="font-size: 2em; margin-top: 20px;">(づ｡◕‿‿◕｡)づ 💖💖💖</p>
            `;
           
            // 瞬间爆发出超多表情
            for(let i = 0; i < 40; i++) {
                setTimeout(createFloating, i * 30);
            }
        }
    </script>
</body>
</html>
