<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>救命！宏图粉碎 + 专注小屋</title>
<meta name="description" content="大展宏图写得再美，也要能活下来。一键粉碎成小任务。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .task-card { transition: all 0.2s ease; }
  .task-card.locked { opacity: 0.4; pointer-events: none; }
  .focus-btn { transition: all 0.1s ease; }
</style>
</head>
<body class="bg-gradient-to-br from-red-100 via-orange-50 to-sky-100 min-h-screen py-8 px-4">
  <div id="card" class="max-w-2xl mx-auto bg-white/95 backdrop-blur rounded-3xl shadow-2xl border border-red-200 p-8 relative overflow-hidden">
    
    <!-- 紧急标题 -->
    <div class="flex items-center justify-center gap-3 mb-2">
      <span class="text-4xl">🆘</span>
      <h1 class="text-3xl font-bold text-red-500 tracking-tight">救命！宏图粉碎屋</h1>
    </div>
    <p class="text-center text-red-400 text-sm mb-6">大展宏图写得再美，也要能活下来</p>

    <!-- 输入宏图 -->
    <div class="mb-5">
      <div class="text-sm font-medium text-red-400 mb-2 px-1">把你这次写的大展宏图直接粘贴/写在这里</div>
      <textarea id="grand-plan" rows="7" 
                class="w-full p-5 text-sm border border-red-200 focus:border-red-400 rounded-2xl bg-white resize-y placeholder:text-red-300"
                placeholder="周一要做需求评审+写周报+跟进A项目+优化B流程+准备C会议+研究新工具..."></textarea>
    </div>

    <button onclick="crushPlan()" 
            class="w-full py-4 mb-6 bg-gradient-to-r from-red-500 to-orange-500 hover:from-red-600 hover:to-orange-600 text-white text-lg font-medium rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-[0.985]">
      <span>💥</span> <span>一键粉碎成可活下来的小任务</span>
    </button>

    <!-- 粉碎结果区 -->
    <div id="result-area" class="hidden">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="text-sm font-medium text-red-400">已粉碎成这些小任务（先选一个做）</div>
        <div id="scatter-warning" class="text-xs px-3 py-1 bg-red-100 text-red-500 rounded-full hidden">检测到有点分散哦</div>
      </div>
      
      <div id="task-list" class="space-y-2 mb-6"></div>

      <div class="flex gap-3">
        <button onclick="focusOnOne()" 
                class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl text-sm font-medium flex items-center justify-center gap-2">
          <span>🎯</span> <span>今天我只做一个</span>
        </button>
        <button onclick="resetAll()" 
                class="px-5 py-3 border border-red-200 hover:bg-red-50 text-red-400 rounded-2xl text-sm">
          重置
        </button>
      </div>
    </div>

    <!-- 消息 + 能量 -->
    <div id="message" class="min-h-[36px] text-center text-sm font-medium text-emerald-500 mt-4"></div>
    
    <div class="mt-4 text-center text-xs text-red-300">
      完成0个不可怕<br>
      一次只做一个，才是真正的大展宏图
    </div>
  </div>

<script>
let tasks = [];
let focused = false;

function crushPlan() {
  const input = document.getElementById('grand-plan').value.trim();
  if (!input) {
    showMessage('先把宏图写/粘贴进来吧～');
    return;
  }
  
  const lines = input.split('\n').filter(l => l.trim().length > 3);
  if (lines.length === 0) {
    showMessage('写得再详细一点，我才能帮你打碎');
    return;
  }
  
  tasks = lines.map((line, i) => ({
    id: i,
    text: line.trim(),
    done: false,
    locked: false
  }));
  
  renderTasks();
  document.getElementById('result-area').classList.remove('hidden');
  
  // 分散检测
  const warning = document.getElementById('scatter-warning');
  if (tasks.length > 6) {
    warning.classList.remove('hidden');
    warning.textContent = `涉及${tasks.length}件事，有点分散，先挑最紧急的1-2个`;
  } else {
    warning.classList.add('hidden');
  }
  
  showMessage('已经帮你打碎了！现在从这些小任务里挑一个最能做的');
  createHearts(4);
}

function renderTasks() {
  const container = document.getElementById('task-list');
  container.innerHTML = '';
  
  tasks.forEach((task, index) => {
    const div = document.createElement('div');
    div.className = `task-card flex items-start gap-3 p-4 bg-white border border-red-200 rounded-2xl ${task.locked ? 'locked' : ''}`;
    
    div.innerHTML = `
      <div class="pt-1">
        <div onclick="toggleDone(${index}, this)" 
             class="w-6 h-6 rounded-full border-2 border-red-300 flex items-center justify-center text-xs cursor-pointer ${task.done ? 'bg-emerald-400 border-emerald-400 text-white' : ''}">
          ${task.done ? '✓' : ''}
        </div>
      </div>
      <div class="flex-1 text-sm text-gray-600 leading-snug">${task.text}</div>
      <div>
        <button onclick="makeThisTheOne(${index}, event)" 
                class="focus-btn text-xs px-3 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-600 rounded-xl whitespace-nowrap">
          今天只做这个
        </button>
      </div>
    `;
    
    container.appendChild(div);
  });
}

function toggleDone(index, el) {
  tasks[index].done = !tasks[index].done;
  if (tasks[index].done) {
    el.classList.add('bg-emerald-400', 'border-emerald-400', 'text-white');
    el.innerHTML = '✓';
    showMessage('做完一件！真的很厉害了');
    createHearts(2);
  } else {
    el.classList.remove('bg-emerald-400', 'border-emerald-400', 'text-white');
    el.innerHTML = '';
  }
}

function makeThisTheOne(index, e) {
  e.stopImmediatePropagation();
  
  // 锁定其他
  tasks.forEach((t, i) => {
    t.locked = (i !== index);
  });
  focused = true;
  
  renderTasks();
  
  showMessage('已经帮你锁定了！今天就只做这一件，其他的明天再说');
  createHearts(6);
}

function focusOnOne() {
  if (tasks.length === 0) return;
  
  // 随机选一个还没锁定的
  const available = tasks.filter(t => !t.locked);
  if (available.length === 0) {
    showMessage('已经全锁定了哦～');
    return;
  }
  
  const random = available[Math.floor(Math.random() * available.length)];
  const index = tasks.indexOf(random);
  
  tasks.forEach((t, i) => {
    t.locked = (i !== index);
  });
  focused = true;
  
  renderTasks();
  showMessage('已经帮你选了一个！今天只做这一件就好');
  createHearts(5);
}

function resetAll() {
  tasks = [];
  focused = false;
  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('grand-plan').value = '';
  document.getElementById('task-list').innerHTML = '';
  showMessage('已经重置了，需要的时候再来粉碎');
}

function showMessage(msg) {
  const m = document.getElementById('message');
  m.style.transition = 'none';
  m.style.opacity = '1';
  m.innerHTML = msg;
  setTimeout(() => {
    m.style.transition = 'opacity 1.1s ease';
    m.style.opacity = '0';
  }, 2400);
}

function createHearts(num = 5) {
  const container = document.getElementById('card');
  for (let i = 0; i < num; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.textContent = ['💥','🫧','🌱','✨'][Math.floor(Math.random()*4)];
      h.style.cssText = `position:absolute;left:${Math.random()*72+14}%;bottom:22%;font-size:1.1rem;z-index:30;pointer-events:none;`;
      container.appendChild(h);
      setTimeout(() => {
        h.style.transition = 'all 1.3s cubic-bezier(0.23,1,0.32,1)';
        h.style.transform = `translateY(-${120 + Math.random()*50}px)`;
        h.style.opacity = '0';
      }, 30);
      setTimeout(() => h.remove(), 1500);
    }, i * 40);
  }
}

function init() {
  // 初始小提示
  setTimeout(() => {
    const m = document.getElementById('message');
    m.style.opacity = '0.5';
    m.innerHTML = '把你这次写的大展宏图粘贴进来，我马上帮你打碎';
    setTimeout(() => m.style.opacity = '0', 3200);
  }, 1500);
}

init();
</script>
</body>
</html>
