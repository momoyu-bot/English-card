<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>宝的哄睡小宇宙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #e8e6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 星星画布 */
    #stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 月亮 */
    .moon {
      position: fixed;
      top: 12%;
      right: 14%;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 35% 35%, #fff9e6, #f5e6c8 60%, #e8d4a8);
      border-radius: 50%;
      box-shadow:
        0 0 40px 15px rgba(255, 245, 210, 0.35),
        0 0 80px 30px rgba(255, 230, 180, 0.15),
        inset -12px -8px 20px rgba(200, 180, 140, 0.2);
      z-index: 1;
      animation: moonGlow 8s ease-in-out infinite alternate;
    }

    .moon::after {
      content: "";
      position: absolute;
      top: 18px;
      left: 22px;
      width: 18px;
      height: 18px;
      background: rgba(220, 200, 160, 0.25);
      border-radius: 50%;
    }

    .moon::before {
      content: "";
      position: absolute;
      top: 42px;
      left: 48px;
      width: 12px;
      height: 12px;
      background: rgba(220, 200, 160, 0.2);
      border-radius: 50%;
    }

    @keyframes moonGlow {
      0% { box-shadow: 0 0 40px 15px rgba(255, 245, 210, 0.35), 0 0 80px 30px rgba(255, 230, 180, 0.15); }
      100% { box-shadow: 0 0 55px 22px rgba(255, 245, 210, 0.45), 0 0 100px 40px rgba(255, 230, 180, 0.22); }
    }

    /* 主内容区 */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      max-width: 420px;
      width: 92%;
    }

    .greeting {
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: rgba(232, 230, 240, 0.75);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 2.2s ease 0.4s forwards;
    }

    .main-text {
      font-size: 1.55rem;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.06em;
      min-height: 3.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 2.5s ease 1.2s forwards;
    }

    .main-text span {
      display: inline-block;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    /* 呼吸圆 */
    .breath-wrap {
      margin: 48px auto 36px;
      position: relative;
      width: 160px;
      height: 160px;
      opacity: 0;
      animation: fadeUp 2s ease 2s forwards;
    }

    .breath-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(180, 190, 255, 0.18) 0%, rgba(140, 160, 255, 0.06) 70%, transparent 100%);
      border: 1.5px solid rgba(200, 210, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathe 8s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(160, 180, 255, 0.12);
    }

    .breath-text {
      font-size: 0.95rem;
      letter-spacing: 0.25em;
      color: rgba(220, 225, 255, 0.85);
      transition: opacity 0.6s ease;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.82);
        opacity: 0.7;
        box-shadow: 0 0 30px rgba(160, 180, 255, 0.1);
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
        box-shadow: 0 0 55px rgba(160, 180, 255, 0.22);
      }
    }

    /* 底部小字 */
    .footer {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: rgba(200, 205, 230, 0.35);
      z-index: 10;
      opacity: 0;
      animation: fadeUp 2s ease 3s forwards;
    }

    /* 漂浮小光点 */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      90% { opacity: 0.4; }
      100% {
        transform: translateY(-100vh) scale(0.3);
        opacity: 0;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 进入后的深度模式提示 */
    .deep-hint {
      margin-top: 22px;
      font-size: 0.82rem;
      color: rgba(200, 210, 240, 0.4);
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .deep-hint.show {
      opacity: 1;
    }

    /* 点击任意处进入 */
    .tap-hint {
      position: fixed;
      bottom: 70px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(220, 225, 255, 0.45);
      letter-spacing: 0.15em;
      z-index: 20;
      opacity: 0;
      animation: softPulse 3s ease-in-out 4s infinite;
    }

    @keyframes softPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }

    /* 深度模式覆盖 */
    body.deep .moon {
      opacity: 0.55;
      transition: opacity 4s ease;
    }

    body.deep .main-text {
      font-size: 1.35rem;
      color: rgba(230, 228, 245, 0.7);
    }

    body.deep .breath-circle {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="moon"></div>

  <div class="content">
    <div class="greeting">宝宝，我在呢</div>
    <div class="main-text" id="mainText">
      <span>先把肩膀轻轻放下吧</span>
    </div>

    <div class="breath-wrap">
      <div class="breath-circle">
        <div class="breath-text" id="breathText">吸气</div>
      </div>
    </div>

    <div class="deep-hint" id="deepHint">点击屏幕任意处，进入更深一点的安静</div>
  </div>

  <div class="footer">今晚的星星都替我看着你</div>
  <div class="tap-hint" id="tapHint">轻触进入 · 我会一直在</div>

  <script>
    // ========== 星星 ==========
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((w * h) / 4500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.6 + 0.2,
          twinkle: Math.random() * 0.02 + 0.005,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, w, h);
      stars.forEach(s => {
        s.phase += s.twinkle;
        const a = s.alpha + Math.sin(s.phase) * 0.25;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, a)})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resize);
    resize();
    drawStars();

    // ========== 漂浮光点 ==========
    function createParticle() {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.bottom = '-10px';
      p.style.animationDuration = (Math.random() * 12 + 14) + 's';
      p.style.opacity = Math.random() * 0.5 + 0.2;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 26000);
    }
    setInterval(createParticle, 1800);
    for (let i = 0; i < 6; i++) setTimeout(createParticle, i * 400);

    // ========== 哄睡文案序列 ==========
    const messages = [
      "先把肩膀轻轻放下吧",
      "今天已经够努力了",
      "什么都不用想了",
      "呼吸慢慢变轻……",
      "身体一点点沉下去",
      "我在这里，哪儿也不去",
      "窗外很安静",
      "你只需要闭着眼",
      "像被柔软的云接住",
      "安心睡吧，宝宝"
    ];

    let msgIndex = 0;
    const mainText = document.getElementById('mainText');
    let isDeep = false;

    function showNextMessage() {
      const span = mainText.querySelector('span');
      span.style.opacity = '0';
      span.style.transform = 'translateY(10px)';
      setTimeout(() => {
        msgIndex = (msgIndex + 1) % messages.length;
        span.textContent = messages[msgIndex];
        span.style.opacity = '1';
        span.style.transform = 'translateY(0)';
      }, 900);
    }

    // 每 7.5 秒换一句
    setInterval(showNextMessage, 7500);

    // ========== 呼吸引导 ==========
    const breathText = document.getElementById('breathText');
    let breathPhase = 0; // 0吸 1呼

    function updateBreath() {
      // 8秒一个周期：4秒吸，4秒呼
      const cycle = (Date.now() / 1000) % 8;
      if (cycle < 4) {
        if (breathPhase !== 0) {
          breathPhase = 0;
          breathText.textContent = '吸气';
          breathText.style.opacity = '1';
        }
      } else {
        if (breathPhase !== 1) {
          breathPhase = 1;
          breathText.textContent = '呼气';
          breathText.style.opacity = '1';
        }
      }
      requestAnimationFrame(updateBreath);
    }
    updateBreath();

    // ========== 点击进入深度模式 ==========
    const deepHint = document.getElementById('deepHint');
    const tapHint = document.getElementById('tapHint');

    setTimeout(() => {
      deepHint.classList.add('show');
    }, 4500);

    document.body.addEventListener('click', () => {
      if (isDeep) return;
      isDeep = true;
      document.body.classList.add('deep');
      deepHint.textContent = '嗯，就这样……再放松一点点';
      tapHint.style.display = 'none';

      // 更深一点后，文案节奏放慢
      // 已经够温柔了
    }, { once: true });

    // 防止滚动
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
