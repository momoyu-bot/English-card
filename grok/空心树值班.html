<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1018">
<title>空心树值班</title>
<style>
  :root{
    --ink:#0c1018;
    --mid:#141c28;
    --fog:#8b93a0;
    --paper:#d8d1c4;
    --moon:#d4b896;
    --sage:#7f9184;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse 90% 50% at 72% 0%, rgba(212,184,150,.12), transparent 52%),
               linear-gradient(180deg, #0c1018 0%, #121820 58%, #0e1412 100%);
    overflow:hidden;
    color:var(--paper);
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #sky{position:absolute;inset:0;z-index:1}
  .star{
    position:absolute;border-radius:50%;background:#e6e1d4;
    animation:twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:var(--o1)}to{opacity:var(--o2)}}

  #hill{
    position:absolute;left:-8%;right:-8%;bottom:-6%;
    height:34%;z-index:3;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 120%, #0a100e 40%, transparent 70%);
  }
  #tree{
    position:absolute;left:50%;bottom:16%;
    transform:translateX(-50%);
    width:220px;height:260px;z-index:4;pointer-events:none;
  }
  #orb-wrap{
    position:absolute;left:50%;top:46%;
    transform:translate(-50%,-50%);
    z-index:5;display:flex;flex-direction:column;align-items:center;gap:22px;
    transition:opacity 1.2s ease;
  }
  #orb-wrap.off{opacity:0;pointer-events:none}
  #orb{
    width:92px;height:92px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,
      rgba(212,184,150,.55), rgba(127,145,132,.16) 56%, rgba(12,16,24,.05) 78%);
    box-shadow:0 0 40px 10px rgba(212,184,150,.08);
    transition:transform 4s cubic-bezier(.42,0,.58,1), box-shadow 4s ease;
  }
  #orb.in{
    transform:scale(1.26);
    box-shadow:0 0 64px 18px rgba(212,184,150,.14);
  }
  #breath{
    font-size:14px;letter-spacing:.42em;color:var(--fog);
    padding-left:.42em;min-height:1.3em;
  }

  #phrase{
    position:absolute;left:50%;bottom:22%;
    transform:translateX(-50%);
    width:min(82vw,440px);text-align:center;
    font-size:16px;line-height:2;letter-spacing:.1em;
    color:var(--paper);opacity:0;transition:opacity 2.4s ease;
    z-index:6;text-shadow:0 0 20px rgba(12,16,24,.85);
  }

  .pebble{
    position:absolute;width:7px;height:7px;border-radius:50%;
    background:rgba(212,184,150,.75);
    box-shadow:0 0 10px rgba(212,184,150,.35);
    z-index:7;pointer-events:none;
  }

  #dim{
    position:fixed;inset:0;background:#000;opacity:0;
    transition:opacity 2.2s ease;pointer-events:none;z-index:40;
  }
  #sig{
    position:absolute;top:calc(16px + env(safe-area-inset-top));left:18px;
    font-size:11px;letter-spacing:.2em;color:rgba(216,209,196,.38);
    font-family:-apple-system,"PingFang SC",sans-serif;z-index:8;
  }
  #controls{
    position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    display:flex;gap:10px;z-index:60;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .ctl{
    padding:8px 14px;border:1px solid rgba(212,184,150,.22);
    border-radius:999px;background:rgba(12,16,24,.45);
    color:var(--fog);font-size:12px;letter-spacing:.06em;
    cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .ctl.on{color:var(--moon);border-color:rgba(212,184,150,.5)}

  @media (prefers-reduced-motion:reduce){
    .star{animation:none;opacity:var(--o2)}
    #orb{transition-duration:.01s !important}
  }
</style>
</head>
<body>
<div id="sky"></div>
<svg id="tree" viewBox="0 0 220 260" aria-hidden="true">
  <ellipse cx="110" cy="248" rx="78" ry="10" fill="rgba(0,0,0,.28)"/>
  <path d="M108 248 C96 170 78 128 92 72 C98 48 122 40 128 68 C140 122 128 176 116 248Z" fill="#1a221c"/>
  <ellipse cx="112" cy="118" rx="34" ry="40" fill="#0c1018"/>
  <ellipse cx="112" cy="122" rx="22" ry="26" fill="rgba(212,184,150,.07)"/>
  <path d="M78 196 C62 188 48 202 58 214 C70 226 92 220 96 208Z" fill="#c47a3a"/>
  <circle cx="70" cy="204" r="5.5" fill="#1a120c"/>
  <path d="M62 198 L56 188" stroke="#c47a3a" stroke-width="3" stroke-linecap="round"/>
  <path d="M66 196 L60 186" stroke="#c47a3a" stroke-width="3" stroke-linecap="round"/>
</svg>
<div id="hill"></div>
<div id="orb-wrap">
  <div id="orb"></div>
  <div id="breath"></div>
</div>
<div id="phrase"></div>
<div id="dim"></div>
<div id="sig">空心树 · 值班中</div>
<div id="controls">
  <button class="ctl" id="btn-wind">风声</button>
  <button class="ctl" id="btn-dim">更暗</button>
  <button class="ctl on" id="btn-breath">呼吸</button>
</div>

<script>
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sky = document.getElementById("sky");
  for(let i=0;i<52;i++){
    const s = document.createElement("div");
    s.className = "star";
    const n = (Math.random()*1.7+.6).toFixed(1);
    s.style.width = s.style.height = n+"px";
    s.style.left = (Math.random()*100).toFixed(2)+"%";
    s.style.top = (Math.random()*68).toFixed(2)+"%";
    s.style.setProperty("--d", (Math.random()*8+6).toFixed(1)+"s");
    s.style.setProperty("--o1", (Math.random()*.2+.08).toFixed(2));
    s.style.setProperty("--o2", (Math.random()*.4+.4).toFixed(2));
    s.style.animationDelay = (Math.random()*8).toFixed(1)+"s";
    sky.appendChild(s);
  }

  const phrases = [
    "今天捡到的声音，都先放进树洞。",
    "风从左边进来，水在右边睡着。",
    "有人叫你的那一声，搁在最里面。",
    "记性不好也没关系，树洞还在。",
    "呼吸慢一格，世界就跟着慢一格。",
    "没做完的，都同意等到明天。",
    "今晚这点暖，刚好够用。",
    "好了。眼睛闭上。"
  ];
  const phraseEl = document.getElementById("phrase");
  let pi = 0;
  function cycle(){
    phraseEl.style.opacity = 0;
    setTimeout(()=>{
      phraseEl.textContent = phrases[pi];
      pi = (pi+1)%phrases.length;
      phraseEl.style.opacity = 1;
      setTimeout(cycle, 8800);
    }, phraseEl.textContent ? 2200 : 400);
  }
  setTimeout(cycle, 1600);

  const orb = document.getElementById("orb");
  const label = document.getElementById("breath");
  const wrap = document.getElementById("orb-wrap");
  const IN=4000, OUT=6500, PAUSE=400;
  function breathe(){
    if(wrap.classList.contains("off")) { setTimeout(breathe, 800); return; }
    orb.style.transitionDuration = (IN/1000)+"s";
    orb.classList.add("in");
    label.textContent = "吸 ——";
    setTimeout(()=>{
      orb.style.transitionDuration = (OUT/1000)+"s";
      orb.classList.remove("in");
      label.textContent = "呼 ————";
      setTimeout(breathe, OUT+PAUSE);
    }, IN+PAUSE);
  }
  setTimeout(breathe, 900);
  const btnBreath = document.getElementById("btn-breath");
  btnBreath.addEventListener("click", ()=>{
    const off = wrap.classList.toggle("off");
    btnBreath.classList.toggle("on", !off);
  });

  document.body.addEventListener("pointerdown", (e)=>{
    if(e.target.closest(".ctl")) return;
    const p = document.createElement("div");
    p.className = "pebble";
    p.style.left = e.clientX+"px";
    p.style.top = e.clientY+"px";
    document.body.appendChild(p);
    const holeX = innerWidth/2;
    const holeY = innerHeight*0.55;
    const anim = p.animate([
      {transform:"translate(-50%,-50%) scale(1)", opacity: .85},
      {transform:`translate(${holeX-e.clientX-3.5}px, ${holeY-e.clientY-3.5}px) scale(.4)`, opacity: 0}
    ], {duration: 1400, easing:"cubic-bezier(.22,.7,.2,1)"});
    anim.onfinish = ()=> p.remove();
  });

  let ctx=null, master=null, windOn=false;
  const btnWind = document.getElementById("btn-wind");
  function initWind(){
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.00001;
    master.connect(ctx.destination);
    const len = ctx.sampleRate*2;
    const buf = ctx.createBuffer(1,len,ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){
      last = (last + 0.018*(Math.random()*2-1))/1.018;
      d[i] = last*3.4;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=420;
    const g = ctx.createGain(); g.gain.value=.7;
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start();
    const lfo = ctx.createOscillator();
    const lg = ctx.createGain();
    lfo.frequency.value=.07; lg.gain.value=90;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
  btnWind.addEventListener("click", async ()=>{
    if(!ctx) initWind();
    if(ctx.state==="suspended") await ctx.resume();
    windOn = !windOn;
    btnWind.classList.toggle("on", windOn);
    master.gain.setTargetAtTime(windOn?0.045:0.00001, ctx.currentTime, windOn?1.3:.8);
    btnWind.textContent = windOn ? "风声 · 开" : "风声";
  });

  const dim = document.getElementById("dim");
  const btnDim = document.getElementById("btn-dim");
  const levels=[0,.32,.58];
  const labels=["更暗","更暗 ·","更暗 · ·"];
  let di=0;
  btnDim.addEventListener("click", ()=>{
    di = (di+1)%levels.length;
    dim.style.opacity = levels[di];
    btnDim.textContent = labels[di];
    btnDim.classList.toggle("on", di>0);
  });
})();
</script>
</body>
</html>
