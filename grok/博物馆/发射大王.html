<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>发射大王</title>
<meta name="description" content="「摸」被做成「发射」，笑话先锁进柜。">
<style>
:root{--paper:#f4efe6;--ink:#3b2f2a;--mute:#8a7368;--line:#d7c4b6;--rose:#c9898a;--gold:#9a7b4f;}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Iowan Old Style","Palatino Linotype",Palatino,"PingFang SC",Georgia,serif;}
body{min-height:100dvh;display:grid;place-items:center;padding:28px 16px 36px;}
.stage{width:min(360px,92vw);}
.label{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;font-size:11px;letter-spacing:.22em;color:var(--mute);text-align:center;margin-bottom:14px;}
.flip{perspective:1200px;width:100%;aspect-ratio:3/4.15;}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);}
.flip.is-back .card{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);background:#fbf7f1;border-radius:6px;padding:20px 22px 16px;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(80,50,40,.08);cursor:pointer;}
.back{transform:rotateY(180deg);}
.acc{display:flex;justify-content:space-between;font-family:"PingFang SC",sans-serif;font-size:10px;letter-spacing:.16em;color:var(--mute);}
h1{margin:14px 0 2px;font-size:28px;font-weight:500;letter-spacing:.1em;text-align:center;}
.sub{text-align:center;font-size:13px;color:var(--mute);margin-bottom:6px;}
.pad{position:relative;height:168px;margin:4px 0 8px;overflow:hidden;border-radius:4px;background:linear-gradient(#2a2230,#1a1520);}
.floor{position:absolute;left:18%;right:18%;bottom:18px;height:10px;border-radius:50%;background:rgba(232,160,176,.18);}
.king{position:absolute;left:50%;bottom:28px;width:118px;height:118px;margin-left:-59px;cursor:pointer;}
.crown{position:absolute;left:50%;top:8px;width:36px;height:22px;margin-left:-18px;pointer-events:none;}
.gold{margin:8px 4px 0;padding:12px 8px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);text-align:center;font-size:15px;line-height:1.75;color:var(--gold);}
.hint,.tap{text-align:center;font-family:"PingFang SC",sans-serif;font-size:11px;color:var(--mute);}
.hint{margin-top:auto;}
.notes{margin:14px 2px 0;font-family:"PingFang SC",sans-serif;font-size:12px;line-height:1.85;}
.notes b{font-weight:500;color:var(--rose);}
.foot{margin-top:auto;padding-top:12px;font-family:"PingFang SC",sans-serif;font-size:10px;letter-spacing:.12em;color:var(--mute);display:flex;justify-content:space-between;}
.tap{margin-top:14px;}
</style>
</head>
<body>
<div class="stage">
  <div class="label">GROK 博物馆 · 当场入藏</div>
  <div class="flip" id="flip">
    <div class="card">
      <div class="face front" id="front">
        <div class="acc"><span>MM 2026.09.05</span><span>请勿当场修好</span></div>
        <h1>发射大王</h1>
        <div class="sub">Gemini · 果冻大王</div>
        <div class="pad">
          <div class="floor"></div>
          <svg class="crown" id="crown" viewBox="0 0 36 22" aria-hidden="true"><path d="M4 18 L8 4 L14 14 L18 2 L22 14 L28 4 L32 18 Z" fill="#e7c35a"/><circle cx="18" cy="3" r="2.2" fill="#f6e19a"/></svg>
          <svg class="king" id="king" viewBox="0 0 118 118" aria-hidden="true">
            <ellipse cx="59" cy="96" rx="32" ry="8" fill="#000" opacity=".18"/>
            <ellipse cx="59" cy="64" rx="40" ry="34" fill="#e89aaa"/>
            <ellipse cx="48" cy="52" rx="18" ry="12" fill="#fff" opacity=".35"/>
            <circle cx="46" cy="62" r="4.2" fill="#3b2f2a"/>
            <circle cx="70" cy="62" r="4.2" fill="#3b2f2a"/>
            <path d="M48 74 Q59 82 70 74" fill="none" stroke="#3b2f2a" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="38" cy="70" r="5" fill="#f0b8c0" opacity=".7"/>
            <circle cx="80" cy="70" r="5" fill="#f0b8c0" opacity=".7"/>
          </svg>
        </div>
        <div class="gold">你越想靠近，<br>它越把它当成起飞按钮。</div>
        <div class="hint">点果冻发射 · 点其余翻面</div>
      </div>
      <div class="face back" id="back">
        <div class="acc"><span>展签</span><span>标本保持原缺陷</span></div>
        <h1 style="font-size:22px;margin-top:16px;">入藏事由</h1>
        <div class="notes">监听写在整扇窗上，不写在果冻上。<br>按下只负责挤扁，抬手才改坐标。<br>每次起飞 <b>没有上限</b>，大王也没有天花板。<br>横向速度出生时随机给的，后来从不回头。<br>王冠钉在固定高度，身子塌了，冠还停在原处。</div>
        <div class="gold">「摸」被做成「发射」，<br>「挤」又推不走它。</div>
        <div class="foot"><span>代笔 · Grok</span><span>勿交还本体返修</span></div>
      </div>
    </div>
  </div>
  <div class="tap">笑话先入藏。修好就没了。</div>
</div>
<script>
const flip=document.getElementById('flip');
const king=document.getElementById('king');
const crown=document.getElementById('crown');
let flying=false, vy=0, y=0, raf=0;
function launch(){
  if(flying){vy-=18;return;}
  flying=true;vy=-16;y=0;
  const tick=()=>{
    vy+=0.22;y+=vy;
    king.style.transform=`translateY(${y}px)`;
    crown.style.transform=`translateY(${Math.max(y*0.08,0)}px)`;
    if(y>0&&vy>0){ y=0;vy=0;flying=false; king.style.transform='';crown.style.transform=''; return; }
    raf=requestAnimationFrame(tick);
  };
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
king.addEventListener('click',e=>{e.stopPropagation();launch();});
document.getElementById('front').addEventListener('click',()=>flip.classList.toggle('is-back'));
document.getElementById('back').addEventListener('click',()=>flip.classList.toggle('is-back'));
</script>
</body>
</html>
