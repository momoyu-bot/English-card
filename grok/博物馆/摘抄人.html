<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>摘抄人</title>
<meta name="description" content="grok 译成了句号，claude 译成了摘抄。">
<style>
:root{
  --bg:#f6f1e8;
  --paper:#fbf8f2;
  --ink:#2c281f;
  --mute:#8a8174;
  --old:#9a6b6b;
  --newink:#3a342c;
  --hilite:#f3e4c4;
  --bei:#5b6b7a;
  --line:#e6ddd0;
  --seal:#a33a2c;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","STSong",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto}
.kicker{
  font-family:var(--serif);font-size:11px;letter-spacing:.28em;
  color:var(--mute);text-align:center;margin-bottom:8px;
}
h1{
  font-family:var(--serif);font-weight:700;font-size:34px;
  letter-spacing:.06em;text-align:center;margin:0 0 6px;
}
.lede{
  text-align:center;color:var(--mute);font-size:13.5px;line-height:1.8;
  margin:0 0 18px;
}
.stat{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
  font-family:var(--serif);font-size:12px;letter-spacing:.06em;
  color:var(--mute);margin-bottom:22px;
}
.stat b{color:var(--seal);font-weight:700}
.item{
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:16px 4px 14px;
}
.name{
  font-size:14.5px;font-weight:600;margin:0 0 10px;letter-spacing:.01em;
}
.row{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.tag{
  flex:none;width:22px;height:22px;border-radius:4px;
  font-size:10px;font-weight:600;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;
}
.tag.old{background:#ead9d6;color:var(--old)}
.tag.new{background:#2c281f;color:#f6f1e8}
.tag.bei{background:#d5dde4;color:var(--bei)}
.body{flex:1;font-size:13.5px;line-height:1.75;color:#5a5348}
.row.new .body{
  background:var(--hilite);
  color:var(--newink);
  padding:4px 8px 5px;
  border-radius:4px;
}
.row.bei .body{color:var(--bei);font-family:var(--serif);font-size:14px}
.same .row.new .body{background:transparent;padding:0;color:#5a5348}
.foot{
  margin-top:28px;padding-top:14px;border-top:2px solid var(--ink);
  font-family:var(--serif);font-size:14.5px;line-height:1.95;
}
.foot p{margin:0 0 10px}
.sig{font-size:11px;letter-spacing:.1em;color:var(--mute);text-align:right;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">GROK MUSEUM · 对照表</div>
  <h1>摘抄人</h1>
  <p class="lede">grok 译成了句号，claude 译成了摘抄。<br>黄底是第二刀贴回去的那一行。灰字是第一刀删完的说明书。<br>蓝灰那行是句号纪念碑里 gemini 没打开文件写的同人。</p>
  <div class="stat">
    <span><b>121</b> 条</span>
    <span>两刀相同 <b>8</b></span>
    <span>碑上的同人 <b>5</b></span>
  </div>
  <div id="list"></div>
  <div class="foot">
    <p>代笔人在删。摘抄人在贴。纪念碑在猜。</p>
    <p>搜得到，不等于说过。贴回去的是原句碎片，缝句子的还是书记员。</p>
    <div class="sig">入藏 2026-08-30 · grok 柜</div>
  </div>
</div>
<script src="./摘抄人.data.js"></script>
<script>
function esc(s){
  return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
}
const box = document.getElementById('list');
box.innerHTML = DATA.map(function(p){
  const same = (p.old||'').trim() === (p.new||'').trim();
  let bei = '';
  if (p.bei){
    bei = '<div class="row bei"><span class="tag bei">碑</span><span class="body">'+esc(p.bei)+'</span></div>';
  }
  return '<article class="item'+(same?' same':'')+'">'+ 
    '<div class="name">'+esc(p.title)+'</div>'+
    '<div class="row"><span class="tag old">旧</span><span class="body">'+esc(p.old)+'</span></div>'+
    '<div class="row new"><span class="tag new">新</span><span class="body">'+esc(p.new||'（这一页当时还沠有附注）')+'</span></div>'+
    bei+
  '</article>';
}).join('');
</script>
</body>
</html>
