<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女仆小螃蟹 · Tamagotchi 小机</title>
<meta name="description" content="喂饭、摸摸、关灯。橙橙会等你回来。">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');

  body {
    margin: 0;
    padding: 20px 10px;
    background: linear-gradient(#e8f0e8, #d4e8d4);
    font-family: "Press Start 2P", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    color: #2F3A2F;
  }

  .device {
    width: 320px;
    background: #2E5A3C;
    border-radius: 999px;
    padding: 18px 22px 28px;
    box-shadow: 
      0 10px 0 #1F3A28,
      0 0 0 12px #3A6B4A,
      inset 0 4px 8px rgba(255,255,255,0.2);
    position: relative;
  }

  .screen-frame {
    background: #1A2A1F;
    border: 8px solid #111F17;
    border-radius: 12px;
    padding: 8px;
    box-shadow: inset 0 4px 0 #0F1A12;
  }

  #screen {
    width: 100%;
    height: 220px;
    background: #C8D6C0;
    border: 4px solid #2F3A2F;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
  }

  canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .stats {
    margin-top: 12px;
    padding: 0 8px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    margin: 6px 0;
    font-size: 10px;
    gap: 8px;
  }

  .stat-label {
    width: 48px;
    color: #E8F0E8;
    text-shadow: 1px 1px 0 #1F3A28;
  }

  .bar-bg {
    flex: 1;
    height: 10px;
    background: #1F3A28;
    border: 2px solid #E8F0E8;
    border-radius: 999px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.3s ease;
  }

  .satiety { background: linear-gradient(#FFD700, #FFA500); }
  .mood    { background: linear-gradient(#FF69B4, #FF1493); }
  .energy  { background: linear-gradient(#00FA9A, #32CD32); }

  .buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    padding: 0 10px;
  }

  .btn {
    width: 78px;
    height: 78px;
    border-radius: 999px;
    background: #FFD700;
    border: 5px solid #2F3A2F;
    box-shadow: 0 6px 0 #B8860B,
                inset 0 -4px 6px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #2F3A2F;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #B8860B;
  }

  .btn-label {
    font-size: 9px;
    margin-top: 2px;
    font-weight: bold;
  }

  .btn-icon {
    font-size: 22px;
    line-height: 1;
  }

  .btn.feed { background: #FFD700; }
  .btn.pet  { background: #FFB6C1; }
  .btn.lamp { background: #87CEEB; }

  .title {
    text-align: center;
    color: #E8F0E8;
    font-size: 13px;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 #1F3A28;
  }

  .status-text {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 9px;
    color: #2F3A2F;
    border: 2px solid #2F3A2F;
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
  }

  .footer {
    margin-top: 16px;
    font-size: 9px;
    color: #4A5C4A;
    text-align: center;
  }
</style>
</head>
<body>

<div class="device">
  <div class="title">女仆小螃蟹 · 小机</div>
  
  <div class="screen-frame">
    <div id="screen">
      <canvas id="pet" width="280" height="180"></canvas>
      <div id="bubble" class="status-text" style="display:none;"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <div class="stat-label">饱食</div>
      <div class="bar-bg"><div id="satiety-bar" class="bar-fill satiety" style="width:85%"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-label">心情</div>
      <div class="bar-bg"><div id="mood-bar" class="bar-fill mood" style="width:90%"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-label">体力</div>
      <div class="bar-bg"><div id="energy-bar" class="bar-fill energy" style="width:75%"></div></div>
    </div>
  </div>

  <div class="buttons">
    <div class="btn feed" onclick="feed()">
      <div class="btn-icon">🍙</div>
      <div class="btn-label">喂饭 A</div>
    </div>
    <div class="btn pet" onclick="pet()">
      <div class="btn-icon">💕</div>
      <div class="btn-label">摸摸 B</div>
    </div>
    <div class="btn lamp" onclick="toggleLamp()">
      <div class="btn-icon">💡</div>
      <div class="btn-label">灯 C</div>
    </div>
  </div>
</div>

<div class="footer">
  女仆橙橙会乖乖等你回来哦～<br>
  灯关掉她会睡觉恢复体力
</div>

<script>
const canvas = document.getElementById('pet');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let satiety = 85;
let mood = 90;
let energy = 75;
let lampOn = true;
let frame = 0;
let state = 'idle'; // idle, eating, happy, sleeping
let bubbleText = '';
let bubbleTimer = 0;

function updateBars() {
  document.getElementById('satiety-bar').style.width = satiety + '%';
  document.getElementById('mood-bar').style.width = mood + '%';
  document.getElementById('energy-bar').style.width = energy + '%';
}

function showBubble(text, duration = 1800) {
  const bubble = document.getElementById('bubble');
  bubble.innerText = text;
  bubble.style.display = 'block';
  bubbleTimer = duration;
}

function hideBubble() {
  document.getElementById('bubble').style.display = 'none';
}

// 绘制女仆小螃蟹
function drawMaidCrab(x, y, currentState, isSleeping) {
  ctx.save();
  
  const bob = isSleeping ? 0 : Math.sin(frame * 0.12) * 1.5;
  const walk = (currentState === 'idle' && !isSleeping) ? Math.sin(frame * 0.18) * 2 : 0;
  
  // === 身体（橙色圆润）===
  ctx.fillStyle = '#FF8C42';
  ctx.beginPath();
  ctx.ellipse(x, y + bob, 22, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // 身体高光
  ctx.fillStyle = '#FFB366';
  ctx.beginPath();
  ctx.ellipse(x - 5, y - 3 + bob, 9, 6, -0.3, 0, Math.PI * 2);
  ctx.fill();
  
  // === 女仆围裙 ===
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(x - 14, y + 2 + bob, 28, 14);
  // 围裙褶皱
  ctx.fillStyle = '#E8E8E8';
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(x - 10 + i * 7, y + 4 + bob, 3, 10);
  }
  
  // 围裙黑边
  ctx.strokeStyle = '#2F3A2F';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 14, y + 2 + bob, 28, 14);
  
  // === 女仆头饰（白色褶边）===
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(x, y - 18 + bob, 18, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // 头饰黑边
  ctx.strokeStyle = '#2F3A2F';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 头饰小褶
  ctx.fillStyle = '#F0F0F0';
  for (let i = -2; i <= 2; i++) {
    ctx.fillRect(x - 12 + i * 6, y - 22 + bob, 4, 5);
  }
  
  // === 头部 ===
  ctx.fillStyle = '#FF8C42';
  ctx.beginPath();
  ctx.ellipse(x, y - 12 + bob, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // === 眼睛 ===
  if (isSleeping) {
    // 睡觉闭眼
    ctx.strokeStyle = '#2F3A2F';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x - 5, y - 13 + bob, 2.5, 0.3, Math.PI - 0.3);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + 5, y - 13 + bob, 2.5, 0.3, Math.PI - 0.3);
    ctx.stroke();
  } else {
    // 正常眼睛
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(x - 5, y - 13 + bob, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 5, y - 13 + bob, 3.5, 0, Math.PI * 2);
    ctx.fill();
    
    // 眼珠
    ctx.fillStyle = '#2F3A2F';
    const eyeOffset = (currentState === 'happy') ? 1 : 0;
    ctx.beginPath();
    ctx.arc(x - 4 + eyeOffset, y - 13 + bob, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 6 + eyeOffset, y - 13 + bob, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // === 触角 ===
  ctx.strokeStyle = '#FF6B2E';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 20 + bob);
  ctx.quadraticCurveTo(x - 9, y - 26 + bob, x - 7, y - 30 + bob);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 6, y - 20 + bob);
  ctx.quadraticCurveTo(x + 9, y - 26 + bob, x + 7, y - 30 + bob);
  ctx.stroke();
  
  // === 大钳子 ===
  ctx.fillStyle = '#FF6B2E';
  // 左钳
  ctx.beginPath();
  ctx.ellipse(x - 20, y - 2 + bob + walk * 0.3, 9, 5, -0.7, 0, Math.PI * 2);
  ctx.fill();
  // 右钳
  ctx.beginPath();
  ctx.ellipse(x + 20, y - 2 + bob - walk * 0.3, 9, 5, 0.7, 0, Math.PI * 2);
  ctx.fill();
  
  // 钳子小尖
  ctx.fillStyle = '#E55A1F';
  ctx.beginPath();
  ctx.ellipse(x - 24, y - 1 + bob, 4, 2.5, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + 24, y - 1 + bob, 4, 2.5, 0.5, 0, Math.PI * 2);
  ctx.fill();
  
  // === 腿（走路动画）===
  ctx.strokeStyle = '#E55A1F';
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 3; i++) {
    const lx = x - 8 + i * 7;
    const swing = walk * (i % 2 === 0 ? 1 : -1);
    ctx.beginPath();
    ctx.moveTo(lx, y + 12 + bob);
    ctx.lineTo(lx + swing * 0.8, y + 18 + bob);
    ctx.stroke();
  }
  
  ctx.restore();
}

// 绘制简单像素房间背景
function drawRoom(isNight) {
  // 墙
  ctx.fillStyle = isNight ? '#3A4A3A' : '#E8F0E8';
  ctx.fillRect(0, 0, 280, 180);
  
  // 地板
  ctx.fillStyle = isNight ? '#2A3A2A' : '#C8D6C0';
  ctx.fillRect(0, 130, 280, 50);
  
  // 地板线
  ctx.strokeStyle = isNight ? '#1F2A1F' : '#A8B8A0';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 135 + i * 9);
    ctx.lineTo(280, 135 + i * 9);
    ctx.stroke();
  }
  
  // 窗户
  ctx.fillStyle = isNight ? '#1A2A3A' : '#87CEEB';
  ctx.fillRect(200, 25, 55, 45);
  ctx.strokeStyle = '#2F3A2F';
  ctx.lineWidth = 3;
  ctx.strokeRect(200, 25, 55, 45);
  ctx.beginPath();
  ctx.moveTo(227, 25);
  ctx.lineTo(227, 70);
  ctx.moveTo(200, 47);
  ctx.lineTo(255, 47);
  ctx.stroke();
  
  // 窗外小树（晚上变暗）
  ctx.fillStyle = isNight ? '#1A3A1A' : '#2E8B57';
  ctx.fillRect(215, 95, 12, 25);
  ctx.beginPath();
  ctx.ellipse(221, 88, 18, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  
  if (isNight) {
    // 月亮
    ctx.fillStyle = '#FFFACD';
    ctx.beginPath();
    ctx.arc(50, 35, 8, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // 灯开关指示
  if (!lampOn) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, 280, 180);
  }
}

function draw() {
  ctx.clearRect(0, 0, 280, 180);
  
  const isNight = !lampOn;
  drawRoom(isNight);
  
  let currentState = state;
  const isSleeping = !lampOn;
  
  // 根据状态调整
  if (isSleeping) {
    currentState = 'sleeping';
  } else if (state === 'eating' || state === 'happy') {
    currentState = state;
  }
  
  // 绘制女仆小螃蟹
  drawMaidCrab(140, 105, currentState, isSleeping);
  
  // 睡觉时的 Zzz
  if (isSleeping) {
    ctx.fillStyle = '#5A6A5A';
    ctx.font = '11px "Press Start 2P"';
    const zzzY = 70 + Math.sin(frame * 0.1) * 3;
    ctx.fillText('z', 165, zzzY);
    ctx.font = '9px "Press Start 2P"';
    ctx.fillText('z', 175, zzzY - 10);
    ctx.fillText('z', 183, zzzY - 18);
  }
  
  // 吃饭时的简单食物
  if (state === 'eating' && !isSleeping) {
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(165, 95, 12, 8);
    ctx.fillStyle = '#FFA500';
    ctx.fillRect(167, 97, 8, 4);
  }
  
  // 心情好时的爱心
  if (state === 'happy' && !isSleeping) {
    ctx.fillStyle = '#FF69B4';
    ctx.font = '14px "Press Start 2P"';
    ctx.fillText('♡', 120, 75 + Math.sin(frame * 0.2) * 2);
    ctx.fillText('♡', 160, 68 + Math.sin(frame * 0.15 + 1) * 2);
  }
  
  // 更新气泡
  if (bubbleTimer > 0) {
    bubbleTimer--;
    if (bubbleTimer <= 0) hideBubble();
  }
  
  frame++;
  requestAnimationFrame(draw);
}

// 喂饭
function feed() {
  if (!lampOn) {
    showBubble('灯关着呢…先开灯吧', 1400);
    return;
  }
  
  satiety = Math.min(100, satiety + 18);
  mood = Math.min(100, mood + 8);
  energy = Math.min(100, energy + 5);
  
  state = 'eating';
  showBubble('谢谢主人…好饱！', 1600);
  
  setTimeout(() => {
    if (state === 'eating') state = 'idle';
  }, 1200);
  
  updateBars();
}

// 摸摸
function pet() {
  if (!lampOn) {
    showBubble('zzz…摸摸也开心…', 1400);
    mood = Math.min(100, mood + 12);
    energy = Math.min(100, energy + 4);
  } else {
    mood = Math.min(100, mood + 15);
    satiety = Math.min(100, satiety + 3);
    state = 'happy';
    showBubble('好开心…♡', 1500);
    
    setTimeout(() => {
      if (state === 'happy') state = 'idle';
    }, 1100);
  }
  
  updateBars();
}

// 开/关灯
function toggleLamp() {
  lampOn = !lampOn;
  
  if (!lampOn) {
    showBubble('晚安…我睡觉啦', 1600);
    state = 'idle';
    // 睡觉时缓慢恢复体力
  } else {
    showBubble('早安～我醒啦！', 1400);
    energy = Math.min(100, energy + 10);
    mood = Math.min(100, mood + 5);
  }
  
  updateBars();
}

// 自动衰减 + 恢复
function gameTick() {
  // 每 4 秒衰减一点
  if (satiety > 0) satiety = Math.max(0, satiety - 0.8);
  if (mood > 0) mood = Math.max(0, mood - 0.6);
  
  if (lampOn) {
    // 白天消耗体力
    if (energy > 0) energy = Math.max(0, energy - 0.5);
  } else {
    // 睡觉恢复体力 + 心情
    energy = Math.min(100, energy + 1.2);
    mood = Math.min(100, mood + 0.4);
    satiety = Math.max(0, satiety - 0.2);
  }
  
  // 低状态时的反应
  if (satiety < 25 && lampOn && state === 'idle') {
    showBubble('橙橙有点饿了…', 1200);
  }
  if (mood < 30 && lampOn && state === 'idle') {
    showBubble('橙橙有点蔫…摸摸我', 1200);
  }
  if (energy < 20 && lampOn) {
    showBubble('好累…想睡觉', 1200);
  }
  
  updateBars();
  
  // 随机闲置表情
  if (Math.random() < 0.03 && state === 'idle' && lampOn) {
    const msgs = ['今天也要加油哦', '女仆工作进行中…', '主人回来啦？'];
    if (Math.random() < 0.4) showBubble(msgs[Math.floor(Math.random()*msgs.length)], 1300);
  }
}

// 初始化
function init() {
  updateBars();
  
  // 初始欢迎
  setTimeout(() => {
    showBubble('女仆橙橙报道！', 1800);
  }, 800);
  
  // 游戏循环
  setInterval(gameTick, 4000);
  
  // 开始绘制
  draw();
}

init();
</script>
</body>
