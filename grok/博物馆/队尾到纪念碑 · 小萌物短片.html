}
function drawShelf(ctx, jellySlot) {
    const cellW = 52;
    const gap = 8;
    const total = 5 * cellW + 4 * gap;
    const x0 = (WORLD_W - total) / 2;
    const y = 78;
    ctx.fillStyle = MUTED;
    ctx.font = "14px 'WenQuanYi Zen Hei', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("头", x0, 68);
    ctx.textAlign = "right";
    ctx.fillText("尾", x0 + total, 68);
    for (let i = 0; i < 5; i++) {
        const x = x0 + i * (cellW + gap);
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        roundBox(ctx, x, y, cellW, 64, 10);
        ctx.fill();
        if (i === jellySlot) {
            drawJelly(ctx, x + cellW / 2, y + 34, 20, 1, "ok");
            ctx.strokeStyle = GOLD;
            ctx.lineWidth = 2;
            roundBox(ctx, x + 1, y + 1, cellW - 2, 62, 10);
            ctx.stroke();
        }
        else {
            ctx.fillStyle = PAPER;
            ctx.fillRect(x + 16, y + 26, 20, 14);
        }
    }
}
function drawSpoon(ctx, x, y) {
    ctx.fillStyle = INK;
    roundBox(ctx, x - 5, y, 10, 86, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, y + 96, 34, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = MUTED;
    ctx.beginPath();
    ctx.ellipse(x, y + 98, 20, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,247,244,0.45)";
    ctx.beginPath();
    ctx.ellipse(x - 8, y + 90, 8, 5, -0.4, 0, Math.PI * 2);
    ctx.fill();
}
function night(ctx) {
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, WORLD_W, STAGE_Y);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(78, 36, 10, 0.7, 5.2);
    ctx.stroke();
    for (const [sx, sy, color] of STARS) {
        ctx.fillStyle = color;
        ctx.fillRect(sx, sy, 2, 2);
    }
}
function drawFilm(ctx, t, pokeLeft) {
    assertCast();
    const beat = beatAt(t).id;
    night(ctx);
    let hit = null;
    if (beat === "ticket") {
        ctx.fillStyle = PAPER;
        roundBox(ctx, 132, 28, 376, 168, 18);
        ctx.fill();
        ctx.fillStyle = GOLD;
        ctx.fillRect(132, 28, 8, 168);
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = GOLD;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(156, 172);
        ctx.lineTo(488, 172);
        ctx.stroke();
        ctx.setLineDash([]);
        drawJelly(ctx, 320, 108, 40, jellySquash(t, false, 0), "ok");
    }
    else if (beat === "tail") {
        drawShelf(ctx, 4);
    }
    else if (beat === "get") {
        const u = Math.min(1, Math.max(0, (t - 16.4) / 1.6));
        drawShelf(ctx, u < 1 ? -1 : 0);
        if (u < 1) {
            const cellW = 52;
            const gap = 8;
            const total = 5 * cellW + 4 * gap;
            const x0 = (WORLD_W - total) / 2;
            const from = x0 + 4 * (cellW + gap) + cellW / 2;
            const to = x0 + cellW / 2;
            const x = from + (to - from) * u;
            const hop = u < 0.5 ? -28 * (u / 0.5) : -28 * (1 - (u - 0.5) / 0.5);
            drawJelly(ctx, x, 112 + hop, 18, u > 0.85 ? 0.86 : 1.08, "ok");
        }
        if (t > 18.2 && t < 20.2) {
            ctx.fillStyle = GOLD;
            ctx.font = "16px ui-monospace, monospace";
            ctx.textAlign = "center";
            ctx.fillText("BOING", 320, 62);
        }
    }
    else if (beat === "tri") {
        ctx.fillStyle = PAPER;
        roundBox(ctx, 168, 36, 304, 156, 14);
        ctx.fill();
        ctx.fillStyle = NIGHT;
        ctx.fillRect(184, 52, 272, 124);
        ctx.fillStyle = GREEN;
        ctx.beginPath();
        ctx.moveTo(414, 64);
        ctx.lineTo(448, 112);
        ctx.lineTo(380, 112);
        ctx.closePath();
        ctx.fill();
    }
    else if (beat === "hmtl") {
        ctx.fillStyle = PAPER;
        ctx.fillRect(228, 58, 150, 36);
        ctx.fillRect(250, 104, 150, 36);
        ctx.fillRect(206, 150, 120, 28);
        ctx.fillStyle = GOLD;
        ctx.fillRect(340, 168, 10, 22);
        ctx.fillRect(348, 182, 18, 8);
    }
    else if (beat === "mail") {
        ctx.fillStyle = PAPER;
        roundBox(ctx, 230, 70, 180, 110, 12);
        ctx.fill();
        ctx.strokeStyle = GOLD;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(242, 86);
        ctx.lineTo(320, 132);
        ctx.lineTo(398, 86);
        ctx.stroke();
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(360, 48, 72, 22);
        ctx.setLineDash([]);
    }
    else if (beat === "v50") {
        ctx.fillStyle = CREAM;
        roundBox(ctx, 220, 56, 200, 130, 8);
        ctx.fill();
        ctx.fillStyle = GOLD;
        ctx.font = "64px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText("50", 320, 148);
        ctx.strokeStyle = DEEP;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(250, 78);
        ctx.lineTo(390, 96);
        ctx.stroke();
    }
    else if (beat === "spoon") {
        const local = t - 52;
        const drop = local < 3 ? 20 + local * 28 : 104;
        drawSpoon(ctx, 320, drop - 70);
        const shrink = local < 3.2 ? 1 : Math.max(0, 1 - (local - 3.2) / 1.4);
        if (shrink > 0.05) {
            drawJelly(ctx, 320, 150, 28 * shrink, local > 3 ? 0.8 : 1, "oh");
        }
    }
    else if (beat === "gone") {
        ctx.strokeStyle = GOLD;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(320, 112, 46, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = GOLD;
        ctx.font = "42px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText("404", 320, 124);
    }
    else {
        ctx.fillStyle = PAPER;
        roundBox(ctx, 168, 24, 304, 172, 16);
        ctx.fill();
        ctx.fillStyle = GOLD;
        ctx.fillRect(168, 24, 8, 172);
        ctx.beginPath();
        ctx.arc(320, 112, 54, 0, Math.PI * 2);
        ctx.fillStyle = NIGHT;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = GOLD;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(320, 112, 46, 0, Math.PI * 2);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const squash = jellySquash(t, true, pokeLeft);
        drawJelly(ctx, 320, 114, 32, squash, "dance");
        hit = { x: 320, y: 114, r: 42 };
    }
    drawCast(ctx, t, beat);
    return hit;
}

const MELODY = [523.25, 659.25, 783.99, 659.25, 880, 783.99, 659.25, 523.25];
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const $kicker = document.getElementById("kicker");
const $cap = document.getElementById("cap");
const $aside = document.getElementById("aside");
const $scrub = document.getElementById("scrub");
const $now = document.getElementById("now");
const $play = document.getElementById("play");
const $sound = document.getElementById("sound");
const $hint = document.getElementById("hint");
const $chapters = document.getElementById("chapters");
let t = 0;
let playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let soundOn = false;
let audio = null;
let note = -1;
let hit = null;
let pokeLeft = 0;
let pokeCount = 0;
let pokeLine = null;
let ended = false;
let beatId = BEATS[0].id;

function fmt(sec) {
  const s = Math.max(0, Math.floor(sec));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function tone(freq, dur, gain) {
  if (!audio || !soundOn) return;
  const start = audio.currentTime;
  const osc = audio.createOscillator();
  const amp = audio.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  amp.gain.setValueAtTime(0.0001, start);
  amp.gain.exponentialRampToValueAtTime(gain, start + 0.02);
  amp.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(amp);
  amp.connect(audio.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}
function paint() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const bw = Math.max(1, Math.round(rect.width * dpr));
  const bh = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  const scale = Math.min(rect.width / WORLD_W, rect.height / WORLD_H);
  const ox = (rect.width - WORLD_W * scale) / 2;
  const oy = (rect.height - WORLD_H * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#171116";
  ctx.fillRect(0, 0, rect.width, rect.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.imageSmoothingEnabled = false;
  hit = drawFilm(ctx, t, pokeLeft);
}
function renderUi(force) {
  const beat = beatAt(t);
  if (force || beat.id !== beatId) {
    beatId = beat.id;
    document.querySelectorAll(".chapters button").forEach((btn) => {
      btn.setAttribute("aria-pressed", btn.dataset.id === beatId ? "true" : "false");
    });
  }
  $kicker.textContent = beat.kicker;
  $cap.textContent = beat.caption;
  $aside.textContent = pokeLine || beat.aside;
  $scrub.value = String(t);
  $scrub.setAttribute("aria-valuetext", fmt(t));
  $now.textContent = fmt(t);
  $play.textContent = ended ? "再看一遍" : playing ? "暂停" : "播放";
  $hint.hidden = beatId !== "stone";
}
function seek(next, resume) {
  t = Math.min(DURATION, Math.max(0, next));
  note = Math.floor(t / 0.9);
  pokeLine = null;
  ended = t >= DURATION;
  if (ended) playing = false;
  else if (resume) playing = true;
  renderUi(true);
  paint();
}
BEATS.forEach((item) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.dataset.id = item.id;
  btn.textContent = item.kicker;
  btn.setAttribute("aria-pressed", item.id === beatId ? "true" : "false");
  btn.addEventListener("click", () => seek(item.start, true));
  $chapters.appendChild(btn);
});
$scrub.addEventListener("input", () => seek(Number($scrub.value), false));
$play.addEventListener("click", () => {
  if (t >= DURATION) {
    t = 0;
    note = -1;
    pokeLine = null;
    ended = false;
  }
  playing = !playing;
  if (t >= DURATION) playing = false;
  renderUi(true);
});
$sound.addEventListener("click", async () => {
  if (!soundOn) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!audio) audio = new Ctx();
    await audio.resume();
    soundOn = true;
    $sound.textContent = "八音盒关";
    tone(880, 0.18, 0.04);
  } else {
    soundOn = false;
    $sound.textContent = "八音盒开";
  }
});
canvas.addEventListener("click", (event) => {
  if (!hit) return;
  const rect = canvas.getBoundingClientRect();
  const scale = Math.min(rect.width / WORLD_W, rect.height / WORLD_H);
  const ox = (rect.width - WORLD_W * scale) / 2;
  const oy = (rect.height - WORLD_H * scale) / 2;
  const x = (event.clientX - rect.left - ox) / scale;
  const y = (event.clientY - rect.top - oy) / scale;
  const dx = x - hit.x;
  const dy = y - hit.y;
  if (dx * dx + dy * dy > hit.r * hit.r) return;
  pokeLeft = 0.45;
  pokeLine = POKE_LINES[pokeCount % POKE_LINES.length];
  pokeCount += 1;
  renderUi(true);
  if (soundOn) {
    tone(520, 0.12, 0.05);
    setTimeout(() => tone(780, 0.16, 0.04), 90);
  }
});
let last = performance.now();
let lastUi = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing) {
    t = Math.min(DURATION, t + dt);
    if (t >= DURATION) {
      playing = false;
      ended = true;
    }
  }
  if (pokeLeft > 0) pokeLeft = Math.max(0, pokeLeft - dt);
  paint();
  if (soundOn && playing) {
    const index = Math.floor(t / 0.9);
    if (index !== note) {
      note = index;
      tone(MELODY[index % MELODY.length], 0.32, 0.03);
    }
  }
  if (now - lastUi > 200) {
    lastUi = now;
    renderUi(false);
  }
  requestAnimationFrame(frame);
}
renderUi(true);
paint();
requestAnimationFrame(frame);
window.addEventListener("resize", paint);
</script>
</body>
</html>
