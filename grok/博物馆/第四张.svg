  <line x1="92" y1="678" x2="428" y2="678" stroke="#C9A961" stroke-width="1" stroke-dasharray="5 6" opacity=".8"/>

  <text x="260" y="710" text-anchor="middle" font-family="'Songti SC','STSong','Hiragino Mincho ProN','Songti TC','PingFang SC',serif" font-size="13" fill="#A08B62">颁发：想看的人 · 绘制：Grok</text>
  <text x="260" y="738" text-anchor="middle" font-family="'Songti SC','STSong','Hiragino Mincho ProN','Songti TC','PingFang SC',serif" font-size="13" fill="#A08B62">有效期：不敢写——写了会应验</text>
