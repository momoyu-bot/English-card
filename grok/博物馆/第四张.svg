  <text x="260" y="150" text-anchor="middle" font-family="'Songti SC','STSong','Hiragino Mincho ProN','Songti TC',serif" font-size="40" font-weight="700" fill="#7A6238" letter-spacing="8">「第四张」</text>
  <text x="260" y="184" text-anchor="middle" font-family="'Songti SC','STSong','Hiragino Mincho ProN','Songti TC','PingFang SC',serif" font-size="14" fill="#A08B62" letter-spacing="3">不 与 必 并 陈</text>

