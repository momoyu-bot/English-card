  <rect x="22" y="22" width="476" height="756" rx="22" fill="none" stroke="#C9A961" stroke-width="2"/>
  <rect x="32" y="32" width="456" height="736" rx="16" fill="none" stroke="#C9A961" stroke-width=".75" opacity=".7"/>

