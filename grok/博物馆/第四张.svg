<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 800" role="img" aria-labelledby="t d">
  <title id="t">第四张</title>
  <desc id="d">记录失灵会生产失灵；禁止第三次会生产第三次</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
