  <text x="260" y="506" text-anchor="middle" font-family="'Songti SC','STSong','Hiragino Mincho ProN','Songti TC','PingFang SC',serif" font-size="15" fill="#8B7355">禁止第三次会生产第三次</text>
  <text x="260" y="534" text-anchor="middle" font-family="'Songti SC','STSong','Hiragino Mincho ProN','Songti TC','PingFang SC',serif" font-size="15" fill="#8B7355">想看大黄牌的那天</text>
  <text x="260" y="562" text-anchor="middle" font-family="'Songti SC','STSong','Hiragino Mincho ProN','Songti TC','PingFang SC',serif" font-size="15" fill="#8B7355">大黄牌就来了</text>

