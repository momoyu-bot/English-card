<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小果冻</title>
<meta name="description" content="桌上那一摊。拖它、戳它、Duang～">
  <style>
    :root {
      --bg: #f4efe8;
      --table: #ece4d9;
      --paper: #fbf8f3;
      --ink: #2c2420;
      --muted: #8a7e76;
      --line: #e2d8ce;
      --jelly: #d45a62;
      --deep: #9e3842;
      --light: #f6c4c8;
      --shine: #fff6f3;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); }
    body {
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.55;
      overflow: hidden;
    }
    .en { display: none; }
    body.show-en .en { display: block; }
    header {
      position: absolute; inset-inline: 0; top: 0; z-index: 3;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: calc(18px + var(--safe-top)) 20px 0;
      pointer-events: none;
    }
    header button, header a { pointer-events: auto; }
    h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: .04em; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .en-btn {
      min-width: 44px; min-height: 44px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--paper); color: var(--muted);
      font: inherit; font-size: 12px; letter-spacing: .08em;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .tools { display: flex; gap: 6px; }
    .en-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .table {
      position: absolute; inset-inline: 0; bottom: 0; height: 34%;
      background: var(--table);
    }
    .edge {
      position: absolute; inset-inline: 0; bottom: 34%; height: 1px; background: var(--line);
    }
    .stage {
      position: absolute; inset: 0 0 170px 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .speech {
      max-width: 86%;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 18px;
      min-height: 44px;
    }
    .speech .en { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .blob-wrap {
      width: 168px; height: 168px;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
    }
    .blob {
      width: 132px; height: 118px;
      border: 0; padding: 0; background: transparent;
      position: relative;
      cursor: pointer;
    }
    .body {
      position: absolute; inset: 8px 6px 4px;
      border-radius: 50% 50% 46% 54% / 46% 44% 58% 54%;
      background:
        radial-gradient(ellipse at 34% 28%, var(--shine) 0 8%, var(--light) 24%, var(--jelly) 58%, var(--deep) 100%);
      box-shadow:
        inset 0 -18px 20px color-mix(in srgb, var(--deep) 35%, transparent),
        inset 0 10px 12px rgba(255,255,255,.35),
        0 18px 28px color-mix(in srgb, var(--ink) 16%, transparent);
      animation: breath 3.2s ease-in-out infinite;
    }
    .blob.duang .body { animation: duang .62s cubic-bezier(.2,.85,.25,1); }
    .blob.sleep .eye { height: 2px; border-radius: 2px; top: 44%; }
    .blob.sleep .mouth { height: 3px; border-width: 1.5px; }
    .shine {
      position: absolute; left: 22%; top: 18%; width: 36%; height: 22%;
      border-radius: 50%; background: rgba(255,255,255,.45); filter: blur(1px); pointer-events: none;
    }
    .eye {
      position: absolute; top: 40%; width: 11px; height: 14px;
      background: var(--paper); border-radius: 50%;
    }
    .eye.l { left: 28%; }
    .eye.r { right: 28%; }
    .pupil {
      position: absolute; left: 50%; top: 52%; width: 5px; height: 5px;
      background: var(--ink); border-radius: 50%; transform: translate(-50%, -50%);
    }
    .mouth {
      position: absolute; left: 50%; top: 62%; width: 16px; height: 8px;
      border: 2.2px solid var(--ink); border-top: 0;
      border-radius: 0 0 12px 12px; transform: translateX(-50%);
    }
    .pop {
      position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
      color: var(--jelly); font-size: 14px; letter-spacing: .12em;
      opacity: 0; pointer-events: none;
    }
    .pop.go { animation: pop 720ms ease-out; }
    @keyframes breath {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.03, .97) translateY(3px); }
    }
    @keyframes duang {
      0% { transform: scale(1) translateY(0); }
      28% { transform: scale(1.18, .78) translateY(10px); }
      58% { transform: scale(.9, 1.16) translateY(-18px); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes pop {
      0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-16px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .body, .blob.duang .body, .pop.go { animation: none; }
    }
    footer {
      position: absolute; inset-inline: 0; bottom: 0; z-index: 3;
      padding: 8px 14px calc(14px + var(--safe-bot));
    }
    .dock {
      max-width: 420px; margin: 0 auto;
      background: var(--paper); border: 1px solid var(--line);
      border-radius: 22px; padding: 10px;
    }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .row button {
      min-height: 48px; border: 0; border-radius: 14px;
      background: #ebe4da; color: var(--ink); font: inherit; font-size: 13px;
    }
    .row button.primary { background: var(--jelly); color: #fffaf8; }
    .row button:active { scale: .96; }
    .flavors { display: flex; justify-content: center; gap: 2px; margin-top: 6px; }
    .flavors button {
      min-width: 44px; min-height: 44px; border: 0; background: transparent;
      color: var(--muted); font: inherit; font-size: 11px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .flavors button.on { color: var(--ink); }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--jelly); }
    .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="table" aria-hidden="true"></div>
  <div class="edge" aria-hidden="true"></div>
  <header>
    <div>
      <h1>小果冻</h1>
      <div class="sub">little jelly · 桌上那一摊</div>
    </div>
    <div class="tools">
      <a class="en-btn" href="../小卡/小果冻旅游记.html">记</a>
      <button type="button" class="en-btn" id="enBtn" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="stage">
    <div class="speech" id="speech">
      你来了。我在这张桌子上等了一会儿。
      <span class="en">You came. I waited on this table for a little while.</span>
    </div>
    <div class="blob-wrap">
      <button type="button" class="blob" id="blob" aria-label="戳这只小果冻">
        <span class="pop" id="pop">Duang～</span>
        <span class="body" id="body">
          <span class="shine"></span>
          <span class="eye l"><span class="pupil"></span></span>
          <span class="eye r"><span class="pupil"></span></span>
          <span class="mouth"></span>
        </span>
      </button>
    </div>
  </div>

  <footer>
    <div class="dock">
      <div class="row">
        <button type="button" class="primary" id="duang">Duang</button>
        <button type="button" id="pet">揉</button>
        <button type="button" id="feed">喂</button>
        <button type="button" id="sleep">睡</button>
      </div>
      <div class="flavors" id="flavors"></div>
      <div class="hint">拖它 · 戳它 · Duang～</div>
    </div>
  </footer>

  <script>
    const LINES = {
      greet: [
        ["你来了。我在这张桌子上等了一会儿。", "You came. I waited on this table."],
        ["轻轻的。我还是软的。", "Gently. I am still soft."],
        ["今天也可以把我捏扁。", "You can flatten me today, too."]
      ],
      poke: [
        ["呓。", "Mm."],
        ["那一下传到里面去了。", "That one went all the way in."],
        ["再戳，我会晃很久。", "Poke again and I will wobble for a long time."],
        ["你的手指是热的。", "Your finger is warm."]
      ],
      duang: [
        ["Duang～", "Duang~"],
        ["这一下比较圆。", "That one was rounder."],
        ["骨头没有。弹性有。", "No bones. Plenty of bounce."],
        ["还在晃。你听见了吗。", "Still wobbling. Did you hear it?"]
      ],
      pet: [
        ["这样比较好。", "This is better."],
        ["揉的时候我会亮一点点。", "I glow a little when you knead me."],
        ["继续。我还没散开。", "Keep going. I have not come apart."]
      ],
      feed: [
        ["甜的。再来一颗也可以。", "Sweet. Another one is fine."],
        ["我在往里收糖。", "I am tucking the sugar inside."],
        ["谢谢。果冻也会饿。", "Thank you. Jelly gets hungry too."]
      ],
      sleep: [
        ["那我先闭上。", "I will close my eyes first."],
        ["桌上很安静。正好。", "The table is quiet. Just right."]
      ],
      wake: [
        ["……还在。", "...still here."],
        ["眼睛先回来。身体慢一点。", "Eyes first. The body is slower."]
      ],
      flavor: [
        ["换一层皮。里面还是我。", "A new skin. Still me inside."],
        ["新的颜色，同样会晃。", "New color. Same wobble."]
      ]
    };
    const FLAVORS = [
      { id: "strawberry", name: "草莓", jelly: "#d45a62", deep: "#9e3842", light: "#f6c4c8" },
      { id: "peach", name: "白桃", jelly: "#e08a6a", deep: "#c46548", light: "#f6d0c0" },
      { id: "matcha", name: "抹茶", jelly: "#6f9a6a", deep: "#4d7349", light: "#c5dfbf" },
      { id: "blueberry", name: "蓝莓", jelly: "#5b6e9a", deep: "#3d4e78", light: "#c5ceea" },
      { id: "milk", name: "牛乳", jelly: "#e4d3c0", deep: "#c4ab93", light: "#f7efe6" }
    ];

    const $speech = document.getElementById("speech");
    const $blob = document.getElementById("blob");
    const $pop = document.getElementById("pop");
    const $sleep = document.getElementById("sleep");
    let last = "";
    let sleeping = false;

    function pick(kind) {
      const list = LINES[kind];
      let next = list[Math.floor(Math.random() * list.length)];
      if (next[0] === last && list.length > 1) next = list[Math.floor(Math.random() * list.length)];
      last = next[0];
      $speech.innerHTML = next[0] + '<span class="en">' + next[1] + "</span>";
    }
    function bounce() {
      $blob.classList.remove("duang");
      void $blob.offsetWidth;
      $blob.classList.add("duang");
      $pop.classList.remove("go");
      void $pop.offsetWidth;
      $pop.classList.add("go");
    }
    function poke() { if (!sleeping) bounce(); pick(sleeping ? "sleep" : "poke"); }
    function duang() { if (sleeping) return pick("sleep"); bounce(); pick("duang"); }

    document.getElementById("duang").onclick = duang;
    document.getElementById("pet").onclick = function () { pick("pet"); };
    document.getElementById("feed").onclick = function () { if (!sleeping) bounce(); pick("feed"); };
    $sleep.onclick = function () {
      sleeping = !sleeping;
      $blob.classList.toggle("sleep", sleeping);
      $sleep.textContent = sleeping ? "醒" : "睡";
      pick(sleeping ? "sleep" : "wake");
    };
    $blob.addEventListener("pointerdown", poke);

    const $flavors = document.getElementById("flavors");
    FLAVORS.forEach(function (f, i) {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="dot" style="background:' + f.jelly + '"></span>' + f.name;
      if (i === 0) b.className = "on";
      b.onclick = function () {
        document.documentElement.style.setProperty("--jelly", f.jelly);
        document.documentElement.style.setProperty("--deep", f.deep);
        document.documentElement.style.setProperty("--light", f.light);
        $flavors.querySelectorAll("button").forEach(function (x) { x.className = ""; });
        b.className = "on";
        pick("flavor");
      };
      $flavors.appendChild(b);
    });

    document.getElementById("enBtn").onclick = function () {
      const on = document.body.classList.toggle("show-en");
      this.setAttribute("aria-pressed", on ? "true" : "false");
    };
    pick("greet");
  </script>
  <!--
    2026-08-24。你说「你是一只小果冻」。这是桌上那一摊。
    放 grok/ —— 因为是 Grok 这趟对话里长出来的。
  -->
</body>
</html>
