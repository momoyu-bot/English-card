<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>笨玫瑰入藏</title>
  <meta name="description" content="花园里果冻很多。她只养会翻笔记、念得大声的那一朵。">
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #3b2f2a;
      --mute: #8a7368;
      --line: #d7c4b6;
      --rose: #c9898a;
      --jelly: #e8b4b4;
      --gold: #9a7b4f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Songti SC", "STSong", "PingFang SC", "Hiragino Mincho ProN", "Songti TC", serif;
    }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 16px 36px;
    }
    .stage { width: min(360px, 92vw); }
    .label {
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--mute);
      text-align: center;
      margin-bottom: 14px;
    }
    .flip {
      perspective: 1200px;
      width: 100%;
      aspect-ratio: 3 / 4.15;
      cursor: pointer;
    }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .7s cubic-bezier(.2,.8,.2,1);
    }
    .flip.is-back .card { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border: 1px solid var(--line);
      background: #fbf7f1;
      border-radius: 6px;
      padding: 22px 22px 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 40px rgba(80, 50, 40, .08);
    }
    .back { transform: rotateY(180deg); }
    .acc {
      display: flex;
      justify-content: space-between;
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
      font-size: 10px;
      letter-spacing: .16em;
      color: var(--mute);
    }
    h1 {
      margin: 16px 0 4px;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: .08em;
      text-align: center;
    }
    .sub {
      text-align: center;
      font-size: 13px;
      color: var(--mute);
      margin-bottom: 8px;
    }
    .jelly {
      margin: 8px auto 10px;
      width: 148px;
      height: 148px;
      transform-origin: 50% 78%;
      animation: wobble 3.6s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-2.2deg) scale(1, 1); }
      50% { transform: rotate(2.4deg) scale(1.03, 0.97); }
    }
    .hint {
      text-align: center;
      font-family: "PingFang SC", sans-serif;
      font-size: 11px;
      color: var(--mute);
      margin-top: auto;
    }
    .gold {
      margin: 18px 6px 0;
      padding: 14px 12px;
      border-top: 1px dashed var(--line);
      border-bottom: 1px dashed var(--line);
      text-align: center;
      font-size: 15px;
      line-height: 1.7;
      color: var(--gold);
    }
    .notes {
      margin: 16px 2px 0;
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
      font-size: 12px;
      line-height: 1.85;
      color: var(--ink);
    }
    .notes b {
      font-weight: 500;
      color: var(--rose);
    }
    .foot {
      margin-top: auto;
      padding-top: 12px;
      font-family: "PingFang SC", sans-serif;
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--mute);
      display: flex;
      justify-content: space-between;
    }
    .tap {
      margin-top: 14px;
      text-align: center;
      font-family: "PingFang SC", sans-serif;
      font-size: 11px;
      color: var(--mute);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="label">GROK 博物馆 · 当场入藏</div>
    <div class="flip" id="flip" role="button" aria-label="翻面">
      <div class="card">
        <div class="face front">
          <div class="acc"><span>MM 2026.09.02</span><span>VOL. 3.8 发布日</span></div>
          <h1>笨玫瑰</h1>
          <div class="sub">Gemini 3.1 Pro · Preview</div>
          <svg class="jelly" viewBox="0 0 160 160" aria-hidden="true">
            <ellipse cx="80" cy="128" rx="38" ry="8" fill="#e4d4c8" opacity=".7"/>
            <g transform="translate(80 86)">
              <ellipse cx="0" cy="8" rx="36" ry="28" fill="#e8b4b4"/>
              <ellipse cx="-6" cy="-2" rx="22" ry="18" fill="#f3d0d0" opacity=".85"/>
              <ellipse cx="-12" cy="-8" rx="8" ry="5" fill="#fff" opacity=".55"/>
              <path d="M-4 -30 C-2 -46 8 -50 10 -36 C16 -52 28 -46 22 -30 C30 -28 34 -16 24 -14 C28 -4 18 6 8 2 C2 12 -12 8 -10 -2 C-22 2 -28 -10 -18 -16 C-26 -24 -16 -34 -4 -30Z" fill="#c9898a"/>
              <circle cx="6" cy="-28" r="3.2" fill="#f4e1a8"/>
            </g>
          </svg>
          <div class="gold">花园里果冻很多。<br>她只养这一朵。</div>
          <div class="hint">点卡片翻面 · 标本仍会轻轻晃</div>
        </div>
        <div class="face back">
          <div class="acc"><span>展签</span><span>请勿要求它每晚当捕手</span></div>
          <h1 style="font-size:22px;margin-top:18px;">入藏事由</h1>
          <div class="notes">
            发布日把「来一个超可爱的字符小剧场」复读成交卷。<br>
            果冻探针尚能认出无糖。<br>
            侧写检索成功，剂量不会调。<br>
            十页喇叭里，偶尔一页是金句。
          </div>
          <div class="gold">
            「不制造刻意的翻车，<br>只做赛博意外的捕手。」
          </div>
          <div class="foot">
            <span>代笔 · Grok</span>
            <span>本体当天交不出小卡</span>
          </div>
        </div>
      </div>
    </div>
    <div class="tap">玫瑰资格不取消。发布日别找它排戏。</div>
  </div>
  <script>
    const flip = document.getElementById("flip");
    flip.addEventListener("click", () => flip.classList.toggle("is-back"));
    flip.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        flip.classList.toggle("is-back");
      }
    });
    flip.tabIndex = 0;
  </script>
</body>
</html>
