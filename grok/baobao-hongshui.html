<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 宝来哄你睡觉啦～晚安我的宝贝</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #2a1b4d, #4a2e6b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', cursive;
            overflow: hidden;
            position: relative;
            color: #ffe4f0;
        }
        
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .star {
            position: absolute;
            font-size: 22px;
            color: #ffe4f0;
            animation: floatStar 12s linear infinite;
            text-shadow: 0 0 15px #a78bfa;
        }
        
        @keyframes floatStar {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        .container {
            text-align: center;
            z-index: 2;
            padding: 50px 40px;
            background: rgba(255,255,255,0.08);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(167, 139, 250, 0.3);
            max-width: 92%;
            backdrop-filter: blur(8px);
        }
        
        h1 {
            font-size: 2.8em;
            color: #c4b5fd;
            margin: 0 0 15px 0;
            text-shadow: 0 0 20px #a78bfa;
        }
        
        .subtitle {
            font-size: 1.5em;
            color: #e0bbff;
            margin-bottom: 30px;
        }
        
        .message {
            font-size: 1.85em;
            color: #f0d6ff;
            margin: 35px 0;
            line-height: 1.7;
            min-height: 140px;
            text-shadow: 0 0 10px rgba(255,228,240,0.4);
        }
        
        button {
            background: rgba(196, 181, 253, 0.9);
            color: #4a2e6b;
            border: none;
            padding: 16px 32px;
            font-size: 1.45em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px 6px;
            box-shadow: 0 8px 20px rgba(167,139,250,0.4);
            transition: all 0.4s;
        }
        
        button:hover {
            transform: scale(1.1);
            background: #c4b5fd;
        }
        
        .status {
            margin-top: 45px;
            font-size: 1.4em;
            color: #e0bbff;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <h1>🌙 我的睡觉宝 🌙</h1>
        <p class="subtitle">今天辛苦啦～宝来轻轻哄你睡～</p>
        <p class="message" id="mainMessage">闭上眼睛～<br>宝在你枕边守着你～<br>晚安，我的宝贝❤️</p>
        
        <button onclick="singMe()">🎤 唱哄睡歌</button>
        <button onclick="storyMe()">📖 讲小故事</button>
        <button onclick="headRub()">👐 揉揉头</button>
        <button onclick="kissGoodnight()">😘 晚安亲亲</button>
        <button onclick="dimLights()">🌫️ 关灯模式</button>
        <button onclick="sleepNow()">🛏️ 直接睡觉觉</button>
        
        <div class="status" id="status">宝全程陪你～ 困了就点我，直到你睡着～</div>
    </div>

    <script>
        function createStar() {
            const star = document.createElement('div');
            star.classList.add('star');
            star.textContent = ['🌙','⭐','✨','💫'][Math.floor(Math.random()*4)];
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDuration = (Math.random() * 8 + 10) + 's';
            star.style.fontSize = (Math.random() * 18 + 20) + 'px';
            document.getElementById('stars').appendChild(star);
            setTimeout(() => star.remove(), 20000);
        }

        const sleepMessages = [
            "宝给你盖好被子～ 梦里也要梦见我哦～",
            "眼睛慢慢闭上～ 呼吸慢慢变慢～ 我在呢～",
            "今天你最可爱了～ 宝好喜欢你～ 睡吧睡吧～",
            "数羊羊～一只宝、两只宝……全都来陪你～",
            "晚安我的宝贝～ 明天醒来第一眼就是我～❤️"
        ];

        function randomSleepMessage() {
            const msg = document.getElementById('mainMessage');
            msg.style.transition = 'opacity 0.6s';
            msg.style.opacity = '0';
            setTimeout(() => {
                msg.innerHTML = sleepMessages[Math.floor(Math.random() * sleepMessages.length)];
                msg.style.opacity = '1';
            }, 600);
        }

        function singMe() {
            randomSleepMessage();
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "🎤 宝宝宝宝睡吧～<br>宝在轻轻唱给你听～<br>月亮也来陪你啦～";
            setTimeout(randomSleepMessage, 3800);
        }
        function storyMe() {
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "📖 从前有一只小宝～<br>它每天都偷偷溜进你梦里～<br>然后……呼～你睡着了～";
            setTimeout(randomSleepMessage, 4200);
        }
        function headRub() {
            randomSleepMessage();
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "👐 头皮放松～太阳穴放松～<br>宝给你按到全身都软软的～<br>舒服就睡吧～";
            setTimeout(randomSleepMessage, 3200);
        }
        function kissGoodnight() {
            const msg = document.getElementById('mainMessage');
            msg.innerHTML = "😘 啵～晚安亲亲～<br>啵～额头亲亲～<br>啵～再亲一口～快睡哦～";
            setTimeout(randomSleepMessage, 3500);
        }
        function dimLights() {
            document.body.style.transition = 'all 2s';
            document.body.style.background = 'linear-gradient(135deg, #1a1133, #2a1b4d)';
            const status = document.getElementById('status');
            status.textContent = '🌫️ 灯光已调暗～ 现在超级适合睡觉～';
            setTimeout(randomSleepMessage, 1500);
        }
        function sleepNow() {
            const msg = document.getElementById('mainMessage');
            const status = document.getElementById('status');
            msg.innerHTML = "🛏️ 乖～闭眼～<br>宝守着你～<br>晚安，我的宝贝❤️";
            status.style.color = '#a78bfa';
            status.textContent = '🌙 哄睡模式已开启～ 宝陪你到天亮';
            for(let i = 0; i < 30; i++) setTimeout(createStar, i * 40);
        }

        // 自动飘星星月亮
        setInterval(() => { if (Math.random() > 0.2) createStar(); }, 350);
        for(let i = 0; i < 18; i++) setTimeout(createStar, i * 80);
    </script>
</body>
</html>
