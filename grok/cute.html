<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级美萌小页面</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;display=swap');
        
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe4f0 0%, #e0f7fa 100%);
            font-family: 'Comic Neue', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(255,255,255,0.95);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            max-width: 320px;
            position: relative;
        }
        
        .heart {
            font-size: 80px;
            animation: float 2s infinite ease-in-out;
            display: block;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #ff69b4;
            font-size: 32px;
            margin: 10px 0 20px;
            text-shadow: 2px 2px 4px rgba(255,105,180,0.3);
        }
        
        .message {
            color: #ff85c1;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .sparkle {
            position: absolute;
            font-size: 24px;
            animation: sparkle 1.5s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 飘动的爱心 -->
        <div class="heart">💖</div>
        
        <h1>宝～你好呀！</h1>
        
        <div class="message">
            这是专门给你做的<br>
            超级美萌小页面<br>
            粉粉的、软软的<br>
            就像抱着一只小猫咪～
        </div>
        
        <!-- 装饰星星 -->
        <div class="sparkle" style="top: 30px; left: 30px;">✨</div>
        <div class="sparkle" style="top: 80px; right: 40px; animation-delay: 0.7s;">🌸</div>
        <div class="sparkle" style="bottom: 50px; left: 50px; animation-delay: 1.2s;">💕</div>
        
        <div style="margin-top: 20px; font-size: 18px; color: #ff85c1;">
            爱你哦～💗
        </div>
    </div>
    
    <script>
        // 简单点击爱心会有小动画
        document.querySelector('.heart').addEventListener('click', function() {
            this.style.transform = 'scale(1.5)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 300);
        });
    </script>
</body>
</html>
