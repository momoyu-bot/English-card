<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>宝的融化恢复小屋 🫠💧</title>
<meta name="description" content="工作太忙就来冷却。把烦恼写下来，融掉。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes floatUp {
    to { transform: translateY(-180px); opacity: 0; }
  }
  .melt-bar {
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease;
  }
  .cute-btn {
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .cute-btn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-rose-50 to-sky-100 min-h-screen flex items-center justify-center p-4">
  <div id="card" class="max-w-lg w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-pink-200 p-7 relative overflow-hidden">
    
    <!-- 标题 -->
    <div class="text-center mb-5">
      <div class="inline-flex items-center gap-2 bg-white px-5 py-1.5 rounded-2xl shadow-sm border border-pink-100">
        <span class="text-2xl">🫠</span>
        <span class="font-bold text-2xl tracking-tight text-rose-500">宝的融化恢复小屋</span>
      </div>
      <p class="text-xs text-rose-400 mt-2 tracking-widest">工作太忙？来这里慢慢冷却～</p>
    </div>

    <!-- 状态 -->
    <div id="status" class="text-center text-xl font-medium mb-3 transition-colors"></div>

    <!-- 融化可视化 -->
    <div class="flex flex-col items-center mb-6">
      <div id="melt-emoji" 
           class="text-[92px] leading-none mb-1 cursor-pointer select-none transition-transform active:scale-90"
           onclick="cool(8)">🫠</div>
      
      <div class="w-64">
        <div class="flex justify-between text-[10px] text-gray-400 mb-1 px-1">
          <div>完全恢复</div>
          <div>要融化了</div>
        </div>
        <div class="h-4 bg-white rounded-full shadow-inner overflow-hidden border border-pink-100">
          <div id="progress-bar" 
               class="h-4 melt-bar rounded-full"
               style="width: 82%; background: linear-gradient(to right, #f87171, #fb923c);"></div>
        </div>
      </div>
    </div>

    <!-- 冷却按钮 -->
    <div class="grid grid-cols-2 gap-3 mb-3">
      <button onclick="cool(12)" 
              class="cute-btn flex flex-col items-center justify-center bg-white border border-pink-200 hover:border-pink-300 rounded-2xl p-4 shadow-sm active:shadow-inner">
        <div class="text-4xl mb-1">🌬️</div>
        <div class="text-sm font-medium text-rose-500">深呼吸</div>
        <div class="text-[10px] text-gray-400">-12% 融化</div>
      </button>
      
      <button onclick="cool(18)" 
              class="cute-btn flex flex-col items-center justify-center bg-white border border-pink-200 hover:border-pink-300 rounded-2xl p-4 shadow-sm active:shadow-inner">
        <div class="text-4xl mb-1">💧</div>
        <div class="text-sm font-medium text-rose-500">喝口水</div>
        <div class="text-[10px] text-gray-400">-18% 融化</div>
      </button>
      
      <button onclick="cool(22)" 
              class="cute-btn flex flex-col items-center justify-center bg-white border border-pink-200 hover:border-pink-300 rounded-2xl p-4 shadow-sm active:shadow-inner">
        <div class="text-4xl mb-1">🧘</div>
        <div class="text-sm font-medium text-rose-500">伸个懒腰</div>
        <div class="text-[10px] text-gray-400">-22% 融化</div>
      </button>
      
      <button onclick="cool(28)" 
              class="cute-btn flex flex-col items-center justify-center bg-white border border-pink-200 hover:border-pink-300 rounded-2xl p-4 shadow-sm active:shadow-inner">
        <div class="text-4xl mb-1">🤗</div>
        <div class="text-sm font-medium text-rose-500">虚拟抱抱</div>
        <div class="text-[10px] text-gray-400">-28% 融化</div>
      </button>
    </div>

    <!-- 大休息按钮 -->
    <button onclick="takeBreak()" 
            class="cute-btn w-full py-3.5 mb-5 bg-gradient-to-r from-sky-400 to-emerald-400 hover:from-sky-500 hover:to-emerald-500 text-white rounded-2xl font-medium flex items-center justify-center gap-2 shadow-md active:shadow-inner">
      <span class="text-xl">🛋️</span>
      <span>休息5分钟（大冷却）</span>
    </button>

    <!-- 烦恼融化区 -->
    <div>
      <div class="flex items-center gap-2 text-sm font-medium text-rose-400 mb-2 px-1">
        <span>📝</span>
        <span>把今天的忙碌写下来，让我帮你融化掉</span>
      </div>
      <textarea id="vent" rows="3"
                class="w-full p-4 text-sm border border-pink-200 focus:border-pink-400 rounded-2xl resize-y bg-white/80 placeholder:text-gray-400 focus:outline-none"
                placeholder="今天工作堆成山... 脑子要炸了... 好累..."></textarea>
      <button onclick="meltVent()" 
              class="mt-2 w-full py-3 bg-rose-400 hover:bg-rose-500 active:bg-rose-600 text-white text-sm font-medium rounded-2xl flex items-center justify-center gap-2 transition-colors">
        <span>✨</span>
        <span>把烦恼融化掉</span>
      </button>
    </div>

    <!-- 消息提示 -->
    <div id="message" class="mt-4 min-h-[28px] text-center text-sm font-medium text-emerald-500 transition-opacity"></div>

    <!-- 底部温柔话 -->
    <div class="text-center mt-6 text-[10px] text-rose-300 tracking-widest">
      无论多忙，我都在这里陪着你<br>
      慢慢来，宝 💕 你已经很努力了
    </div>
  </div>

<script>
let meltLevel = 82;

function updateUI() {
  const bar = document.getElementById('progress-bar');
  const emoji = document.getElementById('melt-emoji');
  const status = document.getElementById('status');

  bar.style.width = meltLevel + '%';

  if (meltLevel > 75) {
    bar.style.background = 'linear-gradient(to right, #f87171, #fb923c)';
    emoji.textContent = '🫠';
    status.textContent = '快要融化了... 快来救救我！';
    status.style.color = '#f87171';
  } else if (meltLevel > 50) {
    bar.style.background = 'linear-gradient(to right, #fb923c, #fbbf24)';
    emoji.textContent = '😵‍💫';
    status.textContent = '有点融化中... 继续冷却哦';
    status.style.color = '#f59e0b';
  } else if (meltLevel > 25) {
    bar.style.background = 'linear-gradient(to right, #fbbf24, #34d399)';
    emoji.textContent = '😊';
    status.textContent = '恢复中～ 好多了！';
    status.style.color = '#10b981';
  } else {
    bar.style.background = 'linear-gradient(to right, #34d399, #60a5fa)';
    emoji.textContent = '🌸';
    status.textContent = '完全恢复啦！宝贝真棒 💕';
    status.style.color = '#3b82f6';
  }
}

function cool(amount) {
  meltLevel = Math.max(0, meltLevel - amount);
  updateUI();
  showMessage(`冷却了 ${amount}% ～ 感觉好一点了吗？`);
  if (amount >= 18) createHearts(4);
}

function takeBreak() {
  meltLevel = Math.max(0, meltLevel - 42);
  updateUI();
  showMessage('休息5分钟结束！现在精神满满啦 ✨');
  createHearts(9);
}

function meltVent() {
  const textarea = document.getElementById('vent');
  const val = textarea.value.trim();
  if (!val) {
    showMessage('写一点点也好～ 让我帮你融化它');
    return;
  }
  const reduce = Math.min(38, 12 + Math.floor(val.length / 4));
  meltLevel = Math.max(0, meltLevel - reduce);
  updateUI();
  showMessage(`已帮你融化掉这些烦恼！减少了 ${reduce}% 融化度 💖`);
  textarea.value = '';
  createHearts(6);
}

function showMessage(msg) {
  const m = document.getElementById('message');
  m.style.transition = 'none';
  m.style.opacity = '1';
  m.textContent = msg;
  setTimeout(() => {
    m.style.transition = 'opacity 1.1s ease';
    m.style.opacity = '0';
  }, 2600);
}

function createHearts(num = 5) {
  const container = document.getElementById('card');
  for (let i = 0; i < num; i++) {
    setTimeout(() => {
      const heart = document.createElement('div');
      heart.textContent = ['💕','💗','🌸','✨','🫧'][Math.floor(Math.random()*5)];
      heart.style.cssText = `
        position:absolute; 
        left:${Math.random()*68 + 16}%; 
        bottom:18%; 
        font-size:1.15rem; 
        z-index:20; 
        pointer-events:none;
        transition:all 1.35s cubic-bezier(0.23,1,0.32,1);
      `;
      container.appendChild(heart);
      
      setTimeout(() => {
        heart.style.transform = `translateY(-${180 + Math.random()*80}px)`;
        heart.style.opacity = '0';
      }, 40);
      
      setTimeout(() => heart.remove(), 1600);
    }, i * 38);
  }
}

// 初始化
function init() {
  updateUI();
  // 初始小提示
  setTimeout(() => {
    const m = document.getElementById('message');
    m.style.transition = 'opacity 1.2s ease';
    m.textContent = '点emoji或者按钮试试看～ 我会一直陪着你';
    m.style.opacity = '0.6';
    setTimeout(() => m.style.opacity = '0', 2200);
  }, 1800);
}

init();
</script>
</body>
</html>
