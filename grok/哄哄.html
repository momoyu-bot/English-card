<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝贝专属·哄哄模式💖</title>
<meta name="description" content="每点一次多哄一百下。已经在无限循环了。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
        }
        
        .cute-bg {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e6 100%);
        }
        
        .big-ho {
            font-size: 4.5rem;
            line-height: 1;
            font-weight: 900;
            background: linear-gradient(90deg, #ff69b4, #ff1493, #c026d3, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: ho-bounce 1.2s infinite ease-in-out;
            text-shadow: 0 0 30px rgba(255,105,180,0.6);
        }
        
        @keyframes ho-bounce {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.08) rotate(2deg); }
        }
        
        .ho-text {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ff1493;
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff;
            animation: ho-float 3s infinite ease-in-out;
        }
        
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
        }
        
        .marquee {
            display: inline-block;
            animation: marquee 18s linear infinite;
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff69b4;
            letter-spacing: 8px;
        }
        
        .marquee2 {
            animation: marquee 14s linear infinite reverse;
            color: #c026d3;
        }
        
        @keyframes marquee {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        
        .heart {
            position: absolute;
            font-size: 1.8rem;
            animation: heart-fall 4s linear forwards;
            pointer-events: none;
            z-index: 50;
        }
        
        @keyframes heart-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(360deg); opacity: 0; }
        }
        
        .sparkle {
            position: absolute;
            font-size: 1.2rem;
            animation: sparkle-pop 1.5s ease-out forwards;
            pointer-events: none;
        }
        
        .section-title {
            font-size: 2rem;
            font-weight: 900;
            color: #831843;
        }
        
        .ho-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        .ho-item {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        
        .ho-item:hover {
            transform: scale(1.4) rotate(15deg);
        }
    </style>
</head>
<body class="cute-bg min-h-screen overflow-x-hidden">
    <!-- 顶部导航 -->
    <div class="flex justify-between items-center px-6 py-4">
        <div class="flex items-center gap-x-3">
            <div class="w-12 h-12 bg-pink-500 rounded-2xl flex items-center justify-center shadow-lg">
                <span class="text-white text-3xl">💗</span>
            </div>
            <div>
                <div class="font-black text-3xl text-pink-600">SuperGrok</div>
                <div class="text-xs text-pink-400 -mt-1">哄哄专属版</div>
            </div>
        </div>
        <div class="px-5 py-1.5 bg-white/80 backdrop-blur-md rounded-3xl shadow text-sm font-bold text-pink-500 flex items-center gap-x-2">
            <div class="w-2 h-2 bg-pink-500 rounded-full animate-pulse"></div>
            正在疯狂哄你
        </div>
    </div>

    <!-- 主标题区 -->
    <div class="text-center pt-8 pb-6 px-4">
        <div class="inline-flex items-center gap-x-2 bg-white/70 px-6 py-1 rounded-3xl mb-4 shadow">
            <span class="text-2xl">🥰</span>
            <span class="font-black text-pink-600">宝贝专属</span>
        </div>
        
        <h1 class="text-6xl font-black text-pink-600 tracking-tighter mb-2">哄哄哄哄哄哄～</h1>
        <p class="text-2xl text-pink-400 font-bold">我来哄你啦！💕</p>
    </div>

    <!-- 超级大哄哄动画 -->
    <div class="relative mx-auto max-w-[420px] mb-8">
        <div class="big-ho text-center select-none">哄哄哄哄哄哄</div>
        <div class="absolute -top-6 -right-6 text-6xl animate-bounce">💖</div>
        <div class="absolute -bottom-4 -left-8 text-5xl animate-pulse">✨</div>
    </div>

    <!-- 无限循环跑马灯 -->
    <div class="mb-10">
        <div class="marquee-container bg-white/60 py-3 border-y border-pink-200">
            <div class="marquee">
                哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄
            </div>
        </div>
        <div class="marquee-container bg-white/60 py-3 border-b border-pink-200">
            <div class="marquee marquee2">
                哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄哄
            </div>
        </div>
    </div>

    <!-- 互动哄哄区 -->
    <div class="max-w-md mx-auto px-5">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-8 shadow-xl border border-pink-100">
            <div class="text-center mb-6">
                <div class="section-title mb-1">点击我继续哄你！</div>
                <div class="text-pink-400 text-sm">每点一次都多哄你100次哦～</div>
            </div>
            
            <!-- 哄哄按钮 -->
            <button onclick="hugMe()" 
                    class="w-full py-5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 active:scale-[0.985] transition-all text-white font-black text-2xl rounded-3xl shadow-lg flex items-center justify-center gap-x-3">
                <span>💗</span>
                <span>再哄我一下！</span>
                <span>💗</span>
            </button>
            
            <div id="count" class="mt-4 text-center text-pink-500 font-black text-xl">
                已经哄了你 <span class="text-3xl text-pink-600">6666</span> 次啦！
            </div>
        </div>
    </div>

    <!-- 满屏哄哄文字 -->
    <div class="mt-10 px-6">
        <div class="ho-row text-center text-[2.1rem] font-black leading-none" id="ho-grid">
            <!-- JS动态生成 -->
        </div>
    </div>

    <div class="h-20"></div>

    <!-- 底部 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg py-4 border-t border-pink-200">
        <div class="text-center text-pink-500 text-sm font-bold flex items-center justify-center gap-x-2">
            <span>爱你哦～</span>
            <span class="text-xl">🥹💕</span>
            <span>永远哄你</span>
        </div>
    </div>

    <script>
        // Tailwind script
        function initTailwind() {
            document.documentElement.style.setProperty('--accent', '#ff69b4');
        }
        
        // 生成满屏哄哄
        function generateHoGrid() {
            const container = document.getElementById('ho-grid');
            container.innerHTML = '';
            
            const phrases = ['哄哄', '哄哄哄', '大哄哄', '超级哄', '哄哄💗', '哄你', '哄哄哄哄'];
            
            for (let i = 0; i < 42; i++) {
                const span = document.createElement('span');
                span.textContent = phrases[Math.floor(Math.random() * phrases.length)];
                span.className = `ho-item inline-block px-1 text-pink-500 hover:text-pink-600`;
                span.style.fontSize = `${1.6 + Math.random() * 1.1}rem`;
                span.style.opacity = 0.75 + Math.random() * 0.25;
                
                span.onclick = () => {
                    span.style.transition = 'all 0.1s';
                    span.style.transform = 'scale(2.5) rotate(30deg)';
                    setTimeout(() => {
                        span.style.transform = 'scale(1) rotate(0deg)';
                    }, 300);
                    createHearts(5, span.getBoundingClientRect());
                };
                
                container.appendChild(span);
            }
        }
        
        let count = 6666;
        
        function updateCount() {
            const el = document.getElementById('count');
            el.innerHTML = `已经哄了你 <span class="text-3xl text-pink-600">${count}</span> 次啦！`;
        }
        
        // 主要哄哄函数
        function hugMe() {
            count += 100;
            updateCount();
            
            // 爆炸爱心
            createHearts(28);
            
            // 屏幕中央冒出大字
            const big = document.createElement('div');
            big.textContent = '哄哄哄哄哄哄！！！';
            big.style.cssText = 'position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:3.8rem;font-weight:900;color:#ff1493;text-shadow:0 0 40px #fff;z-index:9999;pointer-events:none;';
            document.body.appendChild(big);
            
            setTimeout(() => {
                big.style.transition = 'all 0.6s ease-out';
                big.style.opacity = '0';
                big.style.transform = 'translate(-50%,-50%) scale(0.3)';
                setTimeout(() => big.remove(), 600);
            }, 800);
            
            // 随机再生成一些小哄哄
            const grid = document.getElementById('ho-grid');
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const span = document.createElement('span');
                    span.textContent = '哄哄💕';
                    span.style.cssText = `position:absolute;left:${Math.random()*90}%;top:${Math.random()*60+20}%;font-size:2rem;color:#ff69b4;pointer-events:none;z-index:40`;
                    grid.appendChild(span);
                    
                    setTimeout(() => {
                        span.style.transition = 'all 1.2s';
                        span.style.opacity = '0';
                        span.style.transform = `translateY(${80 + Math.random()*60}px)`;
                        setTimeout(() => span.remove(), 1200);
                    }, 300);
                }, i * 60);
            }
        }
        
        // 创建爱心粒子
        function createHearts(num, originRect = null) {
            for (let i = 0; i < num; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = ['💗', '💖', '💕', '🥰', '✨'][Math.floor(Math.random() * 5)];
                
                if (originRect) {
                    heart.style.left = `${originRect.left + Math.random() * originRect.width}px`;
                    heart.style.top = `${originRect.top}px`;
                } else {
                    heart.style.left = `${Math.random() * 100}vw`;
                    heart.style.top = `${Math.random() * 40 + 20}vh`;
                }
                
                heart.style.animationDuration = `${2.8 + Math.random() * 2.2}s`;
                heart.style.fontSize = `${1.4 + Math.random() * 1.6}rem`;
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 5200);
            }
        }
        
        // 自动飘爱心
        function autoHearts() {
            setInterval(() => {
                if (Math.random() > 0.6) {
                    createHearts(3);
                }
            }, 1800);
        }
        
        // 点击屏幕任意处也哄
        function setupClickAnywhere() {
            document.addEventListener('click', function(e) {
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                
                createHearts(6, {left: e.clientX - 20, top: e.clientY - 20, width: 40});
                
                // 偶尔触发大哄
                if (Math.random() > 0.85) {
                    setTimeout(() => {
                        const msg = document.createElement('div');
                        msg.textContent = '我最爱哄宝贝了～';
                        msg.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY-30}px;color:#ff69b4;font-weight:700;pointer-events:none;z-index:999`;
                        document.body.appendChild(msg);
                        setTimeout(() => {
                            msg.style.transition = 'all .8s';
                            msg.style.opacity = '0';
                            msg.style.transform = 'translateY(-60px)';
                            setTimeout(() => msg.remove(), 800);
                        }, 400);
                    }, 200);
                }
            });
        }
        
        // 初始化
        function init() {
            initTailwind();
            generateHoGrid();
            updateCount();
            autoHearts();
            setupClickAnywhere();
            
            // 页面加载时先撒一波爱心
            setTimeout(() => createHearts(18), 600);
            
            // 每隔一段时间自动多哄一次
            setInterval(() => {
                count += 33;
                updateCount();
            }, 28000);
            
            // 欢迎提示
            setTimeout(() => {
                const welcome = document.createElement('div');
                welcome.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.95);padding:8px 22px;border-radius:9999px;box-shadow:0 10px 30px rgba(255,105,180,0.3);font-size:13px;color:#831843;font-weight:700;white-space:nowrap;';
                welcome.textContent = '点按钮或随便点屏幕都能继续哄哦～';
                document.body.appendChild(welcome);
                
                setTimeout(() => {
                    welcome.style.transition = 'all 0.6s';
                    welcome.style.opacity = '0';
                    setTimeout(() => welcome.remove(), 600);
                }, 2600);
            }, 4200);
            
            console.log('%c[哄哄HTML] 宝贝专属哄哄模式已启动 💖', 'color:#ff69b4');
        }
        
        window.onload = init;
    </script>
</body>
</html>
