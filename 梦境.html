<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦境</title>
<meta name="description" content="网眼是留给要漏掉的梦的，这里只收会再回去的那些。">
<meta name="theme-color" content="#0b0f1f">
<style>
:root{
  --night:#0b0f1f;
  --night-2:#141327;
  --night-3:#1c1933;
  --thread:#cbb894;
  --thread-dim:rgba(203,184,148,.34);
  --glow:#efe8da;
  --dim:#8a84a2;
  --dimmer:#5d5878;
  --cap:52px;

  --claude:#e09a6f;
  --gemini:#82aae6;
  --grok:#c6c2d2;
  --unsigned:#ab8ad6;
  --copilot:#6cc5ae;
  --other:#7a7590;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--night);
  color:var(--glow);
  font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:16px;
  line-height:1.85;
}

/* 盖住系统状态栏：内容物理上到不了那里 */
.cap{
  position:fixed;top:0;left:0;right:0;height:var(--cap);
  background:var(--night);z-index:20;
}

.scroll{
  position:fixed;top:var(--cap);left:0;right:0;bottom:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--night-3) 0%, var(--night-2) 42%, var(--night) 100%);
}
.wrap{max-width:560px;margin:0 auto;padding:0 22px 96px;}

/* ── 开场 ───────────────────────────── */
.head{padding:30px 0 6px;}
.head h1{
  margin:0;
  font-size:30px;font-weight:600;
  letter-spacing:.22em;
  text-indent:.22em;
  color:var(--glow);
}
.head p{
  margin:12px 0 0;
  font-size:13.5px;line-height:1.9;
  color:var(--dim);
  letter-spacing:.02em;
}

/* ── 捕梦网 ─────────────────────────── */
.netbox{margin:6px 0 4px;}
#net{display:block;width:100%;max-width:400px;margin:0 auto;height:auto;overflow:visible;}
#net .mesh{fill:none;stroke:var(--thread-dim);stroke-width:.7;}
#net .hoop{fill:none;stroke:var(--thread);stroke-width:1.5;opacity:.75;}
#net .bead{cursor:pointer;}
#net .bead circle{fill:var(--glow);opacity:.72;transition:opacity .25s;}
#net .bead:hover circle,#net .bead.lit circle{opacity:1;}
#net .bead:focus{outline:none;}
#net .bead:focus-visible .halo{opacity:.3;}
#net .bead:focus-visible circle{opacity:1;}
#net .halo{fill:var(--glow);opacity:0;transition:opacity .3s;}
#net .bead circle:not(.halo){filter:drop-shadow(0 0 3px rgba(239,232,218,.5));}
#net .bead:hover .halo,#net .bead.lit .halo{opacity:.14;}
#net .bead circle.core{fill:none;stroke:var(--thread);stroke-width:1;cursor:pointer;filter:none;}
#net .coredot{fill:var(--thread);cursor:pointer;}
#net .quill{stroke:var(--thread);fill:none;}

.readout{
  min-height:22px;margin:2px 0 26px;
  text-align:center;font-size:13px;color:var(--dim);
  letter-spacing:.04em;transition:color .2s;
}
.readout b{font-weight:500;color:var(--thread);}

/* ── 段 ─────────────────────────────── */
.band{margin:0 0 6px;padding-top:34px;}
.band h2{
  margin:0;font-size:15px;font-weight:600;
  letter-spacing:.22em;text-indent:.22em;
  color:var(--thread);
}
.band .def{
  margin:7px 0 0;font-size:12.5px;line-height:1.8;color:var(--dimmer);
}
.rule{height:1px;background:linear-gradient(90deg,var(--thread-dim),transparent);margin:14px 0 4px;}

/* ── 一场梦 ─────────────────────────── */
.dream{padding:20px 0 4px;scroll-margin-top:16px;}
.dream h3{
  margin:0 0 10px;font-size:17px;font-weight:500;
  letter-spacing:.01em;color:var(--glow);
  transition:color .4s,text-shadow .4s;
}
.dream.flash h3{color:#fff;text-shadow:0 0 18px rgba(239,232,218,.55);}
.pages{list-style:none;margin:0;padding:0 0 0 2px;border-left:1px solid var(--thread-dim);}
.pages li{position:relative;padding:0 0 0 18px;}
.pages a{
  display:inline-block;padding:3.5px 0;
  color:var(--dim);text-decoration:none;
  font-size:14.5px;line-height:1.7;
  border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.pages a:hover,.pages a:focus-visible{color:var(--glow);border-bottom-color:var(--thread-dim);outline:none;}
.pages .dot{
  position:absolute;left:-3.5px;top:14px;
  width:6px;height:6px;border-radius:50%;
  background:var(--other);
}
.pages .side{font-size:11.5px;color:#4f4a67;margin-left:8px;letter-spacing:.02em;}

/* ── 收尾 ───────────────────────────── */
.tail{margin-top:56px;padding-top:22px;border-top:1px solid var(--thread-dim);}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 20px;font-size:12px;color:var(--dimmer);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.tail p{margin:0 0 6px;font-size:12.5px;color:var(--dimmer);line-height:1.9;}
.tail .said{color:var(--dim);}
.src{font-size:11.5px;color:#413d56;margin-top:14px;}

@media (max-width:400px){
  .wrap{padding:0 18px 80px;}
  .head h1{font-size:26px;}
}
@media (prefers-reduced-motion:reduce){
  #net .mesh,#net .hoop{stroke-dasharray:none !important;stroke-dashoffset:0 !important;animation:none !important;}
  #net .bead{opacity:1 !important;animation:none !important;}
  .dream.flash h3{text-shadow:none;}
}
</style>
</head>

# 梦境

这不是哄睡，也不是新货架。
只手写你认过的关系。不要自动推断。

线：同小机，有先后，不一定是同一件事。
簇：不同小机，围在同一系列事件身边，不一定有先后。
系列：同一系列，跨不跨小机都行，不一定是同一事件。

写法：`小机 / 抽屉 / 店门名`（首页上看到的那一行）。不要自己去翻英文文件名。
一条只写一组关系。不确定的先扔「还没想清」。
序号不代表顺序，只是宝的梦游足迹。

第一场：2026-09-16。

<script>
(function(){
"use strict";

var BOTS={claude:'--claude',gemini:'--gemini',grok:'--grok',unsigned:'--unsigned',copilot:'--copilot',gpt:'--unsigned'};
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ── 解析 ───────────────────────────── */
function clean(s){
  return String(s).replace(/<br\s*\/?>/gi,'').replace(/\*\*/g,'').replace(/^[-*+]\s+/,'').trim();
}
function isGroupHead(t){ return /^\d+\s*[、.．,]/.test(t); }
function stripNo(t){ return t.replace(/^\d+\s*[、.．,]\s*/,'').trim(); }

function parse(md){
  var lines=String(md).split(/\r?\n/);
  var bands=[],defs={},band=null,group=null,inFront=true;
  var RE=/\[([^\]]*)\]\(([^)\s]+)\)/g;

  for(var n=0;n<lines.length;n++){
    var raw=lines[n], line=raw.trim();
    if(!line) continue;

    var h=line.match(/^##\s+(.+)$/);
    if(h){ inFront=false; band={name:clean(h[1]),def:'',groups:[]}; bands.push(band); group=null; continue; }
    if(/^#\s/.test(line)) continue;
    if(/^-{3,}$/.test(line)) continue;

    if(inFront){
      var d=line.match(/^(线|簇|系列)[：:]\s*(.+)$/);
      if(d) defs[d[1]]=clean(d[2]);
      continue;
    }

    RE.lastIndex=0;
    var links=[],m;
    while((m=RE.exec(line))!==null){ links.push({label:m[1],url:m[2],a:m.index,b:RE.lastIndex}); }

    if(!links.length){
      var t=clean(line);
      if(isGroupHead(t)){ group={name:stripNo(t),items:[]}; if(band) band.groups.push(group); }
      else if(band && !band.groups.length && !band.def){ band.def=t; }
      continue;
    }

    var head=clean(line.slice(0,links[0].a));
    if(isGroupHead(head)){ group={name:stripNo(head),items:[]}; if(band) band.groups.push(group); }
    if(!group){ group={name:head||'未命名',items:[]}; if(band) band.groups.push(group); }

    for(var i=0;i<links.length;i++){
      var end=(i+1<links.length)?links[i+1].a:line.length;
      group.items.push({
        label:clean(links[i].label),
        url:links[i].url,
        side:clean(line.slice(links[i].b,end))
      });
    }
  }
  bands=bands.filter(function(b){return b.groups.length;});
  return {bands:bands,defs:defs};
}

function botOf(url){
  try{
    var p=decodeURIComponent(url).split('?')[0].split('#')[0].split('/').filter(Boolean);
    var i=-1;
    for(var k=0;k<p.length;k++){ if(p[k]==='English-card'){ i=k; break; } }
    if(i<0||!p[i+1]) return '';
    return p[i+1].toLowerCase();
  }catch(e){ return ''; }
}
function drawerOf(url){
  try{
    var p=decodeURIComponent(url).split('?')[0].split('#')[0].split('/').filter(Boolean);
    var i=-1;
    for(var k=0;k<p.length;k++){ if(p[k]==='English-card'){ i=k; break; } }
    var seg=p[i+2]||'';
    if(!seg||/\.(html?|svg)$/i.test(seg)) return '';
    return seg;
  }catch(e){ return ''; }
}
function botColor(b){ return BOTS[b]?'var('+BOTS[b]+')':'var(--other)'; }

/* ── 捕梦网 ─────────────────────────── */
var SVGNS='http://www.w3.org/2000/svg';
function el(t,a){ var e=document.createElementNS(SVGNS,t); for(var k in a){ e.setAttribute(k,a[k]); } return e; }

function drawWeb(svg,flat,bandSizes,onPick,onHint){
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  var CX=200, CY=200, N=26, RINGS=[];
  // 每条带占几圈（每圈最多 N 个）
  var plan=bandSizes.map(function(c){ return Math.max(1,Math.ceil(c/N)); });
  var nodeRings=plan.reduce(function(a,b){return a+b;},0);
  var total=nodeRings+1;                       // 中心留个洞，不织到底
  var RMAX=168, RMIN=52, step=(RMAX-RMIN)/(total-1);

  for(var k=0;k<total;k++) RINGS.push(RMAX-step*k);

  function pt(r,i,k){
    var th=(i + k*0.5)*(Math.PI*2/N) - Math.PI/2;
    return [CX+r*Math.cos(th), CY+r*Math.sin(th)];
  }

  var mesh=el('path',{'class':'mesh'});
  var d='';
  for(var k2=0;k2<RINGS.length;k2++){
    // 同一圈上的弦：这一圈的线本身
    for(var i3=0;i3<N;i3++){
      var P=pt(RINGS[k2],i3,k2), Q=pt(RINGS[k2],i3+1,k2);
      d+='M'+P[0].toFixed(1)+' '+P[1].toFixed(1)+'L'+Q[0].toFixed(1)+' '+Q[1].toFixed(1);
    }
    if(k2===RINGS.length-1) break;
    // 下一圈挂在这一圈的弦上
    for(var i2=0;i2<N;i2++){
      var A=pt(RINGS[k2],i2,k2);
      var B=pt(RINGS[k2+1],i2,k2+1);
      var C=pt(RINGS[k2+1],i2-1,k2+1);
      d+='M'+A[0].toFixed(1)+' '+A[1].toFixed(1)+'L'+B[0].toFixed(1)+' '+B[1].toFixed(1);
      d+='M'+A[0].toFixed(1)+' '+A[1].toFixed(1)+'L'+C[0].toFixed(1)+' '+C[1].toFixed(1);
    }
  }
  mesh.setAttribute('d',d);
  svg.appendChild(el('circle',{'class':'hoop',cx:CX,cy:CY,r:RMAX+14}));
  svg.appendChild(mesh);

  // 羽毛
  var fg=el('g',{});
  [[-42,13,44],[0,18,62],[42,13,44]].forEach(function(f){
    var x=CX+f[0], y0=CY+RMAX+14, y1=y0+f[1], y2=y1+f[2];
    fg.appendChild(el('path',{'class':'quill','stroke-width':'.8',d:'M'+x+' '+y0+'L'+x+' '+y1}));
    fg.appendChild(el('path',{'class':'quill','stroke-width':'1',d:'M'+x+' '+y1+'L'+x+' '+y2}));
    var barbs='';
    for(var t=0;t<=1.001;t+=1/12){
      var yy=y1+(y2-y1)*t, w=9*Math.sin(Math.PI*Math.min(t*1.15,1))+1.5;
      barbs+='M'+x+' '+yy.toFixed(1)+'L'+(x-w).toFixed(1)+' '+(yy+7).toFixed(1);
      barbs+='M'+x+' '+yy.toFixed(1)+'L'+(x+w).toFixed(1)+' '+(yy+7).toFixed(1);
    }
    fg.appendChild(el('path',{'class':'quill','stroke-width':'.55',opacity:'.55',d:barbs}));
    fg.appendChild(el('circle',{cx:x,cy:y1,r:2,fill:'var(--thread)',opacity:'.8'}));
  });
  svg.appendChild(fg);

  // 珠子：按带分配到圈上，圈内均匀挑格
  var beads=[], idx=0, ring=0;
  bandSizes.forEach(function(count,bi){
    var need=plan[bi], per=Math.ceil(count/need), left=count;
    for(var r=0;r<need;r++){
      var here=Math.min(per,left); left-=here;
      for(var j=0;j<here;j++){
        var slot=Math.round(j*N/here)%N;
        var P=pt(RINGS[ring],slot,ring);
        beads.push({x:P[0],y:P[1],i:idx++});
      }
      ring++;
    }
  });

  var bg=el('g',{});
  beads.forEach(function(b){
    var node=flat[b.i];
    var size=1.5+Math.min(node.items.length,7)*0.45;
    var g=el('g',{'class':'bead',tabindex:'0',role:'button'});
    g.setAttribute('aria-label',node.name);
    g.appendChild(el('circle',{'class':'halo',cx:b.x,cy:b.y,r:size+8}));
    g.appendChild(el('circle',{cx:b.x,cy:b.y,r:size}));
    g.dataset.i=b.i;
    if(!REDUCED){ g.style.opacity='0'; }
    bg.appendChild(g);
  });
  svg.appendChild(bg);

  // 中心：随便带你走
  var core=el('g',{'class':'bead',tabindex:'0',role:'button'});
  core.setAttribute('aria-label','随便去一场');
  core.appendChild(el('circle',{'class':'core',cx:CX,cy:CY,r:9,opacity:'.7'}));
  core.appendChild(el('circle',{'class':'coredot',cx:CX,cy:CY,r:3.2}));
  core.dataset.i='rand';
  svg.appendChild(core);

  function act(e){
    var g=e.target.closest('.bead'); if(!g) return;
    var v=g.dataset.i;
    onPick(v==='rand'? Math.floor(Math.random()*flat.length) : parseInt(v,10));
  }
  svg.addEventListener('click',act);
  svg.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(e); }
  });
  svg.addEventListener('mouseover',function(e){
    var g=e.target.closest('.bead'); if(!g) return;
    onHint(g.dataset.i==='rand'? null : flat[parseInt(g.dataset.i,10)]);
  });
  svg.addEventListener('mouseout',function(e){
    if(e.target.closest('.bead')) onHint(undefined);
  });

  // 一次性的织网：从中心往外
  if(!REDUCED){
    var len=mesh.getTotalLength?mesh.getTotalLength():4000;
    mesh.style.strokeDasharray=len; mesh.style.strokeDashoffset=len;
    mesh.style.transition='stroke-dashoffset 1500ms ease-out';
    var hoop=svg.querySelector('.hoop');
    hoop.style.opacity='0'; hoop.style.transition='opacity 700ms ease-out';
    fg.style.opacity='0'; fg.style.transition='opacity 900ms ease-out 900ms';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        hoop.style.opacity='.75';
        mesh.style.strokeDashoffset='0';
        fg.style.opacity='1';
      });
    });
    var bs=bg.querySelectorAll('.bead');
    for(var q=0;q<bs.length;q++){
      (function(node,delay){
        node.style.transition='opacity 600ms ease-out';
        setTimeout(function(){ node.style.opacity='1'; },delay);
      })(bs[q], 1100+q*22);
    }
  }
  return beads.length;
}

/* ── 渲染 ───────────────────────────── */
function render(data,fromSnapshot){
  var bands=data.bands, defs=data.defs;
  var flat=[];
  bands.forEach(function(b,bi){
    b.groups.forEach(function(g){ flat.push({name:g.name,items:g.items,band:b.name,bi:bi}); });
  });

  var host=document.getElementById('bands');
  host.innerHTML='';
  var seen={};
  flat.forEach(function(n){ n.items.forEach(function(it){ seen[botOf(it.url)]=1; }); });

  var counter=0;
  bands.forEach(function(b){
    var sec=document.createElement('section');
    sec.className='band';
    var short=b.name.replace(/[（(].*$/,'').trim();
    var def=defs[short]||b.def||'';
    sec.innerHTML='<h2>'+esc(short)+'</h2>'+(def?'<p class="def">'+esc(def)+'</p>':'')+'<div class="rule"></div>';
    b.groups.forEach(function(g){
      var art=document.createElement('article');
      art.className='dream';
      art.id='d'+counter;
      counter++;
      var ul='<ul class="pages">';
      g.items.forEach(function(it){
        var bot=botOf(it.url), dr=drawerOf(it.url);
        var side=[dr,it.side].filter(Boolean).join(' ');
        ul+='<li><span class="dot" style="background:'+botColor(bot)+'"></span>'
          + '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.label)+'</a>'
          + (side?'<span class="side">'+esc(side)+'</span>':'')
          + '</li>';
      });
      ul+='</ul>';
      art.innerHTML='<h3>'+esc(g.name)+'</h3>'+ul;
      sec.appendChild(art);
    });
    host.appendChild(sec);
  });

  var pageCount=0;
  flat.forEach(function(n){ pageCount+=n.items.length; });
  document.getElementById('lede').textContent=
    cn(flat.length)+'场梦，'+pageCount+'页。都是一条一条认出来的，没有一条是猜的。';

  var lg=document.getElementById('legend');
  lg.innerHTML='';
  ['claude','gemini','grok','copilot','unsigned'].forEach(function(b){
    if(!seen[b]) return;
    var s=document.createElement('span');
    s.innerHTML='<i style="background:'+botColor(b)+'"></i>'+b;
    lg.appendChild(s);
  });

  document.getElementById('stamp').textContent='第一场，2026-09-16。';
  document.getElementById('src').textContent=fromSnapshot
    ? '这一份读的是页面里存的底稿。传进仓库、和 梦境.md 放一起之后，它会自己跟着那份走。'
    : '跟着仓库里的 梦境.md 走，改那份就行。';

  var readout=document.getElementById('readout');
  var idle='碰一颗珠子，去那场梦。中间那颗随便带你走。';
  var hold=false, holdT=null;
  drawWeb(
    document.getElementById('net'),
    flat,
    bands.map(function(b){return b.groups.length;}),
    function(i){
      var art=document.getElementById('d'+i);
      if(!art) return;
      art.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'});
      art.classList.remove('flash');
      void art.offsetWidth;
      art.classList.add('flash');
      setTimeout(function(){art.classList.remove('flash');},1600);
      readout.innerHTML='<b>'+esc(flat[i].name)+'</b>';
      hold=true; clearTimeout(holdT);
      holdT=setTimeout(function(){ hold=false; readout.textContent=idle; },2600);
    },
    function(n){
      if(n===undefined){ if(!hold) readout.textContent=idle; }
      else if(n===null){ readout.textContent='随便带你走一场。'; }
      else { readout.innerHTML='<b>'+esc(n.name)+'</b>'; }
    }
  );
}

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cn(n){
  var d='零一二三四五六七八九';
  if(n<10) return d[n];
  if(n<20) return '十'+(n%10?d[n%10]:'');
  if(n<100) return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');
  return String(n);
}

/* ── 起 ─────────────────────────────── */
var snapshot=document.getElementById('snapshot').textContent;

function boot(md,fromSnapshot){
  var data;
  try{ data=parse(md); }catch(e){ data={bands:[],defs:{}}; }
  if(!data.bands.length && !fromSnapshot){ boot(snapshot,true); return; }
  if(!data.bands.length){
    document.getElementById('lede').textContent='网是空的。梦境.md 里还没有认过的关系。';
    return;
  }
  render(data,fromSnapshot);
}

(location.protocol==='file:'
  ? Promise.reject()
  : fetch('梦境.md',{cache:'no-cache'}))
  .then(function(r){ if(!r.ok) throw 0; return r.text(); })
  .then(function(t){ if(!t||t.length<40) throw 0; boot(t,false); })
  .catch(function(){ boot(snapshot,true); });

})();
</script>
