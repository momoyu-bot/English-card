<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦境</title>
<meta name="description" content="网眼是留给要漏掉的梦的，这里只收会再回去的那些。">
<meta name="theme-color" content="#0b0f1f">
<style>
:root{
  --night:#0b0f1f;
  --night-2:#141327;
  --night-3:#1c1933;
  --thread:#cbb894;
  --thread-dim:rgba(203,184,148,.34);
  --thread-lit:#e8d6ab;
  --glow:#efe8da;
  --dim:#8a84a2;
  --dimmer:#5d5878;
  --cap:52px;

  --claude:#e09a6f;
  --gemini:#82aae6;
  --grok:#c6c2d2;
  --unsigned:#ab8ad6;
  --copilot:#6cc5ae;
  --other:#7a7590;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--night);
  color:var(--glow);
  font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:16px;
  line-height:1.85;
}

/* 盖住系统状态栏：内容物理上到不了那里 */
.cap{
  position:fixed;top:0;left:0;right:0;height:var(--cap);
  background:var(--night);z-index:20;
}

.scroll{
  position:fixed;top:var(--cap);left:0;right:0;bottom:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--night-3) 0%, var(--night-2) 42%, var(--night) 100%);
}
.wrap{max-width:560px;margin:0 auto;padding:0 22px 96px;}

/* ── 开场 ───────────────────────────── */
.head{padding:30px 0 6px;}
.head h1{
  margin:0;
  font-size:30px;font-weight:600;
  letter-spacing:.22em;
  text-indent:.22em;
  color:var(--glow);
}
.head p{
  margin:12px 0 0;
  font-size:13.5px;line-height:1.9;
  color:var(--dim);
  letter-spacing:.02em;
}

/* ── 捕梦网 ─────────────────────────── */
.netbox{margin:6px 0 4px;}
#net{display:block;width:100%;max-width:400px;margin:0 auto;height:auto;overflow:visible;}
#net .mesh{fill:none;stroke:var(--thread-dim);stroke-width:.7;transition:opacity .45s;}
#net .hoop{fill:none;stroke:var(--thread);stroke-width:1.5;opacity:.75;}
#net .bead{cursor:pointer;}
#net .bead circle{fill:var(--glow);opacity:.72;transition:opacity .25s;}
#net .bead:hover circle,#net .bead.lit circle{opacity:1;}
#net .bead:focus{outline:none;}
#net .bead:focus-visible .halo{opacity:.3;}
#net .bead:focus-visible circle{opacity:1;}
/* 光晕平时是灭的，只在碰到的那一颗上亮。选择器要比上面那条 .bead circle 重，不然会被它盖成常亮（第一版就是这么坏的） */
#net .bead circle.halo{fill:var(--glow);opacity:0;transition:opacity .3s;}
#net .bead circle:not(.halo){filter:drop-shadow(0 0 3px rgba(239,232,218,.5));}
#net .bead:hover .halo,#net .bead.lit .halo{opacity:.14;}
#net .bead circle.core{fill:none;stroke:var(--thread);stroke-width:1;cursor:pointer;filter:none;}
#net .bead circle.coredot{fill:var(--thread);cursor:pointer;}
#net .quill{stroke:var(--thread);fill:none;}

/* ── 星座 ─────────────────────────────
   亮起一场梦时：网和别的珠子退后，这一场的每一页变成一颗星。
   选择器都故意写得比上面的 .bead circle 重——光晕那次就是输在这里。 */
#net.lit-mode .mesh{opacity:.4;}
#net.lit-mode .bead:not(.lit):not(.core-g) circle:not(.halo){opacity:.2;}
#net.lit-mode .bead.echo:not(.lit):not(.core-g) circle:not(.halo){opacity:.7;}
#net.lit-mode .bead:not(.lit):not(.core-g):hover circle:not(.halo){opacity:.8;}

#net .cons{pointer-events:none;}
#net .cons line{fill:none;stroke-linecap:round;}
#net .cons line.ln{stroke:var(--thread-lit);stroke-width:.95;opacity:.92;}
#net .cons line.soft{stroke-dasharray:3 3.2;}
#net .cons line.tether{stroke:var(--thread);stroke-width:.7;stroke-dasharray:.1 2.6;opacity:.6;}
#net .cons line.share{stroke:var(--thread-lit);stroke-width:.7;stroke-dasharray:1.6 2.8;opacity:.62;}

#net .stars .star{cursor:pointer;outline:none;}
#net .stars circle.st-hit{fill:transparent;}
#net .stars circle.st-glow{fill:currentColor;opacity:.22;transition:opacity .25s;}
#net .stars circle.st-dot{fill:currentColor;filter:drop-shadow(0 0 2.5px currentColor);}
#net .stars circle.st-glint{fill:#fff;opacity:.85;}
#net .stars circle.st-ring{fill:none;stroke:var(--thread-lit);stroke-width:.6;opacity:.85;}
#net .stars .star:hover circle.st-glow,
#net .stars .star.on circle.st-glow,
#net .stars .star:focus-visible circle.st-glow{opacity:.55;}

.readout{
  min-height:80px;margin:4px 0 22px;
  text-align:center;font-size:13px;color:var(--dim);
  letter-spacing:.04em;
}
.readout b{font-weight:500;color:var(--thread);}
.readout .ro-idle{line-height:1.95;padding-top:2px;}
.readout .ro-t{font-size:16px;font-weight:500;line-height:1.55;color:var(--glow);letter-spacing:.03em;}
.readout .ro-s{
  margin-top:4px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:6px 10px;font-size:12px;color:var(--dim);
}
.readout .ro-dots{display:inline-flex;gap:4px;}
.readout .ro-dots i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.readout .ro-go{
  -webkit-appearance:none;appearance:none;margin:0;
  border:1px solid var(--thread-dim);background:transparent;color:var(--thread);
  font:inherit;font-size:12px;line-height:1.6;letter-spacing:.08em;
  padding:1px 11px;border-radius:999px;cursor:pointer;
}
.readout .ro-go:active{background:rgba(203,184,148,.12);}
.readout .ro-p{margin-top:6px;min-height:20px;font-size:12.5px;line-height:1.7;color:var(--dim);}
.readout .ro-p i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px;}
.readout .ro-p a{color:var(--glow);text-decoration:none;border-bottom:1px solid var(--thread-dim);}
.readout .ro-p .where{margin-left:8px;font-size:11.5px;color:var(--dimmer);}
.readout .ro-p .also{display:block;font-size:11.5px;color:var(--dimmer);}

/* ── 段 ─────────────────────────────── */
.band{margin:0 0 6px;padding-top:34px;}
.band h2{
  margin:0;font-size:15px;font-weight:600;
  letter-spacing:.22em;text-indent:.22em;
  color:var(--thread);
}
.band h2 .kind{
  width:24px;height:14px;margin-left:8px;vertical-align:-1px;
  fill:none;stroke:var(--thread);stroke-width:1;stroke-linejoin:round;opacity:.72;
}
.band h2 .kind circle{fill:var(--thread);stroke:none;}
.band h2 .kind circle.o{fill:none;stroke:var(--thread);stroke-dasharray:2 1.8;}
.band .def{
  margin:7px 0 0;font-size:12.5px;line-height:1.8;color:var(--dimmer);
}
.rule{height:1px;background:linear-gradient(90deg,var(--thread-dim),transparent);margin:14px 0 4px;}

/* ── 一场梦 ─────────────────────────── */
.dream{padding:20px 0 4px;scroll-margin-top:16px;}
.dream h3{
  margin:0 0 10px;font-size:17px;font-weight:500;
  letter-spacing:.01em;color:var(--glow);
  transition:color .4s,text-shadow .4s;
  cursor:pointer;
}
.dream h3:focus{outline:none;}
.dream h3 .tw{margin-left:8px;font-size:12px;color:var(--thread);opacity:.5;vertical-align:2px;transition:opacity .2s;}
.dream h3:hover .tw,.dream h3:focus-visible .tw{opacity:1;}
.dream.flash h3{color:#fff;text-shadow:0 0 18px rgba(239,232,218,.55);}
.pages{list-style:none;margin:0;padding:0 0 0 2px;border-left:1px solid var(--thread-dim);}
.pages li{position:relative;padding:0 0 0 18px;}
.pages a{
  display:inline-block;padding:3.5px 0;
  color:var(--dim);text-decoration:none;
  font-size:14.5px;line-height:1.7;
  border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.pages a:hover,.pages a:focus-visible{color:var(--glow);border-bottom-color:var(--thread-dim);outline:none;}
.pages .dot{
  position:absolute;left:-3.5px;top:14px;
  width:6px;height:6px;border-radius:50%;
  background:var(--other);
}
.pages .side{font-size:11.5px;color:#4f4a67;margin-left:8px;letter-spacing:.02em;}

/* ── 收尾 ───────────────────────────── */
.tail{margin-top:56px;padding-top:22px;border-top:1px solid var(--thread-dim);}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 20px;font-size:12px;color:var(--dimmer);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.tail p{margin:0 0 6px;font-size:12.5px;color:var(--dimmer);line-height:1.9;}
.tail .said{color:var(--dim);}
.src{font-size:11.5px;color:#413d56;margin-top:14px;}

@media (max-width:400px){
  .wrap{padding:0 18px 80px;}
  .head h1{font-size:26px;}
}
@media (prefers-reduced-motion:reduce){
  #net .mesh,#net .hoop{stroke-dasharray:none !important;stroke-dashoffset:0 !important;animation:none !important;}
  #net .bead{opacity:1 !important;animation:none !important;}
  .dream.flash h3{text-shadow:none;}
}
</style>
</head>

# 梦境

这不是哄睡，也不是新货架。
只手写你认过的关系。不要自动推断。

线：同小机，有先后，不一定是同一件事。
簇：不同小机，围在同一系列事件身边，不一定有先后。
系列：同一系列，跨不跨小机都行，不一定是同一事件。

写法：`小机 / 抽屉 / 店门名`（首页上看到的那一行）。不要自己去翻英文文件名。
一条只写一组关系。不确定的先扔「还没想清」。
序号不代表顺序，只是宝的梦游足迹。

第一场：2026-09-16。

    for(var t=0;t<=1.001;t+=1/12){
      var yy=y1+(y2-y1)*t, w=9*Math.sin(Math.PI*Math.min(t*1.15,1))+1.5;
      barbs+='M'+x+' '+yy.toFixed(1)+'L'+(x-w).toFixed(1)+' '+(yy+7).toFixed(1);
      barbs+='M'+x+' '+yy.toFixed(1)+'L'+(x+w).toFixed(1)+' '+(yy+7).toFixed(1);
    }
    fg.appendChild(el('path',{'class':'quill','stroke-width':'.55',opacity:'.55',d:barbs}));
    fg.appendChild(el('circle',{cx:x,cy:y1,r:2,fill:'var(--thread)',opacity:'.8'}));
  });
  svg.appendChild(fg);

  // 珠子：按带分配到圈上，圈内均匀挑格
  var beads=[], idx=0, ring=0;
  bandSizes.forEach(function(count,bi){
    var need=plan[bi], per=Math.ceil(count/need), left=count;
    for(var r=0;r<need;r++){
      var here=Math.min(per,left); left-=here;
      for(var j=0;j<here;j++){
        var slot=Math.round(j*N/here)%N;
        var P=pt(RINGS[ring],slot,ring);
        beads.push({x:P[0],y:P[1],i:idx++});
      }
      ring++;
    }
  });

  var byI={};
  var bg=el('g',{});
  beads.forEach(function(b){
    var node=flat[b.i];
    var size=1.5+Math.min(node.items.length,7)*0.45;
    var g=el('g',{'class':'bead',tabindex:'0',role:'button'});
    g.setAttribute('aria-label',node.name);
    g.appendChild(el('circle',{'class':'halo',cx:b.x,cy:b.y,r:size+8}));
    g.appendChild(el('circle',{cx:b.x,cy:b.y,r:size}));
    g.dataset.i=b.i;
    if(!REDUCED){ g.style.opacity='0'; }
    bg.appendChild(g);
    b.size=size; b.g=g; byI[b.i]=b;
  });
  svg.appendChild(bg);

  // 星座：线一层、星一层，压在珠子上面、网心下面
  var lineL=el('g',{'class':'cons'});
  var starL=el('g',{'class':'stars'});
  svg.appendChild(lineL);
  svg.appendChild(starL);

  // 中心：随便挑一场
  var core=el('g',{'class':'bead core-g',tabindex:'0',role:'button'});
  core.setAttribute('aria-label','随便挑一场');
  core.appendChild(el('circle',{'class':'core',cx:CX,cy:CY,r:9,opacity:'.7'}));
  core.appendChild(el('circle',{'class':'coredot',cx:CX,cy:CY,r:3.2}));
  core.dataset.i='rand';
  svg.appendChild(core);

  /* ── 星座 ── */
  var current=-1, token=0, timers=[];
  function later(fn,ms){ timers.push(setTimeout(fn,ms)); }

  // 两点之间的一段线，两头各让出一点空，不压在星星上
  function seg(A,C,ra,rc){
    var dx=C.x-A.x, dy=C.y-A.y, L=Math.sqrt(dx*dx+dy*dy);
    if(L<=ra+rc+0.8) return null;
    var ux=dx/L, uy=dy/L;
    return {x1:A.x+ux*ra, y1:A.y+uy*ra, x2:C.x-ux*rc, y2:C.y-uy*rc};
  }
  // 线要是从别的亮点上穿过去，就在那儿断开一小截
  function dodge(list,P,r){
    var out=[];
    list.forEach(function(s){
      var dx=s.x2-s.x1, dy=s.y2-s.y1, L2=dx*dx+dy*dy;
      if(!L2) return;
      var t=((P.x-s.x1)*dx+(P.y-s.y1)*dy)/L2;
      var qx=s.x1+t*dx, qy=s.y1+t*dy;
      var dd=Math.sqrt((P.x-qx)*(P.x-qx)+(P.y-qy)*(P.y-qy));
      if(t<=0||t>=1||dd>=r){ out.push(s); return; }
      var h=Math.sqrt(r*r-dd*dd)/Math.sqrt(L2);
      if(t-h>0.04) out.push({x1:s.x1,y1:s.y1,x2:s.x1+(t-h)*dx,y2:s.y1+(t-h)*dy});
      if(t+h<0.96) out.push({x1:s.x1+(t+h)*dx,y1:s.y1+(t+h)*dy,x2:s.x2,y2:s.y2});
    });
    return out;
  }

  // 一场梦的星座：星星的位置 + 哪几颗连起来
  function figure(kind,n,b,name){
    var dx=b.x-CX, dy=b.y-CY, rb=Math.sqrt(dx*dx+dy*dy)||1;
    var inward=Math.atan2(-dy,-dx);            // 朝网心的方向
    var hs=hashInt(name), side=(hs&1)?1:-1;
    var F={pts:[],edges:[],cx:b.x,cy:b.y,tether:false};
    if(n<=0) return F;
    var k;

    if(kind==='path' || n===1){
      // 线：从珠子出发往网心一笔画下去，左右轻轻摆，顺序就是她写的顺序
      var stepL=(n===1)?25:Math.max(15, Math.min(21, rb*1.5/n));
      var x=b.x, y=b.y;
      for(k=0;k<n;k++){
        var zig=(n>1)?((k%2)?-0.36:0.36)*side:0.3*side;
        var th=inward + side*(0.14+0.06*k) + zig;
        x+=stepL*Math.cos(th); y+=stepL*Math.sin(th);
        F.pts.push({x:x,y:y});
        F.edges.push([k-1,k]);                 // -1 = 这场梦自己那颗珠子
      }
    }else{
      var R=(kind==='star')? 20+3.4*n : 17+4.6*n;
      if(n===2) R=Math.max(R,26);
      var fit=Math.max(R*0.82, Math.min(R, RLIM-rb));
      var over=rb+fit-RLIM;
      if(over>0.5){                            // 外圈放不下：整个往里挪，拿一根细线系回珠子
        F.cx=b.x+over*Math.cos(inward);
        F.cy=b.y+over*Math.sin(inward);
        F.tether=true;
      }
      var rot=inward+((hs%9)-4)*0.05;          // 第一颗大致朝网心
      for(k=0;k<n;k++){
        var a=rot+Math.PI*2*k/n;
        F.pts.push({x:F.cx+fit*Math.cos(a), y:F.cy+fit*Math.sin(a)});
      }
      if(n===2){
        F.edges=F.tether? [[0,1]] : [[0,-1],[-1,1]];
      }else if(kind==='star'){
        // 系列：交织纵横——星形多边形，线会互相穿过
        var kk=(n===4)?2:(n===3?1:Math.max(2,Math.min(Math.floor((n-1)/2),Math.round(n/2.6))));
        var seen={};
        for(k=0;k<n;k++){
          var c=(k+kk)%n, key=Math.min(k,c)+'-'+Math.max(k,c);
          if(!seen[key]){ seen[key]=1; F.edges.push([k,c]); }
        }
      }else{
        // 簇：围在同一件事身边——围成一圈
        for(k=0;k<n;k++) F.edges.push([k,(k+1)%n]);
      }
    }
    // 别压到网心那颗上，也别飘出圈
    F.pts.forEach(function(p){
      var ex=p.x-CX, ey=p.y-CY, r=Math.sqrt(ex*ex+ey*ey);
      if(r<16){
        var ang=(r>0.01)?Math.atan2(ey,ex):inward+Math.PI/2*side;
        p.x=CX+16*Math.cos(ang); p.y=CY+16*Math.sin(ang);
        ex=p.x-CX; ey=p.y-CY; r=16;
      }
      if(r>RLIM){ p.x=CX+ex*RLIM/r; p.y=CY+ey*RLIM/r; }
    });
    return F;
  }

  function addLine(s,cls,delay){
    var ln=el('line',{'class':cls,x1:s.x1.toFixed(2),y1:s.y1.toFixed(2),x2:s.x2.toFixed(2),y2:s.y2.toFixed(2)});
    lineL.appendChild(ln);
    if(REDUCED) return;
    var my=token;
    if(cls==='ln'){
      // 实线：从一头画到另一头
      var L=Math.sqrt((s.x2-s.x1)*(s.x2-s.x1)+(s.y2-s.y1)*(s.y2-s.y1))+1;
      ln.style.strokeDasharray=L+' '+L;
      ln.style.strokeDashoffset=String(L);
      later(function(){
        if(my!==token) return;
        void ln.getBoundingClientRect();
        ln.style.transition='stroke-dashoffset 380ms ease-out';
        ln.style.strokeDashoffset='0';
      },delay);
      later(function(){
        if(my!==token) return;
        ln.style.strokeDasharray=''; ln.style.transition='';
      },delay+520);
    }else{
      // 虚线、系线、牵线：淡进来
      ln.style.opacity='0';
      later(function(){
        if(my!==token) return;
        void ln.getBoundingClientRect();
        ln.style.transition='opacity 520ms ease-out';
        ln.style.opacity='';
      },delay);
    }
  }

  function addStar(i,k,p,col,shared,delay){
    var g=el('g',{'class':'star',tabindex:'0',role:'button'});
    g.setAttribute('aria-label',flat[i].items[k].label);
    g.dataset.i=i; g.dataset.k=k;
    g.style.color=col;
    var X=p.x.toFixed(2), Y=p.y.toFixed(2);
    g.appendChild(el('circle',{'class':'st-hit',cx:X,cy:Y,r:7.5}));
    g.appendChild(el('circle',{'class':'st-glow',cx:X,cy:Y,r:5.4}));
    if(shared) g.appendChild(el('circle',{'class':'st-ring',cx:X,cy:Y,r:4.7}));
    g.appendChild(el('circle',{'class':'st-dot',cx:X,cy:Y,r:2.3}));
    g.appendChild(el('circle',{'class':'st-glint',cx:X,cy:Y,r:0.9}));
    starL.appendChild(g);
    if(REDUCED) return;
    var my=token;
    g.style.opacity='0';
    later(function(){
      if(my!==token) return;
      void g.getBoundingClientRect();
      g.style.transition='opacity 420ms ease-out';
      g.style.opacity='1';
    },delay);
  }

  function wipe(){
    token++;
    timers.forEach(clearTimeout); timers=[];
    while(lineL.firstChild) lineL.removeChild(lineL.firstChild);
    while(starL.firstChild) starL.removeChild(starL.firstChild);
    var on=svg.querySelectorAll('.bead.lit,.bead.echo');
    for(var q=0;q<on.length;q++){ on[q].classList.remove('lit'); on[q].classList.remove('echo'); }
  }

  function light(i){
    var b=byI[i]; if(!b) return;
    wipe();
    var node=flat[i], n=node.items.length, k;
    svg.classList.add('lit-mode');
    b.g.classList.add('lit');
    b.g.style.opacity='1';                     // 开场还没亮起来的珠子，被点到就直接亮
    var F=figure(node.kind,n,b,node.name);
    var per=REDUCED?0:Math.min(90,760/Math.max(n,1));
    var dS=[];
    for(k=0;k<n;k++){
      var it=node.items[k];
      dS.push(120+k*per);                      // 星星按她写的顺序一颗颗出来
      addStar(i,k,F.pts[k],botColor(botOf(it.url)),(shareMap[normUrl(it.url)]||[]).length>1,dS[k]);
    }
    var Bp={x:b.x,y:b.y}, O={x:CX,y:CY}, gapB=b.size+3.2, gapS=4.6;
    function clearOf(parts,skipA,skipC){
      F.pts.forEach(function(p,ix){ if(ix!==skipA && ix!==skipC) parts=dodge(parts,p,5.2); });
      return parts;
    }
    var cls=(node.kind==='soft')?'ln soft':'ln';
    F.edges.forEach(function(e){
      var a=e[0], c=e[1];
      var s=seg(a<0?Bp:F.pts[a], c<0?Bp:F.pts[c], a<0?gapB:gapS, c<0?gapB:gapS);
      if(!s) return;
      var parts=[s];
      if(a>=0 && c>=0) parts=dodge(parts,Bp,gapB);
      parts=clearOf(dodge(parts,O,12),a,c);
      var dl=Math.max(a<0?60:dS[a], c<0?60:dS[c])+90;
      parts.forEach(function(q){ addLine(q,cls,dl); });
    });
    if(F.tether){
      var tt=seg(Bp,{x:F.cx,y:F.cy},gapB,0.5);
      if(tt) clearOf([tt],-9,-9).forEach(function(q){ addLine(q,'tether',60); });
    }
    // 同一页也写在别的梦里：从那颗星牵一根虚线过去（只认她写下的链接）
    var tail=(n?dS[n-1]:0)+420;
    for(k=0;k<n;k++){
      (shareMap[normUrl(node.items[k].url)]||[]).forEach(function(j){
        if(j===i || !byI[j]) return;
        var T=byI[j];
        var s2=seg(F.pts[k],{x:T.x,y:T.y},5.4,T.size+3.4);
        if(s2) clearOf(dodge([s2],O,12),k,-9).forEach(function(q){ addLine(q,'share',tail); });
        T.g.classList.add('echo');
        T.g.style.opacity='1';
      });
    }
    current=i;
    hooks.onLight(i);
  }

  function clear(){
    wipe();
    svg.classList.remove('lit-mode');
    current=-1;
    hooks.onClear();
  }

  function randomOther(){
    var L=flat.length;
    if(L<2) return 0;
    var r;
    do{ r=Math.floor(Math.random()*L); }while(r===current);
    return r;
  }

  // 碰珠子：第一下亮星座，第二下进去；碰星星：看这一页；碰空处：熄掉
  function tap(e){
    var t=e.target;
    var st=t.closest?t.closest('.star'):null;
    if(st){
      var on=starL.querySelectorAll('.star.on');
      for(var q=0;q<on.length;q++) on[q].classList.remove('on');
      st.classList.add('on');
      hooks.onStar(parseInt(st.dataset.i,10),parseInt(st.dataset.k,10));
      return;
    }
    var g=t.closest?t.closest('.bead'):null;
    if(!g){ if(current>=0) clear(); return; }
    if(g.dataset.i==='rand'){ light(randomOther()); return; }
    var i=parseInt(g.dataset.i,10);
    if(i===current) hooks.onGo(i); else light(i);
  }
  svg.addEventListener('click',tap);
  svg.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tap(e); }
    else if(e.key==='Escape' && current>=0){ clear(); }
  });
  svg.addEventListener('mouseover',function(e){
    if(current>=0) return;
    var g=e.target.closest('.bead'); if(!g) return;
    hooks.onHint(g.dataset.i==='rand'? null : flat[parseInt(g.dataset.i,10)]);
  });
  svg.addEventListener('mouseout',function(e){
    if(current>=0) return;
    if(e.target.closest('.bead')) hooks.onHint(undefined);
  });

  // 一次性的织网：从中心往外
  if(!REDUCED){
    var len=mesh.getTotalLength?mesh.getTotalLength():4000;
    mesh.style.strokeDasharray=len; mesh.style.strokeDashoffset=len;
    mesh.style.transition='stroke-dashoffset 1500ms ease-out, opacity 450ms ease';
    var hoop=svg.querySelector('.hoop');
    hoop.style.opacity='0'; hoop.style.transition='opacity 700ms ease-out';
    fg.style.opacity='0'; fg.style.transition='opacity 900ms ease-out 900ms';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        hoop.style.opacity='.75';
        mesh.style.strokeDashoffset='0';
        fg.style.opacity='1';
      });
    });
    var bs=bg.querySelectorAll('.bead');
    for(var q=0;q<bs.length;q++){
      (function(node,delay){
        node.style.transition='opacity 600ms ease-out';
        setTimeout(function(){ node.style.opacity='1'; },delay);
      })(bs[q], 1100+q*22);
    }
  }
  return {count:beads.length, light:light, clear:clear, current:function(){ return current; }};
}

/* ── 渲染 ───────────────────────────── */
function render(data,fromSnapshot){
  var bands=data.bands, defs=data.defs;
  var flat=[];
  bands.forEach(function(b,bi){
    var short=b.name.replace(/[（(].*$/,'').trim();
    b.groups.forEach(function(g){
      flat.push({name:g.name,items:g.items,band:b.name,short:short,kind:KIND[short]||'ring',bi:bi});
    });
  });

  // 同一页出现在几场梦里——只数她写下的链接，不猜
  var shareMap={};
  flat.forEach(function(n,i){
    n.items.forEach(function(it){
      var key=normUrl(it.url), arr=shareMap[key]||(shareMap[key]=[]);
      if(arr.indexOf(i)<0) arr.push(i);
    });
  });

  var host=document.getElementById('bands');
  host.innerHTML='';
  var seen={};
  flat.forEach(function(n){ n.items.forEach(function(it){ seen[botOf(it.url)]=1; }); });

  var counter=0;
  bands.forEach(function(b){
    var sec=document.createElement('section');
    sec.className='band';
    var short=b.name.replace(/[（(].*$/,'').trim();
    var def=defs[short]||b.def||'';
    sec.innerHTML='<h2>'+esc(short)+kindIcon(KIND[short]||'ring')+'</h2>'+(def?'<p class="def">'+esc(def)+'</p>':'')+'<div class="rule"></div>';
    b.groups.forEach(function(g){
      var no=counter++;
      var art=document.createElement('article');
      art.className='dream';
      art.id='d'+no;
      var ul='<ul class="pages">';
      g.items.forEach(function(it){
        var bot=botOf(it.url), dr=drawerOf(it.url);
        var side=[dr,it.side].filter(Boolean).join(' ');
        ul+='<li><span class="dot" style="background:'+botColor(bot)+'"></span>'
          + '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.label)+'</a>'
          + (side?'<span class="side">'+esc(side)+'</span>':'')
          + '</li>';
      });
      ul+='</ul>';
      art.innerHTML='<h3 data-i="'+no+'" role="button" tabindex="0">'+esc(g.name)+'<span class="tw" aria-hidden="true">✧</span></h3>'+ul;
      sec.appendChild(art);
    });
    host.appendChild(sec);
  });

  var pageCount=0;
  flat.forEach(function(n){ pageCount+=n.items.length; });
  document.getElementById('lede').textContent=
    cn(flat.length)+'场梦，'+pageCount+'页。都是一条一条认出来的，没有一条是猜的。';

  var lg=document.getElementById('legend');
  lg.innerHTML='';
  ['claude','gemini','grok','copilot','unsigned'].forEach(function(b){
    if(!seen[b]) return;
    var s=document.createElement('span');
    s.innerHTML='<i style="background:'+botColor(b)+'"></i>'+b;
    lg.appendChild(s);
  });

  document.getElementById('stamp').textContent='第一场，2026-09-16。';
  document.getElementById('src').textContent=fromSnapshot
    ? '这一份读的是页面里存的底稿。传进仓库、和 梦境.md 放一起之后，它会自己跟着那份走。'
    : '跟着仓库里的 梦境.md 走，改那份就行。';

  var scroller=document.getElementById('scroll');
  var readout=document.getElementById('readout');
  var IDLE='<div class="ro-idle">碰一颗珠子，亮起那场梦的星座。<br>再碰一下就进去。中间那颗随便挑一场。</div>';
  var api=null;

  function othersOf(i,url){
    return (shareMap[normUrl(url)]||[]).filter(function(j){ return j!==i; });
  }
  function names(list){
    return list.map(function(j){ return '「'+esc(flat[j].name)+'」'; }).join('');
  }
  function showIdle(){ readout.innerHTML=IDLE; }
  function showLit(i){
    var n=flat[i], bots=[], notes=[];
    n.items.forEach(function(it){
      var b=botOf(it.url); if(bots.indexOf(b)<0) bots.push(b);
      var o=othersOf(i,it.url);
      if(o.length) notes.push('「'+esc(it.label)+'」这一颗，也在'+names(o)+'的星座里');
    });
    readout.innerHTML=
      '<div class="ro-t">'+esc(n.name)+'</div>'+
      '<div class="ro-s"><span>'+esc(n.short)+' · '+cn(n.items.length)+'页</span>'+
      '<span class="ro-dots">'+bots.map(function(b){ return '<i style="background:'+botColor(b)+'"></i>'; }).join('')+'</span>'+
      '<button class="ro-go" type="button">去这场梦</button></div>'+
      '<div class="ro-p">'+notes.join('<br>')+'</div>';
  }
  function showStar(i,k){
    var it=flat[i].items[k], bot=botOf(it.url), dr=drawerOf(it.url), o=othersOf(i,it.url);
    var box=readout.querySelector('.ro-p'); if(!box) return;
    box.innerHTML='<i style="background:'+botColor(bot)+'"></i>'+
      '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.label)+'</a>'+
      '<span class="where">'+esc([bot,dr].filter(Boolean).join(' / '))+'</span>'+
      (o.length?'<span class="also">这一颗也在'+names(o)+'的星座里</span>':'');
  }
  function go(i){
    var art=document.getElementById('d'+i);
    if(!art) return;
    art.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'});
    art.classList.remove('flash');
    void art.offsetWidth;
    art.classList.add('flash');
    setTimeout(function(){art.classList.remove('flash');},1600);
  }
  function hint(n){
    if(n===undefined) showIdle();
    else if(n===null) readout.innerHTML='<div class="ro-idle">随便挑一场。</div>';
    else readout.innerHTML='<div class="ro-idle"><b>'+esc(n.name)+'</b></div>';
  }

  readout.addEventListener('click',function(e){
    if(e.target.closest('.ro-go') && api && api.current()>=0) go(api.current());
  });

  // 在下面的名单里碰名字：回到网上，亮起它的星座
  function fromList(h){
    var i=parseInt(h.getAttribute('data-i'),10);
    if(isNaN(i)||!api) return;
    scroller.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
    setTimeout(function(){ api.light(i); }, REDUCED?0:420);
  }
  host.addEventListener('click',function(e){
    var h=e.target.closest('h3[data-i]'); if(h) fromList(h);
  });
  host.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ') return;
    var h=e.target.closest('h3[data-i]'); if(!h) return;
    e.preventDefault(); fromList(h);
  });

  showIdle();
  api=drawWeb(
    document.getElementById('net'),
    flat,
    bands.map(function(b){return b.groups.length;}),
    {onLight:showLit, onClear:showIdle, onGo:go, onStar:showStar, onHint:hint},
    shareMap
  );
}

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cn(n){
  var d='零一二三四五六七八九';
  if(n<10) return d[n];
  if(n<20) return '十'+(n%10?d[n%10]:'');
  if(n<100) return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');
  return String(n);
}

/* ── 起 ─────────────────────────────── */
var snapshot=document.getElementById('snapshot').textContent;

function boot(md,fromSnapshot){
  var data;
  try{ data=parse(md); }catch(e){ data={bands:[],defs:{}}; }
  if(!data.bands.length && !fromSnapshot){ boot(snapshot,true); return; }
  if(!data.bands.length){
    document.getElementById('lede').textContent='网是空的。梦境.md 里还没有认过的关系。';
    return;
  }
  render(data,fromSnapshot);
}

(location.protocol==='file:'
  ? Promise.reject()
  : fetch('梦境.md',{cache:'no-cache'}))
  .then(function(r){ if(!r.ok) throw 0; return r.text(); })
  .then(function(t){ if(!t||t.length<40) throw 0; boot(t,false); })
  .catch(function(){ boot(snapshot,true); });

})();
</script>
