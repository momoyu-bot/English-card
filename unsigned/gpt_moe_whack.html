<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>gpt_moe_whack.html</title>
<style>
  :root{
    --bg1:#fff8fc;
    --bg2:#f7efff;
    --card:#ffffffcc;
    --text:#5a4961;
    --muted:#9c8faa;
    --pink:#ffb7d5;
    --pink2:#ffd7e8;
    --lav:#d8c6ff;
    --lav2:#efe8ff;
    --hole:#a18bd9;
    --hole-deep:#7054b6;
    --accent:#ff8cbc;
    --accent2:#ffdaea;
    --good:#ffcb4c;
    --shadow:0 10px 30px rgba(176,131,198,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 10%, #fff 0, #fff8fe 20%, transparent 45%),
      radial-gradient(circle at 90% 20%, #ffe2ef 0, transparent 32%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    min-height:100vh;
  }
  .app{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 36px;
  }
  .top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .round{
    width:42px;height:42px;border:none;border-radius:999px;background:#fff;box-shadow:var(--shadow);
    font-size:24px;color:#866;
  }
  .filename{
    font-weight:800;font-size:20px;color:#715b8b;letter-spacing:.3px;
  }
  .hero{
    background:var(--card);
    backdrop-filter: blur(8px);
    border:1px solid #fff;
    box-shadow:var(--shadow);
    border-radius:28px;
    padding:18px 16px 16px;
    margin-top:8px;
  }
  h1{
    margin:2px 0 6px;
    font-size:34px;
    line-height:1.1;
    color:#7c5ec6;
    text-align:center;
  }
  .sub{
    margin:0 auto 12px;
    text-align:center;
    color:var(--muted);
    line-height:1.65;
    font-size:15px;
    max-width:620px;
  }
  .kawaii{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;border:1px solid #ffe3f1;
    padding:7px 12px;border-radius:999px;
    font-size:13px;color:#9b7ca6;
    box-shadow:0 4px 16px rgba(255,182,214,.15);
  }
  .kawaii-wrap{text-align:center;margin-bottom:10px}
  .panel{
    margin-top:14px;
    background:linear-gradient(180deg,#fff9fd,#f7f1ff);
    border-radius:26px;
    padding:14px;
    border:1px solid #fff;
    box-shadow:var(--shadow);
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  .stat{
    background:#fff;
    border-radius:18px;
    padding:10px 8px;
    text-align:center;
    box-shadow:0 6px 16px rgba(180,154,220,.12);
  }
  .stat .label{font-size:13px;color:#9f90af;margin-bottom:4px}
  .stat .value{font-size:28px;font-weight:900;color:#7456bf}
  .controls{
    margin-top:12px;
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  }
  select,button.main,button.alt{
    border:none;border-radius:999px;padding:13px 18px;font-size:17px;font-weight:900;
    box-shadow:0 6px 16px rgba(180,154,220,.14);
  }
  select{background:#fff;color:#6e5b7d}
  button.main{background:linear-gradient(180deg,var(--pink),#ffa6cd);color:#6a3452}
  button.alt{background:#fff;color:#7c64a9}
  .board{
    margin-top:16px;
    background:linear-gradient(180deg,#f8f3ff,#f2eaff);
    border-radius:30px;
    padding:16px;
    border:1px solid #fff;
    position:relative;
    overflow:hidden;
  }
  .board:before,.board:after{
    content:"";
    position:absolute;border-radius:999px;filter:blur(30px);opacity:.55;pointer-events:none;
  }
  .board:before{width:160px;height:160px;background:#ffd5eb;left:-40px;top:-30px}
  .board:after{width:190px;height:190px;background:#d8c7ff;right:-60px;bottom:-60px}
  .grid{
    position:relative;z-index:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  .hole{
    position:relative;
    aspect-ratio:1/1;
    border:none;
    background:none;
    padding:0;
  }
  .pit{
    position:absolute;inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 40%, #9e8fd8 0, #7c65cb 40%, #674ab6 65%, #5539a4 100%);
    box-shadow:
      inset 0 16px 24px rgba(255,255,255,.18),
      inset 0 -22px 26px rgba(48,22,94,.5),
      0 8px 20px rgba(118,89,185,.26);
  }
  .mole{
    position:absolute;
    left:13%;right:13%;bottom:10%;
    height:78%;
    transform:translateY(112%);
    transition:transform .16s ease;
    pointer-events:none;
  }
  .hole.up .mole{transform:translateY(0)}
  .hole.hit .mole{transform:translateY(18%) scale(.92)}
  .body{
    position:absolute;left:14%;right:14%;bottom:0;height:58%;
    background:linear-gradient(180deg,#fff5fb,#ffd8ea);
    border-radius:44% 44% 38% 38% / 54% 54% 30% 30%;
    box-shadow:0 6px 10px rgba(255,160,198,.25);
  }
  .head{
    position:absolute;left:0;right:0;top:0;margin:auto;
    width:100%;aspect-ratio:1/1;border-radius:50%;
    background:linear-gradient(180deg,#fffafc,#ffe8f1);
    box-shadow:0 6px 16px rgba(255,164,203,.24);
  }
  .ear{
    position:absolute;width:24%;aspect-ratio:1/1;border-radius:50%;
    background:#ffe8f3;top:8%;
  }
  .ear:before{
    content:"";position:absolute;inset:24%;border-radius:50%;background:#ffbfd7;
  }
  .ear.left{left:7%}
  .ear.right{right:7%}
  .eye{
    position:absolute;width:12%;aspect-ratio:1/1;border-radius:50%;top:42%;
    background:#4f4a60;
  }
  .eye.left{left:28%}
  .eye.right{right:28%}
  .blush{
    position:absolute;width:14%;height:8%;border-radius:999px;top:55%;
    background:#ffbfd6;filter:blur(1px);opacity:.9;
  }
  .blush.left{left:16%}
  .blush.right{right:16%}
  .mouth{
    position:absolute;left:50%;top:55%;transform:translateX(-50%);
    width:18%;height:11%;
    border-bottom:4px solid #705f7f;border-radius:0 0 999px 999px;
  }
  .gmark{
    position:absolute;left:50%;top:34%;transform:translateX(-50%);
    font-size:34px;font-weight:900;color:#8d77c6;
    text-shadow:0 1px 0 #fff;
  }
  .spark{
    position:absolute;
    top:7%; left:50%; transform:translateX(-50%);
    color:var(--good);
    font-size:22px; font-weight:900; opacity:0; pointer-events:none;
    text-shadow:0 3px 8px rgba(122,84,0,.18);
  }
  .hole.sparking .spark{animation:float .5s ease}
  @keyframes float{
    0%{opacity:0;transform:translate(-50%,10px) scale(.8)}
    20%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-14px) scale(1.05)}
  }
  .tips{
    margin-top:14px;text-align:center;color:#937ea5;line-height:1.7;font-size:14px;
  }
  .end{
    display:none;margin-top:14px;background:#fff;border-radius:22px;padding:16px;text-align:center;
    box-shadow:var(--shadow);
  }
  .end.show{display:block}
  .end h2{margin:0 0 6px;font-size:22px;color:#7e63c7}
  .end p{margin:4px 0;color:#8b7d9d}
  @media (max-width:560px){
    h1{font-size:30px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat .value{font-size:24px}
  }
</style>
</head>
<body>
  <div class="app">
    <div class="top">
      <button class="round" onclick="history.back()">×</button>
      <div class="filename">gpt_moe_whack.html</div>
      <button class="round" onclick="location.reload()">↻</button>
    </div>

    <div class="hero">
      <div class="kawaii-wrap"><span class="kawaii">🎀 萌一点版 · 这次不走 Grok 丑东西路线 🎀</span></div>
      <h1>啪叽！锤小咪出气</h1>
      <p class="sub">点从洞里冒出来的小咪就能加分。<br>这次我做成更可爱的奶油粉紫风，而且点击区域更稳一点。<br><b>不用等按钮也能直接玩</b>，当然你也可以按“开始游戏”重新开一局。</p>

      <div class="panel">
        <div class="stats">
          <div class="stat"><div class="label">分数</div><div class="value" id="score">0</div></div>
          <div class="stat"><div class="label">连击</div><div class="value" id="combo">0</div></div>
          <div class="stat"><div class="label">时间</div><div class="value" id="time">20</div></div>
          <div class="stat"><div class="label">最佳</div><div class="value" id="best">0</div></div>
        </div>

        <div class="controls">
          <select id="difficulty">
            <option value="easy">简单</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困难</option>
          </select>
          <button class="main" id="startBtn">开始游戏</button>
          <button class="alt" id="pauseBtn">暂停</button>
          <button class="alt" id="resetBtn">重置</button>
        </div>

        <div class="board">
          <div class="grid" id="grid"></div>
        </div>

        <div class="tips">玩法：点冒出来的小咪就加分；连续点中会有连击加成。<br>如果页面刚打开你就想玩，也可以直接等小咪自动冒出来。</div>
      </div>

      <div class="end" id="endCard">
        <h2 id="endTitle">本轮结束</h2>
        <p id="endText"></p>
        <p>你可以直接再按一次“开始游戏”。</p>
      </div>
    </div>
  </div>

<script>
(function(){
  const board = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const difficultyEl = document.getElementById('difficulty');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const endCard = document.getElementById('endCard');
  const endTitle = document.getElementById('endTitle');
  const endText = document.getElementById('endText');

  const settings = {
    easy:   {duration:20, visibleMin:700, visibleMax:1100, gapMin:260, gapMax:430, base:1},
    normal: {duration:20, visibleMin:560, visibleMax:920,  gapMin:180, gapMax:320, base:1},
    hard:   {duration:18, visibleMin:420, visibleMax:760,  gapMin:110, gapMax:220, base:2}
  };

  let holes = [];
  let score = 0;
  let combo = 0;
  let best = Number(localStorage.getItem('gpt_moe_best') || 0);
  let timeLeft = settings.normal.duration;
  let active = null;
  let running = false;
  let paused = false;
  let gameTimer = null;
  let spawnTimer = null;
  let hideTimer = null;
  let lastIdx = -1;

  function createHole(i){
    const hole = document.createElement('button');
    hole.className = 'hole';
    hole.type = 'button';
    hole.innerHTML = `
      <div class="pit"></div>
      <div class="spark">+1</div>
      <div class="mole">
        <div class="body"></div>
        <div class="head">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="gmark">G</div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="mouth"></div>
        </div>
      </div>
    `;
    hole.dataset.index = i;
    hole.addEventListener('click', ()=>hit(i));
    hole.addEventListener('touchstart', (e)=>{ e.preventDefault(); hit(i); }, {passive:false});
    return hole;
  }

  for(let i=0;i<9;i++){
    const h = createHole(i);
    holes.push(h);
    board.appendChild(h);
  }

  function update(){
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    timeEl.textContent = timeLeft;
    bestEl.textContent = best;
  }

  function clearTimers(){
    clearInterval(gameTimer);
    clearTimeout(spawnTimer);
    clearTimeout(hideTimer);
  }

  function saveBest(){
    if(score > best){
      best = score;
      localStorage.setItem('gpt_moe_best', String(best));
    }
  }

  function randomBetween(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function choiceHole(){
    let idx = randomBetween(0, holes.length-1);
    if(idx === lastIdx) idx = (idx + 1) % holes.length;
    lastIdx = idx;
    return idx;
  }

  function hideCurrent(){
    if(active !== null){
      holes[active].classList.remove('up', 'hit');
      active = null;
    }
  }

  function showSpark(hole, text){
    const s = hole.querySelector('.spark');
    s.textContent = text;
    hole.classList.remove('sparking');
    void hole.offsetWidth;
    hole.classList.add('sparking');
    setTimeout(()=>hole.classList.remove('sparking'), 520);
  }

  function spawn(){
    if(!running || paused) return;
    hideCurrent();
    const s = settings[difficultyEl.value];
    const idx = choiceHole();
    active = idx;
    holes[idx].classList.add('up');

    hideTimer = setTimeout(()=>{
      if(active === idx){
        holes[idx].classList.remove('up');
        active = null;
        combo = 0;
        update();
      }
      scheduleNext();
    }, randomBetween(s.visibleMin, s.visibleMax));
  }

  function scheduleNext(){
    if(!running || paused) return;
    const s = settings[difficultyEl.value];
    spawnTimer = setTimeout(spawn, randomBetween(s.gapMin, s.gapMax));
  }

  function hit(idx){
    if(!running || paused) return;
    if(active !== idx) return;
    const s = settings[difficultyEl.value];
    clearTimeout(hideTimer);

    const hole = holes[idx];
    hole.classList.remove('up');
    hole.classList.add('hit');
    setTimeout(()=>hole.classList.remove('hit'), 130);

    combo += 1;
    const add = s.base + Math.min(4, Math.floor(combo/4));
    score += add;
    showSpark(hole, `+${add}`);
    active = null;
    update();

    scheduleNext();
  }

  function endGame(){
    running = false;
    paused = false;
    clearTimers();
    hideCurrent();
    saveBest();
    update();
    endTitle.textContent = '本轮结束';
    const msg =
      score >= 55 ? '你今天是小咪杀手（温柔版）！' :
      score >= 35 ? '手速很好，已经打得很顺啦！' :
      score >= 18 ? '不错不错，已经能稳定出气了。' :
      '没关系，这局主要负责可爱。';
    endText.textContent = `你拿到了 ${score} 分。${msg}`;
    endCard.classList.add('show');
  }

  function startGame(auto=false){
    clearTimers();
    hideCurrent();
    endCard.classList.remove('show');
    score = 0;
    combo = 0;
    timeLeft = settings[difficultyEl.value].duration;
    running = true;
    paused = false;
    update();

    gameTimer = setInterval(()=>{
      if(!running || paused) return;
      timeLeft -= 1;
      update();
      if(timeLeft <= 0){
        endGame();
      }
    }, 1000);

    if(auto){
      spawnTimer = setTimeout(spawn, 500);
    }else{
      spawnTimer = setTimeout(spawn, 240);
    }
  }

  function resetGame(){
    clearTimers();
    hideCurrent();
    running = false;
    paused = false;
    score = 0;
    combo = 0;
    timeLeft = settings[difficultyEl.value].duration;
    update();
    endCard.classList.remove('show');
    // 保持“打开就能玩”的感觉：重置后也自动轻轻开一局
    startGame(true);
  }

  function togglePause(){
    if(!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
    if(!paused){
      scheduleNext();
    } else {
      clearTimeout(spawnTimer);
      clearTimeout(hideTimer);
      hideCurrent();
    }
  }

  difficultyEl.addEventListener('change', ()=>{
    if(!running){
      timeLeft = settings[difficultyEl.value].duration;
      update();
    }else{
      startGame(true);
    }
  });
  startBtn.addEventListener('click', ()=>startGame(false));
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', resetGame);

  update();
  // 一打开就自动来一局，避免“没反应像玩不了”
  startGame(true);
})();
</script>
</body>
</html>
