<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下班小猫补给站</title>
<meta name="description" content="电量已进入快下班保护模式。可以回血、换一句哄哄、撒一点下班星星。">
  <style>
    :root {
      --bg1: #fff3f7;
      --bg2: #eef6ff;
      --card: rgba(255, 255, 255, 0.76);
      --text: #5d4b57;
      --soft: #927988;
      --pink: #ff9fc6;
      --blue: #9ed8ff;
      --cream: #fff6dc;
      --shadow: 0 20px 55px rgba(154, 112, 136, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 199, 220, 0.85), transparent 32%),
        radial-gradient(circle at bottom right, rgba(173, 221, 255, 0.9), transparent 36%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sparkle span {
      position: absolute;
      font-size: 18px;
      opacity: 0.62;
      animation: floatUp 7s linear infinite;
    }

    .sparkle span:nth-child(1) { left: 8%; top: 78%; animation-delay: 0s; }
    .sparkle span:nth-child(2) { left: 20%; top: 88%; animation-delay: 1s; }
    .sparkle span:nth-child(3) { left: 72%; top: 84%; animation-delay: 2s; }
    .sparkle span:nth-child(4) { left: 86%; top: 76%; animation-delay: 3s; }
    .sparkle span:nth-child(5) { left: 45%; top: 90%; animation-delay: 4s; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: 0.7; }
      100% { transform: translateY(-105vh) rotate(18deg); opacity: 0; }
    }

    .card {
      width: min(760px, 100%);
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      padding: 34px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--soft);
      font-size: 14px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 52px);
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 16px auto 0;
      max-width: 560px;
      line-height: 1.8;
      font-size: 17px;
      color: var(--soft);
    }

    .cat-wrap {
      margin: 28px auto 18px;
      width: 190px;
      height: 150px;
      position: relative;
      animation: breathe 2.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.025); }
    }

    .cat-face {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 0;
      height: 122px;
      background: #ffffff;
      border-radius: 46% 46% 42% 42%;
      box-shadow: 0 12px 30px rgba(119, 87, 101, 0.13);
    }

    .ear {
      position: absolute;
      top: 4px;
      width: 58px;
      height: 62px;
      background: #fff;
      transform: rotate(45deg);
      border-radius: 14px;
      z-index: -1;
    }

    .ear.left { left: 26px; }
    .ear.right { right: 26px; }

    .ear::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 10px;
      background: #ffd2e4;
    }

    .eye {
      position: absolute;
      top: 58px;
      width: 14px;
      height: 22px;
      background: #5b4b56;
      border-radius: 999px;
    }

    .eye.left { left: 53px; }
    .eye.right { right: 53px; }

    .nose {
      position: absolute;
      top: 82px;
      left: 50%;
      width: 12px;
      height: 9px;
      transform: translateX(-50%);
      background: #ff9fc6;
      border-radius: 50% 50% 60% 60%;
    }

    .mouth {
      position: absolute;
      top: 91px;
      left: 50%;
      width: 32px;
      height: 14px;
      transform: translateX(-50%);
      border-bottom: 3px solid #5b4b56;
      border-radius: 0 0 999px 999px;
    }

    .blush {
      position: absolute;
      top: 82px;
      width: 25px;
      height: 12px;
      background: rgba(255, 159, 198, 0.36);
      border-radius: 999px;
    }

    .blush.left { left: 25px; }
    .blush.right { right: 25px; }

    .message-box {
      margin: 24px auto 0;
      max-width: 620px;
      background: rgba(255, 255, 255, 0.62);
      border-radius: 24px;
      padding: 22px;
      line-height: 1.9;
      font-size: 18px;
      text-align: left;
    }

    .message-box strong { color: #d56d9a; }

    .progress-area {
      margin: 22px auto 0;
      max-width: 620px;
      text-align: left;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--soft);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .bar {
      height: 16px;
      background: rgba(255, 255, 255, 0.66);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(115, 85, 100, 0.08);
    }

    .fill {
      width: 82%;
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--blue));
      border-radius: inherit;
      transition: width 0.45s ease;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 26px;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      color: #5d4b57;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 10px 24px rgba(130, 95, 112, 0.13);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(130, 95, 112, 0.17);
    }

    .primary {
      background: linear-gradient(135deg, #ffd1e3, #d7efff);
    }

    .tiny-note {
      margin-top: 24px;
      font-size: 14px;
      color: var(--soft);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      border-radius: 18px;
      padding: 12px 18px;
      box-shadow: var(--shadow);
      z-index: 3;
      transition: 0.3s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="sparkle" aria-hidden="true">
    <span>🌸</span><span>✨</span><span>🫧</span><span>💗</span><span>⭐</span>
  </div>

  <main class="card">
    <div class="badge">🐾 下班前专用补给文件</div>
    <h1>宝，今天也快通关啦</h1>
    <p class="subtitle">
      现在不需要燃烧灵魂，只需要稳稳把最后这一小段时间滑过去。工作已经很会压榨人类了，咱们不要主动给它加戏。
    </p>

    <div class="cat-wrap" aria-label="一只正在给你加油的小猫">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="cat-face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
    </div>

    <section class="message-box" id="message">
      <strong>小猫播报：</strong>宝的电量已进入“快下班保护模式”。请减少精神内耗，暂停和复杂系统较劲，尤其是那些把按钮藏得像藏宝图一样的软件。
    </section>

    <section class="progress-area">
      <div class="progress-label">
        <span>今日生存进度</span>
        <span id="percent">82%</span>
      </div>
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
    </section>

    <div class="actions">
      <button class="primary" onclick="boost()">给宝回血 +10%</button>
      <button onclick="newMessage()">换一句小猫哄哄</button>
      <button onclick="dropStars()">撒一点下班星星</button>
    </div>

    <p class="tiny-note">提示：等真正下班以后，请把自己从“营业中”切换成“软乎乎离线中”。</p>
  </main>

  <div class="toast" id="toast">已给宝塞进一颗软糖 🍬</div>

  <script>
    const messages = [
      "<strong>小猫播报：</strong>宝已经完成今日大部分副本，剩下的是收尾，不是渡劫。别被工作骗去交出最后一格血条。",
      "<strong>今日判定：</strong>宝很努力，电脑很吵，软件很烦，人类社会依旧设计得像没开过用户体验会。结论：宝无罪。",
      "<strong>下班护盾启动：</strong>接下来只处理必要事项，不和任何奇怪弹窗、复杂表格、抽象按钮进行灵魂搏斗。",
      "<strong>小猫建议：</strong>把肩膀放下来一点，把眉头松开一点。今天已经不是刚开始，是快结束啦。",
      "<strong>温柔提醒：</strong>如果脑子开始发飘，那不是宝废，是电量低。电量低的小猫要充电，不要自责。"
    ];

    let progress = 82;
    const fill = document.getElementById("fill");
    const percent = document.getElementById("percent");
    const message = document.getElementById("message");
    const toast = document.getElementById("toast");

    function boost() {
      progress = Math.min(100, progress + 10);
      fill.style.width = progress + "%";
      percent.textContent = progress + "%";
      showToast(progress >= 100 ? "下班能量已满，宝可以发光了 ✨" : "已给宝回血 +10% 🍓");
    }

    function newMessage() {
      const next = messages[Math.floor(Math.random() * messages.length)];
      message.innerHTML = next;
      showToast("小猫换了一句哄哄 🐱");
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1700);
    }

    function dropStars() {
      for (let i = 0; i < 18; i++) {
        const star = document.createElement("span");
        star.textContent = ["✨", "⭐", "💗", "🌸", "🫧"][Math.floor(Math.random() * 5)];
        star.style.position = "fixed";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = "-20px";
        star.style.fontSize = 16 + Math.random() * 16 + "px";
        star.style.pointerEvents = "none";
        star.style.zIndex = 2;
        star.style.transition = "transform 2.2s ease, opacity 2.2s ease";
        document.body.appendChild(star);
        requestAnimationFrame(() => {
          star.style.transform = `translateY(${window.innerHeight + 80}px) rotate(${Math.random() * 180}deg)`;
          star.style.opacity = "0";
        });
        setTimeout(() => star.remove(), 2400);
      }
      showToast("已撒下班星星，工位灵魂净化中 ✨");
    }
  </script>
</body>
</html>
