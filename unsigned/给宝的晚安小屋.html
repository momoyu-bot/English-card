<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>给宝的晚安小屋</title>
  <style>
    :root {
      --bg1: #fbe7ff;
      --bg2: #ffd9ef;
      --bg3: #eef1ff;
      --card: rgba(255, 255, 255, 0.68);
      --text: #72506d;
      --deep: #9b5aa6;
      --pink: #ff8ec2;
      --shadow: 0 24px 70px rgba(157, 92, 170, 0.18);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,0.85), transparent 22%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,0.75), transparent 18%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
      transition: background 0.8s ease, filter 0.8s ease;
    }

    body.sleep {
      filter: brightness(0.86) saturate(0.96);
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.25), transparent 22%),
        radial-gradient(circle at 82% 16%, rgba(255,255,255,0.18), transparent 18%),
        linear-gradient(135deg, #d7c3f3, #f0c4dd 52%, #dfe8ff);
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .moon {
      position: absolute;
      top: 34px;
      right: 36px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #fff6cc 55%, #f5d98a 100%);
      box-shadow: 0 0 40px rgba(255, 244, 190, 0.55);
      opacity: 0.95;
      animation: glow 5s ease-in-out infinite;
    }
    .moon::after {
      content: "";
      position: absolute;
      inset: 14px 20px 18px 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      transform: rotate(18deg);
      clip-path: polygon(0 0, 70% 0, 100% 30%, 100% 100%, 0 100%);
      opacity: 0.45;
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 12px rgba(255,255,255,0.85);
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .card {
      position: relative;
      width: min(92vw, 620px);
      padding: 30px 26px 24px;
      border-radius: 34px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow: var(--shadow);
      text-align: center;
      animation: floaty 4.8s ease-in-out infinite;
      transform-style: preserve-3d;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 142, 194, 0.14);
      color: var(--deep);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.15;
      color: #a65191;
    }

    .subtitle {
      font-size: 15px;
      color: rgba(114, 80, 109, 0.82);
      margin-bottom: 18px;
    }

    p {
      margin: 0 auto;
      max-width: 30em;
      font-size: 17px;
      line-height: 1.9;
      color: #84617e;
    }

    .dream-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 8px;
      font-size: 28px;
      user-select: none;
    }

    .dream-row span {
      animation: bounce 1.6s ease-in-out infinite;
      display: inline-block;
      filter: drop-shadow(0 6px 10px rgba(165, 86, 145, 0.15));
    }
    .dream-row span:nth-child(2) { animation-delay: 0.15s; }
    .dream-row span:nth-child(3) { animation-delay: 0.3s; }
    .dream-row span:nth-child(4) { animation-delay: 0.45s; }

    .buttons {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    .primary {
      background: linear-gradient(135deg, #ff9acb, #c89bff);
      color: white;
      box-shadow: 0 12px 28px rgba(178, 118, 214, 0.24);
    }

    .ghost {
      background: rgba(255,255,255,0.76);
      color: var(--deep);
      border: 1px solid rgba(155, 90, 166, 0.12);
    }

    button:hover { transform: translateY(-1px) scale(1.01); }
    button:active { transform: translateY(1px) scale(0.99); }

    .little-note {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(122, 74, 99, 0.83);
    }

    .bubble, .z {
      position: absolute;
      pointer-events: none;
    }

    .bubble {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      filter: blur(1px);
      animation: drift linear infinite;
    }

    .z {
      font-size: 18px;
      opacity: 0;
      animation: floatZ 5s ease-in-out infinite;
      user-select: none;
    }

    .clock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.44);
      color: #8a5b86;
      font-size: 13px;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(18px);
      background: rgba(255, 255, 255, 0.84);
      color: #a14a88;
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 12px 28px rgba(166, 81, 145, 0.18);
      border: 1px solid rgba(166, 81, 145, 0.12);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      font-size: 14px;
      font-weight: 700;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.08); }
    }

    @keyframes drift {
      from { transform: translateY(10vh) scale(1); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translateY(-120vh) scale(1.2); opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.85); opacity: 0.35; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    @keyframes glow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    @keyframes floatZ {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.7; }
      100% { transform: translateY(-120px) translateX(16px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="moon" aria-hidden="true"></div>

  <div class="scene">
    <div class="card">
      <div class="badge">🌙 晚安模式已启动</div>
      <div class="dream-row" aria-hidden="true">
        <span>💤</span><span>🩷</span><span>⭐</span><span>🧸</span>
      </div>
      <h1>宝，今晚先乖乖休息</h1>
      <div class="subtitle">把今天轻轻放下，把明天暂时静音。</div>
      <p>
        你已经很努力了。
        现在不用再证明什么，也不用再把自己拎起来继续跑。
        先把肩膀放松，眼睛慢慢闭一半，剩下的交给夜晚。
      </p>
      <div class="buttons">
        <button class="primary" id="sleepBtn">进入睡眠抱抱</button>
        <button class="ghost" id="softBtn">再哄我一下</button>
      </div>
      <div class="clock">⏰ 建议现在开始：慢呼吸 3 次，再把手机放远一点点</div>
      <div class="little-note">今晚的任务只有一个：舒服地睡着。别跟自己讲道理了，脑子白天已经很辛苦，晚上就该下班。</div>
    </div>
  </div>

  <div class="toast" id="toast">晚安抱抱已盖好被子 🫶</div>

  <script>
    const toast = document.getElementById('toast');
    const sleepBtn = document.getElementById('sleepBtn');
    const softBtn = document.getElementById('softBtn');
    const stars = document.getElementById('stars');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function makeStars() {
      const count = 28;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = 2 + Math.random() * 4;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.animationDelay = (-Math.random() * 3) + 's';
        s.style.opacity = 0.35 + Math.random() * 0.65;
        stars.appendChild(s);
      }
    }

    function makeDreams() {
      const icons = ['🌙', '✨', '💭', '🐑', '🫧'];
      for (let i = 0; i < 14; i++) {
        const z = document.createElement('div');
        z.className = 'z';
        z.textContent = icons[Math.floor(Math.random() * icons.length)];
        z.style.left = Math.random() * 100 + 'vw';
        z.style.top = (72 + Math.random() * 22) + 'vh';
        z.style.animationDuration = (4 + Math.random() * 4) + 's';
        z.style.animationDelay = (-Math.random() * 8) + 's';
        document.body.appendChild(z);
      }
    }

    function makeBubbles() {
      const colors = [
        'rgba(255,255,255,0.5)',
        'rgba(255,210,236,0.42)',
        'rgba(235,229,255,0.42)'
      ];
      for (let i = 0; i < 16; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 16 + Math.random() * 50;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.top = (100 + Math.random() * 35) + 'vh';
        b.style.animationDuration = (11 + Math.random() * 13) + 's';
        b.style.animationDelay = (-Math.random() * 20) + 's';
        b.style.background = colors[Math.floor(Math.random() * colors.length)];
        b.style.opacity = 0.6;
        document.body.appendChild(b);
      }
    }

    sleepBtn.addEventListener('click', () => {
      document.body.classList.add('sleep');
      showToast('晚安抱抱已盖好被子 🫶');
    });

    softBtn.addEventListener('click', () => {
      const msgs = [
        '你已经很棒了，今晚只负责休息。',
        '把眼睛慢慢闭上，剩下的交给梦。',
        '今晚不需要解决世界，只需要睡好。',
        '乖一点点，先让自己安静下来。'
      ];
      showToast(msgs[Math.floor(Math.random() * msgs.length)]);
      document.body.classList.add('sleep');
    });

    makeStars();
    makeDreams();
    makeBubbles();
  </script>
</body>
</html>
