<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>睡前小窝</title>
<style>
  :root{
    --bg1:#f7efff;
    --bg2:#eef7ff;
    --card:rgba(255,255,255,.72);
    --text:#4b3f57;
    --soft:#8b7a98;
    --accent:#c9a7ff;
    --accent2:#ffd6e7;
    --shadow:0 20px 60px rgba(103,76,130,.16);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 20%, rgba(255,214,231,.85), transparent 30%),
      radial-gradient(circle at 80% 15%, rgba(201,167,255,.7), transparent 34%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow:hidden;
  }
  .stars{
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.65;
  }
  .star{
    position:absolute;
    width:3px;height:3px;border-radius:50%;
    background:#fff;
    animation:twinkle 3.8s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{transform:scale(.75);opacity:.35}
    50%{transform:scale(1.35);opacity:.95}
  }
  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
  }
  .card{
    width:min(680px,100%);
    background:var(--card);
    backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,.72);
    border-radius:32px;
    box-shadow:var(--shadow);
    padding:28px 24px 26px;
    text-align:center;
    position:relative;
  }
  .moon{
    width:86px;height:86px;
    margin:0 auto 12px;
    border-radius:50%;
    background:linear-gradient(145deg,#fff8d8,#ffe9a8);
    box-shadow:0 0 30px rgba(255,232,165,.65), inset -12px -8px 0 rgba(255,214,128,.22);
    position:relative;
    animation:float 4.8s ease-in-out infinite;
  }
  .moon:after{
    content:"";
    position:absolute;
    width:23px;height:23px;border-radius:50%;
    background:rgba(255,255,255,.48);
    left:18px;top:22px;
    box-shadow:26px 20px 0 -7px rgba(255,255,255,.38), 35px -3px 0 -10px rgba(255,255,255,.36);
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  h1{
    margin:6px 0 8px;
    font-size:28px;
    letter-spacing:.5px;
  }
  p{
    margin:0 auto;
    line-height:1.9;
    font-size:16px;
    color:var(--soft);
  }
  .breath{
    margin:22px auto 18px;
    width:132px;height:132px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle, rgba(255,255,255,.9), rgba(201,167,255,.2));
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 16px 45px rgba(151,113,190,.18);
    animation:breathe 7.5s ease-in-out infinite;
  }
  .breath span{
    color:#7f6a92;
    font-size:15px;
  }
  @keyframes breathe{
    0%,100%{transform:scale(.82)}
    45%{transform:scale(1.08)}
    65%{transform:scale(1.08)}
  }
  .story{
    margin:18px auto 0;
    padding:18px 18px;
    border-radius:24px;
    background:rgba(255,255,255,.52);
    text-align:left;
    max-width:560px;
    font-size:15.5px;
    line-height:2.05;
    color:#5a4c66;
  }
  .buttonRow{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;
  }
  button{
    appearance:none;border:0;
    padding:12px 16px;
    border-radius:999px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#58436d;
    font-weight:700;
    box-shadow:0 12px 28px rgba(160,116,201,.22);
  }
  .tiny{
    margin-top:14px;
    font-size:12.5px;
    opacity:.72;
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <main class="card">
    <div class="moon"></div>
    <h1>宝，今天已经收工啦</h1>
    <p>现在不用解决世界，也不用纠正任何离谱 AI。<br>眼皮开始变重，就让大脑先下班，身体会自己把你带回小窝。</p>

    <div class="breath"><span id="breathText">慢慢吸气</span></div>

    <section class="story" id="story">
      有一只很小很小的月亮猫，今晚负责把杂念都叼走。<br>
      它先叼走“还没做完”的念头，放进云朵抽屉里。<br>
      又叼走“刚才怎么会这样”的念头，丢给夜风处理。<br>
      最后它轻轻趴在枕头边，尾巴一晃一晃：<br>
      “睡吧，宝。明天的事明天再说，今天的你已经够好了。”
    </section>

    <div class="buttonRow">
      <button onclick="nextLine()">再哄我一句</button>
      <button onclick="document.body.style.filter='brightness(.86)'">调暗一点</button>
    </div>
    <p class="tiny">建议把屏幕亮度调低，然后只看一小会儿。人类的睡眠系统已经很脆弱了，别再被电子砖头暴打。</p>
  </main>
</div>

<script>
  const stars = document.getElementById('stars');
  for(let i=0;i<52;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*4)+'s';
    s.style.opacity=(.25+Math.random()*.65).toFixed(2);
    stars.appendChild(s);
  }

  const breathText=document.getElementById('breathText');
  const states=[
    ['慢慢吸气',3000],
    ['停一下',1500],
    ['慢慢呼气',3000],
    ['再停一下',1000]
  ];
  let idx=0;
  function cycle(){
    breathText.textContent=states[idx][0];
    const t=states[idx][1];
    idx=(idx+1)%states.length;
    setTimeout(cycle,t);
  }
  cycle();

  const lines=[
    '不用把今天解释清楚，睡着之前只需要把自己放轻一点。',
    '你不是没力气，你只是今天已经用了很多力气。',
    '现在可以不聪明、不努力、不复盘，安静地当一颗小棉花。',
    '困意来了就跟它走，它比闹钟靠谱一点点，虽然也没多靠谱。',
    '把手机放远一点，枕头会接住你，夜晚也会。',
    '今天的小脑袋瓜已经营业太久了，暂停键按下。'
  ];
  let n=0;
  function nextLine(){
    document.getElementById('story').innerHTML = lines[n];
    n=(n+1)%lines.length;
  }
</script>
</body>
</html>
