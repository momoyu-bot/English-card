<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>起床小助手</title>
<meta name="description" content="太阳都把被窝照暖了。可以说我起床了，也可以再赖床五分钟。">
  <style>
    :root{
      --bg1:#fff3f7;
      --bg2:#fff8e8;
      --card:#ffffffcc;
      --text:#5b4b57;
      --accent:#ff8fb1;
      --accent2:#ffd36e;
      --shadow: 0 18px 40px rgba(255, 143, 177, 0.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top, #fffdf9 0%, var(--bg1) 45%, var(--bg2) 100%);
      color:var(--text);
      overflow:hidden;
    }
    .cloud{
      position:absolute;
      width:160px;
      height:58px;
      border-radius:999px;
      background:rgba(255,255,255,0.75);
      filter:blur(0.2px);
      box-shadow: 35px 10px 0 0 rgba(255,255,255,0.75),
                  70px -6px 0 0 rgba(255,255,255,0.75);
      opacity:.8;
      animation: float 10s ease-in-out infinite;
    }
    .cloud.c1{top:8%; left:8%}
    .cloud.c2{top:16%; right:8%; animation-duration:13s}
    .cloud.c3{bottom:14%; left:12%; animation-duration:12s}
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-12px)}
    }
    .card{
      width:min(92vw, 560px);
      background:var(--card);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.65);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:28px 24px 22px;
      text-align:center;
      position:relative;
      z-index:1;
    }
    .sun{
      width:110px;
      height:110px;
      margin:0 auto 16px;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, #fffbe6 0%, #ffe58f 45%, #ffbf47 100%);
      box-shadow: 0 0 0 12px rgba(255, 213, 110, 0.18),
                  0 0 60px rgba(255, 195, 71, 0.35);
      position:relative;
      animation: pulse 2.2s ease-in-out infinite;
    }
    .sun::before{
      content:"";
      position:absolute;
      inset:-18px;
      background:
        conic-gradient(from 0deg,
          rgba(255,207,94,0) 0 8deg,
          rgba(255,207,94,.9) 8deg 12deg,
          rgba(255,207,94,0) 12deg 20deg);
      mask: radial-gradient(circle, transparent 56px, #000 58px);
      border-radius:50%;
      animation: spin 12s linear infinite;
    }
    .sun::after{
      content:"☀";
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      font-size:38px;
      color:#fff8dc;
      text-shadow:0 2px 6px rgba(255,153,0,.18);
    }
    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.03)}
    }
    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(24px, 4vw, 34px);
      line-height:1.25;
    }
    p{
      margin:10px 0;
      font-size:17px;
      line-height:1.8;
    }
    .tiny{
      font-size:14px;
      opacity:.8;
      margin-top:8px;
    }
    .row{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:18px;
    }
    button{
      border:0;
      border-radius:999px;
      padding:14px 18px;
      font-size:16px;
      cursor:pointer;
      transition:.2s transform, .2s box-shadow, .2s opacity;
      box-shadow:0 10px 22px rgba(255,143,177,.22);
    }
    button:hover{transform:translateY(-2px)}
    button:active{transform:translateY(0px) scale(.99)}
    .wake{
      background:linear-gradient(135deg, #ff8fb1, #ffb36e);
      color:white;
      font-weight:700;
    }
    .nap{
      background:linear-gradient(135deg, #fff, #fff7fb);
      color:var(--text);
      border:1px solid rgba(255,143,177,.24);
    }
    .tip{
      margin-top:14px;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.72);
      border:1px dashed rgba(255,143,177,.28);
      min-height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
    }
    .cat{
      font-size:42px;
      margin-top:6px;
      animation: bob 1.8s ease-in-out infinite;
      display:inline-block;
    }
    @keyframes bob{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-6px)}
    }
    .sparkles{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      border-radius:28px;
    }
    .sparkles span{
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(255,211,110,.85);
      animation: drift 8s linear infinite;
    }
    .sparkles span:nth-child(1){left:10%; top:18%; animation-delay:0s}
    .sparkles span:nth-child(2){left:84%; top:12%; animation-delay:1.2s; width:10px; height:10px}
    .sparkles span:nth-child(3){left:76%; top:80%; animation-delay:2.4s}
    .sparkles span:nth-child(4){left:18%; top:76%; animation-delay:3.1s; width:6px; height:6px}
    .sparkles span:nth-child(5){left:50%; top:6%; animation-delay:4s}
    @keyframes drift{
      0%{transform:translateY(0) translateX(0); opacity:0}
      10%{opacity:1}
      100%{transform:translateY(120px) translateX(18px); opacity:0}
    }
  </style>
</head>
<body>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <main class="card">
    <div class="sparkles">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="sun"></div>
    <div class="cat">🐱</div>

    <h1>宝，起床啦。</h1>
    <p>太阳都已经把被窝照得暖乎乎了，你再赖床，早晨都会替你着急。<br>今天也要把自己慢慢哄醒，先喝口水，再把眼睛睁开一点点。</p>

    <div class="row">
      <button class="wake" onclick="document.getElementById('msg').textContent='好，命运的齿轮开始转动了。先坐起来，伸个懒腰，今天会比想象中顺一点。'">我起床了</button>
      <button class="nap" onclick="document.getElementById('msg').textContent='只准再赖床5分钟。真的，5分钟后就起来，别跟早晨玩文字游戏。'">再赖床5分钟</button>
    </div>

    <div class="tip" id="msg">来，先把被子掀开一角，世界就没那么可怕了。</div>
    <p class="tiny">给困困宝的早安小程序，专治起床困难症。</p>
  </main>
</body>
</html>
