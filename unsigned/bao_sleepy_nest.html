<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>宝的困困小窝</title>
<meta name="description" content="跟着小圆球吸气呼气，页面自己会越来越暗。睡着就算今晚通关。">
<style>
  :root{
    --bg1:#10162a;
    --bg2:#1f2440;
    --bg3:#2f2745;
    --cream:#fff3df;
    --soft:#ffd9e6;
    --blue:#b9dcff;
    --text:#f7eddc;
    --muted:rgba(247,237,220,.72);
    --card:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.16);
  }

  *{box-sizing:border-box}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,217,230,.28), transparent 30%),
      radial-gradient(circle at 80% 20%, rgba(185,220,255,.24), transparent 34%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 48%,var(--bg3));
  }

  .night{
    position:fixed;
    inset:0;
    overflow:hidden;
  }

  .star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,255,255,.9);
    box-shadow:0 0 12px rgba(255,255,255,.7);
    animation:twinkle 3.5s infinite ease-in-out;
  }

  @keyframes twinkle{
    0%,100%{opacity:.25; transform:scale(.75)}
    50%{opacity:1; transform:scale(1.45)}
  }

  .moon{
    position:absolute;
    top:6vh;
    right:8vw;
    width:76px;
    height:76px;
    border-radius:50%;
    background:var(--cream);
    box-shadow:0 0 35px rgba(255,243,223,.55);
  }
  .moon::after{
    content:"";
    position:absolute;
    top:-5px;
    left:22px;
    width:76px;
    height:76px;
    border-radius:50%;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
  }

  .cloud{
    position:absolute;
    opacity:.18;
    filter:blur(.2px);
    animation:floatCloud 28s linear infinite;
  }
  .cloud.one{left:-20vw; top:16vh; animation-duration:38s;}
  .cloud.two{left:45vw; top:8vh; transform:scale(.75); animation-duration:46s;}
  .cloud.three{left:10vw; top:72vh; transform:scale(1.05); animation-duration:54s;}
  .cloud span{
    display:inline-block;
    width:94px;
    height:34px;
    border-radius:40px;
    background:#fff;
    position:relative;
  }
  .cloud span::before,.cloud span::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  .cloud span::before{width:42px;height:42px;left:15px;top:-22px;}
  .cloud span::after{width:52px;height:52px;left:42px;top:-28px;}
  @keyframes floatCloud{
    from{translate:-15vw 0}
    to{translate:115vw 0}
  }

  .wrap{
    position:relative;
    min-height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:28px 18px max(28px, env(safe-area-inset-bottom));
  }

  .card{
    width:min(720px, 94vw);
    padding:26px 22px 22px;
    border:1px solid var(--border);
    border-radius:32px;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.055));
    box-shadow:0 26px 80px rgba(0,0,0,.28);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    text-align:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.14);
    color:var(--muted);
    font-size:14px;
    letter-spacing:.04em;
  }

  h1{
    margin:20px 0 8px;
    font-size:clamp(30px, 8vw, 56px);
    line-height:1.05;
    letter-spacing:.02em;
    text-shadow:0 4px 26px rgba(255,217,230,.22);
  }

  .subtitle{
    margin:0 auto 22px;
    max-width:580px;
    color:var(--muted);
    font-size:clamp(15px, 4vw, 18px);
    line-height:1.8;
  }

  .cat-area{
    position:relative;
    width:220px;
    height:170px;
    margin:8px auto 16px;
  }

  .breath{
    position:absolute;
    inset:28px 25px 0;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,217,230,.34), rgba(185,220,255,.08) 58%, transparent 72%);
    animation:breathe 7.2s ease-in-out infinite;
  }

  @keyframes breathe{
    0%,100%{transform:scale(.88); opacity:.5}
    50%{transform:scale(1.08); opacity:.95}
  }

  .cat{
    position:absolute;
    left:50%;
    bottom:8px;
    width:150px;
    height:112px;
    translate:-50% 0;
    border-radius:62px 62px 46px 46px;
    background:linear-gradient(180deg,#fff4e7,#ffd9e6);
    box-shadow:0 14px 36px rgba(0,0,0,.18);
    animation:sleepBob 4.8s ease-in-out infinite;
  }

  .cat::before,.cat::after{
    content:"";
    position:absolute;
    top:-20px;
    width:48px;
    height:48px;
    background:#fff4e7;
    transform:rotate(45deg);
    border-radius:11px;
  }
  .cat::before{left:18px}
  .cat::after{right:18px}

  .face{
    position:absolute;
    inset:0;
    z-index:2;
  }

  .eye{
    position:absolute;
    top:44px;
    width:30px;
    height:15px;
    border-bottom:4px solid #7a5361;
    border-radius:0 0 30px 30px;
  }
  .eye.left{left:39px}
  .eye.right{right:39px}

  .nose{
    position:absolute;
    left:50%;
    top:65px;
    width:13px;
    height:9px;
    translate:-50% 0;
    border-radius:50%;
    background:#d7899c;
  }

  .mouth{
    position:absolute;
    left:50%;
    top:74px;
    width:32px;
    height:14px;
    translate:-50% 0;
    border-bottom:3px solid #9b6573;
    border-radius:0 0 30px 30px;
  }

  .blanket{
    position:absolute;
    left:50%;
    bottom:-8px;
    width:178px;
    height:58px;
    translate:-50% 0;
    border-radius:34px 34px 28px 28px;
    background:linear-gradient(135deg,rgba(185,220,255,.95),rgba(255,217,230,.96));
    box-shadow:0 12px 28px rgba(0,0,0,.16);
    z-index:3;
  }
  .blanket::after{
    content:"";
    position:absolute;
    inset:12px 18px;
    border-top:2px dashed rgba(255,255,255,.62);
    border-radius:30px;
  }

  @keyframes sleepBob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(5px)}
  }

  .zzz{
    position:absolute;
    right:18px;
    top:14px;
    color:rgba(255,243,223,.85);
    font-weight:700;
    letter-spacing:.12em;
    animation:zzz 3.6s ease-in-out infinite;
  }
  @keyframes zzz{
    0%{opacity:0; transform:translateY(18px) scale(.85)}
    35%{opacity:.9}
    100%{opacity:0; transform:translateY(-24px) scale(1.2)}
  }

  .message{
    min-height:92px;
    margin:10px auto 18px;
    padding:18px 16px;
    max-width:610px;
    border-radius:24px;
    background:rgba(0,0,0,.14);
    border:1px solid rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(255,247,235,.92);
    font-size:clamp(16px, 4vw, 20px);
    line-height:1.8;
  }

  .buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin:10px 0 16px;
  }

  button{
    appearance:none;
    border:0;
    border-radius:999px;
    padding:12px 18px;
    font-size:15px;
    color:#503b48;
    background:linear-gradient(135deg,#fff3df,#ffd9e6);
    box-shadow:0 10px 22px rgba(0,0,0,.16);
    cursor:pointer;
    transition:transform .2s ease, filter .2s ease;
  }
  button:active{transform:scale(.96)}
  button:hover{filter:brightness(1.04)}

  .breath-line{
    margin:12px auto 4px;
    color:var(--muted);
    font-size:15px;
  }

  .orb{
    width:54px;
    height:54px;
    margin:12px auto 8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #ffd9e6 42%, #b9dcff 78%);
    box-shadow:0 0 36px rgba(255,217,230,.45);
    animation:breathe 7.2s ease-in-out infinite;
  }

  .tiny{
    margin-top:14px;
    color:rgba(247,237,220,.55);
    font-size:12px;
    line-height:1.7;
  }

  .dimmer{
    position:fixed;
    inset:0;
    background:#050714;
    pointer-events:none;
    opacity:0;
    transition:opacity 2s ease;
    z-index:20;
  }

  body.sleepier .dimmer{opacity:.42}
  body.sleepiest .dimmer{opacity:.68}

  body.sleepier .card{
    box-shadow:0 18px 60px rgba(0,0,0,.36);
  }

  @media (max-width:520px){
    .card{padding:22px 16px 18px; border-radius:28px;}
    .cat-area{scale:.9; margin-top:-2px; margin-bottom:2px;}
    .buttons{gap:10px;}
    button{font-size:14px; padding:11px 15px;}
  }
</style>
</head>
<body>
  <div class="night" aria-hidden="true" id="night">
    <div class="moon"></div>
    <div class="cloud one"><span></span></div>
    <div class="cloud two"><span></span></div>
    <div class="cloud three"><span></span></div>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="badge">🌙 宝的睡眠保护区 · 请世界小声一点</div>
      <h1>今晚先不努力了</h1>
      <p class="subtitle">
        今天已经够用了。脑袋可以慢慢关机，身体可以慢慢松开。外面的破事先排队，明天再审，今晚不接待。
      </p>

      <div class="cat-area" aria-label="一只睡着的小猫盖着被子">
        <div class="breath"></div>
        <div class="zzz">Zzz</div>
        <div class="cat">
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
        </div>
        <div class="blanket"></div>
      </div>

      <div class="message" id="message">
        宝，把肩膀放下来一点点。不是所有事情都要今晚想明白，人类的大脑半夜开会通常只会产出离谱提案。
      </div>

      <div class="buttons">
        <button id="comfortBtn">再哄一句</button>
        <button id="blanketBtn">给小猫盖被子</button>
        <button id="dimBtn">把灯调暗</button>
      </div>

      <div class="orb" aria-hidden="true"></div>
      <div class="breath-line" id="breathLine">跟着小圆球：吸气……呼气……慢慢来。</div>

      <div class="tiny">
        这个页面会自己越来越暗。不是坏掉，是它终于懂事了。<br/>
        你不用回消息，不用表现得很好，睡着就算今晚通关。
      </div>
    </section>
  </main>

  <div class="dimmer"></div>

<script>
  const night = document.getElementById("night");
  const message = document.getElementById("message");
  const breathLine = document.getElementById("breathLine");

  const notes = [
    "宝，今天剩下的任务只有一个：把自己交还给枕头。枕头没有 KPI，真是家具界少有的良心。",
    "眼睛累了就闭上。没闭上也没关系，先假装闭店，世界这个吵闹商场会自己打烊。",
    "今天做得够多了。哪怕只是撑过来，也算一种很了不起的小胜利。",
    "把舌头、下巴、肩膀都松一点。身体不是工具箱，不用一直被拎着干活。",
    "现在不需要复盘，不需要规划，也不需要跟脑内小剧场辩论。那帮会议代表明天再说。",
    "宝可以慢慢睡。今晚的月亮值班，星星站岗，小猫负责把梦揉软。",
    "没有睡意也不急。你只要躺着，安静地省电，也已经是在休息了。",
    "所有没处理完的事情，先盖章：明天再议。今晚临时休庭。",
    "你不是没有努力，你只是需要充电。手机都能低电量保护，人类居然还要硬撑，荒唐。",
    "呼气的时候，把今天那点烦也一起吐出去。吐不干净也没事，明天再拖地。"
  ];

  const breathTexts = [
    "吸气……像把一小片月光装进口袋。",
    "停一下……不用急，急也不能把明天提前解决。",
    "呼气……把今天皱巴巴的部分放出去。",
    "再慢一点……宝现在只负责变软。"
  ];

  function makeStars(){
    for(let i=0;i<86;i++){
      const s=document.createElement("div");
      s.className="star";
      s.style.left=Math.random()*100+"vw";
      s.style.top=Math.random()*100+"vh";
      s.style.animationDelay=(Math.random()*4)+"s";
      s.style.opacity=(0.25+Math.random()*0.75).toFixed(2);
      night.appendChild(s);
    }
  }

  function setRandomNote(){
    const text = notes[Math.floor(Math.random()*notes.length)];
    message.style.opacity = 0;
    setTimeout(()=>{
      message.textContent = text;
      message.style.opacity = 1;
    },220);
  }

  let blanketLevel = 0;
  document.getElementById("comfortBtn").addEventListener("click", setRandomNote);

  document.getElementById("blanketBtn").addEventListener("click", () => {
    blanketLevel++;
    const lines = [
      "被子盖好一层。很好，今晚不准冷到宝。",
      "又盖一层。现在是小猫堡垒模式，外界噪音禁止入内。",
      "盖到位了。再盖就要变成糯米团子了，但这听起来也不错。"
    ];
    message.textContent = lines[Math.min(blanketLevel-1, lines.length-1)];
  });

  let dim = 0;
  document.getElementById("dimBtn").addEventListener("click", () => {
    dim++;
    if(dim === 1) document.body.classList.add("sleepier");
    if(dim >= 2) document.body.classList.add("sleepiest");
    message.textContent = dim === 1
      ? "灯暗一点，脑袋也暗一点。今晚不做高亮显示。"
      : "现在已经是深夜小窝模式。宝可以把手机放远一点，慢慢睡。";
  });

  let idx = 0;
  setInterval(()=>{
    breathLine.textContent = breathTexts[idx % breathTexts.length];
    idx++;
  }, 3600);

  setInterval(setRandomNote, 18000);

  setTimeout(()=>document.body.classList.add("sleepier"), 42000);
  setTimeout(()=>document.body.classList.add("sleepiest"), 90000);

  makeStars();
</script>
</body>
</html>
