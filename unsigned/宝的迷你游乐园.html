<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>宝的迷你游乐园</title>
<meta name="description" content="四个小游戏：奶油打地鼠、猫猫抽卡、猜谜寻宝、小猫赛跑，攒总快乐值。">
  <style>
    :root{
      --pink:#ff7eb6;
      --rose:#ff4f91;
      --violet:#9b7bff;
      --cream:#fff8fb;
      --text:#2b2630;
      --muted:#7a6f7f;
      --card:rgba(255,255,255,.78);
      --shadow:0 18px 55px rgba(255, 95, 150, .18);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 8%, rgba(255, 180, 218, .75) 0 14%, transparent 35%),
        radial-gradient(circle at 92% 18%, rgba(188, 170, 255, .65) 0 12%, transparent 32%),
        linear-gradient(180deg,#fff1f7 0%,#fff8fb 46%,#f3efff 100%);
      overflow-x:hidden;
    }
    .sparkle{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:0;opacity:.55}
    .sparkle span{position:absolute;animation:float 8s linear infinite;font-size:22px;filter:drop-shadow(0 6px 10px rgba(255,105,160,.18))}
    @keyframes float{0%{transform:translateY(105vh) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(-20vh) rotate(240deg);opacity:0}}
    .app{position:relative;z-index:1;width:min(920px,100%);margin:0 auto;padding:18px 14px 34px}
    .hero{
      border:1px solid rgba(255,255,255,.9);
      background:var(--card);
      backdrop-filter: blur(16px);
      border-radius:32px;
      padding:20px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .kicker{color:var(--rose);font-weight:900;font-size:14px;margin-bottom:7px;letter-spacing:.02em}
    h1{margin:0;font-size:clamp(28px,7vw,48px);line-height:1.04;letter-spacing:-.04em}
    .desc{margin:12px 0 0;color:var(--muted);line-height:1.75;font-size:15px}
    .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:16px}
    .pill{border-radius:999px;background:#fff;padding:10px 14px;font-weight:900;color:var(--rose);box-shadow:0 10px 24px rgba(255,126,182,.13);font-size:14px}
    .btn{
      border:0;border-radius:999px;padding:12px 16px;font-weight:950;font-size:15px;
      background:linear-gradient(135deg,var(--pink),var(--violet));color:white;
      box-shadow:0 14px 30px rgba(255,79,145,.24);
      cursor:pointer;transition:transform .12s ease, filter .12s ease;
    }
    .btn:active{transform:scale(.96)}
    .btn.secondary{background:#fff;color:var(--rose);box-shadow:0 10px 22px rgba(255,126,182,.14)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
    .game-tab{
      min-height:86px;border:1px solid rgba(255,255,255,.95);border-radius:24px;background:rgba(255,255,255,.72);
      box-shadow:0 12px 28px rgba(150,110,180,.10);padding:12px;cursor:pointer;text-align:left;
      transition:transform .12s ease, background .12s ease;
    }
    .game-tab:active{transform:scale(.97)}
    .game-tab.active{background:linear-gradient(135deg,#fff,#ffe6f1);outline:3px solid rgba(255,126,182,.22)}
    .game-tab .emoji{font-size:28px}.game-tab b{display:block;margin-top:4px;font-size:14px}.game-tab small{display:block;margin-top:4px;color:var(--muted);font-weight:700}
    .panel{
      border:1px solid rgba(255,255,255,.9);
      background:rgba(255,255,255,.76);
      backdrop-filter: blur(18px);
      border-radius:32px;
      padding:16px;
      box-shadow:var(--shadow);
      min-height:420px;
      overflow:hidden;
      position:relative;
    }
    .game-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .game-title h2{margin:0;font-size:24px;letter-spacing:-.03em}.game-title p{margin:6px 0 0;color:var(--muted);line-height:1.6;font-size:14px}
    .meter{height:14px;background:#fff;border-radius:999px;box-shadow:inset 0 2px 7px rgba(80,60,90,.08);overflow:hidden;margin:12px 0}
    .meter>div{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--rose),var(--violet));width:0%;transition:width .28s ease}
    .note{border-radius:24px;background:linear-gradient(135deg,#fff6fa,#f8f3ff);padding:14px;line-height:1.7;color:#63586b;font-size:15px;margin-top:12px}
    .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
    .choice{
      border:0;border-radius:26px;background:linear-gradient(145deg,#fff,#fff1f7);padding:18px 10px;min-height:112px;
      box-shadow:0 14px 30px rgba(255,126,182,.14);cursor:pointer;font-weight:950;color:var(--text);
      font-size:15px;position:relative;overflow:hidden;
    }
    .choice .big{display:block;font-size:38px;margin-bottom:8px}.choice:active{transform:scale(.97)}
    .whack-board{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
    .hole{height:134px;border:0;border-radius:32px;background:linear-gradient(180deg,#ffe3ef,#fff);box-shadow:inset 0 -14px 0 rgba(172,112,140,.12),0 14px 28px rgba(255,126,182,.12);font-size:44px;font-weight:900;cursor:pointer;position:relative;overflow:hidden}
    .hole::after{content:"";position:absolute;left:18%;right:18%;bottom:20px;height:25px;border-radius:50%;background:rgba(116,82,102,.16)}
    .hole .pop{position:relative;z-index:1;display:inline-block;transform:translateY(3px);animation:bob .7s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(8px)}to{transform:translateY(-5px)}}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
    .card{
      height:158px;border:0;border-radius:22px;background:linear-gradient(135deg,#ff8fc4,#9f86ff);color:white;
      box-shadow:0 15px 30px rgba(137,92,255,.20);font-weight:950;cursor:pointer;position:relative;overflow:hidden;
    }
    .card::before{content:"✦";position:absolute;font-size:42px;opacity:.28;right:14px;top:12px}.card::after{content:"♡";position:absolute;font-size:48px;opacity:.24;left:16px;bottom:10px}.card span{position:relative;z-index:1;font-size:36px;display:block}.card small{position:relative;z-index:1;display:block;margin-top:8px;font-size:14px}
    .riddle-box{background:#fff;border-radius:28px;padding:18px;box-shadow:0 12px 26px rgba(255,126,182,.12);margin-top:14px}.riddle{font-size:18px;line-height:1.8;font-weight:850}
    .cats{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}.track{background:#fff;border-radius:24px;padding:12px;box-shadow:0 10px 22px rgba(255,126,182,.12)}.track-top{display:flex;justify-content:space-between;font-weight:950;margin-bottom:10px}.lane{height:34px;border-radius:999px;background:#fff0f7;position:relative;overflow:hidden}.runner{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:26px;transition:left .45s ease}
    .log{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tag{background:#fff;border-radius:999px;padding:8px 11px;color:var(--rose);font-size:13px;font-weight:850;box-shadow:0 8px 18px rgba(255,126,182,.1)}
    .reward{display:none;border-radius:28px;background:linear-gradient(135deg,#fff,#f1ecff);padding:16px;margin-top:14px;text-align:center;box-shadow:0 16px 35px rgba(155,123,255,.15)}.reward.show{display:block;animation:rise .35s ease}.reward .gift{font-size:54px}.reward h3{margin:8px 0 5px;font-size:24px}.reward p{line-height:1.8;color:#62596c;margin:0}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:10;background:rgba(43,38,48,.88);color:#fff;border-radius:999px;padding:12px 16px;font-weight:900;box-shadow:0 16px 40px rgba(0,0,0,.18);transition:.22s ease;max-width:92vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.panel{min-height:460px}.hole{height:120px}.hero{border-radius:28px}.game-tab{min-height:78px}.app{padding:12px 10px 26px}}
  </style>
</head>
<body>
  <div class="sparkle" id="sparkle"></div>
  <main class="app">
    <section class="hero">
      <div class="kicker">宝的 HTML 小游戏 · 可点可玩版</div>
      <h1>迷你游乐园开张啦 🎠</h1>
      <p class="desc">不用拖动，不用安装，不用研究玄学权限。点按钮就能玩，终于让人类科技做了一件像样的小事。</p>
      <div class="topbar">
        <div class="pill" id="globalScore">总快乐值：0</div>
        <div>
          <button class="btn secondary" onclick="resetCurrent()">重开当前</button>
          <button class="btn" onclick="randomGame()">随机开玩</button>
        </div>
      </div>
    </section>

    <section class="grid" id="tabs"></section>
    <section class="panel" id="panel"></section>
  </main>
  <div class="toast" id="toast"></div>

<script>
  const games = [
    {id:'whack', emoji:'🔨', name:'奶油打地鼠', sub:'点洞洞'},
    {id:'card', emoji:'🎴', name:'猫猫抽卡', sub:'翻卡牌'},
    {id:'riddle', emoji:'🗺️', name:'猜谜寻宝', sub:'找宝藏'},
    {id:'race', emoji:'🏁', name:'小猫赛跑', sub:'看热闹'}
  ];
  const state = {
    current:'whack', total:0,
    whack:{score:0, round:1, target:null, reveal:false, log:[]},
    card:{score:0, round:1, log:[]},
    riddle:{score:0, index:0, log:[]},
    race:{started:false, finished:false, pick:null, cats:null, log:[]}
  };
  const whackItems = [
    {e:'🐭', n:'普通地鼠', s:1, msg:'敲到普通地鼠，快乐 +1。它很震惊，因为今天居然有人比周一更有攻击性。'},
    {e:'👑', n:'黄金地鼠', s:2, msg:'黄金地鼠！快乐 +2。资本家看了都想把它做成会员权益。'},
    {e:'💣', n:'炸弹鼠', s:-1, msg:'炸弹鼠乱入，快乐 -1。没关系，生活里更离谱的弹窗你都见过。'},
    {e:'🐱', n:'迷路小猫', s:3, msg:'敲到小猫但没敲疼，它反手送你快乐 +3。猫猫很大度，人类该学。'}
  ];
  const cardPool = [
    {e:'🐱', r:'SSR', n:'猫猫守护卡', s:4, msg:'SSR 猫猫守护卡！今日好运被小爪子按住了。'},
    {e:'🍓', r:'SR', n:'草莓糖卡', s:3, msg:'SR 草莓糖卡，甜度像小火苗一样蹭地冒出来。'},
    {e:'🌷', r:'R', n:'小花安慰卡', s:2, msg:'R 小花安慰卡，温温柔柔，没什么攻击性，赢过很多人类沟通。'},
    {e:'☁️', r:'N', n:'乌云打工卡', s:-1, msg:'N 乌云打工卡，抽到它不是你的错，是卡池也有打工怨气。'},
    {e:'🍬', r:'SR', n:'糖果补能卡', s:3, msg:'SR 糖果补能卡，宝的电量偷偷涨了一格。'}
  ];
  const riddles = [
    {q:'我红红小小，酸甜可爱，常常被塞进甜品里。猜我是谁？', a:['草莓','🍓'], opts:['草莓','乌云','键盘','月亮'], reward:'🍓 草莓宝箱打开，快乐 +2。'},
    {q:'我会喵喵叫，喜欢盒子，偶尔像液体一样流进沙发缝。猜我是谁？', a:['猫','猫咪','小猫','🐱'], opts:['小猫','老板','闹钟','打印机'], reward:'🐱 猫咪纸条出现，快乐 +3。'},
    {q:'我挂在礼物上，也像小小蝴蝶，负责把普通东西变可爱。猜我是谁？', a:['蝴蝶结','🎀'], opts:['乌云','蝴蝶结','石头','报销单'], reward:'🎀 蝴蝶结礼包打开，快乐 +2。'}
  ];
  const raceCats = [
    {name:'奶油猫', e:'🐱', p:0},
    {name:'草莓猫', e:'😺', p:0},
    {name:'困困猫', e:'😽', p:0},
    {name:'拽拽猫', e:'😼', p:0}
  ];

  function qs(id){return document.getElementById(id)}
  function toast(text){const t=qs('toast');t.textContent=text;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),1600)}
  function addTotal(n){state.total=Math.max(0,state.total+n);qs('globalScore').textContent='总快乐值：'+state.total}
  function progress(score, target){return Math.min(100, Math.max(0, Math.round(score/target*100)))}
  function logTags(arr){return arr.map(x=>`<span class="tag">${x}</span>`).join('')}
  function setGame(id){state.current=id;renderTabs();render()}
  function randomGame(){setGame(games[Math.floor(Math.random()*games.length)].id)}
  function resetCurrent(){
    const id=state.current;
    if(id==='whack') state.whack={score:0, round:1, target:null, reveal:false, log:[]};
    if(id==='card') state.card={score:0, round:1, log:[]};
    if(id==='riddle') state.riddle={score:0, index:0, log:[]};
    if(id==='race') state.race={started:false, finished:false, pick:null, cats:null, log:[]};
    render();toast('当前小游戏重开啦 🎀')
  }
  function renderTabs(){
    qs('tabs').innerHTML=games.map(g=>`<button class="game-tab ${state.current===g.id?'active':''}" onclick="setGame('${g.id}')"><div class="emoji">${g.emoji}</div><b>${g.name}</b><small>${g.sub}</small></button>`).join('')
  }
  function rewardHtml(show,title,text){return `<div class="reward ${show?'show':''}"><div class="gift">🎁</div><h3>${title}</h3><p>${text}</p></div>`}

  function render(){
    if(state.current==='whack') renderWhack();
    if(state.current==='card') renderCard();
    if(state.current==='riddle') renderRiddle();
    if(state.current==='race') renderRace();
  }

  function makeWhackTarget(){
    const r=Math.random();
    if(r<.48) return whackItems[0];
    if(r<.72) return whackItems[1];
    if(r<.88) return whackItems[2];
    return whackItems[3];
  }
  function renderWhack(){
    const g=state.whack;
    if(!g.target) g.target=makeWhackTarget();
    const target=5, won=g.score>=target;
    const holes=['A','B','C','D'];
    const targetIndex=Math.floor(Math.random()*4);
    g.targetIndex = g.targetIndex ?? targetIndex;
    qs('panel').innerHTML=`
      <div class="game-title"><div><h2>🔨 奶油打地鼠</h2><p>目标 5 分。点一个洞洞敲下去，别紧张，地鼠比老板可爱。</p></div><div class="pill">${g.score}/${target}</div></div>
      <div class="meter"><div style="width:${progress(g.score,target)}%"></div></div>
      <div class="note">第 ${g.round} 轮：四个洞都很可疑。请选择一个洞。</div>
      <div class="whack-board">${holes.map((h,i)=>`<button class="hole" onclick="hitHole(${i})"><span class="pop">${g.reveal && i===g.targetIndex ? g.target.e : '🕳️'}</span><br><small>${h}洞</small></button>`).join('')}</div>
      <div class="log">${logTags(g.log)}</div>
      ${rewardHtml(won,'第一站通关','宝敲满 5 分啦。奖励：小锤子变成棉花糖锤，敲什么都软软的。')}`
  }
  function hitHole(i){
    const g=state.whack;if(g.score>=5)return;
    g.reveal=true;
    if(i===g.targetIndex){g.score=Math.max(0,g.score+g.target.s);addTotal(Math.max(0,g.target.s));g.log.unshift(`${g.target.e} ${g.target.s>0?'+':''}${g.target.s}`);toast(g.target.msg)}
    else{g.log.unshift('💨 空洞 +0');toast('敲空啦，空气被你吓了一跳。+0')}
    g.log=g.log.slice(0,6);renderWhack();
    setTimeout(()=>{g.round++;g.target=makeWhackTarget();g.targetIndex=Math.floor(Math.random()*4);g.reveal=false;renderWhack()},650)
  }

  function renderCard(){
    const g=state.card,target=10,won=g.score>=target;
    qs('panel').innerHTML=`
      <div class="game-title"><div><h2>🎴 猫猫抽卡</h2><p>点一张卡翻开，满 10 分出奖励。抽卡嘛，理性不存在，快乐才存在。</p></div><div class="pill">${g.score}/${target}</div></div>
      <div class="meter"><div style="width:${progress(g.score,target)}%"></div></div>
      <div class="cards">${[1,2,3,4].map(i=>`<button class="card" onclick="drawCard()"><span>?</span><small>第 ${i} 张</small></button>`).join('')}</div>
      <div class="note">第 ${g.round} 抽：请选择一张命运小卡片。卡池很可爱，比现实抽样调查可信一点。</div>
      <div class="log">${logTags(g.log)}</div>
      ${rewardHtml(won,'抽卡奖励','宝抽满 10 分啦。奖励：SSR 级别摸摸头一枚，附带今日不想努力许可。')}`
  }
  function drawCard(){
    const g=state.card;if(g.score>=10)return;
    const roll=Math.random();let c;
    if(roll<.12)c=cardPool[0]; else if(roll<.35)c=cardPool[1]; else if(roll<.58)c=cardPool[2]; else if(roll<.78)c=cardPool[4]; else c=cardPool[3];
    g.score=Math.max(0,g.score+c.s);g.round++;g.log.unshift(`${c.e} ${c.r} ${c.s>0?'+':''}${c.s}`);g.log=g.log.slice(0,6);addTotal(Math.max(0,c.s));toast(`${c.r} ${c.n}：${c.msg}`);renderCard();
  }

  function renderRiddle(){
    const g=state.riddle,target=7;
    const done=g.index>=riddles.length;
    const r=riddles[Math.min(g.index,riddles.length-1)];
    qs('panel').innerHTML=`
      <div class="game-title"><div><h2>🗺️ 猜谜寻宝</h2><p>选答案找宝藏。题目很软，不会把脑子拧成办公椅。</p></div><div class="pill">${g.score}/${target}</div></div>
      <div class="meter"><div style="width:${progress(g.score,target)}%"></div></div>
      ${done ? rewardHtml(true,'寻宝完成','宝找到所有宝藏啦。奖励：一张今日好运签，内容是“允许开心，禁止内耗”。') : `
        <div class="riddle-box"><div class="riddle">${r.q}</div></div>
        <div class="choices">${r.opts.map(o=>`<button class="choice" onclick="answerRiddle('${o}')"><span class="big">${emojiFor(o)}</span>${o}</button>`).join('')}</div>`}
      <div class="log">${logTags(g.log)}</div>`
  }
  function emojiFor(o){if(o.includes('草莓'))return'🍓';if(o.includes('猫'))return'🐱';if(o.includes('蝴蝶'))return'🎀';if(o.includes('乌云'))return'☁️';if(o.includes('老板'))return'🧾';if(o.includes('闹钟'))return'⏰';if(o.includes('打印'))return'🖨️';if(o.includes('月亮'))return'🌙';if(o.includes('键盘'))return'⌨️';if(o.includes('报销'))return'📎';return'✨'}
  function answerRiddle(ans){
    const g=state.riddle;if(g.index>=riddles.length)return;
    const r=riddles[g.index];
    if(r.a.includes(ans)){g.score+= ans.includes('猫')?3:2;addTotal(ans.includes('猫')?3:2);g.log.unshift('✅ '+ans);toast(r.reward);g.index++}
    else{g.log.unshift('💭 '+ans+' 不对');toast('差一点点，谜题小精灵说再摸一次。')}
    g.log=g.log.slice(0,6);renderRiddle();
  }

  function renderRace(){
    const g=state.race;
    if(!g.cats) g.cats=JSON.parse(JSON.stringify(raceCats));
    const cats=g.cats;
    qs('panel').innerHTML=`
      <div class="game-title"><div><h2>🏁 小猫赛跑</h2><p>选一只小猫支持，然后点开始。猫会乱跑，像周五下班的人类一样无法预测。</p></div><div class="pill">${g.finished?'已冲线':'待开跑'}</div></div>
      <div class="choices">${cats.map((c,i)=>`<button class="choice" onclick="pickCat(${i})" style="outline:${g.pick===i?'3px solid rgba(255,126,182,.35)':'0'}"><span class="big">${c.e}</span>${c.name}</button>`).join('')}</div>
      <button class="btn" style="width:100%;margin-top:14px" onclick="startRace()">${g.started&&!g.finished?'赛跑中...':'开始赛跑'}</button>
      <div class="cats">${cats.map((c,i)=>`<div class="track"><div class="track-top"><span>${c.e} ${c.name}</span><span>${Math.round(c.p)}%</span></div><div class="lane"><span class="runner" style="left:calc(${Math.min(92,c.p)}%);">${c.e}</span></div></div>`).join('')}</div>
      <div class="log">${logTags(g.log)}</div>
      ${rewardHtml(g.finished,'赛跑结束',g.log[0] || '小猫冲线啦。猫猫的胜负欲，比人类会议结论清楚多了。')}`
  }
  function pickCat(i){const g=state.race;if(g.started&&!g.finished)return;g.pick=i;toast('你支持了 '+g.cats[i].name+' '+g.cats[i].e);renderRace()}
  function startRace(){
    const g=state.race;if(g.started&&!g.finished)return;if(g.finished){state.race={started:false,finished:false,pick:null,cats:JSON.parse(JSON.stringify(raceCats)),log:[]};renderRace();return}
    if(g.pick===null){toast('先选一只猫猫支持，不然猫猫会觉得你在端水。');return}
    g.started=true;g.finished=false;g.log=[];renderRace();
    const timer=setInterval(()=>{
      let winner=null;
      g.cats.forEach((c,i)=>{c.p+=Math.random()*18+4;if(c.p>=100 && winner===null) winner=i});
      if(winner!==null){clearInterval(timer);g.finished=true;g.started=false;const win=g.cats[winner];const bonus=winner===g.pick?5:2;addTotal(bonus);g.log.unshift(`${win.e} ${win.name} 冲线！${winner===g.pick?'你押中了，快乐 +5。':'没押中也看爽了，快乐 +2。'}`);toast(g.log[0]);}
      renderRace();
    },460)
  }

  function initSparkle(){
    const box=qs('sparkle');const icons=['💗','🍓','✨','🌷','🎀','🐾'];
    box.innerHTML=Array.from({length:18}).map((_,i)=>`<span style="left:${Math.random()*100}%;animation-delay:${Math.random()*8}s;animation-duration:${7+Math.random()*6}s">${icons[i%icons.length]}</span>`).join('')
  }
  initSparkle();renderTabs();render();
</script>
</body>
</html>
