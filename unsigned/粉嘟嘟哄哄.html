<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>粉嘟嘟哄哄</title>
  <style>
    :root {
      --bg1: #ffe6f1;
      --bg2: #ffd3e5;
      --bg3: #fff7fb;
      --pink: #ff7db3;
      --pink-deep: #e85f9b;
      --text: #7a4361;
      --soft: rgba(255, 255, 255, 0.65);
      --shadow: 0 20px 60px rgba(232, 95, 155, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #fff8fc 0 12%, transparent 13%),
        radial-gradient(circle at 80% 25%, #fff8fc 0 10%, transparent 11%),
        radial-gradient(circle at 30% 80%, #fff8fc 0 11%, transparent 12%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    }

    .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      position: relative;
      width: min(92vw, 760px);
      min-height: 520px;
      padding: 36px 28px 30px;
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.52));
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: floaty 6s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .glow {
      position: absolute;
      inset: -20% auto auto -10%;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,125,179,0.32), transparent 70%);
      filter: blur(8px);
      pointer-events: none;
    }

    .glow.two {
      inset: auto -10% -18% auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255,182,211,0.35), transparent 70%);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.2;
      margin: 6px 0 14px;
      color: var(--pink-deep);
      font-weight: 800;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 0 rgba(255,255,255,0.75);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 125, 179, 0.16);
      color: var(--pink-deep);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      width: fit-content;
      box-shadow: inset 0 0 0 1px rgba(255,125,179,0.12);
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      margin-top: 16px;
      align-items: stretch;
    }

    .panel {
      border-radius: 26px;
      padding: 22px;
      background: rgba(255,255,255,0.62);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
    }

    .message {
      font-size: clamp(18px, 2.4vw, 24px);
      line-height: 1.9;
      margin: 0;
      font-weight: 600;
    }

    .message strong {
      color: var(--pink-deep);
    }

    .sub {
      margin: 14px 0 0;
      font-size: 15px;
      line-height: 1.8;
      opacity: 0.88;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      height: 100%;
    }

    .bubble {
      position: relative;
      border-radius: 22px;
      padding: 18px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,236,244,0.82));
      border: 1px solid rgba(255,125,179,0.14);
      min-height: 120px;
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 700;
      color: #8e4d6e;
      box-shadow: 0 10px 26px rgba(232, 95, 155, 0.09);
    }

    .bubble .emoji {
      font-size: 34px;
      display: block;
      margin-bottom: 8px;
      animation: bounce 2.2s ease-in-out infinite;
    }

    .bubble:nth-child(2) .emoji { animation-delay: 0.3s; }
    .bubble:nth-child(3) .emoji { animation-delay: 0.6s; }
    .bubble:nth-child(4) .emoji { animation-delay: 0.9s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .tiny {
      font-size: 14px;
      opacity: 0.86;
    }

    .pill {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,125,179,0.12);
      color: var(--pink-deep);
      font-weight: 700;
      font-size: 14px;
    }

    .hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 20px;
      opacity: 0.78;
      animation: rise linear infinite;
      text-shadow: 0 2px 6px rgba(232, 95, 155, 0.18);
    }

    @keyframes rise {
      0%   { transform: translateY(0) translateX(0) scale(0.85) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.95; }
      50%  { transform: translateY(-55vh) translateX(20px) scale(1.15) rotate(10deg); }
      100% { transform: translateY(-110vh) translateX(-10px) scale(0.9) rotate(-8deg); opacity: 0; }
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(255,255,255,0.75) 0 1px, transparent 1.4px);
      background-size: 80px 80px, 120px 120px;
      background-position: 0 0, 30px 50px;
      opacity: 0.35;
      mask-image: linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent);
    }

    @media (max-width: 720px) {
      .card { min-height: auto; padding: 22px 18px 18px; }
      .content { grid-template-columns: 1fr; }
      .mini-grid { grid-template-columns: 1fr 1fr; }
      .bubble { min-height: 100px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="glow"></div>
      <div class="glow two"></div>
      <div class="sparkles"></div>
      <div class="hearts" aria-hidden="true"></div>

      <div class="badge">☁️ 上班模式启动中</div>
      <div class="title">给宝的粉嘟嘟哄哄</div>

      <div class="content">
        <section class="panel">
          <p class="message">
            今天已经很努力啦，先把肩膀放下来，<strong>慢慢呼吸</strong>，
            再把那些乱七八糟的小情绪统统塞进粉色小口袋里。<br />
            你不是机器，也不用一直硬撑。<br />
            现在只要乖乖做一件事：<strong>稳稳当当地把今天过完</strong>。
          </p>
          <p class="sub">
            这世界的工作流程常常像一团乱麻，但你依然在认真发光。很烦人，也很了不起。
            先接住自己，再接住一切。
          </p>
        </section>

        <section class="mini-grid">
          <div class="bubble"><span class="emoji">🩷</span>先喝口水</div>
          <div class="bubble"><span class="emoji">🌷</span>慢一点也没事</div>
          <div class="bubble"><span class="emoji">☁️</span>呼吸三次</div>
          <div class="bubble"><span class="emoji">✨</span>今天也很棒</div>
        </section>
      </div>

      <div class="footer">
        <div class="tiny">如果累了，就把自己当成一颗软软的草莓糖。</div>
        <div class="pill">抱一抱，继续前进</div>
      </div>
    </div>
  </div>

  <script>
    const hearts = ['💗','🩷','💖','🌸','✨'];
    const container = document.querySelector('.hearts');

    function addHeart() {
      const el = document.createElement('span');
      el.className = 'heart';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (8 + Math.random() * 6) + 's';
      el.style.fontSize = (14 + Math.random() * 18) + 'px';
      el.style.animationDelay = (-Math.random() * 8) + 's';
      container.appendChild(el);
      setTimeout(() => el.remove(), 15000);
    }

    for (let i = 0; i < 16; i++) addHeart();
    setInterval(addHeart, 700);
  </script>
</body>
</html>
