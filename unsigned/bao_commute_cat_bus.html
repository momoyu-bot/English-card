<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宝在路上啦</title>
<style>
  :root{
    --bg1:#ffe0ef;
    --bg2:#e7f7ff;
    --pink:#ff78ad;
    --rose:#ff9bc5;
    --text:#5d3849;
    --cream:#fffaf2;
    --yellow:#ffe680;
    --mint:#b9f5df;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 18% 18%, rgba(255,255,255,.9) 0 5%, transparent 6%),
      radial-gradient(circle at 82% 12%, rgba(255,230,128,.9) 0 8%, transparent 9%),
      linear-gradient(135deg,var(--bg1),#fff8fb 48%,var(--bg2));
    overflow:hidden;
  }

  .cloud{
    position:fixed;
    width:120px;
    height:40px;
    border-radius:999px;
    background:rgba(255,255,255,.78);
    filter:drop-shadow(0 8px 18px rgba(110,78,91,.08));
    animation: drift 18s linear infinite;
  }
  .cloud:before,.cloud:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:inherit;
  }
  .cloud:before{ width:54px; height:54px; left:18px; top:-25px; }
  .cloud:after{ width:64px; height:64px; right:20px; top:-34px; }
  .c1{ left:-150px; top:12%; animation-delay:0s; }
  .c2{ left:-220px; top:28%; transform:scale(.72); animation-delay:6s; }
  .c3{ left:-170px; top:72%; transform:scale(.9); animation-delay:11s; }

  @keyframes drift{
    to{ transform:translateX(calc(100vw + 260px)); }
  }

  .card{
    width:min(820px,100%);
    position:relative;
    padding:32px 22px 28px;
    border-radius:38px;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(16px);
    border:2px solid rgba(255,255,255,.88);
    box-shadow:0 28px 80px rgba(255,120,173,.22);
    text-align:center;
    overflow:hidden;
  }

  .badge{
    display:inline-flex;
    gap:8px;
    align-items:center;
    padding:9px 16px;
    border-radius:999px;
    background:#fff1f7;
    border:1px solid rgba(255,120,173,.28);
    font-weight:800;
    color:#8a4b63;
    margin-bottom:12px;
  }

  h1{
    margin:0;
    font-size:clamp(32px,7vw,58px);
    letter-spacing:.03em;
  }

  .subtitle{
    margin:12px auto 22px;
    max-width:610px;
    font-size:clamp(16px,3.4vw,21px);
    line-height:1.75;
  }

  .road-wrap{
    position:relative;
    height:285px;
    margin:10px auto 22px;
    max-width:700px;
    border-radius:32px;
    background:
      linear-gradient(to bottom, transparent 0 48%, rgba(255,255,255,.25) 49% 52%, transparent 53%),
      linear-gradient(180deg,#dff7ff 0%,#fff8df 45%,#ffd3e5 100%);
    border:2px solid rgba(255,255,255,.85);
    overflow:hidden;
    box-shadow:inset 0 -14px 28px rgba(255,120,173,.08);
  }

  .sun{
    position:absolute;
    top:22px;
    right:36px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 34px rgba(255,226,117,.85);
    animation:sunpop 2.6s ease-in-out infinite;
  }

  @keyframes sunpop{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }

  .hill{
    position:absolute;
    bottom:54px;
    width:360px;
    height:96px;
    background:rgba(185,245,223,.72);
    border-radius:50% 50% 0 0;
  }
  .h1{ left:-70px; }
  .h2{ right:-100px; background:rgba(255,241,171,.72); height:120px; }

  .road{
    position:absolute;
    left:-20px;
    right:-20px;
    bottom:0;
    height:86px;
    background:#6f5c66;
    border-top:8px solid rgba(255,255,255,.65);
  }

  .line{
    position:absolute;
    bottom:39px;
    width:90px;
    height:8px;
    border-radius:999px;
    background:#fff4a8;
    animation: lines 1.05s linear infinite;
  }
  .line:nth-child(1){ left:5%; }
  .line:nth-child(2){ left:35%; animation-delay:.18s; }
  .line:nth-child(3){ left:66%; animation-delay:.36s; }

  @keyframes lines{
    from{ transform:translateX(80px); opacity:0; }
    25%,75%{ opacity:1; }
    to{ transform:translateX(-170px); opacity:0; }
  }

  .bus{
    position:absolute;
    left:50%;
    bottom:42px;
    width:260px;
    height:126px;
    transform:translateX(-50%);
    animation:bounce 1.8s ease-in-out infinite;
  }

  @keyframes bounce{
    0%,100%{ transform:translateX(-50%) translateY(0) rotate(-.6deg); }
    50%{ transform:translateX(-50%) translateY(-7px) rotate(.6deg); }
  }

  .bus-body{
    position:absolute;
    bottom:20px;
    width:100%;
    height:92px;
    background:linear-gradient(180deg,#fff,#ffe9f2);
    border:5px solid var(--text);
    border-radius:36px 36px 25px 25px;
    box-shadow:0 13px 0 rgba(93,56,73,.08);
  }

  .bus-front{
    position:absolute;
    right:-4px;
    bottom:20px;
    width:58px;
    height:92px;
    background:#ffc0d9;
    border:5px solid var(--text);
    border-left:none;
    border-radius:0 32px 24px 0;
  }

  .window{
    position:absolute;
    top:20px;
    width:58px;
    height:38px;
    border:4px solid var(--text);
    border-radius:14px;
    background:#bfeeff;
  }
  .w1{ left:28px; }
  .w2{ left:96px; }
  .w3{ left:164px; width:42px; background:#ffe8a3; }

  .cat-face{
    position:absolute;
    left:105px;
    top:22px;
    width:44px;
    height:34px;
    z-index:3;
  }
  .cat-face:before,.cat-face:after{
    content:"";
    position:absolute;
    top:-8px;
    width:15px;
    height:15px;
    background:#fff;
    border:3px solid var(--text);
    transform:rotate(45deg);
    border-radius:4px;
  }
  .cat-face:before{ left:5px; }
  .cat-face:after{ right:5px; }

  .cat-head{
    position:absolute;
    inset:0;
    background:#fff;
    border:3px solid var(--text);
    border-radius:45% 45% 50% 50%;
  }
  .cat-eye{
    position:absolute;
    top:13px;
    width:5px;
    height:5px;
    background:var(--text);
    border-radius:50%;
    z-index:4;
  }
  .cat-eye.left{ left:13px; }
  .cat-eye.right{ right:13px; }
  .cat-mouth{
    position:absolute;
    left:50%;
    top:20px;
    width:16px;
    height:8px;
    transform:translateX(-50%);
    border-bottom:3px solid var(--text);
    border-radius:50%;
    z-index:4;
  }

  .wheel{
    position:absolute;
    bottom:0;
    width:49px;
    height:49px;
    background:#4a3740;
    border:6px solid var(--text);
    border-radius:50%;
    animation: roll .8s linear infinite;
  }
  .wheel:after{
    content:"";
    position:absolute;
    inset:9px;
    border-radius:50%;
    background:#fff4a8;
  }
  .wheel.left{ left:42px; }
  .wheel.right{ right:45px; }

  @keyframes roll{
    to{ transform:rotate(360deg); }
  }

  .exhaust{
    position:absolute;
    left:calc(50% - 178px);
    bottom:85px;
    font-size:24px;
    opacity:.55;
    animation:puff 1.5s ease-in-out infinite;
  }

  @keyframes puff{
    from{ transform:translateX(0) scale(.8); opacity:0; }
    45%{ opacity:.65; }
    to{ transform:translateX(-42px) translateY(-12px) scale(1.4); opacity:0; }
  }

  .talk{
    display:inline-block;
    max-width:650px;
    margin:0 auto 18px;
    padding:14px 20px;
    border-radius:999px;
    background:#fff1f7;
    border:2px dashed rgba(255,120,173,.65);
    font-weight:800;
    line-height:1.55;
  }

  .mini-board{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:12px;
    max-width:680px;
    margin:0 auto 20px;
  }

  .note{
    padding:14px 12px;
    background:rgba(255,255,255,.72);
    border-radius:22px;
    border:1px solid rgba(255,120,173,.25);
    box-shadow:0 10px 24px rgba(93,56,73,.06);
    line-height:1.5;
  }

  .note b{
    display:block;
    font-size:24px;
    margin-bottom:4px;
  }

  button{
    border:none;
    appearance:none;
    cursor:pointer;
    border-radius:999px;
    padding:15px 24px;
    background:linear-gradient(135deg,#ff78ad,#ffaed0);
    color:white;
    font-size:18px;
    font-weight:900;
    box-shadow:0 14px 28px rgba(255,120,173,.34);
    transition:.18s ease;
  }

  button:hover{ transform:translateY(-2px) scale(1.02); }
  button:active{ transform:translateY(1px) scale(.99); }

  .message{
    min-height:36px;
    margin-top:17px;
    font-size:18px;
    font-weight:800;
    color:#7b4559;
    line-height:1.55;
  }

  .footer{
    margin-top:12px;
    font-size:13px;
    opacity:.72;
  }

  .pop{
    position:fixed;
    pointer-events:none;
    z-index:99;
    transition:900ms ease;
  }

  @media (max-width:620px){
    body{ padding:16px; }
    .card{ border-radius:30px; padding:27px 15px 24px; }
    .road-wrap{ height:255px; }
    .bus{ transform:translateX(-50%) scale(.83); transform-origin:bottom center; }
    @keyframes bounce{
      0%,100%{ transform:translateX(-50%) scale(.83) translateY(0) rotate(-.6deg); }
      50%{ transform:translateX(-50%) scale(.83) translateY(-7px) rotate(.6deg); }
    }
    .mini-board{ grid-template-columns:1fr; }
    .talk{ border-radius:24px; }
  }
</style>
</head>
<body>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <main class="card">
    <div class="badge">🚌 通勤小猫护送中</div>
    <h1>宝已经出发啦！</h1>
    <p class="subtitle">
      从床上逃出来已经是今日第一场胜利。现在只需要把自己安全运到工位，
      至于精神状态，先让它在路上缓冲，别催它，灵魂也不是高铁。
    </p>

    <section class="road-wrap" aria-label="小猫巴士正在送宝去上班">
      <div class="sun"></div>
      <div class="hill h1"></div>
      <div class="hill h2"></div>

      <div class="bus">
        <div class="bus-body">
          <div class="window w1"></div>
          <div class="window w2">
            <div class="cat-face">
              <div class="cat-head"></div>
              <div class="cat-eye left"></div>
              <div class="cat-eye right"></div>
              <div class="cat-mouth"></div>
            </div>
          </div>
          <div class="window w3"></div>
        </div>
        <div class="bus-front"></div>
        <div class="wheel left"></div>
        <div class="wheel right"></div>
      </div>

      <div class="exhaust">♡</div>
      <div class="road">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
      </div>
    </section>

    <div class="talk">
      今日通勤咒语：我可以慢慢清醒，可以不完美，但我已经在路上了，特别厉害。
    </div>

    <div class="mini-board">
      <div class="note"><b>🌸</b>到了先喝水，让身体知道你没有抛弃它</div>
      <div class="note"><b>☁️</b>困就先低功耗运行，别硬装神仙</div>
      <div class="note"><b>🍞</b>能吃点早餐就吃点，人类电池太落后了</div>
    </div>

    <button id="btn">给路上的宝加一点糖 ✨</button>
    <div class="message" id="msg">小猫巴士已启动：目的地是“勉强但可爱地上班”。</div>
    <div class="footer">今天不用一上来就发光，先到达就很好。小猫已经给你贴了勇敢贴纸。</div>
  </main>

<script>
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  const cheers = [
    "宝在路上这件事本身就很棒，困困也可以很勇敢。",
    "今天先别追求满格电量，30%也能撑到第一杯水。",
    "小猫说：上班可以，内耗不可以，谁内耗谁去扫猫砂。",
    "你已经从被窝副本通关了，后面的怪都只是小怪。",
    "到了公司先慢慢坐下，不用立刻变成营业型人类。",
    "今天的目标很朴素：平安抵达，温柔活着，顺便赚钱。"
  ];

  btn.addEventListener("click", () => {
    msg.textContent = cheers[Math.floor(Math.random() * cheers.length)];

    const rect = btn.getBoundingClientRect();
    for(let i=0; i<16; i++){
      const pop = document.createElement("span");
      pop.className = "pop";
      pop.textContent = ["♡","🌸","✨","🍬","🐾"][Math.floor(Math.random()*5)];
      pop.style.left = rect.left + rect.width / 2 + "px";
      pop.style.top = rect.top + rect.height / 2 + "px";
      pop.style.fontSize = (15 + Math.random() * 17) + "px";
      document.body.appendChild(pop);

      requestAnimationFrame(() => {
        pop.style.transform = `translate(${(Math.random()-.5)*210}px, ${-55-Math.random()*120}px) rotate(${Math.random()*120-60}deg)`;
        pop.style.opacity = "0";
      });

      setTimeout(() => pop.remove(), 950);
    }
  });
</script>
</body>
</html>
