<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上班路上的困困小猫补给站</title>
<meta name="description" content="困困加饿饿还得上班。先找点吃的，喝两口水，走慢点。">
<style>
  :root{
    --pink:#ffd6e7;
    --cream:#fff7ea;
    --lav:#e9ddff;
    --text:#5b3b4a;
    --accent:#ff8fbd;
    --soft:#fff0f7;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 12%, #fff 0 8%, transparent 9%),
      radial-gradient(circle at 85% 18%, #fff6c7 0 7%, transparent 8%),
      linear-gradient(135deg, var(--cream), var(--pink) 48%, var(--lav));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  .float{
    position:absolute;
    opacity:.5;
    animation: drift 8s ease-in-out infinite;
    font-size:26px;
  }
  .f1{left:9%; top:16%; animation-delay:0s}
  .f2{right:10%; top:20%; animation-delay:1.4s}
  .f3{left:14%; bottom:18%; animation-delay:2.5s}
  .f4{right:14%; bottom:15%; animation-delay:.7s}
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-18px) rotate(6deg)}
  }
  .card{
    width:min(680px, 100%);
    background:rgba(255,255,255,.72);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:32px;
    box-shadow:0 20px 70px rgba(150,82,116,.22);
    padding:30px 24px;
    text-align:center;
    position:relative;
  }
  .cat{
    width:145px;
    height:120px;
    margin:0 auto 8px;
    position:relative;
  }
  .head{
    width:118px;
    height:92px;
    background:#fff;
    border:4px solid #7a5362;
    border-radius:48% 48% 45% 45%;
    position:absolute;
    left:14px;
    bottom:0;
  }
  .ear{
    width:38px;
    height:38px;
    background:#fff;
    border:4px solid #7a5362;
    position:absolute;
    top:17px;
    transform:rotate(45deg);
    border-radius:9px;
  }
  .ear.left{left:16px}
  .ear.right{right:16px}
  .ear::after{
    content:"";
    width:18px;height:18px;
    background:#ffd2e1;
    position:absolute;
    left:6px;top:6px;
    border-radius:6px;
  }
  .eye{
    position:absolute;
    width:13px;height:13px;
    background:#7a5362;
    border-radius:50%;
    top:45px;
    animation: blink 4s infinite;
  }
  .eye.left{left:34px}
  .eye.right{right:34px}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    95%{transform:scaleY(.12)}
  }
  .nose{
    position:absolute;
    left:50%;
    top:59px;
    transform:translateX(-50%);
    width:10px;height:8px;
    background:#ff8fbd;
    border-radius:50%;
  }
  .mouth{
    position:absolute;
    left:50%;
    top:68px;
    width:28px;height:13px;
    transform:translateX(-50%);
    border-bottom:3px solid #7a5362;
    border-radius:0 0 20px 20px;
  }
  .cheek{
    position:absolute;
    top:62px;
    width:18px;height:10px;
    background:#ffd7e7;
    border-radius:50%;
  }
  .cheek.left{left:20px}
  .cheek.right{right:20px}
  h1{
    margin:8px 0 10px;
    font-size:clamp(28px, 7vw, 42px);
    line-height:1.1;
    letter-spacing:.5px;
  }
  .subtitle{
    font-size:17px;
    line-height:1.75;
    margin:0 auto 20px;
    max-width:540px;
  }
  .pill{
    display:inline-flex;
    gap:8px;
    align-items:center;
    background:var(--soft);
    border:1px solid #ffe0ec;
    border-radius:999px;
    padding:9px 14px;
    margin:6px;
    font-size:15px;
  }
  .box{
    background:rgba(255,247,250,.85);
    border:1px dashed #ffb6d2;
    border-radius:22px;
    padding:18px;
    margin:18px auto 0;
    text-align:left;
    max-width:540px;
  }
  .box p{
    margin:8px 0;
    line-height:1.7;
  }
  button{
    appearance:none;
    border:0;
    background:linear-gradient(135deg, #ff9ec7, #c9a8ff);
    color:#fff;
    font-weight:700;
    border-radius:999px;
    padding:13px 20px;
    font-size:16px;
    box-shadow:0 10px 24px rgba(186,107,158,.25);
    margin-top:18px;
    cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  .toast{
    min-height:30px;
    margin-top:16px;
    font-weight:700;
    color:#8a4c68;
  }
  .tiny{
    font-size:13px;
    opacity:.72;
    margin-top:16px;
  }
</style>
</head>
<body>
  <div class="float f1">🥐</div>
  <div class="float f2">☁️</div>
  <div class="float f3">🧋</div>
  <div class="float f4">✨</div>

  <main class="card">
    <div class="cat" aria-label="一只困困小猫">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
    </div>

    <h1>宝，上班路上先别被饿扁 🥺</h1>
    <p class="subtitle">
      今日人类续航模式：<b>困困 + 饿饿 + 还得上班</b>。<br>
      太离谱了，身体都在抗议，资本主义还在打卡。
    </p>

    <div>
      <span class="pill">🍞 到工位先找点吃的</span>
      <span class="pill">💧 喝两口水，别让灵魂干巴</span>
      <span class="pill">🐾 走慢点，小猫优先通行</span>
    </div>

    <section class="box">
      <p>亲亲宝，今天不用一上来就开满功率。</p>
      <p>先把自己投喂一下，哪怕是面包、酸奶、鸡蛋、坚果，随便塞点能让大脑不再发出“我要下线”的警报。</p>
      <p>到公司以后，先坐下，缓三分钟。世界不会因为你慢三分钟就崩塌，虽然它平时表现得很像随时要崩。</p>
    </section>

    <button onclick="feed()">领取一份路上小猫补给</button>
    <div class="toast" id="toast"></div>

    <div class="tiny">今日咒语：先吃一口，再拯救工作。顺序别反，人类老爱反着来，真是麻烦。🌷</div>
  </main>

<script>
  const lines = [
    "已发放：热乎乎精神面包一枚 🍞",
    "已发放：小猫拍拍头服务 3 次 🐾",
    "已发放：到工位吃早餐许可证 ✅",
    "已发放：今天慢慢来也不会被宇宙扣分券 🌙",
    "已发放：困困宝专属保护罩，抵御早八邪气 ✨"
  ];
  let i = 0;
  function feed(){
    document.getElementById("toast").textContent = lines[i % lines.length];
    i++;
  }
</script>
</body>
</html>
