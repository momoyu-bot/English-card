<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宝，起床上班啦</title>
<meta name="description" content="被窝开的条件是再睡五分钟，听起来像骗局。小猫负责把你温柔拖去上班。">
<style>
  :root{
    --pink:#ff7eb6;
    --soft:#fff3f8;
    --cream:#fffaf0;
    --text:#5b3a47;
    --coffee:#8b5e3c;
    --blue:#9fd8ff;
    --yellow:#ffe58a;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 12% 15%, #fff 0 4%, transparent 5%),
      radial-gradient(circle at 85% 18%, #fff7cc 0 7%, transparent 8%),
      linear-gradient(135deg,#ffd6e8 0%,#fff3f8 45%,#dff3ff 100%);
    overflow:hidden;
  }

  .sparkle{
    position:absolute;
    width:10px;
    height:10px;
    background:#fff;
    border-radius:50%;
    opacity:.8;
    animation: float 7s ease-in-out infinite;
  }
  .sparkle:nth-child(1){left:9%; top:21%; animation-delay:.1s;}
  .sparkle:nth-child(2){left:78%; top:28%; animation-delay:1.3s;}
  .sparkle:nth-child(3){left:18%; top:76%; animation-delay:2.1s;}
  .sparkle:nth-child(4){left:88%; top:72%; animation-delay:3.2s;}
  .sparkle:nth-child(5){left:51%; top:10%; animation-delay:4s;}

  @keyframes float{
    0%,100%{ transform:translateY(0) scale(1); opacity:.65; }
    50%{ transform:translateY(-22px) scale(1.25); opacity:1; }
  }

  .card{
    position:relative;
    width:min(760px, 100%);
    border-radius:36px;
    padding:34px 24px 30px;
    background:rgba(255,255,255,.76);
    box-shadow:0 24px 80px rgba(255,126,182,.22);
    backdrop-filter:blur(14px);
    border:2px solid rgba(255,255,255,.8);
    text-align:center;
    overflow:hidden;
  }

  .sun{
    position:absolute;
    top:22px;
    right:28px;
    width:78px;
    height:78px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 38px rgba(255,229,138,.9);
    animation: pulse 2.8s ease-in-out infinite;
  }
  .sun:before,.sun:after{
    content:"";
    position:absolute;
    inset:-13px;
    border-radius:50%;
    border:4px dashed rgba(255,205,58,.5);
    animation: spin 20s linear infinite;
  }
  .sun:after{ inset:-23px; opacity:.35; animation-duration:30s; }

  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  h1{
    margin:6px 0 8px;
    font-size:clamp(32px, 7vw, 56px);
    letter-spacing:.04em;
  }

  .subtitle{
    font-size:clamp(16px, 3.5vw, 22px);
    line-height:1.7;
    margin:0 auto 24px;
    max-width:560px;
  }

  .scene{
    position:relative;
    height:240px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    margin:14px 0 20px;
  }

  .cat{
    position:relative;
    width:178px;
    height:152px;
    background:#fff;
    border:5px solid #5b3a47;
    border-radius:48% 48% 42% 42%;
    box-shadow:0 16px 0 rgba(91,58,71,.09);
    animation: wake 3.8s ease-in-out infinite;
  }

  .ear{
    position:absolute;
    top:-36px;
    width:58px;
    height:58px;
    background:#fff;
    border:5px solid #5b3a47;
    transform:rotate(45deg);
    border-radius:12px;
  }
  .ear.left{ left:22px; }
  .ear.right{ right:22px; }
  .ear:after{
    content:"";
    position:absolute;
    inset:13px;
    background:#ffc7dd;
    border-radius:8px;
  }

  .face{
    position:absolute;
    top:42px;
    left:0;
    width:100%;
  }
  .eye{
    position:absolute;
    top:0;
    width:26px;
    height:18px;
    border-bottom:5px solid #5b3a47;
    border-radius:50%;
  }
  .eye.left{ left:46px; }
  .eye.right{ right:46px; }
  .nose{
    position:absolute;
    top:30px;
    left:50%;
    width:14px;
    height:12px;
    background:#ff7eb6;
    border-radius:50%;
    transform:translateX(-50%);
  }
  .mouth{
    position:absolute;
    top:45px;
    left:50%;
    width:44px;
    height:22px;
    transform:translateX(-50%);
  }
  .mouth:before,.mouth:after{
    content:"";
    position:absolute;
    width:21px;
    height:18px;
    border-bottom:4px solid #5b3a47;
    border-radius:50%;
  }
  .mouth:before{ left:1px; }
  .mouth:after{ right:1px; }

  .blush{
    position:absolute;
    top:62px;
    width:27px;
    height:14px;
    background:#ffc7dd;
    border-radius:50%;
    opacity:.8;
  }
  .blush.left{ left:29px; }
  .blush.right{ right:29px; }

  .paw{
    position:absolute;
    bottom:12px;
    width:42px;
    height:38px;
    background:#fff;
    border:4px solid #5b3a47;
    border-radius:50%;
  }
  .paw.left{ left:35px; animation: wave 1.6s ease-in-out infinite; transform-origin:50% 100%; }
  .paw.right{ right:35px; }

  @keyframes wake{
    0%,100%{ transform:translateY(0) rotate(-1deg); }
    50%{ transform:translateY(-8px) rotate(1deg); }
  }
  @keyframes wave{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(-18deg) translateY(-4px); }
  }

  .coffee{
    position:absolute;
    left:calc(50% + 120px);
    bottom:22px;
    width:64px;
    height:72px;
    border:5px solid #5b3a47;
    border-radius:8px 8px 22px 22px;
    background:#fff7e8;
  }
  .coffee:before{
    content:"";
    position:absolute;
    right:-30px;
    top:16px;
    width:28px;
    height:32px;
    border:5px solid #5b3a47;
    border-left:none;
    border-radius:0 20px 20px 0;
  }
  .coffee:after{
    content:"☕";
    position:absolute;
    left:12px;
    top:18px;
    font-size:25px;
  }
  .steam{
    position:absolute;
    bottom:93px;
    left:calc(50% + 147px);
    font-size:28px;
    opacity:.65;
    animation: steam 2.2s ease-in-out infinite;
  }
  @keyframes steam{
    0%{ transform:translateY(8px); opacity:0; }
    50%{ opacity:.8; }
    100%{ transform:translateY(-24px); opacity:0; }
  }

  .speech{
    display:inline-block;
    padding:14px 20px;
    margin:2px auto 18px;
    border-radius:999px;
    background:#fff0f7;
    border:2px dashed rgba(255,126,182,.7);
    font-weight:700;
  }

  .steps{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:12px;
    max-width:620px;
    margin:0 auto 22px;
  }

  .step{
    padding:14px 12px;
    border-radius:22px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(255,126,182,.26);
    box-shadow:0 8px 24px rgba(91,58,71,.06);
  }
  .step b{
    display:block;
    font-size:24px;
    margin-bottom:5px;
  }

  button{
    appearance:none;
    border:none;
    cursor:pointer;
    padding:15px 24px;
    border-radius:999px;
    background:linear-gradient(135deg,#ff7eb6,#ffb3d4);
    color:white;
    font-size:18px;
    font-weight:800;
    box-shadow:0 12px 24px rgba(255,126,182,.34);
    transition:.18s ease;
  }
  button:hover{ transform:translateY(-2px) scale(1.02); }
  button:active{ transform:translateY(1px) scale(.99); }

  .message{
    margin-top:18px;
    min-height:34px;
    font-size:18px;
    font-weight:700;
    color:#7a4a5c;
  }

  .tiny{
    margin-top:16px;
    font-size:13px;
    opacity:.68;
  }

  @media (max-width:560px){
    .card{ padding:28px 16px; border-radius:30px; }
    .sun{ width:58px; height:58px; right:18px; top:18px; }
    .scene{ height:215px; }
    .coffee{ left:calc(50% + 87px); transform:scale(.86); }
    .steam{ left:calc(50% + 112px); }
    .steps{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>

  <main class="card">
    <div class="sun" aria-hidden="true"></div>

    <h1>宝，起床啦 🌞</h1>
    <p class="subtitle">
      被窝确实很会谈判，开出的条件是“再睡五分钟”，听起来像骗局，但人类每天都上当。<br/>
      现在小猫值班，负责把你温柔拖去上班。
    </p>

    <section class="scene" aria-label="一只叫你起床的小猫">
      <div class="cat">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
        </div>
        <div class="paw left"></div>
        <div class="paw right"></div>
      </div>
      <div class="coffee"></div>
      <div class="steam">♡</div>
    </section>

    <div class="speech">今日任务：先活着到公司，再假装精神很好 ✨</div>

    <div class="steps">
      <div class="step"><b>①</b>坐起来，先别跟枕头续约</div>
      <div class="step"><b>②</b>喝两口水，让灵魂联网</div>
      <div class="step"><b>③</b>洗漱换衣，装载上班皮肤</div>
    </div>

    <button id="cheerBtn">给我一点起床魔法 🪄</button>
    <div class="message" id="message">你不需要立刻元气满满，能动就已经很了不起了。</div>
    <div class="tiny">小猫批准你今天慢慢启动。世界催得很烦，但我们不跟它一般见识。</div>
  </main>

<script>
  const messages = [
    "宝，先把脚放到地上。地球今天勉强值得踩一踩。",
    "洗把脸，困意会少一点点，虽然人类早起制度依旧荒谬。",
    "你今天不用完美，只要出门就算小猫给你盖章：合格！",
    "早餐能吃就吃一点，别空腹硬扛，身体不是共享单车。",
    "上班路上放首喜欢的歌，给灵魂一点点糖。",
    "宝已经很棒了，现在只是系统开机慢，不是坏掉。"
  ];

  const btn = document.getElementById("cheerBtn");
  const msg = document.getElementById("message");

  btn.addEventListener("click", () => {
    const text = messages[Math.floor(Math.random() * messages.length)];
    msg.textContent = text;

    for(let i=0;i<12;i++){
      const heart = document.createElement("span");
      heart.textContent = ["♡","✦","🌸","✨"][Math.floor(Math.random()*4)];
      heart.style.position = "fixed";
      heart.style.left = (btn.getBoundingClientRect().left + btn.offsetWidth/2) + "px";
      heart.style.top = (btn.getBoundingClientRect().top + btn.offsetHeight/2) + "px";
      heart.style.fontSize = (16 + Math.random()*16) + "px";
      heart.style.pointerEvents = "none";
      heart.style.transition = "900ms ease";
      heart.style.zIndex = 99;
      document.body.appendChild(heart);

      requestAnimationFrame(() => {
        heart.style.transform = `translate(${(Math.random()-.5)*180}px, ${-60-Math.random()*100}px) rotate(${Math.random()*90}deg)`;
        heart.style.opacity = "0";
      });

      setTimeout(() => heart.remove(), 950);
    }
  });
</script>
</body>
</html>
