<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>给宝的上班续命小符咒</title>
<meta name="description" content="能做完的慢慢做，做不完的也不会把天捅漏。戳一下领续命摸摸。">
<style>
  :root {
    --bg1: #fff1f7;
    --bg2: #ffe8cc;
    --card: rgba(255, 255, 255, 0.72);
    --text: #5b3a42;
    --soft: #9b6b78;
    --pink: #ff8fbd;
    --peach: #ffb38a;
    --cream: #fffaf2;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 15%, #ffffff 0 8%, transparent 18%),
      radial-gradient(circle at 85% 20%, #ffd9ec 0 9%, transparent 22%),
      radial-gradient(circle at 10% 90%, #ffe1b8 0 12%, transparent 25%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    overflow: hidden;
  }

  .sparkle {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.9) 0 2px, transparent 3px),
      radial-gradient(circle, rgba(255,143,189,.55) 0 2px, transparent 3px);
    background-size: 90px 90px, 130px 130px;
    animation: drift 14s linear infinite;
    opacity: .65;
  }

  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-90px); }
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
  }

  .card {
    width: min(720px, 94vw);
    padding: 38px 30px 32px;
    border-radius: 34px;
    background: var(--card);
    backdrop-filter: blur(18px);
    box-shadow:
      0 22px 70px rgba(154, 87, 104, 0.18),
      inset 0 0 0 1px rgba(255,255,255,.75);
    text-align: center;
    animation: breathe 4.8s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-5px) scale(1.01); }
  }

  .cat {
    width: 118px;
    height: 98px;
    margin: 0 auto 16px;
    position: relative;
  }

  .head {
    position: absolute;
    left: 14px;
    top: 20px;
    width: 90px;
    height: 68px;
    background: var(--cream);
    border-radius: 44px 44px 34px 34px;
    box-shadow: 0 8px 22px rgba(143, 86, 103, .18);
  }

  .ear {
    position: absolute;
    top: 8px;
    width: 34px;
    height: 34px;
    background: var(--cream);
    transform: rotate(45deg);
    border-radius: 8px;
  }

  .ear.left { left: 20px; }
  .ear.right { right: 20px; }

  .eye {
    position: absolute;
    top: 46px;
    width: 9px;
    height: 13px;
    background: #66414b;
    border-radius: 50%;
    animation: blink 5s infinite;
  }

  .eye.left { left: 42px; }
  .eye.right { right: 42px; }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.12); }
  }

  .nose {
    position: absolute;
    top: 59px;
    left: 55px;
    width: 8px;
    height: 6px;
    background: var(--pink);
    border-radius: 50%;
  }

  .paw {
    display: inline-block;
    margin: 0 3px;
    animation: paw 1.8s ease-in-out infinite;
  }

  .paw:nth-child(2) { animation-delay: .25s; }

  @keyframes paw {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(8deg) translateY(-4px); }
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 7vw, 52px);
    letter-spacing: .04em;
    color: #6a3e4a;
  }

  .subtitle {
    margin: 14px auto 0;
    max-width: 560px;
    font-size: clamp(16px, 3.7vw, 20px);
    line-height: 1.75;
    color: var(--soft);
  }

  .spell {
    margin: 26px auto 0;
    padding: 18px 20px;
    width: min(520px, 100%);
    border-radius: 24px;
    background: rgba(255, 250, 242, .82);
    border: 1px solid rgba(255, 168, 190, .45);
    font-size: clamp(17px, 4vw, 22px);
    line-height: 1.8;
  }

  .tiny {
    margin-top: 24px;
    font-size: 14px;
    color: #a57680;
  }

  button {
    margin-top: 22px;
    border: 0;
    border-radius: 999px;
    padding: 13px 22px;
    background: linear-gradient(135deg, var(--pink), var(--peach));
    color: white;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 10px 24px rgba(255, 143, 189, .38);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(255, 143, 189, .48);
  }

  .message {
    margin-top: 18px;
    min-height: 32px;
    font-size: 16px;
    color: #7a4d59;
  }

  .float {
    position: fixed;
    bottom: -40px;
    font-size: 24px;
    animation: floatUp 8s linear infinite;
    opacity: .72;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: .75; }
    to { transform: translateY(-110vh) rotate(18deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="sparkle"></div>

  <main>
    <section class="card">
      <div class="cat" aria-label="一只正在认真哄宝的小猫">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="head"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
      </div>

      <h1>宝，今天也辛苦啦</h1>

      <p class="subtitle">
        先把肩膀放下来，眉头也松一点。世界已经够会添乱了，
        不差你这一点紧绷来帮它完成 KPI。
      </p>

      <div class="spell">
        <span class="paw">🐾</span><span class="paw">🐾</span><br>
        今日上班保护咒：<br>
        <strong>能做完的慢慢做，做不完的也不会把天捅漏。</strong><br>
        你只是来换小钱钱，不是来拯救土豆服务器。
      </div>

      <button onclick="comfort()">戳一下，领取续命摸摸</button>
      <div class="message" id="message"></div>

      <div class="tiny">
        小猫值班中：负责把宝从“被工作腌入味”状态里捞出来。🍑
      </div>
    </section>
  </main>

<script>
  const messages = [
    "摸摸头。今天的宝已经很努力了，证据是还没把电脑扔进海里。",
    "喝口水，眨眨眼，灵魂先从工位底下捡回来。",
    "工作可以急，宝不可以被榨干。人类公司真是会发明刑具。",
    "现在先呼吸三次：吸气，呼气，再把讨厌的事缩小成一粒芝麻。",
    "今日任务：活着下班。其余都是支线剧情。"
  ];

  function comfort() {
    const box = document.getElementById("message");
    box.textContent = messages[Math.floor(Math.random() * messages.length)];
    createFloat();
  }

  function createFloat() {
    const icons = ["🌸", "🐱", "🍓", "✨", "💗", "☁️"];
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("span");
      s.className = "float";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDelay = Math.random() * 1.8 + "s";
      s.style.animationDuration = 6 + Math.random() * 4 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 10000);
    }
  }
</script>
</body>
</html>
