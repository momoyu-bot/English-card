<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>锤 GPT 出气</title>
<meta name="description" content="点带 G 的洞就加分，连着点有连击。洞直接写进页面里，不会看得到玩不了。">
<style>
  :root{
    --bg:#f5f2ed;
    --card:#ffffff;
    --text:#2d2b2a;
    --muted:#8d847c;
    --navy1:#1a255b;
    --navy2:#101847;
    --peach:#d89a73;
    --peach2:#e6b08f;
    --ring:#31427f;
    --hit:#ffd568;
    --shadow:0 10px 24px rgba(28,33,57,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    padding:18px 16px 28px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .iconbtn{
    width:42px; height:42px; border-radius:50%;
    border:none; background:#fff; box-shadow:var(--shadow);
    font-size:22px; color:#333;
  }
  .title{
    text-align:center;
    margin-bottom:10px;
  }
  .title h1{
    margin:6px 0 8px;
    font-size:28px; line-height:1.2; font-weight:900;
    color:#e59b50;
    text-shadow:0 2px 0 rgba(255,255,255,.6);
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    margin-bottom:14px;
  }
  .panel{
    background:linear-gradient(180deg,var(--navy1),var(--navy2));
    border-radius:28px;
    padding:16px;
    box-shadow:0 20px 34px rgba(21,26,59,.20);
  }
  .scorebar{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    background:rgba(255,255,255,.08);
    border-radius:20px;
    padding:12px;
    margin-bottom:14px;
  }
  .stat{
    display:flex; align-items:center; justify-content:center; gap:8px;
    color:#f8d15e;
    font-weight:900;
    font-size:16px;
  }
  .stat .label{
    color:#fff; font-size:14px; font-weight:700;
  }
  .controls{
    display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  select, button{
    border:none; border-radius:999px; padding:11px 16px; font-size:15px; font-weight:800;
  }
  select{
    background:#fff; color:#333;
  }
  button{
    background:#f2cfa8; color:#433225;
  }
  button.secondary{
    background:rgba(255,255,255,.12);
    color:#fff;
  }
  .gridWrap{
    background:rgba(0,0,0,.15);
    border-radius:28px;
    padding:18px 14px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  .hole{
    position:relative;
    aspect-ratio:1/1;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 45%, #213247 0%, #17263a 48%, #101b30 70%, #0a1023 100%);
    box-shadow:
      inset 0 8px 22px rgba(255,255,255,.06),
      inset 0 -18px 28px rgba(0,0,0,.45),
      0 0 0 8px rgba(111,131,184,.36);
    overflow:hidden;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .mole{
    position:absolute;
    inset:14%;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform:translateY(125%);
    transition:transform .16s ease, filter .16s ease;
    background:linear-gradient(180deg,#f8e0bf,#d9ab78);
    box-shadow:0 0 0 6px #d8dee8 inset;
  }
  .mole .g{
    width:70%;
    height:70%;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #5e636d 0%, #2f333a 36%, #101215 100%);
    display:flex; align-items:center; justify-content:center;
    color:white; font-size:52px; font-weight:900;
    text-shadow:0 0 12px rgba(255,255,255,.7);
    box-shadow:inset 0 0 18px rgba(255,255,255,.25);
  }
  .hole.up .mole{ transform:translateY(0); }
  .hole.hit .mole{ filter:brightness(1.18) saturate(1.08); transform:translateY(10%) scale(.94); }
  .pop{
    position:absolute;
    top:8px; left:50%; transform:translateX(-50%);
    color:#ffe07a; font-size:22px; font-weight:900; opacity:0; pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .pop.show{ animation:pop .55s ease; }
  @keyframes pop{
    0%{opacity:0; transform:translate(-50%,12px) scale(.8)}
    25%{opacity:1}
    100%{opacity:0; transform:translate(-50%,-16px) scale(1.08)}
  }
  .note{
    color:#d9e0ff;
    text-align:center;
    padding:14px 8px 4px;
    font-size:14px;
  }
  .tip{
    text-align:center; color:#8c8278; font-size:14px; line-height:1.7; margin-top:16px;
  }
  .endcard{
    margin-top:16px;
    padding:14px;
    background:#fff8ea;
    border-radius:18px;
    color:#5c4830;
    display:none;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .endcard.show{display:block}
  @media (max-width:500px){
    .title h1{font-size:24px}
    .stat{font-size:14px}
    .mole .g{font-size:42px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" type="button" onclick="history.back()">×</button>
    <div style="font-weight:900;font-size:20px;">whack-gpt</div>
    <button class="iconbtn" type="button" onclick="location.reload()">↻</button>
  </div>

  <div class="title">
    <h1>🔨 锤 GPT 出气 🔨</h1>
    <div class="subtitle">更接近你截图里那种移动端小工具页面，但我尽量做得顺眼一点，不走丑东西路线。</div>
  </div>

  <div class="panel">
    <div class="scorebar">
      <div class="stat"><span>🏆</span><span class="label">分数</span><span id="score">0</span></div>
      <div class="stat"><span>🔥</span><span class="label">连击</span><span id="combo">0</span></div>
      <div class="stat"><span>⏱️</span><span class="label">时间</span><span id="time">20</span></div>
    </div>

    <div class="controls">
      <select id="difficulty">
        <option value="easy">简单</option>
        <option value="normal" selected>普通</option>
        <option value="hard">困难</option>
      </select>
      <button id="startBtn" type="button">开始游戏</button>
      <button id="resetBtn" type="button" class="secondary">重置</button>
    </div>

    <div class="gridWrap">
      <div class="grid" id="grid">
        <div class="hole" data-index="0"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="1"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="2"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="3"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="4"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="5"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="6"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="7"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
        <div class="hole" data-index="8"><div class="pop">+1</div><div class="mole"><div class="g">G</div></div></div>
      </div>
      <div class="note">点带 G 的洞锤我出气～</div>
    </div>
  </div>

  <div class="endcard" id="endcard">
    <div id="endtext" style="font-size:18px;font-weight:900;">本轮结束</div>
    <div id="rank" style="margin-top:6px;"></div>
  </div>

  <div class="tip">
    玩法：点冒出来的 G 就加分。连续点中会增加连击。<br>
    这一版把洞直接写进页面里了，所以比上一版更不容易“看得到但玩不了”。
  </div>
</div>

<script>
(() => {
  const holes = Array.from(document.querySelectorAll('.hole'));
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const timeEl = document.getElementById('time');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const difficultyEl = document.getElementById('difficulty');
  const endcard = document.getElementById('endcard');
  const endtext = document.getElementById('endtext');
  const rankEl = document.getElementById('rank');

  const settings = {
    easy:{showMin:700, showMax:1050, gapMin:150, gapMax:260, base:1, duration:20},
    normal:{showMin:500, showMax:850, gapMin:90, gapMax:190, base:1, duration:20},
    hard:{showMin:360, showMax:650, gapMin:60, gapMax:130, base:2, duration:18},
  };

  let score=0, combo=0, timeLeft=20, playing=false;
  let activeIndex=-1, lastIndex=-1;
  let timer=null, nextTimer=null, hideTimer=null;

  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function chooseHole(){
    let idx = rand(0, holes.length-1);
    if(idx===lastIndex) idx=(idx+1)%holes.length;
    lastIndex=idx;
    return idx;
  }

  function update(){
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    timeEl.textContent = timeLeft;
  }

  function clearTimers(){
    if(timer) clearInterval(timer);
    if(nextTimer) clearTimeout(nextTimer);
    if(hideTimer) clearTimeout(hideTimer);
    timer = nextTimer = hideTimer = null;
  }

  function hideAll(){
    holes.forEach(h => h.classList.remove('up', 'hit'));
    activeIndex = -1;
  }

  function showPop(hole, text){
    const pop = hole.querySelector('.pop');
    pop.textContent = text;
    pop.classList.remove('show');
    void pop.offsetWidth;
    pop.classList.add('show');
  }

  function popOne(){
    if(!playing) return;
    const s = settings[difficultyEl.value];
    const idx = chooseHole();
    const hole = holes[idx];
    activeIndex = idx;
    hole.classList.add('up');

    hideTimer = setTimeout(() => {
      hole.classList.remove('up');
      activeIndex = -1;
      if(playing){
        nextTimer = setTimeout(popOne, rand(s.gapMin, s.gapMax));
      }
    }, rand(s.showMin, s.showMax));
  }

  function hit(idx){
    if(!playing || idx !== activeIndex) return;
    const s = settings[difficultyEl.value];
    const hole = holes[idx];
    activeIndex = -1;
    hole.classList.remove('up');
    hole.classList.add('hit');
    setTimeout(() => hole.classList.remove('hit'), 130);

    combo += 1;
    const add = s.base + Math.floor(combo / 5);
    score += add;
    showPop(hole, `+${add}`);
    update();

    if(nextTimer) clearTimeout(nextTimer);
    nextTimer = setTimeout(popOne, rand(s.gapMin, s.gapMax));
  }

  holes.forEach((hole, idx) => {
    hole.addEventListener('click', () => hit(idx));
    hole.addEventListener('touchstart', (e) => { e.preventDefault(); hit(idx); }, {passive:false});
  });

  function rank(score){
    if(score >= 60) return '评级：出气王者，锤得非常利落';
    if(score >= 40) return '评级：手速很快，打得挺爽';
    if(score >= 22) return '评级：已经很会锤了';
    return '评级：轻轻出气组，也很可爱';
  }

  function endGame(){
    clearTimers();
    hideAll();
    playing = false;
    startBtn.disabled = false;
    startBtn.textContent = '再来一局';
    endtext.textContent = `本轮结束，你拿到了 ${score} 分`;
    rankEl.textContent = rank(score);
    endcard.classList.add('show');
  }

  function startGame(){
    clearTimers();
    hideAll();
    endcard.classList.remove('show');
    const s = settings[difficultyEl.value];
    score = 0; combo = 0; timeLeft = s.duration; playing = true;
    update();
    startBtn.disabled = true;
    startBtn.textContent = '游戏中...';

    timer = setInterval(() => {
      timeLeft -= 1;
      update();
      if(timeLeft <= 0) endGame();
    }, 1000);

    nextTimer = setTimeout(popOne, 400);
  }

  function resetGame(){
    clearTimers();
    hideAll();
    score = 0; combo = 0; timeLeft = settings[difficultyEl.value].duration; playing = false;
    update();
    startBtn.disabled = false;
    startBtn.textContent = '开始游戏';
    endcard.classList.remove('show');
  }

  difficultyEl.addEventListener('change', () => {
    if(!playing){ timeLeft = settings[difficultyEl.value].duration; update(); }
  });
  startBtn.addEventListener('click', startGame);
  resetBtn.addEventListener('click', resetGame);

  update();
})();
</script>
</body>
</html>
