<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>打小咪 · GPT洞洞乐</title>
<style>
  :root{
    --bg1:#17131d;
    --bg2:#251a2b;
    --panel:rgba(255,255,255,.08);
    --text:#fff7fb;
    --muted:#d8cad7;
    --accent:#ffd6ea;
    --accent2:#ffeef7;
    --hole:#4c3652;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 12%, rgba(255,205,233,.22), transparent 28%),
      radial-gradient(circle at 80% 18%, rgba(192,210,255,.15), transparent 30%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
  }
  .wrap{max-width:980px; margin:0 auto; padding:20px;}
  .hero{display:flex; gap:16px; align-items:flex-start; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap;}
  h1{margin:0; font-size:30px; line-height:1.2;}
  .sub{margin-top:8px; color:var(--muted); font-size:14px; line-height:1.6;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  button, select{border:0; border-radius:999px; padding:11px 16px; font-size:14px; font-weight:800; cursor:pointer;}
  button{background:var(--accent); color:#2c1322; box-shadow:0 8px 18px rgba(0,0,0,.18);}
  button.ghost, select{background:rgba(255,255,255,.10); color:var(--text); border:1px solid rgba(255,255,255,.12);}
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  .card{background:var(--panel); border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:14px; backdrop-filter: blur(10px);}
  .label{color:var(--muted); font-size:12px; margin-bottom:6px;}
  .value{font-size:26px; font-weight:900;}
  .board{background:var(--panel); border:1px solid rgba(255,255,255,.10); border-radius:28px; padding:18px; box-shadow:0 16px 40px rgba(0,0,0,.18);}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .hole{position:relative; aspect-ratio:1/1; border-radius:22px; background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)); overflow:hidden; border:1px solid rgba(255,255,255,.08);}
  .hole::after{
    content:""; position:absolute; left:10%; right:10%; bottom:10%; height:34%; border-radius:50%;
    background:
      radial-gradient(ellipse at center, #2f2234 0 58%, transparent 60%),
      radial-gradient(ellipse at center, var(--hole) 0 70%, transparent 72%);
    box-shadow: inset 0 10px 16px rgba(0,0,0,.32); z-index:4;
  }
  .mole{position:absolute; left:50%; bottom:12%; width:60%; height:60%; transform:translate(-50%, 105%); transition:transform .16s ease; z-index:3; user-select:none; touch-action:manipulation;}
  .hole.up .mole{transform:translate(-50%, 6%);}
  .mole.hit{transform:translate(-50%, 30%) scale(.92); filter:saturate(.85);}
  .face{position:absolute; inset:0; border-radius:50% 50% 46% 46%; background:linear-gradient(180deg, #fffafc 0%, #ffe7f2 100%); box-shadow:0 10px 18px rgba(0,0,0,.16);}
  .ear{position:absolute; top:3%; width:23%; height:23%; background:linear-gradient(180deg,#fffafc,#ffd7e9); border-radius:80% 80% 15% 15%;}
  .ear.left{left:12%; transform:rotate(-22deg)} .ear.right{right:12%; transform:rotate(22deg)}
  .ear::after{content:""; position:absolute; inset:28%; background:#ffb9d7; border-radius:80% 80% 15% 15%;}
  .eye{position:absolute; top:39%; width:10%; height:12%; background:#3a2535; border-radius:50%;}
  .eye.left{left:31%} .eye.right{right:31%}
  .mouth{position:absolute; left:50%; top:56%; width:18%; height:12%; transform:translateX(-50%);}
  .mouth::before,.mouth::after{content:""; position:absolute; width:50%; height:70%; border-bottom:3px solid #c16c8e; border-radius:0 0 12px 12px; top:0;}
  .mouth::before{left:0; transform:rotate(10deg)} .mouth::after{right:0; transform:rotate(-10deg)}
  .blush{position:absolute; top:52%; width:13%; height:9%; border-radius:50%; background:#ffbfd8; filter:blur(1px); opacity:.9;}
  .blush.left{left:18%} .blush.right{right:18%}
  .badge{
    position:absolute; left:50%; bottom:-6%; transform:translateX(-50%);
    padding:4px 8px; font-size:11px; font-weight:900; border-radius:999px;
    color:#5b2340; background:var(--accent2); border:1px solid rgba(255,255,255,.65);
    box-shadow:0 4px 10px rgba(0,0,0,.08); white-space:nowrap;
  }
  .pop{position:absolute; left:50%; top:14%; transform:translateX(-50%); font-size:22px; font-weight:900; pointer-events:none; opacity:0; z-index:6;}
  .pop.show{animation:floatPop .55s ease forwards;}
  @keyframes floatPop{
    0%{opacity:0; transform:translate(-50%,8px) scale(.8)}
    15%{opacity:1}
    100%{opacity:0; transform:translate(-50%,-28px) scale(1.12)}
  }
  .tips{margin-top:16px; color:var(--muted); font-size:13px; line-height:1.7; text-align:center;}
  .footer{margin-top:14px; text-align:center; color:var(--muted); font-size:12px; line-height:1.6;}
  .result{margin-top:16px; padding:14px; border-radius:16px; background:rgba(255,255,255,.08); text-align:center; display:none;}
  .result.show{display:block}
  .rank{font-size:15px; font-weight:800; margin-top:8px;}
  @media (max-width: 760px){
    .cards{grid-template-columns:repeat(2,1fr)} .grid{gap:12px} h1{font-size:26px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>打小咪 · GPT洞洞乐</h1>
        <div class="sub">
          一个软乎乎的打地鼠小游戏：小咪会从洞里冒出来，点到就加分。<br>
          不是那种丑丑的后台系统审美，是会努力可爱一点的版本。✨
        </div>
      </div>
      <div class="toolbar">
        <select id="difficulty">
          <option value="easy">简单</option>
          <option value="normal" selected>普通</option>
          <option value="hard">困难</option>
        </select>
        <button id="startBtn">开始游戏</button>
        <button id="resetBtn" class="ghost">重置</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="card"><div class="label">连击</div><div class="value" id="combo">0</div></div>
      <div class="card"><div class="label">剩余时间</div><div class="value" id="time">30</div></div>
      <div class="card"><div class="label">最佳成绩</div><div class="value" id="best">0</div></div>
    </div>

    <div class="board">
      <div class="grid" id="grid"></div>
      <div class="result" id="result">
        <div id="resultTitle" style="font-size:22px;font-weight:900;">本轮结束啦</div>
        <div id="resultText" style="margin-top:6px;">你这次打到了 0 只小咪。</div>
        <div class="rank" id="rankText">评级：准备热身中</div>
      </div>
      <div class="tips">玩法：点冒出来的小咪就加分；连续点中会有连击加成。手机和电脑都能玩。</div>
    </div>

    <div class="footer">
      小咪只是友情出没，不是真被打疼啦。你也可以把它当成轻量版“打地鼠”网页小工具。🫶
    </div>
  </div>

<script>
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const difficultyEl = document.getElementById('difficulty');
  const resultBox = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const rankText = document.getElementById('rankText');

  const TOTAL_HOLES = 9;
  let score = 0, combo = 0, timeLeft = 30, gameRunning = false, timerId = null, popTimer = null, activeIndex = -1, lastIndex = -1;
  let best = Number(localStorage.getItem('gptWhackBest') || 0);
  bestEl.textContent = best;

  const difficultyMap = {
    easy: {showMin: 680, showMax: 980, gapMin: 160, gapMax: 300, scoreBase: 1},
    normal: {showMin: 500, showMax: 800, gapMin: 100, gapMax: 220, scoreBase: 1},
    hard: {showMin: 360, showMax: 650, gapMin: 70, gapMax: 160, scoreBase: 2}
  };

  function rand(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

  function createHole(index){
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.dataset.index = index;
    hole.innerHTML = `
      <div class="pop">+1</div>
      <div class="mole" role="button" aria-label="点小咪加分">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="mouth"></div>
        <div class="badge">GPT 小咪</div>
      </div>`;
    const mole = hole.querySelector('.mole');
    mole.addEventListener('click', () => hitHole(hole));
    mole.addEventListener('touchstart', (e) => { e.preventDefault(); hitHole(hole); }, {passive:false});
    return hole;
  }

  for(let i=0;i<TOTAL_HOLES;i++) grid.appendChild(createHole(i));
  const holes = Array.from(document.querySelectorAll('.hole'));

  function chooseHole(){
    let idx = rand(0, TOTAL_HOLES-1);
    if(idx === lastIndex) idx = (idx + 1) % TOTAL_HOLES;
    lastIndex = idx;
    return holes[idx];
  }

  function showPop(hole, text){
    const pop = hole.querySelector('.pop');
    pop.textContent = text;
    pop.classList.remove('show');
    void pop.offsetWidth;
    pop.classList.add('show');
  }

  function popUp(){
    if(!gameRunning) return;
    const setting = difficultyMap[difficultyEl.value];
    const hole = chooseHole();
    activeIndex = Number(hole.dataset.index);
    hole.classList.add('up');

    const showDuration = rand(setting.showMin, setting.showMax);
    setTimeout(() => {
      hole.classList.remove('up');
      activeIndex = -1;
      if(gameRunning){
        popTimer = setTimeout(popUp, rand(setting.gapMin, setting.gapMax));
      }
    }, showDuration);
  }

  function hitHole(hole){
    if(!gameRunning) return;
    const idx = Number(hole.dataset.index);
    if(idx !== activeIndex) return;

    const setting = difficultyMap[difficultyEl.value];
    activeIndex = -1;
    hole.classList.remove('up');
    const mole = hole.querySelector('.mole');
    mole.classList.add('hit');
    setTimeout(() => mole.classList.remove('hit'), 120);

    combo += 1;
    const add = setting.scoreBase + Math.floor(combo / 5);
    score += add;

    scoreEl.textContent = score;
    comboEl.textContent = combo;
    showPop(hole, `+${add}`);
  }

  function clearAllTimers(){
    if(timerId) clearInterval(timerId);
    if(popTimer) clearTimeout(popTimer);
    timerId = null;
    popTimer = null;
  }

  function getRank(score){
    if(score >= 65) return '评级：洞洞乐之神 ✨';
    if(score >= 45) return '评级：小咪克星（温柔版）';
    if(score >= 28) return '评级：出手很准呀';
    if(score >= 15) return '评级：已经很会玩了';
    return '评级：热身可爱组';
  }

  function endGame(){
    clearAllTimers();
    gameRunning = false;
    activeIndex = -1;
    holes.forEach(h => h.classList.remove('up'));
    if(score > best){
      best = score;
      localStorage.setItem('gptWhackBest', best);
      bestEl.textContent = best;
    }
    resultText.textContent = `你这次拿到了 ${score} 分，最高连击 ${combo}。`;
    rankText.textContent = getRank(score);
    resultBox.classList.add('show');
    startBtn.textContent = '再来一局';
    startBtn.disabled = false;
  }

  function startGame(){
    clearAllTimers();
    gameRunning = true;
    score = 0; combo = 0; timeLeft = 30; activeIndex = -1;
    resultBox.classList.remove('show');
    scoreEl.textContent = score; comboEl.textContent = combo; timeEl.textContent = timeLeft;
    startBtn.textContent = '游戏进行中'; startBtn.disabled = true;

    timerId = setInterval(() => {
      timeLeft -= 1;
      timeEl.textContent = timeLeft;
      if(timeLeft <= 0) endGame();
    }, 1000);

    popUp();
  }

  function resetGame(){
    clearAllTimers();
    gameRunning = false; score = 0; combo = 0; timeLeft = 30; activeIndex = -1;
    holes.forEach(h => h.classList.remove('up'));
    scoreEl.textContent = '0'; comboEl.textContent = '0'; timeEl.textContent = '30';
    resultBox.classList.remove('show');
    startBtn.textContent = '开始游戏'; startBtn.disabled = false;
  }

  startBtn.addEventListener('click', startGame);
  resetBtn.addEventListener('click', resetGame);
</script>
</body>
</html>
