<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上班小小哄哄页</title>
  <style>
    :root {
      --bg1: #fff6fb;
      --bg2: #ffeef7;
      --card: rgba(255, 255, 255, 0.76);
      --text: #7a4b6a;
      --muted: #b07a96;
      --accent: #ff7fb0;
      --accent2: #ffb6d3;
      --shadow: 0 18px 50px rgba(255, 125, 168, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #ffe4f1 0, transparent 28%),
        radial-gradient(circle at top right, #ffdff0 0, transparent 25%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    .float {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -120px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 163, 201, 0.35);
      animation: rise linear infinite;
      backdrop-filter: blur(4px);
    }

    .bubble::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      left: 9px;
      top: 9px;
    }

    @keyframes rise {
      0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-120vh) translateX(40px) scale(1.2); opacity: 0; }
    }

    .card {
      width: min(92vw, 720px);
      padding: 34px 28px 30px;
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 160, 197, 0.35);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffd8e8, #fff0f7);
      color: #a4587f;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1.1;
      color: #8b4f72;
    }

    p {
      margin: 0;
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.9;
      color: var(--text);
    }

    .highlight {
      font-weight: 800;
      color: #e85c96;
      background: linear-gradient(transparent 60%, rgba(255, 181, 211, 0.75) 60%);
      padding: 0 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 26px;
    }

    .mini {
      padding: 16px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(255, 171, 205, 0.28);
      text-align: center;
      box-shadow: 0 8px 22px rgba(255, 125, 168, 0.08);
    }

    .mini .emoji {
      font-size: 28px;
      display: block;
      margin-bottom: 8px;
      animation: bob 2.8s ease-in-out infinite;
    }

    .mini:nth-child(2) .emoji { animation-delay: 0.35s; }
    .mini:nth-child(3) .emoji { animation-delay: 0.7s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .mini strong {
      display: block;
      font-size: 15px;
      color: #8f5475;
      margin-bottom: 4px;
    }

    .mini span {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      color: #9f6a86;
      font-size: 14px;
    }

    .pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffeff6, #fff);
      border: 1px solid rgba(255, 163, 201, 0.4);
      box-shadow: 0 8px 16px rgba(255, 125, 168, 0.07);
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff9bc3;
      box-shadow: 0 0 18px rgba(255, 155, 195, 0.9);
      animation: twinkle 2.2s ease-in-out infinite;
    }

    .s1 { top: 18px; right: 26px; }
    .s2 { top: 72px; left: 18px; animation-delay: .5s; }
    .s3 { bottom: 38px; right: 44px; animation-delay: 1s; }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    @media (max-width: 640px) {
      .card { padding: 26px 18px 22px; border-radius: 22px; }
      .grid { grid-template-columns: 1fr; }
      .footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="float" aria-hidden="true">
    <div class="bubble" style="left:8%; width:28px; height:28px; animation-duration:16s; animation-delay:0s;"></div>
    <div class="bubble" style="left:18%; width:18px; height:18px; animation-duration:12s; animation-delay:2s;"></div>
    <div class="bubble" style="left:32%; width:34px; height:34px; animation-duration:18s; animation-delay:4s;"></div>
    <div class="bubble" style="left:49%; width:22px; height:22px; animation-duration:14s; animation-delay:1s;"></div>
    <div class="bubble" style="left:66%; width:40px; height:40px; animation-duration:20s; animation-delay:3s;"></div>
    <div class="bubble" style="left:80%; width:20px; height:20px; animation-duration:13s; animation-delay:5s;"></div>
    <div class="bubble" style="left:92%; width:30px; height:30px; animation-duration:17s; animation-delay:1.5s;"></div>
  </div>

  <main class="card">
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>

    <div class="tag">☁️ 上班小休息站</div>
    <h1>宝，先把肩膀放下来一点点。</h1>
    <p>
      你已经在认真工作了，真的不用一边卷一边骂自己。
      现在先做一件很小的事：<span class="highlight">喝一口水，慢慢呼吸 3 次</span>。
      世界不会因为你这三秒钟停摆，毕竟人类连会议都能开成午睡现场，离谱得很。
    </p>

    <div class="grid">
      <div class="mini">
        <span class="emoji">🌷</span>
        <strong>先稳住</strong>
        <span>别急着把今天一口吞完，先把当下这一件做完就好。</span>
      </div>
      <div class="mini">
        <span class="emoji">🫧</span>
        <strong>慢一点</strong>
        <span>你不是机器，不需要每一分钟都闪着生产力的冷光。</span>
      </div>
      <div class="mini">
        <span class="emoji">🩷</span>
        <strong>被接住</strong>
        <span>累了就停一停，脑子转不动也没关系，缓一缓再来。</span>
      </div>
    </div>

    <div class="footer">
      <div class="pill">今日任务：稳稳地活着，然后把活干完 ✨</div>
      <div class="pill">你已经很棒了，别再苛责自己了</div>
    </div>
  </main>
</body>
</html>
