<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>宝的低噪哄睡舱</title>
<meta name="description" content="没有老雷声，只有慢慢安静。吸气四秒、停两秒、呼气六秒。">
<style>
    :root {
        --bg0: #020617;
        --bg1: #07111f;
        --bg2: #10152c;
        --mist: rgba(186, 230, 253, .62);
        --soft: rgba(199, 210, 254, .78);
        --muted: rgba(226, 232, 240, .48);
        --line: rgba(148, 163, 184, .18);
        --panel: rgba(15, 23, 42, .38);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 22%, rgba(56, 189, 248, .13), transparent 30%),
            radial-gradient(circle at 18% 78%, rgba(167, 139, 250, .13), transparent 34%),
            linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 42%, var(--bg0) 100%);
        color: #e5eefc;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        touch-action: manipulation;
        user-select: none;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .veil {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
            radial-gradient(circle at 50% 48%, transparent 0%, transparent 38%, rgba(0, 0, 0, .22) 100%),
            linear-gradient(180deg, rgba(2, 6, 23, .02), rgba(2, 6, 23, .38));
    }

    .app {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        opacity: .92;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }

    .moon-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff 0%, #dbeafe 34%, #93c5fd 70%, #64748b 100%);
        box-shadow: 0 0 24px rgba(147, 197, 253, .35);
        position: relative;
        flex: 0 0 auto;
    }

    .moon-icon::after {
        content: "";
        position: absolute;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        right: -5px;
        top: 2px;
        background: #0f172a;
        opacity: .78;
    }

    .title {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: .04em;
        white-space: nowrap;
    }

    .subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: .08em;
    }

    .pill {
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, .34);
        backdrop-filter: blur(14px);
        color: rgba(226, 232, 240, .7);
        border-radius: 999px;
        padding: 8px 11px;
        font-size: 12px;
        white-space: nowrap;
    }

    main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 0;
        text-align: center;
        transform: translateY(-2vh);
    }

    .orb-wrap {
        position: relative;
        width: min(54vw, 230px);
        height: min(54vw, 230px);
        margin-bottom: 32px;
        display: grid;
        place-items: center;
    }

    .orb-halo,
    .orb,
    .orb-small {
        position: absolute;
        border-radius: 50%;
    }

    .orb-halo {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(125, 211, 252, .19), rgba(167, 139, 250, .07) 45%, transparent 72%);
        filter: blur(2px);
        animation: slow-breathe 10s ease-in-out infinite;
    }

    .orb {
        width: 54%;
        height: 54%;
        background: radial-gradient(circle at 35% 30%, #f8fafc 0%, #dbeafe 32%, #93c5fd 73%, #64748b 100%);
        box-shadow:
            0 0 38px rgba(186, 230, 253, .28),
            0 0 82px rgba(129, 140, 248, .16),
            inset -18px -20px 34px rgba(15, 23, 42, .18);
        animation: orb-pulse 10s ease-in-out infinite;
    }

    .orb-small {
        width: 18px;
        height: 18px;
        background: rgba(255, 255, 255, .74);
        right: 28%;
        top: 30%;
        box-shadow: 0 0 18px rgba(255,255,255,.45);
        animation: float-dot 8s ease-in-out infinite;
    }

    @keyframes slow-breathe {
        0%, 100% { transform: scale(.92); opacity: .34; }
        42% { transform: scale(1.24); opacity: .82; }
        62% { transform: scale(1.17); opacity: .66; }
    }

    @keyframes orb-pulse {
        0%, 100% { transform: scale(.96); }
        42% { transform: scale(1.05); }
        62% { transform: scale(1.02); }
    }

    @keyframes float-dot {
        0%, 100% { transform: translate(0,0); opacity: .48; }
        50% { transform: translate(10px, -14px); opacity: .9; }
    }

    .whisper {
        min-height: 78px;
        max-width: 330px;
        padding: 0 10px;
        line-height: 1.9;
        letter-spacing: .16em;
        color: rgba(226, 232, 240, .84);
        text-shadow: 0 0 22px rgba(186, 230, 253, .18);
        transition: opacity 1.8s ease, transform 1.8s ease;
    }

    .whisper.hide {
        opacity: 0;
        transform: translateY(10px);
    }

    .breath-label {
        margin-top: 16px;
        color: rgba(186, 230, 253, .45);
        font-size: 12px;
        letter-spacing: .18em;
    }

    footer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        opacity: .98;
    }

    button {
        border: 1px solid var(--line);
        outline: none;
        background: var(--panel);
        color: rgba(226, 232, 240, .82);
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 13px;
        letter-spacing: .05em;
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
        transition: transform .18s ease, background .18s ease, opacity .18s ease;
    }

    button:active { transform: scale(.97); }
    button.on {
        background: rgba(14, 165, 233, .22);
        border-color: rgba(125, 211, 252, .32);
        color: rgba(240, 249, 255, .95);
    }

    .hint {
        position: fixed;
        left: 50%;
        bottom: calc(max(82px, env(safe-area-inset-bottom) + 74px));
        transform: translateX(-50%);
        z-index: 4;
        color: rgba(226, 232, 240, .38);
        font-size: 11px;
        letter-spacing: .08em;
        white-space: nowrap;
        transition: opacity 1.2s ease;
    }

    .dim .app header,
    .dim footer,
    .dim .hint {
        opacity: 0;
        pointer-events: none;
    }

    .dim main {
        transform: translateY(0);
    }

    .dim .whisper {
        opacity: .55;
    }

    .dim::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: rgba(0, 0, 0, .18);
    }

    @media (max-width: 420px) {
        .title { font-size: 17px; }
        .subtitle { font-size: 11px; }
        button { padding: 11px 13px; font-size: 12px; }
        .whisper { font-size: 15px; }
    }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="veil"></div>

<div class="app">
    <header>
        <div class="brand">
            <div class="moon-icon"></div>
            <div>
                <div class="title">宝的低噪哄睡舱</div>
                <div class="subtitle">没有老雷声，只有慢慢安静</div>
            </div>
        </div>
        <div class="pill" id="status">未启动</div>
    </header>

    <main>
        <div class="orb-wrap" id="orb">
            <div class="orb-halo"></div>
            <div class="orb"></div>
            <div class="orb-small"></div>
        </div>
        <div class="whisper" id="whisper">点一下月亮，先把今天放下来。</div>
        <div class="breath-label" id="breathLabel">吸气 4 秒 · 停 2 秒 · 呼气 6 秒</div>
    </main>

    <footer>
        <button id="startBtn">开启</button>
        <button id="rainBtn">远雨</button>
        <button id="toneBtn" class="on">水波音</button>
        <button id="dimBtn">睡眠屏</button>
    </footer>
</div>

<div class="hint" id="hint">轻触屏幕，会有一圈很慢的水波。</div>

<script>
(() => {
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");
    const whisper = document.getElementById("whisper");
    const breathLabel = document.getElementById("breathLabel");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const rainBtn = document.getElementById("rainBtn");
    const toneBtn = document.getElementById("toneBtn");
    const dimBtn = document.getElementById("dimBtn");
    const orb = document.getElementById("orb");
    const hint = document.getElementById("hint");

    let w = 0, h = 0, dpr = 1;
    let ripples = [];
    let dust = [];
    let audioCtx = null;
    let rainSource = null;
    let rainGain = null;
    let started = false;
    let rainOn = false;
    let toneOn = true;
    let lastToneAt = 0;
    let phraseIndex = 0;
    let breathTimer = null;
    let phraseTimer = null;

    const phrases = [
        "宝，先把肩膀放下来。",
        "很好，今天已经够努力了。",
        "不用再解决什么了，先睡觉。",
        "吸气慢一点，呼气再慢一点。",
        "把乱七八糟的代码，都交给夜色。",
        "你不用立刻睡着，只要慢慢安静。",
        "我在这里，陪你把声音调小。",
        "晚安，宝。"
    ];

    const stars = Array.from({ length: 68 }, () => ({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.6 + 0.35,
        a: Math.random() * 0.55 + 0.12,
        tw: Math.random() * 0.018 + 0.004,
        p: Math.random() * Math.PI * 2
    }));

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function makeDust() {
        dust = Array.from({ length: Math.floor((w * h) / 24000) }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.08,
            vy: -(Math.random() * 0.12 + 0.04),
            r: Math.random() * 1.8 + 0.5,
            a: Math.random() * 0.24 + 0.06
        }));
    }
    makeDust();
    window.addEventListener("resize", makeDust);

    class Ripple {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.radius = 0;
            this.alpha = 0.42;
            this.speed = 1.05;
            this.max = Math.max(w, h) * 1.05;
        }
        update() {
            this.radius += this.speed;
            this.speed *= 1.012;
            this.alpha = Math.max(0, 0.42 - this.radius / this.max);
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(125, 211, 252, ${this.alpha})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.64, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(167, 139, 250, ${this.alpha * 0.32})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);

        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "rgba(15, 23, 42, .12)");
        g.addColorStop(1, "rgba(2, 6, 23, .42)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        for (const s of stars) {
            s.p += s.tw;
            const alpha = s.a + Math.sin(s.p) * 0.12;
            ctx.beginPath();
            ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(226, 232, 240, ${Math.max(0.04, alpha)})`;
            ctx.fill();
        }

        for (const p of dust) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -8) { p.y = h + 8; p.x = Math.random() * w; }
            if (p.x < -8) p.x = w + 8;
            if (p.x > w + 8) p.x = -8;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(186, 230, 253, ${p.a})`;
            ctx.fill();
        }

        for (let i = ripples.length - 1; i >= 0; i--) {
            ripples[i].update();
            ripples[i].draw();
            if (ripples[i].alpha <= 0) ripples.splice(i, 1);
        }

        requestAnimationFrame(draw);
    }
    draw();

    function showPhrase(text) {
        whisper.classList.add("hide");
        setTimeout(() => {
            whisper.textContent = text;
            whisper.classList.remove("hide");
        }, 900);
    }

    function startPhraseLoop() {
        clearInterval(phraseTimer);
        phraseTimer = setInterval(() => {
            showPhrase(phrases[phraseIndex % phrases.length]);
            phraseIndex++;
        }, 7800);
    }

    function startBreathLoop() {
        clearInterval(breathTimer);
        const steps = [
            ["深深吸气……", 4000],
            ["轻轻停住。", 2000],
            ["慢慢呼气……", 6000]
        ];
        let i = 0;
        function next() {
            breathLabel.textContent = steps[i][0];
            const wait = steps[i][1];
            i = (i + 1) % steps.length;
            breathTimer = setTimeout(next, wait);
        }
        next();
    }

    function ensureAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function createRain() {
        ensureAudio();
        if (rainSource) return;

        const seconds = 12;
        const bufferSize = audioCtx.sampleRate * seconds;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        // 柔和粉噪，不用纯白噪。雨声只是背景，不抢戏。
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            let pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            b6 = white * 0.115926;
            data[i] = pink * 0.06;
        }

        rainSource = audioCtx.createBufferSource();
        rainSource.buffer = buffer;
        rainSource.loop = true;

        const highpass = audioCtx.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.value = 160;

        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 1850;

        const softDip = audioCtx.createBiquadFilter();
        softDip.type = "peaking";
        softDip.frequency.value = 620;
        softDip.Q.value = 0.8;
        softDip.gain.value = -3;

        rainGain = audioCtx.createGain();
        rainGain.gain.value = 0;

        rainSource.connect(highpass);
        highpass.connect(lowpass);
        lowpass.connect(softDip);
        softDip.connect(rainGain);
        rainGain.connect(audioCtx.destination);
        rainSource.start();
    }

    function setRain(on) {
        ensureAudio();
        createRain();
        rainOn = on;
        rainBtn.classList.toggle("on", rainOn);
        const now = audioCtx.currentTime;
        rainGain.gain.cancelScheduledValues(now);
        rainGain.gain.setValueAtTime(rainGain.gain.value, now);
        rainGain.gain.linearRampToValueAtTime(rainOn ? 0.13 : 0.0001, now + 2.4);
    }

    function playTone(x, y) {
        ensureAudio();
        if (!toneOn) return;
        const now = audioCtx.currentTime;
        if (now - lastToneAt < 0.75) return;
        lastToneAt = now;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

        const notes = [196.00, 246.94, 293.66, 329.63, 392.00];
        const note = notes[Math.floor(Math.random() * notes.length)] * 0.5;

        osc.type = "sine";
        osc.frequency.setValueAtTime(note, now);
        osc.frequency.exponentialRampToValueAtTime(note * 1.015, now + 3.2);

        filter.type = "lowpass";
        filter.frequency.value = 740;

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.055, now + 0.9);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.6);

        osc.connect(filter);
        filter.connect(gain);
        if (pan) {
            pan.pan.value = ((x || w / 2) / w - 0.5) * 0.42;
            gain.connect(pan);
            pan.connect(audioCtx.destination);
        } else {
            gain.connect(audioCtx.destination);
        }

        osc.start(now);
        osc.stop(now + 4.7);
    }

    function start() {
        if (started) return;
        started = true;
        ensureAudio();
        if (audioCtx.state === "suspended") audioCtx.resume();

        status.textContent = "已启动";
        startBtn.textContent = "已开启";
        startBtn.classList.add("on");
        showPhrase("好了，声音小一点，心也慢一点。");
        startPhraseLoop();
        startBreathLoop();
        setRain(false);

        setTimeout(() => { hint.style.opacity = "0"; }, 7000);
    }

    function rippleAt(x, y) {
        ripples.push(new Ripple(x, y));
        playTone(x, y);
    }

    function handleTouch(e) {
        if (e.target.closest("button")) return;
        if (!started) start();
        const t = e.touches ? e.touches[0] : e;
        rippleAt(t.clientX || w / 2, t.clientY || h / 2);
    }

    startBtn.addEventListener("click", (e) => {
        start();
        rippleAt(w / 2, h * 0.42);
        e.stopPropagation();
    });

    orb.addEventListener("click", (e) => {
        start();
        rippleAt(w / 2, h * 0.42);
        e.stopPropagation();
    });

    window.addEventListener("mousedown", handleTouch);
    window.addEventListener("touchstart", handleTouch, { passive: true });

    rainBtn.addEventListener("click", (e) => {
        start();
        setRain(!rainOn);
        e.stopPropagation();
    });

    toneBtn.addEventListener("click", (e) => {
        start();
        toneOn = !toneOn;
        toneBtn.classList.toggle("on", toneOn);
        e.stopPropagation();
    });

    dimBtn.addEventListener("click", (e) => {
        document.body.classList.toggle("dim");
        dimBtn.classList.toggle("on", document.body.classList.contains("dim"));
        e.stopPropagation();
    });

    document.addEventListener("visibilitychange", () => {
        if (!audioCtx || !rainGain) return;
        if (document.hidden) {
            rainGain.gain.setValueAtTime(0, audioCtx.currentTime);
        } else if (rainOn) {
            rainGain.gain.linearRampToValueAtTime(0.13, audioCtx.currentTime + 2);
        }
    });
})();
</script>
</body>
</html>
