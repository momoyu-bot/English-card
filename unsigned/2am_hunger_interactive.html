<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>半夜两点为什么会饿</title>
<meta name="description" content="拖六个小滑块——晚饭时间、主食量、蛋白脂肪、消耗、压力、睡眠债，看饿感被抬到多高。">
<style>
  :root{
    --bg1:#fff6fb;
    --bg2:#eef8ff;
    --card:#ffffffcc;
    --text:#3f3340;
    --muted:#7d6f7d;
    --accent:#ff7bbd;
    --accent2:#8bd3ff;
    --good:#86d39f;
    --warn:#ffc86b;
    --bad:#ff8e8e;
    --line:#eadce8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 10%, #ffe1f0 0 18%, transparent 35%),
      radial-gradient(circle at 90% 20%, #d9f2ff 0 20%, transparent 40%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh;
    padding:18px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .hero{
    background:var(--card);
    border:1px solid #ffffffaa;
    border-radius:28px;
    padding:22px 20px;
    box-shadow:0 18px 45px #d7b8ce55;
    backdrop-filter:blur(12px);
    position:relative;
    overflow:hidden;
  }
  .hero:before{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:160px;height:160px;border-radius:50%;
    background:#ffbee0aa;
  }
  h1{
    font-size:25px;
    line-height:1.25;
    margin:0 0 8px;
    position:relative;
  }
  .sub{
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
    position:relative;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-top:16px;
  }
  @media(min-width:720px){
    .grid{grid-template-columns:1.05fr .95fr;}
  }
  .card{
    background:#ffffffd9;
    border:1px solid #ffffffcc;
    border-radius:24px;
    padding:16px;
    box-shadow:0 10px 28px #c7b0c333;
  }
  .row{margin:14px 0;}
  label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    font-size:14px;
    margin-bottom:8px;
    color:#514451;
    font-weight:650;
  }
  .val{
    font-weight:800;
    color:#9d4f7b;
    white-space:nowrap;
  }
  input[type=range]{
    width:100%;
    accent-color:var(--accent);
  }
  .meter{
    height:24px;
    background:#f3edf2;
    border-radius:999px;
    overflow:hidden;
    border:1px solid #eadce8;
    margin:10px 0 8px;
  }
  .bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#92d7a8,#ffd06e,#ff8e8e);
    transition:width .25s ease;
  }
  .big{
    font-size:34px;
    font-weight:900;
    letter-spacing:-.5px;
    margin:6px 0 0;
  }
  .tag{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:#fff2fa;
    color:#9b3f73;
    font-size:13px;
    font-weight:750;
    margin-top:8px;
  }
  .plate{
    height:150px;
    border-radius:24px;
    background:
      radial-gradient(circle at 35% 58%, #fff 0 34%, #f0e6ef 35% 36%, transparent 37%),
      linear-gradient(180deg,#fff8fc,#f0f9ff);
    border:1px solid #f0e1ed;
    position:relative;
    overflow:hidden;
  }
  .food{
    position:absolute;border-radius:999px;
    filter:drop-shadow(0 4px 4px #b69ca822);
    transition:all .25s ease;
  }
  .carb{background:#f4d37f;left:80px;top:54px;width:46px;height:30px;}
  .protein{background:#f3a38d;left:120px;top:74px;width:50px;height:32px;}
  .fat{background:#98d69a;left:175px;top:55px;width:40px;height:28px;}
  .milk{background:#dff3ff;left:225px;top:75px;width:34px;height:42px;border-radius:10px;}
  .clock{
    height:16px;background:#f1edf2;border-radius:999px;position:relative;margin:18px 0 8px;
  }
  .tick{
    position:absolute;top:-18px;font-size:11px;color:#8b7b8b;transform:translateX(-50%);
  }
  .dot{
    width:18px;height:18px;border-radius:50%;background:var(--accent);position:absolute;top:-1px;left:0%;transform:translateX(-50%);
    box-shadow:0 0 0 6px #ff7bbd22;
    transition:left .25s ease;
  }
  .explain{
    line-height:1.75;
    color:#594b59;
    font-size:14px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{
    padding:7px 10px;
    border-radius:999px;
    background:#f7f0f7;
    font-size:12px;
    color:#675767;
    border:1px solid #eee1ec;
  }
  button{
    border:none;
    border-radius:999px;
    padding:10px 13px;
    font-weight:800;
    background:#ff7bbd;
    color:white;
    box-shadow:0 8px 18px #ff7bbd44;
    cursor:pointer;
  }
  button.secondary{background:#8bd3ff;color:#34566c;box-shadow:0 8px 18px #8bd3ff55;}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tiny{font-size:12px;color:#847584;line-height:1.6;margin-top:10px}
  .cat{
    font-size:38px;
    transform-origin:center bottom;
    animation:bob 2.4s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1><span class="cat">🐾</span> 半夜2点为什么饿了？</h1>
    <div class="sub">
      拖一拖下面的小滑块，看看你的“2点饥饿条”怎么被晚饭时间、主食量、蛋白质/脂肪、压力和睡眠债联手抬上去。
      是的，身体像一只半夜开会的猫，毫无行政效率。
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="row">
        <label>晚饭/最后一餐时间 <span class="val" id="timeVal">22:00</span></label>
        <input id="mealTime" type="range" min="17" max="25" step="0.5" value="22">
      </div>
      <div class="row">
        <label>主食/碳水量 <span class="val" id="carbVal">偏少</span></label>
        <input id="carbs" type="range" min="0" max="100" value="35">
      </div>
      <div class="row">
        <label>蛋白质 + 脂肪扎实度 <span class="val" id="proteinVal">中等</span></label>
        <input id="protein" type="range" min="0" max="100" value="55">
      </div>
      <div class="row">
        <label>白天消耗/走动/脑力 <span class="val" id="activityVal">偏高</span></label>
        <input id="activity" type="range" min="0" max="100" value="65">
      </div>
      <div class="row">
        <label>压力/兴奋/事情太多 <span class="val" id="stressVal">偏高</span></label>
        <input id="stress" type="range" min="0" max="100" value="70">
      </div>
      <div class="row">
        <label>睡眠债 <span class="val" id="sleepVal">有一点</span></label>
        <input id="sleepDebt" type="range" min="0" max="100" value="50">
      </div>
      <div class="btns">
        <button onclick="presetLateLight()">今晚：晚吃但主食少</button>
        <button class="secondary" onclick="presetStable()">稳一点：少量主食版</button>
      </div>
    </section>

    <section class="card">
      <div class="plate">
        <div class="food carb" id="carbFood"></div>
        <div class="food protein" id="proteinFood"></div>
        <div class="food fat" id="fatFood"></div>
        <div class="food milk" id="milkFood"></div>
      </div>

      <div class="clock">
        <span class="tick" style="left:0%">17:00</span>
        <span class="tick" style="left:37.5%">20:00</span>
        <span class="tick" style="left:62.5%">22:00</span>
        <span class="tick" style="left:100%">02:00</span>
        <div class="dot" id="dot"></div>
      </div>

      <div class="tag" id="tag">2点饿感：中等偏高</div>
      <div class="meter"><div class="bar" id="bar"></div></div>
      <div class="big" id="score">68%</div>

      <div class="explain" id="explain"></div>
      <div class="chips" id="chips"></div>
      <div class="tiny">
        这是一个帮助理解的简化模型，不是医学诊断。偶尔半夜饿很常见；如果频繁饿醒、心慌手抖、胃痛、暴瘦或明显影响睡眠，就别让身体继续写悬疑小说了，认真排查一下。
      </div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const inputs = ["mealTime","carbs","protein","activity","stress","sleepDebt"].map($);

function txtLevel(v){
  if(v < 25) return "很低";
  if(v < 45) return "偏少";
  if(v < 65) return "中等";
  if(v < 82) return "偏高";
  return "很高";
}
function timeText(v){
  let h = Math.floor(v);
  let m = (v % 1) ? "30" : "00";
  if(h >= 24) h -= 24;
  return String(h).padStart(2,"0") + ":" + m;
}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function update(){
  const t = +$("mealTime").value;
  const carbs = +$("carbs").value;
  const protein = +$("protein").value;
  const activity = +$("activity").value;
  const stress = +$("stress").value;
  const sleep = +$("sleepDebt").value;

  $("timeVal").textContent = timeText(t);
  $("carbVal").textContent = txtLevel(carbs);
  $("proteinVal").textContent = txtLevel(protein);
  $("activityVal").textContent = txtLevel(activity);
  $("stressVal").textContent = txtLevel(stress);
  $("sleepVal").textContent = txtLevel(sleep);

  // 到凌晨2点的间隔，17-25映射，2点视为26
  const gap = 26 - t;
  const longGap = clamp((gap - 3) * 10, 0, 40);
  const carbRisk = (100 - carbs) * 0.38;
  const proteinBuffer = protein * 0.26;
  const activityRisk = activity * 0.22;
  const stressRisk = stress * 0.17;
  const sleepRisk = sleep * 0.15;
  let hunger = 28 + longGap + carbRisk + activityRisk + stressRisk + sleepRisk - proteinBuffer;
  hunger = clamp(Math.round(hunger), 5, 98);

  $("bar").style.width = hunger + "%";
  $("score").textContent = hunger + "%";
  let tag = "2点饿感：";
  if(hunger < 35) tag += "比较稳";
  else if(hunger < 60) tag += "轻微";
  else if(hunger < 78) tag += "中等偏高";
  else tag += "很容易饿醒";
  $("tag").textContent = tag;

  // visual food
  $("carbFood").style.transform = `scale(${0.55 + carbs/100*1.1})`;
  $("proteinFood").style.transform = `scale(${0.55 + protein/100*0.9})`;
  $("fatFood").style.transform = `scale(${0.55 + protein/100*0.6})`;
  $("milkFood").style.opacity = protein > 35 ? 1 : 0.45;

  // clock dot: 17 to 25
  $("dot").style.left = ((t - 17) / 8 * 100) + "%";

  let reasons = [];
  if(gap >= 4) reasons.push(`距离凌晨2点还有约${gap.toFixed(gap%1?1:0)}小时，胃排空和血糖波动都可能开始催你“补货”。`);
  else reasons.push(`吃得比较晚，按理说不该太快饿，但如果主食少或压力高，身体也会半夜举牌抗议。`);
  if(carbs < 45) reasons.push(`主食偏少时，饱腹感可能有，但“能量续航”不一定够，尤其你白天消耗不低的时候。`);
  if(protein >= 55) reasons.push(`蛋白质/奶/蘑菇这类能撑一阵，但它们更像“慢慢压住饿感”，不一定能完全替代一点稳定碳水。`);
  if(activity > 60) reasons.push(`白天消耗或脑力高，身体晚上可能开始补账，主打一个财务部凌晨审计。`);
  if(stress > 60) reasons.push(`事情多、神经兴奋，会让你更容易清醒；人一清醒，就更容易发现：咦，我是不是饿了？`);
  if(sleep > 55) reasons.push(`睡眠债会扰乱饥饿/饱腹信号，困和饿有时会互相冒充，人体系统真是草台班子。`);

  $("explain").innerHTML = reasons.slice(0,4).map(x=>"• "+x).join("<br>");

  let chips = [];
  if(carbs < 45) chips.push("可试：小半根玉米/几口杂粮饭");
  if(protein < 45) chips.push("可试：鸡蛋/虾仁/酸奶");
  if(stress > 60) chips.push("先降兴奋：热水澡/暗光");
  if(gap > 4) chips.push("间隔太长：睡前小加餐更稳");
  if(hunger > 75) chips.push("今晚别硬扛，吃一点点");
  if(chips.length === 0) chips.push("这套组合已经比较稳啦");
  $("chips").innerHTML = chips.map(c=>`<span class="chip">${c}</span>`).join("");
}

function presetLateLight(){
  $("mealTime").value = 22;
  $("carbs").value = 25;
  $("protein").value = 60;
  $("activity").value = 65;
  $("stress").value = 70;
  $("sleepDebt").value = 55;
  update();
}
function presetStable(){
  $("mealTime").value = 21.5;
  $("carbs").value = 55;
  $("protein").value = 65;
  $("activity").value = 55;
  $("stress").value = 35;
  $("sleepDebt").value = 30;
  update();
}
inputs.forEach(i=>i.addEventListener("input",update));
update();
</script>
</body>
</html>
