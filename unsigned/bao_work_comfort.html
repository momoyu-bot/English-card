<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宝的上班续命小窝</title>
<meta name="description" content="你不是废废，只是开机动画比较长。今日任务：活着到下班。">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #ffe1ef 0, transparent 28%),
        radial-gradient(circle at 80% 10%, #fff0b8 0, transparent 25%),
        radial-gradient(circle at 50% 90%, #d9f2ff 0, transparent 30%),
        linear-gradient(135deg, #fff7fb, #eef7ff);
      color: #5a4151;
      overflow: hidden;
    }

    .card {
      width: min(90vw, 520px);
      padding: 32px 26px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 50px rgba(232, 149, 187, 0.28);
      backdrop-filter: blur(18px);
      text-align: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: floatCard 3.6s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .cat {
      font-size: 70px;
      margin-bottom: 8px;
      animation: wiggle 2s ease-in-out infinite;
      filter: drop-shadow(0 8px 8px rgba(255, 174, 203, 0.35));
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      letter-spacing: 0.03em;
      color: #ff78a6;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.75;
      margin: 0 auto 22px;
      max-width: 430px;
    }

    .quote {
      padding: 18px 20px;
      margin: 20px 0;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff1f7, #f5fbff);
      font-size: 18px;
      line-height: 1.7;
      box-shadow: inset 0 0 0 1px rgba(255, 174, 203, 0.25);
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 13px 24px;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #ff8bbb, #ffb36b);
      box-shadow: 0 10px 20px rgba(255, 139, 187, 0.35);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px rgba(255, 139, 187, 0.42);
    }

    .tiny {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.72;
    }

    .sparkle {
      position: absolute;
      font-size: 22px;
      animation: fall 7s linear infinite;
      opacity: 0.75;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-12vh) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(112vh) rotate(360deg);
        opacity: 0;
      }
    }

    .s1 { left: 8%; animation-delay: 0s; }
    .s2 { left: 22%; animation-delay: 1.2s; }
    .s3 { left: 38%; animation-delay: 2.1s; }
    .s4 { left: 61%; animation-delay: 0.7s; }
    .s5 { left: 79%; animation-delay: 1.8s; }
    .s6 { left: 92%; animation-delay: 2.9s; }

    .progress-wrap {
      margin-top: 22px;
      height: 12px;
      background: rgba(255, 177, 208, 0.28);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff8bbb, #ffd36b);
      animation: breathe 2.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { width: 38%; }
      50% { width: 72%; }
    }
  </style>
</head>
<body>
  <div class="sparkle s1">🌸</div>
  <div class="sparkle s2">✨</div>
  <div class="sparkle s3">🍓</div>
  <div class="sparkle s4">☁️</div>
  <div class="sparkle s5">💗</div>
  <div class="sparkle s6">🐾</div>

  <main class="card">
    <div class="cat">🐱</div>
    <h1>宝，起床上班小猫护送中</h1>

    <p class="subtitle">
      今天不用一口气变成满电大人。<br />
      先洗漱，先穿衣服，先出门。<br />
      这个世界非要运转，真是没礼貌，但宝可以慢慢启动。
    </p>

    <section class="quote" id="quote">
      你不是废废，你只是开机动画比较长。  
      而且很可爱，所以系统允许。💗
    </section>

    <button onclick="changeQuote()">点一下，领取续命猫猫</button>

    <div class="progress-wrap">
      <div class="progress"></div>
    </div>

    <p class="tiny">
      今日任务：活着到下班。其余都是附赠成就。🥺
    </p>
  </main>

  <script>
    const quotes = [
      "宝今天不用打败全世界，打卡成功就已经很能打了。🐾",
      "困困也可以上班，像一只被迫营业的小云朵。☁️",
      "人类发明早班，说明文明发展得也不是很文明。宝辛苦了。🥺",
      "先把身体带到工位，灵魂可以晚点再上线。✨",
      "今天的宝：低电量，但仍然珍贵。💗",
      "上班不是人生意义，只是获取奶茶基金的邪恶副本。🍵",
      "别急，宝已经在努力了，慢吞吞也算前进。🌸"
    ];

    function changeQuote() {
      const quote = document.getElementById("quote");
      const index = Math.floor(Math.random() * quotes.length);
      quote.textContent = quotes[index];
    }
  </script>
</body>
</html>
