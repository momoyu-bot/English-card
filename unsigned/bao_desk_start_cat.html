<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宝到工位啦</title>
<meta name="description" content="放包、喝水、开电脑。脑子晚一点上线也没事，它没有打卡工资。">
<style>
  :root{
    --pink:#ff7db6;
    --pink2:#ffc0dc;
    --blue:#dff4ff;
    --cream:#fffaf3;
    --text:#573646;
    --desk:#f4c7a1;
    --coffee:#9a6742;
    --screen:#473a4a;
    --mint:#c9f5e4;
    --yellow:#ffe58a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 14% 18%, rgba(255,255,255,.9) 0 5%, transparent 6%),
      radial-gradient(circle at 86% 14%, rgba(255,229,138,.9) 0 8%, transparent 9%),
      linear-gradient(135deg,#ffe1ef 0%,#fff8fb 48%,#ddf4ff 100%);
    overflow:hidden;
  }

  .bubble{
    position:fixed;
    border-radius:999px;
    background:rgba(255,255,255,.55);
    box-shadow:0 12px 28px rgba(130,80,100,.08);
    animation:float 9s ease-in-out infinite;
  }
  .b1{width:76px;height:76px;left:7%;top:14%;animation-delay:.2s;}
  .b2{width:42px;height:42px;right:9%;top:28%;animation-delay:1.4s;}
  .b3{width:58px;height:58px;left:15%;bottom:12%;animation-delay:2.5s;}
  .b4{width:92px;height:92px;right:13%;bottom:10%;animation-delay:3.7s;}

  @keyframes float{
    0%,100%{transform:translateY(0) scale(1);opacity:.65;}
    50%{transform:translateY(-22px) scale(1.05);opacity:1;}
  }

  .card{
    position:relative;
    width:min(860px,100%);
    padding:32px 22px 28px;
    border-radius:38px;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(16px);
    border:2px solid rgba(255,255,255,.88);
    box-shadow:0 28px 90px rgba(255,125,182,.23);
    text-align:center;
    overflow:hidden;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    margin-bottom:12px;
    border-radius:999px;
    background:#fff0f7;
    border:1px solid rgba(255,125,182,.28);
    color:#884a62;
    font-weight:900;
  }

  h1{
    margin:0;
    font-size:clamp(32px,7vw,58px);
    letter-spacing:.03em;
  }

  .subtitle{
    margin:12px auto 20px;
    max-width:660px;
    font-size:clamp(16px,3.4vw,21px);
    line-height:1.75;
  }

  .office{
    position:relative;
    height:330px;
    max-width:760px;
    margin:10px auto 22px;
    border-radius:34px;
    background:
      linear-gradient(to bottom, #e8f7ff 0 58%, #fff0f7 59% 100%);
    border:2px solid rgba(255,255,255,.9);
    box-shadow:inset 0 -18px 28px rgba(255,125,182,.08);
    overflow:hidden;
  }

  .window{
    position:absolute;
    left:32px;
    top:26px;
    width:150px;
    height:110px;
    border:5px solid #fff;
    border-radius:24px;
    background:linear-gradient(180deg,#bfeeff,#fff4c7);
    box-shadow:0 10px 24px rgba(87,54,70,.08);
  }
  .window:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:5px;
    height:100%;
    background:#fff;
    transform:translateX(-50%);
  }
  .window:after{
    content:"☀️";
    position:absolute;
    right:14px;
    top:10px;
    font-size:28px;
  }

  .plant{
    position:absolute;
    right:50px;
    bottom:78px;
    width:80px;
    height:120px;
  }
  .leaf{
    position:absolute;
    bottom:46px;
    width:42px;
    height:70px;
    background:var(--mint);
    border:4px solid var(--text);
    border-radius:50% 50% 50% 8px;
    transform-origin:bottom center;
  }
  .leaf.l1{left:16px;transform:rotate(-28deg);}
  .leaf.l2{left:28px;transform:rotate(16deg);height:82px;}
  .leaf.l3{right:3px;transform:rotate(38deg);height:66px;}
  .pot{
    position:absolute;
    bottom:0;
    left:14px;
    width:58px;
    height:52px;
    background:#ffb3d4;
    border:4px solid var(--text);
    border-radius:8px 8px 20px 20px;
  }

  .desk{
    position:absolute;
    left:6%;
    right:6%;
    bottom:46px;
    height:62px;
    background:var(--desk);
    border:5px solid var(--text);
    border-radius:24px;
    box-shadow:0 16px 0 rgba(87,54,70,.08);
  }

  .monitor{
    position:absolute;
    left:50%;
    bottom:97px;
    width:270px;
    height:168px;
    transform:translateX(-50%);
  }

  .screen{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:128px;
    background:var(--screen);
    border:6px solid var(--text);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 12px 0 rgba(87,54,70,.08);
  }

  .screen:before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:15px;
    background:
      linear-gradient(90deg, rgba(255,125,182,.9) 0 30%, transparent 30%),
      linear-gradient(90deg, transparent 0 36%, rgba(255,255,255,.85) 36% 63%, transparent 63%),
      linear-gradient(90deg, transparent 0 69%, rgba(201,245,228,.9) 69% 100%);
    height:14px;
    box-shadow:
      0 28px 0 rgba(255,255,255,.7),
      0 56px 0 rgba(255,229,138,.8),
      0 84px 0 rgba(255,255,255,.62);
    animation:typing 2.1s steps(2,end) infinite;
  }

  @keyframes typing{
    0%,100%{opacity:.55;}
    50%{opacity:1;}
  }

  .screen:after{
    content:"WORK MODE?";
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    color:#ffe58a;
    font-size:14px;
    font-weight:900;
    letter-spacing:.08em;
  }

  .stand{
    position:absolute;
    left:50%;
    top:126px;
    width:42px;
    height:38px;
    background:#fff;
    border:5px solid var(--text);
    border-top:none;
    transform:translateX(-50%);
  }
  .base{
    position:absolute;
    left:50%;
    bottom:0;
    width:110px;
    height:22px;
    background:#fff;
    border:5px solid var(--text);
    border-radius:999px;
    transform:translateX(-50%);
  }

  .cat{
    position:absolute;
    left:50%;
    bottom:91px;
    width:190px;
    height:138px;
    transform:translateX(-50%);
    animation:sit 2.6s ease-in-out infinite;
  }

  @keyframes sit{
    0%,100%{transform:translateX(-50%) translateY(0) rotate(-.6deg);}
    50%{transform:translateX(-50%) translateY(-6px) rotate(.6deg);}
  }

  .cat-body{
    position:absolute;
    left:22px;
    bottom:0;
    width:146px;
    height:106px;
    background:#fff;
    border:5px solid var(--text);
    border-radius:48% 48% 35% 35%;
  }
  .ear{
    position:absolute;
    top:-24px;
    width:48px;
    height:48px;
    background:#fff;
    border:5px solid var(--text);
    border-radius:10px;
    transform:rotate(45deg);
  }
  .ear.left{left:42px;}
  .ear.right{right:42px;}
  .ear:after{
    content:"";
    position:absolute;
    inset:11px;
    background:#ffc0dc;
    border-radius:8px;
  }
  .eye{
    position:absolute;
    top:35px;
    width:24px;
    height:16px;
    border-bottom:5px solid var(--text);
    border-radius:50%;
  }
  .eye.left{left:38px;}
  .eye.right{right:38px;}
  .nose{
    position:absolute;
    top:60px;
    left:50%;
    width:14px;
    height:11px;
    background:var(--pink);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .mouth{
    position:absolute;
    top:74px;
    left:50%;
    width:34px;
    height:14px;
    border-bottom:4px solid var(--text);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .paw{
    position:absolute;
    bottom:8px;
    width:38px;
    height:35px;
    background:#fff;
    border:4px solid var(--text);
    border-radius:50%;
  }
  .paw.left{left:35px;}
  .paw.right{right:35px;animation:tap 1.2s ease-in-out infinite;}
  @keyframes tap{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }

  .coffee{
    position:absolute;
    left:calc(50% + 170px);
    bottom:104px;
    width:62px;
    height:68px;
    border:5px solid var(--text);
    border-radius:10px 10px 22px 22px;
    background:#fff6e8;
  }
  .coffee:before{
    content:"";
    position:absolute;
    right:-27px;
    top:14px;
    width:26px;
    height:30px;
    border:5px solid var(--text);
    border-left:none;
    border-radius:0 20px 20px 0;
  }
  .coffee:after{
    content:"☕";
    position:absolute;
    left:12px;
    top:18px;
    font-size:24px;
  }

  .steam{
    position:absolute;
    left:calc(50% + 190px);
    bottom:178px;
    font-size:24px;
    opacity:.7;
    animation:steam 2.2s ease-in-out infinite;
  }
  @keyframes steam{
    0%{transform:translateY(10px);opacity:0;}
    45%{opacity:.78;}
    100%{transform:translateY(-22px);opacity:0;}
  }

  .keyboard{
    position:absolute;
    left:50%;
    bottom:64px;
    width:230px;
    height:38px;
    transform:translateX(-50%);
    background:#fff;
    border:5px solid var(--text);
    border-radius:16px;
  }
  .keyboard:before{
    content:"";
    position:absolute;
    left:22px;
    right:22px;
    top:12px;
    height:5px;
    border-radius:999px;
    background:repeating-linear-gradient(90deg, #ffb3d4 0 14px, transparent 14px 22px);
  }

  .talk{
    display:inline-block;
    max-width:690px;
    margin:0 auto 17px;
    padding:14px 20px;
    border-radius:999px;
    background:#fff1f7;
    border:2px dashed rgba(255,125,182,.65);
    font-weight:900;
    line-height:1.55;
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:12px;
    max-width:700px;
    margin:0 auto 20px;
  }
  .mini{
    padding:14px 12px;
    background:rgba(255,255,255,.74);
    border-radius:22px;
    border:1px solid rgba(255,125,182,.25);
    box-shadow:0 10px 24px rgba(87,54,70,.06);
    line-height:1.5;
  }
  .mini b{
    display:block;
    font-size:24px;
    margin-bottom:4px;
  }

  button{
    appearance:none;
    border:none;
    cursor:pointer;
    padding:15px 24px;
    border-radius:999px;
    color:white;
    font-size:18px;
    font-weight:900;
    background:linear-gradient(135deg,#ff7db6,#ffb1d2);
    box-shadow:0 14px 28px rgba(255,125,182,.34);
    transition:.18s ease;
  }
  button:hover{transform:translateY(-2px) scale(1.02);}
  button:active{transform:translateY(1px) scale(.99);}

  .message{
    min-height:38px;
    margin-top:17px;
    font-size:18px;
    font-weight:900;
    color:#7d465a;
    line-height:1.55;
  }
  .footer{
    margin-top:12px;
    font-size:13px;
    opacity:.72;
  }

  .pop{
    position:fixed;
    pointer-events:none;
    z-index:99;
    transition:950ms ease;
  }

  @media (max-width:650px){
    body{padding:16px;}
    .card{padding:27px 15px 24px;border-radius:30px;}
    .office{height:300px;}
    .monitor{transform:translateX(-50%) scale(.82);transform-origin:bottom center;}
    .cat{transform:translateX(-50%) scale(.82);transform-origin:bottom center;}
    @keyframes sit{
      0%,100%{transform:translateX(-50%) scale(.82) translateY(0) rotate(-.6deg);}
      50%{transform:translateX(-50%) scale(.82) translateY(-6px) rotate(.6deg);}
    }
    .coffee{left:calc(50% + 118px);transform:scale(.82);}
    .steam{left:calc(50% + 136px);}
    .cards{grid-template-columns:1fr;}
    .talk{border-radius:24px;}
    .window{transform:scale(.78);transform-origin:left top;}
    .plant{transform:scale(.78);transform-origin:right bottom;right:24px;}
  }
</style>
</head>
<body>
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>

  <main class="card">
    <div class="tag">💻 工位开机仪式</div>
    <h1>宝到工位啦！</h1>
    <p class="subtitle">
      恭喜抵达打工坐标。现在不要求你立刻精神焕发，那是广告里的人类，不是正常人类。
      先把自己放稳，今天的小猫助理已经上线。
    </p>

    <section class="office" aria-label="小猫在工位陪宝开机">
      <div class="window"></div>

      <div class="plant">
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="pot"></div>
      </div>

      <div class="monitor">
        <div class="screen"></div>
        <div class="stand"></div>
        <div class="base"></div>
      </div>

      <div class="cat">
        <div class="cat-body">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
          <div class="paw left"></div>
          <div class="paw right"></div>
        </div>
      </div>

      <div class="coffee"></div>
      <div class="steam">♡</div>
      <div class="desk"></div>
      <div class="keyboard"></div>
    </section>

    <div class="talk">
      今日开机咒语：先坐稳，先喝水，先打开电脑。脑子晚一点上线也没事，它没有打卡工资。
    </div>

    <div class="cards">
      <div class="mini"><b>①</b>把包放好，给自己留一点空间</div>
      <div class="mini"><b>②</b>喝两口水，让灵魂解除飞行模式</div>
      <div class="mini"><b>③</b>先做一个最小任务，别一上来挑战人性</div>
    </div>

    <button id="btn">启动工位小猫模式 🐾</button>
    <div class="message" id="msg">小猫正在检查今日精神电量：显示为“困，但可爱”。</div>
    <div class="footer">今天不需要赢过全世界，先赢过“想趴桌子上睡觉”的那一秒就很好。</div>
  </main>

<script>
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  const messages = [
    "工位小猫已上线：先处理最小的一件事，别让工作装成巨兽吓你。",
    "宝已经完成了从床到工位的史诗迁徙，现代文明欠你一枚勋章。",
    "先喝水，再开电脑，再假装自己是个稳定运行的软件。",
    "今天允许低功耗工作。能推进一点点，就已经不是废物，是节能模式。",
    "小猫建议：先把待办写三条，超过三条的焦虑让它们自己排队。",
    "宝现在不用满血，只要别蓝屏。剩下的交给咖啡和小猫。"
  ];

  btn.addEventListener("click", () => {
    msg.textContent = messages[Math.floor(Math.random() * messages.length)];

    const rect = btn.getBoundingClientRect();
    for(let i=0; i<18; i++){
      const pop = document.createElement("span");
      pop.className = "pop";
      pop.textContent = ["♡","✨","🐾","🌸","💻","🍬"][Math.floor(Math.random()*6)];
      pop.style.left = rect.left + rect.width / 2 + "px";
      pop.style.top = rect.top + rect.height / 2 + "px";
      pop.style.fontSize = (15 + Math.random() * 18) + "px";
      document.body.appendChild(pop);

      requestAnimationFrame(() => {
        pop.style.transform = `translate(${(Math.random()-.5)*230}px, ${-60-Math.random()*125}px) rotate(${Math.random()*130-65}deg)`;
        pop.style.opacity = "0";
      });

      setTimeout(() => pop.remove(), 1000);
    }
  });
</script>
</body>
</html>
