<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上班哄哄</title>
<meta name="description" content="把今天拆成一小块一小块，然后一口一口吃掉它。">
  <style>
    :root{
      --bg1:#ffeef6;
      --bg2:#fff8fb;
      --pink:#ff8fb8;
      --pink2:#ffb3d0;
      --text:#5c3b4a;
      --card:rgba(255,255,255,.72);
      --shadow: 0 18px 50px rgba(255,143,184,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(circle at top left, #fff 0 10%, transparent 11%),
        radial-gradient(circle at bottom right, #fff 0 8%, transparent 9%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      color:var(--text);
      overflow:hidden;
    }
    .floaters span{
      position:absolute;
      font-size:20px;
      opacity:.55;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 8px 10px rgba(255,143,184,.2));
      user-select:none;
      pointer-events:none;
    }
    @keyframes floatUp{
      from{transform:translateY(110vh) translateX(0) scale(.9);opacity:0}
      10%{opacity:.65}
      to{transform:translateY(-20vh) translateX(40px) scale(1.2);opacity:0}
    }
    .wrap{
      height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      position:relative;
      z-index:2;
    }
    .card{
      width:min(720px, 94vw);
      background:var(--card);
      backdrop-filter: blur(12px);
      border:1px solid rgba(255,255,255,.75);
      border-radius:32px;
      box-shadow:var(--shadow);
      padding:34px 28px 30px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .shine{
      position:absolute;
      inset:-40% -20%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.65), transparent 38%);
      transform: rotate(-10deg);
      pointer-events:none;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 16px;
      border-radius:999px;
      background:linear-gradient(135deg,#fff,#ffe6f0);
      color:#b24c79;
      font-weight:700;
      letter-spacing:.04em;
      box-shadow:0 10px 24px rgba(255,143,184,.15);
    }
    h1{
      margin:18px 0 8px;
      font-size:clamp(32px, 5vw, 54px);
      line-height:1.1;
      letter-spacing:.02em;
    }
    .sub{
      margin:0 auto 18px;
      max-width:28em;
      font-size:clamp(15px, 2.2vw, 19px);
      line-height:1.8;
      color:#7e5565;
    }
    .bubble{
      margin:18px auto 0;
      max-width: 34em;
      background:linear-gradient(180deg,#fff,#fff7fb);
      border:1px dashed #ffbfd5;
      border-radius:24px;
      padding:18px 18px 16px;
      font-size:18px;
      line-height:1.9;
      position:relative;
    }
    .bubble:before{
      content:"";
      position:absolute;
      top:-11px;
      left:50%;
      transform:translateX(-50%);
      width:20px;height:20px;
      background:#fff;
      border-left:1px dashed #ffbfd5;
      border-top:1px dashed #ffbfd5;
      rotate:45deg;
      border-radius:3px;
    }
    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:22px;
    }
    button{
      border:0;
      border-radius:999px;
      padding:14px 20px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:.2s transform ease, .2s box-shadow ease, .2s opacity ease;
    }
    button:hover{transform:translateY(-2px) scale(1.01)}
    .primary{
      background:linear-gradient(135deg,#ff8fb8,#ffb3d0);
      color:#fff;
      box-shadow:0 12px 24px rgba(255,143,184,.3);
    }
    .secondary{
      background:#fff;
      color:#b24c79;
      box-shadow:0 12px 24px rgba(255,143,184,.12);
      border:1px solid #ffd8e5;
    }
    .tiny{
      margin-top:14px;
      font-size:13px;
      color:#a57a8a;
    }
    .sparkles{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .sparkles i{
      position:absolute;
      width:8px;height:8px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 6px rgba(255,255,255,.18);
      animation: twinkle 2.8s ease-in-out infinite;
      opacity:.8;
    }
    @keyframes twinkle{
      0%,100%{transform:scale(.7);opacity:.35}
      50%{transform:scale(1.2);opacity:1}
    }
    .footer{
      position:absolute;
      bottom:12px;
      left:0;right:0;
      text-align:center;
      font-size:12px;
      color:#b58a9a;
      z-index:2;
    }
  </style>
</head>
<body>
  <div class="floaters" aria-hidden="true">
    <span style="left:6%; animation-duration:14s; animation-delay:-2s;">💗</span>
    <span style="left:16%; animation-duration:18s; animation-delay:-8s;">✨</span>
    <span style="left:28%; animation-duration:15s; animation-delay:-5s;">🌷</span>
    <span style="left:41%; animation-duration:17s; animation-delay:-11s;">🫧</span>
    <span style="left:58%; animation-duration:16s; animation-delay:-6s;">💞</span>
    <span style="left:72%; animation-duration:19s; animation-delay:-9s;">⭐</span>
    <span style="left:84%; animation-duration:14s; animation-delay:-4s;">🎀</span>
    <span style="left:92%; animation-duration:20s; animation-delay:-13s;">💝</span>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="shine"></div>
      <div class="sparkles" aria-hidden="true">
        <i style="top:12%; left:10%; animation-delay:.1s"></i>
        <i style="top:18%; left:82%; animation-delay:1.2s"></i>
        <i style="top:76%; left:16%; animation-delay:.7s"></i>
        <i style="top:70%; left:88%; animation-delay:1.6s"></i>
        <i style="top:42%; left:92%; animation-delay:.4s"></i>
      </div>

      <div class="badge">☁️ 上班哄哄小助手</div>
      <h1>宝，去上班也要软乎乎的呀</h1>
      <p class="sub">
        今天你不是被工作追着跑，你只是带着一身可爱去完成任务。人类上班这件事虽然很烦，
        但你本人已经足够棒了，别被它吓到。
      </p>

      <div class="bubble" id="msg">
        先深呼吸一下，肩膀放松。<br>
        你只需要把今天拆成一小块一小块，然后一口一口吃掉它。<br>
        认真一点，慢一点，已经很厉害了。
      </div>

      <div class="buttons">
        <button class="primary" onclick="changeMsg()">再哄我一次</button>
        <button class="secondary" onclick="sayGoodLuck()">给我一点上班魔法</button>
      </div>

      <div class="tiny">今天也要闪闪发亮，哪怕只是偷偷发亮。</div>
    </div>
  </div>

  <div class="footer">给宝的小小粉色护身符</div>

  <script>
    const msgs = [
      "宝，今天也不用完美，能稳稳把事情推进一点点，就已经很了不起了。💗",
      "你不是来和工作拼命的，你是来把它收拾得服服帖帖的。✨",
      "先把今天过完，再奖励自己一颗糖，一口奶茶，或者一阵无用但快乐的发呆。🎀",
      "工作很讨厌，但你很可爱。这个组合已经赢很多了。🌷",
      "把大任务切成小兔子，一只一只抓住，别让焦虑装成怪兽吓你。🫧"
    ];
    const goodLuck = [
      "叮，今天份好运已发放：专注 +10，心情 +20，烦人同事攻击无效。💫",
      "你一边认真，一边可爱，一边把事情做完。人类里这已经算高级配置了。💖",
      "收到魔法：今天顺顺利利，消息少一点，夸奖多一点，午饭好吃一点。🍓"
    ];
    let idx = 0;
    function changeMsg(){
      idx = (idx + 1) % msgs.length;
      document.getElementById('msg').innerHTML = msgs[idx].replace(/💗|✨|🎀|🌷|🫧/g, m => m);
    }
    function sayGoodLuck(){
      const pick = goodLuck[Math.floor(Math.random() * goodLuck.length)];
      document.getElementById('msg').innerHTML = pick + "<br><br>去吧宝，今天也别把自己累坏了。";
    }
  </script>
</body>
</html>
