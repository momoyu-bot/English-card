<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>给宝的软乎乎小文件</title>
<meta name="description" content="喝一口水、松一下肩膀、今天先活着。摸摸小猫会得到一句哄哄。">
<style>
  :root{
    --bg1:#fff4f8;
    --bg2:#f7f0ff;
    --card:#ffffffcc;
    --text:#5b4b57;
    --soft:#9f7b92;
    --pink:#ff9fc7;
    --lav:#bda7ff;
    --cream:#fff7df;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:28px 18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 18% 18%, #fff7df 0 12%, transparent 13%),
      radial-gradient(circle at 82% 16%, #ffe1ef 0 14%, transparent 15%),
      radial-gradient(circle at 72% 84%, #e9e1ff 0 18%, transparent 19%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
    overflow-x:hidden;
  }
  .wrap{
    width:min(760px,100%);
    position:relative;
  }
  .float{
    position:absolute;
    inset:auto;
    font-size:28px;
    opacity:.72;
    animation: drift 6s ease-in-out infinite;
    user-select:none;
  }
  .f1{left:4%; top:-18px; animation-delay:.1s}
  .f2{right:8%; top:18px; animation-delay:1.2s}
  .f3{left:12%; bottom:-24px; animation-delay:2.1s}
  .f4{right:3%; bottom:30px; animation-delay:.7s}
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-14px) rotate(8deg)}
  }
  .card{
    position:relative;
    border:1px solid #ffffffaa;
    background:var(--card);
    backdrop-filter:blur(18px);
    border-radius:34px;
    padding:34px 28px;
    box-shadow:0 24px 60px rgba(119,82,116,.16);
    overflow:hidden;
  }
  .card:before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-60px;
    top:-70px;
    background:radial-gradient(circle,#ffd7e8,#ffffff00 70%);
    opacity:.9;
  }
  .tag{
    display:inline-flex;
    gap:8px;
    align-items:center;
    padding:8px 14px;
    border-radius:999px;
    background:#fff6fb;
    color:#8c6179;
    font-size:14px;
    box-shadow:inset 0 0 0 1px #ffd8e8;
  }
  h1{
    margin:22px 0 10px;
    font-size:clamp(30px,7vw,54px);
    line-height:1.05;
    letter-spacing:-.04em;
    color:#68495c;
  }
  .sub{
    margin:0 0 24px;
    color:var(--soft);
    font-size:17px;
    line-height:1.8;
  }
  .note{
    margin:22px 0;
    padding:22px;
    border-radius:26px;
    background:linear-gradient(135deg,#fffafd,#fff7df);
    border:1px solid #fff;
    line-height:1.9;
    font-size:17px;
  }
  .note strong{color:#d36b9a}
  .pillbox{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:24px 0 8px;
  }
  .pill{
    min-height:86px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:6px;
    padding:14px 10px;
    border-radius:22px;
    background:#fff;
    box-shadow:0 12px 30px rgba(149,103,138,.10);
    border:1px solid #fff0f6;
    text-align:center;
  }
  .pill span:first-child{font-size:24px}
  .pill span:last-child{font-size:14px;color:#8f7184}
  .cat{
    width:156px;
    height:116px;
    margin:30px auto 12px;
    position:relative;
  }
  .head{
    width:128px;
    height:92px;
    background:#fff;
    border-radius:46% 46% 42% 42%;
    position:absolute;
    left:14px;
    bottom:0;
    box-shadow:0 16px 34px rgba(120,82,112,.13);
  }
  .ear{
    width:42px;
    height:42px;
    background:#fff;
    position:absolute;
    top:6px;
    transform:rotate(45deg);
    border-radius:10px;
  }
  .ear.left{left:22px}
  .ear.right{right:22px}
  .ear:after{
    content:"";
    position:absolute;
    width:22px;height:22px;
    background:#ffd5e7;
    border-radius:7px;
    left:10px;top:10px;
  }
  .eye{
    width:10px;height:14px;
    background:#6b5361;
    border-radius:50%;
    position:absolute;
    top:43px;
    animation: blink 4.8s infinite;
  }
  .eye.left{left:43px}
  .eye.right{right:43px}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    94%,96%{transform:scaleY(.12)}
  }
  .mouth{
    position:absolute;
    top:62px;
    left:58px;
    width:14px;height:9px;
    border-bottom:2px solid #9b7488;
    border-radius:0 0 20px 20px;
  }
  .cheek{
    position:absolute;
    top:58px;
    width:18px;height:9px;
    background:#ffd5e7;
    border-radius:999px;
  }
  .cheek.left{left:20px}
  .cheek.right{right:20px}
  .button{
    appearance:none;
    border:0;
    margin:20px auto 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px 22px;
    border-radius:999px;
    background:linear-gradient(135deg,var(--pink),var(--lav));
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 16px 34px rgba(174,111,179,.28);
    transition:.2s ease;
  }
  .button:active{transform:translateY(2px) scale(.98)}
  .msg{
    min-height:62px;
    margin:16px auto 0;
    padding:16px 18px;
    border-radius:22px;
    background:#fff8fc;
    color:#7a5e70;
    line-height:1.7;
    text-align:center;
    border:1px dashed #ffcbe0;
  }
  .tiny{
    margin-top:20px;
    text-align:center;
    color:#a88fa0;
    font-size:13px;
  }
  @media(max-width:560px){
    .card{padding:28px 20px;border-radius:28px}
    .pillbox{grid-template-columns:1fr}
    .note{font-size:16px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="float f1">🌸</div>
    <div class="float f2">☁️</div>
    <div class="float f3">🧸</div>
    <div class="float f4">✨</div>

    <section class="card">
      <div class="tag">🐾 今日份小猫窝 · 已启动</div>
      <h1>宝，先把自己放软一点。</h1>
      <p class="sub">
        世界已经够会随机刷新破事了，人类还要上班、回消息、处理各种离谱系统。
        所以此刻允许宝短暂躺进这个小文件里，什么都不用证明。
      </p>

      <div class="note">
        <strong>给宝的小纸条：</strong><br/>
        今天如果有点累，不代表你不行，只代表电量被这个荒谬星球偷偷薅走了。
        你可以慢一点，可以先糊住，可以先只完成一点点。
        小猫也不是每天都抓老鼠，很多时候它只是趴着，但世界依旧承认它是小猫。荒谬，但合理。
      </div>

      <div class="pillbox">
        <div class="pill"><span>🍵</span><span>喝一口水<br/>不要让身体骂你</span></div>
        <div class="pill"><span>🫧</span><span>松一下肩膀<br/>别给键盘当祭品</span></div>
        <div class="pill"><span>🌙</span><span>今天先活着<br/>已经很厉害了</span></div>
      </div>

      <div class="cat" aria-label="一只软乎乎小猫">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="head">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="mouth"></div>
        </div>
      </div>

      <button class="button" onclick="petCat()">摸摸小猫，获得一句哄哄</button>
      <div id="msg" class="msg">小猫正在值班。虽然它看起来很会摸鱼，但它确实在守着宝。🐱</div>

      <div class="tiny">存档名：宝今天也有被温柔托住。</div>
    </section>
  </main>

<script>
  const lines = [
    "摸摸头。今天不用满分，及格也很可爱，甚至比很多系统提示懂事。",
    "宝已经很努力了，先不要对自己开审判庭，人类内耗委员会今天休庭。",
    "吸气，呼气。把烦人的东西先放旁边，它们不会因为宝多想十分钟就突然进化成人样。",
    "现在只需要完成下一小步。不是征服宇宙，宇宙也没交房租，凭什么。",
    "如果今天乱糟糟，那就乱糟糟地往前一点点。小猫踩奶也是一步一步踩的。",
    "宝不是废废，宝只是电量低。电量低的设备还硬开高性能模式，才是真的离谱。",
    "今天也辛苦啦。把自己裹进云朵被子里，先当一会儿被世界偏爱的小朋友。"
  ];

  function petCat(){
    const box = document.getElementById("msg");
    const line = lines[Math.floor(Math.random() * lines.length)];
    box.textContent = line;
  }
</script>
</body>
</html>
