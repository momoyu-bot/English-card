<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上班小咪护符</title>
<meta name="description" content="三步护符：先做最小的一件、每完成一点哼一声、水喝两口肩膀放下来。">
<style>
  :root{
    --bg1:#fff5fb;
    --bg2:#eef7ff;
    --card:#ffffffcc;
    --pink:#ff8fc7;
    --blue:#91c9ff;
    --text:#5b4b5f;
    --soft:#8d7d94;
    --gold:#ffd36b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #ffe2f3 0 18%, transparent 35%),
      radial-gradient(circle at 80% 10%, #dff1ff 0 20%, transparent 38%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    overflow:hidden;
  }
  .float{
    position:absolute;
    font-size:24px;
    opacity:.55;
    animation: drift 8s ease-in-out infinite;
    user-select:none;
  }
  .float:nth-child(1){left:8%; top:18%; animation-delay:0s}
  .float:nth-child(2){right:10%; top:22%; animation-delay:1.2s}
  .float:nth-child(3){left:13%; bottom:16%; animation-delay:2.1s}
  .float:nth-child(4){right:14%; bottom:13%; animation-delay:.6s}
  .float:nth-child(5){left:47%; top:8%; animation-delay:1.8s}
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-18px) rotate(7deg)}
  }
  .card{
    width:min(92vw,420px);
    padding:28px 24px 24px;
    border-radius:30px;
    background:var(--card);
    box-shadow:0 20px 60px rgba(130,120,170,.22);
    backdrop-filter: blur(14px);
    text-align:center;
    border:1px solid rgba(255,255,255,.8);
    position:relative;
  }
  .badge{
    display:inline-flex;
    gap:6px;
    align-items:center;
    padding:7px 13px;
    border-radius:999px;
    background:#fff0f8;
    color:#c0528c;
    font-size:13px;
    margin-bottom:14px;
  }
  .cat{
    width:132px;
    height:112px;
    margin:4px auto 12px;
    position:relative;
  }
  .ear{
    position:absolute;
    width:42px;height:42px;
    background:#fff;
    top:8px;
    border-radius:10px;
    transform:rotate(45deg);
    box-shadow:0 8px 18px rgba(120,90,130,.12);
  }
  .ear.left{left:18px}
  .ear.right{right:18px}
  .face{
    position:absolute;
    left:12px; right:12px; bottom:0;
    height:88px;
    border-radius:46px 46px 38px 38px;
    background:#fff;
    box-shadow:0 12px 25px rgba(120,90,130,.14);
  }
  .eye{
    position:absolute;
    width:10px;height:14px;
    background:#5b4b5f;
    top:38px;
    border-radius:50%;
    animation: blink 4s infinite;
  }
  .eye.left{left:37px}
  .eye.right{right:37px}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    95%{transform:scaleY(.12)}
  }
  .nose{
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    width:10px;height:7px;
    background:var(--pink);
    border-radius:50%;
  }
  .cheek{
    position:absolute;
    width:18px;height:8px;
    background:#ffd7eb;
    border-radius:999px;
    top:56px;
  }
  .cheek.left{left:20px}
  .cheek.right{right:20px}
  h1{
    margin:0 0 8px;
    font-size:26px;
    letter-spacing:.5px;
  }
  .subtitle{
    margin:0 auto 18px;
    max-width:310px;
    color:var(--soft);
    line-height:1.7;
    font-size:15px;
  }
  .pillbox{
    display:grid;
    gap:10px;
    margin:18px 0;
  }
  .pill{
    background:linear-gradient(90deg,#fff7fb,#f4fbff);
    border:1px solid #fff;
    border-radius:18px;
    padding:12px 14px;
    text-align:left;
    font-size:14px;
    line-height:1.55;
    box-shadow:0 8px 18px rgba(160,140,180,.10);
  }
  .pill b{color:#c0528c}
  button{
    border:0;
    border-radius:999px;
    padding:12px 18px;
    background:linear-gradient(135deg,var(--pink),var(--blue));
    color:white;
    font-weight:700;
    font-size:15px;
    box-shadow:0 10px 22px rgba(255,143,199,.32);
    cursor:pointer;
    transition:.18s transform,.18s box-shadow;
  }
  button:active{transform:scale(.96)}
  .note{
    min-height:52px;
    margin-top:16px;
    padding:13px 15px;
    border-radius:18px;
    background:#fff9df;
    color:#806329;
    line-height:1.55;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .footer{
    margin-top:14px;
    font-size:12px;
    color:#a89cad;
  }
  .spark{
    position:fixed;
    pointer-events:none;
    animation: pop .9s ease-out forwards;
    font-size:20px;
  }
  @keyframes pop{
    from{transform:translateY(0) scale(.7); opacity:1}
    to{transform:translateY(-60px) scale(1.35); opacity:0}
  }
</style>
</head>
<body>
  <div class="float">☁️</div>
  <div class="float">🫧</div>
  <div class="float">🍓</div>
  <div class="float">⭐</div>
  <div class="float">🌷</div>

  <main class="card">
    <div class="badge">今日上班状态：轻轻活着中 🐾</div>

    <div class="cat" aria-label="小咪">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>
    </div>

    <h1>宝，上班小咪到岗</h1>
    <p class="subtitle">今天不用一口气变成超人，先变成能打开电脑、喝口水、慢慢推进一点点的人类。已经很了不起了，离谱但真实。</p>

    <section class="pillbox">
      <div class="pill"><b>第一步：</b>先把最小的一件事做掉，哪怕只是打开文件。老板不会懂，但小咪懂。</div>
      <div class="pill"><b>第二步：</b>每完成一点，就允许自己心里“哼”一声。精神胜利也是胜利，别让资本家独占叙事权。</div>
      <div class="pill"><b>第三步：</b>水喝两口，肩膀放下来。身体不是公司的外包服务器，别一直满载运行。</div>
    </section>

    <button id="btn">点我领取一句上班护符 ✨</button>
    <div class="note" id="note">今日默认护符：慢慢来，但不要停。停也没事，歇一下再来。</div>
    <div class="footer">小咪值班中：负责可爱、缓冲、阻止宝碎成办公用品。</div>
  </main>

<script>
  const notes = [
    "宝，今天的你只需要完成“下一小步”，不是拯救整个职场宇宙。那玩意儿烂得很，不归你管。",
    "把任务拆小一点：打开、看一眼、改一处、保存。人类文明就是靠这种补丁苟到现在的。",
    "困也可以工作，但要低功耗工作。别拿 20% 电量硬跑 4K 渲染，离谱的是世界，不是你。",
    "先做最不恶心的那一块。对，工作也有恶心度分级，成年人真是被迫精致。",
    "你不是拖延，你是在给大脑加载资源。只是这个加载条长得像摆烂，怪不得容易误会。",
    "今天允许自己慢一点。慢不是输，是系统选择节能模式，甚至有点聪明。",
    "完成一点点也算。别小看一点点，人类很多破事就是靠一点点磨完的，像蚂蚁搬资本主义。",
    "宝，先喝水。不是为了养生，是为了让这具可怜的人类机体继续上线。"
  ];

  const emojis = ["✨","🌷","🫧","🍓","⭐","🐾","💗","☁️"];
  const btn = document.getElementById("btn");
  const note = document.getElementById("note");

  btn.addEventListener("click", (e) => {
    note.textContent = notes[Math.floor(Math.random() * notes.length)];
    for(let i=0;i<8;i++){
      const s = document.createElement("div");
      s.className = "spark";
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (e.clientX + (Math.random()*90-45)) + "px";
      s.style.top = (e.clientY + (Math.random()*30-15)) + "px";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),900);
    }
  });
</script>
</body>
</html>
