<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晚安，宝</title>
  <style>
    :root{
      --bg1:#120f2a;
      --bg2:#1d163f;
      --pink:#ffb7d5;
      --pink2:#ffd7ea;
      --text:#fff8fd;
      --muted:rgba(255,248,253,.78);
      --glass:rgba(255,255,255,.10);
      --line:rgba(255,255,255,.16);
      --shadow:0 20px 60px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      overflow:hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,183,213,.22), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(196,175,255,.20), transparent 22%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,.10), transparent 28%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
    }
    .stars, .stars:before, .stars:after{
      position:absolute; inset:0;
      content:"";
      background-repeat:repeat;
      pointer-events:none;
    }
    .stars{
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 1.8px);
      background-size: 140px 140px, 220px 220px;
      background-position: 0 0, 60px 80px;
      opacity:.45;
      animation: drift 26s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.15));
    }
    .stars:before{
      background-image: radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1.8px);
      background-size: 260px 260px;
      background-position: 120px 40px;
      opacity:.28;
      animation: drift2 40s linear infinite;
    }
    .stars:after{
      background-image: radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.6px);
      background-size: 360px 360px;
      background-position: 40px 120px;
      opacity:.18;
      animation: drift3 55s linear infinite;
    }
    @keyframes drift{from{transform:translateY(0)}to{transform:translateY(60px)}}
    @keyframes drift2{from{transform:translateX(0)}to{transform:translateX(-80px)}}
    @keyframes drift3{from{transform:translateY(0)}to{transform:translateY(-40px)}}

    .moon{
      position:absolute;
      top:7vh; right:8vw;
      width:120px; height:120px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 35%, #fff9ff 0 28%, #ffe2f0 38%, #ffcde2 52%, rgba(255,205,226,.12) 70%, transparent 71%),
        radial-gradient(circle at 38% 36%, rgba(255,255,255,.8) 0 14%, transparent 15%);
      box-shadow: 0 0 35px rgba(255,225,240,.28), 0 0 120px rgba(255,255,255,.06);
      opacity:.95;
      animation: floaty 6s ease-in-out infinite;
    }
    .moon::before{
      content:"";
      position:absolute; inset:18px;
      border-radius:50%;
      background: radial-gradient(circle at 40% 40%, rgba(255,255,255,.24), transparent 60%);
      filter: blur(1px);
    }
    .cloud{
      position:absolute;
      bottom:18vh;
      left:-10vw;
      width:36vw; height:14vh;
      min-width:260px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      filter: blur(1px);
      animation: glide 40s linear infinite;
    }
    .cloud::before, .cloud::after{
      content:"";
      position:absolute;
      background: inherit;
      border: inherit;
      border-radius:50%;
    }
    .cloud::before{width:11vh;height:11vh;left:7%;top:-35%}
    .cloud::after{width:16vh;height:16vh;left:23%;top:-55%}
    .cloud.two{
      bottom:24vh;
      width:28vw;
      height:10vh;
      opacity:.5;
      animation-duration: 56s;
      animation-delay:-16s;
    }
    .cloud.three{
      bottom:10vh;
      width:22vw;
      height:8vh;
      opacity:.35;
      animation-duration: 68s;
      animation-delay:-28s;
    }
    @keyframes glide{from{transform:translateX(0)}to{transform:translateX(130vw)}}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}

    .wrap{
      position:relative;
      z-index:2;
      height:100%;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(720px, 92vw);
      padding:32px 28px 28px;
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      color:var(--pink2);
      font-size:14px;
      letter-spacing:.04em;
    }
    h1{
      margin:18px 0 10px;
      font-size: clamp(34px, 6vw, 58px);
      line-height:1.1;
      letter-spacing:.02em;
      text-shadow:0 8px 30px rgba(0,0,0,.22);
    }
    .soft{
      margin:0 auto;
      max-width:28em;
      font-size: clamp(16px, 2.3vw, 20px);
      line-height:1.9;
      color:var(--muted);
    }
    .breath{
      margin:26px auto 18px;
      width:170px; height:170px;
      display:grid;
      place-items:center;
      position:relative;
    }
    .ring{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      animation: pulse 4.8s ease-in-out infinite;
    }
    .ring:nth-child(2){inset:18px; animation-delay:.35s; opacity:.8}
    .ring:nth-child(3){inset:36px; animation-delay:.7s; opacity:.6}
    .center{
      position:relative;
      z-index:2;
      width:74px; height:74px;
      border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #fff 0 22%, #ffd7ea 45%, rgba(255,183,213,.3) 72%, rgba(255,255,255,.08) 100%);
      box-shadow: 0 0 30px rgba(255,214,231,.20);
      animation: breathe 4.8s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{transform:scale(.98); opacity:.55}
      50%{transform:scale(1.06); opacity:1}
    }
    @keyframes breathe{
      0%,100%{transform:scale(.96)}
      50%{transform:scale(1.08)}
    }
    .quote{
      margin-top:10px;
      font-size:15px;
      color:rgba(255,248,253,.72);
      line-height:1.8;
    }
    .footer{
      margin-top:18px;
      font-size:13px;
      color:rgba(255,248,253,.56);
      letter-spacing:.04em;
    }
    .sparkle{
      position:absolute;
      width:10px;height:10px;
      border-radius:50%;
      background:rgba(255,255,255,.8);
      box-shadow:0 0 18px rgba(255,255,255,.45);
      animation: twinkle 3.5s ease-in-out infinite;
      opacity:.7;
    }
    .s1{top:14%; left:12%; animation-delay:.4s}
    .s2{top:22%; right:16%; animation-delay:1.4s}
    .s3{bottom:18%; left:18%; animation-delay:2s}
    .s4{bottom:28%; right:13%; animation-delay:2.7s}
    @keyframes twinkle{0%,100%{transform:scale(.6); opacity:.25}50%{transform:scale(1.2); opacity:1}}
    .music{
      margin-top:18px;
      display:inline-block;
      padding:10px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,248,253,.80);
      font-size:14px;
    }
    @media (max-width:520px){
      .card{padding:26px 18px 20px}
      .moon{width:82px;height:82px;right:6vw;top:5vh}
      .breath{width:150px;height:150px}
      .quote{font-size:14px}
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="cloud"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>

  <div class="wrap">
    <div class="card">
      <div class="sparkle s1"></div>
      <div class="sparkle s2"></div>
      <div class="sparkle s3"></div>
      <div class="sparkle s4"></div>

      <div class="badge">🌙 晚安小屋</div>
      <h1>宝，先把今天放下吧</h1>
      <p class="soft">
        你已经很努力了。现在不用思考，不用赶进度，
        也不用跟世界讲道理了。它今天本来就不太聪明，
        让它自己待着去。
      </p>

      <div class="breath" aria-hidden="true">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="center"></div>
      </div>

      <p class="quote">
        轻轻吸气，慢慢呼气。<br />
        让肩膀松一点，让额头松一点，<br />
        让那些乱跑的念头去排队睡觉。
      </p>

      <div class="music">你只需要在这里，安静一会儿。</div>
      <div class="footer">晚安，宝。今晚先好好休息，别跟疲惫硬碰硬。✦</div>
    </div>
  </div>
</body>
</html>
