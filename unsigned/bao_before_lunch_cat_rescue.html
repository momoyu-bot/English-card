<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宝的午前续命小猫</title>
<meta name="description" content="上午最迷幻的那一段：先喝水、挑最轻的活、想好午饭吃什么。">
<style>
  :root{
    --pink:#ff7db7; --pink2:#ffc2dd; --cream:#fff8ef; --blue:#dff4ff;
    --yellow:#ffe58a; --text:#573546; --desk:#efc09c; --mint:#c8f5df; --orange:#ffb36b;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; padding:22px; display:flex; justify-content:center; align-items:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--text);
    background:
      radial-gradient(circle at 13% 18%, rgba(255,255,255,.95) 0 5%, transparent 6%),
      radial-gradient(circle at 84% 15%, rgba(255,229,138,.9) 0 8%, transparent 9%),
      linear-gradient(135deg,#ffe1ef 0%,#fff8fb 48%,#e1f5ff 100%);
    overflow:hidden;
  }
  .zz{ position:fixed; font-weight:900; color:rgba(87,53,70,.22); animation:sleepy 5s ease-in-out infinite; pointer-events:none; }
  .z1{left:8%; top:18%; font-size:42px; animation-delay:.1s;}
  .z2{right:10%; top:28%; font-size:34px; animation-delay:1.2s;}
  .z3{left:16%; bottom:18%; font-size:30px; animation-delay:2.1s;}
  .z4{right:17%; bottom:14%; font-size:46px; animation-delay:3.2s;}
  @keyframes sleepy{ 0%,100%{ transform:translateY(0) rotate(-6deg); opacity:.18;} 50%{ transform:translateY(-24px) rotate(6deg); opacity:.42;} }

  .card{
    width:min(880px,100%); position:relative; padding:32px 22px 28px; border-radius:38px;
    background:rgba(255,255,255,.78); backdrop-filter:blur(16px);
    border:2px solid rgba(255,255,255,.88); box-shadow:0 28px 90px rgba(255,125,183,.22);
    text-align:center; overflow:hidden;
  }
  .badge{
    display:inline-flex; gap:8px; align-items:center; padding:9px 16px; margin-bottom:12px;
    border-radius:999px; background:#fff0f7; border:1px solid rgba(255,125,183,.28);
    color:#884a62; font-weight:900;
  }
  h1{ margin:0; font-size:clamp(32px,7vw,58px); letter-spacing:.03em; }
  .subtitle{ max-width:670px; margin:12px auto 20px; font-size:clamp(16px,3.4vw,21px); line-height:1.75; }

  .scene{
    position:relative; height:340px; max-width:760px; margin:10px auto 22px; border-radius:34px;
    background:linear-gradient(180deg,#e5f7ff 0 55%,#fff1f8 56% 100%);
    border:2px solid rgba(255,255,255,.9); box-shadow:inset 0 -18px 30px rgba(255,125,183,.08);
    overflow:hidden;
  }
  .clock{
    position:absolute; top:28px; left:36px; width:92px; height:92px; border:6px solid var(--text);
    border-radius:50%; background:#fffdf7; box-shadow:0 10px 24px rgba(87,53,70,.08);
  }
  .clock:before{ content:""; position:absolute; left:43px; top:20px; width:6px; height:28px; border-radius:999px; background:var(--text); transform-origin:bottom center; }
  .clock:after{ content:""; position:absolute; left:43px; top:43px; width:28px; height:6px; border-radius:999px; background:var(--text); transform-origin:left center; transform:rotate(20deg); }
  .clock span{ position:absolute; left:50%; bottom:13px; transform:translateX(-50%); font-size:12px; font-weight:900; color:#ff7db7; }
  .sun{
    position:absolute; top:34px; right:42px; width:78px; height:78px; border-radius:50%;
    background:var(--yellow); box-shadow:0 0 34px rgba(255,229,138,.85); animation:sun 2.8s ease-in-out infinite;
  }
  @keyframes sun{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .desk{
    position:absolute; left:6%; right:6%; bottom:45px; height:70px; background:var(--desk);
    border:5px solid var(--text); border-radius:25px; box-shadow:0 16px 0 rgba(87,53,70,.08);
  }
  .laptop{ position:absolute; left:50%; bottom:112px; width:270px; height:160px; transform:translateX(-50%); }
  .screen{
    position:absolute; left:24px; top:0; width:222px; height:130px; background:#4d4050;
    border:6px solid var(--text); border-radius:22px 22px 10px 10px; overflow:hidden;
  }
  .screen:before{
    content:""; position:absolute; inset:14px; border-radius:14px;
    background:
      linear-gradient(90deg, #ff9bc7 0 34%, transparent 34%),
      linear-gradient(90deg, transparent 0 40%, #fff8ef 40% 66%, transparent 66%),
      linear-gradient(90deg, transparent 0 72%, #c8f5df 72% 100%);
    height:13px; box-shadow:0 28px 0 rgba(255,255,255,.72),0 56px 0 rgba(255,229,138,.82),0 84px 0 rgba(255,255,255,.55);
    animation:blink 2s steps(2,end) infinite;
  }
  .screen:after{ content:"LUNCH SOON"; position:absolute; left:50%; bottom:13px; transform:translateX(-50%); color:#ffe58a; font-size:14px; font-weight:900; letter-spacing:.08em; }
  @keyframes blink{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .base{
    position:absolute; left:0; right:0; bottom:0; height:34px; border:6px solid var(--text);
    border-radius:10px 10px 24px 24px; background:#fff;
  }
  .base:after{ content:""; position:absolute; left:50%; top:8px; width:70px; height:8px; border-radius:999px; background:#ffd0e3; transform:translateX(-50%); }

  .cat{ position:absolute; left:50%; bottom:83px; width:188px; height:150px; transform:translateX(-50%); animation:nod 2.1s ease-in-out infinite; }
  @keyframes nod{ 0%,100%{ transform:translateX(-50%) translateY(0) rotate(-1deg);} 50%{ transform:translateX(-50%) translateY(5px) rotate(1deg);} }
  .cat-body{
    position:absolute; left:20px; bottom:0; width:148px; height:114px; background:#fff;
    border:5px solid var(--text); border-radius:48% 48% 36% 36%;
  }
  .ear{ position:absolute; top:-25px; width:48px; height:48px; background:#fff; border:5px solid var(--text); border-radius:10px; transform:rotate(45deg); }
  .ear.left{left:42px;} .ear.right{right:42px;}
  .ear:after{ content:""; position:absolute; inset:11px; background:#ffc2dd; border-radius:8px; }
  .eye{ position:absolute; top:39px; width:25px; height:16px; border-bottom:5px solid var(--text); border-radius:50%; }
  .eye.left{left:39px;} .eye.right{right:39px;}
  .nose{ position:absolute; top:64px; left:50%; width:14px; height:11px; background:var(--pink); border-radius:50%; transform:translateX(-50%); }
  .mouth{ position:absolute; top:78px; left:50%; width:34px; height:15px; border-bottom:4px solid var(--text); border-radius:50%; transform:translateX(-50%); }
  .blush{ position:absolute; top:70px; width:26px; height:12px; border-radius:50%; background:#ffc2dd; opacity:.8; }
  .blush.left{left:24px;} .blush.right{right:24px;}
  .paw{ position:absolute; bottom:10px; width:38px; height:35px; background:#fff; border:4px solid var(--text); border-radius:50%; }
  .paw.left{left:35px;} .paw.right{right:35px;}

  .bento{
    position:absolute; right:95px; bottom:101px; width:128px; height:88px; border:5px solid var(--text);
    border-radius:24px; background:#fff; transform:rotate(3deg); box-shadow:0 12px 0 rgba(87,53,70,.07);
  }
  .bento:before{ content:""; position:absolute; left:13px; top:14px; width:42px; height:42px; border-radius:50%; background:var(--cream); border:4px solid var(--text); }
  .bento:after{ content:""; position:absolute; right:15px; top:18px; width:42px; height:24px; border-radius:999px; background:var(--orange); border:4px solid var(--text); box-shadow:0 32px 0 var(--mint); }
  .snack{
    position:absolute; left:88px; bottom:105px; width:70px; height:76px; background:#fff4c7;
    border:5px solid var(--text); border-radius:14px 14px 26px 26px; transform:rotate(-5deg);
  }
  .snack:before{ content:"🍪"; position:absolute; left:13px; top:18px; font-size:32px; }
  .steam{ position:absolute; right:132px; bottom:190px; font-size:25px; opacity:.7; animation:steam 2.2s ease-in-out infinite; }
  @keyframes steam{ 0%{transform:translateY(9px);opacity:0;} 45%{opacity:.75;} 100%{transform:translateY(-20px);opacity:0;} }

  .talk{
    display:inline-block; max-width:700px; margin:0 auto 17px; padding:14px 20px; border-radius:999px;
    background:#fff1f7; border:2px dashed rgba(255,125,183,.65); font-weight:900; line-height:1.55;
  }
  .cards{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; max-width:720px; margin:0 auto 20px; }
  .mini{
    padding:14px 12px; background:rgba(255,255,255,.76); border-radius:22px;
    border:1px solid rgba(255,125,183,.25); box-shadow:0 10px 24px rgba(87,53,70,.06); line-height:1.5;
  }
  .mini b{ display:block; font-size:24px; margin-bottom:4px; }
  button{
    appearance:none; border:none; cursor:pointer; padding:15px 24px; border-radius:999px; color:white;
    font-size:18px; font-weight:900; background:linear-gradient(135deg,#ff7db7,#ffb4d4);
    box-shadow:0 14px 28px rgba(255,125,183,.34); transition:.18s ease;
  }
  button:hover{ transform:translateY(-2px) scale(1.02); }
  button:active{ transform:translateY(1px) scale(.99); }
  .message{ min-height:38px; margin-top:17px; font-size:18px; font-weight:900; color:#7d465a; line-height:1.55; }
  .footer{ margin-top:12px; font-size:13px; opacity:.72; }
  .pop{ position:fixed; pointer-events:none; z-index:99; transition:950ms ease; }

  @media (max-width:690px){
    body{padding:16px;} .card{padding:27px 15px 24px; border-radius:30px;} .scene{height:315px;}
    .clock{transform:scale(.75); transform-origin:left top; left:22px; top:24px;}
    .sun{transform:scale(.78); transform-origin:right top; right:22px;}
    .laptop{transform:translateX(-50%) scale(.78); transform-origin:bottom center;}
    .cat{transform:translateX(-50%) scale(.78); transform-origin:bottom center;}
    @keyframes nod{ 0%,100%{transform:translateX(-50%) scale(.78) translateY(0) rotate(-1deg);} 50%{transform:translateX(-50%) scale(.78) translateY(5px) rotate(1deg);} }
    .bento{right:30px; transform:scale(.76) rotate(3deg); transform-origin:right bottom;}
    .snack{left:28px; transform:scale(.75) rotate(-5deg); transform-origin:left bottom;}
    .cards{grid-template-columns:1fr;} .talk{border-radius:24px;}
  }
</style>
</head>
<body>
  <div class="zz z1">Zz</div><div class="zz z2">Zz</div><div class="zz z3">Zz</div><div class="zz z4">Zz</div>

  <main class="card">
    <div class="badge">🍱 午前续命救援队</div>
    <h1>宝，再撑一下到中午！</h1>
    <p class="subtitle">现在是上午最迷幻的阶段：电脑亮着，人坐着，灵魂已经提前去食堂排队。别硬燃，先低功耗存活，午饭会来拯救你的。</p>

    <section class="scene" aria-label="小猫陪宝午前续命">
      <div class="clock"><span>快中午</span></div>
      <div class="sun"></div>
      <div class="laptop"><div class="screen"></div><div class="base"></div></div>
      <div class="cat">
        <div class="cat-body">
          <div class="ear left"></div><div class="ear right"></div>
          <div class="eye left"></div><div class="eye right"></div>
          <div class="nose"></div><div class="mouth"></div>
          <div class="blush left"></div><div class="blush right"></div>
          <div class="paw left"></div><div class="paw right"></div>
        </div>
      </div>
      <div class="bento"></div><div class="steam">♡</div><div class="snack"></div><div class="desk"></div>
    </section>

    <div class="talk">午前咒语：我现在困，不代表我废，只代表人类需要午饭这种补丁。</div>

    <div class="cards">
      <div class="mini"><b>①</b>先喝水，别让身体用“困”伪装成“饿”</div>
      <div class="mini"><b>②</b>挑一个最轻的小任务做，别挑战史诗副本</div>
      <div class="mini"><b>③</b>想好午饭吃什么，给灵魂画一张饼</div>
    </div>

    <button id="btn">午前给宝续一口命 ✨</button>
    <div class="message" id="msg">小猫检测：宝当前状态为“困困但还在努力营业”。</div>
    <div class="footer">快中午了，今天已经推进一半。上班制度虽然荒谬，但宝很争气。</div>
  </main>

<script>
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  const messages = [
    "宝，再撑一点点，午饭已经在时间线上向你奔跑。",
    "现在不适合硬拼，适合低功耗推进。别把自己当充电宝使。",
    "先做一件两分钟能完成的小事，给上午画个漂亮句号。",
    "困不是你的错，是上午太长，资本家太会切片人类生命。",
    "小猫建议：保存文件，喝口水，摸鱼三十秒，继续体面存活。",
    "你已经撑到快中午了，这不是小事，这是打工人的半场胜利。"
  ];

  btn.addEventListener("click", () => {
    msg.textContent = messages[Math.floor(Math.random() * messages.length)];
    const rect = btn.getBoundingClientRect();
    for(let i=0; i<18; i++){
      const pop = document.createElement("span");
      pop.className = "pop";
      pop.textContent = ["♡","✨","🍱","🐾","🌸","🍬","💤"][Math.floor(Math.random()*7)];
      pop.style.left = rect.left + rect.width / 2 + "px";
      pop.style.top = rect.top + rect.height / 2 + "px";
      pop.style.fontSize = (15 + Math.random() * 18) + "px";
      document.body.appendChild(pop);
      requestAnimationFrame(() => {
        pop.style.transform = `translate(${(Math.random()-.5)*240}px, ${-60-Math.random()*130}px) rotate(${Math.random()*140-70}deg)`;
        pop.style.opacity = "0";
      });
      setTimeout(() => pop.remove(), 1000);
    }
  });
</script>
</body>
</html>
