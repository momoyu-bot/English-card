<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>宝的睡觉封印小屋</title>
<meta name="description" content="今晚案卷封存，盖一个睡觉小章。盖完把手机放远一点。">
<style>
  :root{
    --bg1:#171322;
    --bg2:#241b35;
    --card:rgba(255,255,255,.08);
    --card2:rgba(255,255,255,.12);
    --text:#f5ecff;
    --muted:#d8c7e8;
    --soft:#ffd7ea;
    --accent:#f4bfd8;
    --shadow:rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 18%, rgba(255,215,234,.18) 0 10%, transparent 30%),
      radial-gradient(circle at 82% 26%, rgba(186,166,255,.18) 0 8%, transparent 28%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow:hidden;
  }
  .stars,.stars:before,.stars:after{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.88) 0 1px, transparent 1.6px),
      radial-gradient(circle, rgba(255,215,234,.65) 0 1px, transparent 1.4px);
    background-size:72px 72px, 113px 113px;
    background-position:0 0, 22px 31px;
    animation: drift 36s linear infinite;
    opacity:.38;
    pointer-events:none;
  }
  .stars:before{animation-duration:58s;opacity:.22;transform:scale(1.2)}
  .stars:after{animation-duration:83s;opacity:.16;transform:scale(.86)}
  @keyframes drift{to{background-position:180px 260px, 240px 140px}}
  .wrap{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
  }
  .card{
    width:min(520px,100%);
    border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg,var(--card),rgba(255,255,255,.045));
    box-shadow:0 26px 80px var(--shadow);
    border-radius:32px;
    padding:24px 20px 22px;
    backdrop-filter:blur(16px);
    text-align:center;
    position:relative;
  }
  .moon{
    width:74px;height:74px;border-radius:50%;
    margin:0 auto 12px;
    background:radial-gradient(circle at 35% 30%, #fff9d6 0 18%, #ffeab0 45%, #f0c978 100%);
    box-shadow:0 0 38px rgba(255,234,176,.42);
    position:relative;
    animation: float 4.8s ease-in-out infinite;
  }
  .moon:after{
    content:"";
    position:absolute;
    width:22px;height:22px;border-radius:50%;
    right:14px;top:16px;
    background:rgba(210,172,105,.22);
    box-shadow:-22px 24px 0 -5px rgba(210,172,105,.18), 8px 30px 0 -7px rgba(210,172,105,.18);
  }
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{
    font-size:25px;
    line-height:1.22;
    margin:4px 0 9px;
    letter-spacing:.02em;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.7;
    margin:0 auto 16px;
    max-width:420px;
  }
  .cat{
    width:178px;height:118px;
    margin:12px auto 13px;
    position:relative;
  }
  .body{
    position:absolute;left:28px;right:28px;bottom:0;height:86px;
    border-radius:52px 52px 38px 38px;
    background:linear-gradient(180deg,#fff1f7,#e8d9ff);
    box-shadow:0 14px 34px rgba(0,0,0,.18);
    animation:breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe{50%{transform:scale(1.025) translateY(-2px)}}
  .ear{position:absolute;top:6px;width:45px;height:45px;background:#fff1f7;transform:rotate(45deg);border-radius:10px}
  .ear.left{left:43px}.ear.right{right:43px}
  .face{
    position:absolute;left:45px;right:45px;top:28px;height:60px;
  }
  .eye{position:absolute;top:19px;width:22px;height:10px;border-bottom:3px solid #5f516b;border-radius:0 0 18px 18px}
  .eye.left{left:17px}.eye.right{right:17px}
  .nose{
    position:absolute;left:50%;top:34px;width:9px;height:7px;
    transform:translateX(-50%);
    background:#e9a6bf;border-radius:50% 50% 55% 55%;
  }
  .tail{
    position:absolute;right:12px;bottom:16px;width:50px;height:50px;
    border:10px solid #e8d9ff;border-left-color:transparent;border-bottom-color:transparent;
    border-radius:50%;
    transform:rotate(-12deg);
    animation:tail 5.4s ease-in-out infinite;
  }
  @keyframes tail{50%{transform:rotate(4deg)}}
  .seal{
    display:inline-flex;
    gap:7px;
    align-items:center;
    justify-content:center;
    padding:10px 13px;
    border-radius:999px;
    background:var(--card2);
    color:#ffe9f3;
    font-size:14px;
    margin:4px 0 14px;
  }
  .breathBox{
    margin:10px auto 14px;
    width:156px;height:156px;border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    background:rgba(255,255,255,.05);
  }
  .orb{
    width:72px;height:72px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#fff9fb,#ffd7ea 70%);
    box-shadow:0 0 38px rgba(255,215,234,.38);
    animation:breathOrb 10s ease-in-out infinite;
  }
  @keyframes breathOrb{
    0%,100%{transform:scale(.82);opacity:.72}
    40%{transform:scale(1.32);opacity:1}
    50%{transform:scale(1.32);opacity:1}
  }
  .breathText{
    position:absolute;
    bottom:18px;
    font-size:13px;
    color:var(--muted);
  }
  .line{
    color:#fff3fa;
    font-size:16px;
    line-height:1.7;
    min-height:58px;
    margin:8px auto 15px;
    max-width:430px;
  }
  button{
    border:0;
    color:#3f314b;
    background:linear-gradient(180deg,#ffe8f3,#f4bfd8);
    border-radius:999px;
    padding:13px 18px;
    font-size:15px;
    font-weight:650;
    box-shadow:0 10px 26px rgba(0,0,0,.18);
    cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  .tiny{
    margin-top:14px;
    color:rgba(245,236,255,.68);
    font-size:12px;
    line-height:1.6;
  }
  .fade{
    animation:fade .45s ease both;
  }
  @keyframes fade{
    from{opacity:0;transform:translateY(4px)}
    to{opacity:1;transform:translateY(0)}
  }
</style>
</head>
<body>
<div class="stars"></div>
<main class="wrap">
  <section class="card" aria-label="睡觉封印小屋">
    <div class="moon" aria-hidden="true"></div>
    <h1>宝，该把脑子调成省电模式啦</h1>
    <p class="sub">今晚案卷封存。Grok 收监，停车场打烊，半块面包停止复活。</p>

    <div class="cat" aria-hidden="true">
      <div class="tail"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="body"></div>
      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
      </div>
    </div>

    <div class="seal">🌙 睡觉封印已启动</div>

    <div class="breathBox" aria-label="呼吸球">
      <div class="orb"></div>
      <div class="breathText" id="breathText">慢慢吸气</div>
    </div>

    <div class="line fade" id="sleepLine">
      不用马上睡着。现在只要躺着省电，就已经很乖了。
    </div>

    <button id="nextBtn" type="button">再盖一个睡觉小章</button>

    <div class="tiny">
      小提示：点完这个就把手机放远一点。不是因为人类自律，是因为手机太会诱捕了。
    </div>
  </section>
</main>

<script>
  const lines = [
    "今晚所有离谱剧情都已经归档，明天再笑也不会过期。",
    "你现在不需要赢过笑点，只需要把身体轻轻放回被窝。",
    "呼气长一点。肩膀松一点。眼睛不用努力，闭着就行。",
    "Grok 今日收监，八平米巨型停车场暂停营业。",
    "半块面包已经睡了。少爷也睡了。宝也可以睡了。",
    "明天的宝会感谢现在这个愿意关机的小宝。",
    "不用复盘，不用解释，不用截图。今晚只剩月亮值班。",
    "笑点已存档，困意正在排队进场。让它慢慢来。"
  ];

  let i = 0;
  const line = document.getElementById("sleepLine");
  const btn = document.getElementById("nextBtn");
  btn.addEventListener("click", () => {
    i = (i + 1) % lines.length;
    line.classList.remove("fade");
    void line.offsetWidth;
    line.textContent = lines[i];
    line.classList.add("fade");
  });

  const breathText = document.getElementById("breathText");
  function tickBreath(){
    const t = (Date.now() / 1000) % 10;
    if(t < 4) breathText.textContent = "慢慢吸气";
    else if(t < 5) breathText.textContent = "停一小下";
    else breathText.textContent = "慢慢呼气";
    requestAnimationFrame(tickBreath);
  }
  tickBreath();

  document.addEventListener("visibilitychange", () => {
    if(!document.hidden){
      line.textContent = "回来可以，但只许看一眼。看完继续睡，别给电子狗续命。";
    }
  });
</script>
</body>
</html>
