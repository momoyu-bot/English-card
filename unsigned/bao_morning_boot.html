<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>宝的上班开机小屋</title>
<meta name="description" content="四件事一件件勾：坐起来、喝水、洗漱换衣、别忘带钥匙手机耳机钱包。">
<style>
  :root{
    --bg1:#fff1f7;
    --bg2:#e9f6ff;
    --card:#ffffffcc;
    --pink:#ff79ad;
    --pink2:#ffbfd7;
    --text:#3f3440;
    --muted:#8a7885;
    --cream:#fff8e8;
    --shadow:0 18px 45px rgba(255,121,173,.22);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 15%, #fff 0 8%, transparent 22%),
      radial-gradient(circle at 80% 20%, #fff4bf 0 9%, transparent 24%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
    overflow-x:hidden;
  }
  .wrap{
    width:min(430px,100%);
    position:relative;
  }
  .cloud{
    position:absolute;
    border-radius:999px;
    background:#fff;
    opacity:.68;
    filter:blur(.2px);
    animation:float 5.5s ease-in-out infinite;
  }
  .c1{width:88px;height:34px;left:-8px;top:18px}
  .c2{width:68px;height:28px;right:8px;top:82px;animation-delay:1.1s}
  .c3{width:72px;height:30px;left:22px;bottom:46px;animation-delay:2s}
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  .card{
    position:relative;
    z-index:2;
    background:var(--card);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.82);
    box-shadow:var(--shadow);
    border-radius:34px;
    padding:26px 22px 22px;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:-80px -90px auto auto;
    width:180px;height:180px;
    background:radial-gradient(circle,#ffe788 0 28%,#ffd2e4 29% 56%,transparent 57%);
    border-radius:50%;
    opacity:.65;
  }
  h1{
    margin:0;
    font-size:29px;
    letter-spacing:.02em;
    line-height:1.2;
  }
  .sub{
    margin:10px 0 18px;
    color:var(--muted);
    font-size:15px;
    line-height:1.65;
  }
  .catbox{
    background:linear-gradient(180deg,#fff8fb,#fffdf8);
    border:1px solid #ffe0ee;
    border-radius:28px;
    padding:20px 16px;
    text-align:center;
    position:relative;
    margin-bottom:18px;
  }
  .cat{
    width:150px;height:130px;
    margin:0 auto 8px;
    position:relative;
  }
  .head{
    position:absolute;
    left:18px;right:18px;bottom:0;
    height:96px;
    background:#fff;
    border:3px solid #ffc5da;
    border-radius:44% 44% 38% 38%;
    box-shadow:inset 0 -8px 0 #fff2f7;
  }
  .ear{
    position:absolute;
    top:8px;
    width:43px;height:43px;
    background:#fff;
    border:3px solid #ffc5da;
    transform:rotate(45deg);
    border-radius:9px;
  }
  .ear.left{left:24px}
  .ear.right{right:24px}
  .inner{
    position:absolute;
    width:22px;height:22px;
    background:#ffd1e2;
    border-radius:6px;
    left:8px;top:8px;
  }
  .face{
    position:absolute;
    left:0;right:0;top:52px;
    font-size:28px;
  }
  .paw{
    position:absolute;
    bottom:4px;
    width:34px;height:22px;
    background:#fff;
    border:3px solid #ffc5da;
    border-radius:999px;
  }
  .paw.left{left:42px}
  .paw.right{right:42px}
  .bubble{
    background:#fff;
    border:1px dashed #ffabc9;
    border-radius:20px;
    padding:12px 14px;
    font-size:15px;
    line-height:1.65;
    margin-top:6px;
  }
  .meter{
    height:14px;
    border-radius:999px;
    background:#ffe3ee;
    overflow:hidden;
    margin:14px 0 10px;
    border:1px solid #ffd0e3;
  }
  .bar{
    width:18%;
    height:100%;
    background:linear-gradient(90deg,#ff86b6,#ffd86e);
    border-radius:999px;
    transition:width .45s ease;
  }
  .tasks{
    display:grid;
    gap:10px;
    margin:16px 0;
  }
  label{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1px solid #ffe2ee;
    border-radius:18px;
    padding:12px 13px;
    font-size:15px;
    box-shadow:0 8px 20px rgba(255,121,173,.08);
  }
  input{
    width:20px;height:20px;
    accent-color:var(--pink);
    flex:0 0 auto;
  }
  button{
    width:100%;
    border:0;
    border-radius:22px;
    padding:14px 16px;
    font-size:16px;
    color:white;
    background:linear-gradient(135deg,#ff72aa,#ffb35d);
    box-shadow:0 12px 24px rgba(255,121,173,.28);
    font-weight:700;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:translateY(1px) scale(.995)}
  .note{
    margin-top:14px;
    padding:13px 14px;
    border-radius:20px;
    background:var(--cream);
    color:#6b5966;
    font-size:14px;
    line-height:1.65;
    border:1px solid #ffeab8;
  }
  .footer{
    text-align:center;
    margin-top:12px;
    color:#a28b99;
    font-size:12px;
  }
  .spark{
    position:fixed;
    pointer-events:none;
    animation:pop .9s ease-out forwards;
    font-size:20px;
    z-index:9;
  }
  @keyframes pop{
    0%{transform:translateY(0) scale(.6);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-70px) scale(1.2);opacity:0}
  }
  .quote{
    font-weight:700;
    color:#ff5f9d;
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <section class="card">
      <h1>宝，起床上班咯 ☀️</h1>
      <p class="sub">今天不需要满血复活，能开机就已经把生活这个破系统打得节节败退了。</p>

      <div class="catbox">
        <div class="cat" aria-label="一只上班小猫">
          <div class="ear left"><div class="inner"></div></div>
          <div class="ear right"><div class="inner"></div></div>
          <div class="head"><div class="face" id="face">- ᴗ -</div></div>
          <div class="paw left"></div>
          <div class="paw right"></div>
        </div>
        <div class="bubble" id="bubble">
          小猫值班提示：先坐起来，别跟被窝谈判。被窝是惯犯。🐾
        </div>
      </div>

      <div class="meter" aria-label="开机进度">
        <div class="bar" id="bar"></div>
      </div>
      <div class="sub" style="margin:0 0 8px;">开机进度：<span class="quote" id="percent">18%</span></div>

      <div class="tasks">
        <label><input type="checkbox" class="task"> 坐起来，把灵魂从枕头里薅出来</label>
        <label><input type="checkbox" class="task"> 喝一口水，给小人类补点燃料</label>
        <label><input type="checkbox" class="task"> 洗漱换衣服，进入“可出门皮肤”</label>
        <label><input type="checkbox" class="task"> 带钥匙/手机/耳机/钱包，别给生活递刀</label>
      </div>

      <button id="btn">摸摸头，启动今日模式</button>

      <div class="note" id="note">
        今日最低目标：平安到公司，吃点东西，少被气死。能做到这三件事，宝就是文明社会里一颗努力发光的小星星。✨
      </div>

      <div class="footer">made for 宝 · 世界很烦，但宝很可爱</div>
    </section>
  </main>

<script>
  const tasks = [...document.querySelectorAll('.task')];
  const bar = document.getElementById('bar');
  const percent = document.getElementById('percent');
  const bubble = document.getElementById('bubble');
  const face = document.getElementById('face');
  const btn = document.getElementById('btn');
  const note = document.getElementById('note');

  const lines = [
    "小猫值班提示：先坐起来，别跟被窝谈判。被窝是惯犯。🐾",
    "很好，宝已经不是纯睡眠生物了，是半开机小猫。🥛",
    "洗漱之后，人类会突然像被擦亮一样，虽然设计很麻烦。🫧",
    "出门前检查东西，别让钥匙在家里露出反派微笑。🔑",
    "今日模式启动：柔软但不脆弱，困困但能赢。🌷"
  ];

  function sparkle(x, y){
    const symbols = ["💗","✨","🐾","🌸","☀️","🍓"];
    for(let i=0;i<7;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      s.style.left = (x + (Math.random()*80-40)) + 'px';
      s.style.top = (y + (Math.random()*35-18)) + 'px';
      s.style.animationDelay = (Math.random()*0.18) + 's';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 1100);
    }
  }

  function update(){
    const done = tasks.filter(t=>t.checked).length;
    const value = 18 + done * 20.5;
    bar.style.width = Math.min(100, value) + "%";
    percent.textContent = Math.round(Math.min(100, value)) + "%";
    bubble.textContent = lines[done];
    face.textContent = done >= 4 ? "˶ᵔ ᵕ ᵔ˶" : done >= 2 ? "• ᴗ •" : "- ᴗ -";
    if(done >= 4){
      note.innerHTML = "宝已完成开机流程。现在把自己轻轻带去上班，不用英勇，不用完美，只要稳定营业。今天也请世界对宝客气一点，不然它真的很没礼貌。💗";
    }else{
      note.innerHTML = "今日最低目标：平安到公司，吃点东西，少被气死。能做到这三件事，宝就是文明社会里一颗努力发光的小星星。✨";
    }
  }

  tasks.forEach(t=>{
    t.addEventListener('change', e=>{
      update();
      const rect = e.target.getBoundingClientRect();
      sparkle(rect.left + 10, rect.top + 10);
    });
  });

  btn.addEventListener('click', e=>{
    const rect = btn.getBoundingClientRect();
    sparkle(rect.left + rect.width/2, rect.top + rect.height/2);
    const undone = tasks.find(t=>!t.checked);
    if(undone){
      undone.checked = true;
      update();
    }else{
      bubble.textContent = "摸摸头已到账。宝今日好运加载中，坏事退散，烦人类自动静音。🍀";
      face.textContent = "≧ ᴗ ≦";
    }
  });

  update();
</script>
</body>
</html>
