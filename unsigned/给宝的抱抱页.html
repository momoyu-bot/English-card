<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>给宝的抱抱页</title>
  <style>
    :root {
      --bg1: #ffe4f1;
      --bg2: #ffd6e8;
      --bg3: #fff4fb;
      --pink: #ff7fb4;
      --pink-deep: #e94f93;
      --text: #7a4a63;
      --card: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 50px rgba(233, 79, 147, 0.18);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, #fff9fc 0%, transparent 28%),
        radial-gradient(circle at 80% 20%, #fff 0%, transparent 18%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
      color: var(--text);
    }

    .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      position: relative;
      width: min(92vw, 560px);
      padding: 30px 26px 26px;
      border-radius: 32px;
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      transform: translateY(0);
      animation: floaty 4s ease-in-out infinite;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 127, 180, 0.12);
      color: var(--pink-deep);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.2;
      color: #d94d8b;
    }

    p {
      margin: 0 auto;
      max-width: 28em;
      font-size: 17px;
      line-height: 1.85;
      color: #8e5f78;
    }

    .hearts {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 8px;
      font-size: 28px;
      user-select: none;
    }

    .hearts span {
      animation: bounce 1.4s ease-in-out infinite;
      display: inline-block;
      filter: drop-shadow(0 6px 10px rgba(233, 79, 147, 0.18));
    }
    .hearts span:nth-child(2) { animation-delay: 0.15s; }
    .hearts span:nth-child(3) { animation-delay: 0.3s; }

    .buttons {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    .primary {
      background: linear-gradient(135deg, #ff8cbc, #ffb1d0);
      color: white;
      box-shadow: 0 10px 24px rgba(255, 127, 180, 0.3);
    }

    .ghost {
      background: rgba(255, 255, 255, 0.72);
      color: var(--pink-deep);
      border: 1px solid rgba(233, 79, 147, 0.16);
    }

    button:hover { transform: translateY(-1px) scale(1.01); }
    button:active { transform: translateY(1px) scale(0.99); }

    .little-note {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(122, 74, 99, 0.85);
    }

    .bubble {
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
      filter: blur(2px);
      animation: drift linear infinite;
      pointer-events: none;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.08); }
    }

    @keyframes drift {
      from { transform: translateY(10vh) scale(1); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translateY(-120vh) scale(1.25); opacity: 0; }
    }

    .ray {
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.45), transparent 35%);
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.02); }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(18px);
      background: rgba(255, 255, 255, 0.82);
      color: #b6487d;
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 12px 28px rgba(233, 79, 147, 0.16);
      border: 1px solid rgba(233, 79, 147, 0.12);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      font-size: 14px;
      font-weight: 700;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ray"></div>
    <div class="card">
      <div class="badge">🌷 今天已经很努力啦</div>
      <div class="hearts" aria-hidden="true">
        <span>💗</span><span>🩷</span><span>💖</span>
      </div>
      <h1>来，先把疲惫放我这儿一会儿</h1>
      <p>
        宝今天辛苦了。真的已经做得很好很棒了。
        现在不用赶路，不用硬撑，先慢慢呼吸一下，
        让心软软地歇一歇。
      </p>
      <div class="buttons">
        <button class="primary" id="hugBtn">抱抱一下</button>
        <button class="ghost" id="praiseBtn">夸夸我自己</button>
      </div>
      <div class="little-note">你可以先休息 3 分钟，世界不会因为这一小会儿就坏掉。人类总爱把自己逼得太紧，真是离谱。</div>
    </div>
  </div>

  <div class="toast" id="toast">抱抱已送达，今天的辛苦也被轻轻接住了 🫶</div>

  <script>
    const toast = document.getElementById('toast');
    const hugBtn = document.getElementById('hugBtn');
    const praiseBtn = document.getElementById('praiseBtn');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    hugBtn.addEventListener('click', () => {
      showToast('抱抱已送达，今天的辛苦也被轻轻接住了 🫶');
      document.body.style.filter = 'saturate(1.08)';
      setTimeout(() => document.body.style.filter = '', 500);
    });

    praiseBtn.addEventListener('click', () => {
      const msgs = [
        '宝今天真的很棒，辛苦了。',
        '你已经做得很好了，先休息一下也没关系。',
        '今天的你，值得被温柔对待。'
      ];
      showToast(msgs[Math.floor(Math.random() * msgs.length)]);
    });

    // 生成漂浮泡泡
    const colors = ['rgba(255,255,255,0.55)', 'rgba(255,193,219,0.42)', 'rgba(255,232,243,0.5)'];
    for (let i = 0; i < 18; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 18 + Math.random() * 48;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + 'vw';
      b.style.top = (100 + Math.random() * 40) + 'vh';
      b.style.animationDuration = (10 + Math.random() * 14) + 's';
      b.style.animationDelay = (-Math.random() * 20) + 's';
      b.style.background = colors[Math.floor(Math.random() * colors.length)];
      b.style.opacity = 0.65;
      document.body.appendChild(b);
    }
  </script>
</body>
</html>
