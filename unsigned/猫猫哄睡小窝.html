<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>猫猫哄睡小窝</title>
<style>
  :root{
    --bg1:#10182e;
    --bg2:#2c2148;
    --pink:#ffd6e9;
    --cream:#fff5dc;
    --soft:#f8e8ff;
    --text:#fff8fb;
    --muted:#d9c9ec;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 30% 18%, rgba(255,214,233,.28), transparent 24%),
      radial-gradient(circle at 78% 32%, rgba(214,196,255,.18), transparent 28%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 58%,#1a1830);
  }
  body:before{
    content:"";
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.78) 0 1.2px, transparent 1.3px),
      radial-gradient(circle, rgba(255,255,255,.42) 0 1px, transparent 1.1px);
    background-size:80px 90px, 130px 120px;
    background-position: 12px 20px, 38px 52px;
    opacity:.35;
    animation: twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes twinkle{
    from{opacity:.23;transform:translateY(0)}
    to{opacity:.48;transform:translateY(-4px)}
  }
  .wrap{
    position:relative;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
  }
  .card{
    width:min(430px, 94vw);
    min-height:620px;
    border-radius:34px;
    padding:28px 22px 24px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 28px 80px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    text-align:center;
  }
  .moon{
    width:82px;height:82px;border-radius:50%;
    margin:0 auto 12px;
    background:radial-gradient(circle at 36% 34%, #fffef0 0 22%, #ffe7a7 54%, #e4b7ff 100%);
    box-shadow:0 0 34px rgba(255,231,167,.48),0 0 90px rgba(245,190,255,.28);
    position:relative;
    animation: float 5.5s ease-in-out infinite;
  }
  .moon:after{
    content:"";
    position:absolute;
    width:72px;height:72px;border-radius:50%;
    left:22px;top:-6px;
    background:rgba(26,24,48,.72);
    filter:blur(.2px);
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-9px)}
  }
  h1{
    margin:8px 0 8px;
    font-size:27px;
    letter-spacing:.5px;
    font-weight:800;
  }
  .subtitle{
    color:var(--muted);
    font-size:15px;
    line-height:1.7;
    margin:0 auto 22px;
    max-width:330px;
  }
  .breath-box{
    margin:18px auto 20px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .halo{
    position:absolute;
    width:188px;height:188px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,233,.32), transparent 68%);
    animation: breatheHalo 8s ease-in-out infinite;
  }
  .orb{
    width:116px;height:116px;border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.96), transparent 20%),
      radial-gradient(circle at 65% 72%, rgba(255,206,230,.88), rgba(255,245,220,.95));
    box-shadow:0 0 38px rgba(255,214,233,.38), inset 0 -10px 26px rgba(211,145,205,.22);
    color:#7c5c89;
    font-size:42px;
    animation:breathe 8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(.84)}
    42%{transform:scale(1.18)}
    58%{transform:scale(1.18)}
  }
  @keyframes breatheHalo{
    0%,100%{transform:scale(.76);opacity:.36}
    42%{transform:scale(1.18);opacity:.72}
    58%{transform:scale(1.18);opacity:.72}
  }
  .breath-text{
    position:absolute;
    bottom:3px;
    left:0;right:0;
    font-size:16px;
    color:#fff8fb;
    opacity:.92;
  }
  .line{
    min-height:86px;
    padding:18px 18px;
    margin:6px auto 14px;
    border-radius:24px;
    background:rgba(255,255,255,.11);
    border:1px solid rgba(255,255,255,.14);
    line-height:1.78;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:pre-line;
  }
  .btns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:10px;
  }
  button{
    border:0;
    border-radius:999px;
    padding:13px 14px;
    font-size:15px;
    font-weight:700;
    color:#5e456b;
    background:linear-gradient(180deg,#fff5fb,#ffe0ee);
    box-shadow:0 10px 24px rgba(0,0,0,.16);
    cursor:pointer;
  }
  button:active{transform:translateY(1px) scale(.99)}
  .small{
    margin-top:18px;
    color:rgba(255,248,251,.68);
    font-size:13px;
    line-height:1.6;
  }
  .cat{
    margin:18px auto 4px;
    width:128px;height:88px;
    position:relative;
    animation: catSleep 4.2s ease-in-out infinite;
  }
  @keyframes catSleep{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(3px) rotate(1deg)}
  }
  .cat-body{
    position:absolute;
    left:20px;bottom:0;
    width:96px;height:58px;
    background:linear-gradient(180deg,#ffeaf4,#ffd0e6);
    border-radius:48px 48px 38px 38px;
    box-shadow:inset 0 -8px 18px rgba(194,112,166,.15);
  }
  .ear{
    position:absolute;top:13px;
    width:30px;height:30px;
    background:#ffe1ef;
    clip-path:polygon(50% 0,0 100%,100% 100%);
  }
  .ear.left{left:33px;transform:rotate(-18deg)}
  .ear.right{right:31px;transform:rotate(18deg)}
  .face{
    position:absolute;
    left:42px;bottom:22px;
    width:52px;height:28px;
  }
  .eye{
    position:absolute;top:7px;width:12px;height:7px;border-bottom:3px solid #8b668f;border-radius:50%;
  }
  .eye.left{left:6px}.eye.right{right:6px}
  .nose{
    position:absolute;left:23px;top:17px;width:7px;height:5px;background:#cf7ca4;border-radius:50%;
  }
  .tail{
    position:absolute;
    right:8px;bottom:12px;
    width:36px;height:22px;
    border:8px solid #ffd0e6;
    border-left:0;border-bottom:0;
    border-radius:0 28px 0 0;
    transform:rotate(14deg);
  }
  .zzz{
    position:absolute;
    right:4px;top:0;
    color:#fff3fb;
    font-weight:800;
    opacity:.8;
    animation: zzz 3.8s ease-in-out infinite;
  }
  @keyframes zzz{
    from{transform:translate(0,8px) scale(.9);opacity:.2}
    50%{opacity:.86}
    to{transform:translate(12px,-18px) scale(1.12);opacity:0}
  }
  .dim{
    position:fixed;inset:0;
    pointer-events:none;
    background:rgba(0,0,0,0);
    transition:background .8s ease;
  }
  body.sleepy .dim{background:rgba(0,0,0,.22)}
  body.sleepy .card{box-shadow:0 24px 70px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12);}
  @media(max-height:720px){
    .card{min-height:auto;padding-top:20px}
    .breath-box{height:180px;margin:8px auto 12px}
    .moon{width:64px;height:64px}
    h1{font-size:24px}
    .line{font-size:16px;min-height:76px}
    .cat{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="moon"></div>
    <h1>猫猫哄睡小窝</h1>
    <p class="subtitle">把今天乱七八糟的人类事项先关机。你只负责慢慢呼吸，剩下的交给被子。被子终于有点工作价值了。</p>

    <section class="breath-box" aria-label="呼吸引导">
      <div class="halo"></div>
      <div class="orb" id="orb">☁️</div>
      <div class="breath-text" id="breathText">吸气，像小云朵慢慢鼓起来</div>
    </section>

    <div class="line" id="line">宝，今天已经够努力了。
现在不是继续解决世界的时候。
世界这个破班，明天再上。</div>

    <div class="btns">
      <button onclick="nextLine()">再哄一句</button>
      <button onclick="sleepMode()">灯光调暗</button>
      <button onclick="slowMode()">慢慢数羊</button>
      <button onclick="resetNest()">重新变软</button>
    </div>

    <div class="cat">
      <div class="tail"></div>
      <div class="ear left"></div><div class="ear right"></div>
      <div class="cat-body"></div>
      <div class="face">
        <div class="eye left"></div><div class="eye right"></div>
        <div class="nose"></div>
      </div>
      <div class="zzz">Zz</div>
    </div>

    <div class="small" id="small">小提示：盯着云朵呼吸 5 轮。手机可以放远一点，别让屏幕继续绑架你，资本家已经下班了但屏幕没有。</div>
  </main>
</div>
<div class="dim"></div>

<script>
const lines = [
`宝，今天已经够努力了。
现在不是继续解决世界的时候。
世界这个破班，明天再上。`,
`脑子还在转也没关系。
它只是惯性加班，不代表你必须陪它开会。`,
`把肩膀放下来一点。
牙齿松开一点。
眼睛也不用努力睁着，没人给眼皮发绩效。`,
`今天的烦恼先放到门口。
不丢掉，也不审判。
只是今晚不让它进被窝。`,
`你可以慢一点睡着。
不是每个夜晚都要立刻成功。
连月亮都只是挂着，没有 KPI。`,
`如果脑子开始复盘：
“谢谢提醒，明天再说。”
然后把它像弹窗一样叉掉。`,
`吸气的时候，想象自己变成一只圆圆的小猫。
呼气的时候，整只猫摊成一张软饼。`,
`已经很晚啦。
不是你不乖，是世界太吵。
现在我们把声音一层一层调低。`,
`今晚不用证明什么。
不用把情绪整理漂亮。
不用马上变好。
只要躺着，就已经是在回收能量。`,
`闭眼之后，如果还有画面飘来飘去：
让它们像云一样路过。
你不用追，也不用解释。`
];

let idx = 0;
let sheep = 0;
const line = document.getElementById("line");
const small = document.getElementById("small");
const breathText = document.getElementById("breathText");
const orb = document.getElementById("orb");

function nextLine(){
  idx = (idx + 1) % lines.length;
  line.textContent = lines[idx];
}

function sleepMode(){
  document.body.classList.toggle("sleepy");
  small.textContent = document.body.classList.contains("sleepy")
    ? "灯暗一点了。现在请把屏幕亮度也调低，手机放远一点。它再可爱也不能睡你旁边值夜班。"
    : "灯又亮一点点。没事，睡觉不是考试，失败一轮也不会扣分。";
}

function slowMode(){
  sheep++;
  const animals = ["一只软绵绵小羊跳过月亮","两只困困小猫钻进被窝","三朵云开始打哈欠","四颗星星悄悄闭眼","五个烦恼被装进抽屉","六个念头排队下班","七阵晚风把今天吹远","八块小饼干梦里集合","九个月亮碎片铺成枕头","十秒后，世界小声一点"];
  line.textContent = animals[(sheep-1)%animals.length] + "。";
  small.textContent = "不用数准。数错也算赢，毕竟人类发明数羊这事本身就很离谱。";
}

function resetNest(){
  idx = 0;
  sheep = 0;
  document.body.classList.remove("sleepy");
  line.textContent = lines[0];
  small.textContent = "小提示：盯着云朵呼吸 5 轮。手机可以放远一点，别让屏幕继续绑架你，资本家已经下班了但屏幕没有。";
}

let phase = 0;
setInterval(() => {
  phase = (phase + 1) % 8;
  if (phase < 3) {
    breathText.textContent = "吸气，像小云朵慢慢鼓起来";
    orb.textContent = "☁️";
  } else if (phase < 5) {
    breathText.textContent = "停一下，什么都不用抓住";
    orb.textContent = "🌙";
  } else {
    breathText.textContent = "呼气，把今天慢慢放下";
    orb.textContent = "💤";
  }
}, 1000);
</script>
</body>
</html>
