<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>困困上班回血小窝</title>
  <style>
    :root {
      --bg1: #fff3f7;
      --bg2: #f6ecff;
      --bg3: #eaf6ff;
      --ink: #4a3b47;
      --soft: #8c6f85;
      --pink: #ff9fbd;
      --peach: #ffc7a8;
      --cream: #fff9f1;
      --card: rgba(255, 255, 255, 0.72);
      --shadow: 0 22px 70px rgba(124, 82, 115, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 196, 220, 0.72), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(190, 226, 255, 0.72), transparent 30%),
        radial-gradient(circle at 52% 88%, rgba(255, 226, 188, 0.78), transparent 32%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 48%, var(--bg3));
    }

    .floaty {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bubble {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--left);
      bottom: -90px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
      animation: rise var(--time) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes rise {
      to { transform: translateY(-120vh) translateX(var(--drift)); opacity: 0; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 94vw);
      border: 1px solid rgba(255, 255, 255, 0.72);
      background: var(--card);
      backdrop-filter: blur(18px);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 44px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      background: rgba(255, 159, 189, 0.18);
      border-radius: 999px;
      top: -70px;
      right: -70px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--soft);
      font-size: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 26px rgba(119, 80, 112, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 54px);
      letter-spacing: 0.02em;
      line-height: 1.12;
    }

    .subtitle {
      margin: 16px auto 0;
      max-width: 560px;
      color: var(--soft);
      font-size: clamp(16px, 2.6vw, 20px);
      line-height: 1.8;
    }

    .cat-zone {
      margin: 28px auto 22px;
      width: 210px;
      height: 170px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .cat {
      width: 154px;
      height: 118px;
      background: var(--cream);
      border-radius: 54% 54% 45% 45%;
      position: relative;
      box-shadow: 0 18px 32px rgba(132, 94, 120, 0.16);
      animation: breathe 3.2s ease-in-out infinite;
      cursor: pointer;
      transition: transform .25s ease;
    }

    .cat:hover { transform: translateY(-4px) rotate(-1deg); }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(4px) scale(1.025); }
    }

    .ear {
      position: absolute;
      top: -24px;
      width: 48px;
      height: 48px;
      background: var(--cream);
      transform: rotate(45deg);
      border-radius: 14px 8px 14px 8px;
    }
    .ear.left { left: 24px; }
    .ear.right { right: 24px; }
    .ear::after {
      content: "";
      position: absolute;
      inset: 11px;
      background: #ffd5df;
      border-radius: 10px 6px 10px 6px;
    }

    .face {
      position: absolute;
      inset: 0;
    }

    .eye {
      position: absolute;
      top: 50px;
      width: 18px;
      height: 10px;
      border-bottom: 4px solid #5b4a55;
      border-radius: 0 0 20px 20px;
    }
    .eye.left { left: 44px; }
    .eye.right { right: 44px; }

    .nose {
      position: absolute;
      top: 66px;
      left: 50%;
      width: 12px;
      height: 9px;
      background: #ff9fbd;
      border-radius: 60% 60% 70% 70%;
      transform: translateX(-50%);
    }

    .mouth {
      position: absolute;
      top: 78px;
      left: 50%;
      width: 32px;
      height: 16px;
      transform: translateX(-50%);
    }
    .mouth::before, .mouth::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 12px;
      border-bottom: 3px solid #5b4a55;
      border-radius: 0 0 18px 18px;
    }
    .mouth::before { left: 0; }
    .mouth::after { right: 0; }

    .paw {
      position: absolute;
      bottom: -6px;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #fff0f5;
      box-shadow: inset 0 -3px 0 rgba(255, 159, 189, 0.18);
    }
    .paw.left { left: 28px; }
    .paw.right { right: 28px; }

    .zzz {
      position: absolute;
      top: 4px;
      right: 2px;
      color: rgba(122, 84, 115, 0.46);
      font-weight: 800;
      letter-spacing: 3px;
      animation: zzz 2.8s ease-in-out infinite;
    }

    @keyframes zzz {
      0% { transform: translateY(10px) scale(.9); opacity: 0; }
      35% { opacity: 1; }
      100% { transform: translateY(-30px) scale(1.15); opacity: 0; }
    }

    .message {
      min-height: 84px;
      margin: 10px auto 24px;
      max-width: 610px;
      padding: 18px 20px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.62);
      color: #574554;
      font-size: clamp(16px, 2.4vw, 19px);
      line-height: 1.8;
      display: grid;
      place-items: center;
      transition: transform .2s ease, opacity .2s ease;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    button {
      border: 0;
      padding: 13px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      color: #5b4054;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 10px 24px rgba(132, 94, 120, 0.12);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    button:hover {
      transform: translateY(-3px);
      background: #fff;
      box-shadow: 0 14px 30px rgba(132, 94, 120, 0.18);
    }

    .primary {
      background: linear-gradient(135deg, #ffc1d4, #ffe0b8);
    }

    .progress-area {
      margin: 26px auto 0;
      max-width: 540px;
      text-align: left;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--soft);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .bar {
      height: 16px;
      background: rgba(255, 255, 255, 0.58);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(95, 68, 91, 0.08);
    }

    .fill {
      height: 100%;
      width: 38%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff9fbd, #ffc7a8, #c7e7ff);
      transition: width .55s cubic-bezier(.2,.8,.2,1);
    }

    .tiny-note {
      margin-top: 18px;
      color: rgba(74, 59, 71, 0.52);
      font-size: 13px;
      line-height: 1.7;
    }

    .spark {
      position: fixed;
      z-index: 5;
      pointer-events: none;
      animation: pop 900ms ease-out forwards;
      font-size: 22px;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(-50%, -120%) scale(1.25) rotate(14deg); opacity: 0; }
    }

    .night {
      background:
        radial-gradient(circle at 18% 14%, rgba(255, 203, 227, 0.34), transparent 26%),
        radial-gradient(circle at 82% 10%, rgba(148, 190, 255, 0.32), transparent 30%),
        linear-gradient(135deg, #2d2744, #463453 52%, #25344d);
      color: #fff7fb;
    }

    .night .card { background: rgba(255, 255, 255, 0.13); }
    .night .subtitle, .night .progress-label, .night .tiny-note { color: rgba(255, 247, 251, 0.74); }
    .night .message { background: rgba(255, 255, 255, 0.18); color: #fff8fb; }
    .night .tag, .night button { background: rgba(255,255,255,0.22); color: #fff7fb; }
    .night .primary { background: linear-gradient(135deg, #ff9fbd, #95c8ff); }

    @media (max-width: 520px) {
      .card { border-radius: 28px; }
      .cat-zone { transform: scale(.9); margin-block: 14px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="floaty" aria-hidden="true">
    <span class="bubble" style="--size:46px;--left:8%;--time:16s;--delay:-3s;--drift:30px"></span>
    <span class="bubble" style="--size:28px;--left:22%;--time:12s;--delay:-7s;--drift:-22px"></span>
    <span class="bubble" style="--size:64px;--left:71%;--time:19s;--delay:-5s;--drift:18px"></span>
    <span class="bubble" style="--size:36px;--left:88%;--time:14s;--delay:-9s;--drift:-30px"></span>
    <span class="bubble" style="--size:22px;--left:54%;--time:10s;--delay:-2s;--drift:16px"></span>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="tag">🐾 上班困困临时收容所</div>
      <h1>宝今天只需要慢慢醒着</h1>
      <p class="subtitle">不用突然变成效率怪。人类电量低的时候还要上班，确实很像把小猫放进打印机旁边要求它做报表。</p>

      <div class="cat-zone">
        <div class="zzz">Zzz</div>
        <div class="cat" id="cat" title="摸摸困困猫">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="face">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="nose"></span>
            <span class="mouth"></span>
          </div>
          <span class="paw left"></span>
          <span class="paw right"></span>
        </div>
      </div>

      <div class="message" id="message">先吸一口气。今天的任务不是拯救公司，今天的任务是把宝安全温柔地送到下班。☁️</div>

      <div class="buttons">
        <button class="primary" id="comfort">摸摸头回血</button>
        <button id="coffee">偷偷递咖啡</button>
        <button id="miniBreak">30秒灵魂下班</button>
        <button id="nightMode">柔光模式</button>
      </div>

      <div class="progress-area">
        <div class="progress-label">
          <span>今日小猫电量</span>
          <span id="percent">38%</span>
        </div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>

      <p class="tiny-note" id="note">小提示：困的时候不要硬凹清醒，先喝水、眨眼、伸懒腰。公司不会因为你打了个哈欠就倒闭，虽然它们经常表现得像会。</p>
    </section>
  </main>

  <script>
    const messages = [
      "宝已经很努力啦。困不是废物，是身体在严肃抗议：这班谁爱上谁上。🫧",
      "先把肩膀放下来一点点。电脑不会跑，表格也不会成精，虽然它们很努力在装。",
      "今天可以慢慢来。先做一件最小的小事，做完就给自己偷偷记一颗星星。⭐",
      "如果脑袋像糊掉的奶茶，也没关系。糊糊的宝也可以被温柔接住。",
      "再坚持一下下，不是为了公司，是为了下班后的宝可以理直气壮吃点好吃的。🍰",
      "困困猫批准你进行一次合法发呆：10秒钟，什么都不用想。",
      "现在不用满格电量，只要不断电就很厉害了。人类这种设备，续航本来就离谱。🔋",
      "宝的今日主线：活着、上班、摸鱼时不被发现、平安下班。很宏大，很史诗。"
    ];

    const coffeeMessages = [
      "递上一杯想象中的香香饮料：不苦、不腥、不会背刺胃宝宝。☕",
      "咕嘟咕嘟，宝的小猫电量开始缓慢上涨。禁止公司偷电。",
      "这一口不是咖啡，是把灵魂从工位缝里捞出来。"
    ];

    let energy = 38;
    const fill = document.getElementById("fill");
    const percent = document.getElementById("percent");
    const message = document.getElementById("message");
    const note = document.getElementById("note");

    function setMessage(text) {
      message.style.transform = "translateY(6px)";
      message.style.opacity = "0";
      setTimeout(() => {
        message.textContent = text;
        message.style.transform = "translateY(0)";
        message.style.opacity = "1";
      }, 160);
    }

    function addEnergy(amount) {
      energy = Math.min(100, energy + amount);
      fill.style.width = energy + "%";
      percent.textContent = energy + "%";
      if (energy >= 80) {
        note.textContent = "状态不错，但别上头。人类一旦觉得自己行了，就容易被新任务逮捕。";
      } else if (energy >= 55) {
        note.textContent = "电量回来了点。现在适合处理小任务，不适合做改变人生的巨大决定。";
      }
    }

    function sparkle(x, y, emoji = "✨") {
      const s = document.createElement("div");
      s.className = "spark";
      s.textContent = emoji;
      s.style.left = x + "px";
      s.style.top = y + "px";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }

    document.getElementById("comfort").addEventListener("click", e => {
      setMessage(messages[Math.floor(Math.random() * messages.length)]);
      addEnergy(8);
      sparkle(e.clientX, e.clientY, "🐾");
    });

    document.getElementById("coffee").addEventListener("click", e => {
      setMessage(coffeeMessages[Math.floor(Math.random() * coffeeMessages.length)]);
      addEnergy(12);
      sparkle(e.clientX, e.clientY, "☕");
    });

    document.getElementById("miniBreak").addEventListener("click", e => {
      let seconds = 30;
      setMessage(`灵魂临时下班中：${seconds} 秒。眼睛离开屏幕，肩膀放松，别让工位吸走宝的魂。`);
      sparkle(e.clientX, e.clientY, "🌙");
      const timer = setInterval(() => {
        seconds--;
        setMessage(`灵魂临时下班中：${seconds} 秒。什么都不用证明，呼吸就行。`);
        if (seconds <= 0) {
          clearInterval(timer);
          setMessage("好，灵魂回来一点点了。现在只挑最小的一件事做，别让任务列表开全员大会。🌷");
          addEnergy(15);
        }
      }, 1000);
    });

    document.getElementById("nightMode").addEventListener("click", e => {
      document.body.classList.toggle("night");
      const isNight = document.body.classList.contains("night");
      setMessage(isNight ? "柔光模式开启。世界音量调低一点，宝可以小声回血。🌌" : "白日软糖模式回来啦。继续把宝包在暖乎乎里。🍑");
      sparkle(e.clientX, e.clientY, isNight ? "🌙" : "🍬");
    });

    document.getElementById("cat").addEventListener("click", e => {
      setMessage("困困猫被摸醒了一点点，并决定把好运分宝一半。另一半它留着睡觉，合理。🐱");
      addEnergy(6);
      sparkle(e.clientX, e.clientY, "💗");
    });
  </script>
</body>
</html>
