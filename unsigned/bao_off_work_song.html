<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宝的下班之歌</title>
<meta name="description" content="三句下班歌，还有一支小猫合唱团。剩下的时间归还给你本人。">
<style>
  :root{
    --pink:#ff78ad; --rose:#ffb4d2; --peach:#ffd1a8; --sunset:#ff9f7a;
    --purple:#b99cff; --text:#573546; --cream:#fffaf2; --yellow:#ffe58a; --mint:#c9f5df;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; padding:22px; display:flex; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--text);
    background:
      radial-gradient(circle at 16% 18%, rgba(255,255,255,.92) 0 5%, transparent 6%),
      radial-gradient(circle at 86% 15%, rgba(255,229,138,.9) 0 8%, transparent 9%),
      linear-gradient(135deg,#ffd7e9 0%,#fff2f8 42%,#dfeaff 100%);
    overflow:hidden;
  }
  .note-float{
    position:fixed; pointer-events:none; font-weight:900; color:rgba(87,53,70,.22);
    animation:floatNote 7s ease-in-out infinite;
  }
  .n1{left:8%;top:17%;font-size:34px;animation-delay:.2s;}
  .n2{right:11%;top:25%;font-size:42px;animation-delay:1.1s;}
  .n3{left:15%;bottom:15%;font-size:38px;animation-delay:2.4s;}
  .n4{right:16%;bottom:13%;font-size:31px;animation-delay:3.6s;}
  @keyframes floatNote{
    0%,100%{transform:translateY(0) rotate(-8deg);opacity:.18;}
    50%{transform:translateY(-28px) rotate(8deg);opacity:.42;}
  }

  .card{
    position:relative; width:min(900px,100%); padding:32px 22px 28px; border-radius:38px;
    background:rgba(255,255,255,.78); backdrop-filter:blur(16px);
    border:2px solid rgba(255,255,255,.88); box-shadow:0 28px 90px rgba(255,120,173,.24);
    text-align:center; overflow:hidden;
  }
  .badge{
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px; margin-bottom:12px;
    border-radius:999px; background:#fff0f7; border:1px solid rgba(255,120,173,.28);
    color:#884a62; font-weight:900;
  }
  h1{ margin:0; font-size:clamp(34px,7vw,62px); letter-spacing:.03em; }
  .subtitle{
    max-width:700px; margin:12px auto 20px; font-size:clamp(16px,3.4vw,21px); line-height:1.75;
  }

  .scene{
    position:relative; max-width:780px; height:355px; margin:10px auto 22px; border-radius:36px;
    border:2px solid rgba(255,255,255,.9);
    background:linear-gradient(180deg,#ffbdd2 0%,#ffd7b5 45%,#fff1da 66%,#ffe9f4 100%);
    box-shadow:inset 0 -18px 30px rgba(255,120,173,.08); overflow:hidden;
  }
  .sun{
    position:absolute; right:52px; top:42px; width:96px; height:96px; border-radius:50%;
    background:linear-gradient(135deg,#ffe58a,#ff9f7a); box-shadow:0 0 42px rgba(255,181,92,.78);
    animation:sunsetPulse 3s ease-in-out infinite;
  }
  @keyframes sunsetPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}

  .cloud{
    position:absolute; width:122px; height:42px; border-radius:999px;
    background:rgba(255,255,255,.72); animation:cloudMove 18s linear infinite;
  }
  .cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit;}
  .cloud:before{width:54px;height:54px;left:18px;top:-26px;}
  .cloud:after{width:66px;height:66px;right:18px;top:-36px;}
  .c1{left:-150px;top:80px;}
  .c2{left:-210px;top:156px;transform:scale(.72);animation-delay:6s;}
  @keyframes cloudMove{to{transform:translateX(960px);}}

  .horizon{
    position:absolute; left:-40px; right:-40px; bottom:90px; height:115px;
    background:
      radial-gradient(circle at 20% 100%, #ffc2dd 0 34%, transparent 35%),
      radial-gradient(circle at 48% 100%, #ffd9a8 0 42%, transparent 43%),
      radial-gradient(circle at 78% 100%, #c9f5df 0 34%, transparent 35%);
    opacity:.9;
  }
  .road{
    position:absolute; left:-30px; right:-30px; bottom:0; height:112px; background:#6b5662;
    border-top:8px solid rgba(255,255,255,.6);
  }
  .road-line{
    position:absolute; bottom:48px; width:94px; height:8px; border-radius:999px;
    background:#fff4a8; animation:roadLine 1.05s linear infinite;
  }
  .road-line:nth-child(1){left:8%;}
  .road-line:nth-child(2){left:38%;animation-delay:.18s;}
  .road-line:nth-child(3){left:68%;animation-delay:.36s;}
  @keyframes roadLine{
    from{transform:translateX(90px);opacity:0;} 25%,75%{opacity:1;} to{transform:translateX(-170px);opacity:0;}
  }

  .bike{
    position:absolute; left:50%; bottom:65px; width:280px; height:155px;
    transform:translateX(-50%); animation:bikeBounce 1.7s ease-in-out infinite;
  }
  @keyframes bikeBounce{
    0%,100%{transform:translateX(-50%) translateY(0) rotate(-.7deg);}
    50%{transform:translateX(-50%) translateY(-8px) rotate(.7deg);}
  }
  .wheel{
    position:absolute; bottom:0; width:72px; height:72px; border:8px solid var(--text);
    border-radius:50%; background:rgba(255,255,255,.18); animation:spin .9s linear infinite;
  }
  .wheel:after{
    content:""; position:absolute; inset:20px; border-radius:50%; background:#fff4a8; border:4px solid var(--text);
  }
  .wheel.left{left:26px;} .wheel.right{right:26px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .bike-frame{position:absolute;left:72px;bottom:42px;width:134px;height:64px;}
  .bar{position:absolute;height:8px;border-radius:999px;background:var(--text);transform-origin:left center;}
  .b1{left:0;bottom:0;width:80px;transform:rotate(-36deg);}
  .b2{left:72px;bottom:0;width:72px;transform:rotate(34deg);}
  .b3{left:0;bottom:0;width:145px;}
  .b4{left:62px;bottom:45px;width:76px;transform:rotate(-8deg);}
  .seat{position:absolute;left:52px;bottom:82px;width:58px;height:16px;border-radius:999px;background:var(--text);}
  .handle{position:absolute;right:32px;bottom:106px;width:46px;height:12px;border-radius:999px;background:var(--text);transform:rotate(14deg);}

  .cat{position:absolute;left:89px;bottom:92px;width:104px;height:112px;}
  .cat-body{
    position:absolute;left:10px;bottom:0;width:84px;height:86px;background:#fff;
    border:5px solid var(--text);border-radius:48% 48% 35% 35%;
  }
  .ear{
    position:absolute;top:-22px;width:34px;height:34px;background:#fff;border:5px solid var(--text);
    border-radius:8px;transform:rotate(45deg);
  }
  .ear.left{left:19px;} .ear.right{right:19px;}
  .ear:after{content:"";position:absolute;inset:7px;background:#ffc2dd;border-radius:5px;}
  .eye{position:absolute;top:29px;width:10px;height:10px;background:var(--text);border-radius:50%;}
  .eye.left{left:25px;} .eye.right{right:25px;}
  .nose{position:absolute;left:50%;top:47px;width:11px;height:9px;border-radius:50%;background:var(--pink);transform:translateX(-50%);}
  .mouth{position:absolute;left:50%;top:57px;width:28px;height:12px;border-bottom:4px solid var(--text);border-radius:50%;transform:translateX(-50%);}
  .scarf{
    position:absolute;left:19px;top:53px;width:72px;height:18px;border:4px solid var(--text);
    border-radius:999px;background:#ff7db7;z-index:4;
  }
  .scarf:after{
    content:"";position:absolute;right:-24px;top:4px;width:32px;height:13px;background:#ff7db7;
    border:4px solid var(--text);border-left:none;border-radius:0 999px 999px 0;animation:scarf 1.2s ease-in-out infinite;
  }
  @keyframes scarf{0%,100%{transform:rotate(8deg);}50%{transform:rotate(-10deg);}}

  .music-box{
    position:absolute;left:34px;bottom:115px;width:70px;height:58px;border:5px solid var(--text);
    border-radius:18px;background:#fffaf2;transform:rotate(-6deg);
  }
  .music-box:before{content:"♪";position:absolute;left:19px;top:2px;font-size:38px;color:#ff78ad;font-weight:900;}
  .music-note{position:absolute;font-size:26px;font-weight:900;color:#ff78ad;animation:riseMusic 2.4s ease-in-out infinite;}
  .m1{left:70px;bottom:188px;animation-delay:.1s;}
  .m2{left:214px;bottom:207px;animation-delay:.7s;color:#8b70ff;}
  .m3{left:182px;bottom:245px;animation-delay:1.2s;color:#ff9f7a;}
  @keyframes riseMusic{
    0%{transform:translateY(10px) rotate(-8deg);opacity:0;} 45%{opacity:.95;}
    100%{transform:translateY(-34px) rotate(9deg);opacity:0;}
  }

  .talk{
    display:inline-block; max-width:720px; margin:0 auto 17px; padding:14px 20px;
    border-radius:999px; background:#fff1f7; border:2px dashed rgba(255,120,173,.65);
    font-weight:900; line-height:1.55;
  }
  .lyrics{
    max-width:740px; margin:0 auto 20px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;
  }
  .line{
    padding:14px 12px; background:rgba(255,255,255,.76); border-radius:22px;
    border:1px solid rgba(255,120,173,.25); box-shadow:0 10px 24px rgba(87,53,70,.06); line-height:1.55;
  }
  .line b{display:block;font-size:24px;margin-bottom:4px;}
  button{
    appearance:none;border:none;cursor:pointer;padding:15px 24px;border-radius:999px;color:white;
    font-size:18px;font-weight:900;background:linear-gradient(135deg,#ff78ad,#ffb4d2);
    box-shadow:0 14px 28px rgba(255,120,173,.34);transition:.18s ease;
  }
  button:hover{transform:translateY(-2px) scale(1.02);}
  button:active{transform:translateY(1px) scale(.99);}
  .message{min-height:42px;margin-top:17px;font-size:18px;font-weight:900;color:#7d465a;line-height:1.6;}
  .footer{margin-top:12px;font-size:13px;opacity:.72;}
  .pop{position:fixed;pointer-events:none;z-index:99;transition:1000ms ease;}

  @media (max-width:720px){
    body{padding:16px;} .card{padding:27px 15px 24px;border-radius:30px;} .scene{height:330px;}
    .sun{transform:scale(.78);transform-origin:right top;right:24px;top:30px;}
    .bike{transform:translateX(-50%) scale(.82);transform-origin:bottom center;}
    @keyframes bikeBounce{
      0%,100%{transform:translateX(-50%) scale(.82) translateY(0) rotate(-.7deg);}
      50%{transform:translateX(-50%) scale(.82) translateY(-8px) rotate(.7deg);}
    }
    .lyrics{grid-template-columns:1fr;} .talk{border-radius:24px;} .music-note{display:none;}
  }
</style>
</head>
<body>
  <div class="note-float n1">♪</div><div class="note-float n2">♫</div>
  <div class="note-float n3">♩</div><div class="note-float n4">♪</div>

  <main class="card">
    <div class="badge">🌆 今日下班快乐</div>
    <h1>宝的下班之歌</h1>
    <p class="subtitle">恭喜宝成功逃离工位结界。今天的任务已经交卷，剩下的时间归还给你本人，而不是归还给表格、消息、KPI 这种阴暗小蘑菇。</p>

    <section class="scene" aria-label="小猫骑车唱着下班之歌来接宝">
      <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="horizon"></div>
      <div class="bike">
        <div class="wheel left"></div><div class="wheel right"></div>
        <div class="bike-frame">
          <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
          <div class="seat"></div><div class="handle"></div>
        </div>
        <div class="music-box"></div>
        <div class="cat">
          <div class="cat-body">
            <div class="ear left"></div><div class="ear right"></div>
            <div class="eye left"></div><div class="eye right"></div>
            <div class="nose"></div><div class="mouth"></div><div class="scarf"></div>
          </div>
        </div>
        <div class="music-note m1">♪</div><div class="music-note m2">♫</div><div class="music-note m3">♪</div>
      </div>
      <div class="road"><div class="road-line"></div><div class="road-line"></div><div class="road-line"></div></div>
    </section>

    <div class="talk">下班咒语：电脑关掉，消息静音，宝今天已经很努力，剩下的时间不许被工作偷走。</div>

    <div class="lyrics">
      <div class="line"><b>第一句</b>晚风来接你，工位别追你。</div>
      <div class="line"><b>第二句</b>小猫骑车来，烦恼丢路边。</div>
      <div class="line"><b>第三句</b>今天到这里，宝要回到自己。</div>
    </div>

    <button id="btn">播放下班小猫合唱团 🎶</button>
    <div class="message" id="msg">小猫清嗓：喵喵喵，宝下班最好！</div>
    <div class="footer">今天剩下的部分，请优先分配给吃饭、放空、洗澡、躺着，以及毫无意义但很快乐的小事。</div>
  </main>

<script>
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  const songs = [
    "♪ 下班啦，下班啦，宝把烦恼都关机啦。键盘睡觉，鼠标回家，今晚不许 KPI 说话。 ♪",
    "♪ 晚霞软软，路灯亮亮，宝从工位回到人间。今天辛苦，今天漂亮，小猫给你盖章表扬。 ♪",
    "♪ 报表拜拜，消息拜拜，老板的话明天再猜。宝要吃饭，宝要发呆，灵魂终于重新加载。 ♪",
    "♪ 一天结束，电量归零，也要记得抱抱自己。不是机器，不用硬撑，今晚只做可爱居民。 ♪",
    "♪ 小猫骑车，晚风开路，宝的快乐不许让步。工作退散，疲惫退散，回家模式闪闪发亮。 ♪",
    "♪ 今天交给公司，晚上还给宝。世界很吵，小猫很乖，陪你慢慢松下来。 ♪"
  ];

  btn.addEventListener("click", () => {
    msg.textContent = songs[Math.floor(Math.random() * songs.length)];
    const rect = btn.getBoundingClientRect();
    for(let i=0; i<22; i++){
      const pop = document.createElement("span");
      pop.className = "pop";
      pop.textContent = ["♪","♫","♡","✨","🐾","🌆","🍬"][Math.floor(Math.random()*7)];
      pop.style.left = rect.left + rect.width / 2 + "px";
      pop.style.top = rect.top + rect.height / 2 + "px";
      pop.style.fontSize = (16 + Math.random() * 20) + "px";
      document.body.appendChild(pop);
      requestAnimationFrame(() => {
        pop.style.transform = `translate(${(Math.random()-.5)*260}px, ${-65-Math.random()*145}px) rotate(${Math.random()*160-80}deg)`;
        pop.style.opacity = "0";
      });
      setTimeout(() => pop.remove(), 1050);
    }
  });
</script>
</body>
</html>
