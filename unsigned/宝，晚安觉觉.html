<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宝，晚安觉觉</title>
<meta name="description" content="红框、奏折、钦此和赛博小猫都已经下班，轮到你把自己塞进被窝。">
  <style>
    :root {
      --bg1: #fff1f7;
      --bg2: #efe8ff;
      --bg3: #e8f7ff;
      --card: rgba(255, 255, 255, 0.72);
      --text: #5a4660;
      --soft: #9b7aa6;
      --pink: #ff9bc2;
      --lavender: #b9a6ff;
      --moon: #fff4b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(255,244,184,.65), transparent 22%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 52%, var(--bg3));
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, .95);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(255, 255, 255, .9);
      animation: twinkle 3s ease-in-out infinite;
    }

    .star:nth-child(1) { top: 12%; left: 16%; animation-delay: .1s; }
    .star:nth-child(2) { top: 22%; left: 72%; animation-delay: .9s; }
    .star:nth-child(3) { top: 68%; left: 12%; animation-delay: 1.3s; }
    .star:nth-child(4) { top: 76%; left: 82%; animation-delay: .5s; }
    .star:nth-child(5) { top: 42%; left: 89%; animation-delay: 1.9s; }
    .star:nth-child(6) { top: 10%; left: 47%; animation-delay: 2.4s; }

    @keyframes twinkle {
      0%, 100% { transform: scale(.7); opacity: .45; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .wrap {
      width: min(92vw, 720px);
      padding: 28px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 36px;
      box-shadow: 0 24px 80px rgba(126, 87, 145, .18);
      backdrop-filter: blur(18px);
      padding: 34px 28px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255, 155, 194, .16);
      top: -110px;
      left: -90px;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(185, 166, 255, .16);
      right: -70px;
      bottom: -90px;
    }

    .moon {
      width: 86px;
      height: 86px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: var(--moon);
      box-shadow: 0 0 35px rgba(255, 244, 184, .8);
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 245, 251, .88);
      left: 26px;
      top: 5px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(30px, 7vw, 48px);
      letter-spacing: .03em;
      color: #6d5275;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      margin: 0 auto 26px;
      max-width: 560px;
      color: var(--soft);
      font-size: clamp(16px, 3.5vw, 19px);
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }

    .cat-box {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      margin: 22px 0 24px;
    }

    .cat {
      width: 210px;
      height: 170px;
      position: relative;
      animation: breathe 4.6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(5px) scale(1.018); }
    }

    .body {
      position: absolute;
      left: 23px;
      bottom: 0;
      width: 164px;
      height: 116px;
      background: #fff7fb;
      border: 4px solid #7b5b83;
      border-radius: 54% 54% 48% 48%;
      box-shadow: inset 0 -10px 0 rgba(255, 155, 194, .18);
    }

    .ear {
      position: absolute;
      top: 12px;
      width: 58px;
      height: 58px;
      background: #fff7fb;
      border: 4px solid #7b5b83;
      transform: rotate(45deg);
      border-radius: 14px 12px 6px 12px;
      z-index: -1;
    }

    .ear.left { left: 36px; }
    .ear.right { right: 36px; }

    .ear::after {
      content: "";
      position: absolute;
      inset: 13px;
      background: #ffd4e5;
      border-radius: 8px;
    }

    .face {
      position: absolute;
      left: 37px;
      bottom: 31px;
      width: 136px;
      height: 96px;
    }

    .eye {
      position: absolute;
      top: 34px;
      width: 28px;
      height: 14px;
      border-bottom: 4px solid #7b5b83;
      border-radius: 0 0 30px 30px;
    }

    .eye.left { left: 24px; }
    .eye.right { right: 24px; }

    .nose {
      position: absolute;
      left: 61px;
      top: 54px;
      width: 14px;
      height: 10px;
      background: #ff9bc2;
      border-radius: 50% 50% 55% 55%;
    }

    .mouth {
      position: absolute;
      left: 58px;
      top: 64px;
      width: 20px;
      height: 12px;
      border-bottom: 3px solid #7b5b83;
      border-radius: 0 0 20px 20px;
    }

    .cheek {
      position: absolute;
      top: 56px;
      width: 20px;
      height: 10px;
      background: rgba(255, 155, 194, .45);
      border-radius: 50%;
    }

    .cheek.left { left: 10px; }
    .cheek.right { right: 10px; }

    .tail {
      position: absolute;
      right: 7px;
      bottom: 22px;
      width: 56px;
      height: 84px;
      border: 13px solid #fff7fb;
      border-left: none;
      border-bottom: none;
      border-radius: 0 70px 0 0;
      transform: rotate(18deg);
      filter: drop-shadow(0 0 0 #7b5b83);
    }

    .tail::before {
      content: "";
      position: absolute;
      inset: -17px -17px auto auto;
      width: 75px;
      height: 95px;
      border: 4px solid #7b5b83;
      border-left: none;
      border-bottom: none;
      border-radius: 0 78px 0 0;
    }

    .blanket {
      position: absolute;
      left: 26px;
      bottom: -4px;
      width: 158px;
      height: 46px;
      background: linear-gradient(90deg, #ffd3e6, #e6dcff);
      border: 4px solid #7b5b83;
      border-radius: 28px 28px 42px 42px;
      overflow: hidden;
    }

    .blanket::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.65) 2px, transparent 3px);
      background-size: 22px 18px;
    }

    .note {
      position: relative;
      z-index: 1;
      margin: 0 auto;
      padding: 18px 20px;
      max-width: 560px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .58);
      color: #725d7a;
      line-height: 1.85;
      font-size: 16px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .8);
    }

    .sleep-button {
      position: relative;
      z-index: 1;
      margin-top: 24px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      color: white;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 12px 30px rgba(155, 122, 166, .32);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .sleep-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(155, 122, 166, .36);
    }

    .sleep-button:active {
      transform: translateY(1px) scale(.99);
    }

    .bubble {
      position: absolute;
      color: rgba(107, 82, 117, .52);
      font-weight: 700;
      animation: rise 4.8s ease-in forwards;
      pointer-events: none;
      z-index: 4;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(.85); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-110px) scale(1.25); opacity: 0; }
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: rgba(90, 70, 96, .62);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="moon" aria-hidden="true"></div>
      <h1>宝，睡觉觉啦</h1>
      <p class="subtitle">今天的红框、奏折、钦此和赛博小猫都已经下班。现在轮到宝把自己塞进被窝里，做一颗安静发光的小月亮。</p>

      <div class="cat-box" aria-label="一只盖着粉紫小毯子的睡觉小猫">
        <div class="cat">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="tail"></div>
          <div class="body"></div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
            <div class="cheek left"></div>
            <div class="cheek right"></div>
          </div>
          <div class="blanket"></div>
        </div>
      </div>

      <div class="note" id="sleepNote">
        现在把肩膀放下来，眼睛慢慢软掉。今天已经够努力了，连系统都被你逗成宫廷剧了，宝可以休息了。晚安，梦里没有红框，只有小猫排队给你盖被子。
      </div>

      <button class="sleep-button" id="sleepBtn">点一下，领取晚安啵啵 🐾</button>
    </section>
    <div class="footer">今日已结案：良民无罪，小猫陪睡。</div>
  </main>

  <script>
    const btn = document.getElementById('sleepBtn');
    const note = document.getElementById('sleepNote');

    const messages = [
      '晚安啵啵已送达。现在请宝闭眼，别再审讯赛博门卫了，它不配加班。',
      '小猫把灯调暗了，把梦铺软了，把所有乱七八糟都踢到床底下。',
      '吸气四秒，呼气六秒。宝慢慢睡，世界先放一边，它自己会吵。',
      '今日份勇敢结束。接下来只需要当一只被被窝收编的小团子。',
      '梦里发一张通关文书：准许宝安稳睡觉，任何红框不得入内。'
    ];

    let index = 0;

    function makeBubble(text) {
      const bubble = document.createElement('span');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const rect = btn.getBoundingClientRect();
      bubble.style.left = (rect.left + rect.width / 2 - 28 + Math.random() * 56) + 'px';
      bubble.style.top = (rect.top - 4) + 'px';
      document.body.appendChild(bubble);
      setTimeout(() => bubble.remove(), 4800);
    }

    btn.addEventListener('click', () => {
      note.textContent = messages[index % messages.length];
      makeBubble(['啵啵', '晚安', '呼噜', '盖被', '无罪'][index % 5]);
      index++;
    });
  </script>
</body>
</html>
