<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>
    /* 页面保持纯白，只显示一个正方形 SVG */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: grid;
      place-items: center;
    }

    svg {
      display: block;
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
    }
  </style>
</head>

<body>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 1000"
    aria-label="粉色头发的奶油色小脸蛋"
  >
    <!-- 纯白背景 -->
    <rect
      width="1000"
      height="1000"
      fill="#ffffff"
    />

    <!-- 整颗头与眼睛一起微微顺时针倾斜 -->
    <g transform="rotate(5 330 710)">

      <!-- 头发外轮廓 -->
      <path
        fill="#FF309B"
        d="
          M -165 1060
          L -150 470
          C -142 245 20 92 258 86
          C 478 80 655 207 724 396
          C 773 529 750 694 791 839
          L 862 1060
          Z
        "
      />

      <!-- 一层很淡的深色发块 -->
      <path
        fill="#D91E7C"
        d="
          M 591 238
          C 700 331 747 468 735 625
          C 725 761 766 901 818 1060
          L 604 1060
          C 665 871 677 700 644 543
          C 622 442 597 342 591 238
          Z
        "
      />

      <!-- 奶油色圆脸 -->
      <path
        fill="#FFF0D8"
        d="
          M -73 410
          C 9 286 168 238 351 258
          C 535 278 656 405 679 579
          C 704 765 608 919 453 1002
          C 307 1080 104 1061 -14 953
          C -111 865 -132 692 -107 551
          C -96 489 -85 439 -73 410
          Z
        "
      />

      <!-- 两块淡椭圆腮红 -->
      <ellipse
        cx="93"
        cy="805"
        rx="68"
        ry="29"
        fill="#FFD0CF"
      />

      <ellipse
        cx="569"
        cy="797"
        rx="68"
        ry="29"
        fill="#FFD0CF"
      />

      <!-- 大块斜向刘海 -->
      <path
        fill="#FF309B"
        d="
          M -111 445
          C -55 226 115 116 329 145
          C 486 166 620 274 688 423
          C 608 394 529 325 455 233
          C 514 349 526 447 497 534
          C 422 480 360 382 319 255
          C 344 392 329 495 279 551
          C 235 461 215 353 221 245
          C 185 391 143 493 82 545
          C 42 467 34 372 47 283
          C -9 402 -57 483 -111 522
          Z
        "
      />

      <!-- 两块大色高光 -->
      <path
        fill="#FF78BE"
        d="
          M -33 327
          C 38 194 176 136 317 151
          C 210 179 130 243 75 350
          C 43 412 8 458 -40 489
          C -8 422 1 370 -33 327
          Z
        "
      />

      <path
        fill="#FF78BE"
        d="
          M 500 207
          C 577 246 640 315 673 393
          C 619 358 571 305 500 207
          Z
        "
      />

      <!-- 两只完全相同的纯黑竖胶囊眼 -->
      <rect
        x="139"
        y="568"
        width="58"
        height="162"
        rx="29"
        fill="#000000"
      />

      <rect
        x="438"
        y="568"
        width="58"
        height="162"
        rx="29"
        fill="#000000"
      />
    </g>
  </svg>
</body>
</html>
