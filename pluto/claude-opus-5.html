<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Q版小脸蛋 · 精装版</title>
<style>
  html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;
            background:#fff;font-family:system-ui,sans-serif;}
  .stage{width:min(92vmin,760px);aspect-ratio:1/1;position:relative;}
  svg{width:100%;height:100%;display:block;
      filter:drop-shadow(0 18px 40px rgba(180,150,110,.22));border-radius:22px;background:#fff;}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- ========== 渐变 ========== -->
  <linearGradient id="gHairBack" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0%"   stop-color="#F2BE6B"/>
    <stop offset="45%"  stop-color="#E8AC53"/>
    <stop offset="100%" stop-color="#D2903D"/>
  </linearGradient>

  <linearGradient id="gHairMid" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0%"   stop-color="#FFD98B"/>
    <stop offset="40%"  stop-color="#F8C56E"/>
    <stop offset="100%" stop-color="#E9AC52"/>
  </linearGradient>

  <linearGradient id="gBang" x1=".2" y1="-.1" x2=".8" y2="1">
    <stop offset="0%"   stop-color="#FFE3A4"/>
    <stop offset="35%"  stop-color="#FCCF7C"/>
    <stop offset="75%"  stop-color="#F2BB62"/>
    <stop offset="100%" stop-color="#E3A64B"/>
  </linearGradient>

  <radialGradient id="gFace" cx=".38" cy=".33" r=".85">
    <stop offset="0%"   stop-color="#FFF4EC"/>
    <stop offset="55%"  stop-color="#FCE7DB"/>
    <stop offset="100%" stop-color="#F3D2C1"/>
  </radialGradient>

  <linearGradient id="gFaceShadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#D9A489" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#D9A489" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="gBlush" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7C4AE" stop-opacity=".0"/>
    <stop offset="45%" stop-color="#F3A98D" stop-opacity=".85"/>
    <stop offset="100%" stop-color="#EE9377" stop-opacity=".35"/>
  </linearGradient>

  <linearGradient id="gEye" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#3B2C2E"/>
    <stop offset="45%"  stop-color="#241A1C"/>
    <stop offset="100%" stop-color="#120C0D"/>
  </linearGradient>

  <linearGradient id="gCloth" x1="0" y1="0" x2=".6" y2="1">
    <stop offset="0%"   stop-color="#FFFFFF"/>
    <stop offset="70%"  stop-color="#F3F5F8"/>
    <stop offset="100%" stop-color="#E2E7ED"/>
  </linearGradient>

  <linearGradient id="gRibbon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#9BE4EC"/>
    <stop offset="100%" stop-color="#4FB9CC"/>
  </linearGradient>

  <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#FFFFFF"/>
    <stop offset="35%"  stop-color="#E4E9EF"/>
    <stop offset="60%"  stop-color="#B9C2CC"/>
    <stop offset="100%" stop-color="#EFF3F7"/>
  </linearGradient>

  <!-- 流动高光用的扫光渐变 -->
  <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#FFF6D6" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#FFF9E6" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#FFF6D6" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate"
                      values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- ========== 滤镜 ========== -->
  <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <filter id="fSoft2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="fHairShadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#A9742F" flood-opacity=".35"/>
  </filter>
  <filter id="fGrain">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
  </filter>

  <!-- ========== 裁剪 ========== -->
  <clipPath id="cpFrame"><rect x="8" y="8" width="584" height="584" rx="22"/></clipPath>
  <clipPath id="cpFace">
    <path d="M296,152 C398,152 462,232 462,340 C462,452 396,536 292,536
             C186,536 118,450 118,338 C118,230 190,152 296,152 Z"/>
  </clipPath>
  <clipPath id="cpHairAll">
    <path d="M28,360 C12,150 128,18 296,16 C470,14 586,152 566,352
             C556,470 544,536 534,596 L18,596 Z"/>
  </clipPath>
</defs>

<!-- ================= 画面 ================= -->
<rect width="600" height="600" fill="#ffffff"/>

<g clip-path="url(#cpFrame)">

  <!-- 背景极淡光晕，让白底不死板 -->
  <circle cx="300" cy="300" r="290" fill="#FFF7E9" opacity=".65"/>
  <circle cx="230" cy="250" r="190" fill="#FFFDF6" opacity=".9"/>

  <!-- ============ 1. 最底层：后方长发 ============ -->
  <g filter="url(#fHairShadow)">
    <path fill="url(#gHairBack)" d="
      M 34,352
      C 16,168 118,26 288,20
      C 460,14 578,150 560,342
      C 552,430 548,500 540,600
      L 452,600
      C 478,500 492,420 486,340
      L 128,340
      C 122,430 106,510 92,600
      L 16,600
      C 26,510 34,428 34,352 Z"/>
    <!-- 后发内侧暗部 -->
    <path fill="#C9862F" opacity=".38" d="
      M 128,340 C 124,420 112,510 98,600 L 70,600
      C 88,506 104,424 106,340 Z"/>
    <path fill="#C9862F" opacity=".32" d="
      M 486,340 C 492,420 480,500 458,600 L 500,600
      C 516,500 522,420 514,340 Z"/>
  </g>

  <!-- ============ 2. 脸 ============ -->
  <g>
    <path fill="url(#gFace)" d="
      M296,148 C402,148 466,230 466,340 C466,456 396,540 290,540
      C184,540 114,452 114,338 C114,228 190,148 296,148 Z"/>

    <g clip-path="url(#cpFace)">
      <!-- 下颌暗部 -->
      <ellipse cx="300" cy="620" rx="230" ry="150" fill="url(#gFaceShadow)" opacity=".9"/>
      <!-- 右侧受发丝遮挡的阴影 -->
      <path fill="#D9A489" opacity=".30" filter="url(#fSoft)"
            d="M392,120 C452,200 462,330 430,470 L520,470 L520,120 Z"/>
      <!-- 刘海投影 -->
      <path fill="#C98F76" opacity=".33" filter="url(#fSoft)"
            d="M100,150 L520,120 L500,330 C400,282 250,300 108,332 Z"/>
      <!-- 额头提亮 -->
      <ellipse cx="228" cy="268" rx="96" ry="64" fill="#FFFFFF" opacity=".35" filter="url(#fSoft)"/>
    </g>
  </g>

  <!-- ============ 3. 耳朵 + 耳饰 ============ -->
  <g>
    <path fill="#F7DDD0" stroke="#E3BBA7" stroke-width="2"
          d="M452,368 C474,356 490,372 486,396 C482,420 464,432 450,424 Z"/>
    <path fill="none" stroke="#E0B4A0" stroke-width="3" stroke-linecap="round"
          d="M462,382 C472,380 476,390 470,402"/>
    <!-- 耳坠 -->
    <g transform="rotate(16 466 430)">
      <circle cx="466" cy="428" r="4.5" fill="#D9DEE5"/>
      <rect x="455" y="434" width="10" height="52" rx="5" fill="url(#gMetal)"/>
      <rect x="468" y="438" width="10" height="52" rx="5" fill="url(#gMetal)"/>
      <rect x="455" y="434" width="10" height="52" rx="5" fill="#8C96A3" opacity=".25"/>
      <rect x="457" y="440" width="3" height="34" rx="1.5" fill="#fff" opacity=".9"/>
      <rect x="470" y="444" width="3" height="34" rx="1.5" fill="#fff" opacity=".9"/>
      <animateTransform attributeName="transform" type="rotate"
        values="12 466 430; 20 466 430; 12 466 430" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ============ 4. 腮红 ============ -->
  <g filter="url(#fSoft2)">
    <ellipse cx="132" cy="416" rx="40" ry="24" fill="url(#gBlush)" opacity=".9"/>
    <ellipse cx="330" cy="470" rx="38" ry="23" fill="url(#gBlush)" opacity=".9"/>
  </g>
  <!-- 腮红斜线纹 -->
  <g stroke="#E89C80" stroke-width="2.4" stroke-linecap="round" opacity=".5">
    <line x1="116" y1="422" x2="128" y2="408"/>
    <line x1="132" y1="426" x2="144" y2="412"/>
    <line x1="148" y1="424" x2="158" y2="412"/>
    <line x1="316" y1="476" x2="328" y2="462"/>
    <line x1="332" y1="480" x2="344" y2="466"/>
  </g>

  <!-- ============ 5. 眼睛（含睫毛 + 高光 + 眨眼） ============ -->
  <g id="eyes">
    <!-- 左眼 -->
    <g transform="rotate(7 136 352)">
      <ellipse cx="136" cy="352" rx="17" ry="9" fill="#EDC2AE" opacity=".45" filter="url(#fSoft2)"/>
      <rect x="122" y="312" width="29" height="80" rx="14.5" fill="url(#gEye)"/>
      <rect x="120" y="308" width="33" height="14" rx="7" fill="#1A1113"/>
      <ellipse cx="131" cy="332" rx="5" ry="9" fill="#FFFFFF" opacity=".92"/>
      <ellipse cx="142" cy="372" rx="3" ry="5" fill="#FFD9C9" opacity=".55"/>
    </g>
    <!-- 右眼 -->
    <g transform="rotate(7 330 406)">
      <ellipse cx="330" cy="406" rx="17" ry="9" fill="#EDC2AE" opacity=".45" filter="url(#fSoft2)"/>
      <rect x="316" y="366" width="29" height="80" rx="14.5" fill="url(#gEye)"/>
      <rect x="314" y="362" width="33" height="14" rx="7" fill="#1A1113"/>
      <ellipse cx="325" cy="386" rx="5" ry="9" fill="#FFFFFF" opacity=".92"/>
      <ellipse cx="336" cy="426" rx="3" ry="5" fill="#FFD9C9" opacity=".55"/>
    </g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1; 1 1; 1 0.06; 1 1; 1 1" keyTimes="0;0.93;0.96;0.99;1"
      dur="5.5s" repeatCount="indefinite"/>
  </g>
  <!-- 眨眼时的缩放需要基点补偿 -->
  <style>
    #eyes{transform-box:fill-box;transform-origin:50% 50%;}
  </style>

  <!-- ============ 6. 刘海（主层） ============ -->
  <g filter="url(#fHairShadow)">
    <path fill="url(#gBang)" d="
      M 30,346
      C 20,164 124,26 292,22
      C 462,18 572,158 558,352
      C 548,300 536,268 520,246
      L 526,378 L 500,300 L 486,392
      L 462,262 L 440,352 L 408,236 L 378,330
      L 348,212 L 300,318 L 276,186 L 224,320
      L 196,200 L 148,344 L 126,236 L 82,376
      L 62,262 Z"/>

    <!-- 刘海更细的第二层碎发 -->
    <g fill="url(#gHairMid)" opacity=".95">
      <path d="M 96,150 C 150,90 210,58 268,52 L 250,180 L 214,110 L 176,214 L 150,132 Z"/>
      <path d="M 320,52 C 388,62 444,104 480,164 L 452,250 L 428,164 L 392,232 L 364,140 Z"/>
    </g>

    <!-- 发梢尖角（让边缘更锋利精致） -->
    <g fill="url(#gBang)">
      <path d="M 60,268 L 84,380 L 96,300 Z"/>
      <path d="M 186,206 L 200,330 L 216,240 Z"/>
      <path d="M 340,214 L 356,336 L 372,244 Z"/>
      <path d="M 484,260 L 498,384 L 512,286 Z"/>
    </g>

    <!-- 内侧暗部（靠近脸的一圈，制造厚度） -->
    <g fill="#C9862F" opacity=".22" filter="url(#fSoft2)">
      <path d="M 66,262 L 86,368 L 74,262 Z"/>
      <path d="M 200,208 L 216,326 L 208,208 Z"/>
      <path d="M 354,216 L 370,330 L 362,216 Z"/>
      <path d="M 498,262 L 512,380 L 504,262 Z"/>
    </g>
  </g>

  <!-- ============ 7. 侧发 ============ -->
  <!-- 左鬓 -->
  <path fill="url(#gHairMid)" filter="url(#fHairShadow)" d="
    M 44,300 C 28,404 34,486 52,600 L 112,600
    C 88,492 80,394 96,300
    L 82,392 L 70,318 Z"/>
  <!-- 右侧长鬓（更长，带弧度） -->
  <path fill="url(#gHairMid)" filter="url(#fHairShadow)" d="
    M 466,296 C 512,376 512,480 490,600 L 396,600
    C 436,494 448,392 430,300
    L 442,404 L 456,330 Z"/>
  <path fill="#C9862F" opacity=".25" d="
    M 430,300 C 446,388 436,492 398,600 L 424,600 C 456,490 462,388 446,300 Z"/>

  <!-- 一缕飘在脸前的细发 -->
  <path fill="url(#gBang)" opacity=".95" d="
    M 362,206 C 374,290 366,380 336,470 L 350,470
    C 388,380 396,286 380,202 Z"/>

  <!-- ============ 8. 呆毛（摇摆动画） ============ -->
  <g>
    <path fill="url(#gBang)" d="
      M 250,42 C 238,10 264,-8 284,6 C 266,12 258,24 258,46 Z"/>
    <animateTransform attributeName="transform" type="rotate"
      values="-4 256 48; 5 256 48; -4 256 48" dur="3.6s" repeatCount="indefinite"/>
  </g>

  <!-- ============ 9. 头发高光带 ============ -->
  <g clip-path="url(#cpHairAll)">
    <!-- 主高光（右上） -->
    <path fill="#FFEDBE" opacity=".85" d="
      M 356,72 C 428,100 480,156 500,232
      C 486,244 470,250 452,250
      C 430,180 390,126 332,96 Z"/>
    <path fill="#FFF8DC" opacity=".7" d="
      M 372,88 C 424,112 462,156 480,210
      C 470,216 460,218 450,216
      C 430,168 400,128 356,102 Z"/>
    <!-- 次高光（左上） -->
    <path fill="#FFEDBE" opacity=".6" d="
      M 96,146 C 132,106 178,78 224,64
      C 218,78 214,88 212,98
      C 172,114 136,140 112,172 Z"/>
    <!-- 后发上的窄高光 -->
    <path fill="#FFE7AE" opacity=".45" d="
      M 512,380 C 520,440 518,500 508,566 L 492,566
      C 502,500 504,440 498,382 Z"/>
    <!-- 扫光（动态） -->
    <path fill="url(#gSheen)" opacity=".55" d="
      M 120,60 L 520,60 L 470,300 L 90,300 Z"/>
  </g>

  <!-- ============ 10. 衣领 ============ -->
  <g>
    <path fill="url(#gCloth)" stroke="#D9DFE6" stroke-width="3" d="
      M -10,600 L -10,528
      C 40,506 96,498 152,506
      L 128,600 Z"/>
    <!-- 领口内阴影 -->
    <path fill="#BFC8D2" opacity=".35" filter="url(#fSoft2)" d="
      M 0,540 C 46,520 96,514 148,520 L 140,538 C 92,530 46,534 4,552 Z"/>
    <!-- 布褶 -->
    <g stroke="#CBD3DB" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M 24,600 C 34,570 48,548 70,532"/>
      <path d="M 62,600 C 70,574 82,554 100,540"/>
      <path d="M 100,600 C 106,578 114,562 126,550"/>
    </g>
    <!-- 蓝色饰带 -->
    <path fill="none" stroke="url(#gRibbon)" stroke-width="11" stroke-linecap="round"
          d="M 16,600 C 34,570 62,548 104,536"/>
    <path fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".55"
          d="M 22,594 C 38,570 62,552 96,542"/>
  </g>

  <!-- ============ 11. 整体色调 & 颗粒 ============ -->
  <rect width="600" height="600" fill="#FFB86B" opacity=".05"
        style="mix-blend-mode:multiply"/>
  <rect width="600" height="600" filter="url(#fGrain)" opacity=".5"
        style="mix-blend-mode:overlay"/>
</g>
</svg>
</div>
</body>
</html>
