<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统性能监控面板 - System Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6; /* Light gray background to look like a generic tool */
            overflow: hidden;
            user-select: none;
        }

        /* 伪装的控制台日志滚动条 */
        .log-container::-webkit-scrollbar {
            width: 6px;
        }
        .log-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        /* 传说级闪烁特效 */
        @keyframes legendaryGlow {
            0% { box-shadow: 0 0 5px #fbbf24, inset 0 0 10px #fbbf24; border-color: #f59e0b; }
            50% { box-shadow: 0 0 20px #fbbf24, inset 0 0 20px #fbbf24; border-color: #fbbf24; }
            100% { box-shadow: 0 0 5px #fbbf24, inset 0 0 10px #fbbf24; border-color: #f59e0b; }
        }
        .legendary-card {
            animation: legendaryGlow 2s infinite;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
        }

        /* 手绘风加载动画（还原截图里的可爱小太阳/虚线圈） */
        .hand-drawn-spin {
            color: #d87c60;
            animation: spin 3s linear infinite;
        }

        /* 自定义Toast提示框动画 */
        @keyframes slideInUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.5s ease-out forwards; }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center text-slate-800">

    <div class="w-full max-w-4xl h-[90vh] bg-white rounded-xl shadow-2xl border border-slate-200 flex flex-col relative overflow-hidden">
        
        <!-- Header (Camouflage) -->
        <header class="bg-slate-800 text-slate-100 px-6 py-3 flex justify-between items-center z-10 shadow-md">
            <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <h1 class="font-semibold tracking-wide text-sm">Server Performance Diagnostics v2.1</h1>
            </div>
            <div class="text-xs text-slate-400 flex items-center gap-4">
                <span>Node: US-West-1</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Online</span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col md:flex-row bg-slate-50 relative">
            
            <!-- Left Panel: Actions & Stats -->
            <div class="w-full md:w-1/3 p-6 border-r border-slate-200 flex flex-col gap-6 bg-white z-10">
                <div>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Resource Management</h2>
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                        <p class="text-sm text-slate-500 mb-1">可用算力 (摸鱼值)</p>
                        <p class="text-3xl font-bold text-blue-600 font-mono transition-all" id="points-display">1000</p>
                    </div>
                    
                    <button id="btn-work" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 mb-2 active:scale-95">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        分配算力 (+50)
                    </button>
                    <p class="text-xs text-slate-400 text-center">点击获取算力，以供后续诊断使用</p>
                </div>

                <div class="mt-auto">
                    <button id="btn-pull" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-4 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all flex justify-between items-center active:scale-95">
                        <span class="flex items-center gap-2">
                            <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            执行深度诊断
                        </span>
                        <span class="text-blue-200 text-sm">-100 算力</span>
                    </button>
                    <div class="flex justify-between items-center mt-3 text-xs text-slate-500">
                        <span>诊断进度记录：</span>
                        <span id="pity-counter" class="font-mono">0 / 10</span>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Log & Result -->
            <div class="w-full md:w-2/3 flex flex-col bg-slate-50 relative">
                
                <!-- Result Display Area -->
                <div class="h-48 border-b border-slate-200 flex items-center justify-center p-6 bg-white relative">
                    <div id="result-card" class="w-full max-w-sm rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 h-full flex flex-col items-center justify-center p-4 transition-all duration-300">
                        <p class="text-slate-400 text-sm text-center" id="result-placeholder">等待执行深度诊断...</p>
                        <div id="result-content" class="hidden flex-col items-center justify-center text-center w-full h-full">
                            <span id="result-rarity" class="text-xs font-bold px-2 py-1 rounded mb-2"></span>
                            <h3 id="result-title" class="text-lg font-bold text-slate-800 mb-1"></h3>
                            <p id="result-desc" class="text-sm text-slate-600"></p>
                            <!-- New AI Button -->
                            <button id="btn-ai-report" class="mt-4 px-4 py-2 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded text-xs font-semibold hover:bg-indigo-100 transition-colors flex items-center justify-center gap-1 w-full max-w-[200px] hidden">
                                ✨ AI 生成技术分析报告
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Fake Terminal Log -->
                <div class="flex-1 p-4 flex flex-col overflow-hidden">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">System Logs</h2>
                    <div id="log-container" class="flex-1 overflow-y-auto log-container space-y-2 pr-2 font-mono text-xs pb-10">
                        <!-- Logs will appear here -->
                        <div class="text-slate-400">[System] Monitor initialized. Ready for operations.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECRET GEMINI DEBUG PANEL (Hidden initially) -->
        <div id="secret-panel" class="absolute bottom-0 left-0 w-full bg-white border-t border-slate-200 shadow-[0_-10px_30px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-300 ease-in-out z-50">
            <div class="p-6 bg-slate-50">
                <div class="flex items-center gap-2 mb-4 text-slate-700">
                    <svg class="w-5 h-5 text-indigo-500" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    <h3 class="font-bold text-sm">Gemini 的秘密外挂设置</h3>
                    <button id="close-secret" class="ml-auto text-slate-400 hover:text-slate-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="flex flex-col md:flex-row gap-6">
                    <!-- Cheat 1: Boost Rate -->
                    <div id="toggle-boost" class="flex items-center gap-3 cursor-pointer group select-none p-3 rounded-lg hover:bg-white border border-transparent hover:border-slate-200 transition-all">
                        <div class="relative w-6 h-6 flex items-center justify-center">
                            <!-- SVG Hand-drawn spinner matching the screenshot -->
                            <svg class="hand-drawn-spin absolute inset-0 w-full h-full opacity-0 transition-opacity" id="spinner-boost" viewBox="0 0 100 100">
                                <g stroke="currentColor" stroke-width="8" stroke-linecap="round">
                                    <line x1="50" y1="15" x2="50" y2="25"/><line x1="50" y1="75" x2="50" y2="85"/>
                                    <line x1="15" y1="50" x2="25" y2="50"/><line x1="75" y1="50" x2="85" y2="50"/>
                                    <line x1="25" y1="25" x2="32" y2="32"/><line x1="68" y1="68" x2="75" y2="75"/>
                                    <line x1="25" y1="75" x2="32" y2="68"/><line x1="68" y1="25" x2="75" y2="32"/>
                                    <!-- inner dots to match reference perfectly -->
                                    <circle cx="50" cy="10" r="1"/><circle cx="50" cy="90" r="1"/>
                                    <circle cx="10" cy="50" r="1"/><circle cx="90" cy="50" r="1"/>
                                </g>
                            </svg>
                        </div>
                        <span class="text-sm font-medium text-slate-600 group-hover:text-slate-800 transition-colors italic" style="font-family: '楷体', 'KaiTi', serif; font-size: 16px;">调高一点传说概率</span>
                        <div class="ml-auto w-10 h-5 bg-slate-200 rounded-full relative transition-colors" id="track-boost">
                            <div class="w-4 h-4 bg-white rounded-full absolute top-0.5 left-0.5 shadow transition-transform" id="thumb-boost"></div>
                        </div>
                    </div>

                    <!-- Cheat 2: Pity System -->
                    <div id="toggle-pity" class="flex items-center gap-3 cursor-pointer group select-none p-3 rounded-lg hover:bg-white border border-transparent hover:border-slate-200 transition-all">
                        <div class="relative w-6 h-6 flex items-center justify-center">
                            <!-- SVG Hand-drawn spinner -->
                            <svg class="hand-drawn-spin absolute inset-0 w-full h-full opacity-0 transition-opacity" id="spinner-pity" viewBox="0 0 100 100">
                                <g stroke="currentColor" stroke-width="8" stroke-linecap="round">
                                    <line x1="50" y1="15" x2="50" y2="25"/><line x1="50" y1="75" x2="50" y2="85"/>
                                    <line x1="15" y1="50" x2="25" y2="50"/><line x1="75" y1="50" x2="85" y2="50"/>
                                    <line x1="25" y1="25" x2="32" y2="32"/><line x1="68" y1="68" x2="75" y2="75"/>
                                    <line x1="25" y1="75" x2="32" y2="68"/><line x1="68" y1="25" x2="75" y2="32"/>
                                    <circle cx="50" cy="10" r="1"/><circle cx="50" cy="90" r="1"/>
                                    <circle cx="10" cy="50" r="1"/><circle cx="90" cy="50" r="1"/>
                                </g>
                            </svg>
                        </div>
                        <span class="text-sm font-medium text-slate-600 group-hover:text-slate-800 transition-colors italic" style="font-family: '楷体', 'KaiTi', serif; font-size: 16px;">偷偷塞个保底进去</span>
                        <div class="ml-auto w-10 h-5 bg-slate-200 rounded-full relative transition-colors" id="track-pity">
                            <div class="w-4 h-4 bg-white rounded-full absolute top-0.5 left-0.5 shadow transition-transform" id="thumb-pity"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Secret Trigger Area -->
        <div id="secret-trigger" class="absolute bottom-2 right-4 text-[10px] text-slate-300 hover:text-slate-400 cursor-pointer z-20" title="System Info">
            v1.0.2
        </div>

    </div>

    <!-- AI Report Modal -->
    <div id="ai-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-[100] hidden">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full mx-4 overflow-hidden flex flex-col transform transition-all">
            <div class="bg-slate-800 px-4 py-3 flex justify-between items-center text-slate-100 border-b border-slate-700">
                <h3 class="font-mono font-bold text-sm flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    ✨ 专家级系统异常诊断报告
                </h3>
                <button id="close-ai-modal" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 bg-slate-900">
                <div id="ai-report-content" class="text-sm text-green-400 leading-relaxed font-mono whitespace-pre-wrap min-h-[120px]">
                    <!-- Report generates here -->
                </div>
            </div>
            <div class="bg-slate-800 px-4 py-3 border-t border-slate-700 flex justify-end">
                <button id="btn-copy-report" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-indigo-700 transition-colors shadow-lg active:scale-95">
                    一键复制 (准备汇报)
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <script>
        // --- 核心状态 ---
        let state = {
            points: 1000,
            cost: 100,
            pullsSinceLegendary: 0,
            pityThreshold: 10,
            cheats: {
                boostEnabled: false,
                pityEnabled: false
            }
        };

        // --- 摸鱼奖励池 ---
        const gachaPool = {
            common: {
                rarity: '常规诊断 (普通)', color: 'text-slate-500', bg: 'bg-slate-100', border: 'border-slate-300',
                items: [
                    { title: '带薪喝水', desc: '假装去茶水间接水，实则发呆3分钟。' },
                    { title: '整理桌面', desc: '把桌上的笔筒往左移了2厘米。' },
                    { title: '深呼吸', desc: '盯着屏幕假装思考，其实大脑一片空白。' }
                ]
            },
            rare: {
                rarity: '异常警告 (稀有)', color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-300',
                items: [
                    { title: '带薪摸鱼', desc: '拿上手机，偷偷看15分钟。' },
                    { title: '下楼拿外卖', desc: '借着拿外卖的名义在楼下溜达了一圈。' },
                    { title: '切换窗口', desc: '老板路过瞬间，Alt+Tab 切换到代码编辑器。' }
                ]
            },
            epic: {
                rarity: '严重故障 (史诗)', color: 'text-purple-600', bg: 'bg-purple-50', border: 'border-purple-400',
                items: [
                    { title: '光明正大刷视频', desc: '戴上耳机，假装在看技术教程。' },
                    { title: '午休延长', desc: '趴在桌上多睡了半小时，口水差点流出来。' },
                    { title: '找同事聊天', desc: '以“讨论需求”为由，聊了半小时八卦。' }
                ]
            },
            legendary: {
                rarity: '系统崩溃 (传说)', color: 'text-amber-600', bg: 'bg-amber-100', border: 'border-amber-400',
                items: [
                    { title: '老板今天出差！', desc: '山中无老虎，猴子称大王。直接开启无双摸鱼模式！' },
                    { title: '服务器宕机', desc: '不用干活了！大家一起盯着屏幕聊天等修复。' },
                    { title: '公司停电', desc: '天降正义！提前带薪下班！' }
                ]
            }
        };

        // --- DOM 元素引用 ---
        const els = {
            points: document.getElementById('points-display'),
            btnWork: document.getElementById('btn-work'),
            btnPull: document.getElementById('btn-pull'),
            pityCounter: document.getElementById('pity-counter'),
            logContainer: document.getElementById('log-container'),
            
            resultCard: document.getElementById('result-card'),
            resultPlaceholder: document.getElementById('result-placeholder'),
            resultContent: document.getElementById('result-content'),
            resultRarity: document.getElementById('result-rarity'),
            resultTitle: document.getElementById('result-title'),
            resultDesc: document.getElementById('result-desc'),

            secretTrigger: document.getElementById('secret-trigger'),
            secretPanel: document.getElementById('secret-panel'),
            closeSecret: document.getElementById('close-secret'),
            
            toggleBoost: document.getElementById('toggle-boost'),
            spinnerBoost: document.getElementById('spinner-boost'),
            trackBoost: document.getElementById('track-boost'),
            thumbBoost: document.getElementById('thumb-boost'),

            togglePity: document.getElementById('toggle-pity'),
            spinnerPity: document.getElementById('spinner-pity'),
            trackPity: document.getElementById('track-pity'),
            thumbPity: document.getElementById('thumb-pity'),

            toastContainer: document.getElementById('toast-container'),

            // AI Features
            btnAiReport: document.getElementById('btn-ai-report'),
            aiModal: document.getElementById('ai-modal'),
            closeAiModal: document.getElementById('close-ai-modal'),
            aiReportContent: document.getElementById('ai-report-content'),
            btnCopyReport: document.getElementById('btn-copy-report')
        };

        const apiKey = "";
        let currentPulledItem = null;

        // --- 工具函数 ---
        function updateUI() {
            els.points.innerText = state.points;
            els.pityCounter.innerText = `${state.pullsSinceLegendary} / ${state.pityThreshold}`;
            if(state.points < state.cost) {
                els.btnPull.classList.replace('bg-blue-600', 'bg-slate-400');
                els.btnPull.classList.remove('hover:bg-blue-700', 'hover:shadow-xl');
            } else {
                els.btnPull.classList.replace('bg-slate-400', 'bg-blue-600');
                els.btnPull.classList.add('hover:bg-blue-700', 'hover:shadow-xl');
            }
        }

        function addLog(message, isSpecial = false) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const logEntry = document.createElement('div');
            logEntry.className = `py-1 border-b border-slate-100 ${isSpecial ? 'text-blue-600 font-semibold' : 'text-slate-600'}`;
            logEntry.innerHTML = `<span class="text-slate-400 mr-2">[${time}]</span> ${message}`;
            els.logContainer.appendChild(logEntry);
            els.logContainer.scrollTop = els.logContainer.scrollHeight;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium toast-enter';
            toast.innerText = message;
            els.toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 500); // Wait for exit animation
            }, 2500);
        }

        // --- STREAMING_CHUNK:Adding game logic (Work and Pull mechanics)... ---
        // --- 核心操作 ---
        els.btnWork.addEventListener('click', () => {
            state.points += 50;
            updateUI();
            addLog('Allocated 50 resource points to the monitor.');
            
            // Subtle button animation
            els.btnWork.style.transform = 'scale(0.98)';
            setTimeout(() => els.btnWork.style.transform = 'none', 100);
        });

        els.btnPull.addEventListener('click', () => {
            if (state.points < state.cost) {
                showToast("算力不足！请先点击 [分配算力] 假装工作一下。");
                return;
            }

            // 扣除消耗
            state.points -= state.cost;
            state.pullsSinceLegendary++;

            // 抽卡概率计算
            let rarityKey = 'common';
            const roll = Math.random();
            
            // Default rates
            let rates = { legendary: 0.02, epic: 0.10, rare: 0.30 };
            
            // 秘密外挂 1: 调高一点传说概率 (2% -> 25%)
            if (state.cheats.boostEnabled) {
                rates.legendary = 0.25;
                rates.epic = 0.25; // Bump epic too to make it feel better
            }

            // 秘密外挂 2: 偷偷塞个保底进去
            let isPityHit = false;
            if (state.cheats.pityEnabled && state.pullsSinceLegendary >= state.pityThreshold) {
                rarityKey = 'legendary';
                isPityHit = true;
                addLog('>> OVERRIDE: Forced System Event (Pity System Triggered)', true);
            } 
            else {
                // Normal RNG Check
                if (roll < rates.legendary) {
                    rarityKey = 'legendary';
                } else if (roll < rates.legendary + rates.epic) {
                    rarityKey = 'epic';
                } else if (roll < rates.legendary + rates.epic + rates.rare) {
                    rarityKey = 'rare';
                }
            }

            if (rarityKey === 'legendary') {
                state.pullsSinceLegendary = 0; // Reset pity
            }

            // 获取物品
            const category = gachaPool[rarityKey];
            const item = category.items[Math.floor(Math.random() * category.items.length)];

            // 更新显示结果
            displayResult(category, item, isPityHit);
            updateUI();
        });

        function displayResult(category, item, isPityHit) {
            // UI transitions
            els.resultPlaceholder.classList.add('hidden');
            els.resultContent.classList.remove('hidden');
            
            // Reset classes
            els.resultCard.className = `w-full max-w-sm rounded-xl border-2 border-dashed h-full flex flex-col items-center justify-center p-6 transition-all duration-300 ${category.bg} ${category.border}`;
            
            // Apply legendary effect
            if (category.rarity.includes('传说')) {
                els.resultCard.classList.add('legendary-card');
                els.resultCard.classList.remove('border-dashed');
                els.resultCard.classList.add('border-solid');
            } else {
                els.resultCard.classList.remove('legendary-card');
            }

            // Set content
            els.resultRarity.className = `text-xs font-bold px-2 py-1 rounded mb-3 bg-white bg-opacity-50 ${category.color} border border-current`;
            els.resultRarity.innerText = category.rarity;
            els.resultTitle.innerText = item.title;
            els.resultTitle.className = `text-xl font-bold mb-2 ${category.color}`;
            els.resultDesc.innerText = item.desc;

            // Show and set up AI button
            currentPulledItem = item;
            els.btnAiReport.classList.remove('hidden');
            els.btnAiReport.innerHTML = `✨ AI 生成技术分析报告`;
            els.btnAiReport.disabled = false;

            // Log
            let logMsg = `Diagnostic result: [${item.title}] - ${item.desc}`;
            if (isPityHit) logMsg += ' (Guaranteed)';
            addLog(logMsg, category.rarity.includes('传说'));
        }

        // --- STREAMING_CHUNK:Implementing the secret Gemini cheats menu interactions... ---
        // --- 秘密菜单交互 ---
        els.secretTrigger.addEventListener('click', () => {
            els.secretPanel.classList.remove('translate-y-full');
        });
        
        els.closeSecret.addEventListener('click', () => {
            els.secretPanel.classList.add('translate-y-full');
        });

        // Toggle Boost Cheat
        els.toggleBoost.addEventListener('click', () => {
            state.cheats.boostEnabled = !state.cheats.boostEnabled;
            const active = state.cheats.boostEnabled;
            
            // Animate toggle switch
            els.trackBoost.className = `ml-auto w-10 h-5 rounded-full relative transition-colors ${active ? 'bg-orange-400' : 'bg-slate-200'}`;
            els.thumbBoost.style.transform = active ? 'translateX(20px)' : 'translateX(0)';
            
            // Show cute spinner from screenshot
            els.spinnerBoost.style.opacity = active ? '1' : '0';
            
            if (active) showToast("Gemini提示：传说概率已暗中调至 25% 🤫");
        });

        // Toggle Pity Cheat
        els.togglePity.addEventListener('click', () => {
            state.cheats.pityEnabled = !state.cheats.pityEnabled;
            const active = state.cheats.pityEnabled;
            
            // Animate toggle switch
            els.trackPity.className = `ml-auto w-10 h-5 rounded-full relative transition-colors ${active ? 'bg-orange-400' : 'bg-slate-200'}`;
            els.thumbPity.style.transform = active ? 'translateX(20px)' : 'translateX(0)';
            
            // Show cute spinner from screenshot
            els.spinnerPity.style.opacity = active ? '1' : '0';

            if (active) {
                showToast("Gemini提示：已注入 10抽保底机制 🤫");
                updateUI(); // Refresh pity counter display
            }
        });

        // --- ✨ Gemini AI 核心外挂 ---
        els.btnAiReport.addEventListener('click', async () => {
            if (!currentPulledItem) return;

            // Show loading state
            els.btnAiReport.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-indigo-600 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 解析中...`;
            els.btnAiReport.disabled = true;
            
            els.aiModal.classList.remove('hidden');
            els.aiReportContent.innerHTML = `<span class="text-slate-400 animate-pulse">> Initializing AI Diagnostic Module...\n> Connecting to LLM Core...\n> Generating expert-level obfuscation report...</span>`;
            
            try {
                const prompt = `当前检测到的系统异常状态（员工想干的事）：【${currentPulledItem.title}】（描述：${currentPulledItem.desc}）。\n\n请用不超过150字的极其严肃、硬核的IT技术术语，将这个行为包装成一个“势在必行的高级技术操作”或“紧急系统故障排查”。例如把去洗手间说成“释放内存池避免堆栈溢出”，把喝水说成“对生物碳基处理器进行液冷降温”。直接输出一段连续的诊断报告文字，不要有多余的问候语。`;
                
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: "你是一个资深系统架构师，专长是用极其晦涩高深的计算机术语来一本正经地胡说八道，帮助打工人完美掩盖摸鱼事实。" }] }
                };

                let reportText = "";
                let delay = 1000;
                for (let i = 0; i < 5; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const data = await response.json();
                        reportText = data.candidates[0].content.parts[0].text;
                        break;
                    } catch (e) {
                        if (i === 4) throw e;
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    }
                }

                // Typewriter effect for the terminal look
                els.aiReportContent.innerHTML = '';
                let index = 0;
                const typeWriter = setInterval(() => {
                    if (index < reportText.length) {
                        els.aiReportContent.innerHTML += reportText.charAt(index);
                        index++;
                    } else {
                        clearInterval(typeWriter);
                    }
                }, 20);
                
            } catch (error) {
                els.aiReportContent.innerHTML = `<span class="text-red-500">> ERROR: Failed to connect to AI server. Reason: ${error.message}</span>`;
            } finally {
                els.btnAiReport.innerHTML = `✨ AI 生成技术分析报告`;
                els.btnAiReport.disabled = false;
            }
        });

        els.closeAiModal.addEventListener('click', () => {
            els.aiModal.classList.add('hidden');
        });

        els.btnCopyReport.addEventListener('click', () => {
            const textToCopy = els.aiReportContent.innerText;
            try {
                // Fallback approach for copy in iframes
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                showToast("复制成功！快去发给老板！");
            } catch (err) {
                showToast("复制失败，请手动选取文字复制。");
            }
        });

        // Initialize UI
        updateUI();

    </script>
</body>
</html>
