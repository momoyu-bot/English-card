<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜班的东西们</title>
<meta name="description" content="路灯、冰箱、关东煮……轻点翻页，看看夜里都有谁在上班。">
<style>
  :root{
    --ink-0:#080D14;
    --ink-1:#0B1220;
    --ink-2:#0F1A1C;
    --sodium:#E8B87A;     /* 钠灯的暖橘，路灯的颜色 */
    --frost:#7FA8A0;      /* 冰箱缝里那点冷青 */
    --text:#C2CDD2;
    --text-hi:#E2E9E6;
    --dim:#5A6A72;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%;}

  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #12203100 0%, #0000 60%),
      linear-gradient(168deg, var(--ink-1) 0%, var(--ink-0) 45%, var(--ink-2) 100%);
    color:var(--text);
    font-family:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong",serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    cursor:default;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* 四角压暗，像隔着玻璃看夜 */
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(105% 75% at 50% 45%, #0000 40%, #000000A6 100%);
  }

  /* ── 浮尘（不是星星，是灯光里那种慢慢转的灰） ── */
  #dust{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .mote{
    position:absolute;
    width:2px;height:2px;border-radius:50%;
    background:var(--sodium);
    opacity:0;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%   {transform:translate3d(0,12vh,0) scale(.8); opacity:0;}
    12%  {opacity:.22;}
    88%  {opacity:.16;}
    100% {transform:translate3d(6vw,-16vh,0) scale(1.1); opacity:0;}
  }

  /* ── 舞台 ── */
  #stage{
    position:relative; z-index:2;
    height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(28px,7vw,64px);
  }

  .page{
    position:absolute;
    width:min(34rem,100%);
    opacity:0;
    transform:translateY(6px);
    transition:opacity 1.15s ease, transform 1.15s ease;
    pointer-events:none;
  }
  .page.on{opacity:1;transform:translateY(0);pointer-events:auto;}

  /* ── 签名元素：值班表标签 ── */
  .shift{
    display:flex; align-items:baseline; gap:.85em;
    font-family:ui-monospace,SFMono-Regular,Menlo,"Courier New",monospace;
    font-size:clamp(10px,2.6vw,11.5px);
    letter-spacing:.22em;
    color:var(--dim);
    margin-bottom:clamp(22px,5vw,34px);
    text-transform:uppercase;
  }
  .shift .t{color:var(--sodium);opacity:.62;}
  .shift .rule{
    flex:1; height:1px;
    background:linear-gradient(90deg,#ffffff26,#ffffff00);
  }

  /* ── 意象 ── */
  .glyph{
    height:clamp(46px,11vw,62px);
    margin-bottom:clamp(20px,5vw,30px);
    color:var(--sodium);
    opacity:.5;
  }
  .glyph svg{height:100%;width:auto;display:block;overflow:visible;}
  .glyph svg *{
    fill:none;stroke:currentColor;
    stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }
  .halo{fill:currentColor !important;stroke:none !important;opacity:.13;}
  .pulse{fill:currentColor !important;stroke:none !important;animation:breathe 4.5s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.2}50%{opacity:.95}}

  /* ── 正文 ── */
  p{
    font-size:clamp(16.5px,4.3vw,20px);
    line-height:2.15;
    letter-spacing:.045em;
    color:var(--text);
    text-wrap:pretty;
  }
  p + p{margin-top:1.35em;}
  .lead{color:var(--text-hi);}

  /* 封面 */
  #cover h1{
    font-weight:400;
    font-size:clamp(28px,8vw,40px);
    letter-spacing:.28em;
    color:var(--text-hi);
    line-height:1.7;
    text-indent:.28em;
  }
  #cover .sub{
    margin-top:1.9em;
    font-size:clamp(13px,3.4vw,14.5px);
    color:var(--dim);
    letter-spacing:.16em;
    line-height:2;
  }

  /* 尾页 */
  #outro{text-align:center;}
  #outro .lamp{
    width:7px;height:7px;border-radius:50%;
    background:var(--sodium);
    margin:0 auto clamp(26px,6vw,36px);
    animation:breathe 5.5s ease-in-out infinite;
    box-shadow:0 0 16px 3px #E8B87A2E;
  }
  #outro .bye{
    font-size:clamp(15px,4vw,17px);
    letter-spacing:.55em;
    text-indent:.55em;
    color:var(--text);
    opacity:.62;
  }
  #outro .again{
    margin-top:clamp(34px,8vw,48px);
    font-family:ui-monospace,Menlo,monospace;
    font-size:10.5px;letter-spacing:.2em;
    color:var(--dim);opacity:.45;
  }

  /* ── 打卡格进度 ── */
  #ticks{
    position:fixed; z-index:4;
    left:50%; transform:translateX(-50%);
    bottom:max(22px,env(safe-area-inset-bottom));
    display:flex; gap:7px; align-items:flex-end;
    pointer-events:none;
  }
  #ticks i{
    display:block;width:1px;height:8px;
    background:var(--text);opacity:.12;
    transition:opacity .8s ease,height .8s ease,background .8s ease;
  }
  #ticks i.done{opacity:.2;height:5px;}
  #ticks i.now{opacity:.75;height:13px;background:var(--sodium);}

  /* ── 英文层开关（默认关） ── */
  #en{
    position:fixed;z-index:6;
    right:max(16px,env(safe-area-inset-right));
    bottom:max(16px,env(safe-area-inset-bottom));
    font-family:ui-monospace,Menlo,monospace;
    font-size:10px;letter-spacing:.18em;
    color:var(--dim);opacity:.22;
    background:none;border:0;padding:10px;
    cursor:pointer;transition:opacity .5s ease;
  }
  #en:hover,#en:focus-visible{opacity:.6;}
  #en.on{opacity:.55;color:var(--frost);}
  body.en-on p{letter-spacing:.01em;line-height:2.05;}

  :focus-visible{outline:1px solid #7FA8A066;outline-offset:6px;}

  @media (prefers-reduced-motion:reduce){
    .mote{display:none;}
    .page{transition:opacity .35s linear;transform:none;}
    .pulse,#outro .lamp{animation:none;opacity:.7;}
  }
</style>
</head>
<body>

<div id="dust" aria-hidden="true"></div>
<div id="stage"></div>
<div id="ticks" aria-hidden="true"></div>
<button id="en" aria-label="switch to simple English">en</button>

<script>
/* ───────── 意象 ───────── */
const G = {
  lamp:`<svg viewBox="0 0 40 52"><circle class="halo" cx="12" cy="19" r="12"/><path d="M12 19h0"/><path d="M28 50V13"/><path d="M28 13c0-5-6-7-11-6"/><path d="M14 6l-3 8h7z"/></svg>`,
  fridge:`<svg viewBox="0 0 34 52"><rect x="5" y="3" width="24" height="46" rx="3"/><path d="M5 19h24"/><path d="M11 11v5"/><path d="M11 24v6"/></svg>`,
  pot:`<svg viewBox="0 0 52 46"><path d="M9 20h34v14a6 6 0 0 1-6 6H15a6 6 0 0 1-6-6z"/><path d="M9 24H5"/><path d="M43 24h4"/><path d="M20 13c3-3-2-6 1-10"/><path d="M31 13c3-3-2-6 1-10"/></svg>`,
  phone:`<svg viewBox="0 0 30 52"><rect x="3" y="2" width="24" height="48" rx="4"/><circle class="pulse" cx="15" cy="43" r="2.1"/><path d="M11 8h8"/></svg>`,
  pipe:`<svg viewBox="0 0 46 52"><path d="M10 2v16a6 6 0 0 0 6 6h14a6 6 0 0 1 6 6v16"/><path d="M6 12h8"/><path d="M32 40h8"/></svg>`,
  cloud:`<svg viewBox="0 0 56 40"><path d="M14 30c-6 0-10-4-10-9s4-9 9-8c2-6 7-10 13-10s12 5 13 12c5 0 10 3 10 8s-4 7-9 7z"/><path d="M18 36h22"/></svg>`,
  you:`<svg viewBox="0 0 56 34"><path d="M4 30h48"/><path d="M4 30v-8h48v8"/><path d="M12 22c4-9 12-11 18-6"/><circle cx="34" cy="15" r="3.4"/></svg>`
};

/* ───────── 故事 ───────── */
const STORY = [
  { cover:true },
  { t:"23:40", label:"路灯", g:"lamp",
    zh:[`路灯是最老的一批夜班工。`,
        `它们不照亮什么具体的东西，只是把黑往外推开一点点，留出一个刚好够走过去的圆。`,
        `没有人走的时候，那个圆也一直亮着。它们不觉得这算白费。`],
    en:[`Street lamps have worked nights the longest.`,
        `They do not light up anything in particular. They just push the dark back a little, and leave a circle big enough to walk through.`,
        `When nobody walks through it, the circle stays on anyway. They do not think this is a waste.`] },
  { t:"00:35", label:"冰箱", g:"fridge",
    zh:[`冰箱在厨房里嗡了一整夜。`,
        `它其实一直在做同一件事——把一小块冬天稳稳地端着，不让它洒出来。`,
        `你半夜去倒水的时候，它会安静两秒，像被人看见了一样。`],
    en:[`The fridge hums in the kitchen all night.`,
        `It is really only doing one thing. It holds a small piece of winter, very steadily, and does not let it spill.`,
        `When you go for water at night, it goes quiet for two seconds, like something that has just been seen.`] },
  { t:"01:20", label:"关东煮", g:"pot",
    zh:[`街角便利店的锅还温着，汤在里面非常慢地转。`,
        `到这个点，锅里剩下最后两颗萝卜。它们已经煮得很软了，软到快要变成汤本身。`,
        `店员靠在收银台后面打盹。没人买，它们也不着急。`],
    en:[`At the corner store the pot is still warm, and the broth turns very slowly inside it.`,
        `By now there are two pieces of radish left. They have gone soft. Almost soft enough to become the broth.`,
        `The clerk dozes behind the counter. Nobody buys them, and they are in no hurry.`] },
  { t:"02:05", label:"充电的手机", g:"phone",
    zh:[`你的手机躺在枕头边，指示灯一亮一暗，像谁在很慢地呼吸。`,
        `它不知道你已经睡着了。`,
        `还在很认真地，一格一格往上装。`],
    en:[`Your phone lies by the pillow. The little light goes on, then dim, like someone breathing slowly.`,
        `It does not know you have already fallen asleep.`,
        `It keeps filling itself up, one bar at a time, very seriously.`] },
  { t:"02:50", label:"楼上的水管", g:"pipe",
    zh:[`楼上的水管半夜会响一下。`,
        `不是有人在用水——是白天的水，刚刚才走到那里。`,
        `房子有点大，消息传得慢。`],
    en:[`The pipes upstairs knock once in the middle of the night.`,
        `Nobody is using water. It is the water from the daytime, only now arriving there.`,
        `The building is a little big. News travels slowly in it.`] },
  { t:"03:30", label:"云", g:"cloud",
    zh:[`云值夜班的时候是不飘的。`,
        `它们停在原地，把白天走过的路，一点一点地忘掉。`,
        `到天亮，就又是干干净净的一朵了。`],
    en:[`Clouds do not drift on the night shift.`,
        `They stop where they are, and slowly forget the road they walked in the daytime.`,
        `By morning each of them is a clean cloud again.`] },
  { t:"04:10", label:"你", g:"you",
    zh:[`最后一个还没下班的，是你。`,
        `其实已经交接得差不多了：灯还亮着一会儿，汤还温着一会儿，手机还在装一会儿。`,
        `它们都说，剩下的我们来。`,
        `你先睡。`],
    en:[`The last one still on shift is you.`,
        `The handover is nearly done. The lamp stays on a while, the broth stays warm a while, the phone keeps filling a while.`,
        `They all say: we will take the rest.`,
        `You go to sleep first.`] },
  { outro:true }
];

/* ───────── 渲染 ───────── */
const stage = document.getElementById('stage');
const ticksEl = document.getElementById('ticks');
let lang = 'zh', i = 0;

STORY.forEach((s, n) => {
  const el = document.createElement('section');
  el.className = 'page';
  el.dataset.n = n;

  if (s.cover){
    el.id = 'cover';
    el.innerHTML = `<h1>夜班的东西们</h1>
      <div class="sub" data-zh="世界上有些东西是上夜班的。<br>它们在你睡着的时候各自值班，谁也不叫醒谁。<br><br>轻点任意处，翻过去"
        data-en="Some things in the world work the night shift.<br>They keep watch while you sleep, and none of them wakes the others.<br><br>Tap anywhere to turn the page">
        世界上有些东西是上夜班的。<br>它们在你睡着的时候各自值班，谁也不叫醒谁。<br><br>轻点任意处，翻过去</div>`;
  } else if (s.outro){
    el.id = 'outro';
    el.innerHTML = `<div class="lamp"></div>
      <div class="bye" data-zh="晚 安" data-en="good night">晚 安</div>
      <div class="again" data-zh="轻点，再听一遍" data-en="tap to hear it again">轻点，再听一遍</div>`;
  } else {
    el.innerHTML =
      `<div class="shift"><span class="t">${s.t}</span><span>${s.label}</span><span class="rule"></span></div>
       <div class="glyph">${G[s.g]}</div>
       ${s.zh.map((line,k)=>`<p${k===0?' class="lead"':''} data-zh="${line}" data-en="${s.en[k]}">${line}</p>`).join('')}`;
    const tick = document.createElement('i');
    ticksEl.appendChild(tick);
  }
  stage.appendChild(el);
});

const pages = [...document.querySelectorAll('.page')];
const ticks = [...ticksEl.children];

function show(n){
  i = (n + pages.length) % pages.length;
  pages.forEach(p => p.classList.toggle('on', +p.dataset.n === i));
  ticks.forEach((t, k) => {
    t.className = k + 1 < i ? 'done' : (k + 1 === i ? 'now' : '');
  });
  ticksEl.style.opacity = (i === 0 || i === pages.length - 1) ? '0' : '1';
}
ticksEl.style.transition = 'opacity 1s ease';

/* ───────── 翻页 ───────── */
document.addEventListener('click', e => {
  if (e.target.closest('#en')) return;
  show(i + 1);
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); show(i + 1); }
  if (e.key === 'ArrowLeft') show(i - 1);
});

/* ───────── 英文层，默认关 ───────── */
const enBtn = document.getElementById('en');
enBtn.addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  enBtn.classList.toggle('on', lang === 'en');
  enBtn.textContent = lang === 'en' ? '中' : 'en';
  document.body.classList.toggle('en-on', lang === 'en');
  document.querySelectorAll('[data-zh]').forEach(n => {
    n.innerHTML = lang === 'en' ? n.dataset.en : n.dataset.zh;
  });
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
});

/* ───────── 浮尘 ───────── */
const dust = document.getElementById('dust');
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
  for (let n = 0; n < 26; n++){
    const m = document.createElement('span');
    m.className = 'mote';
    m.style.left = Math.random() * 100 + 'vw';
    m.style.top  = Math.random() * 100 + 'vh';
    m.style.animationDuration = (38 + Math.random() * 40) + 's';
    m.style.animationDelay = (-Math.random() * 60) + 's';
    m.style.transform = `scale(${.6 + Math.random() * .9})`;
    dust.appendChild(m);
  }
}

show(0);
</script>
</body>
</html>
