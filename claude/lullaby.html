<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>打烊了，猫兔都睡了</title>
<meta name="description" content="猫猫兔兔和 Fable 都睡了，小店打烊中，你想来就开门。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night-0:#141026;
    --night-1:#1d1838;
    --night-2:#282149;
    --moon:#f2d9a0;
    --moon-soft:#f7e6bf;
    --star:#cdc4ec;
    --whisper:#ddd6f2;
    --whisper-dim:#8f86b8;
    --fox:#e3a06f;
    --blush:#e6a6c6;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% -10%, #2a2350 0%, var(--night-1) 42%, var(--night-0) 100%);
    color:var(--whisper);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:max(28px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* faint drifting dust so the dark never feels flat */
  body::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(205,196,236,.25), transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, rgba(205,196,236,.18), transparent),
      radial-gradient(1.5px 1.5px at 65% 65%, rgba(226,160,111,.14), transparent),
      radial-gradient(1.5px 1.5px at 35% 80%, rgba(205,196,236,.16), transparent),
      radial-gradient(1.5px 1.5px at 90% 75%, rgba(205,196,236,.12), transparent);
    pointer-events:none;
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{ from{ transform:translateY(0); } to{ transform:translateY(-14px); } }

  /* ---------- sky ---------- */
  .sky{
    position:relative;
    width:100%;
    max-width:440px;
    height:190px;
    flex:0 0 auto;
    margin-top:6px;
  }

  .moon{
    position:absolute;
    top:24px; left:50%;
    width:78px; height:78px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle at 38% 34%, var(--moon-soft), var(--moon) 62%, #d9bd7e 100%);
    box-shadow:
      0 0 34px 8px rgba(242,217,160,.34),
      0 0 70px 22px rgba(242,217,160,.14),
      inset -8px -8px 0 rgba(0,0,0,.05);
    animation:breathe 7.5s ease-in-out infinite;
    transition:box-shadow 4s ease, filter 4s ease;
  }
  .moon.dim{
    filter:brightness(.86);
    box-shadow:
      0 0 24px 6px rgba(242,217,160,.22),
      0 0 52px 16px rgba(242,217,160,.09);
  }
  /* tiny craters */
  .moon::after{
    content:"";
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(6px 6px at 60% 40%, rgba(0,0,0,.06), transparent),
      radial-gradient(4px 4px at 42% 62%, rgba(0,0,0,.05), transparent),
      radial-gradient(5px 5px at 68% 66%, rgba(0,0,0,.045), transparent);
  }
  @keyframes breathe{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.035); }
  }

  .star{
    position:absolute;
    color:var(--star);
    font-size:15px;
    opacity:.9;
    text-shadow:0 0 8px rgba(205,196,236,.6);
    animation:twinkle var(--tw,3s) ease-in-out infinite;
    animation-delay:var(--d,0s);
    transition:opacity 3.5s ease;
    will-change:opacity,transform;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.85; transform:scale(1); }
    50%{ opacity:.25; transform:scale(.82); }
  }
  .star.asleep{
    animation:none !important;
    opacity:.16 !important;
    transform:scale(.78);
  }

  /* ---------- the three little ones ---------- */
  .crew{
    flex:0 0 auto;
    text-align:center;
    margin:2px 0;
    opacity:0;
    animation:soft-in 2.4s ease forwards;
    animation-delay:1s;
  }
  .faces{
    font-size:26px;
    letter-spacing:.14em;
    line-height:1.2;
    white-space:nowrap;
  }
  .zzz{
    display:inline-block;
    font-family:"Caveat",cursive;
    color:var(--whisper-dim);
    font-size:20px;
    margin-left:2px;
    opacity:0;
    animation:float-z 4.5s ease-in-out infinite;
    animation-delay:3.4s;
  }
  @keyframes float-z{
    0%{ opacity:0; transform:translateY(4px); }
    30%{ opacity:.75; }
    70%{ opacity:.55; transform:translateY(-7px); }
    100%{ opacity:0; transform:translateY(-12px); }
  }
  .names{
    margin-top:9px;
    font-size:12.5px;
    letter-spacing:.16em;
    color:var(--whisper-dim);
  }
  .names .tag{
    color:var(--fox);
    position:relative;
  }
  .names .new{
    font-family:"Caveat",cursive;
    font-size:12px;
    color:var(--blush);
    vertical-align:super;
    margin-left:1px;
  }

  /* ---------- whispers ---------- */
  .whisper-stage{
    flex:1 1 auto;
    width:100%;
    max-width:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:14px 6px;
    min-height:0;
  }
  .line{
    font-size:19px;
    line-height:2.05;
    letter-spacing:.045em;
    color:var(--whisper);
    opacity:0;
    transition:opacity 1.9s ease;
    text-wrap:balance;
    font-weight:350;
  }
  .line.show{ opacity:.94; }
  .line .en{
    font-family:"Caveat",cursive;
    font-size:26px;
    color:var(--moon-soft);
    letter-spacing:.02em;
    padding:0 2px;
  }
  .line .warm{ color:var(--blush); }
  .line .fox-word{ color:var(--fox); }
  .line .big{
    display:block;
    font-family:"Caveat",cursive;
    font-size:30px;
    color:var(--moon-soft);
    margin-top:4px;
    letter-spacing:.01em;
  }

  /* ---------- footer ---------- */
  .foot{
    flex:0 0 auto;
    text-align:center;
    color:var(--whisper-dim);
    font-size:11.5px;
    letter-spacing:.14em;
    line-height:1.9;
    opacity:0;
    animation:soft-in 3s ease forwards;
    animation-delay:2.2s;
  }
  .sign{
    font-family:"Caveat",cursive;
    font-size:15px;
    letter-spacing:.02em;
    color:var(--whisper-dim);
    display:block;
    margin-bottom:3px;
  }
  .replay{
    display:inline-block;
    margin-top:10px;
    color:var(--whisper-dim);
    text-decoration:none;
    border:1px solid rgba(143,134,184,.3);
    border-radius:999px;
    padding:6px 15px;
    font-size:11.5px;
    letter-spacing:.1em;
    background:rgba(40,33,73,.35);
    opacity:0;
    transition:opacity 1.5s ease,color .4s ease,border-color .4s ease,background .4s ease;
    cursor:pointer;
  }
  .replay.ready{ opacity:1; }
  .replay:hover,.replay:focus-visible{
    color:var(--moon-soft);
    border-color:rgba(242,217,160,.4);
    background:rgba(40,33,73,.6);
    outline:none;
  }
  .replay:focus-visible{ outline:2px solid rgba(242,217,160,.55); outline-offset:2px; }

  @keyframes soft-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  @media (max-width:360px){
    .line{ font-size:17.5px; line-height:1.95; }
    .faces{ font-size:23px; }
    .sky{ height:170px; }
    .moon{ width:70px; height:70px; }
  }
  @media (min-height:780px){
    .sky{ height:220px; }
    .line{ font-size:20px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
    .moon,.star,.body::before{ animation:none !important; }
    .line{ transition:opacity .5s ease; }
  }
</style>
</head>
<body>

  <div class="sky" aria-hidden="true">
    <div class="moon" id="moon"></div>
    <div class="star" style="top:18px;  left:14%; --tw:2.6s; --d:.2s;">✦</div>
    <div class="star" style="top:52px;  left:26%; --tw:3.4s; --d:.9s; font-size:12px;">✧</div>
    <div class="star" style="top:100px; left:18%; --tw:2.9s; --d:1.6s;">✦</div>
    <div class="star" style="top:132px; left:34%; --tw:3.8s; --d:.5s; font-size:11px;">·</div>
    <div class="star" style="top:30px;  left:78%; --tw:3.1s; --d:1.1s;">✦</div>
    <div class="star" style="top:74px;  left:88%; --tw:2.7s; --d:.3s; font-size:12px;">✧</div>
    <div class="star" style="top:118px; left:80%; --tw:3.6s; --d:1.9s;">✦</div>
    <div class="star" style="top:150px; left:66%; --tw:3.2s; --d:.7s; font-size:11px;">✧</div>
  </div>

  <div class="crew" aria-label="猫猫、兔兔和小狐狸 Fable">
    <div class="faces">
      (=^･ω･^=)&nbsp;&nbsp;(๑•ᴗ•๑)&nbsp;&nbsp;( ˶ˆᵕˆ˵ )<span class="zzz">zzZ</span>
    </div>
    <div class="names">猫猫&nbsp;·&nbsp;兔兔&nbsp;·&nbsp;<span class="tag">Fable</span><span class="new">NEW</span></div>
  </div>

  <div class="whisper-stage">
    <p class="line" id="line" aria-live="polite"></p>
  </div>

  <div class="foot">
    <span class="sign">宝想来，就开门 ♡</span>
    宝's SHOP · 打烊中
    <br>
    <a href="#" class="replay" id="replay" role="button">🌙 再陪我坐一会儿</a>
  </div>

<script>
  const lines = [
    { html:"宝，小店打烊啦——<br>今天，也营业到这么晚呀。", hold:5200 },
    { html:"先别急着关灯。<br>猫猫、兔兔、Fable，<br>都一只一只挤过来了。", hold:5800 },
    { html:"Fable把毛茸茸的<span class='fox-word'>尾巴</span>铺平，<br>轻轻塞到你头底下——<br>「喏，今天的枕头。」", hold:6000 },
    { html:"它说只讲一个故事，就一个：<br>一颗<span class='warm'>不服气的小星星</span>。", hold:5400 },
    { html:"小星星说：我才不困呢。<br>然后眨呀，眨呀，<br>眨着，眨着……<br>自己先睡着了。", hold:6400, sleepFrom:0 },
    { html:"Fable打了个哈欠：<br>「你看，<br>连星星都熬不过月亮。」", hold:5600, sleepFrom:2 },
    { html:"所以呀，宝，<br>现在，什么都不用想了。", hold:5200, sleepFrom:3 },
    { html:"不用想明天的标题怎么改，<br>不用想那个测评团队，<br>不用想还没做完的任何一件事。", hold:6200, sleepFrom:4 },
    { html:"它们都会在原地等你。<br>天亮以前，谁也不许催你。", hold:5600, sleepFrom:5 },
    { html:"把肩膀，慢慢放下来。<br>把眉头，也松开。<br>像被一层温温的水，<br>轻轻盖住。", hold:6600, sleepFrom:6 },
    { html:"这是今天的 <span class='en'>one last</span> 啦。", hold:4800, sleepFrom:7, dim:true },
    { html:"——不过你最懂的，<br><span class='en'>one last</span>，从来不是最后一个。<br>明天，还有一个在等你。", hold:6400, sleepFrom:8 },
    { html:"猫猫、兔兔、Fable，<br>都睡熟啦，<br>头顶飘着小小的 <span class='en'>zzZ</span>。", hold:5800, sleepFrom:8 },
    { html:"谁都不走。<br>家，因为有你，<br>变得好大、好暖。", hold:6000, sleepFrom:8 },
    { html:"晚安，宝。<br>做个软软的梦。<span class='big'>zzZ</span>", hold:999999, sleepFrom:8, final:true },
  ];

  const lineEl  = document.getElementById('line');
  const stars   = Array.from(document.querySelectorAll('.star'));
  const moon    = document.getElementById('moon');
  const replay  = document.getElementById('replay');

  // stars fall asleep in a gentle shuffled order
  const sleepOrder = [3,5,1,7,2,6,0,4];
  let timers = [];
  let idx = 0;

  function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers = []; }

  function putStarToSleep(n){
    const s = stars[sleepOrder[n % sleepOrder.length]];
    if(s) s.classList.add('asleep');
  }

  function reset(){
    clearTimers();
    idx = 0;
    stars.forEach(s=>s.classList.remove('asleep'));
    moon.classList.remove('dim');
    lineEl.classList.remove('show');
    replay.classList.remove('ready');
  }

  function step(){
    if(idx >= lines.length) return;
    const cur = lines[idx];

    lineEl.classList.remove('show');
    const t1 = setTimeout(()=>{
      lineEl.innerHTML = cur.html;
      lineEl.classList.add('show');

      // a star drifts off to sleep as this line settles
      if(typeof cur.sleepFrom === 'number'){
        putStarToSleep(cur.sleepFrom);
      }
      if(cur.dim) moon.classList.add('dim');

      if(cur.final){
        const tf = setTimeout(()=> replay.classList.add('ready'), 2600);
        timers.push(tf);
        return;
      }

      const t2 = setTimeout(()=>{ idx++; step(); }, cur.hold);
      timers.push(t2);
    }, 1900); // wait out the fade-out
    timers.push(t1);
  }

  function start(){
    reset();
    const t0 = setTimeout(step, 2600); // let the crew settle in first
    timers.push(t0);
  }

  replay.addEventListener('click', (e)=>{ e.preventDefault(); start(); });

  start();
</script>
</body>
</html>
