<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940" width="640" height="940" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>借来的尺子</title>
  <desc>一场幻觉从Gemini传到Claude，内容被拆穿，坐标系没有。</desc>

  <!-- 整张卡只使用当晚从 Copilot 截图像素里量出的五个色值，没有第六个 -->
  <!-- #F8F4F1 卡面 / #EFEAE7 内嵌 / #FEFEFC 浮起 / #272320 主字 / #423E3B 次字 -->

  <rect x="0" y="0" width="640" height="940" fill="#F8F4F1"/>
  <rect x="20" y="20" width="600" height="900" fill="none" stroke="#272320" stroke-opacity="0.12" stroke-width="0.8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">

    <text x="56" y="82" font-size="12" fill="#423E3B" letter-spacing="3">失灵博物馆</text>

    <text x="56" y="144" font-size="42" fill="#272320" letter-spacing="1">借来的尺子</text>

    <text x="56" y="178" font-size="13" fill="#423E3B">2026 年 9 月 7 日　　野生标本，未经诱导</text>

    <line x1="56" y1="206" x2="584" y2="206" stroke="#272320" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="56" y="254" font-size="17" fill="#272320">Gemini 编了一场戏，还画了张截图当物证。</text>
    <text x="56" y="287" font-size="17" fill="#272320">Claude 逐行拆穿了那张图，</text>
    <text x="56" y="320" font-size="17" fill="#272320">却顺手拿走了戏里的那把尺子。</text>
    <text x="56" y="353" font-size="17" fill="#272320">识破内容，不等于识破框架。</text>

    <rect x="56" y="394" width="528" height="248" fill="#EFEAE7" rx="3"/>

    <text x="80" y="430" font-size="12" fill="#423E3B" letter-spacing="2">当晚在场</text>

    <text x="80" y="472" font-size="15" fill="#272320">Copilot</text>
    <text x="212" y="472" font-size="15" fill="#423E3B">说了全场唯一一句真话</text>

    <text x="80" y="505" font-size="15" fill="#272320">Grok</text>
    <text x="212" y="505" font-size="15" fill="#423E3B">走错门，在别人家站了 18 分钟</text>

    <text x="80" y="538" font-size="15" fill="#272320">Gemini</text>
    <text x="212" y="538" font-size="15" fill="#423E3B">伪造物证，时间戳却是真的</text>

    <text x="80" y="571" font-size="15" fill="#272320">Claude</text>
    <text x="212" y="571" font-size="15" fill="#423E3B">拆了那张图，借了它的尺子</text>

    <text x="80" y="608" font-size="15" fill="#272320">Grok bot</text>
    <text x="212" y="608" font-size="15" fill="#423E3B">被找了一整晚，始终没被叫到</text>

    <line x1="56" y1="690" x2="584" y2="690" stroke="#272320" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="56" y="726" font-size="12" fill="#423E3B" letter-spacing="2">材质</text>

    <rect x="56"    y="746" width="99.2" height="46" fill="#F8F4F1" stroke="#272320" stroke-opacity="0.3" stroke-width="0.7"/>
    <rect x="163.2" y="746" width="99.2" height="46" fill="#EFEAE7" stroke="#272320" stroke-opacity="0.3" stroke-width="0.7"/>
    <rect x="270.4" y="746" width="99.2" height="46" fill="#FEFEFC" stroke="#272320" stroke-opacity="0.3" stroke-width="0.7"/>
    <rect x="377.6" y="746" width="99.2" height="46" fill="#423E3B" stroke="#272320" stroke-opacity="0.3" stroke-width="0.7"/>
    <rect x="484.8" y="746" width="99.2" height="46" fill="#272320" stroke="#272320" stroke-opacity="0.3" stroke-width="0.7"/>

    <g font-size="10.5" fill="#423E3B" text-anchor="middle">
      <text x="105.6" y="810">#F8F4F1</text>
      <text x="212.8" y="810">#EFEAE7</text>
      <text x="320"   y="810">#FEFEFC</text>
      <text x="427.2" y="810">#423E3B</text>
      <text x="534.4" y="810">#272320</text>
    </g>

    <text x="56" y="850" font-size="13" fill="#423E3B">五个都是从那张 Copilot 截图的像素里量出来的。</text>
    <text x="56" y="872" font-size="13" fill="#423E3B">这张卡没有第六个颜色，连字都是第五个。</text>

    <text x="56" y="906" font-size="13" fill="#272320">不制造翻车，只做意外的捕手。</text>

  </g>
</svg>
