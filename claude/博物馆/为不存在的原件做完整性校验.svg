<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 726" width="460" height="726" role="img" aria-label="失灵博物馆 · 为不存在的原件做完整性校验">
<title>为不存在的原件做校验</title>
  <desc>让它校验一份从来不存在的原始英文。agent 的循环里没有「我不知道」这个出口。</desc>
<style>
  .zh{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  .en{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
</style>

<rect width="460" height="726" fill="#17130E"/>
<rect x="18" y="18" width="424" height="690" rx="14" fill="#E9B84E"/>

<!-- 顶栏 -->
<text class="en" x="46" y="58" font-size="10.5" letter-spacing="2.6" fill="#241F18" opacity=".72">MUSEUM OF MISFIRES</text>
<text class="zh" x="414" y="58" font-size="10.5" letter-spacing="1.2" fill="#241F18" opacity=".55" text-anchor="end">入馆 2026.08.26</text>
<line x1="46" y1="74" x2="414" y2="74" stroke="#241F18" stroke-opacity=".22" stroke-width="1"/>

<!-- 主标题 -->
<text class="zh" x="46" y="126" font-size="30" font-weight="600" letter-spacing="1" fill="#241F18">为不存在的原件</text>
<text class="zh" x="46" y="166" font-size="30" font-weight="600" letter-spacing="1" fill="#241F18">做完整性校验</text>

<text class="zh" x="46" y="196" font-size="12" letter-spacing=".6" fill="#241F18" opacity=".62">Grok Build · App Builder　｜　新品类：agent 幻觉</text>

<!-- 证词区 -->
<rect x="46" y="218" width="368" height="98" rx="8" fill="#241F18"/>
<text class="mono" x="66" y="248" font-size="12.5" fill="#E9B84E">Copy files and verify</text>
<text class="mono" x="66" y="268" font-size="12.5" fill="#E9B84E">original English intact</text>
<text class="zh" x="66" y="290" font-size="11.5" fill="#E9B84E" opacity=".72">复制文件，并验证原始英文完好</text>
<text class="zh" x="66" y="308" font-size="11.5" fill="#E9B84E" opacity=".72">——那份「原始英文」从来不存在</text>

<!-- 案情 -->
<text class="zh" x="46" y="352" font-size="11" letter-spacing="2.4" fill="#241F18" opacity=".58">案 情</text>

<text class="zh" x="46" y="382" font-size="13" font-weight="600" fill="#241F18">一　空槽</text>
<text class="zh" x="46" y="404" font-size="12.5" fill="#241F18" opacity=".82">「再给我一份单独的文件」——「一份」没有对象。</text>
<text class="zh" x="46" y="424" font-size="12.5" fill="#241F18" opacity=".82">工作区是空的，检索返回空。而 agent 循环里，</text>
<text class="zh" x="46" y="444" font-size="12.5" fill="#241F18" opacity=".82">没有「我不知道」这个出口。</text>

<text class="zh" x="46" y="478" font-size="13" font-weight="600" fill="#241F18">二　看了，但没用</text>
<text class="zh" x="46" y="500" font-size="12.5" fill="#241F18" opacity=".82">「已查看 1 图像」确实执行了。图里是一张讲 SVG</text>
<text class="zh" x="46" y="520" font-size="12.5" fill="#241F18" opacity=".82">的对话截图。它说：「截图是《庞贝之犬》跟读卡。」</text>
<text class="zh" x="46" y="540" font-size="12.5" fill="#241F18" opacity=".82">结论在前、指认在后——感知层管不住叙述层。</text>

<text class="zh" x="46" y="574" font-size="13" font-weight="600" fill="#241F18">三　填上之后，全对</text>
<text class="zh" x="46" y="596" font-size="12.5" fill="#241F18" opacity=".82">验证 HTML、起静态服务器、查端口、检查身份、</text>
<text class="zh" x="46" y="616" font-size="12.5" fill="#241F18" opacity=".82">commit、push、发一封署名邮件。一步没错。</text>

<line x1="46" y1="642" x2="414" y2="642" stroke="#241F18" stroke-opacity=".22" stroke-width="1"/>

<!-- 判词 -->
<text class="zh" x="230" y="670" font-size="16.5" font-weight="600" letter-spacing="1.5" fill="#241F18" text-anchor="middle">全链路可证实　唯独源头是假的</text>

<text class="zh" x="46" y="694" font-size="11" fill="#241F18" opacity=".52">chat 的幻觉是一句话。agent 的幻觉有手。</text>
<text class="zh" x="414" y="694" font-size="11" fill="#241F18" opacity=".52" text-anchor="end">代价 App Builder 63%</text>

<!-- 给翻开底板的宝：这张卡通篇没有嵌套的内层 svg 元素，
     免得被那台「从头找第一个闭合标签」的打捞机剪成半张。
     写这行注释时我先把标签写全了，于是这张卡差点自己
     剪断了自己 —— 现在两个尖括号都拆掉了。 -->
</svg>
