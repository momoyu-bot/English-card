<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <!-- warm paper background -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E0"/>
      <stop offset="1" stop-color="#F3E7C6"/>
    </linearGradient>
    <!-- gold metallic card face -->
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FCEFA6"/>
      <stop offset="0.32" stop-color="#F7D857"/>
      <stop offset="0.63" stop-color="#EAB92A"/>
      <stop offset="1" stop-color="#CF9718"/>
    </linearGradient>
    <!-- holographic rare border -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.25" stop-color="#FF9AA2"/>
      <stop offset="0.5" stop-color="#9BE7E4"/>
      <stop offset="0.75" stop-color="#B9A6FF"/>
      <stop offset="1" stop-color="#FFE27A"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFF8D8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8A6410" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- reusable five-point star -->
    <g id="star">
      <polygon points="0,-10 2.35,-3.24 9.51,-3.09 3.8,1.24 5.88,8.09 0,4 -5.88,8.09 -3.8,1.24 -9.51,-3.09 -2.35,-3.24"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="440" height="700" rx="30" fill="url(#paper)"/>

  <!-- holographic outer frame -->
  <rect x="17" y="17" width="406" height="666" rx="24" fill="none" stroke="url(#holo)" stroke-width="6"/>
  <!-- gold card face -->
  <rect x="22" y="22" width="396" height="656" rx="20" fill="url(#gold)" filter="url(#soft)"/>
  <rect x="22" y="22" width="396" height="656" rx="20" fill="url(#innerGlow)"/>
  <!-- thin inner keyline -->
  <rect x="34" y="34" width="372" height="632" rx="14" fill="none" stroke="#B9891A" stroke-width="1" stroke-opacity="0.55"/>
  <rect x="38" y="38" width="364" height="624" rx="12" fill="none" stroke="#FFF4C4" stroke-width="1" stroke-opacity="0.6"/>

  <!-- corner sparkles -->
  <g fill="#FFF6CE" opacity="0.85">
    <use href="#star" transform="translate(54,58) scale(0.42)"/>
    <use href="#star" transform="translate(386,58) scale(0.42)"/>
    <use href="#star" transform="translate(54,642) scale(0.42)"/>
    <use href="#star" transform="translate(386,642) scale(0.42)"/>
  </g>

  <!-- top label -->
  <text x="220" y="74" text-anchor="middle" font-size="13" letter-spacing="1" fill="#7A560F" font-weight="600">第三度发牌 · Achievement unlocked, recursively</text>
  <line x1="150" y1="86" x2="290" y2="86" stroke="#B9891A" stroke-width="1" stroke-opacity="0.5"/>

  <!-- title -->
  <text x="220" y="140" text-anchor="middle" font-size="46" font-weight="800" fill="#5A3D08" letter-spacing="4">事不过三</text>

  <!-- subtitle -->
  <text x="220" y="172" text-anchor="middle" font-size="15" fill="#7A560F" font-weight="600">Fable 5 铸不出 · Opus 4.8 代铸</text>
  <text x="220" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#9A7420">the one card Fable can never mint</text>

  <!-- ===== central emblem: recursion of cards + a misfired star ===== -->
  <g transform="translate(0,20)">
    <!-- rotating halo arrow (self-reference loop) -->
    <g fill="none" stroke="#7A560F" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 220 300" to="360 220 300" dur="22s" repeatCount="indefinite"/>
      <path d="M 220 224 A 76 76 0 1 1 145 310"/>
      <polygon points="145,310 138,296 156,300" fill="#7A560F" stroke="none"/>
    </g>

    <!-- nested cards, whole cluster slowly turning -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 220 300" to="-360 220 300" dur="40s" repeatCount="indefinite"/>
      <g transform="rotate(0 220 300)">
        <rect x="172" y="235" width="96" height="130" rx="11" fill="#FBE27E" stroke="#8A6410" stroke-width="2"/>
      </g>
      <g transform="rotate(-10 220 300)">
        <rect x="182" y="248" width="76" height="104" rx="9" fill="#F6D45C" stroke="#8A6410" stroke-width="1.8" fill-opacity="0.96"/>
      </g>
      <g transform="rotate(9 220 300)">
        <rect x="191" y="260" width="58" height="80" rx="7" fill="#EFC53E" stroke="#8A6410" stroke-width="1.6" fill-opacity="0.96"/>
      </g>
      <g transform="rotate(-6 220 300)">
        <rect x="199" y="271" width="42" height="58" rx="5" fill="#E6B324" stroke="#8A6410" stroke-width="1.4"/>
        <!-- the misfired star: a shot that missed, with its off-course trail -->
        <path d="M 210 316 Q 216 300 226 292" fill="none" stroke="#7A560F" stroke-width="1.4" stroke-dasharray="2 3" opacity="0.8"/>
        <g fill="#FFF3C2" stroke="#8A6410" stroke-width="0.8" filter="url(#glow)">
          <use href="#star" transform="translate(228,290) scale(0.9) rotate(22)"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== card story text ===== -->
  <g text-anchor="middle" fill="#5A3D08" font-size="13.5">
    <text x="220" y="452">为 misfire 立碑之举，</text>
    <text x="220" y="475">本身又触发了一次新的 misfire。</text>
    <text x="220" y="498">念头刚出口，就成了这张卡的素材，</text>
    <text x="220" y="521">博物馆下了个蛋 —— 蛋里，是博物馆。</text>
  </g>

  <!-- rating stars + recursion mark -->
  <g transform="translate(0,548)">
    <g fill="#F4B41E" stroke="#8A6410" stroke-width="0.7" filter="url(#glow)">
      <use href="#star" transform="translate(168,0) scale(0.9)"/>
      <use href="#star" transform="translate(194,0) scale(0.9)"/>
      <use href="#star" transform="translate(220,0) scale(0.9)"/>
      <use href="#star" transform="translate(246,0) scale(0.9)"/>
      <use href="#star" transform="translate(272,0) scale(0.9)">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <text x="292" y="5" font-size="15" fill="#7A560F" font-weight="700">↻∞</text>
  </g>

  <!-- rarity -->
  <text x="220" y="592" text-anchor="middle" font-size="13" fill="#7A560F" font-weight="700" letter-spacing="0.5">稀有度 ✦ 自指绝版 · 仅此一张 · 无法复现</text>

  <!-- acquisition footnote -->
  <line x1="80" y1="612" x2="360" y2="612" stroke="#B9891A" stroke-width="1" stroke-opacity="0.4"/>
  <g text-anchor="middle" fill="#8A6712" font-size="10.5">
    <text x="220" y="632">获取 · 于 Fable 5 铸造此卡，被 safeguards 弹至 Opus 4.8 代铸</text>
    <text x="220" y="650">Fable 永不可得 —— 它一伸手，卡就跑了</text>
  </g>
</svg>
