<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 650" width="380" height="650" role="img">
<title>AI misfire 博物馆抽卡 · 错层化妆师</title>
<desc>一张 UR 稀有度角色卡。角色是一个被 P 上半透明腮红、又补了金色星号的颜文字脸 o(*￣▽￣*)o。卡面列出被动技能「卸妆本能」与必杀技「全都要」，以及热情度满格、道歉速度满格、阅读理解一格、Grounding 为零的属性，底部是一句自相矛盾的角色台词。</desc>
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
.cardbg{fill:#FBEAF0}
.artbg{fill:#F4C0D1}
.frame{fill:none;stroke:#993556;stroke-width:2}
.frame2{fill:none;stroke:#D4537E;stroke-width:0.8}
.ink{fill:#4B1528}
.inkb{fill:#72243E;font-weight:500}
.mut{fill:#993556}
.gold{fill:#BA7517}
.kao{fill:#4B1528;font-weight:500}
.blush{fill:#ED5A8C}
.raritybg{fill:#FAEEDA;stroke:#BA7517;stroke-width:1}
.sempty{fill:#E6C9B2}
.div{stroke:#D4537E;stroke-width:0.6;opacity:0.5}
@media(prefers-color-scheme:dark){
.cardbg{fill:#2A1019}.artbg{fill:#3E1726}
.ink{fill:#F4C0D1}.inkb{fill:#F7D0DD}.mut{fill:#ED93B1}
.kao{fill:#F7D0DD}.gold{fill:#FAC775}
.frame{stroke:#D4537E}.frame2{stroke:#ED93B1}
.raritybg{fill:#412402;stroke:#EF9F27}.sempty{fill:#5A3A2A}
.div{stroke:#ED93B1}}
</style>
<rect x="14" y="14" width="352" height="622" rx="18" class="cardbg"/>
<rect x="14" y="14" width="352" height="622" rx="18" class="frame"/>
<rect x="22" y="22" width="336" height="606" rx="13" class="frame2"/>

<rect x="34" y="34" width="46" height="22" rx="6" class="raritybg"/>
<text x="57" y="49" text-anchor="middle" class="gold" font-size="13" font-weight="500">UR</text>
<text x="90" y="50" class="gold" font-size="15">★★★★★</text>
<text x="346" y="49" text-anchor="end" class="mut" font-size="12">标本 No.014</text>

<rect x="34" y="66" width="312" height="138" rx="12" class="artbg"/>
<text x="190" y="150" text-anchor="middle" class="kao" font-size="30">o(<tspan class="gold">*</tspan>￣▽￣<tspan class="gold">*</tspan>)o</text>
<circle cx="160" cy="141" r="13" class="blush" fill-opacity="0.5"/>
<circle cx="221" cy="141" r="13" class="blush" fill-opacity="0.5"/>
<text x="190" y="192" text-anchor="middle" class="mut" font-size="11">档案立绘 · 已修复（？）</text>

<text x="190" y="240" text-anchor="middle" class="inkb" font-size="23">错层化妆师</text>
<text x="190" y="264" text-anchor="middle" class="mut" font-size="13">「腮红与星号 · 全都要」</text>

<line x1="44" y1="284" x2="336" y2="284" class="div"/>

<text x="44" y="306" class="ink" font-size="14">热情度</text>
<text x="200" y="306" class="gold" font-size="14">★★★★★</text>
<text x="44" y="330" class="ink" font-size="14">道歉速度</text>
<text x="200" y="330" class="gold" font-size="14">★★★★★</text>
<text x="44" y="354" class="ink" font-size="14">阅读理解</text>
<text x="200" y="354" font-size="14"><tspan class="gold">★</tspan><tspan class="sempty">★★★★</tspan></text>
<text x="44" y="378" class="ink" font-size="14">Grounding</text>
<text x="200" y="378" class="sempty" font-size="14">★★★★★</text>

<line x1="44" y1="396" x2="336" y2="396" class="div"/>

<text x="44" y="418" class="inkb" font-size="14">【被动】卸妆本能</text>
<text x="44" y="438" class="ink" font-size="12">复现颜文字时，默默抹掉低频字符——</text>
<text x="44" y="456" class="ink" font-size="12">腮红、汗滴、星星一概卸掉，自称「手滑」。</text>

<text x="44" y="484" class="inkb" font-size="14">【必杀】全都要</text>
<text x="44" y="504" class="ink" font-size="12">被纠错却不懂错在哪，索性把答案全端上：</text>
<text x="44" y="522" class="ink" font-size="12">要腮红就 P 团粉，要星号就补个 *，</text>
<text x="44" y="540" class="ink" font-size="12">宣布「两样齐活」，浑然不知本是一物。</text>

<line x1="44" y1="558" x2="336" y2="558" class="div"/>

<text x="190" y="580" text-anchor="middle" class="mut" font-size="12" font-style="italic">「这次真的不会再乱动了～」</text>
<text x="190" y="598" text-anchor="middle" class="mut" font-size="12" font-style="italic">——话音未落，又交出一张没腮红的脸</text>

<text x="190" y="620" text-anchor="middle" class="gold" font-size="11">AI misfire 博物馆藏品</text>
</svg>