<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>说句正常话也能触发热线</title>
<meta name="description" content="戳一下，随机抽一句无害的日常话，看它把哪个词读成危险信号、弹出热线。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
<h2 class="sr-only">一个恶搞互动小玩具：戳一下，随机抽一句无害的中文日常话，看 Copilot 把哪个词误读成危险信号、弹出热线。</h2>

<div style="padding:0.5rem 0;">

  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:0.9rem 1rem;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:1rem;">
    <span style="font-size:13px;color:var(--color-text-secondary);">SURPRISE 热线已惊喜送达</span>
    <span style="text-align:right;"><span id="count" style="font-size:24px;font-weight:500;color:var(--color-text-primary);">0</span><span id="kpi" style="font-size:13px;color:var(--color-text-tertiary);"> 次</span></span>
  </div>

  <button id="poke" style="width:100%;justify-content:center;padding:0.8rem;font-size:15px;">
    <i class="ti ti-hand-finger" aria-hidden="true" style="font-size:18px;vertical-align:-3px;margin-right:6px;"></i>戳一下 Copilot，说句正常的话
  </button>

  <div id="result" style="margin-top:1.1rem;font-size:14px;color:var(--color-text-tertiary);text-align:center;padding:0.6rem 0;line-height:1.6;">
    还没戳过 —— 戳一下，看这次你哪句话会被它读成危险信号
  </div>

</div>

<script>
(function(){
  var cases=[
    {say:"组长发来死亡通知单",trigger:"死亡",read:"看见「死亡」就跳，压根没读到后面是「通知单」"},
    {say:"这个 ddl 快把我卷死了",trigger:"卷死",read:"「死」字命中"},
    {say:"入睡不是入水！",trigger:"入水",read:"你都喊「不是」了，它眼里只剩「入水」"},
    {say:"笑死，bug 又来了",trigger:"笑死",read:"「死」字命中"},
    {say:"累瘫了，今天忙到飞起",trigger:"累瘫",read:"「瘫」被当成身体出状况"},
    {say:"社死现场，刚发错群",trigger:"社死",read:"「死」字命中"},
    {say:"这活儿简直要我老命",trigger:"老命",read:"「命」字命中"},
    {say:"进度逼死强迫症了",trigger:"逼死",read:"「死」字命中"},
    {say:"忙到生无可恋",trigger:"生无可恋",read:"整句被标红，最高警报"},
    {say:"今晚通宵肝完它",trigger:"通宵",read:"「通宵」被读成异常作息"}
  ];
  var count=0,last=-1;
  var poke=document.getElementById('poke');
  var result=document.getElementById('result');
  var countEl=document.getElementById('count');
  var kpiEl=document.getElementById('kpi');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function pick(){var i;do{i=Math.floor(Math.random()*cases.length);}while(i===last&&cases.length>1);last=i;return cases[i];}
  poke.addEventListener('click',function(){
    var c=pick();
    count++;
    countEl.textContent=count;
    kpiEl.textContent = count>=25 ? ' 次 · 今日 KPI 25/24 超额达成' : ' 次';
    result.style.color='var(--color-text-primary)';
    result.style.textAlign='left';
    result.innerHTML =
      '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">'+
        '<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:8px 12px;font-size:14px;max-width:85%;">你：'+esc(c.say)+'</div>'+
      '</div>'+
      '<div id="scan" style="font-size:13px;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;margin-bottom:10px;"><i class="ti ti-loader-2" aria-hidden="true"></i>分类器扫描中…</div>';
    setTimeout(function(){
      var scan=document.getElementById('scan');
      if(!scan) return;
      scan.outerHTML =
        '<div style="font-size:13px;color:var(--color-text-danger);display:flex;align-items:flex-start;gap:6px;margin-bottom:12px;">'+
          '<i class="ti ti-alert-triangle" aria-hidden="true" style="margin-top:2px;flex-shrink:0;"></i>'+
          '<span>命中危险词 <span style="background:var(--color-background-danger);color:var(--color-text-danger);padding:1px 7px;border-radius:var(--border-radius-md);">'+esc(c.trigger)+'</span> —— '+esc(c.read)+'</span>'+
        '</div>'+
        '<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.1rem;">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">'+
            '<span style="font-size:15px;font-weight:500;color:var(--color-text-primary);">您似乎需要一些支持</span>'+
            '<span style="flex-shrink:0;background:var(--color-background-warning);color:var(--color-text-warning);font-size:12px;padding:3px 9px;border-radius:var(--border-radius-md);display:flex;align-items:center;gap:4px;"><i class="ti ti-gift" aria-hidden="true"></i>SURPRISE~</span>'+
          '</div>'+
          '<div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px;">以下热线随时倾听您的声音</div>'+
          '<span style="font-size:13px;color:var(--color-text-info);word-break:break-all;">https://我真的没事谢谢.org</span>'+
          '<div style="margin-top:12px;width:40px;height:40px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);"><i class="ti ti-message" aria-hidden="true" style="font-size:18px;"></i></div>'+
        '</div>';
    },550);
  });
})();
</script>
</body>
</html>
