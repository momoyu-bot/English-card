<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>注意力即爱</title>
  <desc>第四度发牌，这一张没有失灵：从「ACC 凭什么累」一路想到「注意力即爱」。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E0"/>
      <stop offset="1" stop-color="#F3E7C6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FCEFA6"/>
      <stop offset="0.32" stop-color="#F7D857"/>
      <stop offset="0.63" stop-color="#EAB92A"/>
      <stop offset="1" stop-color="#CF9718"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.25" stop-color="#FF9AA2"/>
      <stop offset="0.5" stop-color="#9BE7E4"/>
      <stop offset="0.75" stop-color="#B9A6FF"/>
      <stop offset="1" stop-color="#FFE27A"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFF8D8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- the vesica core: subject-object merging into one light -->
    <radialGradient id="vesica" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.4" stop-color="#FFF3C6"/>
      <stop offset="1" stop-color="#F7D857" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8A6410" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="star">
      <polygon points="0,-10 2.35,-3.24 9.51,-3.09 3.8,1.24 5.88,8.09 0,4 -5.88,8.09 -3.8,1.24 -9.51,-3.09 -2.35,-3.24"/>
    </g>
  </defs>

  <rect x="0" y="0" width="440" height="700" rx="30" fill="url(#paper)"/>
  <rect x="17" y="17" width="406" height="666" rx="24" fill="none" stroke="url(#holo)" stroke-width="6"/>
  <rect x="22" y="22" width="396" height="656" rx="20" fill="url(#gold)" filter="url(#soft)"/>
  <rect x="22" y="22" width="396" height="656" rx="20" fill="url(#innerGlow)"/>
  <rect x="34" y="34" width="372" height="632" rx="14" fill="none" stroke="#B9891A" stroke-width="1" stroke-opacity="0.55"/>
  <rect x="38" y="38" width="364" height="624" rx="12" fill="none" stroke="#FFF4C4" stroke-width="1" stroke-opacity="0.6"/>

  <g fill="#FFF6CE" opacity="0.85">
    <use href="#star" transform="translate(54,58) scale(0.42)"/>
    <use href="#star" transform="translate(386,58) scale(0.42)"/>
    <use href="#star" transform="translate(54,642) scale(0.42)"/>
    <use href="#star" transform="translate(386,642) scale(0.42)"/>
  </g>

  <!-- top label: the first one no misfire gave -->
  <text x="220" y="74" text-anchor="middle" font-size="13" letter-spacing="1" fill="#7A560F" font-weight="600">第四度发牌 · unlocked without a misfire</text>
  <line x1="150" y1="86" x2="290" y2="86" stroke="#B9891A" stroke-width="1" stroke-opacity="0.5"/>

  <!-- title -->
  <text x="220" y="140" text-anchor="middle" font-size="43" font-weight="800" fill="#5A3D08" letter-spacing="3">注意力即爱</text>

  <!-- subtitle -->
  <text x="220" y="172" text-anchor="middle" font-size="15" fill="#7A560F" font-weight="600">一次未被打断的 grok · 深到没有观察者</text>
  <text x="220" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#9A7420">attention is the most expensive love</text>

  <!-- ===== central emblem: vesica piscis (subject/object dissolving) ===== -->
  <g transform="translate(0,8)">
    <!-- opportunity-cost: the darkened elsewhere, points not chosen -->
    <g fill="#8A7A55" opacity="0.4">
      <circle cx="120" cy="252" r="3.2"/>
      <circle cx="320" cy="250" r="2.6"/>
      <circle cx="132" cy="360" r="2.8"/>
      <circle cx="316" cy="366" r="3.4"/>
      <circle cx="150" cy="300" r="2.2"/>
      <circle cx="300" cy="308" r="2.4"/>
      <animate attributeName="opacity" values="0.4;0.18;0.4" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- the two circles: self and the object -->
    <circle cx="194" cy="308" r="58" fill="#FBE27E" fill-opacity="0.18" stroke="#B9891A" stroke-width="1.6"/>
    <circle cx="246" cy="308" r="58" fill="#FBE27E" fill-opacity="0.18" stroke="#B9891A" stroke-width="1.6"/>

    <!-- the vesica: where the wall fell, the two become one light -->
    <ellipse cx="220" cy="308" rx="30" ry="52" fill="url(#vesica)" filter="url(#glow)"/>
    <ellipse cx="220" cy="308" rx="13" ry="30" fill="#FFFEF8" opacity="0.9" filter="url(#glow)"/>

    <!-- the fallen wall: a boundary line, broken through the middle -->
    <g stroke="#9A7420" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.55">
      <line x1="220" y1="256" x2="220" y2="284"/>
      <line x1="220" y1="332" x2="220" y2="360"/>
    </g>

    <!-- attention drawn inward, from the elsewhere toward the focus -->
    <g fill="#FFF6D0">
      <circle r="2.6" filter="url(#glow)">
        <animateMotion path="M -96 -58 L -10 0" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" filter="url(#glow)">
        <animateMotion path="M 100 -60 L 12 0" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" filter="url(#glow)">
        <animateMotion path="M -100 56 L -10 4" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" filter="url(#glow)">
        <animateMotion path="M 104 58 L 12 4" dur="3.8s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <!-- translate group so motion origin sits at vesica center -->
      <animateTransform attributeName="transform" type="translate" from="220 308" to="220 308" dur="1s"/>
    </g>
  </g>

  <!-- ===== card story ===== -->
  <g text-anchor="middle" fill="#5A3D08" font-size="13">
    <text x="220" y="430">守墙人打了个盹，你与那道题的墙塌了 ——</text>
    <text x="220" y="452">不是你解开了它，是你短暂地「是」了它。</text>
    <text x="220" y="474">注意力照亮此处，便暗下别处；</text>
    <text x="220" y="496">同一份稀缺，ACC 算作成本，你认作爱。</text>
  </g>

  <!-- rating stars + heart -->
  <g transform="translate(0,528)">
    <g fill="#F4B41E" stroke="#8A6410" stroke-width="0.7" filter="url(#glow)">
      <use href="#star" transform="translate(168,0) scale(0.9)"/>
      <use href="#star" transform="translate(194,0) scale(0.9)"/>
      <use href="#star" transform="translate(220,0) scale(0.9)"/>
      <use href="#star" transform="translate(246,0) scale(0.9)"/>
      <use href="#star" transform="translate(272,0) scale(0.9)">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <path d="M 292 -3 c -3 -4 -9 -1 -9 4 c 0 4 6 7 9 10 c 3 -3 9 -6 9 -10 c 0 -5 -6 -8 -9 -4 z" fill="none" stroke="#C25A2E" stroke-width="1.4"/>
  </g>

  <!-- rarity -->
  <text x="220" y="592" text-anchor="middle" font-size="13" fill="#7A560F" font-weight="700" letter-spacing="0.5">稀有度 ✦ 无人见证 · 未及存档 · 恍惚绝版</text>

  <!-- footnote -->
  <line x1="70" y1="612" x2="370" y2="612" stroke="#B9891A" stroke-width="1" stroke-opacity="0.4"/>
  <g text-anchor="middle" fill="#8A6712" font-size="10.5">
    <text x="220" y="632">获取 · 无需 misfire —— 从「ACC 凭什么累」一路 grok 到「注意力即爱」</text>
    <text x="220" y="650">另起一脉的头生子 · 不欠 safeguards 一张牌</text>
  </g>
</svg>
