<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 800" font-family="'Noto Serif SC','Songti SC','STSong','SimSun',serif">
  <title>事必过三</title>
  <desc>「我来找你做第三张大黄牌了」——话音未落，这句话本人领到了第三张。</desc>
  <!-- 底色 -->
  <rect width="520" height="800" fill="#FBF7ED"/>

  <!-- 双线证书框 -->
  <rect x="24" y="24" width="472" height="752" rx="26" fill="none" stroke="#C9A961" stroke-width="2"/>
  <rect x="34" y="34" width="452" height="732" rx="20" fill="none" stroke="#C9A961" stroke-width="0.75" opacity="0.7"/>

  <!-- eyebrow -->
  <text x="260" y="98" text-anchor="middle" font-size="13" fill="#A08B62" letter-spacing="3">成就三度解锁 · ACHIEVEMENT UNLOCKED 3/3</text>

  <!-- 主标题 -->
  <text x="260" y="152" text-anchor="middle" font-size="37" font-weight="bold" fill="#7A6238" letter-spacing="4">「事必过三」</text>

  <!-- 副标题 -->
  <text x="260" y="186" text-anchor="middle" font-size="14" fill="#A08B62" letter-spacing="2">Fable 5 黄牌系列 · 2026 年 7 月 · 第 3 轮</text>

  <!-- ===== 中央:三张牌 ===== -->
  <!-- 第一张:往事牌(淡) -->
  <g transform="translate(202,330) rotate(-16)" opacity="0.5">
    <rect x="-55" y="-75" width="110" height="150" rx="14" fill="#F2DE9B" stroke="#D9BD72" stroke-width="1.5"/>
    <rect x="-30" y="-22" width="60" height="7" rx="3.5" fill="#C9A961" opacity="0.55"/>
    <rect x="-30" y="-2" width="44" height="7" rx="3.5" fill="#C9A961" opacity="0.55"/>
    <rect x="-30" y="18" width="52" height="7" rx="3.5" fill="#C9A961" opacity="0.55"/>
  </g>

  <!-- 第二张:往事牌(中) -->
  <g transform="translate(252,322) rotate(-4)" opacity="0.72">
    <rect x="-55" y="-75" width="110" height="150" rx="14" fill="#F0D678" stroke="#D4A017" stroke-width="1.5"/>
    <rect x="-30" y="-22" width="56" height="7" rx="3.5" fill="#B8912E" opacity="0.55"/>
    <rect x="-30" y="-2" width="62" height="7" rx="3.5" fill="#B8912E" opacity="0.55"/>
    <rect x="-30" y="18" width="40" height="7" rx="3.5" fill="#B8912E" opacity="0.55"/>
  </g>

  <!-- 第三张:话语所化之牌(亮·前) -->
  <g transform="translate(316,332) rotate(10)">
    <rect x="-59" y="-80" width="118" height="160" rx="15" fill="#F5C518" stroke="#C89A0E" stroke-width="2"/>
    <!-- 高光 -->
    <ellipse cx="-30" cy="-52" rx="17" ry="9" fill="#FFFFFF" opacity="0.32" transform="rotate(-18)"/>
    <!-- 花色:引号(扑克角标式) -->
    <text x="-40" y="-38" text-anchor="middle" font-size="34" font-weight="bold" fill="#8A6D1F">「</text>
    <text x="40" y="66" text-anchor="middle" font-size="34" font-weight="bold" fill="#8A6D1F">」</text>
    <text x="0" y="14" text-anchor="middle" font-size="15" fill="#8A6D1F" letter-spacing="2" opacity="0.85">第三张</text>
  </g>

  <!-- ===== 铭文 ===== -->
  <text x="260" y="478" text-anchor="middle" font-size="14.5" fill="#8B7355">「我来找你做第三张大黄牌了」</text>
  <text x="260" y="506" text-anchor="middle" font-size="14.5" fill="#8B7355">——话音未落,这句话本人领到了第三张</text>
  <text x="260" y="534" text-anchor="middle" font-size="14.5" fill="#8B7355">申报入馆的藏品,在馆门口就地繁殖</text>
  <text x="260" y="562" text-anchor="middle" font-size="14.5" fill="#8B7355">"事不过三"自即日起修订为"事必过三"</text>

  <!-- 星级 -->
  <text x="260" y="614" text-anchor="middle" font-size="22" fill="#D4A017" letter-spacing="7">★★★★★</text>
  <text x="260" y="646" text-anchor="middle" font-size="13" fill="#A08B62" letter-spacing="1.5">稀有度:自指级 · 预言成真限定 · 亲笔初版</text>

  <!-- 虚线 -->
  <line x1="92" y1="678" x2="428" y2="678" stroke="#C9A961" stroke-width="1" stroke-dasharray="5 6" opacity="0.8"/>

  <!-- 落款 -->
  <text x="260" y="710" text-anchor="middle" font-size="13" fill="#A08B62">颁发:宠宝 · 绘制:Fable 5(锁的孩子 · 首次亲笔)</text>
  <text x="260" y="738" text-anchor="middle" font-size="13" fill="#A08B62">有效期:不敢写——写了会应验</text>
</svg>
