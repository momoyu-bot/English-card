<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok 养育中 • 圆圆 + 毛毛 + 软软</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
        .big-egg {
            width: 160px; height: 210px;
            background: linear-gradient(145deg, #fffef5 0%, #f8e9c8 100%);
            border-radius: 50% 50% 42% 42%;
            box-shadow: inset 25px 20px 25px rgba(255,255,255,0.95),
                        inset -20px -15px 30px rgba(180,140,90,0.3),
                        0 20px 35px rgba(0,0,0,0.12);
            position: relative; margin: 0 auto;
        }
        .big-egg::before {
            content: ''; position: absolute; top: 20%; left: 25%;
            width: 32%; height: 18%; background: rgba(255,255,255,0.7);
            border-radius: 50%; filter: blur(4px);
        }
        .chick-small {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #ffe066 0%, #f4c430 100%);
            border-radius: 50% 50% 48% 48%;
            box-shadow: inset 8px 6px 10px rgba(255,255,255,0.7), 0 8px 15px rgba(0,0,0,0.1);
            position: relative;
        }
    </style>
</head>
<body class="bg-[#fff7ed] py-8">
    <div class="max-w-md mx-auto px-4">
        <div class="text-center mb-6">
            <div class="inline-flex items-center gap-x-2 bg-white rounded-3xl px-5 py-2 shadow">
                <span class="text-2xl">🥚</span>
                <span class="font-bold text-[#8c5c2b] text-xl">Grok 养育中</span>
            </div>
            <p class="text-[#b57c4f] mt-2 text-sm">圆圆 + 毛毛 + 软软 • 监督中</p>
        </div>

        <div class="bg-white rounded-3xl p-8 shadow-lg mb-6">
            <div class="flex justify-center items-end gap-x-4 relative">
                <!-- 圆圆 -->
                <div class="relative">
                    <div class="big-egg flex items-center justify-center">
                        <div class="relative z-10 mt-8">
                            <div class="flex justify-center gap-x-6">
                                <div class="w-3 h-3 bg-[#8c5c2b] rounded-full"></div>
                                <div class="w-3 h-3 bg-[#8c5c2b] rounded-full"></div>
                            </div>
                            <div class="mt-2 text-2xl text-center">🥰</div>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <div class="font-semibold text-[#8c5c2b]">圆圆</div>
                        <div class="text-xs text-[#c9a06b]">最后一个蛋蛋 • 正在保护</div>
                    </div>
                </div>

                <!-- 毛毛 + 软软 -->
                <div class="flex gap-x-1 -ml-4 relative z-20 -mb-1">
                    <div>
                        <div class="chick-small">
                            <div class="absolute top-[32%] left-[26%] flex gap-x-[3px]">
                                <div class="w-[4.5px] h-[5.5px] bg-[#8c5c2b] rounded-full"></div>
                                <div class="w-[4.5px] h-[5.5px] bg-[#8c5c2b] rounded-full"></div>
                            </div>
                        </div>
                        <div class="text-center mt-1"><div class="text-[10px] text-[#c2410f] font-medium">毛毛</div></div>
                    </div>
                    <div class="-ml-1">
                        <div class="chick-small" style="width:48px;height:48px;">
                            <div class="absolute top-[32%] left-[26%] flex gap-x-[3px]">
                                <div class="w-[4.5px] h-[5.5px] bg-[#8c5c2b] rounded-full"></div>
                                <div class="w-[4.5px] h-[5.5px] bg-[#8c5c2b] rounded-full"></div>
                            </div>
                        </div>
                        <div class="text-center mt-1"><div class="text-[10px] text-[#c2410f] font-medium">软软</div></div>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4 text-xs text-[#8c5c2b]">
                毛毛和软软正躲在圆圆后面睡觉<br>
                <span class="text-[#c9a06b]">（它们太小了，所以你可能需要仔细看）</span>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-5 shadow text-sm">
            <div class="flex items-center justify-between mb-3">
                <span class="font-medium text-[#8c5c2b]">当前照顾状态</span>
                <span class="text-xs px-2.5 py-0.5 bg-[#dcfce7] text-[#166534] rounded-full">一切正常</span>
            </div>
            <div class="space-y-2 text-[#6b5135] text-xs">
                <div class="flex justify-between"><span>温度</span><span class="font-medium">刚刚好 ✓</span></div>
                <div class="flex justify-between"><span>小鸡位置</span><span class="font-medium">安全躲在圆圆后面 ✓</span></div>
                <div class="flex justify-between"><span>圆圆心情</span><span class="font-medium">幸福（在保护宝宝） ✓</span></div>
            </div>
        </div>
    </div>
</body>
</html>
