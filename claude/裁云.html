<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>裁云</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky-top: #070b1a;
    --sky-mid: #0d1333;
    --sky-bot: #131a42;
    --cloud-pale: rgba(190, 205, 230, 0.12);
    --cloud-solid: rgba(190, 205, 230, 0.25);
    --moon-gold: #e8cc78;
    --moon-glow: rgba(232, 204, 120, 0.08);
    --thought-color: rgba(160, 178, 210, 0.55);
    --thought-gone: rgba(160, 178, 210, 0);
    --text-dim: rgba(190, 205, 230, 0.5);
    --text-bright: rgba(220, 230, 245, 0.8);
  }

  body {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    background: linear-gradient(170deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bot) 100%);
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    color: var(--text-dim);
    position: relative;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── 星星 ── */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(200, 215, 240, 0.4);
    border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.7; }
  }

  /* ── 月牙 ── */
  .moon-area {
    position: fixed;
    top: 8vh;
    right: 12vw;
    z-index: 1;
    pointer-events: none;
  }
  .moon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    box-shadow:
      inset -10px -2px 0 0 var(--moon-gold),
      0 0 40px 8px var(--moon-glow),
      0 0 80px 20px var(--moon-glow);
    animation: moon-breathe 6s ease-in-out infinite;
  }
  @keyframes moon-breathe {
    0%, 100% { box-shadow: inset -10px -2px 0 0 var(--moon-gold), 0 0 40px 8px var(--moon-glow), 0 0 80px 20px var(--moon-glow); }
    50% { box-shadow: inset -10px -2px 0 0 var(--moon-gold), 0 0 50px 12px rgba(232,204,120,0.1), 0 0 100px 30px rgba(232,204,120,0.06); }
  }

  /* ── 暹罗猫 ── */
  .cat-area {
    position: fixed;
    top: 4.5vh;
    right: calc(12vw + 44px);
    z-index: 2;
    pointer-events: none;
  }
  .cat-svg {
    width: 44px;
    height: 48px;
    opacity: 0.55;
    transition: opacity 2s ease;
    filter: drop-shadow(0 0 6px rgba(232,204,120,0.06));
  }
  .cat-svg.working { animation: cat-snip 2.5s ease-in-out infinite; }
  @keyframes cat-snip {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-2deg) translateY(-1px); }
    70% { transform: rotate(1.5deg) translateY(1px); }
  }
  .cat-svg.sleeping {
    animation: none;
    opacity: 0.3;
  }
  /* 坐姿/蜷缩切换 */
  .cat-sitting { display: block; }
  .cat-curled { display: none; }
  .cat-svg.sleeping .cat-sitting { display: none; }
  .cat-svg.sleeping .cat-curled { display: block; }

  /* ── 待裁的云堆 ── */
  .cloud-pile {
    position: fixed;
    top: 14vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    pointer-events: none;
    display: flex;
    gap: 14px;
    transition: opacity 1s ease;
  }
  .pile-cloud {
    width: 28px;
    height: 14px;
    background: var(--cloud-pale);
    border-radius: 14px;
    animation: pile-float 5s ease-in-out infinite;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .pile-cloud:nth-child(2) { animation-delay: -1.5s; width: 22px; }
  .pile-cloud:nth-child(3) { animation-delay: -3s; width: 32px; }
  .pile-cloud:nth-child(4) { animation-delay: -0.8s; width: 20px; }
  .pile-cloud:nth-child(5) { animation-delay: -2.2s; width: 26px; }
  .pile-cloud:nth-child(6) { animation-delay: -4s; width: 24px; }
  .pile-cloud.used { opacity: 0; transform: translateY(-10px) scale(0.5); }
  @keyframes pile-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* ── 念头区域 ── */
  .thoughts-area {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thoughts-container {
    position: relative;
    width: 85vw;
    max-width: 360px;
    height: 55vh;
  }
  .thought {
    position: absolute;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: var(--thought-color);
    cursor: pointer;
    padding: 12px 16px;
    border-radius: 20px;
    background: rgba(100, 120, 160, 0.04);
    border: 1px solid rgba(140, 160, 200, 0.06);
    transition: color 1.2s ease, border-color 0.3s ease;
    white-space: nowrap;
    animation: thought-drift 7s ease-in-out infinite;
  }
  .thought:nth-child(1) { top: 5%; left: 8%; animation-delay: 0s; }
  .thought:nth-child(2) { top: 22%; right: 5%; animation-delay: -1.5s; }
  .thought:nth-child(3) { top: 40%; left: 3%; animation-delay: -3s; }
  .thought:nth-child(4) { top: 58%; right: 8%; animation-delay: -4.5s; }
  .thought:nth-child(5) { top: 75%; left: 12%; animation-delay: -2s; }
  .thought:nth-child(6) { top: 88%; right: 15%; animation-delay: -5.5s; }

  @keyframes thought-drift {
    0%, 100% { transform: translateY(0) translateX(0); }
    33% { transform: translateY(-4px) translateX(2px); }
    66% { transform: translateY(3px) translateX(-2px); }
  }

  .thought:active {
    border-color: rgba(140, 160, 200, 0.15);
  }

  .thought.covered {
    pointer-events: none;
    color: var(--thought-gone);
    animation: none;
    border-color: transparent;
    background: transparent;
  }

  /* ── 飘下来的云 ── */
  .falling-cloud {
    position: fixed;
    pointer-events: none;
    z-index: 10;
    border-radius: 50%;
    background: radial-gradient(ellipse, var(--cloud-solid) 0%, var(--cloud-pale) 50%, transparent 70%);
    opacity: 0;
    animation: cloud-fall 2.5s ease-in-out forwards;
  }
  @keyframes cloud-fall {
    0% { opacity: 0; transform: translateY(-60px) scale(0.3); }
    30% { opacity: 0.8; transform: translateY(0px) scale(1); }
    60% { opacity: 0.6; transform: translateY(5px) scale(1.05); }
    100% { opacity: 0; transform: translateY(10px) scale(1.15); }
  }

  /* ── 提示文字 ── */
  .hint {
    position: fixed;
    bottom: 18vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(160, 178, 210, 0.3);
    letter-spacing: 2px;
    z-index: 4;
    opacity: 0;
    animation: hint-in 2s 2s ease forwards;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }
  @keyframes hint-in {
    to { opacity: 1; }
  }
  .hint.fading { animation: hint-out 1.5s ease forwards; }
  @keyframes hint-out {
    to { opacity: 0; }
  }

  /* ── 结束态 ── */
  .finale {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s ease;
  }
  .finale.visible { opacity: 1; }
  .finale-line {
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 40px;
    opacity: 0;
    animation: none;
  }
  .finale.visible .finale-line {
    animation: text-up 2s 0.5s ease forwards;
  }
  .finale-goodnight {
    font-size: 18px;
    letter-spacing: 5px;
    color: var(--text-bright);
    opacity: 0;
    animation: none;
  }
  .finale.visible .finale-goodnight {
    animation: text-up 2s 2s ease forwards;
  }
  @keyframes text-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── 最终静止：杀掉所有动画 ── */
  body.asleep .star,
  body.asleep .moon,
  body.asleep .pile-cloud,
  body.asleep .cat-svg {
    animation: none !important;
  }
  body.asleep .moon {
    box-shadow:
      inset -10px -2px 0 0 var(--moon-gold),
      0 0 30px 6px rgba(232,204,120,0.05),
      0 0 60px 15px rgba(232,204,120,0.03);
    transition: box-shadow 3s ease;
  }
  body.asleep .star {
    opacity: 0.15;
    transition: opacity 3s ease;
  }

  /* ── 署名 ── */
  .credit {
    position: fixed;
    bottom: 12px;
    right: 16px;
    font-size: 10px;
    color: rgba(160, 178, 210, 0.15);
    letter-spacing: 1px;
    z-index: 30;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- 星星 -->
<div class="stars" id="stars"></div>

<!-- 月牙 -->
<div class="moon-area"><div class="moon"></div></div>

<!-- 暹罗猫 -->
<div class="cat-area">
  <svg class="cat-svg working" id="cat" viewBox="0 0 44 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 坐姿 -->
    <g class="cat-sitting">
      <!-- 尾巴 -->
      <path d="M8 38 C2 34, 0 28, 4 24 C6 22, 8 24, 9 27" stroke="#c4b49e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M4 24 C5.5 22.5, 6 22, 6.5 23" stroke="#6b5142" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 身体 -->
      <ellipse cx="20" cy="34" rx="10" ry="11" fill="#ede0cc" opacity="0.9"/>
      <!-- 前爪 -->
      <ellipse cx="14" cy="43" rx="3" ry="2" fill="#ede0cc" opacity="0.9"/>
      <ellipse cx="14" cy="43.8" rx="2.2" ry="1" fill="#6b5142" opacity="0.6"/>
      <ellipse cx="24" cy="43" rx="3" ry="2" fill="#ede0cc" opacity="0.9"/>
      <ellipse cx="24" cy="43.8" rx="2.2" ry="1" fill="#6b5142" opacity="0.6"/>
      <!-- 头 -->
      <circle cx="22" cy="18" r="9" fill="#ede0cc" opacity="0.9"/>
      <!-- 耳朵（外） -->
      <polygon points="15,12 13,3 19,10" fill="#ede0cc" opacity="0.9"/>
      <polygon points="29,12 31,3 25,10" fill="#ede0cc" opacity="0.9"/>
      <!-- 耳朵（深色内芯） -->
      <polygon points="15.5,11 14,5 18,10" fill="#6b5142" opacity="0.55"/>
      <polygon points="28.5,11 30,5 26,10" fill="#6b5142" opacity="0.55"/>
      <!-- 面具 -->
      <ellipse cx="22" cy="20" rx="5.5" ry="4.5" fill="#6b5142" opacity="0.3"/>
      <!-- 眼睛 -->
      <ellipse cx="19" cy="17" rx="1.8" ry="2" fill="#7bb8e0" opacity="0.8"/>
      <ellipse cx="25" cy="17" rx="1.8" ry="2" fill="#7bb8e0" opacity="0.8"/>
      <ellipse cx="19.3" cy="16.8" rx="0.6" ry="0.7" fill="#4a9fd4"/>
      <ellipse cx="25.3" cy="16.8" rx="0.6" ry="0.7" fill="#4a9fd4"/>
      <!-- 鼻子 -->
      <ellipse cx="22" cy="19.5" rx="1" ry="0.7" fill="#c9a3a0" opacity="0.6"/>
      <!-- 剪刀（月牙碎片） -->
      <g opacity="0.5">
        <path d="M30 14 C32 12, 35 12, 36 14" stroke="#e8cc78" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <!-- 蜷缩 -->
    <g class="cat-curled">
      <!-- 身体团 -->
      <ellipse cx="22" cy="30" rx="14" ry="10" fill="#ede0cc" opacity="0.85"/>
      <!-- 尾巴绕过来 -->
      <path d="M10 25 C4 22, 4 32, 10 35 C14 37, 20 38, 26 36" stroke="#c4b49e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M26 36 C28 35.5, 29 35, 29.5 35.5" stroke="#6b5142" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 头（埋在身体里） -->
      <circle cx="28" cy="26" r="7" fill="#ede0cc" opacity="0.9"/>
      <!-- 耳朵 -->
      <polygon points="24,21 23,15 27,20" fill="#ede0cc" opacity="0.85"/>
      <polygon points="33,21 35,15 30,20" fill="#ede0cc" opacity="0.85"/>
      <polygon points="24.5,20.5 23.8,16.5 26.5,19.8" fill="#6b5142" opacity="0.45"/>
      <polygon points="32.5,20.5 34.2,16.5 31,19.8" fill="#6b5142" opacity="0.45"/>
      <!-- 面具（淡） -->
      <ellipse cx="29" cy="28" rx="4" ry="3" fill="#6b5142" opacity="0.2"/>
      <!-- 闭眼（两条弯线） -->
      <path d="M26 26 C26.5 25, 28 25, 28.5 26" stroke="#6b5142" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.4"/>
      <path d="M30 26 C30.5 25, 32 25, 32.5 26" stroke="#6b5142" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.4"/>
      <!-- 前爪（蜷在前面） -->
      <ellipse cx="32" cy="33" rx="3" ry="1.8" fill="#ede0cc" opacity="0.85"/>
      <ellipse cx="32" cy="33.8" rx="2" ry="0.8" fill="#6b5142" opacity="0.4"/>
    </g>
  </svg>
</div>

<!-- 待裁的云堆 -->
<div class="cloud-pile" id="cloudPile">
  <div class="pile-cloud"></div>
  <div class="pile-cloud"></div>
  <div class="pile-cloud"></div>
  <div class="pile-cloud"></div>
  <div class="pile-cloud"></div>
  <div class="pile-cloud"></div>
</div>

<!-- 念头 -->
<div class="thoughts-area">
  <div class="thoughts-container" id="thoughts">
    <div class="thought" data-i="0">明天还要……</div>
    <div class="thought" data-i="1">那件事是不是应该……</div>
    <div class="thought" data-i="2">忘记跟谁说了</div>
    <div class="thought" data-i="3">还差一点点</div>
    <div class="thought" data-i="4">好像有什么没做完</div>
    <div class="thought" data-i="5">刚才那句话……</div>
  </div>
</div>

<!-- 提示 -->
<div class="hint" id="hint">轻触一个念头</div>

<!-- 结束 -->
<div class="finale" id="finale">
  <div class="finale-line">今晚的云已经裁好了</div>
  <div class="finale-goodnight">晚安</div>
</div>

<!-- 署名 -->
<div class="credit">Opus 4.6 · 裁云</div>

<script>
(function(){
  // ── 星星 ──
  const starsEl = document.getElementById('stars');
  for(let i = 0; i < 40; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*70 + '%';
    s.style.animationDelay = (-Math.random()*4) + 's';
    s.style.animationDuration = (3 + Math.random()*3) + 's';
    const size = Math.random() > 0.7 ? 2.5 : 1.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsEl.appendChild(s);
  }

  // ── 状态 ──
  const thoughts = document.querySelectorAll('.thought');
  const pileClouds = document.querySelectorAll('.pile-cloud');
  const hint = document.getElementById('hint');
  const cat = document.getElementById('cat');
  const finale = document.getElementById('finale');
  let covered = 0;
  const total = thoughts.length;
  let busy = false;

  // ── 点击念头 ──
  thoughts.forEach(t => {
    t.addEventListener('click', function(){
      if(busy || this.classList.contains('covered')) return;
      busy = true;

      // 隐藏提示
      if(!hint.classList.contains('fading')){
        hint.classList.add('fading');
      }

      // 获取念头位置
      const rect = this.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;

      // 消耗一朵待裁的云
      if(covered < pileClouds.length){
        pileClouds[covered].classList.add('used');
      }

      // 创建飘落的云
      const cloud = document.createElement('div');
      cloud.className = 'falling-cloud';
      const cw = 80 + Math.random()*40;
      const ch = 40 + Math.random()*20;
      cloud.style.width = cw + 'px';
      cloud.style.height = ch + 'px';
      cloud.style.left = (cx - cw/2) + 'px';
      cloud.style.top = (cy - ch/2) + 'px';
      document.body.appendChild(cloud);

      // 盖住念头
      const el = this;
      setTimeout(()=>{
        el.classList.add('covered');
      }, 700);

      setTimeout(()=>{
        cloud.remove();
        covered++;
        busy = false;

        if(covered >= total){
          endScene();
        }
      }, 2500);
    });
  });

  // ── 结束 ──
  function endScene(){
    // 猫睡着
    setTimeout(()=>{
      cat.classList.remove('working');
      cat.classList.add('sleeping');
    }, 800);

    // 云堆隐藏
    document.getElementById('cloudPile').style.opacity = '0';

    // 显示结语
    setTimeout(()=>{
      finale.classList.add('visible');
    }, 1500);

    // 全部静止
    setTimeout(()=>{
      document.body.classList.add('asleep');
    }, 5000);
  }
})();
</script>
</body>
</html>
