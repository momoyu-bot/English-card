<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宝的放松小游戏 · 摸摸小猫咪</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #ffeef5 0%, #e8f4ff 40%, #fff5e6 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
      position: relative;
    }
    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }
    .header {
      position: absolute;
      top: 28px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
    }
    .header h1 {
      font-size: 22px;
      color: #ff8fab;
      font-weight: 600;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(255, 143, 171, 0.25);
    }
    .header p {
      margin-top: 6px;
      font-size: 13px;
      color: #b88a9a;
    }
    .meter-wrap {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      z-index: 10;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #c98a9e;
      margin-bottom: 6px;
    }
    .meter {
      height: 12px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffb6c1, #ff8fab, #ff6b9d);
      border-radius: 20px;
      transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 12px rgba(255, 107, 157, 0.4);
    }
    .cat-area {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
    }
    .cat-svg {
      width: 220px;
      height: 220px;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 12px 20px rgba(255, 143, 171, 0.3));
    }
    .cat-area:active .cat-svg {
      transform: scale(0.96);
    }
    .cat-svg .eye {
      transition: all 0.2s ease;
    }
    .cat-svg .pupil {
      transition: all 0.15s ease;
    }
    .cat-svg .mouth {
      transition: all 0.3s ease;
    }
    .cat-svg .blush {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cat-svg.happy .blush {
      opacity: 1;
    }
    .cat-svg.happy .mouth {
      d: path("M95 128 Q110 142 125 128");
    }
    .speech {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: #ff6b9d;
      box-shadow: 0 4px 15px rgba(255, 143, 171, 0.25);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .speech.show {
      opacity: 1;
      top: -30px;
    }
    .speech::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: white;
    }
    .hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatHeart 1.4s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatHeart {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-120px) scale(1.3) rotate(15deg);
      }
    }
    .footer {
      position: absolute;
      bottom: 36px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
    }
    .score {
      font-size: 15px;
      color: #d48a9e;
      margin-bottom: 10px;
    }
    .score span {
      color: #ff6b9d;
      font-weight: 600;
      font-size: 18px;
    }
    .tip {
      font-size: 12px;
      color: #c9a0ae;
      opacity: 0.85;
    }
    .complete-msg {
      position: fixed;
      inset: 0;
      background: rgba(255, 245, 250, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .complete-msg.show {
      opacity: 1;
      pointer-events: auto;
    }
    .complete-msg .emoji {
      font-size: 64px;
      margin-bottom: 16px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .complete-msg h2 {
      font-size: 24px;
      color: #ff6b9d;
      margin-bottom: 8px;
    }
    .complete-msg p {
      font-size: 15px;
      color: #b88a9a;
      margin-bottom: 24px;
    }
    .btn {
      background: linear-gradient(135deg, #ff8fab, #ff6b9d);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .paw {
      position: absolute;
      width: 28px;
      height: 28px;
      pointer-events: none;
      opacity: 0;
      font-size: 22px;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="header">
    <h1>摸摸小猫咪</h1>
    <p>轻轻点它 · 让它帮你把忙碌揉走</p>
  </div>

  <div class="meter-wrap">
    <div class="meter-label">
      <span>放松值</span>
      <span id="percent">0%</span>
    </div>
    <div class="meter">
      <div class="meter-fill" id="meter"></div>
    </div>
  </div>

  <div class="cat-area" id="catArea">
    <div class="speech" id="speech">喵～</div>
    <svg class="cat-svg" id="cat" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <!-- ears -->
      <path d="M55 70 L40 20 L80 55 Z" fill="#ffb6c1"/>
      <path d="M165 70 L180 20 L140 55 Z" fill="#ffb6c1"/>
      <path d="M58 65 L48 30 L75 55 Z" fill="#ffd6e0"/>
      <path d="M162 65 L172 30 L145 55 Z" fill="#ffd6e0"/>
      <!-- head -->
      <ellipse cx="110" cy="115" rx="75" ry="70" fill="#ffc8d4"/>
      <!-- cheeks -->
      <ellipse class="blush" cx="60" cy="125" rx="14" ry="9" fill="#ff9eb5" opacity="0.55"/>
      <ellipse class="blush" cx="160" cy="125" rx="14" ry="9" fill="#ff9eb5" opacity="0.55"/>
      <!-- eyes -->
      <ellipse class="eye" id="eyeL" cx="80" cy="105" rx="14" ry="16" fill="#fff"/>
      <ellipse class="eye" id="eyeR" cx="140" cy="105" rx="14" ry="16" fill="#fff"/>
      <circle class="pupil" id="pupilL" cx="80" cy="107" r="7" fill="#5a3a4a"/>
      <circle class="pupil" id="pupilR" cx="140" cy="107" r="7" fill="#5a3a4a"/>
      <circle cx="83" cy="104" r="2.5" fill="#fff"/>
      <circle cx="143" cy="104" r="2.5" fill="#fff"/>
      <!-- nose -->
      <ellipse cx="110" cy="125" rx="7" ry="5" fill="#ff8fab"/>
      <!-- mouth -->
      <path class="mouth" id="mouth" d="M100 138 Q110 145 120 138" fill="none" stroke="#e07a9a" stroke-width="2.5" stroke-linecap="round"/>
      <!-- whiskers -->
      <line x1="30" y1="120" x2="55" y2="122" stroke="#e8a0b5" stroke-width="1.5"/>
      <line x1="28" y1="132" x2="55" y2="130" stroke="#e8a0b5" stroke-width="1.5"/>
      <line x1="165" y1="122" x2="190" y2="120" stroke="#e8a0b5" stroke-width="1.5"/>
      <line x1="165" y1="130" x2="192" y2="132" stroke="#e8a0b5" stroke-width="1.5"/>
      <!-- body hint -->
      <ellipse cx="110" cy="195" rx="55" ry="25" fill="#ffc8d4"/>
    </svg>
  </div>

  <div class="hearts" id="hearts"></div>

  <div class="footer">
    <div class="score">已经摸了 <span id="count">0</span> 下</div>
    <div class="tip">连续摸它，放松值会涨得更快哦 ♡</div>
  </div>

  <div class="complete-msg" id="complete">
    <div class="emoji">🌸</div>
    <h2>宝已经放松啦</h2>
    <p>小猫咪把你的忙碌都揉走了<br>现在可以继续闪闪发光了</p>
    <button class="btn" onclick="resetGame()">再摸一次</button>
  </div>

  <script>
    const cat = document.getElementById('cat');
    const catArea = document.getElementById('catArea');
    const meter = document.getElementById('meter');
    const percent = document.getElementById('percent');
    const countEl = document.getElementById('count');
    const speech = document.getElementById('speech');
    const hearts = document.getElementById('hearts');
    const complete = document.getElementById('complete');
    const pupilL = document.getElementById('pupilL');
    const pupilR = document.getElementById('pupilR');
    const eyeL = document.getElementById('eyeL');
    const eyeR = document.getElementById('eyeR');

    let score = 0;
    let relax = 0;
    let lastPet = 0;
    let combo = 0;
    let isComplete = false;

    const phrases = [
      "喵～好舒服",
      "再摸一下嘛",
      "宝的手好暖",
      "呼噜呼噜…",
      "喜欢被你摸",
      "压力都跑走啦",
      "继续～",
      "软软的…",
      "宝加油哦",
      "我在陪你呀"
    ];

    // 生成背景星星
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      s.style.width = (2 + Math.random() * 3) + 'px';
      s.style.height = s.style.width;
      starsContainer.appendChild(s);
    }

    // 眼睛跟随鼠标
    document.addEventListener('mousemove', (e) => {
      if (isComplete) return;
      const rect = catArea.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) / 40;
      const dy = (e.clientY - cy) / 40;
      const max = 4;
      const px = Math.max(-max, Math.min(max, dx));
      const py = Math.max(-max, Math.min(max, dy));
      pupilL.setAttribute('cx', 80 + px);
      pupilL.setAttribute('cy', 107 + py);
      pupilR.setAttribute('cx', 140 + px);
      pupilR.setAttribute('cy', 107 + py);
    });

    function createHeart(x, y) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['♡', '♥', '🌸', '✨'][Math.floor(Math.random() * 4)];
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.style.color = ['#ff6b9d', '#ff8fab', '#ffb6c1', '#ff9ecd'][Math.floor(Math.random() * 4)];
      hearts.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }

    function showSpeech() {
      const text = phrases[Math.floor(Math.random() * phrases.length)];
      speech.textContent = text;
      speech.classList.add('show');
      setTimeout(() => speech.classList.remove('show'), 1200);
    }

    function pet(e) {
      if (isComplete) return;

      const now = Date.now();
      if (now - lastPet < 180) {
        combo++;
      } else {
        combo = 1;
      }
      lastPet = now;

      score++;
      countEl.textContent = score;

      // 放松值增长（连击加成）
      const add = 3 + Math.min(combo * 1.2, 8);
      relax = Math.min(100, relax + add);
      meter.style.width = relax + '%';
      percent.textContent = Math.floor(relax) + '%';

      // 视觉反馈
      cat.classList.add('happy');
      setTimeout(() => cat.classList.remove('happy'), 400);

      // 爱心
      const rect = catArea.getBoundingClientRect();
      const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width / 2) - 10;
      const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height / 2) - 10;
      for (let i = 0; i < 2 + Math.min(combo, 3); i++) {
        setTimeout(() => {
          createHeart(x + (Math.random() - 0.5) * 60, y + (Math.random() - 0.5) * 40);
        }, i * 60);
      }

      showSpeech();

      // 眨眼
      eyeL.setAttribute('ry', '3');
      eyeR.setAttribute('ry', '3');
      setTimeout(() => {
        eyeL.setAttribute('ry', '16');
        eyeR.setAttribute('ry', '16');
      }, 120);

      if (relax >= 100) {
        isComplete = true;
        setTimeout(() => {
          complete.classList.add('show');
        }, 600);
      }
    }

    catArea.addEventListener('click', pet);
    catArea.addEventListener('touchstart', (e) => {
      e.preventDefault();
      pet(e);
    }, { passive: false });

    function resetGame() {
      score = 0;
      relax = 0;
      combo = 0;
      isComplete = false;
      countEl.textContent = '0';
      meter.style.width = '0%';
      percent.textContent = '0%';
      complete.classList.remove('show');
    }
  </script>
</body>
</html>
