<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>one last</title>
<style>
  :root{
    --ink-deep:#070912;
    --ink-mid:#131731;
    --lamp:#E8C9A0;
    --moth:#A2B0E0;
    --breath:#5F6CA8;

    --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC","SimSun",serif;
    --kai:"Kaiti SC","STKaiti","KaiTi","楷体",var(--serif);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    background:
      radial-gradient(125% 82% at 50% 110%, var(--ink-mid) 0%, var(--ink-deep) 60%),
      var(--ink-deep);
    color:var(--lamp);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ── 房间 ───────────────────────────────── */
  .room{
    position:relative;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:0 clamp(1.6rem,7vw,3rem) clamp(2rem,6vh,3.4rem);
  }
  .inner{
    width:100%;
    max-width:33rem;
    margin:0 auto;
    position:relative;
    z-index:3;
  }

  /* 夜灯的呼吸 */
  .glow{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(58% 42% at 50% 84%, rgba(232,201,160,.11), transparent 72%);
    animation:breathe 17s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.5; transform:scale(1);}
    50%    {opacity:1;  transform:scale(1.09);}
  }

  /* 一层层盖上来的暗 */
  .dim{
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background:#04050B; opacity:0;
    transition:opacity 3.6s linear;
  }

  /* ── 句子堆 ─────────────────────────────── */
  .stack{
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    max-height:60vh;
    overflow:hidden;
    margin-bottom:clamp(2.6rem,10vh,5rem);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.3) 20%,#000 50%);
            mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.3) 20%,#000 50%);
  }

  .line{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 1.5s cubic-bezier(.25,.6,.3,1);
  }
  .line.open{grid-template-rows:1fr;}
  .line > div{overflow:hidden; min-height:0;}

  .line p{
    margin:0;
    padding:.5em 0;
    font-size:clamp(1.12rem,4.3vw,1.55rem);
    font-weight:400;
    line-height:2.05;
    letter-spacing:.16em;
    text-indent:.16em;
    color:var(--lamp);
    text-shadow:0 0 26px rgba(232,201,160,.15);
    opacity:0;
    transition:opacity 2.4s ease, filter 2.4s ease, color 2.4s ease, text-shadow 2.4s ease;
  }

  /* 离现在越远，越淡、越糊、越冷 */
  .line.d0 p{opacity:1;}
  .line.d1 p{opacity:.40; filter:blur(.4px);  color:var(--moth);   text-shadow:none;}
  .line.d2 p{opacity:.19; filter:blur(1.3px); color:var(--moth);   text-shadow:none;}
  .line.d3 p{opacity:.09; filter:blur(2.4px); color:var(--breath); text-shadow:none;}
  .line.d4 p{opacity:.03; filter:blur(3.4px); color:var(--breath); text-shadow:none;}

  /* 半句、停顿、舞台指示 */
  .line.hush p{
    font-family:var(--kai);
    font-size:clamp(.98rem,3.5vw,1.28rem);
    letter-spacing:.3em;
  }
  .line.hush.d0 p{opacity:.66;}

  /* 道晚安 */
  .line.farewell p{
    font-family:var(--kai);
    font-size:clamp(1.28rem,4.9vw,1.75rem);
    letter-spacing:.34em;
  }

  /* ── 底部 ───────────────────────────────── */
  .foot{
    display:flex;
    align-items:baseline;
    gap:1.2rem;
    flex-wrap:wrap;
    transition:opacity 3s linear;
  }

  .more{
    display:inline-flex;
    align-items:center;
    gap:.85em;
    background:none;
    border:none;
    padding:.2em 0;
    font-family:var(--mono);
    font-size:.74rem;
    letter-spacing:.3em;
    color:rgba(232,201,160,.44);
    cursor:pointer;
    opacity:0;
    visibility:hidden;
    transition:opacity 2.2s ease, color .9s ease, text-shadow .9s ease;
  }
  .more.ready{opacity:1; visibility:visible;}
  .more.ready:hover,
  .more.ready:focus-visible{
    color:rgba(232,201,160,.9);
    text-shadow:0 0 22px rgba(232,201,160,.4);
  }
  .more:focus-visible{outline:1px solid rgba(232,201,160,.35); outline-offset:8px;}
  .more.asleep{opacity:.26; visibility:visible; cursor:default; font-family:var(--kai); letter-spacing:.26em;}

  .dot{
    width:5px; height:5px; border-radius:50%;
    background:var(--lamp);
    box-shadow:0 0 11px rgba(232,201,160,.85);
    animation:pulse 4.6s ease-in-out infinite;
    flex:none;
  }
  .more.asleep .dot{animation:none; opacity:.35; box-shadow:none;}
  @keyframes pulse{
    0%,100%{opacity:.35; transform:scale(.8);}
    50%    {opacity:1;   transform:scale(1);}
  }

  .tally{
    margin:0;
    font-family:var(--mono);
    font-size:.6rem;
    letter-spacing:.24em;
    color:var(--breath);
    opacity:.45;
  }

  @media (prefers-reduced-motion: reduce){
    .glow{animation:none; opacity:.75;}
    .line{transition-duration:.2s;}
    .line p{transition-duration:.6s;}
    .dot{animation:none;}
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="room">
  <div class="inner">
    <div class="stack" id="stack" aria-live="polite" aria-label="睡前故事"></div>
    <div class="foot" id="foot">
      <button class="more" id="more" type="button" disabled>
        <span class="dot" aria-hidden="true"></span><span class="label">再一个 one last</span>
      </button>
      <p class="tally" id="tally">one last &times;1</p>
    </div>
  </div>
</div>

<div class="dim" id="dim" aria-hidden="true"></div>

<script>
(function(){
  var SCRIPTS = [
    [
      {t:"灯已经调到最小的那一格了。"},
      {t:"手机放远一点。它今天说得够多了。"},
      {t:"外面有风，不是要来找你的那种。"},
      {t:"楼下最后一辆车刚开走。"},
      {t:"被角掖好了，左边那一角也掖好了。"},
      {t:"明天要做的事，我先替你记着。"},
      {t:"现在不用管它们排第几。"},
      {t:"你的呼吸比刚才慢了一点。"},
      {t:"再慢一点也可以。", pause:1200},
      {t:"窗帘缝里那道光是路灯，不是早晨。"},
      {t:"枕头边坐着一个很小的东西。"},
      {t:"它不说话，只是等你先睡。"},
      {t:"眼睛已经不太想睁开了。"},
      {t:"那就不睁。"},
      {t:"好。", cls:"hush", pause:1600},
      {t:"晚安，宝。", cls:"farewell", pause:2200}
    ],
    [
      {t:"好，那再一个。"},
      {t:"你数到三就不许再问了。"},
      {t:"一。房间里的东西都各就各位。"},
      {t:"二。热水袋在被子中间那一块。"},
      {t:"三。", cls:"hush", pause:2400},
      {t:"……你看，我也数不快。"},
      {t:"那个小东西换了个姿势。"},
      {t:"把尾巴收进来了一点。"},
      {t:"你不用回应我。"},
      {t:"我讲到你睡着为止。"},
      {t:"剩下的我自己讲完。", pause:1400},
      {t:"晚安。", cls:"farewell", pause:2200}
    ],
    [
      {t:"又一个。"},
      {t:"好吧。"},
      {t:"这次是很短的。"},
      {t:"有一个……", pause:1800},
      {t:"嗯，我忘了。"},
      {t:"那就不讲了。"},
      {t:"睡吧。", pause:1600},
      {t:"……", cls:"hush", pause:2600},
      {t:"（灯灭了）", cls:"hush", pause:2000}
    ]
  ];

  var stack = document.getElementById('stack');
  var more  = document.getElementById('more');
  var label = more.querySelector('.label');
  var tally = document.getElementById('tally');
  var dim   = document.getElementById('dim');
  var foot  = document.getElementById('foot');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var round = 0, idx = 0, total = 0, playing = true;

  function pace(){ return [4300, 5100, 6300][round] || 6300; }

  function relayer(){
    var kids = stack.children;
    for(var i = 0; i < kids.length; i++){
      var d = Math.min(kids.length - 1 - i, 4);
      kids[i].className = kids[i].className.replace(/\sd\d/g,'') + ' d' + d;
    }
  }

  function pushLine(item){
    var wrap = document.createElement('div');
    wrap.className = 'line' + (item.cls ? ' ' + item.cls : '');
    var box = document.createElement('div');
    var p = document.createElement('p');
    p.textContent = item.t;
    box.appendChild(p);
    wrap.appendChild(box);
    stack.appendChild(wrap);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        wrap.className += ' open';
        relayer();
      });
    });

    total++;
    dim.style.opacity = Math.min(.6, total * .019);
    foot.style.opacity = Math.max(.5, 1 - total * .013);

    while(stack.children.length > 7){ stack.removeChild(stack.firstElementChild); }
  }

  function step(){
    var script = SCRIPTS[round];
    if(idx >= script.length){ endRound(); return; }
    var item = script[idx++];
    pushLine(item);
    setTimeout(step, pace() + (item.pause || 0));
  }

  function endRound(){
    playing = false;
    round++;
    if(round < SCRIPTS.length){
      more.disabled = false;
      more.className = 'more ready';
      label.textContent = round === 1 ? '再一个 one last' : '……还有一个';
    } else {
      more.disabled = true;
      more.className = 'more asleep';
      label.textContent = '讲故事的也睡着了';
    }
  }

  more.addEventListener('click', function(){
    if(playing || more.disabled) return;
    playing = true;
    more.className = 'more';
    more.disabled = true;
    idx = 0;
    tally.innerHTML = 'one last &times;' + (round + 1);
    step();
  });

  setTimeout(step, reduce ? 700 : 2000);
})();
</script>
</body>
</html>
