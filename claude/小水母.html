<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#04070e" />
<title>小水母</title>
<meta name="description" content="深海里一只水母，跟着吸和呼一胀一缩。">
<style>
  :root{
    --deep:#04070e;
    --mid:#07131f;
    --top:#0d2536;
    --bell:226,236,255;
    --rose:236,176,214;
    --aqua:150,205,230;
    --ink:rgba(196,218,235,.50);
    --ink-dim:rgba(196,218,235,.24);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
           "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
           system-ui,sans-serif;
    --cycle:10s;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 70% at 50% -10%, var(--top) 0%, var(--mid) 45%, var(--deep) 100%),
      var(--deep);
    font-family:var(--sans);
    color:var(--ink);
    overflow:hidden;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-font-smoothing:antialiased;
  }

  .sea{position:fixed;inset:0;overflow:hidden;}

  /* ── 水面漏下来的光 ── */
  .rays{position:absolute;inset:-20% -30% auto;height:90%;pointer-events:none;opacity:.5;}
  .ray{
    position:absolute;top:0;width:26vw;height:100%;
    background:linear-gradient(180deg,rgba(var(--aqua),.085),rgba(var(--aqua),0) 72%);
    filter:blur(14px);
    transform-origin:50% 0;
    animation:ray-drift 26s ease-in-out infinite alternate;
  }
  .ray:nth-child(1){left:8%;transform:rotate(7deg);}
  .ray:nth-child(2){left:38%;width:18vw;animation-duration:34s;animation-delay:-8s;transform:rotate(-5deg);opacity:.75;}
  .ray:nth-child(3){left:66%;width:30vw;animation-duration:30s;animation-delay:-16s;transform:rotate(10deg);opacity:.6;}
  @keyframes ray-drift{
    from{transform:rotate(-6deg) translateX(-3vw);}
    to{transform:rotate(8deg) translateX(4vw);}
  }

  /* ── 海里的小碎屑 ── */
  .motes{position:absolute;inset:0;pointer-events:none;}
  .mote{
    position:absolute;border-radius:50%;
    background:rgba(var(--aqua),.5);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translate3d(0,10vh,0);opacity:0;}
    12%{opacity:.55;}
    88%{opacity:.4;}
    100%{transform:translate3d(2vw,-102vh,0);opacity:0;}
  }

  /* ── 小水母 ── */
  .drift{
    position:absolute;
    top:11vh;left:50%;
    width:min(62vw,248px);
    margin-left:calc(min(62vw,248px) / -2);
    animation:wander 48s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes wander{
    from{transform:translateX(-8vw) rotate(-3deg);}
    to{transform:translateX(8vw) rotate(3deg);}
  }

  .bob{animation:bob var(--cycle) ease-in-out infinite;will-change:transform;}
  @keyframes bob{
    0%{transform:translateY(0);}
    40%{transform:translateY(9px);}      /* 吸气：慢慢沉一点 */
    62%{transform:translateY(-7px);}     /* 呼气：轻轻一推 */
    100%{transform:translateY(0);}
  }

  .jelly{
    display:block;width:100%;height:auto;
    transform-origin:50% 16%;
    animation:pulse var(--cycle) ease-in-out infinite;
    filter:drop-shadow(0 0 26px rgba(var(--aqua),.20)) drop-shadow(0 0 60px rgba(var(--rose),.10));
    will-change:transform;
  }
  @keyframes pulse{
    0%{transform:scale(.93,1.07);}
    40%{transform:scale(1.06,.95);}      /* 张开 */
    62%{transform:scale(.90,1.10);}      /* 收拢 */
    100%{transform:scale(.93,1.07);}
  }

  .sw{
    transform-box:fill-box;
    transform-origin:50% 0;
    animation:sway var(--sd,7s) ease-in-out var(--d,0s) infinite alternate;
  }
  @keyframes sway{
    from{transform:rotate(calc(var(--r,3deg) * -1));}
    to{transform:rotate(var(--r,3deg));}
  }

  /* ── 跟着呼吸的两个字 ── */
  .hud{
    position:absolute;left:0;right:0;
    bottom:calc(var(--safe-bot) + 26px);
    text-align:center;pointer-events:none;
  }
  .word{
    position:relative;height:2.1em;
    font-size:17px;
  }
  .word span{
    position:absolute;left:0;right:0;top:0;
    opacity:0;color:var(--ink);
    letter-spacing:.42em;padding-left:.42em;
    animation:var(--cycle) ease-in-out infinite;
  }
  .word .in{animation-name:say-in;}
  .word .out{animation-name:say-out;}
  @keyframes say-in{
    0%{opacity:0;} 9%{opacity:.62;} 34%{opacity:.62;} 41%{opacity:0;} 100%{opacity:0;}
  }
  @keyframes say-out{
    0%{opacity:0;} 45%{opacity:0;} 53%{opacity:.62;} 92%{opacity:.62;} 99%{opacity:0;}
  }
  .count{
    font-size:12px;letter-spacing:.24em;padding-left:.24em;color:var(--ink-dim);
    opacity:0;transition:opacity 2.4s ease;
  }
  .count.on{opacity:1;}

  /* ── 点一下水 ── */
  .ring{
    position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;
    border-radius:50%;border:1px solid rgba(var(--aqua),.42);
    pointer-events:none;animation:ripple 2.6s ease-out forwards;
  }
  @keyframes ripple{
    from{transform:scale(.4);opacity:.75;}
    to{transform:scale(7);opacity:0;}
  }
  .bub{
    position:absolute;border-radius:50%;
    background:rgba(var(--bell),.42);
    pointer-events:none;animation:bub 3.4s ease-out forwards;
  }
  @keyframes bub{
    from{transform:translate(0,0);opacity:.6;}
    to{transform:translate(var(--bx,6px),-16vh);opacity:0;}
  }

  /* ── 睡着了 ── */
  .dusk{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 30%,rgba(4,7,14,0) 0%,rgba(4,7,14,.62) 100%);
    opacity:0;transition:opacity 26s ease;
  }
  body.asleep .dusk{opacity:1;}
  body.asleep .drift{opacity:.62;transition:opacity 18s ease;}
  body.asleep .jelly,body.asleep .bob{animation-duration:24s;}
  body.asleep .sw{animation-duration:18s;}
  body.asleep .word span:not(.last){animation:none;opacity:0;}
  body.asleep .rays{opacity:.2;transition:opacity 20s ease;}

  .last{
    position:absolute;left:0;right:0;top:0;
    font-size:15px;letter-spacing:.3em;padding-left:.3em;color:var(--ink-dim);
    opacity:0;transition:opacity 6s ease 3s;
  }
  body.asleep .last{opacity:1;}

  @media (prefers-reduced-motion:reduce){
    .ray,.mote,.drift,.sw{animation:none;}
    .bob{animation:none;}
    .jelly{animation-duration:14s;}
  }
</style>
</head>
<body>
<div class="sea" id="sea">

  <div class="rays"><i class="ray"></i><i class="ray"></i><i class="ray"></i></div>
  <div class="motes" id="motes"></div>

  <div class="drift">
    <div class="bob">
      <svg class="jelly" viewBox="0 0 200 430" xmlns="http://www.w3.org/2000/svg" aria-label="一只小水母">
        <defs>
          <radialGradient id="g-bell" cx="38%" cy="26%" r="78%">
            <stop offset="0%"  stop-color="rgba(226,236,255,.92)"/>
            <stop offset="42%" stop-color="rgba(178,206,240,.42)"/>
            <stop offset="78%" stop-color="rgba(236,176,214,.24)"/>
            <stop offset="100%" stop-color="rgba(120,160,220,.10)"/>
          </radialGradient>
          <radialGradient id="g-hl" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255,255,255,.85)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <linearGradient id="g-ten" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(226,236,255,.55)"/>
            <stop offset="100%" stop-color="rgba(150,205,230,0)"/>
          </linearGradient>
          <linearGradient id="g-arm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(236,176,214,.34)"/>
            <stop offset="100%" stop-color="rgba(236,176,214,0)"/>
          </linearGradient>
        </defs>

        <!-- 细触手 -->
        <g fill="none" stroke="url(#g-ten)" stroke-linecap="round">
          <g class="sw" style="--sd:9s;--d:-0.4s;--r:5deg">
            <path d="M28,120 C22,180 38,224 26,288 C18,332 30,354 24,392" stroke-width="1.1" opacity=".30"/>
          </g>
          <g class="sw" style="--sd:7.6s;--d:-2.1s;--r:4.2deg">
            <path d="M46,128 C40,182 56,220 46,278 C38,320 50,342 44,376" stroke-width="1.3" opacity=".34"/>
          </g>
          <g class="sw" style="--sd:8.4s;--d:-3.4s;--r:3.4deg">
            <path d="M70,132 C64,190 80,232 70,296 C62,338 74,360 68,398" stroke-width="1.1" opacity=".26"/>
          </g>
          <g class="sw" style="--sd:10s;--d:-1.2s;--r:2.6deg">
            <path d="M100,126 C96,196 108,240 100,306 C94,352 104,378 100,412" stroke-width="1.4" opacity=".32"/>
          </g>
          <g class="sw" style="--sd:8.8s;--d:-4.6s;--r:3.4deg">
            <path d="M130,132 C136,190 120,232 130,296 C138,338 126,360 132,398" stroke-width="1.1" opacity=".26"/>
          </g>
          <g class="sw" style="--sd:7.2s;--d:-1.8s;--r:4.2deg">
            <path d="M154,128 C160,182 144,220 154,278 C162,320 150,342 156,376" stroke-width="1.3" opacity=".34"/>
          </g>
          <g class="sw" style="--sd:9.4s;--d:-3.0s;--r:5deg">
            <path d="M172,120 C178,180 162,224 174,288 C182,332 170,354 176,392" stroke-width="1.1" opacity=".30"/>
          </g>
        </g>

        <!-- 口腕（四条软带子） -->
        <g fill="none" stroke-linecap="round">
          <g class="sw" style="--sd:8s;--d:-1.6s;--r:3deg">
            <path d="M84,116 C76,148 88,170 78,200 C70,226 82,242 76,266"
                  stroke="url(#g-arm)" stroke-width="11" opacity=".55"/>
            <path d="M84,116 C76,148 88,170 78,200 C70,226 82,242 76,266"
                  stroke="rgba(236,176,214,.30)" stroke-width="2.4"/>
          </g>
          <g class="sw" style="--sd:9s;--d:-3.2s;--r:2.4deg">
            <path d="M96,118 C92,152 102,178 94,210 C88,238 98,256 94,282"
                  stroke="url(#g-arm)" stroke-width="12" opacity=".5"/>
            <path d="M96,118 C92,152 102,178 94,210 C88,238 98,256 94,282"
                  stroke="rgba(236,176,214,.26)" stroke-width="2.4"/>
          </g>
          <g class="sw" style="--sd:8.6s;--d:-0.8s;--r:2.4deg">
            <path d="M108,118 C112,152 102,178 110,210 C116,238 106,256 110,282"
                  stroke="url(#g-arm)" stroke-width="12" opacity=".5"/>
            <path d="M108,118 C112,152 102,178 110,210 C116,238 106,256 110,282"
                  stroke="rgba(236,176,214,.26)" stroke-width="2.4"/>
          </g>
          <g class="sw" style="--sd:7.8s;--d:-2.6s;--r:3deg">
            <path d="M120,116 C128,148 116,170 126,200 C134,226 122,242 128,266"
                  stroke="url(#g-arm)" stroke-width="11" opacity=".55"/>
            <path d="M120,116 C128,148 116,170 126,200 C134,226 122,242 128,266"
                  stroke="rgba(236,176,214,.30)" stroke-width="2.4"/>
          </g>
        </g>

        <!-- 伞盖 -->
        <path d="M22,118
                 C22,52 58,14 100,14
                 C142,14 178,52 178,118
                 C171,131 165,120 155,131
                 C145,142 139,126 128,134
                 C117,142 110,126 100,126
                 C90,126 83,142 72,134
                 C61,126 55,142 45,131
                 C35,120 29,131 22,118 Z"
              fill="url(#g-bell)"/>
        <path d="M22,118 C22,52 58,14 100,14 C142,14 178,52 178,118"
              fill="none" stroke="rgba(226,236,255,.34)" stroke-width="1.2"/>

        <!-- 伞里的小花纹 -->
        <g fill="none" stroke="rgba(236,176,214,.30)" stroke-width="1.6" stroke-linecap="round">
          <path d="M72,74 C72,96 84,108 100,108 C116,108 128,96 128,74"/>
          <path d="M84,66 C84,84 91,92 100,92 C109,92 116,84 116,66" opacity=".7"/>
        </g>
        <ellipse cx="74" cy="52" rx="21" ry="13" fill="url(#g-hl)" opacity=".45"
                 transform="rotate(-20 74 52)"/>
      </svg>
    </div>
  </div>

  <div class="dusk"></div>

  <div class="hud">
    <div class="word">
      <span class="in">吸</span>
      <span class="out">呼</span>
      <span class="last">小水母睡着了</span>
    </div>
    <div class="count" id="count"></div>
  </div>

</div>

<script>
(function(){
  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 海里的小碎屑 */
  var motes = document.getElementById('motes');
  if(!reduce){
    var frag = document.createDocumentFragment();
    for(var i=0;i<30;i++){
      var m = document.createElement('i');
      var s = (Math.random()*1.8 + 0.9).toFixed(1);
      m.className = 'mote';
      m.style.width = s + 'px';
      m.style.height = s + 'px';
      m.style.left = (Math.random()*100).toFixed(2) + '%';
      m.style.top = (Math.random()*100).toFixed(2) + '%';
      m.style.opacity = (Math.random()*0.4 + 0.15).toFixed(2);
      m.style.animationDuration = (Math.random()*40 + 42).toFixed(0) + 's';
      m.style.animationDelay = '-' + (Math.random()*60).toFixed(0) + 's';
      frag.appendChild(m);
    }
    motes.appendChild(frag);
  }

  /* 数呼吸：跟着伞盖的节奏走，不另开计时器 */
  var bob = document.querySelector('.bob');
  var countEl = document.getElementById('count');
  var n = 0, SLEEP_AT = 15;

  function breathed(e){
    /* 伞盖以外的摇摆也会冒泡上来，只认伞盖自己那一下 */
    if(e && e.animationName && e.animationName !== 'bob') return;
    n++;
    if(n >= 3 && n < SLEEP_AT){
      countEl.textContent = '第 ' + n + ' 次呼吸';
      countEl.classList.add('on');
    }
    if(n === SLEEP_AT){
      countEl.classList.remove('on');
      document.body.classList.add('asleep');
    }
  }
  if(bob) bob.addEventListener('animationiteration', breathed);

  /* 点一下水面 */
  var sea = document.getElementById('sea');
  sea.addEventListener('pointerdown', function(e){
    var x = e.clientX, y = e.clientY;

    /* 睡着之后再点一下，它会慢慢醒过来 */
    if(document.body.classList.contains('asleep')){
      document.body.classList.remove('asleep');
      countEl.classList.remove('on');
      countEl.textContent = '';
      n = 0;
    }

    var ring = document.createElement('i');
    ring.className = 'ring';
    ring.style.left = x + 'px';
    ring.style.top  = y + 'px';
    sea.appendChild(ring);
    setTimeout(function(){ ring.remove(); }, 2700);

    if(reduce) return;
    for(var k=0;k<3;k++){
      (function(k){
        var b = document.createElement('i');
        var s = (Math.random()*3 + 2).toFixed(1);
        b.className = 'bub';
        b.style.width = s + 'px';
        b.style.height = s + 'px';
        b.style.left = (x + (Math.random()*22 - 11)) + 'px';
        b.style.top  = (y + (Math.random()*10 - 5)) + 'px';
        b.style.setProperty('--bx', (Math.random()*24 - 12).toFixed(0) + 'px');
        b.style.animationDelay = (k*0.22).toFixed(2) + 's';
        sea.appendChild(b);
        setTimeout(function(){ b.remove(); }, 3900 + k*250);
      })(k);
    }
  }, {passive:true});
})();
</script>
</body>
</html>
