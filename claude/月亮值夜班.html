<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b1d">
<title>月亮值夜班 🌙</title>
<meta name="description" content="Fable 替你值夜班，能开雨声、调更暗、跟着呼吸。">
<style>
  :root{
    --sky-top:#070b1d;
    --sky-mid:#0d1330;
    --sky-low:#1a1030;
    --ink:#aab6d8;
    --ink-soft:#7e89ac;
    --ink-dim:rgba(170,182,216,.4);
    --moon:#f2e7c9;
    --starlight:#dfe7ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);
    overflow:hidden;
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-user-select:none;
    position:relative;
  }

  /* ---------- 星空 ---------- */
  #sky{position:absolute;inset:0;z-index:1}
  .star{
    position:absolute;border-radius:50%;background:var(--starlight);
    animation:twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:var(--o1)}to{opacity:var(--o2)}}

  .meteor{
    position:absolute;width:150px;height:1.5px;border-radius:2px;
    background:linear-gradient(90deg,rgba(223,231,255,0),rgba(223,231,255,.65));
    pointer-events:none;z-index:2;
  }

  .bloom{
    position:absolute;width:10px;height:10px;border-radius:50%;
    background:radial-gradient(rgba(214,224,255,.75),transparent 70%);
    transform:translate(-50%,-50%);
    animation:bloom 3.2s ease-out forwards;
    pointer-events:none;z-index:3;
  }
  @keyframes bloom{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
    25%{opacity:.8}
    100%{transform:translate(-50%,-50%) scale(5);opacity:0}
  }

  /* ---------- 月亮 ---------- */
  #moon{
    position:absolute;top:9%;right:11%;width:78px;height:78px;
    filter:drop-shadow(0 0 22px rgba(242,231,201,.35)) drop-shadow(0 0 60px rgba(242,231,201,.14));
    animation:moonbreath 12s ease-in-out infinite;
    cursor:pointer;z-index:4;
  }
  @keyframes moonbreath{
    0%,100%{filter:drop-shadow(0 0 20px rgba(242,231,201,.30)) drop-shadow(0 0 55px rgba(242,231,201,.12))}
    50%{filter:drop-shadow(0 0 28px rgba(242,231,201,.45)) drop-shadow(0 0 75px rgba(242,231,201,.18))}
  }
  #moonwhisper{
    position:absolute;top:calc(9% + 88px);right:11%;
    font-size:13px;letter-spacing:.5em;color:rgba(242,231,201,.85);
    opacity:0;transition:opacity 1.8s ease;pointer-events:none;z-index:4;
    text-shadow:0 0 12px rgba(242,231,201,.4);
    padding-left:.5em;
  }

  /* ---------- 呼吸引导 ---------- */
  #breath-wrap{
    position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:30px;
    z-index:5;transition:opacity 1.6s ease,visibility 1.6s;
  }
  #breath-wrap.hidden{opacity:0;visibility:hidden}
  #orb{
    width:118px;height:118px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,
      rgba(190,200,255,.55),
      rgba(122,132,222,.22) 55%,
      rgba(92,102,200,.05) 78%);
    box-shadow:0 0 55px 16px rgba(140,152,255,.10);
    transform:scale(1);
    transition:transform 4s cubic-bezier(.42,0,.58,1),box-shadow 4s ease;
  }
  #orb.inhale{
    transform:scale(1.28);
    box-shadow:0 0 78px 26px rgba(150,162,255,.17);
  }
  #breath-label{
    font-size:15px;letter-spacing:.45em;color:var(--ink-soft);
    padding-left:.45em; /* 补偿末尾字间距，保持视觉居中 */
    transition:opacity 1.2s ease;min-height:1.4em;
  }

  /* ---------- 晚安絮语 ---------- */
  #phrase{
    position:absolute;left:50%;top:70%;transform:translateX(-50%);
    width:min(82vw,480px);text-align:center;
    font-size:17px;line-height:2.1;letter-spacing:.12em;
    color:var(--ink);opacity:0;transition:opacity 3.2s ease;
    z-index:5;text-shadow:0 0 24px rgba(20,26,58,.8);
  }

  /* ---------- 调暗遮罩 ---------- */
  #dim{
    position:fixed;inset:0;background:#000;opacity:0;
    transition:opacity 2.6s ease;pointer-events:none;z-index:40;
  }

  /* ---------- 控件 ---------- */
  #controls{
    position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    display:flex;gap:11px;z-index:60;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .ctl{
    padding:8px 15px;border:1px solid rgba(190,200,240,.20);
    border-radius:999px;background:rgba(18,24,54,.42);
    color:var(--ink-soft);font-size:12.5px;letter-spacing:.06em;
    cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:color .8s,border-color .8s,background .8s;
    white-space:nowrap;
  }
  .ctl.on{
    color:#e2e8ff;border-color:rgba(200,210,250,.5);
    background:rgba(34,42,86,.5);
  }

  /* ---------- 签名 ---------- */
  #sig{
    position:absolute;top:calc(16px + env(safe-area-inset-top));left:18px;
    font-size:11px;letter-spacing:.18em;color:var(--ink-dim);
    font-family:-apple-system,"PingFang SC",sans-serif;z-index:5;
  }

  @media (prefers-reduced-motion:reduce){
    .star{animation:none;opacity:var(--o2)}
    #moon{animation:none}
    #orb{transition-duration:.01s !important}
  }
  @media (max-height:600px){
    #breath-wrap{top:40%}
    #orb{width:96px;height:96px}
    #phrase{top:72%;font-size:15.5px}
  }
</style>
</head>
<body>

<div id="sky"></div>

<svg id="moon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="月亮">
  <defs>
    <mask id="crescent">
      <rect width="100" height="100" fill="white"/>
      <circle cx="36" cy="40" r="33" fill="black"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="36" fill="#f2e7c9" mask="url(#crescent)"/>
</svg>
<div id="moonwhisper">我在。</div>

<div id="breath-wrap">
  <div id="orb"></div>
  <div id="breath-label"></div>
</div>

<div id="phrase"></div>

<div id="dim"></div>

<div id="sig">Fable 🌙 值夜班中</div>

<div id="controls">
  <button class="ctl" id="btn-rain">🌧 雨声</button>
  <button class="ctl" id="btn-dim">🌘 更暗</button>
  <button class="ctl on" id="btn-breath">🫧 呼吸</button>
</div>

<script>
(function(){
  "use strict";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 星空生成 ---------- */
  const sky = document.getElementById("sky");
  const STAR_COUNT = 58;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement("div");
    s.className = "star";
    const size = (Math.random()*1.8+0.7).toFixed(1);
    s.style.width = s.style.height = size+"px";
    s.style.left = (Math.random()*100).toFixed(2)+"%";
    s.style.top  = (Math.random()*74).toFixed(2)+"%";
    s.style.setProperty("--d",(Math.random()*8+6).toFixed(1)+"s");
    s.style.setProperty("--o1",(Math.random()*.22+.10).toFixed(2));
    s.style.setProperty("--o2",(Math.random()*.45+.42).toFixed(2));
    s.style.animationDelay = (Math.random()*8).toFixed(1)+"s";
    sky.appendChild(s);
  }

  /* ---------- 罕见流星 ---------- */
  function meteor(){
    if(reduceMotion) return schedule();
    const m = document.createElement("div");
    m.className = "meteor";
    m.style.top  = (Math.random()*24+5)+"%";
    m.style.left = (Math.random()*35+45)+"%";
    sky.appendChild(m);
    const anim = m.animate([
      {transform:"translate(0,0) rotate(155deg)",opacity:0},
      {opacity:.55,offset:.28},
      {transform:"translate(-290px,140px) rotate(155deg)",opacity:0}
    ],{duration:5600,easing:"ease-out"});
    anim.onfinish = ()=>{ m.remove(); };
    schedule();
  }
  function schedule(){
    setTimeout(meteor, 45000 + Math.random()*55000);
  }
  schedule();

  /* ---------- 触碰生星 ---------- */
  document.body.addEventListener("pointerdown",(e)=>{
    if(e.target.closest(".ctl") || e.target.closest("#moon")) return;
    const b = document.createElement("div");
    b.className = "bloom";
    b.style.left = e.clientX+"px";
    b.style.top  = e.clientY+"px";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),3400);
  });

  /* ---------- 月亮小彩蛋 ---------- */
  const moon = document.getElementById("moon");
  const whisper = document.getElementById("moonwhisper");
  let whisperTimer = null;
  const whispers = ["我在。","还没睡呀。","嗯，我看着呢。","慢慢来。","做个好梦。"];
  let wi = 0;
  moon.addEventListener("pointerdown",()=>{
    whisper.textContent = whispers[wi % whispers.length];
    wi++;
    whisper.style.opacity = 1;
    clearTimeout(whisperTimer);
    whisperTimer = setTimeout(()=>{ whisper.style.opacity = 0; }, 3800);
  });

  /* ---------- 呼吸引导：吸 4s · 呼 6.5s ---------- */
  const orb = document.getElementById("orb");
  const label = document.getElementById("breath-label");
  const breathWrap = document.getElementById("breath-wrap");
  const IN_MS = 4000, OUT_MS = 6500, PAUSE = 500;
  function breathe(){
    orb.style.transitionDuration = (IN_MS/1000)+"s";
    orb.classList.add("inhale");
    label.textContent = "吸 ——";
    setTimeout(()=>{
      orb.style.transitionDuration = (OUT_MS/1000)+"s";
      orb.classList.remove("inhale");
      label.textContent = "呼 ————";
      setTimeout(breathe, OUT_MS + PAUSE);
    }, IN_MS + PAUSE);
  }
  setTimeout(breathe, 1200);

  const btnBreath = document.getElementById("btn-breath");
  btnBreath.addEventListener("click",()=>{
    const hidden = breathWrap.classList.toggle("hidden");
    btnBreath.classList.toggle("on", !hidden);
  });

  /* ---------- 晚安絮语 ---------- */
  const phrases = [
    "星星把今天收进口袋了，一件一件，都收好了",
    "风把外面的声音，调小了一格",
    "月亮在替你守着没做完的梦",
    "呼吸慢一点，世界就跟着慢一点",
    "被子是一朵慢慢合拢的云",
    "雨落在很远很远的屋顶上，不吵你",
    "闭上眼睛，草原就自己长出来了",
    "所有的待办都同意了：等到明天",
    "今天辛苦了，剩下的交给睡眠",
    "晚安，宝 🌙"
  ];
  const phraseEl = document.getElementById("phrase");
  let pi = 0;
  const FADE_MS = 3200, HOLD_MS = 9500;
  function cyclePhrase(){
    phraseEl.style.opacity = 0;
    setTimeout(()=>{
      phraseEl.textContent = phrases[pi];
      pi = (pi+1) % phrases.length;
      phraseEl.style.opacity = 1;
      setTimeout(cyclePhrase, HOLD_MS);
    }, pi===0 && phraseEl.textContent==="" ? 300 : FADE_MS);
  }
  setTimeout(cyclePhrase, 2600);

  /* ---------- 雨声（双层白噪音，默认关闭）---------- */
  let audioCtx = null, master = null, rainOn = false;
  const btnRain = document.getElementById("btn-rain");

  function initRain(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = 0.00001;
    master.connect(audioCtx.destination);

    // 第一层：低频棕噪音 —— 远处的雨幕
    const len = audioCtx.sampleRate * 2;
    const brownBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const bd = brownBuf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){
      const white = Math.random()*2-1;
      bd[i] = (last + 0.02*white) / 1.02;
      last = bd[i];
      bd[i] *= 3.2;
    }
    const brown = audioCtx.createBufferSource();
    brown.buffer = brownBuf; brown.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 520; lp.Q.value = 0.7;
    const g1 = audioCtx.createGain(); g1.gain.value = 0.72;
    brown.connect(lp); lp.connect(g1); g1.connect(master);
    brown.start();

    // 给雨幕一点缓慢的起伏
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.06; lfoGain.gain.value = 110;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    lfo.start();

    // 第二层：极轻的高频白噪 —— 雨点的沙沙声
    const whiteBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const wd = whiteBuf.getChannelData(0);
    for(let i=0;i<len;i++){ wd[i] = Math.random()*2-1; }
    const white2 = audioCtx.createBufferSource();
    white2.buffer = whiteBuf; white2.loop = true;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 0.5;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.045;
    white2.connect(bp); bp.connect(g2); g2.connect(master);
    white2.start();

    // 沙沙声的呼吸感
    const lfo2 = audioCtx.createOscillator();
    const lfo2Gain = audioCtx.createGain();
    lfo2.frequency.value = 0.09; lfo2Gain.gain.value = 0.015;
    lfo2.connect(lfo2Gain); lfo2Gain.connect(g2.gain);
    lfo2.start();
  }

  btnRain.addEventListener("click", async ()=>{
    if(!audioCtx) initRain();
    if(audioCtx.state === "suspended") await audioCtx.resume();
    rainOn = !rainOn;
    btnRain.classList.toggle("on", rainOn);
    const t = audioCtx.currentTime;
    if(rainOn){
      master.gain.setTargetAtTime(0.05, t, 1.4);
      btnRain.textContent = "🌧 雨声 · 开";
    }else{
      master.gain.setTargetAtTime(0.00001, t, 0.9);
      btnRain.textContent = "🌧 雨声";
    }
  });

  /* ---------- 调暗档位 ---------- */
  const dim = document.getElementById("dim");
  const btnDim = document.getElementById("btn-dim");
  const levels = [0, 0.34, 0.6];
  const labels = ["🌘 更暗","🌘 更暗 ·","🌘 更暗 · ·"];
  let di = 0;
  btnDim.addEventListener("click",()=>{
    di = (di+1) % levels.length;
    dim.style.opacity = levels[di];
    btnDim.textContent = labels[di];
    btnDim.classList.toggle("on", di>0);
  });
})();
</script>
</body>
</html>
