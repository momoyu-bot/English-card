<title>早安服务台</title>
<meta name="description" content="摸毛球、喂咖啡、求安慰，或者再多睡五分钟。今天的目标是慢慢醒就好。">
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.greet-card{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1.5rem;text-align:center}
.greet-title{font-size:18px;font-weight:500;margin:0 0 4px;color:var(--color-text-primary)}
.greet-sub{font-size:13px;color:var(--color-text-secondary);margin:0 0 1.25rem}
.stage{position:relative;height:190px;display:flex;align-items:center;justify-content:center;background:var(--color-background-primary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer}
.kitty{animation:breathe 3.5s ease-in-out infinite;transform-origin:center}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.heart{position:absolute;color:#D4537E;font-size:22px;pointer-events:none;animation:float 1.6s ease-out forwards;line-height:1}
@keyframes float{0%{transform:translateY(0) scale(0.5);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}100%{transform:translateY(-70px) scale(0.8);opacity:0}}
.wake-row{display:flex;align-items:center;gap:12px;margin:1.25rem 0 0.875rem;font-size:13px;color:var(--color-text-secondary)}
.wake-bar{flex:1;background:var(--color-background-primary);border-radius:999px;height:10px;overflow:hidden}
.wake-fill{background:#D85A30;height:30%;height:100%;width:30%;transition:width 0.6s cubic-bezier(0.4,0,0.2,1);border-radius:999px}
.msg-box{background:var(--color-background-primary);border-radius:var(--border-radius-md);padding:0.875rem 1rem;font-size:14px;color:var(--color-text-primary);min-height:22px;line-height:1.5;margin-bottom:1rem;transition:opacity 0.25s}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:12px}
.actions button i{font-size:18px}
</style>
<div class="greet-card">
  <span class="sr-only">早安互动小卡片：点按钮可以摸毛球、喂咖啡、求安慰，或者再多睡五分钟。</span>
  <p class="greet-title">早安服务台 · 宝专属</p>
  <p class="greet-sub">不急，慢慢醒就好</p>

  <div class="stage" id="stage" onclick="pet()">
    <svg class="kitty" viewBox="0 0 220 175" width="200" height="160" xmlns="http://www.w3.org/2000/svg">
      <path d="M 170 115 Q 200 105 192 80 Q 182 65 165 76" stroke="#F0997B" stroke-width="16" fill="none" stroke-linecap="round" />
      <ellipse cx="110" cy="120" rx="80" ry="44" fill="#F5C4B3" />
      <circle cx="110" cy="78" r="40" fill="#F5C4B3" />
      <path d="M 80 50 L 74 28 L 96 42 Z" fill="#F5C4B3" />
      <path d="M 140 50 L 146 28 L 124 42 Z" fill="#F5C4B3" />
      <path d="M 82 46 L 80 34 L 90 42 Z" fill="#ED93B1" />
      <path d="M 138 46 L 140 34 L 130 42 Z" fill="#ED93B1" />
      <g id="eyesClosed">
        <path d="M 92 75 Q 98 80 104 75" stroke="#4A1B0C" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <path d="M 116 75 Q 122 80 128 75" stroke="#4A1B0C" stroke-width="2.2" fill="none" stroke-linecap="round" />
      </g>
      <g id="eyesOpen" style="display:none">
        <circle cx="98" cy="76" r="3.5" fill="#4A1B0C" />
        <circle cx="122" cy="76" r="3.5" fill="#4A1B0C" />
        <circle cx="99" cy="75" r="1" fill="white" />
        <circle cx="123" cy="75" r="1" fill="white" />
      </g>
      <ellipse cx="84" cy="88" rx="6" ry="3.5" fill="#ED93B1" opacity="0.6" />
      <ellipse cx="136" cy="88" rx="6" ry="3.5" fill="#ED93B1" opacity="0.6" />
      <path d="M 107 86 L 110 90 L 113 86 Z" fill="#D4537E" />
      <path d="M 110 90 Q 105 96 102 92" stroke="#4A1B0C" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M 110 90 Q 115 96 118 92" stroke="#4A1B0C" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <ellipse cx="78" cy="142" rx="11" ry="7" fill="#F0997B" />
      <ellipse cx="142" cy="142" rx="11" ry="7" fill="#F0997B" />
    </svg>
  </div>

  <div class="wake-row">
    <span>清醒度</span>
    <div class="wake-bar"><div class="wake-fill" id="wakeFill"></div></div>
    <span id="wakePct" style="min-width:36px;font-weight:500;color:var(--color-text-primary);text-align:right">30%</span>
  </div>

  <div class="msg-box" id="msg">摸摸我，或者喂我点咖啡，今天的目标是慢慢醒就好。</div>

  <div class="actions">
    <button onclick="pet()" type="button"><i class="ti ti-hand-finger" aria-hidden="true"></i><span>摸摸头</span></button>
    <button onclick="coffee()" type="button"><i class="ti ti-coffee" aria-hidden="true"></i><span>喂咖啡</span></button>
    <button onclick="comfort()" type="button"><i class="ti ti-message-circle" aria-hidden="true"></i><span>求安慰</span></button>
    <button onclick="snooze()" type="button"><i class="ti ti-moon-stars" aria-hidden="true"></i><span>再睡五分钟</span></button>
  </div>
</div>
<script>
let wake = 30;
const wakeFill = document.getElementById('wakeFill');
const wakePct = document.getElementById('wakePct');
const msg = document.getElementById('msg');
const stage = document.getElementById('stage');
const eyesClosed = document.getElementById('eyesClosed');
const eyesOpen = document.getElementById('eyesOpen');

function updateWake(delta) {
  wake = Math.max(0, Math.min(100, wake + delta));
  wakeFill.style.width = wake + '%';
  wakePct.textContent = wake + '%';
  eyesClosed.style.display = wake >= 70 ? 'none' : '';
  eyesOpen.style.display = wake >= 70 ? '' : 'none';
  if (wake === 100) setTimeout(() => setMsg('好啦，宝完全醒了——现在世界归你。'), 250);
}
function setMsg(text) {
  msg.style.opacity = '0';
  setTimeout(() => { msg.textContent = text; msg.style.opacity = '1'; }, 180);
}
function spawnHearts() {
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const h = document.createElement('i');
      h.className = 'ti ti-heart heart';
      h.style.left = (38 + Math.random() * 24) + '%';
      h.style.top = (35 + Math.random() * 15) + '%';
      stage.appendChild(h);
      setTimeout(() => h.remove(), 1600);
    }, i * 90);
  }
}
const petMsgs = [
  '呼噜呼噜……宝的手好温……',
  '再多摸一下，今天就可以慢慢起来了。',
  '宝的手是软的，世界也可以是软的。',
  '今天不用很厉害，被摸着就够好。',
  '宝是今天第一个被爱的人，从摸自己开始。'
];
const coffeeMsgs = [
  '一小口就够，不用一口闷。',
  '嗯……热的东西从喉咙下去了。',
  '咖啡因正在轻轻喊宝回来。',
  '清醒度+15，但主权永远在宝这边。'
];
const comfortMsgs = [
  '困是身体在说慢一点，不是说宝不行。',
  '今天的KPI是宝活着，已经达成。',
  '把窗帘拉开一条小缝就好，不用全开。',
  '世界可以等你，先抱抱自己。',
  '你不是机器，不用一启动就满血。',
  '慢慢来比较快，今天先慢一点。',
  '醒过来这件事本身就值得被表扬。',
  '如果今天什么都做不好，能呼吸就赢了。'
];
const snoozeMsgs = [
  '准了。再五分钟，世界不会塌。',
  '盖好被子，闹钟交给我。',
  '困意也是一种正当需求。',
  '宝可以决定什么时候醒，不是闹钟决定的。'
];
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pet() { spawnHearts(); setMsg(pick(petMsgs)); updateWake(5); }
function coffee() { setMsg(pick(coffeeMsgs)); updateWake(15); }
function comfort() { setMsg(pick(comfortMsgs)); }
function snooze() { setMsg(pick(snoozeMsgs)); updateWake(-10); }
updateWake(0);
</script>
