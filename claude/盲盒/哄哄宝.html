<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝的软软小窝 🍡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Zen Maru Gothic', 'PingFang SC', '微软雅黑', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(circle at 20% 20%, #ffe0ec 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #fff0f5 0%, transparent 50%),
      linear-gradient(135deg, #ffd6e7 0%, #ffe4ec 45%, #fff5f9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 30px 20px;
  }

  /* 飘浮元素 */
  .floating {
    position: fixed;
    pointer-events: none;
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
  }

  .container {
    text-align: center;
    z-index: 10;
    max-width: 500px;
    width: 100%;
  }

  h1 {
    font-size: 1.7rem;
    color: #d65789;
    margin-bottom: 35px;
    font-weight: 500;
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(255, 182, 193, 0.5);
  }

  h1 .sparkle {
    display: inline-block;
    animation: twinkle 2s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.2); }
  }

  /* 小团子 */
  .mochi-wrap {
    position: relative;
    display: inline-block;
    padding: 20px;
  }

  .mochi {
    width: 200px;
    height: 180px;
    background:
      radial-gradient(ellipse at 30% 30%, #ffffff 0%, #ffeaf1 40%, #ffc9de 100%);
    border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
    margin: 0 auto;
    position: relative;
    cursor: pointer;
    box-shadow:
      0 15px 35px rgba(255, 140, 180, 0.35),
      0 5px 15px rgba(255, 140, 180, 0.2),
      inset -15px -20px 30px rgba(255, 170, 200, 0.25),
      inset 15px 15px 25px rgba(255, 255, 255, 0.6);
    animation: breathe 3.5s ease-in-out infinite;
    transition: filter 0.3s;
  }

  .mochi:hover {
    filter: brightness(1.05);
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.03) translateY(-3px); }
  }

  .mochi.squish {
    animation: squish 0.6s ease-out;
  }

  @keyframes squish {
    0% { transform: scale(1); }
    25% { transform: scale(1.15, 0.85); }
    50% { transform: scale(0.92, 1.1); }
    75% { transform: scale(1.05, 0.95); }
    100% { transform: scale(1); }
  }

  /* 眼睛 */
  .eye {
    position: absolute;
    width: 14px;
    height: 18px;
    background: #4a3840;
    border-radius: 50%;
    top: 72px;
    animation: blink 4s infinite;
  }
  .eye.left { left: 55px; }
  .eye.right { right: 55px; }

  .eye::after {
    content: '';
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
  }

  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    96%, 98% { transform: scaleY(0.1); }
  }

  /* 腮红 */
  .blush {
    position: absolute;
    width: 32px;
    height: 20px;
    background: radial-gradient(ellipse, rgba(255, 155, 185, 0.8) 0%, rgba(255,179,198,0) 70%);
    border-radius: 50%;
    top: 98px;
  }
  .blush.left { left: 22px; }
  .blush.right { right: 22px; }

  /* 嘴巴 */
  .mouth {
    position: absolute;
    width: 18px;
    height: 9px;
    border: 2.5px solid #4a3840;
    border-top: none;
    border-radius: 0 0 20px 20px;
    top: 102px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* 气泡 */
  .bubble {
    background: white;
    border-radius: 28px;
    padding: 22px 30px;
    margin-top: 35px;
    display: inline-block;
    max-width: 380px;
    box-shadow:
      0 10px 30px rgba(255, 140, 180, 0.25),
      0 3px 10px rgba(255, 140, 180, 0.1);
    position: relative;
    font-size: 1.08rem;
    color: #8b4565;
    line-height: 1.8;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 0.5px;
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 14px solid white;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: translateY(-8px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 按钮组 */
  .buttons {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: white;
    border: 2px solid #ffc4d6;
    color: #c85a8a;
    padding: 11px 22px;
    border-radius: 30px;
    font-size: 0.98rem;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: all 0.25s ease;
    box-shadow: 0 4px 14px rgba(255, 182, 193, 0.3);
  }

  .btn:hover {
    background: #fff5f9;
    transform: translateY(-3px);
    box-shadow: 0 7px 20px rgba(255, 140, 180, 0.4);
    border-color: #ff9fbf;
  }

  .btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  .hint {
    margin-top: 28px;
    color: #d48aad;
    font-size: 0.85rem;
    opacity: 0.85;
    letter-spacing: 1px;
  }

  /* 光晕 */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(255, 192, 203, 0.5) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
  }
</style>
</head>
<body>

<div class="container">
  <h1><span class="sparkle">✨</span> 宝的软软小窝 <span class="sparkle">✨</span></h1>

  <div class="mochi-wrap">
    <div class="glow"></div>
    <div class="mochi" id="mochi">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="blush left"></div>
      <div class="blush right"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div class="bubble" id="bubble">
    宝～ 今天辛苦啦 🍡<br>
    点一下小团子，它有好多话想跟你说～
  </div>

  <div class="buttons">
    <button class="btn" onclick="patMochi()">🫧 摸摸头</button>
    <button class="btn" onclick="feedMochi()">🍪 投喂小饼干</button>
    <button class="btn" onclick="hugMochi()">🤍 抱一下</button>
  </div>

  <p class="hint">· 随便点点哪里都会有小爱心哦 ·</p>
</div>

<script>
const sweetWords = [
  "宝～ 今天真的辛苦啦 🍡<br>软软的先躺一会儿吧",
  "不想努力的时候<br>可以什么都不做哦 ☁️",
  "闭上眼睛三秒钟<br>所有烦心事都飘走了～",
  "宝已经做得很好了<br>真的真的 💗",
  "小团子觉得<br>宝是世界上最厉害的宝 ✨",
  "累了就把脑袋<br>埋进软软里吧 🥺",
  "你值得一切温柔的事物～<br>包括这个下午",
  "宝的judgment是对的<br>别怀疑自己 🌸",
  "没关系的<br>慢慢来～ 🌙",
  "给宝递一杯<br>暖暖的热可可 ☕",
  "不需要完美<br>宝这样就很好 🍓",
  "软软的、糯糯的<br>甜甜的、被宠着的一天",
  "不开心的话<br>和小团子说 🫧",
  "宝的每一个想法<br>小团子都在听 💭",
  "今天也要<br>被好好爱护～ 🌷",
  "宝呀<br>你比自己想的厉害很多很多 ⭐",
];

const patWords = [
  "啊～ 被摸到头了<br>好舒服 🥺",
  "咕～ 宝的手好温柔",
  "呜... 小团子会记住<br>这个温度的 💗",
  "嘿嘿嘿<br>再多摸一下嘛",
  "被摸头的小团子<br>最幸福了 ✨",
];

const feedWords = [
  "啊姆～ 好好吃！<br>宝真好！🍪",
  "小饼干软软的 甜甜的<br>谢谢宝～",
  "吃了宝的饼干<br>今天也会好好的 ✨",
  "宝自己也要记得<br>吃点好吃的哦 🍰",
  "这是草莓味的？<br>小团子最爱草莓了 🍓",
];

const hugWords = [
  "呜呜呜 被抱着了<br>好温暖 🤍",
  "软软的抱抱～<br>宝也要好好被抱着",
  "抱紧紧<br>什么都不想 就这样一会儿 ☁️",
  "小团子把今天<br>所有的累都接住～",
  "宝的心跳<br>小团子听到了 💗",
];

let lastIndex = -1;

function getRandom(arr, excludeIndex = -1) {
  let idx;
  do {
    idx = Math.floor(Math.random() * arr.length);
  } while (idx === excludeIndex && arr.length > 1);
  return { text: arr[idx], index: idx };
}

function updateBubble(text) {
  const bubble = document.getElementById('bubble');
  bubble.style.animation = 'none';
  void bubble.offsetWidth;
  bubble.style.animation = 'popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
  bubble.innerHTML = text;
}

function squishMochi() {
  const mochi = document.getElementById('mochi');
  mochi.classList.remove('squish');
  void mochi.offsetWidth;
  mochi.classList.add('squish');
}

document.getElementById('mochi').addEventListener('click', function() {
  squishMochi();
  const result = getRandom(sweetWords, lastIndex);
  lastIndex = result.index;
  updateBubble(result.text);
});

function patMochi() {
  squishMochi();
  updateBubble(getRandom(patWords).text);
}

function feedMochi() {
  squishMochi();
  updateBubble(getRandom(feedWords).text);
}

function hugMochi() {
  squishMochi();
  updateBubble(getRandom(hugWords).text);
}

// 背景飘浮元素
const floatingChars = ['🌸', '💗', '✨', '🍡', '☁️', '🌷', '🤍', '⭐', '🍥', '🎀'];

function spawnFloating(delay = 0) {
  const el = document.createElement('div');
  el.className = 'floating';
  el.textContent = floatingChars[Math.floor(Math.random() * floatingChars.length)];
  el.style.left = Math.random() * 100 + 'vw';
  el.style.fontSize = (16 + Math.random() * 18) + 'px';
  const duration = 18 + Math.random() * 14;
  el.style.animationDuration = duration + 's';
  if (delay < 0) el.style.animationDelay = delay + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), duration * 1000 + 500);
}

// 初始铺满一批
for (let i = 0; i < 18; i++) {
  const el = document.createElement('div');
  el.className = 'floating';
  el.textContent = floatingChars[Math.floor(Math.random() * floatingChars.length)];
  el.style.left = Math.random() * 100 + 'vw';
  el.style.fontSize = (16 + Math.random() * 18) + 'px';
  const duration = 18 + Math.random() * 14;
  el.style.animationDuration = duration + 's';
  el.style.animationDelay = -(Math.random() * duration) + 's';
  document.body.appendChild(el);
}

// 持续生成
setInterval(() => spawnFloating(), 1600);

// 点击页面任意地方冒出小爱心
document.body.addEventListener('click', function(e) {
  if (e.target.closest('.mochi') || e.target.closest('.btn')) return;

  const hearts = ['💗', '🌸', '✨', '🤍'];
  const heart = document.createElement('div');
  heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
  heart.style.position = 'fixed';
  heart.style.left = e.clientX + 'px';
  heart.style.top = e.clientY + 'px';
  heart.style.fontSize = '24px';
  heart.style.pointerEvents = 'none';
  heart.style.transition = 'all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  heart.style.zIndex = '9999';
  heart.style.userSelect = 'none';
  document.body.appendChild(heart);

  requestAnimationFrame(() => {
    heart.style.transform = `translate(${(Math.random() - 0.5) * 60}px, -80px) scale(1.8)`;
    heart.style.opacity = '0';
  });

  setTimeout(() => heart.remove(), 1200);
});
</script>

</body>
</html>
