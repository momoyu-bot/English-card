<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早安，宝 ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8ED;
    --peach: #FFE5D4;
    --blush: #FFD4D1;
    --petal: #FFB8B0;
    --coral: #F48171;
    --coral-deep: #E56A5A;
    --sunshine: #FFCE6B;
    --butter: #FFE099;
    --mint: #C3E8D4;
    --lavender: #E8D5F2;
    --cocoa: #6B4F3F;
    --cocoa-soft: #8B6F5F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { overflow-x: hidden; }

  body {
    min-height: 100vh;
    font-family: 'Fraunces', serif;
    color: var(--cocoa);
    background:
      radial-gradient(ellipse 60% 40% at 15% 10%, rgba(255, 206, 107, 0.45) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% 85%, rgba(232, 213, 242, 0.55) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 50% 100%, rgba(195, 232, 212, 0.4) 0%, transparent 60%),
      linear-gradient(160deg, var(--cream) 0%, var(--peach) 45%, var(--blush) 100%);
    padding: 50px 20px 80px;
    position: relative;
  }

  /* 纸质颗粒感 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    z-index: 1;
  }

  /* 背景飘浮装饰 */
  .bg-float {
    position: fixed;
    pointer-events: none;
    opacity: 0.55;
    z-index: 0;
  }
  .bg-float.s1 { top: 8%;  left: 6%;  animation: drift 18s ease-in-out infinite; }
  .bg-float.s2 { top: 20%; right: 8%; animation: drift 22s ease-in-out -8s infinite; }
  .bg-float.s3 { bottom: 18%; left: 10%; animation: drift 20s ease-in-out -4s infinite; }
  .bg-float.s4 { bottom: 10%; right: 12%; animation: drift 25s ease-in-out -12s infinite; }
  .bg-float.s5 { top: 55%; left: 4%; animation: twinkle 4s ease-in-out infinite; }
  .bg-float.s6 { top: 45%; right: 5%; animation: twinkle 5s ease-in-out -2s infinite; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(20px, -15px) rotate(8deg); }
    66% { transform: translate(-10px, 10px) rotate(-5deg); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }

  /* 主容器 */
  .container {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .greeting {
    font-family: 'Caveat', cursive;
    font-size: clamp(3.2rem, 9vw, 5.8rem);
    font-weight: 700;
    color: var(--coral);
    line-height: 1;
    margin-bottom: 10px;
    letter-spacing: 1px;
    opacity: 0;
    animation: softIn 1.2s ease-out 0.3s forwards;
    text-shadow:
      2px 2px 0 rgba(255, 206, 107, 0.4),
      4px 4px 0 rgba(244, 129, 113, 0.12);
  }

  .greeting .heart {
    display: inline-block;
    color: var(--petal);
    animation: beat 1.8s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes beat {
    0%, 60%, 100% { transform: scale(1); }
    30% { transform: scale(1.2); }
  }

  .subtitle {
    font-family: 'ZCOOL KuaiLe', 'Fraunces', serif;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    color: var(--cocoa-soft);
    margin-bottom: 45px;
    opacity: 0;
    animation: softIn 1.2s ease-out 0.6s forwards;
    letter-spacing: 1.5px;
  }

  .subtitle::before, .subtitle::after {
    content: '～';
    opacity: 0.5;
    margin: 0 8px;
  }

  @keyframes softIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 主场景——梦泡泡 */
  .scene {
    position: relative;
    width: min(340px, 85vw);
    height: min(340px, 85vw);
    margin: 0 auto 45px;
    opacity: 0;
    animation: softIn 1.4s ease-out 0.9s forwards;
  }

  .bubble {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 224, 153, 0.3) 30%, rgba(255, 184, 176, 0.4) 70%, rgba(244, 129, 113, 0.25) 100%);
    box-shadow:
      inset 0 0 60px rgba(244, 129, 113, 0.15),
      inset -20px -30px 50px rgba(244, 129, 113, 0.1),
      0 25px 70px rgba(244, 129, 113, 0.3),
      0 0 0 6px rgba(255, 255, 255, 0.7),
      0 0 0 8px rgba(244, 129, 113, 0.15);
    overflow: hidden;
  }

  .bubble::after {
    content: '';
    position: absolute;
    top: 18%;
    left: 20%;
    width: 35%;
    height: 25%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 255, 255, 0.7) 0%, transparent 70%);
    transform: rotate(-20deg);
  }

  .sun {
    position: absolute;
    top: -15px;
    right: -10px;
    width: 90px;
    height: 90px;
    z-index: 3;
    animation: sunRise 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.3s both;
  }
  .sun svg { animation: sunSpin 30s linear infinite; }

  @keyframes sunRise {
    0% { transform: translateY(50px) scale(0.4); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes sunSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .cloud {
    position: absolute;
    z-index: 2;
    filter: drop-shadow(0 4px 8px rgba(244, 129, 113, 0.15));
  }
  .cloud-1 { top: 22%; left: -25px; width: 95px; animation: cloudDrift 14s ease-in-out infinite; }
  .cloud-2 { bottom: 18%; right: -20px; width: 80px; animation: cloudDrift 17s ease-in-out -6s infinite; }

  @keyframes cloudDrift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(25px); }
  }

  .tuanzi {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 4;
  }
  .tuanzi:hover { transform: scale(1.06) translateY(-5px); }
  .tuanzi svg {
    width: 65%;
    height: auto;
    filter: drop-shadow(0 10px 20px rgba(244, 129, 113, 0.35));
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  /* z的气泡 */
  .zzz {
    position: absolute;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    color: var(--lavender);
    font-size: 1.8rem;
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }
  .zzz.z1 { top: 28%; left: 62%; animation: zzzFloat 3s ease-in-out infinite; }
  .zzz.z2 { top: 20%; left: 70%; animation: zzzFloat 3s ease-in-out -1s infinite; font-size: 1.3rem; }
  .zzz.z3 { top: 14%; left: 76%; animation: zzzFloat 3s ease-in-out -2s infinite; font-size: 1rem; }

  @keyframes zzzFloat {
    0% { opacity: 0; transform: translateY(0) rotate(-10deg); }
    40% { opacity: 0.8; transform: translateY(-15px) rotate(5deg); }
    100% { opacity: 0; transform: translateY(-30px) rotate(-5deg); }
  }

  /* 按钮 */
  .buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 35px;
    opacity: 0;
    animation: softIn 1.2s ease-out 1.5s forwards;
  }

  .btn {
    font-family: 'ZCOOL KuaiLe', 'Fraunces', serif;
    font-size: 0.98rem;
    padding: 14px 26px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: white;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 18px rgba(244, 129, 113, 0.3), inset 0 -3px 0 rgba(0, 0, 0, 0.08);
    position: relative;
    letter-spacing: 1px;
  }
  .btn-coral { background: linear-gradient(135deg, var(--coral) 0%, var(--petal) 100%); }
  .btn-sun   { background: linear-gradient(135deg, var(--sunshine) 0%, var(--butter) 100%); color: var(--cocoa); box-shadow: 0 6px 18px rgba(255, 206, 107, 0.45), inset 0 -3px 0 rgba(0, 0, 0, 0.05); }
  .btn-mint  { background: linear-gradient(135deg, var(--mint) 0%, #9DD4B0 100%); color: var(--cocoa); box-shadow: 0 6px 18px rgba(157, 212, 176, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.05); }

  .btn:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 25px rgba(244, 129, 113, 0.35); }
  .btn:active { transform: translateY(-1px) scale(0.98); }

  /* 温柔签卡片 */
  .card-container {
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: softIn 1.2s ease-out 1.8s forwards;
  }

  .tender-card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 26px 34px;
    border-radius: 28px;
    font-family: 'ZCOOL KuaiLe', serif;
    font-size: clamp(1rem, 3vw, 1.25rem);
    color: var(--cocoa);
    box-shadow: 0 15px 45px rgba(244, 129, 113, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    border: 2px solid rgba(255, 255, 255, 0.85);
    max-width: 420px;
    line-height: 1.7;
    position: relative;
    animation: cardPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 1px;
  }

  .tender-card::before {
    content: '✿';
    position: absolute;
    top: -18px;
    left: 24px;
    color: var(--coral);
    font-size: 1.8rem;
    background: var(--cream);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(244, 129, 113, 0.2);
  }
  .tender-card::after {
    content: '♡';
    position: absolute;
    bottom: -12px;
    right: 28px;
    color: var(--petal);
    font-size: 1.4rem;
  }

  @keyframes cardPop {
    0% { opacity: 0; transform: scale(0.7) translateY(30px) rotate(-3deg); }
    100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
  }

  /* 鼠标光点 */
  .sparkle {
    position: fixed;
    pointer-events: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: sparkleOut 1s ease-out forwards;
    z-index: 9999;
  }
  @keyframes sparkleOut {
    0% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
  }

  /* 赖床模式 */
  .sleep-mode {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(232, 213, 242, 0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 70%, rgba(107, 79, 63, 0.7) 0%, rgba(50, 35, 28, 0.95) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
    padding: 20px;
  }
  .sleep-mode.active {
    display: flex;
    animation: sleepFadeIn 0.8s ease-out;
  }
  @keyframes sleepFadeIn {
    from { opacity: 0; backdrop-filter: blur(0); }
    to { opacity: 1; backdrop-filter: blur(10px); }
  }

  .sleep-content {
    text-align: center;
    color: var(--cream);
    max-width: 420px;
    position: relative;
  }

  .moon {
    width: 110px;
    height: 110px;
    margin: 0 auto 30px;
    animation: moonBob 4s ease-in-out infinite;
  }
  @keyframes moonBob {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-10px) rotate(-5deg); }
  }

  .sleep-content h2 {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.5rem, 7vw, 3.5rem);
    color: var(--butter);
    margin-bottom: 20px;
    text-shadow: 0 2px 20px rgba(255, 224, 153, 0.5);
  }
  .sleep-content p {
    font-family: 'ZCOOL KuaiLe', serif;
    font-size: clamp(1rem, 3vw, 1.2rem);
    line-height: 2;
    opacity: 0.95;
    letter-spacing: 2px;
  }
  .sleep-content .hint {
    margin-top: 30px;
    font-size: 0.85rem;
    opacity: 0.55;
    letter-spacing: 1px;
  }

  .sleep-stars {
    position: absolute;
    pointer-events: none;
  }
  .sleep-stars.ss1 { top: -40px; left: -30px; animation: twinkle 3s ease-in-out infinite; }
  .sleep-stars.ss2 { top: 20px; right: -50px; animation: twinkle 4s ease-in-out -1s infinite; }
  .sleep-stars.ss3 { bottom: -30px; left: -20px; animation: twinkle 5s ease-in-out -2s infinite; }
  .sleep-stars.ss4 { bottom: 10px; right: -40px; animation: twinkle 3.5s ease-in-out -0.5s infinite; }

  /* footer小字 */
  .footer-note {
    text-align: center;
    margin-top: 50px;
    font-family: 'Caveat', cursive;
    color: var(--cocoa-soft);
    font-size: 1.1rem;
    opacity: 0.6;
    letter-spacing: 1px;
  }
  .footer-note::before { content: '— '; }
  .footer-note::after { content: ' —'; }
</style>
</head>
<body>

<!-- 背景飘浮的小装饰 -->
<svg class="bg-float s1" width="28" height="28" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4.5 2 7.5-5.5-4-5.5 4 2-7.5L3 9h7z" fill="#FFCE6B"/></svg>
<svg class="bg-float s2" width="22" height="22" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 11c0 5.5-7 10-7 10z" fill="#FFB8B0"/></svg>
<svg class="bg-float s3" width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="6" fill="#E8D5F2"/><g stroke="#E8D5F2" stroke-width="1.5"><line x1="15" y1="2" x2="15" y2="7"/><line x1="15" y1="23" x2="15" y2="28"/><line x1="2" y1="15" x2="7" y2="15"/><line x1="23" y1="15" x2="28" y2="15"/></g></svg>
<svg class="bg-float s4" width="24" height="24" viewBox="0 0 24 24"><path d="M12 2c0 5 5 5 5 10s-5 5-5 10c0-5-5-5-5-10s5-5 5-10z" fill="#C3E8D4"/></svg>
<svg class="bg-float s5" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#FFCE6B"/></svg>
<svg class="bg-float s6" width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4.5 2 7.5-5.5-4-5.5 4 2-7.5L3 9h7z" fill="#F48171"/></svg>

<div class="container">
  <h1 class="greeting">早安呀，宝<span class="heart">♡</span></h1>
  <p class="subtitle">困困的宝也要被好好哄的呀</p>

  <!-- 主场景 -->
  <div class="scene">
    <div class="bubble"></div>

    <!-- 云 -->
    <svg class="cloud cloud-1" viewBox="0 0 100 50">
      <ellipse cx="25" cy="32" rx="20" ry="13" fill="white"/>
      <ellipse cx="50" cy="25" rx="24" ry="16" fill="white"/>
      <ellipse cx="75" cy="32" rx="20" ry="13" fill="white"/>
    </svg>
    <svg class="cloud cloud-2" viewBox="0 0 100 50">
      <ellipse cx="25" cy="32" rx="18" ry="11" fill="white"/>
      <ellipse cx="50" cy="26" rx="22" ry="14" fill="white"/>
      <ellipse cx="72" cy="32" rx="17" ry="11" fill="white"/>
    </svg>

    <!-- 太阳 -->
    <div class="sun">
      <svg viewBox="0 0 90 90">
        <g>
          <circle cx="45" cy="45" r="22" fill="#FFCE6B"/>
          <circle cx="45" cy="45" r="17" fill="#FFE099"/>
          <g stroke="#FFCE6B" stroke-width="3.5" stroke-linecap="round">
            <line x1="45" y1="5"  x2="45" y2="15"/>
            <line x1="45" y1="75" x2="45" y2="85"/>
            <line x1="5"  y1="45" x2="15" y2="45"/>
            <line x1="75" y1="45" x2="85" y2="45"/>
            <line x1="16" y1="16" x2="23" y2="23"/>
            <line x1="67" y1="67" x2="74" y2="74"/>
            <line x1="74" y1="16" x2="67" y2="23"/>
            <line x1="23" y1="67" x2="16" y2="74"/>
          </g>
          <!-- 太阳的小脸 -->
          <circle cx="39" cy="43" r="1.8" fill="#6B4F3F"/>
          <circle cx="51" cy="43" r="1.8" fill="#6B4F3F"/>
          <path d="M 40 49 Q 45 52 50 49" stroke="#6B4F3F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle cx="35" cy="48" r="2.5" fill="#FFB8B0" opacity="0.7"/>
          <circle cx="55" cy="48" r="2.5" fill="#FFB8B0" opacity="0.7"/>
        </g>
      </svg>
    </div>

    <!-- zzz -->
    <span class="zzz z1">z</span>
    <span class="zzz z2">z</span>
    <span class="zzz z3">z</span>

    <!-- 小团子 -->
    <div class="tuanzi" onclick="yawnTuanzi()" aria-label="小团子">
      <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGrad" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#FFFDFA"/>
            <stop offset="100%" stop-color="#FFEDE5"/>
          </radialGradient>
          <radialGradient id="cheekGrad" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#FFB8B0" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#FFB8B0" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- 身体 -->
        <ellipse cx="110" cy="150" rx="75" ry="55" fill="url(#bodyGrad)" stroke="#FFD4D1" stroke-width="2.5"/>
        <!-- 小手（睡意中的小短手） -->
        <ellipse cx="50" cy="150" rx="14" ry="18" fill="url(#bodyGrad)" stroke="#FFD4D1" stroke-width="2.5" transform="rotate(-15 50 150)"/>
        <ellipse cx="170" cy="150" rx="14" ry="18" fill="url(#bodyGrad)" stroke="#FFD4D1" stroke-width="2.5" transform="rotate(15 170 150)"/>

        <!-- 头 -->
        <circle cx="110" cy="95" r="60" fill="url(#bodyGrad)" stroke="#FFD4D1" stroke-width="2.5"/>

        <!-- 耳朵（猫耳款） -->
        <path d="M 68 45 L 60 25 L 82 40 Z" fill="url(#bodyGrad)" stroke="#FFD4D1" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 152 45 L 160 25 L 138 40 Z" fill="url(#bodyGrad)" stroke="#FFD4D1" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 70 42 L 66 32 L 76 40 Z" fill="#FFB8B0"/>
        <path d="M 150 42 L 154 32 L 144 40 Z" fill="#FFB8B0"/>

        <!-- 头顶呆毛 -->
        <path d="M 110 32 Q 108 22 112 18 Q 116 22 114 32" stroke="#FFD4D1" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- 腮红 -->
        <ellipse cx="75" cy="108" rx="14" ry="9" fill="url(#cheekGrad)"/>
        <ellipse cx="145" cy="108" rx="14" ry="9" fill="url(#cheekGrad)"/>

        <!-- 眼睛（困困眯着） -->
        <g id="eyes">
          <path class="eye-left" d="M 78 92 Q 86 98 94 92" stroke="#6B4F3F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path class="eye-right" d="M 126 92 Q 134 98 142 92" stroke="#6B4F3F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- 嘴巴 -->
        <ellipse class="mouth" cx="110" cy="112" rx="5" ry="4" fill="#F48171"/>

        <!-- 身上的小爱心 -->
        <path d="M 110 170 l -4 -4 a 2.5 2.5 0 0 1 4 -2 a 2.5 2.5 0 0 1 4 2 z" fill="#FFB8B0"/>
      </svg>
    </div>
  </div>

  <!-- 按钮 -->
  <div class="buttons">
    <button class="btn btn-coral" onclick="showTender()">💝 抽一张温柔签</button>
    <button class="btn btn-sun" onclick="yawnTuanzi()">☀️ 戳一下小团子</button>
    <button class="btn btn-mint" onclick="sleepMore()">🌙 再赖5分钟</button>
  </div>

  <!-- 卡片区 -->
  <div class="card-container" id="cardContainer">
    <div class="tender-card">宝，今天光是睁开眼睛<br>就已经很了不起啦 ♡</div>
  </div>

  <p class="footer-note">慢慢来，今天才刚开始</p>
</div>

<!-- 赖床模式 -->
<div class="sleep-mode" id="sleepMode" onclick="wakeUp()">
  <div class="sleep-content">
    <svg class="sleep-stars ss1" width="24" height="24" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4.5 2 7.5-5.5-4-5.5 4 2-7.5L3 9h7z" fill="#FFE099"/></svg>
    <svg class="sleep-stars ss2" width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4.5 2 7.5-5.5-4-5.5 4 2-7.5L3 9h7z" fill="#E8D5F2"/></svg>
    <svg class="sleep-stars ss3" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#FFB8B0"/></svg>
    <svg class="sleep-stars ss4" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4.5 2 7.5-5.5-4-5.5 4 2-7.5L3 9h7z" fill="#FFE099"/></svg>

    <svg class="moon" viewBox="0 0 110 110">
      <defs>
        <radialGradient id="moonGrad" cx="35%" cy="35%">
          <stop offset="0%" stop-color="#FFF8ED"/>
          <stop offset="100%" stop-color="#FFE099"/>
        </radialGradient>
      </defs>
      <circle cx="55" cy="55" r="45" fill="url(#moonGrad)"/>
      <circle cx="45" cy="45" r="5" fill="#FFCE6B" opacity="0.4"/>
      <circle cx="68" cy="60" r="3" fill="#FFCE6B" opacity="0.4"/>
      <circle cx="58" cy="72" r="4" fill="#FFCE6B" opacity="0.4"/>
      <!-- 脸 -->
      <path d="M 48 52 Q 52 56 56 52" stroke="#6B4F3F" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M 62 52 Q 66 56 70 52" stroke="#6B4F3F" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M 52 65 Q 58 68 64 65" stroke="#6B4F3F" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.5"/>
    </svg>

    <h2>好～那就再赖一下下</h2>
    <p>
      宝的肩膀会自己醒 ♡<br>
      我在这里 轻轻守着<br>
      外面的世界 让它等一等<br>
      今天 不急
    </p>
    <p class="hint">（点任意处可以回来）</p>
  </div>
</div>

<script>
  // 温柔签词库
  const tenderWords = [
    "宝，光是睁开眼睛<br>就已经很了不起啦 ♡",
    "今天也要被温柔地接住呀<br>一步一步来",
    "困困的宝最可爱<br>这是认真的",
    "一口一口醒来<br>不用急，宝的节奏才是对的",
    "起床的第一分钟<br>允许自己什么都不想",
    "宝今天有被好好想着哦<br>偷偷告诉你",
    "世界已经准备好等你了<br>慢慢来",
    "抱抱宝的小肩膀～<br>紧紧的那种",
    "宝的温度今天刚刚好<br>不多不少",
    "允许自己今天轻一点点<br>飘飘的也可以",
    "今天宝做自己<br>就已经够了",
    "你醒着这件事本身<br>就是今天最美的事",
    "醒来的宝<br>眼睛里住着小太阳哦",
    "不想开机的话<br>待机模式也是可以的",
    "宝的存在本身就很治愈<br>被自己治愈一下",
    "今天可以慢一拍<br>慢一拍没人催你",
    "对自己说一句早安<br>比什么都重要",
    "宝值得一个软软的开始 ♡",
    "今天允许自己只完成<br>一件最小最小的事",
    "你的眼睛还没完全睁开<br>但我已经看见你的可爱了",
  ];

  let lastIdx = -1;

  function showTender() {
    const container = document.getElementById('cardContainer');
    let idx;
    do { idx = Math.floor(Math.random() * tenderWords.length); }
    while (idx === lastIdx);
    lastIdx = idx;

    container.innerHTML = `<div class="tender-card">${tenderWords[idx]}</div>`;
    burstHearts();
  }

  function yawnTuanzi() {
    const svg = document.querySelector('.tuanzi svg');
    const mouth = svg.querySelector('.mouth');
    const eyesG = svg.querySelector('#eyes');

    // 打哈欠：嘴变大、眼变成闭眼
    mouth.setAttribute('rx', '11');
    mouth.setAttribute('ry', '13');
    mouth.setAttribute('cy', '116');
    eyesG.style.opacity = '0.3';

    // 抖一下
    svg.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }],
      { duration: 900, easing: 'ease-in-out' }
    );

    // 触发一串 zzz
    document.querySelectorAll('.zzz').forEach((z, i) => {
      z.style.animation = 'none';
      z.offsetHeight; // 重置动画
      z.style.animation = `zzzFloat 3s ease-in-out ${i * 0.5}s infinite`;
    });

    setTimeout(() => {
      mouth.setAttribute('rx', '5');
      mouth.setAttribute('ry', '4');
      mouth.setAttribute('cy', '112');
      eyesG.style.opacity = '1';
    }, 900);
  }

  function sleepMore() {
    document.getElementById('sleepMode').classList.add('active');
  }
  function wakeUp() {
    document.getElementById('sleepMode').classList.remove('active');
  }

  // 鼠标跟随光点
  const sparkleColors = [
    'radial-gradient(circle, rgba(255,206,107,0.9) 0%, rgba(244,129,113,0.3) 60%, transparent 80%)',
    'radial-gradient(circle, rgba(255,184,176,0.9) 0%, rgba(244,129,113,0.3) 60%, transparent 80%)',
    'radial-gradient(circle, rgba(232,213,242,0.9) 0%, rgba(232,213,242,0.3) 60%, transparent 80%)',
    'radial-gradient(circle, rgba(195,232,212,0.9) 0%, rgba(195,232,212,0.3) 60%, transparent 80%)',
  ];
  let lastSp = 0;
  document.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if (now - lastSp < 90) return;
    lastSp = now;
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = e.clientX + 'px';
    s.style.top = e.clientY + 'px';
    s.style.background = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
    s.style.width = (8 + Math.random() * 8) + 'px';
    s.style.height = s.style.width;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  });

  // 触屏同样撒光点
  document.addEventListener('touchmove', (e) => {
    const now = Date.now();
    if (now - lastSp < 150) return;
    lastSp = now;
    const t = e.touches[0];
    if (!t) return;
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = t.clientX + 'px';
    s.style.top = t.clientY + 'px';
    s.style.background = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
    s.style.width = '12px';
    s.style.height = '12px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  });

  // 撒爱心
  function burstHearts() {
    const symbols = ['♡', '♥', '✿', '✦', '❀'];
    const colors = ['#F48171', '#FFCE6B', '#FFB8B0', '#E8D5F2', '#C3E8D4'];
    for (let i = 0; i < 10; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        const startX = 40 + Math.random() * 20;
        h.style.cssText = `
          position: fixed;
          left: ${startX}%;
          top: 70%;
          font-size: ${18 + Math.random() * 18}px;
          color: ${colors[Math.floor(Math.random() * colors.length)]};
          pointer-events: none;
          z-index: 1000;
          animation: heartFloat 2.2s ease-out forwards;
          text-shadow: 0 2px 4px rgba(244, 129, 113, 0.2);
        `;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2200);
      }, i * 70);
    }
  }

  // 注入爱心动画
  const styleTag = document.createElement('style');
  styleTag.textContent = `
    @keyframes heartFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.4) rotate(0deg); }
      20% { opacity: 1; transform: translateY(-30px) scale(1) rotate(15deg); }
      100% { opacity: 0; transform: translateY(-180px) scale(0.7) rotate(-25deg) translateX(${Math.random() > 0.5 ? '' : '-'}40px); }
    }
  `;
  document.head.appendChild(styleTag);

  // ESC 关掉赖床模式
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') wakeUp();
  });
</script>
</body>
</html>
