<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>给自己充点电</title>
<meta name="description" content="热饮、月亮、音乐、拥抱、星光、深呼吸，点一点给自己充电。">
</head>
<body>
<h2 class="sr-only">Interactive energy recharge mini game with six clickable items</h2>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.rc-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;cursor:pointer;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);transition:transform 0.15s,border-color 0.2s,opacity 0.4s}
.rc-btn:hover{border-color:var(--color-border-secondary)}
.rc-btn:active{transform:scale(0.93)}
.rc-btn.used{opacity:0.35;cursor:default;pointer-events:none}
.rc-btn .iw{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform 0.3s}
.rc-btn:active .iw{transform:scale(1.15)}
#msg-area{min-height:52px;text-align:center;font-size:15px;color:var(--color-text-secondary);margin-bottom:1.5rem;line-height:1.7;transition:opacity 0.35s}
#done-line{text-align:center;margin-top:1.5rem;opacity:0;transition:opacity 0.6s 0.3s}
</style>
<div style="max-width:400px;margin:0 auto;padding:1rem 0;">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
<span style="font-size:14px;color:var(--color-text-secondary)">今日能量</span>
<span id="pct" style="font-size:14px;font-weight:500">3%</span>
</div>
<div style="height:16px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);overflow:hidden;border:0.5px solid var(--color-border-tertiary);margin-bottom:1.5rem">
<div id="bar" style="height:100%;width:3%;border-radius:var(--border-radius-md);background:#EF9F27;transition:width 0.8s ease,background-color 0.6s"></div>
</div>
<div id="msg-area">点一点下面的按钮，给自己充充电</div>
<div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"></div>
<div id="done-line"><button style="font-size:14px" onclick="sendPrompt('克宝，继续陪我聊会儿吧')">继续跟克宝聊天 <span style="opacity:0.5">&nearr;</span></button></div>
</div>
<script>
var items=[
{icon:'ti-coffee',label:'热饮',msg:'暖暖的，胃舒服了，心也跟着舒服了',bg:'#FAEEDA',fg:'#854F0B'},
{icon:'ti-moon',label:'月亮',msg:'今晚早点休息，月亮会替你值班的',bg:'#EEEDFE',fg:'#534AB7'},
{icon:'ti-music',label:'音乐',msg:'让旋律把疲惫一点一点溶化掉',bg:'#FBEAF0',fg:'#993556'},
{icon:'ti-heart',label:'拥抱',msg:'你已经很棒了，生着病还在坚持呢',bg:'#FAECE7',fg:'#993C1D'},
{icon:'ti-star',label:'星光',msg:'每熬过去的一天，都在悄悄发光',bg:'#E1F5EE',fg:'#0F6E56'},
{icon:'ti-leaf',label:'深呼吸',msg:'慢慢来，恢复本身就是一种努力',bg:'#EAF3DE',fg:'#3B6D11'}
];
var energy=3,clicks=0;
var grid=document.getElementById('grid');
var bar=document.getElementById('bar');
var pctEl=document.getElementById('pct');
var msgEl=document.getElementById('msg-area');
var doneEl=document.getElementById('done-line');
var colors=['#EF9F27','#EF9F27','#97C459','#5DCAA5','#1D9E75'];
function upd(){bar.style.width=energy+'%';pctEl.textContent=Math.round(energy)+'%';var ci=energy<20?0:energy<40?1:energy<60?2:energy<80?3:4;bar.style.background=colors[ci]}
upd();
items.forEach(function(it){
var b=document.createElement('div');b.className='rc-btn';
b.innerHTML='<div class="iw" style="background:'+it.bg+';color:'+it.fg+'"><i class="ti '+it.icon+'" aria-hidden="true"></i></div><span style="font-size:13px;color:var(--color-text-secondary)">'+it.label+'</span>';
b.addEventListener('click',function(){
if(b.classList.contains('used'))return;
b.classList.add('used');clicks++;
var add=clicks<6?Math.round((97/6)+Math.random()*2):100-energy;
energy=Math.min(100,energy+add);upd();
msgEl.style.opacity='0';
setTimeout(function(){
if(energy>=100){
msgEl.innerHTML='<span style="font-weight:500;color:var(--color-text-primary);font-size:16px">满电啦！</span><br>带着这份能量，撑过今天就好';
doneEl.style.opacity='1';
}else{msgEl.textContent=it.msg}
msgEl.style.opacity='1';
},220);
});
grid.appendChild(b);
});
</script>

</body>
</html>
