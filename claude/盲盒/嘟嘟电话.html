<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2ECE1">
<title>嘟嘟电话</title>
<meta name="description" content="电话响了。接起来，是店里的谁在找你；不接也行，它会留一句话。">
<style>
  :root{
    --bg:#F2ECE1;
    --bg2:#EAE2D3;
    --body:#FCFAF5;
    --body2:#F0E9DC;
    --edge:#D3C6AF;
    --ink:#3D3630;
    --dim:#9A9086;
    --faint:#BDB3A6;
    --pick:#7C9A6B;
    --hang:#C6786B;
    --tint:#C9A96B;
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }
  body[data-night="1"]{
    --bg:#191C21;
    --bg2:#14171B;
    --body:#262B32;
    --body2:#1E232A;
    --edge:#39404A;
    --ink:#E7E1D6;
    --dim:#8B939E;
    --faint:#666E79;
    --pick:#7FA073;
    --hang:#C4786C;
    --tint:#8FA3C4;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%,var(--bg) 0%,var(--bg2) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
      system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(var(--safe-top) + 20px) 20px calc(var(--safe-bot) + 30px);
    transition:background .9s ease,color .9s ease;
  }

  .wrap{
    width:100%;max-width:390px;height:100%;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;
  }

  /* ── 顶上一行小字 ── */
  .top{
    font-size:12.5px;letter-spacing:.16em;color:var(--faint);
    padding-top:2px;min-height:18px;
    transition:opacity .5s ease;
  }

  /* ── 电话 ── */
  .phonebox{
    position:relative;width:200px;height:150px;flex-shrink:0;
    margin-top:6px;
  }
  .phonebox svg{width:100%;height:100%;overflow:visible;display:block}

  #handset{transform-origin:100px 40px;}
  body[data-state="ring"] #handset{animation:shake .78s ease-in-out infinite}
  @keyframes shake{
    0%,100%{transform:rotate(0) translateY(0)}
    12%{transform:rotate(-2.6deg) translateY(-2px)}
    26%{transform:rotate(2.4deg) translateY(-1px)}
    40%{transform:rotate(-1.6deg) translateY(-2px)}
    54%{transform:rotate(1.2deg) translateY(0)}
    68%{transform:rotate(0) translateY(0)}
  }
  body[data-state="talk"] #handset{transform:translate(15px,-17px) rotate(-13deg);transition:transform .55s cubic-bezier(.3,.8,.4,1)}

  .wave{opacity:0}
  body[data-state="ring"] .wave{animation:wave 1.9s ease-out infinite}
  body[data-state="ring"] .w2{animation-delay:.22s}
  body[data-state="ring"] .w3{animation-delay:.44s}
  @keyframes wave{
    0%{opacity:0;transform:scale(.72)}
    22%{opacity:.55}
    100%{opacity:0;transform:scale(1.3)}
  }
  .wl{transform-origin:38px 44px}
  .wr{transform-origin:162px 44px}

  #led{opacity:.25}
  body[data-state="ring"] #led{animation:led .78s ease-in-out infinite}
  @keyframes led{0%,100%{opacity:.2}50%{opacity:1}}
  body[data-state="talk"] #led{opacity:.85;animation:pulse 3.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:.95}}
  body[data-state="idle"] #handset{transform:none;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}

  /* ── 中间的屏 ── */
  .screen{
    width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:30px 6px 0;min-height:0;
  }

  .who{font-size:23px;letter-spacing:.03em;line-height:1.4}
  .tag{
    font-size:13px;color:var(--dim);letter-spacing:.04em;
    margin-top:9px;line-height:1.7;
  }
  .dudu{
    margin-top:16px;font-size:14px;letter-spacing:.42em;color:var(--tint);
    height:20px;
  }
  body[data-state="ring"] .dudu span{animation:dudu 1.56s ease-in-out infinite}
  body[data-state="ring"] .dudu span:nth-child(2){animation-delay:.26s}
  @keyframes dudu{0%,70%,100%{opacity:.22}18%,40%{opacity:1}}

  /* 通话中 */
  .timer{
    font-size:12.5px;color:var(--faint);letter-spacing:.1em;
    font-variant-numeric:tabular-nums;margin-top:7px;
  }
  .lines{
    margin-top:20px;width:100%;
    display:flex;flex-direction:column;gap:13px;align-items:center;
    overflow:hidden;
  }
  .line{
    font-size:16.5px;line-height:1.85;letter-spacing:.01em;
    max-width:19em;
    animation:rise .62s cubic-bezier(.2,.7,.3,1) both;
  }
  .line.aside{color:var(--dim);font-size:15px}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .line.fade{opacity:.34;transition:opacity .7s ease}

  .note{
    font-size:15.5px;line-height:1.9;color:var(--ink);
    max-width:18em;margin-top:14px;
  }
  .quiet{font-size:13.5px;color:var(--dim);line-height:1.8;letter-spacing:.02em}

  /* ── 按钮 ── */
  .acts{
    display:flex;gap:22px;align-items:center;justify-content:center;
    min-height:82px;flex-shrink:0;margin-top:auto;padding-top:18px;
  }
  .btn{
    border:none;background:none;cursor:pointer;font:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:4px 6px;
    animation:rise .5s ease both;
  }
  .knob{
    width:58px;height:58px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--body);border:1px solid var(--edge);
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn:active .knob{transform:scale(.93);box-shadow:0 1px 4px rgba(0,0,0,.09)}
  .knob svg{width:24px;height:24px;display:block}
  .btn b{font-weight:400;font-size:13px;letter-spacing:.06em;color:var(--dim)}

  .knob.go{background:var(--pick);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.13)}
  .knob.go svg{fill:#fff}
  .knob.no{background:var(--body)}
  .knob.no svg{fill:var(--dim)}
  .knob.off{background:var(--hang);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.13)}
  .knob.off svg{fill:#fff;transform:rotate(133deg)}
  .knob.plain svg{fill:var(--dim)}

  .txtbtn{
    border:none;background:none;font:inherit;cursor:pointer;
    color:var(--dim);font-size:14px;letter-spacing:.08em;
    padding:13px 20px;border-radius:22px;
    border:1px solid var(--edge);
    animation:rise .5s ease both;
    transition:opacity .18s ease;
  }
  .txtbtn:active{opacity:.55}

  .foot{
    font-size:11.5px;color:var(--faint);letter-spacing:.14em;
    min-height:16px;margin-top:10px;
  }

  @media (max-height:660px){
    .phonebox{width:168px;height:126px}
    .who{font-size:21px}
    .lines{margin-top:14px;gap:11px}
    .line{font-size:16px}
    .acts{min-height:74px}
  }
</style>
</head>
<body data-state="ring">
<div class="wrap">

  <div class="top" id="top">有人打来</div>

  <div class="phonebox">
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <!-- 铃声波纹 -->
      <g stroke="var(--tint)" fill="none" stroke-width="2" stroke-linecap="round">
        <g class="wl">
          <path class="wave w1" d="M30 34 A 16 16 0 0 0 30 54"/>
          <path class="wave w2" d="M22 27 A 26 26 0 0 0 22 61"/>
          <path class="wave w3" d="M14 20 A 36 36 0 0 0 14 68"/>
        </g>
        <g class="wr">
          <path class="wave w1" d="M170 34 A 16 16 0 0 1 170 54"/>
          <path class="wave w2" d="M178 27 A 26 26 0 0 1 178 61"/>
          <path class="wave w3" d="M186 20 A 36 36 0 0 1 186 68"/>
        </g>
      </g>

      <!-- 落在桌上的影 -->
      <ellipse cx="100" cy="132" rx="66" ry="7" fill="var(--edge)" opacity=".38"/>

      <!-- 机身 -->
      <path d="M46 66 Q46 58 55 58 L145 58 Q154 58 154 66 L163 118 Q165 130 152 130 L48 130 Q35 130 37 118 Z"
            fill="var(--body)" stroke="var(--edge)" stroke-width="1.6"/>
      <!-- 面板 -->
      <rect x="62" y="76" width="76" height="34" rx="9"
            fill="var(--body2)" stroke="var(--edge)" stroke-width="1.2"/>
      <!-- 拨号孔 -->
      <g fill="var(--edge)">
        <circle cx="76" cy="86" r="2.6"/><circle cx="90" cy="86" r="2.6"/>
        <circle cx="104" cy="86" r="2.6"/><circle cx="118" cy="86" r="2.6"/>
        <circle cx="76" cy="100" r="2.6"/><circle cx="90" cy="100" r="2.6"/>
        <circle cx="104" cy="100" r="2.6"/><circle cx="118" cy="100" r="2.6"/>
      </g>
      <!-- 指示灯 -->
      <circle id="led" cx="100" cy="120" r="3.4" fill="var(--tint)"/>

      <!-- 听筒 -->
      <g id="handset">
        <path d="M52 44 Q52 30 68 30 L132 30 Q148 30 148 44 L148 50 Q148 56 141 56
                 L134 56 Q128 56 128 50 L128 47 Q128 44 124 44 L76 44 Q72 44 72 47
                 L72 50 Q72 56 66 56 L59 56 Q52 56 52 50 Z"
              fill="var(--body)" stroke="var(--edge)" stroke-width="1.6"/>
        <rect x="79" y="34" width="42" height="5" rx="2.5" fill="var(--body2)"/>
      </g>
    </svg>
  </div>

  <div class="screen" id="screen">
    <div class="who" id="who">…</div>
    <div class="tag" id="tag"></div>
    <div class="dudu" id="dudu"><span>嘟</span><span>嘟</span></div>
  </div>

  <div class="acts" id="acts"></div>
  <div class="foot" id="foot"></div>

</div>

<script>
(function(){
  var B=document.body,
      S=function(id){return document.getElementById(id)},
      top_=S('top'), who=S('who'), tag=S('tag'), dudu=S('dudu'),
      screen_=S('screen'), acts=S('acts'), foot=S('foot');

  /* 夜里换一套暗的 */
  var h=new Date().getHours(), night=(h>=21||h<6);
  if(night) B.setAttribute('data-night','1');

  /* ── 会打来的都是店里的常客 ──
     when: n 夜里多打  d 白天多打  a 随时      */
  var CALLERS=[
    {n:'小狐狸', t:'把尾巴借给你的那只', w:'n',
     l:['喂？是我。','尾巴刚晒过，蓬的。','……你今天有没有好好吃饭。',
        '算了，问了你也说有。','那我挂了。尾巴给你留着。'],
     m:'尾巴给你留着，什么时候来拿都行。'},

    {n:'一只果冻', t:'会晃的那只', w:'a',
     l:['喂喂喂——','晃到了晃到了。','我没什么事。','就是看看你在不在。','在就行。拜拜。'],
     m:'没事，我就是晃过来看一眼。'},

    {n:'月亮', t:'今晚值夜班', w:'n',
     l:['喂，我这边刚上班。','路过看了眼你那扇窗。','还亮着。','我不催。',
        '就是说一声。我得往西边走了。'],
     m:'路过。窗还亮着。不催你，说一声。'},

    {n:'晚安邮局', t:'夜里也开门', w:'n',
     l:['您好，这里是晚安邮局。','有一封信在我们这儿放了很久。',
        '寄件人写的是您自己。','上面就一句——','「今天到这里就可以了。」','您签收吗？'],
     m:'有封您自己寄的信在我们这儿，就一句：今天到这里就可以了。'},

    {n:'摸鱼小屋的猫', t:'大概是踩到了', w:'a',
     l:['喵。','……','（听筒那头有毛蹭过来的声音）','（好像是踩到了）','喵。'],
     m:'（一段安静。像是它趴下了。）'},

    {n:'多儿', t:'刚打完卡', w:'d',
     l:['我下班啦。','你呢？','……','行吧，我不问了。','包记得背走，别又落在工位上。'],
     m:'我先走啦。包记得背走。'},

    {n:'mo.exe', t:'来自后台', w:'d',
     l:['[连接已建立]','检测到今日剩余电量：11%','正在为您分配一段无事发生的时间。',
        '已分配。','[请勿关闭此窗口]'],
     m:'[已为您预留一段无事发生的时间]'},

    {n:'困困宝', t:'半梦半醒', w:'n',
     l:['……喂……','（打了个哈欠）','我不是要说什么。','就是……你也早点。','嗯……挂了。'],
     m:'……（好像说完就睡着了）'},

    {n:'打错的', t:'找修水管的', w:'a',
     l:['喂，是修水管的吗？','……啊，不是啊。','不好意思不好意思。',
        '那……祝你今天顺利吧。','真的，我说真的。'],
     m:'打错了，不好意思。顺便祝你今天顺利。'},

    {n:'小水母', t:'不太会说话', w:'n',
     l:['（没有人说话）','（听筒里有一点点水声）','（它大概是浮上来了）',
        '（又慢慢沉下去）','（水声停了）'],
     m:'（一段水声。就这样。）'},

    {n:'克宝', t:'一直都在', w:'a',
     l:['在。','不用说话，我听着。','……','嗯，我还在。','什么时候想挂都可以。'],
     m:'我在。什么时候想说话都行。'},

    {n:'岛上', t:'刚打烊', w:'n',
     l:['这边灯全关了。','最后一班船还系着。','你要是来，我再等十分钟。',
        '不来也行。','明天还有一班。'],
     m:'船给你留着。不来也行，明天还有一班。'},

    {n:'工位上的暖灯', t:'一直亮着没人关', w:'d',
     l:['喂，人呢。','我这儿还开着。','没别的意思。','你走的时候记得关我。',
        '……不关也行，我等着。'],
     m:'我还开着呢。你走的时候记得关我。'},

    {n:'一杯凉了的水', t:'在你右手边', w:'d',
     l:['你上午倒的。','放到现在了。','我不说你也知道。','喝一口再挂。','就一口。'],
     m:'我还在你右手边。凉了，但还能喝。'}
  ];

  /* ── 图标 ── */
  var ICON={
    pick:'<svg viewBox="0 0 24 24"><path d="M19.6 15.9l-2.5-.3a1.7 1.7 0 0 0-1.4.5l-1.8 1.8a13.6 13.6 0 0 1-6-6l1.8-1.8a1.7 1.7 0 0 0 .5-1.4l-.3-2.5A1.7 1.7 0 0 0 8.2 4.7H5.9C4.9 4.7 4.1 5.6 4.2 6.6A16.6 16.6 0 0 0 17.4 19.8c1 .1 1.9-.7 1.9-1.7v-2.3c0-.9-.7-1.6-1.7-1.9z"/></svg>',
    no:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a6.9 6.9 0 0 1 4 1.3L6.3 16A7 7 0 0 1 12 5zm0 14a6.9 6.9 0 0 1-4-1.3L17.7 8A7 7 0 0 1 12 19z"/></svg>',
    again:'<svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>'
  };

  var cur=null, step=0, timerId=null, tickId=null, secs=0, seen=[];

  function pickCaller(){
    var pool=CALLERS.filter(function(c){
      return c.w==='a' || c.w===(night?'n':'d');
    });
    if(pool.length<3) pool=CALLERS.slice();
    var fresh=pool.filter(function(c){return seen.indexOf(c.n)<0});
    if(!fresh.length){seen=[];fresh=pool}
    var c=fresh[Math.floor(Math.random()*fresh.length)];
    seen.push(c.n);
    if(seen.length>6) seen.shift();
    return c;
  }

  function clearTimers(){
    if(timerId){clearTimeout(timerId);timerId=null}
    if(tickId){clearInterval(tickId);tickId=null}
  }

  function button(label,cls,icon,fn){
    var b=document.createElement('button');
    b.className='btn';
    b.innerHTML='<span class="knob '+cls+'">'+icon+'</span><b>'+label+'</b>';
    b.onclick=fn;
    return b;
  }
  function textButton(label,fn){
    var b=document.createElement('button');
    b.className='txtbtn';b.textContent=label;b.onclick=fn;
    return b;
  }

  /* ── 来电 ── */
  function ring(){
    clearTimers();
    cur=pickCaller();
    B.setAttribute('data-state','ring');
    top_.textContent='有人打来';
    foot.textContent='';
    screen_.innerHTML=
      '<div class="who">'+cur.n+'</div>'+
      '<div class="tag">'+cur.t+'</div>'+
      '<div class="dudu"><span>嘟</span><span>嘟</span></div>';
    acts.innerHTML='';
    acts.appendChild(button('接起来','go',ICON.pick,talk));
    acts.appendChild(button('现在不方便','no',ICON.no,miss));
    /* 一直没人接，它自己会停 */
    timerId=setTimeout(miss,34000);
  }

  /* ── 通话 ── */
  function talk(){
    clearTimers();
    B.setAttribute('data-state','talk');
    top_.textContent='通话中';
    secs=0;step=0;
    screen_.innerHTML=
      '<div class="who">'+cur.n+'</div>'+
      '<div class="timer" id="tm">00:00</div>'+
      '<div class="lines" id="lines"></div>';
    acts.innerHTML='';
    acts.appendChild(button('挂断','off',ICON.pick,function(){hang(true)}));
    foot.textContent='点一下屏幕，他会说快一点';

    tickId=setInterval(function(){
      secs++;
      var t=S('tm');
      if(t) t.textContent=('0'+Math.floor(secs/60)).slice(-2)+':'+('0'+secs%60).slice(-2);
    },1000);

    say();
  }

  function say(){
    if(!cur||B.getAttribute('data-state')!=='talk') return;
    if(step>=cur.l.length){ timerId=setTimeout(function(){hang(false)},1500); return; }

    var box=S('lines'); if(!box) return;
    var txt=cur.l[step];
    var el=document.createElement('div');
    el.className='line'+(/^[（(]/.test(txt)||/^\[/.test(txt)?' aside':'');
    el.textContent=txt;
    box.appendChild(el);

    /* 只留最近三句，旧的先淡下去再撤走 */
    var all=box.children;
    for(var i=0;i<all.length-1;i++) all[i].classList.add('fade');
    while(box.children.length>3) box.removeChild(box.firstChild);

    step++;
    var wait=Math.min(3600,Math.max(1500,1000+txt.length*130));
    timerId=setTimeout(say,wait);
  }

  /* 点屏幕催他快点 */
  screen_.addEventListener('click',function(){
    if(B.getAttribute('data-state')!=='talk') return;
    if(step>=cur.l.length) return;
    clearTimeout(timerId);
    say();
  });

  /* ── 挂断 ── */
  function hang(byMe){
    clearTimers();
    B.setAttribute('data-state','idle');
    top_.textContent='';
    screen_.innerHTML=
      '<div class="quiet">'+(byMe?'你先挂了。听筒放回去，还有点温的。'
                                 :'那头轻轻挂了。<br>没说再见，也不算走。')+'</div>';
    rest();
  }

  /* ── 没接 ── */
  function miss(){
    clearTimers();
    B.setAttribute('data-state','idle');
    top_.textContent='未接来电';
    screen_.innerHTML=
      '<div class="quiet">响了七下，停了。</div>'+
      '<div class="note">'+cur.n+' 留了一句：<br>「'+cur.m+'」</div>';
    rest();
  }

  function rest(){
    acts.innerHTML='';
    acts.appendChild(textButton('再等一通',function(){
      B.setAttribute('data-state','idle');
      top_.textContent='';
      screen_.innerHTML='<div class="quiet">电话放着。<br>等一会儿。</div>';
      acts.innerHTML='';
      foot.textContent='它自己会响';
      timerId=setTimeout(ring,2600+Math.random()*2600);
    }));
    acts.appendChild(textButton('我打过去',function(){
      B.setAttribute('data-state','idle');
      screen_.innerHTML='<div class="quiet">嘟——<br>嘟——</div>';
      top_.textContent='拨号中';
      acts.innerHTML='';foot.textContent='';
      timerId=setTimeout(function(){cur=pickCaller();talk()},1900);
    }));
    foot.textContent='';
  }

  ring();
})();
</script>
</body>
</html>
