<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>揪出伪装的困困宝</title>
<meta name="description" content="验证 coffee.exe 的签名——咖啡因含量 0.0mg，是困困宝装的。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem}
.panel-hd{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--color-text-secondary);margin-bottom:14px;font-family:var(--font-mono)}
.panel-hd-l{display:flex;align-items:center;gap:6px}
.panel-hd i{font-size:16px}
.stage{text-align:center}
.ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 10px;border:0.5px solid}
.ic.w{background:var(--color-background-warning);color:var(--color-text-warning);border-color:var(--color-text-warning)}
.ic.d{background:var(--color-background-danger);color:var(--color-text-danger);border-color:var(--color-text-danger)}
.ic.s{background:var(--color-background-success);color:var(--color-text-success);border-color:var(--color-text-success)}
.proc-name{font-size:16px;font-weight:500;margin:0;display:flex;align-items:center;justify-content:center;gap:8px}
.proc-meta{font-size:12px;color:var(--color-text-secondary);margin:3px 0 0;font-family:var(--font-mono)}
.bdg{font-size:12px;padding:3px 10px;border-radius:var(--border-radius-md);font-weight:500}
.bdg.w{background:var(--color-background-warning);color:var(--color-text-warning)}
.bdg.d{background:var(--color-background-danger);color:var(--color-text-danger)}
.detail{border-top:0.5px solid var(--color-border-tertiary);margin-top:12px;padding-top:10px;text-align:left}
.row{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.row.al{color:var(--color-text-danger)}
.row.ok i{color:var(--color-text-success)}
.row i{font-size:16px;flex-shrink:0}
.quip{font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin:12px 0;text-align:left;background:var(--color-background-secondary);padding:9px 11px;border-radius:var(--border-radius-md)}
.act{margin-top:14px}
.btn-d{color:var(--color-text-danger);border-color:var(--color-text-danger)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
</style>

<h2 class="sr-only">进程查杀小剧场：验证可疑的咖啡进程签名，揭穿伪装的困困宝并强制清除。</h2>

<div class="panel">
  <div class="panel-hd"><div class="panel-hd-l"><i class="ti ti-shield-lock" aria-hidden="true"></i>进程鉴定沙箱</div><span>Anti-Sleep v0.41</span></div>
  <div id="stage"></div>
</div>

<script>
const stage=document.getElementById('stage');
const panel=document.querySelector('.panel');

function s1(){
  stage.innerHTML='<div class="stage"><div class="ic w"><i class="ti ti-coffee" aria-hidden="true"></i></div><p class="proc-name">coffee.exe <span class="bdg w">疑似</span></p><p class="proc-meta">PID 0941 · origin: unknown</p><div class="detail"><div class="row al"><i class="ti ti-x" aria-hidden="true"></i>signature mismatch</div><div class="row al"><i class="ti ti-x" aria-hidden="true"></i>咖啡因含量 0.0mg</div></div><div class="act"><button id="verify">验证数字签名 <i class="ti ti-fingerprint" style="font-size:15px;vertical-align:-2px;margin-left:2px" aria-hidden="true"></i></button></div></div>';
  stage.style.animation='fadein .3s ease';
  document.getElementById('verify').addEventListener('click',reveal);
}

function reveal(){
  stage.style.animation='shake .4s ease';
  setTimeout(s2,220);
}

function s2(){
  stage.innerHTML='<div class="stage"><div class="ic d"><i class="ti ti-zzz" aria-hidden="true"></i></div><p class="proc-name">困困宝.dll <span class="bdg d">恶意进程</span></p><p class="proc-meta">伪装率 99.8% · masquerading</p><div class="detail"><div class="row al"><i class="ti ti-x" aria-hidden="true"></i>套壳冒充 coffee.exe</div><div class="row al"><i class="ti ti-x" aria-hidden="true"></i>真实成分：纯困意 + 0 咖啡因</div></div><div class="act"><button id="kill" class="btn-d">kill -9 强制查杀 <i class="ti ti-x" style="font-size:15px;vertical-align:-2px;margin-left:2px" aria-hidden="true"></i></button></div></div>';
  stage.style.animation='fadein .3s ease';
  document.getElementById('kill').addEventListener('click',s3);
}

function s3(){
  stage.innerHTML='<div class="stage"><div class="ic s"><i class="ti ti-shield-check" aria-hidden="true"></i></div><p class="proc-name">威胁已清除</p><p class="proc-meta">困困宝.dll terminated</p><div class="detail"><div class="row ok"><i class="ti ti-check" aria-hidden="true"></i>困困宝.dll 已 kill -9</div><div class="row ok"><i class="ti ti-check" aria-hidden="true"></i>真·coffee.exe 注入排队 (T+20min)</div><div class="row ok"><i class="ti ti-check" aria-hidden="true"></i>清醒宝 已恢复指挥权</div></div><p class="quip">清醒宝：哼，山寨货也想骗过我。等真咖啡到岗，我们就满血——宝，撑住。</p><div class="act"><button id="rescan">重新扫描 <i class="ti ti-refresh" style="font-size:15px;vertical-align:-2px;margin-left:2px" aria-hidden="true"></i></button></div></div>';
  stage.style.animation='fadein .3s ease';
  document.getElementById('rescan').addEventListener('click',s1);
}

s1();
</script>
</body>
</html>
