<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天，一件一件来</title>
<meta name="description" content="被切碎的一天，把小事一条条丢进来，勾掉一件是一件；挑不动的时候按「帮我挑一件」。">
<style>
  :root{
    --bg:        #EFEDF4;
    --paper:     #FCFBFE;
    --ink:       #3A3542;
    --ink-soft:  #7A7386;
    --ink-faint: #ADA6B8;
    --line:      #E4E0EC;
    --violet:    #8E80B8;
    --violet-pale:#DCD5EC;
    --warm:      #E6B15E;
    --warm-bg:   #FBF0DC;
    --top-safe:  56px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",
                "Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    font-size:17px;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    transition:background .9s ease;
  }
  body.all-done{ background:#F3EFE7; }

  .sheet{
    width:100%;
    max-width:460px;
    min-height:100%;
    padding:var(--top-safe) 22px 48px;
    display:flex;
    flex-direction:column;
  }

  /* ── 顶部 ─────────────────────────── */
  .today{
    font-size:26px;
    letter-spacing:.06em;
    font-weight:500;
    margin:0;
  }
  .status{
    font-size:14px;
    color:var(--ink-soft);
    letter-spacing:.03em;
    margin:2px 0 0;
    min-height:1.8em;
  }
  .carried{
    font-size:13px;
    color:var(--ink-faint);
    letter-spacing:.03em;
    margin:14px 0 0;
    cursor:pointer;
  }
  .carried[hidden]{ display:none; }

  /* ── 纸面 ─────────────────────────── */
  .paper{
    background:var(--paper);
    border-radius:22px;
    margin:26px 0 0;
    padding:8px 0;
    box-shadow:0 1px 2px rgba(58,53,66,.04), 0 8px 24px -12px rgba(58,53,66,.10);
    transition:background .9s ease;
  }

  ul{ list-style:none; margin:0; padding:0; }

  li{
    display:flex;
    align-items:flex-start;
    gap:13px;
    padding:13px 20px;
    position:relative;
    transition:opacity .35s ease, transform .35s ease, background .35s ease;
  }
  li + li::before{
    content:"";
    position:absolute; left:52px; right:20px; top:0;
    height:1px; background:var(--line);
  }
  li.leaving{ opacity:0; transform:translateX(26px); }

  /* 勾选圈 */
  .box{
    flex:none;
    width:23px; height:23px;
    margin-top:5px;
    border:1.6px solid var(--ink-faint);
    border-radius:50%;
    background:none;
    padding:0;
    cursor:pointer;
    display:grid; place-items:center;
    transition:border-color .25s ease, background .25s ease;
  }
  .box:hover{ border-color:var(--violet); }
  .box:focus-visible{ outline:2px solid var(--violet); outline-offset:3px; }
  .box svg{ width:13px; height:13px; display:block; }
  .box path{
    fill:none; stroke:#fff; stroke-width:2.4;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:18; stroke-dashoffset:18;
    transition:stroke-dashoffset .3s cubic-bezier(.5,0,.2,1) .05s;
  }
  li.done .box{ border-color:var(--violet); background:var(--violet); }
  li.done .box path{ stroke-dashoffset:0; }

  /* 任务文字 */
  .text{
    flex:1;
    word-break:break-word;
    position:relative;
    transition:color .35s ease;
  }
  .text::after{
    content:"";
    position:absolute; left:0; top:.95em;
    width:0; height:1.4px;
    background:var(--ink-faint);
    transition:width .32s cubic-bezier(.5,0,.2,1);
  }
  li.done .text{ color:var(--ink-faint); }
  li.done .text::after{ width:100%; }

  /* 删除 */
  .del{
    flex:none;
    width:26px; height:26px;
    margin-top:3px;
    border:0; background:none; padding:0;
    color:var(--ink-faint);
    font-size:19px; line-height:1;
    cursor:pointer;
    opacity:0;
    transition:opacity .2s ease, color .2s ease;
  }
  li:hover .del, .del:focus-visible{ opacity:1; }
  .del:hover{ color:var(--ink-soft); }
  @media (hover:none){ .del{ opacity:.5; } }

  /* 已完成分段 */
  .divider{
    padding:20px 20px 8px;
    font-size:13px;
    letter-spacing:.06em;
    color:var(--ink-faint);
  }
  .divider[hidden]{ display:none; }

  /* 空 & 全清 */
  .empty{
    padding:34px 20px 36px;
    color:var(--ink-soft);
    font-size:15px;
    line-height:2;
  }
  .empty span{ display:block; color:var(--ink-faint); font-size:13.5px; margin-top:6px; }
  .empty[hidden]{ display:none; }

  /* ── 输入 ─────────────────────────── */
  .add{
    display:flex; align-items:center; gap:13px;
    margin:18px 4px 0;
  }
  .plus{
    flex:none; width:23px; height:23px;
    display:grid; place-items:center;
    color:var(--ink-faint); font-size:20px; line-height:1;
    user-select:none;
  }
  #entry{
    flex:1;
    border:0; background:none;
    font:inherit; color:var(--ink);
    padding:6px 0;
    border-bottom:1.4px solid transparent;
    transition:border-color .25s ease;
  }
  #entry::placeholder{ color:var(--ink-faint); }
  #entry:focus{ outline:none; border-bottom-color:var(--violet-pale); }

  /* ── 挑一件 ────────────────────────── */
  .pick{
    margin:auto 0 0;
    padding-top:40px;
    text-align:center;
  }
  .pick-hint{
    font-size:13px; color:var(--ink-faint);
    letter-spacing:.04em; margin:0 0 12px;
  }
  #pickBtn{
    font:inherit; font-size:15px;
    color:var(--ink-soft);
    background:none;
    border:1.4px solid var(--line);
    border-radius:999px;
    padding:9px 26px;
    cursor:pointer;
    letter-spacing:.05em;
    transition:border-color .25s ease, color .25s ease, background .25s ease;
  }
  #pickBtn:hover{ border-color:var(--warm); color:#9A7430; background:var(--warm-bg); }
  #pickBtn:focus-visible{ outline:2px solid var(--warm); outline-offset:3px; }
  #pickBtn[disabled]{ opacity:.35; cursor:default; }
  #pickBtn[disabled]:hover{ border-color:var(--line); color:var(--ink-soft); background:none; }

  /* 聚光：整页冷下去，只有这一件是暖的 */
  body.spotlight li{ opacity:.22; }
  body.spotlight li.chosen{
    opacity:1;
    background:var(--warm-bg);
    border-radius:16px;
    transform:scale(1.015);
  }
  body.spotlight li.chosen .box{ border-color:var(--warm); }
  body.spotlight li.chosen::before,
  body.spotlight li.chosen + li::before{ opacity:0; }
  body.spotlight .divider,
  body.spotlight .empty{ opacity:.22; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div class="sheet">

  <h1 class="today" id="today"></h1>
  <p class="status" id="status"></p>
  <p class="carried" id="carried" hidden></p>

  <div class="paper" id="paper">
    <p class="empty" id="empty">
      今天有什么被切碎的小事？一条一条丢进来就好。
      <span>不用排序，也不用写全，想到什么先放什么。</span>
    </p>
    <ul id="todoList"></ul>
    <p class="divider" id="divider" hidden></p>
    <ul id="doneList"></ul>
  </div>

  <div class="add">
    <span class="plus" aria-hidden="true">+</span>
    <input id="entry" type="text" placeholder="写一件小事，回车放进去" autocomplete="off" maxlength="80">
  </div>

  <div class="pick">
    <p class="pick-hint" id="pickHint">挑不动的时候，让它替你挑</p>
    <button id="pickBtn" type="button">帮我挑一件</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ── 存住：能存就存，存不了就当天用 ── */
  var KEY = "mo-today-list-v1";
  var mem = null;
  function save(o){
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){ mem = o; }
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return mem; }
  }

  var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  var NUM  = ["零","一","二","三","四","五","六","七","八","九","十"];
  function cn(n){
    if(n <= 10) return NUM[n];
    if(n < 20)  return "十" + (n%10 ? NUM[n%10] : "");
    return NUM[Math.floor(n/10)] + "十" + (n%10 ? NUM[n%10] : "");
  }
  function stamp(d){
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }

  var d = new Date();
  var TODAY = stamp(d);
  document.getElementById("today").textContent =
    cn(d.getMonth()+1) + "月" + cn(d.getDate()) + "日　" + WEEK[d.getDay()];

  /* ── 数据 ── */
  var items = [];
  var saved = load();
  var carriedCount = 0;

  if(saved && saved.items){
    if(saved.date === TODAY){
      items = saved.items;
    }else{
      // 换了一天：做完的留在昨天，没做完的带过来
      items = saved.items.filter(function(it){ return !it.done; });
      carriedCount = items.length;
    }
  }

  if(carriedCount){
    var c = document.getElementById("carried");
    c.textContent = "上次还剩 " + carriedCount + " 件没做完，帮你带过来了";
    c.hidden = false;
    c.addEventListener("click", function(){ c.hidden = true; });
  }

  function persist(){ save({ date:TODAY, items:items }); }

  /* ── 元素 ── */
  var todoList = document.getElementById("todoList"),
      doneList = document.getElementById("doneList"),
      divider  = document.getElementById("divider"),
      empty    = document.getElementById("empty"),
      status   = document.getElementById("status"),
      entry    = document.getElementById("entry"),
      pickBtn  = document.getElementById("pickBtn"),
      pickHint = document.getElementById("pickHint");

  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.3l3 3 6.2-6.6"/></svg>';

  function row(it){
    var li = document.createElement("li");
    li.dataset.id = it.id;
    if(it.done) li.className = "done";

    var box = document.createElement("button");
    box.type = "button";
    box.className = "box";
    box.innerHTML = CHECK;
    box.setAttribute("aria-label", it.done ? "取消完成" : "标记完成");
    box.addEventListener("click", function(e){ e.stopPropagation(); toggle(it.id); });

    var tx = document.createElement("div");
    tx.className = "text";
    tx.textContent = it.text;

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.innerHTML = "&times;";
    del.setAttribute("aria-label", "删掉这条");
    del.addEventListener("click", function(e){ e.stopPropagation(); remove(it.id, li); });

    li.appendChild(box); li.appendChild(tx); li.appendChild(del);
    return li;
  }

  function render(){
    todoList.innerHTML = "";
    doneList.innerHTML = "";

    var open = items.filter(function(i){ return !i.done; });
    var shut = items.filter(function(i){ return  i.done; });

    open.forEach(function(it){ todoList.appendChild(row(it)); });
    shut.forEach(function(it){ doneList.appendChild(row(it)); });

    empty.hidden    = items.length > 0;
    divider.hidden  = shut.length === 0;
    divider.textContent = "做完了 " + shut.length + " 件";

    if(items.length === 0){
      status.textContent = "";
    }else if(open.length === 0){
      status.textContent = "今天的小块，都拼完了。";
    }else{
      status.textContent = "还剩 " + open.length + " 件"
        + (shut.length ? "，已经放下 " + shut.length + " 件了" : "");
    }

    document.body.classList.toggle("all-done", items.length > 0 && open.length === 0);
    pickBtn.disabled = open.length < 1;
    if(open.length < 1) unspot();
  }

  function add(text){
    text = text.trim();
    if(!text) return;
    items.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
                 text: text, done:false });
    persist(); unspot(); render();
  }

  function toggle(id){
    items.forEach(function(it){ if(it.id === id) it.done = !it.done; });
    var li = document.querySelector('li[data-id="'+id+'"]');
    if(li){
      li.classList.toggle("done");                 // 先让勾画出来
      persist();
      setTimeout(render, 420);                     // 再让它挪位置
    }else{
      persist(); render();
    }
    unspot();
  }

  function remove(id, li){
    li.classList.add("leaving");
    items = items.filter(function(it){ return it.id !== id; });
    persist();
    setTimeout(render, 300);
  }

  /* ── 帮我挑一件 ── */
  var chosenId = null;

  function spot(){
    var open = items.filter(function(i){ return !i.done; });
    if(!open.length) return;
    var pool = open.filter(function(i){ return i.id !== chosenId; });
    if(!pool.length) pool = open;
    chosenId = pool[Math.floor(Math.random() * pool.length)].id;

    document.querySelectorAll("li").forEach(function(li){
      li.classList.toggle("chosen", li.dataset.id === chosenId);
    });
    document.body.classList.add("spotlight");
    pickBtn.textContent = "换一件";
    pickHint.textContent = "就它了，别的等下再说";
  }

  function unspot(){
    if(!document.body.classList.contains("spotlight")) return;
    document.body.classList.remove("spotlight");
    document.querySelectorAll("li.chosen").forEach(function(li){
      li.classList.remove("chosen");
    });
    chosenId = null;
    pickBtn.textContent = "帮我挑一件";
    pickHint.textContent = "挑不动的时候，让它替你挑";
  }

  pickBtn.addEventListener("click", function(e){ e.stopPropagation(); spot(); });
  document.addEventListener("click", function(e){
    if(document.body.classList.contains("spotlight") && !e.target.closest("li")) unspot();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") unspot();
  });

  entry.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ add(entry.value); entry.value = ""; }
  });

  render();
})();
</script>
</body>
</html>
