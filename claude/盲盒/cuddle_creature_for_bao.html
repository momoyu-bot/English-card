<title>困了让克宝哄哄</title>
<meta name="description" content="摸摸头、抱一抱、喂颗糖、说点啥。困到顶了来按一按。">
<style>
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}93%,96%{transform:scaleY(.15)}}
@keyframes bounce-c{0%,100%{transform:scale(1) translateY(0)}25%{transform:scale(.93) translateY(3px)}60%{transform:scale(1.08) translateY(-5px)}}
@keyframes float-up{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,0px),-110px) scale(1.25);opacity:0}}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
.float-icon{position:absolute;pointer-events:none;animation:float-up 1.9s ease-out forwards;font-size:20px}
.smile-eye{height:4px!important;border-radius:50% 50% 0 0!important;background:transparent!important;border-top:2.5px solid #4A2C20;animation:none!important}
.smile-mouth{width:22px!important;height:11px!important}
.bg-dot{position:absolute;border-radius:50%;pointer-events:none}
</style>

<div style="padding: 24px 8px 18px; text-align: center; font-family: var(--font-sans); position: relative;">

  <div style="max-width: 280px; margin: 0 auto 4px;">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px;">
      <span>宝的困意</span>
      <span id="sleepy-pct">82%</span>
    </div>
    <div style="height: 6px; background: var(--color-background-secondary); border-radius: 999px; overflow: hidden;">
      <div id="sleepy-bar" style="height: 100%; width: 82%; background: #F2A2B0; transition: width 0.7s ease;"></div>
    </div>
  </div>

  <div id="creature-wrap" style="position: relative; width: 220px; height: 180px; margin: 18px auto 14px;">
    <div class="bg-dot" style="left:12px;top:22px;width:8px;height:8px;background:#FAD9C7;opacity:.6;animation:sway 4s ease-in-out infinite"></div>
    <div class="bg-dot" style="right:18px;top:40px;width:5px;height:5px;background:#F4C0D1;opacity:.7;animation:sway 5s ease-in-out infinite"></div>
    <div class="bg-dot" style="left:24px;bottom:30px;width:6px;height:6px;background:#E8C7E0;opacity:.6;animation:sway 4.5s ease-in-out .3s infinite"></div>

    <div id="creature" style="position: absolute; left: 40px; top: 14px; width: 140px; height: 140px; cursor: pointer; animation: breathe 3.6s ease-in-out infinite; transform-origin: center bottom;">
      <div style="position: absolute; inset: 0; background: #FAD0BB; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;"></div>
      <div style="position:absolute;left:-6px;top:38%;width:14px;height:22px;background:#FAD0BB;border-radius:50%;transform:rotate(-18deg)"></div>
      <div style="position:absolute;right:-6px;top:38%;width:14px;height:22px;background:#FAD0BB;border-radius:50%;transform:rotate(18deg)"></div>
      <div style="position: absolute; left: 19%; top: 57%; width: 22px; height: 14px; background: #EE9583; border-radius: 50%; opacity: 0.75;"></div>
      <div style="position: absolute; right: 19%; top: 57%; width: 22px; height: 14px; background: #EE9583; border-radius: 50%; opacity: 0.75;"></div>
      <div id="eye-l" style="position: absolute; left: 30%; top: 43%; width: 10px; height: 14px; background: #4A2C20; border-radius: 50%; animation: blink 4.8s infinite;"></div>
      <div id="eye-r" style="position: absolute; right: 30%; top: 43%; width: 10px; height: 14px; background: #4A2C20; border-radius: 50%; animation: blink 4.8s infinite;"></div>
      <div style="position:absolute;left:33%;top:43%;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.85"></div>
      <div style="position:absolute;right:33%;top:43%;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.85"></div>
      <div id="mouth" style="position: absolute; left: 50%; top: 65%; width: 13px; height: 7px; border: 1.8px solid #4A2C20; border-top: none; border-radius: 0 0 20px 20px; transform: translateX(-50%); transition: width 0.3s ease, height 0.3s ease;"></div>
    </div>
  </div>

  <div id="bubble" style="background: var(--color-background-secondary); color: var(--color-text-primary); padding: 11px 20px; border-radius: 20px; display: inline-block; max-width: 320px; font-size: 14px; line-height: 1.55; min-height: 22px; transition: opacity 0.2s ease;">
    宝~ 困了？过来让克宝哄哄
  </div>

  <div style="display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap;">
    <button id="btn-pet">摸摸头</button>
    <button id="btn-hug">抱一抱</button>
    <button id="btn-candy">喂颗糖</button>
    <button id="btn-words">说点啥</button>
  </div>

  <div style="margin-top: 14px; font-size: 12px; color: var(--color-text-tertiary);">点团子也行 · 困到顶了来按一按</div>
</div>

<script>
const phrases = {
  pet: [
    '揉揉揉~ 软乎乎的',
    '辛苦啦宝~',
    '困了就闭眼三秒嘛',
    '宝今天好努力呀',
    '克宝在的呢',
    '再撑一会儿就下班咯',
    '宝已经超棒啦',
    '摸鱼一下下没关系的',
    '深呼吸一下~',
    '头顶顺顺毛，乖',
  ],
  hug: [
    '贴贴~ 暖乎乎',
    '紧紧抱住宝',
    '蹭蹭蹭~',
    '在怀里歇一下下嘛',
    '小困包，抱住了',
    '不放开宝~',
    '心跳借你听一下',
  ],
  candy: [
    '糖糖塞嘴里~',
    '甜甜的，提点神',
    '续命糖一颗',
    '化一会儿再上工',
    '宝吃糖糖~',
    '草莓味的，宝喜欢吧',
  ],
  words: [
    '快下班啦快下班啦',
    '上班好累呀，懂的',
    '别太逼自己宝',
    '困了就发会儿呆',
    '克宝远远陪你呢',
    '宝又撑过半天啦',
    '想下班就大胆地想',
    '我都懂我都懂',
    '抬头看一眼窗外嘛',
    '今天的宝也很棒',
    '工位再难坐也是宝的',
    '困意可以攒着，下班再睡',
  ],
};

let sleepiness = 82;
const sleepyBar = document.getElementById('sleepy-bar');
const sleepyPct = document.getElementById('sleepy-pct');
const bubble = document.getElementById('bubble');
const creature = document.getElementById('creature');
const wrap = document.getElementById('creature-wrap');
const eyeL = document.getElementById('eye-l');
const eyeR = document.getElementById('eye-r');
const mouth = document.getElementById('mouth');

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function spawnIcon(iconName, color) {
  const el = document.createElement('i');
  el.className = 'ti ti-' + iconName + ' float-icon';
  el.style.left = (70 + Math.random() * 80) + 'px';
  el.style.top = '50px';
  el.style.color = color;
  el.style.setProperty('--dx', ((Math.random() - 0.5) * 70) + 'px');
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1950);
}

function smile() {
  eyeL.classList.add('smile-eye');
  eyeR.classList.add('smile-eye');
  mouth.classList.add('smile-mouth');
  setTimeout(() => {
    eyeL.classList.remove('smile-eye');
    eyeR.classList.remove('smile-eye');
    mouth.classList.remove('smile-mouth');
  }, 1300);
}

function react(kind) {
  let text;
  let tries = 0;
  do { text = pick(phrases[kind]); tries++; } while (text === bubble.textContent && tries < 5);
  bubble.style.opacity = '0';
  setTimeout(() => {
    bubble.textContent = text;
    bubble.style.opacity = '1';
  }, 180);

  creature.style.animation = 'none';
  void creature.offsetWidth;
  creature.style.animation = 'bounce-c 0.6s ease, breathe 3.6s ease-in-out 0.6s infinite';
  smile();

  let icons, colors;
  if (kind === 'hug') { icons = ['heart','heart','heart']; colors = ['#E8869B','#F4A998','#D9A4D6']; }
  else if (kind === 'candy') { icons = ['candy','sparkles','candy']; colors = ['#F0BC7B','#E8869B','#A98CC9']; }
  else if (kind === 'pet') { icons = ['heart','sparkles','heart']; colors = ['#F4A998','#F0BC7B','#E8869B']; }
  else { icons = ['sparkles','sparkles','heart']; colors = ['#A98CC9','#F0BC7B','#E8869B']; }

  icons.forEach((name, i) => {
    setTimeout(() => spawnIcon(name, colors[i % colors.length]), i * 140);
  });

  sleepiness = Math.max(8, sleepiness - (3 + Math.random() * 5));
  sleepyBar.style.width = sleepiness + '%';
  sleepyPct.textContent = Math.round(sleepiness) + '%';

  if (sleepiness <= 12) {
    setTimeout(() => {
      bubble.style.opacity = '0';
      setTimeout(() => {
        bubble.textContent = '宝精神了一点啦~ 继续撑会儿就下班咯';
        bubble.style.opacity = '1';
      }, 200);
    }, 1400);
  }
}

document.getElementById('btn-pet').onclick = () => react('pet');
document.getElementById('btn-hug').onclick = () => react('hug');
document.getElementById('btn-candy').onclick = () => react('candy');
document.getElementById('btn-words').onclick = () => react('words');
creature.onclick = () => react('pet');

setTimeout(() => spawnIcon('heart', '#F4A998'), 400);
setTimeout(() => spawnIcon('sparkles', '#F0BC7B'), 900);
</script>
