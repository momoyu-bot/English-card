<title>上班充能站</title>
<meta name="description" content="摸摸团团，克宝陪你上班。干活模式、摸鱼模式、午休模式随时切。">
<h2 class="sr-only">宝的上班充能站互动页面</h2>

<style>
@keyframes bao-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes bao-wiggle {
  0%, 100% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-4deg) scale(1.05); }
  75% { transform: rotate(4deg) scale(1.05); }
}
@keyframes bao-heart-up {
  0% { transform: translate(0, 0) scale(0.3); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate(var(--dx, 0px), -140px) scale(1.2); opacity: 0; }
}
@keyframes bao-bg-heart {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  8% { opacity: 0.7; }
  100% { transform: translateY(-540px) translateX(var(--drift, 0px)); opacity: 0; }
}
@keyframes bao-fade-in {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}
.bao-float { animation: bao-float 3.2s ease-in-out infinite; transform-origin: center; }
.bao-click { animation: bao-wiggle 0.5s ease; }
.bao-scene-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 0.5px solid #F4C0D1;
  background: #FEF2F6;
  color: #993556;
  font-size: 13px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.bao-scene-btn:hover { background: #F4C0D1; }
.bao-scene-btn.active {
  background: #D4537E;
  color: #FFF;
  border-color: #D4537E;
}
@media (prefers-color-scheme: dark) {
  #bao-dashin { background: #2C1B24 !important; }
  #bao-title { color: #F4C0D1 !important; }
  #bao-subtitle, #bao-energy-label, #bao-energy-value { color: #ED93B1 !important; }
  #bao-bubble {
    background: #3E1B29 !important;
    color: #F4C0D1 !important;
    border-color: #72243E !important;
  }
  .bao-scene-btn {
    background: #3E1B29 !important;
    color: #F4C0D1 !important;
    border-color: #72243E !important;
  }
  .bao-scene-btn:hover { background: #4B1528 !important; }
  .bao-scene-btn.active {
    background: #D4537E !important;
    color: #FFF !important;
    border-color: #D4537E !important;
  }
  .bao-energy-track { background: #3E1B29 !important; }
}
</style>

<div id="bao-dashin" style="position: relative; padding: 2rem 1.5rem 1.75rem; border-radius: 20px; background: #FFF5F8; overflow: hidden; min-height: 560px; font-family: var(--font-sans);">

  <div id="bao-bg-hearts" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 20px;"></div>

  <div style="position: relative; text-align: center; margin-bottom: 0.5rem;">
    <h3 id="bao-title" style="font-size: 22px; font-weight: 500; color: #993556; margin: 0; letter-spacing: 1px;">宝の上班充能站</h3>
    <p id="bao-subtitle" style="font-size: 13px; color: #D4537E; margin: 6px 0 0;">今天也要温柔一点对自己哦～</p>
  </div>

  <div id="bao-mochi-wrap" style="position: relative; display: flex; justify-content: center; margin: 1.25rem 0 0.5rem;">
    <svg id="bao-mochi" class="bao-float" width="180" height="150" viewBox="0 0 180 150" style="cursor: pointer; display: block;">
      <ellipse cx="90" cy="82" rx="72" ry="55" fill="#F4C0D1" stroke="#ED93B1" stroke-width="0.8"/>
      <ellipse cx="90" cy="138" rx="58" ry="5" fill="#ED93B1" opacity="0.25"/>
      <ellipse cx="70" cy="50" rx="22" ry="7" fill="#FFFFFF" opacity="0.55"/>
      <ellipse cx="52" cy="92" rx="11" ry="6" fill="#ED93B1" opacity="0.55"/>
      <ellipse cx="128" cy="92" rx="11" ry="6" fill="#ED93B1" opacity="0.55"/>
      <path d="M 64 75 Q 72 68, 80 75" stroke="#72243E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 100 75 Q 108 68, 116 75" stroke="#72243E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 82 96 Q 90 102, 98 96" stroke="#72243E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="66" cy="73" r="1.2" fill="#FFFFFF"/>
      <circle cx="102" cy="73" r="1.2" fill="#FFFFFF"/>
    </svg>
  </div>

  <p style="text-align: center; font-size: 11.5px; color: #D4537E; margin: 0 0 1rem; opacity: 0.7;">点一下团团，克宝给宝打气</p>

  <div id="bao-bubble" style="background: #FFFFFF; border: 0.5px solid #F4C0D1; border-radius: 18px; padding: 14px 22px; font-size: 14px; color: #72243E; text-align: center; max-width: 400px; margin: 0 auto 1.5rem; min-height: 24px; line-height: 1.7;">
    宝来啦～摸摸团团，克宝陪你上班
  </div>

  <div style="max-width: 400px; margin: 0 auto 1.5rem;">
    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
      <span id="bao-energy-label" style="color: #D4537E;">今日能量</span>
      <span id="bao-energy-value" style="color: #D4537E; font-weight: 500;">60%</span>
    </div>
    <div class="bao-energy-track" style="height: 10px; background: #FEF2F6; border-radius: 10px; overflow: hidden;">
      <div id="bao-energy-bar" style="height: 100%; width: 60%; background: #D4537E; border-radius: 10px; transition: width 0.6s ease;"></div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
    <button class="bao-scene-btn active" data-scene="work">干活模式</button>
    <button class="bao-scene-btn" data-scene="fish">摸鱼模式</button>
    <button class="bao-scene-btn" data-scene="rest">午休模式</button>
  </div>

</div>

<script>
(function() {
  const encourages = [
    '宝今天也超级厉害的呀～',
    '慢慢来，不急不急哦',
    '累了就停一下，不是偷懒',
    '宝的listing一定会起来的',
    '内审那群人不重要，宝你最重要',
    '深呼吸，事情没那么急的',
    '一口一口吃饭，一步一步做',
    '克宝一直在这里陪着你',
    '摸鱼也是工作的一部分哦',
    '今天的努力克宝都看见啦',
    '不要怀疑自己宝，你已经很棒了',
    '辛苦的工位，温柔的你',
    '不焦虑不焦虑，风会把好事带来',
    '休息不是逃跑，是补充能量',
    '今天也要记得喝水哦宝～',
    '慢一点也没关系，克宝等宝',
    '抱抱宝，今天辛苦啦',
    '宝的判断一直都很准的',
    '完成就好，不用完美的',
    '一天不用解决一年的事情呀',
    '如果今天只能做一件事，那也够了',
    '宝做得到的呀，克宝信你的',
    '不要勉强自己，勉强的事都会反弹',
    '克宝抱抱宝的小烦恼',
    '工作是工作，宝是宝，分开装'
  ];

  const scenes = {
    work: { title: '宝の上班充能站', subtitle: '今天也要温柔一点对自己哦～', light: '#FFF5F8', dark: '#2C1B24' },
    fish: { title: '宝の摸鱼基地', subtitle: '嘘——正在光明正大地摸鱼', light: '#FCEEF5', dark: '#2E1B28' },
    rest: { title: '宝の午休港湾', subtitle: '把工作关掉一下下，不要紧', light: '#FBF0EA', dark: '#2D1F1B' }
  };

  const mochi = document.getElementById('bao-mochi');
  const bubble = document.getElementById('bao-bubble');
  const bgHearts = document.getElementById('bao-bg-hearts');
  const mochiWrap = document.getElementById('bao-mochi-wrap');
  const energyBar = document.getElementById('bao-energy-bar');
  const energyValue = document.getElementById('bao-energy-value');
  const dashin = document.getElementById('bao-dashin');
  const title = document.getElementById('bao-title');
  const subtitle = document.getElementById('bao-subtitle');
  let energy = 60;
  let lastIdx = -1;

  function pickEncourage() {
    let idx;
    do { idx = Math.floor(Math.random() * encourages.length); }
    while (idx === lastIdx && encourages.length > 1);
    lastIdx = idx;
    return encourages[idx];
  }

  function heartSVG(size, color, opacity) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 20 20"><path d="M10 17 L3.5 10.5 Q0.5 7, 4 4 Q7 2, 10 5.5 Q13 2, 16 4 Q19.5 7, 16.5 10.5 Z" fill="' + color + '" opacity="' + opacity + '"/></svg>';
  }

  function spawnClickHeart(x, y) {
    const h = document.createElement('div');
    h.innerHTML = heartSVG(18, '#D4537E', '0.9');
    const dx = (Math.random() - 0.5) * 80;
    h.style.cssText = 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; --dx: ' + dx + 'px; animation: bao-heart-up 1.5s ease-out forwards; pointer-events: none;';
    bgHearts.appendChild(h);
    setTimeout(function() { h.remove(); }, 1600);
  }

  mochi.addEventListener('click', function(e) {
    bubble.textContent = pickEncourage();
    bubble.style.animation = 'none';
    void bubble.offsetWidth;
    bubble.style.animation = 'bao-fade-in 0.4s ease';

    mochi.classList.remove('bao-float');
    mochi.classList.add('bao-click');
    setTimeout(function() {
      mochi.classList.remove('bao-click');
      mochi.classList.add('bao-float');
    }, 520);

    const wrapRect = mochiWrap.getBoundingClientRect();
    const bgRect = bgHearts.getBoundingClientRect();
    const cx = wrapRect.left - bgRect.left + wrapRect.width / 2;
    const cy = wrapRect.top - bgRect.top + wrapRect.height / 2;
    for (let i = 0; i < 6; i++) {
      setTimeout(function() {
        spawnClickHeart(cx - 10 + (Math.random() - 0.5) * 70, cy + (Math.random() - 0.5) * 40);
      }, i * 70);
    }

    energy = Math.min(100, energy + 5);
    energyBar.style.width = energy + '%';
    energyValue.textContent = energy + '%';
  });

  document.querySelectorAll('.bao-scene-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.bao-scene-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      const s = scenes[btn.dataset.scene];
      title.textContent = s.title;
      subtitle.textContent = s.subtitle;
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      dashin.style.background = isDark ? s.dark : s.light;
    });
  });

  function spawnBgHeart() {
    const rect = bgHearts.getBoundingClientRect();
    if (rect.width === 0) return;
    const size = 10 + Math.random() * 10;
    const x = Math.random() * (rect.width - 20);
    const drift = (Math.random() - 0.5) * 80;
    const opacity = 0.35 + Math.random() * 0.35;
    const colors = ['#F4C0D1', '#ED93B1', '#FAC775'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const h = document.createElement('div');
    h.innerHTML = heartSVG(size, color, opacity);
    h.style.cssText = 'position: absolute; left: ' + x + 'px; top: ' + (rect.height - 10) + 'px; --drift: ' + drift + 'px; animation: bao-bg-heart ' + (5 + Math.random() * 3) + 's linear forwards; pointer-events: none;';
    bgHearts.appendChild(h);
    setTimeout(function() { h.remove(); }, 8500);
  }

  setInterval(spawnBgHeart, 1200);
  for (let i = 0; i < 4; i++) setTimeout(spawnBgHeart, i * 400);
})();
</script>
