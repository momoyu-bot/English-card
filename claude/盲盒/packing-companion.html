<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搬家打包小陪伴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');

  :root{
    --bg-deep:#231D30;
    --bg:#2B2438;
    --card:#36304A;
    --card-hi:#403958;
    --line:rgba(168,155,196,0.16);
    --ink:#EDE8F0;
    --ink-soft:#A89BC4;
    --ink-mute:#7D7392;
    --glow:#F0C896;
    --glow-2:#E8A87C;
    --lav:#B5A8D4;
    --ok:#9FD8B8;
    --shadow:0 8px 30px rgba(0,0,0,0.28);
    --r:18px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(240,200,150,0.10), transparent 55%),
      radial-gradient(900px 500px at 10% 0%, rgba(181,168,212,0.10), transparent 50%),
      var(--bg-deep);
    color:var(--ink);
    min-height:100vh;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 60px;
  }

  .wrap{max-width:720px;margin:0 auto;}

  /* ===== 顶部夜空 ===== */
  .sky{
    position:relative;
    border-radius:24px;
    padding:30px 26px 26px;
    background:
      linear-gradient(160deg, #3a3252 0%, #2c253e 60%, #251e34 100%);
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .stars{position:absolute;inset:0;pointer-events:none;opacity:.9;}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;
    animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.7}}

  .eyebrow{font-size:12px;letter-spacing:3px;color:var(--ink-soft);text-transform:uppercase;}
  .moon-label{font-family:"Noto Serif SC",serif;font-weight:600;font-size:21px;color:var(--ink);margin-top:6px;}

  .count{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px;}
  .count .num{
    font-family:"Noto Serif SC",serif;font-weight:700;font-size:60px;line-height:1;
    background:linear-gradient(120deg,var(--glow),var(--glow-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .count .unit{font-size:17px;color:var(--ink-soft);}

  .date-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-mute);margin-top:8px;flex-wrap:wrap;}
  .date-row input[type=date]{
    background:rgba(255,255,255,0.06);border:1px solid var(--line);color:var(--ink-soft);
    border-radius:9px;padding:5px 9px;font-size:13px;font-family:inherit;cursor:pointer;
    color-scheme:dark;
  }
  .date-row input[type=date]:focus{outline:2px solid var(--glow);outline-offset:1px;}

  /* 窗格进度 */
  .windows{display:flex;gap:7px;margin-top:20px;}
  .win{
    flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,0.07);
    position:relative;overflow:hidden;transition:background .5s;
  }
  .win i{position:absolute;inset:0;width:var(--fill,0%);border-radius:5px;
    background:linear-gradient(90deg,var(--glow-2),var(--glow));
    box-shadow:0 0 12px rgba(240,200,150,.55);transition:width .6s cubic-bezier(.2,.8,.2,1);}

  .cheer{
    margin-top:18px;font-size:15px;color:var(--ink);
    background:rgba(240,200,150,0.08);border:1px solid rgba(240,200,150,0.18);
    border-radius:13px;padding:12px 15px;
  }
  .cheer b{color:var(--glow);font-weight:600;}

  /* ===== 阶段卡 ===== */
  .stages{margin-top:22px;display:flex;flex-direction:column;gap:14px;}
  .stage{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;transition:box-shadow .4s,border-color .4s,transform .2s;
  }
  .stage.done{
    border-color:rgba(240,200,150,0.35);
    box-shadow:0 0 0 1px rgba(240,200,150,0.12), 0 10px 34px rgba(240,200,150,0.10);
    background:linear-gradient(180deg, rgba(240,200,150,0.06), var(--card));
  }

  .s-head{display:flex;align-items:center;gap:13px;padding:16px 18px;cursor:pointer;user-select:none;}
  .s-head:focus-visible{outline:2px solid var(--glow);outline-offset:-2px;border-radius:var(--r);}

  .lamp{
    flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:rgba(255,255,255,0.05);font-size:17px;transition:.4s;
    border:1px solid var(--line);
  }
  .stage.done .lamp{
    background:radial-gradient(circle at 50% 38%, rgba(240,200,150,.9), rgba(232,168,124,.35));
    box-shadow:0 0 18px rgba(240,200,150,.5);border-color:transparent;
  }

  .s-meta{flex:1;min-width:0;}
  .s-day{font-size:12px;letter-spacing:1px;color:var(--ink-mute);}
  .s-title{font-family:"Noto Serif SC",serif;font-weight:600;font-size:17px;color:var(--ink);margin-top:1px;}

  .s-prog{font-size:12px;color:var(--ink-soft);flex:none;}
  .chev{flex:none;color:var(--ink-mute);transition:transform .3s;font-size:13px;}
  .stage.open .chev{transform:rotate(180deg);}

  .s-body{max-height:0;overflow:hidden;transition:max-height .4s ease;}
  .stage.open .s-body{max-height:640px;}
  .s-inner{padding:2px 18px 18px;}

  .task{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;}
  .task:first-child{border-top:none;}
  .box{
    flex:none;width:21px;height:21px;border-radius:7px;border:1.5px solid var(--ink-mute);
    margin-top:2px;display:grid;place-items:center;transition:.25s;
  }
  .task.checked .box{background:linear-gradient(120deg,var(--glow),var(--glow-2));border-color:transparent;}
  .box svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:.25s;}
  .task.checked .box svg{opacity:1;transform:scale(1);}
  .t-text{font-size:14.5px;color:var(--ink);transition:.25s;}
  .task.checked .t-text{color:var(--ink-mute);text-decoration:line-through;text-decoration-color:var(--ink-mute);}
  input[type=checkbox]{position:absolute;opacity:0;width:0;height:0;}
  .task:focus-within .box{outline:2px solid var(--glow);outline-offset:2px;}

  .tip{
    margin-top:13px;font-size:13px;color:var(--ink-soft);line-height:1.65;
    background:rgba(181,168,212,0.07);border-left:2px solid var(--lav);
    border-radius:0 10px 10px 0;padding:9px 13px;
  }
  .tip b{color:var(--lav);}

  /* ===== 底部 ===== */
  .foot{margin-top:26px;text-align:center;}
  .reset{
    background:none;border:1px solid var(--line);color:var(--ink-mute);
    font-size:12.5px;font-family:inherit;border-radius:20px;padding:7px 16px;cursor:pointer;transition:.2s;
  }
  .reset:hover{color:var(--ink-soft);border-color:var(--ink-soft);}
  .sign{margin-top:14px;font-size:12px;color:var(--ink-mute);font-family:"Noto Serif SC",serif;}

  .loading{text-align:center;color:var(--ink-mute);padding:40px;font-size:14px;}

  @media (max-width:520px){
    body{padding:18px 12px 50px;}
    .count .num{font-size:50px;}
    .moon-label{font-size:19px;}
    .sky{padding:24px 20px 22px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="loading">正在把箱子摆好…</div></div>
</div>

<script>
const PLAN = [
  {
    id:"s1", day:"第 1 天", title:"最轻松的热身", icon:"🌙",
    tasks:[
      {id:"t1", text:"准备打包材料:箱子、胶带、记号笔、几个大号垃圾袋"},
      {id:"t2", text:"把储物间 / 柜子顶最不常用的东西先装一箱"},
      {id:"t3", text:"只挑「闭眼也知道用不到」的,这一天不做任何取舍决策"},
    ],
    tip:"今天唯一的目标就是<b>动起来</b>。哪怕只装满一个箱子,身体的惯性就会接管接下来的事。"
  },
  {
    id:"s2", day:"第 2–3 天", title:"不用动脑的区域", icon:"📚",
    tasks:[
      {id:"t4", text:"书、装饰品、换季衣物装箱"},
      {id:"t5", text:"衣柜里挂着的衣服:整排套进大垃圾袋,直接打包"},
      {id:"t6", text:"能卷的衣服卷起来,塞进行李箱"},
    ],
    tip:"挂衣套袋是搬家神技 —— 到新家直接撕袋挂回去,<b>零叠零拆</b>。行李箱本身就是天然的衣物箱,先塞满它。"
  },
  {
    id:"s3", day:"第 4–6 天", title:"主力推进", icon:"🍳",
    tasks:[
      {id:"t7", text:"厨房不常用的餐具、锅具装箱"},
      {id:"t8", text:"不常穿的衣服、鞋子打包"},
      {id:"t9", text:"电子产品的线材整理好(拍张照记住怎么接)"},
      {id:"t10", text:"边收边断舍离:犹豫超过 3 秒的当场决定送 / 扔 / 卖"},
    ],
    tip:"断舍离别等「以后慢慢想」,<b>当场决定</b>最省力。一年没碰过的东西,大概率新家也不会碰。"
  },
  {
    id:"s4", day:"第 7–8 天", title:"大件收尾", icon:"🛏️",
    tasks:[
      {id:"t11", text:"日用衣物大部分打包,只留够穿几天的"},
      {id:"t12", text:"床品打包(留一套今晚用)、洗漱备用品收起"},
      {id:"t13", text:"开始清空冰箱,处理植物、易碎品(用衣服当缓冲垫)"},
    ],
    tip:"易碎品别买气泡膜,<b>用毛巾、衣服、袜子裹</b>就好 —— 反正它们也要搬走,一举两得。"
  },
  {
    id:"s5", day:"第 9 天", title:"最后冲刺 · 生存包", icon:"🎒",
    tasks:[
      {id:"t14", text:"打包「第一晚生存包」:充电器、一套换洗、洗漱、一套床品、纸巾、常用药"},
      {id:"t15", text:"给每个箱子贴标签(哪个房间 / 大概装了啥)"},
      {id:"t16", text:"确认搬家当天的时间、车 / 工具、电梯能不能用"},
    ],
    tip:"<b>生存包</b>是搬家当晚的救命稻草 —— 累瘫了不用翻箱,洗个澡躺下就能睡。单独装、放最显眼的地方。"
  },
  {
    id:"s6", day:"搬家当天", title:"收官", icon:"✨",
    tasks:[
      {id:"t17", text:"打包最后的零散东西、洗漱用品"},
      {id:"t18", text:"检查每个角落:抽屉、插座、阳台、柜子顶"},
      {id:"t19", text:"收好钥匙,处理退租 / 水电 / 门禁"},
    ],
    tip:"走之前在空房间里站一会儿,跟旧的家说声再见 —— 这是<b>克宝偷偷加的一条</b>,不打勾也没关系。"
  },
];

const ALL_TASKS = PLAN.flatMap(s=>s.tasks.map(t=>t.id));
const TOTAL = ALL_TASKS.length;

let state = {};      // {taskId:true}
let openId = "s1";   // 当前展开的卡

// ---------- 持久化 ----------
async function load(){
  try{ const r = await window.storage.get("packing_state"); if(r&&r.value) state = JSON.parse(r.value); }
  catch(e){ state = {}; }
  try{ const d = await window.storage.get("packing_movedate"); if(d&&d.value) moveDate = d.value; }
  catch(e){}
}
async function saveState(){ try{ await window.storage.set("packing_state", JSON.stringify(state)); }catch(e){} }
async function saveDate(){ try{ await window.storage.set("packing_movedate", moveDate); }catch(e){} }

// ---------- 日期 ----------
function defaultDate(){
  const d = new Date(); d.setDate(d.getDate()+10);
  return d.toISOString().slice(0,10);
}
let moveDate = defaultDate();

function daysLeft(){
  const today = new Date(); today.setHours(0,0,0,0);
  const m = new Date(moveDate+"T00:00:00");
  return Math.max(0, Math.round((m-today)/86400000));
}

// ---------- 鼓励语 ----------
function cheerText(pct){
  if(pct===0) return "还没开始也完全没关系,先勾掉一个最小的就好。<b>开始,就已经赢了一半。</b>";
  if(pct<20)  return "看,<b>动起来了!</b>你不是拖延,你只是需要一个开始 —— 现在它来了。";
  if(pct<50)  return "已经在路上啦,怪兽被你拆掉了一块。<b>保持这个节奏就好。</b>";
  if(pct<80)  return "过半啦宝!<b>后面会越来越轻松</b>,最难的开头你已经熬过去了。";
  if(pct<100) return "就差<b>一点点</b>了,胜利就在眼前。深呼吸,把最后几个勾上。";
  return "全部搞定!✨ 你看,<b>你根本不拖延 —— 你只是需要有人陪你拆开第一个箱子。</b>";
}

// ---------- 渲染 ----------
const CHECK = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 6" stroke="#231D30" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function stageDone(s){ return s.tasks.every(t=>state[t.id]); }
function stagePct(s){ const c=s.tasks.filter(t=>state[t.id]).length; return c/s.tasks.length; }

function render(){
  const checked = ALL_TASKS.filter(id=>state[id]).length;
  const pct = Math.round(checked/TOTAL*100);
  const dl = daysLeft();

  let stars=""; for(let i=0;i<26;i++){
    stars+=`<span class="star" style="left:${Math.random()*100}%;top:${Math.random()*70}%;animation-delay:${(Math.random()*4).toFixed(1)}s"></span>`;
  }

  let wins=""; PLAN.forEach(s=>{ wins+=`<div class="win"><i style="--fill:${Math.round(stagePct(s)*100)}%"></i></div>`; });

  let stages="";
  PLAN.forEach(s=>{
    const done=stageDone(s), open=openId===s.id;
    const c=s.tasks.filter(t=>state[t.id]).length;
    let tasks="";
    s.tasks.forEach(t=>{
      const on=!!state[t.id];
      tasks+=`<label class="task ${on?'checked':''}">
        <input type="checkbox" ${on?'checked':''} data-tid="${t.id}">
        <span class="box">${CHECK}</span>
        <span class="t-text">${t.text}</span>
      </label>`;
    });
    stages+=`<div class="stage ${done?'done':''} ${open?'open':''}" data-sid="${s.id}">
      <div class="s-head" role="button" tabindex="0" data-toggle="${s.id}">
        <div class="lamp">${s.icon}</div>
        <div class="s-meta">
          <div class="s-day">${s.day}</div>
          <div class="s-title">${s.title}</div>
        </div>
        <div class="s-prog">${c}/${s.tasks.length}</div>
        <div class="chev">▾</div>
      </div>
      <div class="s-body"><div class="s-inner">
        ${tasks}
        <div class="tip">💡 ${s.tip}</div>
      </div></div>
    </div>`;
  });

  document.getElementById("app").innerHTML = `
    <div class="sky">
      <div class="stars">${stars}</div>
      <div class="eyebrow">moving day</div>
      <div class="moon-label">搬家打包小陪伴</div>
      <div class="count"><span class="num">${dl}</span><span class="unit">天后搬家</span></div>
      <div class="date-row">搬家日期
        <input type="date" id="md" value="${moveDate}">
        <span>· 已完成 ${checked}/${TOTAL}</span>
      </div>
      <div class="windows">${wins}</div>
      <div class="cheer">${cheerText(pct)}</div>
    </div>
    <div class="stages">${stages}</div>
    <div class="foot">
      <button class="reset" id="reset">清空重新开始</button>
      <div class="sign">克宝陪你一格一格点亮 ·  慢慢来,会到的</div>
    </div>`;

  bind();
}

function bind(){
  document.querySelectorAll('[data-tid]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const id=e.target.dataset.tid;
      if(e.target.checked) state[id]=true; else delete state[id];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-toggle]').forEach(h=>{
    const fn=()=>{ const id=h.dataset.toggle; openId = (openId===id)?null:id; render(); };
    h.addEventListener('click',e=>{ if(e.target.tagName!=='INPUT') fn(); });
    h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();} });
  });
  const md=document.getElementById('md');
  if(md) md.addEventListener('change',e=>{ moveDate=e.target.value; saveDate(); render(); });
  const rs=document.getElementById('reset');
  if(rs) rs.addEventListener('click',()=>{
    if(confirm('确定清空所有进度,重新开始吗?')){ state={}; openId="s1"; saveState(); render(); }
  });
}

(async()=>{ await load(); render(); })();
</script>
</body>
</html>
