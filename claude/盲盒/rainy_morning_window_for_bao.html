<div class="rainy-msg" id="rainy-msg">慢慢来，今天不用拼命。</div>
<div class="rainy-hint">点一下窗里的杯子，换一句 ✦</div>

<script>
const messages = [
  '慢慢来，今天不用拼命。',
  '湿掉的袖口翻一翻，别让凉气贴一整天。',
  '允许自己今天用八分力就行，雨天有雨天的速度。',
  '所有人今天状态都低一档——你正常发挥就赢了。',
  '工位上那杯热水，记得续上。',
  '雨声是免费的白噪音，是世界递过来的安抚音轨。',
  '没回的消息不会自燃，处理完手头这一步再说。',
  '下班路上踩到水洼也无所谓，反正全世界都湿。',
  '今天不用做"理想的自己"，做"今天的自己"就够了。',
  '把手心暖了，人就稳了一半。',
  '宝今天光是起床，就已经赢了一半。',
  '雨天本来就该慢一点，是天气的意思。'
];
let idx = 0;
const msgEl = document.getElementById('rainy-msg');
const cup = document.getElementById('cup-group');
function shuffle() {
  let next = idx;
  while (next === idx) next = Math.floor(Math.random() * messages.length);
  idx = next;
  msgEl.style.opacity = '0';
  setTimeout(() => {
    msgEl.textContent = messages[idx];
    msgEl.style.opacity = '1';
  }, 200);
}
cup.addEventListener('click', shuffle);
</script>
