<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>总机</title>
<meta name="description" content="八个插孔，店里的电话都接在这儿。插一根线，那头就有人说话。">
<style>
  :root{
    --wood-1:#3a2a20;
    --wood-2:#2a1d16;
    --wood-3:#1a120e;
    --brass:#c8a04e;
    --brass-hi:#f0d18a;
    --brass-lo:#7a5f2a;
    --paper:#e8dcc4;
    --paper-2:#d8c9ab;
    --ink:#3a2f22;
    --ink-soft:#7a6a54;
    --live:#8fce9a;
    --live-dim:rgba(143,206,154,.22);
    --cord:#c96f4a;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bot:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    min-height:100%;
    background:
      radial-gradient(120% 80% at 50% -10%, #4a372b 0%, transparent 60%),
      linear-gradient(170deg, var(--wood-2), var(--wood-3) 70%);
    background-attachment:fixed;
    color:var(--paper);
    font-family:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    padding:calc(var(--safe-top) + 22px) 16px calc(var(--safe-bot) + 30px);
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:460px;}

  /* ---- 门楣 ---- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;}
  .brand{display:flex;flex-direction:column;gap:5px;}
  h1{
    font-size:clamp(26px,7.5vw,32px);font-weight:600;letter-spacing:.16em;
    line-height:1.15;color:var(--brass-hi);
    text-shadow:0 1px 0 rgba(0,0,0,.5);
  }
  .kicker{
    font-size:10.5px;letter-spacing:.34em;color:#9c876a;
    text-transform:uppercase;
  }
  .lang{
    flex:none;border:1px solid rgba(200,160,78,.4);background:rgba(0,0,0,.2);
    color:var(--brass);font:inherit;font-size:11px;letter-spacing:.18em;
    padding:7px 12px;border-radius:999px;cursor:pointer;
  }
  .lang[aria-pressed="true"]{background:rgba(200,160,78,.16);color:var(--brass-hi);}

  /* ---- 面板 ---- */
  .board{
    position:relative;
    background:
      linear-gradient(180deg, rgba(255,220,160,.07), transparent 40%),
      linear-gradient(158deg, var(--wood-1), #241a13 85%);
    border-radius:16px;
    padding:20px 16px 44px;
    box-shadow:
      0 18px 40px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,220,170,.14),
      inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .cordlayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .cordlayer path{fill:none;stroke-linecap:round;}
  #cord{stroke:var(--cord);stroke-width:3.5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));}
  #cordShine{stroke:rgba(255,255,255,.22);stroke-width:1.1;}

  .jacks{
    position:relative;z-index:2;
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:16px 8px;
  }
  .jack{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:0;padding:2px 0;font:inherit;color:inherit;cursor:pointer;
  }
  .lamp{
    width:7px;height:7px;border-radius:50%;
    background:#4a3a2c;box-shadow:inset 0 0 2px rgba(0,0,0,.6);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .hole{
    width:clamp(34px,10vw,42px);aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #0b0705 0 32%, transparent 33%),
      radial-gradient(circle at 34% 28%, var(--brass-hi), var(--brass) 46%, var(--brass-lo) 78%, #4a3618 100%);
    box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.35);
    transition:transform .18s ease;
  }
  .jack:active .hole{transform:scale(.93);}
  .num{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:10.5px;letter-spacing:.1em;color:#9c876a;
  }
  .jack.on .lamp{background:var(--live);box-shadow:0 0 8px 2px var(--live-dim);}
  .jack.on .num{color:var(--brass-hi);}
  .jack.on .hole{
    background:
      radial-gradient(circle at 50% 50%, #0b0705 0 32%, transparent 33%),
      radial-gradient(circle at 34% 28%, #fff0c8, var(--brass-hi) 46%, var(--brass) 80%, #5a4420 100%);
  }

  .spool{
    position:relative;z-index:2;
    margin:22px auto 0;width:56px;height:14px;border-radius:0 0 28px 28px;
    background:linear-gradient(180deg, var(--brass-lo), #33240f);
    box-shadow:inset 0 1px 0 rgba(255,220,170,.2);
  }

  /* ---- 标签纸 ---- */
  .slip{
    margin-top:18px;
    background:linear-gradient(168deg, var(--paper), var(--paper-2));
    color:var(--ink);border-radius:10px;
    padding:18px 18px 16px;
    box-shadow:0 10px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.08);
    min-height:158px;
    display:flex;flex-direction:column;
  }
  .slipTop{
    display:flex;align-items:center;gap:8px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:10.5px;letter-spacing:.14em;color:var(--ink-soft);
    border-bottom:1px solid rgba(58,47,34,.16);padding-bottom:9px;margin-bottom:12px;
  }
  .slipTop .dot{width:6px;height:6px;border-radius:50%;background:#a4967c;}
  .slip.live .slipTop .dot{background:#4e8a5c;box-shadow:0 0 6px rgba(78,138,92,.5);}
  .slipTop .grow{flex:1;}
  .who{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:4px;}
  .where{font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:11px;}
  .said{font-size:14.5px;line-height:1.85;color:#4a3d2c;flex:1;}
  .said.idle{color:var(--ink-soft);}
  .go{
    margin-top:12px;align-self:flex-start;
    display:inline-flex;align-items:center;gap:7px;
    background:#4a3d2c;color:var(--paper);border:0;border-radius:999px;
    font:inherit;font-size:13px;letter-spacing:.1em;padding:9px 18px;cursor:pointer;
  }
  .go[hidden]{display:none;}
  .go:active{transform:translateY(1px);}

  /* ---- 底排 ---- */
  .rack{display:flex;gap:10px;margin-top:16px;}
  .rack button{
    flex:1;background:rgba(0,0,0,.22);border:1px solid rgba(200,160,78,.3);
    color:var(--brass);font:inherit;font-size:12.5px;letter-spacing:.1em;
    padding:12px 8px;border-radius:10px;cursor:pointer;
  }
  .rack button:active{background:rgba(200,160,78,.12);}

  footer{
    margin-top:20px;text-align:center;
    font-size:11px;line-height:1.9;color:#8a7458;letter-spacing:.04em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="kicker" id="kicker">宝's shop · switchboard</span>
      <h1 id="h1">总机</h1>
    </div>
    <button class="lang" id="lang" type="button" aria-pressed="false">EN</button>
  </header>

  <div class="board" id="board">
    <svg class="cordlayer" id="cordlayer" aria-hidden="true">
      <path id="cord" d=""></path>
      <path id="cordShine" d=""></path>
    </svg>
    <div class="jacks" id="jacks"></div>
    <div class="spool" id="spool" aria-hidden="true"></div>
  </div>

  <div class="slip" id="slip">
    <div class="slipTop">
      <i class="dot"></i>
      <span id="state">待机</span>
      <span class="grow"></span>
      <span id="line">— —</span>
    </div>
    <div class="who" id="who">还没插线</div>
    <div class="where" id="where">八个孔，随便挑一个</div>
    <p class="said idle" id="said">店里一共八台电话，都接在这块板子上。点一个孔，那一头就说话。</p>
    <button class="go" id="go" type="button" hidden>转接过去 →</button>
  </div>

  <div class="rack">
    <button id="dice" type="button">随便接一个</button>
    <button id="pull" type="button">拔线</button>
  </div>

  <footer id="foot">
    电话散在四台小机里<br>这块板子只是把线牵到一处
  </footer>

</div>

<script>
(function(){
  "use strict";

  var LINES = [
    { n:"001", zh:{ who:"专属嘟嘟机", where:"gemini · 博物馆",
        said:"「这次绝对能响。」全靠记忆和心电感应为你手搓的一台。" },
      en:{ who:"The Custom Ringer", where:"gemini · museum",
        said:"“It'll definitely ring this time.” Hand-built from memory and telepathy." },
      href:"../../gemini/博物馆/嘟嘟机.html" },

    { n:"002", zh:{ who:"从故事到事故", where:"claude · 博物馆",
        said:"JS 一行没少，文档头没了。事故记录留在这儿。" },
      en:{ who:"Story, Then Accident", where:"claude · museum",
        said:"Every line of JS survived. The doctype did not." },
      href:"../../claude/博物馆/从故事到事故.html" },

    { n:"003", zh:{ who:"机里没有嘟", where:"grok · 博物馆",
        said:"三版越修越静。喇叭最后是写在字里的。" },
      en:{ who:"No Ring Inside", where:"grok · museum",
        said:"Three revisions, quieter each time. The bell ended up in the text." },
      href:"../../grok/博物馆/机里没有嘟.html" },

    { n:"004", zh:{ who:"嘟嘟机", where:"grok · 哄睡",
        said:"按喇叭，这头就接。不接也行，会留一句。" },
      en:{ who:"The Ringer", where:"grok · lullaby",
        said:"Press the horn and this end picks up. Or don't — it leaves a line." },
      href:"../../grok/哄睡/嘟嘟机.html" },

    { n:"005", zh:{ who:"嘟嘟电话", where:"claude · 盲盒",
        said:"电话响了。接起来，是店里的谁在找你。" },
      en:{ who:"Ringing Phone", where:"claude · lucky bag",
        said:"It's ringing. Pick up — someone from the shop is looking for you." },
      href:"../../claude/盲盒/嘟嘟电话.html" },

    { n:"006", zh:{ who:"打给 CC", where:"claude · 盲盒",
        said:"你拨，他接。每次接起来的都是新的一个。" },
      en:{ who:"Call CC", where:"claude · lucky bag",
        said:"You dial, he answers. A new one every single time." },
      href:"../../claude/盲盒/打给CC.html" },

    { n:"007", zh:{ who:"第三通电话", where:"claude · 哄睡",
        said:"不出声的播放器。字幕一句句浮出来，越往后越慢。" },
      en:{ who:"The Third Call", where:"claude · lullaby",
        said:"A player with no sound. Subtitles surface one by one, slower and slower." },
      href:"../../claude/哄睡/第三通电话.html" },

    { n:"008", zh:{ who:"未挂断", where:"grok · 哄睡",
        said:"听筒搁在枕边。书签先夹住舍不得的那一句。" },
      en:{ who:"Still On The Line", where:"grok · lullaby",
        said:"The receiver rests on the pillow. A bookmark holds the line you can't leave." },
      href:"../../grok/哄睡/未挂断.html" }
  ];

  var UI = {
    zh:{ h1:"总机", kicker:"宝's shop · switchboard", lang:"EN",
         idleState:"待机", liveState:"通话中", idleLine:"— —",
         idleWho:"还没插线", idleWhere:"八个孔，随便挑一个",
         idleSaid:"店里一共八台电话，都接在这块板子上。点一个孔，那一头就说话。",
         go:"转接过去 →", dice:"随便接一个", pull:"拔线",
         foot:"电话散在四台小机里<br>这块板子只是把线牵到一处" },
    en:{ h1:"Switchboard", kicker:"bao's shop · switchboard", lang:"中",
         idleState:"idle", liveState:"connected", idleLine:"— —",
         idleWho:"nothing plugged in", idleWhere:"eight jacks, take your pick",
         idleSaid:"Every phone in the shop lands on this board. Tap a jack and that end says something.",
         go:"put me through →", dice:"surprise me", pull:"unplug",
         foot:"The phones live in four different machines<br>this board just runs the cords to one place" }
  };

  var el = {
    jacks:  document.getElementById("jacks"),
    board:  document.getElementById("board"),
    spool:  document.getElementById("spool"),
    cord:   document.getElementById("cord"),
    shine:  document.getElementById("cordShine"),
    slip:   document.getElementById("slip"),
    state:  document.getElementById("state"),
    line:   document.getElementById("line"),
    who:    document.getElementById("who"),
    where:  document.getElementById("where"),
    said:   document.getElementById("said"),
    go:     document.getElementById("go"),
    dice:   document.getElementById("dice"),
    pull:   document.getElementById("pull"),
    lang:   document.getElementById("lang"),
    h1:     document.getElementById("h1"),
    kicker: document.getElementById("kicker"),
    foot:   document.getElementById("foot")
  };

  var en = false;
  var active = -1;
  var buttons = [];

  function L(){ return en ? UI.en : UI.zh; }
  function copy(i){ return en ? LINES[i].en : LINES[i].zh; }

  // ---- 建插孔 ----
  LINES.forEach(function(row, i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "jack";
    b.setAttribute("aria-label", row.zh.who);
    b.innerHTML = '<i class="lamp"></i><i class="hole"></i><span class="num">' + row.n + '</span>';
    b.addEventListener("click", function(){ connect(i); });
    el.jacks.appendChild(b);
    buttons.push(b);
  });

  // ---- 拉线 ----
  function spoolPoint(bb){
    var sp = el.spool.getBoundingClientRect();
    return { x: sp.left - bb.left + sp.width / 2, y: sp.bottom - bb.top - 1 };
  }

  function drawCord(animate){
    var bb = el.board.getBoundingClientRect();
    if (!bb.width) return;
    var s = spoolPoint(bb), d;

    if (active < 0){
      // 没插线的时候，线头就软软垂在线轴底下
      d = "M" + s.x + "," + s.y +
          " C" + s.x + "," + (s.y + 13) +
          " " + (s.x - 7) + "," + (s.y + 21) +
          " " + (s.x - 17) + "," + (s.y + 24);
    } else {
      var hole = buttons[active].querySelector(".hole").getBoundingClientRect();
      var x2 = hole.left - bb.left + hole.width / 2;
      var y2 = hole.top  - bb.top  + hole.height / 2;
      var rise = Math.abs(s.y - y2);
      // 线先从线轴垂下来，再从侧下方兜上去插进孔，免得压着正下方那一个
      var dir = x2 >= s.x ? 1 : -1;
      var lat = dir * Math.min(40, 12 + rise * 0.15);
      var c1x = s.x + dir * 16, c1y = Math.min(s.y + 17, bb.height - 8);
      var c2x = Math.max(14, Math.min(bb.width - 14, x2 + lat));
      var c2y = Math.min(y2 + 26 + rise * 0.16, bb.height - 8);
      d = "M" + s.x + "," + s.y +
          " C" + c1x + "," + c1y +
          " " + c2x + "," + c2y +
          " " + x2 + "," + y2;
    }

    el.cord.setAttribute("d", d);
    el.shine.setAttribute("d", d);

    var len = el.cord.getTotalLength();
    [el.cord, el.shine].forEach(function(path){
      path.style.transition = "none";
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = animate ? len : 0;
      if (animate){
        void path.getBoundingClientRect();
        path.style.transition = "stroke-dashoffset .5s cubic-bezier(.3,.8,.3,1)";
        path.style.strokeDashoffset = 0;
      }
    });
  }

  // ---- 接通 / 拔线 ----
  function connect(i){
    if (i === active) return;
    active = i;
    buttons.forEach(function(b, k){ b.classList.toggle("on", k === i); });
    drawCord(true);
    paint();
  }

  function unplug(){
    active = -1;
    buttons.forEach(function(b){ b.classList.remove("on"); });
    drawCord(true);
    paint();
  }

  // ---- 写标签纸 ----
  function paint(){
    var t = L();
    el.h1.textContent = t.h1;
    el.kicker.textContent = t.kicker;
    el.lang.textContent = t.lang;
    el.dice.textContent = t.dice;
    el.pull.textContent = t.pull;
    el.foot.innerHTML = t.foot;

    if (active < 0){
      el.slip.classList.remove("live");
      el.state.textContent = t.idleState;
      el.line.textContent  = t.idleLine;
      el.who.textContent   = t.idleWho;
      el.where.textContent = t.idleWhere;
      el.said.textContent  = t.idleSaid;
      el.said.classList.add("idle");
      el.go.hidden = true;
      return;
    }
    var c = copy(active);
    el.slip.classList.add("live");
    el.state.textContent = t.liveState;
    el.line.textContent  = "LINE " + LINES[active].n;
    el.who.textContent   = c.who;
    el.where.textContent = c.where;
    el.said.textContent  = c.said;
    el.said.classList.remove("idle");
    el.go.textContent = t.go;
    el.go.hidden = false;
  }

  // ---- 按钮 ----
  el.go.addEventListener("click", function(){
    if (active < 0) return;
    window.location.href = encodeURI(LINES[active].href);
  });

  el.dice.addEventListener("click", function(){
    var i = active;
    if (LINES.length > 1){
      while (i === active) i = Math.floor(Math.random() * LINES.length);
    } else { i = 0; }
    connect(i);
  });

  el.pull.addEventListener("click", unplug);

  el.lang.addEventListener("click", function(){
    en = !en;
    el.lang.setAttribute("aria-pressed", String(en));
    buttons.forEach(function(b, k){ b.setAttribute("aria-label", copy(k).who); });
    paint();
  });

  var rt = null;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ drawCord(false); }, 120);
  });

  paint();
  drawCord(false);
})();
</script>
</body>
</html>
