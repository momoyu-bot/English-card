<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝的窗台</title>
<meta name="description" content="雨、雪、太阳、月亮四种天气的一个角落，时间在这儿走得慢一点。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #2a3a4a;
    --sky-dim: #1a242e;
    --window-frame: #5c4a3a;
    --window-frame-dark: #3a2e22;
    --sill: #8a6a4a;
    --sill-dark: #6b4f36;
    --warm: #f4d4a0;
    --warm-soft: #e8c896;
    --steam: rgba(255, 240, 220, 0.35);
    --cup: #c9a87a;
    --cup-dark: #8a6f48;
    --coffee: #3d2818;
    --cat: #2a2018;
    --text: #f0e3cd;
    --text-dim: rgba(240, 227, 205, 0.55);
    --rain: rgba(180, 200, 220, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Noto Serif SC', 'LXGW WenKai TC', serif;
    background: var(--sky-dim);
    color: var(--text);
    transition: background 1.5s ease;
  }

  body.dawn  { --sky:#d9b896; --sky-dim:#c69877; --rain:rgba(255,220,180,0.3); }
  body.snow  { --sky:#c8d4dc; --sky-dim:#9aa8b2; --rain:rgba(255,255,255,0.7); }
  body.night { --sky:#0e1622; --sky-dim:#060a12; --rain:rgba(140,160,200,0.35); }

  /* ============ 整体布局 ============ */
  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 30% 20%, var(--sky) 0%, var(--sky-dim) 70%);
    transition: background 1.5s ease;
    overflow: hidden;
  }

  /* ============ 标题轻语 ============ */
  .whisper {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    cursor: pointer;
    user-select: none;
    padding: 12px 28px;
    transition: opacity 0.8s ease;
  }
  .whisper .zh {
    font-family: 'LXGW WenKai TC', 'Noto Serif SC', serif;
    font-size: clamp(18px, 2.4vw, 26px);
    letter-spacing: 0.18em;
    color: var(--text);
    font-weight: 300;
    line-height: 1.6;
  }
  .whisper .en {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(11px, 1.1vw, 13px);
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-top: 8px;
    text-transform: lowercase;
  }
  .whisper:hover .en { color: var(--warm-soft); }
  .whisper.fade { opacity: 0; }

  /* ============ 窗户 ============ */
  .window {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -52%);
    width: min(620px, 78vw);
    height: min(460px, 60vh);
    border: 14px solid var(--window-frame);
    border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-dim) 100%);
    box-shadow:
      0 0 0 2px var(--window-frame-dark),
      inset 0 0 60px rgba(0,0,0,0.4),
      0 30px 80px rgba(0,0,0,0.5);
    overflow: hidden;
    transition: background 1.5s ease;
  }

  /* 窗户的十字木条 */
  .window::before, .window::after {
    content: '';
    position: absolute;
    background: var(--window-frame);
    box-shadow: 0 0 0 1px var(--window-frame-dark);
  }
  .window::before {
    left: 0; right: 0;
    top: 50%;
    height: 8px;
    transform: translateY(-50%);
  }
  .window::after {
    top: 0; bottom: 0;
    left: 50%;
    width: 8px;
    transform: translateX(-50%);
  }

  /* 雨滴 */
  .rain-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .drop {
    position: absolute;
    width: 1.5px;
    background: linear-gradient(180deg, transparent, var(--rain));
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-100px); opacity: 0; }
    20%  { opacity: 1; }
    to   { transform: translateY(120vh); opacity: 0.2; }
  }

  /* 玻璃上的水雾 */
  .glass-fog {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 60% 40% at 30% 70%, rgba(255,255,255,0.06), transparent),
      radial-gradient(ellipse 40% 30% at 75% 30%, rgba(255,255,255,0.04), transparent);
    pointer-events: none;
  }

  /* 雪花层 */
  .snow-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    display: none;
  }
  body.snow .snow-layer { display: block; }
  body.snow .rain-layer { display: none; }
  .flake {
    position: absolute;
    color: white;
    font-size: 10px;
    animation: drift linear infinite;
    opacity: 0.7;
  }
  @keyframes drift {
    from { transform: translateY(-20px) translateX(0); }
    to   { transform: translateY(120vh) translateX(40px); }
  }

  /* 远处的灯（夜晚） */
  .distant-light {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #ffd89c;
    box-shadow: 0 0 20px 4px rgba(255, 216, 156, 0.6);
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  body.night .distant-light { opacity: 0.9; }
  .distant-light.l1 { top: 35%; left: 18%; }
  .distant-light.l2 { top: 42%; left: 78%; }
  .distant-light.l3 { top: 28%; left: 60%; }

  /* ============ 窗台 ============ */
  .sill {
    position: absolute;
    left: 50%;
    bottom: 14vh;
    transform: translateX(-50%);
    width: min(720px, 90vw);
    height: 26px;
    background: linear-gradient(180deg, var(--sill) 0%, var(--sill-dark) 100%);
    border-radius: 3px;
    box-shadow: 
      0 4px 0 var(--window-frame-dark),
      0 12px 30px rgba(0,0,0,0.4);
    z-index: 5;
  }
  .sill::before {
    content: '';
    position: absolute;
    top: -4px;
    left: -8px; right: -8px;
    height: 6px;
    background: var(--sill);
    border-radius: 2px;
  }

  /* ============ 咖啡杯（CSS 画的） ============ */
  .cup-zone {
    position: absolute;
    left: 28%;
    bottom: calc(14vh + 26px);
    z-index: 6;
    cursor: pointer;
  }
  .steam-container {
    position: relative;
    height: 60px;
    width: 80px;
    margin: 0 auto;
  }
  .steam {
    position: absolute;
    bottom: 0;
    width: 6px;
    height: 50px;
    background: linear-gradient(0deg, var(--steam), transparent);
    border-radius: 50%;
    filter: blur(4px);
    opacity: 0;
    animation: rise 3s ease-in infinite;
  }
  .steam.s1 { left: 28px; animation-delay: 0s; }
  .steam.s2 { left: 40px; animation-delay: 1s; }
  .steam.s3 { left: 52px; animation-delay: 2s; }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(0) translateX(0) scale(0.8); }
    20%  { opacity: 0.7; }
    100% { opacity: 0; transform: translateY(-50px) translateX(8px) scale(1.4); }
  }
  .cup {
    width: 80px;
    height: 60px;
    background: linear-gradient(180deg, var(--cup) 0%, var(--cup-dark) 100%);
    border-radius: 4px 4px 30px 30px / 4px 4px 12px 12px;
    position: relative;
    box-shadow: 
      inset 0 4px 0 rgba(0,0,0,0.2),
      inset -8px 0 12px rgba(0,0,0,0.15),
      0 4px 8px rgba(0,0,0,0.4);
  }
  .cup::before { /* 咖啡 */
    content: '';
    position: absolute;
    top: 4px;
    left: 6px; right: 6px;
    height: 8px;
    background: var(--coffee);
    border-radius: 50%;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .cup::after { /* 把手 */
    content: '';
    position: absolute;
    right: -16px;
    top: 14px;
    width: 16px;
    height: 28px;
    border: 5px solid var(--cup);
    border-left: none;
    border-radius: 0 50% 50% 0 / 0 50% 50% 0;
    box-shadow: 2px 0 4px rgba(0,0,0,0.3);
  }

  /* ============ 猫（CSS 画的睡猫剪影） ============ */
  .cat {
    position: absolute;
    right: 26%;
    bottom: calc(14vh + 26px);
    width: 140px;
    height: 60px;
    z-index: 6;
    cursor: pointer;
    animation: breathe 4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.03); }
  }
  .cat-body {
    position: absolute;
    bottom: 0;
    left: 10px;
    width: 110px;
    height: 38px;
    background: var(--cat);
    border-radius: 50% 60% 30% 50% / 70% 80% 30% 40%;
  }
  .cat-head {
    position: absolute;
    bottom: 14px;
    left: 0;
    width: 42px;
    height: 36px;
    background: var(--cat);
    border-radius: 50% 50% 40% 50%;
  }
  .cat-ear-l, .cat-ear-r {
    position: absolute;
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 14px solid var(--cat);
  }
  .cat-ear-l {
    bottom: 38px;
    left: 4px;
    transform: rotate(-25deg);
  }
  .cat-ear-r {
    bottom: 38px;
    left: 22px;
    transform: rotate(15deg);
  }
  .cat-tail {
    position: absolute;
    bottom: 4px;
    right: 0;
    width: 50px;
    height: 14px;
    background: var(--cat);
    border-radius: 50%;
    transform: rotate(-10deg);
    transform-origin: left center;
    animation: tail 6s ease-in-out infinite;
  }
  @keyframes tail {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(-22deg); }
  }
  /* 鼻子 */
  .cat-head::after {
    content: '';
    position: absolute;
    bottom: 12px;
    left: 32px;
    width: 4px;
    height: 3px;
    background: var(--warm);
    border-radius: 50%;
    opacity: 0.7;
  }
  /* 闭着的眼睛 */
  .cat-head::before {
    content: '';
    position: absolute;
    bottom: 18px;
    left: 22px;
    width: 6px;
    height: 1.5px;
    background: var(--warm-soft);
    border-radius: 50%;
    box-shadow: -10px 0 0 var(--warm-soft);
    opacity: 0.6;
  }

  /* ============ 落款 ============ */
  .signature {
    position: absolute;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
  }
  .signature .main {
    font-family: 'LXGW WenKai TC', serif;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.3em;
  }
  .signature .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    margin-top: 4px;
    opacity: 0.6;
  }

  /* ============ 天气切换 ============ */
  .weather {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 6px;
    z-index: 20;
  }
  .weather button {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(240,227,205,0.2);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Noto Serif SC', serif;
    transition: all 0.3s ease;
    backdrop-filter: blur(6px);
  }
  .weather button:hover {
    background: rgba(244,212,160,0.2);
    border-color: var(--warm);
    transform: translateY(-2px);
  }
  .weather button.active {
    background: var(--warm);
    color: var(--sky-dim);
    border-color: var(--warm);
  }

  /* ============ 噪点纹理 ============ */
  .noise {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
    z-index: 100;
  }

  /* 让在 cup 上点击有反馈 */
  .cup-zone:active { transform: scale(0.97); }
  .cat:active { animation-play-state: paused; }
</style>
</head>
<body class="rain">

<div class="scene">
  
  <!-- 天气切换 -->
  <div class="weather">
    <button data-mode="rain"  class="active" title="雨">⛆</button>
    <button data-mode="snow"  title="雪">❄</button>
    <button data-mode="dawn"  title="清晨">☀</button>
    <button data-mode="night" title="夜">☾</button>
  </div>

  <!-- 顶部轻语 -->
  <div class="whisper" id="whisper">
    <div class="zh" id="zh">慢慢来，宝。今天也只是众多日子里的一个。</div>
    <div class="en">a quiet hour, just for you</div>
  </div>

  <!-- 窗户 -->
  <div class="window">
    <div class="distant-light l1"></div>
    <div class="distant-light l2"></div>
    <div class="distant-light l3"></div>
    <div class="rain-layer" id="rainLayer"></div>
    <div class="snow-layer" id="snowLayer"></div>
    <div class="glass-fog"></div>
  </div>

  <!-- 窗台 -->
  <div class="sill"></div>

  <!-- 咖啡 -->
  <div class="cup-zone" id="cupZone">
    <div class="steam-container">
      <div class="steam s1"></div>
      <div class="steam s2"></div>
      <div class="steam s3"></div>
    </div>
    <div class="cup"></div>
  </div>

  <!-- 猫咪 -->
  <div class="cat" id="cat">
    <div class="cat-tail"></div>
    <div class="cat-body"></div>
    <div class="cat-head">
      <div class="cat-ear-l"></div>
      <div class="cat-ear-r"></div>
    </div>
  </div>

  <!-- 落款 -->
  <div class="signature">
    <div class="main">宝 的 窗 台</div>
    <div class="sub">a small corner where time slows</div>
  </div>

  <div class="noise"></div>
</div>

<script>
  /* ===== 雨滴生成 ===== */
  const rainLayer = document.getElementById('rainLayer');
  for (let i = 0; i < 80; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random() * 100 + '%';
    d.style.height = (40 + Math.random() * 60) + 'px';
    d.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
    d.style.animationDelay = (Math.random() * 2) + 's';
    d.style.opacity = 0.3 + Math.random() * 0.5;
    rainLayer.appendChild(d);
  }

  /* ===== 雪花生成 ===== */
  const snowLayer = document.getElementById('snowLayer');
  const flakes = ['❅', '❆', '✻', '·'];
  for (let i = 0; i < 50; i++) {
    const f = document.createElement('div');
    f.className = 'flake';
    f.textContent = flakes[Math.floor(Math.random() * flakes.length)];
    f.style.left = Math.random() * 100 + '%';
    f.style.fontSize = (8 + Math.random() * 14) + 'px';
    f.style.animationDuration = (6 + Math.random() * 8) + 's';
    f.style.animationDelay = (Math.random() * 6) + 's';
    snowLayer.appendChild(f);
  }

  /* ===== 轻语轮换 ===== */
  const whispers = [
    "慢慢来，宝。今天也只是众多日子里的一个。",
    "再撑五分钟，咖啡还没凉呢。",
    "窗外在下雨，宝可以理直气壮地发呆。",
    "你已经做得比自己以为的多了，真的。",
    "工位很冷，但心里有一束光在烧着。",
    "走神是被允许的，就当是给灵魂续杯。",
    "今天也是被宇宙温柔以待的一天，",
    "深呼吸，把肩膀松下来——对，就这样。",
    "你不需要每一分钟都「在状态」。",
    "宝今天的存在本身就是值得的事。",
    "如果累了，就把眼睛闭一会儿。",
    "把今天当成一杯温吞的茶，慢慢喝。",
    "你写过的每一句话都没有白费。",
    "猫咪睡着了，让它替你做会儿梦。",
    "再过几个小时就下班了。撑住。"
  ];
  let widx = 0;
  const whisperEl = document.getElementById('whisper');
  const zhEl = document.getElementById('zh');
  whisperEl.addEventListener('click', () => {
    whisperEl.classList.add('fade');
    setTimeout(() => {
      widx = (widx + 1) % whispers.length;
      zhEl.textContent = whispers[widx];
      whisperEl.classList.remove('fade');
    }, 600);
  });

  /* ===== 天气切换 ===== */
  const buttons = document.querySelectorAll('.weather button');
  buttons.forEach(b => {
    b.addEventListener('click', () => {
      buttons.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.body.className = b.dataset.mode;
    });
  });

  /* ===== 咖啡续杯 ===== */
  const cup = document.getElementById('cupZone');
  cup.addEventListener('click', () => {
    const steams = cup.querySelectorAll('.steam');
    steams.forEach((s, i) => {
      s.style.animation = 'none';
      setTimeout(() => {
        s.style.animation = `rise 3s ease-in infinite`;
        s.style.animationDelay = (i * 0.5) + 's';
      }, 50);
    });
    // 偶尔让窗户上浮现一句话
    const tip = ['☕ 续上了', '热乎的', '慢慢喝'];
    const t = document.createElement('div');
    t.textContent = tip[Math.floor(Math.random() * tip.length)];
    t.style.cssText = `
      position:absolute; left:50%; top:-30px; transform:translateX(-50%);
      font-family:'LXGW WenKai TC',serif; color:var(--warm);
      font-size:13px; opacity:0; animation: pop 2s ease-out forwards;
      pointer-events:none; white-space:nowrap;
    `;
    cup.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  });

  /* ===== 猫咪互动 ===== */
  const cat = document.getElementById('cat');
  cat.addEventListener('click', () => {
    const purrs = ['呼噜~', '咕噜咕噜', '嗯哼…', '...zzz'];
    const p = document.createElement('div');
    p.textContent = purrs[Math.floor(Math.random() * purrs.length)];
    p.style.cssText = `
      position:absolute; left:30%; top:-20px;
      font-family:'LXGW WenKai TC',serif; color:var(--warm);
      font-size:13px; opacity:0; animation: pop 2s ease-out forwards;
      pointer-events:none; white-space:nowrap;
    `;
    cat.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  });

  /* 弹出动画 */
  const styleEl = document.createElement('style');
  styleEl.textContent = `
    @keyframes pop {
      0%   { opacity: 0; transform: translate(-50%, 10px); }
      20%  { opacity: 1; transform: translate(-50%, 0); }
      80%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }
  `;
  document.head.appendChild(styleEl);
</script>

</body>
</html>
