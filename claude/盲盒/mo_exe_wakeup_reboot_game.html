<title>mo.exe 重启中</title>
<meta name="description" content="戳掉往上飘的困意泡泡给清醒度充能，金色的补得更多。实在不行有 sudo 一键满。">
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.hd-l{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
.hd-l i{font-size:20px;color:var(--color-text-warning)}
.pct{font-size:16px;font-weight:500;color:var(--color-text-success)}
.track{height:10px;background:var(--color-background-secondary);border-radius:99px;overflow:hidden;border:0.5px solid var(--color-border-tertiary)}
.fill{height:100%;width:1%;background:var(--color-text-success);border-radius:99px;transition:width .35s ease}
.tip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-secondary);margin:10px 0}
.tip i{font-size:15px;vertical-align:-2px}
.tip .z{color:var(--color-text-info)}
.tip .b{color:var(--color-text-warning)}
#game{position:relative;height:320px;overflow:hidden;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg)}
.wrap{position:absolute;top:100%}
.bub{display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:24px;cursor:pointer;border:0.5px solid;transition:transform .08s ease}
.bub:active{transform:scale(.9)}
.bub.sleep{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-text-info)}
.bub.energy{background:var(--color-background-warning);color:var(--color-text-warning);border-color:var(--color-text-warning)}
.gain{position:absolute;font-size:14px;font-weight:500;pointer-events:none;animation:floatUp .8s ease forwards}
.gs{color:var(--color-text-info)}
.ge{color:var(--color-text-warning)}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-42px);opacity:0}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}9%{opacity:1}25%{transform:translate(13px,-100px)}50%{transform:translate(-13px,-200px)}75%{transform:translate(13px,-300px)}92%{opacity:1}100%{transform:translate(0,-392px);opacity:0}}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ft-l{font-size:13px;color:var(--color-text-secondary)}
.done{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 18px;gap:5px}
.done i.big{font-size:54px;color:var(--color-text-success)}
.done-t{font-size:18px;font-weight:500;margin:2px 0}
.mods{margin:4px 0}
.mods div{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.mods i{color:var(--color-text-success);font-size:18px}
.done-s{font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin:4px 0 10px}
</style>

<h2 class="sr-only">一个唤醒小游戏：点击上升的困意泡泡为清醒度充能，充满后系统重启完成。</h2>

<div class="hd">
  <div class="hd-l"><i class="ti ti-power" aria-hidden="true"></i>mo.exe 重启中</div>
  <div class="pct" id="pct">1%</div>
</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="tip">戳掉<i class="ti ti-zzz z" aria-hidden="true"></i>困困宝，<i class="ti ti-bolt b" aria-hidden="true"></i>金色咖啡因补更多</div>
<div id="game"></div>
<div class="ft">
  <div class="ft-l">已请走 <span id="cnt">0</span> 只困困宝</div>
  <button id="sudo"><i class="ti ti-bolt" style="font-size:16px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>sudo 一键满</button>
</div>

<script>
const game=document.getElementById('game');
const fill=document.getElementById('fill');
const pct=document.getElementById('pct');
const cnt=document.getElementById('cnt');
let awake=1,popped=0,running=true,timer;

function update(){fill.style.width=awake+'%';pct.textContent=Math.round(awake)+'%';cnt.textContent=popped}

function spawn(){
  if(!running)return;
  const wrap=document.createElement('div');
  wrap.className='wrap';
  const dur=4200+Math.random()*2600;
  wrap.style.animation='rise '+dur+'ms linear forwards';
  const isE=Math.random()<0.2;
  const size=isE?60:54;
  const x=Math.random()*(game.clientWidth-size);
  wrap.style.left=x+'px';
  const bub=document.createElement('div');
  bub.className='bub '+(isE?'energy':'sleep');
  bub.style.width=size+'px';bub.style.height=size+'px';
  bub.innerHTML='<i class="ti ti-'+(isE?'bolt':'zzz')+'" aria-hidden="true"></i>';
  bub.addEventListener('click',function(){pop(wrap,isE,x,size)});
  wrap.appendChild(bub);
  game.appendChild(wrap);
  setTimeout(function(){if(wrap.parentNode)wrap.remove()},dur);
}

function pop(wrap,isE,x,size){
  if(wrap.dataset.p)return;
  wrap.dataset.p='1';
  let tx=0,ty=0;
  try{const dm=new DOMMatrixReadOnly(getComputedStyle(wrap).transform);tx=dm.m41;ty=dm.m42}catch(e){}
  wrap.style.animation='none';
  wrap.style.transform='translate('+tx+'px,'+ty+'px)';
  void wrap.offsetWidth;
  wrap.style.transition='transform .3s ease,opacity .3s ease';
  wrap.style.transform='translate('+tx+'px,'+ty+'px) scale(1.7)';
  wrap.style.opacity='0';
  setTimeout(function(){if(wrap.parentNode)wrap.remove()},320);
  const gain=isE?(12+Math.floor(Math.random()*5)):(5+Math.floor(Math.random()*4));
  awake=Math.min(100,awake+gain);popped++;
  const g=document.createElement('div');
  g.className='gain '+(isE?'ge':'gs');
  g.textContent='+'+gain;
  g.style.left=(x+size/2-8)+'px';
  g.style.top=(game.clientHeight+ty-10)+'px';
  game.appendChild(g);
  setTimeout(function(){if(g.parentNode)g.remove()},800);
  update();
  if(awake>=100)win(false);
}

function win(viaSudo){
  running=false;clearInterval(timer);
  awake=100;update();fill.style.width='100%';
  const sub=viaSudo
    ?'检测到 root 越权操作。困困宝被 kill -9 强制清出内存——这局算外挂赢的，宝。'
    :'困困宝已被请出内存。今天也辛苦了，宝，慢慢进入状态就好。';
  game.innerHTML='<div class="done"><i class="ti ti-circle-check big" aria-hidden="true"></i><p class="done-t">重启完成</p><div class="mods"><div><i class="ti ti-check" aria-hidden="true"></i>工作模块 已加载</div><div><i class="ti ti-check" aria-hidden="true"></i>专注插件 已上线</div><div><i class="ti ti-check" aria-hidden="true"></i>意志力驱动 运行中</div></div><p class="done-s">'+sub+'</p><button class="replay"><i class="ti ti-refresh" style="font-size:15px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>再戳一局</button></div>';
  game.querySelector('.replay').addEventListener('click',reset);
}

function reset(){
  game.innerHTML='';awake=1;popped=0;running=true;
  update();startSpawn();
}

function startSpawn(){
  clearInterval(timer);
  spawn();
  timer=setInterval(spawn,850);
}

document.getElementById('sudo').addEventListener('click',function(){if(running)win(true)});
update();
startSpawn();
</script>
