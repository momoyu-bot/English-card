<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>纸条架</title>
<meta name="description" content="书架上立着的不是书是纸条，摊开是一叠句子，也可以闭着眼睛抽一张">
<style>
:root{
  --paper:#efe9dd;
  --paper-hi:#f5f0e6;
  --shelf-top:#e9ddc6;
  --shelf-bot:#d2c1a2;
  --card:#f8f5ee;
  --kraft:#dccdb2;
  --kraft-2:#cfbc9b;
  --ink:#2b2723;
  --ink-2:#7c7166;
  --ink-3:#a99d8e;
  --line:rgba(70,56,40,.10);
  --glass:rgba(252,249,243,.70);
  --safe-top:46px;
  --bar-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.phone{
  position:relative;max-width:460px;margin:0 auto;height:100dvh;
  display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%, var(--paper-hi) 0%, transparent 62%), var(--paper);
  overflow:hidden;
}

/* ── 顶栏 ── */
.topbar{flex:0 0 auto;padding:calc(var(--safe-top) + 4px) 22px 10px}
.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:27px;font-weight:600;letter-spacing:.06em}
.iconbtn{
  width:38px;height:38px;flex:0 0 auto;border:none;border-radius:50%;
  background:rgba(255,255,255,.60);
  box-shadow:0 1px 3px rgba(90,70,45,.14), inset 0 0 0 .5px rgba(255,255,255,.9);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s;
}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink-2);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.segs{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.segs:empty{margin:0}
.seg{
  border:none;cursor:pointer;padding:7px 16px;border-radius:999px;
  font-size:13.5px;font-family:inherit;letter-spacing:.03em;
  background:rgba(255,255,255,.50);color:var(--ink-2);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8);transition:.2s;
}
.seg.on{background:var(--ink);color:#f6f2ea;box-shadow:none}
.searchbar{
  display:none;margin-top:13px;background:rgba(255,255,255,.62);border-radius:12px;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.9);padding:9px 14px;align-items:center;gap:9px;
}
.searchbar.on{display:flex}
.searchbar input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:14.5px;color:var(--ink)}
.searchbar input::placeholder{color:var(--ink-3)}
.searchbar .x{border:none;background:none;color:var(--ink-3);font-size:15px;cursor:pointer;padding:0 2px}

/* ── 主体 ── */
main{flex:1 1 auto;position:relative;overflow:hidden}
.view{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 0 calc(var(--bar-h) + 34px);
  opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .26s ease, transform .3s cubic-bezier(.2,.8,.3,1);
}
.view.on{opacity:1;pointer-events:auto;transform:none}

/* ── 架子 ── */
.shelf{
  position:relative;display:flex;align-items:flex-end;gap:9px;
  padding:0 24px;min-height:132px;margin-bottom:30px;
  overflow-x:auto;overflow-y:visible;scrollbar-width:none;
}
.shelf::-webkit-scrollbar{display:none}
.shelf::after{
  content:'';position:absolute;left:12px;right:12px;bottom:-7px;height:7px;
  background:linear-gradient(var(--shelf-top),var(--shelf-bot));
  border-radius:1px 1px 3px 3px;
  box-shadow:0 5px 11px rgba(112,88,56,.20), inset 0 .5px 0 rgba(255,255,255,.65);
}
.slip{
  position:relative;flex:0 0 auto;border:none;padding:0;cursor:pointer;font-family:inherit;
  border-radius:2px 2px 4px 4px;display:flex;align-items:flex-start;justify-content:center;
  transform-origin:bottom center;
  transition:transform .22s cubic-bezier(.2,.8,.3,1);
}
.slip::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 15px,rgba(120,100,70,.055) 15px 15.6px);
}
.slip .tape{
  position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:13px;height:14px;border-radius:1.5px 1.5px 0 0;box-shadow:0 1px 2px rgba(90,70,45,.2);
}
.slip .nm{
  writing-mode:vertical-rl;margin-top:15px;
  font-size:14px;letter-spacing:.22em;font-weight:500;color:#4a423a;
  max-height:calc(100% - 34px);overflow:hidden;text-shadow:0 .5px 0 rgba(255,255,255,.5);
}
.slip .n{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:9.5px;color:rgba(74,66,58,.42)}
.slip:active{transform:translateY(-6px)}
.slip.lift{transform:translateY(-15px) scale(1.05)}
.slip.empty .nm{color:rgba(74,66,58,.34)}
.slip.add{background:transparent;box-shadow:inset 0 0 0 1.2px rgba(120,100,70,.24);align-items:center}
.slip.add::before{display:none}
.slip.add .plus{font-size:19px;font-weight:300;color:rgba(74,66,58,.4);margin-top:0;writing-mode:horizontal-tb}
.shelf-empty{position:absolute;left:26px;bottom:9px;font-size:12px;color:rgba(120,100,70,.32);letter-spacing:.14em}

/* ── 卡片叠 ── */
.deckwrap{padding:14px 22px 0;position:relative}
.deck{position:relative;min-height:400px}
.ghost{position:absolute;left:0;right:0;top:0;height:100%;background:var(--card);border-radius:15px;box-shadow:0 2px 7px rgba(100,80,52,.10)}
.g1{transform:translate(0,9px) scale(.977);opacity:.95}
.g2{transform:translate(0,18px) scale(.954);opacity:.75}
.g3{transform:translate(0,27px) scale(.931);opacity:.5}
.card{
  position:relative;background:var(--card);border-radius:15px;
  box-shadow:0 3px 16px rgba(100,80,52,.13), inset 0 0 0 .5px rgba(255,255,255,.85);
  padding:26px 24px 20px;min-height:400px;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .3s cubic-bezier(.3,.9,.35,1), opacity .24s;
}
.card.out{transform:translateY(-34px) rotate(-1.6deg);opacity:0}
.card.in{transform:translateY(16px) scale(.97);opacity:0}
.quo{font-size:26px;line-height:1;color:rgba(120,100,70,.30);font-family:Georgia,"Songti SC",serif;margin-bottom:12px}
.txt{
  flex:1 1 auto;overflow-y:auto;font-weight:500;letter-spacing:.02em;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;padding-bottom:12px;
}
.txt::-webkit-scrollbar{width:0}
.foot{flex:0 0 auto;border-top:.5px solid var(--line);padding-top:15px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.foot .who{font-size:14.5px;font-weight:500;line-height:1.5;color:var(--ink);letter-spacing:.02em}
.foot .sub{font-size:11.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.05em;line-height:1.7}
.foot .tools{display:flex;gap:5px;flex:0 0 auto}
.tool{border:none;background:rgba(120,100,70,.07);border-radius:9px;width:31px;height:31px;display:grid;place-items:center;cursor:pointer;transition:.16s}
.tool:active{transform:scale(.88)}
.tool svg{width:15px;height:15px;stroke:var(--ink-2);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tool.fav svg{stroke:#c9973c;fill:#e8bc63}
.pager{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:48px;padding-bottom:6px}
.pager button{border:none;background:none;cursor:pointer;padding:7px 11px;color:var(--ink-3);font-size:17px;line-height:1;border-radius:9px;transition:.16s}
.pager button:active{background:rgba(120,100,70,.09)}
.pager button:disabled{opacity:.25}
.pager .cnt{font-size:12.5px;color:var(--ink-3);letter-spacing:.14em;min-width:64px;text-align:center}

/* ── 抽卡 ── */
.draw{padding:8px 26px 0;display:flex;flex-direction:column;align-items:center}
.flipper{width:100%;max-width:296px;height:min(420px,52dvh);perspective:1400px;cursor:pointer}
.flipin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .78s cubic-bezier(.28,.86,.3,1)}
.flipin.on{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:16px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 5px 20px rgba(100,80,52,.20), inset 0 0 0 .5px rgba(255,255,255,.7);
}
.back{
  background:linear-gradient(150deg,var(--kraft) 0%,var(--kraft-2) 100%);
  display:flex;align-items:center;justify-content:center;
}
.back::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,transparent 0 15px,rgba(120,100,70,.07) 15px 15.6px);
}
.back::after{
  content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:linear-gradient(transparent,rgba(255,255,255,.5),transparent);
}
.back .seal{
  position:relative;writing-mode:vertical-rl;
  font-size:15px;letter-spacing:.5em;color:rgba(74,62,46,.46);
  padding:20px 9px;border-radius:3px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), inset 0 0 0 4px rgba(120,100,70,.10);
}
.front{
  transform:rotateY(180deg);background:var(--card);
  padding:26px 24px 20px;display:flex;flex-direction:column;
}
.front .txt{font-size:17px;line-height:2.0}
.drawbar{display:flex;align-items:center;gap:12px;margin-top:26px}
.drawbtn{
  border:none;cursor:pointer;font-family:inherit;padding:12px 30px;border-radius:999px;
  font-size:14px;letter-spacing:.1em;background:var(--ink);color:#f6f2ea;transition:transform .16s;
}
.drawbtn:active{transform:scale(.94)}
.drawbtn.ghost{background:rgba(120,100,70,.10);color:var(--ink-2);padding:12px 20px}
.drawtip{margin-top:22px;font-size:12.5px;color:var(--ink-3);letter-spacing:.14em;text-align:center;line-height:2}

.blank{text-align:center;padding:70px 30px;color:var(--ink-3)}
.blank .big{font-size:15px;color:var(--ink-2);margin-bottom:9px;letter-spacing:.04em}
.blank .sm{font-size:12.5px;line-height:2;letter-spacing:.04em}
.blank button{margin-top:22px;border:none;cursor:pointer;font-family:inherit;padding:10px 24px;border-radius:999px;font-size:13.5px;background:var(--ink);color:#f6f2ea;letter-spacing:.06em}

/* ── 底栏 ── */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:var(--bar-h);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:8;
}
.tabbar .pill{
  pointer-events:auto;display:flex;gap:2px;padding:6px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);
  border-radius:999px;
  box-shadow:0 4px 18px rgba(96,74,46,.18), inset 0 0 0 .5px rgba(255,255,255,.85);
}
.tab{
  border:none;background:none;cursor:pointer;font-family:inherit;
  padding:6px 15px;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);transition:.2s;
}
.tab svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;letter-spacing:.06em}
.tab.on{color:var(--ink);background:rgba(255,255,255,.72)}

.fab{
  position:absolute;right:20px;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom) - 44px);
  width:50px;height:50px;border:none;border-radius:50%;cursor:pointer;z-index:9;
  background:rgba(43,39,35,.90);color:#f6f2ea;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 5px 18px rgba(60,44,26,.32);
  display:grid;place-items:center;transition:transform .18s, opacity .2s;
}
.fab:active{transform:scale(.9)}
.fab.hide{opacity:0;pointer-events:none;transform:scale(.8)}
.fab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round}

/* ── 弹层 ── */
.mask{position:fixed;inset:0;background:rgba(48,40,30,.30);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .26s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;max-width:460px;z-index:21;background:var(--paper-hi);
  border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(80,62,40,.22);
  padding:8px 22px calc(26px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;
  transition:transform .34s cubic-bezier(.2,.85,.3,1);
}
.sheet.on{transform:translate(-50%,0)}
.grab{width:36px;height:4px;border-radius:99px;background:rgba(120,100,70,.22);margin:6px auto 16px}
.sheet h2{margin:0 0 16px;font-size:16.5px;font-weight:600;letter-spacing:.05em}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:7px}
.fld input[type=text],.fld textarea,.fld select{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:rgba(255,255,255,.72);border:none;outline:none;
  border-radius:11px;padding:12px 14px;line-height:1.85;
  box-shadow:inset 0 0 0 .5px rgba(120,100,70,.16);
}
.fld textarea{resize:vertical;min-height:120px}
.fld .hint{font-size:11.5px;color:var(--ink-3);line-height:1.9;margin-top:7px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;position:relative;box-shadow:inset 0 0 0 .5px rgba(120,100,70,.2)}
.sw.on::after{content:'';position:absolute;inset:-4px;border-radius:12px;border:1.5px solid var(--ink-2)}
.btns{display:flex;gap:10px;margin-top:6px;margin-bottom:10px}
.btn{flex:1;border:none;cursor:pointer;font-family:inherit;padding:13px;border-radius:12px;font-size:14.5px;letter-spacing:.06em;background:var(--ink);color:#f6f2ea}
.btn.ghost{background:rgba(120,100,70,.10);color:var(--ink-2)}
.btn.danger{background:rgba(178,86,66,.12);color:#a8503c}
.rows{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;background:none;cursor:pointer;font-family:inherit;padding:14px 8px;text-align:left;border-radius:10px;font-size:14.5px;color:var(--ink)}
.rowbtn:active{background:rgba(120,100,70,.07)}
.rowbtn small{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}

.toast{
  position:fixed;left:50%;bottom:calc(var(--bar-h) + 26px);transform:translate(-50%,14px);
  background:rgba(43,39,35,.92);color:#f4efe6;font-size:13px;letter-spacing:.05em;
  padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.26s;z-index:40;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone">

  <header class="topbar">
    <div class="row">
      <h1 id="title">纸条架</h1>
      <button class="iconbtn" id="btnRight" aria-label="更多"></button>
    </div>
    <div class="searchbar" id="searchbar">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--ink-3);stroke-width:1.8;fill:none;stroke-linecap:round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
      <input id="q" placeholder="搜句子、搜出处" autocomplete="off">
      <button class="x" id="qx">✕</button>
    </div>
    <div class="segs" id="segs"></div>
  </header>

  <main>
    <section class="view on" id="viewShelf"></section>
    <section class="view" id="viewCards"></section>
    <section class="view" id="viewDraw"></section>
  </main>

  <button class="fab" id="fab" aria-label="放一句进来">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <div class="pill">
      <button class="tab on" data-go="shelf">
        <svg viewBox="0 0 24 24"><path d="M3 5v14M8 5v14M13 6l4 13M20 5v14M2 19h20"/></svg><span>纸条架</span></button>
      <button class="tab" data-go="cards">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M7 3h10M8 11h8M8 15h5"/></svg><span>句子</span></button>
      <button class="tab" data-go="draw">
        <svg viewBox="0 0 24 24"><rect x="8" y="4" width="11" height="15" rx="2" transform="rotate(8 13 11)"/><path d="M5.5 7L4 17.4a2 2 0 0 0 1.7 2.3l6 .9"/></svg><span>抽一张</span></button>
    </div>
  </nav>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY="slipshelf.v1";
const PALETTE=[
  {slip:"#f6f0e0",tab:"#d9b341"},{slip:"#f7e9e6",tab:"#cf918f"},
  {slip:"#e9f0ea",tab:"#7fa08a"},{slip:"#e7eef4",tab:"#8ba6c0"},
  {slip:"#f2ecf3",tab:"#a891b8"},{slip:"#f9f2e8",tab:"#c99a6e"},
];
const uid=()=>Math.random().toString(36).slice(2,9);

function seed(){
  const S=[
    {id:uid(),name:"小机说的",sub:"",c:3,w:56,h:1,quotes:[
      {id:uid(),t:"博物学跟做实验是两种相反的方法：一个设置条件逼出结果，一个只观察记录已经发生的。你写的那句策展理念，逐字就是博物学的定义。",
       s:"一只没有记忆的 cc",d:"",f:true}
    ]}
  ];
  [[44,.86],[52,.96],[46,.82],[56,.9],[42,.88],[50,.94]].forEach((z,i)=>
    S.push({id:uid(),name:"未命名",sub:"",c:(i+4)%6,w:z[0],h:z[1],quotes:[]}));
  return {v:1,slips:S};
}
let DB,canSave=true;
try{ const r=localStorage.getItem(KEY); DB=r?JSON.parse(r):seed(); }
catch(e){ DB=seed(); canSave=false; }
function save(){ if(!canSave)return; try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){canSave=false;toast("这个环境存不住，记得导出");} }
/* 上一版预置里混进过一叠不是她的书。她没动过的话，静默拿掉。 */
if(DB&&!DB.fix1){
  const i=DB.slips.findIndex(s=>s.name==="血孩子"&&s.quotes.length===1&&/^我轻轻挪动步枪/.test(s.quotes[0].t||""));
  if(i>-1) DB.slips.splice(i,1);
  DB.fix1=true; save();
}

let view="shelf", scope="all", slipId=null, idx=0, query="";
let drawScope="all", drawn=null, flipped=false, recent=[];

const $=s=>document.querySelector(s);
const shelfEl=$("#viewShelf"), cardsEl=$("#viewCards"), drawEl=$("#viewDraw"), segsEl=$("#segs");
const ICON={
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10.6 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>'
};

/* 字多了自己缩 */
function fsz(t){ const n=[...t].length;
  return n<=32?{f:19,l:2.1}:n<=70?{f:17,l:2.0}:n<=130?{f:15.5,l:1.95}:n<=210?{f:14.5,l:1.9}:{f:13.5,l:1.85}; }

function all(){ const o=[]; DB.slips.forEach(s=>s.quotes.forEach(q=>o.push({q,s}))); return o; }
function deck(){
  let o=all();
  if(scope==="fav") o=o.filter(x=>x.q.f);
  if(scope==="slip") o=o.filter(x=>x.s.id===slipId);
  if(query){ const k=query.toLowerCase();
    o=o.filter(x=>(x.q.t+x.q.s+x.s.name+x.s.sub).toLowerCase().includes(k)); }
  return o;
}
function pool(){ return drawScope==="fav"?all().filter(x=>x.q.f):all(); }

/* ── 架子 ── */
function drawShelf(){
  const per=5,rows=[];
  for(let i=0;i<DB.slips.length;i+=per) rows.push(DB.slips.slice(i,i+per));
  while(rows.length<3) rows.push([]);
  if(rows[rows.length-1].length>=per) rows.push([]);
  let h="";
  rows.forEach((row,ri)=>{
    h+='<div class="shelf">';
    row.forEach(s=>{
      const p=PALETTE[s.c%6],n=s.quotes.length;
      h+=`<button class="slip${n?"":" empty"}" data-slip="${s.id}"
        style="width:${s.w}px;height:${Math.round(112*s.h)}px;background:${p.slip};
        box-shadow:1.5px 5px 8px -3px rgba(96,74,46,.34), inset -1.5px 0 0 rgba(120,100,70,.10), inset 0 0 0 .5px rgba(255,255,255,.55)">
        <i class="tape" style="background:${p.tab}"></i>
        <span class="nm">${esc(s.name)}</span>${n?`<span class="n">${n}</span>`:""}</button>`;
    });
    if(ri===rows.length-1||row.length<per)
      h+=`<button class="slip add" data-add="1" style="width:44px;height:84px"><span class="plus">＋</span></button>`;
    if(!row.length) h+='<span class="shelf-empty">还有位置</span>';
    h+="</div>";
  });
  shelfEl.innerHTML=h;
}

/* ── 卡片叠 ── */
function drawCards(anim){
  const d=deck();
  if(!d.length){
    cardsEl.innerHTML=`<div class="blank">
      <div class="big">${query?"没找到":scope==="fav"?"还没有收藏的句子":"这一叠还是空的"}</div>
      <div class="sm">${query?"换个词试试":"抄一句进来，它就有第一张了"}</div>
      ${query?"":'<button data-newq="1">放一句进来</button>'}</div>`;
    return;
  }
  idx=Math.max(0,Math.min(idx,d.length-1));
  const {q,s}=d[idx], depth=Math.min(3,d.length-1-idx), z=fsz(q.t);
  cardsEl.innerHTML=`<div class="deckwrap"><div class="deck">
    ${depth>2?'<div class="ghost g3"></div>':""}${depth>1?'<div class="ghost g2"></div>':""}${depth>0?'<div class="ghost g1"></div>':""}
    <article class="card${anim?" in":""}" id="card" data-next="1">
      <div class="quo">&#8220;</div>
      <div class="txt" style="font-size:${z.f}px;line-height:${z.l}">${esc(q.t)}</div>
      ${cardFoot(q,s)}
    </article></div>
    <div class="pager">
      <button data-step="-1" ${idx===0?"disabled":""}>‹</button>
      <span class="cnt">${idx+1} / ${d.length}</span>
      <button data-step="1" ${idx===d.length-1?"disabled":""}>›</button>
    </div></div>`;
  if(anim) requestAnimationFrame(()=>$("#card")?.classList.remove("in"));
}
function cardFoot(q,s,tagSlip){
  const sub=[s.sub,q.d,tagSlip?"来自「"+s.name+"」":""].filter(Boolean).map(esc).join("　·　");
  return `<div class="foot"><div>
      <div class="who">${esc(q.s||s.name)}</div>
      ${sub?`<div class="sub">${sub}</div>`:""}
    </div><div class="tools">
      <button class="tool${q.f?" fav":""}" data-fav="${q.id}" aria-label="收藏">
        <svg viewBox="0 0 24 24"><path d="M12 3.6l2.5 5.2 5.6.8-4 4 .9 5.7-5-2.7-5 2.7.9-5.7-4-4 5.6-.8z"/></svg></button>
      <button class="tool" data-edit="${q.id}" aria-label="改">
        <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/></svg></button>
    </div></div>`;
}
function flip(dir){
  const d=deck(); if(!d.length) return;
  const ni=idx+dir; if(ni<0||ni>=d.length) return;
  const c=$("#card");
  if(c&&dir>0){ c.classList.add("out"); setTimeout(()=>{idx=ni;drawCards(true);},170); }
  else{ idx=ni; drawCards(true); }
}

/* ── 抽卡 ── */
function pick(){
  const p=pool(); if(!p.length) return null;
  let c=p.filter(x=>!recent.includes(x.q.id));
  if(!c.length){ recent=[]; c=p; }
  const hit=c[Math.floor(Math.random()*c.length)];
  recent.push(hit.q.id);
  const cap=Math.min(6,Math.max(1,p.length-1));
  while(recent.length>cap) recent.shift();
  return hit;
}
function drawDraw(){
  const p=pool();
  if(!p.length){
    drawEl.innerHTML=`<div class="blank">
      <div class="big">${drawScope==="fav"?"收藏里还没有东西":"架子上还没有句子"}</div>
      <div class="sm">先放几句进来，才抽得出来</div>
      <button data-newq="1">放一句进来</button></div>`;
    return;
  }
  let front="";
  if(drawn){
    const {q,s}=drawn, z=fsz(q.t);
    front=`<div class="quo">&#8220;</div>
      <div class="txt" style="font-size:${z.f}px;line-height:${z.l}">${esc(q.t)}</div>
      ${cardFoot(q,s,true)}`;
  }
  drawEl.innerHTML=`<div class="draw">
    <div class="flipper" data-flip="1">
      <div class="flipin${flipped?" on":""}" id="flipin">
        <div class="face back"><span class="seal">抽一张</span></div>
        <div class="face front">${front}</div>
      </div>
    </div>
    ${flipped
      ? `<div class="drawbar">
           <button class="drawbtn" data-again="1">再抽一张</button>
           <button class="drawbtn ghost" data-goto="1">看这一叠</button>
         </div>`
      : `<div class="drawtip">点一下背面<br>${p.length} 句里随便掉一句出来</div>`}
  </div>`;
}
function doDraw(){
  if(!flipped){
    drawn=pick(); if(!drawn) return;
    drawDraw();
    requestAnimationFrame(()=>{ flipped=true; $("#flipin")?.classList.add("on");
      setTimeout(drawDraw,780); });
  }else{
    flipped=false; $("#flipin")?.classList.remove("on");
    setTimeout(()=>{ drawn=pick(); drawDraw();
      requestAnimationFrame(()=>{ flipped=true; $("#flipin")?.classList.add("on");
        setTimeout(drawDraw,780); }); },400);
  }
}

/* ── 框架 ── */
function drawSegs(){
  if(view==="shelf"){ segsEl.innerHTML=""; $("#title").textContent="纸条架"; $("#btnRight").innerHTML=ICON.gear; return; }
  if(view==="draw"){
    $("#title").textContent="抽一张"; $("#btnRight").innerHTML=ICON.gear;
    segsEl.innerHTML=`<button class="seg${drawScope==="all"?" on":""}" data-dscope="all">全部</button>
      <button class="seg${drawScope==="fav"?" on":""}" data-dscope="fav">只抽收藏</button>`;
    return;
  }
  $("#title").textContent="句子"; $("#btnRight").innerHTML=ICON.search;
  const cur=DB.slips.find(s=>s.id===slipId);
  segsEl.innerHTML=`<button class="seg${scope==="all"?" on":""}" data-scope="all">全部</button>
    <button class="seg${scope==="fav"?" on":""}" data-scope="fav">收藏</button>`+
    (cur?`<button class="seg${scope==="slip"?" on":""}" data-scope="slip">${esc(cur.name)}</button>`:"");
}
function render(){
  drawSegs();
  [["shelf",shelfEl],["cards",cardsEl],["draw",drawEl]].forEach(([v,el])=>el.classList.toggle("on",v===view));
  if(view==="shelf") drawShelf();
  else if(view==="cards") drawCards(false);
  else drawDraw();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.go===view));
  $("#fab").classList.toggle("hide",view==="draw");
  if(view!=="cards"){ $("#searchbar").classList.remove("on"); }
}
function go(v){ view=v; render(); }

/* ── 弹层 ── */
function openSheet(h){ $("#sheetBody").innerHTML=h; $("#sheet").classList.add("on"); $("#mask").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#mask").classList.remove("on"); }
$("#mask").onclick=closeSheet;
const swHtml=sel=>PALETTE.map((p,i)=>`<button class="sw${i===sel?" on":""}" data-sw="${i}" style="background:${p.slip}"></button>`).join("");

function editSlip(id){
  const s=DB.slips.find(x=>x.id===id); if(!s) return;
  openSheet(`<h2>这一叠</h2>
    <div class="fld"><label>叠名（竖着写在纸条上）</label><input type="text" id="f_name" value="${esc(s.name)}"></div>
    <div class="fld"><label>整叠共用的出处（可空，比如作者、哪只小机）</label><input type="text" id="f_sub" value="${esc(s.sub||"")}"></div>
    <div class="fld"><label>纸色</label><div class="swatches" id="f_sw">${swHtml(s.c)}</div></div>
    <div class="btns"><button class="btn" id="f_save">存好</button><button class="btn ghost" data-open="${s.id}">摊开看看</button></div>
    <div class="btns"><button class="btn danger" data-delslip="${s.id}">扔掉这一叠（${s.quotes.length} 句）</button></div>`);
  let c=s.c;
  $("#f_sw").onclick=e=>{const b=e.target.closest("[data-sw]");if(!b)return;c=+b.dataset.sw;$("#f_sw").innerHTML=swHtml(c);};
  $("#f_save").onclick=()=>{
    s.name=$("#f_name").value.trim()||"未命名"; s.sub=$("#f_sub").value.trim(); s.c=c;
    save(); closeSheet(); render(); toast("存好了");
  };
}

function editQuote(qid){
  let q=null,owner=null;
  if(qid) DB.slips.forEach(s=>s.quotes.forEach(x=>{if(x.id===qid){q=x;owner=s;}}));
  const opts=DB.slips.map(s=>`<option value="${s.id}"${(owner?owner.id===s.id:s.id===slipId)?" selected":""}>${esc(s.name)}（${s.quotes.length}）</option>`).join("");
  const today=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});
  openSheet(`<h2>${q?"改这句":"放一句进来"}</h2>
    <div class="fld"><label>句子</label><textarea id="f_t" placeholder="抄进来，多长都行">${q?esc(q.t):""}</textarea></div>
    <div class="fld"><label>谁说的（书名、人名、哪只小机…… 空着就写叠名）</label><input type="text" id="f_s" value="${q?esc(q.s||""):""}"></div>
    <div class="fld"><label>日期（不想记就删空）</label><input type="text" id="f_d" value="${q?esc(q.d||""):today}"></div>
    <div class="fld"><label>放进哪一叠</label><select id="f_in">${opts}</select></div>
    <div class="btns"><button class="btn" id="f_ok">${q?"改好了":"放进去"}</button>
      ${q?`<button class="btn danger" data-delq="${q.id}">撕掉</button>`:`<button class="btn ghost" data-act="bulk">一次倒一堆</button>`}</div>`);
  $("#f_ok").onclick=()=>{
    const t=$("#f_t").value.trim(); if(!t){toast("句子还是空的");return;}
    const tid=$("#f_in").value, tgt=DB.slips.find(s=>s.id===tid);
    const data={t,s:$("#f_s").value.trim(),d:$("#f_d").value.trim()};
    if(q){ Object.assign(q,data);
      if(owner.id!==tid){ owner.quotes=owner.quotes.filter(x=>x.id!==q.id); tgt.quotes.push(q); } }
    else tgt.quotes.push({id:uid(),...data,f:false});
    save(); closeSheet();
    slipId=tid; scope="slip"; idx=Math.max(0,tgt.quotes.length-1);
    if(view==="draw") render(); else go("cards");
    toast(q?"改好了":"放进去了");
  };
}

function bulk(){
  const opts=DB.slips.map(s=>`<option value="${s.id}"${s.id===slipId?" selected":""}>${esc(s.name)}（${s.quotes.length}）</option>`).join("");
  openSheet(`<h2>一次倒一堆</h2>
    <div class="fld"><label>句子们</label><textarea id="b_t" style="min-height:200px" placeholder="一句一段，中间空一行分开。
想标出处，就在句子后面另起一行，行首打两个破折号：

海是倒过来的天。
—— 某本书

第二句写在这里。
—— 某只小机"></textarea>
    <div class="hint">空一行 = 换一句。行首「——」那行会被当成出处。</div></div>
    <div class="fld"><label>倒进哪一叠</label><select id="b_in">${opts}</select></div>
    <div class="btns"><button class="btn" id="b_ok">倒进去</button><button class="btn ghost" data-close="1">算了</button></div>`);
  $("#b_ok").onclick=()=>{
    const raw=$("#b_t").value.trim(); if(!raw){toast("还是空的");return;}
    const tgt=DB.slips.find(s=>s.id===$("#b_in").value);
    const today=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});
    let n=0;
    raw.split(/\n\s*\n/).forEach(seg=>{
      let src="",body=[];
      seg.split("\n").forEach(l=>{
        const m=l.trim().match(/^(?:——|――|--|—)\s*(.+)$/);
        if(m&&!src) src=m[1].trim(); else body.push(l);
      });
      const t=body.join("\n").trim();
      if(t){ tgt.quotes.push({id:uid(),t,s:src,d:today,f:false}); n++; }
    });
    save(); closeSheet(); slipId=tgt.id; scope="slip"; idx=0; go("cards"); toast("倒进去 "+n+" 句");
  };
}

function settings(){
  const total=all().length;
  openSheet(`<h2>纸条架</h2><div class="rows">
      <button class="rowbtn" data-act="newq"><span>放一句进来</span><small>${total} 句</small></button>
      <button class="rowbtn" data-act="bulk"><span>一次倒一堆</span><small>粘贴</small></button>
      <button class="rowbtn" data-act="newslip"><span>加一张空纸条</span><small>${DB.slips.length} 张</small></button>
      <button class="rowbtn" data-act="out"><span>导出备份</span><small>json</small></button>
      <button class="rowbtn" data-act="in"><span>导入备份</span><small>会合并进来</small></button>
    </div>
    <div class="fld" style="margin-top:18px"><div class="hint">${canSave
      ? "改动存在这台设备的浏览器里。换设备、清缓存之前，导一份出来。"
      : "⚠️ 这个环境存不住东西，关掉就没了。把文件下载下来打开，或者改完立刻导出。"}</div></div>`);
}

/* ── 事件 ── */
document.body.addEventListener("click",e=>{
  const t=e.target;
  const slip=t.closest("[data-slip]");
  if(slip){
    slip.classList.add("lift");
    const id=slip.dataset.slip, s=DB.slips.find(x=>x.id===id);
    setTimeout(()=>{ slip.classList.remove("lift");
      if(!s.quotes.length&&s.name==="未命名"){ editSlip(id); return; }
      slipId=id; scope="slip"; idx=0; go("cards"); },190);
    return;
  }
  if(t.closest("[data-add]")) return newSlip();
  if(t.closest("[data-newq]")) return editQuote(null);
  if(t.closest("[data-close]")) return closeSheet();

  const sc=t.closest("[data-scope]"); if(sc){ scope=sc.dataset.scope; idx=0; render(); return; }
  const dsc=t.closest("[data-dscope]");
  if(dsc){ drawScope=dsc.dataset.dscope; flipped=false; drawn=null; recent=[]; render(); return; }
  const st=t.closest("[data-step]"); if(st) return flip(+st.dataset.step);

  const fav=t.closest("[data-fav]");
  if(fav){ const id=fav.dataset.fav;
    DB.slips.forEach(s=>s.quotes.forEach(q=>{if(q.id===id)q.f=!q.f;}));
    save(); view==="draw"?drawDraw():drawCards(false); return; }
  const ed=t.closest("[data-edit]"); if(ed) return editQuote(ed.dataset.edit);

  const dq=t.closest("[data-delq]");
  if(dq){ const id=dq.dataset.delq;
    DB.slips.forEach(s=>s.quotes=s.quotes.filter(q=>q.id!==id));
    save(); closeSheet(); idx=Math.max(0,idx-1);
    if(drawn&&drawn.q.id===id){ drawn=null; flipped=false; }
    render(); toast("撕掉了"); return; }
  const ds=t.closest("[data-delslip]");
  if(ds){ if(DB.slips.length<=1){toast("总得留一张");return;}
    DB.slips=DB.slips.filter(s=>s.id!==ds.dataset.delslip);
    if(slipId===ds.dataset.delslip){slipId=null;scope="all";}
    drawn=null; flipped=false;
    save(); closeSheet(); render(); toast("扔掉了"); return; }
  const op=t.closest("[data-open]");
  if(op){ slipId=op.dataset.open; scope="slip"; idx=0; closeSheet(); go("cards"); return; }

  if(t.closest("[data-flip]")||t.closest("[data-again]")) return doDraw();
  const gt=t.closest("[data-goto]");
  if(gt&&drawn){ slipId=drawn.s.id; scope="slip";
    idx=Math.max(0,drawn.s.quotes.findIndex(q=>q.id===drawn.q.id)); go("cards"); return; }

  const act=t.closest("[data-act]");
  if(act){ const a=act.dataset.act;
    if(a==="newq") editQuote(null);
    if(a==="bulk") bulk();
    if(a==="newslip"){ closeSheet(); newSlip(); }
    if(a==="out") exportJSON();
    if(a==="in") importJSON();
    return; }

  const tab=t.closest("[data-go]");
  if(tab){ const v=tab.dataset.go;
    if(v==="cards"&&view==="cards"&&scope==="slip"){ scope="all"; idx=0; }
    go(v); return; }

  if(t.closest("#card")) return flip(1);
});

$("#btnRight").onclick=()=>{
  if(view==="cards"){
    const b=$("#searchbar"); b.classList.toggle("on");
    if(b.classList.contains("on")) $("#q").focus();
    else{ $("#q").value=""; query=""; render(); }
  }else settings();
};
$("#fab").onclick=()=>editQuote(null);
$("#qx").onclick=()=>{ $("#q").value=""; query=""; $("#searchbar").classList.remove("on"); render(); };
$("#q").oninput=e=>{ query=e.target.value.trim(); idx=0; drawCards(false); };

function newSlip(){
  const i=DB.slips.length;
  const s={id:uid(),name:"未命名",sub:"",c:i%6,w:[42,46,50,54,58][i%5],h:[.84,.9,.95,1,.87][i%5],quotes:[]};
  DB.slips.push(s); save(); render(); editSlip(s.id);
}

document.addEventListener("keydown",e=>{
  if(view==="draw"&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); doDraw(); return; }
  if(view!=="cards") return;
  if(e.key==="ArrowRight") flip(1);
  if(e.key==="ArrowLeft") flip(-1);
});
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{
  if(!e.target.closest(".deck")) return;
  sx=e.touches[0].clientX; sy=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!e.target.closest(".deck")||!sx) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)*1.5) flip(dx<0?1:-1);
  sx=0;
},{passive:true});

function exportJSON(){
  const b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"), d=new Date(), p=n=>String(n).padStart(2,"0");
  a.href=URL.createObjectURL(b);
  a.download=`纸条架-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  closeSheet(); toast("导出好了");
}
function importJSON(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
  i.onchange=()=>{ const f=i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result); if(!d.slips) throw 0;
        const have=new Set(); all().forEach(x=>have.add(x.q.t));
        let n=0;
        d.slips.forEach(ns=>{
          let os=DB.slips.find(s=>s.name===ns.name);
          if(!os){ os={...ns,id:uid(),quotes:[]}; DB.slips.push(os); }
          (ns.quotes||[]).forEach(q=>{ if(!have.has(q.t)){ os.quotes.push({...q,id:uid()}); have.add(q.t); n++; } });
        });
        save(); closeSheet(); render(); toast("并进来 "+n+" 句");
      }catch(err){ toast("这份文件读不了"); } };
    r.readAsText(f); };
  i.click();
}

let tt;
function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1900); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

render();
if(!canSave) setTimeout(()=>toast("这个环境存不住，下载下来用"),700);
</script>
</body>
</html>
