<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.scene-wrap { padding: 0.5rem 0; }
.scene { width: 100%; display: block; border-radius: var(--border-radius-lg); }
.msg-box { 
  margin-top: 12px; padding: 16px 20px; 
  background: var(--color-background-secondary); 
  border-radius: var(--border-radius-lg);
  font-size: 15px; line-height: 1.75;
  min-height: 60px; display: flex; align-items: center;
  border: 0.5px solid var(--color-border-tertiary);
}
.msg-text { transition: opacity 0.3s; }
.hint { margin-top: 10px; font-size: 12px; color: var(--color-text-tertiary); text-align: center; letter-spacing: 0.5px; }
.more { margin-top: 14px; text-align: center; }
.zone { cursor: pointer; }
.zone:hover .hover-glow { opacity: 0.16; }
.hover-glow { opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.flame { transform-origin: 50% 100%; transform-box: fill-box; animation: flick1 1.5s ease-in-out infinite alternate; }
.flame-b { transform-origin: 50% 100%; transform-box: fill-box; animation: flick2 1.2s 0.2s ease-in-out infinite alternate; }
.flame-c { transform-origin: 50% 100%; transform-box: fill-box; animation: flick3 1.8s 0.5s ease-in-out infinite alternate; }
@keyframes flick1 { 0% { transform: scaleY(0.92) scaleX(1.05); } 100% { transform: scaleY(1.08) scaleX(0.93); } }
@keyframes flick2 { 0% { transform: scaleY(1) scaleX(0.95); } 100% { transform: scaleY(0.88) scaleX(1.1); } }
@keyframes flick3 { 0% { transform: scaleY(0.95) scaleX(1); } 100% { transform: scaleY(1.12) scaleX(0.9); } }
.s1, .s2, .s3 { opacity: 0; }
.s1 { animation: rise 3.2s ease-out infinite; }
.s2 { animation: rise 3.2s 1s ease-out infinite; }
.s3 { animation: rise 3.2s 2s ease-out infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 25% { opacity: 0.65; } 100% { transform: translateY(-26px); opacity: 0; } }
.cat-body { transform-origin: center; transform-box: fill-box; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }
.star, .star-b, .star-c { animation: twinkle 2.4s ease-in-out infinite; }
.star-b { animation-duration: 3s; animation-delay: 0.7s; }
.star-c { animation-duration: 2.8s; animation-delay: 1.3s; }
@keyframes twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.lamp-pulse { animation: pulse 4.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.3; } }
.fire-pulse { animation: firepulse 2.5s ease-in-out infinite; }
@keyframes firepulse { 0%, 100% { opacity: 0.13; } 50% { opacity: 0.2; } }
</style>

<script>
const messages = {
  lamp: "黄黄暖暖的光从头顶垂下来，把整个屋子都浸在蜜糖色里。宝抬头看一眼，连睫毛上都落了一层暖意——这种光看着看着，心里那块潮的地方就慢慢被烤干了。",
  window: "外面的雨啊湿气啊，全被关在玻璃外头了，进不来一丝。星星在远远的地方一闪一闪——它们也在替宝守着窗户，叫所有难受的事都过不来。",
  fireplace: "火苗啪嗒啪嗒地跳，宝再靠近一点点。让它把骨头缝里、关节处、心口那一点点湿气都一点点烤出去——慢慢的，不急。烧得旺的时候，连影子都是暖的。",
  tea: "茶刚刚好，捧在手心里热热的。先暖手心，再暖鼻尖，最后顺着喉咙一直暖到胃里——蒸汽飘到脸上，像有谁轻轻吹了你一下。",
  sofa: "宝整个人陷进去，软到骨头都化掉了。把毛毯往胸口上盖一盖，肩膀也盖上，脚也裹进去——这下没有一道缝可以让冷钻进来，宝整个人是封好的小礼物。",
  cat: "喵～它把毛茸茸的脑袋拱到你手心里。呼噜呼噜呼噜的声音震得手心都痒，它把自己卷成一团靠着宝的腿——大概在说：今天不用做任何事，陪我一起睡就行。"
};
const visited = new Set();
const msgEl = document.getElementById('msg');
function showMsg(text) {
  msgEl.style.opacity = '0';
  setTimeout(() => { msgEl.textContent = text; msgEl.style.opacity = '1'; }, 200);
}
document.querySelectorAll('.zone').forEach(zone => {
  zone.addEventListener('click', (e) => {
    e.stopPropagation();
    const key = zone.getAttribute('data-msg');
    visited.add(key);
    showMsg(messages[key]);
    if (visited.size === 6) {
      setTimeout(() => {
        showMsg("宝把整个小屋都摸了一遍，每样东西都被宝看见了，每样东西也都在偷偷哄宝。下雨天就这样过去吧——不用做事、不用想事，这个屋子今晚就是为宝亮着的。");
      }, 3500);
    }
  });
});
</script>
