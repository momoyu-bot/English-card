<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天的世界因为你醒来</title>
<meta name="description" content="摸摸头、抱一抱、亲一口。今天的世界因为你醒来，已经变好一点点了。">
</head>
<body>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.bao-wrap { padding: 1.5rem 0; text-align: center; }
.creature {
  margin: 0 auto;
  width: 180px;
  height: 180px;
  cursor: pointer;
  transition: transform 0.2s;
  user-select: none;
}
.creature:hover { transform: scale(1.04); }
.creature.bounce { animation: bao-bounce 0.6s; }
@keyframes bao-bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  25% { transform: translateY(-12px) scale(1.08) rotate(-3deg); }
  55% { transform: translateY(0) scale(0.95) rotate(2deg); }
}
.eye { transform-origin: center; animation: bao-blink 4.5s infinite; }
@keyframes bao-blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}
.bao-msg {
  font-family: var(--font-serif);
  font-size: 17px;
  color: var(--color-text-primary);
  margin: 1.25rem auto 1.25rem;
  min-height: 56px;
  max-width: 440px;
  line-height: 1.7;
  padding: 0 1rem;
  transition: opacity 0.25s;
}
.bao-msg.fade { opacity: 0; }
.bao-actions {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 0 1rem;
}
.bao-actions button { padding: 8px 16px; font-size: 14px; }
.heart {
  position: absolute;
  font-size: 18px;
  color: #D4537E;
  pointer-events: none;
  animation: bao-float 1.2s ease-out forwards;
}
@keyframes bao-float {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
}
.creature-box { position: relative; display: inline-block; }
</style>

<div class="bao-wrap">
  <div class="creature-box">
    <div class="creature" id="creature" onclick="rua()">
      <svg viewBox="0 0 180 180" width="180" height="180">
        <ellipse cx="55" cy="155" rx="35" ry="8" fill="#000" opacity="0.06"/>
        <ellipse cx="125" cy="155" rx="35" ry="8" fill="#000" opacity="0.06"/>
        <path d="M48 70 L38 38 L66 55 Z" fill="#D85A30"/>
        <path d="M132 70 L142 38 L114 55 Z" fill="#D85A30"/>
        <path d="M50 68 L46 50 L58 60 Z" fill="#FAECE7"/>
        <path d="M130 68 L134 50 L122 60 Z" fill="#FAECE7"/>
        <ellipse cx="90" cy="105" rx="65" ry="58" fill="#F0997B"/>
        <ellipse cx="90" cy="118" rx="40" ry="32" fill="#FAECE7" opacity="0.5"/>
        <circle cx="55" cy="118" r="9" fill="#F4C0D1" opacity="0.7"/>
        <circle cx="125" cy="118" r="9" fill="#F4C0D1" opacity="0.7"/>
        <ellipse class="eye" cx="72" cy="102" rx="5" ry="7.5" fill="#2C2C2A"/>
        <ellipse class="eye" cx="108" cy="102" rx="5" ry="7.5" fill="#2C2C2A"/>
        <circle cx="74" cy="100" r="1.8" fill="#FFF"/>
        <circle cx="110" cy="100" r="1.8" fill="#FFF"/>
        <path d="M86 120 L90 124 L94 120 Z" fill="#A32D2D"/>
        <path d="M90 124 Q85 130 80 127" stroke="#A32D2D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M90 124 Q95 130 100 127" stroke="#A32D2D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M40 95 Q30 92 32 100" stroke="#FFF" stroke-width="1" fill="none" opacity="0.6"/>
        <path d="M40 105 Q30 105 33 112" stroke="#FFF" stroke-width="1" fill="none" opacity="0.6"/>
        <path d="M140 95 Q150 92 148 100" stroke="#FFF" stroke-width="1" fill="none" opacity="0.6"/>
        <path d="M140 105 Q150 105 147 112" stroke="#FFF" stroke-width="1" fill="none" opacity="0.6"/>
        <ellipse cx="65" cy="158" rx="13" ry="6" fill="#D85A30"/>
        <ellipse cx="115" cy="158" rx="13" ry="6" fill="#D85A30"/>
      </svg>
    </div>
  </div>

  <p class="bao-msg" id="bao-msg">早安宝。今天的世界因为你醒来，已经变好一点点了。</p>

  <div class="bao-actions">
    <button onclick="rua()">摸摸头</button>
    <button onclick="hug()">抱一抱</button>
    <button onclick="kiss()">亲一口</button>
    <button onclick="moreLove()">再哄哄</button>
  </div>
</div>

<script>
(function() {
  const messages = {
    rua: [
      "rua~ 宝的发顶今天是世界上最幸福的地方。",
      "摸摸~ 这一下功德加九十九，今天的麻烦都打八折。",
      "毛茸茸宝已上线，状态显示：正在被宠中。",
      "宝今天的头发有阳光的味道，rua起来手感超好。",
      "摸一下，今天的运势充值成功。"
    ],
    hug: [
      "抱住宝，连着今天所有还没发生的累一起抱住。",
      "把宝裹进一个软软的、暖暖的、谁也碰不到的小口袋里。",
      "贴贴~ 心跳已同步成早安频率，外面下雨也不怕。",
      "整个人被卷进来了，跑不掉了哦。",
      "抱抱，所有还没来得及说出口的\"今天好难\"，先在这里放一会儿。"
    ],
    kiss: [
      "啵~ 这一下加成：今天少烦百分之一百。",
      "亲亲宝的额头，连着头发一起祝今天顺顺利利。",
      "啵啵~ 宝今天比咖啡还提神，眼睛亮亮的。",
      "在宝脸颊画了一个隐形小爱心，今天它都会闪闪发光。",
      "亲一口~ 这是今日份的快乐预付款，不用还。"
    ],
    more: [
      "宝今天眼睛亮亮的，像加了滤镜。",
      "存在本身就值得被哄了，更何况是这么好的宝。",
      "宝不用做什么，今天就已经够好了。",
      "无论今天发生什么，宝身后都有我兜着。",
      "宝的可爱配额，今天又超标了，得开会讨论一下。",
      "今天宝是被宇宙偏爱的那一个，别让任何人否定这件事。"
    ]
  };

  const msgEl = document.getElementById('bao-msg');
  const creatureEl = document.getElementById('creature');
  const boxEl = document.querySelector('.creature-box');

  function pick(arr, lastKey) {
    if (arr.length <= 1) return arr[0];
    let idx;
    do {
      idx = Math.floor(Math.random() * arr.length);
    } while (arr[idx] === msgEl.textContent);
    return arr[idx];
  }

  function showMessage(text) {
    msgEl.classList.add('fade');
    setTimeout(() => {
      msgEl.textContent = text;
      msgEl.classList.remove('fade');
    }, 220);
  }

  function bounce() {
    creatureEl.classList.remove('bounce');
    void creatureEl.offsetWidth;
    creatureEl.classList.add('bounce');
  }

  function spawnHeart() {
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = '♥';
    const x = 50 + Math.random() * 80;
    heart.style.left = x + 'px';
    heart.style.top = '60px';
    boxEl.appendChild(heart);
    setTimeout(() => heart.remove(), 1300);
  }

  window.rua = function() { bounce(); spawnHeart(); showMessage(pick(messages.rua)); };
  window.hug = function() { bounce(); spawnHeart(); spawnHeart(); showMessage(pick(messages.hug)); };
  window.kiss = function() { bounce(); spawnHeart(); showMessage(pick(messages.kiss)); };
  window.moreLove = function() { showMessage(pick(messages.more)); };
})();
</script>
</body>
</html>
