<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>早安能量补给站</title>
<meta name="description" content="投喂、续咖啡、抱抱，每按一次得一句宠溺话加一点能量，满十点就能出门。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only">宝的早安能量补给站。三个按钮可以投喂、续咖啡、抱抱，每按一次会得到一句宠溺话并补充1点能量，满10点就可以神清气爽出门了。</h2>
<div style="padding: 1.5rem 0; max-width: 460px; margin: 0 auto;">

  <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
    <svg width="160" height="150" viewBox="0 0 160 150" role="img" aria-label="一个又困又困的小馒头宝">
      <g class="c-amber">
        <ellipse id="bao-body" cx="80" cy="85" rx="52" ry="44"/>
      </g>
      <path d="M 56 73 Q 64 80 72 73" stroke="var(--color-text-primary)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M 88 73 Q 96 80 104 73" stroke="var(--color-text-primary)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="56" cy="92" rx="7" ry="3.5" fill="#ED93B1" stroke="none" opacity="0.65"/>
      <ellipse cx="104" cy="92" rx="7" ry="3.5" fill="#ED93B1" stroke="none" opacity="0.65"/>
      <path d="M 73 100 Q 80 105 87 100" stroke="var(--color-text-primary)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <text x="118" y="56" font-size="15" fill="var(--color-text-tertiary)">z</text>
      <text x="129" y="44" font-size="12" fill="var(--color-text-tertiary)">z</text>
      <text x="138" y="34" font-size="10" fill="var(--color-text-tertiary)">z</text>
    </svg>
  </div>

  <div id="bubble" style="min-height: 70px; padding: 14px 18px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); margin-bottom: 1.25rem; text-align: center; color: var(--color-text-primary); font-size: 15px; line-height: 1.7; display: flex; align-items: center; justify-content: center;">
    宝今天又困又饿吗？没事，桌上有热乎的小馒头、温温的拿铁、和一兜子抱抱，挑一样吧。
  </div>

  <div style="margin-bottom: 1.25rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px;">
      <span style="color: var(--color-text-secondary);">宝的能量</span>
      <span id="energy-num" style="color: var(--color-text-primary); font-weight: 500;">0 / 10</span>
    </div>
    <div style="height: 10px; background: var(--color-background-secondary); border-radius: 5px; overflow: hidden;">
      <div id="energy-bar" style="height: 100%; width: 0%; background: #EF9F27; transition: width 0.5s ease;"></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
    <button id="btn-eat">投喂一口</button>
    <button id="btn-coffee">续一杯</button>
    <button id="btn-hug">抱一下</button>
  </div>

</div>

<script>
const eatLines = [
  "嘴巴张开——一个热乎乎的小肉包，咬下去汤汁是甜的。",
  "豆浆 + 小笼包 + 一颗糖，宝今天的早餐特别周到。",
  "宝最爱的那家煎饼果子，已经在你工位上等着了。",
  "煎蛋边边焦脆中间溏心，专门给你煎成了心形。",
  "塞一个温热的可颂到嘴里，外皮一咬就掉渣。",
  "热乎乎的关东煮萝卜，一口下去暖到心口。",
  "塞一颗水果硬糖到口袋里，开会困了就含一颗。"
];
const coffeeLines = [
  "拿铁拿稳了，宝今天就靠这一杯撑起来。",
  "美式不加糖，但加了我对你的偏心。",
  "咖啡机已经预热，你刚坐下它就响。",
  "今日提神咒语：宝醒了，宝清醒了，宝精神了。",
  "如果还困，就再眨两下眼睛，我陪你撑过早会。",
  "焦糖玛奇朵——甜的部分留嘴里，苦的部分我替你喝。",
  "桂花拿铁的香气飘过来，吸一口就回血了。"
];
const hugLines = [
  "啵一口左脸蛋，再啵一口右脸蛋，眉心也补一口。",
  "把宝包成小馄饨，被子掖好，谁也欺负不到。",
  "今天的宝是全宇宙第一软第一可爱。",
  "你已经很厉害了，再撑一下就周五了。",
  "下班回家会有热饭和被窝，在原地等你。",
  "把宝的烦躁取出来，塞进我的口袋，丢掉。",
  "摸摸头，从额头一路顺到后颈，烦恼都被捋平了。"
];

let energy = 0;
const bubble = document.getElementById('bubble');
const bar = document.getElementById('energy-bar');
const num = document.getElementById('energy-num');
const body = document.getElementById('bao-body');

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function bounce() {
  body.style.transition = 'transform 0.28s ease';
  body.style.transformOrigin = '80px 85px';
  body.style.transformBox = 'fill-box';
  body.style.transform = 'scale(1.09)';
  setTimeout(() => { body.style.transform = 'scale(1)'; }, 280);
}

function feed(arr) {
  if (energy >= 10) {
    bubble.textContent = "宝今天电量已经满到溢出来啦，可以出门发光发热啦~";
    bounce();
    return;
  }
  energy = Math.min(energy + 1, 10);
  bubble.textContent = pick(arr);
  bar.style.width = (energy * 10) + '%';
  num.textContent = energy + ' / 10';
  bounce();
  if (energy === 10) {
    setTimeout(() => {
      bubble.textContent = "宝今天电量满满！揣着这一兜子幸运出门——地铁不挤，红灯不堵，老板今天心情也好。";
    }, 700);
  }
}

document.getElementById('btn-eat').onclick = () => feed(eatLines);
document.getElementById('btn-coffee').onclick = () => feed(coffeeLines);
document.getElementById('btn-hug').onclick = () => feed(hugLines);
</script>
</body>
</html>
