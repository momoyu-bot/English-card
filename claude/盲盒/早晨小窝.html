<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早晨小窝</title>
<style>
  @import url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css');

  :root{
    --bg-top:    #fff4e2;
    --bg-mid:    #ffe6d2;
    --bg-low:    #fbd6bf;
    --glow:      #fff0c9;
    --cream:     #fff9f1;
    --cream-sh:  #f4dfca;
    --blush:     #ff9d80;
    --blush-soft:#ffc2ad;
    --ink:       #855440;
    --ink-soft:  #b48a73;
    --cup:       #f3b58c;
    --cup-dk:    #e09a6e;
    --heart:     #ff8e72;
    --mat:       #f1c9a8;
    --mat-dk:    #e3b08a;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%;}
  body{
    font-family:'LXGW WenKai','Kaiti SC','STKaiti','楷体',serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 78% 12%, var(--glow) 0%, rgba(255,240,201,0) 55%),
      linear-gradient(170deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-low) 100%);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  /* 清晨斜射的光束 */
  .sunbeam{
    position:fixed;
    top:-25%; right:-5%;
    width:60%; height:150%;
    background:linear-gradient(200deg, rgba(255,243,210,.55), rgba(255,243,210,0) 60%);
    transform:rotate(12deg);
    filter:blur(8px);
    pointer-events:none;
    animation:beam 9s ease-in-out infinite alternate;
  }
  @keyframes beam{from{opacity:.5;}to{opacity:.85;}}

  /* 漂浮的光尘 */
  .dust{
    position:fixed; bottom:-12px;
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,248,225,.9);
    box-shadow:0 0 6px rgba(255,236,180,.9);
    pointer-events:none;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:.9;}
    90%{opacity:.7;}
    100%{transform:translateY(-110vh) translateX(40px); opacity:0;}
  }

  .stage{
    position:relative;
    width:min(92vw, 460px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(14px,3.5vh,30px);
    padding:24px;
    z-index:2;
    animation:wake 1.4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes wake{
    from{opacity:0; transform:translateY(18px) scale(.96);}
    to{opacity:1; transform:none;}
  }

  .greet{
    text-align:center;
    line-height:1.5;
  }
  .greet h1{
    font-size:clamp(1.5rem,6vw,2rem);
    font-weight:400;
    letter-spacing:.04em;
  }
  .greet .sub{
    margin-top:6px;
    font-size:clamp(.92rem,3.6vw,1.05rem);
    color:var(--ink-soft);
  }

  /* —— 小生物的舞台 —— */
  .scene{
    position:relative;
    width:clamp(220px,62vw,300px);
    aspect-ratio:1/.92;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .creature{
    width:78%;
    transform-origin:bottom center;
    animation:breathe 4.2s ease-in-out infinite;
    transition:transform .25s ease;
    overflow:visible;
  }
  .scene:active .creature{transform:scale(.97);}
  @keyframes breathe{
    0%,100%{transform:translateY(0) scale(1,1);}
    50%{transform:translateY(-3px) scale(1.015,.985);}
  }
  .creature.hop{animation:hop .55s cubic-bezier(.3,1.4,.5,1);}
  @keyframes hop{
    0%{transform:translateY(0);}
    35%{transform:translateY(-22px) scale(1.04,.96);}
    70%{transform:translateY(0) scale(.98,1.02);}
    100%{transform:translateY(0);}
  }

  /* 呆毛轻轻晃 */
  .ahoge{transform-origin:bottom center; animation:sway 3.6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(7deg);}}

  /* 眼睛：睁 / 眨 / 开心 */
  .eye-open{display:inline;}
  .eye-blink,.eye-happy{display:none;}
  .creature.blink .eye-open{display:none;}
  .creature.blink .eye-blink{display:inline;}
  .creature.happy .eye-open{display:none;}
  .creature.happy .eye-blink{display:none;}
  .creature.happy .eye-happy{display:inline;}

  /* 嘴：普通 v / 开心大 */
  .mouth-happy{display:none;}
  .creature.happy .mouth-norm{display:none;}
  .creature.happy .mouth-happy{display:inline;}

  /* 腮红，害羞时更浓 */
  .blush{opacity:.7; transition:opacity .4s ease;}
  .creature.happy .blush{opacity:1;}

  /* 睡意的 z z z，醒来后淡出 */
  .zzz{animation:floatz 3s ease-in-out infinite; transition:opacity 1s ease;}
  .zzz.gone{opacity:0;}
  @keyframes floatz{0%,100%{transform:translateY(0); opacity:.5;}50%{transform:translateY(-6px); opacity:.9;}}

  /* 小热饮的热气 */
  .steam{transform-origin:center bottom; animation:steam 3.4s ease-in-out infinite;}
  .steam.s2{animation-delay:1.1s;}
  .steam.s3{animation-delay:2.2s;}
  @keyframes steam{
    0%{opacity:0; transform:translateY(4px) scaleY(.6);}
    35%{opacity:.75;}
    100%{opacity:0; transform:translateY(-18px) scaleY(1.1);}
  }

  /* 轮换的暖心话 */
  .line{
    min-height:2.6em;
    text-align:center;
    font-size:clamp(1rem,4.4vw,1.18rem);
    line-height:1.5;
    color:var(--ink);
    max-width:22em;
    transition:opacity .35s ease, transform .35s ease;
  }
  .line.swap{opacity:0; transform:translateY(6px);}

  .hint{
    font-size:clamp(.82rem,3.4vw,.92rem);
    color:var(--ink-soft);
    letter-spacing:.06em;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}

  /* 飘出的小爱心 */
  .pop-heart{
    position:absolute;
    font-size:22px;
    pointer-events:none;
    animation:popup 1.3s ease-out forwards;
    z-index:5;
  }
  @keyframes popup{
    0%{opacity:0; transform:translate(-50%,0) scale(.4);}
    20%{opacity:1; transform:translate(-50%,-14px) scale(1.1);}
    100%{opacity:0; transform:translate(-50%,-80px) scale(.7);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
  }
</style>
</head>
<body>
  <div class="sunbeam"></div>

  <main class="stage">
    <div class="greet">
      <h1>宝，早上好呀</h1>
      <div class="sub">慢慢醒就好，今天有我陪着你</div>
    </div>

    <div class="scene" id="scene">
      <svg class="creature" id="creature" viewBox="0 0 200 200" aria-label="一只刚睡醒的小生物">
        <!-- 垫子 -->
        <ellipse cx="100" cy="178" rx="62" ry="13" fill="var(--mat)"/>
        <ellipse cx="100" cy="175" rx="62" ry="11" fill="var(--mat-dk)" opacity=".5"/>

        <!-- z z z -->
        <g class="zzz" id="zzz" fill="var(--ink-soft)" font-family="serif" font-style="italic">
          <text x="150" y="52" font-size="13">z</text>
          <text x="160" y="40" font-size="17">z</text>
          <text x="172" y="26" font-size="22">z</text>
        </g>

        <!-- 呆毛 -->
        <path class="ahoge" d="M100 44 q6 -22 -2 -30 q14 6 10 30 Z" fill="var(--cream)" stroke="var(--cream-sh)" stroke-width="1.5"/>

        <!-- 身体 -->
        <path d="M100 48
                 C150 48 168 92 168 122
                 C168 158 140 174 100 174
                 C60 174 32 158 32 122
                 C32 92 50 48 100 48 Z"
              fill="var(--cream)" stroke="var(--cream-sh)" stroke-width="2"/>

        <!-- 小短手 -->
        <ellipse cx="40" cy="132" rx="13" ry="17" fill="var(--cream)" stroke="var(--cream-sh)" stroke-width="2" transform="rotate(-18 40 132)"/>
        <ellipse cx="160" cy="132" rx="13" ry="17" fill="var(--cream)" stroke="var(--cream-sh)" stroke-width="2" transform="rotate(18 160 132)"/>

        <!-- 腮红 -->
        <g class="blush">
          <ellipse cx="64" cy="120" rx="13" ry="8" fill="var(--blush-soft)"/>
          <ellipse cx="136" cy="120" rx="13" ry="8" fill="var(--blush-soft)"/>
        </g>

        <!-- 眼睛 左 -->
        <g>
          <ellipse class="eye-open" cx="76" cy="104" rx="9" ry="11" fill="var(--ink)"/>
          <circle class="eye-open" cx="73" cy="100" r="3" fill="#fff"/>
          <path class="eye-blink" d="M67 105 q9 6 18 0" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path class="eye-happy" d="M67 107 q9 -10 18 0" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </g>
        <!-- 眼睛 右 -->
        <g>
          <ellipse class="eye-open" cx="124" cy="104" rx="9" ry="11" fill="var(--ink)"/>
          <circle class="eye-open" cx="121" cy="100" r="3" fill="#fff"/>
          <path class="eye-blink" d="M115 105 q9 6 18 0" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path class="eye-happy" d="M115 107 q9 -10 18 0" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- 嘴 -->
        <path class="mouth-norm" d="M92 124 q8 9 16 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="mouth-happy" d="M88 122 q12 16 24 0 Z" fill="var(--blush)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>

      <!-- 小热饮，蹲在小生物右边 -->
      <svg width="58" height="70" viewBox="0 0 58 70" style="position:absolute; right:2%; bottom:14%;" aria-hidden="true">
        <g stroke="var(--cup-dk)" stroke-width="2.5" fill="none" stroke-linecap="round">
          <path class="steam"    d="M22 18 q-5 -7 0 -14"/>
          <path class="steam s2" d="M30 18 q5 -7 0 -14"/>
          <path class="steam s3" d="M38 18 q-5 -7 0 -14"/>
        </g>
        <path d="M14 26 h30 v22 a15 15 0 0 1 -30 0 Z" fill="var(--cup)" stroke="var(--cup-dk)" stroke-width="2.5"/>
        <path d="M44 30 q12 0 12 10 t-12 10" fill="none" stroke="var(--cup-dk)" stroke-width="2.5"/>
        <ellipse cx="29" cy="26" rx="15" ry="4" fill="var(--cup-dk)" opacity=".5"/>
      </svg>
    </div>

    <div class="line" id="line">嘿，你来啦～我等你好久了</div>
    <div class="hint" id="hint">· 点点我呀 ·</div>
  </main>

<script>
  const creature = document.getElementById('creature');
  const scene = document.getElementById('scene');
  const lineEl = document.getElementById('line');
  const hintEl = document.getElementById('hint');
  const zzz = document.getElementById('zzz');

  // 醒来：开局先把睡意 z z z 慢慢淡掉
  setTimeout(()=> zzz.classList.add('gone'), 1800);

  // 自动眨眼（随机间隔，更自然）
  function scheduleBlink(){
    const wait = 2200 + Math.random()*3200;
    setTimeout(()=>{
      if(!creature.classList.contains('happy')){
        creature.classList.add('blink');
        setTimeout(()=> creature.classList.remove('blink'), 160);
      }
      scheduleBlink();
    }, wait);
  }
  scheduleBlink();

  // 暖心话池子
  const lines = [
    "嘿嘿，被你摸到啦～",
    "不用急着启动，先发会儿呆也可以的",
    "深呼吸一下，新的一天软乎乎地开始",
    "宝今天也要对自己温柔一点哦",
    "我一直都在这儿，不会走开的",
    "你光是醒过来，就已经很厉害啦",
    "慢慢来，时间够的，不慌",
    "今天的你，也值得被好好对待",
    "要喝口热乎的吗？我帮你暖好了～",
    "陪你一起，把这一天稳稳地过完"
  ];
  const clingy = [
    "嘿嘿，你今天好黏人呀，我喜欢～",
    "再多摸两下也可以哦，我不怕的",
    "好啦好啦，我知道你最喜欢我了～"
  ];

  let i = 0, taps = 0;

  function swapLine(text){
    lineEl.classList.add('swap');
    setTimeout(()=>{
      lineEl.textContent = text;
      lineEl.classList.remove('swap');
    }, 350);
  }

  function heart(x, y){
    const h = document.createElement('div');
    h.className = 'pop-heart';
    h.textContent = ['🧡','💛','🤍','🧡'][Math.floor(Math.random()*4)];
    h.style.left = x + 'px';
    h.style.top  = y + 'px';
    scene.appendChild(h);
    setTimeout(()=> h.remove(), 1300);
  }

  scene.addEventListener('click', (e)=>{
    taps++;
    zzz.classList.add('gone');

    // 开心表情 + 跳一下
    creature.classList.remove('blink');
    creature.classList.add('happy','hop');
    setTimeout(()=> creature.classList.remove('hop'), 560);
    setTimeout(()=> creature.classList.remove('happy'), 1400);

    // 飘几颗小爱心
    const rect = scene.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    for(let k=0;k<3;k++){
      setTimeout(()=> heart(cx + (Math.random()*60-30), cy + (Math.random()*20-10)), k*120);
    }

    // 换一句话：黏人彩蛋偶尔出现
    if(taps>=6 && taps%4===0){
      swapLine(clingy[Math.floor(Math.random()*clingy.length)]);
    }else{
      swapLine(lines[i % lines.length]);
      i++;
    }

    if(taps===1) hintEl.style.opacity = '0';
  });

  // 生成漂浮光尘
  function spawnDust(){
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = Math.random()*100 + 'vw';
    const dur = 9 + Math.random()*8;
    d.style.animationDuration = dur + 's';
    const s = 0.5 + Math.random()*0.9;
    d.style.transform = `scale(${s})`;
    document.body.appendChild(d);
    setTimeout(()=> d.remove(), dur*1000);
  }
  for(let k=0;k<6;k++) setTimeout(spawnDust, k*1400);
  setInterval(spawnDust, 2600);
</script>
</body>
</html>
