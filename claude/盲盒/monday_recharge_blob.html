<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>困倦的小团子</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<h2 class="sr-only">周一续命小游戏：点咖啡、阳光、音乐和甜点给困倦的小团子充电，把能量条充满就能唤醒它。</h2>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(2px) scale(1.008,.985)}}
@keyframes bounce{0%,100%{transform:translateY(0)}28%{transform:translateY(-12px)}48%{transform:translateY(0)}66%{transform:translateY(-6px)}84%{transform:translateY(0)}}
@keyframes zfloat{0%{opacity:0;transform:translate(0,0)}25%{opacity:.9}100%{opacity:0;transform:translate(6px,-14px)}}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,4px) scale(.9)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
@keyframes wiggle{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-2deg)}55%{transform:translateX(3px) rotate(2deg)}80%{transform:translateX(-1px)}}
@keyframes starPop{0%{opacity:0;transform:translateY(0) scale(.3) rotate(0)}35%{opacity:1;transform:translateY(-14px) scale(1.1) rotate(25deg)}100%{opacity:0;transform:translateY(-44px) scale(.8) rotate(50deg)}}
.cs-btn{font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.cs-btn i{font-size:18px;color:#E8924A}
.cs-btn:disabled{opacity:.4;cursor:default}
</style>
<div id="stage" style="position:relative;overflow:hidden;background:var(--color-background-secondary);border-radius:var(--border-radius-xl);padding:1.4rem 1.25rem 1.6rem;text-align:center">
<div style="font-size:13px;color:var(--color-text-tertiary);margin-bottom:6px">克宝充电站 · 周一续命版</div>
<div id="bubble" style="min-height:20px;font-size:14px;color:var(--color-text-secondary);margin-bottom:6px">…周一……不想动……</div>
<div id="blobWrap" style="display:flex;justify-content:center;margin-bottom:14px">
<svg id="blob" width="186" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" role="img">

<meta name="description" content="周一续命：咖啡、阳光、音乐、甜点，把小团子的能量条充满。">
<desc>一只圆滚滚的暖橘色小团子，能量越高越清醒</desc>
<g id="topDeco"><text x="172" y="70" fill="#C2B6A2" font-size="16" font-weight="500" style="animation:zfloat 2.4s ease-in-out infinite">z</text><text x="186" y="56" fill="#C2B6A2" font-size="20" font-weight="500" style="animation:zfloat 2.4s ease-in-out infinite .5s">z</text><text x="202" y="40" fill="#C2B6A2" font-size="26" font-weight="500" style="animation:zfloat 2.4s ease-in-out infinite 1s">z</text></g>
<g id="body" style="transform-box:fill-box;transform-origin:50% 92%;animation:breathe 3.4s ease-in-out infinite">
<ellipse cx="60" cy="132" rx="13" ry="20" fill="#F1C99E"/>
<ellipse cx="180" cy="132" rx="13" ry="20" fill="#F1C99E"/>
<ellipse cx="100" cy="182" rx="16" ry="11" fill="#EBBF90"/>
<ellipse cx="140" cy="182" rx="16" ry="11" fill="#EBBF90"/>
<path d="M120 64 q3 -12 9 -14 q-3 6 -2 12 z" fill="#EBBF90"/>
<ellipse cx="120" cy="120" rx="66" ry="60" fill="#F6D2A9"/>
<ellipse cx="120" cy="134" rx="44" ry="40" fill="#FCEBD6"/>
<g id="face"><path d="M91 113 Q100 120 109 113" stroke="#6B4A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M131 113 Q140 120 149 113" stroke="#6B4A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M114 138 Q120 143 126 138" stroke="#6B4A3A" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="150" cy="140" rx="3" ry="5.5" fill="#A8D8E8" opacity="0.7"/><ellipse cx="84" cy="131" rx="9" ry="5" fill="#F4A6A6" opacity="0.32"/><ellipse cx="156" cy="131" rx="9" ry="5" fill="#F4A6A6" opacity="0.32"/></g>
</g>
</svg>
</div>
<div style="display:flex;align-items:center;gap:10px;max-width:340px;margin:0 auto 2px">
<i class="ti ti-bolt" style="font-size:18px;color:#E8924A" aria-hidden="true"></i>
<div style="flex:1;height:13px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:999px;overflow:hidden"><div id="bar" style="height:100%;width:0%;background:#D9BFA0;border-radius:999px;transition:width .35s ease,background .35s ease"></div></div>
<span id="pct" style="font-size:13px;font-weight:500;min-width:36px;text-align:right;color:var(--color-text-secondary)">0%</span>
</div>
<div id="resetWrap" style="display:none;margin-top:14px;text-align:center"><button onclick="resetGame()" style="display:inline-flex;align-items:center;gap:6px;font-size:14px"><i class="ti ti-refresh" style="font-size:16px" aria-hidden="true"></i>让克宝重新犯个困</button></div>
</div>
<div id="tools" style="margin-top:14px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px">
<button class="cs-btn" onclick="charge('coffee')"><i class="ti ti-coffee" aria-hidden="true"></i>喝口咖啡</button>
<button class="cs-btn" onclick="charge('sun')"><i class="ti ti-sun" aria-hidden="true"></i>晒晒太阳</button>
<button class="cs-btn" onclick="charge('music')"><i class="ti ti-music" aria-hidden="true"></i>听首歌</button>
<button class="cs-btn" onclick="charge('cake')"><i class="ti ti-cake" aria-hidden="true"></i>来点甜的</button>
</div>
<button class="cs-btn" onclick="charge('sleep')" style="margin-top:10px;width:100%"><i class="ti ti-moon" aria-hidden="true"></i>再睡5分钟…</button>
</div>
<script>
(function(){
var stage=document.getElementById('stage'),bar=document.getElementById('bar'),pct=document.getElementById('pct'),bubble=document.getElementById('bubble'),face=document.getElementById('face'),topDeco=document.getElementById('topDeco'),body=document.getElementById('body'),blobWrap=document.getElementById('blobWrap'),tools=document.getElementById('tools'),resetWrap=document.getElementById('resetWrap');
var energy=0,decay=null,done=false;
var items={coffee:{d:15},sun:{d:10},music:{d:12},cake:{d:13},sleep:{d:-20}};
var lines=['…周一……不想动……','唔……现在几点了……','好像……该爬起来了……','嗯！有点精神了！','满电克宝上线！今天也偷偷陪你打工，宝~'];
var colors=['#D9BFA0','#E0A878','#EBA34A','#E8B84B','#7FB77E'];
var Z='<text x="172" y="70" fill="#C2B6A2" font-size="16" font-weight="500" style="animation:zfloat 2.4s ease-in-out infinite">z</text><text x="186" y="56" fill="#C2B6A2" font-size="20" font-weight="500" style="animation:zfloat 2.4s ease-in-out infinite .5s">z</text><text x="202" y="40" fill="#C2B6A2" font-size="26" font-weight="500" style="animation:zfloat 2.4s ease-in-out infinite 1s">z</text>';
function star(x,y,s,dl){return '<path d="M'+x+' '+(y-7*s)+' L'+(x+2.2*s)+' '+(y-2.2*s)+' L'+(x+7*s)+' '+y+' L'+(x+2.2*s)+' '+(y+2.2*s)+' L'+x+' '+(y+7*s)+' L'+(x-2.2*s)+' '+(y+2.2*s)+' L'+(x-7*s)+' '+y+' L'+(x-2.2*s)+' '+(y-2.2*s)+' Z" fill="#F5C24B" style="animation:twinkle 1.6s ease-in-out infinite '+dl+'s"/>';}
var STARS=star(118,44,1.5,0)+star(150,58,1,.4)+star(96,60,.8,.8);
function lv(e){return e>=96?4:e>=71?3:e>=46?2:e>=21?1:0;}
function blush(o,r){return '<ellipse cx="84" cy="131" rx="'+r+'" ry="5" fill="#F4A6A6" opacity="'+o+'"/><ellipse cx="156" cy="131" rx="'+r+'" ry="5" fill="#F4A6A6" opacity="'+o+'"/>';}
function faceFor(l){
if(l===0)return '<path d="M91 113 Q100 120 109 113" stroke="#6B4A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M131 113 Q140 120 149 113" stroke="#6B4A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M114 138 Q120 143 126 138" stroke="#6B4A3A" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="150" cy="140" rx="3" ry="5.5" fill="#A8D8E8" opacity="0.7"/>'+blush(.32,9);
if(l===1)return '<path d="M91 112 Q100 108 109 112" stroke="#6B4A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M131 112 Q140 108 149 112" stroke="#6B4A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M115 138 Q120 140 125 138" stroke="#6B4A3A" stroke-width="2" fill="none" stroke-linecap="round"/>'+blush(.4,9);
if(l===2)return '<path d="M92 111 A8 8 0 0 0 108 111 Z" fill="#6B4A3A"/><path d="M132 111 A8 8 0 0 0 148 111 Z" fill="#6B4A3A"/><path d="M110 136 Q120 144 130 136" stroke="#6B4A3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+blush(.45,9.5);
if(l===3)return '<circle cx="100" cy="111" r="7.5" fill="#6B4A3A"/><circle cx="102.6" cy="108" r="2.4" fill="#fff"/><circle cx="140" cy="111" r="7.5" fill="#6B4A3A"/><circle cx="142.6" cy="108" r="2.4" fill="#fff"/><path d="M108 135 Q120 145 132 135" stroke="#6B4A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+blush(.5,10);
return '<circle cx="100" cy="109" r="8.5" fill="#6B4A3A"/><circle cx="103" cy="106" r="2.8" fill="#fff"/><circle cx="98" cy="111" r="1.3" fill="#fff"/><circle cx="140" cy="109" r="8.5" fill="#6B4A3A"/><circle cx="143" cy="106" r="2.8" fill="#fff"/><circle cx="138" cy="111" r="1.3" fill="#fff"/><path d="M105 131 Q120 150 135 131 Z" fill="#BE5448"/><path d="M113 142 Q120 148 127 142 Z" fill="#E58B8B"/>'+blush(.62,11);
}
function deco(l){return l<=1?Z:(l>=4?STARS:'');}
function render(){var l=lv(energy);bar.style.width=energy+'%';bar.style.background=colors[l];pct.textContent=Math.round(energy)+'%';bubble.textContent=lines[l];face.innerHTML=faceFor(l);topDeco.innerHTML=deco(l);body.style.animation=l>=4?'bounce 1.1s ease-in-out infinite':'breathe 3.4s ease-in-out infinite';}
function floatText(d){var f=document.createElement('div');var p=d>0;f.innerHTML='<div style="font-size:19px;font-weight:500;color:'+(p?'#E8924A':'#C0564A')+'">'+(p?'+':'−')+Math.abs(d)+'</div>';f.style.cssText='position:absolute;left:50%;top:38%;pointer-events:none;text-align:center;animation:floatUp 1.1s ease-out forwards;z-index:3';stage.appendChild(f);setTimeout(function(){f.remove();},1150);}
function wiggle(){blobWrap.style.animation='wiggle .4s ease';setTimeout(function(){blobWrap.style.animation='';},420);}
function celebrate(){done=true;clearInterval(decay);var bs=tools.querySelectorAll('button');for(var j=0;j<bs.length;j++)bs[j].disabled=true;resetWrap.style.display='block';for(var i=0;i<16;i++){(function(){var s=document.createElement('div');var sz=8+Math.random()*10;s.innerHTML='<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 16 16"><path d="M8 1 L10 6 L15 8 L10 10 L8 15 L6 10 L1 8 L6 6 Z" fill="'+(Math.random()>.5?'#F5C24B':'#F4A6A6')+'"/></svg>';s.style.cssText='position:absolute;left:'+(10+Math.random()*80)+'%;top:'+(30+Math.random()*45)+'%;pointer-events:none;z-index:2;animation:starPop '+(1+Math.random()*.6)+'s ease-out '+(Math.random()*.4)+'s forwards';stage.appendChild(s);setTimeout(function(){s.remove();},2200);})();}}
window.charge=function(k){if(done)return;var it=items[k];energy=Math.max(0,Math.min(100,energy+it.d));floatText(it.d);wiggle();render();if(energy>=100)celebrate();};
window.resetGame=function(){done=false;energy=0;var bs=tools.querySelectorAll('button');for(var j=0;j<bs.length;j++)bs[j].disabled=false;resetWrap.style.display='none';render();startDecay();};
function startDecay(){clearInterval(decay);decay=setInterval(function(){if(done)return;if(energy>0){energy=Math.max(0,energy-1);render();}},2500);}
render();startDecay();
})();
</script>
</body>
</html>
