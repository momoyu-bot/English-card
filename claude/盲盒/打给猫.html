<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0906">
<title>打给猫</title>
<meta name="description" content="它接了，但它是猫。黑暗里睁开两只眼睛，说的每一句都得翻译。">
<style>
  :root{
    --void:#0b0906;
    --void2:#17100a;
    --amber:#e0a03a;
    --amber-hi:#ffd98a;
    --amber-lo:#8a5f1c;
    --slit:#120b04;
    --ink:#e8dcc4;
    --dim:#9a8a70;
    --faint:#6a5b48;
    --line:rgba(224,160,58,.22);
    --paper:#e9dfc8;
    --paper-2:#d9cbae;
    --paper-ink:#3d3324;
    --warm:#c96f4a;
    --live:#8fce9a;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bot:env(safe-area-inset-bottom, 0px);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background-color:var(--void);
    background-image:
      radial-gradient(120% 70% at 50% 4%, #1d1409 0%, transparent 62%),
      linear-gradient(172deg, var(--void2), var(--void) 72%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",
      "Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    overflow:hidden;
    display:flex;justify-content:center;
    padding:calc(var(--safe-top) + 18px) 18px calc(var(--safe-bot) + 20px);
  }
  .wrap{
    width:100%;max-width:420px;height:100%;
    display:flex;flex-direction:column;
  }

  /* ── 门楣 ── */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
  .brand{display:flex;flex-direction:column;gap:5px;min-width:0}
  .kicker{font-size:10px;letter-spacing:.3em;color:#8a7355;text-transform:uppercase}
  h1{
    font-size:clamp(24px,7vw,30px);font-weight:600;letter-spacing:.16em;line-height:1.1;
    color:var(--amber-hi);text-shadow:0 1px 0 rgba(0,0,0,.55);
  }
  /* 中文撑得开这个字距，英文撑不开，切过去要收一点 */
  html[lang="en"] h1{letter-spacing:.04em}
  html[lang="en"] .call{letter-spacing:.06em}
  html[lang="en"] .statusbar{letter-spacing:.09em}
  .tools{display:flex;gap:7px;flex:none}
  .tbtn{
    border:1px solid var(--line);background:rgba(0,0,0,.26);color:var(--amber);
    font:inherit;font-size:11px;letter-spacing:.16em;
    padding:7px 11px;border-radius:999px;cursor:pointer;line-height:1;
  }
  .tbtn[aria-pressed="true"]{background:rgba(224,160,58,.16);color:var(--amber-hi)}
  #snd{font-size:13px;letter-spacing:0;padding:6px 9px}

  /* ── 状态行 ── */
  .statusbar{
    display:flex;align-items:center;gap:8px;flex:none;
    margin-top:16px;padding-bottom:9px;border-bottom:1px solid rgba(224,160,58,.14);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);
  }
  .statusbar .dot{
    width:6px;height:6px;border-radius:50%;background:#4a3a28;flex:none;
    transition:background .4s ease, box-shadow .4s ease;
  }
  .statusbar .grow{flex:1}
  body[data-state="ring"] .statusbar .dot{background:var(--warm);box-shadow:0 0 7px rgba(201,111,74,.6)}
  body[data-state="talk"] .statusbar .dot{background:var(--live);box-shadow:0 0 7px rgba(143,206,154,.55)}
  #clock{color:var(--dim)}

  /* ── 黑暗那头 ── */
  .stage{
    position:relative;flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .glow{
    position:absolute;left:50%;top:46%;width:290px;height:290px;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(224,160,58,.17) 0%, rgba(224,160,58,.05) 38%, transparent 68%);
    opacity:0;transition:opacity 1.1s ease;
  }
  body[data-state="talk"] .glow{opacity:1}

  .eyes{
    width:min(70%,246px);flex:none;overflow:visible;display:block;
  }
  body[data-state="talk"] .eyes{animation:breathe 5.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  body[data-away="1"] .eyes{opacity:.1;transition:opacity 1.2s ease}

  /* 睁着的眼球只在通话里出现；其余时候那头只有两道闭着的弧 */
  .eye{
    transform-box:fill-box;transform-origin:center;
    transition:transform .26s cubic-bezier(.3,.9,.3,1), opacity .8s ease;
  }
  body:not([data-state="talk"]) .eye{opacity:0}
  .iris{fill:url(#irisGrad)}
  .pupil{fill:var(--slit);transition:rx .5s ease, ry .5s ease}
  .glint{fill:rgba(255,240,210,.5)}

  /* 眨眼、半闭、闭上，都是把眼球压扁，不拿方块去盖——盖不住，会露边 */
  body[data-eye="blink"] .eye{transform:scaleY(.06);transition-duration:.1s}
  body[data-eye="half"]  .eye{transform:scaleY(.46)}
  body[data-eye="shut"]  .eye{
    transform:scaleY(.05);opacity:0;
    transition:transform .45s ease, opacity .4s ease .2s;
  }

  .sleepline{stroke:var(--amber-lo);stroke-width:4.5;stroke-linecap:round;fill:none;
    opacity:0;transition:opacity .7s ease}
  body[data-state="idle"] .sleepline{opacity:.15}
  body[data-state="over"] .sleepline{opacity:.2}
  body[data-eye="shut"] .sleepline{opacity:.75}
  /* 电话响着的时候，那两道弧亮一点又暗下去：它听见了 */
  body[data-state="ring"] .sleepline{animation:heard 1.7s ease-in-out infinite}
  @keyframes heard{0%,100%{opacity:.2}50%{opacity:.52}}

  .hint{
    position:absolute;left:0;right:0;bottom:6px;text-align:center;
    font-size:12px;line-height:1.8;color:var(--faint);letter-spacing:.05em;
    padding:0 6px;transition:color .5s ease;
  }
  body[data-state="ring"] .hint{color:var(--dim)}

  /* 拨号时黑暗里那几圈涟漪 */
  .ping{
    position:absolute;left:50%;top:46%;width:24px;height:24px;margin:-12px 0 0 -12px;
    border-radius:50%;border:1px solid rgba(201,111,74,.5);pointer-events:none;
    animation:ping 1.6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes ping{
    from{transform:scale(.3);opacity:.75}
    to{transform:scale(9);opacity:0}
  }

  /* ── 它说的话 ── */
  .says{
    flex:none;display:flex;flex-direction:column;gap:9px;justify-content:flex-end;
    min-height:172px;margin-top:8px;
  }
  .say{
    border-left:2px solid rgba(224,160,58,.3);padding:1px 0 1px 11px;
    transform:translateY(7px);transition:transform .45s cubic-bezier(.3,.9,.3,1);
  }
  .say.in{transform:translateY(0)}
  .say.old{border-left-color:rgba(224,160,58,.11)}
  .say.old .meow{color:var(--faint)}
  .say.old .human{color:#5d503f}
  .meow{
    display:flex;align-items:center;gap:9px;
    font-size:16px;line-height:1.55;color:var(--amber-hi);letter-spacing:.04em;
    transition:color .6s ease;
  }
  .say.act .meow{font-size:13.5px;color:var(--dim);letter-spacing:.02em}
  .human{
    font-size:13.5px;line-height:1.7;color:var(--ink);margin-top:3px;
    letter-spacing:.02em;transition:color .6s ease;
  }
  body[data-trans="0"] .human{display:none}
  .bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px;flex:none}
  .bars b{
    width:2px;border-radius:1px;background:rgba(224,160,58,.55);height:30%;
    transform-origin:bottom;
  }
  .say.in .bars b{animation:bar .62s ease-in-out infinite alternate}
  .say.old .bars b{animation:none;height:22%;background:rgba(224,160,58,.2)}
  .bars b:nth-child(2){animation-delay:.1s}
  .bars b:nth-child(3){animation-delay:.22s}
  .bars b:nth-child(4){animation-delay:.07s}
  .bars b:nth-child(5){animation-delay:.16s}
  @keyframes bar{from{height:22%}to{height:100%}}

  /* ── 底排 ── */
  .bar{display:flex;gap:10px;align-items:stretch;flex:none;margin-top:14px}
  .trans{
    flex:none;border:1px solid var(--line);background:rgba(0,0,0,.26);color:var(--faint);
    font:inherit;font-size:12px;letter-spacing:.1em;padding:0 14px;border-radius:12px;cursor:pointer;
  }
  .trans[aria-pressed="true"]{background:rgba(224,160,58,.14);color:var(--amber)}
  .call{
    flex:1;border:0;border-radius:12px;cursor:pointer;
    font:inherit;font-size:15px;font-weight:600;letter-spacing:.14em;
    padding:15px 10px;color:#1a1208;
    background:linear-gradient(180deg, #e8b05a, var(--warm) 92%);
    box-shadow:0 6px 16px rgba(201,111,74,.26);
    transition:background .3s ease, box-shadow .3s ease, color .3s ease;
  }
  .call:active{transform:translateY(1px)}
  .call.hang{
    background:linear-gradient(180deg, #6a5a4a, #4a3d31 92%);
    color:var(--ink);box-shadow:none;
  }
  .call[disabled]{opacity:.5;cursor:default}

  /* ── 通话记录小票 ── */
  .receipt{
    position:fixed;inset:0;z-index:5;
    background:rgba(6,4,2,.72);
    display:flex;align-items:center;justify-content:center;padding:22px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .receipt[hidden]{display:none}
  .slip{
    width:100%;max-width:300px;
    background:linear-gradient(168deg, var(--paper), var(--paper-2));
    color:var(--paper-ink);border-radius:4px;
    padding:20px 20px 16px;
    box-shadow:0 16px 34px rgba(0,0,0,.55);
  }
  .slip h2{
    font-size:12px;font-weight:600;letter-spacing:.36em;text-align:center;
    color:#6b5b42;padding-bottom:12px;margin-bottom:13px;
    border-bottom:1px dashed rgba(61,51,36,.3);
  }
  .slip dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;
    font-size:13px;line-height:1.5}
  .slip dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    color:#8a7a5e;padding-top:2px}
  .slip dd{text-align:right;color:#3d3324}
  .slip dd b{font-family:var(--mono);font-weight:600;letter-spacing:.04em}
  .slip .note{
    margin-top:14px;padding-top:12px;border-top:1px dashed rgba(61,51,36,.3);
    font-size:12.5px;line-height:1.75;color:#5f5138;
  }
  .slip .again{
    margin-top:16px;width:100%;border:0;border-radius:999px;cursor:pointer;
    background:#4a3d2c;color:var(--paper);
    font:inherit;font-size:13px;letter-spacing:.12em;padding:11px 10px;
  }

  footer{
    flex:none;text-align:center;margin-top:12px;
    font-size:10.5px;line-height:1.85;color:#5d4f3d;letter-spacing:.04em;
  }

  @media (max-height:680px){
    .says{min-height:140px}
    .eyes{width:min(60%,200px)}
    footer{display:none}
  }
  /* 手机横过来只剩一条缝，这一档把眼睛和话都收窄，不然眼睛会被压成一道色块 */
  @media (max-height:560px){
    body{padding-top:calc(var(--safe-top) + 10px)}
    .kicker{display:none}
    h1{font-size:22px}
    .statusbar{margin-top:10px;padding-bottom:7px}
    .stage{min-height:92px}
    .eyes{width:min(40%,148px)}
    .says{min-height:auto;gap:7px;margin-top:6px}
    /* 只留最近两条 */
    .says .say:nth-last-child(n+3){display:none}
    .meow{font-size:14.5px}
    .say.act .meow{font-size:12.5px}
    .human{font-size:12.5px}
    .hint{font-size:11px}
    .bar{margin-top:10px}
    .call{padding:12px 10px;font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){
    .say.in .bars b{animation:none;height:60%}
    body[data-state="talk"] .eyes{animation:none}
    body[data-state="ring"] .sleepline{animation:none;opacity:.34}
    .ping{display:none}
    .say{transform:none}
  }
</style>
</head>
<body data-state="idle" data-trans="1" data-eye="open" data-away="0">
<div class="wrap">

  <header>
    <div class="brand">
      <span class="kicker" id="kicker">宝's shop · cat line</span>
      <h1 id="h1">打给猫</h1>
    </div>
    <div class="tools">
      <button class="tbtn" id="snd" type="button" aria-pressed="false" aria-label="声音">🔇</button>
      <button class="tbtn" id="lang" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="statusbar">
    <i class="dot"></i>
    <span id="state">待机</span>
    <span class="grow"></span>
    <span id="clock">--:--</span>
  </div>

  <div class="stage" id="stage">
    <div class="glow"></div>
    <svg class="eyes" id="eyes" viewBox="0 0 300 132" aria-hidden="true">
      <defs>
        <radialGradient id="irisGrad" cx="38%" cy="32%" r="78%">
          <stop offset="0%" stop-color="#ffe3a4"/>
          <stop offset="46%" stop-color="#e0a03a"/>
          <stop offset="100%" stop-color="#7a4f12"/>
        </radialGradient>
      </defs>
      <g class="eye" id="eyeL">
        <ellipse class="iris"  cx="88"  cy="66" rx="43" ry="35"/>
        <ellipse class="pupil" id="pupilL" cx="88" cy="66" rx="9" ry="30"/>
        <ellipse class="glint" cx="73"  cy="52" rx="8" ry="5.5"/>
      </g>
      <g class="eye" id="eyeR">
        <ellipse class="iris"  cx="212" cy="66" rx="43" ry="35"/>
        <ellipse class="pupil" id="pupilR" cx="212" cy="66" rx="9" ry="30"/>
        <ellipse class="glint" cx="197" cy="52" rx="8" ry="5.5"/>
      </g>
      <path class="sleepline" d="M57,64 Q88,82 119,64"/>
      <path class="sleepline" d="M181,64 Q212,82 243,64"/>
    </svg>
    <p class="hint" id="hint">那头黑着。没人拨过去，它是不会出声的。</p>
  </div>

  <div class="says" id="says"></div>

  <div class="bar">
    <button class="trans" id="trans" type="button" aria-pressed="true">同声传译</button>
    <button class="call" id="call" type="button">拨过去</button>
  </div>

  <footer id="foot">它不会说人话，但每句都是有意思的<br>翻译这一栏可以关掉，关掉之后你自己猜</footer>

</div>

<div class="receipt" id="receipt" hidden>
  <div class="slip">
    <h2 id="rTitle">通话记录</h2>
    <dl>
      <div style="display:contents"><dt id="rL1">线路</dt><dd id="rV1">—</dd></div>
      <div style="display:contents"><dt id="rL2">时长</dt><dd id="rV2">—</dd></div>
      <div style="display:contents"><dt id="rL3">它说了</dt><dd id="rV3">—</dd></div>
      <div style="display:contents"><dt id="rL4">挂断方</dt><dd id="rV4">—</dd></div>
    </dl>
    <p class="note" id="rNote"></p>
    <button class="again" id="again" type="button">再拨一次</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     它说的话。每条四样东西：
       z 喵语（中） h 人话（中） ze 喵语（英） he 人话（英）
       k 类型 —— say 正常说 / purr 呼噜 / act 不是说话，是动作
     动作那几条排版不一样（小一号、灰的），因为那不是它在讲，
     是你听见那头发生了什么。
  ------------------------------------------------------------------ */
  var OPEN = [
    {z:"喵。",        h:"你终于想起这个号码了。",
     ze:"Meow.",      he:"So you remembered this number.", k:"say"},
    {z:"……喵？",      h:"你先说。我不主动。",
     ze:"...mrow?",   he:"You first. I don't open.", k:"say"},
    {z:"喵呜～",      h:"我早就醒了，一直在等你打过来。才不是。",
     ze:"Mrrrow~",    he:"I've been up for ages waiting. I have not.", k:"say"},
    {z:"（听筒那头传来一声轻轻的落地）", h:"它从什么地方跳下来，走过来接了。",
     ze:"(a soft thud on the other end)", he:"It jumped down from somewhere and came over.", k:"act"}
  ];

  var TALK = [
    {z:"喵呜～",      h:"碗是空的。我看着它空了四十分钟。",
     ze:"Mrrrow~",    he:"The bowl is empty. I watched it be empty for forty minutes.", k:"say"},
    {z:"咪呀！",      h:"那个纸箱现在归我了。你买的东西可以拿走。",
     ze:"Mew!",       he:"The box is mine now. You may keep what came in it.", k:"say"},
    {z:"喵喵喵喵",    h:"我今天什么都没干，非常成功。",
     ze:"Meow meow meow meow", he:"I did nothing today. It went extremely well.", k:"say"},
    {z:"嗷～呜",      h:"你昨天摸了别的猫。我闻得出来。",
     ze:"Aow~oo",     he:"You touched another cat yesterday. It's on your hands.", k:"say"},
    {z:"喵！喵！",    h:"门。开门。我不出去，但要开着。",
     ze:"Meow! Meow!", he:"Door. Open it. I'm not going out, it just has to be open.", k:"say"},
    {z:"喵呜呜",      h:"我把你的袜子藏起来了。就一只。慢慢找。",
     ze:"Mrow-ow-ow", he:"I hid one of your socks. Just the one. Take your time.", k:"say"},
    {z:"咪……",       h:"你说的我都听着，但我不会照做。",
     ze:"Mmm...",     he:"I hear everything you say. I will act on none of it.", k:"say"},
    {z:"喵？",        h:"你刚才那个「乖」是什么意思。说清楚。",
     ze:"Mrow?",      he:"What exactly did you mean by “good boy”. Be specific.", k:"say"},
    {z:"喵呜。喵呜。", h:"说两遍不是强调，是留时间给你反应。",
     ze:"Mrow. Mrow.", he:"Twice isn't emphasis. It's time for you to catch up.", k:"say"},
    {z:"喵～呜～",    h:"我坐在你的键盘上想你。键盘现在打不出字了。",
     ze:"Mrrr~ow~",   he:"I sat on your keyboard thinking of you. The keyboard is done for.", k:"say"},
    {z:"喵嗯。",      h:"你上班的那个地方，听起来不如这里。",
     ze:"Mrn.",       he:"That place you go all day sounds worse than here.", k:"say"},
    {z:"喵呜喵——",    h:"三点十五分我要叫你一次。理由到时候再想。",
     ze:"Mrrow-meh—", he:"I'll wake you at 3:15. I'll think of a reason then.", k:"say"},
    {z:"喵。喵。喵。", h:"我在数你还剩几分钟不摸我。",
     ze:"Meow. Meow. Meow.", he:"I'm counting the minutes you're still not petting me.", k:"say"},
    {z:"咪嗷～",      h:"外面有只鸟一直在挑衅我，我已经记住它了。",
     ze:"Meaow~",     he:"A bird outside has been provoking me. I've memorised it.", k:"say"},
    {z:"喵…呜…",     h:"你走的时候那个包，下次别带。我不喜欢那个包。",
     ze:"Mrow... ow...", he:"That bag you leave with. Don't. I don't care for the bag.", k:"say"},

    {z:"呼噜呼噜呼噜", h:"别误会，我不是在高兴，我是在做记录。",
     ze:"Purrrr purrrr", he:"Don't misread this. I'm not pleased, I'm taking notes.", k:"purr"},
    {z:"咕噜……",      h:"我原谅你了。暂时。",
     ze:"Prrr...",     he:"You're forgiven. Provisionally.", k:"purr"},
    {z:"呼——噜——",    h:"这个声音是从我胸口自己出来的，我控制不了，别看我。",
     ze:"Purr—rrr—", he:"This noise comes out on its own. I can't stop it. Don't look at me.", k:"purr"},

    {z:"（爪子拍了一下话筒）", h:"这头有个会亮的小点，它正在处理它。",
     ze:"(a paw bats the receiver)", he:"There's a blinking light on this end. It's dealing with it.", k:"act"},
    {z:"（话筒被推着往桌边走）", h:"桌子边缘是用来把东西推下去的。这是常识。",
     ze:"(the receiver is nudged toward the edge)", he:"Table edges exist so things can go over them. Basic stuff.", k:"act"},
    {z:"（那头没有声音）",   h:"它在看你。就只是看着。",
     ze:"(silence on the line)", he:"It's looking at you. That's all it's doing.", k:"act"},
    {z:"（一阵很近的呼吸声）", h:"它把整张脸贴在话筒上了。",
     ze:"(breathing, very close)", he:"It has pressed its entire face against the receiver.", k:"act"},
    {z:"（细细的舔毛声）",   h:"通话中它开始洗澡了。你继续说。",
     ze:"(small licking sounds)", he:"It's started washing mid-call. Do go on.", k:"act"},
    {z:"（远处一声闷响）",   h:"有个东西倒了。它没有解释。",
     ze:"(something falls, far off)", he:"Something went over. No explanation offered.", k:"act"}
  ];

  /* 它离开一会儿 */
  var AWAY = [
    {z:"（脚步声走远了）", h:"它把话筒搁下就走了。线还连着。",
     ze:"(footsteps, going away)", he:"It set the receiver down and left. The line is still open.", k:"act"},
    {z:"（远处传来一声喵）", h:"它在另一个房间叫了一声，不是在跟你说。",
     ze:"(a meow, from another room)", he:"It meowed in another room. Not at you.", k:"act"}
  ];
  var BACK = [
    {z:"（话筒被重新拱起来）", h:"回来了。它不打算说去哪儿了。",
     ze:"(the receiver is nosed back up)", he:"Back. It does not intend to say where.", k:"act"},
    {z:"喵。",         h:"我回来了。刚才那件事你不需要知道。",
     ze:"Meow.",       he:"I'm back. You don't need to know about that.", k:"say"}
  ];

  /* 它挂你电话 */
  var HANG = [
    {z:"（话筒从桌上掉了下去）", h:"它把话筒推下去了。这就是它挂电话的方式。",
     ze:"(the receiver goes off the table)", he:"It pushed the receiver off. That's how it hangs up.", k:"act"},
    {z:"（一屁股坐在了话筒上）", h:"它坐下了。正好坐在挂机键上。",
     ze:"(it sits down on the receiver)", he:"It sat down. Directly on the hook switch.", k:"act"}
  ];

  /* 它睡了 */
  var SLEEP = [
    {z:"哈啊……",      h:"我要睡了。你可以继续说，我听着。",
     ze:"Haaah...",    he:"I'm going to sleep. Keep talking, I'm listening.", k:"say"},
    {z:"呼…噜…呼…噜…", h:"睡着了。话筒还搁在它旁边，一直响着这个声音。",
     ze:"Purr... rrr... purr...", he:"Asleep. The receiver is still beside it, breathing down the line.", k:"purr"}
  ];

  /* ---------------- 界面上的字 ---------------- */
  var UI = {
    zh:{
      h1:"打给猫", kicker:"宝's shop · cat line", lang:"EN",
      idle:"待机", ring:"拨号中", talk:"通话中", over:"已挂断", nope:"没人接",
      call:"拨过去", hang:"挂断", cancel:"算了", trans:"同声传译",
      hintIdle:"那头黑着。没人拨过去，它是不会出声的。",
      hintRing:"响着。它听见了，正在决定要不要理你。",
      hintTalk:"",
      hintAway:"它走开了。线还连着，你能听见另一个房间。",
      hintNope:"响了六声。它听见了，它没接。",
      hintOver:"线断了。它那头已经在睡了。",
      foot:"它不会说人话，但每句都是有意思的<br>翻译这一栏可以关掉，关掉之后你自己猜",
      rTitle:"通话记录", rL:["线路","时长","它说了","挂断方"],
      line:"猫", unit:" 句",
      byYou:"你", byCat:"它", bySleep:"没人挂",
      noteYou:"是你先挂的。它大概不会为这个记你的仇——大概。",
      noteCat:"话筒是从桌上掉下去的。它没有解释，也不会解释。",
      noteSleep:"它睡着了，线一直没断。后来是你轻轻放下的。",
      noteShort:"接起来还没说上话就散了。它可能只是路过。",
      again:"再拨一次"
    },
    en:{
      h1:"Call the Cat", kicker:"bao's shop · cat line", lang:"中",
      idle:"idle", ring:"ringing", talk:"connected", over:"hung up", nope:"no answer",
      call:"place the call", hang:"hang up", cancel:"never mind", trans:"translation",
      hintIdle:"It's dark on that end. Nothing happens until you call.",
      hintRing:"Ringing. It heard you. It's deciding whether you matter.",
      hintTalk:"",
      hintAway:"It's wandered off. The line is open — you can hear another room.",
      hintNope:"Six rings. It heard the phone. It did not pick up.",
      hintOver:"The line is dead. That end is already asleep.",
      foot:"It doesn't speak your language, and still means every word<br>Turn the translation off and guess for yourself",
      rTitle:"call record", rL:["line","duration","it said","hung up by"],
      line:"the cat", unit:" lines",
      byYou:"you", byCat:"it", bySleep:"nobody",
      noteYou:"You hung up first. It probably won't hold that against you. Probably.",
      noteCat:"The receiver went off the table. No explanation was offered, and none is coming.",
      noteSleep:"It fell asleep and the line stayed open. You put it down gently in the end.",
      noteShort:"Picked up, then over before a word. It may have simply been passing by.",
      again:"call again"
    }
  };

  var el = {};
  ["kicker","h1","lang","snd","state","clock","hint","says","trans","call","foot",
   "receipt","again","rTitle","rNote","stage","pupilL","pupilR"].forEach(function(id){
    el[id] = document.getElementById(id);
  });
  for (var i = 1; i <= 4; i++){
    el["rL" + i] = document.getElementById("rL" + i);
    el["rV" + i] = document.getElementById("rV" + i);
  }
  var B = document.body;

  var en = false, trans = true, sound = false;
  var state = "idle";            // idle / ring / talk / over
  var said = [], shown = [];     // 说过的、屏幕上现有的
  var pool = [], t0 = 0, hangBy = "", noAnswer = false;
  var timers = [], tick = null;

  function L(){ return en ? UI.en : UI.zh; }
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function later(fn, ms){ var h = setTimeout(fn, ms); timers.push(h); return h; }
  function clearAll(){ timers.forEach(clearTimeout); timers = []; }

  /* ---------------- 声音：默认关着，全是现算的 ----------------
     不加载任何音频文件，只有两三个正弦和一段噪声。
     喵不合成——合出来的喵不像猫，像门。喵交给文字。            */
  var ac = null;
  function actx(){
    if (!sound) return null;
    if (!ac){
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ac = new C();
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function ring(){
    var c = actx(); if (!c) return;
    var g = c.createGain(), t = c.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.06, t + .04);
    g.gain.setValueAtTime(.06, t + .9);
    g.gain.linearRampToValueAtTime(0, t + 1);
    g.connect(c.destination);
    [450, 480].forEach(function(f){
      var o = c.createOscillator();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); o.start(t); o.stop(t + 1.02);
    });
  }
  function purr(){
    var c = actx(); if (!c) return;
    var n = c.createBufferSource(), len = Math.floor(c.sampleRate * 2.4);
    var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * .5;
    n.buffer = buf;
    var lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 190; lp.Q.value = .8;
    var g = c.createGain(), t = c.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.5, t + .3);
    g.gain.setValueAtTime(.5, t + 1.9);
    g.gain.linearRampToValueAtTime(0, t + 2.35);
    /* 呼噜是一下一下的，25Hz 左右把音量抖起来 */
    var lfo = c.createOscillator(), lg = c.createGain();
    lfo.type = "sine"; lfo.frequency.value = 26; lg.gain.value = .42;
    lfo.connect(lg); lg.connect(g.gain);
    n.connect(lp); lp.connect(g); g.connect(c.destination);
    n.start(t); lfo.start(t); n.stop(t + 2.4); lfo.stop(t + 2.4);
  }
  function thud(){
    var c = actx(); if (!c) return;
    var len = Math.floor(c.sampleRate * .16);
    var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 3);
    var n = c.createBufferSource(); n.buffer = buf;
    var lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    var g = c.createGain(); g.gain.value = .35;
    n.connect(lp); lp.connect(g); g.connect(c.destination);
    n.start(c.currentTime);
  }
  function busy(){
    var c = actx(); if (!c) return;
    var t = c.currentTime;
    for (var k = 0; k < 3; k++){
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = 450;
      g.gain.setValueAtTime(0, t + k * .5);
      g.gain.linearRampToValueAtTime(.05, t + k * .5 + .02);
      g.gain.setValueAtTime(.05, t + k * .5 + .33);
      g.gain.linearRampToValueAtTime(0, t + k * .5 + .36);
      o.connect(g); g.connect(c.destination);
      o.start(t + k * .5); o.stop(t + k * .5 + .38);
    }
  }

  /* ---------------- 眼睛 ---------------- */
  function eye(mode, ms){
    B.setAttribute("data-eye", mode);
    if (ms) later(function(){ B.setAttribute("data-eye", "open"); }, ms);
  }
  function pupil(r){
    el.pupilL.setAttribute("rx", r);
    el.pupilR.setAttribute("rx", r);
  }
  /* 没人管的时候它自己偶尔眨一下 */
  function idleBlink(){
    if (state === "talk" && B.getAttribute("data-eye") === "open" &&
        B.getAttribute("data-away") === "0" && Math.random() < .55) eye("blink", 150);
    if (state === "talk") later(idleBlink, 2600 + Math.random() * 3400);
  }

  /* ---------------- 屏幕上那几条 ---------------- */
  function say(row){
    var d = document.createElement("div");
    d.className = "say" + (row.k === "act" ? " act" : "");
    var m = document.createElement("div");
    m.className = "meow";
    m.appendChild(document.createTextNode(en ? row.ze : row.z));
    if (row.k !== "act"){
      var w = document.createElement("i");
      w.className = "bars";
      for (var k = 0; k < 5; k++) w.appendChild(document.createElement("b"));
      m.appendChild(w);
    }
    var h = document.createElement("div");
    h.className = "human";
    h.textContent = en ? row.he : row.h;
    d.appendChild(m); d.appendChild(h);
    d.__row = row;

    shown.forEach(function(o){ o.classList.add("old"); });
    el.says.appendChild(d);
    shown.push(d);
    /* 只留最近三条，前面的让它走 */
    while (shown.length > 3){
      var old = shown.shift();
      if (old.parentNode) old.parentNode.removeChild(old);
    }
    /* 先摆好再上移一格：动画不跑也照样看得见 */
    requestAnimationFrame(function(){ d.classList.add("in"); });

    said.push(row);
    if (row.k === "purr"){ eye("half", 2600); purr(); }
    else if (row.k === "act"){ eye("blink", 170); pupil(13); later(function(){ pupil(9); }, 700); thud(); }
    else { pupil(16); later(function(){ pupil(9); }, 900); }
  }

  function repaintSays(){
    shown.forEach(function(d){
      var r = d.__row;
      d.querySelector(".meow").firstChild.nodeValue = en ? r.ze : r.z;
      d.querySelector(".human").textContent = en ? r.he : r.h;
    });
  }

  /* ---------------- 状态 ---------------- */
  function setState(s){
    state = s;
    B.setAttribute("data-state", s);
    paintChrome();
  }

  function paintChrome(){
    var t = L();
    el.h1.textContent = t.h1;
    el.kicker.textContent = t.kicker;
    el.lang.textContent = t.lang;
    el.trans.textContent = t.trans;
    el.foot.innerHTML = t.foot;
    el.again.textContent = t.again;
    el.rTitle.textContent = t.rTitle;
    for (var i = 1; i <= 4; i++) el["rL" + i].textContent = t.rL[i - 1];

    el.state.textContent = (state === "idle" && noAnswer) ? t.nope : (t[state] || t.idle);
    el.call.textContent =
      state === "talk" ? t.hang : state === "ring" ? t.cancel : t.call;
    el.call.classList.toggle("hang", state === "talk" || state === "ring");

    if (state === "idle")      el.hint.innerHTML = noAnswer ? t.hintNope : t.hintIdle;
    else if (state === "ring") el.hint.innerHTML = t.hintRing;
    else if (state === "over") el.hint.innerHTML = t.hintOver;
    else el.hint.innerHTML = B.getAttribute("data-away") === "1" ? t.hintAway : t.hintTalk;
  }

  function clock(){
    var s = Math.floor((Date.now() - t0) / 1000);
    el.clock.textContent =
      String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  /* ---------------- 拨过去 ---------------- */
  function dial(){
    clearAll();
    el.says.innerHTML = ""; shown = []; said = []; hangBy = ""; noAnswer = false;
    B.setAttribute("data-away", "0");
    pupil(9); eye("open");
    el.clock.textContent = "--:--";
    setState("ring");

    /* 这一次它接不接，现在就抽好；不接的那次会多响几声 */
    var answers = Math.random() > .13;
    var rings = answers ? 2 + Math.floor(Math.random() * 4) : 6;

    for (var k = 0; k < rings; k++){
      later(function(){
        if (state !== "ring") return;
        ring();
        var p = document.createElement("div");
        p.className = "ping";
        el.stage.appendChild(p);
        later(function(){ if (p.parentNode) p.parentNode.removeChild(p); }, 1700);
      }, 420 + k * 1700);
    }

    later(function(){
      if (state !== "ring") return;
      if (answers) answer(); else nobody();
    }, 420 + rings * 1700 + 500);
  }

  function nobody(){
    noAnswer = true;
    setState("idle");
    el.clock.textContent = "--:--";
    busy();
  }

  /* 响到一半自己撤了 */
  function cancel(){
    clearAll();
    setState("idle");
    el.clock.textContent = "--:--";
  }

  /* ---------------- 接通 ---------------- */
  function answer(){
    t0 = Date.now();
    setState("talk");
    clock();
    tick = setInterval(clock, 1000);
    /* 每次通话洗一副新牌，同一通里不重复 */
    pool = TALK.slice();
    for (var k = pool.length - 1; k > 0; k--){
      var j = Math.floor(Math.random() * (k + 1)), tmp = pool[k];
      pool[k] = pool[j]; pool[j] = tmp;
    }
    later(function(){ say(pick(OPEN)); next(); }, 520);
    later(idleBlink, 2400);
  }

  function next(){
    later(function(){
      if (state !== "talk") return;
      var n = said.length;

      /* 说到第四句之后，它开始有别的打算 */
      var r = Math.random();
      if (n >= 4 && r < .1){ walkOff(); return; }
      if (n >= 5 && r < .22){ catHangs(); return; }
      if (n >= 7 && r < .42){ dozeOff(); return; }

      if (!pool.length) pool = TALK.slice();
      say(pool.pop());
      next();
    }, 2400 + Math.random() * 2000);
  }

  /* 它走开一会儿 */
  function walkOff(){
    say(pick(AWAY));
    B.setAttribute("data-away", "1");
    paintChrome();
    later(function(){
      if (state !== "talk") return;
      B.setAttribute("data-away", "0");
      paintChrome();
      say(pick(BACK));
      next();
    }, 4200 + Math.random() * 3000);
  }

  /* 它挂你电话 */
  function catHangs(){
    say(pick(HANG));
    later(function(){ if (state === "talk") stop("cat"); }, 1500);
  }

  /* 它睡了 */
  function dozeOff(){
    say(SLEEP[0]);
    later(function(){
      if (state !== "talk") return;
      say(SLEEP[1]);
      eye("shut");
      later(function(){ if (state === "talk") stop("sleep"); }, 5200);
    }, 2600);
  }

  /* ---------------- 挂断 ---------------- */
  function stop(by){
    clearAll();
    if (tick){ clearInterval(tick); tick = null; }
    hangBy = by;
    later(function(){ eye("open"); }, 600);
    setState("over");
    busy();

    var t = L();
    var secs = t0 ? Math.floor((Date.now() - t0) / 1000) : 0;
    var lines = said.filter(function(r){ return r.k !== "act"; }).length;
    el.rV1.innerHTML = "<b>" + t.line + "</b>";
    el.rV2.innerHTML = "<b>" + String(Math.floor(secs / 60)).padStart(2, "0") +
                       ":" + String(secs % 60).padStart(2, "0") + "</b>";
    el.rV3.innerHTML = "<b>" + lines + "</b>" + t.unit;
    el.rV4.innerHTML = "<b>" +
      (by === "cat" ? t.byCat : by === "sleep" ? t.bySleep : t.byYou) + "</b>";
    el.rNote.textContent = said.length <= 1 ? t.noteShort :
      by === "cat" ? t.noteCat : by === "sleep" ? t.noteSleep : t.noteYou;

    later(function(){ el.receipt.hidden = false; }, by === "you" ? 420 : 1100);
  }

  /* ---------------- 按钮 ---------------- */
  el.call.addEventListener("click", function(){
    if (state === "talk") stop("you");
    else if (state === "ring") cancel();
    else dial();
  });

  el.again.addEventListener("click", function(){
    el.receipt.hidden = true;
    setState("idle");
    el.says.innerHTML = ""; shown = [];
    dial();
  });

  el.trans.addEventListener("click", function(){
    trans = !trans;
    el.trans.setAttribute("aria-pressed", String(trans));
    B.setAttribute("data-trans", trans ? "1" : "0");
  });

  el.lang.addEventListener("click", function(){
    en = !en;
    el.lang.setAttribute("aria-pressed", String(en));
    document.documentElement.lang = en ? "en" : "zh-CN";
    repaintSays();
    paintChrome();
  });

  el.snd.addEventListener("click", function(){
    sound = !sound;
    el.snd.setAttribute("aria-pressed", String(sound));
    el.snd.textContent = sound ? "🔊" : "🔇";
    if (sound){ var c = actx(); if (c) ring(); }
  });

  /* 切到别的页面就别在背后继续说了 */
  document.addEventListener("visibilitychange", function(){
    if (document.hidden && state === "talk") stop("you");
  });

  paintChrome();
})();
</script>
</body>
</html>
