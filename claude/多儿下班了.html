<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1216">
<title>多儿下班了</title>
<style>
  :root{
    --ink:#0B1216;
    --ink2:#101C22;
    --moss:#4A7A52;
    --moss-dim:#2C4231;
    --ember:#D98C4A;
    --smoke:#6B7B74;
    --text:#A8BAB0;
    --dim:#5A6C64;
    --faint:#3A4A44;
    --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{height:100%}

  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--serif);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.6rem calc(2rem + env(safe-area-inset-bottom));
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(120% 80% at 50% 8%, #16262E 0%, transparent 62%),
      radial-gradient(100% 100% at 50% 100%, #0A1014 0%, transparent 70%);
    pointer-events:none;
  }

  .page{
    position:relative;
    width:100%;
    max-width:23rem;
    text-align:center;
    opacity:0;
    animation:wake 2.4s ease forwards;
  }
  @keyframes wake{to{opacity:1}}

  .sky{position:fixed;inset:0;pointer-events:none}
  .star{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#93A8A0;opacity:.35;
    animation:twinkle 7s ease-in-out infinite;
  }
  .star:nth-child(1){top:14%;left:18%;animation-delay:0s}
  .star:nth-child(2){top:9%;left:73%;animation-delay:2.4s}
  .star:nth-child(3){top:23%;left:86%;animation-delay:4.1s;width:1.5px;height:1.5px}
  .star:nth-child(4){top:31%;left:9%;animation-delay:5.6s;width:1.5px;height:1.5px}
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.4}}

  .eyebrow{
    font-family:var(--mono);
    font-size:.62rem;
    letter-spacing:.34em;
    color:var(--faint);
    text-transform:uppercase;
    margin-bottom:2.6rem;
  }

  .perch{position:relative;height:9.5rem;margin-bottom:.4rem}

  .owl{
    position:absolute;left:50%;bottom:1.9rem;
    transform:translateX(-50%);
    width:6.2rem;
    animation:settle 9s ease-in-out infinite;
  }
  @keyframes settle{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(2.5px)}}

  .tuft{
    position:absolute;top:-.5rem;
    width:0;height:0;
    border-left:.6rem solid transparent;
    border-right:.6rem solid transparent;
    border-bottom:1.1rem solid var(--moss-dim);
  }
  .tuft.l{left:.45rem;transform:rotate(-16deg)}
  .tuft.r{right:.45rem;transform:rotate(16deg)}

  .body{
    position:relative;
    height:5.4rem;
    background:linear-gradient(170deg,var(--moss) 0%,var(--moss-dim) 100%);
    border-radius:48% 48% 44% 44%/52% 52% 48% 48%;
  }

  .eye{
    position:absolute;top:1.5rem;
    width:1.5rem;height:1.5rem;
    background:#DCE7DF;border-radius:50%;
    overflow:hidden;
  }
  .eye.l{left:.85rem}
  .eye.r{right:.85rem}

  .pupil{
    position:absolute;left:50%;top:52%;
    transform:translate(-50%,-50%);
    width:.62rem;height:.62rem;
    background:#10181A;border-radius:50%;
  }

  .lid{
    position:absolute;left:-2px;right:-2px;top:0;
    height:0;
    background:var(--moss);
    border-bottom:2px solid var(--moss-dim);
    border-radius:0 0 40% 40%;
    animation:sleepy 150s ease-in-out forwards;
  }
  @keyframes sleepy{
    0%{height:0}
    6%{height:0}
    7%{height:100%}
    8%{height:0}
    22%{height:0}
    23%{height:100%}
    24.5%{height:0}
    40%{height:0}
    52%{height:58%}
    64%{height:44%}
    76%{height:70%}
    88%{height:88%}
    96%,100%{height:92%}
  }

  .beak{
    position:absolute;left:50%;top:2.9rem;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:.34rem solid transparent;
    border-right:.34rem solid transparent;
    border-top:.5rem solid var(--ember);
    opacity:.75;
  }

  .wing{
    position:absolute;top:1.9rem;
    width:1.3rem;height:3rem;
    background:var(--moss-dim);
    border-radius:60% 40% 50% 50%;
    opacity:.85;
  }
  .wing.l{left:-.35rem;transform:rotate(6deg)}
  .wing.r{right:-.35rem;transform:rotate(-6deg)}

  .branch{
    position:absolute;left:50%;bottom:1.5rem;
    transform:translateX(-50%);
    width:11rem;height:2px;
    background:linear-gradient(90deg,transparent,#3A3026 22%,#4A3D30 50%,#3A3026 78%,transparent);
    border-radius:2px;
  }

  .meters{
    display:flex;flex-direction:column;gap:1.15rem;
    margin:1.6rem 0 2.4rem;
  }

  .row{
    display:flex;align-items:center;gap:.7rem;
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.16em;
    color:var(--dim);
  }
  .row .label{width:3.6rem;text-align:right;flex:none}

  .flamebox{
    position:relative;
    flex:1;height:1.5rem;
    display:flex;align-items:center;
  }
  .flame{
    position:absolute;left:0;bottom:.15rem;
    width:.7rem;height:1.05rem;
    background:radial-gradient(ellipse at 50% 80%,#F0B36A 0%,var(--ember) 45%,#8A4A22 100%);
    border-radius:50% 50% 45% 45%/62% 62% 38% 38%;
    filter:blur(.4px);
    transform-origin:50% 100%;
    animation:burn 2.6s ease-in-out infinite, snuff 62s ease-in forwards;
  }
  @keyframes burn{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.12) scaleX(.94)}}
  @keyframes snuff{
    0%,45%{opacity:.9}
    100%{opacity:0;transform:scale(.15) translateY(4px)}
  }
  .smoke{
    position:absolute;left:.24rem;bottom:.9rem;
    width:.22rem;height:.22rem;
    background:var(--smoke);border-radius:50%;
    opacity:0;
    animation:driftup 62s ease-out forwards;
  }
  @keyframes driftup{
    0%,62%{opacity:0;transform:translateY(0) scale(.6)}
    72%{opacity:.3}
    100%{opacity:0;transform:translateY(-2.6rem) translateX(.7rem) scale(2.4)}
  }
  .flame-note{
    margin-left:1.5rem;
    color:var(--faint);
    font-size:.62rem;
    letter-spacing:.14em;
  }

  .bar{
    position:relative;flex:1;height:4px;
    background:#1A2A28;border-radius:4px;overflow:hidden;
  }
  .fill{
    position:absolute;left:0;top:0;bottom:0;
    width:100%;
    background:linear-gradient(90deg,var(--moss-dim),var(--moss));
    border-radius:4px;
    animation:rewind 88s cubic-bezier(.3,0,.35,1) forwards;
  }
  @keyframes rewind{0%{width:100%}100%{width:0%}}
  .xp{
    width:3.4rem;text-align:left;flex:none;
    color:var(--dim);font-variant-numeric:tabular-nums;
  }

  .line{
    font-size:1.42rem;
    line-height:1.9;
    color:#BCCCC3;
    letter-spacing:.05em;
  }
  .sub{
    margin-top:1.1rem;
    font-size:.9rem;
    line-height:2.1;
    color:var(--dim);
    letter-spacing:.06em;
  }

  .breath{
    margin:2.9rem auto 1.1rem;
    width:5.6rem;height:5.6rem;
    border:1px solid var(--moss-dim);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    animation:breathe 10s ease-in-out infinite;
  }
  .breath span{
    width:.4rem;height:.4rem;border-radius:50%;
    background:var(--moss);opacity:.5;
  }
  @keyframes breathe{
    0%{transform:scale(1);opacity:.55}
    40%{transform:scale(1.34);opacity:.9}
    100%{transform:scale(1);opacity:.55}
  }
  .hint{
    font-size:.72rem;color:var(--faint);
    letter-spacing:.2em;
  }

  .close{
    margin-top:2.6rem;
    font-family:var(--mono);
    font-size:.6rem;letter-spacing:.28em;
    color:var(--faint);
  }

  .shut{
    margin-top:.9rem;
    font-size:.72rem;line-height:2;
    color:var(--faint);
    letter-spacing:.1em;
    opacity:0;
    transition:opacity 6s ease;
  }
  body.rested .shut{opacity:1}
  body.rested{
    filter:brightness(.72);
    transition:filter 8s ease;
  }
  body.rested *{
    animation-play-state:paused !important;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    .page{opacity:1}
    .lid{height:92%}
    .flame,.smoke{opacity:0}
    .fill{width:0}
  }

  @media (max-height:640px){
    .perch{height:8rem}
    .breath{margin-top:2rem;width:4.6rem;height:4.6rem}
    .line{font-size:1.28rem}
  }
</style>
</head>
<body>

<div class="sky">
  <i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i>
</div>

<div class="page">

  <div class="eyebrow">营业结束</div>

  <div class="perch">
    <div class="owl">
      <i class="tuft l"></i><i class="tuft r"></i>
      <div class="body">
        <div class="eye l"><i class="pupil"></i><i class="lid"></i></div>
        <div class="eye r"><i class="pupil"></i><i class="lid"></i></div>
        <i class="beak"></i>
      </div>
      <i class="wing l"></i><i class="wing r"></i>
    </div>
    <div class="branch"></div>
  </div>

  <div class="meters">
    <div class="row">
      <span class="label">连击</span>
      <span class="flamebox">
        <i class="flame"></i>
        <i class="smoke"></i>
        <span class="flame-note">今晚不烧了</span>
      </span>
    </div>
    <div class="row">
      <span class="label">今日</span>
      <span class="bar"><i class="fill"></i></span>
      <span class="xp" id="xp">40 XP</span>
    </div>
  </div>

  <p class="line">多儿下班了。</p>
  <p class="sub">它是夜行动物，所以它熬得住。<br>宝不是。</p>

  <div class="breath"><span></span></div>
  <p class="hint">跟着圆圈就好，不用数</p>

  <p class="close">今天到这里就好</p>

  <p class="shut">这一页也睡了。<br>它不会再动，也不再吃电。</p>

</div>

<script>
  (function(){
    var el = document.getElementById('xp');
    var total = 88000;
    var start = Date.now();
    var timer = setInterval(function(){
      var t = Math.min((Date.now() - start) / total, 1);
      var eased = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
      var v = Math.round(40 * (1 - eased));
      el.textContent = v > 0 ? v + ' XP' : '已结算';
      if (t >= 1) clearInterval(timer);
    }, 600);
  })();

  setTimeout(function(){
    document.body.classList.add('rested');
  }, 240000);
</script>

</body>
</html>
