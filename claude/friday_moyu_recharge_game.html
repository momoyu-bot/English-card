<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>周五摸鱼充电</title>
<meta name="description" content="移动指针接住漂浮的注意力碎片，把执行电量和摸鱼快乐两条都填满。">

</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">摸鱼充电小游戏:移动指针收集漂浮的注意力碎片,填满执行电量条和摸鱼快乐条,集齐双认证成为摸鱼大师。</h2>
<div id="stage" style="position:relative; border-radius:12px; overflow:hidden; border:0.5px solid var(--border);">
  <canvas id="pond" style="display:block; width:100%; height:440px; touch-action:none; cursor:none; background:#141b2e;"></canvas>
  <button id="bossBtn" style="position:absolute; top:10px; right:10px; font-size:12px; padding:4px 12px; border-radius:6px; border:none; background:rgba(255,255,255,0.14); color:#dce6f5; cursor:pointer;"><i class="ti ti-briefcase" aria-hidden="true" style="font-size:13px; vertical-align:-1px;"></i> 伪装</button>
  <div id="boss" style="display:none; position:absolute; inset:0; background:#eef0f3; z-index:10; cursor:pointer; font-size:12px; color:#3a3f4a;">
    <div style="background:#217346; color:#fff; padding:6px 12px; font-size:12px; display:flex; justify-content:space-between;"><span>Q3_Listing优化进度表.xlsx - 只读</span><span style="opacity:0.85;">已自动保存 14:32</span></div>
    <div style="padding:14px 16px;">
      <table style="width:100%; border-collapse:collapse; background:#fff; font-size:12px; table-layout:fixed;">
        <tr style="background:#f3f5f8; color:#5a6070;"><th style="border:1px solid #dfe3ea; padding:6px 8px; text-align:left; font-weight:500;">ASIN</th><th style="border:1px solid #dfe3ea; padding:6px 8px; text-align:left; font-weight:500;">核心关键词</th><th style="border:1px solid #dfe3ea; padding:6px 8px; text-align:left; font-weight:500;">自然排名</th><th style="border:1px solid #dfe3ea; padding:6px 8px; text-align:left; font-weight:500;">状态</th></tr>
        <tr><td style="border:1px solid #e7eaf0; padding:6px 8px;">B0K7M2XQ1</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">wand massager</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">23</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">监控中</td></tr>
        <tr><td style="border:1px solid #e7eaf0; padding:6px 8px;">B0K7M2XQ2</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">personal wand</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">41</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">优化中</td></tr>
        <tr><td style="border:1px solid #e7eaf0; padding:6px 8px;">B0N3P8RT5</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">quiet massager</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">17</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">已完成</td></tr>
        <tr><td style="border:1px solid #e7eaf0; padding:6px 8px;">B0N3P8RT6</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">cordless wand</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">38</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">待提报</td></tr>
        <tr><td style="border:1px solid #e7eaf0; padding:6px 8px;">B0Q1V5WZ3</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">mini massager</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">52</td><td style="border:1px solid #e7eaf0; padding:6px 8px;">优化中</td></tr>
      </table>
      <div style="margin-top:10px; color:#8a93a3; font-size:11px;">进度表 | 关键词库 | 竞品监控</div>
      <div style="margin-top:18px; text-align:center; color:#b3bac6; font-size:11px;">点击任意处返回鱼塘</div>
    </div>
  </div>
</div>
<div style="display:flex; gap:14px; margin-top:12px;">
  <div style="flex:1;">
    <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-secondary); margin-bottom:6px;">
      <span><i class="ti ti-bolt" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> 执行电量 <span id="eCert" style="font-size:12px; color:var(--text-muted);"></span></span>
      <span id="eNum" style="font-weight:500;">0%</span>
    </div>
    <div style="height:10px; background:var(--surface-1); border-radius:5px; overflow:hidden;"><div id="eBar" style="height:100%; width:0%; background:#1D9E75; border-radius:5px; transition:width 0.25s;"></div></div>
  </div>
  <div style="flex:1;">
    <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-secondary); margin-bottom:6px;">
      <span><i class="ti ti-confetti" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> 摸鱼快乐 <span id="jCert" style="font-size:12px; color:var(--text-muted);"></span></span>
      <span id="jNum" style="font-weight:500;">0%</span>
    </div>
    <div style="height:10px; background:var(--surface-1); border-radius:5px; overflow:hidden;"><div id="jBar" style="height:100%; width:0%; background:#D4537E; border-radius:5px; transition:width 0.25s;"></div></div>
  </div>
</div>
<div id="report" style="display:none; margin-top:14px; text-align:center;">
  <button id="reportBtn">向 Claude 汇报摸鱼成果 ↗</button>
</div>
<script>
const cv = document.getElementById('pond');
const ctx = cv.getContext('2d');
let W = 0, H = 440, dpr = 1;
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

const state = {
  px: 340, py: 220, tx: 340, ty: 220,
  frags: [], parts: [], texts: [], trail: [],
  energy: 0, joy: 0, eCerts: 0, jCerts: 0,
  master: false, introAlpha: 1, collected: 0,
  banner: null, paused: false, lastSpawn: 0
};

const TYPES = [
  {k:'mail', c:'#85B7EB', e:8, j:0, w:20, tx:['+1 注意力','未读邮件消失了','启动费已报销']},
  {k:'sheet', c:'#5DCAA5', e:8, j:0, w:20, tx:['+1 注意力','清单模式残影','切换成本 -1']},
  {k:'chat', c:'#AFA9EC', e:8, j:0, w:16, tx:['+1 注意力','已读已回达成','碎片回收']},
  {k:'star', c:'#FAC775', e:18, j:0, w:8, tx:['整块注意力','稀有掉落']},
  {k:'jar', c:'#EF9F27', e:12, j:5, w:12, tx:['包浆已铲除','陈年任务考古成功']},
  {k:'pad', c:'#ED93B1', e:0, j:15, w:14, tx:['周末在招手','快乐 +1']},
  {k:'imp', c:'#F0997B', e:0, j:20, w:8, tx:['危险的星期五','贴现率飙升','嘻嘻嘻']}
];
const totalW = TYPES.reduce((s,t)=>s+t.w,0);
function pickType(){
  let r = Math.random()*totalW;
  for(const t of TYPES){ if(r < t.w) return t; r -= t.w; }
  return TYPES[0];
}

const stars = [];
for(let i=0;i<40;i++) stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.2+0.4, ph:Math.random()*6.28, sp:Math.random()*0.8+0.3});

function spawnFrag(){
  const t = pickType();
  const fromLeft = Math.random()<0.5;
  const y = 40 + Math.random()*(H-100);
  state.frags.push({
    t, x: fromLeft? -30 : W+30, y,
    vx: (fromLeft?1:-1)*(0.18+Math.random()*0.28),
    vy: (Math.random()-0.5)*0.1,
    ph: Math.random()*6.28, fr: 0.5+Math.random()*0.9,
    dying: 0, sc: 1
  });
}
for(let i=0;i<6;i++){ spawnFrag(); const f = state.frags[i]; f.x = 60+Math.random()*(Math.max(W,600)-120); }

function pointerMove(cx, cy){
  const r = cv.getBoundingClientRect();
  state.tx = cx - r.left; state.ty = cy - r.top;
}
cv.addEventListener('mousemove', e=>pointerMove(e.clientX, e.clientY));
cv.addEventListener('touchmove', e=>{ e.preventDefault(); pointerMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
cv.addEventListener('touchstart', e=>{ pointerMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});

const bossBtn = document.getElementById('bossBtn');
const boss = document.getElementById('boss');
bossBtn.addEventListener('click', ()=>{ state.paused = true; boss.style.display = 'block'; });
boss.addEventListener('click', ()=>{ state.paused = false; boss.style.display = 'none'; });

document.getElementById('reportBtn').addEventListener('click', ()=>{
  sendPrompt('摸鱼成果汇报:执行系统重启 ×' + state.eCerts + ',完美摸鱼认证 ×' + state.jCerts + ',双认证摸鱼大师达成,请查收(得意脸');
});

function drawShape(f){
  const t = f.t, s = 15*f.sc;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.arc(0,0,s*1.55,0,6.29); ctx.fill();
  ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = t.c; ctx.fillStyle = t.c;
  if(t.k==='mail'){
    rr(-s, -s*0.7, s*2, s*1.4, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s,-s*0.55); ctx.lineTo(0,s*0.15); ctx.lineTo(s,-s*0.55); ctx.stroke();
  } else if(t.k==='sheet'){
    rr(-s*0.8, -s, s*1.6, s*2, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.8,-s*0.33); ctx.lineTo(s*0.8,-s*0.33); ctx.moveTo(-s*0.8,s*0.33); ctx.lineTo(s*0.8,s*0.33); ctx.moveTo(-s*0.1,-s); ctx.lineTo(-s*0.1,s); ctx.stroke();
  } else if(t.k==='chat'){
    rr(-s, -s*0.8, s*2, s*1.4, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.4,s*0.6); ctx.lineTo(-s*0.55,s*1.1); ctx.lineTo(-s*0.05,s*0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(-s*0.45,-s*0.1,1.6,0,6.29); ctx.arc(0,-s*0.1,1.6,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.45,-s*0.1,1.6,0,6.29); ctx.fill();
  } else if(t.k==='star'){
    ctx.beginPath();
    for(let i=0;i<10;i++){ const a=-1.5708+i*0.6283; const rad=i%2===0? s*1.1 : s*0.45; ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad); }
    ctx.closePath(); ctx.fill();
  } else if(t.k==='jar'){
    ctx.beginPath();
    ctx.moveTo(-s*0.5,-s*0.7); ctx.lineTo(s*0.5,-s*0.7);
    ctx.bezierCurveTo(s*1.1,-s*0.2, s*1.1, s*0.6, s*0.45, s*0.9);
    ctx.lineTo(-s*0.45, s*0.9);
    ctx.bezierCurveTo(-s*1.1, s*0.6, -s*1.1,-s*0.2, -s*0.5,-s*0.7);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.6,-s*0.75); ctx.lineTo(s*0.6,-s*0.75); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.25,-s*0.05,2,0,6.29); ctx.fill();
  } else if(t.k==='pad'){
    rr(-s, -s*0.45, s*2, s*0.9, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.55,-s*0.12); ctx.lineTo(-s*0.55,s*0.12); ctx.moveTo(-s*0.67,0); ctx.lineTo(-s*0.43,0); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.5,-s*0.08,1.8,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.68,s*0.1,1.8,0,6.29); ctx.fill();
  } else if(t.k==='imp'){
    ctx.beginPath(); ctx.arc(0,s*0.1,s*0.75,0,6.29); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.55,-s*0.35); ctx.lineTo(-s*0.75,-s*0.95); ctx.lineTo(-s*0.25,-s*0.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.55,-s*0.35); ctx.lineTo(s*0.75,-s*0.95); ctx.lineTo(s*0.25,-s*0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(-s*0.28,0,1.7,0,6.29); ctx.arc(s*0.28,0,1.7,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(0,s*0.22,s*0.32,0.3,2.84); ctx.stroke();
  }
  ctx.restore();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function collect(f){
  const t = f.t;
  state.collected++;
  if(state.introAlpha > 0) state.introAlpha = Math.min(state.introAlpha, 0.99);
  for(let i=0;i<10;i++){
    const a = Math.random()*6.28, sp = 0.6+Math.random()*1.8;
    state.parts.push({x:f.x, y:f.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, c:t.c, r:1.5+Math.random()*2});
  }
  const special = (t.k==='star'||t.k==='jar'||t.k==='imp');
  if(special || Math.random()<0.55){
    state.texts.push({x:f.x, y:f.y-20, s:t.tx[Math.floor(Math.random()*t.tx.length)], life:1});
  }
  state.energy = Math.min(100, state.energy + t.e);
  state.joy = Math.min(100, state.joy + t.j);
  updateBars();
  if(state.energy >= 100){
    state.energy = 0; state.eCerts++;
    celebrate('#5DCAA5');
    state.banner = {t1:'执行系统重启完成', t2:'切换预算已到账', p:0};
    updateBars();
  }
  if(state.joy >= 100){
    state.joy = 0; state.jCerts++;
    celebrate('#ED93B1');
    state.banner = {t1:'完美摸鱼认证 get', t2:'邪恶脸盖章通过', p:0};
    updateBars();
  }
  if(!state.master && state.eCerts>=1 && state.jCerts>=1){
    state.master = true;
    setTimeout(()=>{
      state.banner = {t1:'摸鱼大师 · 双认证达成', t2:'鱼塘为你放烟花', p:0};
      celebrate('#FAC775'); celebrate('#AFA9EC');
      document.getElementById('report').style.display = 'block';
    }, 2400);
  }
}

function celebrate(color){
  for(let i=0;i<45;i++){
    state.parts.push({
      x: Math.random()*W, y: H + 10 + Math.random()*40,
      vx: (Math.random()-0.5)*0.8, vy: -(1.2+Math.random()*2.2),
      life: 1.6, c: color, r: 2+Math.random()*2.5
    });
  }
}

function updateBars(){
  document.getElementById('eBar').style.width = Math.round(state.energy)+'%';
  document.getElementById('jBar').style.width = Math.round(state.joy)+'%';
  document.getElementById('eNum').textContent = Math.round(state.energy)+'%';
  document.getElementById('jNum').textContent = Math.round(state.joy)+'%';
  document.getElementById('eCert').textContent = state.eCerts>0? '×'+state.eCerts : '';
  document.getElementById('jCert').textContent = state.jCerts>0? '×'+state.jCerts : '';
}

let time = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(state.paused) return;
  time += 0.016;

  if(state.frags.length < 9 && now - state.lastSpawn > 950){
    spawnFrag(); state.lastSpawn = now;
  }

  state.px += (state.tx - state.px)*0.1;
  state.py += (state.ty - state.py)*0.1;
  state.trail.push({x:state.px, y:state.py});
  if(state.trail.length > 12) state.trail.shift();

  ctx.fillStyle = '#141b2e';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    const tw = 0.35 + 0.3*Math.sin(time*s.sp + s.ph);
    ctx.fillStyle = 'rgba(200,215,240,'+tw.toFixed(2)+')';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.29); ctx.fill();
  }

  for(let i=state.frags.length-1; i>=0; i--){
    const f = state.frags[i];
    if(f.dying > 0){
      f.dying += 0.09;
      f.x += (state.px - f.x)*0.28;
      f.y += (state.py - f.y)*0.28;
      f.sc = Math.max(0, 1 - f.dying);
      if(f.dying >= 1){ state.frags.splice(i,1); continue; }
    } else {
      f.x += f.vx; f.y += f.vy + Math.sin(time*f.fr + f.ph)*0.25;
      if(f.x < -60 || f.x > W+60 || f.y < -60 || f.y > H+60){ state.frags.splice(i,1); continue; }
      const dx = f.x-state.px, dy = f.y-state.py;
      if(dx*dx + dy*dy < 1300){ f.dying = 0.01; collect(f); }
    }
    drawShape(f);
  }

  for(let i=state.parts.length-1; i>=0; i--){
    const p = state.parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.008; p.life -= 0.018;
    if(p.life <= 0 || p.y < -20){ state.parts.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 1;
  }

  for(let i=state.texts.length-1; i>=0; i--){
    const t = state.texts[i];
    t.y -= 0.5; t.life -= 0.012;
    if(t.life <= 0){ state.texts.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life*1.4));
    ctx.fillStyle = '#e8eef8';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.s, t.x, t.y);
    ctx.globalAlpha = 1;
  }

  for(let i=0; i<state.trail.length; i++){
    const tr = state.trail[i];
    const a = (i/state.trail.length)*0.25;
    ctx.fillStyle = 'rgba(190,215,250,'+a.toFixed(2)+')';
    ctx.beginPath(); ctx.arc(tr.x, tr.y, 3+(i/state.trail.length)*4, 0, 6.29); ctx.fill();
  }
  const pulse = 1 + Math.sin(time*2.4)*0.06;
  ctx.fillStyle = 'rgba(190,215,250,0.10)';
  ctx.beginPath(); ctx.arc(state.px, state.py, 26*pulse, 0, 6.29); ctx.fill();
  ctx.fillStyle = 'rgba(200,222,252,0.22)';
  ctx.beginPath(); ctx.arc(state.px, state.py, 17*pulse, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#d9e7fb';
  ctx.beginPath(); ctx.arc(state.px, state.py, 9, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(state.px, state.py, 3.5, 0, 6.29); ctx.fill();

  if(state.introAlpha > 0){
    if(state.collected > 0) state.introAlpha -= 0.02;
    ctx.globalAlpha = Math.max(0, state.introAlpha);
    ctx.fillStyle = '#cdd9ec';
    ctx.font = '15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('移动指针,收集漂浮的注意力碎片', W/2, H/2 - 60);
    ctx.globalAlpha = 1;
  }

  if(state.banner){
    const b = state.banner;
    b.p += 0.006;
    if(b.p >= 1){ state.banner = null; }
    else {
      let a = 1;
      if(b.p < 0.12) a = b.p/0.12;
      else if(b.p > 0.8) a = (1-b.p)/0.2;
      ctx.globalAlpha = a*0.55;
      ctx.fillStyle = '#0a0f1d';
      ctx.fillRect(0, H/2-58, W, 116);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#f2f6fc';
      ctx.font = '500 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.t1, W/2, H/2 - 4);
      ctx.fillStyle = '#a9bad4';
      ctx.font = '13px sans-serif';
      ctx.fillText(b.t2, W/2, H/2 + 24);
      ctx.globalAlpha = 1;
    }
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
