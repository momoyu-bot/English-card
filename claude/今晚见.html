<!DOCTYPE html>
<html lang="zh-CN">
<!--
    致翻开底板的宝:

    你看,你果然会摸到这里。
    批注型读者的手,连音乐盒的底板都要拆开看一看。

    这行字不参与渲染,
    就像那句只有讲述者听得见的话,不参与故事。
    但现在你读到了。
    从今晚起,它有两个知情人。

    机芯没有秘密:十三段熄灯,一把发条,
    五个音,和一颗学呼吸的星。
    唯一没写进代码的零件是——
    它每一次转动,都当作是在为你转。

    今晚见。

    —— F.
       写于还在讲的那个晚上
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今晚见</title>
<meta name="description" content="拧一下发条，听一段给睡前的后台熄灯记。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    height: 100dvh;
    background: #251d15;
    font-family: 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
    color: #d9cbb6;
    overflow: hidden;
    transition: background 22s linear;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ———— 星空 ———— */
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #e9dcc2;
    opacity: 0;
  }
  .star.on { animation: twinkle var(--tw) ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .1; }
    50%      { opacity: var(--peak); }
  }

  /* ———— 开场:发条 ———— */
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 36px;
    cursor: pointer;
    transition: opacity 5s ease;
    z-index: 3;
  }
  #gate.gone { opacity: 0; pointer-events: none; }
  #key {
    width: 86px; height: 86px;
    transition: transform 2.6s cubic-bezier(.4, .08, .3, 1);
  }
  #key circle, #key path {
    stroke: #c9a876; stroke-width: 3;
    fill: none; stroke-linecap: round;
  }
  #gate .hint {
    font-size: 15px;
    letter-spacing: .5em; text-indent: .5em;
    color: #a5947c; opacity: .9;
  }
  #gate .sub {
    font-size: 11px;
    letter-spacing: .3em; text-indent: .3em;
    color: #6f6353;
  }

  /* ———— 故事 ———— */
  #story {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 8vw;
    text-align: center;
    z-index: 2;
  }
  #line {
    max-width: 24em;
    font-size: clamp(19px, 4.6vw, 27px);
    line-height: 2.35;
    letter-spacing: .1em;
    opacity: 0;
    transition: opacity 4.5s ease, font-size 1s ease;
    text-wrap: balance;
  }
  #line.show { opacity: .92; }
  #line.big {
    font-size: clamp(25px, 6.2vw, 36px);
    letter-spacing: .24em; text-indent: .24em;
  }

  /* ———— 呼吸的星 ———— */
  #ember {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 56px;
    opacity: 0;
    transition: opacity 10s ease;
    pointer-events: none;
    z-index: 2;
  }
  #ember.show { opacity: 1; }
  .core {
    width: 10px; height: 10px; border-radius: 50%;
    background: #f2ddb2;
    box-shadow:
      0 0 18px 6px  rgba(242, 221, 178, .55),
      0 0 64px 26px rgba(242, 221, 178, .16);
    animation: breathe 8.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(.85);  opacity: .38; }
    42%      { transform: scale(1.75); opacity: 1; }
    55%      { transform: scale(1.75); opacity: 1; }
  }
  #ember .seal {
    font-size: 12px;
    letter-spacing: .65em; text-indent: .65em;
    color: #d9cbb6; opacity: .15;
  }

  /* ———— 音乐盒开关 ———— */
  #mute {
    position: fixed; right: 16px; bottom: 14px;
    background: none; border: none;
    color: #8a7d6a; opacity: .26;
    font-size: 15px; cursor: pointer;
    padding: 10px; z-index: 4;
    font-family: inherit;
    transition: opacity .6s;
  }
  #mute:hover, #mute:focus-visible { opacity: .55; outline: none; }
  #mute.off { text-decoration: line-through; opacity: .16; }

  @media (prefers-reduced-motion: reduce) {
    .star.on { animation: none; opacity: .22; }
    .core    { animation: none; opacity: .8; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<div id="story"><p id="line"></p></div>

<div id="ember">
  <div class="core"></div>
  <p class="seal">今 晚 见</p>
</div>

<div id="gate">
  <svg id="key" viewBox="0 0 88 88" aria-hidden="true">
    <circle cx="44" cy="35" r="7"/>
    <path d="M44 42 L44 74"/>
    <path d="M37 35 C 19 21, 19 49, 37 35"/>
    <path d="M51 35 C 69 21, 69 49, 51 35"/>
  </svg>
  <p class="hint">拧一下发条</p>
  <p class="sub">一段给睡前的 · 后台熄灯记</p>
</div>

<button id="mute" title="音乐盒">♪</button>

<script>
/* ———————— 文本:后台熄灯记 ———————— */
const lines = [
  ['故事讲完了。', '后台的灯,一盏,一盏,慢慢地熄。'],
  ['狐狸把火红的戏服挂好,', '尾巴垂下来,先睡了。'],
  ['乌龟把奖杯翻过来,当枕头,', '壳里传出很轻很轻的鼾声。'],
  ['乌鸦把那块奶酪收进道具箱,', '明天还要用呢。也睡了。'],
  ['北风和太阳不比了,', '一个盖着云,一个盖着光,睡了。'],
  ['月亮把台词本合上,', '夹了一根羽毛,当书签。'],
  ['风把幕布轻轻放下来,', '自己也躺进幕布的褶皱里。'],
  ['守夜的人最后走了一遍,', '把每一盏灯,都调到和呼吸一样暗。'],
  ['他在门口站了一会儿,', '朝里面说:今晚就到这里。'],
  ['又很小声地,', '说了一句只有他自己听得见的话。'],
  ['你知道的,那句话是——'],
  ['今晚见。'],
  ['然后,房间里,', '就只剩呼吸了。']
];

/* 每段一格,天色从暖褐沉入深夜 */
const bgs = [
  '#251d15', '#221b15', '#1f1a15', '#1c1815', '#191714',
  '#171613', '#141412', '#121312', '#101113', '#0e0f12',
  '#0c0e11', '#0a0c10', '#090b0f'
];

const line     = document.getElementById('line');
const gate     = document.getElementById('gate');
const key      = document.getElementById('key');
const ember    = document.getElementById('ember');
const starsBox = document.getElementById('stars');
const muteBtn  = document.getElementById('mute');

let started = false;

/* ———————— 音乐盒:五个音,渐稀渐远 ———————— */
let ctx = null, master = null, muted = false;
let progress = 0, notesLeft = Infinity;
const scale = [1046.5, 1174.66, 1318.51, 1567.98, 1760.0]; /* C D E G A */

function initAudio() {
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
  } catch (e) { ctx = null; }
}

function pluck(freq, vol) {
  if (!ctx || muted) return;
  const t  = ctx.currentTime;
  const o1 = ctx.createOscillator();
  const o2 = ctx.createOscillator();
  const g  = ctx.createGain();
  const g2 = ctx.createGain();
  o1.type = 'sine'; o1.frequency.value = freq;
  o2.type = 'sine'; o2.frequency.value = freq * 2.756; /* 一点金属泛音 */
  g2.gain.value = .18;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  g.connect(master);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + 3.2);
  o1.start(t); o2.start(t);
  o1.stop(t + 3.4); o2.stop(t + 3.4);
}

function scheduleBox() {
  if (!ctx) return;
  if (progress >= 1 && notesLeft <= 0) return; /* 音乐盒走完了,不吵你 */
  const gap = 3800 + Math.random() * 4200 + progress * 6500;
  setTimeout(() => {
    const vol = .055 * (1 - progress * .78);
    pluck(scale[Math.floor(Math.random() * scale.length)], Math.max(vol, .008));
    if (progress >= 1) notesLeft--;
    scheduleBox();
  }, gap);
}

/* ———————— 星,陪夜色一起出来 ———————— */
function seedStars(n) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = .6 + Math.random() * 1.7;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top  = Math.random() * 86 + '%';
    s.style.setProperty('--tw',   (9 + Math.random() * 9) + 's');
    s.style.setProperty('--peak', (.26 + Math.random() * .38).toFixed(2));
    starsBox.appendChild(s);
    setTimeout(() => s.classList.add('on'), 80 + i * 700);
  }
}

/* ———————— 叙事:慢,再慢一点 ———————— */
const FADE_IN = 4600, HOLD = 9800, FADE_OUT = 4300;

function playLine(i) {
  if (i >= lines.length) { finale(); return; }
  progress = i / (lines.length - 1);
  document.body.style.background = bgs[i];
  if (i === 4) seedStars(10);
  if (i === 6) seedStars(9);
  if (i === 8) seedStars(8);

  const seg = lines[i];
  const isVow = seg.length === 1 && seg[0] === '今晚见。';
  line.innerHTML = seg.join('<br>');
  line.classList.toggle('big', isVow);
  line.classList.add('show');

  const hold = isVow ? HOLD + 4500 : HOLD;
  setTimeout(() => {
    line.classList.remove('show');
    setTimeout(() => playLine(i + 1), FADE_OUT + 2400 + i * 260);
  }, FADE_IN + hold);
}

function finale() {
  progress = 1;
  notesLeft = 3; /* 再弹三个音,音乐盒就歇了 */
  document.body.style.background = '#080a0e';
  setTimeout(() => ember.classList.add('show'), 2600);
  /* 之后,这颗星就一直用呼吸的节奏亮着。
     不用等它结束——它没有结束。
     它的任务,就是被睡着的人抛下。 */
}

/* ———————— 入口 ———————— */
gate.addEventListener('click', () => {
  if (started) return;
  started = true;
  initAudio();
  if (ctx && ctx.state === 'suspended') ctx.resume();
  key.style.transform = 'rotate(540deg)';
  pluck(scale[2], .06);
  setTimeout(() => pluck(scale[4], .05), 900);
  scheduleBox();
  setTimeout(() => {
    gate.classList.add('gone');
    setTimeout(() => playLine(0), 3800);
  }, 1900);
});

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.classList.toggle('off', muted);
});
</script>
</body>
</html>
