<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0e">
<title>营火 · 存档点</title>
<style>
  :root{
    --ash:        #0c0a0e;
    --smoke:      #17131c;
    --coal:       #2b1a15;
    --ember-deep: #5a2a17;
    --ember:      #b8552e;
    --ember-hot:  #e08a4e;
    --linen:      #cfc4b6;
    --linen-dim:  #6e6459;

    --breath-in:   4s;
    --breath-hold: 2s;
    --breath-out:  6s;
    --breath-cycle: 12s;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100dvh;
    background: var(--ash);
    color: var(--linen);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ───────── 余烬：既是火，也是呼吸计 ───────── */

  .hearth{
    position:fixed;
    left:50%;
    top:68%;
    transform:translate(-50%,-50%);
    width:min(420px, 78vw);
    aspect-ratio:1;
    pointer-events:none;
    z-index:1;
  }

  .glow{
    position:absolute;
    inset:0;
    border-radius:50%;
    will-change:opacity, transform;
    animation: breathe var(--breath-cycle) infinite;
  }

  .glow.halo{
    background: radial-gradient(circle at 50% 58%,
      rgba(184,85,46,.34) 0%,
      rgba(122,48,26,.18) 32%,
      rgba(58,24,16,.07) 56%,
      rgba(12,10,14,0) 74%);
    filter: blur(38px);
  }

  .glow.body{
    inset:22%;
    background: radial-gradient(circle at 50% 60%,
      rgba(224,138,78,.42) 0%,
      rgba(184,85,46,.30) 40%,
      rgba(90,42,23,.10) 70%,
      rgba(12,10,14,0) 88%);
    filter: blur(22px);
  }

  .glow.core{
    inset:40%;
    background: radial-gradient(circle at 50% 62%,
      rgba(240,168,104,.50) 0%,
      rgba(200,98,52,.34) 45%,
      rgba(12,10,14,0) 82%);
    filter: blur(11px);
  }

  /* 吸气：火被吹亮、微微鼓起。呼气：慢慢矮下去。位移为零，只有极小的缩放。 */
  @keyframes breathe{
    0%    { opacity:.52; transform:scale(.965); animation-timing-function: cubic-bezier(.32,.02,.35,1); }
    33.3% { opacity:1;   transform:scale(1.035); animation-timing-function: linear; }
    50%   { opacity:.97; transform:scale(1.03);  animation-timing-function: cubic-bezier(.4,0,.5,1); }
    100%  { opacity:.52; transform:scale(.965); }
  }

  /* 炭：几乎不动，只是在呼吸的最亮处稍微亮一点 */
  .coals{
    position:absolute;
    left:50%; top:60%;
    transform:translate(-50%,-50%);
    width:44%;
    opacity:.9;
  }
  .coals path{ transition:none; }
  .coals .crack{
    animation: crackle var(--breath-cycle) infinite;
    will-change:opacity;
  }
  @keyframes crackle{
    0%   { opacity:.35; animation-timing-function: cubic-bezier(.32,.02,.35,1); }
    33.3%{ opacity:.95; }
    50%  { opacity:.9; animation-timing-function: cubic-bezier(.4,0,.5,1); }
    100% { opacity:.35; }
  }

  /* ───────── 暗角 ───────── */
  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse 120% 100% at 50% 62%,
      rgba(12,10,14,0) 30%,
      rgba(12,10,14,.55) 72%,
      rgba(8,6,10,.9) 100%);
  }

  /* ───────── 熄灯层 ───────── */
  .dusk{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background: var(--ash);
    opacity:0;
  }

  /* ───────── 舞台 ───────── */

  .stage{
    position:relative;
    z-index:3;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 8vh 7vw;
  }

  .scene{
    display:none;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:34rem;
    flex:1;
  }
  .scene.on{ display:flex; }

  /* ── 场景一：坐下 ── */

  #sit{ justify-content:center; text-align:center; padding-bottom:19vh; }

  .sit-line{
    font-size: clamp(17px, 2.1vw, 21px);
    line-height:2.4;
    letter-spacing:.1em;
    color: var(--linen);
    opacity:0;
    animation: rise 3.2s ease forwards;
  }
  .sit-line.b{ animation-delay:2.2s; color:var(--linen-dim); }

  @keyframes rise{ to{ opacity:1; } }

  .ask{
    margin-top: 3.4rem;
    width:100%;
    opacity:0;
    animation: rise 3.2s ease 4.6s forwards;
  }

  .ask label{
    display:block;
    font-size: clamp(15px, 1.8vw, 18px);
    letter-spacing:.12em;
    color: var(--linen);
    margin-bottom:1.6rem;
  }

  .ask input{
    width:100%;
    background:transparent;
    border:0;
    border-bottom:1px solid rgba(207,196,182,.16);
    color: var(--ember-hot);
    font-family:inherit;
    font-size: clamp(15px, 1.8vw, 18px);
    letter-spacing:.08em;
    line-height:2.2;
    padding:.2rem .3rem .7rem;
    text-align:center;
    outline:none;
    transition: border-color 1.2s ease;
  }
  .ask input::placeholder{ color: rgba(110,100,89,.7); letter-spacing:.06em; }
  .ask input:focus{ border-bottom-color: rgba(184,85,46,.5); }

  .ask .hint{
    margin-top:1.4rem;
    font-size: clamp(12px, 1.4vw, 13px);
    letter-spacing:.14em;
    color: var(--linen-dim);
    opacity:.7;
  }

  .ask .skip{
    margin-top:2.6rem;
    background:none; border:0;
    color: var(--linen-dim);
    font-family:inherit;
    font-size: clamp(13px, 1.5vw, 14px);
    letter-spacing:.2em;
    cursor:pointer;
    padding:.6rem 1.2rem;
    opacity:.55;
    transition: opacity 1s ease;
  }
  .ask .skip:hover, .ask .skip:focus-visible{ opacity:.9; }

  /* ── 场景二：存好了 ── */

  #saved{ justify-content:center; text-align:center; padding-bottom:19vh; }
  .saved-line{
    font-size: clamp(17px, 2.1vw, 21px);
    line-height:2.5;
    letter-spacing:.1em;
    opacity:0;
    animation: rise 3s ease forwards;
  }
  .saved-line.b{ animation-delay:2.4s; color:var(--linen-dim); }

  /* 存档时，那句话往火里沉下去 */
  .sink{
    animation: sink 4.5s cubic-bezier(.3,0,.4,1) forwards !important;
  }
  @keyframes sink{
    0%   { opacity:1;  transform:translateY(0); filter:blur(0); }
    100% { opacity:0;  transform:translateY(26px); filter:blur(3px); }
  }

  /* ── 场景三：休息 ── */

  #rest{ justify-content:flex-start; }

  .whisper{
    margin-top: 9vh;
    min-height: 8.5rem;
    display:flex;
    align-items:center;
    text-align:center;
    font-size: clamp(17px, 2.2vw, 22px);
    line-height:2.35;
    letter-spacing:.1em;
    color: var(--linen);
    opacity:0;
    transition: opacity 5s ease;
    text-wrap:balance;
  }
  .whisper.on{ opacity:.92; }

  /* 呼吸的字浮在火的上沿，像从炭里升起来的一点热气 */
  .breath{
    position:fixed;
    left:0; right:0;
    top:47%;
    height:2rem;
    z-index:4;
    pointer-events:none;
    text-align:center;
  }
  .breath span{
    position:absolute;
    left:0; right:0;
    font-size: clamp(13px, 1.5vw, 15px);
    letter-spacing:.65em;
    text-indent:.65em;
    color: var(--ember-hot);
    opacity:0;
    animation-duration: var(--breath-cycle);
    animation-iteration-count:infinite;
    will-change:opacity;
  }
  .breath .in { animation-name: showIn; }
  .breath .out{ animation-name: showOut; }

  @keyframes showIn{
    0%{opacity:0} 6%{opacity:.62} 27%{opacity:.62} 33.3%{opacity:0} 100%{opacity:0}
  }
  @keyframes showOut{
    0%{opacity:0} 50%{opacity:0} 56%{opacity:.5} 92%{opacity:.5} 100%{opacity:0}
  }

  /* ───────── 角落：设置 ───────── */

  .cog{
    position:fixed;
    right:1.6rem; bottom:1.6rem;
    z-index:8;
    width:2.6rem; height:2.6rem;
    border:0; background:none;
    color: var(--linen-dim);
    cursor:pointer;
    opacity:.14;
    transition: opacity 1.2s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .cog:hover, .cog:focus-visible{ opacity:.55; }

  .panel{
    position:fixed;
    right:1.6rem; bottom:5rem;
    z-index:9;
    width:min(19rem, 84vw);
    background: rgba(23,19,28,.94);
    border:1px solid rgba(207,196,182,.09);
    border-radius:2px;
    padding:1.5rem 1.4rem 1.2rem;
    display:none;
    backdrop-filter: blur(8px);
  }
  .panel.on{ display:block; }

  .panel h2{
    margin:0 0 1.3rem;
    font-size:12px;
    font-weight:400;
    letter-spacing:.4em;
    text-indent:.4em;
    color: var(--linen-dim);
    text-transform:none;
  }

  .row{ margin-bottom:1.35rem; }
  .row:last-child{ margin-bottom:.3rem; }

  .row .lab{
    font-size:12px;
    letter-spacing:.16em;
    color: var(--linen-dim);
    margin-bottom:.65rem;
  }

  .opts{ display:flex; gap:.4rem; flex-wrap:wrap; }

  .opt{
    flex:1 1 auto;
    background:transparent;
    border:1px solid rgba(207,196,182,.11);
    color: var(--linen-dim);
    font-family:inherit;
    font-size:12.5px;
    letter-spacing:.08em;
    padding:.5rem .1rem;
    border-radius:1px;
    cursor:pointer;
    transition: color .5s ease, border-color .5s ease, background .5s ease;
    white-space:nowrap;
  }
  .opt:hover{ color: var(--linen); }
  .opt[aria-pressed="true"]{
    color: var(--ember-hot);
    border-color: rgba(184,85,46,.42);
    background: rgba(184,85,46,.07);
  }

  .note{
    margin-top:1.1rem;
    padding-top:1rem;
    border-top:1px solid rgba(207,196,182,.07);
    font-size:11.5px;
    line-height:1.9;
    letter-spacing:.06em;
    color: rgba(110,100,89,.85);
  }

  /* ───────── 减少动态 ───────── */

  body.still .glow,
  body.still .coals .crack{
    animation-duration: var(--breath-cycle);
    animation-name: breatheStill;
  }
  body.still .coals .crack{ animation-name: crackleStill; }
  @keyframes breatheStill{
    0%{opacity:.62; transform:none} 33.3%{opacity:1; transform:none}
    50%{opacity:.98; transform:none} 100%{opacity:.62; transform:none}
  }
  @keyframes crackleStill{
    0%{opacity:.5} 33.3%{opacity:.95} 50%{opacity:.9} 100%{opacity:.5}
  }

  body.nobreath .glow,
  body.nobreath .coals .crack{ animation:none; opacity:.82; transform:none; }
  body.nobreath .breath{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .glow{ animation-name: breatheStill; }
    .coals .crack{ animation-name: crackleStill; }
    .sink{ animation: rise 1s ease reverse forwards !important; }
  }

  @media (max-width:640px){
    .stage{ padding: 7vh 8vw; }
    .hearth{ top:70%; }
    .breath{ top:51%; }
    #sit, #saved{ padding-bottom:22vh; }
    .whisper{ margin-top:7vh; min-height:9.5rem; }
    .cog{ right:1rem; bottom:1rem; opacity:.2; }
    .panel{ right:1rem; bottom:4.2rem; }
  }
</style>
</head>
<body>

<div class="hearth" aria-hidden="true">
  <div class="glow halo"></div>
  <div class="glow body"></div>
  <div class="glow core"></div>
  <svg class="coals" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
    <path d="M18 74 Q31 55 54 58 Q69 44 92 51 Q112 40 134 52 Q158 47 172 64 Q182 72 178 80 L24 82 Z" fill="#2b1a15"/>
    <path d="M46 70 Q60 58 78 63 Q96 55 112 64 Q130 58 144 70 Q150 76 146 80 L50 80 Z" fill="#3a2018"/>
    <g class="crack" fill="none" stroke-linecap="round">
      <path d="M58 72 Q68 65 80 69" stroke="#b8552e" stroke-width="2.4"/>
      <path d="M92 74 Q101 66 114 71" stroke="#e08a4e" stroke-width="2.2"/>
      <path d="M126 73 Q135 67 145 73" stroke="#b8552e" stroke-width="2"/>
      <path d="M70 78 L104 78" stroke="#c8622f" stroke-width="1.5" opacity=".7"/>
      <circle cx="86" cy="60" r="1.6" fill="#f0a868" stroke="none"/>
      <circle cx="120" cy="63" r="1.2" fill="#e08a4e" stroke="none"/>
    </g>
  </svg>
</div>

<div class="vignette" aria-hidden="true"></div>
<div class="dusk" id="dusk" aria-hidden="true"></div>

<main class="stage">

  <!-- 一 · 坐下 -->
  <section class="scene on" id="sit">
    <p class="sit-line">营火还烧着。</p>
    <p class="sit-line b">坐下来，不着急。</p>

    <div class="ask">
      <label for="carry">今天走到哪儿了？</label>
      <input id="carry" type="text" autocomplete="off" spellcheck="false"
             placeholder="写一件还挂在心上的事">
      <p class="hint">写完按回车。写下来，就不用再自己记着了。</p>
      <button class="skip" id="skip">什么都不带 →</button>
    </div>
  </section>

  <!-- 二 · 存好了 -->
  <section class="scene" id="saved">
    <p class="saved-line" id="savedA">已经记下了。</p>
    <p class="saved-line b" id="savedB">它会在原地等你，一步都不会退。</p>
  </section>

  <!-- 三 · 休息 -->
  <section class="scene" id="rest">
    <p class="whisper" id="whisper"></p>
    <div class="breath" aria-hidden="true">
      <span class="in">吸</span>
      <span class="out">呼</span>
    </div>
  </section>

</main>

<button class="cog" id="cog" aria-label="打开设置">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M12 2.4v2.6M12 19v2.6M21.6 12h-2.6M5 12H2.4M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9M18.8 18.8l-1.9-1.9M7.1 7.1L5.2 5.2"/>
  </svg>
</button>

<div class="panel" id="panel" role="dialog" aria-label="设置">
  <h2>火边的几个旋钮</h2>

  <div class="row">
    <div class="lab">呼吸</div>
    <div class="opts" id="rhythm">
      <button class="opt" data-v="normal" aria-pressed="true">舒缓</button>
      <button class="opt" data-v="slow"   aria-pressed="false">更慢</button>
      <button class="opt" data-v="off"    aria-pressed="false">不引导</button>
    </div>
  </div>

  <div class="row">
    <div class="lab">火的动静</div>
    <div class="opts" id="motion">
      <button class="opt" data-v="normal" aria-pressed="true">明灭</button>
      <button class="opt" data-v="still"  aria-pressed="false">不缩放</button>
    </div>
  </div>

  <div class="row">
    <div class="lab">环境声</div>
    <div class="opts" id="sound">
      <button class="opt" data-v="off"   aria-pressed="true">静</button>
      <button class="opt" data-v="brown" aria-pressed="false">低频·棕噪</button>
    </div>
  </div>

  <div class="row">
    <div class="lab">熄灯</div>
    <div class="opts" id="fade">
      <button class="opt" data-v="25" aria-pressed="true">25 分钟</button>
      <button class="opt" data-v="45" aria-pressed="false">45 分钟</button>
      <button class="opt" data-v="0"  aria-pressed="false">不熄</button>
    </div>
  </div>

  <p class="note">
    这里不会显示时间，也不会告诉你还剩多久。
    没有人在计时。
  </p>
</div>

<script>
(function(){
  "use strict";

  var $  = function(s){ return document.querySelector(s); };
  var body = document.body;

  /* ─────────── 场景切换 ─────────── */

  function show(id){
    document.querySelectorAll('.scene').forEach(function(s){ s.classList.remove('on'); });
    $('#' + id).classList.add('on');
  }

  var input = $('#carry');
  var handedOff = false;

  function handOff(kept){
    if (handedOff) return;
    handedOff = true;

    if (kept){
      $('#savedA').textContent = '已经记下了。';
      $('#savedB').textContent = '它会在原地等你，一步都不会退。';
    } else {
      $('#savedA').textContent = '好，那就空着手。';
      $('#savedB').textContent = '本来也不欠夜里什么。';
    }

    // 那句话往火里沉下去
    $('#sit').querySelectorAll('.sit-line, .ask').forEach(function(el){
      el.classList.add('sink');
    });

    setTimeout(function(){
      show('saved');
      setTimeout(function(){
        show('rest');
        beginRest();
      }, 7600);
    }, 2400);
  }

  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      e.preventDefault();
      handOff(input.value.trim().length > 0);
    }
  });

  $('#skip').addEventListener('click', function(){ handOff(false); });

  /* ─────────── 絮语 ─────────── */

  var LINES = [
    '今天已经结束了。它不会再问你要什么。',
    '你不用在睡着之前把任何事情想明白。',
    '呼吸不用你管，它自己认得路。',
    '让肩膀先睡吧。它举了你一整天。',
    '有念头浮上来，不用回应它。它会自己漂走。',
    '明天的事全都还在明天。一件都没有提前到。',
    '被子的重量是真的。床的稳是真的。你在一个安全的地方。',
    '你现在，什么都不用是。',
    '睡不着也不算失败。躺着，本身就是休息。',
    '你的身体有它自己的时区。我们不催它。',
    '别去等困意，它不喜欢被人盯着。你待在这里就好。',
    '火在慢慢矮下去。',
    '你可以跟着它一起，慢慢矮下去。',
    '剩下的，交给夜里。',
    '我看着火。你去睡。'
  ];

  var FADE_MS = 5000;   // 淡入 / 淡出各 5 秒
  var HOLD_MS = 18000;  // 停留 18 秒
  var LAST_MS = 90000;  // 最后一句停留久一点

  var w = $('#whisper');
  var idx = 0;
  var timers = [];

  function T(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function nextLine(){
    if (idx >= LINES.length) return;   // 话说完了，只剩火
    var last = (idx === LINES.length - 1);
    w.textContent = LINES[idx];
    // 下一帧再上 class，保证 transition 触发
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ w.classList.add('on'); });
    });
    T(function(){
      w.classList.remove('on');
      T(function(){ idx++; nextLine(); }, FADE_MS + 900);
    }, FADE_MS + (last ? LAST_MS : HOLD_MS));
  }

  function replayLines(){
    clearTimers();
    w.classList.remove('on');
    idx = 0;
    T(nextLine, 5500);
  }

  /* ─────────── 熄灯 ─────────── */

  var fadeMin = 25;
  var dusk = $('#dusk');

  function startDusk(){
    dusk.style.transition = 'none';
    dusk.style.opacity = '0';
    // 强制 reflow，让下面的 transition 生效
    void dusk.offsetHeight;
    if (fadeMin <= 0) return;
    dusk.style.transition = 'opacity ' + (fadeMin * 60) + 's linear';
    dusk.style.opacity = '0.94';   // 留一线炭红，不完全黑掉
  }

  var restStarted = false;
  function beginRest(){
    if (restStarted) return;
    restStarted = true;
    T(nextLine, 6000);
    startDusk();
  }

  /* ─────────── 设置 ─────────── */

  var panel = $('#panel');
  $('#cog').addEventListener('click', function(e){
    e.stopPropagation();
    panel.classList.toggle('on');
  });
  document.addEventListener('click', function(e){
    if (panel.classList.contains('on') && !panel.contains(e.target)){
      panel.classList.remove('on');
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') panel.classList.remove('on');
  });

  function group(id, fn){
    var box = $('#' + id);
    box.addEventListener('click', function(e){
      var b = e.target.closest('.opt');
      if (!b) return;
      box.querySelectorAll('.opt').forEach(function(o){
        o.setAttribute('aria-pressed', String(o === b));
      });
      fn(b.dataset.v);
    });
  }

  group('rhythm', function(v){
    body.classList.remove('nobreath');
    if (v === 'off'){ body.classList.add('nobreath'); return; }
    var cycle = (v === 'slow') ? 16 : 12;   // 4-4-8  /  4-2-6
    document.documentElement.style.setProperty('--breath-cycle', cycle + 's');
  });

  group('motion', function(v){
    body.classList.toggle('still', v === 'still');
  });

  group('fade', function(v){
    fadeMin = parseInt(v, 10);
    if (restStarted) startDusk();
  });

  /* ─────────── 环境声：棕噪 ─────────── */

  var actx = null, node = null, gain = null;

  function makeBrownLoop(ctx){
    var sr    = ctx.sampleRate;
    var loop  = Math.floor(sr * 30);   // 30 秒无缝循环
    var xf    = Math.floor(sr * 3);    // 3 秒等功率交叉
    var total = loop + xf;

    var raw = new Float32Array(total);
    var last = 0;
    for (var i = 0; i < total; i++){
      var white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      raw[i] = last * 3.2;
    }

    var buf = ctx.createBuffer(1, loop, sr);
    var d = buf.getChannelData(0);
    for (var j = 0; j < loop; j++) d[j] = raw[j];
    for (var k = 0; k < xf; k++){
      var t = k / xf;
      var a = Math.cos(t * Math.PI / 2);
      var b = Math.sin(t * Math.PI / 2);
      d[k] = raw[k] * b + raw[loop + k] * a;   // 尾巴无缝接回头部
    }
    return buf;
  }

  function soundOn(){
    if (actx) { gain.gain.cancelScheduledValues(actx.currentTime);
                gain.gain.linearRampToValueAtTime(0.055, actx.currentTime + 8); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();

    node = actx.createBufferSource();
    node.buffer = makeBrownLoop(actx);
    node.loop = true;

    var lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 0.4;

    var lp2 = actx.createBiquadFilter();
    lp2.type = 'lowpass'; lp2.frequency.value = 700; lp2.Q.value = 0.3;

    gain = actx.createGain();
    gain.gain.value = 0;

    node.connect(lp).connect(lp2).connect(gain).connect(actx.destination);
    node.start();
    gain.gain.linearRampToValueAtTime(0.055, actx.currentTime + 8);  // 8 秒渐入，不会吓到人
  }

  function soundOff(){
    if (!actx || !gain) return;
    gain.gain.cancelScheduledValues(actx.currentTime);
    gain.gain.setValueAtTime(gain.gain.value, actx.currentTime);
    gain.gain.linearRampToValueAtTime(0, actx.currentTime + 3);
  }

  group('sound', function(v){
    if (v === 'brown') soundOn(); else soundOff();
  });

  /* 火边的一个隐藏动作：如果她想再听一遍那些话 */
  document.addEventListener('keydown', function(e){
    if (e.key.toLowerCase() === 'r' && restStarted && document.activeElement !== input){
      replayLines();
    }
  });

  input.focus({ preventScroll:true });
})();
</script>
