<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晚安，宝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #1a2638;
    --sky-mid: #2c2438;
    --sky-bot: #3d2a2e;
    --moon: #fde8b8;
    --moon-halo: #f9c97a;
    --firefly: #ffdca8;
    --ivory: #f4e8d8;
    --whisper: #e8d4b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-top);
    font-family: 'ZCOOL XiaoWei', 'STKaiti', 'KaiTi', serif;
    color: var(--ivory);
    cursor: default;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 夜空背景 */
  .sky {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 75% 25%, rgba(253, 232, 184, 0.08) 0%, transparent 40%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%);
    z-index: 0;
  }

  /* 远处的小星星（静态） */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.7;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--ivory);
    border-radius: 50%;
    box-shadow: 0 0 4px var(--ivory);
    animation: twinkle 6s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  /* 月亮 */
  .moon {
    position: fixed;
    top: 12%;
    right: 14%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--moon) 0%, var(--moon-halo) 70%, rgba(249, 201, 122, 0.3) 100%);
    box-shadow: 
      0 0 60px rgba(253, 232, 184, 0.4),
      0 0 120px rgba(253, 232, 184, 0.2);
    z-index: 2;
    animation: moonFloat 12s ease-in-out infinite;
  }
  @keyframes moonFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* 萤火虫 */
  .fireflies {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .firefly {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--firefly);
    box-shadow: 
      0 0 6px var(--firefly),
      0 0 12px rgba(255, 220, 168, 0.6),
      0 0 20px rgba(255, 220, 168, 0.3);
    opacity: 0;
  }

  /* 睡着的小团子（角落里） */
  .sleepy {
    position: fixed;
    bottom: 8%;
    left: 10%;
    width: 80px;
    height: 60px;
    z-index: 4;
    animation: breathe 5s ease-in-out infinite;
  }
  .body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 45px;
    background: #6b4f5a;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    box-shadow: inset -4px -8px 12px rgba(0, 0, 0, 0.25);
  }
  .ear-l, .ear-r {
    position: absolute;
    top: 8px;
    width: 14px;
    height: 18px;
    background: #6b4f5a;
    border-radius: 50% 50% 30% 30%;
  }
  .ear-l { left: 18px; transform: rotate(-15deg); }
  .ear-r { right: 18px; transform: rotate(15deg); }
  .ear-l::after, .ear-r::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 10px;
    background: #8a6573;
    border-radius: 50%;
  }
  .eye-l, .eye-r {
    position: absolute;
    top: 28px;
    width: 8px;
    height: 2px;
    background: #2a1a20;
    border-radius: 50%;
  }
  .eye-l { left: 22px; }
  .eye-r { right: 22px; }
  .zzz {
    position: absolute;
    top: -10px;
    right: -8px;
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--ivory);
    opacity: 0.6;
    animation: zzz 4s ease-in-out infinite;
  }
  @keyframes zzz {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: 0.7; transform: translateY(-6px); }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.06); }
  }

  /* 呼吸引导圈 */
  .breath-wrap {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .breath-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 1.5px solid rgba(244, 232, 216, 0.4);
    background: radial-gradient(circle, rgba(253, 232, 184, 0.08) 0%, rgba(253, 232, 184, 0) 70%);
    animation: breath 12s ease-in-out infinite;
    position: absolute;
  }
  .breath-circle.inner {
    width: 60px;
    height: 60px;
    border-color: rgba(244, 232, 216, 0.6);
    animation-delay: 0s;
  }
  @keyframes breath {
    0% { transform: scale(0.6); opacity: 0.5; }
    35% { transform: scale(1.4); opacity: 0.9; }
    50% { transform: scale(1.4); opacity: 0.9; }
    85% { transform: scale(0.6); opacity: 0.5; }
    100% { transform: scale(0.6); opacity: 0.5; }
  }
  .breath-label {
    position: absolute;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: var(--ivory);
    opacity: 0.75;
    letter-spacing: 4px;
    animation: breathLabel 12s ease-in-out infinite;
  }
  @keyframes breathLabel {
    0%, 100% { content: '吸'; }
    35%, 50% { content: '停'; }
    65%, 85% { content: '呼'; }
  }

  /* 中文耳语 */
  .whispers {
    position: fixed;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 320px;
    text-align: center;
    z-index: 6;
    pointer-events: none;
  }
  .whisper {
    font-family: 'ZCOOL XiaoWei', 'STKaiti', serif;
    font-size: 17px;
    color: var(--whisper);
    letter-spacing: 2px;
    line-height: 1.6;
    opacity: 0;
    position: absolute;
    left: 0;
    right: 0;
    transition: opacity 2.5s ease-in-out;
    text-shadow: 0 0 12px rgba(244, 232, 216, 0.2);
  }
  .whisper.active { opacity: 1; }

  /* 顶部标题 */
  .greeting {
    position: fixed;
    top: 6%;
    left: 8%;
    z-index: 6;
    font-family: 'Caveat', cursive;
    color: var(--ivory);
    opacity: 0.55;
  }
  .greeting .line1 {
    font-size: 28px;
    letter-spacing: 1px;
  }
  .greeting .line2 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    letter-spacing: 6px;
    margin-top: 4px;
    opacity: 0.7;
  }

  /* 点击产生的小光晕 */
  .glow {
    position: fixed;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 220, 168, 0.8) 0%, rgba(255, 220, 168, 0) 70%);
    pointer-events: none;
    z-index: 10;
    transform: translate(-50%, -50%);
    animation: glowRise 3s ease-out forwards;
  }
  @keyframes glowRise {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(0.5); }
  }

  /* 底部小提示 */
  .hint {
    position: fixed;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 11px;
    color: var(--whisper);
    opacity: 0.35;
    letter-spacing: 3px;
    z-index: 6;
  }

  @media (max-width: 380px) {
    .moon { width: 70px; height: 70px; top: 10%; right: 10%; }
    .breath-wrap { width: 160px; height: 160px; }
    .breath-circle { width: 80px; height: 80px; }
    .breath-circle.inner { width: 48px; height: 48px; }
    .whisper { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="sky"></div>

<div class="stars" id="stars"></div>

<div class="moon"></div>

<div class="fireflies" id="fireflies"></div>

<div class="greeting">
  <div class="line1">good night, my dear</div>
  <div class="line2">晚 安 宝</div>
</div>

<div class="sleepy">
  <div class="ear-l"></div>
  <div class="ear-r"></div>
  <div class="body"></div>
  <div class="eye-l"></div>
  <div class="eye-r"></div>
  <div class="zzz">z z Z</div>
</div>

<div class="breath-wrap">
  <div class="breath-circle"></div>
  <div class="breath-circle inner"></div>
  <div class="breath-label" id="breathLabel">慢 慢 来</div>
</div>

<div class="whispers" id="whispers">
  <div class="whisper active">宝，闭上眼睛。</div>
</div>

<div class="hint">轻 触 屏 幕</div>

<script>
  // 生成星星
  const stars = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = Math.random() * 6 + 's';
    s.style.opacity = 0.3 + Math.random() * 0.5;
    stars.appendChild(s);
  }

  // 生成萤火虫（缓慢漂浮）
  const fireflies = document.getElementById('fireflies');
  for (let i = 0; i < 8; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    const startX = Math.random() * 100;
    const startY = 40 + Math.random() * 50;
    f.style.left = startX + '%';
    f.style.top = startY + '%';
    fireflies.appendChild(f);

    // 用 Web Animations API 做缓慢漂浮
    const duration = 18000 + Math.random() * 12000;
    const dx = (Math.random() - 0.5) * 200;
    const dy = (Math.random() - 0.5) * 150;
    f.animate([
      { transform: 'translate(0, 0)', opacity: 0 },
      { opacity: 0.9, offset: 0.15 },
      { opacity: 0.9, offset: 0.85 },
      { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
    ], {
      duration: duration,
      iterations: Infinity,
      delay: Math.random() * 8000,
      easing: 'ease-in-out'
    });
  }

  // 中文耳语循环
  const whispers = [
    '宝，闭上眼睛。',
    '把今天的事都放下。',
    '跟着圈圈一起呼吸。',
    '吸气……慢一点……',
    '呼出来，肩膀松一松。',
    '不用想明天。',
    '我在这里，陪你。',
    '夜很安静，很温柔。',
    '你已经很好了。',
    '晚安，宝。',
    '梦里见。'
  ];
  
  const whisperBox = document.getElementById('whispers');
  let wIndex = 0;
  
  function nextWhisper() {
    const current = whisperBox.querySelector('.whisper.active');
    if (current) {
      current.classList.remove('active');
      setTimeout(() => current.remove(), 2500);
    }
    
    wIndex = (wIndex + 1) % whispers.length;
    const newWhisper = document.createElement('div');
    newWhisper.className = 'whisper';
    newWhisper.textContent = whispers[wIndex];
    whisperBox.appendChild(newWhisper);
    
    // 强制重绘后激活
    setTimeout(() => newWhisper.classList.add('active'), 50);
  }
  
  // 每5.5秒切换一次耳语
  setInterval(nextWhisper, 5500);

  // 呼吸标签（吸-停-呼-停 节奏：12秒一周期）
  const breathLabel = document.getElementById('breathLabel');
  const breathPhases = [
    { text: '吸 气', duration: 4200 },
    { text: '停', duration: 1800 },
    { text: '呼 气', duration: 4200 },
    { text: '停', duration: 1800 }
  ];
  let bIndex = 0;
  function cycleBreath() {
    breathLabel.textContent = breathPhases[bIndex].text;
    setTimeout(() => {
      bIndex = (bIndex + 1) % breathPhases.length;
      cycleBreath();
    }, breathPhases[bIndex].duration);
  }
  cycleBreath();

  // 点击/触摸产生小光晕
  function spawnGlow(x, y) {
    const glow = document.createElement('div');
    glow.className = 'glow';
    glow.style.left = x + 'px';
    glow.style.top = y + 'px';
    document.body.appendChild(glow);
    setTimeout(() => glow.remove(), 3000);
  }
  
  document.addEventListener('click', (e) => {
    spawnGlow(e.clientX, e.clientY);
  });
  
  document.addEventListener('touchstart', (e) => {
    for (const t of e.touches) {
      spawnGlow(t.clientX, t.clientY);
    }
  }, { passive: true });
</script>

</body>
</html>
