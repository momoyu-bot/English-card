<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜航船 · 晚安渡口</title>
<style>
  :root{
    --night-deep:#0b1526;
    --night-mid:#0e1e33;
    --lake-far:#12263f;
    --lake-near:#16304f;
    --moonlight:#c9d6e8;
    --whisper:#aebdd4;
    --dim:#7d90ab;
    --lantern:#f2c98a;
    --lantern-glow:rgba(242,201,138,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--night-deep);
    color:var(--moonlight);
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  /* ---------- 场景 ---------- */
  .scene{position:fixed;inset:0;display:flex;flex-direction:column;}
  .sky{
    position:relative;flex:0 0 58%;
    background:linear-gradient(to bottom,#080f1d 0%,var(--night-deep) 45%,var(--night-mid) 100%);
    overflow:hidden;
  }
  .lake{
    position:relative;flex:1;
    background:linear-gradient(to bottom,var(--lake-far) 0%,var(--lake-near) 60%,#122740 100%);
    overflow:hidden;
  }
  .lake::before{ /* 岸线的一点雾 */
    content:"";position:absolute;top:-1px;left:0;right:0;height:36px;
    background:linear-gradient(to bottom,rgba(14,30,51,.9),transparent);
    pointer-events:none;
  }

  /* ---------- 星星 ---------- */
  .star{
    position:absolute;border-radius:50%;
    background:#dce8f5;
    animation:breathe var(--dur,8s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
    opacity:.3;
  }
  @keyframes breathe{
    0%,100%{opacity:.18;}
    50%{opacity:var(--peak,.75);}
  }

  /* ---------- 月亮 ---------- */
  .moon-wrap{position:absolute;top:12%;right:14%;width:72px;height:72px;}
  .moon-halo{
    position:absolute;inset:-34px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,214,232,.16) 0%,transparent 65%);
  }
  .moon{width:100%;height:100%;display:block;}

  /* ---------- 絮语 ---------- */
  .whisper-box{
    position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
    width:min(82vw,560px);text-align:center;pointer-events:none;
  }
  .whisper{
    font-size:clamp(17px,2.6vw,21px);
    line-height:2.1;letter-spacing:.14em;
    color:var(--whisper);
    opacity:0;transition:opacity 6s ease;
    text-wrap:balance;
  }
  .whisper.show{opacity:.92;}

  /* ---------- 月光倒影 ---------- */
  .moon-path{
    position:absolute;top:8%;right:calc(14% - 40px);width:150px;height:70%;
    background:
      repeating-linear-gradient(to bottom,
        rgba(201,214,232,.10) 0 2px, transparent 2px 11px);
    filter:blur(1px);
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 90%);
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 90%);
    animation:shimmer 14s ease-in-out infinite alternate;
    opacity:.55;
  }
  @keyframes shimmer{
    from{transform:translateX(0) scaleX(1);}
    to{transform:translateX(7px) scaleX(1.05);}
  }

  /* ---------- 小纸船 ---------- */
  .boat{
    position:absolute;top:14%;left:16%;width:74px;
    animation:drift 90s ease-in-out infinite alternate, bob 7s ease-in-out infinite;
    opacity:.9;
  }
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(38vw);}}
  @keyframes bob{0%,100%{margin-top:0;}50%{margin-top:5px;}}
  .boat-shadow{
    position:absolute;top:calc(14% + 30px);left:16%;width:74px;height:10px;
    background:radial-gradient(ellipse,rgba(5,12,22,.5),transparent 70%);
    animation:drift 90s ease-in-out infinite alternate;
    filter:blur(2px);
  }

  /* ---------- 河灯 ---------- */
  .lantern{
    position:absolute;bottom:26%;left:58%;
    width:14px;height:14px;border-radius:50%;
    background:var(--lantern);
    box-shadow:0 0 18px 8px var(--lantern-glow), 0 0 4px 1px rgba(242,201,138,.8);
    opacity:0;
    animation:float-away 26s ease-in forwards;
  }
  .lantern::after{ /* 灯在水里的一点倒光 */
    content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);
    width:10px;height:22px;border-radius:50%;
    background:linear-gradient(to bottom,var(--lantern-glow),transparent);
    filter:blur(3px);
  }
  @keyframes float-away{
    0%{opacity:0;transform:translate(0,0) scale(1);}
    8%{opacity:.95;}
    70%{opacity:.65;}
    100%{opacity:0;transform:translate(-42vw,-9vh) scale(.35);}
  }

  /* ---------- 呼吸圆环 ---------- */
  .breath-wrap{
    position:absolute;left:50%;bottom:31%;transform:translateX(-50%);
    display:none;flex-direction:column;align-items:center;gap:14px;
    pointer-events:none;
  }
  .breath-wrap.on{display:flex;}
  .breath-ring{
    width:88px;height:88px;border-radius:50%;
    border:1px solid rgba(201,214,232,.5);
    background:radial-gradient(circle,rgba(201,214,232,.10),transparent 70%);
    transform:scale(.72);
    transition:transform 4s ease-in-out;
  }
  .breath-hint{
    font-size:13px;letter-spacing:.5em;text-indent:.5em;
    color:var(--dim);transition:opacity 1.2s ease;
  }

  /* ---------- 河灯仪式(输入) ---------- */
  .ritual{
    position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
    width:min(78vw,420px);text-align:center;
  }
  .ritual-input{
    width:100%;background:transparent;border:none;
    border-bottom:1px solid rgba(125,144,171,.4);
    color:var(--moonlight);text-align:center;
    font-family:inherit;font-size:15px;letter-spacing:.1em;
    padding:8px 4px;outline:none;
    transition:border-color .8s ease, opacity 1.5s ease;
  }
  .ritual-input:focus{border-bottom-color:rgba(201,214,232,.7);}
  .ritual-input::placeholder{color:rgba(125,144,171,.55);}
  .ritual-btn{
    margin-top:14px;background:transparent;color:var(--dim);
    border:1px solid rgba(125,144,171,.35);border-radius:999px;
    padding:7px 22px;font-family:inherit;font-size:13px;letter-spacing:.25em;text-indent:.25em;
    cursor:pointer;transition:all .8s ease;
  }
  .ritual-btn:hover{color:var(--lantern);border-color:rgba(242,201,138,.5);}
  .ritual-btn:focus-visible{outline:1px solid var(--moonlight);outline-offset:3px;}
  .ritual-done{
    position:absolute;left:0;right:0;top:6px;
    font-size:14px;letter-spacing:.2em;color:var(--dim);
    opacity:0;transition:opacity 2.5s ease;pointer-events:none;
  }
  .ritual.sent .ritual-input,.ritual.sent .ritual-btn{opacity:0;pointer-events:none;}
  .ritual.sent .ritual-done{opacity:.85;}

  /* ---------- 控件 ---------- */
  .title{
    position:fixed;top:22px;left:22px;
    writing-mode:vertical-rl;letter-spacing:.5em;
    font-size:14px;color:rgba(125,144,171,.65);
  }
  .controls{
    position:fixed;top:22px;right:22px;display:flex;gap:10px;z-index:5;
  }
  .toggle{
    background:rgba(11,21,38,.4);color:var(--dim);
    border:1px solid rgba(125,144,171,.3);border-radius:999px;
    padding:6px 16px;font-family:inherit;font-size:12px;letter-spacing:.2em;text-indent:.2em;
    cursor:pointer;transition:all .8s ease;backdrop-filter:blur(2px);
  }
  .toggle.on{color:var(--lantern);border-color:rgba(242,201,138,.55);}
  .toggle:focus-visible{outline:1px solid var(--moonlight);outline-offset:3px;}
  .footnote{
    position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.15em;color:rgba(125,144,171,.4);
    pointer-events:none;white-space:nowrap;
  }

  /* ---------- 渐暗层 ---------- */
  .nightfall{
    position:fixed;inset:0;background:#000;opacity:0;
    pointer-events:none;z-index:9;
    transition:opacity 60s linear;
  }

  /* ---------- 动效克制 ---------- */
  @media (prefers-reduced-motion: reduce){
    .star{animation:none;opacity:.55;}
    .boat,.boat-shadow{animation:none;}
    .moon-path{animation:none;}
    .lantern{animation:none;opacity:.9;transition:opacity 8s ease;}
  }
  @media (max-width:520px){
    .moon-wrap{right:10%;width:58px;height:58px;}
    .moon-path{right:calc(10% - 46px);}
    .whisper-box{top:54%;}
    .whisper{line-height:2.2;}
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sky" id="sky">
    <div class="moon-wrap">
      <div class="moon-halo"></div>
      <svg class="moon" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M62 8a44 44 0 1 0 0 84 40 40 0 0 1 0-84z" fill="#d8e2ef" opacity="0.92"/>
      </svg>
    </div>
    <div class="whisper-box"><p class="whisper" id="whisper"></p></div>
  </div>

  <div class="lake" id="lake">
    <div class="moon-path"></div>
    <svg class="boat" viewBox="0 0 100 46" aria-hidden="true">
      <path d="M6 26 L94 26 L76 42 L24 42 Z" fill="#233b5c"/>
      <path d="M50 26 L50 4 L72 26 Z" fill="#2c4a70"/>
      <path d="M50 26 L50 10 L36 26 Z" fill="#1c3252"/>
    </svg>
    <div class="boat-shadow"></div>

    <div class="breath-wrap" id="breathWrap" aria-hidden="true">
      <div class="breath-ring" id="breathRing"></div>
      <div class="breath-hint" id="breathHint">吸</div>
    </div>

    <div class="ritual" id="ritual">
      <div class="ritual-done">已经交给湖水了,漂走了。</div>
      <input class="ritual-input" id="ritualInput" type="text" maxlength="40"
             placeholder="今天还搁在心里的一件事……" aria-label="写下一个念头,交给湖水">
      <br>
      <button class="ritual-btn" id="ritualBtn">交给湖水</button>
    </div>
  </div>
</div>

<div class="title">夜航船</div>
<div class="controls">
  <button class="toggle" id="breathToggle" aria-pressed="false">呼吸</button>
  <button class="toggle" id="soundToggle" aria-pressed="false">水声</button>
</div>
<div class="footnote">灯会慢慢变暗,陪你到睡着。</div>
<div class="nightfall" id="nightfall"></div>

<script>
(function(){
  "use strict";
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 星星 ---------- */
  const sky = document.getElementById("sky");
  const STAR_COUNT = 52;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement("div");
    s.className = "star";
    const size = (Math.random()*1.6 + 0.8).toFixed(1);
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = (Math.random()*100).toFixed(2) + "%";
    s.style.top = (Math.random()*88).toFixed(2) + "%";
    s.style.setProperty("--dur", (Math.random()*6 + 5).toFixed(1) + "s");
    s.style.setProperty("--delay", (Math.random()*9).toFixed(1) + "s");
    s.style.setProperty("--peak", (Math.random()*0.4 + 0.45).toFixed(2));
    sky.appendChild(s);
  }

  /* ---------- 絮语轮播 ---------- */
  const whispers = [
    "今天已经打烊了。没做完的事,现在归明天管,不归你管。",
    "湖水把白天的声音一句一句收走了。剩下的安静,是留给你的。",
    "不用努力睡着。睡意自己认得路,像猫认得回家的窗台。",
    "星星在很远的地方替你亮着,你可以放心把眼睛闭上。",
    "被子的重量刚刚好。这是今天最后一件刚刚好的事。",
    "夜很长,但不用你守。船会自己漂,月亮会自己值班。",
    "呼吸慢下来的时候,世界也答应跟着慢下来。",
    "此刻没有人需要你回复。你只属于这张床。",
    "白天的你已经很努力了。夜晚的你只有一个任务:什么都不做。",
    "水面很稳,梦也会很稳。晚安,宝。"
  ];
  const whisperEl = document.getElementById("whisper");
  let wi = 0;
  const HOLD = 25000, FADE = 6000;
  function showWhisper(){
    whisperEl.textContent = whispers[wi];
    whisperEl.classList.add("show");
    setTimeout(()=>{
      whisperEl.classList.remove("show");
      setTimeout(()=>{
        wi = (wi + 1) % whispers.length;
        showWhisper();
      }, FADE);
    }, HOLD);
  }
  setTimeout(showWhisper, 1800);

  /* ---------- 呼吸引导:吸4 · 停4 · 呼6 ---------- */
  const breathToggle = document.getElementById("breathToggle");
  const breathWrap = document.getElementById("breathWrap");
  const ring = document.getElementById("breathRing");
  const hint = document.getElementById("breathHint");
  let breathOn = false, breathTimer = null;

  function breathCycle(){
    if(!breathOn) return;
    hint.textContent = "吸"; hint.style.opacity = 1;
    ring.style.transition = "transform 4s ease-in-out";
    ring.style.transform = "scale(1)";
    breathTimer = setTimeout(()=>{
      if(!breathOn) return;
      hint.textContent = "停"; 
      breathTimer = setTimeout(()=>{
        if(!breathOn) return;
        hint.textContent = "呼";
        ring.style.transition = "transform 6s ease-in-out";
        ring.style.transform = "scale(.72)";
        breathTimer = setTimeout(breathCycle, 6000);
      }, 4000);
    }, 4000);
  }
  breathToggle.addEventListener("click", ()=>{
    breathOn = !breathOn;
    breathToggle.classList.toggle("on", breathOn);
    breathToggle.setAttribute("aria-pressed", String(breathOn));
    breathWrap.classList.toggle("on", breathOn);
    if(breathOn){ breathCycle(); }
    else{ clearTimeout(breathTimer); ring.style.transform = "scale(.72)"; }
  });

  /* ---------- 水声(Web Audio 生成,默认关闭) ---------- */
  const soundToggle = document.getElementById("soundToggle");
  let audioCtx = null, masterGain = null, soundOn = false;

  function buildWater(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){ /* 棕噪声:比白噪声软很多 */
      const white = Math.random()*2 - 1;
      last = (last + 0.02*white) / 1.02;
      data[i] = last * 3.2;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.4;
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    /* 极慢的起伏,像很远的浪 */
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.08;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.012;
    lfo.connect(lfoGain).connect(masterGain.gain);
    src.connect(lp).connect(masterGain).connect(audioCtx.destination);
    src.start(); lfo.start();
  }
  soundToggle.addEventListener("click", ()=>{
    soundOn = !soundOn;
    soundToggle.classList.toggle("on", soundOn);
    soundToggle.setAttribute("aria-pressed", String(soundOn));
    if(soundOn){
      if(!audioCtx) buildWater();
      if(audioCtx.state === "suspended") audioCtx.resume();
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setTargetAtTime(0.045, audioCtx.currentTime, 3);
    }else if(masterGain){
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 1.5);
    }
  });

  /* ---------- 河灯仪式 ---------- */
  const ritual = document.getElementById("ritual");
  const input = document.getElementById("ritualInput");
  const btn = document.getElementById("ritualBtn");
  const lake = document.getElementById("lake");

  function releaseLantern(){
    if(ritual.classList.contains("sent")) return;
    const l = document.createElement("div");
    l.className = "lantern";
    lake.appendChild(l);
    setTimeout(()=> l.remove(), reduced ? 9000 : 27000);
    ritual.classList.add("sent");
    input.value = "";        /* 念头不留存,只交给湖水 */
    input.blur();
    setTimeout(()=>{ ritual.classList.remove("sent"); }, 14000);
  }
  btn.addEventListener("click", releaseLantern);
  input.addEventListener("keydown", e=>{ if(e.key === "Enter") releaseLantern(); });

  /* ---------- 渐暗陪睡:约15分钟缓缓降到七成亮 ---------- */
  const nightfall = document.getElementById("nightfall");
  const steps = [0.05,0.10,0.15,0.20,0.25,0.30];
  steps.forEach((v,i)=>{
    setTimeout(()=>{ nightfall.style.opacity = v; }, (i+1)*150000);
  });
})();
</script>
</body>
</html>
