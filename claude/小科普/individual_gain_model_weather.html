<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>同一份天气，不同的难受</title>
<meta name="description" content="感知敏感度、内感受、自主神经、基线电量四个旋钮，把同一份闷热放大或衰减。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
.wx-head{display:flex;gap:8px;margin-bottom:6px;}
.wx-card{flex:1;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center;}
.wx-val{font-size:18px;font-weight:500;line-height:1.1;}
.wx-lab{font-size:11px;color:var(--color-text-tertiary);margin-top:2px;}
.wx-note{font-size:12px;color:var(--color-text-secondary);text-align:center;margin-bottom:16px;}
.sld-row{margin-bottom:14px;}
.sld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.sld-name{font-size:14px;font-weight:500;}
.sld-sub{font-size:12px;color:var(--color-text-tertiary);}
.sld-val{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--color-text-secondary);}
.preset-row{display:flex;gap:8px;margin:4px 0 18px;}
.preset-row button{flex:1;}
.out-box{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:16px;text-align:center;}
.out-num{font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s;}
.out-lab{font-size:13px;color:var(--color-text-secondary);margin-top:6px;min-height:18px;}
.out-track{height:12px;border-radius:999px;background:var(--color-background-tertiary);overflow:hidden;margin-top:12px;}
.out-fill{height:100%;border-radius:999px;transition:width .3s,background-color .3s;}
</style>
<h2 class="sr-only">个体增益模型:同样一份闷热天气输入,经过每个人不同的感知敏感度、内感受、自主神经、基线电量四个旋钮,会被放大或衰减成完全不同的主观不适强度。可以一键切换宝和同事的配置看对比。</h2>
<div class="wx-head">
  <div class="wx-card"><div class="wx-val">36°</div><div class="wx-lab">体感温度</div></div>
  <div class="wx-card"><div class="wx-val">86%</div><div class="wx-lab">湿度</div></div>
  <div class="wx-card"><div class="wx-val">≈0</div><div class="wx-lab">风力</div></div>
</div>
<div class="wx-note">同一份天气输入 · 进每个人不同的旋钮 · 出完全不同的体验</div>

<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">感知敏感度</span> <span class="sld-sub">高敏神经</span></span><span class="sld-val" id="v0">88</span></div>
  <input type="range" min="0" max="100" step="1" value="88" id="s0">
</div>
<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">身体觉察</span> <span class="sld-sub">内感受</span></span><span class="sld-val" id="v1">80</span></div>
  <input type="range" min="0" max="100" step="1" value="80" id="s1">
</div>
<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">自主神经反应性</span> <span class="sld-sub">忽冷忽热</span></span><span class="sld-val" id="v2">75</span></div>
  <input type="range" min="0" max="100" step="1" value="75" id="s2">
</div>
<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">电量透支度</span> <span class="sld-sub">基线越低越放大</span></span><span class="sld-val" id="v3">65</span></div>
  <input type="range" min="0" max="100" step="1" value="65" id="s3">
</div>

<div class="preset-row">
  <button id="pMo"><i class="ti ti-user" style="font-size:15px;vertical-align:-2px;margin-right:5px;" aria-hidden="true"></i>宝的配置</button>
  <button id="pCo"><i class="ti ti-users" style="font-size:15px;vertical-align:-2px;margin-right:5px;" aria-hidden="true"></i>同事的配置</button>
</div>

<div class="out-box">
  <div class="out-num" id="out">78</div>
  <div class="out-lab" id="outLab">明显难受 · 得先玩点黑色幽默</div>
  <div class="out-track"><div class="out-fill" id="outFill"></div></div>
</div>
<script>
(function(){
  const ids=[0,1,2,3];
  const s=ids.map(function(i){return document.getElementById('s'+i);});
  const v=ids.map(function(i){return document.getElementById('v'+i);});
  const out=document.getElementById('out');
  const outLab=document.getElementById('outLab');
  const outFill=document.getElementById('outFill');
  const W=[0.32,0.20,0.24,0.24];
  function colorFor(t){
    if(t>=78)return '#E24B4A';
    if(t>=55)return '#D85A30';
    if(t>=30)return '#EF9F27';
    return '#378ADD';
  }
  function labFor(t){
    if(t>=78)return '冷库咸鱼 + 摸鱼模式';
    if(t>=55)return '明显难受 · 得先玩点黑色幽默';
    if(t>=30)return '有点烦 · 但能压得住';
    return '几乎无感 · 该干嘛干嘛';
  }
  function render(){
    let score=0;
    for(let i=0;i<4;i++){
      const val=parseInt(s[i].value,10);
      v[i].textContent=val;
      score+=val*W[i];
    }
    score=Math.round(score);
    out.textContent=score;
    const c=colorFor(score);
    out.style.color=c;
    outLab.textContent=labFor(score);
    outFill.style.width=score+'%';
    outFill.style.backgroundColor=c;
  }
  s.forEach(function(el){el.addEventListener('input',render);});
  function setAll(vals){
    for(let i=0;i<4;i++){s[i].value=vals[i];}
    render();
  }
  document.getElementById('pMo').onclick=function(){setAll([88,80,75,65]);};
  document.getElementById('pCo').onclick=function(){setAll([35,25,30,15]);};
  render();
})();
</script>
</body>
</html>
