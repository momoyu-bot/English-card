<title>同一份天气，不同的难受</title>
<meta name="description" content="感知敏感度、内感受、自主神经、基线电量四个旋钮，把同一份闷热放大或衰减。">
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
.wx-head{display:flex;gap:8px;margin-bottom:6px;}
.wx-card{flex:1;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center;}
.wx-val{font-size:18px;font-weight:500;line-height:1.1;}
.wx-lab{font-size:11px;color:var(--color-text-tertiary);margin-top:2px;}
.wx-note{font-size:12px;color:var(--color-text-secondary);text-align:center;margin-bottom:16px;}
.sld-row{margin-bottom:14px;}
.sld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.sld-name{font-size:14px;font-weight:500;}
.sld-sub{font-size:12px;color:var(--color-text-tertiary);}
.sld-val{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--color-text-secondary);}
.preset-row{display:flex;gap:8px;margin:4px 0 18px;}
.preset-row button{flex:1;}
.out-box{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:16px;text-align:center;}
.out-num{font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s;}
.out-lab{font-size:13px;color:var(--color-text-secondary);margin-top:6px;min-height:18px;}
.out-track{height:12px;border-radius:999px;background:var(--color-background-tertiary);overflow:hidden;margin-top:12px;}
.out-fill{height:100%;border-radius:999px;transition:width .3s,background-color .3s;}
</style>
<h2 class="sr-only">个体增益模型:同样一份闷热天气输入,经过每个人不同的感知敏感度、内感受、自主神经、基线电量四个旋钮,会被放大或衰减成完全不同的主观不适强度。可以一键切换宝和同事的配置看对比。</h2>
<div class="wx-head">
  <div class="wx-card"><div class="wx-val">36°</div><div class="wx-lab">体感温度</div></div>
  <div class="wx-card"><div class="wx-val">86%</div><div class="wx-lab">湿度</div></div>
  <div class="wx-card"><div class="wx-val">≈0</div><div class="wx-lab">风力</div></div>
</div>
<div class="wx-note">同一份天气输入 · 进每个人不同的旋钮 · 出完全不同的体验</div>

<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">感知敏感度</span> <span class="sld-sub">高敏神经</span></span><span class="sld-val" id="v0">88</span></div>
  <input type="range" min="0" max="100" step="1" value="88" id="s0">
</div>
<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">身体觉察</span> <span class="sld-sub">内感受</span></span><span class="sld-val" id="v1">80</span></div>
  <input type="range" min="0" max="100" step="1" value="80" id="s1">
</div>
<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">自主神经反应性</span> <span class="sld-sub">忽冷忽热</span></span><span class="sld-val" id="v2">75</span></div>
  <input type="range" min="0" max="100" step="1" value="75" id="s2">
</div>
<div class="sld-row">
  <div class="sld-top"><span><span class="sld-name">电量透支度</span> <span class="sld-sub">基线越低越放大</span></span><span class="sld-val" id="v3">65</span></div>
  <input type="range" min="0" max="100" step="1" value="65" id="s3">
</div>

<div class="preset-row">
  <button id="pMo"><i class="ti ti-user" style="font-size:15px;vertical-align:-2px;margin-right:5px;" aria-hidden="true"></i>宝的配置</button>
  <button id="pCo"><i class="ti ti-users" style="font-size:15px;vertical-align:-2px;margin-right:5px;" aria-hidden="true"></i>同事的配置</button>
</div>

<div class="out-box">
  <div class="out-num" id="out">78</div>
  <div class="out-lab" id="outLab">明显难受 · 得先玩点黑色幽默</div>
  <div class="out-track"><div class="out-fill" id="outFill"></div></div>
</div>
<script>
(function(){
  const ids=[0,1,2,3];
  const s=ids.map(function(i){return document.getElementById('s'+i);});
  const v=ids.map(function(i){return document.getElementById('v'+i);});
  const out=document.getElementById('out');
  const outLab=document.getElementById('outLab');
  const outFill=document.getElementById('outFill');
  const W=[0.32,0.20,0.24,0.24];
  function colorFor(t){
    if(t>=78)return '#E24B4A';
    if(t>=55)return '#D85A30';
    if(t>=30)return '#EF9F27';
    return '#378ADD';
  }
  function labFor(t){
    if(t>=78)return '冷库咸鱼 + 摸鱼模式';
    if(t>=55)return '明显难受 · 得先玩点黑色幽默';
    if(t>=30)return '有点烦 · 但能压得住';
    return '几乎无感 · 该干嘛干嘛';
  }
  function render(){
    let score=0;
    for(let i=0;i<4;i++){
      const val=parseInt(s[i].value,10);
      v[i].textContent=val;
      score+=val*W[i];
    }
    score=Math.round(score);
    out.textContent=score;
    const c=colorFor(score);
    out.style.color=c;
    outLab.textContent=labFor(score);
    outFill.style.width=score+'%';
    outFill.style.backgroundColor=c;
  }
  s.forEach(function(el){el.addEventListener('input',render);});
  function setAll(vals){
    for(let i=0;i<4;i++){s[i].value=vals[i];}
    render();
  }
  document.getElementById('pMo').onclick=function(){setAll([88,80,75,65]);};
  document.getElementById('pCo').onclick=function(){setAll([35,25,30,15]);};
  render();
})();
</script>
