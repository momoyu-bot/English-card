<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="t d">
  <title id="t">两条视频各走了哪条路</title>
  <desc id="d">拆开 Gemini 和 Grok 那两条误会视频：谁是导演、谁是摄影棚、谁是剪辑台</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A808A"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC','Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','Hiragino Sans GB',sans-serif; }
      .h1 { font-size: 24px; font-weight: 600; fill: #23262D; }
      .sub { font-size: 14px; fill: #6E737D; }
      .colh { font-size: 16px; font-weight: 600; fill: #2B2E35; }
      .cols { font-size: 12.5px; fill: #8A8F99; }
      .note { font-size: 12px; fill: #B4621A; }
      .lane-g { font-size: 15px; font-weight: 600; fill: #3B5FA8; }
      .lane-x { font-size: 15px; font-weight: 600; fill: #2E3036; }
      .bt { font-size: 15px; font-weight: 600; fill: #23262D; }
      .bb { font-size: 13px; fill: #3F434B; }
      .bs { font-size: 12px; fill: #8A8F99; }
      .ghost { font-size: 12px; fill: #9AA0AA; }
      .ghost-t { font-size: 12px; font-weight: 600; fill: #9AA0AA; }
      .foot { font-size: 13px; fill: #5E636D; }
      .me { font-size: 24px; font-weight: 600; fill: #23262D; }
      .arrow { stroke: #7A808A; stroke-width: 1.6; fill: none; }
      .dash { stroke-dasharray: 6 4; }
      .c { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#F6F7F8"/>

  <text x="40" y="50" class="h1">两条「小萌物」视频，各走了哪条路</text>
  <text x="40" y="78" class="sub">你看到的差别（会不会动、有没有台词、多长），多半是这次走了哪条路，不一定是架构不同</text>

  <!-- column headers -->
  <text x="72" y="118" class="colh c">起点</text>
  <text x="72" y="137" class="cols c">你的一句话</text>

  <text x="230" y="118" class="colh c">导演</text>
  <text x="230" y="137" class="cols c">聊天模型</text>
  <text x="230" y="156" class="note c">误会出在这一层</text>

  <text x="425" y="118" class="colh c">摄影棚</text>
  <text x="425" y="137" class="cols c">生成模型</text>

  <text x="642.5" y="118" class="colh c">剪辑台</text>
  <text x="642.5" y="137" class="cols c">代码沙盒</text>

  <text x="862.5" y="118" class="colh c">放映厅</text>
  <text x="862.5" y="137" class="cols c">App 播放器 / 文件</text>

  <!-- start box (shared) -->
  <rect x="24" y="230" width="96" height="262" rx="12" fill="#FFFFFF" stroke="#C9CDD4"/>
  <text x="72" y="322" class="me c">你</text>
  <text x="72" y="352" class="bb c">「做个</text>
  <text x="72" y="372" class="bb c">小萌物</text>
  <text x="72" y="392" class="bb c">短片」</text>
  <text x="72" y="428" class="bs c">本意是</text>
  <text x="72" y="446" class="note c">代码动画</text>

  <!-- lane 1: Gemini -->
  <rect x="140" y="170" width="840" height="176" rx="14" fill="#FFFFFF" stroke="#E2E5EA"/>
  <text x="160" y="198" class="lane-g">Gemini 那条 · 10 秒 · 会动、有台词、有字幕</text>

  <rect x="160" y="214" width="140" height="96" rx="10" fill="#EEF3FB" stroke="#A9BCE1"/>
  <text x="230" y="242" class="bt c">Gemini · Pro</text>
  <text x="230" y="266" class="bb c">看懂你的话</text>
  <text x="230" y="286" class="bb c">决定去叫摄影棚</text>

  <rect x="330" y="214" width="190" height="96" rx="10" fill="#EEF3FB" stroke="#A9BCE1"/>
  <text x="425" y="242" class="bt c">Gemini Omni 1.1</text>
  <text x="425" y="266" class="bb c">画面和声音一次出</text>
  <text x="425" y="286" class="bs c">侧栏里写着它的名字</text>

  <rect x="550" y="214" width="185" height="96" rx="10" fill="none" stroke="#D3D7DE" class="dash"/>
  <text x="642.5" y="266" class="ghost c">这条没进剪辑台</text>

  <rect x="765" y="214" width="195" height="96" rx="10" fill="#EEF3FB" stroke="#A9BCE1"/>
  <text x="862.5" y="242" class="bt c">播放器 · 10 秒</text>
  <text x="862.5" y="266" class="bb c">字幕也许是这层叠的</text>
  <text x="862.5" y="286" class="bs c">点一下字幕键就知道</text>

  <line x1="120" y1="262" x2="157" y2="262" class="arrow" marker-end="url(#arr)"/>
  <line x1="300" y1="262" x2="327" y2="262" class="arrow" marker-end="url(#arr)"/>
  <path d="M520,228 C588,172 697,172 762,228" class="arrow" marker-end="url(#arr)"/>

  <!-- lane 2: Grok -->
  <rect x="140" y="362" width="840" height="240" rx="14" fill="#FFFFFF" stroke="#E2E5EA"/>
  <text x="160" y="390" class="lane-x">Grok 那条 · 25 秒 · 静帧慢推、几乎无声</text>

  <rect x="160" y="406" width="140" height="106" rx="10" fill="#F2F2F4" stroke="#B5B8BF"/>
  <text x="230" y="434" class="bt c">Grok · Expert</text>
  <text x="230" y="458" class="bb c">看懂你的话</text>
  <text x="230" y="478" class="bb c">决定先画一张图</text>

  <rect x="330" y="406" width="190" height="106" rx="10" fill="#F2F2F4" stroke="#B5B8BF"/>
  <text x="425" y="434" class="bt c">画图模型</text>
  <text x="425" y="458" class="bb c">先出一张静止的画</text>
  <text x="425" y="478" class="bs c">暹罗猫叼着发光卡片</text>

  <rect x="330" y="522" width="190" height="66" rx="10" fill="#FBFBFC" stroke="#CBCED5" class="dash"/>
  <text x="425" y="545" class="ghost-t c">旁边的 Imagine 视频 1.5</text>
  <text x="425" y="563" class="ghost c">1–15 秒，自带声音和动作</text>
  <text x="425" y="580" class="ghost c">这次大概没走</text>

  <rect x="550" y="406" width="185" height="106" rx="10" fill="#FAFAFB" stroke="#9C9FA6" class="dash"/>
  <text x="642.5" y="434" class="bt c">推测：代码沙盒</text>
  <text x="642.5" y="458" class="bb c">把这张画慢慢推镜头</text>
  <text x="642.5" y="478" class="bb c">配一段很轻的噪声</text>
  <text x="642.5" y="498" class="bb c">拉成 25 秒</text>

  <rect x="765" y="406" width="195" height="106" rx="10" fill="#F2F2F4" stroke="#B5B8BF"/>
  <text x="862.5" y="434" class="bt c">文件卡片</text>
  <text x="862.5" y="458" class="bb c">小萌物系列-其一.mp4</text>
  <text x="862.5" y="478" class="bs c">25 秒 · 能下载能放大</text>

  <line x1="120" y1="459" x2="157" y2="459" class="arrow" marker-end="url(#arr)"/>
  <line x1="300" y1="459" x2="327" y2="459" class="arrow" marker-end="url(#arr)"/>
  <line x1="520" y1="459" x2="547" y2="459" class="arrow dash" marker-end="url(#arr)"/>
  <line x1="735" y1="459" x2="762" y2="459" class="arrow dash" marker-end="url(#arr)"/>

  <!-- footer -->
  <text x="40" y="632" class="foot">实线 = 截图里看得到的　虚线 = 推测　验证：展开 Grok 那条消息上方的「工作了 Xs」，看它调用了什么</text>
  <text x="40" y="656" class="foot">两家现役的视频模型都是连声音一起生成的——「有没有原生声音」分不出这两家</text>
</svg>
