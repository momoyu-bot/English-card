<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新版图片为什么发绿</title>
<meta name="description" content="色相从 173 度偏到 137 度，青绿变草绿；同时光影的跨度腰斩，体积感没了。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only">五张图片的主体取色对比，显示新版图2和图3的色相从173度偏移到137-140度，由青绿变为草绿，同时光影动态范围腰斩。</h2>

<div style="padding: 0.5rem 0 0;">
<div style="display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-bottom:1.5rem;">

  <div>
    <div style="height:88px; background:#29786F; border-radius:8px 8px 0 0;"></div>
    <div style="background:var(--surface-1); border-radius:0 0 8px 8px; padding:10px;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">图5 参考色</div>
      <div style="font-size:13px; font-family:var(--font-mono); margin-bottom:6px;">#29786F</div>
      <div style="font-size:12px; color:var(--text-muted);">H 173.2°</div>
      <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">基准</div>
    </div>
  </div>

  <div>
    <div style="height:88px; background:#338179; border-radius:8px 8px 0 0;"></div>
    <div style="background:var(--surface-1); border-radius:0 0 8px 8px; padding:10px;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">图1 原主图</div>
      <div style="font-size:13px; font-family:var(--font-mono); margin-bottom:6px;">#338179</div>
      <div style="font-size:12px; color:var(--text-muted);">H 173.8°</div>
      <div style="font-size:11px; color:var(--text-success); margin-top:4px;">+0.6° 对上了</div>
    </div>
  </div>

  <div>
    <div style="height:88px; background:#4B9761; border-radius:8px 8px 0 0;"></div>
    <div style="background:var(--surface-1); border-radius:0 0 8px 8px; padding:10px;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">图2 新版</div>
      <div style="font-size:13px; font-family:var(--font-mono); margin-bottom:6px;">#4B9761</div>
      <div style="font-size:12px; color:var(--text-muted);">H 137.4°</div>
      <div style="font-size:11px; color:var(--text-danger); margin-top:4px;">−35.8° 草绿</div>
    </div>
  </div>

  <div>
    <div style="height:88px; background:#4B805D; border-radius:8px 8px 0 0;"></div>
    <div style="background:var(--surface-1); border-radius:0 0 8px 8px; padding:10px;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">图3 新版</div>
      <div style="font-size:13px; font-family:var(--font-mono); margin-bottom:6px;">#4B805D</div>
      <div style="font-size:12px; color:var(--text-muted);">H 140.4°</div>
      <div style="font-size:11px; color:var(--text-danger); margin-top:4px;">−32.8° 草绿</div>
    </div>
  </div>

  <div>
    <div style="height:88px; background:#49857C; border-radius:8px 8px 0 0;"></div>
    <div style="background:var(--surface-1); border-radius:0 0 8px 8px; padding:10px;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">图4 新版</div>
      <div style="font-size:13px; font-family:var(--font-mono); margin-bottom:6px;">#49857C</div>
      <div style="font-size:12px; color:var(--text-muted);">H 171.0°</div>
      <div style="font-size:11px; color:var(--text-warning); margin-top:4px;">−2.2° 色相接近</div>
    </div>
  </div>

</div>

<div style="border-top:0.5px solid var(--border); padding-top:1.25rem;">
  <div style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">主体光影动态范围（暗部到高光的跨度，越大越有体积感）</div>

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
    <span style="font-size:12px; color:var(--text-muted); width:76px;">图5 参考</span>
    <div style="flex:1; height:16px; background:var(--surface-1); border-radius:4px; overflow:hidden;"><div style="width:61.7%; height:100%; background:#1baf7a; border-radius:4px;"></div></div>
    <span style="font-size:13px; font-family:var(--font-mono); width:34px; text-align:right;">79</span>
  </div>

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
    <span style="font-size:12px; color:var(--text-muted); width:76px;">图1 原主图</span>
    <div style="flex:1; height:16px; background:var(--surface-1); border-radius:4px; overflow:hidden;"><div style="width:100%; height:100%; background:#1baf7a; border-radius:4px;"></div></div>
    <span style="font-size:13px; font-family:var(--font-mono); width:34px; text-align:right;">128</span>
  </div>

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
    <span style="font-size:12px; color:var(--text-muted); width:76px;">图2 新版</span>
    <div style="flex:1; height:16px; background:var(--surface-1); border-radius:4px; overflow:hidden;"><div style="width:44.5%; height:100%; background:#e34948; border-radius:4px;"></div></div>
    <span style="font-size:13px; font-family:var(--font-mono); width:34px; text-align:right;">57</span>
  </div>

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
    <span style="font-size:12px; color:var(--text-muted); width:76px;">图3 新版</span>
    <div style="flex:1; height:16px; background:var(--surface-1); border-radius:4px; overflow:hidden;"><div style="width:43.6%; height:100%; background:#e34948; border-radius:4px;"></div></div>
    <span style="font-size:13px; font-family:var(--font-mono); width:34px; text-align:right;">56</span>
  </div>

  <div style="display:flex; align-items:center; gap:10px;">
    <span style="font-size:12px; color:var(--text-muted); width:76px;">图4 新版</span>
    <div style="flex:1; height:16px; background:var(--surface-1); border-radius:4px; overflow:hidden;"><div style="width:43.8%; height:100%; background:#e34948; border-radius:4px;"></div></div>
    <span style="font-size:13px; font-family:var(--font-mono); width:34px; text-align:right;">56</span>
  </div>
</div>
</div>
</body>
</html>
