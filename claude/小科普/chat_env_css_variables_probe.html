<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聊天窗到底借了什么给它</title>
<meta name="description" content="读出聊天界面提供给内嵌页面的颜色变量真实取值，生成一段能直接粘贴的定义。">
</head>
<body>
<div style="padding: 1rem 0;">
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border)}
.sw{width:22px;height:22px;border-radius:5px;border:0.5px solid var(--border-strong);flex-shrink:0}
.nm{font-family:var(--font-mono);font-size:11.5px;color:var(--text-primary);flex-shrink:0;width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl{font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.gh{font-size:13px;color:var(--text-secondary);margin:1.25rem 0 2px}
</style>
<h2 class="sr-only">探针：读取当前聊天界面向内嵌页面提供的 CSS 变量真实取值，并生成可直接粘贴的 root 定义</h2>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;">
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
    <div style="font-size:13px;color:var(--text-secondary);">环境提供</div>
    <div style="font-size:24px;font-weight:500;" id="n-found">—</div>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
    <div style="font-size:13px;color:var(--text-secondary);">未定义</div>
    <div style="font-size:24px;font-weight:500;" id="n-miss">—</div>
  </div>
</div>

<div id="list"></div>

<div style="margin-top:1.5rem;">
  <button id="copy" style="width:100%;">复制完整定义</button>
  <pre id="css" style="margin-top:12px;font-family:var(--font-mono);font-size:11px;line-height:1.65;background:var(--surface-1);border-radius:var(--radius);padding:12px;overflow-x:auto;white-space:pre;color:var(--text-secondary);margin-bottom:0;"></pre>
</div>
</div>
<script>
(function(){
  var groups=[
    ["底色 surface",["--surface-0","--surface-1","--surface-2","--surface-3","--surface-panel","--surface-popover"]],
    ["文字 text",["--text-primary","--text-secondary","--text-muted","--text-disabled","--text-accent","--text-danger","--text-success","--text-warning"]],
    ["描边 border",["--border","--border-strong","--border-stronger","--border-accent","--border-danger","--border-success","--border-warning"]],
    ["色块 bg / fill",["--bg-accent","--bg-danger","--bg-success","--bg-warning","--bg-neutral","--fill-accent","--fill-brand","--fill-primary","--fill-secondary","--fill-field","--fill-ghost-hover","--fill-control","--fill-disabled"]],
    ["字体与尺寸",["--font-sans","--font-mono","--font-voice","--font-size-body","--font-size-caption","--font-size-heading","--radius","--h-control","--pad-md","--gap-md"]]
  ];
  var extra=["--on-primary","--on-accent","--on-brand","--on-danger","--on-success","--on-warning","--bg-accent-muted","--fill-accent-hover","--fill-primary-hover","--fill-secondary-hover","--fill-ghost-selected","--shadow-sm","--shadow-md","--shadow-lg","--shadow-popover","--focus-shadow","--pad-sm","--pad-lg","--pad-xl","--gap-xs","--gap-sm","--gap-lg","--gap-xl","--font-size-footnote","--font-size-prose","--font-size-code","--font-size-title","--dur-fast","--dur-base","--ease-out"];
  var cs=getComputedStyle(document.documentElement);
  function read(n){try{return (cs.getPropertyValue(n)||"").trim();}catch(e){return "";}}
  function isColor(v){return /^(#|rgb|hsl|color-mix|oklch|lab)/i.test(v);}
  var found=0,miss=0,lines=[],html="";
  groups.forEach(function(g){
    var rows="";
    g[1].forEach(function(n){
      var v=read(n);
      if(v){found++;lines.push("  "+n+": "+v+";");}else{miss++;}
      var sw=isColor(v)?'<div class="sw" style="background:'+v+'"></div>':'<div class="sw" style="border-style:dashed;background:transparent"></div>';
      rows+='<div class="row">'+sw+'<div class="nm">'+n.slice(2)+'</div><div class="vl">'+(v?v:'未定义')+'</div></div>';
    });
    html+='<div class="gh">'+g[0]+'</div>'+rows;
  });
  extra.forEach(function(n){var v=read(n);if(v){found++;lines.push("  "+n+": "+v+";");}else{miss++;}});
  document.getElementById("list").innerHTML=html;
  document.getElementById("n-found").textContent=found;
  document.getElementById("n-miss").textContent=miss;
  var out=":root{\n"+lines.join("\n")+"\n}";
  document.getElementById("css").textContent=out;
  var btn=document.getElementById("copy");
  btn.addEventListener("click",function(){
    var ok=false;
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out);ok=true;}}catch(e){}
    if(!ok){var r=document.createRange();r.selectNodeContents(document.getElementById("css"));var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
    btn.textContent=ok?"已复制":"已选中，长按拷贝";
    setTimeout(function(){btn.textContent="复制完整定义";},2200);
  });
})();
</script>
</body>
</html>
