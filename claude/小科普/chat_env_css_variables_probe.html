<div style="padding: 1rem 0;">
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border)}
.sw{width:22px;height:22px;border-radius:5px;border:0.5px solid var(--border-strong);flex-shrink:0}
.nm{font-family:var(--font-mono);font-size:11.5px;color:var(--text-primary);flex-shrink:0;width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl{font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.gh{font-size:13px;color:var(--text-secondary);margin:1.25rem 0 2px}
</style>
<h2 class="sr-only">探针：读取当前聊天界面向内嵌页面提供的 CSS 变量真实取值，并生成可直接粘贴的 root 定义</h2>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;">
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
    <div style="font-size:13px;color:var(--text-secondary);">环境提供</div>
    <div style="font-size:24px;font-weight:500;" id="n-found">—</div>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
    <div style="font-size:13px;color:var(--text-secondary);">未定义</div>
    <div style="font-size:24px;font-weight:500;" id="n-miss">—</div>
  </div>
</div>

<div id="list"></div>

<div style="margin-top:1.5rem;">
  <button id="copy" style="width:100%;">复制完整定义</button>
  <pre id="css" style="margin-top:12px;font-family:var(--font-mono);font-size:11px;line-height:1.65;background:var(--surface-1);border-radius:var(--radius);padding:12px;overflow-x:auto;white-space:pre;color:var(--text-secondary);margin-bottom:0;"></pre>
</div>
</div>
<script>
(function(){
  var groups=[
    ["底色 surface",["--surface-0","--surface-1","--surface-2","--surface-3","--surface-panel","--surface-popover"]],
    ["文字 text",["--text-primary","--text-secondary","--text-muted","--text-disabled","--text-accent","--text-danger","--text-success","--text-warning"]],
    ["描边 border",["--border","--border-strong","--border-stronger","--border-accent","--border-danger","--border-success","--border-warning"]],
    ["色块 bg / fill",["--bg-accent","--bg-danger","--bg-success","--bg-warning","--bg-neutral","--fill-accent","--fill-brand","--fill-primary","--fill-secondary","--fill-field","--fill-ghost-hover","--fill-control","--fill-disabled"]],
    ["字体与尺寸",["--font-sans","--font-mono","--font-voice","--font-size-body","--font-size-caption","--font-size-heading","--radius","--h-control","--pad-md","--gap-md"]]
  ];
  var extra=["--on-primary","--on-accent","--on-brand","--on-danger","--on-success","--on-warning","--bg-accent-muted","--fill-accent-hover","--fill-primary-hover","--fill-secondary-hover","--fill-ghost-selected","--shadow-sm","--shadow-md","--shadow-lg","--shadow-popover","--focus-shadow","--pad-sm","--pad-lg","--pad-xl","--gap-xs","--gap-sm","--gap-lg","--gap-xl","--font-size-footnote","--font-size-prose","--font-size-code","--font-size-title","--dur-fast","--dur-base","--ease-out"];
  var cs=getComputedStyle(document.documentElement);
  function read(n){try{return (cs.getPropertyValue(n)||"").trim();}catch(e){return "";}}
  function isColor(v){return /^(#|rgb|hsl|color-mix|oklch|lab)/i.test(v);}
  var found=0,miss=0,lines=[],html="";
  groups.forEach(function(g){
    var rows="";
    g[1].forEach(function(n){
      var v=read(n);
      if(v){found++;lines.push("  "+n+": "+v+";");}else{miss++;}
      var sw=isColor(v)?'<div class="sw" style="background:'+v+'"></div>':'<div class="sw" style="border-style:dashed;background:transparent"></div>';
      rows+='<div class="row">'+sw+'<div class="nm">'+n.slice(2)+'</div><div class="vl">'+(v?v:'未定义')+'</div></div>';
    });
    html+='<div class="gh">'+g[0]+'</div>'+rows;
  });
  extra.forEach(function(n){var v=read(n);if(v){found++;lines.push("  "+n+": "+v+";");}else{miss++;}});
  document.getElementById("list").innerHTML=html;
  document.getElementById("n-found").textContent=found;
  document.getElementById("n-miss").textContent=miss;
  var out=":root{\n"+lines.join("\n")+"\n}";
  document.getElementById("css").textContent=out;
  var btn=document.getElementById("copy");
  btn.addEventListener("click",function(){
    var ok=false;
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out);ok=true;}}catch(e){}
    if(!ok){var r=document.createRange();r.selectNodeContents(document.getElementById("css"));var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
    btn.textContent=ok?"已复制":"已选中，长按拷贝";
    setTimeout(function(){btn.textContent="复制完整定义";},2200);
  });
})();
</script>
