<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狐狸和小猫的定妆照</title>
<meta name="description" content="原创像素小狐狸和小猫的第一版，狐狸有火红和粉色，小猫有七种毛色，点一下会动。">
<style>
  :root {
    --page: #F1F5F2;
    --ink: #243029;
    --ink-2: #5B6862;
    --ink-3: #87948D;
    --line: #D6E0DA;
    --btn: #FFFFFF;
    --btn-on: #243029;
    --btn-on-ink: #F1F5F2;
    /* the stage and the swatches stay lit in both themes, so colours are judged on the same backdrop */
    --stage: #DDE9E2;
    --floor: #D0DFD6;
    --floor-edge: #C4D6CC;
    --stage-ink: #243029;
    --stage-ink-2: #5B6862;
    --float-bg: rgba(255, 255, 255, 0.86);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #131816;
      --ink: #E4EBE7;
      --ink-2: #A3B0A9;
      --ink-3: #75827B;
      --line: #2A3430;
      --btn: #1B2220;
      --btn-on: #E4EBE7;
      --btn-on-ink: #131816;
    }
  }
  :root[data-theme="dark"] {
    --page: #131816;
    --ink: #E4EBE7;
    --ink-2: #A3B0A9;
    --ink-3: #75827B;
    --line: #2A3430;
    --btn: #1B2220;
    --btn-on: #E4EBE7;
    --btn-on-ink: #131816;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 40px; }

  .kicker { font-size: 12px; letter-spacing: .18em; color: var(--ink-3); margin: 0 0 4px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; letter-spacing: .02em; }
  .lede { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    background: var(--stage);
    border-radius: 18px;
    padding: 18px 10px 12px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .stage::after {            /* the floor they sit on */
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--floor-h, 30%);
    background: var(--floor);
    border-top: 2px solid var(--floor-edge);
    z-index: 0;
  }
  .fig {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    background: none; border: 0; padding: 0; margin: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    font: inherit; color: inherit;
  }
  .fig:focus-visible { outline: 2px solid var(--stage-ink); outline-offset: 4px; border-radius: 10px; }
  .fig canvas { display: block; }
  .tag {
    margin-top: 8px;
    font-size: 12px; color: var(--stage-ink-2);
    letter-spacing: .06em;
  }
  .tag b { color: var(--stage-ink); font-weight: 600; }
  .float {
    position: absolute; left: 0; top: 0;
    pointer-events: none;
    font-size: 13px; font-weight: 600; color: var(--stage-ink);
    background: var(--float-bg);
    padding: 1px 8px; border-radius: 999px;
    white-space: nowrap;
    animation: rise 1s ease-out forwards;
  }
  @keyframes rise {
    0%   { opacity: 0; transform: translate(-50%, 6px) scale(.9); }
    18%  { opacity: 1; transform: translate(-50%, -4px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
  }
  .hint { text-align: center; font-size: 12px; color: var(--ink-3); margin: 8px 0 22px; }

  /* ---------- pickers ---------- */
  h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; color: var(--ink); letter-spacing: .04em; }
  h2 small { font-weight: 400; color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--stage);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 6px 6px 4px;
    cursor: pointer; font: inherit;
    color: var(--stage-ink);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .chip canvas { display: block; }
  .chip span { font-size: 12px; line-height: 1.4; }
  .chip[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--stage-ink); }
  .chip[aria-pressed="true"] span { font-weight: 600; }
  .chip:active { transform: scale(.96); }
  .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .tools { display: flex; gap: 8px; margin: 4px 0 22px; flex-wrap: wrap; }
  .toggle {
    font: inherit; font-size: 13px;
    background: var(--btn); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle[aria-pressed="true"] { background: var(--btn-on); color: var(--btn-on-ink); border-color: var(--btn-on); }
  .toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- small sizes ---------- */
  .tiny {
    background: var(--stage);
    border-radius: 14px;
    padding: 14px 12px 10px;
    color: var(--stage-ink);
  }
  .tiny-grid { display: grid; grid-template-columns: repeat(2, auto); justify-content: space-evenly; align-items: end; gap: 10px; }
  .tiny-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tiny-pair { display: flex; align-items: flex-end; gap: 6px; }
  .tiny-cell span { font-size: 11px; color: var(--stage-ink-2); }
  .tiny canvas { display: block; }

  footer { margin-top: 26px; font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }

  @media (min-width: 560px) {
    h1 { font-size: 30px; }
    .stage { padding: 26px 18px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">新角色 · 定妆照 · 第一版</p>
  <h1>狐狸和小猫</h1>
  <p class="lede">还没有名字，也还没决定每天干嘛。先看看长相。</p>

  <div class="stage" id="stage">

      <canvas id="cv-cat" role="img" aria-label="像素小猫"></canvas>
      <span class="tag" id="tag-cat"></span>
    </button>
  </div>
  <p class="hint">点它们一下试试。</p>

  <h2>狐狸 <small>先按你说的粉色，火红是它的本色</small></h2>
  <div class="chips" id="chips-fox"></div>

  <h2>小猫 <small>本色不好定，几种常见毛色都给你摆上</small></h2>
  <div class="chips" id="chips-cat"></div>

  <div class="tools">
    <button class="toggle" id="t-sil" type="button" aria-pressed="false">剪影</button>
    <button class="toggle" id="t-grid" type="button" aria-pressed="false">像素格</button>
  </div>

  <div class="tiny">
    <h2 style="color: var(--stage-ink)">缩小了还认得出来吗</h2>
    <div class="tiny-grid" id="tiny"></div>
  </div>

  <footer>Claude 做的 · 2026.09</footer>
</div>

<script>
const DATA = {"fox":{"w":26,"h":22,"tail":[["..........................","..........................","..........................","..........................","..........................","..........................","...................CC.....","..................CCCC....","..................CCCC....","..................CCCC....",".................MMMMM....","................MMMMMMM...","................MMMMMMS...","................MMMMMMS...","...............MMMMMMS....","...............MMMMMS.....","..............MMMMMS......","..............MMMMS.......",".............MMMMS........",".............MMMS.........","..........................",".........................."],["..........................","..........................","..........................","..........................","..........................","..........................","....................CC....","...................CCCC...","...................CCCC...","...................CCCC...","..................MMMMM...",".................MMMMMMM..",".................MMMMMMS..","................MMMMMMS...","...............MMMMMMS....","...............MMMMMS.....","..............MMMMMS......","..............MMMMS.......",".............MMMMS........",".............MMMS.........","..........................",".........................."]],"body":["..D............D..........","..DD..........DD..........","..MCM........MCM..........","..MCCM......MCCM..........","..MCCMMMMMMMMCCM..........","..MMMMMMMMMMMMMM..........","..MMMMMMMMMMMMMM..........","..MMMMMMMMMMMMMM..........","..MMMMMMMMMMMMMM..........",".CCCBCCMMMMCCBCCC.........",".CCCCCCCDDCCCCCCC.........","....CCCCCCCCCC............",".....MMCCCCMM.............","....MMMCCCCMMM............","...MMMMCCCCMMMM...........","...MMMMCCCCMMMM...........","...MMSMMCCMMSMM...........","...MMSMMSSMMSMM...........","...MMSDDSSDDSMM...........","...MMSDD..DDSMM...........","...SSSDD..DDSSS...........",".........................."],"eyes":{"open":["..........................","..........................","..........................","..........................","..........................","..........................","..........................",".....HE....HE.............",".....EE....EE.............","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".........................."],"closed":["..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".....LL....LL.............","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".........................."],"happy":["..........................","..........................","..........................","..........................","..........................","..........................","..........................",".....L......L.............","....L.L....L.L............","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".........................."]},"overlays":{},"palettes":{"natural":{"M":"#E2552B","S":"#B8401F","C":"#FFF3E MMM...",".........MTTSMMCCMMSTTM...",".........MMMSMMCCMMSMMM...",".........MMMSWWCCWWSMMM...","..........SSSWW..WWSSS....",".........................."],"eyes":{"open":["..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","............HE....HE......","............EE....EE......","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".........................."],"closed":["..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","............LL....LL......","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".........................."],"happy":["..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","............L......L......","...........L.L....L.L.....","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".........................."]},"overlays":{"calico":["..........................","..........................","..........................","..........Q..........R....",".........Q.Q........R.R...",".........Q..QQQ...RR..R...",".........QQQQQ....RRRRR...",".........QQQQ.......RRR...","........QQQQ..............","........QQQ...............","..........................","..........................","..........................","..........................","..........................",".........RRR..........QQ..",".........RRRR........QQQ..","..........RR.........QQQ..","..........................","..........................","..........................",".........................."],"siamese":["..........................","..........................","..........................","..........................","..........................","..........................","..........................","..............JJJJ........","............JJKKKKJJ......","...........JKKKKKKKKJ.....","...........JKKK..KKKJ.....","............JK.KK.KJ......",".............JK..KJ.......","..........................","..........................","..........................","..........................","..........................","..........................","..........................","..........................",".........................."]},"palettes":{"tabby":{"M":"#F3A64B","S":"#DB8A33","T":"#D8792A","C":"#FFF3E1","K":"#FFF3E1","W":"#FFF3E1","X":"#F3A64B","Y":"#D8792A","P":"#F4A0AE","N":"#EF8597","E":"#2E2320","L":"#2E2320","H":"#FFFFFF","D":"#7A5040","B":"#F7A9A8"},"tuxedo":{"M":"#2F2B2E","S":"#1F1C1F","T":"#2F2B2E","C":"#FBF8F3","K":"#FBF8F3","W":"#FBF8F3","X":"#2F2B2E","Y":"#2F2B2E","P":"#E48C9F","N":"#EC8FA3","E":"#EFC75E","L":"#BDB3B8","H":"#FFF6D5","D":"#6A6166","B":"#2F2B2E"},"calico":{"M":"#FBF7F0","S":"#E7DFD3","T":"#FBF7F0","C":"#FBF7F0","K":"#FBF7F0","W":"#FBF7F0","X":"#3A3334","Y":"#EE9A45","P":"#F4A7B5","N":"#EF8FA0","E":"#2E2320","L":"#2E2320","H":"#FFFFFF","D":"#7A5A4E","B":"#F7B2B0","Q":"#EE9A45","R":"#3A3334","overlay":"calico"},"gray":{"M":"#9AA3B0","S":"#808997","T":"#8A93A1","C":"#E9EDF1","K":"#E9EDF1","W":"#E9EDF1","X":"#9AA3B0","Y":"#8A93A1","P":"#EBA9B7","N":"#DC8EA0","E":"#2A2B33","L":"#2A2B33","H":"#FFFFFF","D":"#535A66","B":"#F0AFBD"},"black":{"M":"#2B2830","S":"#1E1C22","T":"#2B2830","C":"#2B2830","K":"#2B2830","W":"#2B2830","X":"#2B2830","Y":"#2B2830","P":"#7A5566","N":"#9C6273","E":"#E9C65A","L":"#A39AA8","H":"#FFF5CF","D":"#5B5461","B":"#2B2830"},"siamese":{"M":"#F2E6D4","S":"#DCCBB3","T":"#F2E6D4","C":"#FBF5EC","K":"#5A4135","W":"#5A4135","X":"#5A4135","Y":"#5A4135","P":"#7E5E4F","N":"#2F211B","E":"#6CB2E6","L":"#E8DCCB","H":"#FFFFFF","D":"#2F211B","B":"#F2E6D4","J":"#A58370","overlay":"siamese"},"pink":{"M":"#F6A3C4","S":"#E788B0","T":"#EE8FB6","C":"#FFF5F9","K":"#FFF5F9","W":"#FFF5F9","X":"#F6A3C4","Y":"#EE8FB6","P":"#E9699C","N":"#E25F93","E":"#3B2032","L":"#3B2032","H":"#FFFFFF","D":"#8C3F66","B":"#F27FAE"}}}};

const NAMES = {
  fox: { pink: '粉色', natural: '火红' },
  cat: { pink: '粉色', tabby: '橘猫', tuxedo: '奶牛猫', calico: '三花', gray: '灰猫', black: '黑猫', siamese: '暹罗' }
};
const ORDER = {
  fox: ['pink', 'natural'],
  cat: ['pink', 'tabby', 'tuxedo', 'calico', 'gray', 'black', 'siamese']
};
const LABEL = { fox: '狐狸', cat: '小猫' };
const SIL = '#2E3833';
const PAD_TOP = 3;                 // room above the head for the hop
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- composing layers ---------- */
function compose(name, palName, tail, eyes) {
  const ch = DATA[name], pal = ch.palettes[palName];
  const g = Array.from({ length: ch.h }, () => new Array(ch.w).fill(null));
  const layers = [ch.tail[tail], ch.body];
  if (pal.overlay) layers.push(ch.overlays[pal.overlay]);
  layers.push(ch.eyes[eyes]);
  for (const layer of layers) {
    for (let y = 0; y < ch.h; y++) {
      const row = layer[y];
      for (let x = 0; x < ch.w; x++) {
        const c = row[x];
        if (c !== '.') g[y][x] = c;
      }
    }
  }
  return g;
}

/* where the pixel shadow goes: one row under the lowest body row, a little wider than the feet */
function shadowSpan(name) {
  const ch = DATA[name];
  let low = -1, x0 = ch.w, x1 = -1;
  ch.body.forEach((row, y) => {
    for (let x = 0; x < ch.w; x++) if (row[x] !== '.') { if (y > low) low = y; }
  });
  const row = ch.body[low];
  for (let x = 0; x < ch.w; x++) if (row[x] !== '.') { x0 = Math.min(x0, x); x1 = Math.max(x1, x); }
  return { y: low + 1, x0: x0 - 1, x1: x1 + 1 };
}
const SHADOW = { fox: shadowSpan('fox'), cat: shadowSpan('cat') };

/* ---------- painting ---------- */
function sizeCanvas(cv, wUnits, hUnits, scale) {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.style.width = (wUnits * scale) + 'px';
  cv.style.height = (hUnits * scale) + 'px';
  const bw = Math.round(wUnits * scale * dpr), bh = Math.round(hUnits * scale * dpr);
  if (cv.width !== bw) cv.width = bw;
  if (cv.height !== bh) cv.height = bh;
  return scale * dpr;
}

function paint(cv, name, palName, o) {
  const ch = DATA[name], pal = ch.palettes[palName];
  const padTop = o.padTop || 0;
  const k = sizeCanvas(cv, ch.w, ch.h + padTop, o.scale);
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const R = v => Math.round(v * k);
  const cell = (x, y) => ctx.fillRect(R(x), R(y), R(x + 1) - R(x), R(y + 1) - R(y));

  if (o.shadow) {
    const s = SHADOW[name], lift = -(o.dy || 0);
    const shrink = Math.min(lift, 3);
    ctx.fillStyle = o.sil ? 'rgba(46,56,51,0.18)' : 'rgba(36,48,41,0.13)';
    for (let x = s.x0 + shrink; x <= s.x1 - shrink; x++) cell(x, s.y + padTop);
  }

  const g = compose(name, palName, o.tail || 0, o.eyes || 'open');
  const dy = padTop + (o.dy || 0);
  for (let y = 0; y < ch.h; y++) {
    for (let x = 0; x < ch.w; x++) {
      const c = g[y][x];
      if (c === null) continue;
      ctx.fillStyle = o.sil ? SIL : pal[c];
      cell(x, y + dy);
    }
  }

  if (o.grid) {
    ctx.fillStyle = 'rgba(36,48,41,0.16)';
    const hpx = Math.max(1, Math.round(k / 12));
    for (let x = 0; x <= ch.w; x++) ctx.fillRect(Math.min(R(x), cv.width - hpx), 0, hpx, cv.height);
    for (let y = 0; y <= ch.h + padTop; y++) ctx.fillRect(0, Math.min(R(y), cv.height - hpx), cv.width, hpx);
  }
}

/* ---------- state ---------- */
const view = { sil: false, grid: false };
const now = () => performance.now();
function makeState(pal) {
  return {
    pal, key: '', scale: 8,
    blinkStart: -1, blinkEnd: -1, nextBlink: now() + 900 + Math.random() * 2400, doubleBlink: false,
    happyEnd: -1,
    wagStart: -1, wagEnd: -1, wagPeriod: 120,
    swishEnd: -1, nextSwish: now() + 1800 + Math.random() * 2500,
    hopStart: -1
  };
}
const S = { fox: makeState('pink'), cat: makeState('pink') };
const HOP = [-1, -2, -3, -3, -3, -2, -1, 0];
const HOP_STEP = 45;

function frameOf(name, t) {
  const s = S[name];
  // blinking
  if (t >= s.nextBlink && s.blinkEnd < t) {
    s.blinkStart = t; s.blinkEnd = t + 130;
    s.doubleBlink = Math.random() < 0.22;
    s.nextBlink = t + (s.doubleBlink ? 280 : 2400 + Math.random() * 3200);
  }
  let eyes = 'open';
  if (t < s.happyEnd) eyes = 'happy';
  else if (t < s.blinkEnd) eyes = 'closed';

  // tail
  let tail = 0;
  if (t < s.wagEnd) {
    tail = Math.floor((t - s.wagStart) / s.wagPeriod) % 2 === 0 ? 1 : 0;
  } else if (!reduceMotion) {
    if (t >= s.nextSwish && s.swishEnd < t) {
      s.swishEnd = t + (name === 'fox' ? 520 : 300);
      s.nextSwish = t + (name === 'fox' ? 2200 + Math.random() * 2600 : 3000 + Math.random() * 3500);
    }
    if (t < s.swishEnd) tail = 1;
  }

  // hop (fox)
  let dy = 0;
  if (s.hopStart >= 0) {
    const i = Math.floor((t - s.hopStart) / HOP_STEP);
    if (i < HOP.length) dy = HOP[i]; else s.hopStart = -1;
  }
  return { tail, eyes, dy };
}

const cvs = { fox: document.getElementById('cv-fox'), cat: document.getElementById('cv-cat') };

function drawStage(name, force) {
  const f = frameOf(name, now());
  const s = S[name];
  const key = [s.pal, f.tail, f.eyes, f.dy, s.scale, view.sil, view.grid].join('|');
  if (!force && key === s.key) return;
  s.key = key;
  paint(cvs[name], name, s.pal, { scale: s.scale, padTop: PAD_TOP, shadow: true, sil: view.sil, grid: view.grid, ...f });
}

function loop() {
  drawStage('fox');
  drawStage('cat');
  requestAnimationFrame(loop);
}

/* ---------- layout ---------- */
const stage = document.getElementById('stage');
function layout() {
  const cs = getComputedStyle(stage);
  const inner = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6;
  const per = inner / 2;
  const scale = Math.max(3, Math.min(12, Math.floor(per / DATA.fox.w)));
  S.fox.scale = scale; S.cat.scale = scale;
  drawStage('fox', true); drawStage('cat', true);
  // floor: its top edge sits on the row right under the feet (where the shadow is)
  const sr = stage.getBoundingClientRect(), cr = cvs.fox.getBoundingClientRect();
  const feetLine = cr.top + (SHADOW.fox.y + PAD_TOP) * scale;
  stage.style.setProperty('--floor-h', Math.round(sr.bottom - feetLine) + 'px');
  drawTiny();
}

/* ---------- tags ---------- */
function setTag(name) {
  document.getElementById('tag-' + name).innerHTML = LABEL[name] + ' · <b>' + NAMES[name][S[name].pal] + '</b>';
}

/* ---------- chips ---------- */
function buildChips(name) {
  const box = document.getElementById('chips-' + name);
  ORDER[name].forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', String(S[name].pal === p));
    b.setAttribute('aria-label', LABEL[name] + '：' + NAMES[name][p]);
    const cv = document.createElement('canvas');
    const sp = document.createElement('span'); sp.textContent = NAMES[name][p];
    b.append(cv, sp);
    paint(cv, name, p, { scale: 2 });
    b.addEventListener('click', () => {
      S[name].pal = p;
      box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      setTag(name);
      drawStage(name, true);
      drawTiny();
      poke(name, true);
    });
    box.appendChild(b);
  });
}

/* ---------- small sizes ---------- */
function drawTiny() {
  const box = document.getElementById('tiny');
  if (!box.children.length) {
    [1, 2].forEach(sc => {
      const cell = document.createElement('div'); cell.className = 'tiny-cell';
      const pair = document.createElement('div'); pair.className = 'tiny-pair';
      ['fox', 'cat'].forEach(n => { const c = document.createElement('canvas'); c.dataset.n = n; c.dataset.s = sc; pair.appendChild(c); });
      const lab = document.createElement('span'); lab.textContent = sc === 1 ? '×1 · 跟小图标差不多大' : '×2';
      cell.append(pair, lab); box.appendChild(cell);
    });
  }
  box.querySelectorAll('canvas').forEach(c => {
    paint(c, c.dataset.n, S[c.dataset.n].pal, { scale: +c.dataset.s, sil: view.sil });
  });
}

/* ---------- poking ---------- */
function floatText(name, text) {
  const fig = document.getElementById('fig-' + name);
  const cv = cvs[name];
  const ch = DATA[name];
  const s = S[name];
  const spot = name === 'fox' ? { x: 21, y: PAD_TOP - 0.5 } : { x: 15.5, y: PAD_TOP - 0.5 };
  const el = document.createElement('span');
  el.className = 'float'; el.textContent = text;
  const left = cv.offsetLeft + (spot.x + (Math.random() - 0.5)) * s.scale;
  el.style.left = left + 'px';
  el.style.top = (cv.offsetTop + spot.y * s.scale) + 'px';
  fig.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}

const WORDS = { fox: ['嘤', '嘤嘤', '嘤？'], cat: ['呼噜', '呼噜呼噜', '喵'] };
function poke(name, quiet) {
  const t = now(), s = S[name];
  s.happyEnd = t + (name === 'fox' ? 950 : 1200);
  s.wagStart = t;
  s.wagEnd = t + (name === 'fox' ? 720 : 600);
  s.wagPeriod = name === 'fox' ? 90 : 150;
  if (name === 'fox' && !reduceMotion) s.hopStart = t;
  if (!quiet) {
    const w = WORDS[name];
    floatText(name, w[Math.floor(Math.random() * w.length)]);
  }
}
document.getElementById('fig-fox').addEventListener('click', () => poke('fox'));
document.getElementById('fig-cat').addEventListener('click', () => poke('cat'));

/* ---------- toggles ---------- */
function bindToggle(id, key) {
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    view[key] = !view[key];
    b.setAttribute('aria-pressed', String(view[key]));
    drawStage('fox', true); drawStage('cat', true);
    if (key === 'sil') drawTiny();
  });
}
bindToggle('t-sil', 'sil');
bindToggle('t-grid', 'grid');

/* ---------- go ---------- */
buildChips('fox');
buildChips('cat');
setTag('fox'); setTag('cat');
layout();
window.addEventListener('resize', layout);
requestAnimationFrame(loop);
</script>
</body>
</html>
