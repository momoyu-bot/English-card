<h2 class="sr-only">面孔知觉实验：同一块接线板，八个孔时读作插孔，减到两个孔时立刻读作一张脸</h2>
<div style="background:#241c15;border-radius:12px;padding:1.25rem 0;display:flex;justify-content:center">
<svg width="300" height="215" viewBox="0 0 300 215" role="img" aria-label="可切换孔数的接线板"><g id="holes"></g><path d="M112 148 Q150 190 188 148 Z" fill="#5c4527"/><path d="M152 172 C152 188 139 188 140 201" fill="none" stroke="#d98b76" stroke-width="6" stroke-linecap="round"/></svg>
</div>
<div style="margin-top:1rem"><button id="tg">八个孔</button></div>
<script>
(function(){
var eight=true,g=document.getElementById('holes'),tg=document.getElementById('tg');
function hole(cx,cy,r){
  var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#7d5c1e"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-3)+'" fill="#e8c877"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-11)+'" fill="#b8892f"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-18)+'" fill="#060606"/>';
  return s;
}
function paint(){
  var out='';
  if(eight){
    var xs=[48,116,184,252],ys=[50,114];
    for(var i=0;i<ys.length;i++){for(var j=0;j<xs.length;j++){out+=hole(xs[j],ys[i],30);}}
  }else{
    out+=hole(100,78,34);out+=hole(200,78,34);
  }
  g.innerHTML=out;
  tg.textContent=eight?'八个孔':'两个孔';
}
tg.onclick=function(){eight=!eight;paint();};
paint();
})();
</script>
