<style>
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tg{width:100%;text-align:left;font-size:14px}
.tg[aria-pressed="true"]{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.mc{background:var(--surface-1);border-radius:8px;padding:12px}
.ml{font-size:13px;color:var(--text-secondary);margin:0}
.mv{font-size:24px;font-weight:500;margin:4px 0 0;color:var(--text-primary)}
</style>
<h2 class="sr-only">交互演示：切换雪地纹理、太阳、远山雾化与对比度，观察各变量对画面明度分布的影响</h2>
<div style="padding:1rem 0">
<canvas id="cv" width="680" height="270" style="width:100%;border-radius:12px;display:block"></canvas>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:1rem">
<button class="tg" id="t1" aria-pressed="true">雪地纹理</button>
<button class="tg" id="t2" aria-pressed="false">太阳</button>
<button class="tg" id="t3" aria-pressed="true">远山雾化</button>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:1rem 0">
<label for="sc" style="font-size:14px;color:var(--text-secondary)">对比度</label>
<input type="range" id="sc" min="60" max="200" step="1" value="100" style="flex:1">
<span id="so" style="font-size:14px;font-weight:500;min-width:40px">1.00</span>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
<div class="mc"><p class="ml">最亮明度</p><p class="mv" id="m1">—</p></div>
<div class="mc"><p class="ml">明度跨度</p><p class="mv" id="m2">—</p></div>
<div class="mc"><p class="ml">高亮平面占比</p><p class="mv" id="m3">—</p></div>
</div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
var S={tex:true,sun:false,haze:true,con:1};
function seeded(s){return function(){s=(s*16807)%2147483647;return s/2147483647}}
function mix(a,b,t){var f=function(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]};
var x=f(a),y=f(b);return 'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')'}
function draw(){
var W=680,H=270,r=seeded(7),i;
var g=ctx.createLinearGradient(0,0,0,150);
g.addColorStop(0,S.sun?'#5B9BD8':'#A9C0D2');g.addColorStop(1,S.sun?'#D3E7F6':'#D6DFE6');
ctx.fillStyle=g;ctx.fillRect(0,0,W,150);
if(S.sun){ctx.fillStyle='#FFFBE8';ctx.beginPath();ctx.arc(120,52,44,0,6.3);ctx.fill();
ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(120,52,20,0,6.3);ctx.fill()}
var farD='#4A6E96',farL='#E8EFF5';
if(S.haze){farD=mix(farD,'#C3D2DE',0.62);farL=mix(farL,'#C3D2DE',0.45)}
ctx.fillStyle=farD;ctx.beginPath();ctx.moveTo(0,140);
for(i=0;i<=W;i+=34){ctx.lineTo(i,88+Math.sin(i*0.021)*26+r()*10)}
ctx.lineTo(W,140);ctx.closePath();ctx.fill();
ctx.fillStyle=farL;ctx.beginPath();ctx.moveTo(0,116);
for(i=0;i<=W;i+=34){ctx.lineTo(i,96+Math.sin(i*0.021)*22)}
ctx.lineTo(W,116);ctx.closePath();ctx.fill();
ctx.fillStyle='#33587F';ctx.beginPath();ctx.moveTo(0,152);
for(i=0;i<=W;i+=46){ctx.lineTo(i,112+Math.cos(i*0.016)*20+r()*8)}
ctx.lineTo(W,152);ctx.closePath();ctx.fill();
ctx.fillStyle='#F4F8FB';ctx.beginPath();ctx.moveTo(0,138);
for(i=0;i<=W;i+=46){ctx.lineTo(i,118+Math.cos(i*0.016)*16)}
ctx.lineTo(W,138);ctx.closePath();ctx.fill();
ctx.fillStyle=S.tex?'#F2F0E9':'#FEFEFE';ctx.fillRect(0,148,W,H-148);
for(i=0;i<11;i++){var bx=54+i*56,by=150+r()*8;
ctx.fillStyle='#EFEAE2';ctx.fillRect(bx,by,26,17);
ctx.fillStyle=S.sun?'#D4623A':'#A85A44';ctx.beginPath();
ctx.moveTo(bx-3,by);ctx.lineTo(bx+13,by-11);ctx.lineTo(bx+29,by);ctx.closePath();ctx.fill()}
for(i=0;i<22;i++){var tx=22+i*30+r()*12,ty=176+r()*66,sz=9+r()*7;
ctx.fillStyle=S.haze?'#3D6B4E':'#25563A';ctx.beginPath();
ctx.moveTo(tx,ty-sz*2.1);ctx.lineTo(tx-sz,ty);ctx.lineTo(tx+sz,ty);ctx.closePath();ctx.fill()}
if(S.tex){ctx.strokeStyle='rgba(150,158,170,0.34)';ctx.lineWidth=1;
for(i=0;i<34;i++){var yy=176+i*3.1;ctx.beginPath();ctx.moveTo(0,yy);
for(var x=0;x<=W;x+=24){ctx.lineTo(x,yy+Math.sin(x*0.03+i*1.4)*2.6)}ctx.stroke()}
ctx.strokeStyle='rgba(126,136,150,0.4)';ctx.lineWidth=2;
for(i=0;i<7;i++){ctx.beginPath();ctx.moveTo(90+i*82,H);
ctx.quadraticCurveTo(120+i*82,222,150+i*80,182);ctx.stroke()}}
ctx.fillStyle='#B23A48';ctx.fillRect(330,206,9,19);
ctx.fillStyle='#2E3F5C';ctx.fillRect(330,225,9,13);
if(S.con!==1){var d=ctx.getImageData(0,0,W,H),p=d.data;
for(i=0;i<p.length;i+=4){p[i]=Math.max(0,Math.min(255,(p[i]-128)*S.con+128));
p[i+1]=Math.max(0,Math.min(255,(p[i+1]-128)*S.con+128));
p[i+2]=Math.max(0,Math.min(255,(p[i+2]-128)*S.con+128))}
ctx.putImageData(d,0,0)}
var q=ctx.getImageData(0,0,W,H).data,mx=0,mn=255,hot=0,n=0;
for(i=0;i<q.length;i+=16){var L=0.2126*q[i]+0.7152*q[i+1]+0.0722*q[i+2];
if(L>mx)mx=L;if(L<mn)mn=L;if(L>238)hot++;n++}
document.getElementById('m1').textContent=Math.round(mx/2.55)+'%';
document.getElementById('m2').textContent=Math.round((mx-mn)/2.55)+'%';
document.getElementById('m3').textContent=Math.round(hot/n*100)+'%';
}
function tog(id,k){var b=document.getElementById(id);
b.addEventListener('click',function(){S[k]=!S[k];b.setAttribute('aria-pressed',S[k]);draw()})}
tog('t1','tex');tog('t2','sun');tog('t3','haze');
var sc=document.getElementById('sc');
sc.addEventListener('input',function(){S.con=sc.value/100;
document.getElementById('so').textContent=S.con.toFixed(2);draw()});
draw();
})();
</script>
