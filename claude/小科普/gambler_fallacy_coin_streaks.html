<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">抛 100 枚硬币的随机序列，高亮连续 4 枚以上的同面段，展示随机里连续段其实很常见。</h2>
<div style="padding: 0.5rem 0;">
  <button id="reroll" style="margin-bottom: 1.125rem;">
    <i class="ti ti-refresh" aria-hidden="true"></i> 再抛 100 枚
  </button>

  <div id="grid" style="display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin-bottom: 1.25rem;"></div>

  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.875rem 1rem;">
      <div style="font-size: 13px; color: var(--color-text-secondary);">最长连击</div>
      <div style="font-size: 24px; font-weight: 500;" id="longest">—</div>
    </div>
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.875rem 1rem;">
      <div style="font-size: 13px; color: var(--color-text-secondary);">连 4+ 的段数</div>
      <div style="font-size: 24px; font-weight: 500;" id="streaks">—</div>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 0.875rem; font-size: 12px; color: var(--color-text-secondary);">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#F0997B;vertical-align:middle;margin-right:5px;"></span>正面</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#85B7EB;vertical-align:middle;margin-right:5px;"></span>反面</span>
    <span>深色 = 连续 4 枚以上的段</span>
  </div>
</div>
<script>
(function(){
  var grid = document.getElementById('grid');
  var longestEl = document.getElementById('longest');
  var streaksEl = document.getElementById('streaks');
  var btn = document.getElementById('reroll');
  var COLORS = { H: ['#F0997B', '#993C1D'], T: ['#85B7EB', '#185FA5'] };
  function flip(){
    var seq = [];
    for (var i = 0; i < 100; i++) seq.push(Math.random() < 0.5 ? 'H' : 'T');
    return seq;
  }
  function analyze(seq){
    var inStreak = new Array(seq.length).fill(false);
    var longest = 1, streakCount = 0, i = 0;
    while (i < seq.length){
      var j = i;
      while (j < seq.length && seq[j] === seq[i]) j++;
      var len = j - i;
      if (len > longest) longest = len;
      if (len >= 4){
        streakCount++;
        for (var k = i; k < j; k++) inStreak[k] = true;
      }
      i = j;
    }
    return { inStreak: inStreak, longest: longest, streakCount: streakCount };
  }
  function render(){
    var seq = flip();
    var r = analyze(seq);
    grid.innerHTML = '';
    for (var idx = 0; idx < seq.length; idx++){
      var cell = document.createElement('div');
      cell.style.aspectRatio = '1';
      cell.style.borderRadius = '2px';
      cell.style.background = COLORS[seq[idx]][r.inStreak[idx] ? 1 : 0];
      grid.appendChild(cell);
    }
    longestEl.textContent = r.longest + ' 枚';
    streaksEl.textContent = r.streakCount + ' 次';
  }
  btn.addEventListener('click', render);
  render();
})();
</script>
