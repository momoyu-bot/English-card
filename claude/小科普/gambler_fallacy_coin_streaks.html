<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>连着开九个正面很正常</title>
<meta name="description" content="抛一百枚硬币，把连续四枚以上的同面段涂深——随机里的连击比你以为的多得多。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">抛 100 枚硬币的随机序列，高亮连续 4 枚以上的同面段，展示随机里连续段其实很常见。</h2>
<div style="padding: 0.5rem 0;">
  <button id="reroll" style="margin-bottom: 1.125rem;">
    <i class="ti ti-refresh" aria-hidden="true"></i> 再抛 100 枚
  </button>

  <div id="grid" style="display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin-bottom: 1.25rem;"></div>

  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.875rem 1rem;">
      <div style="font-size: 13px; color: var(--color-text-secondary);">最长连击</div>
      <div style="font-size: 24px; font-weight: 500;" id="longest">—</div>
    </div>
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.875rem 1rem;">
      <div style="font-size: 13px; color: var(--color-text-secondary);">连 4+ 的段数</div>
      <div style="font-size: 24px; font-weight: 500;" id="streaks">—</div>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 0.875rem; font-size: 12px; color: var(--color-text-secondary);">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#F0997B;vertical-align:middle;margin-right:5px;"></span>正面</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#85B7EB;vertical-align:middle;margin-right:5px;"></span>反面</span>
    <span>深色 = 连续 4 枚以上的段</span>
  </div>
</div>
<script>
(function(){
  var grid = document.getElementById('grid');
  var longestEl = document.getElementById('longest');
  var streaksEl = document.getElementById('streaks');
  var btn = document.getElementById('reroll');
  var COLORS = { H: ['#F0997B', '#993C1D'], T: ['#85B7EB', '#185FA5'] };
  function flip(){
    var seq = [];
    for (var i = 0; i < 100; i++) seq.push(Math.random() < 0.5 ? 'H' : 'T');
    return seq;
  }
  function analyze(seq){
    var inStreak = new Array(seq.length).fill(false);
    var longest = 1, streakCount = 0, i = 0;
    while (i < seq.length){
      var j = i;
      while (j < seq.length && seq[j] === seq[i]) j++;
      var len = j - i;
      if (len > longest) longest = len;
      if (len >= 4){
        streakCount++;
        for (var k = i; k < j; k++) inStreak[k] = true;
      }
      i = j;
    }
    return { inStreak: inStreak, longest: longest, streakCount: streakCount };
  }
  function render(){
    var seq = flip();
    var r = analyze(seq);
    grid.innerHTML = '';
    for (var idx = 0; idx < seq.length; idx++){
      var cell = document.createElement('div');
      cell.style.aspectRatio = '1';
      cell.style.borderRadius = '2px';
      cell.style.background = COLORS[seq[idx]][r.inStreak[idx] ? 1 : 0];
      grid.appendChild(cell);
    }
    longestEl.textContent = r.longest + ' 枚';
    streaksEl.textContent = r.streakCount + ' 次';
  }
  btn.addEventListener('click', render);
  render();
})();
</script>
</body>
</html>
