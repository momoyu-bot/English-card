<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>断网也能跑</title>
</head>
<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="外面的包一个都进不来，四面弹回 403，这一整页照样跑得欢。">
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

:root{
  --bg:#15110e; --panel:#1c1714; --line:#3a2f28;
  --amber:#f0a35e; --cyan:#5fb3c4; --red:#e06a5e; --green:#7fb985;
  --tx:#f3e6d6; --tx2:#c9a87f; --tx3:#9a8f82;
  --font-mono: ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace;
  --font-sans: ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--font-mono);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:34px 16px;
}
.wrap{width:100%; max-width:600px;}
.eyebrow{
  font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--tx3); margin:0 0 12px 4px;
}
.panel{
  background:var(--panel); border:1px solid var(--line);
  border-radius:14px; overflow:hidden;
}
.bar{
  display:flex; align-items:center; gap:8px;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.dot{width:11px; height:11px; border-radius:50%;}
.bar-title{
  margin-left:10px; font-size:12.5px; color:var(--tx3); letter-spacing:0.02em;
}
.stage{padding:10px 14px 2px;}
.log{padding:6px 22px 16px;}
.row{
  display:grid; grid-template-columns:108px 1fr;
  align-items:baseline; font-size:13px; line-height:2.1;
}
.row .k{color:var(--tx3);}
.row .k::before{content:"> "; color:var(--amber);}
.v-off{color:var(--red);}
.v-ok{color:var(--green);}
.v-no{color:var(--red);}
.dim{color:var(--tx3);}
.toggle-row{
  display:flex; align-items:center; gap:14px;
  padding:15px 22px; border-top:1px solid var(--line);
}
.switch{
  position:relative; width:42px; height:24px; border-radius:12px;
  background:#3a2f28; border:1px solid var(--line);
  cursor:pointer; padding:0; flex:none; transition:background .25s,border-color .25s;
}
.switch:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
.knob{
  position:absolute; top:2px; left:2px; width:18px; height:18px;
  border-radius:50%; background:var(--tx2); transition:transform .25s,background .25s;
}
.switch.on{background:rgba(127,185,133,0.22); border-color:var(--green);}
.switch.on .knob{transform:translateX(18px); background:var(--green);}
.sw-label{font-size:13px; color:var(--tx2);}
.quip{
  padding:13px 22px 17px; font-size:12.5px; line-height:1.6;
  color:var(--tx3); border-top:1px solid var(--line);
}
.note{
  margin:20px 4px 0; font-family:var(--font-sans);
  font-size:13.5px; line-height:1.75; color:var(--tx2); text-align:center;
}
.note b{color:var(--amber); font-weight:500;}
@media (max-width:440px){
  .row{grid-template-columns:90px 1fr; font-size:12.5px;}
  .bar-title{font-size:11.5px;}
}
</style>

<div class="wrap">
  <p class="eyebrow">克宝 · 现场演示</p>
  <div class="panel">
    <div class="bar">
      <span class="dot" style="background:#e0726a"></span>
      <span class="dot" style="background:#e0b15a"></span>
      <span class="dot" style="background:#7fb985"></span>
      <span class="bar-title">sandbox-monitor · mo.local</span>
    </div>

    <div class="stage">
      <svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg">
        <title>断网沙盒</title>
        <desc>中心一个发光的沙盒被一圈屏障环绕，四个方向飞来的数据包撞到屏障弹开并闪出 403，象征沙盒断网隔离、内部照常运行。</desc>
        <style>
        .glow{fill:#f0a35e;}
        .corebox{fill:rgba(240,163,94,0.14);stroke:#f0a35e;stroke-width:1.2;}
        .barrier{fill:none;stroke:#5fb3c4;stroke-width:1.4;stroke-dasharray:5 6;}
        .tcore{fill:#f3e6d6;font-family:var(--font-sans);}
        .tsub{fill:#d9b489;font-family:var(--font-sans);}
        .t403{fill:#ec8a7d;font-family:var(--font-mono);font-weight:500;}
        </style>
        <rect class="glow" x="262" y="118" width="156" height="104" rx="16" opacity="0.05"><animate attributeName="opacity" values="0.04;0.1;0.04" dur="3.6s" repeatCount="indefinite"/></rect>
        <rect class="glow" x="274" y="128" width="132" height="84" rx="13" opacity="0.08"><animate attributeName="opacity" values="0.06;0.14;0.06" dur="3.6s" repeatCount="indefinite"/></rect>
        <ellipse class="barrier" cx="340" cy="170" rx="132" ry="90" opacity="0.35"><animate attributeName="opacity" values="0.3;0.55;0.3" dur="3.5s" repeatCount="indefinite"/><animate attributeName="stroke-dashoffset" from="0" to="22" dur="1.4s" repeatCount="indefinite"/></ellipse>
        <rect class="corebox" x="282" y="137" width="116" height="66" rx="11"/>
        <text class="tcore" x="340" y="166" text-anchor="middle" font-size="15" font-weight="500">sandbox</text>
        <text class="tsub" x="340" y="186" text-anchor="middle" font-size="11.5">断网也能跑 ✓</text>

        <circle cx="70" cy="170" r="5.5" fill="#8a8278" opacity="0">
          <animate attributeName="cx" values="70;210;70" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.5;0.78;1" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#8a8278;#8a8278;#e06a5e;#e06a5e;#8a8278" keyTimes="0;0.45;0.5;0.62;1" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text class="t403" x="190" y="158" text-anchor="end" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.48;0.52;0.65;1" dur="2.6s" repeatCount="indefinite"/>403</text>

        <circle cx="610" cy="170" r="5.5" fill="#8a8278" opacity="0">
          <animate attributeName="cx" values="610;470;610" keyTimes="0;0.5;1" dur="2.9s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.5;0.78;1" dur="2.9s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#8a8278;#8a8278;#e06a5e;#e06a5e;#8a8278" keyTimes="0;0.45;0.5;0.62;1" dur="2.9s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <text class="t403" x="492" y="160" text-anchor="start" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.48;0.52;0.65;1" dur="2.9s" begin="0.4s" repeatCount="indefinite"/>403</text>

        <circle cx="340" cy="30" r="5.5" fill="#8a8278" opacity="0">
          <animate attributeName="cy" values="30;82;30" keyTimes="0;0.5;1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.5;0.78;1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#8a8278;#8a8278;#e06a5e;#e06a5e;#8a8278" keyTimes="0;0.45;0.5;0.62;1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <text class="t403" x="358" y="72" text-anchor="start" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.48;0.52;0.65;1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>403</text>

        <circle cx="340" cy="312" r="5.5" fill="#8a8278" opacity="0">
          <animate attributeName="cy" values="312;258;312" keyTimes="0;0.5;1" dur="2.3s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.5;0.78;1" dur="2.3s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#8a8278;#8a8278;#e06a5e;#e06a5e;#8a8278" keyTimes="0;0.45;0.5;0.62;1" dur="2.3s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
        <text class="t403" x="358" y="276" text-anchor="start" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.48;0.52;0.65;1" dur="2.3s" begin="1.5s" repeatCount="indefinite"/>403</text>
      </svg>
    </div>

    <div class="log">
      <div class="row"><span class="k">egress</span><span><span class="v-off">off</span> <span class="dim">· 已隔离</span></span></div>
      <div class="row"><span class="k">packages</span><span><span class="v-ok">ready</span> <span class="dim">· pandas openpyxl docx svg html</span></span></div>
      <div class="row"><span class="k">incoming</span><span class="v-no">403 host_not_allowed</span></div>
    </div>

    <div class="toggle-row">
      <button class="switch" id="sw" role="switch" aria-checked="false" aria-label="切换 egress 网络出口"><span class="knob"></span></button>
      <span class="sw-label" id="swlabel">egress: <span style="color:var(--red)">off</span></span>
    </div>
    <div class="quip" id="quip">隔离中：外面的包一个都进不来，可里面照样跑得欢。</div>
  </div>

  <p class="note">这一整页——会动的盒子、脉动的屏障、四面弹回的 403——<b>没碰任何网络</b>就跑起来了。花里胡哨靠的是怎么写，不是那个开关。</p>
</div>

<script>
(function(){
  var sw=document.getElementById('sw'),
      lbl=document.getElementById('swlabel'),
      quip=document.getElementById('quip'),
      on=false;
  sw.addEventListener('click',function(){
    on=!on;
    sw.classList.toggle('on',on);
    sw.setAttribute('aria-checked', on ? 'true':'false');
    lbl.innerHTML = on
      ? 'egress: <span style="color:var(--green)">on</span>'
      : 'egress: <span style="color:var(--red)">off</span>';
    quip.textContent = on
      ? '开了也就是能 pip install 罢了——这页的花里胡哨，它一点都管不着。'
      : '隔离中：外面的包一个都进不来，可里面照样跑得欢。';
  });
  try{
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
      var svg=document.querySelector('svg');
      if(svg && svg.pauseAnimations) svg.pauseAnimations();
    }
  }catch(e){}
})();
</script>

</body>
</html>
