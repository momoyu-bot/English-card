<h2 class="sr-only">插孔黑洞感的拆解实验：可以开关金环、切换环的颜色、切换中心的明度，观察黑洞感何时消失</h2>
<div style="background:#241c15;border-radius:12px;padding:1.5rem 0;display:flex;justify-content:center">
<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="一个可调的插孔"><circle id="r0" cx="90" cy="90" r="70" fill="#7d5c1e"/><circle id="r1" cx="90" cy="90" r="64" fill="#e8c877"/><circle id="r2" cx="90" cy="90" r="48" fill="#b8892f"/><circle id="core" cx="90" cy="90" r="32" fill="#050505"/></svg>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem">
<button id="b1">有金环</button>
<button id="b2">金色</button>
<button id="b3">纯黑</button>
</div>
<p id="note" style="font-size:13px;color:var(--text-secondary);margin-top:12px"></p>
<script>
(function(){
var ring=1,gold=1,black=1;
var r0=document.getElementById('r0'),r1=document.getElementById('r1'),r2=document.getElementById('r2'),core=document.getElementById('core');
var b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),note=document.getElementById('note');
function paint(){
  var d=ring?'':'none';
  r0.style.display=d;r1.style.display=d;r2.style.display=d;
  r0.setAttribute('fill',gold?'#7d5c1e':'#5f5f5f');
  r1.setAttribute('fill',gold?'#e8c877':'#dedede');
  r2.setAttribute('fill',gold?'#b8892f':'#9a9a9a');
  core.setAttribute('fill',black?'#050505':'#57504a');
  b1.textContent=ring?'有金环':'没有环';
  b2.textContent=gold?'金色':'银色';
  b3.textContent=black?'纯黑':'深灰';
  note.textContent='现在：'+(ring?(gold?'金环':'银环'):'没有环')+' · '+(black?'纯黑':'深灰');
}
b1.onclick=function(){ring=!ring;paint();};
b2.onclick=function(){gold=!gold;paint();};
b3.onclick=function(){black=!black;paint();};
paint();
})();
</script>
