<h2 class="sr-only">对比演示:把字符画的每一行分别放进代码块会让图案碎成三段、且第三个未闭合;正确做法是用一对反引号把整段一起包住</h2>
<style>
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
.lbl { font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:6px; font-weight:500; }
.codeblock { background: var(--color-background-tertiary); border:0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding:12px 16px; font-family: var(--font-mono); font-size:16px; line-height:1.55; color: var(--color-text-primary); }
.fence-pill { background: var(--color-background-success); color: var(--color-text-success); padding:1px 6px; border-radius:4px; font-weight:500; }
.note { font-family: var(--font-sans); font-size:12px; color: var(--color-text-secondary); }
</style>
<div style="margin: 1rem 0 1.75rem;">
  <div class="lbl" style="color: var(--color-text-danger);"><i class="ti ti-x" aria-hidden="true"></i> 你刚才这样 · 一行单独包一个</div>
  <div class="codeblock" style="margin-bottom:6px;">/\_/\</div>
  <div class="codeblock" style="margin-bottom:6px;">( o.o )</div>
  <div style="background: var(--color-background-danger); border:0.5px dashed var(--color-border-danger); border-radius: var(--border-radius-md); padding:12px 16px; font-family: var(--font-mono); font-size:16px; color: var(--color-text-danger);">```&gt; ^ &lt;  <span class="note" style="color: var(--color-text-danger);">← 反引号黏在内容上、又没关门,泄气了</span></div>
  <div style="font-size:13px; color: var(--color-text-secondary); margin-top:10px;">前两行各自成了一个框,猫被切成了三段;第三行那个笼子没搭成。</div>
</div>
<div>
  <div class="lbl" style="color: var(--color-text-success);"><i class="ti ti-check" aria-hidden="true"></i> 应该这样 · 一对反引号罩住整只猫</div>
  <div class="codeblock">
<div style="margin-bottom:4px;"><span class="fence-pill">```</span> <span class="note">← 开笼门(单独一行)</span></div>
<div style="white-space:pre;"> /\_/\</div>
<div style="white-space:pre;">( o.o )</div>
<div style="white-space:pre;"> &gt; ^ &lt;</div>
<div style="margin-top:4px;"><span class="fence-pill">```</span> <span class="note">← 关笼门(千万别忘)</span></div>
  </div>
  <div style="font-size:13px; color: var(--color-text-secondary); margin-top:10px;">一对反引号各占一行,把三行猫整个夹在中间——这才拼得回一整只完整的猫。</div>
</div>
