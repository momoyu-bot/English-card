<title>拖滑块画一只猫</title>
<meta name="description" content="调脸的大小位置、耳朵尖不尖、眼距、嘴角，底下实时显示对应的代码。">
<h2 class="sr-only">SVG 互动实验室：调整滑块实时改变小猫的形状、位置和颜色，下方实时显示对应的 SVG 代码。</h2>

<div style="padding: 1rem 0;">

<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
    <span style="font-size: 15px; font-weight: 500;">SVG 几何属性实时映射</span>
    <span id="preset-label" style="font-size: 12px; color: var(--color-text-secondary);">自由调节中</span>
  </div>

  <div style="background: var(--color-background-primary); border-radius: var(--border-radius-md); padding: 12px; position: relative;">
    <svg id="stage" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; display: block;">
      <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M 50 0 L 0 0 0 50" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="600" height="400" fill="url(#grid)"/>

      <g id="left-ear"></g>
      <g id="right-ear"></g>
      <circle id="face" />
      <circle id="eye-l" />
      <circle id="eye-r" />
      <ellipse id="nose" />
      <path id="mouth" fill="none" stroke-linecap="round" stroke-width="3" />
      <g id="whiskers" stroke-width="1.5" stroke-linecap="round"></g>
      <g id="coord-badge" style="pointer-events: none;"></g>
    </svg>
  </div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 1rem;">

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <label style="font-size: 13px; color: var(--color-text-secondary);">脸部中心 X（cx）</label>
      <span id="cx-out" style="font-size: 13px; font-weight: 500;">300</span>
    </div>
    <input type="range" id="cx" min="150" max="450" value="300" step="1" style="width: 100%;" />
  </div>

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <label style="font-size: 13px; color: var(--color-text-secondary);">脸部中心 Y（cy）</label>
      <span id="cy-out" style="font-size: 13px; font-weight: 500;">210</span>
    </div>
    <input type="range" id="cy" min="120" max="290" value="210" step="1" style="width: 100%;" />
  </div>

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <label style="font-size: 13px; color: var(--color-text-secondary);">脸部半径（r）</label>
      <span id="r-out" style="font-size: 13px; font-weight: 500;">85</span>
    </div>
    <input type="range" id="r" min="40" max="120" value="85" step="1" style="width: 100%;" />
  </div>

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <label style="font-size: 13px; color: var(--color-text-secondary);">耳朵尖锐度</label>
      <span id="ear-out" style="font-size: 13px; font-weight: 500;">1.0</span>
    </div>
    <input type="range" id="ear" min="0.3" max="1.8" value="1.0" step="0.05" style="width: 100%;" />
  </div>

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <label style="font-size: 13px; color: var(--color-text-secondary);">眼距</label>
      <span id="eye-out" style="font-size: 13px; font-weight: 500;">0.40</span>
    </div>
    <input type="range" id="eye" min="0.15" max="0.65" value="0.40" step="0.01" style="width: 100%;" />
  </div>

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <label style="font-size: 13px; color: var(--color-text-secondary);">嘴角弧度</label>
      <span id="smile-out" style="font-size: 13px; font-weight: 500;">0.5</span>
    </div>
    <input type="range" id="smile" min="-0.8" max="1.2" value="0.5" step="0.05" style="width: 100%;" />
  </div>

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; grid-column: 1 / -1;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <label style="font-size: 13px; color: var(--color-text-secondary);">填充色</label>
      <span id="color-out" style="font-size: 13px; font-weight: 500; font-family: var(--font-mono);">#7F77DD</span>
    </div>
    <div id="swatches" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
  </div>

</div>

<div style="display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap;">
  <button data-preset="default" style="flex: 1; min-width: 80px;">默认</button>
  <button data-preset="chonky" style="flex: 1; min-width: 80px;">圆胖款</button>
  <button data-preset="sharp" style="flex: 1; min-width: 80px;">尖耳款</button>
  <button data-preset="sad" style="flex: 1; min-width: 80px;">委屈款</button>
  <button data-preset="wide" style="flex: 1; min-width: 80px;">呆萌款</button>
</div>

<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 16px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
    <span style="font-size: 12px; color: var(--color-text-secondary); font-family: var(--font-mono);">实时生成的 SVG 代码</span>
    <button id="copy-btn" style="padding: 4px 10px; font-size: 12px;">复制</button>
  </div>
  <pre id="code-out" style="margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; color: var(--color-text-primary); white-space: pre-wrap; word-break: break-all;"></pre>
</div>

</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const cxI = $('cx'), cyI = $('cy'), rI = $('r'), earI = $('ear'), eyeI = $('eye'), smileI = $('smile');
  const cxO = $('cx-out'), cyO = $('cy-out'), rO = $('r-out'), earO = $('ear-out'), eyeO = $('eye-out'), smileO = $('smile-out'), colorO = $('color-out');
  const face = $('face'), leftEar = $('left-ear'), rightEar = $('right-ear');
  const eyeL = $('eye-l'), eyeR = $('eye-r'), nose = $('nose'), mouth = $('mouth'), whiskers = $('whiskers'), badge = $('coord-badge');
  const codeOut = $('code-out');
  const presetLabel = $('preset-label');

  const palette = [
    { hex: '#7F77DD', dark: '#3C3489' },
    { hex: '#1D9E75', dark: '#085041' },
    { hex: '#D85A30', dark: '#712B13' },
    { hex: '#D4537E', dark: '#72243E' },
    { hex: '#378ADD', dark: '#0C447C' },
    { hex: '#EF9F27', dark: '#633806' },
    { hex: '#5F5E5A', dark: '#2C2C2A' }
  ];
  let currentColor = palette[0].hex;
  let currentDark = palette[0].dark;

  const swatchWrap = $('swatches');
  palette.forEach((c, i) => {
    const b = document.createElement('button');
    b.setAttribute('data-color', c.hex);
    b.setAttribute('data-dark', c.dark);
    b.style.cssText = `width: 28px; height: 28px; padding: 0; border-radius: 50%; background: ${c.hex}; border: 2px solid ${i === 0 ? 'var(--color-text-primary)' : 'transparent'}; cursor: pointer;`;
    swatchWrap.appendChild(b);
  });

  swatchWrap.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-color]');
    if (!btn) return;
    currentColor = btn.getAttribute('data-color');
    currentDark = btn.getAttribute('data-dark');
    colorO.textContent = currentColor;
    [...swatchWrap.children].forEach(c => c.style.borderColor = 'transparent');
    btn.style.borderColor = 'var(--color-text-primary)';
    render();
  });

  function render() {
    const cx = +cxI.value;
    const cy = +cyI.value;
    const r = +rI.value;
    const ear = +earI.value;
    const eyeSpread = +eyeI.value;
    const smile = +smileI.value;

    cxO.textContent = cx;
    cyO.textContent = cy;
    rO.textContent = r;
    earO.textContent = ear.toFixed(2);
    eyeO.textContent = eyeSpread.toFixed(2);
    smileO.textContent = smile.toFixed(2);

    face.setAttribute('cx', cx);
    face.setAttribute('cy', cy);
    face.setAttribute('r', r);
    face.setAttribute('fill', currentColor);

    const earBase = r * 0.55;
    const earHeight = r * 0.9 * ear;
    const earOffsetX = r * 0.6;
    const earOffsetY = r * 0.55;

    const lx1 = cx - earOffsetX - earBase / 2;
    const lx2 = cx - earOffsetX + earBase / 2;
    const ly = cy - earOffsetY;
    const ltipX = cx - earOffsetX;
    const ltipY = cy - earOffsetY - earHeight;

    const rx1 = cx + earOffsetX - earBase / 2;
    const rx2 = cx + earOffsetX + earBase / 2;
    const ry = cy - earOffsetY;
    const rtipX = cx + earOffsetX;
    const rtipY = cy - earOffsetY - earHeight;

    leftEar.innerHTML = `<polygon points="${lx1},${ly} ${lx2},${ly} ${ltipX},${ltipY}" fill="${currentColor}"/>`;
    rightEar.innerHTML = `<polygon points="${rx1},${ry} ${rx2},${ry} ${rtipX},${rtipY}" fill="${currentColor}"/>`;

    const eyeY = cy - r * 0.1;
    const eyeLX = cx - r * eyeSpread;
    const eyeRX = cx + r * eyeSpread;
    const eyeRadius = Math.max(3, r * 0.1);

    eyeL.setAttribute('cx', eyeLX);
    eyeL.setAttribute('cy', eyeY);
    eyeL.setAttribute('r', eyeRadius);
    eyeL.setAttribute('fill', '#ffffff');

    eyeR.setAttribute('cx', eyeRX);
    eyeR.setAttribute('cy', eyeY);
    eyeR.setAttribute('r', eyeRadius);
    eyeR.setAttribute('fill', '#ffffff');

    nose.setAttribute('cx', cx);
    nose.setAttribute('cy', cy + r * 0.15);
    nose.setAttribute('rx', r * 0.08);
    nose.setAttribute('ry', r * 0.05);
    nose.setAttribute('fill', '#ffffff');

    const mouthY = cy + r * 0.35;
    const mouthSpan = r * 0.3;
    const dip = smile * r * 0.25;
    const mouthPath = `M ${cx - mouthSpan} ${mouthY} Q ${cx} ${mouthY + dip} ${cx + mouthSpan} ${mouthY}`;
    mouth.setAttribute('d', mouthPath);
    mouth.setAttribute('stroke', '#ffffff');

    const whiskerLines = [];
    for (let i = -1; i <= 1; i++) {
      const offset = i * r * 0.08;
      const y = cy + r * 0.18 + offset;
      whiskerLines.push(`<line x1="${cx - r * 0.15}" y1="${y}" x2="${cx - r * 0.55}" y2="${y - offset * 0.5}" stroke="${currentColor}" opacity="0.6"/>`);
      whiskerLines.push(`<line x1="${cx + r * 0.15}" y1="${y}" x2="${cx + r * 0.55}" y2="${y - offset * 0.5}" stroke="${currentColor}" opacity="0.6"/>`);
    }
    whiskers.innerHTML = whiskerLines.join('');

    const badgeX = cx - 55, badgeY = cy - 10;
    badge.innerHTML = `
      <rect x="${badgeX}" y="${badgeY}" width="110" height="22" rx="11" fill="#ffffff" stroke="${currentDark}" stroke-width="1"/>
      <text x="${cx}" y="${badgeY + 15}" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="${currentDark}">cx:${cx} cy:${cy} r:${r}</text>
    `;

    const code = `<svg viewBox="0 0 600 400">
  <!-- 左耳 -->
  <polygon points="${lx1},${ly} ${lx2},${ly} ${ltipX},${ltipY}" fill="${currentColor}"/>
  <!-- 右耳 -->
  <polygon points="${rx1},${ry} ${rx2},${ry} ${rtipX},${rtipY}" fill="${currentColor}"/>
  <!-- 脸 -->
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="${currentColor}"/>
  <!-- 眼睛 -->
  <circle cx="${eyeLX.toFixed(0)}" cy="${eyeY.toFixed(0)}" r="${eyeRadius.toFixed(0)}" fill="#fff"/>
  <circle cx="${eyeRX.toFixed(0)}" cy="${eyeY.toFixed(0)}" r="${eyeRadius.toFixed(0)}" fill="#fff"/>
  <!-- 嘴 -->
  <path d="${mouthPath.replace(/(\d+\.\d{1,})/g, (m) => (+m).toFixed(0))}" fill="none" stroke="#fff" stroke-width="3"/>
</svg>`;
    codeOut.textContent = code;
  }

  [cxI, cyI, rI, earI, eyeI, smileI].forEach(el => {
    el.addEventListener('input', () => {
      presetLabel.textContent = '自由调节中';
      render();
    });
  });

  const presets = {
    default: { cx: 300, cy: 210, r: 85, ear: 1.0, eye: 0.40, smile: 0.5, label: '默认' },
    chonky:  { cx: 300, cy: 230, r: 115, ear: 0.55, eye: 0.32, smile: 0.3, label: '圆胖款' },
    sharp:   { cx: 300, cy: 220, r: 75, ear: 1.65, eye: 0.42, smile: 0.1, label: '尖耳款' },
    sad:     { cx: 300, cy: 215, r: 85, ear: 0.9, eye: 0.38, smile: -0.6, label: '委屈款' },
    wide:    { cx: 300, cy: 220, r: 90, ear: 0.75, eye: 0.58, smile: 0.8, label: '呆萌款' }
  };

  document.querySelectorAll('button[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = presets[btn.getAttribute('data-preset')];
      cxI.value = p.cx; cyI.value = p.cy; rI.value = p.r;
      earI.value = p.ear; eyeI.value = p.eye; smileI.value = p.smile;
      presetLabel.textContent = p.label;
      render();
    });
  });

  $('copy-btn').addEventListener('click', () => {
    const btn = $('copy-btn');
    navigator.clipboard.writeText(codeOut.textContent).then(() => {
      const old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => btn.textContent = old, 1200);
    }).catch(() => {
      btn.textContent = '手动选中复制';
      setTimeout(() => btn.textContent = '复制', 1500);
    });
  });

  render();
})();
</script>
