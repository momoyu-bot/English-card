<svg width="100%" viewBox="0 0 680 552" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">平台处置用户与用户追究平台所需步骤的对比</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">左列显示平台处置用户只需两步：直接执行下架封号冻结资金，然后结束，不需要任何第三方同意。右列显示用户追究平台需要六步：先找客服、提交争议通知、善意协商六十天、提交个人仲裁、拿到保密裁决、最后还要回到法院申请执行。左列下方大片留白即为两者的落差。</desc>
