<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一句话被切成几块</title>
<meta name="description" content="按字符、按字节、按词、按子词四种切法，同一句话切出来的块数差很多。">
</head>
<body>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.tk-wrap { padding: 1rem 0; }
.tk-input {
  width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical;
  padding: 12px; font-size: 15px; line-height: 1.6;
  font-family: var(--font-sans);
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  color: var(--color-text-primary);
}
.tk-input:focus { outline: none; box-shadow: 0 0 0 2px var(--color-border-secondary); }
.tk-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.tk-label { font-size: 13px; color: var(--color-text-secondary); margin-right: 4px; }
.tk-chip {
  padding: 6px 12px; font-size: 13px; cursor: pointer;
  background: transparent; color: var(--color-text-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  font-family: var(--font-sans);
  transition: background 0.15s;
}
.tk-chip:hover { background: var(--color-background-secondary); }
.tk-tabs { display: flex; gap: 6px; margin: 1rem 0; flex-wrap: wrap; }
.tk-tab {
  padding: 8px 14px; font-size: 14px; cursor: pointer;
  background: transparent; color: var(--color-text-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  font-family: var(--font-sans);
  transition: all 0.15s;
}
.tk-tab:hover { background: var(--color-background-secondary); }
.tk-tab.active {
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
  border-color: var(--color-border-secondary);
  font-weight: 500;
}
.tk-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 1rem 0; }
.tk-stat {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-md);
  padding: 14px 16px;
}
.tk-stat-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px; }
.tk-stat-val { font-size: 24px; font-weight: 500; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
.tk-tokens {
  padding: 16px; min-height: 80px;
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-md);
  margin: 1rem 0;
  line-height: 2.2;
  word-break: break-all;
}
.token {
  display: inline-block;
  padding: 3px 8px; margin: 2px;
  border-radius: 6px; border: 0.5px solid;
  font-family: var(--font-mono);
  font-size: 14px;
  white-space: pre;
}
.token.space::before { content: '·'; opacity: 0.4; }
.tc-0 { background: #E6F1FB; color: #0C447C; border-color: rgba(12,68,124,0.18); }
.tc-1 { background: #E1F5EE; color: #085041; border-color: rgba(8,80,65,0.18); }
.tc-2 { background: #FAEEDA; color: #633806; border-color: rgba(99,56,6,0.18); }
.tc-3 { background: #EEEDFE; color: #3C3489; border-color: rgba(60,52,137,0.18); }
.tc-4 { background: #FBEAF0; color: #72243E; border-color: rgba(114,36,62,0.18); }
.tc-5 { background: #FAECE7; color: #712B13; border-color: rgba(113,43,19,0.18); }
@media (prefers-color-scheme: dark) {
  .tc-0 { background: rgba(133,183,235,0.14); color: #B5D4F4; border-color: rgba(133,183,235,0.3); }
  .tc-1 { background: rgba(159,225,203,0.12); color: #9FE1CB; border-color: rgba(159,225,203,0.3); }
  .tc-2 { background: rgba(250,199,117,0.12); color: #FAC775; border-color: rgba(250,199,117,0.3); }
  .tc-3 { background: rgba(206,203,246,0.12); color: #CECBF6; border-color: rgba(206,203,246,0.3); }
  .tc-4 { background: rgba(244,192,209,0.12); color: #F4C0D1; border-color: rgba(244,192,209,0.3); }
  .tc-5 { background: rgba(245,196,179,0.12); color: #F5C4B3; border-color: rgba(245,196,179,0.3); }
}
.tk-explain {
  padding: 14px 16px;
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  font-size: 14px;
  line-height: 1.7;
  color: var(--color-text-secondary);
}
.tk-explain b { color: var(--color-text-primary); font-weight: 500; }
.tk-pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.tk-pros, .tk-cons {
  padding: 10px 12px; border-radius: var(--border-radius-md); font-size: 13px;
}
.tk-pros { background: var(--color-background-success); color: var(--color-text-success); }
.tk-cons { background: var(--color-background-danger); color: var(--color-text-danger); }
.tk-pros b, .tk-cons b { display: block; margin-bottom: 4px; font-weight: 500; }
</style>

<h2 class="sr-only">Interactive tokenization comparison tool with four methods: character, byte, word, and simplified BPE.</h2>

<div class="tk-wrap">
  <textarea class="tk-input" id="tk-input">大模型 Tokenization 是怎么切分的？我今天很开心。</textarea>

  <div class="tk-row">
    <span class="tk-label">示例：</span>
    <button class="tk-chip" data-ex="大模型 Tokenization 是怎么切分的？我今天很开心。">中英混合</button>
    <button class="tk-chip" data-ex="The quick brown fox jumps over the lazy dog.">纯英文</button>
    <button class="tk-chip" data-ex="我爱吃葡萄，但是我不吃葡萄皮。">纯中文</button>
    <button class="tk-chip" data-ex="બંને 古吉拉特语漏出来了！">小语种漏字</button>
    <button class="tk-chip" data-ex="function tokenize(text) { return text.split(''); }">代码片段</button>
  </div>

  <div class="tk-tabs" id="tk-tabs">
    <button class="tk-tab active" data-m="char">字符级 Character</button>
    <button class="tk-tab" data-m="byte">字节级 Byte (UTF-8)</button>
    <button class="tk-tab" data-m="word">词级 Word</button>
    <button class="tk-tab" data-m="bpe">BPE 子词</button>
  </div>

  <div class="tk-stats">
    <div class="tk-stat"><div class="tk-stat-label">Token 数</div><div class="tk-stat-val" id="tk-count">0</div></div>
    <div class="tk-stat"><div class="tk-stat-label">字符数</div><div class="tk-stat-val" id="tk-chars">0</div></div>
    <div class="tk-stat"><div class="tk-stat-label">压缩率</div><div class="tk-stat-val" id="tk-ratio">1.00</div></div>
  </div>

  <div class="tk-tokens" id="tk-out"></div>

  <div class="tk-explain" id="tk-explain"></div>
</div>

<script>
(function() {
  const input = document.getElementById('tk-input');
  const tabs = document.getElementById('tk-tabs');
  const out = document.getElementById('tk-out');
  const countEl = document.getElementById('tk-count');
  const charsEl = document.getElementById('tk-chars');
  const ratioEl = document.getElementById('tk-ratio');
  const explainEl = document.getElementById('tk-explain');

  let method = 'char';

  // 简化 BPE 词表（按长度排序优先匹配长的）
  const bpeVocab = [
    // 中文常见多字词
    '大模型', '人工智能', '机器学习', '深度学习', '神经网络',
    '今天', '明天', '昨天', '现在', '什么', '为什么', '因为', '所以', '但是', '不过', '虽然', '然后',
    '我们', '你们', '他们', '她们', '它们', '自己', '这个', '那个', '这样', '那样', '怎么', '怎样',
    '模型', '语言', '训练', '数据', '参数', '词表', '合并', '规则', '字符', '字节', '概率', '采样',
    '温度', '解码', '生成', '推理', '注意', '机制', '向量', '嵌入', '空间', '语义', '提示',
    '输出', '输入', '回答', '问题', '内容', '信息', '人类', '机器', '智能', '学习', '神经', '网络',
    '计算', '算法', '设计', '风格', '个性', '价值', '原则', '安全', '伦理', '文化', '社会',
    '技术', '科技', '未来', '过去', '时间', '世界', '生活', '事情', '答案', '东西', '感觉', '想法',
    '希望', '需要', '能够', '可以', '应该', '必须', '已经', '还是', '或者', '并且', '而且', '如果',
    '知道', '觉得', '认为', '发现', '葡萄', '苹果', '香蕉', '草莓', '开心', '难过', '高兴',
    '切分', '怎么样',
    // 英文常见词
    'tokenization', 'Tokenization', 'token', 'Token', 'ization',
    'the', 'The', 'and', 'of', 'to', 'in', 'is', 'it', 'that', 'this',
    'was', 'for', 'be', 'with', 'as', 'on', 'by', 'at', 'from', 'have', 'has', 'had',
    'are', 'will', 'would', 'should', 'can', 'do', 'not', 'but', 'or', 'if', 'then',
    'I', 'you', 'we', 'they', 'my', 'your', 'function', 'return', 'text', 'split',
    'quick', 'brown', 'fox', 'jumps', 'over', 'lazy', 'dog',
    'ing', 'ed', 'tion', 'ly', 'er', 'est', 'ize',
    // 标点和符号
    ' ', '\n', '，', '。', '！', '？', '、', '：', '；', ',', '.', '!', '?', '(', ')', '{', '}', '[', ']', "'", '"', ';', '/', '\\'
  ];
  const bpeSorted = [...new Set(bpeVocab)].sort((a, b) => b.length - a.length);

  function tokenizeChar(text) {
    return Array.from(text).map(c => ({ text: c, type: c === ' ' ? 'space' : c === '\n' ? 'newline' : 'char' }));
  }

  function tokenizeByte(text) {
    const enc = new TextEncoder();
    const bytes = enc.encode(text);
    return Array.from(bytes).map(b => ({
      text: '0x' + b.toString(16).toUpperCase().padStart(2, '0'),
      type: 'byte'
    }));
  }

  function tokenizeWord(text) {
    const tokens = [];
    let buf = '';
    const flush = () => { if (buf) { tokens.push({ text: buf, type: 'word' }); buf = ''; } };
    for (const ch of Array.from(text)) {
      // 中日韩字符或全角符号
      if (/[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(ch)) {
        flush();
        tokens.push({ text: ch, type: 'word' });
      } else if (ch === ' ') {
        flush();
        tokens.push({ text: ' ', type: 'space' });
      } else if (ch === '\n') {
        flush();
        tokens.push({ text: '\\n', type: 'newline' });
      } else if (/[a-zA-Z0-9'_-]/.test(ch)) {
        buf += ch;
      } else {
        flush();
        tokens.push({ text: ch, type: 'punct' });
      }
    }
    flush();
    return tokens;
  }

  function tokenizeBPE(text) {
    const tokens = [];
    let i = 0;
    while (i < text.length) {
      let matched = null;
      for (const v of bpeSorted) {
        if (text.substr(i, v.length) === v) {
          matched = v;
          break;
        }
      }
      if (matched) {
        tokens.push({
          text: matched,
          type: matched === ' ' ? 'space' : matched === '\n' ? 'newline' : 'bpe'
        });
        i += matched.length;
      } else {
        tokens.push({ text: text[i], type: 'fallback' });
        i++;
      }
    }
    return tokens;
  }

  const explanations = {
    char: {
      title: '字符级 (Character-level)',
      desc: '每个 Unicode 字符作为一个 token。最朴素的切法，模型早期常用，现在几乎被淘汰。',
      pros: '词表极小、没有未登录词、规则简单',
      cons: '序列被拉得很长、单字符语义太碎、计算成本高'
    },
    byte: {
      title: '字节级 (Byte-level / UTF-8)',
      desc: '把文本转成 UTF-8 字节流，每个字节是一个 token。词表固定 256 个，理论上能编码任何字符。GPT 系列实际上是在字节之上跑 BPE。',
      pros: '能编码任何字符、永远不会 <UNK>、词表极小',
      cons: '中文一字 3 字节，序列被拉得极长，光是这点就让中文处理变贵'
    },
    word: {
      title: '词级 (Word-level)',
      desc: '英文按空格和标点切，中文按字切（中文没有词间空格）。是 NLP 早期的主流，现代大模型基本不用。',
      pros: 'token 有完整的语义单位、人类直觉友好',
      cons: '词表必须很大、遇到生僻词或新词就 <UNK>、对中文等无空格语言失效'
    },
    bpe: {
      title: 'BPE 子词 (Subword BPE) — 现代大模型实际用法',
      desc: '高频整词作为完整 token，罕见词被切成子词碎片。这里用的是一个 100 多词的简化词表，真正的 GPT/Claude 词表有 10 万–20 万 token，效果更精细。',
      pros: '在序列长度和语义完整之间取得平衡、能处理新词、词表规模可控',
      cons: '训练复杂、对训练时少见的语言不友好、可能产生 glitch token'
    }
  };

  function render() {
    const text = input.value;
    let tokens = [];
    if (method === 'char') tokens = tokenizeChar(text);
    else if (method === 'byte') tokens = tokenizeByte(text);
    else if (method === 'word') tokens = tokenizeWord(text);
    else if (method === 'bpe') tokens = tokenizeBPE(text);

    // 渲染 tokens
    out.innerHTML = '';
    tokens.forEach((tok, idx) => {
      const span = document.createElement('span');
      const colorClass = 'tc-' + (idx % 6);
      span.className = 'token ' + colorClass;
      if (tok.type === 'space') {
        span.classList.add('space');
        span.textContent = ' ';
      } else {
        span.textContent = tok.text;
      }
      out.appendChild(span);
    });

    // 统计
    const charCount = Array.from(text).length;
    countEl.textContent = tokens.length;
    charsEl.textContent = charCount;
    const ratio = charCount > 0 ? (charCount / tokens.length) : 0;
    ratioEl.textContent = ratio.toFixed(2);

    // 说明
    const e = explanations[method];
    explainEl.innerHTML =
      '<b>' + e.title + '</b><br>' + e.desc +
      '<div class="tk-pros-cons">' +
        '<div class="tk-pros"><b>优点</b>' + e.pros + '</div>' +
        '<div class="tk-cons"><b>缺点</b>' + e.cons + '</div>' +
      '</div>';
  }

  input.addEventListener('input', render);

  tabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.tk-tab');
    if (!btn) return;
    method = btn.dataset.m;
    document.querySelectorAll('.tk-tab').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  document.querySelectorAll('.tk-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.dataset.ex;
      render();
    });
  });

  render();
})();
</script>
</body>
