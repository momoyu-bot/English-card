<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>邮件里为什么动不起来</title>
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

@keyframes spin { to { transform: rotate(360deg); } }
#nodes { transform-origin: 340px 132px; }
#nodes.web { animation: spin 9s linear infinite; }
button.on { background: var(--surface-1); border-color: var(--text-primary); }
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">同一个图标在三种渲染环境下的动画表现：浏览器 CSS 平滑旋转、Gmail 剥离 CSS 后静止、GIF 逐帧播放</h2>
<div style="display:flex;gap:8px;margin:0 0 1.25rem;flex-wrap:wrap;">
  <button id="b-web" class="on" onclick="setMode('web')">浏览器：CSS 动画</button>
  <button id="b-mail" onclick="setMode('mail')">Gmail：CSS 被剥掉</button>
  <button id="b-gif" onclick="setMode('gif')">GIF：逐帧烤好</button>
</div>
<svg width="100%" viewBox="0 0 680 250" role="img">
  
<meta name="description" content="同一个图标：浏览器里平滑转，Gmail 把样式剥掉就不动了，GIF 是逐帧烤好的。">
  <desc>一个手绘风格的文档轮廓，内部有一个节点网络图，可在平滑旋转、静止、逐帧跳动三种模式间切换</desc>
  <path d="M271 46 L388 41 L412 67 L408 217 L274 222 Z" fill="none" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M388 41 L391 66 L412 67" fill="none" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="nodes" class="web">
    <line x1="340" y1="132" x2="390" y2="132" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="340" y1="132" x2="353" y2="172" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="340" y1="132" x2="298" y2="163" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="340" y1="132" x2="303" y2="105" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="340" y1="132" x2="356" y2="85" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="298" y1="163" x2="353" y2="172" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="340" cy="132" r="14" fill="var(--text-muted)" fill-opacity="0.4" stroke="var(--text-primary)" stroke-width="2.5"/>
    <circle cx="390" cy="132" r="5.5" fill="var(--surface-2)" stroke="var(--text-primary)" stroke-width="2.5"/>
    <circle cx="353" cy="172" r="5.5" fill="var(--surface-2)" stroke="var(--text-primary)" stroke-width="2.5"/>
    <circle cx="298" cy="163" r="5.5" fill="var(--surface-2)" stroke="var(--text-primary)" stroke-width="2.5"/>
    <circle cx="303" cy="105" r="5.5" fill="var(--surface-2)" stroke="var(--text-primary)" stroke-width="2.5"/>
    <circle cx="356" cy="85" r="5.5" fill="var(--surface-2)" stroke="var(--text-primary)" stroke-width="2.5"/>
  </g>
</svg>
<div style="display:flex;align-items:baseline;gap:12px;margin:1rem 0 0;">
  <p id="caption" style="flex:1;font-size:14px;color:var(--text-secondary);line-height:1.7;margin:0;">CSS @keyframes 在浏览器里平滑旋转。但这段代码进了收件箱就活不下来。</p>
  <span id="frame" style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);white-space:nowrap;opacity:0;">帧 1 / 12</span>
</div>
<script>
let timer = null, angle = 0;
const nodes = document.getElementById('nodes');
const cap = document.getElementById('caption');
const frame = document.getElementById('frame');
const caps = {
  web: 'CSS @keyframes 在浏览器里平滑旋转。但这段代码进了收件箱就活不下来。',
  mail: 'Gmail 剥掉了 style 里的 animation，Outlook 用 Word 引擎渲染。同一段代码，图标直接躺平。',
  gif: '把每一帧都预先画好、烤进一张图片里。不需要 CSS，不需要 JS。注意它是「跳」的，不是「滑」的——离散帧的手感。'
};
function setMode(m) {
  clearInterval(timer); timer = null;
  nodes.classList.remove('web');
  nodes.style.transform = '';
  ['web', 'mail', 'gif'].forEach(k => document.getElementById('b-' + k).classList.toggle('on', k === m));
  cap.textContent = caps[m];
  frame.style.opacity = m === 'gif' ? '1' : '0';
  if (m === 'web') nodes.classList.add('web');
  if (m === 'gif') {
    angle = 0;
    timer = setInterval(() => {
      angle = (angle + 30) % 360;
      nodes.style.transform = 'rotate(' + angle + 'deg)';
      frame.textContent = '帧 ' + (angle / 30 + 1) + ' / 12';
    }, 110);
  }
}
</script>
</body>
</html>
