<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560">
  <title>暖宝宝贴哪儿</title>
  <desc>双手叉腰，从大拇指往下量三到四指，那块微微凹、按下去有点酸的地方。</desc>
  <rect width="420" height="560" fill="#FFF7F3"/>

  <text x="210" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#B5657E" text-anchor="middle" font-weight="bold">暖宝宝贴这儿（背面视角）</text>
  <text x="210" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#C98FA3" text-anchor="middle">你背对着我，我从后面看你</text>

  <!-- 身体轮廓：后背 -->
  <path d="M 210 95
           C 180 95, 168 108, 166 125
           C 150 132, 128 142, 120 162
           C 112 184, 110 215, 112 240
           L 122 238
           C 122 215, 126 192, 133 178
           L 136 250
           C 132 285, 130 320, 134 350
           C 137 378, 142 400, 145 420
           L 152 480
           L 148 520
           L 182 520
           L 186 470
           L 196 415
           L 210 415
           L 224 415
           L 234 470
           L 238 520
           L 272 520
           L 268 480
           L 275 420
           C 278 400, 283 378, 286 350
           C 290 320, 288 285, 284 250
           L 287 178
           C 294 192, 298 215, 298 238
           L 308 240
           C 310 215, 308 184, 300 162
           C 292 142, 270 132, 254 125
           C 252 108, 240 95, 210 95 Z"
        fill="#FBE3DA" stroke="#E0AFA0" stroke-width="2"/>

  <!-- 脊柱线 -->
  <line x1="210" y1="140" x2="210" y2="390" stroke="#E0AFA0" stroke-width="1.6" stroke-dasharray="5,5"/>
  <text x="218" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#C98FA3">脊柱中线</text>

  <!-- 腰最细处参考线 -->
  <line x1="95" y1="272" x2="325" y2="272" stroke="#D8B4C4" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="332" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C98FA3">腰最细处</text>

  <!-- 暖宝宝本体 -->
  <rect x="168" y="300" width="84" height="64" rx="10" fill="#F7A98C" stroke="#E07B55" stroke-width="2.4"/>
  <text x="210" y="329" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#7A3B22" text-anchor="middle" font-weight="bold">暖宝宝</text>
  <text x="210" y="349" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#8F4A2C" text-anchor="middle">贴这里 ♨</text>

  <!-- 热力波纹 -->
  <path d="M 150 332 q -10 -12 -20 0" stroke="#F0916E" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 150 348 q -10 -12 -20 0" stroke="#F0916E" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 270 332 q 10 -12 20 0" stroke="#F0916E" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 270 348 q 10 -12 20 0" stroke="#F0916E" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- 内裤边缘线 -->
  <path d="M 130 372 Q 210 384 290 372" stroke="#B58BA8" stroke-width="1.8" fill="none" stroke-dasharray="6,4"/>
  <text x="210" y="400" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#9B6E90" text-anchor="middle">内裤边缘 / 裤腰线</text>

  <!-- 左侧标注：上边界 -->
  <line x1="168" y1="302" x2="88" y2="302" stroke="#B5657E" stroke-width="1.2"/>
  <circle cx="168" cy="302" r="3" fill="#B5657E"/>
  <text x="84" y="298" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B5657E" text-anchor="end">上边</text>
  <text x="84" y="313" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B5657E" text-anchor="end">≈腰最细处</text>
  <text x="84" y="328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B5657E" text-anchor="end">往下 3~4 指</text>

  <!-- 右侧标注：下边界 -->
  <line x1="252" y1="364" x2="332" y2="364" stroke="#B5657E" stroke-width="1.2"/>
  <circle cx="252" cy="364" r="3" fill="#B5657E"/>
  <text x="336" y="360" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B5657E">下边</text>
  <text x="336" y="375" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B5657E">刚好压住</text>
  <text x="336" y="390" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B5657E">裤腰线</text>

  <!-- 居中提示 -->
  <text x="210" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B5657E" text-anchor="middle">↓ 左右居中，别偏 ↓</text>

  <!-- 底部找法 -->
  <rect x="30" y="428" width="360" height="106" rx="12" fill="#FFEFE8" stroke="#F0C4B2" stroke-width="1.5"/>
  <text x="48" y="452" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#B5657E" font-weight="bold">三步找到它 👇</text>
  <text x="48" y="474" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8A6A72">① 双手叉腰，大拇指自然搭在后腰上</text>
  <text x="48" y="494" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8A6A72">② 从大拇指的位置往下量 3~4 指</text>
  <text x="48" y="514" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8A6A72">③ 那块微微凹、按下去有点酸的地方，就是它</text>
</svg>
