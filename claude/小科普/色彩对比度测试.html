<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五种底色，哪种看得清</title>
<meta name="description" content="五种候选背景色配主题色，哪几种两色都清晰，哪几种糊掉。">
  <style>
    /* 补全缺失的文本颜色变量，确保正常显示 */
    :root {
      --text-primary: #1f2937;   /* 深色主文本 */
      --text-secondary: #6b7280; /* 浅色次文本 */
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      background-color: #ffffff;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>

  <main style="max-width: 500px; width: 100%;">
    <!-- 将标题改为了纯粹的色彩测试描述 -->
    <h2 class="sr-only">色彩对比度测试：五种候选背景色与主题色的视觉清晰度评估</h2>
    
    <div style="display:flex; flex-direction:column; gap:10px; padding:1rem 0;">

      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; background:#F0E6D8; border-radius:12px; padding:18px 16px; display:flex; gap:14px; align-items:center; justify-content:center;">
          <div style="width:130px; height:26px; border-radius:13px; background:#DB3A6E;"></div>
          <div style="width:130px; height:26px; border-radius:13px; background:#237A6C;"></div>
        </div>
        <div style="width:190px;">
          <p style="margin:0; font-size:14px; font-weight:500; color:var(--text-primary);">燕麦米 #F0E6D8</p>
          <p style="margin:2px 0 0; font-size:12px; color:var(--text-secondary);">3.51 / 4.18 — 两色都清晰</p>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; background:#EADDC8; border-radius:12px; padding:18px 16px; display:flex; gap:14px; align-items:center; justify-content:center;">
          <div style="width:130px; height:26px; border-radius:13px; background:#DB3A6E;"></div>
          <div style="width:130px; height:26px; border-radius:13px; background:#237A6C;"></div>
        </div>
        <div style="width:190px;">
          <p style="margin:0; font-size:14px; font-weight:500; color:var(--text-primary);">奶油杏 #EADDC8</p>
          <p style="margin:2px 0 0; font-size:12px; color:var(--text-secondary);">3.24 / 3.85 — 两色都清晰</p>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; background:#DCC9B6; border-radius:12px; padding:18px 16px; display:flex; gap:14px; align-items:center; justify-content:center;">
          <div style="width:130px; height:26px; border-radius:13px; background:#DB3A6E;"></div>
          <div style="width:130px; height:26px; border-radius:13px; background:#237A6C;"></div>
        </div>
        <div style="width:190px;">
          <p style="margin:0; font-size:14px; font-weight:500; color:var(--text-primary);">暖陶土 #DCC9B6</p>
          <p style="margin:2px 0 0; font-size:12px; color:var(--text-secondary);">2.70 / 3.21 — 勉强，小图偏闷</p>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; background:#6B4F3F; border-radius:12px; padding:18px 16px; display:flex; gap:14px; align-items:center; justify-content:center;">
          <div style="width:130px; height:26px; border-radius:13px; background:#DB3A6E;"></div>
          <div style="width:130px; height:26px; border-radius:13px; background:#237A6C;"></div>
        </div>
        <div style="width:190px;">
          <p style="margin:0; font-size:14px; font-weight:500; color:var(--text-primary);">摩卡深棕 #6B4F3F</p>
          <p style="margin:2px 0 0; font-size:12px; color:var(--text-secondary);">1.72 / 1.45 — 两色都糊掉</p>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; background:#4A4441; border-radius:12px; padding:18px 16px; display:flex; gap:14px; align-items:center; justify-content:center;">
          <div style="width:130px; height:26px; border-radius:13px; background:#DB3A6E;"></div>
          <div style="width:130px; height:26px; border-radius:13px; background:#237A6C;"></div>
        </div>
        <div style="width:190px;">
          <p style="margin:0; font-size:14px; font-weight:500; color:var(--text-primary);">暖炭灰 #4A4441</p>
          <p style="margin:2px 0 0; font-size:12px; color:var(--text-secondary);">2.21 / 1.86 — 两色都糊掉</p>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
