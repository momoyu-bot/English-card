<title>标点的语气温度</title>
<meta name="description" content="从「好的好的」到「嗯。」，同一句回复换个标点，体感温度从热情掉到冰点。">
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">同一句回复在不同标点下的语气温度对比，点击每个变体可查看潜台词。</h2>

<div style="padding:1rem 0">

<div style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">情境：你问朋友「今晚一起吃饭？」，他回你 ——</div>

<div id="row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:0 0 4px">
<button data-k="0" style="background:#FAECE7;color:#712B13;border:0.5px solid #D85A30;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的好的</button>
<button data-k="1" style="background:#FAEEDA;color:#633806;border:0.5px solid #EF9F27;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的~</button>
<button data-k="2" style="background:#F1EFE8;color:#2C2C2A;border:0.5px solid #B4B2A9;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的</button>
<button data-k="3" style="background:#B5D4F4;color:#0C447C;border:0.5px solid #378ADD;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的。</button>
<button data-k="4" style="background:#85B7EB;color:#042C53;border:0.5px solid #185FA5;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">嗯。</button>
</div>

<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin:0 0 16px"><span>热情</span><span>体感温度</span><span>冰点</span></div>

<div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem 1.25rem;min-height:96px">
<div style="font-size:12px;color:var(--text-muted);margin:0 0 6px">潜台词</div>
<div id="sub" style="font-size:16px;line-height:1.7;color:var(--text-primary);margin:0 0 10px">点上面任意一个看看。</div>
<div id="why" style="font-size:13px;line-height:1.6;color:var(--text-secondary)"></div>
</div>

</div>

<script>
const D=[
["「太好了！我等这顿很久了」","叠字把一个信息说了两遍——多余的动作在这里被解读成热情，因为重复本身就是投入的证据。"],
["「好呀，随你安排」","波浪号模拟了语音里的拖长尾音和上扬语调，是纯粹的语调补偿件，不承担任何语法功能。"],
["「行」","没有任何附加信号。这是聊天场域的默认值，也是所有解读的基准线。"],
["「知道了，不用多说」","句号在这里是冗余的——发送键已经终止了句子。多打出来的这一下，被读成了「我把话封上了」。"],
["「……」","内容压缩到极限，句号成了唯一的额外信号，全部注意力砸在它身上。杀伤力最大。"]
];
const s=document.getElementById('sub'),w=document.getElementById('why');
document.getElementById('row').addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
const d=D[+b.dataset.k];s.textContent=d[0];w.textContent=d[1];
});
</script>
