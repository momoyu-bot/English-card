<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>标点的语气温度</title>
<meta name="description" content="从「好的好的」到「嗯。」，同一句回复换个标点，体感温度从热情掉到冰点。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">同一句回复在不同标点下的语气温度对比，点击每个变体可查看潜台词。</h2>

<div style="padding:1rem 0">

<div style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">情境：你问朋友「今晚一起吃饭？」，他回你 ——</div>

<div id="row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:0 0 4px">
<button data-k="0" style="background:#FAECE7;color:#712B13;border:0.5px solid #D85A30;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的好的</button>
<button data-k="1" style="background:#FAEEDA;color:#633806;border:0.5px solid #EF9F27;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的~</button>
<button data-k="2" style="background:#F1EFE8;color:#2C2C2A;border:0.5px solid #B4B2A9;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的</button>
<button data-k="3" style="background:#B5D4F4;color:#0C447C;border:0.5px solid #378ADD;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">好的。</button>
<button data-k="4" style="background:#85B7EB;color:#042C53;border:0.5px solid #185FA5;border-radius:var(--radius);padding:12px 6px;font-size:15px;cursor:pointer">嗯。</button>
</div>

<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin:0 0 16px"><span>热情</span><span>体感温度</span><span>冰点</span></div>

<div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem 1.25rem;min-height:96px">
<div style="font-size:12px;color:var(--text-muted);margin:0 0 6px">潜台词</div>
<div id="sub" style="font-size:16px;line-height:1.7;color:var(--text-primary);margin:0 0 10px">点上面任意一个看看。</div>
<div id="why" style="font-size:13px;line-height:1.6;color:var(--text-secondary)"></div>
</div>

</div>

<script>
const D=[
["「太好了！我等这顿很久了」","叠字把一个信息说了两遍——多余的动作在这里被解读成热情，因为重复本身就是投入的证据。"],
["「好呀，随你安排」","波浪号模拟了语音里的拖长尾音和上扬语调，是纯粹的语调补偿件，不承担任何语法功能。"],
["「行」","没有任何附加信号。这是聊天场域的默认值，也是所有解读的基准线。"],
["「知道了，不用多说」","句号在这里是冗余的——发送键已经终止了句子。多打出来的这一下，被读成了「我把话封上了」。"],
["「……」","内容压缩到极限，句号成了唯一的额外信号，全部注意力砸在它身上。杀伤力最大。"]
];
const s=document.getElementById('sub'),w=document.getElementById('why');
document.getElementById('row').addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
const d=D[+b.dataset.k];s.textContent=d[0];w.textContent=d[1];
});
</script>
</body>
</html>
