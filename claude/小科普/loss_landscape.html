<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地形里的小球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17120e;
    --bg2:#1f1813;
    --ink:#f7efe3;
    --muted:#b8a890;
    --amber:#f0a341;
    --amber-soft:#c47a2c;
    --line:#3a2f24;
    --good:#ffd089;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a2018 0%, var(--bg) 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;
    padding:26px 16px 60px;
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;}
  h1{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:25px;
    letter-spacing:.3px;
    margin-bottom:4px;
    color:var(--ink);
  }
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px;}
  .panel{
    background:linear-gradient(180deg,var(--bg2),#1a140f);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 16px 14px;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .ptitle{
    font-family:"Fraunces",serif;
    font-style:italic;
    font-size:19px;
    color:var(--good);
    margin-bottom:2px;
  }
  .pdesc{font-size:13px;color:var(--muted);margin-bottom:12px;}
  canvas{
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
    cursor:crosshair;
    touch-action:none;
  }
  .hint{font-size:12px;color:#8a7a64;margin-top:9px;font-style:italic;}
  .controls{display:flex;gap:10px;margin-top:6px;}
  button{
    flex:1;
    background:transparent;
    color:var(--amber);
    border:1px solid var(--amber-soft);
    border-radius:999px;
    padding:10px 12px;
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
    transition:all .18s ease;
  }
  button:hover{background:rgba(240,163,65,.12);}
  button:active{transform:scale(.97);}
  .tag{
    display:inline-block;font-size:11px;letter-spacing:.5px;
    color:var(--amber);border:1px solid var(--amber-soft);
    border-radius:6px;padding:1px 7px;margin-bottom:8px;
    text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>从哪儿松手，决定你停在哪儿</h1>
  <p class="sub">点一下地形上的任意位置，放一颗小球下去 —— 看它往哪儿滚。</p>

  <div class="panel">
    <span class="tag">Convex · 凸函数</span>
    <div class="ptitle">完美的大铁锅</div>
    <div class="pdesc">整张地形只有一个坑。无论从哪里放球，最后都汇到同一个底。</div>
    <canvas id="cvxCanvas"></canvas>
    <div class="hint">试试在不同地方点几下 —— 它们殊途同归。</div>
  </div>

  <div class="panel">
    <span class="tag">Non-convex · 非凸函数</span>
    <div class="ptitle">深度学习的崎岖地形</div>
    <div class="pdesc">坑坑洼洼，深浅不一。球只会顺着脚下的坡往下滚，翻不过旁边的山脊，于是卡在离它最近的坑里 —— 哪怕远处有更深的坑。</div>
    <canvas id="ncvxCanvas"></canvas>
    <div class="controls">
      <button id="scatterBtn">撒一把球</button>
      <button id="clearBtn">清空</button>
    </div>
    <div class="hint">同一片地形，起点不同，命运就不同。这就是"局部最优"。</div>
  </div>
</div>

<script>
(function(){
  const DPR = Math.min(window.devicePixelRatio||1, 2);
  const palette = ["#ffd089","#f0a341","#e8743b","#f2b56b","#d98f4a","#ffc477","#e0673a"];

  // 地形定义：x,y 都在 [0,1] data 空间，y=0 在底部
  function convexF(x){
    let v = Math.pow((x-0.5),2)*3.7;
    return Math.min(Math.max(v,0),1);
  }
  const wells = [
    {c:0.16, d:0.50, w:0.060},
    {c:0.40, d:0.80, w:0.052},   // 最深 → 全局最优
    {c:0.65, d:0.42, w:0.070},
    {c:0.87, d:0.60, w:0.050}
  ];
  function nonconvexF(x){
    let base = 0.88;
    for(const wl of wells){
      base -= wl.d * Math.exp(-Math.pow(x-wl.c,2)/(2*wl.w*wl.w));
    }
    return Math.min(Math.max(base,0.02),1);
  }
  function grad(f,x){
    const h=0.0012;
    let a=Math.min(Math.max(x-h,0),1), b=Math.min(Math.max(x+h,0),1);
    return (f(b)-f(a))/(b-a);
  }

  class Scene{
    constructor(canvas, f, multicolor){
      this.canvas=canvas; this.ctx=canvas.getContext('2d');
      this.f=f; this.multicolor=multicolor;
      this.balls=[]; this.colorIdx=0;
      this.resize();
      window.addEventListener('resize',()=>this.resize());
      canvas.addEventListener('pointerdown',(e)=>{
        const r=canvas.getBoundingClientRect();
        const px=(e.clientX-r.left)/r.width;
        this.addBall(Math.min(Math.max(px,0.02),0.98));
      });
      this.loop();
    }
    resize(){
      const cssW=this.canvas.clientWidth||this.canvas.parentElement.clientWidth;
      this.cssW=cssW; this.cssH=Math.round(cssW*0.52);
      this.canvas.style.height=this.cssH+"px";
      this.canvas.width=cssW*DPR; this.canvas.height=this.cssH*DPR;
      this.ctx.setTransform(DPR,0,0,DPR,0,0);
      this.buildPath();
    }
    buildPath(){
      this.pts=[];
      const N=160;
      for(let i=0;i<=N;i++){
        const x=i/N;
        this.pts.push({x, y:this.f(x)});
      }
    }
    toPx(x,y){
      const pad=10;
      const w=this.cssW, h=this.cssH;
      return {
        X: pad + x*(w-2*pad),
        Y: pad + (1-y)*(h-2*pad-6) + 0   // y=0(底) 在下方
      };
    }
    addBall(x){
      const c=this.multicolor ? palette[(this.colorIdx++)%palette.length] : "#ffd089";
      this.balls.push({x, v:0, settled:false, color:c, t:0});
    }
    scatter(){
      this.balls=[]; this.colorIdx=0;
      const n=9;
      for(let i=0;i<n;i++){ this.addBall(0.06 + i*(0.88/(n-1))); }
    }
    clear(){ this.balls=[]; this.colorIdx=0; }
    step(){
      const lr=0.0016, friction=0.86;
      for(const b of this.balls){
        if(b.settled) continue;
        const g=grad(this.f,b.x);
        b.v += -lr*g;
        b.v *= friction;
        b.x += b.v;
        if(b.x<0.01){b.x=0.01;b.v*=-0.3;}
        if(b.x>0.99){b.x=0.99;b.v*=-0.3;}
        if(Math.abs(b.v)<0.00018 && Math.abs(g)<0.02){
          b.t++; if(b.t>8) b.settled=true;
        } else b.t=0;
      }
    }
    draw(){
      const ctx=this.ctx, w=this.cssW, h=this.cssH;
      ctx.clearRect(0,0,w,h);

      // 地形填充
      ctx.beginPath();
      let p0=this.toPx(this.pts[0].x,this.pts[0].y);
      ctx.moveTo(p0.X,p0.Y);
      for(const pt of this.pts){const p=this.toPx(pt.x,pt.y);ctx.lineTo(p.X,p.Y);}
      const last=this.toPx(1,this.pts[this.pts.length-1].y);
      ctx.lineTo(last.X,h); ctx.lineTo(p0.X,h); ctx.closePath();
      const grd=ctx.createLinearGradient(0,0,0,h);
      grd.addColorStop(0,"rgba(240,163,65,0.06)");
      grd.addColorStop(1,"rgba(232,116,59,0.16)");
      ctx.fillStyle=grd; ctx.fill();

      // 地形线
      ctx.beginPath();
      ctx.moveTo(p0.X,p0.Y);
      for(const pt of this.pts){const p=this.toPx(pt.x,pt.y);ctx.lineTo(p.X,p.Y);}
      ctx.lineWidth=2.4; ctx.strokeStyle="#f0a341";
      ctx.shadowColor="rgba(240,163,65,0.5)"; ctx.shadowBlur=10;
      ctx.stroke(); ctx.shadowBlur=0;

      // 小球
      for(const b of this.balls){
        const p=this.toPx(b.x,this.f(b.x));
        ctx.beginPath();
        ctx.arc(p.X,p.Y-7,6.5,0,Math.PI*2);
        ctx.fillStyle=b.color;
        ctx.shadowColor=b.color; ctx.shadowBlur=b.settled?14:8;
        ctx.fill(); ctx.shadowBlur=0;
        // 小高光
        ctx.beginPath();
        ctx.arc(p.X-2,p.Y-9.5,2,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.fill();
      }
    }
    loop(){
      this.step(); this.draw();
      requestAnimationFrame(()=>this.loop());
    }
  }

  const cvx = new Scene(document.getElementById('cvxCanvas'), convexF, false);
  const ncvx = new Scene(document.getElementById('ncvxCanvas'), nonconvexF, true);

  document.getElementById('scatterBtn').addEventListener('click',()=>ncvx.scatter());
  document.getElementById('clearBtn').addEventListener('click',()=>ncvx.clear());

  // 开场各放一颗，给点暗示
  setTimeout(()=>{ cvx.addBall(0.12); cvx.addBall(0.85); }, 350);
  setTimeout(()=>{ ncvx.addBall(0.10); ncvx.addBall(0.55); ncvx.addBall(0.93); }, 600);
})();
</script>
</body>
</html>
