<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这一天 · 体内的咖啡因</title>
<meta name="description" content="两杯咖啡因在血液里的涨与退叠成一条曲线，看你躺下那一刻体内还浮着多少。">
<style>
  :root{
    --ink:#ece3d6;
    --ink-dim:#9a8f7e;
    --ink-faint:#6f6657;
    --latte:#d49a4f;
    --milktea:#c75f3e;
    --total:#f1c873;
    --sleep:#828fb6;
    --limit:#a85a5a;
    --grid:rgba(236,227,214,0.065);
    --panel:rgba(255,250,240,0.025);
    --hairline:rgba(236,227,214,0.10);
    --serif:Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:linear-gradient(108deg,#251d14 0%,#191620 44%,#0c0e14 100%);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(16px,4vw,44px);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:760px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:18px;
    padding:clamp(20px,4vw,38px);
    backdrop-filter:blur(2px);
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:14px;
  }
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(25px,5.2vw,38px);
    line-height:1.12;
    letter-spacing:-0.01em;
    margin-bottom:6px;
  }
  h1 em{font-style:italic;color:var(--total)}
  .sub{
    color:var(--ink-dim);
    font-size:13.5px;
    line-height:1.55;
    max-width:46ch;
  }

  /* hero readout */
  .readout{
    display:flex;
    align-items:flex-end;
    gap:14px;
    margin:26px 0 8px;
    flex-wrap:wrap;
  }
  .readout .num{
    font-family:var(--serif);
    font-size:clamp(46px,11vw,72px);
    line-height:0.86;
    color:var(--total);
    font-variant-numeric:tabular-nums;
  }
  .readout .unit{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-dim);
    padding-bottom:9px;
  }
  .readout .tag{
    margin-left:auto;
    text-align:right;
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.5;
    padding-bottom:6px;
  }
  .readout .tag b{color:var(--sleep);font-weight:600}

  /* chart */
  .chart-wrap{margin:18px -6px 4px;position:relative}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .axis-label{font-family:var(--mono);font-size:10px;fill:var(--ink-faint)}
  .grid-line{stroke:var(--grid);stroke-width:1}
  .limit-line{stroke:var(--limit);stroke-width:1;stroke-dasharray:2 4;opacity:0.7}
  .limit-text{font-family:var(--mono);font-size:9.5px;fill:var(--limit);opacity:0.85}
  .curve-sub{fill:none;stroke-width:1.4;opacity:0.5}
  .curve-total{fill:none;stroke:var(--total);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
  .dose-dot{stroke:#1a1610;stroke-width:1.5}
  .dose-label{font-family:var(--mono);font-size:10px;font-weight:600}
  .sleep-line{stroke:var(--sleep);stroke-width:1.5;stroke-dasharray:4 3}
  .sleep-cap{fill:var(--sleep)}
  .sleep-cap-text{font-family:var(--mono);font-size:10px;font-weight:700;fill:#15131a}
  .hover-dot{fill:var(--total);stroke:#15130d;stroke-width:2}
  .hover-line{stroke:var(--ink);stroke-width:1;opacity:0.25}
  #tip{
    position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
    background:#1c1812;border:1px solid var(--hairline);border-radius:7px;
    padding:6px 9px;font-family:var(--mono);font-size:11px;color:var(--ink);
    transform:translate(-50%,-130%);white-space:nowrap;
  }
  #tip b{color:var(--total)}
  #tip span{color:var(--ink-dim)}

  /* controls */
  .controls{
    margin-top:24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px 28px;
  }
  @media(max-width:520px){.controls{grid-template-columns:1fr}}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;color:var(--ink-dim);margin-bottom:9px;
  }
  .ctrl label .val{font-family:var(--mono);color:var(--ink);font-size:12.5px}
  .ctrl label .val small{color:var(--ink-faint);font-size:10.5px;margin-left:5px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:2px;
    background:var(--hairline);border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--ink);border:3px solid #1a1610;cursor:pointer;
    box-shadow:0 0 0 1px var(--hairline);
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:var(--ink);
    border:3px solid #1a1610;cursor:pointer;box-shadow:0 0 0 1px var(--hairline);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(241,200,115,0.5)}
  input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px rgba(241,200,115,0.5)}

  /* legend + read */
  .legend{
    display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;
    font-size:11.5px;color:var(--ink-dim);
  }
  .legend i{display:inline-block;width:14px;height:2.5px;border-radius:2px;
    vertical-align:middle;margin-right:6px}
  .read{
    margin-top:20px;padding-top:18px;border-top:1px solid var(--hairline);
    font-size:13.5px;line-height:1.62;color:var(--ink);
  }
  .read b{color:var(--total);font-weight:600}
  .read .q{color:var(--ink-dim)}
  .foot{
    margin-top:16px;font-size:11px;color:var(--ink-faint);line-height:1.5;
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">9:30 拿铁 · 13:30 奶茶</div>
  <h1>这一天，<em>身体里的潮汐</em></h1>
  <p class="sub">两杯咖啡因在血液里的涨与退，叠加成一条曲线。拖动下面两个滑块，看看以你的代谢速度、在你躺下的那一刻，体内还浮着多少。</p>

  <div class="readout">
    <div class="num" id="bigNum">—</div>
    <div class="unit">mg<br>睡前残留</div>
    <div class="tag">入睡那刻仍在循环的量<br>相当于 <b id="equiv">—</b></div>
  </div>

  <div class="chart-wrap">
    <svg id="chart" viewBox="0 0 760 360" role="img" aria-label="一天中体内咖啡因浓度曲线"></svg>
    <div id="tip"></div>
  </div>

  <div class="legend">
    <span><i style="background:var(--total)"></i>体内总量（两杯叠加）</span>
    <span><i style="background:var(--latte)"></i>拿铁 ~150mg</span>
    <span><i style="background:var(--milktea)"></i>奶茶 ~200mg</span>
    <span><i style="background:var(--limit)"></i>单次上限 200mg</span>
  </div>

  <div class="controls">
    <div class="ctrl">
      <label>代谢速度 <span class="val"><span id="halfVal">5.0</span> 小时<small id="halfTag">普通成人</small></span></label>
      <input type="range" id="half" min="3" max="7" step="0.5" value="5" aria-label="咖啡因半衰期，小时">
    </div>
    <div class="ctrl">
      <label>入睡时间 <span class="val" id="sleepVal">1:00</span></label>
      <input type="range" id="sleep" min="22" max="28" step="0.25" value="25" aria-label="入睡时间">
    </div>
  </div>

  <div class="read" id="read"></div>
  <p class="foot">模型说明：每杯摄入后约 45 分钟达峰，之后按半衰期指数衰减，两杯叠加。剂量取中位估算（拿铁 150mg、奶茶 200mg），半衰期因人而异——基因（CYP1A2）、吸烟、孕期、避孕药都会大幅改变它，所以滑块那一栏才是真正属于你的变量。</p>
</div>

<script>
(function(){
  const svg = document.getElementById('chart');
  const NS = 'http://www.w3.org/2000/svg';
  const W=760, H=360;
  const L=46, R=20, T=22, B=40;          // plot padding
  const x0=L, x1=W-R, y0=H-B, y1=T;

  // time axis: 9:00 (=9) to next-day 06:00 (=30)
  const tMin=9, tMax=30;
  // doses
  const doses=[
    {t0:9.5,  D:150, color:'var(--latte)',   name:'拿铁'},
    {t0:13.5, D:200, color:'var(--milktea)', name:'奶茶'}
  ];
  const RISE=0.75; // 45 min to peak

  let half=5, sleepT=25;

  function conc(t, half){
    let c=0;
    for(const d of doses){
      if(t < d.t0) continue;
      const dt=t-d.t0;
      if(dt<=RISE){
        // smooth rise 0 -> D
        c += d.D * (1 - Math.cos(Math.PI*dt/RISE))/2;
      }else{
        c += d.D * Math.pow(0.5,(dt-RISE)/half);
      }
    }
    return c;
  }
  function concOne(t,d,half){
    if(t<d.t0) return 0;
    const dt=t-d.t0;
    if(dt<=RISE) return d.D*(1-Math.cos(Math.PI*dt/RISE))/2;
    return d.D*Math.pow(0.5,(dt-RISE)/half);
  }

  const sx = t => x0 + (t-tMin)/(tMax-tMin)*(x1-x0);
  let maxY=320;
  const sy = c => y0 - (c/maxY)*(y0-y1);

  function buildPath(fn){
    let p='';
    for(let i=0;i<=420;i++){
      const t=tMin+(tMax-tMin)*i/420;
      const X=sx(t), Y=sy(fn(t));
      p += (i===0?'M':'L')+X.toFixed(1)+' '+Y.toFixed(1);
    }
    return p;
  }

  function fmtTime(t){
    let hh=Math.floor(t)%24;
    let mm=Math.round((t-Math.floor(t))*60);
    if(mm===60){hh=(hh+1)%24;mm=0;}
    return hh+':'+String(mm).padStart(2,'0');
  }

  function render(){
    // dynamic maxY from peak
    let peak=0;
    for(let i=0;i<=200;i++){const t=tMin+(tMax-tMin)*i/200;peak=Math.max(peak,conc(t,half));}
    maxY=Math.max(Math.ceil(peak/40)*40+40, 240);

    let html='';

    // grid + y labels (every 80)
    for(let v=0; v<=maxY; v+=80){
      const Y=sy(v);
      html+=`<line class="grid-line" x1="${x0}" y1="${Y}" x2="${x1}" y2="${Y}"/>`;
      html+=`<text class="axis-label" x="${x0-8}" y="${Y+3}" text-anchor="end">${v}</text>`;
    }
    // x ticks
    const ticks=[9,12,15,18,21,24,27,30];
    for(const t of ticks){
      const X=sx(t);
      html+=`<text class="axis-label" x="${X}" y="${y0+15}" text-anchor="middle">${fmtTime(t)}</text>`;
    }
    html+=`<text class="axis-label" x="${sx(9)}" y="${y0+30}" text-anchor="middle" style="fill:var(--ink-faint)">早</text>`;
    html+=`<text class="axis-label" x="${sx(24)}" y="${y0+30}" text-anchor="middle" style="fill:var(--ink-faint)">午夜</text>`;

    // 200mg single-dose limit
    if(200<=maxY){
      const Y=sy(200);
      html+=`<line class="limit-line" x1="${x0}" y1="${Y}" x2="${x1}" y2="${Y}"/>`;
      html+=`<text class="limit-text" x="${x1}" y="${Y-4}" text-anchor="end">单次上限 200mg</text>`;
    }

    // sub-curves
    html+=`<path class="curve-sub" style="stroke:var(--latte)" d="${buildPath(t=>concOne(t,doses[0],half))}"/>`;
    html+=`<path class="curve-sub" style="stroke:var(--milktea)" d="${buildPath(t=>concOne(t,doses[1],half))}"/>`;

    // total fill + curve
    const totalPath=buildPath(t=>conc(t,half));
    const fill=totalPath+` L ${sx(tMax).toFixed(1)} ${y0} L ${sx(tMin).toFixed(1)} ${y0} Z`;
    html+=`<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(241,200,115,0.24)"/>
      <stop offset="1" stop-color="rgba(241,200,115,0)"/></linearGradient></defs>`;
    html+=`<path d="${fill}" fill="url(#fg)" stroke="none"/>`;
    html+=`<path class="curve-total" d="${totalPath}"/>`;

    // dose dots
    for(const d of doses){
      const X=sx(d.t0), Y=sy(0);
      html+=`<circle class="dose-dot" cx="${X}" cy="${Y}" r="4" style="fill:${d.color}"/>`;
      html+=`<text class="dose-label" x="${X}" y="${Y-9}" text-anchor="middle" style="fill:${d.color}">${d.name}</text>`;
    }

    // sleep line + cap
    const sX=sx(sleepT);
    const sVal=conc(sleepT,half);
    const sY=sy(sVal);
    html+=`<line class="sleep-line" x1="${sX}" y1="${y1-2}" x2="${sX}" y2="${y0}"/>`;
    html+=`<circle cx="${sX}" cy="${sY}" r="4.5" class="hover-dot"/>`;
    // cap badge
    const bw=58, bh=18, bx=Math.min(Math.max(sX-bw/2,x0), x1-bw);
    html+=`<rect class="sleep-cap" x="${bx}" y="${y1-bh-2}" width="${bw}" height="${bh}" rx="5"/>`;
    html+=`<text class="sleep-cap-text" x="${bx+bw/2}" y="${y1+10}" text-anchor="middle">睡 · ${Math.round(sVal)}mg</text>`;

    // hover group placeholder
    html+=`<g id="hov" style="opacity:0">
      <line class="hover-line" x1="0" y1="${y1}" x2="0" y2="${y0}"/>
      <circle class="hover-dot" cx="0" cy="0" r="4"/></g>`;

    svg.innerHTML=html;
    updateReadout(sVal);
  }

  function equivText(mg){
    const teas=mg/55;            // ~55mg per 250ml black tea
    if(teas<0.4) return '不到半杯红茶';
    return '约 '+teas.toFixed(1)+' 杯红茶';
  }
  function updateReadout(sVal){
    document.getElementById('bigNum').textContent=Math.round(sVal);
    document.getElementById('equiv').textContent=equivText(sVal);

    let verdict;
    if(sVal<25) verdict='基本退场了，对入睡几乎没影响，可以安心躺平。';
    else if(sVal<60) verdict='还留着一条小尾巴。如果你对咖啡因敏感，可能让入睡比平时慢上十几二十分钟。';
    else if(sVal<110) verdict='还有可观的余量在循环。即便睡着，深睡的质量也可能被悄悄压一压——醒来时那种"睡了但没完全睡"的感觉，常来自这里。';
    else verdict='余量相当高。这个浓度躺下，身体其实还在半清醒地运转，入睡和睡眠深度都容易受影响。';

    const read=document.getElementById('read');
    read.innerHTML=`以你拖出的代谢速度，<span class="q">${fmtTime(sleepT)}</span> 躺下时，体内还浮着约 <b>${Math.round(sVal)}mg</b> 咖啡因（${equivText(sVal)}的量）。${verdict}`;
  }

  // hover interaction
  const tip=document.getElementById('tip');
  function moveHandler(clientX){
    const rect=svg.getBoundingClientRect();
    const px=(clientX-rect.left)/rect.width*W;
    let t=tMin+(px-x0)/(x1-x0)*(tMax-tMin);
    t=Math.max(tMin,Math.min(tMax,t));
    const v=conc(t,half);
    const hov=document.getElementById('hov');
    if(hov){
      hov.style.opacity=1;
      const X=sx(t),Y=sy(v);
      hov.querySelector('line').setAttribute('x1',X);
      hov.querySelector('line').setAttribute('x2',X);
      hov.querySelector('circle').setAttribute('cx',X);
      hov.querySelector('circle').setAttribute('cy',Y);
      tip.style.opacity=1;
      tip.style.left=(X/W*rect.width)+'px';
      tip.style.top=(Y/H*rect.height)+'px';
      tip.innerHTML=`<b>${Math.round(v)}mg</b> <span>· ${fmtTime(t)}</span>`;
    }
  }
  svg.addEventListener('mousemove',e=>moveHandler(e.clientX));
  svg.addEventListener('touchmove',e=>{if(e.touches[0])moveHandler(e.touches[0].clientX);},{passive:true});
  svg.addEventListener('mouseleave',()=>{tip.style.opacity=0;const h=document.getElementById('hov');if(h)h.style.opacity=0;});

  // controls
  const halfEl=document.getElementById('half');
  const sleepEl=document.getElementById('sleep');
  function halfTagText(h){
    if(h<=4) return '代谢偏快';
    if(h<=5.5) return '普通成人';
    return '代谢偏慢 · 易堆积';
  }
  halfEl.addEventListener('input',()=>{
    half=parseFloat(halfEl.value);
    document.getElementById('halfVal').textContent=half.toFixed(1);
    document.getElementById('halfTag').textContent=halfTagText(half);
    render();
  });
  sleepEl.addEventListener('input',()=>{
    sleepT=parseFloat(sleepEl.value);
    document.getElementById('sleepVal').textContent=fmtTime(sleepT);
    render();
  });

  document.getElementById('halfTag').textContent=halfTagText(half);
  render();
})();
</script>
</body>
</html>
