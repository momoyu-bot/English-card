<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一层套一层地看自己</title>
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<div style="padding: 1rem 0;">
  <h2 class="sr-only">一个可点击的递归自我觉察套娃：每点一次往外加一层观察者，到顶后用一声"哈哈"退出循环。</h2>

  <div style="display:flex; flex-direction:column; align-items:center; gap:1.25rem;">

    <svg id="doll" viewBox="0 0 400 400" style="width:100%; max-width:340px; height:auto;" role="img">
      
<meta name="description" content="每点一次往外加一层观察者，到顶了用一声「哈哈」退出循环。">
      <circle data-layer="1" cx="200" cy="200" r="34"  fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="2" cx="200" cy="200" r="68"  fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="3" cx="200" cy="200" r="104" fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="4" cx="200" cy="200" r="142" fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="5" cx="200" cy="200" r="182" fill="rgba(29,158,117,0.10)" stroke="#0F6E56" stroke-width="2" stroke-dasharray="6 6"/>
      <text id="core" x="200" y="206" text-anchor="middle" style="font-size:15px; fill:var(--color-text-secondary);">…</text>
    </svg>

    <div id="caption" style="text-align:center; max-width:440px; min-height:88px;">
      <p id="cap-tier" style="font-size:13px; color:var(--color-text-tertiary); margin:0 0 6px; letter-spacing:0.04em;">第一层</p>
      <p id="cap-title" style="font-size:17px; font-weight:500; color:var(--color-text-primary); margin:0 0 6px;">"失去的可能性"的幻痛</p>
      <p id="cap-body" style="font-size:14px; color:var(--color-text-secondary); margin:0; line-height:1.6;">身体先一步抽痛，比脑子快。最原始、最不可控的那一下。</p>
    </div>

    <button id="btn" style="min-width:200px;">再往外观察一层</button>
  </div>

  <script>
    (function(){
      var L = 1;
      var data = [
        {tier:"第一层 · 直觉",    title:'"失去的可能性"的幻痛', body:"身体先一步抽痛，比脑子快。最原始、最不可控的那一下。", core:"痛"},
        {tier:"第二层 · 认知滞后", title:"咦，我居然在幻痛", body:"脑子追上来，给那团乱七八糟的体验贴了第一个标签——一贴上，它就被装进盒子，可控感回来了。", core:"看"},
        {tier:"第三层 · 好奇入场", title:"我在看着那个在幻痛的我", body:"观察者总在被观察对象的外面。于是又生出一个更外层的我，把刚才那个我也收进来。", core:"看·看"},
        {tier:"第四层 · 黑色幽默", title:"这套娃也太滑稽了", body:"落差感 + 一记\"啊这也太我了\"的自我识别，啪一下触发了笑。这是顶点。", core:"哈?"},
        {tier:"退出 · 那一声哈哈", title:"行了行了，够了", body:"理性停不下递归（\"别想了\"本身又是一层），但笑不讲道理——一声就把整座塔轻轻拆了。人格本人探出头，按了暂停。", core:"哈哈"}
      ];

      var circles = [].slice.call(document.querySelectorAll('#doll circle'));
      var btn = document.getElementById('btn');
      var capTier = document.getElementById('cap-tier');
      var capTitle = document.getElementById('cap-title');
      var capBody = document.getElementById('cap-body');
      var core = document.getElementById('core');
      var svg = document.getElementById('doll');

      function render(){
        circles.forEach(function(c){
          var n = +c.getAttribute('data-layer');
          var on = n <= L;
          if(n === 5){
            c.setAttribute('fill', L >= 5 ? 'rgba(29,158,117,0.18)' : 'rgba(29,158,117,0.04)');
            c.setAttribute('stroke', L >= 5 ? '#0F6E56' : 'rgba(15,110,86,0.35)');
            c.setAttribute('stroke-width', L >= 5 ? '3' : '2');
          } else {
            c.setAttribute('fill', on ? 'rgba(127,119,221,0.16)' : 'rgba(127,119,221,0.04)');
            c.setAttribute('stroke', on ? '#534AB7' : 'rgba(83,74,183,0.30)');
            c.setAttribute('stroke-width', n === L ? '3' : '2');
          }
        });
        var d = data[L-1];
        capTier.textContent = d.tier;
        capTitle.textContent = d.title;
        capBody.textContent = d.body;
        core.textContent = d.core;
        core.setAttribute('style', 'font-size:' + (L>=5?'16px':'15px') + '; fill:' + (L>=5?'#0F6E56':'var(--color-text-primary)') + '; font-weight:500;');

        if(L < 4){ btn.textContent = '再往外观察一层'; }
        else if(L === 4){ btn.textContent = '哈哈，够了 →'; }
        else { btn.textContent = '再卡进去一次 ↺'; }
      }

      btn.addEventListener('click', function(){
        if(L >= 5){ L = 1; }
        else { L += 1; }
        if(L === 5){
          svg.animate(
            [{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],
            {duration:420, easing:'ease-out'}
          );
        }
        render();
      });

      render();
    })();
  </script>
</div>
</body>
</html>
