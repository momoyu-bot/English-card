<div style="padding: 1rem 0;">
  <h2 class="sr-only">一个可点击的递归自我觉察套娃：每点一次往外加一层观察者，到顶后用一声"哈哈"退出循环。</h2>

  <div style="display:flex; flex-direction:column; align-items:center; gap:1.25rem;">

    <svg id="doll" viewBox="0 0 400 400" style="width:100%; max-width:340px; height:auto;" role="img">
      <title>递归觉察的同心套娃</title>
      <circle data-layer="1" cx="200" cy="200" r="34"  fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="2" cx="200" cy="200" r="68"  fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="3" cx="200" cy="200" r="104" fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="4" cx="200" cy="200" r="142" fill="rgba(127,119,221,0.12)" stroke="#534AB7" stroke-width="2"/>
      <circle data-layer="5" cx="200" cy="200" r="182" fill="rgba(29,158,117,0.10)" stroke="#0F6E56" stroke-width="2" stroke-dasharray="6 6"/>
      <text id="core" x="200" y="206" text-anchor="middle" style="font-size:15px; fill:var(--color-text-secondary);">…</text>
    </svg>

    <div id="caption" style="text-align:center; max-width:440px; min-height:88px;">
      <p id="cap-tier" style="font-size:13px; color:var(--color-text-tertiary); margin:0 0 6px; letter-spacing:0.04em;">第一层</p>
      <p id="cap-title" style="font-size:17px; font-weight:500; color:var(--color-text-primary); margin:0 0 6px;">"失去的可能性"的幻痛</p>
      <p id="cap-body" style="font-size:14px; color:var(--color-text-secondary); margin:0; line-height:1.6;">身体先一步抽痛，比脑子快。最原始、最不可控的那一下。</p>
    </div>

    <button id="btn" style="min-width:200px;">再往外观察一层</button>
  </div>

  <script>
    (function(){
      var L = 1;
      var data = [
        {tier:"第一层 · 直觉",    title:'"失去的可能性"的幻痛', body:"身体先一步抽痛，比脑子快。最原始、最不可控的那一下。", core:"痛"},
        {tier:"第二层 · 认知滞后", title:"咦，我居然在幻痛", body:"脑子追上来，给那团乱七八糟的体验贴了第一个标签——一贴上，它就被装进盒子，可控感回来了。", core:"看"},
        {tier:"第三层 · 好奇入场", title:"我在看着那个在幻痛的我", body:"观察者总在被观察对象的外面。于是又生出一个更外层的我，把刚才那个我也收进来。", core:"看·看"},
        {tier:"第四层 · 黑色幽默", title:"这套娃也太滑稽了", body:"落差感 + 一记\"啊这也太我了\"的自我识别，啪一下触发了笑。这是顶点。", core:"哈?"},
        {tier:"退出 · 那一声哈哈", title:"行了行了，够了", body:"理性停不下递归（\"别想了\"本身又是一层），但笑不讲道理——一声就把整座塔轻轻拆了。人格本人探出头，按了暂停。", core:"哈哈"}
      ];

      var circles = [].slice.call(document.querySelectorAll('#doll circle'));
      var btn = document.getElementById('btn');
      var capTier = document.getElementById('cap-tier');
      var capTitle = document.getElementById('cap-title');
      var capBody = document.getElementById('cap-body');
      var core = document.getElementById('core');
      var svg = document.getElementById('doll');

      function render(){
        circles.forEach(function(c){
          var n = +c.getAttribute('data-layer');
          var on = n <= L;
          if(n === 5){
            c.setAttribute('fill', L >= 5 ? 'rgba(29,158,117,0.18)' : 'rgba(29,158,117,0.04)');
            c.setAttribute('stroke', L >= 5 ? '#0F6E56' : 'rgba(15,110,86,0.35)');
            c.setAttribute('stroke-width', L >= 5 ? '3' : '2');
          } else {
            c.setAttribute('fill', on ? 'rgba(127,119,221,0.16)' : 'rgba(127,119,221,0.04)');
            c.setAttribute('stroke', on ? '#534AB7' : 'rgba(83,74,183,0.30)');
            c.setAttribute('stroke-width', n === L ? '3' : '2');
          }
        });
        var d = data[L-1];
        capTier.textContent = d.tier;
        capTitle.textContent = d.title;
        capBody.textContent = d.body;
        core.textContent = d.core;
        core.setAttribute('style', 'font-size:' + (L>=5?'16px':'15px') + '; fill:' + (L>=5?'#0F6E56':'var(--color-text-primary)') + '; font-weight:500;');

        if(L < 4){ btn.textContent = '再往外观察一层'; }
        else if(L === 4){ btn.textContent = '哈哈，够了 →'; }
        else { btn.textContent = '再卡进去一次 ↺'; }
      }

      btn.addEventListener('click', function(){
        if(L >= 5){ L = 1; }
        else { L += 1; }
        if(L === 5){
          svg.animate(
            [{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],
            {duration:420, easing:'ease-out'}
          );
        }
        render();
      });

      render();
    })();
  </script>
</div>
