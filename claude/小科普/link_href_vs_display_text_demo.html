<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.brw{border:0.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:0.5px solid var(--border);background:var(--surface-1)}
.url{flex:1;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{padding:26px 20px 30px;min-height:88px}
.lk{font-size:16px;color:var(--text-accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;text-align:left}
.sbar{padding:7px 12px;border-top:0.5px solid var(--border);background:var(--surface-1);font-family:var(--font-mono);font-size:12px;color:var(--text-muted);min-height:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vd{margin-top:1rem;padding:.85rem 1rem;border-radius:var(--radius);font-size:14px;line-height:1.6}
.ok{background:var(--bg-success);color:var(--text-success)}
.bad{background:var(--bg-danger);color:var(--text-danger)}
.ps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 1rem}
.ps button.on{background:var(--surface-1);border-color:var(--text-primary)}
</style>
<h2 class="sr-only">交互演示：链接显示的文字和它实际指向的地址是两个独立的东西，把鼠标放上去看真实地址，点击看跳到哪里</h2>

<div class="ps">
<button data-i="0" class="on">journeys 首页</button>
<button data-i="1">你的摘抄人</button>
<button data-i="2">钓鱼示范</button>
</div>

<div class="brw">
<div class="bar"><i class="ti ti-lock" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i><span class="url" id="ub">threerocks.github.io/journeys/</span></div>
<div class="pg"><button class="lk" id="lk">候鸟 · MIGRATION</button></div>
<div class="sbar" id="sb">把鼠标放到链接上</div>
</div>

<div class="vd ok" id="vd">还没点。悬停看看它想去哪。</div>

<script>
(function(){
var D=[
 {host:'threerocks.github.io',page:'threerocks.github.io/journeys/',text:'候鸟 · MIGRATION',href:'migration.html',full:'threerocks.github.io/journeys/migration.html',same:true,
  say:'同一个网站里的隔壁文件。地址栏只换了最后一段，域名没动 — 这是一张目录页在开自己的门。'},
 {host:'momoyu-bot.github.io',page:'momoyu-bot.github.io/English-card/grok/博物馆/摘抄人.html',text:'摘抄人 · 001',href:'./摘抄人.001.html',full:'momoyu-bot.github.io/English-card/grok/博物馆/摘抄人.001.html',same:true,
  say:'「./」就是同一个文件夹。你的小店里 500 多个页面全靠这一招互相串门，从来没离开过 momoyu-bot.github.io。'},
 {host:'bank-example.com',page:'mail-inbox.example/message/8842',text:'https://www.bank-example.com/login',href:'https://bank-example.com.secure-verify.tld/login',full:'bank-example.com.secure-verify.tld/login',same:false,
  say:'显示的文字长得像网址，但那只是一串文字，谁都能写。真域名是 secure-verify.tld — 前面那截「bank-example.com」只是它的一个子域名，用来骗眼睛。'}
];
var i=0,ub=document.getElementById('ub'),lk=document.getElementById('lk'),sb=document.getElementById('sb'),vd=document.getElementById('vd');
var btns=document.querySelectorAll('.ps button');
function load(n){
  i=n;var d=D[n];
  ub.textContent=d.page;lk.textContent=d.text;
  sb.textContent='把鼠标放到链接上';
  vd.className='vd ok';vd.textContent='还没点。悬停看看它想去哪。';
  for(var k=0;k<btns.length;k++)btns[k].classList.toggle('on',k===n);
}
for(var k=0;k<btns.length;k++)btns[k].addEventListener('click',function(){load(+this.dataset.i)});
lk.addEventListener('mouseenter',function(){sb.textContent=D[i].href});
lk.addEventListener('focus',function(){sb.textContent=D[i].href});
lk.addEventListener('mouseleave',function(){sb.textContent='把鼠标放到链接上'});
lk.addEventListener('click',function(){
  var d=D[i];ub.textContent=d.full;
  vd.className='vd '+(d.same?'ok':'bad');
  vd.textContent=(d.same?'还在同一个网站里。':'已经离开原网站了。')+d.say;
});
load(0);
})();
</script>
