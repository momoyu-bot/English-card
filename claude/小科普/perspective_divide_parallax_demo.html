<style>
/* ---------------------------------------------------------------

  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: rgba(11,11,11,.35);
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: rgba(11,11,11,.1);
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: rgba(11,11,11,.2);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: rgba(11,11,11,.4);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: rgba(11,11,11,.05);
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: rgba(11,11,11,.05);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: rgba(11,11,11,.1);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: rgba(11,11,11,.05);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: rgba(42,120,214,.1);
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: rgba(11,11,11,.05);
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: rgba(11,11,11,.1);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;

  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);
  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);

  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);

  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);

html{background:var(--surface-0)}
body{margin:0 auto;max-width:720px;background:var(--surface-0);color:var(--text-primary);
 font-family:var(--font-sans);line-height:1.7;-webkit-text-size-adjust:100%;
 padding:calc(env(safe-area-inset-top) + 20px) 18px 36px}
button{font-family:inherit;font-size:var(--font-size-body);color:var(--text-primary);
 background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:999px;
 padding:6px 13px;cursor:pointer;line-height:1.4}
button:hover{background:var(--fill-ghost-hover)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);white-space:nowrap;border:0}

<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mc{background:var(--surface-1);border-radius:var(--radius);padding:.75rem 1rem}
.mc .lb{font-size:13px;color:var(--text-secondary);margin:0 0 4px}
.mc .vl{font-size:24px;font-weight:500;color:var(--text-primary);margin:0}
.mc .sb{font-size:12px;color:var(--text-muted);margin:2px 0 0}
</style>
<h2 class="sr-only">交互演示：摄像机移动时，远、中、近三层鸟在屏幕上移动的距离不同，缩放系数等于焦距除以距离</h2>

<svg width="100%" viewBox="0 0 680 268" role="img" style="display:block">
<title>三层深度的视差演示</title>
<desc>三排鸟分别位于距离 1600、600、300 处，摄像机横向移动时它们在屏幕上以不同速度移动。</desc>
<line x1="0" y1="92" x2="680" y2="92" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="3 4"/>
<text class="ts" x="8" y="86" style="font-size:12px;fill:var(--text-muted)">地平线</text>
<g id="far" stroke="var(--text-primary)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.26"></g>
<g id="mid" stroke="var(--text-primary)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"></g>
<g id="near" stroke="var(--text-primary)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"></g>
</svg>

<div style="display:flex;align-items:center;gap:12px;margin:1rem 0 1.25rem">
<button id="pp" style="min-width:76px">暂停</button>
<label style="font-size:14px;color:var(--text-secondary);white-space:nowrap">摄像机</label>
<input type="range" id="cam" min="0" max="2400" value="0" step="1" style="flex:1">
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
<div class="mc"><p class="lb">远层 · d = 1600</p><p class="vl">0.38×</p><p class="sb">600 ÷ 1600 = 0.38</p></div>
<div class="mc"><p class="lb">中层 · d = 600</p><p class="vl">1.00×</p><p class="sb">600 ÷ 600 = 1.00</p></div>
<div class="mc"><p class="lb">近层 · d = 300</p><p class="vl">2.00×</p><p class="sb">600 ÷ 300 = 2.00</p></div>
</div>

<script>
(function(){
var F=600;
var L=[{id:'far',d:1600,gap:430,y:108},{id:'mid',d:600,gap:290,y:158},{id:'near',d:300,gap:260,y:220}];
var camX=0,playing=true;
var slider=document.getElementById('cam'),btn=document.getElementById('pp');
function draw(){
  for(var k=0;k<L.length;k++){
    var l=L[k],s=F/l.d,g=document.getElementById(l.id);
    var h=Math.max(2,16*s),sw=Math.max(0.8,h*0.24),parts=[];
    var i0=Math.floor(camX/l.gap)-2,n=Math.ceil(680/(l.gap*s))+4;
    for(var i=i0;i<i0+n;i++){
      var sx=340+(i*l.gap-camX)*s;
      if(sx<-40||sx>720)continue;
      var yj=((i*37)%17-8)*s*0.9;
      var y=l.y+yj;
      parts.push('<polyline points="'+(sx-h).toFixed(1)+','+y.toFixed(1)+' '+sx.toFixed(1)+','+(y-h*0.62).toFixed(1)+' '+(sx+h).toFixed(1)+','+y.toFixed(1)+'" stroke-width="'+sw.toFixed(2)+'"/>');
    }
    g.innerHTML=parts.join('');
  }
}
function tick(){ if(playing){ camX=(camX+2.2)%2400; slider.value=Math.round(camX); draw(); } requestAnimationFrame(tick); }
slider.addEventListener('input',function(){ playing=false; btn.textContent='播放'; camX=+slider.value; draw(); });
btn.addEventListener('click',function(){ playing=!playing; btn.textContent=playing?'暂停':'播放'; });
draw(); requestAnimationFrame(tick);
})();
</script>
