<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>邮件为什么进了垃圾箱</title>
<meta name="description" content="追踪像素、链接重写、模板指纹、信誉冷启动，在内容之前就把邮件推过阈值了。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only">Gmail 垃圾邮件判定是多因素叠加打分。在宝的外联邮件里，追踪像素、链接重写、模板指纹、信誉冷启动这些她没意识到的高权重因素，在内容里的链接和金额之前就已经把邮件推过了垃圾邮件阈值。</h2>

<div style="padding:1rem 0;">

  <div style="position:relative;padding-top:26px;margin-bottom:10px;">
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--text-primary);white-space:nowrap;">↓ 垃圾邮件阈值</div>

    <div style="display:flex;height:54px;border-radius:8px;overflow:hidden;gap:2px;">
      <div onclick="sendPrompt('网易邮箱大师的追踪像素具体是怎么让我的邮件进 Gmail 垃圾箱的？')" style="flex:20;background:#F0997B;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#4A1B0C;padding:0 4px;text-align:center;line-height:1.2;">追踪像素</div>
      <div onclick="sendPrompt('邮件里的链接被改写成跳转/追踪链接，为什么会被 Gmail 当成钓鱼信号？')" style="flex:16;background:#F0997B;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#4A1B0C;padding:0 4px;text-align:center;line-height:1.2;">链接重写</div>
      <div onclick="sendPrompt('怎么破除模板化群发的指纹，让每封外联邮件在 Gmail 眼里看起来是个性化的一对一邮件？')" style="flex:20;background:#F0997B;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#4A1B0C;padding:0 4px;text-align:center;line-height:1.2;">模板指纹</div>
      <div onclick="sendPrompt('新接入的发件通道信誉怎么暖机 warm-up？如果走网易共享 IP 被别人污染了怎么办？')" style="flex:16;background:#F0997B;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#4A1B0C;padding:0 4px;text-align:center;line-height:1.2;">信誉冷启动</div>
      <div onclick="sendPrompt('怎么检查我发件的 SPF / DKIM / DMARC 认证是否配齐？用网易邮箱大师代发会有什么坑？')" style="flex:16;background:#EF9F27;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#412402;padding:0 4px;text-align:center;line-height:1.2;">认证缺口</div>
      <div onclick="sendPrompt('裸的产品链接和金额数字在外联邮件里到底该怎么处理才不踩垃圾邮件的雷？')" style="flex:12;background:#B4B2A9;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#2C2C2A;padding:0 3px;text-align:center;line-height:1.15;">链接+金额</div>
    </div>

    <div style="position:absolute;top:26px;height:54px;left:50%;width:0;border-left:2px dashed #2C2C2A;"></div>
  </div>

  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);">
    <span>内容干净 · 像「11」的测试邮件</span>
    <span>被判为垃圾邮件</span>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:24px;font-size:12px;color:var(--text-secondary);">
    <span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:#F0997B;"></span>你没意识到的真凶（高权重）</span>
    <span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:#EF9F27;"></span>取决于你的配置（待确认）</span>
    <span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:#B4B2A9;"></span>你以为的主因（其实低权重）</span>
  </div>

  <p style="font-size:11px;color:var(--text-muted);margin:12px 0 0;line-height:1.5;">条段宽度是相对影响示意，不是 Gmail 真实评分——真实系统是黑箱加权，方向可参考、数值别当真。点任意一段可以让我展开讲。</p>

</div>
</body>
</html>
