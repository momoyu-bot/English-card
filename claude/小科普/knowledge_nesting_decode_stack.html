<title>听不懂的时候脑子在干嘛</title>
<meta name="description" content="待理解的概念在工作记忆里越堆越深，一旦接通，负荷断崖式往下掉。">
<style>
  .nest-wrap { padding: 0.5rem 0; }
  .nest-status { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:14px; font-size:14px; }
  .nest-status .depth-txt { color: var(--color-text-secondary); }
  .nest-status .depth-txt b { color: var(--color-text-primary); font-weight:500; }
  .nest-status .load-txt { font-weight:500; color: var(--color-text-primary); }
  .nest-main { display:flex; gap:20px; align-items:flex-start; }
  .stack-col { flex:1; display:flex; flex-direction:column; gap:0; min-height:200px; }
  .scard { border-radius: var(--border-radius-md); padding:11px 14px; font-size:14px; transition: opacity .35s ease, transform .35s ease; }
  .scard.base { background: var(--color-background-info); color: var(--color-text-info); border:0.5px solid var(--color-border-info); font-weight:500; }
  .scard.layer { background: var(--color-background-secondary); color: var(--color-text-primary); border:0.5px solid var(--color-border-tertiary); }
  .scard.enter { opacity:0; transform: translateY(-8px); }
  .scard.leaving { opacity:0; transform: translateY(-6px) scale(0.97); }
  .nest-link { height:14px; border-left:1.5px dashed var(--color-border-secondary); margin-left:22px; transition: opacity .35s; }
  .nest-link.leaving { opacity:0; }
  .meter-col { width:62px; display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; }
  .meter-pct { font-size:12px; color: var(--color-text-secondary); min-height:16px; font-weight:500; }
  .meter-track { width:26px; height:220px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); position:relative; overflow:hidden; }
  .meter-fill { position:absolute; bottom:0; left:0; width:100%; transition: height .5s cubic-bezier(.4,0,.2,1), background-color .5s; }
  .meter-fill.lvl-ok { background-color: var(--color-text-success); }
  .meter-fill.lvl-warn { background-color: var(--color-text-warning); }
  .meter-fill.lvl-danger { background-color: var(--color-text-danger); }
  .meter-cap { font-size:12px; color: var(--color-text-tertiary); text-align:center; line-height:1.3; }
  .nest-btns { display:flex; gap:10px; margin-top:16px; }
  .nest-btns button { flex:1; }
  .nest-btns button:disabled { opacity:.45; cursor:default; }
  .nest-hint { margin-top:14px; font-size:13px; color: var(--color-text-secondary); min-height:20px; }
  .nest-sleep { display:none; margin-top:14px; padding:12px 14px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); align-items:center; gap:10px; font-size:14px; color: var(--color-text-secondary); }
  .nest-sleep i { font-size:22px; color: var(--color-text-tertiary); }
  .nest-sleep.show { display:flex; }
</style>

<div class="nest-wrap">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">交互演示：理解抽象知识时，待理解的概念在工作记忆里越堆越深的递归栈，以及理解一旦完成、认知负荷断崖式下降的过程。</h2>
  <div class="nest-status">
    <span class="depth-txt">工作台上挂着 <b id="depth">1</b> 个待理解项</span>
    <span class="load-txt" id="load-label">刚起步，挺轻松</span>
  </div>
  <div class="nest-main">
    <div class="stack-col" id="stack">
      <div class="scard base">读懂「量子纠缠」</div>
    </div>
    <div class="meter-col">
      <span class="meter-pct" id="meter-pct">12%</span>
      <div class="meter-track"><div class="meter-fill lvl-ok" id="meter" style="height:12%"></div></div>
      <span class="meter-cap">认知<br>负荷</span>
    </div>
  </div>
  <div class="nest-btns">
    <button id="push-btn" onclick="pushLayer()">再往下挖一层</button>
    <button id="pop-btn" onclick="popAll()">突然全部接通了</button>
  </div>
  <div class="nest-hint" id="hint"></div>
  <div class="nest-sleep" id="sleep"><i class="ti ti-zzz" aria-hidden="true"></i><span>栈哗啦清空，绷了一晚的张力一撤——困意断崖式涌上来。</span></div>
</div>

<script>
(function(){
  const layers = [
    '那得先懂「叠加态」',
    '那「量子测量」又是啥',
    '「波函数坍缩」是什么',
    '「希尔伯特空间」？？',
    '那「概率幅」呢',
    '「复数为啥能描述现实」…'
  ];
  const loadTxt = ['刚起步，挺轻松','还行，手上挂着一个','开始有点吃力','工作台快摆满了','濒临溢出','彻底过载，救命','彻底过载，救命'];
  const pct = [12,32,52,70,86,96,100];
  let depth = 0;

  const stack = document.getElementById('stack');
  const meter = document.getElementById('meter');
  const meterPct = document.getElementById('meter-pct');
  const depthEl = document.getElementById('depth');
  const loadEl = document.getElementById('load-label');
  const pushBtn = document.getElementById('push-btn');
  const hint = document.getElementById('hint');
  const sleep = document.getElementById('sleep');

  function levelClass(p){ return p < 40 ? 'lvl-ok' : (p <= 70 ? 'lvl-warn' : 'lvl-danger'); }

  function render(){
    const p = pct[Math.min(depth, pct.length - 1)];
    meter.className = 'meter-fill ' + levelClass(p);
    meter.style.height = p + '%';
    meterPct.textContent = p + '%';
    depthEl.textContent = depth + 1;
    loadEl.textContent = loadTxt[Math.min(depth, loadTxt.length - 1)];
    if (depth >= layers.length){
      hint.textContent = '已经挖到底了——再往下就是另一个学科的事了。';
      pushBtn.disabled = true;
      pushBtn.textContent = '挖不动了';
    } else if (depth >= 2){
      hint.textContent = '（这会儿，你大概切去让 Gemini 中翻中了……）';
      pushBtn.disabled = false;
      pushBtn.textContent = '再往下挖一层';
    } else {
      hint.textContent = '';
      pushBtn.disabled = false;
      pushBtn.textContent = '再往下挖一层';
    }
  }

  window.pushLayer = function(){
    sleep.classList.remove('show');
    if (depth >= layers.length) return;
    const link = document.createElement('div');
    link.className = 'nest-link';
    const card = document.createElement('div');
    card.className = 'scard layer enter';
    card.textContent = layers[depth];
    stack.appendChild(link);
    stack.appendChild(card);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ card.classList.remove('enter'); }); });
    depth++;
    render();
  };

  window.popAll = function(){
    const dyn = stack.querySelectorAll('.scard.layer, .nest-link');
    dyn.forEach(function(el){ el.classList.add('leaving'); });
    setTimeout(function(){ dyn.forEach(function(el){ el.remove(); }); }, 360);
    const had = dyn.length > 0;
    depth = 0;
    render();
    if (had){ setTimeout(function(){ sleep.classList.add('show'); }, 480); }
  };

  render();
})();
</script>
