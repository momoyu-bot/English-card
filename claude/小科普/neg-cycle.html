<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>越绕越便宜的怪圈</title>
<meta name="description" content="一个绕一圈成本反而下降的环。绕得越多越便宜，最短路就永远算不出来。">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const N = { X: { x: 150, y: 50 }, Y: { x: 58, y: 188 }, Z: { x: 242, y: 188 } };
const CYCLE = [["X", "Y", 1], ["Y", "Z", -3], ["Z", "X", 1]];
const START = 3;
function shorten(a, b, pad) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  return { x1: a.x + (dx / len) * pad, y1: a.y + (dy / len) * pad, x2: b.x - (dx / len) * pad, y2: b.y - (dy / len) * pad, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}
function NegCycle() {
  const [n, setN] = useState(0);
  const [spin, setSpin] = useState(false);
  const [auto, setAuto] = useState(false);
  const timer = useRef(null);
  const dist = START - n;
  const round = () => { setN((v) => v + 1); setSpin(true); setTimeout(() => setSpin(false), 420); };
  useEffect(() => {
    if (!auto) return;
    timer.current = setInterval(round, 520);
    return () => clearInterval(timer.current);
  }, [auto]);
  const distColor = dist > 0 ? "#4ade80" : dist === 0 ? "#fbbf24" : "#ff7849";
  let line;
  if (n === 0) line = "假设你刚走到 X，到这儿花了 3 块成本。现在……敢绕一圈吗？";
  else if (dist > 0) line = `绕了 ${n} 圈，成本降到 ${dist}。继续薅 👇`;
  else if (dist === 0) line = "归零！再绕下去，就开始倒贴钱给你了——";
  else line = `已经凭空薅了 ${-dist} 块 😈 而且还能继续，永远停不下来。这就是「负无穷」长的样子。`;
  const C = { bg: "#0a0e1a", panel: "#121a30", border: "#222d4d", text: "#e8edf7", dim: "#7e89a8", gold: "#fbbf24" };
  return (
    <div style={{ background: C.bg, minHeight: "100vh", padding: 16, fontFamily: "ui-monospace, monospace", color: C.text }}>
      <div style={{ maxWidth: 380, margin: "0 auto" }}>
        <div style={{ fontSize: 11, letterSpacing: 1.5, color: C.dim }}>NEGATIVE CYCLE</div>
        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 10 }}>负权回路 = 无限刷钱 🪙</div>
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 8, marginBottom: 12 }}>
          <svg viewBox="0 0 300 240" style={{ width: "100%", display: "block" }}>
            {CYCLE.map(([a, b, w], k) => { const s = shorten(N[a], N[b], 24); return <line key={k} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke={spin ? C.gold : "#3f4060"} strokeWidth={spin ? 3.5 : 2} />; })}
            {Object.entries(N).map(([id, p]) => (
              <g key={id}><circle cx={p.x} cy={p.y} r={22} fill="#1a2238" stroke={C.gold} strokeWidth={2} /><text x={p.x} y={p.y + 6} textAnchor="middle" fontSize={17} fill={C.text}>{id}</text></g>
            ))}
          </svg>
        </div>
        <div style={{ textAlign: "center", marginBottom: 10 }}>
          <div style={{ fontSize: 11, color: C.dim }}>到 X 的累计成本</div>
          <div style={{ fontSize: 44, fontWeight: 700, color: distColor }}>{dist}</div>
          <div style={{ fontSize: 11, color: C.dim }}>已绕 {n} 圈</div>
        </div>
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 12, marginBottom: 12 }}>{line}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={round} style={{ flex: 1, padding: 11, borderRadius: 10, border: `1px solid ${C.gold}`, background: "#2a2110", color: C.gold }}>🔁 再绕一圈</button>
          <button onClick={() => setAuto((a) => !a)} style={{ flex: 1, padding: 11, borderRadius: 10, border: `1px solid ${C.border}`, background: "#172138", color: C.text }}>{auto ? "⏸ 停下" : "▶ 自动狂绕"}</button>
        </div>
        <button onClick={() => { setAuto(false); setN(0); }} style={{ width: "100%", marginTop: 8, padding: 8, color: C.dim, background: "transparent", border: `1px solid ${C.border}` }}>重置</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(NegCycle));
</script>
</body>
</html>
