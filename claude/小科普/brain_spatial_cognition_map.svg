<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF8F0"/>
      <stop offset="1" stop-color="#F6EEDF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="brainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#8A6E3A" flood-opacity="0.25"/>
    </filter>
    <!-- brain lateral silhouette, facing left (frontal lobe on the left) -->
    <path id="brain" d="M 150 215
      C 128 162, 145 108, 205 92
      C 268 74, 360 74, 428 98
      C 486 118, 508 162, 496 205
      C 488 238, 456 256, 418 256
      C 396 256, 384 272, 362 282
      C 335 296, 296 296, 268 285
      C 246 276, 230 262, 214 254
      C 182 254, 160 250, 150 215 Z"/>
    <clipPath id="brainClip"><use href="#brain"/></clipPath>
  </defs>

  <rect x="0" y="0" width="660" height="470" rx="20" fill="url(#bg)"/>

  <text x="330" y="40" text-anchor="middle" font-size="17" font-weight="800" fill="#5A4520" letter-spacing="1">用一张空间图，讲空间认知</text>
  <text x="330" y="60" text-anchor="middle" font-size="11.5" fill="#8A7038">大脑侧面 · 前额在左，枕叶在右</text>

  <!-- brain body -->
  <use href="#brain" fill="#F1E4CE" stroke="#C9A867" stroke-width="2.5" filter="url(#brainShadow)"/>

  <!-- functional heat regions, clipped inside the silhouette -->
  <g clip-path="url(#brainClip)">
    <!-- gyri hint -->
    <g stroke="#D8C29A" stroke-width="1.4" fill="none" opacity="0.55">
      <path d="M 175 130 C 210 145, 235 120, 270 138"/>
      <path d="M 200 175 C 245 190, 280 165, 320 185"/>
      <path d="M 250 110 C 290 125, 330 105, 380 125"/>
      <path d="M 300 160 C 345 175, 390 155, 430 175"/>
      <path d="M 230 215 C 275 228, 320 210, 365 228"/>
    </g>
    <!-- prefrontal (orange) -->
    <ellipse cx="192" cy="182" rx="52" ry="62" fill="#F2A15C" opacity="0.62" filter="url(#blur)"/>
    <!-- parietal / IPS (gold) -->
    <ellipse cx="368" cy="128" rx="72" ry="46" fill="#E9C24E" opacity="0.6" filter="url(#blur)"/>
    <!-- temporal / hippocampus (coral) -->
    <ellipse cx="312" cy="256" rx="48" ry="30" fill="#E9805E" opacity="0.6" filter="url(#blur)"/>
    <!-- ACC deep midline (violet) -->
    <ellipse cx="262" cy="176" rx="26" ry="44" fill="#9E86B8" opacity="0.62" filter="url(#blur)"/>
  </g>

  <!-- hippocampus little seahorse mark, deep in temporal lobe -->
  <g transform="translate(305,255)" stroke="#B24A2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M -6 -8 C 2 -12, 10 -6, 8 3 C 7 9, 0 11, -3 7"/>
  </g>

  <!-- ACC deep marker (dashed ring) -->
  <circle cx="262" cy="176" r="15" fill="none" stroke="#6E5687" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.9"/>

  <!-- ================= labels with leader lines ================= -->
  <!-- Prefrontal : top-left -->
  <g>
    <line x1="140" y1="118" x2="188" y2="170" stroke="#C58A45" stroke-width="1.3"/>
    <circle cx="188" cy="170" r="3" fill="#E07E2E"/>
    <text x="18" y="104" font-size="13.5" font-weight="700" fill="#C56A22">前额叶 · 多需求网络前端</text>
    <text x="18" y="122" font-size="11" fill="#7A5A2A">认知控制 · 工作记忆调度（求解器⇄调度器）</text>
  </g>

  <!-- Parietal / IPS : top-right -->
  <g>
    <line x1="520" y1="112" x2="410" y2="128" stroke="#C9A63A" stroke-width="1.3"/>
    <circle cx="410" cy="128" r="3" fill="#D6A81E"/>
    <text x="440" y="98" font-size="13.5" font-weight="700" fill="#B08610">顶内沟 IPS · 顶叶</text>
    <text x="440" y="116" font-size="11" fill="#7A5A2A">空间表征 · 心理旋转</text>
    <text x="440" y="132" font-size="11" fill="#7A5A2A">多维建模（超三维即失拐杖）</text>
  </g>

  <!-- Hippocampus : bottom-right -->
  <g>
    <line x1="470" y1="330" x2="316" y2="262" stroke="#C9603A" stroke-width="1.3"/>
    <circle cx="316" cy="262" r="3" fill="#D6603A"/>
    <text x="392" y="352" font-size="13.5" font-weight="700" fill="#C2502E">海马 + 内嗅皮层</text>
    <text x="392" y="370" font-size="11" fill="#7A5A2A">认知地图 · 导航（allocentric）</text>
    <text x="392" y="386" font-size="11" fill="#7A5A2A">← 你把这块外包给了屏幕</text>
  </g>

  <!-- ACC : bottom-left -->
  <g>
    <line x1="150" y1="345" x2="258" y2="192" stroke="#7E6698" stroke-width="1.3"/>
    <circle cx="258" cy="192" r="3" fill="#7E6698"/>
    <text x="22" y="360" font-size="13.5" font-weight="700" fill="#6E5687">前扣带回 ACC（深部）</text>
    <text x="22" y="378" font-size="11" fill="#7A5A2A">努力成本核算 · 「烧脑感」的来源</text>
    <text x="22" y="394" font-size="11" fill="#7A5A2A">疲惫＝预算控制器抗议，非电池掉电</text>
  </g>

  <!-- glutamate footnote -->
  <g>
    <line x1="80" y1="428" x2="580" y2="428" stroke="#C9A867" stroke-width="1" stroke-opacity="0.5"/>
    <text x="330" y="450" text-anchor="middle" font-size="11" fill="#8A6E3A">生化刹车 · 长时高强度认知后，外侧前额叶谷氨酸堆积（Pessiglione 2022, Current Biology）</text>
  </g>
</svg>
