<style>

  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: rgba(11,11,11,.1);
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: rgba(11,11,11,.2);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: rgba(11,11,11,.4);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: rgba(11,11,11,.05);
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: rgba(11,11,11,.05);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: rgba(11,11,11,.1);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: rgba(11,11,11,.05);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: rgba(42,120,214,.1);
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: rgba(11,11,11,.05);
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: rgba(11,11,11,.1);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);
  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;

  --font-serif: var(--font-voice);

}
html{background:var(--surface-0)}
body{margin:0 auto;max-width:720px;background:var(--surface-0);color:var(--text-primary);
 font-family:var(--font-sans);line-height:1.7;-webkit-text-size-adjust:100%;
 padding:calc(env(safe-area-inset-top) + 20px) 18px 36px}
button{font-family:inherit;font-size:var(--font-size-body);color:var(--text-primary);
 background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:999px;
 padding:6px 13px;cursor:pointer;line-height:1.4}
button:hover{background:var(--fill-ghost-hover)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<h2 class="sr-only">交互式粒子星系演示：移动鼠标可推开粒子，滑块分别控制斥力半径、斥力强度、回弹力、阻尼与形态插值</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ctl{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.ctl .lb{font-size:13px;color:var(--text-secondary);min-width:96px}
.ctl .tg{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);min-width:104px}
.ctl input[type=range]{flex:1;min-width:60px}
.ctl .v{font-size:13px;font-weight:500;min-width:34px;text-align:right}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{font-size:13px}
</style>
<div style="padding:1rem 0">
<canvas id="cv" width="1360" height="800" style="width:100%;display:block;border-radius:12px;background:#070a11;cursor:crosshair"></canvas>
<div style="margin-top:1.25rem">
<div class="ctl"><span class="lb">斥力半径</span><span class="tg">mouse radius</span><input type="range" id="s1" min="0" max="300" step="5" value="150"><span class="v" id="v1">150</span></div>
<div class="ctl"><span class="lb">斥力强度</span><span class="tg">repel force</span><input type="range" id="s2" min="0" max="100" step="1" value="45"><span class="v" id="v2">45</span></div>
<div class="ctl"><span class="lb">回弹力</span><span class="tg">spring</span><input type="range" id="s3" min="1" max="100" step="1" value="22"><span class="v" id="v3">22</span></div>
<div class="ctl"><span class="lb">阻尼</span><span class="tg">damping</span><input type="range" id="s4" min="0" max="100" step="1" value="62"><span class="v" id="v4">62</span></div>
<div class="ctl"><span class="lb">形态插值</span><span class="tg">morph / lerp</span><input type="range" id="s5" min="0" max="100" step="1" value="0"><span class="v" id="v5">0</span></div>
<div class="row">
<button id="bBreath">自动呼吸：关</button>
<button id="bBlend">加性混合：开</button>
<button id="bRaw">光晕贴图：开</button>
</div>
</div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=1360,H=800,N=3000,P=[];
function mk(sz,r,g,b){var c=document.createElement('canvas');c.width=c.height=sz;var x=c.getContext('2d');
var gr=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
gr.addColorStop(0,'rgba('+r+','+g+','+b+',1)');gr.addColorStop(0.22,'rgba('+r+','+g+','+b+',0.55)');
gr.addColorStop(0.55,'rgba('+r+','+g+','+b+',0.12)');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
x.fillStyle=gr;x.fillRect(0,0,sz,sz);return c;}
var SP=[mk(40,255,255,255),mk(40,255,206,150),mk(40,160,205,255)];
function flat(r,g,b){var c=document.createElement('canvas');c.width=c.height=4;var x=c.getContext('2d');
x.fillStyle='rgb('+r+','+g+','+b+')';x.fillRect(0,0,4,4);return c;}
var FL=[flat(255,255,255),flat(255,206,150),flat(160,205,255)];
var cx=W/2,cy=H/2;
for(var i=0;i<N;i++){
 var arm=i%3, t=Math.pow(Math.random(),0.55), rad=t*430+8;
 var ang=t*4.2+arm*2.0944+(Math.random()-0.5)*(0.5+0.8*(1-t));
 var ax=cx+Math.cos(ang)*rad*1.02+(Math.random()-0.5)*26;
 var ay=cy+Math.sin(ang)*rad*0.92+(Math.random()-0.5)*26;
 var ba=Math.random()*6.2832, br=Math.sqrt(Math.random())*640;
 var core=t<0.16;
 P.push({x:ax,y:ay,vx:0,vy:0,ax:ax,ay:ay,bx:cx+Math.cos(ba)*br,by:cy+Math.sin(ba)*br*0.62,
  s:(core?1.6:0.5)+Math.random()*1.5,c:core?(Math.random()<0.5?1:0):(Math.random()<0.72?0:(Math.random()<0.6?2:1)),
  a:0.25+Math.random()*0.75});}
var mx=-9999,my=-9999,breath=false,blend=true,raw=true,ph=0;
var R=150,F=45,K=22,D=62,M=0;
function bind(id,vid,fn){var e=document.getElementById(id),o=document.getElementById(vid);
 e.addEventListener('input',function(){o.textContent=Math.round(+e.value);fn(+e.value);});}
bind('s1','v1',function(v){R=v;});bind('s2','v2',function(v){F=v;});
bind('s3','v3',function(v){K=v;});bind('s4','v4',function(v){D=v;});
var s5=document.getElementById('s5');
bind('s5','v5',function(v){M=v;breath=false;document.getElementById('bBreath').textContent='自动呼吸：关';});
cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();
 mx=(e.clientX-r.left)/r.width*W;my=(e.clientY-r.top)/r.height*H;});
cv.addEventListener('pointerleave',function(){mx=-9999;my=-9999;});
document.getElementById('bBreath').addEventListener('click',function(){breath=!breath;
 this.textContent='自动呼吸：'+(breath?'开':'关');});
document.getElementById('bBlend').addEventListener('click',function(){blend=!blend;
 this.textContent='加性混合：'+(blend?'开':'关');});
document.getElementById('bRaw').addEventListener('click',function(){raw=!raw;
 this.textContent='光晕贴图：'+(raw?'开':'关');});
function loop(){
 if(breath){ph+=0.006;M=(1-Math.cos(ph))*50;s5.value=M;document.getElementById('v5').textContent=Math.round(M);}
 var m=M/100,k=K/4000,dp=0.80+D/100*0.185,rr=R*2,f=F*90;
 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#070a11';ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation=blend?'lighter':'source-over';
 var img=raw?SP:FL,base=raw?40:4;
 for(var i=0;i<N;i++){var p=P[i];
  var tx=p.ax+(p.bx-p.ax)*m,ty=p.ay+(p.by-p.ay)*m;
  p.vx+=(tx-p.x)*k;p.vy+=(ty-p.y)*k;
  var dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;
  if(d2<rr*rr&&d2>1){var d=Math.sqrt(d2),g=(1-d/rr)*f/d;p.vx+=dx*g*0.01;p.vy+=dy*g*0.01;}
  p.vx*=dp;p.vy*=dp;p.x+=p.vx;p.y+=p.vy;
  var sz=p.s*(raw?9:2.2);ctx.globalAlpha=p.a;
  ctx.drawImage(img[p.c],p.x-sz/2,p.y-sz/2,sz,sz);}
 ctx.globalAlpha=1;requestAnimationFrame(loop);}
loop();
})();
</script>
