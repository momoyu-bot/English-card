<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>定妆照二·火红狐狸和暹罗</title>
<meta name="description" content="第二版：大号画细了，表情能换，缩小时换专门画的小号，不糊。名字还在试穿。">
<style>
  :root {
    --page: #F1F5F2;
    --ink: #243029;
    --ink-2: #5B6862;
    --ink-3: #87948D;
    --line: #D6E0DA;
    --btn: #FFFFFF;
    --btn-on: #243029;
    --btn-on-ink: #F1F5F2;
    /* the stage, chips and swatches stay lit in both themes so colours are judged on one backdrop */
    --stage: #DDE9E2;
    --floor: #D0DFD6;
    --floor-edge: #C4D6CC;
    --stage-ink: #243029;
    --stage-ink-2: #5B6862;
    --float-bg: rgba(255, 255, 255, 0.88);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #131816; --ink: #E4EBE7; --ink-2: #A3B0A9; --ink-3: #75827B;
      --line: #2A3430; --btn: #1B2220; --btn-on: #E4EBE7; --btn-on-ink: #131816;
    }
  }
  :root[data-theme="dark"] {
    --page: #131816; --ink: #E4EBE7; --ink-2: #A3B0A9; --ink-3: #75827B;
    --line: #2A3430; --btn: #1B2220; --btn-on: #E4EBE7; --btn-on-ink: #131816;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 30px 16px 44px; }
  .kicker { font-size: 12px; letter-spacing: .18em; color: var(--ink-3); margin: 0 0 4px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; letter-spacing: .02em; }
  .lede { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
  h2 { font-size: 15px; margin: 30px 0 10px; font-weight: 600; letter-spacing: .04em; }
  h2 small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); letter-spacing: 0; margin-top: 2px; }

  /* segmented switch */
  .seg { display: inline-flex; background: var(--btn); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin: 0 0 10px; }
  .seg button {
    font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-2);
    padding: 5px 16px; border-radius: 999px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .seg button[aria-pressed="true"] { background: var(--btn-on); color: var(--btn-on-ink); }
  .seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* stage */
  .stage {
    position: relative; background: var(--stage); border-radius: 18px;
    padding: 18px 10px 14px; overflow: hidden;
    display: flex; justify-content: center; align-items: flex-end; gap: 4px;
  }
  .stage::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--floor-h, 28%); background: var(--floor);
    border-top: 2px solid var(--floor-edge); z-index: 0;
  }
  .fig {
    position: relative; z-index: 1; flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    font: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .fig[hidden] { display: none; }
  .fig:focus-visible { outline: 2px solid var(--stage-ink); outline-offset: 4px; border-radius: 10px; }
  .fig canvas { display: block; }
  .tag { margin-top: 6px; text-align: center; color: var(--stage-ink); line-height: 1.3; min-height: 38px; }
  .tag .nm { display: block; font-size: 19px; font-weight: 700; letter-spacing: .08em; }
  .tag .nm small { font-size: 11px; font-weight: 400; color: var(--stage-ink-2); letter-spacing: .04em; margin-left: 4px; }
  .tag .sp { display: block; font-size: 12px; color: var(--stage-ink-2); letter-spacing: .06em; }
  .float {
    position: absolute; left: 0; top: 0; pointer-events: none;
    font-size: 13px; font-weight: 600; color: var(--stage-ink);
    background: var(--float-bg); padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    animation: rise 1s ease-out forwards;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(.9); }
    18% { opacity: 1; transform: translate(-50%, -4px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
  }
  .hint { text-align: center; font-size: 12px; color: var(--ink-3); margin: 8px 0 0; }

  /* expressions */
  .faces { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .face {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--stage); border: 0; border-radius: 12px; padding: 7px 4px 5px;
    cursor: pointer; font: inherit; color: var(--stage-ink); -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .face canvas { display: block; }
  .face span { font-size: 12px; }
  .face[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--stage-ink); }
  .face[aria-pressed="true"] span { font-weight: 600; }
  .face:active { transform: scale(.96); }
  .face:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* size ladder */
  .panel { background: var(--stage); border-radius: 14px; padding: 12px 12px 10px; color: var(--stage-ink); }
  .rung { display: grid; grid-template-columns: 4.6em 1fr; align-items: end; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--floor-edge); }
  .rung:last-child { border-bottom: 0; }
  .rung .lab { font-size: 13px; font-weight: 600; line-height: 1.35; align-self: center; }
  .rung .lab small { display: block; font-size: 11px; font-weight: 400; color: var(--stage-ink-2); }
  .rung .row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell .pair { display: flex; align-items: flex-end; gap: 4px; }
  .cell span { font-size: 11px; color: var(--stage-ink-2); }
  .panel canvas { display: block; }
  .versus { display: flex; justify-content: center; gap: 22px; margin-top: 14px; }
  .versus figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .versus figcaption { font-size: 12px; color: var(--stage-ink-2); text-align: center; line-height: 1.4; }
  .versus figcaption b { color: var(--stage-ink); font-weight: 600; display: block; }
  .note { font-size: 12px; color: var(--ink-3); margin: 8px 2px 0; line-height: 1.7; }

  /* names */
  .names { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 14px; letter-spacing: .06em;
    background: var(--btn); color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 15px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .chip[aria-pressed="true"] { background: var(--btn-on); color: var(--btn-on-ink); border-color: var(--btn-on); }
  .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .gloss { font-size: 13px; color: var(--ink-2); margin: 10px 2px 0; min-height: 3.4em; line-height: 1.75; }

  .tools { display: flex; gap: 8px; margin: 26px 0 0; flex-wrap: wrap; }
  .toggle {
    font: inherit; font-size: 13px; background: var(--btn); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle[aria-pressed="true"] { background: var(--btn-on); color: var(--btn-on-ink); border-color: var(--btn-on); }
  .toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  footer { margin-top: 30px; font-size: 12px; color: var(--ink-3); letter-spacing: .06em; line-height: 1.9; }

  @media (min-width: 560px) {
    h1 { font-size: 30px; }
    .stage { padding: 26px 18px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">定妆照 · 第二版</p>
  <h1>火红狐狸和暹罗</h1>
  <p class="lede">大号画得更细，表情做成可以换的槽。要变小的时候不硬缩，换专门画的小号。名字还在试。</p>

  <div class="seg" role="group" aria-label="看谁">
    <button type="button" data-mode="fox" aria-pressed="true">狐狸</button>
    <button type="button" data-mode="cat" aria-pressed="false">暹罗</button>
    <button type="button" data-mode="both" aria-pressed="false">合影</button>
  </div>

  <div class="stage" id="stage">
    <button class="fig" id="fig-fox" type="button" aria-label="火红狐狸，点一下">
      <canvas id="cv-fox" role="img" aria-label="像素火红狐狸，大号"></canvas>
      <span class="tag" id="tag-fox"></span>
    </button>
    <button class="fig" id="fig-cat" type="button" aria-label="暹罗，点一下" hidden>
      <canvas id="cv-cat" role="img" aria-label="像素暹罗猫，大号"></canvas>
      <span class="tag" id="tag-cat"></span>
    </button>
  </div>
  <p class="hint">点它一下。</p>

  <h2>表情<small>眼睛和嘴是两个槽，换的只是这两格，底子一格不动</small></h2>
  <div class="faces" id="faces"></div>

  <h2>从大到小<small>像素图按整数倍放大，放多大都不糊；要变小的时候，换一套专门画的</small></h2>
  <div class="panel">
    <div id="ladder"></div>
    <div class="versus">
      <figure><canvas id="vs-shrunk"></canvas><figcaption><b>大号硬缩</b>缩到小号那么大</figcaption></figure>
      <figure><canvas id="vs-small"></canvas><figcaption><b>小号</b>专门画的</figcaption></figure>
    </div>
  </div>
  <p class="note">上面两只一样大，都放大了四倍给你看。左边是把大号直接缩小，边缘糊成一片；右边是专门画的小号，每一格都是实的。</p>

  <h2>名字试穿<small>点一组，台上的名牌跟着换</small></h2>
  <div class="names" id="names"></div>
  <p class="gloss" id="gloss"></p>

  <div class="tools">
    <button class="toggle" id="t-sil" type="button" aria-pressed="false">剪影</button>
    <button class="toggle" id="t-grid" type="button" aria-pressed="false">像素格</button>
  </div>

  <footer>住址 · momoyu-bot / English-card<br>Claude 做的 · 2026.09</footer>
</div>

/* ---------- layers ---------- */
function stamp(grid, x0, y0, rows) {
  for (let j = 0; j < rows.length; j++) {
    const r = rows[j];
    for (let i = 0; i < r.length; i++) {
      const c = r[i];
      if (c === '.' || c === ' ') continue;
      const y = y0 + j, x = x0 + i;
      if (y >= 0 && y < grid.length && x >= 0 && x < grid[0].length) grid[y][x] = c;
    }
  }
}
function blank(w, h) { return Array.from({ length: h }, () => new Array(w).fill(null)); }

function composeBig(name, exprIdx, tail) {
  const ch = DATA.big[name];
  const g = blank(ch.w, ch.h);
  stamp(g, 0, 0, ch.tails[tail]);
  stamp(g, 0, 0, ch.body);
  const ex = DATA.expr[exprIdx];
  stamp(g, ch.eyes[0][0], ch.eyes[0][1], DATA.eye[ex[1]]);
  stamp(g, ch.eyes[1][0], ch.eyes[1][1], DATA.eye[ex[2]]);
  const m = DATA.mouth[name === 'fox' ? ex[3] : ex[4]];
  if (m && m.length) stamp(g, ch.mouth[0], ch.mouth[1], m);
  return g;
}
function composeSmall(name, eyeState, tail) {
  const ch = DATA.small[name];
  const g = blank(ch.w, ch.h);
  stamp(g, 0, 0, ch.tails[tail]);
  stamp(g, 0, 0, ch.body);
  if (ch.overlay) stamp(g, 0, 0, ch.overlay);
  stamp(g, 0, 0, ch.eyes[eyeState]);
  return g;
}
function composeIcon(name) {
  const ic = DATA.icon[name];
  const g = blank(ic.rows[0].length, ic.rows.length);
  stamp(g, 0, 0, ic.rows);
  return g;
}

/* where the floor shadow sits: one row under the lowest body row */
function shadowOf(rows) {
  let low = -1;
  rows.forEach((r, y) => { if (/[^.]/.test(r)) low = y; });
  let x0 = 1e9, x1 = -1;
  for (let x = 0; x < rows[low].length; x++) if (rows[low][x] !== '.') { x0 = Math.min(x0, x); x1 = Math.max(x1, x); }
  return { y: low + 1, x0: x0 - 1, x1: x1 + 1 };
}
const SHADOW = { fox: shadowOf(DATA.big.fox.body), cat: shadowOf(DATA.big.cat.body) };

/* ---------- painting ---------- */
function paintGrid(cv, g, pal, o) {
  o = o || {};
  const h = g.length, w = g[0].length;
  const padTop = o.padTop || 0, padBot = o.padBot || 0;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const s = o.scale;
  cv.style.width = (w * s) + 'px';
  cv.style.height = ((h + padTop + padBot) * s) + 'px';
  const bw = Math.round(w * s * dpr), bh = Math.round((h + padTop + padBot) * s * dpr);
  if (cv.width !== bw) cv.width = bw;
  if (cv.height !== bh) cv.height = bh;
  const k = s * dpr, ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, bw, bh);
  const R = v => Math.round(v * k);
  const cell = (x, y) => ctx.fillRect(R(x), R(y), R(x + 1) - R(x), R(y + 1) - R(y));
  if (o.shadow) {
    const sh = o.shadow, lift = -(o.dy || 0), shrink = Math.min(lift, 4);
    ctx.fillStyle = o.sil ? 'rgba(46,56,51,0.2)' : 'rgba(36,48,41,0.13)';
    for (let x = sh.x0 + shrink; x <= sh.x1 - shrink; x++) cell(x, sh.y + padTop);
  }
  const dy = padTop + (o.dy || 0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = g[y][x];
    if (c === null) continue;
    ctx.fillStyle = o.sil ? SIL : pal[c];
    cell(x, y + dy);
  }
  if (o.grid) {
    ctx.fillStyle = 'rgba(36,48,41,0.15)';
    const t = Math.max(1, Math.round(k / 12));
    for (let x = 0; x <= w; x++) ctx.fillRect(Math.min(R(x), bw - t), 0, t, bh);
    for (let y = 0; y <= h + padTop + padBot; y++) ctx.fillRect(0, Math.min(R(y), bh - t), bw, t);
  }
}
function crop(g, box) {
  const [x0, y0, x1, y1] = box;
  return g.slice(y0, y1).map(r => r.slice(x0, x1));
}

/* ---------- state ---------- */
const view = { mode: 'fox', sil: false, grid: false, expr: 0, names: 'none' };
const now = () => performance.now();
function mk() {
  return { key: '', scale: 7, blinkEnd: -1, nextBlink: now() + 1000 + Math.random() * 2000,
           tempExpr: -1, tempEnd: -1, wagStart: -1, wagEnd: -1, wagPeriod: 120,
           swishEnd: -1, nextSwish: now() + 1800 + Math.random() * 2400, hopStart: -1 };
}
const S = { fox: mk(), cat: mk() };
const HOP = [-1, -2, -3, -3, -3, -2, -1, 0];
const HOP_STEP = 45;
const EXPR_INDEX = Object.fromEntries(DATA.expr.map((e, i) => [e[0], i]));

function frameOf(name, t) {
  const s = S[name];
  let expr = view.expr;
  if (t < s.tempEnd) expr = s.tempExpr;
  if (expr === 0 && t >= s.nextBlink && s.blinkEnd < t) {
    s.blinkEnd = t + 130;
    s.nextBlink = t + (Math.random() < 0.2 ? 300 : 2400 + Math.random() * 3200);
  }
  if (expr === 0 && t < s.blinkEnd) expr = EXPR_INDEX['眨眼'];
  let tail = 0;
  if (t < s.wagEnd) tail = Math.floor((t - s.wagStart) / s.wagPeriod) % 2 === 0 ? 1 : 0;
  else if (!reduceMotion) {
    if (t >= s.nextSwish && s.swishEnd < t) {
      s.swishEnd = t + (name === 'fox' ? 520 : 320);
      s.nextSwish = t + (name === 'fox' ? 2200 + Math.random() * 2600 : 3000 + Math.random() * 3500);
    }
    if (t < s.swishEnd) tail = 1;
  }
  let dy = 0;
  if (s.hopStart >= 0) {
    const i = Math.floor((t - s.hopStart) / HOP_STEP);
    if (i < HOP.length) dy = HOP[i]; else s.hopStart = -1;
  }
  return { expr, tail, dy };
}

const cvs = { fox: document.getElementById('cv-fox'), cat: document.getElementById('cv-cat') };
function visible(name) { return view.mode === 'both' || view.mode === name; }

function drawStage(name, force) {
  if (!visible(name)) return;
  const f = frameOf(name, now());
  const s = S[name];
  const key = [f.expr, f.tail, f.dy, s.scale, view.sil, view.grid].join('|');
  if (!force && key === s.key) return;
  s.key = key;
  const g = composeBig(name, f.expr, f.tail);
  paintGrid(cvs[name], g, DATA.big[name].pal,
    { scale: s.scale, padTop: PAD_TOP, shadow: SHADOW[name], dy: f.dy, sil: view.sil, grid: view.grid });
}
function loop() { drawStage('fox'); drawStage('cat'); requestAnimationFrame(loop); }

/* ---------- layout ---------- */
const stage = document.getElementById('stage');
function layout() {
  const cs = getComputedStyle(stage);
  const inner = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const W = DATA.big.fox.w;
  const per = view.mode === 'both' ? (inner - 4) / 2 : inner;
  const scale = Math.max(2, Math.min(10, Math.floor(per / W)));
  S.fox.scale = scale; S.cat.scale = scale;
  document.getElementById('fig-fox').hidden = !visible('fox');
  document.getElementById('fig-cat').hidden = !visible('cat');
  drawStage('fox', true); drawStage('cat', true);
  const shown = visible('fox') ? 'fox' : 'cat';
  const sr = stage.getBoundingClientRect(), cr = cvs[shown].getBoundingClientRect();
  const feet = cr.top + (SHADOW[shown].y + PAD_TOP) * scale;
  stage.style.setProperty('--floor-h', Math.max(0, Math.round(sr.bottom - feet)) + 'px');
}

/* ---------- tags ---------- */
function setTags() {
  const pair = NAMES.find(n => n.id === view.names);
  ['fox', 'cat'].forEach(n => {
    const el = document.getElementById('tag-' + n);
    const nm = pair[n];
    el.innerHTML = nm
      ? '<span class="nm">' + nm[0] + '<small>' + nm[1] + '</small></span><span class="sp">' + SPECIES[n] + '</span>'
      : '<span class="nm">&nbsp;</span><span class="sp">' + SPECIES[n] + ' · 名字待定</span>';
  });
  document.getElementById('gloss').textContent = pair.gloss;
}

/* ---------- expression chips ---------- */
function focusName() { return view.mode === 'cat' ? 'cat' : 'fox'; }
function buildFaces() {
  const box = document.getElementById('faces');
  box.innerHTML = '';
  const n = focusName(), ch = DATA.big[n];
  DATA.expr.forEach((ex, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'face';
    b.setAttribute('aria-pressed', String(view.expr === i));
    b.setAttribute('aria-label', '表情：' + ex[0]);
    const cv = document.createElement('canvas');
    const sp = document.createElement('span'); sp.textContent = ex[0];
    b.append(cv, sp);
    paintGrid(cv, crop(composeBig(n, i, 0), ch.face), ch.pal, { scale: 2, sil: view.sil });
    b.addEventListener('click', () => {
      view.expr = i;
      box.querySelectorAll('.face').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      S.fox.tempEnd = -1; S.cat.tempEnd = -1;
      drawStage('fox', true); drawStage('cat', true);
      drawLadder();
    });
    box.appendChild(b);
  });
}

function drawLadder() {

  const rungs = [
    { lab: '大号', sub: '台上、表情、要看细节', scales: [2, 1], make: n => [composeBig(n, view.expr, 0), DATA.big[n].pal] },
    { lab: '小号', sub: '角落、列表、小卡上', scales: [2, 1], make: n => [composeSmall(n, ex[5], 0), DATA.small[n].pal] },
    { lab: '图标号', sub: '小到只剩一个头', scales: [2, 1], make: n => [composeIcon(n), DATA.icon[n].pal] },
  ];
  rungs.forEach(r => {
    const row = document.createElement('div'); row.className = 'rung';

    const cells = document.createElement('div'); cells.className = 'row';
    r.scales.forEach(sc => {
      const cell = document.createElement('div'); cell.className = 'cell';
      const pair = document.createElement('div'); pair.className = 'pair';
      ladderNames().forEach(n => {
        const [g, pal] = r.make(n);

        pair.appendChild(cv);

      cell.append(pair, t); cells.appendChild(cell);

    row.append(lab, cells); box.appendChild(row);

  const src = document.createElement('canvas');
  src.width = big.w; src.height = big.h;
  const sctx = src.getContext('2d');
  const g = composeBig(n, 0, 0);
  sctx.clearRect(0, 0, big.w, big.h);
  for (let y = 0; y < big.h; y++) for (let x = 0; x < big.w; x++) {
    if (g[y][x] === null) continue;
    sctx.fillStyle = view.sil ? SIL : big.pal[g[y][x]];
    sctx.fillRect(x, y, 1, 1);
  }
  // 2) resize it the usual way
  const tw = small.w, th = Math.round(big.h * small.w / big.w);
  const shr = document.createElement('canvas'); shr.width = tw; shr.height = th;
  const shx = shr.getContext('2d');
  shx.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in shx) shx.imageSmoothingQuality = 'high';
  shx.drawImage(src, 0, 0, tw, th);
  // 3) magnify both with hard edges so the difference is visible
  magnify(document.getElementById('vs-shrunk'), shr, MAG);
  const sm = document.createElement('canvas'); sm.width = small.w; sm.height = small.h;
  const smx = sm.getContext('2d');
  const gs = composeSmall(n, 'open', 0);
  for (let y = 0; y < small.h; y++) for (let x = 0; x < small.w; x++) {
    if (gs[y][x] === null) continue;
    smx.fillStyle = view.sil ? SIL : small.pal[gs[y][x]];
    smx.fillRect(x, y, 1, 1);
  }
  magnify(document.getElementById('vs-small'), sm, MAG);
}
function magnify(dst, src, mag) {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const w = src.width, h = src.height;
  dst.style.width = (w * mag) + 'px'; dst.style.height = (h * mag) + 'px';
  dst.width = Math.round(w * mag * dpr); dst.height = Math.round(h * mag * dpr);
  const d = dst.getContext('2d');
  d.clearRect(0, 0, dst.width, dst.height);
  const px = src.getContext('2d').getImageData(0, 0, w, h).data;
  const k = mag * dpr, R = v => Math.round(v * k);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, a = px[i + 3];
    if (a === 0) continue;
    d.fillStyle = 'rgba(' + px[i] + ',' + px[i + 1] + ',' + px[i + 2] + ',' + (a / 255) + ')';
    d.fillRect(R(x), R(y), R(x + 1) - R(x), R(y + 1) - R(y));
  }
}

/* ---------- poking ---------- */
function floatText(name, text) {
  const fig = document.getElementById('fig-' + name), cv = cvs[name], s = S[name];
  const spot = DATA.big[name].say;
  const el = document.createElement('span');
  el.className = 'float'; el.textContent = text;
  el.style.left = (cv.offsetLeft + (spot[0] + (Math.random() - 0.5)) * s.scale) + 'px';
  el.style.top = (cv.offsetTop + (spot[1] + PAD_TOP - 1) * s.scale) + 'px';
  fig.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}
function poke(name) {
  const t = now(), s = S[name];
  const pool = name === 'fox' ? ['开心', '眨一只眼', '得意'] : ['开心', '眨一只眼'];
  s.tempExpr = EXPR_INDEX[pool[Math.floor(Math.random() * pool.length)]];
  s.tempEnd = t + (name === 'fox' ? 950 : 1200);
  s.wagStart = t; s.wagEnd = t + (name === 'fox' ? 720 : 600); s.wagPeriod = name === 'fox' ? 90 : 150;
  if (name === 'fox' && !reduceMotion) s.hopStart = t;
  const w = WORDS[name];
  floatText(name, w[Math.floor(Math.random() * w.length)]);
}
document.getElementById('fig-fox').addEventListener('click', () => poke('fox'));
document.getElementById('fig-cat').addEventListener('click', () => poke('cat'));

/* ---------- controls ---------- */
document.querySelectorAll('.seg button').forEach(b => {
  b.addEventListener('click', () => {
    view.mode = b.dataset.mode;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    layout(); buildFaces(); drawLadder();
  });
});
function buildNames() {
  const box = document.getElementById('names');
  NAMES.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = p.label;
    b.setAttribute('aria-pressed', String(view.names === p.id));
    b.addEventListener('click', () => {
      view.names = p.id;
      box.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      setTags(); layout();
    });
    box.appendChild(b);
  });
}
function bindToggle(id, key) {
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    view[key] = !view[key];
    b.setAttribute('aria-pressed', String(view[key]));
    drawStage('fox', true); drawStage('cat', true);
    if (key === 'sil') { buildFaces(); drawLadder(); }
  });
}
bindToggle('t-sil', 'sil');
bindToggle('t-grid', 'grid');

/* ---------- go ---------- */
buildNames(); setTags(); buildFaces(); drawLadder(); layout();
window.addEventListener('resize', () => { layout(); });
requestAnimationFrame(loop);
</script>
