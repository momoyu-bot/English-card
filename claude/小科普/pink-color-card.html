<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一块缎面布的粉</title>
<meta name="description" content="一块缎面布的粉：压着一层橙黄底、明度高、彩度被牛奶稀释过，还有它在粉色家族里的坐标。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241D1A;
    --bg-soft:#2E2521;
    --ink:#F1E9E3;
    --muted:#A8978C;
    --faint:#6E6058;
    --hero:#EFD6C7;
    --c-high:#F4E6D9;
    --c-mid:#ECD3C3;
    --c-peach:#E0BBA8;
    --c-shadow:#D2A892;
    --line:#3D332D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-weight:300;
    line-height:1.5;
    padding:48px 26px 56px;
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;}

  /* header */
  .eyebrow{
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--muted);font-weight:400;margin-bottom:18px;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;font-size:clamp(44px,12vw,68px);
    line-height:.98;letter-spacing:.01em;color:var(--hero);
    margin-bottom:8px;
  }
  .sub{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:clamp(18px,5vw,24px);color:var(--muted);font-weight:400;
    margin-bottom:40px;
  }

  /* hero swatch */
  .hero-row{display:flex;gap:22px;align-items:stretch;margin-bottom:46px;flex-wrap:wrap;}
  .hero-chip{
    flex:1 1 200px;min-height:180px;border-radius:3px;
    background:var(--hero);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.6);
  }
  .hero-meta{flex:1 1 180px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .hex{
    font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:500;
    color:var(--ink);letter-spacing:.04em;
  }
  .attr{display:flex;flex-direction:column;gap:9px;}
  .attr-row{display:flex;align-items:baseline;gap:12px;font-size:13px;}
  .attr-label{color:var(--faint);width:34px;flex-shrink:0;letter-spacing:.05em;}
  .attr-val{color:var(--ink);font-weight:400;}
  .attr-tag{color:var(--muted);font-size:12px;}

  /* spectrum */
  .section-label{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--muted);margin-bottom:16px;
    padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .spectrum{
    height:54px;border-radius:3px;margin-bottom:18px;
    background:linear-gradient(90deg,var(--c-high) 0%,var(--hero) 32%,var(--c-mid) 54%,var(--c-peach) 78%,var(--c-shadow) 100%);
  }
  .samples{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:46px;}
  .samp{display:flex;flex-direction:column;gap:7px;}
  .samp-dot{width:100%;height:30px;border-radius:2px;}
  .samp-name{font-size:12px;color:var(--ink);font-weight:400;line-height:1.25;}
  .samp-hex{font-size:11px;color:var(--faint);letter-spacing:.03em;}

  /* coordinate */
  .axes{display:flex;flex-direction:column;gap:22px;margin-bottom:42px;}
  .axis{}
  .axis-head{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:9px;letter-spacing:.04em;}
  .track{position:relative;height:1px;background:var(--line);}
  .track::after{content:"";position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--hero);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line);}
  .t-warm::after{left:80%;}
  .t-light::after{left:78%;}
  .t-chroma::after{left:24%;}

  /* footnote */
  .foot{
    font-size:12px;color:var(--faint);line-height:1.65;
    padding-top:22px;border-top:1px solid var(--line);
  }
  .foot b{color:var(--muted);font-weight:500;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">色彩分析 · 一块缎面布</div>
    <h1>暖奶油肉粉</h1>
    <div class="sub">warm blush · peachy nude</div>

    <div class="hero-row">
      <div class="hero-chip" aria-label="主色"></div>
      <div class="hero-meta">
        <div class="hex">#EFD6C7</div>
        <div class="attr">
          <div class="attr-row"><span class="attr-label">暖度</span><span class="attr-val">暖</span><span class="attr-tag">压着一层橙黄底</span></div>
          <div class="attr-row"><span class="attr-label">明度</span><span class="attr-val">高</span><span class="attr-tag">浅色、透光</span></div>
          <div class="attr-row"><span class="attr-label">彩度</span><span class="attr-val">低</span><span class="attr-tag">被牛奶稀释过</span></div>
        </div>
      </div>
    </div>

    <div class="section-label">光线光谱 · 高光 → 阴影</div>
    <div class="spectrum"></div>
    <div class="samples">
      <div class="samp"><span class="samp-dot" style="background:var(--c-high)"></span><span class="samp-name">香槟米</span><span class="samp-hex">#F4E6D9</span></div>
      <div class="samp"><span class="samp-dot" style="background:var(--hero)"></span><span class="samp-name">奶油肉粉</span><span class="samp-hex">#EFD6C7</span></div>
      <div class="samp"><span class="samp-dot" style="background:var(--c-peach)"></span><span class="samp-name">蜜桃粉</span><span class="samp-hex">#E0BBA8</span></div>
      <div class="samp"><span class="samp-dot" style="background:var(--c-shadow)"></span><span class="samp-name">陶土暖粉</span><span class="samp-hex">#D2A892</span></div>
    </div>

    <div class="section-label">在粉色家族里的坐标</div>
    <div class="axes">
      <div class="axis">
        <div class="axis-head"><span>冷粉</span><span>暖粉</span></div>
        <div class="track t-warm"></div>
      </div>
      <div class="axis">
        <div class="axis-head"><span>深</span><span>浅</span></div>
        <div class="track t-light"></div>
      </div>
      <div class="axis">
        <div class="axis-head"><span>灰 / 浊</span><span>艳 / 纯</span></div>
        <div class="track t-chroma"></div>
      </div>
    </div>

    <p class="foot">
      <b>关于色值。</b>以上 hex 是我从你这张图肉眼观察的近似采样,不是精确取色——缎面有反光,同一块布在高光和褶皱里能差出一截。想要拿去用的精确色号,建议在原图上用取色器(吸管)吸一下最准,我标的这些更多是帮你看清这块粉的暖调走向和层次。
    </p>
  </div>
</body>
</html>
