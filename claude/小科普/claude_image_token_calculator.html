<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一张图要花多少 token</title>
<meta name="description" content="输入图片宽高，算它占多少、会不会被自动缩掉、等于多少个中文字。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only">图片 token 计算器：输入图片宽高，计算 Claude 读取该图片所需的 visual token 数量，并显示是否触发自动缩放，以及等价的文字量。</h2>
<div style="padding: 0.5rem 0;">

  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem;">
    <button onclick="setPreset(1470,890)" style="font-size:12px;padding:6px 10px;">电脑截图 1470×890</button>
    <button onclick="setPreset(1920,1080)" style="font-size:12px;padding:6px 10px;">全屏 1920×1080</button>
    <button onclick="setPreset(1170,2532)" style="font-size:12px;padding:6px 10px;">iPhone 截屏</button>
    <button onclick="setPreset(4032,3024)" style="font-size:12px;padding:6px 10px;">手机拍照</button>
  </div>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
    <label style="font-size:14px;color:var(--text-secondary);min-width:32px;">宽</label>
    <input type="range" id="w" min="200" max="4500" step="10" value="1470" style="flex:1;" oninput="calc()" />
    <span id="wout" style="font-size:14px;font-weight:500;min-width:56px;text-align:right;">1470</span>
  </div>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;">
    <label style="font-size:14px;color:var(--text-secondary);min-width:32px;">高</label>
    <input type="range" id="h" min="200" max="4500" step="10" value="890" style="flex:1;" oninput="calc()" />
    <span id="hout" style="font-size:14px;font-weight:500;min-width:56px;text-align:right;">890</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.25rem;">
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
      <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px;">最终 token</p>
      <p id="tok" style="font-size:24px;font-weight:500;margin:0;">1,696</p>
    </div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
      <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px;">≈ 中文字数</p>
      <p id="cn" style="font-size:24px;font-weight:500;margin:0;">1,700</p>
    </div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
      <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px;">≈ 英文单词</p>
      <p id="en" style="font-size:24px;font-weight:500;margin:0;">1,270</p>
    </div>
  </div>

  <div id="note" style="font-size:13px;line-height:1.6;padding:12px 14px;border-radius:var(--radius);background:var(--bg-success);color:var(--text-success);">
    没触发缩放，原图直接切块，细节全部保留。
  </div>

</div>
<script>
const MAX_EDGE = 1568;
const MAX_TOK = 1600;

function calc() {
  let w = +document.getElementById('w').value;
  let h = +document.getElementById('h').value;
  document.getElementById('wout').textContent = w;
  document.getElementById('hout').textContent = h;

  let sw = w, sh = h, scaled = false;

  const longEdge = Math.max(w, h);
  if (longEdge > MAX_EDGE) {
    const r = MAX_EDGE / longEdge;
    sw = Math.round(w * r); sh = Math.round(h * r); scaled = true;
  }
  let tok = Math.ceil(sw / 28) * Math.ceil(sh / 28);
  if (tok > MAX_TOK) {
    const r = Math.sqrt(MAX_TOK / tok);
    sw = Math.round(sw * r); sh = Math.round(sh * r); scaled = true;
    tok = Math.ceil(sw / 28) * Math.ceil(sh / 28);
  }

  document.getElementById('tok').textContent = Math.round(tok).toLocaleString();
  document.getElementById('cn').textContent = Math.round(tok * 1.0).toLocaleString();
  document.getElementById('en').textContent = Math.round(tok * 0.75).toLocaleString();

  const note = document.getElementById('note');
  const origPx = (w * h / 1e6).toFixed(1);
  const newPx = (sw * sh / 1e6).toFixed(2);
  const lost = Math.round((1 - (sw * sh) / (w * h)) * 100);

  if (scaled) {
    note.style.background = 'var(--bg-warning)';
    note.style.color = 'var(--text-warning)';
    note.textContent = '触发缩放：' + origPx + 'MP → ' + newPx + 'MP，丢掉了约 ' + lost + '% 的像素（缩到 ' + sw + '×' + sh + '）。token 没省下来，细节倒是没了。';
  } else {
    note.style.background = 'var(--bg-success)';
    note.style.color = 'var(--text-success)';
    note.textContent = '没触发缩放，原图直接切块，细节全部保留。';
  }
}
function setPreset(w, h) {
  document.getElementById('w').value = w;
  document.getElementById('h').value = h;
  calc();
}
calc();
</script>
</body>
</html>
