<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">一条从REM睡眠到清醒认知加工的光谱，逻辑在线度从左到右递增，情绪加工在三个状态下都在进行，但所处的化学与神经环境不同。</desc>
