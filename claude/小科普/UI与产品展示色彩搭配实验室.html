<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UI 配色实验室</title>
<meta name="description" content="换屏幕底色、手机边框、画面背景，看深色主体配紫色元素在哪种底上最好看。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only">UI色彩实验室：测试手机屏幕背景色与深色主体及紫色元素的搭配效果</h2>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 250px); gap: 16px; align-items: start; padding: 1rem 0;">

  <div style="background: var(--surface-1); border-radius: 12px; padding: 12px;">
    <svg id="scene" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; border-radius: 8px;">
      <rect id="bg" x="0" y="0" width="360" height="300" fill="#EFE9F7"/>
      <ellipse cx="205" cy="268" rx="62" ry="7" fill="#000000" opacity="0.10"/>
      
      <rect x="155" y="60" width="94" height="204" fill="#131313"/>
      <rect x="249" y="60" width="18" height="204" fill="#2A2A2A"/>
      <path d="M205 112 q-15 -9 -7 -23 q9 -13 21 -4 q13 -10 21 3 q7 15 -9 23 q-2 12 -13 14 q-11 -2 -13 -13 z" fill="none" stroke="#F2F2F2" stroke-width="2.2"/>
      <line x1="212" y1="125" x2="210" y2="150" stroke="#F2F2F2" stroke-width="2.2"/>
      <path d="M210 136 q-13 -4 -17 -15 q13 0 18 12" fill="none" stroke="#F2F2F2" stroke-width="2.2"/>
      
      <ellipse id="wandshadow" cx="112" cy="276" rx="42" ry="6" fill="#000000" opacity="0.11"/>
      <ellipse cx="152" cy="50" rx="29" ry="31" fill="#B9A3E8" opacity="0.4"/>
      <ellipse cx="145" cy="56" rx="29" ry="31" fill="#8F6FD6"/>
      <path d="M145 27 q11 14 0 29 q-11 -15 0 -29 M120 50 q17 -5 24 9 q-19 5 -24 -9 M170 50 q-17 -5 -24 9 q19 5 24 -9" fill="none" stroke="#7856C6" stroke-width="1.6"/>
      <path d="M127 82 Q118 172 95 248 Q90 264 106 269 Q122 271 128 254 Q150 176 164 84 Z" fill="#8F6FD6"/>
      <path d="M133 106 l9 7 l-8 9 l-9 -7 z M129 138 l9 7 l-8 9 l-9 -7 z M123 170 l9 7 l-8 9 l-9 -7 z M115 202 l9 7 l-8 9 l-9 -7 z" fill="none" stroke="#7856C6" stroke-width="1.3"/>
      <circle cx="112" cy="232" r="4.5" fill="#7856C6"/>
      <ellipse cx="107" cy="262" rx="16" ry="13" fill="#C08B5C"/>
      <ellipse cx="107" cy="262" rx="9" ry="7" fill="#463323"/>
      
      <ellipse id="phshadow" cx="272" cy="272" rx="33" ry="6" fill="#000000" opacity="0"/>
      <rect id="phframe" x="240" y="152" width="64" height="118" rx="11" fill="#E8E6EA"/>
      <rect id="phscreen" x="244" y="156" width="56" height="110" rx="8" fill="#F7F0D2"/>
      <rect x="262" y="158" width="20" height="5" rx="2.5" fill="#1A1A1A" opacity="0.8"/>
    </svg>
  </div>

  <div>
    <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 8px;">屏幕底色</p>
    <div id="swatches" style="display: flex; flex-direction: column; gap: 5px; margin: 0 0 14px;"></div>
    
    <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 8px;">手机边框</p>
    <div id="frameRow" style="display: flex; gap: 6px; margin: 0 0 14px;"></div>
    
    <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 8px;">画面背景</p>
    <div id="bgRow" style="display: flex; gap: 6px; margin: 0 0 14px;"></div>
    
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color: var(--text-secondary); cursor:pointer;">
      <input type="checkbox" id="sh" style="width:auto; height:auto;"/> 给手机加接触投影
    </label>
  </div>
</div>

<div id="verdict" style="background: var(--surface-1); border-radius: var(--radius, 12px); padding: 12px 14px; font-size: 14px; line-height: 1.65; color: var(--text-secondary); min-height: 40px;"></div>

<script>
var OPTS = [
  {n:'奶油黄（原方案）', c:'#F7F0D2', v:'屏幕底色偏黄，但黄与紫黑属于互补色，容易产生视觉冲突。调性偏甜，缺乏高端科技产品所需要的克制感。'},
  {n:'纯净白', c:'#FFFFFF', v:'边界容易消失。浅色边框 + 纯白屏幕 + 浅色背景，导致手机失去层次感。若必须使用纯白，建议搭配黑框。'},
  {n:'深邃黑 ★推荐', c:'#1C1523', v:'呼应深色主体元素，深色在画面中出现两次形成视觉节奏。手机边界最清晰，对比度在全画面最高。'},
  {n:'极淡紫', c:'#F2EDFB', v:'视觉最统一柔和。与画面中的紫色元素同色系，形成“温柔的对比”，自然和谐而不刺眼。'},
  {n:'主题同款紫', c:'#8F6FD6', v:'整体感最强，视觉上像真实的 App 启动页。风险是紫色大面积出现两次，会和左侧主体争夺视觉焦点，削弱了手机作为“独立电子设备”的属性。'},
  {n:'冷灰白（优化方案）', c:'#F8F6FC', v:'带一丝紫调的冷白，并非纯白，因此与背景、边框有微妙的分离感。必须搭配黑框与底部投影才成立，在保留高亮度的同时兼顾了画面层次。'}
];
var FRAMES = [{n:'浅框', c:'#E8E6EA'}, {n:'黑框', c:'#1A1A1A'}];
var BGS = [{n:'淡紫', c:'#EFE9F7'}, {n:'纯白', c:'#FFFFFF'}];
var cur = 0, curF = 0, curB = 0;

var swEl = document.getElementById('swatches');
var frEl = document.getElementById('frameRow');
var bgEl = document.getElementById('bgRow');
var scr = document.getElementById('phscreen');
var frm = document.getElementById('phframe');
var bgr = document.getElementById('bg');
var psh = document.getElementById('phshadow');
var vd = document.getElementById('verdict');

function mark(row, idx) {
  var kids = row.children;
  for (var i = 0; i < kids.length; i++) {
    kids[i].style.borderWidth = (i === idx) ? '2px' : '0.5px';
    kids[i].style.borderColor = (i === idx) ? 'var(--text-accent, #378ADD)' : 'var(--border-strong, #D1D5DB)';
  }
}

for (var i = 0; i < OPTS.length; i++) {
  (function(idx){
    var b = document.createElement('button');
    b.style.cssText = 'display:flex; align-items:center; gap:8px; font-size:13px; text-align:left; justify-content:flex-start; padding:6px 10px; cursor:pointer; background:transparent; border-radius:8px;';
    b.innerHTML = '<span style="width:15px; height:15px; border-radius:4px; flex-shrink:0; border:0.5px solid var(--border-strong, #D1D5DB); background:' + OPTS[idx].c + '"></span><span style="color:var(--text-primary)">' + OPTS[idx].n + '</span>';
    b.onclick = function(){
      cur = idx;
      scr.setAttribute('fill', OPTS[idx].c);
      vd.innerHTML = '<span style="color:var(--text-primary); font-weight:500;">' + OPTS[idx].n + '</span> — ' + OPTS[idx].v;
      mark(swEl, idx);
    };
    swEl.appendChild(b);
  })(i);
}

for (var j = 0; j < FRAMES.length; j++) {
  (function(idx){
    var b = document.createElement('button');
    b.style.cssText = 'flex:1; font-size:13px; padding:6px; cursor:pointer; border-radius:6px; background:transparent; color:var(--text-primary);';
    b.textContent = FRAMES[idx].n;
    b.onclick = function(){ curF = idx; frm.setAttribute('fill', FRAMES[idx].c); mark(frEl, idx); };
    frEl.appendChild(b);
  })(j);
}

for (var k = 0; k < BGS.length; k++) {
  (function(idx){
    var b = document.createElement('button');
    b.style.cssText = 'flex:1; font-size:13px; padding:6px; cursor:pointer; border-radius:6px; background:transparent; color:var(--text-primary);';
    b.textContent = BGS[idx].n;
    b.onclick = function(){ curB = idx; bgr.setAttribute('fill', BGS[idx].c); mark(bgEl, idx); };
    bgEl.appendChild(b);
  })(k);
}

document.getElementById('sh').onchange = function(e){
  psh.setAttribute('opacity', e.target.checked ? '0.13' : '0');
};

swEl.children[0].click();
mark(frEl, 0);
mark(bgEl, 0);
</script>
</body>
</html>
