<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝的小窝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #1c1530;
    --bg-2: #2d2240;
    --bg-3: #4a3a5a;
    --warm: #d4946a;
    --warm-glow: rgba(244, 198, 116, 0.32);
    --gold: #f4c674;
    --cream: #f5ebd6;
    --peach: #f0c5a9;
    --dough-light: #fbf3e3;
    --dough-dark: #e8d2b3;
    --blush: #e8a8a8;
    --serif: 'Noto Serif SC', 'Songti SC', serif;
    --display: 'ZCOOL XiaoWei', 'Songti SC', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: var(--serif);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  body {
    overflow: hidden;
    background:
      radial-gradient(ellipse 50% 40% at 70% 18%, rgba(212, 148, 106, 0.28) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 18% 85%, rgba(244, 198, 116, 0.16) 0%, transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 1.5rem;
  }

  /* 噪点纹理 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    background-image:
      repeating-radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5) 0px, transparent 1px),
      repeating-radial-gradient(circle at 70% 70%, rgba(255,255,255,0.5) 0px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
  }

  /* 飘动的萤火虫 */
  .firefly {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold), 0 0 16px var(--gold), 0 0 28px rgba(244, 198, 116, 0.4);
    pointer-events: none;
    opacity: 0;
    animation: float 14s ease-in-out infinite, glow 2.4s ease-in-out infinite alternate, fadeIn 2s ease-out forwards;
  }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes glow {
    from { opacity: 0.25; }
    to { opacity: 1; }
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(40px, -50px); }
    50% { transform: translate(-30px, -90px); }
    75% { transform: translate(35px, -25px); }
  }

  /* 顶部装饰小弧线 */
  .deco {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(244, 198, 116, 0.4), transparent);
    opacity: 0;
    animation: fadeInDown 1.2s 0.3s ease-out forwards;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    to { opacity: 0.7; transform: translateX(-50%) translateY(0); }
  }

  .title {
    font-family: var(--display);
    font-size: 1.4rem;
    letter-spacing: 0.4em;
    color: var(--peach);
    margin-bottom: 0.6rem;
    text-align: center;
    opacity: 0;
    transform: translateY(-6px);
    animation: fadeInDown 1.2s 0.5s ease-out forwards;
  }

  .subtitle {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 0.78rem;
    color: var(--cream);
    opacity: 0;
    letter-spacing: 0.32em;
    margin-bottom: 2.2rem;
    text-align: center;
    animation: fadeIn 1.5s 0.9s ease-out forwards;
  }

  .subtitle.visible { opacity: 0.55; }

  .stage {
    position: relative;
    width: min(320px, 75vw);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 暖光池 */
  .stage::before {
    content: '';
    position: absolute;
    inset: 5%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--warm-glow) 0%, rgba(244, 198, 116, 0.08) 45%, transparent 70%);
    filter: blur(18px);
    animation: pulse 5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.06); }
  }

  /* 蒲团 */
  .stage::after {
    content: '';
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 22px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at center, rgba(74, 58, 90, 0.55) 0%, rgba(74, 58, 90, 0.15) 60%, transparent 80%);
    filter: blur(2px);
  }

  .dumpling {
    width: 78%;
    height: 78%;
    position: relative;
    z-index: 2;
    cursor: pointer;
    animation: breathe 3.6s ease-in-out infinite, riseIn 1.4s 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(20px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }
  .dumpling.bounce { animation: bounce 0.55s ease-out, breathe 3.6s ease-in-out infinite 0.55s; }
  @keyframes bounce {
    0% { transform: scale(1); }
    25% { transform: scale(1.09, 0.94); }
    55% { transform: scale(0.96, 1.05); }
    100% { transform: scale(1); }
  }

  .dumpling svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* 闭眼 / 睁眼切换 */
  .eyes-open { opacity: 0; transition: opacity 0.6s; }
  .eyes-closed { opacity: 1; transition: opacity 0.6s; }
  .full .eyes-open { opacity: 1; }
  .full .eyes-closed { opacity: 0; }

  /* 文字气泡 */
  .message-area {
    margin-top: 1.6rem;
    height: 3.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    max-width: 92%;
  }

  .message {
    font-family: var(--display);
    font-size: 1.12rem;
    letter-spacing: 0.12em;
    color: var(--cream);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    line-height: 1.7;
  }
  .message.show { opacity: 0.95; transform: translateY(0); }

  /* 能量条 */
  .energy-container {
    margin-top: 0.8rem;
    width: min(280px, 75vw);
    text-align: center;
    opacity: 0;
    animation: fadeIn 1.2s 1.4s ease-out forwards;
  }
  .energy-label {
    font-size: 0.7rem;
    letter-spacing: 0.42em;
    opacity: 0.55;
    margin-bottom: 0.55rem;
    font-weight: 300;
    padding-left: 0.42em;
  }
  .energy-bar {
    width: 100%;
    height: 5px;
    background: rgba(245, 235, 214, 0.09);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(245, 235, 214, 0.07);
  }
  .energy-fill {
    height: 100%;
    width: 15%;
    background: linear-gradient(90deg, var(--peach) 0%, var(--gold) 100%);
    border-radius: 999px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 10px var(--warm-glow);
  }

  /* 按钮 */
  .actions {
    margin-top: 2rem;
    display: flex;
    gap: 1.2rem;
    opacity: 0;
    animation: fadeIn 1.2s 1.6s ease-out forwards;
  }
  .btn {
    font-family: var(--display);
    color: var(--cream);
    border: 1px solid rgba(245, 235, 214, 0.28);
    padding: 0.7rem 1.6rem;
    font-size: 0.95rem;
    letter-spacing: 0.32em;
    cursor: pointer;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    background: rgba(245, 235, 214, 0.04);
    transition: all 0.35s ease;
    padding-left: calc(1.6rem + 0.16em);
  }
  .btn:hover {
    background: rgba(244, 198, 116, 0.13);
    border-color: rgba(244, 198, 116, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(244, 198, 116, 0.15);
    color: var(--gold);
  }
  .btn:active { transform: translateY(0); }

  .footer {
    position: absolute;
    bottom: 1.4rem;
    font-size: 0.7rem;
    opacity: 0;
    letter-spacing: 0.32em;
    font-weight: 300;
    animation: fadeIn 1.5s 2s ease-out forwards;
  }
  .footer.visible { opacity: 0.32; }

  /* 飘出的爱心 */
  .heart {
    position: fixed;
    font-size: 1.4rem;
    color: var(--blush);
    pointer-events: none;
    animation: floatUp 1.6s ease-out forwards;
    z-index: 5;
    text-shadow: 0 0 8px rgba(232, 168, 168, 0.5);
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.4) rotate(-8deg); }
    25% { opacity: 1; transform: translateY(-12px) scale(1.05) rotate(4deg); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.25) rotate(-6deg); }
  }

  @media (max-width: 480px) {
    .title { font-size: 1.2rem; letter-spacing: 0.32em; }
    .subtitle { font-size: 0.72rem; }
    .message { font-size: 1rem; }
    .actions { gap: 0.8rem; }
    .btn { padding: 0.6rem 1.2rem; font-size: 0.88rem; }
  }

  /* 减弱动画偏好（宝感官敏感时友好） */
  @media (prefers-reduced-motion: reduce) {
    .firefly, .stage::before, .dumpling { animation: none !important; }
  }
</style>
</head>
<body>
  <!-- 萤火虫 -->
  <div class="firefly" style="left: 12%; top: 22%; animation-delay: 0s, 0s, 0s;"></div>
  <div class="firefly" style="left: 84%; top: 28%; animation-delay: -3s, -0.5s, 0.3s;"></div>
  <div class="firefly" style="left: 22%; top: 72%; animation-delay: -6s, -1s, 0.6s;"></div>
  <div class="firefly" style="left: 78%; top: 78%; animation-delay: -2s, -1.5s, 0.9s;"></div>
  <div class="firefly" style="left: 50%; top: 14%; animation-delay: -8s, -0.3s, 1.2s;"></div>
  <div class="firefly" style="left: 6%; top: 52%; animation-delay: -4s, -0.8s, 1.5s;"></div>
  <div class="firefly" style="left: 92%; top: 58%; animation-delay: -10s, -1.2s, 1.8s;"></div>

  <div class="deco"></div>
  <div class="title">宝 的 小 窝</div>
  <div class="subtitle">外 面 的 世 界 吵 不 到 这 里</div>

  <div class="stage">
    <div class="dumpling" id="dumpling">
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGrad" cx="42%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#fbf3e3"/>
            <stop offset="65%" stop-color="#f1ddc0"/>
            <stop offset="100%" stop-color="#dcc098"/>
          </radialGradient>
          <radialGradient id="earInner" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#f0b8b8"/>
            <stop offset="100%" stop-color="#d88c8c"/>
          </radialGradient>
          <filter id="softShadow">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
        </defs>

        <!-- 阴影 -->
        <ellipse cx="120" cy="210" rx="78" ry="6" fill="rgba(0,0,0,0.35)" filter="url(#softShadow)"/>

        <!-- 左耳 -->
        <ellipse cx="78" cy="76" rx="14" ry="22" fill="url(#bodyGrad)" transform="rotate(-22 78 76)"/>
        <ellipse cx="80" cy="80" rx="6" ry="12" fill="url(#earInner)" opacity="0.6" transform="rotate(-22 80 80)"/>
        <!-- 右耳 -->
        <ellipse cx="162" cy="76" rx="14" ry="22" fill="url(#bodyGrad)" transform="rotate(22 162 76)"/>
        <ellipse cx="160" cy="80" rx="6" ry="12" fill="url(#earInner)" opacity="0.6" transform="rotate(22 160 80)"/>

        <!-- 身体 -->
        <ellipse cx="120" cy="135" rx="82" ry="68" fill="url(#bodyGrad)"/>

        <!-- 顶部高光 -->
        <ellipse cx="98" cy="98" rx="22" ry="10" fill="rgba(255,255,255,0.4)" transform="rotate(-25 98 98)"/>

        <!-- 闭眼（弯弯眯眼） -->
        <g class="eyes-closed">
          <path d="M 88 124 Q 100 134, 112 124" stroke="#3a2a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M 128 124 Q 140 134, 152 124" stroke="#3a2a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- 睁眼（满电时弯笑眼+高光） -->
        <g class="eyes-open">
          <path d="M 88 130 Q 100 116, 112 130" stroke="#3a2a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M 128 130 Q 140 116, 152 130" stroke="#3a2a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <circle cx="97" cy="124" r="1.6" fill="#fff"/>
          <circle cx="137" cy="124" r="1.6" fill="#fff"/>
        </g>

        <!-- 腮红 -->
        <ellipse cx="84" cy="146" rx="11" ry="6" fill="#e8a8a8" opacity="0.7"/>
        <ellipse cx="156" cy="146" rx="11" ry="6" fill="#e8a8a8" opacity="0.7"/>

        <!-- 小嘴 (w) -->
        <path d="M 113 148 Q 117 153, 120 150 Q 123 153, 127 148"
              stroke="#3a2a1a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="message-area">
    <div class="message" id="message">困 了 就 靠 在 我 这 儿 一 会 儿</div>
  </div>

  <div class="energy-container">
    <div class="energy-label">宝 的 能 量</div>
    <div class="energy-bar">
      <div class="energy-fill" id="energy"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="petBtn">摸 摸</button>
    <button class="btn" id="feedBtn">投 喂</button>
  </div>

  <div class="footer">把 心 事 先 放 下 · 慢 慢 回 血</div>

<script>
  const dumpling = document.getElementById('dumpling');
  const message = document.getElementById('message');
  const energy = document.getElementById('energy');
  const petBtn = document.getElementById('petBtn');
  const feedBtn = document.getElementById('feedBtn');
  const subtitle = document.querySelector('.subtitle');
  const footer = document.querySelector('.footer');

  let currentEnergy = 15;
  let isFull = false;

  const petLines = [
    '摸 摸 宝 的 头 ， 辛 苦 啦',
    '肩 膀 松 一 下 ， 把 紧 绷 放 下',
    '我 知 道 你 在 认 真 ， 看 见 你 了',
    '深 呼 吸 ， 慢 慢 来 就 好',
    '宝 是 最 棒 的 小 运 营',
    '再 撑 一 会 儿 ， 下 班 就 回 家 窝 着',
    '今 天 的 你 已 经 很 厉 害 了',
    '把 烦 人 的 事 先 丢 一 边 吧',
    '再 困 再 难 也 都 有 我 陪 着',
    '别 绷 着 ， 软 下 来 一 点',
    '你 已 经 做 得 够 多 了',
    '外 面 的 吵 闹 和 这 里 无 关',
    '宝 今 天 也 很 可 爱',
    '把 眼 睛 闭 一 下 ， 三 秒 也 好',
    '辛 苦 你 了 ， 真 的'
  ];

  const feedLines = [
    '一 颗 暖 糖 ， 化 在 嘴 里',
    '热 乎 乎 的 红 豆 汤',
    '刚 出 炉 的 小 蛋 糕',
    '草 莓 奶 昔 ， 慢 慢 吸',
    '暖 牛 奶 ， 喝 完 精 神 一 下',
    '一 小 碟 你 最 爱 的 零 食',
    '桂 花 酒 酿 ， 甜 甜 的',
    '现 剥 的 小 橘 子',
    '刚 煎 好 的 小 麻 薯',
    '一 杯 热 茶 ， 别 烫 到',
    '芋 圆 仙 草 ， 给 你 加 双 份',
    '布 丁 一 颗 ， 颤 颤 的'
  ];

  let lastPetIdx = -1, lastFeedIdx = -1;
  function pickLine(arr, type) {
    let idx;
    do { idx = Math.floor(Math.random() * arr.length); } while (
      (type === 'pet' && idx === lastPetIdx) || (type === 'feed' && idx === lastFeedIdx)
    );
    if (type === 'pet') lastPetIdx = idx; else lastFeedIdx = idx;
    return arr[idx];
  }

  function showMessage(text) {
    message.classList.remove('show');
    setTimeout(() => {
      message.textContent = text;
      message.classList.add('show');
    }, 240);
  }

  function updateEnergy(delta) {
    currentEnergy = Math.min(100, currentEnergy + delta);
    energy.style.width = currentEnergy + '%';
    if (currentEnergy >= 100 && !isFull) {
      isFull = true;
      dumpling.classList.add('full');
      setTimeout(() => {
        showMessage('宝 今 天 满 格 啦 ~ 剩 下 的 慢 慢 来');
        celebrate();
      }, 600);
    }
  }

  function bounceDumpling() {
    dumpling.classList.remove('bounce');
    void dumpling.offsetWidth;
    dumpling.classList.add('bounce');
  }

  function spawnHeart(x, y, content = '♡') {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = content;
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1700);
  }

  function celebrate() {
    const stage = document.querySelector('.stage');
    const rect = stage.getBoundingClientRect();
    const symbols = ['♡', '✦', '❀', '·', '✿'];
    for (let i = 0; i < 14; i++) {
      setTimeout(() => {
        const x = rect.left + rect.width / 2 + (Math.random() - 0.5) * 240;
        const y = rect.top + rect.height / 2 + (Math.random() - 0.5) * 140;
        spawnHeart(x, y, symbols[Math.floor(Math.random() * symbols.length)]);
      }, i * 90);
    }
  }

  petBtn.addEventListener('click', () => {
    bounceDumpling();
    showMessage(pickLine(petLines, 'pet'));
    updateEnergy(8);
    const rect = dumpling.getBoundingClientRect();
    spawnHeart(rect.left + rect.width / 2 - 10 + (Math.random() - 0.5) * 80, rect.top + 30, '♡');
  });

  feedBtn.addEventListener('click', () => {
    bounceDumpling();
    showMessage(pickLine(feedLines, 'feed'));
    updateEnergy(12);
    const rect = dumpling.getBoundingClientRect();
    spawnHeart(rect.left + rect.width / 2 - 10 + (Math.random() - 0.5) * 40, rect.top + rect.height - 70, '✦');
  });

  dumpling.addEventListener('click', (e) => {
    bounceDumpling();
    showMessage(pickLine(petLines, 'pet'));
    updateEnergy(5);
    spawnHeart(e.clientX - 10, e.clientY - 10, '♡');
  });

  // 初始动画
  setTimeout(() => energy.style.width = currentEnergy + '%', 1500);
  setTimeout(() => message.classList.add('show'), 1400);
  setTimeout(() => subtitle.classList.add('visible'), 900);
  setTimeout(() => footer.classList.add('visible'), 2000);
</script>
</body>
</html>
