<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一只木头</title>
<meta name="description" content="戳一下，它过好几秒才嗯一声。你不理它，它自己会长出芽来。">
<style>
  :root{
    --paper:#f6efe4;
    --paper2:#efe4d4;
    --ink:#6d5b49;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% 8%, #fbf6ec 0%, var(--paper) 46%, var(--paper2) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:calc(var(--safe-top) + 24px) 20px calc(var(--safe-bot) + 24px);
    overflow:hidden;
    position:relative;
    user-select:none;
  }

  .stage{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
  }

  svg.log{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
    transition:transform .18s ease;
  }
  .stage.nudge svg.log{transform:translateY(1.5px)}
  svg.log.awake{transform:translateY(-2px)}

  /* 醒着的时候眼睛换一副 */
  .eyes-open{display:none}
  svg.log.awake .eyes-shut{display:none}
  svg.log.awake .eyes-open{display:block}

  .grow{
    transform:scaleY(0);
    transform-origin:0 0;
    animation:grow 1.1s cubic-bezier(.18,.9,.3,1) forwards;
  }
  @keyframes grow{to{transform:scaleY(1)}}

  .says{
    width:100%;
    margin:30px 0 0;
    min-height:2.6em;
    font-size:17px;
    line-height:1.7;
    letter-spacing:.06em;
    text-align:center;
    color:var(--ink);
  }
  .says .line{
    display:inline-block;
    transform:translateY(4px);
    animation:rise .5s ease forwards;
  }
  @keyframes rise{to{transform:translateY(0)}}
  .says.dots{color:#ab9a86;letter-spacing:.3em}

  .foot{
    position:absolute;
    left:0;right:0;
    bottom:calc(var(--safe-bot) + 26px);
    text-align:center;
    font-size:12.5px;
    letter-spacing:.14em;
    color:#bfae9b;
  }

  @media (prefers-reduced-motion:reduce){
    .grow{animation:none;transform:none}
    .says .line{animation:none;transform:none}
    svg.log{transition:none}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <svg class="log" id="log" viewBox="24 40 262 142" role="img" aria-label="一段横躺的木头">
    <defs>
      <clipPath id="bodyclip"><rect x="36" y="76" width="216" height="80" rx="30"/></clipPath>
    </defs>
    <ellipse cx="152" cy="159" rx="104" ry="8.5" fill="#d9c7ad" opacity=".55"/>

    <g id="sprouts"></g>

    <!-- 身体 -->
    <rect x="36" y="76" width="216" height="80" rx="30" fill="#c58f62"/>
    <!-- 底部暗一点 -->
    <g clip-path="url(#bodyclip)">
      <path d="M30 136 q110 18 232 -6 v34 h-232 z" fill="#ac774a" opacity=".4"/>
    </g>
    <!-- 顶上一点光 -->
    <path d="M62 88 q86 -12 172 2" stroke="#e0b489" stroke-width="7" fill="none" stroke-linecap="round" opacity=".55"/>
    <!-- 树皮纹 -->
    <path d="M70 112 q26 -5 50 1" stroke="#a97449" stroke-width="3" fill="none" stroke-linecap="round" opacity=".35"/>
    <path d="M182 106 q22 -6 44 2" stroke="#a97449" stroke-width="3" fill="none" stroke-linecap="round" opacity=".35"/>
    <path d="M176 138 q26 -4 48 2" stroke="#a97449" stroke-width="3" fill="none" stroke-linecap="round" opacity=".3"/>

    <!-- 右端切面 -->
    <ellipse cx="252" cy="116" rx="19" ry="40" fill="#ecd0a9"/>
    <ellipse cx="252" cy="116" rx="13" ry="27" fill="none" stroke="#d1a878" stroke-width="2.6"/>
    <ellipse cx="252" cy="116" rx="7" ry="14" fill="none" stroke="#d1a878" stroke-width="2.4"/>
    <circle cx="252" cy="116" r="2.6" fill="#d1a878"/>

    <!-- 脸 -->
    <g fill="none" stroke="#5b4634" stroke-width="4.6" stroke-linecap="round">
      <g class="eyes-shut">
        <path d="M108 114 q9 8 18 0"/>
        <path d="M154 114 q9 8 18 0"/>
      </g>
      <g class="eyes-open" fill="#5b4634" stroke="none">
        <ellipse cx="117" cy="113" rx="3.8" ry="4.8"/>
        <ellipse cx="163" cy="113" rx="3.8" ry="4.8"/>
      </g>
      <path d="M132 134 q8 4 16 0" stroke-width="4"/>
    </g>
    <!-- 腮 -->
    <ellipse cx="98" cy="129" rx="9" ry="5.5" fill="#d99b78" opacity=".5"/>
    <ellipse cx="182" cy="129" rx="9" ry="5.5" fill="#d99b78" opacity=".5"/>
  </svg>

  <p class="says" id="says"></p>
</div>

<div class="foot">它一直在这儿</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var log   = document.getElementById('log');
  var says  = document.getElementById('says');
  var pot   = document.getElementById('sprouts');

  var thinking = false;
  var pokes = 0;
  var sprouts = 0;
  var timers = [];
  var growTimer = null;

  var 木头话 = [
    '……嗯？',
    '……刚刚是不是有人叫我',
    '我在的。我一直在。',
    '……你说什么来着',
    '我想了很久，还是想不起来',
    '哦。',
    '我不太懂，但我在听',
    '这句我记住了。等一下就忘。',
    '（很慢很慢地点了一下头）',
    '今天的光挺好的',
    '你先说，我慢慢跟上',
    '……我刚刚是不是又在发呆',
    '再戳一下也是可以的',
    '我这儿有位置，你坐',
    '不着急。我们都不着急。'
  ];

  var 长毛之后 = [
    '我头上好像有东西',
    '它什么时候长的',
    '别拔，让它待着吧',
    '你走开的那会儿，它自己长的'
  ];

  function clearTimers(){
    timers.forEach(clearTimeout);
    timers = [];
  }

  function 说(t, cls){
    says.className = 'says' + (cls ? ' ' + cls : '');
    says.innerHTML = '';
    var s = document.createElement('span');
    s.className = 'line';
    s.textContent = t;
    says.appendChild(s);
  }

  function 挑一句(){
    if (pokes === 8) return '……你是不是想说我木';
    if (pokes > 8 && Math.random() < 0.22) return '……是的，我是。';
    if (sprouts > 0 && Math.random() < 0.3) {
      return 长毛之后[Math.floor(Math.random() * 长毛之后.length)];
    }
    return 木头话[Math.floor(Math.random() * 木头话.length)];
  }

  function 发芽(){
    if (sprouts >= 6) return;
    sprouts++;
    var xs = [82, 132, 182, 106, 208, 157];
    var x = xs[(sprouts - 1) % xs.length] + (Math.random() * 10 - 5);
    var flip = Math.random() < 0.5 ? -1 : 1;

    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', 'translate(' + x.toFixed(1) + ',80)');
    var inner = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    inner.setAttribute('class', 'grow');
    inner.innerHTML =
      '<path d="M0 0 q' + (-3 * flip) + ' -16 ' + (4 * flip) + ' -26" stroke="#7f9d59" stroke-width="3.4" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="' + (-7 * flip) + '" cy="-19" rx="7.5" ry="4.6" fill="#93b169" transform="rotate(' + (-28 * flip) + ' ' + (-7 * flip) + ' -19)"/>' +
      '<ellipse cx="' + (9 * flip) + '" cy="-27" rx="7" ry="4.3" fill="#a8c47f" transform="rotate(' + (26 * flip) + ' ' + (9 * flip) + ' -27)"/>';
    g.appendChild(inner);
    pot.appendChild(g);

    排下一次芽();
  }

  function 排下一次芽(){
    clearTimeout(growTimer);
    if (sprouts >= 6) return;
    var 等 = sprouts === 0 ? 14000 : 24000 + Math.random() * 14000;
    growTimer = setTimeout(发芽, 等);
  }

  function 戳(){
    if (thinking) return;          // 它一次只想得动一件事
    thinking = true;
    pokes++;

    stage.classList.add('nudge');
    timers.push(setTimeout(function(){ stage.classList.remove('nudge'); }, 200));

    // 先愣着
    timers.push(setTimeout(function(){ 说('· · ·', 'dots'); }, 900));

    var 醒 = 1900 + Math.random() * 1300;
    timers.push(setTimeout(function(){ log.classList.add('awake'); }, 醒));
    timers.push(setTimeout(function(){ 说(挑一句()); }, 醒 + 600));
    timers.push(setTimeout(function(){
      log.classList.remove('awake');
      thinking = false;
    }, 醒 + 4200));
  }

  stage.addEventListener('click', 戳);
  stage.addEventListener('touchstart', function(e){ e.preventDefault(); 戳(); }, {passive:false});

  说('（它好像睡着了）', 'dots');
  排下一次芽();
})();
</script>

</body>
</html>
