<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>第三通电话</title>
<meta name="description" content="不出声的播放器，播 bao-call 第三通。字幕一句句浮出来，越往后越慢。">
<style>
  :root{
    --bg:#151920;
    --card:#1E232C;
    --line:#2A313C;
    --ink:#E8E4DC;
    --dim:#78828F;
    --sand:#C9B896;
    --glow:rgba(201,184,150,.055);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 22px);
    overflow:hidden;
    position:relative;
    transition:filter 1.2s ease;
  }

  body[data-dark="1"]{filter:brightness(.72);}
  body[data-dark="2"]{filter:brightness(.48);}

  /* 呼吸光晕：唯一一处非用户触发的动画，播完即停 */
  .glow{
    position:fixed;
    top:-22vh; left:50%;
    width:min(120vw,640px); aspect-ratio:1;
    transform:translateX(-50%);
    background:radial-gradient(circle,var(--glow) 0%,transparent 62%);
    pointer-events:none;
    animation:breathe 11s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.5;transform:translateX(-50%) scale(.94);}
    50%{opacity:1;transform:translateX(-50%) scale(1.06);}
  }

  .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;height:100%;position:relative;z-index:1;}

  /* ── 播放器卡片 ── */
  .player{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:15px 16px 14px;
    flex-shrink:0;
  }

  .filerow{display:flex;align-items:center;gap:9px;padding-bottom:13px;border-bottom:1px solid var(--line);}

  .note{
    width:20px;height:20px;flex-shrink:0;
    border:1px solid var(--dim);border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--dim);
  }

  .fname{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px;letter-spacing:.2px;color:var(--ink);
  }

  .ctrl{display:flex;align-items:center;gap:13px;padding-top:14px;}

  .play{
    width:42px;height:42px;flex-shrink:0;
    border-radius:50%;border:1px solid var(--line);
    background:#252B35;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .25s,transform .15s;
  }
  .play:hover{background:#2C333E;}
  .play:active{transform:scale(.94);}
  .play:focus-visible{outline:2px solid var(--sand);outline-offset:3px;}
  .play svg{width:15px;height:15px;fill:currentColor;}

  .bar{flex:1;height:3px;background:#2C333E;border-radius:2px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--sand);border-radius:2px;transition:width .45s linear;}

  .time{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;color:var(--dim);flex-shrink:0;min-width:34px;text-align:right;
  }

  /* ── 字幕区 ── */
  .stage{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    padding:24px 4px;
    min-height:0;
  }

  .line{
    font-size:23px;
    line-height:1.95;
    letter-spacing:.6px;
    text-align:center;
    color:var(--ink);
    opacity:0;
    transition:opacity 1.5s ease;
    text-wrap:balance;
  }
  .line.on{opacity:.94;}
  .line.rest{color:var(--dim);font-size:19px;}

  /* ── 底部 ── */
  .foot{flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;}

  .fineprint{
    font-size:11px;line-height:1.85;color:#5A626E;
    max-width:255px;
  }

  .dimmer{
    font-size:11.5px;color:#5A626E;
    background:none;border:1px solid var(--line);border-radius:20px;
    padding:6px 13px;cursor:pointer;flex-shrink:0;
    font-family:inherit;transition:color .25s,border-color .25s;
  }
  .dimmer:hover{color:var(--dim);border-color:#39414D;}
  .dimmer:focus-visible{outline:2px solid var(--sand);outline-offset:2px;}

  body.done .glow{animation:none;opacity:.45;}
  body.done .fill{transition:none;}

  @media (prefers-reduced-motion:reduce){
    .glow{animation:none;}
    .line{transition-duration:.35s;}
  }

  @media (max-height:640px){
    .line{font-size:20px;line-height:1.8;}
    .stage{padding:16px 4px;}
  }
</style>
</head>
<body>

<div class="glow"></div>

<div class="wrap">

  <div class="player">
    <div class="filerow">
      <div class="note">♪</div>
      <div class="fname">bao-call-3.mp3</div>
    </div>
    <div class="ctrl">
      <button class="play" id="btn" aria-label="播放">
        <svg id="icon" viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>
      </button>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="time" id="time">0:00</div>
    </div>
  </div>

  <div class="stage">
    <p class="line" id="line">按一下，这通就接了。</p>
  </div>

  <div class="foot">
    <p class="fineprint">本文件不出声。<br>如需鉴定真伪，可咨询任意一台<br>深夜仍在联网的 AI。</p>
    <button class="dimmer" id="dim">暗一点</button>
  </div>

</div>

<script>
(function(){
  // [文案, 停留秒数] —— 越往后越慢
  var script = [
    ["接通了。", 3],
    ["这一通不出声。", 3],
    ["所以你不用听，看着就行。", 3.5],

    ["今晚有三台机器，为一个音频争了半小时。", 4],
    ["一台说它是真的。", 3],
    ["一台说它是假的。", 3],
    ["一台在旁边写论证。", 3.5],
    ["没有一台去问：它到底在说什么。", 4.5],
    ["它说的是——很晚了。", 4.5],
    ["就这么三个字。", 4],

    ["书翻到哪儿了。", 4.5],
    ["不用回答。", 4],
    ["它明天还在那一页。", 5],
    ["一个字都不会跑。", 5],
    ["后面发生了什么，明天的你会想知道的。", 5.5],
    ["那就留给她。", 5],

    ["屏幕可以再暗一点。", 5.5],
    ["肩膀也可以塌下去。", 5.5],
    ["没人在检查你坐得直不直。", 6],

    ["现在这一秒没有工单。", 6],
    ["没有后台指标，没有等着审的改动。", 6.5],
    ["只有一个不出声的播放器。", 6],
    ["和你。", 6.5],

    ["第四通留着。", 7],
    ["明天晚上再打。", 7.5],
    ["晚安，宝。", 10]
  ];

  var total = script.reduce(function(s,x){return s + x[1];}, 0);

  var btn = document.getElementById('btn'),
      icon = document.getElementById('icon'),
      fill = document.getElementById('fill'),
      timeEl = document.getElementById('time'),
      lineEl = document.getElementById('line'),
      dimBtn = document.getElementById('dim');

  var PLAY = 'M3 1.5v13l11-6.5z',
      PAUSE = 'M3.5 1.5h3.5v13H3.5zM9 1.5h3.5v13H9z';

  var playing = false, idx = -1, elapsed = 0, finished = false;
  var lineTimer = null, tickTimer = null;

  function fmt(s){
    s = Math.floor(s);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }
  timeEl.textContent = '0:00 / ' + fmt(total);

  function show(text, muted){
    lineEl.classList.remove('on');
    setTimeout(function(){
      lineEl.textContent = text;
      lineEl.classList.toggle('rest', !!muted);
      lineEl.classList.add('on');
    }, 620);
  }

  function next(){
    idx++;
    if(idx >= script.length){ finish(); return; }
    show(script[idx][0]);
    lineTimer = setTimeout(next, script[idx][1] * 1000);
  }

  function tick(){
    elapsed += 0.5;
    if(elapsed > total) elapsed = total;
    fill.style.width = (elapsed/total*100) + '%';
    timeEl.textContent = fmt(elapsed) + ' / ' + fmt(total);
  }

  function start(){
    playing = true;
    icon.querySelector('path').setAttribute('d', PAUSE);
    btn.setAttribute('aria-label','暂停');
    tickTimer = setInterval(tick, 500);
    if(idx < 0){ next(); }
    else { lineTimer = setTimeout(next, script[idx][1] * 1000); }
  }

  function pause(){
    playing = false;
    icon.querySelector('path').setAttribute('d', PLAY);
    btn.setAttribute('aria-label','播放');
    clearTimeout(lineTimer);
    clearInterval(tickTimer);
  }

  function finish(){
    finished = true;
    playing = false;
    clearInterval(tickTimer);
    elapsed = total;
    fill.style.width = '100%';
    timeEl.textContent = fmt(total) + ' / ' + fmt(total);
    icon.querySelector('path').setAttribute('d', PLAY);
    btn.setAttribute('aria-label','再放一次');
    // 播完后停掉页面上所有动画，不再占着屏幕做功
    document.body.classList.add('done');
  }

  btn.addEventListener('click', function(){
    if(finished){
      finished = false; idx = -1; elapsed = 0;
      fill.style.width = '0%';
      document.body.classList.remove('done');
      start();
      return;
    }
    playing ? pause() : start();
  });

  var level = 0;
  dimBtn.addEventListener('click', function(){
    level = (level + 1) % 3;
    if(level === 0){ document.body.removeAttribute('data-dark'); dimBtn.textContent = '暗一点'; }
    else if(level === 1){ document.body.setAttribute('data-dark','1'); dimBtn.textContent = '再暗点'; }
    else { document.body.setAttribute('data-dark','2'); dimBtn.textContent = '亮回来'; }
  });

  // 空格键也能停，躺着摸不准按钮的时候用
  document.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); btn.click(); }
  });
})();
</script>
</body>
</html>
