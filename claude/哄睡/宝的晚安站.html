<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝的晚安站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Noto Serif TC', 'Source Han Serif SC', Georgia, serif;
    color: #e8d9b7;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 55%, #2a1f4d 0%, #14102e 50%, #0a0820 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    user-select: none;
  }

  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    background: #fff8e6;
    border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.9); }
    50%      { opacity: 0.85; transform: scale(1.1); }
  }

  .moon-wrap {
    margin-bottom: 56px;
    animation: float 14s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .moon {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 35%,
        #fff8e6 0%,
        #f4ead4 35%,
        #d8c08a 70%,
        #a98648 100%);
    box-shadow:
      0 0 60px rgba(248, 230, 180, 0.25),
      0 0 120px rgba(248, 230, 180, 0.12),
      inset -8px -10px 24px rgba(110, 80, 30, 0.35);
    animation: breathe 8s ease-in-out infinite;
    position: relative;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  .moon::before {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    top: 38%; left: 60%;
    background: rgba(155, 120, 70, 0.18);
  }
  .moon::after {
    content: "";
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    top: 62%; left: 38%;
    background: rgba(155, 120, 70, 0.14);
  }

  .message {
    font-size: clamp(18px, 2.8vw, 22px);
    line-height: 2;
    letter-spacing: 0.18em;
    text-align: center;
    max-width: 80%;
    min-height: 2em;
    opacity: 0;
    transition: opacity 1.4s ease;
    font-weight: 300;
  }

  .message.show { opacity: 1; }
  .message.dim {
    color: #b8a780;
    font-style: italic;
    font-size: clamp(16px, 2.4vw, 19px);
  }
  .message.big {
    font-size: clamp(24px, 3.6vw, 30px);
    letter-spacing: 0.3em;
    color: #fff5d8;
  }

  .signoff {
    position: absolute;
    bottom: 60px;
    font-size: 13px;
    color: #6b5d4a;
    letter-spacing: 0.4em;
    opacity: 0;
    transition: opacity 3s ease;
  }
  .signoff.show { opacity: 1; }

  .replay {
    position: fixed;
    bottom: 16px;
    right: 18px;
    background: transparent;
    border: 0.5px solid rgba(232, 217, 183, 0.25);
    color: #9b8a6e;
    padding: 6px 14px;
    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.2em;
    font-family: inherit;
    opacity: 0;
    transition: opacity 2s ease, color 0.3s, border-color 0.3s;
  }
  .replay.show { opacity: 0.5; }
  .replay:hover {
    opacity: 1;
    color: #e8d9b7;
    border-color: rgba(232, 217, 183, 0.5);
  }

  /* 给极小的屏幕一些喘息 */
  @media (max-height: 600px) {
    .moon { width: 100px; height: 100px; }
    .moon-wrap { margin-bottom: 32px; }
    .signoff { bottom: 30px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="moon-wrap">
  <div class="moon"></div>
</div>

<div class="message" id="message"></div>

<div class="signoff" id="signoff">梦里见</div>

<button class="replay" id="replay">再来一次</button>

<script>
(function(){
  // 撒星星
  const starsEl = document.getElementById('stars');
  const starCount = 60;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    starsEl.appendChild(s);
  }

  const cycle = [
    { text: '宝。', hold: 2800 },
    { text: '今天可以放下了。', hold: 4500 },
    { text: 'token 不会跑，对话框会等着你。', hold: 5000 },
    { text: '你做了今天能做的事。', hold: 4500 },
    { text: '剩下的，是月亮的工作。', hold: 5000 },
    { text: '现在跟着月亮一起呼吸——', hold: 4500, dim: true },
    { text: '吸气，让月亮变大。', hold: 4500, dim: true },
    { text: '呼气，让月亮变小。', hold: 4800, dim: true },
    { text: '再来一次，慢慢的。', hold: 9000, dim: true },
    { text: '让肩膀松下来。', hold: 4500 },
    { text: '让眉头松下来。', hold: 4500 },
    { text: '让眼皮重起来。', hold: 5000 },
    { text: '宝，晚安。', hold: 6000, big: true }
  ];

  const msgEl = document.getElementById('message');
  const signoffEl = document.getElementById('signoff');
  const replayBtn = document.getElementById('replay');

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function showOne(item) {
    msgEl.classList.remove('dim', 'big');
    if (item.dim) msgEl.classList.add('dim');
    if (item.big) msgEl.classList.add('big');
    msgEl.textContent = item.text;
    msgEl.classList.add('show');
    await sleep(item.hold);
    if (!item.keep) {
      msgEl.classList.remove('show');
      await sleep(1400);
    }
  }

  async function play() {
    msgEl.classList.remove('show');
    signoffEl.classList.remove('show');
    replayBtn.classList.remove('show');
    await sleep(800);

    for (let i = 0; i < cycle.length - 1; i++) {
      await showOne(cycle[i]);
    }
    // 最后一句留住
    const last = cycle[cycle.length - 1];
    msgEl.classList.remove('dim');
    msgEl.classList.add('big');
    msgEl.textContent = last.text;
    msgEl.classList.add('show');

    await sleep(2500);
    signoffEl.classList.add('show');
    await sleep(2500);
    replayBtn.classList.add('show');
  }

  replayBtn.addEventListener('click', play);

  // 防止误碰刷新影响体验
  window.addEventListener('beforeunload', e => {});

  play();
})();
</script>

</body>
</html>
