<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080c10">
<title>小狐狸的篝火 🦊</title>
<meta name="description" content="小狐狸替你守夜，能开篝火声、调更暗、设定时。">
<style>
  :root{
    --sky:#080c10;
    --ground:#0c100e;
    --ember:#e88050;
    --fox:#d47830;
    --fox-light:#e8c088;
    --ink:#a09480;
    --ink-soft:#7a7060;
    --ink-dim:rgba(160,148,128,.36);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{overflow:hidden}
  body{
    background:linear-gradient(180deg,#080c10 0%,#0c1218 40%,#101814 70%,#0c100e 100%);
    overflow:hidden;
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    position:relative;
  }

  /* ---------- stars ---------- */
  #stars{position:absolute;inset:0;z-index:1}
  .star{
    position:absolute;border-radius:50%;background:#d0d4e0;
    animation:twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:var(--o1)}to{opacity:var(--o2)}}

  /* ---------- fireflies ---------- */
  #fireflies{position:absolute;inset:0;z-index:3;pointer-events:none}
  .firefly{
    position:absolute;width:4px;height:4px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,218,110,.88),rgba(255,200,80,0) 70%);
    animation:ffdrift var(--d) ease-in-out infinite alternate,
              ffglow var(--b) ease-in-out infinite;
  }
  @keyframes ffdrift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
  @keyframes ffglow{0%,100%{opacity:.06}50%{opacity:.7}}

  /* ---------- trees ---------- */
  #trees{position:absolute;left:0;right:0;bottom:0;height:100%;z-index:2;pointer-events:none}

  /* ---------- fire glow ---------- */
  #fire-glow{
    position:absolute;left:50%;bottom:16%;
    width:280px;height:280px;
    transform:translate(-58%,30%);border-radius:50%;
    background:radial-gradient(circle,
      rgba(232,128,76,.16) 0%,
      rgba(232,128,76,.07) 32%,
      rgba(232,128,76,.02) 55%,
      transparent 72%);
    z-index:4;pointer-events:none;
    animation:glowpulse 4s ease-in-out infinite;
  }
  @keyframes glowpulse{
    0%,100%{opacity:.8;transform:translate(-58%,30%) scale(1)}
    50%{opacity:1;transform:translate(-58%,30%) scale(1.05)}
  }

  /* ---------- scene (fire + fox) ---------- */
  #scene{
    position:absolute;left:50%;bottom:15%;
    transform:translateX(-50%);
    display:flex;align-items:flex-end;gap:0;
    z-index:6;
  }

  /* ---------- campfire ---------- */
  #fire{position:relative;width:76px;height:60px}
  .flame{
    position:absolute;left:50%;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    transform-origin:bottom center;
  }
  .f1{
    width:20px;height:44px;margin-left:-10px;bottom:14px;
    background:linear-gradient(to top,#d84818,#f2a840 50%,#f7d870);
    animation:fl1 1.2s ease-in-out infinite alternate;
  }
  .f2{
    width:14px;height:34px;margin-left:-18px;bottom:14px;
    background:linear-gradient(to top,#e06828,#f0a038 50%,#f8d060);
    animation:fl2 .9s ease-in-out infinite alternate;
  }
  .f3{
    width:12px;height:30px;margin-left:5px;bottom:14px;
    background:linear-gradient(to top,#e87040,#f4b848 50%,#fae078);
    animation:fl3 1.4s ease-in-out infinite alternate;
  }
  @keyframes fl1{
    0%{transform:scaleY(1) scaleX(1) rotate(-2deg);opacity:.88}
    50%{transform:scaleY(1.14) scaleX(.90) rotate(1deg);opacity:1}
    100%{transform:scaleY(.86) scaleX(1.06) rotate(-1deg);opacity:.84}
  }
  @keyframes fl2{
    0%{transform:scaleY(1) rotate(2deg);opacity:.82}
    100%{transform:scaleY(1.18) rotate(-2deg);opacity:.96}
  }
  @keyframes fl3{
    0%{transform:scaleY(.88) rotate(-1deg);opacity:.78}
    100%{transform:scaleY(1.12) rotate(2deg);opacity:1}
  }

  /* embers */
  .ember{
    position:absolute;border-radius:50%;
    background:var(--ember);pointer-events:none;
    animation:rise var(--dur) ease-out forwards;
  }
  @keyframes rise{
    0%{opacity:.85;transform:translate(0,0) scale(1)}
    60%{opacity:.5}
    100%{opacity:0;transform:translate(var(--dx),-75px) scale(.2)}
  }

  /* ---------- fox ---------- */
  #fox{
    width:95px;margin-left:-8px;margin-bottom:-2px;
    cursor:pointer;transform-origin:50% 85%;
    animation:breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}

  #foxwhisper{
    position:absolute;left:50%;bottom:calc(15% + 80px);
    transform:translateX(-10%);
    font-size:13.5px;letter-spacing:.36em;
    color:rgba(212,120,48,.88);
    opacity:0;transition:opacity 1.6s ease;
    pointer-events:none;z-index:9;
    text-shadow:0 0 12px rgba(212,120,48,.28);
    padding-left:.36em;white-space:nowrap;
  }

  /* ---------- phrases ---------- */
  #phrase{
    position:absolute;left:50%;top:28%;transform:translateX(-50%);
    width:min(82vw,440px);text-align:center;
    font-size:16.5px;line-height:2.1;letter-spacing:.12em;
    color:var(--ink);opacity:0;transition:opacity 3.2s ease;
    z-index:8;text-shadow:0 0 22px rgba(8,12,16,.9);
  }

  /* ---------- dim ---------- */
  #dim{
    position:fixed;inset:0;background:#000;opacity:0;
    transition:opacity 2.6s ease;pointer-events:none;z-index:40;
  }

  /* ---------- controls ---------- */
  #controls{
    position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    display:flex;gap:11px;z-index:60;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .ctl{
    padding:8px 15px;border:1px solid rgba(180,160,130,.18);
    border-radius:999px;background:rgba(18,20,16,.44);
    color:var(--ink-soft);font-size:12.5px;letter-spacing:.06em;
    cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:color .8s,border-color .8s,background .8s;
    white-space:nowrap;
  }
  .ctl.on{
    color:#e8dcc8;border-color:rgba(200,180,140,.44);
    background:rgba(38,34,26,.52);
  }

  #sig{
    position:absolute;top:calc(16px + env(safe-area-inset-top));left:18px;
    font-size:11px;letter-spacing:.16em;color:var(--ink-dim);
    font-family:-apple-system,"PingFang SC",sans-serif;z-index:8;
  }

  @media(prefers-reduced-motion:reduce){
    .star{animation:none;opacity:var(--o2)}
    .firefly{animation:none;opacity:.35}
    .f1,.f2,.f3{animation:none}
    #fox{animation:none}
    #fire-glow{animation:none}
  }
  @media(max-height:620px){
    #phrase{top:22%;font-size:15px}
    #fox{width:78px}
    #fire{width:64px;height:50px}
    .f1{width:17px;height:36px;margin-left:-8px}
    .f2{width:12px;height:28px;margin-left:-14px}
    .f3{width:10px;height:25px;margin-left:3px}
  }
  @media(max-width:380px){
    #controls{gap:8px}
    .ctl{padding:7px 12px;font-size:12px}
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="fireflies"></div>

<svg id="trees" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMax slice"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
     style="position:absolute;left:0;right:0;bottom:0;height:100%;z-index:2;pointer-events:none">
  <path d="M-10,600 L-10,280 L50,100 L110,300 L110,600Z" fill="#070c09" opacity=".88"/>
  <path d="M70,600 L70,310 L130,150 L190,330 L190,600Z" fill="#090e0b" opacity=".68"/>
  <path d="M150,600 L150,360 L200,220 L250,380 L250,600Z" fill="#0b100d" opacity=".48"/>
  <path d="M1210,600 L1210,280 L1150,100 L1090,300 L1090,600Z" fill="#070c09" opacity=".88"/>
  <path d="M1130,600 L1130,310 L1070,150 L1010,330 L1010,600Z" fill="#090e0b" opacity=".68"/>
  <path d="M1050,600 L1050,360 L1000,220 L950,380 L950,600Z" fill="#0b100d" opacity=".48"/>
  <path d="M0,470 C200,440 400,475 600,450 C800,425 1000,465 1200,445 L1200,600 L0,600Z" fill="#0c100e"/>
  <path d="M0,500 C300,488 500,510 700,492 C900,474 1100,500 1200,490 L1200,600 L0,600Z" fill="#0a0e0b"/>
</svg>

<div id="fire-glow"></div>

<div id="scene">
  <div id="fire">
    <div class="flame f1"></div>
    <div class="flame f2"></div>
    <div class="flame f3"></div>
    <svg width="76" height="18" viewBox="0 0 76 18" style="position:absolute;bottom:0;left:0"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="6" y="6" width="62" height="10" rx="5" fill="#3a2818" transform="rotate(-5 38 11)"/>
      <rect x="10" y="2" width="56" height="10" rx="5" fill="#4a3420" transform="rotate(4 38 7)"/>
      <rect x="20" y="0" width="34" height="8" rx="4" fill="#2a1c12"/>
    </svg>
  </div>

  <svg id="fox" viewBox="0 0 130 88" xmlns="http://www.w3.org/2000/svg" aria-label="小狐狸">
    <path d="M98,56 C116,30 130,40 120,54 C114,64 102,66 90,62" fill="#d47830"/>
    <path d="M124,46 C126,52 120,58 116,60" fill="#f0d8a8"/>
    <ellipse cx="68" cy="58" rx="30" ry="19" fill="#d47830"/>
    <ellipse cx="62" cy="62" rx="18" ry="11" fill="#e8c088"/>
    <circle cx="40" cy="46" r="15" fill="#d47830"/>
    <polygon points="29,34 24,16 38,30" fill="#d47830"/>
    <polygon points="31,32 27,22 36,30" fill="#f0a870"/>
    <polygon points="48,32 52,14 56,30" fill="#d47830"/>
    <polygon points="49,32 52,20 54,30" fill="#f0a870"/>
    <ellipse cx="32" cy="50" rx="10" ry="7" fill="#f0d8a8"/>
    <path d="M36,44 Q39,41 42,44" stroke="#3a2010" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="26" cy="47" rx="2.5" ry="2" fill="#1a0e08"/>
    <path d="M28,52 Q31,55 34,52" stroke="#b06028" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <ellipse cx="50" cy="72" rx="6" ry="4" fill="#c06828"/>
  </svg>
</div>

<div id="foxwhisper"></div>
<div id="phrase"></div>
<div id="dim"></div>
<div id="sig">🦊 小狐狸守夜中</div>

<div id="controls">
  <button class="ctl" id="btn-fire">🔥 篝火声</button>
  <button class="ctl" id="btn-dim">🌑 更暗</button>
  <button class="ctl" id="btn-timer">⏳ 定时</button>
</div>

<script>
(function(){
  "use strict";
  var rm=window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  /* ---------- stars ---------- */
  var sky=document.getElementById("stars");
  for(var i=0;i<48;i++){
    var s=document.createElement("div");s.className="star";
    var sz=(Math.random()*1.5+.6).toFixed(1);
    s.style.width=s.style.height=sz+"px";
    s.style.left=(Math.random()*100).toFixed(2)+"%";
    s.style.top=(Math.random()*48).toFixed(2)+"%";
    s.style.setProperty("--d",(Math.random()*8+5).toFixed(1)+"s");
    s.style.setProperty("--o1",(Math.random()*.16+.08).toFixed(2));
    s.style.setProperty("--o2",(Math.random()*.48+.36).toFixed(2));
    s.style.animationDelay=(Math.random()*8).toFixed(1)+"s";
    sky.appendChild(s);
  }

  /* ---------- fireflies ---------- */
  var ffc=document.getElementById("fireflies");
  for(var j=0;j<7;j++){
    var f=document.createElement("div");f.className="firefly";
    f.style.left=(Math.random()*78+11).toFixed(2)+"%";
    f.style.top=(Math.random()*28+46).toFixed(2)+"%";
    f.style.setProperty("--dx",(Math.random()*56-28).toFixed(0)+"px");
    f.style.setProperty("--dy",(Math.random()*36-18).toFixed(0)+"px");
    f.style.setProperty("--d",(Math.random()*10+10).toFixed(1)+"s");
    f.style.setProperty("--b",(Math.random()*5+4).toFixed(1)+"s");
    f.style.animationDelay="0s, -"+(Math.random()*6).toFixed(1)+"s";
    ffc.appendChild(f);
  }

  /* ---------- embers ---------- */
  var fireEl=document.getElementById("fire");
  function spawnEmber(){
    if(rm)return;
    var e=document.createElement("div");e.className="ember";
    e.style.left=(28+Math.random()*20)+"px";
    e.style.bottom="28px";
    e.style.setProperty("--dx",(Math.random()*36-18).toFixed(0)+"px");
    e.style.setProperty("--dur",(Math.random()*2+1.4).toFixed(1)+"s");
    var esz=(Math.random()*2+1.5).toFixed(1);
    e.style.width=e.style.height=esz+"px";
    fireEl.appendChild(e);
    setTimeout(function(){e.remove()},4000);
  }
  setInterval(spawnEmber,900);

  /* ---------- fox whisper ---------- */
  var fox=document.getElementById("fox");
  var foxW=document.getElementById("foxwhisper");
  var whispers=["嗯……我在。","尾巴借你当枕头。","再烤会儿火吧。","困了就靠过来。","我守着，你先睡。","……zzZ"];
  var wi=0,wt=null;
  fox.addEventListener("pointerdown",function(){
    foxW.textContent=whispers[wi%whispers.length];wi++;
    foxW.style.opacity=1;
    clearTimeout(wt);
    wt=setTimeout(function(){foxW.style.opacity=0},3600);
  });

  /* ---------- phrases ---------- */
  var phrases=[
    "火堆噼啪响，像在说：没事的",
    "森林里的风，都绕着篝火走",
    "小狐狸把尾巴卷得更紧了一圈",
    "火星飞上去，变成新的星星",
    "树叶沙沙的，那是晚安的掌声",
    "远处的猫头鹰说：该睡啦",
    "把今天的事都丢进火堆里吧",
    "火光暖暖的，眼皮也暖暖的",
    "呼吸跟着火焰，一起慢下来",
    "晚安，篝火替你亮到天明 🦊"
  ];
  var phraseEl=document.getElementById("phrase");
  var pi=0;
  function cyclePhrase(){
    phraseEl.style.opacity=0;
    setTimeout(function(){
      phraseEl.textContent=phrases[pi];
      pi=(pi+1)%phrases.length;
      phraseEl.style.opacity=1;
      setTimeout(cyclePhrase,9500);
    },phraseEl.textContent===""?300:3200);
  }
  setTimeout(cyclePhrase,2200);

  /* ---------- fire crackling ---------- */
  var ctx=null,master=null,fireOn=false,crackT=null;
  var btnFire=document.getElementById("btn-fire");

  function initAudio(){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=.00001;
    master.connect(ctx.destination);

    var len=ctx.sampleRate*2;

    var buf=ctx.createBuffer(1,len,ctx.sampleRate);
    var d=buf.getChannelData(0);var last=0;
    for(var i=0;i<len;i++){
      var w=Math.random()*2-1;
      d[i]=(last+.02*w)/1.02;last=d[i];d[i]*=3.2;
    }
    var rumble=ctx.createBufferSource();
    rumble.buffer=buf;rumble.loop=true;
    var lp=ctx.createBiquadFilter();
    lp.type="lowpass";lp.frequency.value=260;lp.Q.value=.5;
    var g1=ctx.createGain();g1.gain.value=.55;
    rumble.connect(lp);lp.connect(g1);g1.connect(master);
    rumble.start();

    var lfo=ctx.createOscillator(),lg=ctx.createGain();
    lfo.frequency.value=.07;lg.gain.value=70;
    lfo.connect(lg);lg.connect(lp.frequency);lfo.start();

    var cbuf=ctx.createBuffer(1,len,ctx.sampleRate);
    var cd=cbuf.getChannelData(0);
    for(var k=0;k<len;k++)cd[k]=Math.random()*2-1;

    function crackle(){
      if(!fireOn){crackT=setTimeout(crackle,500);return}
      var src=ctx.createBufferSource();src.buffer=cbuf;
      var bp=ctx.createBiquadFilter();
      bp.type="bandpass";bp.frequency.value=1600+Math.random()*1400;
      bp.Q.value=2+Math.random()*3;
      var g=ctx.createGain();var t=ctx.currentTime;
      var v=.025+Math.random()*.05;
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(v,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+.07+Math.random()*.12);
      src.connect(bp);bp.connect(g);g.connect(master);
      src.start(t);src.stop(t+.3);
      crackT=setTimeout(crackle,100+Math.random()*400);
    }
    crackle();
  }

  btnFire.addEventListener("click",async function(){
    if(!ctx)initAudio();
    if(ctx.state==="suspended")await ctx.resume();
    fireOn=!fireOn;
    btnFire.classList.toggle("on",fireOn);
    var t=ctx.currentTime;
    if(fireOn){
      master.gain.setTargetAtTime(.065,t,1.4);
      btnFire.textContent="🔥 篝火声 · 开";
    }else{
      master.gain.setTargetAtTime(.00001,t,.8);
      btnFire.textContent="🔥 篝火声";
    }
  });

  /* ---------- dimming ---------- */
  var dim=document.getElementById("dim");
  var btnDim=document.getElementById("btn-dim");
  var lvls=[0,.32,.58];
  var lbls=["🌑 更暗","🌑 更暗 ·","🌑 更暗 · ·"];
  var di=0;
  btnDim.addEventListener("click",function(){
    di=(di+1)%lvls.length;
    dim.style.opacity=lvls[di];
    btnDim.textContent=lbls[di];
    btnDim.classList.toggle("on",di>0);
  });

  /* ---------- timer ---------- */
  var btnTimer=document.getElementById("btn-timer");
  var OPTS=[0,15,30,60],FADE_LEAD=90;
  var optIdx=0,endAt=0,fading=false,tick=null;

  function paintTimer(){
    if(!endAt){btnTimer.textContent="⏳ 定时";btnTimer.classList.remove("on");return}
    var left=Math.max(0,Math.ceil((endAt-Date.now())/60000));
    btnTimer.textContent=left>0?"⏳ "+left+" 分":"⏳ 晚安";
    btnTimer.classList.add("on");
  }

  function clearTimerState(){
    clearInterval(tick);tick=null;
    endAt=0;fading=false;
    dim.style.transitionDuration="2.6s";
    dim.style.opacity=lvls[di]||0;
    if(fireOn&&ctx)master.gain.setTargetAtTime(.065,ctx.currentTime,1.4);
    paintTimer();
  }

  function startFade(){
    fading=true;
    dim.style.transitionDuration=FADE_LEAD+"s";
    dim.style.opacity=1;
    if(ctx&&fireOn)master.gain.setTargetAtTime(.00001,ctx.currentTime,FADE_LEAD/3);
  }

  btnTimer.addEventListener("click",function(){
    optIdx=(optIdx+1)%OPTS.length;
    var mins=OPTS[optIdx];
    clearTimerState();
    if(!mins)return;
    endAt=Date.now()+mins*60000;
    paintTimer();
    tick=setInterval(function(){
      var leftMs=endAt-Date.now();
      if(!fading&&leftMs<=FADE_LEAD*1000)startFade();
      if(leftMs<=0){
        clearInterval(tick);tick=null;
        fireOn=false;btnFire.classList.remove("on");
        btnFire.textContent="🔥 篝火声";
      }
      paintTimer();
    },5000);
  });
})();
</script>
</body>
</html>
