<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>明天再叼</title>
<meta name="description" content="打烊以后，StashYu 把今天的碎片收进抽屉，FetchMo 只叼回一片。剩下的明天再叼。">
<meta name="theme-color" content="#1E1A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- momoyu 系列 · 哄睡。两只的格子图照抄自 claude/小科普/momoyu造型宪法.html，一格没改。
     动的只有位置和眼睛；时间函数用 steps()。cc 做的 · 2026.09 -->
<style>
  :root{
    --night:#1E1A20; --wall:#2A2429; --wall-2:#332C31;
    --ink:#EDE4D8; --ink-2:#A79D92; --ink-3:#6F675F;
    --lamp:#F6D9A4; --lamp-2:#E8B86B; --moon:#C9D2E6;
    --wood:#5C4433; --wood-2:#3F2E24; --drawer:#8B6A4E; --drawer-2:#A88262; --handle:#2B1E17;
    --paper:#F7EEDD; --paper-line:#C9B79B;
    --counter:#4A3A33; --counter-top:#6A5446;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--night); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    line-height:1.7; min-height:100vh; min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  .room{max-width:440px;margin:0 auto;padding:30px 16px 48px}
  .kicker{font-size:12px;letter-spacing:.2em;color:var(--ink-3);margin:0 0 6px}
  h1{font-size:24px;font-weight:600;letter-spacing:.06em;margin:0 0 22px}

  /* ── 柜台 ── */
  .stage{
    position:relative; width:320px; height:236px; margin:0 auto;
    background:var(--wall); border-radius:16px; overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
    cursor:pointer;
  }
  .stage > *{position:absolute}
  .counter{left:0;right:0;bottom:0;height:60px;background:var(--counter);border-top:4px solid var(--counter-top)}
  .glow{
    left:110px; top:40px; width:210px; height:170px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(246,217,164,.62), rgba(246,217,164,.28) 55%, rgba(246,217,164,0));
    transition:opacity 2.4s ease, background 2.4s ease;
    animation:breathe 6s ease-in-out infinite;
  }
  .stage.dim .glow{
    background:radial-gradient(closest-side, rgba(201,210,230,.34), rgba(201,210,230,.14) 55%, rgba(201,210,230,0));
    animation-duration:9s;
  }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .cord{left:214px;top:0;width:2px;height:30px;background:#7A6C60}
  .shade{left:196px;top:28px;width:38px;height:16px;background:var(--lamp-2);border-radius:2px 2px 6px 6px;transition:background 2.4s ease}
  .shade::after{content:"";position:absolute;left:4px;right:4px;bottom:-4px;height:4px;background:var(--lamp);border-radius:0 0 4px 4px;transition:background 2.4s ease}
  .stage.dim .shade{background:#5A514D}
  .stage.dim .shade::after{background:#7C7770}
  .sign{left:14px;top:16px;padding:2px 7px;font-size:10px;letter-spacing:.18em;color:var(--ink-2);background:var(--wall-2);border:1px solid #3F373C;border-radius:3px}
  .sign::before{content:"";position:absolute;left:50%;top:-8px;width:1px;height:8px;background:#5A5056;margin-left:-1px}

  /* 抽屉柜 */
  .cabinet{left:18px;top:82px;width:84px;height:94px;background:var(--wood);border:3px solid var(--wood-2);border-bottom:0;border-radius:3px 3px 0 0;padding:4px}
  .cabinet .dr{position:absolute;width:35px;height:25px;background:var(--drawer);border-radius:2px;transition:transform .25s steps(3), background .25s steps(2)}
  .cabinet .dr::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:3px;margin:-1px 0 0 -5px;background:var(--handle);border-radius:1px}
  .cabinet .dr.open{transform:translateY(4px);background:var(--drawer-2)}
  .cabinet .dr:nth-child(1){left:4px;top:4px}.cabinet .dr:nth-child(2){left:43px;top:4px}
  .cabinet .dr:nth-child(3){left:4px;top:33px}.cabinet .dr:nth-child(4){left:43px;top:33px}
  .cabinet .dr:nth-child(5){left:4px;top:62px}.cabinet .dr:nth-child(6){left:43px;top:62px}

  /* 两只：脚踩同一条线 */
  .fig{bottom:60px;transition:transform .32s steps(4)}
  .fig svg{display:block;position:static}
  #fox{left:124px}
  #cat{left:216px}
  .fig.hop{animation:hop .36s steps(3) 1}
  @keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  #cat.lean{transform:translateX(-14px)}

  /* 纸片 */
  .scrap{width:12px;height:9px;background:var(--paper);border-radius:1px;opacity:0;transition:transform .55s steps(7), opacity .2s steps(1)}
  .scrap::after{content:"";position:absolute;left:2px;right:2px;top:3px;height:1px;background:var(--paper-line);box-shadow:0 2px 0 var(--paper-line)}
  .scrap.on{opacity:1}
  .scrap.gone{opacity:0;transition:transform .55s steps(7), opacity .1s steps(1) .5s}
  #mouth{left:262px;bottom:78px;width:12px;height:9px;opacity:0;transition:opacity .1s steps(1)}
  #mouth.on{opacity:1}

  /* zZ */
  .zz{opacity:0}
  .zz.on{opacity:1;animation:float 3.2s steps(6) infinite}
  #zz1{left:196px;bottom:118px}
  #zz2{left:206px;bottom:116px;animation-delay:1.6s}
  @keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-22px)}}

  /* 那一片 */
  .card{
    left:50%;top:50%;width:200px;padding:22px 18px 16px;margin:-60px 0 0 -100px;
    background:var(--paper);color:#3A2E27;border-radius:6px;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;
    transform:translateY(8px);transition:opacity .4s steps(4),transform .4s steps(4);
  }
  .card.on{opacity:1;transform:translateY(0)}
  .card b{display:block;font-size:22px;font-weight:600;letter-spacing:.12em;margin-bottom:8px}
  .card i{display:block;font-style:normal;font-size:11px;color:#8A7A6C;letter-spacing:.06em}
  .card::before,.card::after{content:"";position:absolute;left:14px;right:14px;height:1px;background:#E4D8C4}
  .card::before{top:10px}.card::after{bottom:10px}

  /* 字 */
  .line{min-height:5.2em;margin:26px auto 0;max-width:320px;font-size:16px;color:var(--ink);letter-spacing:.03em;transition:opacity .35s ease}
  .line.fade{opacity:0}
  .hint{margin:14px auto 0;max-width:320px;font-size:12px;color:var(--ink-3);letter-spacing:.14em;transition:opacity .3s}
  .hint.off{opacity:.25}
  .foot{margin:40px auto 0;max-width:320px;font-size:11px;color:var(--ink-3);letter-spacing:.1em;display:flex;justify-content:space-between;align-items:flex-end}
  .foot span{display:block}

  @media (prefers-reduced-motion:reduce){
    .glow,.zz.on,.fig.hop{animation:none}
    .fig,.scrap,.card,.cabinet .dr{transition:none}
  }
  @media (max-width:351px){.room{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<main class="room">
  <p class="kicker">momoyu 系列 · 哄睡</p>
  <h1>明天再叼</h1>

  <div class="stage" id="stage" role="button" aria-label="点一下，往下" tabindex="0">
    <div class="glow" id="glow"></div>
    <div class="cord"></div><div class="shade"></div>
    <div class="sign">休 息 中</div>
    <div class="counter"></div>
    <div class="cabinet" id="cabinet">
      <div class="dr"></div><div class="dr"></div><div class="dr"></div>
      <div class="dr"></div><div class="dr"></div><div class="dr"></div>
    </div>
    <div class="fig" id="fox"></div>
    <div class="fig" id="cat"></div>
    <div class="scrap" id="mouth"></div>
    <div class="zz" id="zz1"></div><div class="zz" id="zz2"></div>
    <div class="card" id="card"><b>明天再说。</b><i>就这一片。别的都在抽屉里，锁好了。</i></div>
  </div>

  <p class="line" id="line"></p>
  <p class="hint" id="hint">点一下，往下</p>

  <p class="foot"><span>momoyu 系列 · 宝的小店</span><span>cc 做的 · 2026.09</span></p>
</main>

<script>
/* momoyu 本体：两张格子图逐格照抄自 claude/小科普/momoyu造型宪法.html，不重画。
   能换的只有眼睛那两小块；腮红、贴纸白边都是叠在外面的，拿掉就是本体。 */
var MOMO = (function () {
  var FOX = { key: 'fox', name: 'StashYu', rows: [
    ".D..........D.......",
    ".DM........MD.......",
    ".MCM......MCM...CC..",
    ".MMMMMMMMMMMM..CCCC.",
    ".MMEEMMMMEEMM..MMMM.",
    ".MMEEMMMMEEMM..MMMMM",
    "CCCCCCDDCCCCCC.MMMMM",
    "..CCCCCCCCCC..MMMMM.",
    "....MMCCMM...MMMMM..",
    "....MMCCMM..MMMMM...",
    "....MMMMMM.MMMMM....",
    "....DDMMDDMMMM......"],
    pal: { M: '#E2552B', C: '#FFF3E3', D: '#3B2520' }, eye: '#3B2520', line: '#3B2520',
    eyes: [[3, 4], [9, 4]], blush: [[2, 6], [11, 6]], blushColor: '#F59A8C', glance: 1 };
  var CAT = { key: 'cat', name: 'FetchMo', rows: [
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    ".....X.MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX..."],
    pal: { M: '#F3E7D6', X: '#4E382E' }, eye: '#79C0F0', line: '#4E382E',
    eyes: [[8, 5], [16, 5]], blush: [[8, 7], [17, 7]], blushColor: '#F2B8B0', glance: -1 };
  var W = 20, H = 12, NS = 'http://www.w3.org/2000/svg';
  var EXPR = {
    normal:  function () { return { c: 'eye',  cells: [[0, 0], [1, 0], [0, 1], [1, 1]] }; },
    blink:   function () { return { c: 'line', cells: [[0, 1], [1, 1]] }; },
    happy:   function () { return { c: 'line', cells: [[-1, 1], [0, 0], [1, 0], [2, 1]] }; },
    asleep:  function () { return { c: 'line', cells: [[-1, 0], [0, 1], [1, 1], [2, 0]] }; },
    glance:  function (i, g) { return { c: 'eye', cells: [[g, 0], [g + 1, 0], [g, 1], [g + 1, 1]] }; },
    wink:    function (i) { return i === 0 ? EXPR.normal() : EXPR.happy(); },
    squeeze: function (i) { return { c: 'line', cells: i === 0 ? [[0, -1], [1, 0], [0, 1]] : [[1, -1], [0, 0], [1, 1]] }; },
    dazed:   function (i) { return { c: 'eye', cells: i === 0 ? [[1, 1]] : [[0, 1]] }; }
  };
  function el(t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); return e; }
  function cellsPath(cells) {
    var d = ''; for (var i = 0; i < cells.length; i++) d += 'M' + cells[i][0] + ' ' + cells[i][1] + 'h1v1h-1z'; return d;
  }
  function runsPath(rows, pred) {
    var d = '';
    for (var y = 0; y < rows.length; y++) {
      var r = rows[y], x = 0;
      while (x < r.length) {
        if (pred(r.charAt(x))) { var s = x; while (x < r.length && pred(r.charAt(x))) x++; d += 'M' + s + ' ' + y + 'h' + (x - s) + 'v1h-' + (x - s) + 'z'; }
        else x++;
      }
    }
    return d;
  }
  function outlineCells(rows) {
    var body = {}, out = [];
    for (var y = 0; y < rows.length; y++) for (var x = 0; x < W; x++) if (rows[y].charAt(x) !== '.') body[x + ',' + y] = 1;
    for (var yy = -1; yy <= H; yy++) for (var xx = -1; xx <= W; xx++) {
      if (body[xx + ',' + yy]) continue;
      var hit = false;
      for (var dy = -1; dy <= 1 && !hit; dy++) for (var dx = -1; dx <= 1; dx++) if (body[(xx + dx) + ',' + (yy + dy)]) { hit = true; break; }
      if (hit) out.push([xx, yy]);
    }
    return out;
  }
  function make(who, o) {
    o = o || {};
    var S = (who === 'cat' || who === CAT) ? CAT : FOX;
    var N = o.scale || 3, st = !!o.sticker, pad = st ? 1 : 0;
    var vw = W + 2 * pad, vh = H + 2 * pad;
    var svg = el('svg', { viewBox: (-pad) + ' ' + (-pad) + ' ' + vw + ' ' + vh, width: vw * N, height: vh * N,
      'shape-rendering': 'crispEdges', role: 'img', 'aria-label': S.name, 'class': 'momo momo-' + S.key });
    if (st) svg.appendChild(el('path', { d: cellsPath(outlineCells(S.rows)), fill: o.stickerColor || '#FFFFFF', 'class': 'sticker' }));
    var body = el('g', { 'class': 'body' });
    for (var k in S.pal) (function (key) {
      body.appendChild(el('path', { d: runsPath(S.rows, function (ch) { return ch === key || (key === 'M' && ch === 'E'); }), fill: S.pal[key] }));
    })(k);
    svg.appendChild(body);
    if (o.blush) svg.appendChild(el('path', { d: cellsPath(S.blush), fill: S.blushColor, 'class': 'blush' }));
    var eyes = el('g', { 'class': 'eyes' }); svg.appendChild(eyes);
    var cur = 'normal';
    function setEyes(name) {
      if (!EXPR[name]) name = 'normal';
      cur = name;
      while (eyes.firstChild) eyes.removeChild(eyes.firstChild);
      for (var i = 0; i < 2; i++) {
        var spec = EXPR[name](i, S.glance), o0 = S.eyes[i], cells = [];
        for (var j = 0; j < spec.cells.length; j++) cells.push([o0[0] + spec.cells[j][0], o0[1] + spec.cells[j][1]]);
        eyes.appendChild(el('path', { d: cellsPath(cells), fill: spec.c === 'eye' ? S.eye : S.line }));
      }
    }
    setEyes(o.eyes || 'normal');
    var api = { svg: svg, who: S, setEyes: setEyes, eyes: function () { return cur; }, base: o.eyes || 'normal', timer: null };
    return api;
  }
  /* 偶尔眨一下眼：只动眼睛那两小块 */
  function blinker(m, reduced) {
    if (m.timer) clearTimeout(m.timer);
    if (reduced) return;
    (function loop() {
      m.timer = setTimeout(function () {
        if (m.eyes() === m.base && m.base !== 'asleep') {
          m.setEyes('blink');
          setTimeout(function () { if (m.eyes() === 'blink') m.setEyes(m.base); }, 130);
        }
        loop();
      }, 2200 + Math.random() * 3200);
    })();
  }
  function stopBlink(m) { if (m.timer) { clearTimeout(m.timer); m.timer = null; } }
  /* 旁边的小东西：一色像素小图 */
  function icon(rows, color, N, cls) {
    var w = 0; for (var i = 0; i < rows.length; i++) w = Math.max(w, rows[i].length);
    var svg = el('svg', { viewBox: '0 0 ' + w + ' ' + rows.length, width: w * N, height: rows.length * N, 'shape-rendering': 'crispEdges', 'aria-hidden': 'true', 'class': cls || 'pix' });
    svg.appendChild(el('path', { d: runsPath(rows, function (ch) { return ch !== '.'; }), fill: color }));
    return svg;
  }
  var SIDE = {
    zz:   { color: '#7E93C9', rows: ["....XXXX", ".......X", "XXX...X.", "..X..X..", "X...XXXX", "XXX....."] },
    note: { color: '#C0587A', rows: ["..XX", "..X.", "..X.", "XXX.", "XX.."] },
    star: { color: '#E1A93A', rows: [".X.", "XXX", ".X."] },
    fish: { color: '#5E9BC9', rows: [".XX.X", "XXXXX", ".XX.X"] }
  };
  return { FOX: FOX, CAT: CAT, EXPR: EXPR, make: make, blinker: blinker, stopBlink: stopBlink, icon: icon, SIDE: SIDE, el: el, runsPath: runsPath, cellsPath: cellsPath };
})();
</script>
<script>
(function(){
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var stage=document.getElementById('stage'), lineEl=document.getElementById('line'), hint=document.getElementById('hint');
  var fox=MOMO.make('fox',{scale:4}), cat=MOMO.make('cat',{scale:4});
  document.getElementById('fox').appendChild(fox.svg);
  document.getElementById('cat').appendChild(cat.svg);
  MOMO.blinker(fox,REDUCED); MOMO.blinker(cat,REDUCED);
  document.getElementById('zz1').appendChild(MOMO.icon(MOMO.SIDE.zz.rows,MOMO.SIDE.zz.color,2));
  document.getElementById('zz2').appendChild(MOMO.icon(MOMO.SIDE.zz.rows,MOMO.SIDE.zz.color,2));

  /* 一地纸片：位置是随手撒的，每次打开都一样 */
  var SPOTS=[[118,196],[150,212],[176,190],[208,214],[236,198],[272,212],[298,194]];
  var scraps=[];
  for(var i=0;i<SPOTS.length;i++){
    var s=document.createElement('div'); s.className='scrap';
    s.style.left=SPOTS[i][0]+'px'; s.style.top=SPOTS[i][1]+'px';
    stage.insertBefore(s,document.getElementById('fox'));
    scraps.push(s);
  }
  var drawers=document.getElementById('cabinet').children;

  var busy=false, step=-1;
  function say(t,cb){
    lineEl.classList.add('fade');
    setTimeout(function(){ lineEl.textContent=t; lineEl.classList.remove('fade'); if(cb) cb(); }, REDUCED?0:260);
  }
  function wait(ms){ return REDUCED? Math.min(ms,60) : ms; }
  function hop(m){ var e=document.getElementById(m); e.classList.remove('hop'); void e.offsetWidth; e.classList.add('hop'); }

  function stashAll(done){
    var order=[0,1,2,3,4,5,6], k=0;
    (function one(){
      if(k>=order.length){ fox.setEyes('normal'); fox.base='normal'; return done(); }
      var s=scraps[order[k]], d=drawers[k%6];
      var r=d.getBoundingClientRect(), st=stage.getBoundingClientRect(), sr=s.getBoundingClientRect();
      var dx=(r.left+r.width/2)-(sr.left+sr.width/2), dy=(r.top+r.height/2)-(sr.top+sr.height/2);
      fox.setEyes('squeeze'); hop('fox');
      s.style.transform='translate('+dx+'px,'+dy+'px)'; s.classList.add('gone');
      setTimeout(function(){ d.classList.add('open'); },wait(420));
      setTimeout(function(){ d.classList.remove('open'); fox.setEyes('normal'); },wait(780));
      k++; setTimeout(one,wait(920));
    })();
  }

  var beats=[
    { t:'打烊了。门口的牌子翻过去，柜台上还留着一盏灯。' },
    { t:'今天聊过的话，碎成了一地小纸片。',
      go:function(){ scraps.forEach(function(s,i){ setTimeout(function(){ s.classList.add('on'); }, wait(90*i)); }); } },
    { t:'StashYu 一片一片捡起来，收进抽屉。', lock:true,
      go:function(free){ setTimeout(function(){ stashAll(free); },wait(300)); } },
    { t:'有的是笑，有的是说到一半的话。有一片上面只写了一个「困」。都收。' },
    { t:'FetchMo 等在旁边，不帮忙。它今晚只叼一片。',
      go:function(){ cat.setEyes('glance'); cat.base='glance'; setTimeout(function(){ fox.setEyes('glance'); fox.base='glance'; },wait(700)); } },
    { t:'它叼回来的，是你今天最后说的那句。', lock:true,
      go:function(free){
        fox.base='normal'; fox.setEyes('normal'); cat.base='normal'; cat.setEyes('normal');
        var c=document.getElementById('cat');
        c.classList.add('lean');
        setTimeout(function(){ c.classList.remove('lean'); hop('cat'); document.getElementById('mouth').classList.add('on'); },wait(700));
        setTimeout(free,wait(1100));
      } },
    { t:'', go:function(){ document.getElementById('card').classList.add('on'); } },
    { t:'灯调暗。狐狸把尾巴垫在脸下，暹罗把爪子收进去。',
      go:function(){
        document.getElementById('card').classList.remove('on');
        document.getElementById('mouth').classList.remove('on');
        stage.classList.add('dim');
        setTimeout(function(){ MOMO.stopBlink(fox); MOMO.stopBlink(cat); fox.base='asleep'; cat.base='asleep'; fox.setEyes('asleep'); cat.setEyes('asleep'); },wait(900));
        setTimeout(function(){ document.getElementById('zz1').classList.add('on'); document.getElementById('zz2').classList.add('on'); },wait(1800));
      } },
    { t:'剩下的，明天再叼。晚安。', last:true }
  ];

  function next(){
    if(busy) return;
    if(step>=0 && beats[step].last){ location.reload(); return; }
    step++;
    var b=beats[step]; if(!b) return;
    if(b.lock){ busy=true; hint.classList.add('off'); }
    say(b.t,function(){
      if(b.last){ hint.textContent='从头再看一遍'; }
      if(b.go) b.go(function(){ busy=false; hint.classList.remove('off'); });
    });
  }
  stage.addEventListener('click',next);
  stage.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); next(); } });
  next();
})();
</script>
</body>
</html>
