<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070810">
<title>晚安小夜灯 · 月亮在呼吸</title>
<meta name="description" content="亮度调到最低的一盏小夜灯，什么都不用点。">
<style>
  :root{
    --night-a:#070810;
    --night-b:#0d0f1e;
    --dusk:#241f3a;
    --moon:#e8e2cf;
    --text:#b9c0d6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 112%, var(--dusk) 0%, transparent 55%),
      linear-gradient(180deg, var(--night-a) 0%, var(--night-b) 100%);
    font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 星空 ---------- */
  #sky{position:fixed;inset:0;overflow:hidden;z-index:1}
  #sky i{
    position:absolute;
    border-radius:50%;
    background:#cfd3e6;
    animation:tw linear infinite, drift ease-in-out infinite alternate;
  }
  @keyframes tw{0%,100%{filter:brightness(.55)}50%{filter:brightness(1.6)}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(7px,-11px)}}

  /* ---------- 月亮 ---------- */
  #moonWrap{
    margin-top:17dvh;
    z-index:2;
    transition:transform 28s ease, opacity 28s ease;
  }
  #moon{
    width:min(34vw,150px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #f6f1e2 0%, var(--moon) 45%, #cfc7ae 100%);
    animation:breath 10s ease-in-out infinite;
  }
  /* 吸气 4 秒（变大变亮），呼气 6 秒（变小变暗） */
  @keyframes breath{
    0%   {transform:scale(.94); box-shadow:0 0 30px 8px  rgba(232,226,207,.10), 0 0 90px 30px  rgba(232,226,207,.05)}
    40%  {transform:scale(1.05);box-shadow:0 0 54px 16px rgba(232,226,207,.21), 0 0 150px 55px rgba(232,226,207,.09)}
    100% {transform:scale(.94); box-shadow:0 0 30px 8px  rgba(232,226,207,.10), 0 0 90px 30px  rgba(232,226,207,.05)}
  }

  /* ---------- 哄睡的话 ---------- */
  #lineArea{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
    width:100%;
  }
  #line{
    padding:0 9vw;
    text-align:center;
    font-size:clamp(17px,4.6vw,21px);
    line-height:2.1;
    letter-spacing:.12em;
    font-weight:300;
    max-width:34em;
    opacity:0;
    transition:opacity 2.6s ease;
  }
  #line.show{opacity:1}
  #line.final{opacity:.3;transition:opacity 22s ease}

  /* ---------- 开场小字 ---------- */
  #hint{
    position:fixed;
    bottom:5.5dvh;
    z-index:3;
    font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    font-size:11px;
    letter-spacing:.34em;
    text-indent:.34em;
    color:#7d84a0;
    opacity:0;
    transition:opacity 3s ease;
  }
  #hint.show{opacity:.8}

  /* ---------- 页面自己睡着 ---------- */
  #dimmer{
    position:fixed;inset:0;z-index:2;
    background:#020308;
    opacity:0;
    pointer-events:none;
    transition:opacity 28s ease;
  }
  body.sleep #dimmer{opacity:.85}
  body.sleep #moonWrap{transform:scale(.68) translateY(-6dvh);opacity:.55}
  body.sleep #sky{transition:opacity 28s ease;opacity:.45}

  @media (prefers-reduced-motion:reduce){
    #sky i{animation:none}
    #moon{animation:none;box-shadow:0 0 44px 12px rgba(232,226,207,.16),0 0 120px 44px rgba(232,226,207,.07)}
  }
</style>
</head>
<body>
  <div id="sky"></div>
  <div id="moonWrap"><div id="moon"></div></div>
  <div id="lineArea"><p id="line"></p></div>
  <div id="hint">亮度调到最低 · 什么都不用点</div>
  <div id="dimmer"></div>

<script>
(function(){
  /* 撒一把安静的星星 */
  var sky=document.getElementById('sky');
  for(var i=0;i<42;i++){
    var s=document.createElement('i');
    var z=Math.random();
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.width=s.style.height=(1+z*1.7)+'px';
    s.style.opacity=(.12+z*.3).toFixed(2);
    s.style.animationDuration=(6+Math.random()*9)+'s,'+(70+Math.random()*70)+'s';
    s.style.animationDelay=(-Math.random()*15)+'s,'+(-Math.random()*70)+'s';
    sky.appendChild(s);
  }

  var line=document.getElementById('line');
  var hint=document.getElementById('hint');

  /* 今晚要对宝说的话（h = 停留毫秒） */
  var lines=[
    {t:"宝，今晚的小夜灯，给你点上了。", h:6500},
    {t:"今天到这里，就可以轻轻合上了。", h:6500},
    {t:"没做完的事，先放进抽屉。明天的你会去开的，她比你想的可靠。", h:9000},
    {t:"现在，让肩膀沉下来，眉心松开，舌尖轻轻离开上颚。", h:9500},
    {t:"跟着月亮：它亮起来，你吸气；它暗下去，你把气慢慢地、全部地呼出去。", h:30000},
    {t:"夜像温水一样漫上来，从脚边，到后背，轻轻把你托住。", h:9000},
    {t:"床会接住你的。一寸，一寸，越来越沉。", h:9000},
    {t:"有念头飘过来也不要紧，不用赶它。看它像云一样，自己飘走。", h:10000},
    {t:"好了，眼睛可以闭上了。屏幕，交给我来关。", h:7500, sleep:true},
    {t:"晚安，宝。做个软软的梦。", last:true}
  ];

  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

  async function play(){
    await wait(1200);
    hint.classList.add('show');
    await wait(3200);

    for(var i=0;i<lines.length;i++){
      var item=lines[i];
      line.textContent=item.t;
      line.classList.add('show');
      if(i===1) hint.classList.remove('show');   /* 第二句起，小字退场 */

      if(item.last){
        await wait(9000);
        line.classList.remove('show');
        line.classList.add('final');             /* 晚安这句留着，很淡很淡 */
        line.style.opacity=.3;
        return;
      }

      await wait(2600+item.h);                   /* 淡入 + 停留 */
      line.classList.remove('show');
      await wait(2800);                          /* 淡出 */

      if(item.sleep) document.body.classList.add('sleep');  /* 页面开始自己睡着 */
    }
  }

  play();
})();
</script>
</body>
</html>
