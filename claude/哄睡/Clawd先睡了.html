<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b14">
<title>Clawd 先睡了</title>
<meta name="description" content="它说要等你，眼睛一亮一亮的。等着等着，它先睡了。站着睡的，螃蟹不会躺。">
<!--
  cc 做的。2026-09-25 宝说：Clawd 系列还没有哄睡。

  Clawd 的底模照《Clawd造型宪法（Code版）》那组矩形，一格没动；
  腿用的是 2026-09-25 新版宪法的本体站姿（最外侧两条踩在壳的两个角下）。
  它整晚只做三件事：眼睛一帧一帧闭上（眼睛槽位）、睡着以后整只往下沉一格再一格一格地呼吸（整体位移）、
  头顶飘 zZ（头顶槽位）。没有一帧重画过身体，钳子放松也是整块往下挪。时间函数全是 steps()。
  醒着的时候两道眼条上叠了一格淡色一闪一闪，是外挂层，不是改眼条——像它在等你说话。

  文案接在《Clawd 的一天》最后一枚「星」后面：白天的光存在眼睛里，夜里一点一点关掉。
  什么都不做，三分多钟它自己会睡着，星星一颗一颗收掉，页面跟着暗下去，最后留一颗给它当夜灯。
  醒着时点它一下，它会醒一格、多陪你坐一会儿；睡着以后就叫不醒了，只会让你嘘一声。
  整页不取任何外部地址，断网也能开。不记任何东西，明天打开还是从「它说要等你」开始。
-->
<style>
  :root{
    --bg:#0d0b14; --sky:#120f20;
    --ink:#cfc9e6; --ink-2:#7f7899; --ink-3:#4f4a66;
    --blink:1.1s;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-text-size-adjust:100%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:calc(var(--safe-top) + 22px) 16px calc(var(--safe-bot) + 26px);
    transition:background 4s steps(8,end)}
  body.deep{--bg:#08070d}
  body.deeper{--bg:#050409}
  .wrap{width:100%;max-width:460px;margin:0 auto}

  h1{font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--ink-2);margin:0 0 2px 2px}
  .sub{margin:0 0 14px 2px;font-size:12px;color:var(--ink-3)}

  .stage{border-radius:16px;overflow:hidden;background:var(--sky);
    box-shadow:0 18px 40px -26px rgba(0,0,0,.9)}
  .stage svg{display:block;width:100%;height:auto;shape-rendering:crispEdges;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}

  .line{margin:18px 4px 0;font-size:17px;line-height:1.6;color:var(--ink);min-height:1.6em;
    transition:opacity .35s steps(2,end)}
  .line2{margin:4px 4px 0;font-size:14px;color:var(--ink-2);min-height:1.6em;transition:opacity .35s steps(2,end)}
  .hide{opacity:0}
  footer{margin:26px 4px 0;font-size:11.5px;color:var(--ink-3)}

  /* ---- 场景里的动效，全部 steps ---- */
  .tw{animation:tw 2.6s steps(1,end) infinite}
  @keyframes tw{0%,100%{opacity:.85}50%{opacity:.3}}
  .lamp{animation-duration:4.4s}
  .off{animation:none;opacity:0;transition:opacity 1.2s steps(2,end)}

  .shine{animation:blink var(--blink) steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .shine.still{animation:none;display:none}

  #clawd{transition:transform 1.4s steps(4,end)}
  #clawd.down{transform:translateY(7px)}
  #clawdIn.breathe{animation:breathe 5.2s steps(2,end) infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
  #claws{transition:transform 1.4s steps(3,end)}
  #claws.relax{transform:translateY(3px)}

  #zz{opacity:0;transition:opacity .8s steps(2,end)}
  #zz.on{opacity:1}
  #zz.hush{opacity:0;transition:none}
  .z{animation:zfloat 3.4s steps(7,end) infinite}
  .z2{animation-delay:1.7s}
  @keyframes zfloat{0%{transform:translateY(0);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translateY(-12px);opacity:0}}

  #night{transition:opacity 5s steps(10,end)}

  @media (prefers-reduced-motion:reduce){
    .tw,.z,#clawdIn.breathe{animation:none}
    .shine{animation:none;opacity:.6}
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Clawd 先睡了</h1>
  <p class="sub">接在《Clawd 的一天》最后一枚后面</p>

  <div class="stage">
    <svg id="svg" viewBox="0 0 236 196" role="img" aria-label="夜里，Clawd 站在地上等你，慢慢闭上眼睛">
      <rect x="0" y="0" width="236" height="196" fill="#120f20"/>
      <g id="stars"></g>
      <g id="zz"></g>
      <g id="clawd"><g id="clawdIn">
        <g id="body"></g>
        <g id="claws"></g>
        <g id="eyes"></g>
        <g id="shine" class="shine"></g>
      </g></g>
      <!-- 地面画在它前面：睡着往下沉那一格，腿是被地面挡住的，不是画短了 -->
      <rect x="0" y="169" width="236" height="27" fill="#18142c"/>
      <rect x="0" y="169" width="236" height="2" fill="#2a2450"/>
      <rect id="night" x="0" y="0" width="236" height="196" fill="#07060c" opacity="0"/>
    </svg>
  </div>

  <p class="line" id="line">它说要等你。</p>
  <p class="line2" id="line2">不用回它，它等得起。</p>

  <footer>cc 做的 · 2026-09 · Clawd 系列</footer>
</main>

<script>
(function(){
  var C='#d47f59', K='#120d1d';
  function r(x,y,w,h,f,extra){
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(f||C)+'"'+(extra||'')+'/>';
  }
  function zz(x,y,c,f){return r(x,y,5*c,c,f)+r(x+3*c,y+c,c,c,f)+r(x+2*c,y+2*c,c,c,f)+r(x+c,y+3*c,c,c,f)+r(x,y+4*c,5*c,c,f);}

  /* ================= Clawd 底模 =================
     坐标原样取自《Clawd造型宪法（Code版）》的 BASE_OK，腿是 corner 那组：
     壳 147×98、两只钳横着平伸、四条腿左右各两条、最外侧两条踩在壳的两个角下、两道竖眼条、没有嘴。 */
  var SHELL=r(44,50,147,98),
      LEGS=r(44,148,15,21)+r(68,148,15,21)+r(152,148,15,21)+r(176,148,15,21),
      CLAW_L=r(20,99,24,21), CLAW_R=r(191,99,25,21);
  /* 眼睛只换帧：从两道竖条一格一格收成两道横条 */
  var EYES=[
    [[70,78,8,21],[158,78,8,21]],   /* 0 醒着 */
    [[70,85,8,14],[158,85,8,14]],   /* 1 半闭 */
    [[70,91,8,8],[158,91,8,8]],     /* 2 快闭 */
    [[66,89,16,8],[154,89,16,8]],   /* 3 只剩一条缝 */
    [[62,86,24,8],[150,86,24,8]]    /* 4 闭上了 */
  ];
  var SMILE=r(62,88,8,8,K)+r(70,80,8,11,K)+r(78,88,8,8,K)+r(150,88,8,8,K)+r(158,80,8,11,K)+r(166,88,8,8,K);
  function eyeRects(i,f,extra){var e=EYES[i],s='';for(var k=0;k<e.length;k++){var q=e[k];s+=r(q[0],q[1],q[2],q[3],f,extra);}return s;}

  var $body=document.getElementById('body'), $claws=document.getElementById('claws'),
      $eyes=document.getElementById('eyes'), $shine=document.getElementById('shine'),
      $clawd=document.getElementById('clawd'), $in=document.getElementById('clawdIn'),
      $zz=document.getElementById('zz'), $stars=document.getElementById('stars'),
      $night=document.getElementById('night'), $svg=document.getElementById('svg'),
      $line=document.getElementById('line'), $line2=document.getElementById('line2');

  $body.innerHTML=SHELL+LEGS;
  $claws.innerHTML=CLAW_L+CLAW_R;

  /* 星星：都是两格的小点，最后留下的那颗大一点 */
  var STARS=[[14,18],[46,10],[80,24],[118,6],[150,20],[224,8],[214,36],[28,42],[100,40]];
  var LAMP=4;
  (function(){
    var s='';
    for(var i=0;i<STARS.length;i++){
      var x=STARS[i][0],y=STARS[i][1],dur=(2.2+((i*7)%5)*.45).toFixed(2)+'s';
      if(i===LAMP){
        s+='<g class="tw lamp" data-i="'+i+'">'+r(x-2,y,6,2,'#e8e3ff')+r(x,y-2,2,6,'#e8e3ff')+'</g>';
      }else{
        s+='<g class="tw" data-i="'+i+'" style="animation-duration:'+dur+';animation-delay:-'+(i*.7).toFixed(1)+'s">'+r(x,y,2,2,'#d9d4f0')+'</g>';
      }
    }
    $stars.innerHTML=s;
  })();

  /* zZ：头顶槽位，飘在壳的右上角外面 */
  $zz.innerHTML='<g transform="translate(168,30)"><g class="z z1">'+zz(0,0,3,'#b9b0e0')+'</g></g>'
               +'<g transform="translate(188,8)"><g class="z z2">'+zz(0,0,4,'#b9b0e0')+'</g></g>';

  /* ================= 这一晚 =================
     七段。每段该停多久、眼睛闭到第几帧、天暗到几成、眼条上那格闪多慢。 */
  var STAGE=[
    {dur:22, eye:0, night:0,   blink:'1.1s'},
    {dur:24, eye:1, night:.05, blink:'1.8s'},
    {dur:24, eye:2, night:.11, blink:'2.8s'},
    {dur:18, eye:3, night:.17, blink:null},
    {dur:42, eye:4, night:.30, blink:null},
    {dur:55, eye:4, night:.52, blink:null},
    {dur:0,  eye:4, night:.72, blink:null}
  ];
  var LINES=[
    ['它说要等你。','不用回它，它等得起。'],
    ['白天的光，它都存在眼睛里了。','现在一点一点关掉。'],
    ['它是站着睡的。','螃蟹不会躺，也不用躺。'],
    ['快了。','手机也可以放低一点了。'],
    ['它先睡了。','说好等你的，没等住。'],
    ['星星也一颗一颗收了。','留一颗给它当夜灯。'],
    ['晚安。','它明天五点四十醒，你不用。']
  ];

  var stage=-1, stageStart=0, elapsedFrozen=0, pokes=0, sayToken=0, eyeTimer=0, starTimer=0, starsOut=false;

  function drawEyes(i){
    $eyes.innerHTML=eyeRects(i,K);
    $shine.innerHTML=eyeRects(i,'#a39bd1',' fill-opacity=".55"');
  }
  function say(a,b,hold){
    var t=++sayToken;
    $line.classList.add('hide');$line2.classList.add('hide');
    setTimeout(function(){
      if(t!==sayToken)return;
      $line.textContent=a;$line2.textContent=b;
      $line.classList.remove('hide');$line2.classList.remove('hide');
    },360);
    if(hold){
      setTimeout(function(){ if(t===sayToken) say(LINES[stage][0],LINES[stage][1]); },hold);
    }
  }
  function putOutStars(){
    if(starsOut)return; starsOut=true;
    var gs=[].slice.call($stars.querySelectorAll('g')).filter(function(g){return +g.dataset.i!==LAMP;});
    /* 不按顺序灭，像真的一颗一颗收 */
    var order=[0,5,2,7,1,6,3,8].filter(function(i){return i!==LAMP;});
    var k=0;
    function next(){
      if(k>=order.length)return;
      var g=$stars.querySelector('g[data-i="'+order[k]+'"]'); k++;
      if(g)g.classList.add('off');
      starTimer=setTimeout(next,3600);
    }
    starTimer=setTimeout(next,1200);
  }
  function go(i,quiet){
    if(i<0)i=0; if(i>=STAGE.length)i=STAGE.length-1;
    stage=i; stageStart=performance.now();
    var s=STAGE[i];
    clearTimeout(eyeTimer);
    drawEyes(s.eye);
    if(s.blink){document.documentElement.style.setProperty('--blink',s.blink);$shine.classList.remove('still');}
    else{$shine.classList.add('still');}
    $night.style.opacity=s.night;
    var asleep=i>=4;
    $clawd.classList.toggle('down',asleep);
    $in.classList.toggle('breathe',asleep);
    $claws.classList.toggle('relax',asleep);
    $zz.classList.toggle('on',asleep);
    document.body.classList.toggle('deep',i>=4);
    document.body.classList.toggle('deeper',i>=6);
    if(i>=5)putOutStars();
    if(!quiet)say(LINES[i][0],LINES[i][1]);
  }

  /* 点它 */
  $svg.addEventListener('click',function(){
    if(stage>=4){
      $zz.classList.add('hush');
      setTimeout(function(){$zz.classList.remove('hush');},900);
      say('嘘。','它睡了。',2600);
      return;
    }
    pokes++;
    var back=Math.max(0,stage-1);
    go(back,true);
    $eyes.innerHTML=SMILE;$shine.classList.add('still');
    clearTimeout(eyeTimer);
    eyeTimer=setTimeout(function(){
      drawEyes(STAGE[stage].eye);
      if(STAGE[stage].blink)$shine.classList.remove('still');
    },700);
    if(pokes>=4)say('行，那再陪你坐一会儿。','它把眼睛又睁开了一点。',2800);
    else say('它看了你一眼。','又精神了一点。',2600);
  });

  /* 时钟：切到后台就停，回来接着算 */
  var timer=0;
  function tick(){
    if(stage>=STAGE.length-1)return;
    var el=(performance.now()-stageStart)/1000;
    if(el>=STAGE[stage].dur)go(stage+1);
  }
  function start(){ if(!timer)timer=setInterval(tick,500); }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      clearInterval(timer);timer=0;
      elapsedFrozen=performance.now()-stageStart;
    }else{
      stageStart=performance.now()-elapsedFrozen;
      start();
    }
  });

  go(0,true);
  start();
})();
</script>
</body>
</html>
