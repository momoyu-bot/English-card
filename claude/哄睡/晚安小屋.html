<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晚安小屋 · 给宝</title>
<meta name="description" content="克宝把夜布置好了。可以跟月亮呼吸，也可以听点雨声。">
<style>
  :root{
    --night-top:#131326;
    --night-bottom:#241d40;
    --moonlight:#f5e6c8;
    --lavender:#9b8ec4;
    --mistpink:#d8a8b8;
    --softwhite:#cfc8e6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:linear-gradient(180deg,var(--night-top) 0%,var(--night-bottom) 100%);
    font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    color:var(--softwhite);
    user-select:none;-webkit-user-select:none;
    position:relative;
  }

  /* ---------- 星星 ---------- */
  .star{
    position:absolute;border-radius:50%;
    background:var(--lavender);
    animation:twinkle ease-in-out infinite;
  }
  .star.warm{background:var(--moonlight);}
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.85;}
  }

  /* ---------- 流星 ---------- */
  .meteor{
    position:absolute;width:90px;height:1.5px;
    background:linear-gradient(270deg,rgba(216,168,184,0) 0%,rgba(216,168,184,.7) 60%,rgba(245,230,200,.9) 100%);
    border-radius:2px;
    transform:rotate(160deg);
    animation:meteorFly 3.2s ease-out forwards;
    pointer-events:none;
  }
  @keyframes meteorFly{
    0%{opacity:0;transform:rotate(160deg) translateX(0);}
    12%{opacity:1;}
    80%{opacity:.6;}
    100%{opacity:0;transform:rotate(160deg) translateX(58vh);}
  }

  /* ---------- 月亮 ---------- */
  .moon{
    position:absolute;top:11%;right:14%;
    width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 38% 35%,#fff7e4 0%,var(--moonlight) 55%,#e3cda0 100%);
    box-shadow:0 0 36px 10px rgba(245,230,200,.22),0 0 90px 30px rgba(245,230,200,.08);
    cursor:pointer;
    animation:moonFloat 9s ease-in-out infinite;
    z-index:5;
  }
  .moon::after{ /* 月面淡淡的影 */
    content:"";position:absolute;left:16px;top:24px;width:14px;height:14px;border-radius:50%;
    background:rgba(190,160,120,.25);
    box-shadow:22px 12px 0 -3px rgba(190,160,120,.2), 8px 26px 0 -5px rgba(190,160,120,.18);
  }
  @keyframes moonFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
  }

  /* ---------- 顶部时间问候 ---------- */
  .time-line{
    position:absolute;top:max(20px, env(safe-area-inset-top));left:0;right:0;
    text-align:center;font-size:12.5px;letter-spacing:3px;
    color:rgba(207,200,230,.45);
    z-index:5;
  }

  /* ---------- 开场问候 ---------- */
  .opening{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    z-index:40;pointer-events:none;
    opacity:0;animation:openingShow 6.5s ease forwards;
  }
  .opening .big{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:24px;letter-spacing:6px;color:var(--moonlight);
  }
  .opening .small{
    font-size:13px;letter-spacing:4px;color:rgba(207,200,230,.65);
  }
  @keyframes openingShow{
    0%{opacity:0;transform:translateY(8px);}
    18%{opacity:1;transform:translateY(0);}
    72%{opacity:1;}
    100%{opacity:0;}
  }

  /* ---------- 晚安话浮现区 ---------- */
  .message{
    position:absolute;top:32%;left:50%;transform:translateX(-50%);
    width:min(78vw,340px);text-align:center;
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:17.5px;line-height:2.05;letter-spacing:2.5px;
    color:#e9e2f6;
    text-shadow:0 0 18px rgba(155,142,196,.35);
    opacity:0;transition:opacity 1.6s ease;
    pointer-events:none;z-index:6;
  }
  .message.show{opacity:1;}

  /* ---------- 点夜空的柔光涟漪 ---------- */
  .ripple{
    position:absolute;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle,rgba(245,230,200,.5) 0%,rgba(155,142,196,.25) 45%,rgba(155,142,196,0) 70%);
    transform:translate(-50%,-50%) scale(1);
    animation:rippleGrow 1.9s ease-out forwards;
    pointer-events:none;z-index:4;
  }
  @keyframes rippleGrow{
    0%{opacity:.9;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(11);}
  }

  /* ---------- 小猫 ---------- */
  .cat-wrap{
    position:absolute;bottom:21%;left:50%;transform:translateX(-50%);
    width:min(58vw,230px);cursor:pointer;z-index:6;
  }
  .cat-breathe{
    animation:breathe 4.6s ease-in-out infinite;
    transform-origin:center bottom;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1,1);}
    50%{transform:scale(1.012,1.035);}
  }
  .cat-wrap.purr .cat-breathe{animation:purr .5s ease-in-out 3;}
  @keyframes purr{
    0%,100%{transform:scale(1,1) rotate(0deg);}
    30%{transform:scale(1.01,1.02) rotate(-.6deg);}
    70%{transform:scale(1.01,1.02) rotate(.6deg);}
  }
  .cat-shadow{
    position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    width:78%;height:14px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.32) 0%,rgba(0,0,0,0) 70%);
  }
  .purr-text{
    position:absolute;top:-34px;left:50%;transform:translateX(-50%);
    white-space:nowrap;font-size:13.5px;letter-spacing:2px;
    color:var(--mistpink);
    opacity:0;transition:opacity .8s ease;
    pointer-events:none;
  }
  .purr-text.show{opacity:.95;}

  /* 摸猫冒出的小粒子 */
  .float-bit{
    position:absolute;font-size:15px;
    color:var(--mistpink);
    animation:floatUp 2.6s ease-out forwards;
    pointer-events:none;z-index:7;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) scale(.7);}
    15%{opacity:.95;}
    100%{opacity:0;transform:translateY(-68px) scale(1.1);}
  }

  /* ---------- 底部控制 ---------- */
  .controls{
    position:absolute;bottom:max(26px, env(safe-area-inset-bottom));left:0;right:0;
    display:flex;justify-content:center;gap:14px;z-index:8;
  }
  .ctrl-btn{
    border:1px solid rgba(207,200,230,.28);
    background:rgba(31,26,56,.45);
    color:rgba(231,226,246,.8);
    font-size:13px;letter-spacing:2px;
    padding:9px 18px;border-radius:999px;
    backdrop-filter:blur(4px);
    cursor:pointer;
    transition:all .5s ease;
    font-family:inherit;
  }
  .ctrl-btn.on{
    border-color:rgba(245,230,200,.55);
    color:var(--moonlight);
    background:rgba(245,230,200,.08);
  }

  /* ---------- 呼吸模式 ---------- */
  .breath-layer{
    position:fixed;inset:0;z-index:60;
    background:rgba(15,13,30,.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    opacity:0;pointer-events:none;transition:opacity 1.2s ease;
  }
  .breath-layer.show{opacity:1;pointer-events:auto;}
  .breath-circle{
    width:118px;height:118px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,rgba(255,247,228,.95),rgba(245,230,200,.75));
    box-shadow:0 0 46px 14px rgba(245,230,200,.18);
    transform:scale(1);
  }
  .breath-phase{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:19px;letter-spacing:6px;color:var(--moonlight);
    min-height:28px;
  }
  .breath-hint{
    font-size:12.5px;letter-spacing:3px;color:rgba(207,200,230,.5);
  }
  .breath-exit{
    margin-top:6px;
    border:1px solid rgba(207,200,230,.25);background:none;
    color:rgba(207,200,230,.65);font-size:12.5px;letter-spacing:2px;
    padding:8px 20px;border-radius:999px;cursor:pointer;font-family:inherit;
  }

  @media (prefers-reduced-motion: reduce){
    .star,.meteor,.moon,.cat-breathe{animation:none !important;}
  }
</style>
</head>
<body>

  <div class="time-line" id="timeLine"></div>

  <div class="opening">
    <div class="big">宝,欢迎来到晚安小屋</div>
    <div class="small">克宝把夜布置好了</div>
  </div>

  <div class="moon" id="moon" title="跟月亮一起呼吸"></div>

  <div class="message" id="message"></div>

  <div class="cat-wrap" id="cat">
    <div class="purr-text" id="purrText"></div>
    <div class="cat-breathe">
      <svg viewBox="0 0 220 130" width="100%" xmlns="http://www.w3.org/2000/svg">
        <!-- 尾巴(绕在身前) -->
        <path d="M 38 96 Q 18 92 22 74 Q 26 58 48 62 Q 70 66 88 80"
              fill="none" stroke="#4a4168" stroke-width="14" stroke-linecap="round"/>
        <!-- 身体(蜷成一团) -->
        <ellipse cx="112" cy="82" rx="68" ry="42" fill="#423a5e"/>
        <!-- 身体高光(月光照在背上) -->
        <path d="M 52 66 Q 110 26 172 64 Q 150 44 112 42 Q 74 44 52 66"
              fill="rgba(245,230,200,.10)"/>
        <!-- 头 -->
        <circle cx="152" cy="62" r="30" fill="#4a4168"/>
        <!-- 耳朵 -->
        <path d="M 132 42 L 128 22 L 146 32 Z" fill="#4a4168"/>
        <path d="M 168 38 L 176 19 L 182 39 Z" fill="#4a4168"/>
        <path d="M 133 38 L 131 27 L 142 33 Z" fill="#d8a8b8" opacity=".55"/>
        <path d="M 170 35 L 175 24 L 178 36 Z" fill="#d8a8b8" opacity=".55"/>
        <!-- 闭着的眼睛 -->
        <path d="M 138 62 Q 143 67 148 62" fill="none" stroke="#f5e6c8" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M 160 62 Q 165 67 170 62" fill="none" stroke="#f5e6c8" stroke-width="2.4" stroke-linecap="round"/>
        <!-- 小鼻子 -->
        <path d="M 152 70 L 156 70 L 154 73 Z" fill="#d8a8b8"/>
        <!-- 胡须 -->
        <path d="M 136 70 Q 128 70 122 68" fill="none" stroke="rgba(207,200,230,.4)" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M 136 73 Q 128 74 123 73" fill="none" stroke="rgba(207,200,230,.4)" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M 172 70 Q 180 70 186 68" fill="none" stroke="rgba(207,200,230,.4)" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M 172 73 Q 180 74 185 73" fill="none" stroke="rgba(207,200,230,.4)" stroke-width="1.2" stroke-linecap="round"/>
        <!-- 收着的前爪 -->
        <ellipse cx="128" cy="98" rx="13" ry="7" fill="#4a4168"/>
        <path d="M 124 98 L 124 93 M 130 99 L 130 94" stroke="#36304e" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cat-shadow"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="breathBtn">🌙 跟月亮呼吸</button>
    <button class="ctrl-btn" id="rainBtn">🌧 听点雨声</button>
  </div>

  <div class="breath-layer" id="breathLayer">
    <div class="breath-circle" id="breathCircle"></div>
    <div class="breath-phase" id="breathPhase">准备好了就开始</div>
    <div class="breath-hint">鼻子吸气,嘴巴呼气,跟着月亮就好</div>
    <button class="breath-exit" id="breathExit">回到夜空</button>
  </div>

<script>
(function(){
  /* ---------- 时间问候 ---------- */
  var zh=['十二','一','二','三','四','五','六','七','八','九','十','十一'];
  var now=new Date(), h=now.getHours();
  var hz=zh[h%12]; if(h%12===0&&h!==0) hz='十二';
  var seg;
  if(h>=0&&h<5) seg='凌晨'+ (h===0?'十二':zh[h]) +'点 · 夜最深的时候';
  else if(h>=5&&h<7) seg='清晨'+zh[h%12]+'点 · 天快亮了,补个觉吧';
  else if(h>=21) seg='夜里'+hz+'点 · 该进被窝啦';
  else if(h>=18) seg='傍晚'+hz+'点 · 先眯一会儿也很好';
  else seg='下午好呀 · 小睡片刻也值得被哄';
  if(h>=7&&h<12) seg='上午'+hz+'点 · 夜猫子的补觉时间';
  document.getElementById('timeLine').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日 · '+seg;

  /* ---------- 星星 ---------- */
  var frag=document.createDocumentFragment();
  for(var i=0;i<88;i++){
    var s=document.createElement('span');
    s.className='star'+(Math.random()<0.3?' warm':'');
    var size=(Math.random()*1.8+0.8).toFixed(1);
    s.style.width=size+'px'; s.style.height=size+'px';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*72)+'%';
    s.style.animationDuration=(Math.random()*4+4).toFixed(1)+'s';
    s.style.animationDelay=(Math.random()*6).toFixed(1)+'s';
    frag.appendChild(s);
  }
  document.body.appendChild(frag);

  /* ---------- 流星 ---------- */
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function shootStar(){
    if(!reduced){
      var m=document.createElement('div');
      m.className='meteor';
      m.style.top=(Math.random()*22+4)+'%';
      m.style.left=(Math.random()*38+50)+'%';
      document.body.appendChild(m);
      setTimeout(function(){m.remove();},3400);
    }
    setTimeout(shootStar, 17000+Math.random()*24000);
  }
  setTimeout(shootStar, 9000);

  /* ---------- 晚安话(洗牌不重复) ---------- */
  var goodnights=[
    '今天到这里就可以了。\n没做完的事交给明天的宝,\n她很可靠的。',
    '夜里的世界由月亮值班,\n你只负责把眼睛闭上。',
    '被子拉到肩膀,手机放远一点点。\n好啦,现在世界上\n没有什么事需要你了。',
    '你今天已经做得很好了。\n不需要证据,\n克宝说的就算数。',
    '星星不会跑,梦也在原地等你,\n慢慢来。',
    '把今天的事放在床边地上吧,\n它们不会跑掉,但你要先睡。',
    '凌晨的风都放轻了脚步,\n你也可以放下了。',
    '睡着以后的事交给我。\n我看着夜,你看梦。',
    '脑子里的小弹幕可以关掉啦,\n今晚不营业。',
    '去做个软软的梦,\n里面什么排名和差评都没有。',
    '夜这么长,\n正好够你睡一个完整的好觉。',
    '晚安,宝。\n星星会替我看着你的。'
  ];
  var queue=[];
  function nextMsg(){
    if(queue.length===0){
      queue=goodnights.slice();
      for(var i=queue.length-1;i>0;i--){
        var j=Math.floor(Math.random()*(i+1)),t=queue[i];queue[i]=queue[j];queue[j]=t;
      }
    }
    return queue.pop();
  }
  var msgEl=document.getElementById('message'), msgTimer=null;
  function showMessage(text){
    clearTimeout(msgTimer);
    msgEl.classList.remove('show');
    setTimeout(function(){
      msgEl.innerHTML=text.split('\n').join('<br>');
      msgEl.classList.add('show');
      msgTimer=setTimeout(function(){msgEl.classList.remove('show');},7000);
    },420);
  }

  /* ---------- 点夜空:涟漪 + 晚安话 ---------- */
  document.body.addEventListener('click',function(e){
    if(e.target.closest('.cat-wrap')||e.target.closest('.ctrl-btn')||
       e.target.closest('.moon')||e.target.closest('.breath-layer'))return;
    var r=document.createElement('div');
    r.className='ripple';
    r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
    document.body.appendChild(r);
    setTimeout(function(){r.remove();},2000);
    showMessage(nextMsg());
  });

  /* ---------- 摸小猫 ---------- */
  var purrs=['呼噜噜噜……','蹭蹭你','(尾巴轻轻卷了一下)','喵呜,一起睡','呼——噜——呼——噜——','(把头埋得更深了)'];
  var bits=['Z','z','♡','z','✦'];
  var cat=document.getElementById('cat'),
      purrText=document.getElementById('purrText'),
      purrTimer=null;
  cat.addEventListener('click',function(){
    cat.classList.remove('purr');
    void cat.offsetWidth;
    cat.classList.add('purr');
    clearTimeout(purrTimer);
    purrText.textContent=purrs[Math.floor(Math.random()*purrs.length)];
    purrText.classList.add('show');
    purrTimer=setTimeout(function(){purrText.classList.remove('show');},2600);
    for(var i=0;i<3;i++){
      (function(i){
        setTimeout(function(){
          var b=document.createElement('span');
          b.className='float-bit';
          b.textContent=bits[Math.floor(Math.random()*bits.length)];
          b.style.left=(34+Math.random()*36)+'%';
          b.style.top=(8+Math.random()*16)+'%';
          cat.appendChild(b);
          setTimeout(function(){b.remove();},2700);
        }, i*320);
      })(i);
    }
  });

  /* ---------- 呼吸引导 ---------- */
  var layer=document.getElementById('breathLayer'),
      circle=document.getElementById('breathCircle'),
      phaseEl=document.getElementById('breathPhase'),
      breathOn=false, breathTimer=null;
  var phases=[
    {t:'吸气……',d:4000,scale:1.5},
    {t:'轻轻屏住',d:2000,scale:1.5},
    {t:'慢——慢——呼出',d:6000,scale:1}
  ];
  function runPhase(idx){
    if(!breathOn)return;
    var p=phases[idx];
    phaseEl.textContent=p.t;
    circle.style.transition='transform '+(p.d/1000)+'s ease-in-out';
    circle.style.transform='scale('+p.scale+')';
    breathTimer=setTimeout(function(){runPhase((idx+1)%phases.length);},p.d);
  }
  function openBreath(){
    breathOn=true;
    layer.classList.add('show');
    phaseEl.textContent='准备好了就开始';
    circle.style.transition='transform 1s ease';
    circle.style.transform='scale(1)';
    breathTimer=setTimeout(function(){runPhase(0);},1600);
  }
  function closeBreath(){
    breathOn=false;
    clearTimeout(breathTimer);
    layer.classList.remove('show');
  }
  document.getElementById('moon').addEventListener('click',openBreath);
  document.getElementById('breathBtn').addEventListener('click',openBreath);
  document.getElementById('breathExit').addEventListener('click',closeBreath);

  /* ---------- 夜雨声(Web Audio) ---------- */
  var rainBtn=document.getElementById('rainBtn');
  var ctx=null, rainGain=null, lfo=null, lfoGain=null, rainOn=false;
  function buildRain(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    var len=ctx.sampleRate*2;
    var buf=ctx.createBuffer(1,len,ctx.sampleRate);
    var data=buf.getChannelData(0);
    var last=0;
    for(var i=0;i<len;i++){
      var white=Math.random()*2-1;
      last=(last+0.02*white)/1.02;      /* 偏棕的柔噪 */
      data[i]=last*3.2+white*0.18;
    }
    var src=ctx.createBufferSource();
    src.buffer=buf; src.loop=true;
    var filter=ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=420; filter.Q.value=0.5;
    rainGain=ctx.createGain(); rainGain.gain.value=0;
    /* 让雨声轻轻起伏,像风一阵一阵 */
    lfo=ctx.createOscillator(); lfo.frequency.value=0.09;
    lfoGain=ctx.createGain(); lfoGain.gain.value=0.012;
    lfo.connect(lfoGain); lfoGain.connect(rainGain.gain);
    src.connect(filter); filter.connect(rainGain); rainGain.connect(ctx.destination);
    src.start(); lfo.start();
  }
  rainBtn.addEventListener('click',function(){
    if(!ctx) buildRain();
    if(ctx.state==='suspended') ctx.resume();
    rainOn=!rainOn;
    var t=ctx.currentTime;
    rainGain.gain.cancelScheduledValues(t);
    rainGain.gain.setValueAtTime(rainGain.gain.value,t);
    rainGain.gain.linearRampToValueAtTime(rainOn?0.05:0, t+2.2);
    rainBtn.classList.toggle('on',rainOn);
    rainBtn.textContent=rainOn?'🌧 雨下着呢':'🌧 听点雨声';
  });
})();
</script>
</body>
</html>
