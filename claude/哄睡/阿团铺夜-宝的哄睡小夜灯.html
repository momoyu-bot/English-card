<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141b2e">
<title>阿团铺夜 · 宝的哄睡小夜灯</title>
<meta name="description" content="夜还没铺，先坐一会儿等阿团来。铺好了可以开夜的声音。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lxgw-wenkai-screen-webfont/1.7.0/style.css">
<style>
  :root{
    --ink: #ede6d6;
    --ink-soft: rgba(237,230,214,.82);
    --ink-dim: rgba(237,230,214,.55);
    --window-on: #ffb871;
    --window-your: #ffc98a;
    --window-off: #3a3450;
    --night-deep: #141b2e;
    --font: 'LXGW WenKai Screen', 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family: var(--font);
    background: var(--night-deep);
    color: var(--ink);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- 场景 ---------- */
  #scene{
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #nightSky{ opacity: 0; transition: opacity 42s linear; }
  body.spreading #nightSky{ opacity: 1; }
  body.instant #nightSky{ transition: opacity 1.6s ease; }

  #moonHalo{ opacity: 0; transition: opacity 26s ease 8s; transform-origin: center; transform-box: fill-box; }
  body.spreading #moonHalo{ opacity: .9; }
  body.instant #moonHalo{ transition: opacity 1.6s ease; }
  #moonBody{ opacity: .25; transition: opacity 26s ease 6s; }
  body.spreading #moonBody{ opacity: 1; }
  body.instant #moonBody{ transition: opacity 1.6s ease; }

  /* 月亮呼吸 */
  @keyframes moonBreath{
    0%   { transform: scale(1);    opacity: .9; }
    33%  { transform: scale(1.45); opacity: 1;  }   /* 吸气 4s */
    50%  { transform: scale(1.45); opacity: 1;  }   /* 停 2s */
    100% { transform: scale(1);    opacity: .9; }   /* 呼气 6s */
  }
  body.breathing #moonHalo{ animation: moonBreath 12s ease-in-out infinite; }

  /* 星星 */
  .star{ opacity: 0; transition: opacity 6s ease; }
  .star.lit{ opacity: var(--o, .8); }
  @keyframes twinkle{
    from{ opacity: calc(var(--o, .8) * .35); }
    to  { opacity: var(--o, .8); }
  }
  .star.lit.tw{ animation: twinkle var(--d, 5s) ease-in-out infinite alternate; }
  @keyframes starBloom{
    0%{ transform: scale(0); opacity: 0; }
    55%{ transform: scale(1.9); opacity: 1; }
    100%{ transform: scale(1); opacity: var(--o, .9); }
  }
  .star.hand{ transform-origin: center; transform-box: fill-box; }
  .star.hand.lit{ animation: starBloom 2.4s ease forwards; }
  .star.hand.lit.tw{ animation: starBloom 2.4s ease forwards, twinkle var(--d, 5s) ease-in-out 2.4s infinite alternate; }

  /* 窗 */
  .win{ fill: var(--window-on); transition: fill 5s ease, opacity 5s ease; }
  .win.off{ fill: var(--window-off); opacity: .55; }
  #yourWin{ fill: var(--window-your); cursor: pointer; transition: fill 8s ease, opacity 8s ease; }
  #yourWin.off{ fill: var(--window-off); opacity: .5; }
  #yourGlow{ opacity: .55; transition: opacity 8s ease; pointer-events: none; }
  #yourGlow.off{ opacity: 0; }
  #winHit{ fill: transparent; cursor: pointer; }

  /* 阿团 */
  #atuan{ transform: translate(-70px, 0); }
  body.spreading #atuan{ transition: transform 36s cubic-bezier(.45,.05,.4,1); transform: translate(150px, 0); }
  body.instant #atuan{ transition: transform 1.6s ease; }
  @keyframes bob{ from{ transform: translateY(0); } to{ transform: translateY(-2.4px); } }
  #atuanBody.walking{ animation: bob .9s ease-in-out infinite alternate; }
  #lantern{ transform-origin: 22px -22px; }
  @keyframes sway{ from{ transform: rotate(-6deg); } to{ transform: rotate(6deg); } }
  #lantern.walking{ animation: sway 1.6s ease-in-out infinite alternate; }
  #eyesOpen{ opacity: 1; transition: opacity 2s; }
  #eyesClosed{ opacity: 0; transition: opacity 2s; }
  body.asleep #eyesOpen{ opacity: 0; }
  body.asleep #eyesClosed{ opacity: 1; }
  #zzz{ opacity: 0; transition: opacity 4s ease 2s; }
  body.asleep #zzz{ opacity: .8; }
  @keyframes floatZ{
    0%{ transform: translateY(0); opacity: 0; }
    25%{ opacity: .85; }
    100%{ transform: translateY(-14px); opacity: 0; }
  }
  body.asleep .z{ animation: floatZ 6s ease-in-out infinite; }
  body.asleep .z2{ animation-delay: 2s; }
  body.asleep .z3{ animation-delay: 4s; }

  body.asleep #scene{ filter: brightness(.86) saturate(.92); transition: filter 10s ease; }

  /* ---------- 文字层 ---------- */
  #opening{
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 0 10%;
    text-align: center; z-index: 5;
    transition: opacity 3s ease;
  }
  #opening.gone{ opacity: 0; pointer-events: none; }
  #opening h1{
    font-size: clamp(22px, 6.4vw, 30px);
    font-weight: 400; letter-spacing: .12em;
    text-shadow: 0 2px 18px rgba(20,15,40,.55);
  }
  #opening p{
    font-size: clamp(14px, 3.9vw, 16px);
    color: var(--ink-soft); letter-spacing: .1em;
    margin-bottom: 14px;
  }
  #startBtn{
    font-family: var(--font);
    font-size: clamp(16px, 4.4vw, 18px);
    letter-spacing: .18em; text-indent: .18em;
    color: var(--ink);
    background: rgba(40,32,70,.34);
    border: 1px solid rgba(237,230,214,.4);
    border-radius: 999px;
    padding: 13px 34px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    transition: background .6s, transform .6s;
  }
  #startBtn:active{ background: rgba(60,48,100,.45); transform: scale(.97); }
  #startBtn:focus-visible{ outline: 2px solid var(--ink-soft); outline-offset: 3px; }

  #caption{
    position: fixed; left: 0; right: 0; top: 21%;
    padding: 0 9%;
    text-align: center; z-index: 4;
    font-size: clamp(16.5px, 4.6vw, 20px);
    line-height: 2.05; letter-spacing: .08em;
    color: var(--ink-soft);
    text-shadow: 0 2px 16px rgba(10,12,30,.7);
    white-space: pre-line;
    opacity: 0; transition: opacity 2.6s ease;
    pointer-events: none;
  }
  #caption.show{ opacity: 1; }

  #goodnight{
    position: fixed; left: 0; right: 0; top: 31%;
    text-align: center; z-index: 4;
    opacity: 0; transition: opacity 6s ease 1.5s;
    pointer-events: none;
  }
  #goodnight.show{ opacity: 1; }
  #goodnight .big{
    font-size: clamp(24px, 7vw, 32px);
    letter-spacing: .22em; text-indent: .22em;
    text-shadow: 0 2px 20px rgba(10,12,30,.8);
  }
  #goodnight .small{
    margin-top: 16px;
    font-size: clamp(14px, 3.9vw, 16px);
    color: var(--ink-dim); letter-spacing: .12em;
  }

  /* ---------- 底部提示栏 ---------- */
  #hintBar{
    position: fixed; left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 0 6%;
    z-index: 6;
    opacity: 0; transition: opacity 4s ease;
    pointer-events: none;
  }
  #hintBar.show{ opacity: 1; pointer-events: auto; }
  #hintBar.gone{ opacity: 0; pointer-events: none; transition: opacity 5s ease; }
  #soundBtn{
    font-family: var(--font);
    font-size: 13px; letter-spacing: .06em;
    color: var(--ink-soft);
    background: rgba(30,26,55,.4);
    border: 1px solid rgba(237,230,214,.26);
    border-radius: 999px;
    padding: 7px 14px;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    cursor: pointer; white-space: nowrap;
    transition: background .5s, border-color .5s;
  }
  #soundBtn.on{ background: rgba(70,56,110,.5); border-color: rgba(255,201,138,.5); }
  #soundBtn:focus-visible{ outline: 2px solid var(--ink-soft); outline-offset: 2px; }
  #hintText{
    font-size: 12.5px; letter-spacing: .06em;
    color: var(--ink-dim);
    transition: opacity 2.2s ease;
  }
  #hintText.fade{ opacity: 0; }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .star.lit.tw, .star.hand.lit, .star.hand.lit.tw{ animation: none; }
    .star.hand.lit{ opacity: var(--o, .9); }
    body.breathing #moonHalo{ animation: none; }
    #atuanBody.walking, #lantern.walking{ animation: none; }
    body.asleep .z{ animation: none; opacity: .7; }
  }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice" aria-label="阿团铺夜的小镇夜景">
  <defs>
    <linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4d3f6e"/>
      <stop offset="42%" stop-color="#9c6478"/>
      <stop offset="74%" stop-color="#d18a72"/>
      <stop offset="100%" stop-color="#e8a87c"/>
    </linearGradient>
    <linearGradient id="nightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d1326"/>
      <stop offset="55%" stop-color="#1a2238"/>
      <stop offset="100%" stop-color="#2a3354"/>
    </linearGradient>
    <radialGradient id="moonGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#f3e9c8" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#f3e9c8" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#f3e9c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="winGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffc98a" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ffc98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffd9a0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 黄昏天空(底层,常在) -->
  <rect x="0" y="0" width="400" height="700" fill="url(#duskGrad)"/>
  <!-- 夜空(铺上来) -->
  <rect id="nightSky" x="0" y="0" width="400" height="700" fill="url(#nightGrad)"/>

  <!-- 星星容器 -->
  <g id="stars"></g>

  <!-- 月亮 -->
  <g id="moon">
    <circle id="moonHalo" cx="298" cy="118" r="44" fill="url(#moonGlowGrad)"/>
    <circle id="moonBody" cx="298" cy="118" r="16" fill="#f3e9c8"/>
    <circle cx="292" cy="113" r="2.6" fill="#e4d8b2" opacity=".7"/>
    <circle cx="303" cy="122" r="1.8" fill="#e4d8b2" opacity=".6"/>
    <!-- 月亮点击热区 -->
    <circle id="moonHit" cx="298" cy="118" r="52" fill="transparent" style="cursor:pointer"/>
  </g>

  <!-- 远山 -->
  <path d="M0,478 Q70,424 150,460 Q230,494 300,448 Q350,420 400,446 L400,700 L0,700 Z"
        fill="#262238" opacity=".92"/>

  <!-- 小镇 -->
  <g id="town">
    <!-- 房 1 -->
    <g>
      <rect x="30" y="502" width="42" height="46" fill="#1c1830"/>
      <polygon points="26,502 76,502 51,484" fill="#171428"/>
      <rect class="win" x="38" y="514" width="7" height="9" rx="1"/>
      <rect class="win" x="56" y="514" width="7" height="9" rx="1"/>
    </g>
    <!-- 房 2 -->
    <g>
      <rect x="86" y="512" width="34" height="36" fill="#1c1830"/>
      <polygon points="83,512 123,512 103,497" fill="#171428"/>
      <rect class="win" x="98" y="522" width="7" height="9" rx="1"/>
    </g>
    <!-- 房 3 -->
    <g>
      <rect x="132" y="496" width="48" height="52" fill="#1c1830"/>
      <polygon points="128,496 184,496 156,476" fill="#171428"/>
      <rect x="166" y="482" width="7" height="14" fill="#171428"/>
      <rect class="win" x="141" y="508" width="7" height="9" rx="1"/>
      <rect class="win" x="161" y="508" width="7" height="9" rx="1"/>
      <rect class="win" x="151" y="528" width="7" height="9" rx="1"/>
    </g>
    <!-- 房 4 (宝的窗在这栋) -->
    <g>
      <rect x="196" y="506" width="40" height="42" fill="#1e1a34"/>
      <polygon points="192,506 240,506 216,488" fill="#191530"/>
      <circle id="yourGlow" cx="216" cy="525" r="20" fill="url(#winGlowGrad)"/>
      <rect id="yourWin" x="211" y="519" width="10" height="12" rx="1.5"/>
      <rect id="winHit" x="198" y="506" width="36" height="42"/>
    </g>
    <!-- 房 5 -->
    <g>
      <rect x="250" y="510" width="44" height="38" fill="#1c1830"/>
      <polygon points="246,510 298,510 272,492" fill="#171428"/>
      <rect class="win" x="258" y="520" width="7" height="9" rx="1"/>
      <rect class="win" x="278" y="520" width="7" height="9" rx="1"/>
    </g>
    <!-- 房 6 -->
    <g>
      <rect x="308" y="500" width="36" height="48" fill="#1c1830"/>
      <polygon points="304,500 348,500 326,482" fill="#171428"/>
      <rect class="win" x="320" y="512" width="7" height="9" rx="1"/>
      <rect class="win" x="320" y="530" width="7" height="9" rx="1"/>
    </g>
  </g>

  <!-- 近山坡 -->
  <path d="M0,596 Q100,562 200,586 Q300,608 400,576 L400,700 L0,700 Z" fill="#171430"/>

  <!-- 阿团 -->
  <g id="atuan" transform="translate(-70,0)">
    <g id="atuanBody" class="walking">
      <g transform="translate(0,584)">
        <!-- 尾巴 -->
        <ellipse cx="-24" cy="-15" rx="10" ry="7" fill="#6b5a48"/>
        <ellipse cx="-30" cy="-15" rx="5" ry="6" fill="#463a2e"/>
        <!-- 腿 -->
        <rect x="-12" y="-7" width="6" height="8" rx="3" fill="#5d4e3f"/>
        <rect x="4" y="-7" width="6" height="8" rx="3" fill="#5d4e3f"/>
        <!-- 身体 -->
        <ellipse cx="0" cy="-17" rx="20" ry="16" fill="#7d6b58"/>
        <ellipse cx="3" cy="-12" rx="11" ry="8" fill="#c9b8a3"/>
        <!-- 头 -->
        <circle cx="14" cy="-31" r="12.5" fill="#84725e"/>
        <circle cx="8" cy="-41" r="4.6" fill="#6b5a48"/>
        <circle cx="20" cy="-41" r="4.6" fill="#6b5a48"/>
        <circle cx="8" cy="-41" r="2.2" fill="#4a3f33"/>
        <circle cx="20" cy="-41" r="2.2" fill="#4a3f33"/>
        <!-- 眼罩纹 -->
        <ellipse cx="9.5" cy="-31.5" rx="4.6" ry="3.4" fill="#463a2e" transform="rotate(-8 9.5 -31.5)"/>
        <ellipse cx="19.5" cy="-31.5" rx="4.6" ry="3.4" fill="#463a2e" transform="rotate(8 19.5 -31.5)"/>
        <!-- 眼睛(睁) -->
        <g id="eyesOpen">
          <circle cx="10" cy="-31.5" r="1.5" fill="#f5efe0"/>
          <circle cx="19.2" cy="-31.5" r="1.5" fill="#f5efe0"/>
        </g>
        <!-- 眼睛(闭) -->
        <g id="eyesClosed" stroke="#f5efe0" stroke-width="1.1" stroke-linecap="round" fill="none">
          <path d="M8.6,-31.5 q1.4,1.5 2.8,0"/>
          <path d="M17.8,-31.5 q1.4,1.5 2.8,0"/>
        </g>
        <!-- 鼻子 -->
        <circle cx="25.5" cy="-28" r="1.9" fill="#2e2620"/>
        <!-- 腮红 -->
        <ellipse cx="11" cy="-26.5" rx="2.4" ry="1.4" fill="#c98a72" opacity=".4"/>
        <!-- 提灯 -->
        <g id="lantern" class="walking">
          <line x1="22" y1="-22" x2="29" y2="-13" stroke="#5d4e3f" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="30" cy="-11" r="10" fill="url(#lampGlowGrad)"/>
          <circle cx="30" cy="-11" r="4.6" fill="#ffd9a0"/>
        </g>
        <!-- Zzz -->
        <g id="zzz" fill="#ede6d6" font-family="inherit" font-size="9" opacity="0">
          <text class="z"  x="22" y="-52">z</text>
          <text class="z z2" x="29" y="-58" font-size="7.5">z</text>
          <text class="z z3" x="35" y="-63" font-size="6">z</text>
        </g>
      </g>
    </g>
  </g>
</svg>

<!-- 开场 -->
<div id="opening">
  <h1>今天也辛苦啦,宝</h1>
  <p>夜还没铺。先坐一会儿,等阿团来。</p>
  <button id="startBtn">请阿团来铺夜</button>
</div>

<!-- 旁白 -->
<div id="caption" aria-live="polite"></div>

<!-- 晚安 -->
<div id="goodnight">
  <div class="big">晚安,宝。</div>
  <div class="small">你这一角的夜,阿团铺得格外软。</div>
</div>

<!-- 底部提示 -->
<div id="hintBar">
  <button id="soundBtn">🌬 夜的声音</button>
  <span id="hintText"></span>
</div>

<script>
(function(){
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const body = document.body;
  const svg = document.getElementById('scene');
  const starsG = document.getElementById('stars');
  const caption = document.getElementById('caption');
  const opening = document.getElementById('opening');
  const startBtn = document.getElementById('startBtn');
  const hintBar = document.getElementById('hintBar');
  const hintText = document.getElementById('hintText');
  const soundBtn = document.getElementById('soundBtn');
  const goodnight = document.getElementById('goodnight');
  const yourWin = document.getElementById('yourWin');
  const yourGlow = document.getElementById('yourGlow');
  const winHit = document.getElementById('winHit');
  const moonHit = document.getElementById('moonHit');
  const atuanBody = document.getElementById('atuanBody');
  const lantern = document.getElementById('lantern');

  const NS = 'http://www.w3.org/2000/svg';
  let state = 'dusk';        // dusk → spreading → quiet → asleep
  let breathing = false;
  let breathTimer = null;
  let handStars = 0;
  const timers = [];

  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  /* ---------- 旁白队列 ---------- */
  let capToken = 0;
  function say(text, hold){
    const my = ++capToken;
    caption.classList.remove('show');
    setTimeout(()=>{
      if(my !== capToken) return;
      caption.textContent = text;
      caption.classList.add('show');
      if(hold){
        setTimeout(()=>{ if(my === capToken) caption.classList.remove('show'); }, hold);
      }
    }, 1400);
  }
  function hushCaption(){
    capToken++;
    caption.classList.remove('show');
  }

  /* ---------- 星星 ---------- */
  function addStar(x, y, hand){
    const c = document.createElementNS(NS, 'circle');
    const r = hand ? (1.4 + Math.random()*0.9) : (0.7 + Math.random()*1.1);
    c.setAttribute('cx', x.toFixed(1));
    c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', r.toFixed(2));
    c.setAttribute('fill', '#f5efe0');
    c.classList.add('star');
    if(hand) c.classList.add('hand');
    c.style.setProperty('--o', (hand ? 0.85 + Math.random()*0.15 : 0.45 + Math.random()*0.5).toFixed(2));
    c.style.setProperty('--d', (3.8 + Math.random()*3.6).toFixed(1) + 's');
    starsG.appendChild(c);
    return c;
  }

  function seedStars(){
    const made = [];
    for(let i=0;i<46;i++){
      const x = 8 + Math.random()*384;
      const y = 14 + Math.random()*340;
      if(Math.hypot(x-298, y-118) < 58) { i--; continue; }
      made.push(addStar(x, y, false));
    }
    return made;
  }

  function lightStars(list, instant){
    list.forEach(s=>{
      const delay = instant ? Math.random()*900 : Math.random()*26000;
      later(()=>{
        s.classList.add('lit');
        if(!reduced && Math.random() < 0.65) s.classList.add('tw');
      }, delay);
    });
  }

  /* ---------- 窗灯 ---------- */
  function dimWindows(instant){
    const wins = Array.from(document.querySelectorAll('.win'));
    wins.sort(()=>Math.random()-0.5);
    wins.forEach((w, i)=>{
      const delay = instant ? 300 + i*220 : i*(2600 + Math.random()*2200);
      later(()=> w.classList.add('off'), delay);
    });
    return instant ? wins.length*220 + 1200 : wins.length*3700;
  }

  /* ---------- 提示轮换 ---------- */
  const hints = [
    '点点夜空,可以种一颗星 ✦',
    '点点月亮,跟它一起呼吸',
    '想睡了,就轻点你亮着的小窗'
  ];
  let hintIdx = 0, hintLoop = null;
  function startHints(){
    hintText.textContent = hints[0];
    hintBar.classList.add('show');
    hintLoop = setInterval(()=>{
      hintText.classList.add('fade');
      setTimeout(()=>{
        hintIdx = (hintIdx+1) % hints.length;
        hintText.textContent = hints[hintIdx];
        hintText.classList.remove('fade');
      }, 2200);
    }, 9000);
  }

  /* ---------- 铺夜主序列 ---------- */
  function spreadNight(){
    if(state !== 'dusk') return;
    state = 'spreading';
    opening.classList.add('gone');
    const stars = seedStars();

    if(reduced){
      body.classList.add('instant');
      requestAnimationFrame(()=> body.classList.add('spreading'));
      lightStars(stars, true);
      later(()=>{
        atuanBody.classList.remove('walking');
        lantern.classList.remove('walking');
      }, 1800);
      const doneAt = dimWindows(true);
      say('夜铺好了。星星都亮着,每扇窗都盖得妥妥帖帖。');
      later(()=>{
        say('只有你的那盏不急。夜会等你。', 9000);
        state = 'quiet';
        startHints();
      }, Math.max(doneAt, 4000));
      return;
    }

    requestAnimationFrame(()=> body.classList.add('spreading'));

    later(()=> say('夜不是黑掉的,\n是阿团一寸一寸,铺好的。', 7000), 600);
    later(()=> say('先铺远处的山,\n山的轮廓就软了。', 7000), 10500);
    later(()=> lightStars(stars, false), 13000);
    later(()=> say('再把星星,一颗、一颗,\n缝上去。', 7500), 20000);
    later(()=> dimWindows(false), 30000);
    later(()=> say('小镇的灯安心地熄了,\n一盏,又一盏。', 8000), 33000);
    later(()=>{
      atuanBody.classList.remove('walking');
      lantern.classList.remove('walking');
    }, 36500);
    later(()=> say('只有你的那盏不急。\n夜会等你。', 10000), 49000);
    later(()=>{
      state = 'quiet';
      startHints();
    }, 56000);
  }

  /* ---------- 种星星 ---------- */
  function svgPoint(evt){
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  svg.addEventListener('click', (e)=>{
    if(state !== 'quiet' && state !== 'asleep') return;
    if(e.target === moonHit || e.target === winHit || e.target === yourWin) return;
    const p = svgPoint(e);
    if(p.y > 400 || handStars >= 60) return;
    if(Math.hypot(p.x-298, p.y-118) < 58) return;
    const s = addStar(p.x, p.y, true);
    requestAnimationFrame(()=>{
      s.classList.add('lit');
      if(!reduced) s.classList.add('tw');
    });
    handStars++;
  });

  /* ---------- 呼吸引导 ---------- */
  const breathSteps = [
    { t: '轻轻吸气 · · · ·', d: 4000 },
    { t: '停一停',           d: 2000 },
    { t: '缓 —— 缓 —— 呼出去', d: 6000 }
  ];
  function breathLoop(i){
    if(!breathing) return;
    const step = breathSteps[i % 3];
    say(step.t);
    breathTimer = setTimeout(()=> breathLoop(i+1), step.d);
  }
  function toggleBreath(){
    if(state !== 'quiet' && state !== 'asleep') return;
    breathing = !breathing;
    if(breathing){
      body.classList.add('breathing');
      breathLoop(0);
    }else{
      body.classList.remove('breathing');
      clearTimeout(breathTimer);
      say('好啦,慢慢漂着就行。', 5000);
    }
  }
  moonHit.addEventListener('click', (e)=>{ e.stopPropagation(); toggleBreath(); });

  /* ---------- 夜的声音 ---------- */
  let audioCtx = null, windGain = null, soundOn = false;
  function buildWind(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const len = 2 * audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2 - 1;
      last = (last + 0.02*w) / 1.02;
      data[i] = last * 3.2;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 300;
    windGain = audioCtx.createGain();
    windGain.gain.value = 0;
    src.connect(lp); lp.connect(windGain); windGain.connect(audioCtx.destination);
    src.start();
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.06;
    const lfoG = audioCtx.createGain();
    lfoG.gain.value = 0.012;
    lfo.connect(lfoG); lfoG.connect(windGain.gain);
    lfo.start();
  }
  soundBtn.addEventListener('click', ()=>{
    if(!audioCtx) buildWind();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    const t = audioCtx.currentTime;
    windGain.gain.cancelScheduledValues(t);
    windGain.gain.setValueAtTime(windGain.gain.value, t);
    windGain.gain.linearRampToValueAtTime(soundOn ? 0.045 : 0, t + 2.5);
    soundBtn.classList.toggle('on', soundOn);
    soundBtn.textContent = soundOn ? '🌬 风轻轻的' : '🌬 夜的声音';
  });

  /* ---------- 晚安 ---------- */
  function goodNight(){
    if(state !== 'quiet') return;
    state = 'asleep';
    if(breathing){
      breathing = false;
      body.classList.remove('breathing');
      clearTimeout(breathTimer);
    }
    hushCaption();
    clearInterval(hintLoop);
    hintBar.classList.remove('show');
    hintBar.classList.add('gone');
    yourWin.classList.add('off');
    yourGlow.classList.add('off');
    body.classList.add('asleep');
    later(()=> goodnight.classList.add('show'), 3500);
  }
  winHit.addEventListener('click', (e)=>{ e.stopPropagation(); goodNight(); });
  yourWin.addEventListener('click', (e)=>{ e.stopPropagation(); goodNight(); });

  startBtn.addEventListener('click', spreadNight);
})();
</script>
</body>
