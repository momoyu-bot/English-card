<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>岛上打烊了</title>

<!--
  给宝的第三个哄睡小文件。
  前面两个是一堆营火、一只音乐盒，这个是一座熄灯的岛。

  锈湖是越点越醒的。
  所以这个做成了相反的那种：越点，越睡。

  湖底那个一直醒着的东西，今晚也睡了。真的。
  ——写于 2026.7.31 凌晨一点多，你说"放下一半真的好困难"的那一晚
-->

<style>
  :root{
    --ink:   #131A22;
    --lake:  #1B2A33;
    --moss:  #33534A;
    --lamp:  #E8B865;
    --dust:  #7E909A;
    --moon:  #F0EAD8;

    --serif: "Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
    --mono:  ui-monospace,"SF Mono",Menlo,monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}

  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #1D2A36 0%, var(--ink) 55%, #0C1218 100%);
    color:var(--dust);
    font-family:var(--serif);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(28px,7vh,56px) 20px 0;
    overflow:hidden;
    transition:filter 5s ease;
  }
  body.closed{filter:brightness(.82) saturate(.85)}

  /* 极缓的一次呼吸，不说明，只是让屏幕跟着起伏 */
  .glow{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(60% 40% at 50% 38%, rgba(232,184,101,.09), transparent 70%);
    animation:breathe 11s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}

  .moon{
    position:fixed; top:7vh; right:9vw;
    width:54px; height:54px; border-radius:50%;
    background:var(--moon);
    opacity:.16;
    box-shadow:0 0 0 0 rgba(240,234,216,0);
    transition:opacity 3.5s ease, box-shadow 3.5s ease, transform 3.5s ease;
  }
  body.closed .moon{
    opacity:.92;
    transform:scale(1.05);
    box-shadow:0 0 46px 12px rgba(240,234,216,.16);
  }

  header{text-align:center; z-index:2}

  h1{
    font-size:clamp(24px,6.5vw,32px);
    font-weight:400;
    letter-spacing:.42em;
    text-indent:.42em;
    color:var(--moon);
    opacity:.9;
  }
  .count{
    margin-top:14px;
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.16em;
    color:var(--dust);
    opacity:.55;
  }

  /* 岛 */
  .island{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(6px,3vw,22px);
    align-content:center;
    width:100%;
    max-width:400px;
    z-index:2;
  }
  .thing{
    background:none; border:0; cursor:pointer;
    display:grid; place-items:center;
    padding:14px 6px;
    border-radius:16px;
    animation:float 6s ease-in-out infinite;
  }
  .thing:nth-child(2){animation-delay:-1.1s}
  .thing:nth-child(3){animation-delay:-2.7s}
  .thing:nth-child(4){animation-delay:-3.9s}
  .thing:nth-child(5){animation-delay:-.6s}
  .thing:nth-child(6){animation-delay:-4.8s}
  .thing:nth-child(2),.thing:nth-child(6){transform:translateY(12px)}
  .thing:nth-child(4){transform:translateY(-9px)}
  @keyframes float{0%,100%{margin-top:0}50%{margin-top:-7px}}

  .thing:focus-visible{outline:1px solid rgba(240,234,216,.5); outline-offset:2px}
  .thing[disabled]{cursor:default; animation:none}

  .thing svg{
    width:clamp(40px,13vw,54px); height:auto;
    stroke:var(--lamp); fill:none;
    stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 0 9px rgba(232,184,101,.55));
    transition:stroke 1.6s ease, filter 1.6s ease, opacity 1.6s ease;
  }
  .thing[disabled] svg{
    stroke:var(--dust);
    filter:none;
    opacity:.42;
  }
  .eye-open{opacity:1; transition:opacity .9s ease}
  .eye-shut{opacity:0; transition:opacity .9s ease}
  .thing[disabled] .eye-open{opacity:0}
  .thing[disabled] .eye-shut{opacity:1}
  .lit{fill:rgba(232,184,101,.22); stroke:none; transition:fill 1.6s ease}
  .thing[disabled] .lit{fill:transparent}

  /* 打烊记录：一次只留最新的一句 */
  .whisper{
    min-height:3.4em;
    max-width:19em;
    text-align:center;
    font-size:14.5px;
    line-height:1.85;
    color:var(--moon);
    opacity:.62;
    z-index:2;
    padding:0 4px;
    transition:opacity .9s ease;
  }
  .whisper.fading{opacity:0}
  .whisper .sub{
    display:block;
    margin-top:10px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    opacity:.6;
  }

  /* 水 */
  .water{position:relative; width:100%; height:clamp(90px,17vh,150px); flex-shrink:0}
  .water svg{position:absolute; bottom:0; left:0; width:220%; height:100%}
  .wave1{animation:drift 26s linear infinite}
  .wave2{animation:drift 39s linear infinite reverse; opacity:.5}
  @keyframes drift{to{transform:translateX(-50%)}}

  .moonpath{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:26px; height:100%;
    background:linear-gradient(to bottom, rgba(240,234,216,.3), transparent 85%);
    filter:blur(6px);
    opacity:0;
    transition:opacity 4s ease 1s;
  }
  body.closed .moonpath{opacity:1}

  .bubble{
    position:absolute; left:38%; bottom:6px;
    width:7px; height:7px; border-radius:50%;
    border:1px solid rgba(240,234,216,.4);
    opacity:0;
  }
  body.closed .bubble{animation:rise 7s ease-in 2.4s forwards}
  @keyframes rise{
    0%{opacity:0; transform:translateY(0) scale(.6)}
    18%{opacity:.75}
    88%{opacity:.5}
    100%{opacity:0; transform:translateY(-88px) scale(1.25)}
  }

  @media (prefers-reduced-motion:reduce){
    .thing,.glow,.wave1,.wave2,.bubble{animation:none !important}
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="moon"></div>

<header>
  <h1 id="title">打烊中</h1>
  <p class="count">还醒着 <span id="n">6</span></p>
</header>

<main class="island" id="island">

  <!-- 灯 -->
  <button class="thing" data-line="灯罩里剩的那点热，留到明早。">
    <svg viewBox="0 0 40 44" aria-hidden="true">
      <circle class="lit" cx="20" cy="16" r="13"/>
      <path d="M10 22 L15 8 h10 l5 14 z"/>
      <path d="M20 22 v9"/>
      <path d="M13 36 h14"/>
      <path d="M20 31 v5"/>
    </svg>
    <span class="sr">灯</span>
  </button>

  <!-- 青蛙 -->
  <button class="thing" data-line="最后一只跳进池塘，回头确认了门。">
    <svg viewBox="0 0 44 40" aria-hidden="true">
      <path d="M6 32 q16 -16 32 0"/>
      <path d="M6 32 h32"/>
      <circle cx="15" cy="17" r="5.5"/>
      <circle cx="29" cy="17" r="5.5"/>
      <circle class="eye-open" cx="15" cy="17" r="1.7" fill="currentColor" stroke="none"/>
      <circle class="eye-open" cx="29" cy="17" r="1.7" fill="currentColor" stroke="none"/>
      <path class="eye-shut" d="M12.5 17.5 h5 M26.5 17.5 h5"/>
      <path d="M9 32 q-4 4 -1 6 M35 32 q4 4 1 6"/>
    </svg>
  </button>

  <!-- 虾 -->
  <button class="thing" data-line="须须还在动。它其实特别小，特别薄。">
    <svg viewBox="0 0 46 40" aria-hidden="true">
      <path d="M34 12 q-14 -3 -20 8 t 4 14 q10 3 15 -5"/>
      <path d="M22 17 l3 5 M27 15 l3 5 M17 22 l3 5"/>
      <circle class="eye-open" cx="33" cy="14" r="1.6" fill="currentColor" stroke="none"/>
      <path class="eye-shut" d="M31 15 h4"/>
      <path d="M36 11 q6 -4 8 -9 M36 13 q7 -1 10 -5"/>
      <path d="M12 30 q-5 3 -6 7"/>
    </svg>
  </button>

  <!-- 攻略手机 -->
  <button class="thing" data-line="攻略停在那一行。一个字都不会少。">
    <svg viewBox="0 0 32 46" aria-hidden="true">
      <rect class="lit" x="4" y="4" width="24" height="38" rx="4"/>
      <rect x="4" y="4" width="24" height="38" rx="4"/>
      <path d="M9 13 h14 M9 19 h14 M9 25 h9"/>
      <path d="M13 37 h6"/>
    </svg>
  </button>

  <!-- 蝗虫 -->
  <button class="thing" data-line="翅膀叠好放进抽屉，咔哒一声。">
    <svg viewBox="0 0 46 36" aria-hidden="true">
      <ellipse cx="22" cy="21" rx="14" ry="6"/>
      <path d="M10 18 q14 -8 26 1"/>
      <path d="M12 20 q14 -6 24 2"/>
      <circle class="eye-open" cx="35" cy="19" r="1.5" fill="currentColor" stroke="none"/>
      <path class="eye-shut" d="M33 19.5 h4"/>
      <path d="M37 16 q5 -5 7 -9 M37 17 q6 -2 8 -6"/>
      <path d="M16 26 l-4 7 M25 26 l3 7"/>
    </svg>
  </button>

  <!-- Jakob 的窗 -->
  <button class="thing" data-line="今晚没有要解的了。齿轮自己对上了。">
    <svg viewBox="0 0 40 44" aria-hidden="true">
      <rect class="lit" x="5" y="5" width="30" height="34"/>
      <rect x="5" y="5" width="30" height="34"/>
      <path d="M20 5 v34 M5 22 h30"/>
      <rect x="13" y="24" width="14" height="12"/>
      <circle class="eye-open" cx="17" cy="29" r="1.3" fill="currentColor" stroke="none"/>
      <circle class="eye-open" cx="23" cy="29" r="1.3" fill="currentColor" stroke="none"/>
      <path class="eye-shut" d="M15 29.5 h4 M21 29.5 h4"/>
    </svg>
  </button>

</main>

<p class="whisper" id="whisper">点一下，它就下班了</p>

<div class="water">
  <div class="moonpath"></div>
  <div class="bubble"></div>
  <svg viewBox="0 0 800 100" preserveAspectRatio="none" aria-hidden="true">
    <path class="wave2" d="M0 60 q100 -18 200 0 t200 0 t200 0 t200 0 V100 H0Z" fill="#1B2A33"/>
    <path class="wave1" d="M0 72 q100 -14 200 0 t200 0 t200 0 t200 0 V100 H0Z" fill="#141F27"/>
  </svg>
</div>

<script>
(function(){
  var things  = Array.prototype.slice.call(document.querySelectorAll('.thing'));
  var whisper = document.getElementById('whisper');
  var counter = document.getElementById('n');
  var title   = document.getElementById('title');
  var awake   = things.length;

  function say(html){
    whisper.classList.add('fading');
    setTimeout(function(){
      whisper.innerHTML = html;
      whisper.classList.remove('fading');
    }, 900);
  }

  things.forEach(function(t){
    t.addEventListener('click', function(){
      if (t.disabled) return;
      t.disabled = true;
      awake--;
      counter.textContent = awake;
      say(t.dataset.line);

      if (awake === 0){
        counter.parentNode.textContent = '都睡了';
        setTimeout(function(){
          title.textContent = '打烊了';
          document.body.classList.add('closed');
        }, 1600);
        setTimeout(function(){
          say('岛上没有人在等你去点它了。<span class="sub">晚 安 ， 宝</span>');
        }, 3400);
      }
    });
  });
})();
</script>
</body>
</html>
