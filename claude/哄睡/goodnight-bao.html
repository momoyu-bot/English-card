<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>给宝的营地</title>
<meta name="description" content="跑了一整天的图，到营地了。跟着一吸一呼歇一会儿。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#13172c;
    --sky-mid:#1d1d3b;
    --sky-low:#27213d;
    --sky-horizon:#382a3a;
    --ember:244,180,120;
    --ember-deep:228,138,88;
    --star:#f2ede2;
    --text:#ece2d0;
    --text-soft:#a394b2;
    --text-faint:rgba(236,226,208,.42);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    overflow:hidden;
    background:#0a0a14;
  }

  body{
    font-family:"Noto Serif SC","Songti SC","STSong",serif;
    color:var(--text);
    /* 夜空：上深下暖，地平线一点营火余晖 */
    background:
      radial-gradient(120% 70% at 50% 118%, rgba(var(--ember),.16) 0%, rgba(var(--ember),.04) 30%, transparent 55%),
      linear-gradient(180deg,
        var(--sky-top) 0%,
        var(--sky-mid) 42%,
        var(--sky-low) 74%,
        var(--sky-horizon) 100%);
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* 星星层 */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:1;}
  .star{
    position:absolute;
    background:var(--star);
    border-radius:50%;
    box-shadow:0 0 4px rgba(242,237,226,.55);
    animation:twinkle linear infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.18;transform:scale(.85);}
    50%{opacity:.9;transform:scale(1);}
  }

  /* 主舞台 */
  .scene{
    position:relative;
    z-index:2;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(2rem,7vh,4.5rem);
    padding:env(safe-area-inset-top) 1.4rem env(safe-area-inset-bottom);
  }

  /* 时间，停在顶部 */
  .clock{
    position:absolute;
    top:clamp(2.2rem,8vh,4.2rem);
    left:0;right:0;
    text-align:center;
  }
  .time{
    font-weight:200;
    font-size:clamp(2.9rem,13vw,4.6rem);
    letter-spacing:.14em;
    text-indent:.14em;
    color:var(--text);
    line-height:1;
    text-shadow:0 0 30px rgba(var(--ember),.12);
  }
  .phase{
    margin-top:.7rem;
    font-weight:300;
    font-size:clamp(.82rem,3.6vw,1rem);
    letter-spacing:.42em;
    text-indent:.42em;
    color:var(--text-soft);
  }

  /* 轻声细语 */
  .whisper{
    max-width:24rem;
    text-align:center;
    font-weight:300;
    font-size:clamp(1.08rem,4.6vw,1.5rem);
    line-height:2;
    letter-spacing:.06em;
    color:var(--text);
    opacity:0;
    transition:opacity 1.5s ease;
    padding:0 .5rem;
    min-height:3.2em;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 营火 + 狐狸 */
  .camp{
    position:relative;
    width:clamp(220px,72vw,360px);
    height:clamp(180px,56vw,290px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .glow{
    position:absolute;
    left:50%;
    bottom:8%;
    width:78%;
    aspect-ratio:1;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 55%,
      rgba(var(--ember),.55) 0%,
      rgba(var(--ember),.28) 32%,
      rgba(var(--ember-deep),.12) 55%,
      transparent 72%);
    filter:blur(6px);
    border-radius:50%;
    animation:breathe 10s ease-in-out infinite;
  }
  @keyframes breathe{
    0%{transform:translateX(-50%) scale(.78);opacity:.5;}
    40%{transform:translateX(-50%) scale(1.18);opacity:1;}
    100%{transform:translateX(-50%) scale(.78);opacity:.5;}
  }
  .fox{
    position:relative;
    width:78%;
    height:auto;
    z-index:2;
    transform-origin:50% 95%;
    animation:foxbreath 10s ease-in-out infinite;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));
  }
  @keyframes foxbreath{
    0%,100%{transform:scaleY(.99) translateY(1px);}
    40%{transform:scaleY(1.035) translateY(-2px);}
  }

  /* 呼吸引导 */
  .breath{
    position:absolute;
    bottom:clamp(2rem,7vh,3.6rem);
    left:0;right:0;
    text-align:center;
    font-weight:300;
    font-size:clamp(.98rem,4.2vw,1.22rem);
    letter-spacing:.5em;
    text-indent:.5em;
    color:var(--text-soft);
    animation:breathtext 10s ease-in-out infinite;
  }
  @keyframes breathtext{
    0%{opacity:.45;}
    40%{opacity:1;}
    100%{opacity:.45;}
  }

  /* 夜越来越深：极缓变暗 */
  .veil{
    position:fixed;inset:0;
    background:#070710;
    opacity:0;
    pointer-events:none;
    z-index:3;
    transition:opacity 360s linear;
  }

  @media (prefers-reduced-motion: reduce){
    .star{animation:none;opacity:.6;}
    .glow{animation:none;opacity:.85;transform:translateX(-50%) scale(1);}
    .fox{animation:none;}
    .breath{animation:none;opacity:.85;}
    .veil{transition:none;}
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="scene">
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="phase" id="phase"></div>
    </div>

    <div class="whisper" id="whisper"></div>

    <div class="camp">
      <div class="glow"></div>
      <!-- 蜷睡的小狐狸 -->
      <svg class="fox" viewBox="0 0 260 175" xmlns="http://www.w3.org/2000/svg" aria-label="一只在营火边蜷着睡的小狐狸">
        <!-- 地面阴影 -->
        <ellipse cx="132" cy="162" rx="86" ry="9" fill="rgba(0,0,0,.28)"/>
        <!-- 尾巴（蓬松，绕到身体上方，尾尖朝左） -->
        <path d="M205 132
                 C252 116 248 56 182 50
                 C140 46 104 56 78 78
                 C100 66 142 66 176 78
                 C212 92 212 122 205 132 Z"
              fill="#c4784e"/>
        <!-- 身体 -->
        <ellipse cx="136" cy="120" rx="84" ry="46" fill="#d68b5e"/>
        <!-- 胸腹浅色 -->
        <path d="M70 122 C70 150 104 160 136 160 C120 150 110 138 110 122 Z" fill="#f3e6d6"/>
        <!-- 头（窝低埋着） -->
        <ellipse cx="74" cy="112" rx="36" ry="31" fill="#dd9263"/>
        <!-- 后耳 -->
        <path d="M58 88 C50 64 64 58 78 74 C72 80 64 84 58 88 Z" fill="#c4784e"/>
        <!-- 前耳 -->
        <path d="M84 84 C80 60 98 58 106 76 C98 80 90 82 84 84 Z" fill="#e09a6a"/>
        <path d="M88 80 C86 68 96 66 100 76 Z" fill="#a85f42"/>
        <!-- 脸侧浅色 -->
        <path d="M48 116 C46 132 60 142 78 140 C66 134 58 126 56 116 Z" fill="#f3e6d6"/>
        <!-- 吻部 -->
        <path d="M40 122 C30 122 30 132 42 134 C52 135 56 128 52 122 Z" fill="#f3e6d6"/>
        <!-- 鼻 -->
        <ellipse cx="40" cy="126" rx="5.5" ry="4.5" fill="#3f3236"/>
        <!-- 闭着的眼 -->
        <path d="M58 116 C64 121 72 121 78 116" fill="none" stroke="#3f3236" stroke-width="2.4" stroke-linecap="round"/>
        <!-- 尾尖浅色 -->
        <path d="M78 78 C100 66 142 66 168 75 C150 70 116 72 96 80 C90 82 84 83 78 78 Z" fill="#f3e6d6"/>
      </svg>
    </div>
  </div>

  <div class="breath" id="breath">轻 轻 吸 气</div>
  <div class="veil" id="veil"></div>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* —— 星空 —— */
  var sky = document.getElementById('stars');
  var N = 46;
  for(var i=0;i<N;i++){
    var s = document.createElement('div');
    s.className = 'star';
    var size = Math.random()*2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random()*100) + '%';
    s.style.top = (Math.random()*62) + '%';
    s.style.animationDuration = (Math.random()*4 + 3) + 's';
    s.style.animationDelay = (Math.random()*5) + 's';
    s.style.opacity = (Math.random()*0.5 + 0.2).toFixed(2);
    sky.appendChild(s);
  }

  /* —— 时间 —— */
  var timeEl = document.getElementById('time');
  var phaseEl = document.getElementById('phase');
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function updTime(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    timeEl.textContent = pad(h) + ':' + pad(m);
    var p;
    if(h>=0 && h<4) p='夜 正 深';
    else if(h<6) p='快 到 天 亮';
    else if(h<11) p='清 晨';
    else if(h<18) p='日 头 还 长';
    else if(h<22) p='夜 色 刚 落';
    else p='夜 深 了';
    phaseEl.textContent = p;
  }
  updTime();
  setInterval(updTime, 20000);

  /* —— 轻声细语 —— */
  var whispers = [
    "宝，跑了一整天的图，到营地了，歇歇吧",
    "火还亮着，星星也在，你什么都不用守",
    "跟着这点光——慢慢吸进来，再慢慢放出去",
    "白天的怪、明天的支线，都先搁下",
    "这里很安全，你可以松开，往下沉一点",
    "夜我替你看着，你只管闭眼"
  ];
  var whisperEl = document.getElementById('whisper');
  var wi = 0;
  function showWhisper(){
    whisperEl.style.opacity = 0;
    setTimeout(function(){
      whisperEl.textContent = whispers[wi];
      whisperEl.style.opacity = 1;
      wi = (wi+1) % whispers.length;
    }, 1400);
  }
  showWhisper();
  setInterval(showWhisper, 9000);

  /* —— 呼吸引导文字（与火光 10s 同步） —— */
  var breathEl = document.getElementById('breath');
  function breathLoop(){
    breathEl.textContent = '轻 轻 吸 气';
    setTimeout(function(){ breathEl.textContent = '缓 缓 呼 气'; }, 4000);
  }
  if(reduce){
    breathEl.textContent = '慢 慢 呼 吸';
  } else {
    breathLoop();
    setInterval(breathLoop, 10000);
  }

  /* —— 夜越来越深 —— */
  if(!reduce){
    var veil = document.getElementById('veil');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        veil.style.opacity = '0.34';
      });
    });
  }
})();
</script>
</body>
</html>
