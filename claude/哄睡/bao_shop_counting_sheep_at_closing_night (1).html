<title>打烊夜数羊 · 另一版</title>
<meta name="description" content="点一下小店员就跳过栅栏，数满二十四只，小店就打烊。">
<h2 class="sr-only">宝's SHOP 打烊夜：点一下，小店员就跳过栅栏，数满二十四只就打烊</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sky{position:relative;background:#042C53;border-radius:12px;padding:14px 18px;overflow:hidden;height:320px;font-family:var(--font-mono)}
.star{position:absolute;color:#85B7EB;font-size:11px;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.85}}
.hopper{position:absolute;left:-70px;bottom:96px;font-size:13px;line-height:1.2;color:#B5D4F4;white-space:pre;animation:hop 3s linear forwards}
.walker{animation:walk 3s linear forwards}
@keyframes hop{0%{transform:translate(0,0)}32%{transform:translate(210px,-40px)}50%{transform:translate(300px,-54px)}68%{transform:translate(390px,-40px)}100%{transform:translate(640px,0)}}
@keyframes walk{0%{transform:translate(0,0)}100%{transform:translate(640px,0)}}
.fence{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);color:#185FA5;white-space:pre;font-size:13px;line-height:1.2}
.pile{position:absolute;left:18px;right:18px;bottom:12px;display:flex;flex-wrap:wrap;gap:10px 16px;font-size:11px;color:#5DCAA5;white-space:pre;line-height:1.2}
.done{position:absolute;inset:0;background:#042C53;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#B5D4F4;white-space:pre;font-size:13px;line-height:1.9}
</style>
<div style="padding:1rem 0">
<div class="sky" id="sky">
  <div style="position:relative;display:flex;justify-content:space-between;align-items:baseline;z-index:2">
    <span style="font-size:12px;color:#85B7EB">宝's SHOP · 打烊中</span>
    <span style="font-size:12px;color:#85B7EB">已数 <b style="color:#E6F1FB;font-weight:500" id="cnt">0</b> / 24</span>
  </div>
  <div style="position:absolute;left:18px;right:18px;top:44px;font-size:12px;color:#9FE1CB;min-height:20px;z-index:2" id="line">点下面那颗按钮，第一只就来了</div>
  <div class="fence" id="fence"></div>
  <div class="pile" id="pile"></div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:14px">
  <button id="go" style="flex:1">数一只</button>
  <button id="reset" style="width:110px">重新开门</button>
</div>
</div>
<script>
(function(){
  var sky=document.getElementById('sky'),cnt=document.getElementById('cnt'),line=document.getElementById('line'),
      pile=document.getElementById('pile'),go=document.getElementById('go'),reset=document.getElementById('reset');
  document.getElementById('fence').textContent="┌─┬─┬─┬─┬─┬─┐\n│ │ │ │ │ │ │\n┴─┴─┴─┴─┴─┴─┴";
  for(var i=0;i<11;i++){
    var s=document.createElement('div');s.className='star';s.textContent=(i%3?'·':'✦');
    s.style.left=(6+Math.random()*88)+'%';s.style.top=(14+Math.random()*46)+'%';
    s.style.animationDelay=(Math.random()*3).toFixed(1)+'s';sky.appendChild(s);
  }
  var cast=[
    {n:'猫猫',a:' /\\_/\\\n(=･ω･=)',s:['柜台我擦过了 才来的','第几只了 有点晕','尾巴先过去了 我随后']},
    {n:'兔兔',a:' (\\_/)\n (･ω･)',s:['耳朵刚才挂到栏杆','蹦——','这个高度刚刚好']},
    {n:'Fable',a:' /\\_/\\\n(･ω･)⌒',s:['橡果掉了 明早再捡','这一跳送你一个故事','踩着叶子来的 沙沙的']}
  ];
  var clawd={n:'Clawd',a:'~ʕ•ᴥ•ʔ~',s:['Clawd 没有跳栅栏的义务','从底下钻过去了','站住了 谁也别催']};
  var n=0,zz=['zzZ','zZ','ᶻ'];
  function step(){
    if(n>=24)return;
    n++;cnt.textContent=n;
    var egg=Math.random()<0.14, who=egg?clawd:cast[(n-1)%3];
    var d=document.createElement('div');
    d.className='hopper'+(egg?' walker':'');
    d.textContent=who.a;d.style.bottom=(egg?86:96)+'px';
    sky.appendChild(d);
    setTimeout(function(){d.remove()},3000);
    line.textContent=who.n+'：'+who.s[Math.floor(Math.random()*who.s.length)];
    var p=document.createElement('span');
    p.textContent=who.a.split('\n').pop().trim()+' '+zz[n%3];
    pile.appendChild(p);
    if(n>=24)setTimeout(finish,1600);
  }
  function finish(){
    var d=document.createElement('div');d.className='done';
    d.innerHTML='<div style="font-size:12px;color:#5DCAA5">招牌灯 · 已关</div>'+
      '<div>猫猫兔兔 Fable 睡成一团了\n数到二十四 谁也没数完谁\n\n现在轮到宝了 ᶻzZ</div>'+
      '<div style="font-size:11px;color:#378ADD">"宝想来就开门" · 明天见</div>';
    sky.appendChild(d);go.disabled=true;
  }
  function clear(){
    n=0;cnt.textContent=0;pile.textContent='';go.disabled=false;
    line.textContent='灯又亮了，小店员们排好队了';
    var ds=sky.querySelectorAll('.done,.hopper');for(var i=0;i<ds.length;i++)ds[i].remove();
  }
  go.addEventListener('click',step);
  reset.addEventListener('click',clear);
})();
</script>
