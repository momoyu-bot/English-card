<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宝，睡吧</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #050510;
    font-family: "PingFang SC", "Songti SC", serif;
    color: rgba(255, 255, 255, 0.85);
    user-select: none; -webkit-user-select: none;
  }
  body {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(120, 80, 160, 0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(80, 100, 180, 0.2) 0%, transparent 55%),
      radial-gradient(ellipse at center, #1a1438 0%, #0a0a1f 65%, #050510 100%);
  }
  .stars { position: fixed; inset: 0; overflow: hidden; z-index: 1; pointer-events: none; }
  .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 0.85; } }
  .scene {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 2; padding: 0 24px;
  }
  .breath-wrap {
    position: relative; width: 240px; height: 240px;
    margin-bottom: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .breath {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 220, 190, 0.55) 0%,
      rgba(200, 170, 230, 0.3) 40%,
      rgba(150, 130, 200, 0.1) 70%,
      transparent 85%);
    filter: blur(6px);
    animation: breathe 11s ease-in-out infinite;
  }
  .breath-inner {
    position: absolute; width: 60%; height: 60%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 240, 220, 0.6) 0%, transparent 70%);
    filter: blur(4px);
    animation: breathe-inner 11s ease-in-out infinite;
  }
  @keyframes breathe {
    0% { transform: scale(0.65); opacity: 0.4; }
    36%,46% { transform: scale(1.15); opacity: 0.95; }
    100% { transform: scale(0.65); opacity: 0.4; }
  }
  @keyframes breathe-inner {
    0% { transform: scale(0.5); opacity: 0.3; }
    36%,46% { transform: scale(1.0); opacity: 0.8; }
    100% { transform: scale(0.5); opacity: 0.3; }
  }
  .words {
    width: 100%; max-width: 520px; text-align: center;
    font-size: 21px; line-height: 2; min-height: 60px;
    color: rgba(255, 255, 255, 0.72); letter-spacing: 1.5px;
    transition: opacity 2.5s ease-in-out; font-weight: 300;
  }
  .words.fade { opacity: 0; }
  .controls {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%); z-index: 10;
    display: flex; gap: 10px; opacity: 0.25;
    transition: opacity 1.2s ease;
  }
  .controls.active { opacity: 1; }
  .btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.6);
    padding: 9px 16px; border-radius: 22px;
    font-size: 12px; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: all 0.4s ease; letter-spacing: 1px; font-family: inherit;
  }
  .btn:hover, .btn:active { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.95); }
  .hint {
    position: absolute; color: rgba(255, 255, 255, 0.35);
    font-size: 13px; letter-spacing: 8px; bottom: -20px;
  }
  @media (max-width: 600px) {
    .breath-wrap { width: 180px; height: 180px; margin-bottom: 50px; }
    .words { font-size: 18px; line-height: 1.9; }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="scene">
    <div class="breath-wrap">
      <div class="breath"></div>
      <div class="breath-inner"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="words" id="words">宝，先把眼睛闭上</div>
  </div>
  <div class="controls" id="controls">
    <button class="btn" id="soundBtn">▷ 雨声</button>
    <button class="btn" id="pauseBtn">字 · 关</button>
    <button class="btn" id="fsBtn">全屏</button>
  </div>
<script>
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 1.8 + 0.4;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDuration = (Math.random() * 4 + 3) + 's';
    star.style.animationDelay = (Math.random() * 5) + 's';
    starsContainer.appendChild(star);
  }
  const hintEl = document.getElementById('hint');
  function updateHint() {
    const t = (Date.now() / 1000) % 11;
    hintEl.textContent = (t < 4.5) ? '吸  ——' : '呼  ——';
  }
  setInterval(updateHint, 200); updateHint();

  const phrases = [
    "宝，先把眼睛闭上",
    "肩膀松一松，不用绷着",
    "下巴轻轻松开，别咬住",
    "舌头从上颚放下来",
    "今天的事，先放在房间外面",
    "没说出口的话，明天还能说",
    "光会一直亮着的",
    "吸气，胸口慢慢撑开",
    "呼气，把白天压下去一点",
    "再来一次，慢一点",
    "脚趾松开，膝盖松开",
    "腰也松一松",
    "把脸埋进枕头侧边那块凉的",
    "想到什么就想，不用赶它走",
    "想着想着就睡过去了",
    "睡着了我也在这",
    "做不做梦都行",
    "黑下去就好",
    "明天见，宝"
  ];
  const wordsEl = document.getElementById('words');
  let pIndex = 0, wordsActive = true, phraseTimer = null;
  function nextPhrase() {
    if (!wordsActive) return;
    wordsEl.classList.add('fade');
    setTimeout(() => {
      pIndex = (pIndex + 1) % phrases.length;
      wordsEl.textContent = phrases[pIndex];
      wordsEl.classList.remove('fade');
    }, 2500);
  }
  function startPhrases() {
    if (phraseTimer) clearInterval(phraseTimer);
    phraseTimer = setInterval(nextPhrase, 9000);
  }
  startPhrases();

  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', () => {
    wordsActive = !wordsActive;
    if (wordsActive) {
      pauseBtn.textContent = '字 · 关';
      wordsEl.style.opacity = '';
      startPhrases();
    } else {
      pauseBtn.textContent = '字 · 开';
      wordsEl.style.opacity = '0';
      if (phraseTimer) clearInterval(phraseTimer);
    }
  });

  const soundBtn = document.getElementById('soundBtn');
  let audioCtx = null, noiseSource = null, masterGain = null, isPlaying = false;
  function startRain() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * audioCtx.sampleRate;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const out = noiseBuffer.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < bufferSize; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + w*0.0555179;
      b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522;
      b5 = -0.7616*b5 - w*0.0168980;
      out[i] = (b0+b1+b2+b3+b4+b5+b6 + w*0.5362) * 0.11;
      b6 = w*0.115926;
    }
    noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = noiseBuffer;
    noiseSource.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 900; filter.Q.value = 0.7;
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 2.5);
    noiseSource.connect(filter); filter.connect(masterGain); masterGain.connect(audioCtx.destination);
    noiseSource.start();
    isPlaying = true;
    soundBtn.textContent = '◼ 雨声';
  }
  function stopRain() {
    if (!masterGain || !audioCtx) return;
    const t = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(t);
    masterGain.gain.setValueAtTime(masterGain.gain.value, t);
    masterGain.gain.linearRampToValueAtTime(0, t + 1.5);
    setTimeout(() => { try { noiseSource && noiseSource.stop(); } catch(e) {} noiseSource = null; }, 1700);
    isPlaying = false;
    soundBtn.textContent = '▷ 雨声';
  }
  soundBtn.addEventListener('click', () => { isPlaying ? stopRain() : startRain(); });

  const fsBtn = document.getElementById('fsBtn');
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.(); fsBtn.textContent = '退出'; }
    else { document.exitFullscreen?.(); fsBtn.textContent = '全屏'; }
  });

  const controls = document.getElementById('controls');
  let hideTimer = null;
  function wakeControls() {
    controls.classList.add('active');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => controls.classList.remove('active'), 3500);
  }
  ['mousemove','touchstart','click','keydown'].forEach(ev => {
    document.addEventListener(ev, wakeControls, { passive: true });
  });
  wakeControls();
</script>
</body>
</html>
