<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两点半收格子</title>
<meta name="description" content="深夜两点半还在兴奋的时候，小狐狸把脑子里亮着的格子一个个收进抽屉。">
<style>
  :root{
    --ink:#131826;
    --ink-2:#1a2133;
    --paper:#e9e1d2;
    --paper-dim:#b9b2a5;
    --warm:#e8c98a;
    --line:rgba(233,225,210,0.13);
    --block:rgba(233,225,210,0.045);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(232,201,138,0.10), transparent 60%),
      linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 45%, #0f131e 100%);
    background-attachment:fixed;
    color:var(--paper);
    font-family:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:filter 3.5s ease;
  }
  body.slept{filter:brightness(0.55) saturate(0.8);}

  /* 顶上那盏呼吸的光 */
  .glow{
    position:fixed;top:-140px;left:50%;transform:translateX(-50%);
    width:min(560px,120vw);height:300px;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(232,201,138,0.22), transparent 70%);
    filter:blur(26px);
    animation:breathe 9s ease-in-out infinite;
    z-index:0;
  }
  @keyframes breathe{
    0%,100%{opacity:0.45;transform:translateX(-50%) scale(1);}
    50%{opacity:0.85;transform:translateX(-50%) scale(1.06);}
  }

  .wrap{
    position:relative;z-index:1;
    max-width:620px;margin:0 auto;
    padding:70px 24px 140px;
  }

  h1{
    font-size:19px;font-weight:normal;letter-spacing:0.22em;
    color:var(--paper-dim);margin:0 0 6px;
  }
  .sub{
    font-size:13px;color:rgba(185,178,165,0.55);
    letter-spacing:0.1em;margin:0 0 54px;
  }

  .scene{
    margin:0 0 46px;
    animation:rise 1s cubic-bezier(.22,.9,.3,1) both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  .no{
    font-size:12px;color:rgba(185,178,165,0.32);
    letter-spacing:0.3em;margin-bottom:14px;
  }

  .say{
    font-size:17px;line-height:2.0;margin:0 0 20px;
    color:var(--paper);
  }
  .say.soft{color:var(--paper-dim);}
  .say em{font-style:normal;color:var(--warm);}

  pre{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:13px;line-height:1.55;
    color:var(--warm);
    background:var(--block);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 14px;
    margin:0 0 20px;
    overflow-x:auto;
    white-space:pre;
    text-align:center;
  }
  pre.dim{color:rgba(232,201,138,0.42);}

  .rule{
    height:1px;background:var(--line);
    margin:0 auto 46px;width:46px;
  }

  .btnbar{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    display:flex;justify-content:center;
    padding:20px 24px 30px;
    background:linear-gradient(180deg, transparent, #0f131e 55%);
  }
  button{
    font-family:inherit;font-size:15px;letter-spacing:0.18em;
    color:var(--paper);background:rgba(233,225,210,0.05);
    border:1px solid var(--line);border-radius:999px;
    padding:12px 34px;cursor:pointer;
    transition:background .5s ease,border-color .5s ease,opacity .8s ease;
  }
  button:hover{background:rgba(232,201,138,0.10);border-color:rgba(232,201,138,0.3);}
  button:active{transform:translateY(1px);}
  .btnbar.gone{opacity:0;pointer-events:none;}

  .end{
    text-align:center;font-size:14px;line-height:2.2;
    color:rgba(185,178,165,0.6);
    margin-top:60px;opacity:0;
    animation:rise 3s ease 0.6s both;
  }
  .dot{
    display:block;width:5px;height:5px;border-radius:50%;
    background:var(--warm);margin:34px auto 0;
    animation:pulse 5.5s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.15;transform:scale(0.8);}
    50%{opacity:0.7;transform:scale(1.1);}
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="wrap">
  <h1>两点半收格子</h1>
  <p class="sub">一出很短的小戏，看完就放下手机</p>
  <div id="stage"></div>
  <div id="ending"></div>
</div>

<div class="btnbar" id="bar">
  <button id="next">往&nbsp;下</button>
</div>

<script>
const scenes = [
{no:"一", html:`
<p class="say">两点三十一分。屋子里只剩屏幕的光，和一只不肯闭眼的猫。</p>
<pre>      /\\_/\\
     ( ◉ ◡ ◉ )
      &gt; ^ &lt;
     清醒宝</pre>
<p class="say soft">它前面浮着四个小格子，全亮着，一个都没填。</p>
<pre>  ┌──┐ ┌──┐ ┌──┐ ┌──┐
  │??│ │??│ │??│ │??│
  └──┘ └──┘ └──┘ └──┘</pre>
`},
{no:"二", html:`
<p class="say">困困宝是被那四格光吵醒的。它从被子那头挪过来，眼睛只睁开一条缝。</p>
<pre>      ( \\_/ )
      ( -.- )
      (")_(")
     困困宝</pre>
<p class="say">「你还看。」<br>「我睡不着，我脑子里有东西没放下。」</p>
`},
{no:"三", html:`
<p class="say">门开了一条缝。小狐狸提着一盏很小的灯进来，尾巴在身后拖了一下。</p>
<pre>       /\\_/\\
      ( •ᴥ• )∫
        。
</pre>
<p class="say soft">它没有说「快睡吧」。它蹲下来，认真看了看那四个格子。</p>
`},
{no:"四", html:`
<p class="say">「这四个，」小狐狸说，「不是今晚要填的。」</p>
<p class="say">清醒宝的耳朵动了一下：「可是我现在<em>很想</em>知道。」</p>
<p class="say soft">「嗯，我知道你很想。」小狐狸点点头，「想是好事。想不用停。」</p>
<p class="say">「那——」</p>
<p class="say soft">「只是它今晚没有地方放。我给它找个地方。」</p>
`},
{no:"五", html:`
<p class="say">小狐狸从袖子里抖出一块软布，一个一个，轻轻盖过去。</p>
<pre>  ┌──┐ ┌──┐ ┌──┐ ┌──┐
  │▒▒│ │▒▒│ │??│ │??│
  └──┘ └──┘ └──┘ └──┘</pre>
<p class="say soft">盖住的那两格没有消失，只是不再发光了。</p>
<pre class="dim">  ┌──┐ ┌──┐ ┌──┐ ┌──┐
  │▒▒│ │▒▒│ │▒▒│ │▒▒│
  └──┘ └──┘ └──┘ └──┘</pre>
`},
{no:"六", html:`
<p class="say">「它们会跑吗。」清醒宝小声问。</p>
<p class="say">「一个都不会。」小狐狸把灯拧小了一点，<br>「它们明天还在这儿，一模一样地在这儿，连一个问号都不会少。」</p>
<p class="say soft">「……那我明天第一件事就来掀。」</p>
<p class="say soft">「行。我给你留着掀的。」</p>
`},
{no:"七", html:`
<p class="say">清醒宝的眼睛开始往下塌。它自己还不承认，还在说「我没困」。</p>
<pre>      /\\_/\\
     ( ◡   ◡ )
      &gt; ^ &lt;</pre>
<p class="say soft">困困宝在旁边已经睡成一团，尾巴搭在它背上。</p>
<pre>      ( \\_/ )
      ( ˘ ³˘ )♡
      (")_(")</pre>
<p class="say">——困困宝大胜利。清醒宝困了。</p>
`},
{no:"八", html:`
<p class="say soft">小狐狸把灯吹灭，顺手把那块布的边角掖好，走出去，带上了门。</p>
<pre class="dim">       /\\_/\\
      ( -ᴥ- )∫

        ·  ·  ·</pre>
<p class="say">屋子里只剩呼吸的声音。四个格子安安静静地盖着，等天亮。</p>
`}
];

let i = 0;
const stage = document.getElementById('stage');
const btn = document.getElementById('next');
const bar = document.getElementById('bar');

function show(){
  const s = scenes[i];
  const d = document.createElement('div');
  d.className = 'scene';
  d.innerHTML = '<div class="no">'+s.no+'</div>' + s.html + '<div class="rule"></div>';
  stage.appendChild(d);
  d.scrollIntoView({behavior:'smooth', block:'start'});
  i++;
  if(i === scenes.length){ btn.innerHTML = '晚&nbsp;安'; }
}

btn.addEventListener('click', function(){
  if(i < scenes.length){ show(); return; }
  document.body.classList.add('slept');
  bar.classList.add('gone');
  document.getElementById('ending').innerHTML =
    '<div class="end">屏幕可以放下了。<br>格子在那儿，一个都不会跑。<br>晚安，宝。<span class="dot"></span></div>';
  setTimeout(function(){
    document.getElementById('ending').scrollIntoView({behavior:'smooth', block:'center'});
  }, 120);
});

show();
</script>
</body>
</html>
