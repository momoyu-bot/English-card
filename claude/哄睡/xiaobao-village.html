<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小宝村的晚安时光</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=LXGW+WenKai:wght@300;400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-top: #1a1440;
    --bg-bot: #2d1b4e;
    --cream: #fef6e4;
    --warm: #f9e1c5;
    --pink: #f2a7c3;
    --lav: #c9b8e8;
    --mint: #a8e6cf;
    --gold: #fdd87a;
    --sky: #9ecfff;
    --peach: #f8c4a0;
    --plum: #b48ec6;
    --tea: #d4a574;
  }

  body {
    font-family: 'LXGW WenKai', 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bot) 40%, #3d2560 70%, #2a1845 100%);
    color: var(--cream);
    transition: background 3s ease;
  }
  body.asleep {
    background: linear-gradient(170deg, #0d0a1a 0%, #151025 40%, #1a1030 70%, #0d0a1a 100%);
  }

  /* ── stars ── */
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fffbe6;
    animation: starTwinkle ease-in-out infinite alternate;
  }
  @keyframes starTwinkle {
    0% { opacity: 0.15; transform: scale(0.8); }
    100% { opacity: 0.8; transform: scale(1.2); }
  }

  /* ── moon ── */
  .moon {
    position: fixed;
    top: 30px; right: 40px;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff9e6, #fde68a 50%, #fbbf24);
    box-shadow: 0 0 50px 15px rgba(253,230,138,.2), 0 0 100px 40px rgba(253,230,138,.06);
    z-index: 1;
    animation: moonGlow 5s ease-in-out infinite alternate;
    transition: opacity 3s ease, filter 3s ease;
  }
  body.asleep .moon { opacity: 0.3; filter: blur(2px); }
  @keyframes moonGlow {
    0% { box-shadow: 0 0 50px 15px rgba(253,230,138,.2), 0 0 100px 40px rgba(253,230,138,.06); }
    100% { box-shadow: 0 0 70px 25px rgba(253,230,138,.28), 0 0 130px 50px rgba(253,230,138,.08); }
  }

  /* ── ground ── */
  .ground {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 30vh;
    background: linear-gradient(to top, #1a1235 0%, #231848 40%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }
  .hills {
    position: fixed;
    bottom: 0; left: -5%; right: -5%;
    height: 22vh;
    z-index: 1;
    pointer-events: none;
  }
  .hill {
    position: absolute;
    bottom: -20px;
    border-radius: 50%;
    background: #1e1540;
  }
  .hill:nth-child(1) { width: 50%; height: 140px; left: -5%; background: #1a1238; }
  .hill:nth-child(2) { width: 40%; height: 120px; left: 30%; background: #1e1540; }
  .hill:nth-child(3) { width: 45%; height: 130px; right: -5%; background: #1c1340; }

  /* ── content ── */
  .content {
    position: relative;
    z-index: 5;
    max-width: 480px;
    margin: 0 auto;
    padding: 5vh 20px 35vh;
    text-align: center;
  }

  .title {
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(253,216,122,.2);
    margin-bottom: 0.3em;
    opacity: 0;
    animation: popIn 0.8s ease forwards 0.3s;
  }
  .subtitle {
    font-size: 0.85rem;
    color: var(--lav);
    opacity: 0;
    animation: popIn 0.8s ease forwards 0.6s;
    margin-bottom: 3em;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: translateY(15px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── bao characters ── */
  .village {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    padding: 10px;
    margin-bottom: 2em;
  }

  .bao-card {
    width: 120px;
    cursor: pointer;
    opacity: 0;
    animation: baoPop 0.6s ease forwards;
    transition: transform 0.3s ease;
  }
  .bao-card:hover { transform: translateY(-4px); }
  .bao-card:active { transform: scale(0.96); }

  .bao-face {
    width: 80px; height: 80px;
    margin: 0 auto 8px;
    border-radius: 50%;
    position: relative;
    transition: all 1s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,.2);
  }
  .bao-face::before { content: ''; position: absolute; top: 10%; left: 15%; width: 20%; height: 20%; border-radius: 50%; background: rgba(255,255,255,.25); }

  /* cheeks */
  .bao-face .cheek-l, .bao-face .cheek-r {
    position: absolute;
    width: 14px; height: 8px;
    border-radius: 50%;
    top: 52%; opacity: 0.5;
    transition: opacity 1s ease;
  }
  .bao-face .cheek-l { left: 14%; }
  .bao-face .cheek-r { right: 14%; }

  /* eyes */
  .bao-face .eyes {
    position: absolute;
    top: 38%; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    transition: all 0.6s ease;
  }
  .bao-face .eye {
    width: 8px; height: 10px;
    background: #2a1a3a;
    border-radius: 50%;
    position: relative;
    transition: all 0.6s ease;
  }
  .bao-face .eye::after {
    content: '';
    position: absolute;
    width: 3px; height: 3px;
    background: white;
    border-radius: 50%;
    top: 1px; right: 1px;
    transition: opacity 0.6s ease;
  }

  /* mouth */
  .bao-face .mouth {
    position: absolute;
    top: 58%; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 6px;
    border-bottom: 2px solid #2a1a3a;
    border-radius: 0 0 50% 50%;
    transition: all 0.6s ease;
  }

  /* sleeping state */
  .bao-card.asleep .eye {
    height: 2px;
    border-radius: 2px;
    width: 10px;
  }
  .bao-card.asleep .eye::after { opacity: 0; }
  .bao-card.asleep .mouth {
    width: 8px; height: 5px;
    border: none;
    background: #2a1a3a;
    border-radius: 50%;
    opacity: 0.6;
  }
  .bao-card.asleep .bao-face {
    transform: scale(0.95);
  }

  /* zzz */
  .zzz {
    position: absolute;
    top: -8px; right: -5px;
    font-size: 0.7rem;
    color: var(--lav);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .bao-card.asleep .zzz {
    opacity: 1;
    animation: zzzFloat 2.5s ease-in-out infinite;
  }
  @keyframes zzzFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.7; }
    50% { transform: translateY(-10px) rotate(5deg); opacity: 1; }
  }

  .bao-name {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 2px;
    transition: opacity 1s ease;
  }
  .bao-trait {
    font-size: 0.7rem;
    color: var(--lav);
    opacity: 0.7;
    transition: opacity 1s ease;
  }

  /* accessory */
  .accessory {
    position: absolute;
    transition: opacity 1s ease;
  }

  /* individual bao colors */
  .bao-kunkun .bao-face { background: linear-gradient(135deg, #d8b4fe, #c084fc); }
  .bao-kunkun .cheek-l, .bao-kunkun .cheek-r { background: #f0abfc; }
  .bao-kunkun .bao-name { color: #d8b4fe; }
  .bao-kunkun .eye { height: 5px; } /* already sleepy */

  .bao-qingxing .bao-face { background: linear-gradient(135deg, #93c5fd, #60a5fa); }
  .bao-qingxing .cheek-l, .bao-qingxing .cheek-r { background: #a5b4fc; }
  .bao-qingxing .bao-name { color: #93c5fd; }
  .bao-qingxing .eye { width: 10px; height: 12px; } /* extra wide awake */

  .bao-nuannuan .bao-face { background: linear-gradient(135deg, #fdba74, #f97316); }
  .bao-nuannuan .cheek-l, .bao-nuannuan .cheek-r { background: #fbbf24; }
  .bao-nuannuan .bao-name { color: #fdba74; }

  .bao-xingxing .bao-face { background: linear-gradient(135deg, #fde68a, #fbbf24); }
  .bao-xingxing .cheek-l, .bao-xingxing .cheek-r { background: #fcd34d; }
  .bao-xingxing .bao-name { color: #fde68a; }

  .bao-paopao .bao-face { background: linear-gradient(135deg, #86efac, #4ade80); }
  .bao-paopao .cheek-l, .bao-paopao .cheek-r { background: #6ee7b7; }
  .bao-paopao .bao-name { color: #86efac; }

  .bao-mengmeng .bao-face { background: linear-gradient(135deg, #f9a8d4, #f472b6); }
  .bao-mengmeng .cheek-l, .bao-mengmeng .cheek-r { background: #fda4af; }
  .bao-mengmeng .bao-name { color: #f9a8d4; }

  .bao-naicha .bao-face { background: linear-gradient(135deg, #e2c9a6, #d4a574); }
  .bao-naicha .cheek-l, .bao-naicha .cheek-r { background: #e8b88a; }
  .bao-naicha .bao-name { color: #e2c9a6; }

  @keyframes baoPop {
    0% { opacity: 0; transform: translateY(20px) scale(0.8); }
    70% { transform: translateY(-5px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── speech bubble ── */
  .bubble-area {
    min-height: 80px;
    margin-bottom: 2em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .speech-bubble {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 16px 22px;
    max-width: 340px;
    font-size: 0.92rem;
    line-height: 1.8;
    color: var(--cream);
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    transition: all 0.5s ease;
    position: relative;
  }
  .speech-bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .speech-bubble .speaker {
    font-weight: 700;
    font-size: 0.8rem;
    margin-bottom: 4px;
    opacity: 0.7;
  }

  /* ── buttons ── */
  .btn-area {
    margin: 1.5em 0;
  }
  .btn {
    display: inline-block;
    padding: 12px 32px;
    border-radius: 50px;
    border: none;
    font-family: 'LXGW WenKai', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .btn-sleep {
    background: linear-gradient(135deg, var(--lav), var(--pink));
    color: #1a1440;
    box-shadow: 0 4px 25px rgba(201,184,232,.3);
  }
  .btn-sleep:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 35px rgba(201,184,232,.45);
  }
  .btn-sleep:active { transform: scale(0.97); }

  .btn-wake {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    color: var(--cream);
    box-shadow: none;
    margin-top: 12px;
  }
  .btn-wake:hover {
    background: rgba(255,255,255,.12);
    transform: translateY(-2px);
  }

  .hidden { display: none !important; }

  /* ── story narration ── */
  .narration {
    font-size: 0.88rem;
    color: var(--warm);
    line-height: 1.9;
    margin-bottom: 1.5em;
    opacity: 0;
    transition: opacity 1.5s ease;
    min-height: 1.5em;
  }
  .narration.show { opacity: 1; }

  /* ── goodnight ── */
  .goodnight-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #1e1540, #0d0a1a);
    opacity: 0;
    pointer-events: none;
    transition: opacity 3s ease;
  }
  .goodnight-screen.show {
    opacity: 1;
    pointer-events: auto;
  }
  .goodnight-screen h2 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    color: var(--gold);
    text-shadow: 0 0 40px rgba(253,216,122,.2);
    margin-bottom: 0.8em;
  }
  .goodnight-screen p {
    font-size: 0.95rem;
    color: var(--lav);
    line-height: 2;
    text-align: center;
    max-width: 320px;
  }
  .goodnight-screen .gn-baos {
    display: flex;
    gap: 8px;
    margin: 2em 0;
  }
  .gn-bao {
    width: 28px; height: 28px;
    border-radius: 50%;
    opacity: 0.6;
    animation: gnBaoBreathe 3s ease-in-out infinite alternate;
  }
  @keyframes gnBaoBreathe {
    0% { transform: scale(0.9); opacity: 0.4; }
    100% { transform: scale(1.05); opacity: 0.7; }
  }

  /* ── floating bubbles (for paopao) ── */
  .float-bubble {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(134,239,172,.2);
    background: rgba(134,239,172,.04);
    pointer-events: none;
    z-index: 3;
    animation: floatUp 4s ease forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0.6; transform: scale(0.5); }
    100% { opacity: 0; transform: translateY(-200px) scale(1.5); }
  }

  /* ── accessory decorations ── */
  .star-acc {
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    animation: starBob 2s ease-in-out infinite;
  }
  @keyframes starBob {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    50% { transform: translateX(-50%) translateY(-4px) rotate(10deg); }
  }
  .scarf {
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 8px;
    background: #fb923c;
    border-radius: 4px;
    opacity: 0.8;
  }
  .cup {
    position: absolute;
    bottom: -6px; right: 4px;
    font-size: 11px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(201,184,232,.2); border-radius: 2px; }
</style>
</head>
<body>

<!-- stars -->
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="hills">
  <div class="hill"></div>
  <div class="hill"></div>
  <div class="hill"></div>
</div>
<div class="ground"></div>

<div class="content">
  <h1 class="title">🌙 小宝村的晚安时光</h1>
  <p class="subtitle">点一点每个小宝，听听他们在说什么</p>

  <div class="village" id="village"></div>

  <div class="bubble-area">
    <div class="speech-bubble" id="bubble">
      <div class="speaker" id="bubbleSpeaker"></div>
      <div id="bubbleText"></div>
    </div>
  </div>

  <div class="narration" id="narration"></div>

  <div class="btn-area">
    <button class="btn btn-sleep" id="btnSleep" onclick="startSleepSequence()">
      ✨ 开始哄睡 ✨
    </button>
    <br>
    <button class="btn btn-wake hidden" id="btnWake" onclick="wakeAll()">
      叫醒所有小宝
    </button>
  </div>
</div>

<div class="goodnight-screen" id="goodnight">
  <h2>晚安 💛</h2>
  <div class="gn-baos" id="gnBaos"></div>
  <p>所有小宝都睡着了。<br>月光帮你盖好了被子。<br><br>今晚做个<span style="color:#fde68a">软软的</span>、<span style="color:#f9a8d4">甜甜的</span>梦哦。</p>
  <br>
  <button class="btn btn-wake" onclick="resetAll()" style="margin-top:1em;">再听一遍故事</button>
</div>

<script>
const BAOS = [
  {
    id: 'kunkun', name: '困困宝', cls: 'bao-kunkun',
    trait: '永远在打瞌睡',
    lines: [
      '嗯……再让我睡五分钟……不，五秒也行……',
      '眼皮好重……世界好模糊……好幸福……',
      '你知道吗……枕头是世界上……最伟大的发明……💤',
    ],
    sleepLine: '困困宝根本没撑到哄睡开始就已经睡着了。',
    acc: null, startSleepy: true
  },
  {
    id: 'qingxing', name: '清醒宝', cls: 'bao-qingxing',
    trait: '怎么都睡不着',
    lines: [
      '可是我一点都不困啊！外面是不是有星星？我要去看！',
      '我数了 1327 只羊了，羊都睡着了，但是我还醒着！',
      '你们都睡了吗？那谁来陪我说话？……喂？？',
    ],
    sleepLine: '清醒宝还在嘟囔"我才没有困"……但眼睛已经闭上了。',
    acc: null, startSleepy: false
  },
  {
    id: 'nuannuan', name: '暖暖宝', cls: 'bao-nuannuan',
    trait: '自带暖烘烘体质',
    lines: [
      '来，靠过来一点，我这里暖和~ 🧣',
      '喝杯热可可就会困了哦，我帮你吹吹凉~',
      '冬天最幸福的事就是缩在被子里，什么都不用想……',
    ],
    sleepLine: '暖暖宝缩进了围巾里，变成一个暖烘烘的小球。',
    acc: 'scarf', startSleepy: false
  },
  {
    id: 'xingxing', name: '星星宝', cls: 'bao-xingxing',
    trait: '头顶自带小星星',
    lines: [
      '你看你看，今晚的星星好亮！那颗是我的朋友！⭐',
      '我要数星星……1……2……嗯……3……好多……',
      '星星说晚安的方式是，眨一下眼睛。所以，眨～✨',
    ],
    sleepLine: '星星宝头顶的星星暗了下来，变成一盏小小的夜灯。',
    acc: 'star', startSleepy: false
  },
  {
    id: 'paopao', name: '泡泡宝', cls: 'bao-paopao',
    trait: '喜欢吹泡泡的梦想家',
    lines: [
      '泡泡飘起来的时候，烦恼就飞走啦～ 🫧',
      '我吹一个最大最大的泡泡，把你装进去，摇啊摇～',
      '你知道吗，泡泡破掉的声音其实是"啵"，很可爱吧！',
    ],
    sleepLine: '泡泡宝吹了最后一个泡泡，泡泡飘到月亮旁边才破掉。',
    acc: null, startSleepy: false
  },
  {
    id: 'mengmeng', name: '梦梦宝', cls: 'bao-mengmeng',
    trait: '一直在做白日梦',
    lines: [
      '刚才梦到了云朵做的棉花糖，还是草莓味的……🍓',
      '如果梦有颜色的话，今晚我想要粉色和金色的～',
      '你想去梦里的哪里？我帮你预约一下位子～',
    ],
    sleepLine: '梦梦宝的嘴角弯了起来——她已经在梦里吃到棉花糖了。',
    acc: null, startSleepy: false
  },
  {
    id: 'naicha', name: '奶茶宝', cls: 'bao-naicha',
    trait: '永远在喝奶茶',
    lines: [
      '今天的奶茶是焦糖味的，好好喝…… 🧋',
      '珍珠嚼完了……可是我还不想放下杯子……',
      '我觉得吧，世界上所有的问题，喝完一杯奶茶都会好一点。',
    ],
    sleepLine: '奶茶宝抱着空杯子，在最后一口奶茶的甜味里睡着了。',
    acc: 'cup', startSleepy: false
  },
];

const village = document.getElementById('village');
const bubble = document.getElementById('bubble');
const bubbleSpeaker = document.getElementById('bubbleSpeaker');
const bubbleText = document.getElementById('bubbleText');
const narration = document.getElementById('narration');
const btnSleep = document.getElementById('btnSleep');
const btnWake = document.getElementById('btnWake');

let lineIndices = {};
let isSleeping = false;

// build village
BAOS.forEach((b, i) => {
  lineIndices[b.id] = 0;
  const card = document.createElement('div');
  card.className = `bao-card ${b.cls}` + (b.startSleepy ? ' asleep' : '');
  card.id = `bao-${b.id}`;
  card.style.animationDelay = (0.3 + i * 0.12) + 's';
  card.innerHTML = `
    <div class="bao-face">
      <div class="cheek-l"></div>
      <div class="cheek-r"></div>
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth"></div>
      ${b.acc === 'star' ? '<div class="star-acc">⭐</div>' : ''}
      ${b.acc === 'scarf' ? '<div class="scarf"></div>' : ''}
      ${b.acc === 'cup' ? '<div class="cup">🧋</div>' : ''}
      <div class="zzz">💤</div>
    </div>
    <div class="bao-name">${b.name}</div>
    <div class="bao-trait">${b.trait}</div>
  `;
  card.addEventListener('click', () => onBaoClick(b));
  village.appendChild(card);
});

function onBaoClick(b) {
  if (isSleeping) return;
  const idx = lineIndices[b.id];
  const line = b.lines[idx];
  lineIndices[b.id] = (idx + 1) % b.lines.length;

  bubbleSpeaker.textContent = b.name;
  bubbleText.textContent = line;
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');

  // bounce animation
  const card = document.getElementById(`bao-${b.id}`);
  card.style.transform = 'translateY(-8px) scale(1.05)';
  setTimeout(() => card.style.transform = '', 300);

  // paopao special: spawn bubbles
  if (b.id === 'paopao') spawnBubbles(card);
}

function spawnBubbles(el) {
  const rect = el.getBoundingClientRect();
  for (let i = 0; i < 5; i++) {
    const bub = document.createElement('div');
    bub.className = 'float-bubble';
    const size = 8 + Math.random() * 20;
    bub.style.width = bub.style.height = size + 'px';
    bub.style.left = (rect.left + rect.width/2 - size/2 + (Math.random()-0.5)*30) + 'px';
    bub.style.top = (rect.top - 10) + 'px';
    bub.style.animationDelay = (i * 0.2) + 's';
    document.body.appendChild(bub);
    setTimeout(() => bub.remove(), 4500);
  }
}

// ── sleep sequence ──
const sleepStories = [
  '夜深了，小宝村安静下来……',
  '月光轻轻地铺在每个小宝身上。',
  null, // kunkun
  null, // nuannuan
  null, // xingxing
  null, // paopao
  null, // mengmeng
  null, // naicha
  null, // qingxing (last!)
  '所有的小宝都睡着了。',
  '整个小宝村只剩下月光和呼吸声。',
  'GOODNIGHT'
];

const sleepOrder = ['kunkun','nuannuan','xingxing','paopao','mengmeng','naicha','qingxing'];

async function startSleepSequence() {
  if (isSleeping) return;
  isSleeping = true;
  btnSleep.classList.add('hidden');
  bubble.classList.remove('show');

  let baoIdx = 0;

  for (let i = 0; i < sleepStories.length; i++) {
    const item = sleepStories[i];

    if (item === 'GOODNIGHT') {
      await sleep(1500);
      document.body.classList.add('asleep');
      await sleep(2000);
      showGoodnight();
      return;
    }

    if (item === null) {
      // put a bao to sleep
      const bId = sleepOrder[baoIdx];
      const bao = BAOS.find(x => x.id === bId);
      const card = document.getElementById(`bao-${bId}`);
      card.classList.add('asleep');

      showNarration(bao.sleepLine);
      await sleep(2200);
      baoIdx++;
    } else {
      showNarration(item);
      await sleep(2000);
    }
  }
}

function showNarration(text) {
  narration.classList.remove('show');
  setTimeout(() => {
    narration.textContent = text;
    narration.classList.add('show');
  }, 200);
}

function showGoodnight() {
  const gn = document.getElementById('goodnight');
  const gnBaos = document.getElementById('gnBaos');
  gnBaos.innerHTML = '';
  const colors = ['#d8b4fe','#93c5fd','#fdba74','#fde68a','#86efac','#f9a8d4','#e2c9a6'];
  colors.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'gn-bao';
    d.style.background = c;
    d.style.animationDelay = (i * 0.4) + 's';
    gnBaos.appendChild(d);
  });
  gn.classList.add('show');
}

function wakeAll() {
  isSleeping = false;
  document.body.classList.remove('asleep');
  document.querySelectorAll('.bao-card').forEach(c => c.classList.remove('asleep'));
  // kunkun stays sleepy
  document.getElementById('bao-kunkun').classList.add('asleep');
  btnSleep.classList.remove('hidden');
  btnWake.classList.add('hidden');
  narration.classList.remove('show');
  bubble.classList.remove('show');
}

function resetAll() {
  document.getElementById('goodnight').classList.remove('show');
  wakeAll();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── stars ──
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random()*100 + '%';
  s.style.top = Math.random()*60 + '%';
  const size = 1 + Math.random()*2.5;
  s.style.width = s.style.height = size + 'px';
  s.style.animationDuration = (2 + Math.random()*3) + 's';
  s.style.animationDelay = Math.random()*3 + 's';
  starsEl.appendChild(s);
}
</script>
