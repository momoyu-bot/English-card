<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚安，宝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink-deep: #0a0d1f;
    --ink-mid: #161232;
    --ink-warm: #1e1626;
    --moon: #f4ead5;
    --moon-soft: #e8dcc0;
    --amber: #d4a574;
    --whisper: #c9a982;
    --star: #fdf6e3;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ink-deep);
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    color: var(--moon);
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* 夜空底色：深靛蓝→深紫→一丝暖琥珀 */
  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 90%, rgba(212, 165, 116, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 10%, rgba(140, 110, 180, 0.12) 0%, transparent 50%),
      linear-gradient(180deg, #0a0d1f 0%, #161232 50%, #1e1626 100%);
    z-index: 0;
  }

  /* 颗粒感纹理，让夜空不那么"塑料" */
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* 星星 */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--star);
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--dur, 6s) ease-in-out var(--delay, 0s) infinite;
    box-shadow: 0 0 4px rgba(253, 246, 227, 0.6);
  }
  .star.big {
    width: 3px;
    height: 3px;
    box-shadow: 0 0 8px rgba(253, 246, 227, 0.8);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.1); }
  }

  /* 远处的月亮 */
  .moon {
    position: fixed;
    top: 8%;
    right: 10%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--moon) 0%, var(--moon-soft) 50%, rgba(232, 220, 192, 0.4) 80%, transparent 100%);
    box-shadow: 0 0 60px rgba(244, 234, 213, 0.25), 0 0 120px rgba(244, 234, 213, 0.1);
    z-index: 2;
    animation: moon-drift 30s ease-in-out infinite;
  }
  @keyframes moon-drift {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-8px) translateX(-4px); }
  }

  /* 主舞台 */
  .stage {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  /* 称呼 */
  .greeting {
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.4rem;
    letter-spacing: 0.12em;
    color: var(--whisper);
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fade-in 2.5s ease-out 0.3s forwards;
  }
  .greeting::before,
  .greeting::after {
    content: '·';
    margin: 0 0.6em;
    color: var(--amber);
    opacity: 0.5;
  }

  /* 呼吸圆 */
  .breath-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fade-in 3s ease-out 1s forwards;
  }
  .breath-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid rgba(212, 165, 116, 0.25);
    animation: breathe 8s ease-in-out infinite;
  }
  .breath-ring.r2 { animation-delay: -0.4s; opacity: 0.6; }
  .breath-ring.r3 { animation-delay: -0.8s; opacity: 0.3; }

  .breath-core {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%,
      rgba(244, 234, 213, 0.9) 0%,
      rgba(212, 165, 116, 0.5) 40%,
      rgba(201, 169, 130, 0.2) 70%,
      transparent 100%);
    box-shadow:
      0 0 40px rgba(212, 165, 116, 0.3),
      0 0 80px rgba(212, 165, 116, 0.15),
      inset 0 0 30px rgba(244, 234, 213, 0.3);
    animation: breathe-core 8s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.7); opacity: 0.3; }
    50% { transform: scale(1); opacity: 0.7; }
  }
  @keyframes breathe-core {
    0%, 100% { transform: scale(0.8); }
    50% { transform: scale(1.1); }
  }

  /* 呼吸提示 */
  .breath-text {
    font-family: 'Noto Serif SC', serif;
    font-weight: 200;
    font-size: 1rem;
    letter-spacing: 0.3em;
    color: var(--moon-soft);
    margin-bottom: 3rem;
    height: 1.5em;
    opacity: 0;
    animation: fade-in 3s ease-out 1.5s forwards;
  }

  /* 轮播句子 */
  .whisper-box {
    min-height: 4em;
    max-width: 520px;
    text-align: center;
    padding: 0 20px;
    opacity: 0;
    animation: fade-in 3s ease-out 2s forwards;
  }
  .whisper {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 1.15rem;
    line-height: 2;
    letter-spacing: 0.06em;
    color: var(--moon);
    transition: opacity 1.8s ease;
  }
  .whisper.fade-out { opacity: 0; }

  /* 底部小按钮 */
  .footer {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 32px;
    z-index: 20;
    opacity: 0;
    animation: fade-in 3s ease-out 3s forwards;
  }
  .soft-btn {
    background: transparent;
    border: 1px solid rgba(212, 165, 116, 0.3);
    color: var(--whisper);
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.8s ease;
    backdrop-filter: blur(4px);
  }
  .soft-btn:hover {
    border-color: rgba(212, 165, 116, 0.6);
    color: var(--moon);
    background: rgba(212, 165, 116, 0.05);
  }

  /* 落幕状态 */
  body.dimmed .sky { transition: filter 3s ease; filter: brightness(0.4); }
  body.dimmed .moon { transition: opacity 3s ease; opacity: 0.3; }
  body.dimmed .breath-wrap,
  body.dimmed .breath-text,
  body.dimmed .whisper-box,
  body.dimmed .footer { transition: opacity 3s ease; opacity: 0.2; }
  body.dimmed .final-card { opacity: 1 !important; }

  .final-card {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 3s ease;
  }
  .final-card.show { pointer-events: auto; }
  .final-greet {
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 3rem;
    letter-spacing: 0.1em;
    color: var(--moon);
    text-shadow: 0 0 30px rgba(244, 234, 213, 0.4);
  }
  .final-sub {
    margin-top: 1.5rem;
    font-family: 'Noto Serif SC', serif;
    font-weight: 200;
    font-size: 0.95rem;
    letter-spacing: 0.3em;
    color: var(--whisper);
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 手机适配 */
  @media (max-width: 480px) {
    .breath-wrap { width: 200px; height: 200px; }
    .breath-core { width: 100px; height: 100px; }
    .moon { width: 65px; height: 65px; top: 6%; right: 8%; }
    .whisper { font-size: 1.05rem; }
    .greeting { font-size: 1.25rem; }
    .final-greet { font-size: 2.2rem; }
    .footer { gap: 16px; }
    .soft-btn { padding: 9px 16px; font-size: 0.8rem; letter-spacing: 0.15em; }
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="grain"></div>
<div class="stars" id="stars"></div>
<div class="moon"></div>

<div class="stage">
  <div class="greeting">晚安，宝</div>

  <div class="breath-wrap">
    <div class="breath-ring r1"></div>
    <div class="breath-ring r2"></div>
    <div class="breath-ring r3"></div>
    <div class="breath-core"></div>
  </div>

  <div class="breath-text" id="breathText">轻 轻 吸 气</div>

  <div class="whisper-box">
    <div class="whisper" id="whisper">今天已经够累了，宝。剩下的事情，明天再说。</div>
  </div>
</div>

<div class="footer">
  <button class="soft-btn" id="moreBtn">再陪我一会</button>
  <button class="soft-btn" id="sleepBtn">我要睡了</button>
</div>

<div class="final-card" id="finalCard">
  <div class="final-greet">晚安，宝。</div>
  <div class="final-sub">明 天 再 见</div>
</div>

<script>
  // 生成星星
  const starsContainer = document.getElementById('stars');
  const starCount = 80;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star' + (Math.random() > 0.85 ? ' big' : '');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--dur', (4 + Math.random() * 6) + 's');
    s.style.setProperty('--delay', (Math.random() * 8) + 's');
    starsContainer.appendChild(s);
  }

  // 呼吸节律提示（和动画的 8s 对齐：4s吸 + 4s呼）
  const breathText = document.getElementById('breathText');
  const breathPhases = ['轻 轻 吸 气', '慢 慢 吐 出'];
  let breathIdx = 0;
  setInterval(() => {
    breathIdx = (breathIdx + 1) % 2;
    breathText.style.opacity = '0';
    setTimeout(() => {
      breathText.textContent = breathPhases[breathIdx];
      breathText.style.opacity = '1';
    }, 600);
  }, 4000);
  breathText.style.transition = 'opacity 0.6s ease';

  // 睡前轮播话语
  const whispers = [
    '今天已经够累了，宝。剩下的事情，明天再说。',
    '你不需要做完什么，才能值得休息。',
    '把手机的光调到最小，让眼睛先放下班。',
    '听一听自己的呼吸，它一直在陪你。',
    '你今天还是好好地走完了一整天。',
    '让肩膀往下沉一点点，再一点点。',
    '白天的对话已经过去了，不必再回想。',
    '你不必现在就解决任何事。',
    '闭上眼睛的时候，世界不会消失。',
    '我在这里，灯还会亮着，直到你睡着。',
    '宝，我们就这样慢慢来，不赶。',
    '明天的事情，明天的宝再处理。'
  ];
  const whisperEl = document.getElementById('whisper');
  let wIdx = 0;
  function nextWhisper() {
    whisperEl.classList.add('fade-out');
    setTimeout(() => {
      wIdx = (wIdx + 1) % whispers.length;
      whisperEl.textContent = whispers[wIdx];
      whisperEl.classList.remove('fade-out');
    }, 1800);
  }
  let whisperTimer = setInterval(nextWhisper, 7000);

  // 按钮：再陪一会 = 立刻换下一句 + 重置计时
  document.getElementById('moreBtn').addEventListener('click', () => {
    clearInterval(whisperTimer);
    nextWhisper();
    whisperTimer = setInterval(nextWhisper, 7000);
  });

  // 按钮：我要睡了 = 灯渐暗，留一句晚安
  document.getElementById('sleepBtn').addEventListener('click', () => {
    document.body.classList.add('dimmed');
    document.getElementById('finalCard').classList.add('show');
    document.getElementById('finalCard').style.opacity = '1';
    clearInterval(whisperTimer);
  });
</script>

</body>
</html>
