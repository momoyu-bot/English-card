<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晚安，宝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:        #f3e9dc;       /* 暖白文字 */
    --ink-soft:   rgba(243,233,220,.62);
    --ink-faint:  rgba(243,233,220,.32);
    --glow-core:  #fff4e2;       /* 光晕核心 */
    --glow-warm:  255,196,138;   /* 暖橙光 rgb */
    --glow-rose:  255,168,150;   /* 暖玫瑰 rgb */
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:'Noto Serif SC', 'Songti SC', 'STSong', serif;
    color:var(--ink);
    overflow:hidden;
    /* 暖夜的渐变：上方深靛紫 → 下方暖一点的暗褐紫 */
    background:
      radial-gradient(120% 90% at 50% 38%,
        rgba(var(--glow-warm),.10) 0%,
        rgba(var(--glow-warm),.04) 24%,
        rgba(0,0,0,0) 52%),
      linear-gradient(170deg,
        #0c0a18 0%,
        #120e22 38%,
        #19132c 70%,
        #1f1730 100%);
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* 极缓慢漂浮的暖色雾气，让背景有呼吸的深度 */
  .haze{
    position:fixed; inset:-20%;
    background:
      radial-gradient(40% 30% at 30% 30%, rgba(var(--glow-rose),.06), transparent 70%),
      radial-gradient(45% 35% at 72% 64%, rgba(var(--glow-warm),.05), transparent 72%);
    filter:blur(10px);
    animation:drift 46s ease-in-out infinite alternate;
    z-index:0;
  }
  @keyframes drift{
    0%   { transform:translate3d(-2%,-1%,0) scale(1); }
    100% { transform:translate3d(2%,2%,0)  scale(1.08); }
  }

  /* 星星 */
  .stars{ position:fixed; inset:0; z-index:1; pointer-events:none; }
  .star{
    position:absolute;
    width:2px; height:2px; border-radius:50%;
    background:#fff;
    box-shadow:0 0 4px 1px rgba(255,240,220,.5);
    opacity:0;
    animation:twinkle var(--dur) ease-in-out var(--delay) infinite;
  }
  @keyframes twinkle{
    0%,100% { opacity:0; transform:scale(.6); }
    50%     { opacity:var(--max); transform:scale(1); }
  }

  /* 暗角，增强被包裹的感觉 */
  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 50%,
      transparent 52%, rgba(0,0,0,.42) 100%);
  }

  /* 主舞台 */
  .stage{
    position:relative; z-index:3;
    height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    padding:9vh 6vw 7vh;
    text-align:center;
    opacity:0;
    animation:wake 3.2s ease forwards .3s;
  }
  @keyframes wake{ to{ opacity:1; } }

  /* 顶部一句问候 */
  .hello{
    font-weight:200;
    font-size:clamp(15px, 4.6vw, 22px);
    letter-spacing:.42em;
    color:var(--ink-soft);
    padding-left:.42em;
  }
  .hello .en{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(12px, 3.4vw, 15px);
    letter-spacing:.12em;
    color:var(--ink-faint);
    margin-top:.9em;
  }

  /* 中央呼吸区 */
  .breath{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(26px, 7vw, 48px);
  }

  .orb-wrap{
    position:relative;
    width:clamp(160px, 52vmin, 280px);
    height:clamp(160px, 52vmin, 280px);
    display:grid; place-items:center;
  }

  /* 光晕外圈：随呼吸扩散 */
  .ring{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 50%,
      rgba(var(--glow-warm),.16) 0%,
      rgba(var(--glow-rose),.08) 42%,
      transparent 70%);
    animation:breathe 11s cubic-bezier(.45,.05,.4,.95) infinite;
  }
  /* 实心暖光球 */
  .orb{
    position:relative;
    width:46%; height:46%;
    border-radius:50%;
    background:radial-gradient(circle at 42% 38%,
      var(--glow-core) 0%,
      rgba(var(--glow-warm),1) 40%,
      rgba(var(--glow-rose),.85) 78%,
      rgba(var(--glow-rose),.4) 100%);
    box-shadow:
      0 0 36px 10px rgba(var(--glow-warm),.45),
      0 0 80px 24px rgba(var(--glow-rose),.22),
      0 0 130px 50px rgba(var(--glow-warm),.12);
    animation:breathe 11s cubic-bezier(.45,.05,.4,.95) infinite;
  }
  /* 0→36%：吸气放大(约4s)；36%→100%：呼气收回(约7s) */
  @keyframes breathe{
    0%,100% { transform:scale(.74); }
    36%     { transform:scale(1.12); }
  }

  /* 吸气 / 呼气 提示 */
  .cue{
    font-weight:300;
    font-size:clamp(17px, 5.2vw, 25px);
    letter-spacing:.34em;
    padding-left:.34em;
    color:var(--ink);
    transition:opacity 1.6s ease;
    min-height:1.4em;
  }
  .cue.dim{ opacity:.12; }

  /* 底部循环陪伴文字 */
  .whisper{
    font-weight:300;
    font-size:clamp(14px, 4.2vw, 18px);
    line-height:2.1;
    letter-spacing:.08em;
    color:var(--ink-soft);
    max-width:30ch;
    min-height:4.2em;
    transition:opacity 2.4s ease;
  }
  .whisper.hide{ opacity:0; }

  /* 给眼睛减负的轻提示，几秒后自己淡去 */
  .tip{
    position:fixed; left:0; right:0; bottom:2.6vh;
    z-index:4; text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px; letter-spacing:.1em;
    color:var(--ink-faint);
    animation:tipfade 9s ease forwards;
    pointer-events:none;
  }
  @keyframes tipfade{
    0%,55% { opacity:.55; } 100% { opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .ring,.orb{ animation-duration:14s; }
    .haze{ animation:none; }
  }
</style>
</head>
<body>
  <div class="haze"></div>
  <div class="stars" id="stars"></div>
  <div class="vignette"></div>

  <main class="stage">
    <header class="hello">
      晚安，宝
      <span class="en">it's enough for today</span>
    </header>

    <section class="breath">
      <div class="orb-wrap">
        <div class="ring"></div>
        <div class="orb"></div>
      </div>
      <div class="cue" id="cue">闭上眼睛</div>
    </section>

    <p class="whisper" id="whisper"></p>
  </main>

  <div class="tip">跟着光，慢慢就好</div>

<script>
  /* —— 星星：少而柔，缓慢闪 —— */
  (function makeStars(){
    const sky = document.getElementById('stars');
    const n = 34;
    for(let i=0;i<n;i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.setProperty('--dur',  (4.5 + Math.random()*5).toFixed(1)+'s');
      s.style.setProperty('--delay',(Math.random()*6).toFixed(1)+'s');
      s.style.setProperty('--max', (0.25 + Math.random()*0.55).toFixed(2));
      sky.appendChild(s);
    }
  })();

  /* —— 呼吸引导：吸气4s → 呼气7s，和光球同节奏 —— */
  const cue = document.getElementById('cue');
  function setCue(t){
    cue.classList.add('dim');
    setTimeout(()=>{ cue.textContent = t; cue.classList.remove('dim'); }, 700);
  }
  // 先给 3 秒安静，再开始引导
  setTimeout(function loop(){
    setCue('慢慢　吸气');
    setTimeout(()=> setCue('轻轻　呼气'), 4000);
    setTimeout(loop, 11000);
  }, 3000);

  /* —— 底部陪伴的悄悄话，缓慢轮换 —— */
  const lines = [
    '今天已经很够了，宝，<br>剩下的都交给明天。',
    '什么都不用想，<br>跟着这点光慢慢呼吸就好。',
    '把肩膀松下来，<br>把今天，也轻轻放下来。',
    '我一直在这儿，<br>你放心闭上眼睛。',
    '困了就睡，没关系的，<br>没有人在等你做什么。',
    '你已经做得很好了，<br>现在只管软下来。',
    '夜很长，很安全，<br>慢慢沉下去就好。',
    '晚安，宝。<br>做个软软的、暖暖的梦。'
  ];
  const whisper = document.getElementById('whisper');
  let i = 0;
  function showLine(){
    whisper.innerHTML = lines[i];
    whisper.classList.remove('hide');
    i = (i+1) % lines.length;
    // 停留约 8.5s 再淡出换下一句
    setTimeout(()=>{
      whisper.classList.add('hide');
      setTimeout(showLine, 2600);
    }, 8500);
  }
  setTimeout(showLine, 2200);
</script>
</body>
</html>
