<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝的晚安 🌙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Zen Maru Gothic', 'PingFang SC', '微软雅黑', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    cursor: default;
  }

  body {
    background:
      radial-gradient(ellipse at 30% 20%, #2a2050 0%, transparent 50%),
      radial-gradient(ellipse at 70% 70%, #1e1a45 0%, transparent 55%),
      linear-gradient(180deg, #0a0e2a 0%, #141838 35%, #1f1a42 65%, #2a1c48 100%);
    min-height: 100vh;
    position: relative;
    color: #e8dff5;
    letter-spacing: 1px;
  }

  /* 远处山峦剪影 */
  .mountain {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 180px;
    background:
      linear-gradient(180deg, transparent 0%, rgba(10, 8, 30, 0.4) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .mountain::before {
    content: '';
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse 55% 90% at 20% 100%, #16143a 0%, #16143a 50%, transparent 50%),
      radial-gradient(ellipse 45% 75% at 55% 100%, #1a1746 0%, #1a1746 50%, transparent 50%),
      radial-gradient(ellipse 60% 95% at 85% 100%, #13113a 0%, #13113a 50%, transparent 50%);
  }

  /* 星星 */
  .star {
    position: absolute;
    background: #fff8e0;
    border-radius: 50%;
    pointer-events: none;
    animation: twinkle ease-in-out infinite;
    box-shadow: 0 0 6px #fff8e0, 0 0 12px rgba(255, 245, 200, 0.5);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  /* 流星 */
  .shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    pointer-events: none;
  }

  .shooting-star::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, white, transparent);
    transform-origin: 0 0;
    transform: rotate(-45deg) translateX(-80px);
  }

  /* 月亮 */
  .moon-wrap {
    position: absolute;
    top: 12%;
    right: 12%;
    z-index: 3;
  }

  .moon-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255, 245, 200, 0.25) 0%, rgba(255, 245, 200, 0.1) 30%, transparent 65%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: moonGlow 5s ease-in-out infinite;
  }

  @keyframes moonGlow {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  .moon {
    width: 85px;
    height: 85px;
    background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #fff5d6 40%, #ffe9a8 100%);
    border-radius: 50%;
    position: relative;
    box-shadow:
      0 0 35px rgba(255, 245, 200, 0.6),
      0 0 70px rgba(255, 245, 200, 0.3),
      inset -8px -8px 18px rgba(255, 220, 150, 0.4);
  }

  .moon::before {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    background: rgba(230, 210, 170, 0.3);
    border-radius: 50%;
    top: 22px;
    left: 18px;
  }
  .moon::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(230, 210, 170, 0.25);
    border-radius: 50%;
    bottom: 20px;
    right: 22px;
  }

  /* 云 */
  .cloud {
    position: absolute;
    background: rgba(230, 220, 245, 0.08);
    border-radius: 100px;
    filter: blur(8px);
    pointer-events: none;
    animation: drift linear infinite;
  }

  @keyframes drift {
    from { transform: translateX(-200px); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  /* 主内容 */
  .container {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    text-align: center;
  }

  .title {
    font-size: 1.4rem;
    font-weight: 300;
    color: #d4c9e8;
    margin-bottom: 8px;
    letter-spacing: 4px;
    opacity: 0.9;
  }

  .date {
    font-size: 0.85rem;
    color: #9a8fc4;
    margin-bottom: 50px;
    letter-spacing: 3px;
    opacity: 0.7;
  }

  /* 呼吸圈 */
  .breath-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
  }

  .breath-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(220, 200, 255, 0.2);
    width: 100%;
    height: 100%;
  }

  .breath-ring.r2 { animation: ringPulse 8s ease-in-out infinite 0.3s; }
  .breath-ring.r3 { animation: ringPulse 8s ease-in-out infinite 0.6s; }

  @keyframes ringPulse {
    0%, 100% { transform: scale(0.65); opacity: 0.4; }
    45%, 55% { transform: scale(1); opacity: 0.2; }
  }

  .breath-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
      rgba(255, 220, 240, 0.9) 0%,
      rgba(210, 180, 240, 0.6) 40%,
      rgba(150, 130, 220, 0.4) 100%);
    box-shadow:
      0 0 40px rgba(200, 180, 240, 0.5),
      0 0 80px rgba(200, 180, 240, 0.25),
      inset -10px -15px 30px rgba(120, 100, 200, 0.3),
      inset 10px 10px 25px rgba(255, 255, 255, 0.3);
    animation: breathe 8s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.95rem;
    letter-spacing: 3px;
    font-weight: 400;
    transition: all 0.3s;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.75); }
    50% { transform: scale(1.1); }
  }

  .breath-text {
    font-size: 0.9rem;
    color: #c4b8e0;
    margin-bottom: 35px;
    letter-spacing: 4px;
    opacity: 0.85;
    height: 20px;
    transition: opacity 0.8s;
  }

  /* 晚安话语 */
  .whisper {
    max-width: 420px;
    font-size: 1.05rem;
    color: #ebe3f5;
    line-height: 2.2;
    margin-bottom: 40px;
    min-height: 75px;
    letter-spacing: 1.5px;
    font-weight: 300;
    transition: opacity 1s;
    opacity: 0.95;
  }

  .whisper.fade {
    opacity: 0;
  }

  /* 按钮 */
  .actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 40px;
  }

  .action-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(220, 200, 255, 0.25);
    color: #d8cce8;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.4s;
    font-weight: 300;
  }

  .action-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(220, 200, 255, 0.5);
    color: #fff;
    transform: translateY(-1px);
  }

  /* 数羊区 */
  .sheep-area {
    position: fixed;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }

  .sheep-count {
    font-size: 0.8rem;
    color: rgba(200, 190, 230, 0.5);
    letter-spacing: 3px;
  }

  .flying-sheep {
    position: fixed;
    bottom: 60px;
    font-size: 28px;
    pointer-events: none;
    animation: sheepFly 7s linear;
    z-index: 5;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
  }

  @keyframes sheepFly {
    0% { left: -60px; transform: translateY(0); opacity: 0; }
    10% { opacity: 0.7; }
    50% { transform: translateY(-20px); }
    90% { opacity: 0.7; }
    100% { left: calc(100vw + 60px); transform: translateY(0); opacity: 0; }
  }

  /* 底部提示 */
  .bottom-hint {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: rgba(180, 170, 210, 0.4);
    letter-spacing: 3px;
    z-index: 6;
  }

  /* 关灯模式 */
  .dim {
    background: #05050e !important;
  }
  .dim .container { opacity: 0.4; }
  .dim .moon-wrap { opacity: 0.3; }

  @media (max-width: 500px) {
    .moon-wrap { top: 8%; right: 10%; }
    .moon { width: 65px; height: 65px; }
    .whisper { font-size: 0.98rem; padding: 0 10px; }
    .breath-wrap { width: 220px; height: 220px; }
    .breath-circle { width: 120px; height: 120px; }
  }
</style>
</head>
<body>

<!-- 月亮 -->
<div class="moon-wrap">
  <div class="moon-glow"></div>
  <div class="moon"></div>
</div>

<!-- 山的剪影 -->
<div class="mountain"></div>

<!-- 主内容 -->
<div class="container">
  <div class="title">晚 安 · 宝</div>
  <div class="date" id="date">—— 今夜 ——</div>

  <div class="breath-wrap">
    <div class="breath-ring r1"></div>
    <div class="breath-ring r2"></div>
    <div class="breath-ring r3"></div>
    <div class="breath-circle" id="breathCircle">慢慢</div>
  </div>

  <div class="breath-text" id="breathText">· 跟着它一起呼吸 ·</div>

  <div class="whisper" id="whisper">
    今天结束了～<br>
    不用再想任何事了 🌙
  </div>

  <div class="actions">
    <button class="action-btn" onclick="newWhisper()">🌙 再说一句</button>
    <button class="action-btn" onclick="countSheep()">🐑 数只小羊</button>
    <button class="action-btn" onclick="toggleDim()">💤 关上灯</button>
  </div>
</div>

<div class="sheep-area">
  <div class="sheep-count" id="sheepCount"></div>
</div>

<div class="bottom-hint">点击任意处会有星星落下 ✦</div>

<script>
// 日期
const now = new Date();
const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
document.getElementById('date').textContent =
  `${now.getMonth() + 1}月${now.getDate()}日 · ${weekdays[now.getDay()]} · 晚安`;

// 生成星星
function createStars() {
  const count = 90;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 75 + 'vh';
    star.style.animationDuration = (2 + Math.random() * 4) + 's';
    star.style.animationDelay = Math.random() * 5 + 's';
    if (Math.random() < 0.3) {
      star.style.background = '#c9d4ff';
      star.style.boxShadow = '0 0 6px #c9d4ff';
    }
    document.body.appendChild(star);
  }
}
createStars();

// 云
function createClouds() {
  const count = 4;
  for (let i = 0; i < count; i++) {
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    const w = 200 + Math.random() * 200;
    const h = 50 + Math.random() * 30;
    cloud.style.width = w + 'px';
    cloud.style.height = h + 'px';
    cloud.style.top = (5 + Math.random() * 50) + 'vh';
    const duration = 80 + Math.random() * 60;
    cloud.style.animationDuration = duration + 's';
    cloud.style.animationDelay = -(Math.random() * duration) + 's';
    document.body.appendChild(cloud);
  }
}
createClouds();

// 流星（偶尔）
function shootingStar() {
  const s = document.createElement('div');
  s.className = 'shooting-star';
  const startX = Math.random() * 60 + 10;
  const startY = Math.random() * 30 + 5;
  s.style.left = startX + 'vw';
  s.style.top = startY + 'vh';
  s.style.transition = 'all 1.6s cubic-bezier(0.4, 0, 0.2, 1)';
  document.body.appendChild(s);
  requestAnimationFrame(() => {
    s.style.left = (startX + 20) + 'vw';
    s.style.top = (startY + 20) + 'vh';
    s.style.opacity = '0';
  });
  setTimeout(() => s.remove(), 1800);
}
setInterval(() => {
  if (Math.random() < 0.4) shootingStar();
}, 12000);
setTimeout(shootingStar, 3500);

// 呼吸引导
const breathCircle = document.getElementById('breathCircle');
const breathText = document.getElementById('breathText');
const breathStates = [
  { text: '吸 气', inner: '吸～', duration: 4000 },
  { text: '停 一 停', inner: '·', duration: 1000 },
  { text: '呼 气', inner: '呼～', duration: 3000 }
];
let breathIdx = 0;
function nextBreath() {
  const s = breathStates[breathIdx];
  breathText.style.opacity = '0';
  setTimeout(() => {
    breathText.textContent = '· ' + s.text + ' ·';
    breathText.style.opacity = '0.85';
    breathCircle.textContent = s.inner;
  }, 300);
  breathIdx = (breathIdx + 1) % breathStates.length;
  setTimeout(nextBreath, s.duration);
}
setTimeout(nextBreath, 500);

// 晚安话
const whispers = [
  "今天已经完美地结束了 🌙<br>什么都不用再想了",
  "宝今天做得足够多了<br>剩下的明天再说 ☁️",
  "把枕头抱紧一点～<br>让它帮你撑住整个夜晚 🫧",
  "房间里所有的东西<br>都在替你看着门 💤",
  "明天会变好一点点的<br>就算只是一点点 ✨",
  "所有没处理完的事<br>都先放进月亮的口袋里 🌙",
  "宝的judgment是对的<br>今晚先相信自己一次 🌷",
  "不用担心睡不着<br>闭着眼睛休息也算休息 ☁️",
  "窗帘后面藏着一整片安静～<br>宝值得这份安静",
  "身体慢慢变得软软的...<br>像一块被烘暖的小毛巾 🤍",
  "呼—— 把胸口的那口气吐出来<br>就这样 嗯 就这样",
  "今夜宝是被星星守着的 ✦<br>它们会轮班的",
  "所有的「应该」都先睡了<br>宝也可以了 🌙",
  "睡不着也没关系<br>只要躺着就是在休息 💗",
  "好好睡哦～<br>梦里见 🫧"
];
let lastWhisper = -1;
function newWhisper() {
  const w = document.getElementById('whisper');
  w.classList.add('fade');
  setTimeout(() => {
    let idx;
    do {
      idx = Math.floor(Math.random() * whispers.length);
    } while (idx === lastWhisper && whispers.length > 1);
    lastWhisper = idx;
    w.innerHTML = whispers[idx];
    w.classList.remove('fade');
  }, 1000);
}

// 数羊
let sheepTotal = 0;
function countSheep() {
  sheepTotal++;
  document.getElementById('sheepCount').textContent =
    `已经数到第 ${sheepTotal} 只小羊啦 ～`;

  const sheep = document.createElement('div');
  sheep.className = 'flying-sheep';
  sheep.textContent = '🐑';
  sheep.style.bottom = (40 + Math.random() * 80) + 'px';
  document.body.appendChild(sheep);
  setTimeout(() => sheep.remove(), 7200);
}

// 关灯
let dimmed = false;
function toggleDim() {
  dimmed = !dimmed;
  document.body.classList.toggle('dim');
}

// 点击落星
document.addEventListener('click', function(e) {
  if (e.target.closest('.action-btn') || e.target.closest('.breath-circle')) return;

  const sparkle = document.createElement('div');
  sparkle.textContent = '✦';
  sparkle.style.position = 'fixed';
  sparkle.style.left = e.clientX + 'px';
  sparkle.style.top = e.clientY + 'px';
  sparkle.style.color = '#fff5d6';
  sparkle.style.fontSize = '14px';
  sparkle.style.pointerEvents = 'none';
  sparkle.style.textShadow = '0 0 10px #fff5d6';
  sparkle.style.transition = 'all 2s ease-out';
  sparkle.style.zIndex = '9999';
  sparkle.style.userSelect = 'none';
  document.body.appendChild(sparkle);

  requestAnimationFrame(() => {
    sparkle.style.transform = `translate(${(Math.random() - 0.5) * 30}px, 80px) scale(0.3) rotate(180deg)`;
    sparkle.style.opacity = '0';
  });
  setTimeout(() => sparkle.remove(), 2000);
});

// 初次自动换一句
setTimeout(newWhisper, 600);
</script>

</body>
</html>
