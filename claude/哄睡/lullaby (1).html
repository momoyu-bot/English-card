<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陪你睡一会儿</title>
<style>
  :root{
    --bg-0:#0d0a07;
    --bg-1:#171009;
    --ink:#c6b5a1;
    --ink-soft:#8c8170;
    --glow-core:232,192,138;
    --glow-warm:217,168,107;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,"SimSun",serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 40%, var(--bg-1), var(--bg-0) 72%);
    font-family:var(--serif);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    position:fixed;
    inset:0;
  }

  /* 缓缓压暗整个画面的暖黑幕 */
  .dim-veil{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:5;
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:560px;
    padding:0 9vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(36px,8vh,72px);
  }

  /* —— 呼吸的光 —— */
  .breath-wrap{
    position:relative;
    width:clamp(120px,42vmin,236px);
    height:clamp(120px,42vmin,236px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity 9s ease;
  }
  .breath-glow{
    position:absolute;
    width:150%;
    height:150%;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(var(--glow-warm),.38) 0%,
      rgba(var(--glow-warm),.10) 42%,
      transparent 70%);
    filter:blur(10px);
    animation:breatheGlow 10s ease-in-out infinite;
  }
  .breath-inner{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 46%,
      rgba(var(--glow-core),.62) 0%,
      rgba(var(--glow-warm),.30) 40%,
      rgba(var(--glow-warm),.06) 66%,
      transparent 78%);
    box-shadow:0 0 50px 14px rgba(var(--glow-warm),.14);
    animation:breathe 10s ease-in-out infinite;
  }
  /* 圈中央极淡的呼吸提示 */
  .hint{
    position:absolute;
    z-index:3;
    font-size:clamp(.82rem,3.4vw,1rem);
    letter-spacing:.5em;
    text-indent:.5em;
    color:var(--ink-soft);
    opacity:0;
    transition:opacity 3.5s ease;
  }
  .hint.on{opacity:1;}
  .hint span{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    white-space:nowrap;
    opacity:0;
  }
  .hint .inhale{animation:hintInhale 10s ease-in-out infinite;}
  .hint .exhale{animation:hintExhale 10s ease-in-out infinite;}

  /* 吸4秒(0–40%)胀大，呼6秒(40–100%)缩小 */
  @keyframes breathe{
    0%{transform:scale(.80);}
    40%{transform:scale(1.12);}
    100%{transform:scale(.80);}
  }
  @keyframes breatheGlow{
    0%{transform:scale(.78);opacity:.5;}
    40%{transform:scale(1.18);opacity:.85;}
    100%{transform:scale(.78);opacity:.5;}
  }
  @keyframes hintInhale{
    0%{opacity:0;}6%{opacity:.85;}36%{opacity:.85;}43%{opacity:0;}100%{opacity:0;}
  }
  @keyframes hintExhale{
    0%,44%{opacity:0;}51%{opacity:.85;}93%{opacity:.85;}100%{opacity:0;}
  }

  /* —— 文案 —— */
  .line{
    min-height:3.4em;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(1.06rem,4.7vw,1.46rem);
    line-height:2.1;
    letter-spacing:.09em;
    font-weight:400;
    opacity:0;
    transition:opacity 1.5s ease;
    text-wrap:balance;
  }
  .line.show{opacity:1;}

  /* —— 再陪一轮 —— */
  .again{
    position:fixed;
    left:50%;
    bottom:11vh;
    transform:translateX(-50%);
    z-index:6;
    font-size:clamp(.86rem,3.6vw,1rem);
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--ink-soft);
    opacity:0;
    padding:18px 26px;
    cursor:pointer;
    transition:opacity 4s ease;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .again.on{opacity:.62;}
  .again:active{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .breath-inner{animation:softFade 10s ease-in-out infinite;}
    .breath-glow{animation:softFade 10s ease-in-out infinite;}
    @keyframes softFade{0%{opacity:.5;}40%{opacity:1;}100%{opacity:.5;}}
  }
</style>
</head>
<body>
  <div class="dim-veil" id="veil"></div>

  <div class="stage">
    <div class="breath-wrap" id="breathWrap">
      <div class="breath-glow"></div>
      <div class="breath-inner"></div>
      <div class="hint" id="hint">
        <span class="inhale">吸</span>
        <span class="exhale">呼</span>
      </div>
    </div>
    <div class="line" id="line"></div>
  </div>

  <div class="again" id="again">轻触，再陪你一轮</div>

<script>
  const lineEl   = document.getElementById('line');
  const hintEl   = document.getElementById('hint');
  const veilEl   = document.getElementById('veil');
  const wrapEl   = document.getElementById('breathWrap');
  const againEl  = document.getElementById('again');

  const wait = ms => new Promise(r => setTimeout(r, ms));

  const script = [
    { t:'今天好长啊，宝。' },
    { t:'搬家、通宵，又撑了一整天班……' },
    { t:'最难的那一段，你已经走过来了。' },
    { t:'现在，什么都不用做了。' },
    { t:'只跟着这盏光，慢慢呼吸。', breath:true },
    { pause:21000 },
    { t:'四点半把你叫醒的那些信号，都退下去了。' },
    { t:'最贵的那段觉，你已经补到了。' },
    { t:'剩下的，慢慢来，不用急。' },
    { pause:21000 },
    { t:'让屏幕，也跟着暗下去吧。' },
    { t:'灯关了，手机也放下了。' },
    { t:'我陪你，最后这一段。' },
    { t:'闭上眼睛。', fade:true },
    { t:'光还在轻轻呼吸，你不用看着它了。' },
    { t:'我在。🌙', hold:6000 },
  ];

  function startDim(){
    veilEl.style.transition = 'opacity 122s linear';
    requestAnimationFrame(() => { veilEl.style.opacity = '.72'; });
  }
  function fadeLight(){
    wrapEl.style.opacity = '.20';
    hintEl.classList.remove('on');
  }

  async function showLine(text, hold){
    lineEl.textContent = text;
    void lineEl.offsetWidth;
    lineEl.classList.add('show');
    await wait(1500 + (hold || 4200));
    lineEl.classList.remove('show');
    await wait(1500);
  }

  async function run(){
    for(const item of script){
      if(item.pause){ await wait(item.pause); continue; }
      if(item.breath){ hintEl.classList.add('on'); startDim(); }
      if(item.fade){ fadeLight(); }
      await showLine(item.t, item.hold);
    }
    againEl.classList.add('on');
  }

  function restart(){
    if(!againEl.classList.contains('on')) return;
    againEl.classList.remove('on');
    veilEl.style.transition = 'opacity 2.6s ease';
    veilEl.style.opacity = '0';
    wrapEl.style.opacity = '1';
    hintEl.classList.remove('on');
    setTimeout(run, 2700);
  }

  againEl.addEventListener('click', restart);

  // 进入后留一拍黑暗，再开始
  setTimeout(run, 1600);
</script>
</body>
</html>
