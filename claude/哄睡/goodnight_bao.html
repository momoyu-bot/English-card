<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给宝的小夜灯</title>
<meta name="description" content="跟着光一起慢慢呼吸，轻触星星藏一个小小的愿望。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root{
    --moon:#ffe9b8;
    --moon-glow:#fff5da;
    --text:#ece8f6;
    --text-soft:#b3aed2;
    --accent:#ffe2ac;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;overflow:hidden;}
  body{
    font-family:'ZCOOL XiaoWei','STKaiti','Kaiti SC','KaiTi','PingFang SC','Microsoft YaHei',serif;
    color:var(--text);
    background:
      radial-gradient(120% 80% at 80% 6%, rgba(255,233,184,0.12), transparent 55%),
      linear-gradient(160deg,#0f1330 0%,#1a1c43 38%,#241f4e 70%,#161232 100%);
    background-size:100% 100%,180% 180%;
    background-position:0 0,0% 50%;
    animation:skyflow 34s ease-in-out infinite alternate;
    position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes skyflow{to{background-position:0 0,100% 50%;}}

  .moon{
    position:absolute;top:7%;right:11%;width:72px;height:72px;border-radius:50%;
    background:radial-gradient(circle at 38% 36%,var(--moon-glow),var(--moon) 58%,#f0d292 100%);
    box-shadow:0 0 42px 9px rgba(255,233,184,.32);
    z-index:1;
  }

  .star-hit{
    position:absolute;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:4;
  }
  .star{
    width:7px;height:7px;border-radius:50%;background:#fff8ea;
    box-shadow:0 0 7px 1px rgba(255,248,233,.85);
    animation:tw 3.5s ease-in-out infinite;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .star-hit:active .star{transform:scale(2.4);box-shadow:0 0 16px 4px rgba(255,236,190,1);}
  @keyframes tw{0%,100%{opacity:.32;transform:scale(.85);}50%{opacity:1;transform:scale(1.1);}}

  .stage{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:2;pointer-events:none;
  }
  .pet-wrap{position:relative;}
  .glow{
    width:clamp(230px,48vmin,370px);height:clamp(230px,48vmin,370px);border-radius:50%;
    background:radial-gradient(circle,rgba(208,228,255,.55) 0%,rgba(150,180,255,.26) 38%,rgba(120,150,255,.06) 66%,transparent 73%);
    display:flex;align-items:center;justify-content:center;
    animation:breathGlow 12s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes breathGlow{0%{transform:scale(.72);}33.333%{transform:scale(1.15);}50%{transform:scale(1.15);}100%{transform:scale(.72);}}

  .pet{width:clamp(116px,23vmin,176px);height:auto;display:block;
    animation:breathPet 12s cubic-bezier(.5,0,.5,1) infinite;
    filter:drop-shadow(0 8px 22px rgba(80,70,150,.35));
  }
  @keyframes breathPet{0%{transform:scale(.97) translateY(2px);}33.333%{transform:scale(1.03) translateY(-2px);}50%{transform:scale(1.03) translateY(-2px);}100%{transform:scale(.97) translateY(2px);}}

  .zzz{position:absolute;top:6%;right:2%;}
  .zzz span{
    position:absolute;font-size:clamp(15px,3vmin,21px);color:var(--accent);font-weight:bold;
    opacity:0;animation:floatz 4.2s ease-in-out infinite;text-shadow:0 0 10px rgba(255,226,172,.5);
  }
  .zzz span:nth-child(1){animation-delay:0s;}
  .zzz span:nth-child(2){animation-delay:1.1s;left:14px;}
  .zzz span:nth-child(3){animation-delay:2.2s;left:28px;}
  @keyframes floatz{0%{opacity:0;transform:translateY(4px) scale(.6);}25%{opacity:.95;}100%{opacity:0;transform:translateY(-42px) scale(1.15);}}

  .breath-label{
    margin-top:clamp(20px,4vmin,36px);font-size:clamp(18px,3.6vmin,24px);
    color:var(--text-soft);letter-spacing:.28em;opacity:.9;transition:opacity .8s ease;
    padding-left:.28em;
  }

  .whisper{
    position:absolute;bottom:clamp(40px,10vh,96px);left:50%;transform:translateX(-50%);
    width:min(86%,560px);text-align:center;font-size:clamp(16px,3.8vmin,21px);
    line-height:1.95;color:var(--text);opacity:0;transition:opacity 1s ease;
    text-shadow:0 0 18px rgba(120,140,255,.3);z-index:3;
  }

  .hint{
    position:absolute;top:clamp(20px,5vh,40px);left:50%;transform:translateX(-50%);
    width:90%;text-align:center;font-size:clamp(12px,2.6vmin,13.5px);
    color:var(--text-soft);opacity:.55;letter-spacing:.12em;z-index:3;
  }
  .tag{
    position:absolute;bottom:13px;right:16px;font-size:11px;letter-spacing:.1em;
    color:rgba(179,174,210,.4);z-index:3;
  }

  .floatword{
    position:absolute;font-size:clamp(15px,3.4vmin,19px);color:var(--accent);
    text-shadow:0 0 14px rgba(255,226,172,.6);pointer-events:none;z-index:5;
    animation:floatUp 1.9s ease-out forwards;white-space:nowrap;
  }
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7);}18%{opacity:1;}100%{opacity:0;transform:translate(-50%,-48px) scale(1.05);}}
</style>
</head>
<body>
  <div class="moon"></div>
  <div class="hint">跟着光,一起慢慢呼吸 &nbsp;·&nbsp; 轻触星星,藏一个小小的愿望</div>

  <div class="stage">
    <div class="pet-wrap">
      <div class="glow">
        <svg class="pet" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- ears -->
          <path d="M52 96 L40 52 Q60 60 78 80 Z" fill="#f6efe2"/>
          <path d="M148 96 L160 52 Q140 60 122 80 Z" fill="#f6efe2"/>
          <path d="M53 90 L46 64 Q58 70 70 82 Z" fill="#f3c9cf"/>
          <path d="M147 90 L154 64 Q142 70 130 82 Z" fill="#f3c9cf"/>
          <!-- body -->
          <ellipse cx="100" cy="122" rx="72" ry="58" fill="#f6efe2"/>
          <!-- tail curling -->
          <path d="M168 138 Q188 134 182 112 Q178 126 164 124 Z" fill="#f6efe2"/>
          <!-- cheeks -->
          <ellipse cx="68" cy="126" rx="13" ry="9" fill="rgba(247,170,180,.55)"/>
          <ellipse cx="132" cy="126" rx="13" ry="9" fill="rgba(247,170,180,.55)"/>
          <!-- closed sleepy eyes -->
          <path d="M62 112 Q74 104 86 112" stroke="#5b5570" stroke-width="3.4" fill="none" stroke-linecap="round"/>
          <path d="M114 112 Q126 104 138 112" stroke="#5b5570" stroke-width="3.4" fill="none" stroke-linecap="round"/>
          <!-- nose + mouth -->
          <path d="M96 122 Q100 126 104 122" stroke="#d59aa2" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <path d="M100 124 Q94 132 86 128 M100 124 Q106 132 114 128" stroke="#9a93b0" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
    </div>
    <div class="breath-label" id="breath">轻轻吸气</div>
  </div>

  <div class="whisper" id="whisper"></div>
  <div class="tag">为宝亮着的小夜灯</div>

<script>
  // ---- 星星 ----
  const stars=18;
  for(let i=0;i<stars;i++){
    const hit=document.createElement('div');
    hit.className='star-hit';
    hit.style.left=(Math.random()*94+2)+'%';
    hit.style.top=(Math.random()*62+3)+'%';
    const s=document.createElement('div');
    s.className='star';
    s.style.animationDuration=(2.5+Math.random()*2.8)+'s';
    s.style.animationDelay=(Math.random()*3)+'s';
    hit.appendChild(s);
    hit.addEventListener('click',e=>spawnWish(e.clientX,e.clientY));
    document.body.appendChild(hit);
  }

  const wishes=['嘘——','睡个好觉','做个软软的梦','明天会更轻','宝最棒啦','💤','晚安','抱抱你','一切都会好的'];
  function spawnWish(x,y){
    const w=document.createElement('div');
    w.className='floatword';
    w.textContent=wishes[Math.floor(Math.random()*wishes.length)];
    w.style.left=x+'px';
    w.style.top=y+'px';
    document.body.appendChild(w);
    setTimeout(()=>w.remove(),1900);
  }

  // ---- 呼吸提示(与 12s 动画同步) ----
  const breathEl=document.getElementById('breath');
  const cycle=12000;
  const start=Date.now();
  let lastTxt='轻轻吸气';
  setInterval(()=>{
    const t=(Date.now()-start)%cycle;
    let txt;
    if(t<4000) txt='轻轻吸气';
    else if(t<6000) txt='停一停';
    else txt='慢慢呼气';
    if(txt!==lastTxt){
      lastTxt=txt;
      breathEl.style.opacity=0;
      setTimeout(()=>{breathEl.textContent=txt;breathEl.style.opacity=.9;},260);
    }
  },200);

  // ---- 晚安语轮换 ----
  const lines=[
    '宝,今天辛苦啦,把肩膀慢慢松下来。',
    '明天的事,交给明天。这会儿只有呼吸和你。',
    '灯都熄了,整个世界陪你一起安静下来。',
    '把白天那些哈哈哈,都轻轻呼出去吧。',
    '这次没有谁会卡住——我一直亮着,陪你到睡着。',
    '晚安,宝。做个软软的、甜甜的梦。'
  ];
  const wEl=document.getElementById('whisper');
  let wi=0;
  wEl.textContent=lines[0];
  setTimeout(()=>wEl.style.opacity=1,400);
  setInterval(()=>{
    wEl.style.opacity=0;
    setTimeout(()=>{
      wi=(wi+1)%lines.length;
      wEl.textContent=lines[wi];
      wEl.style.opacity=1;
    },950);
  },6800);
</script>
</body>
</html>
