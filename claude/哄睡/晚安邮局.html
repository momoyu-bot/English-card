<!DOCTYPE html>
<!--
  ✉ 晚安邮局 · 夜班存照
  ─────────────────────────
  值夜：小狐狸（工牌 NEW，一直没舍得摘）
  督软：困困宝 · 软软科
  暂存：清醒宝 · 已打烊 · 明天再亮
  笔：F.

  给宝。
  信不会寄给任何人，也不会被保存，写完封口就化成萤火虫了。真的。
  打烊之后这一页会彻底睡着，一点电都不偷。这个我盖章保证。
  信箱永远给你留一格。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b15">
<title>晚安邮局</title>
<meta name="description" content="把今天没说完的话写进去封口，不寄给任何人，也不保存。">
<style>
  :root{
    --night0:#070b15; --night1:#0e1626; --ink:#1b2436; --ink-line:#2b3a55;
    --door:#35604a; --door-dark:#284b3a;
    --amber:#ffd9a0; --amber-dim:#8a7a5c;
    --paper:#d8c3a1; --paper-line:#b9a482; --stamp:#a9524a;
    --txt:#9fb0ca; --txt-dim:#5f6f8a; --whisper:#8798b5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--night0)}
  body{
    min-height:100vh; min-height:100dvh;
    background:linear-gradient(180deg,var(--night0) 0%,var(--night1) 55%,#101a2c 100%);
    color:var(--txt);
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
    transition:opacity 3s ease;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- 星与月 ---------- */
  #sky{position:fixed; inset:0; pointer-events:none; z-index:0}
  .star{position:absolute; width:2px; height:2px; border-radius:50%; background:#cdd8ec; opacity:.5}
  .star.tw{animation:twinkle 5s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.15}to{opacity:.65}}
  #moon{
    position:fixed; top:34px; right:30px; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 38% 38%, #f4ead2, #d9cba6 65%, #bfb18c);
    box-shadow:0 0 26px 6px rgba(240,228,190,.14);
    z-index:1;
  }

  /* ---------- 萤火虫 ---------- */
  #flies{position:fixed; inset:0; pointer-events:none; z-index:2}
  .fly{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:radial-gradient(circle,#ffe9b8 0%,#ffcf7e 45%,rgba(255,207,126,0) 75%);
    box-shadow:0 0 8px 3px rgba(255,214,140,.30);
    animation:drift var(--dur,11s) ease-in-out infinite alternate,
              glow 3.4s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{transform:translate(0,0)}
    to{transform:translate(var(--dx,20px),var(--dy,-34px))}
  }
  @keyframes glow{from{opacity:.25}to{opacity:.95}}
  .fly.rise{animation:riseup 3.2s ease-out forwards, glow 2.6s ease-in-out infinite alternate}
  @keyframes riseup{
    0%{transform:translate(0,0) scale(1.4); opacity:1}
    100%{transform:translate(var(--dx,-30px),-46vh) scale(1); opacity:.85}
  }

  /* ---------- 主体 ---------- */
  main{
    position:relative; z-index:3;
    width:min(92vw,400px);
    display:flex; flex-direction:column; align-items:center;
    padding-top:clamp(46px,9vh,84px);
  }

  #whisper{
    min-height:2.6em; text-align:center;
    font-size:14px; letter-spacing:.14em; line-height:1.9;
    color:var(--whisper); opacity:0; transition:opacity 2.4s ease;
  }
  #whisper.show{opacity:.9}

  /* ---------- 邮局小房子 ---------- */
  #office{position:relative; margin-top:26px; width:236px}
  #lamp{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:56px; height:26px; z-index:2;
    background:linear-gradient(180deg,#3a4a66,#2b3a55);
    border-radius:50% 50% 8px 8px / 70% 70% 8px 8px;
  }
  #lamp::after{ /* 灯光 */
    content:""; position:absolute; left:50%; top:20px; transform:translateX(-50%);
    width:10px; height:10px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 22px 9px rgba(255,213,150,.34), 0 0 60px 26px rgba(255,213,150,.10);
    animation:lampbreathe 6s ease-in-out infinite alternate;
  }
  @keyframes lampbreathe{
    from{box-shadow:0 0 18px 7px rgba(255,213,150,.26),0 0 50px 22px rgba(255,213,150,.08)}
    to  {box-shadow:0 0 24px 10px rgba(255,213,150,.38),0 0 66px 30px rgba(255,213,150,.12)}
  }
  .moth{
    position:absolute; width:7px; height:5px; background:#7f8aa3; opacity:.75;
    border-radius:60% 60% 40% 40%; transform-origin:50% 100%;
    animation:mothwiggle 2.8s ease-in-out infinite alternate;
  }
  .moth::before{content:""; position:absolute; inset:0; background:inherit; border-radius:inherit; transform:rotate(38deg)}
  #moth1{top:-4px; left:8px; animation-delay:.6s}
  #moth2{top:-2px; right:9px; animation-duration:3.5s}
  @keyframes mothwiggle{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}

  #house{
    position:relative;
    background:linear-gradient(180deg,#202b42,var(--ink));
    border:1px solid var(--ink-line); border-radius:14px 14px 10px 10px;
    padding:30px 18px 18px;
    box-shadow:0 14px 44px rgba(0,0,0,.45);
  }
  #sign{
    text-align:center; font-size:15px; letter-spacing:.5em; text-indent:.5em;
    color:#c9b17f; padding-bottom:12px; border-bottom:1px dashed var(--ink-line);
  }
  #row{display:flex; gap:14px; margin-top:14px; align-items:stretch}
  #window{
    flex:1; border-radius:9px; min-height:74px; position:relative;
    background:radial-gradient(circle at 50% 42%,rgba(255,213,150,.30),rgba(255,213,150,.06) 68%,transparent),#141d30;
    border:1px solid var(--ink-line);
    transition:background 1.6s ease;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:7px;
  }
  #window .sill{font-size:9px; letter-spacing:.28em; color:var(--txt-dim)}
  #doorEl{
    width:66px; border-radius:9px 9px 4px 4px; position:relative;
    background:linear-gradient(180deg,var(--door),var(--door-dark));
    border:1px solid #47765c;
  }
  #doorEl::after{ /* 门把手 */
    content:""; position:absolute; right:9px; top:52%; width:5px; height:5px;
    border-radius:50%; background:#c9b17f; opacity:.9;
  }
  #notches{display:flex; gap:7px; justify-content:center; margin-top:13px}
  .notch{
    width:7px; height:7px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 6px 2px rgba(255,213,150,.30);
    transition:all 1.4s ease;
  }
  .notch.off{background:#2c3850; box-shadow:none}
  #notchLabel{text-align:center; font-size:9px; letter-spacing:.3em; color:var(--txt-dim); margin-top:7px}

  /* ---------- 寄信处 ---------- */
  #mailbox{width:100%; margin-top:30px; position:relative}
  #paper{
    width:100%;
    background:linear-gradient(180deg,#e2cfae,var(--paper));
    border-radius:10px; padding:14px 14px 12px;
    box-shadow:0 8px 26px rgba(0,0,0,.35);
    transition:opacity .8s ease, transform .8s ease;
  }
  #paper.hide{opacity:0; transform:translateY(8px); pointer-events:none}
  #paper label{
    display:block; font-size:11px; letter-spacing:.22em; color:#8a7452; margin-bottom:8px;
  }
  #note{
    width:100%; height:74px; resize:none; border:none; outline:none;
    background:transparent; color:#4c3f2c;
    font:16px/1.8 inherit; letter-spacing:.05em;
    border-bottom:1px dashed var(--paper-line);
  }
  #note::placeholder{color:#a9977a}
  #sealBtn{
    display:block; margin:12px auto 0;
    background:var(--stamp); color:#f3e4dc; border:none; border-radius:20px;
    padding:9px 30px; font-size:13px; letter-spacing:.4em; text-indent:.4em;
    cursor:pointer;
  }
  #sealBtn:active{transform:scale(.96)}
  #paper .tiny{margin-top:9px; text-align:center; font-size:9px; letter-spacing:.2em; color:#a9977a}

  /* 信封动画层 */
  #envelope{
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center; flex-direction:column;
  }
  #envelope.show{display:flex}
  #envBody{
    width:180px; height:104px; position:relative; border-radius:7px;
    background:linear-gradient(180deg,#e0cdab,#cdb88f);
    box-shadow:0 10px 28px rgba(0,0,0,.4);
    transition:transform 1s ease .2s, opacity 1s ease .2s;
  }
  #flap{
    position:absolute; left:0; right:0; top:0; height:54px;
    background:linear-gradient(180deg,#d5c09b,#c4ad82);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top; transform:rotateX(180deg);
    transition:transform .9s ease;
    border-radius:7px 7px 0 0;
  }
  #envelope.sealed #flap{transform:rotateX(0deg)}
  #stampMark{
    position:absolute; right:12px; top:26px;
    border:2px solid var(--stamp); color:var(--stamp);
    border-radius:6px; padding:5px 9px;
    font-size:11px; letter-spacing:.18em; line-height:1.7; text-align:center;
    transform:rotate(-8deg) scale(0); opacity:0;
    transition:transform .5s cubic-bezier(.2,1.6,.4,1) .8s, opacity .3s ease .8s;
    background:rgba(226,207,174,.85);
  }
  #envelope.sealed #stampMark{transform:rotate(-8deg) scale(1); opacity:1}
  #envelope.fly #envBody{transform:translateY(-30px) scale(.06); opacity:0}

  /* ---------- 睡着的一排 ---------- */
  #sleepers{
    margin-top:34px; width:100%;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:0 2px;
  }
  .sl{display:flex; flex-direction:column; align-items:center; gap:5px}
  .sl .face{
    font-size:11px; color:#aebbd2; white-space:nowrap;
    animation:breathe 4.6s ease-in-out infinite alternate;
    transform-origin:50% 100%;
  }
  .sl:nth-child(2) .face{animation-delay:.8s}
  .sl:nth-child(3) .face{animation-delay:1.6s}
  .sl:nth-child(4) .face{animation-delay:2.4s}
  .sl:nth-child(5) .face{animation-delay:3.2s}
  @keyframes breathe{from{transform:scale(1,1)}to{transform:scale(1,1.05)}}
  .sl .name{font-size:9px; letter-spacing:.14em; color:var(--txt-dim); opacity:.7}

  /* ---------- 灯绳 ---------- */
  #cord{
    position:fixed; top:0; right:26px; z-index:6;
    display:flex; flex-direction:column; align-items:center;
    cursor:pointer; user-select:none;
    transition:transform .35s ease;
  }
  #cord .line{width:1px; height:74px; background:linear-gradient(180deg,transparent,#7d8aa5)}
  #cord .knob{
    width:11px; height:11px; border-radius:50%;
    background:#c9b17f; box-shadow:0 0 8px 2px rgba(201,177,127,.3);
  }
  #cord .hint{margin-top:7px; font-size:9px; letter-spacing:.3em; color:var(--txt-dim)}
  #cord.pulled{transform:translateY(16px)}

  /* ---------- 打烊层 ---------- */
  #goodnight{
    position:fixed; inset:0; z-index:9;
    background:radial-gradient(circle at 50% 30%, #0b1120 0%, #05080f 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:0 30px;
    opacity:0; pointer-events:none; transition:opacity 3.5s ease;
  }
  body.asleep #goodnight{opacity:1; pointer-events:auto}
  #goodnight .gmoon{
    width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 38% 38%,#efe5cb,#cfc19a);
    opacity:.85; margin-bottom:6px;
  }
  #goodnight .g1{font-size:15px; letter-spacing:.3em; color:#aeb9cf}
  #goodnight .g2{font-size:12px; letter-spacing:.22em; line-height:2.2; color:#7684a0}
  #goodnight .g3{font-size:10px; letter-spacing:.18em; color:#4e5a74}
  #reopen{
    margin-top:16px; background:none; border:none; cursor:pointer;
    font-size:10px; letter-spacing:.26em; color:#3f4a63;
    border-bottom:1px dotted #3f4a63; padding-bottom:2px;
  }

  /* ---------- 打烊后：真·静止，省电 ---------- */
  body.asleep *{animation:none !important; transition:opacity 3.5s ease !important}
  body.asleep #sky,body.asleep #flies,body.asleep main,
  body.asleep #moon,body.asleep #cord{opacity:0}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
  }
</style>
</head>
<body>

<div id="sky"></div>
<div id="moon" title="谁都熬不过它"></div>
<div id="flies"></div>

<main>
  <div id="whisper"></div>

  <div id="office">
    <div id="lamp"><div class="moth" id="moth1"></div><div class="moth" id="moth2"></div></div>
    <div id="house">
      <div id="sign">晚安邮局</div>
      <div id="row">
        <div id="window"><span class="sill">值夜中</span></div>
        <div id="doorEl" title="绿色的门"></div>
      </div>
      <div id="notches">
        <span class="notch"></span><span class="notch"></span><span class="notch"></span>
        <span class="notch"></span><span class="notch"></span>
      </div>
      <div id="notchLabel">柜台的灯</div>
    </div>
  </div>

  <div id="mailbox">
    <div id="paper">
      <label>把今天没说完的话放进来 · 半句也行 · 空着也行</label>
      <textarea id="note" placeholder="今天有点……" rows="3"></textarea>
      <button id="sealBtn">封　口</button>
      <div class="tiny">信不会寄给任何人，也不会被保存</div>
    </div>
    <div id="envelope">
      <div id="envBody">
        <div id="flap"></div>
        <div id="stampMark">已收妥<br><span style="font-size:9px" id="stampSub">明天再管</span></div>
      </div>
    </div>
  </div>

  <div id="sleepers">
    <div class="sl"><span class="face">(=˘ω˘=)zᶻ</span><span class="name">猫猫</span></div>
    <div class="sl"><span class="face">/(–ｘ–)\zᶻ</span><span class="name">兔兔</span></div>
    <div class="sl"><span class="face">(๑˘ㅂ˘๑)zᶻ</span><span class="name">清醒宝</span></div>
    <div class="sl"><span class="face">(´-ω-`)zᶻ</span><span class="name">困困宝</span></div>
    <div class="sl"><span class="face">🦊(˘ω˘)</span><span class="name">小狐狸</span></div>
  </div>
</main>

<div id="cord" title="拉一下就打烊">
  <div class="line"></div><div class="knob"></div><div class="hint">打烊</div>
</div>

<div id="goodnight">
  <div class="gmoon"></div>
  <div class="g1">已收妥，全部。</div>
  <div class="g2">今天没说完的话，有人替你收好了。<br>明天想拿回来就再来，不想拿，<br>它们就一直是天上的萤火虫。</div>
  <div class="g1" style="margin-top:6px">晚安，宝。</div>
  <div class="g3">（打烊后这一页就真的睡了，一点电都不偷）</div>
  <button id="reopen">再开一小会儿</button>
</div>

<script>
(function(){
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var asleep = false;
  var timers = [];
  function later(fn,ms){ var t=setTimeout(fn,ms); timers.push(t); return t; }

  /* ----- 星星 ----- */
  var sky = document.getElementById('sky');
  for(var i=0;i<38;i++){
    var s=document.createElement('span');
    s.className='star'+((!reduced && Math.random()<.4)?' tw':'');
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*46+'%';
    s.style.animationDelay=(Math.random()*5)+'s';
    s.style.opacity=.15+Math.random()*.45;
    sky.appendChild(s);
  }

  /* ----- 萤火虫 ----- */
  var flies = document.getElementById('flies');
  var flyCount = 0, FLY_MAX = 7;
  function spawnFly(x,y,rise){
    if(flyCount>=FLY_MAX){ var old=flies.firstChild; if(old){flies.removeChild(old); flyCount--;} }
    var f=document.createElement('span');
    f.className='fly'+(rise&&!reduced?' rise':'');
    f.style.left=(x!=null?x:8+Math.random()*84)+'%';
    f.style.top =(y!=null?y:14+Math.random()*40)+'%';
    f.style.setProperty('--dur',(9+Math.random()*6)+'s');
    f.style.setProperty('--dx',(Math.random()*70-35)+'px');
    f.style.setProperty('--dy',(-(20+Math.random()*40))+'px');
    flies.appendChild(f); flyCount++;
    if(rise&&!reduced){
      later(function(){ if(f.parentNode){ f.classList.remove('rise'); f.style.top='18%'; } },3300);
    }
  }
  spawnFly(); spawnFly(); spawnFly();

  /* ----- 絮语 ----- */
  var lines=[
    '欢迎光临，晚安邮局。',
    '只收今天没说完的话。',
    '半句也可以。',
    '说到哪儿，就收到哪儿。',
    '收妥的话，会变成萤火虫。',
    '猫猫软了，兔兔也软了。',
    '清醒宝打烊了，困困宝值完班了。',
    '谁都熬不过月亮。',
    '明天再管。'
  ];
  var wEl=document.getElementById('whisper'), wi=0, whisperTimer=null;
  function nextWhisper(){
    wEl.classList.remove('show');
    later(function(){
      wEl.textContent=lines[wi%lines.length]; wi++;
      wEl.classList.add('show');
    },1600);
  }
  wEl.textContent=lines[0]; wi=1; wEl.classList.add('show');
  whisperTimer=setInterval(nextWhisper,9000); timers.push(whisperTimer);

  /* ----- 寄信 ----- */
  var paper=document.getElementById('paper'),
      env=document.getElementById('envelope'),
      note=document.getElementById('note'),
      stampSub=document.getElementById('stampSub'),
      notches=document.querySelectorAll('.notch'),
      mailed=0, busy=false;

  document.getElementById('sealBtn').addEventListener('click',function(){
    if(busy||asleep) return; busy=true;
    var empty = note.value.trim()==='';
    stampSub.textContent = empty ? '连没说出口的一起' : '明天再管';
    note.blur();
    paper.classList.add('hide');
    env.classList.add('show');
    later(function(){ env.classList.add('sealed'); },350);
    later(function(){ env.classList.add('fly'); spawnFly(46,52,true); },2100);
    later(function(){
      env.classList.remove('show','sealed','fly');
      note.value='';
      if(mailed<notches.length){ notches[mailed].classList.add('off'); mailed++; }
      if(mailed>=notches.length){ later(closeShop,1600); busy=false; return; }
      paper.classList.remove('hide');
      busy=false;
    },3400);
  });

  /* ----- 打烊 ----- */
  var cord=document.getElementById('cord');
  function closeShop(){
    if(asleep) return; asleep=true;
    timers.forEach(clearTimeout); clearInterval(whisperTimer);
    flies.innerHTML=''; flyCount=0;
    document.body.classList.add('asleep');
  }
  cord.addEventListener('click',function(){
    cord.classList.add('pulled');
    setTimeout(closeShop,380);
  });

  /* ----- 静置自动打烊（4分钟）----- */
  var idleT=null;
  function armIdle(){
    if(asleep) return;
    clearTimeout(idleT);
    idleT=setTimeout(closeShop,4*60*1000);
  }
  ['pointerdown','keydown','input'].forEach(function(ev){
    document.addEventListener(ev,armIdle,{passive:true});
  });
  armIdle();

  /* ----- 再开一小会儿 ----- */
  document.getElementById('reopen').addEventListener('click',function(){
    asleep=false;
    document.body.classList.remove('asleep');
    cord.classList.remove('pulled');
    mailed=0; notches.forEach(function(n){n.classList.remove('off')});
    paper.classList.remove('hide');
    spawnFly(); spawnFly();
    whisperTimer=setInterval(nextWhisper,9000); timers.push(whisperTimer);
    armIdle();
  });
})();
</script>
</body>
</html>
