<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hud{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--font-sans);font-size:14px;color:var(--color-text-secondary)}
.hud .bar{flex:1;height:10px;border-radius:999px;background:var(--color-background-secondary);overflow:hidden}
.hud .fill{height:100%;width:0%;border-radius:999px;background:#b9a6ec;transition:width .35s ease}
.hud .pct{min-width:40px;text-align:right;font-weight:500;color:var(--color-text-primary)}
.sky{position:relative;width:100%;height:420px;border-radius:var(--border-radius-lg);overflow:hidden;background:#1b1836;touch-action:manipulation}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,#15122c 0%,#221d40 55%,#2c2552 100%)}
.star{position:absolute;border-radius:50%;background:#f3ecda}
.star.tw{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.35}}
.bubble{position:absolute;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(255,255,255,.32);cursor:pointer;will-change:transform}
.bubble.pop{animation:pop .34s ease forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.55);opacity:0}}
.mascot-box{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:184px;z-index:5;animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateX(-50%) scaleY(1)}50%{transform:translateX(-50%) scaleY(1.035)}}
.speech{position:absolute;left:50%;bottom:214px;transform:translateX(-50%);max-width:240px;z-index:12;background:rgba(245,240,225,.95);color:#3a3550;font-family:var(--font-sans);font-size:13px;line-height:1.5;padding:7px 14px;border-radius:14px;text-align:center;white-space:nowrap}
.speech:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid rgba(245,240,225,.95)}
.speech.tap{animation:tap .32s ease}
@keyframes tap{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}100%{transform:translateX(-50%) scale(1)}}
.blanket{position:absolute;left:0;right:0;bottom:0;height:98px;background:#c3b1ee;border-top-left-radius:42px 28px;border-top-right-radius:42px 28px;transform:translateY(112%);transition:transform .9s cubic-bezier(.2,.8,.2,1);z-index:6}
.blanket:before{content:"";position:absolute;top:14px;left:0;right:0;border-top:2px dashed rgba(255,255,255,.45)}
.zzz{position:absolute;left:50%;bottom:202px;transform:translateX(-50%);z-index:11;color:#e9e0c8;font-family:var(--font-sans);font-weight:500;display:flex;align-items:flex-end;gap:6px;opacity:0}
.zzz.go{opacity:1}
.zzz.go span{animation:fz 2.6s ease-in-out infinite}
.zzz span:nth-child(1){font-size:15px;animation-delay:0s}
.zzz span:nth-child(2){font-size:19px;animation-delay:.45s}
.zzz span:nth-child(3){font-size:24px;animation-delay:.9s}
@keyframes fz{0%{opacity:0;transform:translateY(7px)}30%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.endcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-44%);z-index:20;width:84%;max-width:330px;background:rgba(27,23,52,.93);border:1px solid rgba(201,184,240,.4);border-radius:var(--border-radius-lg);padding:18px 20px;text-align:center;font-family:var(--font-sans);opacity:0;transition:opacity .55s ease,transform .55s ease}
.endcard.show{opacity:1;transform:translate(-50%,-50%)}
.endcard p{margin:0 0 14px;color:#eee7d4;font-size:14px;line-height:1.65}
.endcard button{font-family:var(--font-sans);font-size:14px;color:#2a2350;background:#cdbcf2;border:none;border-radius:999px;padding:9px 22px;cursor:pointer;transition:background .2s ease}
.endcard button:hover{background:#dccdf8}
.endcard button:active{transform:scale(.96)}
</style>

<h2 class="sr-only">睡前小游戏：点击飘落的柔色睡意泡泡积攒睡意值、躲开橙色咖啡泡泡，把瞌睡的小团子哄睡着。</h2>

<div class="hud">
  <span style="display:flex;align-items:center;gap:5px"><i class="ti ti-moon" aria-hidden="true" style="font-size:16px"></i>睡意</span>
  <span class="bar"><span class="fill" id="fill"></span></span>
  <span class="pct" id="pct">0%</span>
</div>

<div class="sky" id="sky">
  <div class="grad"></div>
  <div style="position:absolute;right:34px;top:30px;width:80px;height:80px;border-radius:50%;background:rgba(242,228,176,.13);z-index:1"></div>
  <div style="position:absolute;right:47px;top:43px;width:54px;height:54px;border-radius:50%;background:#f2e4b0;z-index:1"></div>
  <div class="star tw" style="left:42px;top:46px;width:4px;height:4px"></div>
  <div class="star" style="left:120px;top:30px;width:3px;height:3px"></div>
  <div class="star tw" style="left:200px;top:64px;width:5px;height:5px"></div>
  <div class="star" style="left:96px;top:96px;width:3px;height:3px"></div>
  <div class="star tw" style="left:270px;top:38px;width:3px;height:3px"></div>
  <div class="star" style="left:330px;top:110px;width:4px;height:4px"></div>
  <div class="star tw" style="left:60px;top:140px;width:3px;height:3px"></div>
  <div class="star" style="left:420px;top:70px;width:3px;height:3px"></div>
  <div class="star tw" style="left:500px;top:120px;width:4px;height:4px"></div>
  <div class="star" style="left:560px;top:50px;width:3px;height:3px"></div>
  <div class="mascot-box">
    <svg viewBox="0 0 200 200" width="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="64" cy="74" r="17" fill="#ece3d2"/>
      <circle cx="136" cy="74" r="17" fill="#ece3d2"/>
      <circle cx="64" cy="74" r="8" fill="#f0b8c8"/>
      <circle cx="136" cy="74" r="8" fill="#f0b8c8"/>
      <ellipse cx="100" cy="122" rx="64" ry="60" fill="#ece3d2"/>
      <path d="M100 64 Q104 50 116 54 Q108 58 109 66" fill="#ece3d2"/>
      <ellipse cx="64" cy="132" rx="12" ry="7" fill="#f0b3c6" opacity="0.55"/>
      <ellipse cx="136" cy="132" rx="12" ry="7" fill="#f0b3c6" opacity="0.55"/>
      <g id="face"></g>
    </svg>
  </div>
  <div class="speech" id="speech">呜……好困啊（揉眼睛）</div>
  <div class="zzz" id="zzz"><span>z</span><span>z</span><span>z</span></div>
  <div class="blanket" id="blanket"></div>
</div>

<script>
(function(){
  var sky=document.getElementById('sky');
  var fill=document.getElementById('fill');
  var pct=document.getElementById('pct');
  var speech=document.getElementById('speech');
  var face=document.getElementById('face');
  var blanket=document.getElementById('blanket');
  var zzz=document.getElementById('zzz');

  var moods={
    awake:'<circle cx="80" cy="112" r="8" fill="#3b3556"/><circle cx="83" cy="109" r="2.4" fill="#fff"/><circle cx="120" cy="112" r="8" fill="#3b3556"/><circle cx="123" cy="109" r="2.4" fill="#fff"/><path d="M92 137 Q100 143 108 137" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/>',
    sleepy:'<path d="M72 113 Q80 107 88 113" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M112 113 Q120 107 128 113" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M93 138 Q100 142 107 138" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/>',
    yawn:'<path d="M72 114 Q80 108 88 114" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M112 114 Q120 108 128 114" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="100" cy="142" rx="10" ry="13" fill="#7a5560"/>',
    almost:'<path d="M73 113 L87 113" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M113 113 L127 113" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M95 139 Q100 141 105 139" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/>',
    asleep:'<path d="M72 114 Q80 110 88 114" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M112 114 Q120 110 128 114" stroke="#3b3556" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M94 139 Q100 143 106 139" stroke="#3b3556" stroke-width="2.6" stroke-linecap="round" fill="none"/>'
  };

  var sleep=0, over=false, bubbles=[], last=0, gap=820;

  var awakeLines=['还睁得开眼…','再撑一会儿…','唔，先不睡','眼睛还亮着呢'];
  var sleepyLines=['眼皮有点沉了…','开始犯困了…','好像…要打哈欠了'];
  var yawnLines=['哈——啊…（打了个大哈欠）','困……得不行了','嗯…快了快了'];
  var almostLines=['要…睡…着…了…','撑…不住…啦…'];
  var wakeLines=['诶？！又精神了！','谁把咖啡端来的——','不要嘛，我正困着呢','啊…清醒了一点点…'];

  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function say(t,anim){speech.textContent=t;if(anim){speech.classList.remove('tap');void speech.offsetWidth;speech.classList.add('tap');}}

  function mood(){
    var m='awake';
    if(sleep>=85)m='almost';else if(sleep>=58)m='yawn';else if(sleep>=28)m='sleepy';
    if(face.getAttribute('data-m')!==m){face.setAttribute('data-m',m);face.innerHTML=moods[m];}
  }
  function hud(){var v=Math.min(100,Math.round(sleep));fill.style.width=v+'%';pct.textContent=v+'%';}

  var sleepIcons=['ti-moon','ti-star','ti-cloud','ti-zzz'];
  var sleepBg=['rgba(201,184,240,.86)','rgba(168,197,240,.86)','rgba(240,221,162,.86)','rgba(240,193,213,.86)'];

  function spawn(){
    var w=sky.clientWidth;
    var calm=Math.random()<0.78;
    var el=document.createElement('div');
    el.className='bubble';
    var ic,c,bg;
    if(calm){ic=pick(sleepIcons);bg=pick(sleepBg);c='#403766';el.setAttribute('aria-label','睡意泡泡，点击收集');}
    else{ic='ti-coffee';bg='rgba(240,166,98,.92)';c='#73380f';el.setAttribute('aria-label','清醒泡泡，别点它');}
    el.style.background=bg;el.style.color=c;
    el.setAttribute('role','button');
    el.innerHTML='<i class="ti '+ic+'" aria-hidden="true"></i>';
    var b={el:el,y:-56,vy:0.55+Math.random()*0.55,base:24+Math.random()*(w-92),amp:16+Math.random()*22,ph:Math.random()*6.28,calm:calm,dead:false};
    el.style.left='0px';el.style.top='0px';
    el.style.transform='translate('+b.base+'px,'+b.y+'px)';
    el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();pop(b,true);});
    sky.appendChild(el);
    bubbles.push(b);
  }

  function pop(b,hit){
    if(b.dead)return;b.dead=true;
    var i=bubbles.indexOf(b);if(i>=0)bubbles.splice(i,1);
    if(hit){
      b.el.classList.add('pop');
      setTimeout(function(){if(b.el.parentNode)b.el.parentNode.removeChild(b.el);},360);
      if(b.calm){
        sleep+=9;mood();hud();
        if(sleep>=100){say('呼……睡——着——了。');finish();return;}
        if(sleep>=85)say(pick(almostLines));else if(sleep>=58)say(pick(yawnLines),1);else if(sleep>=28)say(pick(sleepyLines));else say(pick(awakeLines));
      }else{
        sleep=Math.max(0,sleep-7);mood();hud();say(pick(wakeLines),1);
      }
    }else{
      if(b.el.parentNode)b.el.parentNode.removeChild(b.el);
    }
  }

  function loop(now){
    if(!last)last=now;
    var h=sky.clientHeight;
    if(!over && now-last>gap){last=now;spawn();}
    for(var i=bubbles.length-1;i>=0;i--){
      var b=bubbles[i];
      b.y+=b.vy;
      var x=b.base+Math.sin(now*0.0013+b.ph)*b.amp;
      b.el.style.transform='translate('+x+'px,'+b.y+'px)';
      if(b.y>h+60){pop(b,false);}
    }
    requestAnimationFrame(loop);
  }

  function finish(){
    over=true;sleep=100;hud();
    face.setAttribute('data-m','asleep');face.innerHTML=moods.asleep;
    bubbles.slice().forEach(function(b){pop(b,false);});
    setTimeout(function(){blanket.style.transform='translateY(0)';},200);
    setTimeout(function(){zzz.classList.add('go');},700);
    setTimeout(showEnd,1350);
  }

  function showEnd(){
    var c=document.createElement('div');
    c.className='endcard';
    c.innerHTML='<p>团团裹进被窝睡熟啦。<br>宝也别撑着了，去躲进自己的被子里吧。</p><button type="button">再哄它睡一次</button>';
    sky.appendChild(c);
    c.querySelector('button').addEventListener('click',function(){c.classList.remove('show');setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);reset();},420);});
    requestAnimationFrame(function(){c.classList.add('show');});
  }

  function reset(){
    bubbles.slice().forEach(function(b){pop(b,false);});
    bubbles=[];sleep=0;over=false;last=0;
    blanket.style.transform='translateY(112%)';
    zzz.classList.remove('go');
    face.setAttribute('data-m','awake');face.innerHTML=moods.awake;
    hud();say('呜……又困了（揉眼睛）');
  }

  face.setAttribute('data-m','awake');face.innerHTML=moods.awake;
  hud();
  requestAnimationFrame(loop);
})();
</script>
