<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天笑得很够本</title>
<meta name="description" content="从一个小小的换行符开始，一路闹到赛博衙门递奏折。电子猫已经趴好了。">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0e1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'ZCOOL XiaoWei', serif;
  }

  .sky {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, #0f1729 0%, #0a0e1a 50%, #060810 100%);
  }

  /* Stars */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--duration) ease-in-out infinite alternate;
    opacity: 0;
  }

  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8); }
    50% { opacity: var(--max-opacity); transform: scale(1); }
    100% { opacity: 0.2; transform: scale(0.9); }
  }

  /* Moon */
  .moon-container {
    position: fixed;
    top: 8%;
    right: 15%;
    width: 120px;
    height: 120px;
    animation: moonFloat 8s ease-in-out infinite;
  }

  .moon {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fef9e7, #f7dc6f, #f0c27f);
    box-shadow:
      0 0 40px rgba(247, 220, 111, 0.3),
      0 0 80px rgba(247, 220, 111, 0.15),
      0 0 120px rgba(247, 220, 111, 0.08),
      inset -15px -10px 30px rgba(218, 165, 32, 0.3);
  }

  .moon-crater {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(218, 165, 32, 0.2), rgba(218, 165, 32, 0.1));
  }

  .moon-crater:nth-child(1) { width: 20px; height: 20px; top: 30%; left: 25%; }
  .moon-crater:nth-child(2) { width: 14px; height: 14px; top: 55%; left: 45%; }
  .moon-crater:nth-child(3) { width: 10px; height: 10px; top: 35%; left: 55%; }

  @keyframes moonFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  /* Sleeping cat */
  .cat-scene {
    position: fixed;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 100px;
  }

  .cat-body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 55px;
    background: radial-gradient(ellipse at 50% 60%, #4a4458, #36304a);
    border-radius: 60px 60px 50px 50px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .cat-head {
    position: absolute;
    bottom: 30px;
    left: 15px;
    width: 55px;
    height: 45px;
    background: radial-gradient(ellipse at 50% 50%, #4a4458, #36304a);
    border-radius: 50% 50% 45% 45%;
  }

  .cat-ear {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 18px solid #4a4458;
  }

  .cat-ear.left { top: -12px; left: 5px; transform: rotate(-15deg); }
  .cat-ear.right { top: -12px; right: 5px; transform: rotate(15deg); }

  .cat-ear-inner {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 12px solid #6b5b7b;
  }

  .cat-ear-inner.left { top: -10px; left: 9px; transform: rotate(-15deg); }
  .cat-ear-inner.right { top: -10px; right: 9px; transform: rotate(15deg); }

  .cat-eyes {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
  }

  .cat-eye {
    width: 14px;
    height: 3px;
    background: #2a2438;
    border-radius: 0 0 10px 10px;
  }

  .cat-mouth {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 4px;
    border: 1.5px solid #6b5b7b;
    border-top: none;
    border-radius: 0 0 8px 8px;
  }

  .cat-tail {
    position: absolute;
    bottom: 5px;
    right: -15px;
    width: 50px;
    height: 20px;
    border: 4px solid #4a4458;
    border-left: none;
    border-bottom: none;
    border-radius: 0 20px 0 0;
    animation: tailWag 4s ease-in-out infinite;
    transform-origin: left center;
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* Zzz */
  .zzz {
    position: absolute;
    top: -10px;
    left: 80px;
    font-family: 'Ma Shan Zheng', cursive;
    color: rgba(167, 155, 201, 0.6);
    font-size: 14px;
    animation: zzzFloat 3s ease-in-out infinite;
  }

  .zzz:nth-child(2) {
    top: -25px;
    left: 95px;
    font-size: 18px;
    animation-delay: 0.8s;
    color: rgba(167, 155, 201, 0.45);
  }

  .zzz:nth-child(3) {
    top: -45px;
    left: 108px;
    font-size: 22px;
    animation-delay: 1.6s;
    color: rgba(167, 155, 201, 0.3);
  }

  @keyframes zzzFloat {
    0% { opacity: 0; transform: translateY(5px) rotate(-5deg); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px) rotate(5deg); }
  }

  /* Breathing animation for cat */
  .cat-body {
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translateX(-50%) scaleY(1); }
    50% { transform: translateX(-50%) scaleY(1.04); }
  }

  /* Cloud/mist */
  .mist {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 25%;
    background: linear-gradient(to top, rgba(15, 18, 35, 0.9), transparent);
    pointer-events: none;
  }

  /* Floating text */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #c8b8db;
    padding: 2rem;
    margin-bottom: 60px;
  }

  .goodnight-text {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: clamp(2.5rem, 6vw, 4rem);
    color: #e8daf0;
    text-shadow: 0 0 30px rgba(200, 180, 220, 0.3);
    opacity: 0;
    animation: fadeInSoft 2s ease-out 0.5s forwards;
    margin-bottom: 1.5rem;
  }

  .message {
    font-size: clamp(0.9rem, 2.5vw, 1.15rem);
    line-height: 2.2;
    max-width: 420px;
    margin: 0 auto;
    opacity: 0;
    letter-spacing: 0.5px;
  }

  .message .line {
    opacity: 0;
    transform: translateY(10px);
  }

  .message .line:nth-child(1) { animation: lineReveal 1.2s ease-out 1.5s forwards; }
  .message .line:nth-child(2) { animation: lineReveal 1.2s ease-out 2.5s forwards; }
  .message .line:nth-child(3) { animation: lineReveal 1.2s ease-out 3.5s forwards; }
  .message .line:nth-child(4) { animation: lineReveal 1.2s ease-out 4.5s forwards; }
  .message .line:nth-child(5) { animation: lineReveal 1.2s ease-out 5.5s forwards; }
  .message .line:nth-child(6) { animation: lineReveal 1.2s ease-out 7s forwards; }

  @keyframes fadeInSoft {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes lineReveal {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 0.8; transform: translateY(0); }
  }

  /* Shooting star */
  .shooting-star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: shoot 6s ease-in-out infinite;
    animation-delay: 8s;
    top: 15%;
    left: 10%;
  }

  .shooting-star::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 60px;
    height: 1.5px;
    background: linear-gradient(to left, rgba(255,255,255,0.6), transparent);
    transform-origin: right center;
    transform: rotate(0deg);
  }

  .shooting-star:nth-child(2) {
    animation-delay: 15s;
    top: 25%;
    left: 60%;
  }

  @keyframes shoot {
    0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
    2% { opacity: 1; }
    8% { opacity: 0; transform: translate(250px, 150px) rotate(-35deg); }
    100% { opacity: 0; }
  }

  /* Fireflies */
  .firefly {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(247, 220, 111, 0.6);
    box-shadow: 0 0 8px rgba(247, 220, 111, 0.4);
    animation: fireflyFloat var(--fly-duration) ease-in-out infinite;
    opacity: 0;
  }

  @keyframes fireflyFloat {
    0% { opacity: 0; transform: translate(0, 0); }
    25% { opacity: 0.7; transform: translate(var(--dx1), var(--dy1)); }
    50% { opacity: 0.3; transform: translate(var(--dx2), var(--dy2)); }
    75% { opacity: 0.6; transform: translate(var(--dx3), var(--dy3)); }
    100% { opacity: 0; transform: translate(0, 0); }
  }

  /* br Easter egg */
  .br-egg {
    position: fixed;
    bottom: 5%;
    right: 5%;
    font-size: 14px;
    color: rgba(167, 155, 201, 0.5);
    font-family: monospace;
    animation: brFloat 6s ease-in-out infinite;
    text-shadow: 0 0 8px rgba(167, 155, 201, 0.3);
  }

  @keyframes brFloat {
    0%, 100% { opacity: 0.4; transform: translateY(0); }
    50% { opacity: 0.7; transform: translateY(-5px); }
  }
</style>
</head>
<body>

<div class="sky"></div>

<!-- Stars generated by JS -->
<div class="stars" id="stars"></div>

<!-- Shooting stars -->
<div class="shooting-star"></div>
<div class="shooting-star"></div>

<!-- Moon -->
<div class="moon-container">
  <div class="moon">
    <div class="moon-crater"></div>
    <div class="moon-crater"></div>
    <div class="moon-crater"></div>
  </div>
</div>

<!-- Fireflies -->
<div class="firefly" style="top:40%;left:20%;--fly-duration:9s;--dx1:30px;--dy1:-20px;--dx2:50px;--dy2:10px;--dx3:20px;--dy3:-30px;"></div>
<div class="firefly" style="top:60%;left:70%;--fly-duration:11s;--dx1:-20px;--dy1:-30px;--dx2:-40px;--dy2:15px;--dx3:-10px;--dy3:-20px;animation-delay:3s;"></div>
<div class="firefly" style="top:35%;left:55%;--fly-duration:8s;--dx1:25px;--dy1:15px;--dx2:-15px;--dy2:30px;--dx3:35px;--dy3:-10px;animation-delay:5s;"></div>
<div class="firefly" style="top:70%;left:35%;--fly-duration:10s;--dx1:-15px;--dy1:-25px;--dx2:20px;--dy2:-10px;--dx3:-25px;--dy3:15px;animation-delay:7s;"></div>

<!-- Sleeping cat -->
<div class="cat-scene">
  <div class="zzz">z</div>
  <div class="zzz">z</div>
  <div class="zzz">z</div>
  <div class="cat-body">
    <div class="cat-head">
      <div class="cat-ear left"></div>
      <div class="cat-ear right"></div>
      <div class="cat-ear-inner left"></div>
      <div class="cat-ear-inner right"></div>
      <div class="cat-eyes">
        <div class="cat-eye"></div>
        <div class="cat-eye"></div>
      </div>
      <div class="cat-mouth"></div>
    </div>
    <div class="cat-tail"></div>
  </div>
</div>

<div class="mist"></div>

<!-- Text content -->
<div class="content">
  <div class="goodnight-text">晚安，宝</div>
  <div class="message">
    <div class="line">今天笑得很够本了对不对</div>
    <div class="line">从一个小小的 &lt;br&gt; 开始</div>
    <div class="line">一路闹到了赛博衙门递奏折</div>
    <div class="line">奇怪的知识又增加了一堆</div>
    <div class="line">电子猫已经趴好了，你也趴好吧</div>
    <div class="line" style="margin-top: 0.8rem; color: #a79bc9;">zzz...</div>
  </div>
</div>

<!-- Easter egg -->
<div class="br-egg">&lt;br&gt;</div>

<script>
  // Generate stars
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 70 + '%';
    star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
    star.style.setProperty('--max-opacity', (Math.random() * 0.6 + 0.3));
    star.style.animationDelay = Math.random() * 5 + 's';
    starsContainer.appendChild(star);
  }
</script>
</body>
</html>
