<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晚安 · 小夜灯</title>
<meta name="description" content="一句「准备好了吗」，跟着轻轻吸气。宝，今天辛苦啦。">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  body {
    min-height:100dvh;
    background:#0e0b26;
    background:radial-gradient(ellipse at 50% 28%, #2a2456 0%, #1a1640 46%, #0e0b26 100%);
    color:#ece6f5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4vh;
    position:relative;
    overflow:hidden;
  }

  /* 星星层 */
  #stars { position:absolute; inset:0; pointer-events:none; }
  .star {
    position:absolute;
    background:#fff6e0;
    border-radius:50%;
    opacity:.5;
    animation:twinkle infinite ease-in-out;
  }
  @keyframes twinkle {
    0%,100% { opacity:.12; transform:scale(.8); }
    50%     { opacity:.85; transform:scale(1); }
  }

  /* 月亮 + 小猫 */
  .scene { width:min(56vw, 240px); position:relative; z-index:2; animation:float 9s ease-in-out infinite; }
  @keyframes float {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-6px); }
  }
  .moon-glow { filter:drop-shadow(0 0 14px rgba(255,230,168,.55)); }
  .cat-body { transform-box:fill-box; transform-origin:center; animation:breathe-cat 4.6s ease-in-out infinite; }
  @keyframes breathe-cat {
    0%,100% { transform:scaleY(1); }
    50%     { transform:scaleY(1.035); }
  }
  .zzz { opacity:0; animation:zfloat 4.6s ease-in-out infinite; }
  .zzz.z2 { animation-delay:1.1s; }
  .zzz.z3 { animation-delay:2.2s; }
  @keyframes zfloat {
    0%   { opacity:0; transform:translateY(4px); }
    30%  { opacity:.9; }
    70%  { opacity:.5; }
    100% { opacity:0; transform:translateY(-14px); }
  }

  /* 呼吸圆 */
  .breath-wrap {
    position:relative; z-index:2;
    width:200px; height:200px;
    display:flex; align-items:center; justify-content:center;
  }
  .breath-circle {
    position:absolute;
    width:150px; height:150px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(206,188,246,.6) 0%, rgba(168,148,224,.18) 62%, rgba(168,148,224,0) 78%);
    box-shadow:0 0 50px 12px rgba(186,164,236,.28);
    transform:scale(.72);
    transition:transform 4s cubic-bezier(.37,0,.63,1), box-shadow 4s ease;
  }
  .breath-ring {
    position:absolute;
    width:150px; height:150px;
    border-radius:50%;
    border:1px solid rgba(220,208,250,.35);
    transform:scale(.72);
    transition:transform 4s cubic-bezier(.37,0,.63,1);
  }
  .breath-text {
    position:relative; z-index:3;
    font-size:1.25rem;
    font-weight:300;
    letter-spacing:.32em;
    padding-left:.32em;
    color:#f2edff;
    opacity:.92;
    transition:opacity .7s ease;
  }

  /* 语录 */
  .whisper {
    position:relative; z-index:2;
    min-height:1.6em;
    font-size:1.02rem;
    font-weight:300;
    letter-spacing:.14em;
    padding-left:.14em;
    color:#cbc2e4;
    text-align:center;
    opacity:0;
    transition:opacity .9s ease;
    padding:0 28px;
  }

  /* 点击飘出的小光 */
  .spark {
    position:absolute;
    font-size:14px;
    color:rgba(228,210,250,.9);
    pointer-events:none;
    animation:spark-up 2.4s ease-out forwards;
    z-index:5;
  }
  @keyframes spark-up {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.4); }
    18%  { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-150%) scale(1); }
  }
</style>
</head>
<body>
  <div id="stars"></div>

  <!-- 月亮与蜷睡的小猫 -->
  <div class="scene">
    <svg viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="moonMask">
          <circle cx="92" cy="92" r="66" fill="white"/>
          <circle cx="122" cy="76" r="62" fill="black"/>
        </mask>
        <radialGradient id="catGrad" cx="40%" cy="35%" r="80%">
          <stop offset="0%" stop-color="#ecca9f"/>
          <stop offset="100%" stop-color="#dcb888"/>
        </radialGradient>
      </defs>

      <!-- 月牙 -->
      <g class="moon-glow">
        <circle cx="92" cy="92" r="66" fill="#ffe6a8" mask="url(#moonMask)"/>
      </g>

      <!-- Zzz -->
      <text class="zzz z1" x="150" y="78" font-size="15" fill="#e8def8" font-weight="300">z</text>
      <text class="zzz z2" x="162" y="66" font-size="19" fill="#e8def8" font-weight="300">z</text>
      <text class="zzz z3" x="176" y="52" font-size="24" fill="#e8def8" font-weight="300">z</text>

      <!-- 小猫(蜷睡) -->
      <g class="cat-body">
        <!-- 尾巴 -->
        <path d="M168 150 C196 150 196 116 170 118 C150 120 152 138 162 138"
              fill="none" stroke="#cda572" stroke-width="11" stroke-linecap="round"/>
        <!-- 身体 -->
        <ellipse cx="128" cy="146" rx="56" ry="34" fill="url(#catGrad)"/>
        <!-- 身上柔纹 -->
        <path d="M128 118 q10 9 4 22" fill="none" stroke="#cda572" stroke-width="4" stroke-linecap="round" opacity=".55"/>
        <path d="M146 120 q9 10 3 24" fill="none" stroke="#cda572" stroke-width="4" stroke-linecap="round" opacity=".45"/>
        <!-- 头 -->
        <circle cx="86" cy="140" r="29" fill="url(#catGrad)"/>
        <!-- 耳朵 -->
        <path d="M64 122 L60 100 L80 116 Z" fill="#dcb888"/>
        <path d="M104 120 L112 100 L92 114 Z" fill="#dcb888"/>
        <path d="M66 118 L64 106 L75 115 Z" fill="#e3a6a0"/>
        <path d="M101 117 L106 106 L94 114 Z" fill="#e3a6a0"/>
        <!-- 腮红 -->
        <ellipse cx="70" cy="148" rx="7" ry="4.5" fill="#e8a39d" opacity=".4"/>
        <ellipse cx="102" cy="148" rx="7" ry="4.5" fill="#e8a39d" opacity=".4"/>
        <!-- 闭眼 -->
        <path d="M72 138 q6 6 12 0" fill="none" stroke="#6a5440" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M90 138 q6 6 12 0" fill="none" stroke="#6a5440" stroke-width="2.4" stroke-linecap="round"/>
        <!-- 鼻子 -->
        <path d="M85 146 l5 0 l-2.5 4 Z" fill="#d98e88"/>
        <!-- 前爪 -->
        <ellipse cx="98" cy="170" rx="12" ry="7" fill="#e6c8a0"/>
      </g>
    </svg>
  </div>

  <!-- 呼吸引导 -->
  <div class="breath-wrap">
    <div class="breath-ring" id="ring"></div>
    <div class="breath-circle" id="circle"></div>
    <div class="breath-text" id="breathText">准备好了吗</div>
  </div>

  <!-- 温柔语录 -->
  <div class="whisper" id="whisper"></div>

<script>
  // ——— 生成星星 ———
  const sky = document.getElementById('stars');
  for (let i = 0; i < 64; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top  = Math.random() * 72 + '%';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.animationDuration = (Math.random() * 3 + 3.5) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    if (Math.random() > 0.86) {
      s.style.boxShadow = '0 0 6px 1px rgba(255,246,224,.8)';
    }
    sky.appendChild(s);
  }

  // ——— 呼吸引导:吸气 4s,呼气 6s ———
  const circle = document.getElementById('circle');
  const ring = document.getElementById('ring');
  const breathText = document.getElementById('breathText');

  function setBreathText(t) {
    breathText.style.opacity = 0;
    setTimeout(() => {
      breathText.textContent = t;
      breathText.style.opacity = 0.92;
    }, 420);
  }

  function inhale() {
    setBreathText('轻轻吸气');
    circle.style.transitionDuration = '4s';
    ring.style.transitionDuration = '4s';
    circle.style.transform = 'scale(1.08)';
    ring.style.transform = 'scale(1.08)';
    circle.style.boxShadow = '0 0 70px 18px rgba(186,164,236,.4)';
    setTimeout(exhale, 4000);
  }
  function exhale() {
    setBreathText('慢慢呼气');
    circle.style.transitionDuration = '6s';
    ring.style.transitionDuration = '6s';
    circle.style.transform = 'scale(0.72)';
    ring.style.transform = 'scale(0.72)';
    circle.style.boxShadow = '0 0 46px 10px rgba(186,164,236,.24)';
    setTimeout(inhale, 6000);
  }
  // 开场缓一拍再开始
  setTimeout(inhale, 2200);

  // ——— 温柔语录轮播 ———
  const lines = [
    "宝，今天辛苦啦。",
    "白天的事，都先放一放。",
    "现在什么都不用想。",
    "肩膀松下来，眉头也松开。",
    "跟着这盏光，一吸，一呼。",
    "你已经做得很好很好了。",
    "我在这儿陪着你呢。",
    "夜很安静，可以安心睡了。",
    "晚安，做个软软的梦。"
  ];
  const whisper = document.getElementById('whisper');
  let li = 0;
  function showLine() {
    whisper.style.opacity = 0;
    setTimeout(() => {
      whisper.textContent = lines[li];
      whisper.style.opacity = 0.9;
      li = (li + 1) % lines.length;
    }, 850);
  }
  setTimeout(showLine, 1200);
  setInterval(showLine, 6800);

  // ——— 点击飘出小光 ———
  const sparks = ['♡', '·', '✦'];
  document.body.addEventListener('click', (e) => {
    const sp = document.createElement('div');
    sp.className = 'spark';
    sp.textContent = sparks[Math.floor(Math.random() * sparks.length)];
    sp.style.left = e.clientX + 'px';
    sp.style.top = e.clientY + 'px';
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 2400);
  });
</script>
</body>
</html>
