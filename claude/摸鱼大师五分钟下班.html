<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摸鱼大师五分钟下班</title>
<meta name="description" content="在假装工作和摸鱼之间来回切，避开老板巡查，撑满五分钟就下班。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<h2 class="sr-only">摸鱼小游戏：在假装工作和摸鱼之间切换，避开老板巡查，撑到下班。</h2>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mv-cell{border:0.5px solid var(--border);padding:6px 8px;font-size:13px;color:var(--text-secondary);font-family:var(--font-mono)}
.mv-stat{background:var(--surface-1);border-radius:var(--radius);padding:12px}
.mv-lbl{font-size:13px;color:var(--text-muted);margin:0}
.mv-num{font-size:24px;font-weight:500;margin:2px 0 0;color:var(--text-primary)}
.mv-fun{font-size:14px;color:var(--text-secondary);padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--surface-2);text-align:left}
.mv-fun:hover{background:var(--surface-1)}
</style>

<div style="padding:1rem 0">

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:1rem">
    <div class="mv-stat"><p class="mv-lbl">距离下班</p><p class="mv-num" id="mv-clock">05:00</p></div>
    <div class="mv-stat"><p class="mv-lbl">快乐值</p><p class="mv-num" id="mv-joy">0</p></div>
    <div class="mv-stat"><p class="mv-lbl">剩余机会</p><p class="mv-num" id="mv-life">3</p></div>
  </div>

  <div id="mv-alert" style="background:var(--surface-1);border-radius:var(--radius);padding:12px 14px;margin-bottom:1rem;font-size:14px;color:var(--text-secondary);display:flex;align-items:center;gap:8px">
    <i class="ti ti-coffee" style="font-size:18px" aria-hidden="true"></i><span id="mv-alert-txt">办公室很安静，快乐尚未开始积累。</span>
  </div>

  <div id="mv-stage" style="min-height:190px;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-2);padding:14px;margin-bottom:1rem"></div>

  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <button id="mv-toggle" style="flex:1;min-width:180px">开始摸鱼</button>
    <button id="mv-restart" style="min-width:100px">重开</button>
  </div>

</div>

<script>
(function(){
  var T=300, joy=0, life=3, fishing=false, over=false, phase='idle', warnAt=0, tick=null;
  var clock=document.getElementById('mv-clock'), joyEl=document.getElementById('mv-joy'), lifeEl=document.getElementById('mv-life');
  var alertTxt=document.getElementById('mv-alert-txt'), alertBox=document.getElementById('mv-alert'), alertIcon=alertBox.querySelector('i');
  var stage=document.getElementById('mv-stage'), btn=document.getElementById('mv-toggle'), rs=document.getElementById('mv-restart');
  var fun=[['ti-device-mobile','偷刷小红书','+8'],['ti-cup','去接第四杯水','+6'],['ti-shopping-cart','把购物车再看一遍','+9'],['ti-cat','看猫猫视频','+12'],['ti-message-circle','和同事微信吐槽','+7']];
  var rows=[['SKU','销量','转化率','库存'],['ACV-001','128','4.2%','340'],['ACV-002','96','3.8%','512'],['KST-114','214','5.1%','88'],['KST-115','47','2.3%','903']];

  function excel(){
    var h='<div style="font-size:13px;color:var(--text-muted);margin:0 0 10px;display:flex;align-items:center;gap:6px"><i class="ti ti-table" style="font-size:16px" aria-hidden="true"></i>销售数据_8月_最终版_v7.xlsx</div><table style="width:100%;border-collapse:collapse;table-layout:fixed">';
    rows.forEach(function(r,i){h+='<tr>';r.forEach(function(c){h+='<td class="mv-cell"'+(i===0?' style="color:var(--text-primary);font-weight:500"':'')+'>'+c+'</td>';});h+='</tr>';});
    return h+'</table>';
  }
  function fishPanel(){
    var h='<div style="font-size:13px;color:var(--text-muted);margin:0 0 10px;display:flex;align-items:center;gap:6px"><i class="ti ti-fish" style="font-size:16px" aria-hidden="true"></i>摸鱼中，点点这些还能多赚一点</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">';
    fun.forEach(function(f,i){h+='<button class="mv-fun" data-i="'+i+'"><i class="ti '+f[0]+'" style="font-size:16px;vertical-align:-2px;margin-right:8px" aria-hidden="true"></i>'+f[1]+' <span style="color:var(--text-accent)">'+f[2]+'</span></button>';});
    return h+'</div>';
  }
  function bindFun(){
    stage.querySelectorAll('.mv-fun').forEach(function(b){
      b.onclick=function(){ if(!fishing||over)return; joy+=parseInt(fun[+b.dataset.i][2],10); joyEl.textContent=joy; b.style.opacity='0.45'; b.disabled=true;
        setTimeout(function(){b.style.opacity='1';b.disabled=false;},2500); };
    });
  }
  function say(icon,txt){ alertIcon.className='ti '+icon; alertTxt.textContent=txt; }
  function render(){ stage.innerHTML = fishing?fishPanel():excel(); if(fishing)bindFun(); btn.textContent = fishing?'假装工作':'开始摸鱼'; }

  function caught(){
    life--; joy=Math.max(0,joy-30); lifeEl.textContent=life; joyEl.textContent=joy;
    fishing=false; phase='idle'; render();
    if(life<=0){ finish(false); } else { say('ti-alert-triangle','被逮到了，快乐值 -30。老板意味深长地看了你一眼。'); }
  }
  function finish(win){
    over=true; clearInterval(tick); btn.disabled=true; btn.textContent='已结束';
    if(win){ say('ti-confetti','下班铃响了，你带着 '+joy+' 点快乐走出办公室。'); stage.innerHTML='<div style="text-align:center;padding:28px 0"><i class="ti ti-door-exit" style="font-size:36px;color:var(--text-success)" aria-hidden="true"></i><p style="font-size:18px;font-weight:500;margin:10px 0 4px">下班啦</p><p style="font-size:14px;color:var(--text-secondary);margin:0">今日摸鱼评级：'+(joy>400?'摸鱼大师':joy>200?'资深选手':'谨慎新人')+'</p></div>'; }
    else { say('ti-writing','三次了。检讨书 800 字，明早交。'); stage.innerHTML='<div style="text-align:center;padding:28px 0"><i class="ti ti-mood-sad" style="font-size:36px;color:var(--text-danger)" aria-hidden="true"></i><p style="font-size:18px;font-weight:500;margin:10px 0 4px">被请去喝茶了</p><p style="font-size:14px;color:var(--text-secondary);margin:0">最终快乐值 '+joy+'，点重开再战。</p></div>'; }
  }

  function loop(){
    if(over)return;
    T--; var m=Math.floor(T/60), s=T%60;
    clock.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    if(T<=0){ finish(true); return; }
    if(fishing&&phase!=='here'){ joy+=2; joyEl.textContent=joy; }

    if(phase==='idle'&&Math.random()<0.16){ phase='warn'; warnAt=T; say('ti-footprint','走廊传来脚步声……'); }
    else if(phase==='warn'&&warnAt-T>=2){ phase='here'; say('ti-eye','老板站在你身后。'); if(fishing){ caught(); return; } }
    else if(phase==='here'&&Math.random()<0.5){ phase='idle'; say('ti-coffee','老板走远了，安全。'); }
  }

  btn.onclick=function(){ if(over)return; fishing=!fishing; render(); if(fishing&&phase==='idle')say('ti-fish','摸鱼进行中，注意走廊动静。'); };
  rs.onclick=function(){ T=301; joy=0; life=3; fishing=false; over=false; phase='idle'; btn.disabled=false;
    joyEl.textContent=0; lifeEl.textContent=3; say('ti-coffee','重新开始，办公室很安静。'); render();
    clearInterval(tick); tick=setInterval(loop,1000); };

  render(); tick=setInterval(loop,1000);
})();
</script>
</body>
</html>
