<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摸鱼小游戏点单台</title>
<meta name="description" content="十种小游戏的点菜单，一张卡一种玩法，最后一张是「打破第四面墙」。">
</head>
<body>
<h2 class="sr-only">轻量小游戏类型菜单：十种类型，点击任意一张卡片即可让 Claude 制作那个类型的小游戏。</h2>
<style>
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", sans-serif;
  --font-mono: ui-monospace, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif, ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);
}
body{max-width:380px;margin:0 auto;padding-top:44px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.mn{padding:1rem 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.gc{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s}
.gc:hover{border-color:var(--border-strong);background:var(--surface-1)}
.gt{font-size:15px;color:var(--text-primary);margin:0 0 4px}
.gd{font-size:12px;color:var(--text-secondary);margin:0}
.gc.hi{border:2px solid var(--border-accent)}
.bd{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent);margin-bottom:6px}
</style>
<div class="mn" id="mn"></div>
<script>
(function(){
var M=[
['收纳整理','把乱的东西归位',0],
['三消','凑够数量就消失',0],
['泡泡纸','一格一格戳破',0],
['揉捏玩具','没有目标，只有手感',0],
['叠高','卡准时机再落下',0],
['扫雷','用数字反推格子',0],
['猜词','每天限一局',0],
['钩子','黄金矿工那一支',0],
['挂机养成','放着不管也在长',0],
['打破第四面墙','规则藏在游戏之外',1]
];
var mn=document.getElementById('mn');
M.forEach(function(m){
  var d=document.createElement('div');
  d.className='gc'+(m[2]?' hi':'');
  d.innerHTML=(m[2]?'<span class="bd">最像你的口味</span>':'')+'<p class="gt">'+m[0]+' ↗</p><p class="gd">'+m[1]+'</p>';
  d.onclick=function(){sendPrompt('做一个「'+m[0]+'」类型的小游戏给我，还是聊天窗口这么大就好');};
  mn.appendChild(d);
});
})();
</script>
</body>
</html>
