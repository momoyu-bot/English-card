<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>晨雾湖面钓鱼</title>
</head>
<body>
<h2 class="imgn-sr">一个钓鱼摸鱼小游戏：甩竿、等待鱼漂下沉、及时起竿收获各种渔获并集齐图鉴。</h2>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.imgn-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.imgn-frame{border-radius:var(--border-radius-lg);overflow:hidden;background:#9BBDB6;line-height:0;}
.imgn-frame svg{display:block;width:100%;height:auto;}
.imgn-status{font-size:16px;color:var(--color-text-primary);text-align:center;min-height:24px;margin:1rem 0 0.85rem;}
.imgn-card{display:flex;align-items:center;gap:14px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:14px 16px;}
.imgn-ic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;}
.imgn-name{font-size:17px;font-weight:500;color:var(--color-text-primary);}
.imgn-line{font-size:15px;color:var(--color-text-secondary);margin-top:3px;line-height:1.5;}
.imgn-rar{font-size:12px;padding:2px 9px;border-radius:var(--border-radius-md);margin-left:8px;font-weight:500;}
.imgn-common{background:var(--color-background-tertiary);color:var(--color-text-secondary);}
.imgn-uncommon{background:var(--color-background-info);color:var(--color-text-info);}
.imgn-rare{background:var(--color-background-warning);color:var(--color-text-warning);}
.imgn-legend{background:var(--color-background-danger);color:var(--color-text-danger);}
.imgn-miss{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:16px;text-align:center;color:var(--color-text-secondary);font-size:15px;}
.imgn-wait{padding:16px;text-align:center;color:var(--color-text-tertiary);font-size:14px;}
.imgn-stat{font-size:14px;color:var(--color-text-secondary);margin:1.1rem 0 0.55rem;}
.imgn-stat b{color:var(--color-text-primary);font-weight:500;}
.imgn-cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:8px;}
.imgn-cell{aspect-ratio:1;background:var(--color-background-secondary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;}
.imgn-q{color:var(--color-text-tertiary);font-size:18px;}
.imgn-urgent{background:var(--color-background-danger)!important;color:var(--color-text-danger)!important;border-color:var(--color-border-danger)!important;animation:imgn-pulse 0.6s ease-in-out infinite;}
@keyframes imgn-pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
<div style="padding:0.5rem 0;">
<div class="imgn-frame">
<svg width="100%" viewBox="0 0 680 300" role="img">
<meta name="description" content="甩竿、等鱼漂沉下去、及时起竿，慢慢集齐九种渔获。"><desc>雾蒙蒙的湖面，远山、芦苇与一根伸入水中的钓竿，水面浮着鱼漂。</desc>
<rect x="0" y="0" width="680" height="167" fill="#DDE8E5"/>
<path d="M0 167 L120 139 L240 158 L380 137 L520 156 L680 141 L680 167 Z" fill="#B3C9C1"/>
<path d="M0 167 L90 151 L200 162 L320 148 L460 160 L600 150 L680 157 L680 167 Z" fill="#C6D8D1"/>
<rect x="0" y="165" width="680" height="135" fill="#9BBDB6"/>
<rect x="0" y="252" width="680" height="48" fill="#8AAEA7"/>
<g stroke="#BAD3CD" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
<line x1="250" y1="192" x2="430" y2="192"/>
<line x1="180" y1="218" x2="360" y2="218"/>
<line x1="300" y1="242" x2="500" y2="242"/>
</g>
<g stroke="#6E8C80" stroke-width="2.5" stroke-linecap="round" fill="none">
<path d="M48 300 C46 250 50 230 46 206"/>
<path d="M62 300 C64 255 58 236 62 211"/>
<path d="M76 300 C74 260 80 246 76 226"/>
</g>
<g fill="#B49A78">
<ellipse cx="46" cy="201" rx="3.5" ry="9"/>
<ellipse cx="62" cy="206" rx="3.5" ry="9"/>
<ellipse cx="76" cy="221" rx="3" ry="8"/>
</g>
<path d="M680 18 L636 56" stroke="#936F4A" stroke-width="5" stroke-linecap="round"/>
<line x1="637" y1="55" x2="382" y2="160" stroke="#707068" stroke-width="1"/>
<ellipse cx="382" cy="180" rx="5" ry="2" fill="none" stroke="#E6F0EC" stroke-width="1.5">
<animate attributeName="rx" values="5;46" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="ry" values="2;15" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="382" cy="180" rx="5" ry="2" fill="none" stroke="#E6F0EC" stroke-width="1.5">
<animate attributeName="rx" values="5;46" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
<animate attributeName="ry" values="2;15" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.55;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
</ellipse>
<g id="imgn-bobber" transform="translate(382,168)">
<line x1="0" y1="-9" x2="0" y2="-4" stroke="#555" stroke-width="1"/>
<circle cx="0" cy="0" r="5" fill="#DD4B4A"/>
<path d="M-5 0 A5 5 0 0 0 5 0 Z" fill="#F5F1EA"/>
</g>
</svg>
</div>
<div class="imgn-status" id="imgn-status">湖面雾蒙蒙的，很安静。要不，甩一竿试试？</div>
<div id="imgn-catch"><div class="imgn-wait">你的渔获会出现在这里～</div></div>
<button type="button" id="imgn-btn" style="width:100%;padding:12px;font-size:16px;margin-top:0.85rem;">甩竿下水</button>
<div class="imgn-stat">今日渔获 <b id="imgn-count">0</b> 条 · 图鉴 <b id="imgn-dexn">0</b>/9</div>
<div class="imgn-cells" id="imgn-cells">
<div class="imgn-cell" id="imgn-dex-crucian" title="小鲫鱼"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-bitterling" title="小鳑鲏"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-grass" title="草鱼"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-boot" title="旧靴子"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-weed" title="一把水草"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-bottle" title="漂流瓶"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-koi" title="锦鲤"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-chest" title="小宝箱"><span class="imgn-q">?</span></div>
<div class="imgn-cell" id="imgn-dex-talkfish" title="会说话的鱼"><span class="imgn-q">?</span></div>
</div>
</div>
<script>
(function(){
var bob=document.getElementById('imgn-bobber');
var statusEl=document.getElementById('imgn-status');
var catchEl=document.getElementById('imgn-catch');
var btn=document.getElementById('imgn-btn');
var countEl=document.getElementById('imgn-count');
var dexnEl=document.getElementById('imgn-dexn');
var state='idle',count=0,raf=null,t=0,biteT=null,escT=null;
var dex={};
var NOTES=['今天也辛苦啦，记得喝口水。','摸鱼一时爽，一直摸鱼一直爽。','捡到这张纸条的人，今天会顺顺利利。','别太用力，松弛一点也没关系的。','你已经做得很好了，真的。','偷得浮生半日闲，挺好。'];
var TALK=['上班不好好上，跑这儿摸鱼？','放我回去，我还有 KPI 没完成呢。','你钓我，我钓你的摸鱼时间，扯平了。','鱼生建议：该划水时就大胆划水。','下次记得带个好点的饵，太寒酸了。'];
var EARLY=['唔，鱼漂还没动呢，沉住气。','心急吃不了热豆腐，再等等。','空钩一片诚意，鱼没领情。','起早了，水面连个泡都没冒。'];
var GONE=['哎呀，刚刚那条溜走了。','慢了半拍，鱼比你机灵。','水花一闪，什么都没留下。','它甩甩尾巴，跟你说拜拜。'];
var LOOT=[
{id:'crucian',name:'小鲫鱼',type:'fish',color:'#1D9E75',w:22,rar:'常见',rk:'common',line:'扑棱扑棱，挺有活力。'},
{id:'bitterling',name:'小鳑鲏',type:'fish',color:'#378ADD',w:20,rar:'常见',rk:'common',line:'亮闪闪的小不点，巴掌都不够大。'},
{id:'grass',name:'草鱼',type:'fish',color:'#5E9A1F',w:18,rar:'常见',rk:'common',line:'沉甸甸的，今天的口粮加一。'},
{id:'boot',name:'旧靴子',type:'boot',color:'#7E7D76',w:12,rar:'不常见',rk:'uncommon',line:'……这是谁的鞋？还在滴水。'},
{id:'weed',name:'一把水草',type:'weed',color:'#3B6D11',w:11,rar:'不常见',rk:'uncommon',line:'空欢喜一场，缠了一手草。'},
{id:'bottle',name:'漂流瓶',type:'bottle',color:'#185FA5',w:9,rar:'不常见',rk:'uncommon',line:''},
{id:'koi',name:'锦鲤',type:'koi',color:'#E8941F',w:5,rar:'稀有',rk:'rare',line:'金红的一道光——今天会有好运哦。'},
{id:'chest',name:'小宝箱',type:'chest',color:'#A86A12',w:3,rar:'稀有',rk:'rare',line:'打开一看，是几枚发绿的铜板。'},
{id:'talkfish',name:'会说话的鱼',type:'fish',color:'#D4537E',w:1,rar:'传说',rk:'legend',line:''}
];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickLoot(){var tot=0,i;for(i=0;i<LOOT.length;i++)tot+=LOOT[i].w;var r=Math.random()*tot;for(i=0;i<LOOT.length;i++){r-=LOOT[i].w;if(r<=0)return LOOT[i];}return LOOT[0];}
function icon(t,c,s){var o='width="'+s+'" height="'+s+'" viewBox="0 0 32 32"';
if(t==='fish')return '<svg '+o+' fill="'+c+'"><ellipse cx="14" cy="16" rx="11" ry="7"/><path d="M23 16 L31 10 L31 22 Z"/><circle cx="9" cy="14" r="1.6" fill="#fff"/></svg>';
if(t==='koi')return '<svg '+o+' fill="'+c+'"><ellipse cx="14" cy="16" rx="11" ry="7"/><path d="M23 16 L31 10 L31 22 Z"/><circle cx="9" cy="14" r="1.6" fill="#fff"/><circle cx="14" cy="13" r="2.4" fill="#E24B4A"/><circle cx="19" cy="18" r="1.7" fill="#E24B4A"/></svg>';
if(t==='boot')return '<svg '+o+' fill="'+c+'"><path d="M12 5 L17 5 L17 19 L25 19 Q27 19 27 22 L27 25 Q27 27 25 27 L12 27 Z"/></svg>';
if(t==='weed')return '<svg '+o+' fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round"><path d="M11 28 C8 22 14 20 11 14 C9 9 13 7 12 5"/><path d="M17 28 C20 22 14 19 18 13 C20 9 17 7 18 5"/><path d="M22 28 C24 23 20 21 23 17"/></svg>';
if(t==='bottle')return '<svg '+o+'><rect x="6" y="11" width="17" height="10" rx="5" fill="'+c+'"/><rect x="9" y="14" width="6" height="4" rx="0.5" fill="#fff"/><rect x="22" y="13" width="4" height="6" rx="1" fill="#9C7A4F"/></svg>';
if(t==='chest')return '<svg '+o+' fill="'+c+'"><path d="M5 13 Q5 8 11 8 L21 8 Q27 8 27 13 L27 14 L5 14 Z"/><rect x="5" y="14" width="22" height="11" rx="1.5"/><rect x="14" y="15.5" width="4" height="5" rx="1" fill="#fff"/></svg>';
return '';}
function loop(){t+=0.04;var y;if(state==='bite'){y=173+Math.sin(t*9)*1.6;}else{y=168+Math.sin(t)*3;}bob.setAttribute('transform','translate(382,'+y.toFixed(2)+')');raf=requestAnimationFrame(loop);}
function setBtn(txt,urg){btn.textContent=txt;if(urg)btn.classList.add('imgn-urgent');else btn.classList.remove('imgn-urgent');}
function cast(){state='waiting';statusEl.textContent='鱼漂入水，随波轻轻晃……屏住呼吸。';catchEl.innerHTML='<div class="imgn-wait">等一条鱼上钩…</div>';setBtn('起竿',false);clearTimeout(biteT);clearTimeout(escT);biteT=setTimeout(bite,1800+Math.random()*3500);}
function bite(){state='bite';statusEl.textContent='鱼漂猛地一沉——快收竿！';setBtn('起竿！',true);escT=setTimeout(escape,1400);}
function tooEarly(){clearTimeout(biteT);state='result';statusEl.textContent='再耐心一点点～';catchEl.innerHTML='<div class="imgn-miss">'+pick(EARLY)+'</div>';setBtn('再来一竿',false);}
function escape(){state='result';statusEl.textContent='唉，慢了半拍……';catchEl.innerHTML='<div class="imgn-miss">'+pick(GONE)+'</div>';setBtn('再来一竿',false);}
function updateDex(id){if(!dex[id]){dex[id]=1;var n=0;for(var k in dex)n++;dexnEl.textContent=n;var l;for(var i=0;i<LOOT.length;i++)if(LOOT[i].id===id)l=LOOT[i];var cell=document.getElementById('imgn-dex-'+id);if(cell)cell.innerHTML=icon(l.type,l.color,24);}}
function success(){clearTimeout(escT);state='result';var l=pickLoot();var line=l.line;if(l.id==='bottle')line=pick(NOTES);if(l.id==='talkfish')line=pick(TALK);statusEl.textContent='上钩啦！';count++;countEl.textContent=count;updateDex(l.id);catchEl.innerHTML='<div class="imgn-card"><div class="imgn-ic">'+icon(l.type,l.color,32)+'</div><div class="imgn-meta"><div class="imgn-name">'+l.name+'<span class="imgn-rar imgn-'+l.rk+'">'+l.rar+'</span></div><div class="imgn-line">「'+line+'」</div></div></div>';setBtn('再来一竿',false);}
btn.addEventListener('click',function(){if(state==='idle'||state==='result')cast();else if(state==='waiting')tooEarly();else if(state==='bite')success();});
loop();
})();
</script>
</body>
</html>
