<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>后台里的小动物</title>
<meta name="description" content="伪装成运营后台的表格，点冒出来的小动物得分，组长巡逻时记得切回正经模式。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<h2 class="sr-only">摸鱼小游戏：在伪装成运营后台的表格里点击出现的字符小动物得分，组长巡逻时要及时切换成正经模式。</h2>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.mfw{padding:1rem 0;font-size:14px}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface-1);border-radius:12px 12px 0 0;border:0.5px solid var(--border);border-bottom:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:0.5px solid var(--border);border-radius:0 0 12px 12px;overflow:hidden}
.cell{height:56px;display:flex;align-items:center;justify-content:center;border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);font-size:12px;color:var(--text-muted);font-family:var(--font-mono);cursor:default;user-select:none}
.cell.fish{background:var(--bg-accent);color:var(--text-accent);font-size:15px;font-family:var(--font-sans);cursor:pointer}
.cell.hit{background:var(--bg-success);color:var(--text-success)}
.alert{background:var(--bg-warning);color:var(--text-warning)}
.safe{background:var(--bg-success);color:var(--text-success)}
.tag{font-size:12px;padding:3px 10px;border-radius:var(--radius);white-space:nowrap}
</style>
<div class="mfw">
<div class="bar">
<span style="font-size:13px;color:var(--text-secondary);white-space:nowrap"><i class="ti ti-table" aria-hidden="true" style="font-size:16px;vertical-align:-2px"></i> 商品数据后台</span>
<span id="status" class="tag safe">同步正常</span>
<span style="flex:1"></span>
<span id="lives" style="color:var(--text-secondary);font-size:13px"></span>
<span style="font-size:13px;color:var(--text-secondary)">摸鱼币 <b id="score" style="font-weight:500;color:var(--text-primary)">0</b></span>
</div>
<div class="grid" id="grid"></div>
<div style="display:flex;align-items:center;gap:10px;margin-top:12px">
<button id="act" style="min-width:150px">开始上班</button>
<span id="tip" style="font-size:13px;color:var(--text-secondary)">点开始，然后专心「工作」。</span>
</div>
</div>
<script>
(function(){
var G=document.getElementById('grid'),S=document.getElementById('score'),L=document.getElementById('lives'),
ST=document.getElementById('status'),TIP=document.getElementById('tip'),ACT=document.getElementById('act');
var pets=['ฅ^•ω•^ฅ','(・×・)','( ｡• ᴗ •｡ )','(=ﾟωﾟ)ﾉ','><(((°>'];
var names=['猫猫','兔兔','克宝','Fable','小鱼'];
var lines=['猫猫被你捞走了','兔兔装作路过','克宝没有不好吃的义务','Fable掉了一颗橡果','这条鱼很配合'];
var cells=[],score=0,lives=3,playing=false,mode='idle',cur=-1,t1,t2,t3;
function fake(){var a='ABCDEFGHJKMNPQRSTUVWXYZ';return 'B0'+a[(Math.random()*23)|0]+((Math.random()*90+10)|0)+a[(Math.random()*23)|0];}
for(var i=0;i<20;i++){var d=document.createElement('div');d.className='cell';d.textContent=fake();d.dataset.i=i;cells.push(d);G.appendChild(d);}
function hearts(){var s='';for(var i=0;i<3;i++){s+='<i class="ti ti-heart" aria-hidden="true" style="font-size:15px;vertical-align:-2px;opacity:'+(i<lives?'1':'0.22')+'"></i>';}L.innerHTML=s;}
function clearFish(){if(cur>=0){cells[cur].className='cell';cells[cur].textContent=fake();cur=-1;}}
function spawn(){
  if(!playing||mode!=='work')return;
  clearFish();
  var k=(Math.random()*20)|0,p=(Math.random()*pets.length)|0;
  cur=k;cells[k].dataset.p=p;cells[k].className='cell fish';cells[k].textContent=pets[p];
  t1=setTimeout(function(){clearFish();t2=setTimeout(spawn,300+Math.random()*500);},900+Math.random()*500);
}
G.addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c||!playing)return;
  if(mode==='hide'){TIP.textContent='正经模式下手别乱动…';return;}
  if(+c.dataset.i!==cur||!c.classList.contains('fish'))return;
  clearTimeout(t1);score++;S.textContent=score;
  var p=+c.dataset.p;c.className='cell hit';c.textContent='+1';
  TIP.textContent=names[p]+'：'+lines[p];
  cur=-1;setTimeout(function(){c.className='cell';c.textContent=fake();},260);
  t2=setTimeout(spawn,250+Math.random()*400);
});
function patrol(){
  if(!playing)return;
  mode='alert';ST.className='tag alert';ST.textContent='组长正在靠近';
  ACT.textContent='切正经模式';TIP.textContent='快！两秒内切过去。';
  clearTimeout(t1);clearTimeout(t2);clearFish();
  t3=setTimeout(function(){
    if(mode==='alert'){lives--;hearts();TIP.textContent='组长：在忙什么呢？（-1）';
      if(lives<=0){return over();}
      mode='work';ST.className='tag safe';ST.textContent='同步正常';ACT.textContent='摸鱼中';
      t2=setTimeout(spawn,900);schedule();}
  },2000);
}
function schedule(){setTimeout(function(){if(playing&&mode==='work')patrol();},5000+Math.random()*6000);}
ACT.addEventListener('click',function(){
  if(!playing){start();return;}
  if(mode==='alert'){clearTimeout(t3);mode='hide';ST.className='tag safe';ST.textContent='认真核对中';
    ACT.textContent='躲一躲…';TIP.textContent='一动不动。组长在看你的屏幕。';
    setTimeout(function(){if(!playing)return;score+=2;S.textContent=score;
      mode='work';ST.className='tag safe';ST.textContent='同步正常';ACT.textContent='摸鱼中';
      TIP.textContent='走远了。继续捞。（躲过 +2）';t2=setTimeout(spawn,600);schedule();},2200);}
});
function start(){score=0;lives=3;playing=true;mode='work';S.textContent=0;hearts();
  ST.className='tag safe';ST.textContent='同步正常';ACT.textContent='摸鱼中';
  TIP.textContent='点表格里冒出来的小家伙。';t2=setTimeout(spawn,700);schedule();}
function over(){playing=false;mode='idle';clearTimeout(t1);clearTimeout(t2);clearFish();
  ST.className='tag alert';ST.textContent='已被抓包';ACT.textContent='再来一局';
  var r=score>=25?'摸鱼界の传说':score>=15?'资深潜水员':score>=8?'略有心得':'新手上路';
  TIP.textContent='下班！共捞到 '+score+' 枚摸鱼币 —— '+r;}
hearts();
})();
</script>
</body>
</html>
