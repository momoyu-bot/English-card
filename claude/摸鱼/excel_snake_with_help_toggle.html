<title>藏在报表里的贪吃蛇</title>
<meta name="description" content="表面是一张财务审计报表。回车开始，方向键移动，Esc 一键藏起来。">
<div style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">伪装成 Excel 表格的贪吃蛇小游戏，工具栏里有一个默认关闭、可随时开关的辅助模式按钮。</div>
<style>
.xg{display:grid;grid-template-columns:repeat(15,40px)}
.xc{width:40px;height:24px;box-sizing:border-box;border-right:1px solid #e6e4de;border-bottom:1px solid #e6e4de;padding:0 4px;font-size:11px;color:#3a3a38;display:flex;align-items:center;justify-content:flex-end;background:#fff;overflow:hidden}
.hd{background:#f7f6f3;color:#5f5e5a;justify-content:center}
.sb{background:#cfe6f7!important;color:transparent!important}
.sh{background:#107c41!important}
.fd{background:#ffe9a8!important;color:#8a5a00!important;justify-content:center}
.xt{width:40px;height:22px;box-sizing:border-box;border-right:1px solid #d8d6d0;font-size:11px;color:#5f5e5a;display:flex;align-items:center;justify-content:center;background:#f1efe8}
.xr{width:30px;height:24px;box-sizing:border-box;border-bottom:1px solid #d8d6d0;font-size:11px;color:#5f5e5a;display:flex;align-items:center;justify-content:center;background:#f1efe8}
.tb{font-size:11px;padding:3px 8px;border:0.5px solid #c8c6c0;border-radius:4px;background:#fff;color:#3a3a38;cursor:pointer;display:flex;align-items:center;gap:4px}
.tb.on{background:#e1f5ee;border-color:#0f6e56;color:#0f6e56}
.dp{width:22px;height:20px;border:0.5px solid #c8c6c0;border-radius:3px;background:#fff;color:#5f5e5a;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
</style>
<div style="padding:1rem 0">
<div style="background:var(--surface-1);border-radius:12px;padding:12px">
<div id="xl" tabindex="0" style="width:632px;max-width:100%;background:#fff;border:0.5px solid #d0cec8;border-radius:6px;overflow:hidden;outline:none;font-family:'Segoe UI',var(--font-sans);position:relative">

<div style="background:#107c41;color:#fff;height:34px;display:flex;align-items:center;padding:0 10px;font-size:12px;gap:8px">
<i class="ti ti-table" style="font-size:16px" aria-hidden="true"></i><span>Q3_年度财务审计报表.xlsx</span><span style="color:#a8dcc0;margin-left:auto;font-size:11px">已保存到这台电脑</span>
</div>

<div style="height:34px;background:#faf9f7;border-bottom:1px solid #e6e4de;display:flex;align-items:center;padding:0 8px;gap:8px">
<button class="tb" id="hb" aria-pressed="false"><i class="ti ti-lifebuoy" style="font-size:14px" aria-hidden="true"></i><span id="hbt">帮帮忙 · 关</span></button>
<div style="display:flex;gap:2px;margin-left:4px">
<button class="dp" id="dl" aria-label="左"><i class="ti ti-chevron-left" style="font-size:13px" aria-hidden="true"></i></button>
<div style="display:flex;flex-direction:column;gap:2px">
<button class="dp" id="du" style="height:9px" aria-label="上"><i class="ti ti-chevron-up" style="font-size:11px" aria-hidden="true"></i></button>
<button class="dp" id="dd" style="height:9px" aria-label="下"><i class="ti ti-chevron-down" style="font-size:11px" aria-hidden="true"></i></button>
</div>
<button class="dp" id="dr" aria-label="右"><i class="ti ti-chevron-right" style="font-size:13px" aria-hidden="true"></i></button>
</div>
<span style="font-size:11px;color:#8a8880;margin-left:auto">Enter 开始 · 方向键移动 · Esc 藏起来</span>
</div>

<div style="height:26px;background:#fff;border-bottom:1px solid #e6e4de;display:flex;align-items:center;padding:0 8px;font-size:11px;gap:8px">
<span id="nb" style="border:1px solid #d8d6d0;padding:1px 6px;color:#3a3a38;min-width:34px">A1</span>
<span style="color:#8a8880;font-style:italic">fx</span>
<span id="fx" style="color:#3a3a38">=SUM(C2:C10)*1.05</span>
</div>

<div style="display:flex;background:#fff">
<div style="width:30px"><div style="height:22px;border-right:1px solid #d8d6d0;border-bottom:1px solid #d8d6d0;background:#f1efe8"></div><div id="rh"></div></div>
<div><div id="ch" style="display:flex;border-bottom:1px solid #d8d6d0"></div><div id="gd" class="xg"></div></div>
</div>

<div style="height:24px;background:#f1efe8;border-top:1px solid #d8d6d0;display:flex;align-items:center;padding:0 10px;font-size:11px;color:#3a3a38;gap:10px">
<span id="st">就绪</span><span id="sc" style="color:#5f5e5a"></span><span style="margin-left:auto;color:#5f5e5a">求和: ￥5,234,102.00</span>
</div>

<div id="ov" style="position:absolute;inset:0;background:rgba(255,255,255,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px">
<p style="margin:0;font-size:16px;font-weight:500;color:#107c41">按 Enter 开始</p>
<p style="margin:0;font-size:13px;color:#5f5e5a;line-height:1.7">方向键移动，吃掉黄色的格子<br>Esc 一按藏起来，再按一次原地继续<br>觉得吃力就点左上角的「帮帮忙」，随时开关</p>
<p id="hint" style="margin:0;font-size:11px;color:#8a8880">按键没反应的话，先点一下这块区域</p>
</div>

</div></div></div>
<script>
(function(){
var C=15,R=13,cells=[],orig=[],snake=[],dir={r:0,c:1},nx={r:0,c:1},food={r:0,c:0},iv=null,run=0,frozen=0,sc=0,help=0;
var gd=document.getElementById('gd'),ch=document.getElementById('ch'),rh=document.getElementById('rh'),ov=document.getElementById('ov');
var st=document.getElementById('st'),scv=document.getElementById('sc'),nb=document.getElementById('nb'),fx=document.getElementById('fx'),xl=document.getElementById('xl');
var hb=document.getElementById('hb'),hbt=document.getElementById('hbt');
var HDS=['日期','部门','项目编号','预算金额','实际支出','差额','完成率'];
function cn(i){var s='';while(i>=0){s=String.fromCharCode(i%26+65)+s;i=Math.floor(i/26)-1}return s}
for(var c=0;c<C;c++){var h=document.createElement('div');h.className='xt';h.textContent=cn(c);ch.appendChild(h)}
for(var r=0;r<R;r++){var rr=document.createElement('div');rr.className='xr';rr.textContent=r+1;rh.appendChild(rr);cells[r]=[];orig[r]=[];
for(var c=0;c<C;c++){var d=document.createElement('div');d.className=r===0?'xc hd':'xc';var v;
if(r===0)v=HDS[c%7];else if(c===0)v=(r%9+1)+'/15';else if(c===1)v=['研发','市场','销售','人事','财务'][r%5];else if(c===6)v=(Math.random()*40+60).toFixed(0)+'%';else v=(Math.random()*9000+800).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
d.textContent=v;orig[r][c]=v;gd.appendChild(d);cells[r][c]=d}}
function rst(r,c){var d=cells[r][c];d.className=r===0?'xc hd':'xc';d.textContent=orig[r][c]}
function clr(){for(var r=0;r<R;r++)for(var c=0;c<C;c++)rst(r,c)}
function spd(){return help?190:130}
function food_(){var e=[];for(var r=0;r<R;r++)for(var c=0;c<C;c++){var on=0;for(var i=0;i<snake.length;i++)if(snake[i].r===r&&snake[i].c===c)on=1;if(!on)e.push({r:r,c:c})}
if(!e.length)return;food=e[Math.floor(Math.random()*e.length)];var f=cells[food.r][food.c];f.className='xc fd';f.textContent='异常'}
function draw(){for(var i=0;i<snake.length;i++){var s=snake[i],d=cells[s.r][s.c];d.className='xc sb';d.textContent=''}
cells[snake[0].r][snake[0].c].className='xc sb sh'}
function start(){run=1;frozen=0;sc=0;ov.style.display='none';st.textContent='正在核对数据…';st.style.color='#0f6e56';scv.textContent='已核对 0 项';
snake=[{r:6,c:7},{r:6,c:6},{r:6,c:5}];dir={r:0,c:1};nx={r:0,c:1};clr();food_();draw();
if(iv)clearInterval(iv);iv=setInterval(loop,spd())}
function over(){run=0;clearInterval(iv);st.textContent='#REF! 引用错误 — 按 Enter 重新计算';st.style.color='#a32d2d'}
function loop(){if(frozen)return;dir=nx;var h=snake[0],n={r:h.r+dir.r,c:h.c+dir.c};
if(n.r<0||n.r>=R||n.c<0||n.c>=C){if(!help){over();return}n.r=(n.r+R)%R;n.c=(n.c+C)%C}
var hit=0;for(var i=0;i<snake.length;i++)if(snake[i].r===n.r&&snake[i].c===n.c)hit=1;
if(hit&&!help){over();return}
nb.textContent=cn(n.c)+(n.r+1);fx.textContent='=VLOOKUP(A'+(n.r+1)+',Data!$A$1:$D$500,3,FALSE)';
snake.unshift(n);
if(n.r===food.r&&n.c===food.c){sc++;scv.textContent='已核对 '+sc+' 项';food_()}
else{var t=snake.pop();rst(t.r,t.c)}
draw()}
function toggle(){help=help?0:1;hb.className=help?'tb on':'tb';hb.setAttribute('aria-pressed',help?'true':'false');hbt.textContent=help?'帮帮忙 · 开':'帮帮忙 · 关';
if(run&&!frozen){clearInterval(iv);iv=setInterval(loop,spd())}xl.focus()}
hb.addEventListener('click',toggle);
function turn(r,c){if(!run||frozen)return;if(r&&dir.r===-r)return;if(c&&dir.c===-c)return;nx={r:r,c:c}}
document.getElementById('du').addEventListener('click',function(){turn(-1,0);xl.focus()});
document.getElementById('dd').addEventListener('click',function(){turn(1,0);xl.focus()});
document.getElementById('dl').addEventListener('click',function(){turn(0,-1);xl.focus()});
document.getElementById('dr').addEventListener('click',function(){turn(0,1);xl.focus()});
document.addEventListener('keydown',function(e){
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].indexOf(e.key)>=0)e.preventDefault();
if(e.key==='Escape'){if(!run)return;frozen=!frozen;
if(frozen){for(var i=0;i<snake.length;i++)rst(snake[i].r,snake[i].c);rst(food.r,food.c);st.textContent='就绪';st.style.color='#3a3a38';scv.textContent='';nb.textContent='A1';fx.textContent='=SUM(C2:C10)*1.05'}
else{draw();var f=cells[food.r][food.c];f.className='xc fd';f.textContent='异常';st.textContent='正在核对数据…';st.style.color='#0f6e56';scv.textContent='已核对 '+sc+' 项'}return}
if(e.key==='Enter'){if(!run)start();return}
if(e.key==='ArrowUp')turn(-1,0);else if(e.key==='ArrowDown')turn(1,0);else if(e.key==='ArrowLeft')turn(0,-1);else if(e.key==='ArrowRight')turn(0,1)});
xl.addEventListener('click',function(){xl.focus()});
xl.focus();
})();
</script>
