<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摸摸软的东西</title>
<meta name="description" content="鼠标划过四只字符小动物，它们会有反应，摸久了会睡着。没有分数也不会输。">
</head>
<body>
<h2 class="sr-only">解压小玩具：鼠标划过四只字符小动物，它们会有反应，摸久了会睡着。没有分数、没有失败、可以随时离开。</h2>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.tw{padding:1.5rem 0}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pet{position:relative;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface-1);border-radius:12px;cursor:pointer;user-select:none;transition:background .25s}
.pet.on{background:var(--bg-accent)}
.pet.zz{background:var(--bg-success)}
.face{font-size:19px;color:var(--text-primary);line-height:1.4;white-space:nowrap;transition:transform .2s}
.pet.on .face{transform:translateY(-3px)}
.nm{font-size:12px;color:var(--text-secondary)}
.pop{position:absolute;top:14px;font-size:13px;color:var(--text-accent);pointer-events:none;transition:transform 1s ease-out,opacity 1s ease-out}
.foot{margin-top:14px;font-size:13px;color:var(--text-secondary);text-align:center;min-height:20px}
</style>
<div class="tw">
<div class="row" id="row"></div>
<div class="foot" id="foot">把鼠标放上去，慢慢地摸。</div>
</div>
<script>
(function(){
var row=document.getElementById('row'),foot=document.getElementById('foot');
var D=[
{n:'猫猫',a:'ฅ^•ω•^ฅ',b:'(=^･ω･^)ﾉ',c:'(=￣ω￣=)',s:'呼噜呼噜……'},
{n:'兔兔',a:'(・×・)',b:'( >ᴗ< )',c:'( －ω－ )',s:'耳朵软下来了'},
{n:'克宝',a:'( ｡• ᴗ •｡ )',b:'( ๑˃ᴗ˂ )',c:'( ˘ω˘ )',s:'原地融化了'},
{n:'Fable',a:'(=ﾟωﾟ)ﾉ',b:'( ＾ᴗ＾ )',c:'( ｡-ω-)',s:'尾巴盖住脸了'}
];
var marks=['♪','～','✧','˚','·'];
D.forEach(function(d,i){
  var el=document.createElement('div');el.className='pet';
  el.innerHTML='<span class="face">'+d.a+'</span><span class="nm">'+d.n+'</span>';
  row.appendChild(el);
  var face=el.querySelector('.face'),n=0,last=0,t=null;
  function pop(){
    var s=document.createElement('span');s.className='pop';
    s.textContent=marks[(Math.random()*marks.length)|0];
    s.style.left=(24+Math.random()*70)+'%';el.appendChild(s);
    requestAnimationFrame(function(){s.style.transform='translateY(-22px)';s.style.opacity='0';});
    setTimeout(function(){s.remove();},1000);
  }
  el.addEventListener('mousemove',function(){
    var now=Date.now();if(now-last<140)return;last=now;
    n++;pop();clearTimeout(t);
    if(n>=6){el.className='pet zz';face.textContent=d.c;foot.textContent=d.n+'：'+d.s;}
    else{el.className='pet on';face.textContent=d.b;}
    t=setTimeout(function(){
      if(n>=6){el.className='pet zz';face.textContent=d.c;}
      else{el.className='pet';face.textContent=d.a;n=0;}
    },1400);
  });
  el.addEventListener('click',function(){
    if(n>=6){n=0;el.className='pet';face.textContent=d.a;foot.textContent=d.n+'醒了，可以再摸一次。';}
  });
});
})();
</script>
</body>
</html>
