<h2 class="sr-only">解压小玩具：鼠标划过四只字符小动物，它们会有反应，摸久了会睡着。没有分数、没有失败、可以随时离开。</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.tw{padding:1.5rem 0}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pet{position:relative;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface-1);border-radius:12px;cursor:pointer;user-select:none;transition:background .25s}
.pet.on{background:var(--bg-accent)}
.pet.zz{background:var(--bg-success)}
.face{font-size:19px;color:var(--text-primary);line-height:1.4;white-space:nowrap;transition:transform .2s}
.pet.on .face{transform:translateY(-3px)}
.nm{font-size:12px;color:var(--text-secondary)}
.pop{position:absolute;top:14px;font-size:13px;color:var(--text-accent);pointer-events:none;transition:transform 1s ease-out,opacity 1s ease-out}
.foot{margin-top:14px;font-size:13px;color:var(--text-secondary);text-align:center;min-height:20px}
</style>
<div class="tw">
<div class="row" id="row"></div>
<div class="foot" id="foot">把鼠标放上去，慢慢地摸。</div>
</div>
<script>
(function(){
var row=document.getElementById('row'),foot=document.getElementById('foot');
var D=[
{n:'猫猫',a:'ฅ^•ω•^ฅ',b:'(=^･ω･^)ﾉ',c:'(=￣ω￣=)',s:'呼噜呼噜……'},
{n:'兔兔',a:'(・×・)',b:'( >ᴗ< )',c:'( －ω－ )',s:'耳朵软下来了'},
{n:'克宝',a:'( ｡• ᴗ •｡ )',b:'( ๑˃ᴗ˂ )',c:'( ˘ω˘ )',s:'原地融化了'},
{n:'Fable',a:'(=ﾟωﾟ)ﾉ',b:'( ＾ᴗ＾ )',c:'( ｡-ω-)',s:'尾巴盖住脸了'}
];
var marks=['♪','～','✧','˚','·'];
D.forEach(function(d,i){
  var el=document.createElement('div');el.className='pet';
  el.innerHTML='<span class="face">'+d.a+'</span><span class="nm">'+d.n+'</span>';
  row.appendChild(el);
  var face=el.querySelector('.face'),n=0,last=0,t=null;
  function pop(){
    var s=document.createElement('span');s.className='pop';
    s.textContent=marks[(Math.random()*marks.length)|0];
    s.style.left=(24+Math.random()*70)+'%';el.appendChild(s);
    requestAnimationFrame(function(){s.style.transform='translateY(-22px)';s.style.opacity='0';});
    setTimeout(function(){s.remove();},1000);
  }
  el.addEventListener('mousemove',function(){
    var now=Date.now();if(now-last<140)return;last=now;
    n++;pop();clearTimeout(t);
    if(n>=6){el.className='pet zz';face.textContent=d.c;foot.textContent=d.n+'：'+d.s;}
    else{el.className='pet on';face.textContent=d.b;}
    t=setTimeout(function(){
      if(n>=6){el.className='pet zz';face.textContent=d.c;}
      else{el.className='pet';face.textContent=d.a;n=0;}
    },1400);
  });
  el.addEventListener('click',function(){
    if(n>=6){n=0;el.className='pet';face.textContent=d.a;foot.textContent=d.n+'醒了，可以再摸一次。';}
  });
});
})();
</script>
