<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141122">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>你是一只小蝴蝶 🦋</title>
<meta name="description" content="点哪儿就开一朵花，小蝴蝶飞过去停一会儿，停够了自己再走。">
<style>
:root{
  --sky-1:#141122;
  --sky-2:#241d33;
  --sky-3:#3d2b3d;
  --sky-4:#5e3c3b;
  --glow:rgba(246,190,130,.30);
  --grass-1:#2c2032;
  --grass-2:#18101d;
  --wing-in:#fbe4c2;
  --wing-mid:#f0b478;
  --wing-out:#d07f45;
  --wing-edge:#8f5330;
  --body:#4b3126;
  --moon:#ffe7c0;
  --text:#efdcc6;
  --text-dim:rgba(239,220,198,.52);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
         system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(130% 60% at 50% 100%, var(--glow) 0%, rgba(246,190,130,0) 58%),
    linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 36%,var(--sky-3) 70%,var(--sky-4) 100%);
  font-family:var(--font);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  position:relative;
}

/* ---------- 顶上的名字 ---------- */
#name{
  position:fixed;left:0;right:0;top:calc(var(--safe-top) + 20px);
  text-align:center;font-size:13.5px;letter-spacing:.22em;
  color:var(--text-dim);z-index:7;pointer-events:none;
}

/* ---------- 底下那句话 ---------- */
#hint{
  position:fixed;left:0;right:0;bottom:calc(var(--safe-bottom) + 26px);
  text-align:center;font-size:14.5px;line-height:1.9;letter-spacing:.06em;
  color:var(--text-dim);z-index:7;pointer-events:none;
  opacity:1;transition:opacity .5s ease;
}
#hint.dim{opacity:0}

/* ---------- 月亮 ---------- */
#moon{
  position:fixed;right:12vw;top:calc(var(--safe-top) + 12vh);
  width:64px;height:64px;z-index:1;pointer-events:none;
  filter:drop-shadow(0 0 16px rgba(255,224,175,.34));
  opacity:.92;
}

/* ---------- 星星 ---------- */
.star{
  position:fixed;border-radius:50%;background:#fff4e2;
  z-index:1;pointer-events:none;opacity:var(--o);
  animation:twinkle var(--td) ease-in-out infinite var(--tdl);
}
@keyframes twinkle{
  0%,100%{opacity:var(--o)}
  50%    {opacity:calc(var(--o) * .38)}
}

/* ---------- 地上的草 ---------- */
#ground{
  position:fixed;left:0;bottom:0;width:100%;height:25vh;min-height:130px;
  z-index:2;pointer-events:none;display:block;
}

/* ---------- 飘的小绒毛 ---------- */
.mote{
  position:fixed;width:3px;height:3px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,231,196,.85),rgba(255,225,180,0) 70%);
  z-index:3;pointer-events:none;
  animation:drift var(--d) linear infinite var(--dl);
}
@keyframes drift{
  0%  {transform:translate3d(0,0,0)}
  50% {transform:translate3d(22px,-44vh,0)}
  100%{transform:translate3d(-10px,-88vh,0)}
}

/* ---------- 花 ---------- */
#garden{position:fixed;inset:0;z-index:4;pointer-events:none}
.flower{
  position:absolute;width:var(--sz);height:var(--sz);
  margin-left:calc(var(--sz) / -2);margin-top:calc(var(--sz) / -2);
  transform:rotate(var(--rot)) scale(1);
  filter:drop-shadow(0 0 5px rgba(255,208,164,.28));
  animation:bloom .72s cubic-bezier(.2,1.5,.4,1);
}
@keyframes bloom{
  0%  {transform:rotate(var(--rot)) scale(0)}
  62% {transform:rotate(var(--rot)) scale(1.14)}
  100%{transform:rotate(var(--rot)) scale(1)}
}
.flower.gone{
  transform:rotate(var(--rot)) scale(.1);opacity:0;
  transition:transform .9s ease,opacity .9s ease;
}
.flower svg{width:100%;height:100%;display:block;overflow:visible}

/* ---------- 蝴蝶 ---------- */
#fly{
  position:fixed;left:0;top:0;width:80px;height:68px;
  margin-left:-40px;margin-top:-34px;
  z-index:5;pointer-events:none;
  will-change:transform;
}
#fly svg{width:100%;height:100%;display:block;overflow:visible}

@media (prefers-reduced-motion:reduce){
  .mote{animation-duration:calc(var(--d) * 2.4)}
  .star{animation:none}
}
</style>
</head>
<body>

<div id="name">你是一只小蝴蝶</div>

<svg id="moon" viewBox="0 0 60 60" aria-hidden="true">
  <defs>
    <mask id="mk">
      <rect width="60" height="60" fill="#000"/>
      <circle cx="30" cy="30" r="20" fill="#fff"/>

    </mask>
  </defs>
  <circle cx="30" cy="30" r="20" fill="var(--moon)" mask="url(#mk)"/>
</svg>

<svg id="ground" viewBox="0 0 400 170" preserveAspectRatio="none" aria-hidden="true">

  <g fill="var(--grass-1)">

    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(40,51) scale(1.25,1.25)"/>

    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(99,67) scale(1.15,1.15)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(105,64) scale(1.3,1.3)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(111,68) scale(0.95,0.95)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(207,67) scale(1.0,1.0)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(213,64) scale(1.25,1.25)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(219,68) scale(0.9,0.9)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(297,57) scale(1.1,1.1)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(303,54) scale(1.3,1.3)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(309,58) scale(0.95,0.95)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(365,59) scale(1.05,1.05)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(371,56) scale(1.2,1.2)"/>
  </g>
  <path fill="var(--grass-2)" d="M0,104 C58,86 96,112 152,100 C204,89 246,114 296,102 C340,92 368,108 400,98 L400,170 L0,170 Z"/>
  <g fill="var(--grass-2)">
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(61,107) scale(1.2,1.2)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(67,104) scale(1.35,1.35)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(73,108) scale(1.0,1.0)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(169,105) scale(1.15,1.15)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(175,102) scale(1.3,1.3)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(257,111) scale(1.05,1.05)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(263,108) scale(1.3,1.3)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(269,112) scale(0.95,0.95)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(345,105) scale(1.2,1.2)"/>
    <path d="M0,0 C-1.5,-8 -.8,-14 0,-19 C.8,-14 1.5,-8 0,0 Z" transform="translate(351,102) scale(1.35,1.35)"/>
  </g>
</svg>

<div id="garden"></div>

<div id="fly">
  <svg viewBox="0 0 120 100" aria-hidden="true">
    <defs>
      <linearGradient id="wg" x1="0.15" y1="0.95" x2="1" y2="0.05">
        <stop offset="0%"   stop-color="var(--wing-in)"/>
        <stop offset="48%"  stop-color="var(--wing-mid)"/>
        <stop offset="100%" stop-color="var(--wing-out)"/>
      </linearGradient>
    </defs>

    <!-- 右边一对翅膀 -->
    <g class="wing">
      <path d="M60,43 C61,24 72,8 89,4 C106,0 116,12 110,26 C104,39 85,51 61,52 Z"
            fill="url(#wg)" stroke="var(--wing-edge)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M61,53 C79,52 95,57 97,69 C99,82 87,90 76,84 C66,79 60,66 60,55 Z"
            fill="url(#wg)" stroke="var(--wing-edge)" stroke-width="1.5" stroke-linejoin="round"/>
      <g stroke="var(--wing-edge)" stroke-width=".9" fill="none" opacity=".28">
        <path d="M62,46 C74,38 88,26 97,15"/>
        <path d="M62,49 C76,46 92,38 105,28"/>
        <path d="M63,57 C74,58 86,64 93,72"/>
      </g>
      <circle cx="95" cy="21" r="4.4" fill="var(--wing-in)" opacity=".55"/>
      <circle cx="85" cy="72" r="3.2" fill="var(--wing-in)" opacity=".5"/>
    </g>

    <!-- 左边一对，照着镜子翻过来 -->
    <g transform="translate(120,0) scale(-1,1)">
      <g class="wing">
        <path d="M60,43 C61,24 72,8 89,4 C106,0 116,12 110,26 C104,39 85,51 61,52 Z"
              fill="url(#wg)" stroke="var(--wing-edge)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M61,53 C79,52 95,57 97,69 C99,82 87,90 76,84 C66,79 60,66 60,55 Z"
              fill="url(#wg)" stroke="var(--wing-edge)" stroke-width="1.5" stroke-linejoin="round"/>
        <g stroke="var(--wing-edge)" stroke-width=".9" fill="none" opacity=".28">
          <path d="M62,46 C74,38 88,26 97,15"/>
          <path d="M62,49 C76,46 92,38 105,28"/>
          <path d="M63,57 C74,58 86,64 93,72"/>
        </g>
        <circle cx="95" cy="21" r="4.4" fill="var(--wing-in)" opacity=".55"/>
        <circle cx="85" cy="72" r="3.2" fill="var(--wing-in)" opacity=".5"/>
      </g>
    </g>

    <!-- 身子 -->
    <g>
      <path d="M57,29 C52,22 47,17 42,14" stroke="var(--body)" stroke-width="1.7"
            fill="none" stroke-linecap="round"/>
      <path d="M63,29 C68,22 73,17 78,14" stroke="var(--body)" stroke-width="1.7"
            fill="none" stroke-linecap="round"/>
      <circle cx="42" cy="14" r="2" fill="var(--body)"/>
      <circle cx="78" cy="14" r="2" fill="var(--body)"/>
      <ellipse cx="60" cy="56" rx="3.8" ry="18" fill="var(--body)"/>
      <circle cx="60" cy="33" r="5.2" fill="var(--body)"/>
      <circle cx="57.7" cy="32" r="1.4" fill="#fdeede"/>
      <circle cx="62.3" cy="32" r="1.4" fill="#fdeede"/>
    </g>
  </svg>
</div>

<div id="hint">点一下，那儿就开一朵花</div>

<script>
(function(){
  var fly    = document.getElementById('fly');
  var garden = document.getElementById('garden');
  var hint   = document.getElementById('hint');

  var W = window.innerWidth, H = window.innerHeight;
  function resize(){ W = window.innerWidth; H = window.innerHeight; }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });

  /* ---------- 星星 ---------- */
  for (var s = 0; s < 20; s++){
    var st = document.createElement('span');
    var r  = (1.4 + Math.random() * 1.4).toFixed(1);
    st.className = 'star';
    st.style.width = r + 'px'; st.style.height = r + 'px';
    st.style.left = (Math.random() * 96 + 2).toFixed(1) + 'vw';
    st.style.top  = (Math.random() * 52 + 6).toFixed(1) + 'vh';
    st.style.setProperty('--o',   (.25 + Math.random() * .45).toFixed(2));
    st.style.setProperty('--td',  (3.4 + Math.random() * 4.6).toFixed(1) + 's');
    st.style.setProperty('--tdl', (-Math.random() * 6).toFixed(1) + 's');
    document.body.appendChild(st);
  }

  /* ---------- 会飘的小绒毛 ---------- */
  for (var i = 0; i < 14; i++){
    var m = document.createElement('span');
    m.className = 'mote';
    m.style.left = (Math.random() * 100).toFixed(1) + 'vw';
    m.style.top  = (72 + Math.random() * 34).toFixed(1) + 'vh';
    m.style.setProperty('--d',  (16 + Math.random() * 16).toFixed(1) + 's');
    m.style.setProperty('--dl', (-Math.random() * 26).toFixed(1) + 's');
    m.style.opacity = (.3 + Math.random() * .5).toFixed(2);
    document.body.appendChild(m);
  }

  /* ---------- 花 ---------- */
  var PETAL = ['#f6c8d2','#fbe0c2','#e9cef0','#f8d3b2','#fdeccb','#d9d3f2'];
  var HEART = ['#f6b45f','#f3d07a','#eaa27a'];
  var flowers = [];

  function makeFlower(x, y){
    var el = document.createElement('div');
    var p  = PETAL[(Math.random() * PETAL.length) | 0];
    var h  = HEART[(Math.random() * HEART.length) | 0];
    el.className = 'flower';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.setProperty('--sz',  (21 + Math.random() * 9).toFixed(1) + 'px');
    el.style.setProperty('--rot', ((Math.random() * 360) | 0) + 'deg');
    var petals = '';
    for (var k = 0; k < 5; k++){
      petals += '<ellipse cx="20" cy="10.5" rx="6.1" ry="9.2" transform="rotate(' +
                (k * 72) + ' 20 20)"/>';
    }
    el.innerHTML =
      '<svg viewBox="0 0 40 40">' +
        '<g fill="' + p + '" opacity=".93">' + petals + '</g>' +
        '<circle cx="20" cy="20" r="4.3" fill="' + h + '"/>' +
      '</svg>';
    garden.appendChild(el);

    var f = { el: el, x: x, y: y };
    flowers.push(f);
    if (flowers.length > 16){
      var old = flowers.shift();
      old.el.classList.add('gone');
      (function(node){ setTimeout(function(){
        if (node.parentNode) node.parentNode.removeChild(node);
      }, 950); })(old.el);
      if (target && target.of === old) target = null;
    }
    return f;
  }

  /* ---------- 蝴蝶自己 ---------- */
  var bx = W * .5, by = H * .34, vx = 1.1, vy = .2, ang = 0;
  var mode = 'wander', target = null, restUntil = 0, last = 0, flapAt = 0;
  var restAng = 0;
  var PERCH = 28;   // 停下时蝴蝶比花高这么多，花才露得出来
  var safeTop = 0;
  try {
    safeTop = parseFloat(getComputedStyle(document.documentElement)
                .getPropertyValue('--safe-top')) || 0;
  } catch (e) {}

  function bandTop(){ return safeTop + 74; }
  function bandLow(){ return H - 124; }

  function pickWander(){
    var lo = bandTop(), hi = Math.max(lo + 60, bandLow() - 40);
    if (flowers.length && Math.random() < .38){
      var f = flowers[(Math.random() * flowers.length) | 0];
      target = { x: f.x, y: f.y - PERCH, of: f };
      mode = 'seek';
    } else {
      target = { x: 36 + Math.random() * Math.max(40, W - 72),
                 y: lo + Math.random() * (hi - lo) };
      mode = 'wander';
    }
  }

  var msg = '';
  function say(s){
    if (s === msg) return;
    msg = s;
    hint.classList.add('dim');
    setTimeout(function(){ hint.textContent = s; hint.classList.remove('dim'); }, 320);
  }

  var wings = fly.querySelectorAll('.wing');
  var flapPeriod = 340, flapMin = .52, flapPhase = 0;
  function setFlap(period, minv){ flapPeriod = period; flapMin = minv; }

  function step(now){
    if (!last) last = now;
    var dt = Math.min(2.6, (now - last) / 16.667) || 1;
    last = now;

    if (!target) pickWander();

    if (mode === 'rest'){
      bx = target.x + Math.sin(now / 760) * 1.3;
      by = target.y + Math.sin(now / 980) * 1.0;
      vx *= .82; vy *= .82;
      var da = ((restAng - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      ang += da * Math.min(1, .05 * dt);
      if (now > restUntil){
        pickWander();
        setFlap(340, .52);
        vy = -1.4; vx = (Math.random() < .5 ? -1 : 1) * 1.1;
        say(flowers.length > 3 ? '停够了，去下一朵' : '停够了，又想去别处看看');
      }
    } else {
      var dx = target.x - bx, dy = target.y - by;
      var d  = Math.sqrt(dx * dx + dy * dy) || 1;
      var sp = (mode === 'seek' ? 3.0 : 1.85);
      var ease = .32 + .68 * Math.min(1, d / 110);
      vx += ((dx / d) * sp * ease - vx) * .038 * dt;
      vy += ((dy / d) * sp * ease - vy) * .038 * dt;

      var s2 = Math.sqrt(vx * vx + vy * vy) || 1;
      var flut = Math.sin(now / 128) * .55;
      bx += (vx + (-vy / s2) * flut) * dt;
      by += (vy + ( vx / s2) * flut + Math.sin(now / 270) * .28) * dt;

      if (bx < 30){ bx = 30; vx = Math.abs(vx); target = null; }
      if (bx > W - 30){ bx = W - 30; vx = -Math.abs(vx); target = null; }
      if (by < bandTop() - 26){ by = bandTop() - 26; vy = Math.abs(vy); target = null; }
      if (by > bandLow()){ by = bandLow(); vy = -Math.abs(vy); target = null; }

      if (target && d < 13){
        if (mode === 'seek'){
          mode = 'rest';
          restUntil = now + 2600 + Math.random() * 3400;
          restAng = (Math.random() * 24 - 12) / 57.2958;
          setFlap(2600, .62);
          say(target.tap ? '停在你点的地方，歇一会儿' : '它自己挑了一朵停下');
        } else {
          pickWander();
        }
      } else if (target && mode === 'wander' && d < 30){
        pickWander();
      }
    }

    var sp2 = Math.sqrt(vx * vx + vy * vy);
    if (mode !== 'rest' && sp2 > .3){
      var want = Math.atan2(vy, vx) + Math.PI / 2;
      var diff = ((want - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      ang += diff * Math.min(1, .11 * dt);
    }

    if (now - flapAt > 260){
      flapAt = now;
      if (mode !== 'rest'){
        var q = Math.min(1, sp2 / 3);
        setFlap(440 - q * 140, .60 - q * .12);
      }
    }

    flapPhase += (dt * 16.667) * (Math.PI * 2) / flapPeriod;
    if (flapPhase > Math.PI * 2) flapPhase -= Math.PI * 2;
    var mid = (1 + flapMin) / 2, amp = (1 - flapMin) / 2;
    var k = (mid + amp * Math.cos(flapPhase)).toFixed(3);
    var wt = 'translate(60,0) scale(' + k + ',1) translate(-60,0)';
    for (var wi = 0; wi < wings.length; wi++) wings[wi].setAttribute('transform', wt);

    fly.style.transform = 'translate3d(' + bx.toFixed(2) + 'px,' + by.toFixed(2) + 'px,0)' +
                          ' rotate(' + (ang * 57.2958).toFixed(2) + 'deg)';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  /* ---------- 点一下就开花 ---------- */
  var picked = 0;
  function tap(x, y){
    x = Math.max(30, Math.min(W - 30, x));
    y = Math.max(bandTop() - 14, Math.min(bandLow() + 4, y));
    var f = makeFlower(x, y);
    target = { x: x, y: y - PERCH, of: f, tap: true };
    mode = 'seek';
    setFlap(300, .50);
    picked++;
    say(picked % 5 === 0 ? '花开得有点多了，它一朵一朵来' : '它看见了，正飞过去');
  }

  if (window.PointerEvent){
    document.addEventListener('pointerdown', function(e){ tap(e.clientX, e.clientY); });
  } else {
    document.addEventListener('touchstart', function(e){
      var t = e.changedTouches[0]; tap(t.clientX, t.clientY);
    }, {passive:true});
    document.addEventListener('mousedown', function(e){ tap(e.clientX, e.clientY); });
  }
})();
</script>
</body>
</html>
