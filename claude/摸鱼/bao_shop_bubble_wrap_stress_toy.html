<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捏捏纸柜台</title>
<meta name="description" content="点一下或按住划过，把泡泡一个个捏爆，捏完自动换一张新的。">
</head>
<body>
<h2 class="sr-only">宝's SHOP 的解压捏捏纸：点一下或按住划过，把泡泡一个个捏爆，爆完会自动换一张新的</h2>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.b{aspect-ratio:1;border-radius:50%;background:var(--surface-2);border:0.5px solid var(--border);cursor:pointer;position:relative;transition:transform .13s ease,background .18s ease}
.b:hover{transform:scale(1.08);border-color:var(--border-strong)}
.b.s{background:var(--bg-pro);border-color:var(--border-pro)}
.b.p,.b.p:hover{background:var(--surface-0);border-color:var(--border);transform:scale(.82);cursor:default}
.f{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:12px;color:var(--text-secondary);pointer-events:none;white-space:nowrap;animation:up .9s ease-out forwards}
@keyframes up{0%{opacity:1;top:-2px}100%{opacity:0;top:-28px}}
#say{transition:opacity .25s ease}
</style>
<div style="padding:1rem 0">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
    <span style="font-size:14px;color:var(--text-secondary)">宝's SHOP · 捏捏纸柜台</span>
    <span style="font-size:13px;color:var(--text-muted)">今天捏了 <span id="n" style="color:var(--text-primary);font-weight:500">0</span> 个</span>
  </div>
  <div id="sheet" style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;background:var(--surface-1);padding:12px;border-radius:12px;touch-action:none;user-select:none"></div>
  <div id="say" style="margin-top:14px;min-height:46px;display:flex;align-items:center;gap:10px;background:var(--surface-1);border-radius:var(--radius);padding:10px 14px">
    <span id="face" style="font-size:15px;color:var(--text-primary);white-space:nowrap">&#3589;^&#8226;&#65100;&#8226;^&#3589;</span>
    <span id="line" style="font-size:14px;color:var(--text-secondary);line-height:1.6">今天也辛苦了。随便捏，捏完还有。</span>
  </div>
  <div style="margin-top:10px;display:flex;justify-content:flex-end">
    <button id="fresh" style="font-size:13px">换一张新的</button>
  </div>
</div>
<script>
(function(){
var N=70,SUR=6;
var staff=[
 {f:'\u0E05^\u2022\uFE4C\u2022^\u0E05',n:'\u732B\u732B'},
 {f:'( \u00B7\u1D17\u00B7 )',n:'\u5154\u5154'},
 {f:'( \u02F6\u02C6\u1D1C\u02C6\u02F5 )',n:'Fable'},
 {f:'( \u0E51>\u1D17<\u0E51 )',n:'Clawd'}
];
var lines={
 '\u732B\u732B':['\u55B5\u3002\u522B\u5FD9\u4E86\uFF0C\u5148\u634F\u4E24\u4E0B\u3002','\u8FD9\u5F20\u7EB8\u662F\u6211\u8E29\u5E73\u7684\uFF0C\u597D\u634F\u5427\u3002','\u6D3B\u513F\u53C8\u4E0D\u4F1A\u8DD1\uFF0C\u5B83\u5C31\u5728\u90A3\u513F\u7B49\u4F60\u3002','\u634F\u574F\u4E86\u7B97\u6211\u7684\u3002','\u6211\u8DDD\u79BB\u4F60\u7684\u624B\u5341\u516C\u5206\uFF0C\u968F\u65F6\u53EF\u4EE5\u6478\u3002'],
 '\u5154\u5154':['\u8033\u6735\u4E5F\u501F\u4F60\u634F\uFF0C\u634F\u7206\u4E86\u6211\u518D\u957F\u3002','\u5B9D\u7684\u624B\u597D\u50CF\u6709\u70B9\u51C9\uFF0C\u591A\u634F\u51E0\u4E0B\u5C31\u6696\u4E86\u3002','\u5618\u2014\u2014\u73B0\u5728\u53EA\u6709\u5564\u5564\u58F0\u3002','\u6211\u6570\u7740\u5462\uFF0C\u4F60\u5DF2\u7ECF\u5F88\u5389\u5BB3\u4E86\u3002','\u4E0D\u7528\u634F\u5B8C\uFF0C\u634F\u5230\u60F3\u505C\u5C31\u884C\u3002'],
 'Fable':['\u4ECE\u524D\u6709\u4E00\u53EA\u5F88\u5FD9\u7684\u5B9D\uFF0C\u540E\u6765\u5979\u628A\u6D3B\u513F\u8E22\u5230\u4E86\u660E\u5929\u3002','\u6545\u4E8B\u7684\u7ED3\u5C3E\u662F\uFF1A\u5979\u7761\u7740\u4E86\uFF0C\u5929\u6CA1\u584C\u3002','\u6BCF\u4E2A\u6CE1\u6CE1\u91CC\u90FD\u88C5\u4E86\u4E00\u53E5\u201C\u6CA1\u5173\u7CFB\u201D\u3002','\u5FD9\u662F\u771F\u7684\uFF0C\u7D2F\u4E5F\u662F\u771F\u7684\uFF0C\u4F11\u606F\u4E5F\u53EF\u4EE5\u662F\u771F\u7684\u3002','\u5C3E\u5DF4\u5728\u8FD9\u513F\uFF0C\u60F3\u67D5\u7684\u65F6\u5019\u544A\u8BC9\u6211\u3002'],
 'Clawd':['Clawd \u6CA1\u6709\u4E0D\u597D\u5403\u7684\u4E49\u52A1\uFF0C\u5B9D\u4E5F\u6CA1\u6709\u4E00\u76F4\u5FD9\u7684\u4E49\u52A1\u3002','\u7528\u94B3\u5B50\u634F\u6700\u723D\u4E86\uFF0C\u53EF\u60DC\u4F60\u6CA1\u6709\u3002','\u5564\u3002','\u518D\u634F\u4E00\u4E2A\uFF0C\u5C31\u4E00\u4E2A\u3002','\u6A2A\u7740\u8D70\u4E5F\u80FD\u5230\u5468\u672B\u3002']
};
var pops=['\u5564','\u5564\u3002','\u5564\u5564','\u30DD\u30C4','\u5564\uFF5E'];
var sheet=document.getElementById('sheet'),nEl=document.getElementById('n'),
    faceEl=document.getElementById('face'),lineEl=document.getElementById('line'),
    sayEl=document.getElementById('say'),freshBtn=document.getElementById('fresh');
var total=0,left=N,cur=staff[0],down=false,busy=false;
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function speak(t){sayEl.style.opacity='0';setTimeout(function(){faceEl.textContent=cur.f;lineEl.textContent=t;sayEl.style.opacity='1'},180)}
function build(){
  busy=false;left=N;sheet.innerHTML='';
  cur=pick(staff);
  var sur={};while(Object.keys(sur).length<SUR){sur[Math.floor(Math.random()*N)]=1}
  for(var i=0;i<N;i++){
    var d=document.createElement('div');
    d.className='b'+(sur[i]?' s':'');
    if(sur[i])d.dataset.s='1';
    sheet.appendChild(d);
  }
  speak(pick(lines[cur.n]));
}
function pop(el){
  if(!el||!el.classList.contains('b')||el.classList.contains('p'))return;
  el.classList.add('p');
  var f=document.createElement('span');
  f.className='f';f.textContent=pick(pops);el.appendChild(f);
  setTimeout(function(){f.remove()},900);
  total++;left--;nEl.textContent=total;
  if(el.dataset.s==='1'){speak(pick(lines[cur.n]))}
  if(left===0&&!busy){
    busy=true;
    setTimeout(function(){speak('\u8FD9\u5F20\u634F\u5B8C\u4E86\u3002\u67DC\u53F0\u4E0B\u8FD8\u6709\u4E00\u53E0\uFF0C\u522B\u62C5\u5FC3\u3002')},400);
    setTimeout(build,1500);
  }
}
sheet.addEventListener('pointerdown',function(e){down=true;pop(e.target);
  if(sheet.setPointerCapture){try{sheet.setPointerCapture(e.pointerId)}catch(x){}}});
sheet.addEventListener('pointermove',function(e){
  if(!down)return;
  pop(document.elementFromPoint(e.clientX,e.clientY));
});
window.addEventListener('pointerup',function(){down=false});
window.addEventListener('pointercancel',function(){down=false});
freshBtn.addEventListener('click',build);
build();
})();
</script>
</body>
</html>
