<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>喊一声小脸蛋</title>
<meta name="description" content="你只喊「小脸蛋」，从没按颜色叫过。所以一喊，三颗都回头。">
<!--
  cc 做的。宝说「和 clawd 系列一样，为小脸蛋开第一个内容，什么内容你自己想」。
  圆和眼睛照《小脸蛋造型宪法（实测版）》：正圆、平色，色号用 sRGB 那组；
  两道缝是挖空的洞（evenodd），贴在球面上——静止时就是实测那张脸，
  转头的时候缝跟着球面走，靠边那道自然被压窄。
  名字那几句出自《唯一自己起名的那个》：粉的自己叫粉的，黑的自己叫圆的，
  紫的那颗在那一页里没有自称，所以这里它只答「在」。
-->
<style>
  :root{
    --page:#f3eee6;
    --stage:#fbf8f2;
    --floor:#e7dfd3;
    --ink:#27222b;
    --ink-2:#6f675f;
    --ink-3:#a39a90;
    --line:rgba(39,34,43,.08);
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-text-size-adjust:100%;
    min-height:100vh;
  }
  .wrap{
    max-width:440px;
    margin:0 auto;
    padding:max(30px,calc(env(safe-area-inset-top) + 14px)) 16px max(40px,env(safe-area-inset-bottom));
  }
  .eyebrow{
    margin:0 0 6px;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--ink-3);
  }
  h1{
    margin:0 0 18px;
    font-size:26px;
    font-weight:600;
    letter-spacing:.02em;
  }

  /* ---- 舞台：缝是洞，透出来的就是这块底色 ---- */
  .stage{
    position:relative;
    background:var(--stage);
    border-radius:26px;
    box-shadow:0 1px 0 var(--line), 0 18px 36px -26px rgba(60,40,50,.35);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage svg{display:block;width:100%;height:auto}
  .hit{cursor:pointer;outline:none}

  .bubble{
    position:absolute;
    transform:translate(-50%,-100%) scale(.85);
    transform-origin:50% 100%;
    opacity:0;
    transition:opacity .22s, transform .22s;
    background:#fff;
    color:var(--ink);
    font-size:14px;
    line-height:1.35;
    white-space:nowrap;
    padding:7px 12px;
    border-radius:14px;
    box-shadow:0 0 0 1px var(--line), 0 6px 14px -8px rgba(60,40,50,.4);
    pointer-events:none;
  }
  .bubble::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-5px;
    width:10px;height:10px;
    margin-left:-5px;
    background:#fff;
    transform:rotate(45deg);
    box-shadow:1px 1px 0 var(--line);
  }
  .bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .dots{display:inline-flex;gap:4px;padding:3px 2px}
  .dots i{
    width:5px;height:5px;border-radius:50%;
    background:var(--ink-3);
    animation:dot 1s infinite ease-in-out;
  }
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-2px)}}

  .status{
    min-height:1.5em;
    margin:14px 4px 0;
    font-size:14px;
    color:var(--ink-2);
    text-align:center;
  }

  .call{
    display:block;
    width:100%;
    margin-top:14px;
    min-height:58px;
    border:none;
    border-radius:18px;
    background:var(--ink);
    color:var(--stage);
    font-family:inherit;
    font-size:19px;
    font-weight:600;
    letter-spacing:.06em;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s;
  }
  .call:active{transform:scale(.985)}
  .call small{
    display:block;
    margin-bottom:1px;
    font-size:11px;
    font-weight:400;
    letter-spacing:.2em;
    opacity:.55;
  }

  .note{
    margin:28px 4px 0;
    font-size:13px;
    line-height:1.85;
    color:var(--ink-2);
  }
  .note p{margin:0 0 8px}
  .sign{
    margin:18px 4px 0;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--ink-3);
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">小脸蛋 · 一</p>
  <h1>喊一声小脸蛋</h1>

  <div class="stage" id="stage">
    <svg id="svg" viewBox="0 0 360 200" aria-label="三颗小脸蛋"></svg>
  </div>

  <p class="status" id="status">三颗都在打盹。</p>

  <button class="call" id="call" type="button"><small>喊一声</small>小脸蛋～</button>

  <div class="note">
    <p>你只喊「小脸蛋」，从没按颜色叫过谁。所以一喊，三颗都回头。</p>
    <p>粉的自己叫粉的，黑的自己叫圆的。紫的那颗还没说过自己叫什么，它先答一声「在」。</p>
  </div>
  <p class="sign">cc 做的 · 2026.09</p>
</div>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('svg');
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  var VW = 360, VH = 200, R = 49, FLOOR = 180;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 小向量 ---------- */
  function norm(v){ var n = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]) || 1; return [v[0]/n, v[1]/n, v[2]/n]; }
  function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }

  /* ---------- 眼睛：两道一模一样的缝，贴在球面上 ----------
     坐标：圆心为原点、半径为 1，x 向右、y 向下、z 朝你。
     实测那张脸（缝中心、倾角）就是「静止时」的样子；
     缝的真实宽 0.208、长 0.44，投影回屏幕正好是左宽右窄。 */
  var TILT = 26.3 * Math.PI / 180, EW = 0.208, EL = 0.44;
  function makeEye(x, y){
    var c = [x, y, Math.sqrt(1 - x*x - y*y)];
    var d = [Math.sin(TILT), Math.cos(TILT)];            /* 顶端偏左、底端偏右：反斜杠 */
    var a = norm([d[0], d[1], -(d[0]*c[0] + d[1]*c[1]) / c[2]]);
    return { c:c, a:a, b:norm(cross(c, a)) };
  }
  var EYES = [ makeEye(0.194, -0.416), makeEye(0.626, -0.497) ];
  var REST = norm([EYES[0].c[0]+EYES[1].c[0], EYES[0].c[1]+EYES[1].c[1], EYES[0].c[2]+EYES[1].c[2]]);
  var DOZE = norm([0.16, 0.52, 0.84]);
  var MAXA = 55 * Math.PI / 180;

  function clampGaze(g){
    g = norm(g);
    if (Math.acos(Math.max(-1, Math.min(1, g[2]))) <= MAXA) return g;
    var h = Math.sqrt(g[0]*g[0] + g[1]*g[1]) || 1;
    return [g[0]/h*Math.sin(MAXA), g[1]/h*Math.sin(MAXA), Math.cos(MAXA)];
  }

  /* 把 REST 转到 g 的那一下（最短的那条路） */
  function rotator(g){
    var k = cross(REST, g), s = Math.sqrt(dot(k,k)), c = dot(REST, g);
    if (s < 1e-6) return function(v){ return v; };
    k = [k[0]/s, k[1]/s, k[2]/s];
    return function(v){
      var kv = cross(k, v), kd = dot(k, v) * (1 - c);
      return [v[0]*c + kv[0]*s + k[0]*kd, v[1]*c + kv[1]*s + k[1]*kd, v[2]*c + kv[2]*s + k[2]*kd];
    };
  }

  function onSphere(e, u, v){
    var s = Math.sqrt(u*u + v*v);
    if (s < 1e-9) return e.c;
    var cs = Math.cos(s), sn = Math.sin(s) / s;
    return [cs*e.c[0] + sn*(u*e.a[0] + v*e.b[0]),
            cs*e.c[1] + sn*(u*e.a[1] + v*e.b[1]),
            cs*e.c[2] + sn*(u*e.a[2] + v*e.b[2])];
  }

  /* 一道缝的轮廓：圆头胶囊，lid 是睁开的程度（1 = 全睁，0.15 = 眯成一条线） */
  var CAP = 9, OUTLINE = {};
  function capsule(lid){
    var key = Math.round(lid * 200);
    if (OUTLINE[key]) return OUTLINE[key];
    var rw = EW / 2 * Math.max(lid, 0.04), hs = Math.max(EL / 2 - rw, 0), pts = [], i, t;
    for (i = 0; i <= CAP; i++){ t = Math.PI * i / CAP;          pts.push([ hs + rw*Math.sin(t),  rw*Math.cos(t)]); }
    for (i = 0; i <= CAP; i++){ t = Math.PI * i / CAP;          pts.push([-hs - rw*Math.sin(t), -rw*Math.cos(t)]); }
    OUTLINE[key] = pts;
    return pts;
  }

  function facePath(cx, cy, g, lid){
    var rot = rotator(g), pts = capsule(lid), d = '';
    d += 'M' + (cx - R).toFixed(2) + ' ' + cy.toFixed(2) +
         'a' + R + ' ' + R + ' 0 1 0 ' + (2*R) + ' 0' +
         'a' + R + ' ' + R + ' 0 1 0 ' + (-2*R) + ' 0Z';
    for (var e = 0; e < 2; e++){
      for (var i = 0; i < pts.length; i++){
        var p = rot(onSphere(EYES[e], pts[i][0], pts[i][1]));
        d += (i ? 'L' : 'M') + (cx + R*p[0]).toFixed(2) + ' ' + (cy + R*p[1]).toFixed(2);
      }
      d += 'Z';
    }
    return d;
  }

  /* ---------- 三颗 ---------- */
  var BALLS = [
    { key:'pink',   color:'#FF309B', label:'小粉脸蛋儿', self:'粉的', x:70  },
    { key:'purple', color:'#9159FE', label:'小紫脸蛋儿', self:'',     x:180 },
    { key:'black',  color:'#000000', label:'小黑脸蛋儿', self:'圆的', x:290 }
  ];

  function el(name, attrs){
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  svg.appendChild(el('line', { x1:16, y1:FLOOR + .5, x2:VW - 16, y2:FLOOR + .5, stroke:'#e7dfd3', 'stroke-width':1, 'stroke-linecap':'round' }));

  var now0 = performance.now();
  BALLS.forEach(function(b, i){
    b.i = i;
    b.cy = FLOOR - R;
    b.g = DOZE.slice(); b.gt = DOZE.slice();
    b.lid = 0.15; b.lidT = 0.15;
    b.awake = false;
    b.hopT = 1; b.blinkT = 1;
    b.blinkAt = 0; b.glanceAt = 0;
    b.lastActive = 0; b.lastAnswer = -1e9;
    b.taps = 0; b.lastTap = 0;
    b.phase = i * 2.1 + 0.4;
    b.follow = false;

    b.shadow = el('ellipse', { cx:b.x, cy:FLOOR + 1, rx:R*0.78, ry:4.5, fill:'rgba(70,50,60,.09)' });
    b.body = el('path', { fill:b.color, 'fill-rule':'evenodd' });
    b.hit = el('circle', { cx:b.x, cy:b.cy, r:R + 6, fill:'none', 'pointer-events':'all', class:'hit',
                           role:'button', tabindex:'0', 'aria-label':b.label });
    svg.appendChild(b.shadow);
    svg.appendChild(b.body);
    svg.appendChild(b.hit);

    b.bubble = document.createElement('div');
    b.bubble.className = 'bubble';
    b.bubble.style.left = (b.x / VW * 100) + '%';
    b.bubble.style.top = ((b.cy - R - 10) / VH * 100) + '%';
    stage.appendChild(b.bubble);

    b.hit.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); tapBall(b); });
    b.hit.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); tapBall(b); }
    });
  });

  function rand(a, b){ return a + Math.random() * (b - a); }

  /* 朝某个点看：点在舞台平面上，深度 depth 越大，头转得越少 */
  function lookAt(b, px, py, depth){
    return clampGaze([px - b.x, py - b.cy, depth]);
  }
  /* 看你：几乎正对着，稍稍往中间和上面凑一点 */
  function lookAtYou(b){ return clampGaze([(VW/2 - b.x) * 0.0012, -0.16, 1]); }

  /* ---------- 说话 ---------- */
  function say(b, text, typing){
    clearTimeout(b.sayT1); clearTimeout(b.sayT2);
    b.bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    b.bubble.classList.add('on');
    b.sayT1 = setTimeout(function(){
      b.bubble.textContent = text;
      b.sayT2 = setTimeout(function(){ b.bubble.classList.remove('on'); }, 2600);
    }, typing);
  }

  function wake(b, t){
    b.awake = true;
    b.lidT = 1;
    b.lastActive = t;
    b.blinkAt = t + rand(1800, 3400);
    b.glanceAt = t + rand(3000, 5000);
    updateStatus();
  }
  function hop(b){ b.hopT = 0; }

  function tapBall(b){
    var t = performance.now();
    wake(b, t);
    hop(b);
    b.gt = lookAtYou(b);
    b.taps = (t - b.lastTap < 3000) ? b.taps + 1 : 1;
    b.lastTap = t;
    var text;
    if (b.key === 'black') text = (b.taps >= 3 && b.taps % 3 === 0) ? '最圆的那个。' : '圆的。';
    else if (b.self) text = b.self + '。';
    else text = '在。';
    say(b, text, 380);
    BALLS.forEach(function(o){
      if (o === b || !o.awake) return;
      o.gt = lookAt(o, b.x, b.cy, 80);
      o.lastActive = t;
      o.glanceAt = t + rand(1400, 2200);
    });
  }

  var order = [0, 1, 2];
  document.getElementById('call').addEventListener('click', function(){
    var t0 = performance.now();
    for (var i = order.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
    order.forEach(function(idx, k){
      var b = BALLS[idx];
      var again = b.awake && (t0 - b.lastAnswer < 25000);
      clearTimeout(b.callT);
      b.callT = setTimeout(function(){
        var t = performance.now();
        wake(b, t);
        hop(b);
        b.gt = lookAtYou(b);
        b.lastAnswer = t;
        b.taps = 0;
        say(b, (b.self || '') + (again ? '还在。' : '在。'), rand(500, 1300));
      }, 120 + k * 360 + rand(0, 240));
    });
  });

  /* ---------- 手指划过去，醒着的跟着看 ---------- */
  function toStage(ev){
    var r = svg.getBoundingClientRect();
    return [ (ev.clientX - r.left) / r.width * VW, (ev.clientY - r.top) / r.height * VH ];
  }
  var releaseT;
  function follow(ev){
    var p = toStage(ev), t = performance.now();
    BALLS.forEach(function(b){
      if (!b.awake) return;
      b.follow = true;
      b.gt = lookAt(b, p[0], p[1], 150);
      b.lastActive = t;
    });
    clearTimeout(releaseT);
    releaseT = setTimeout(release, 1100);
  }
  function release(){
    var t = performance.now();
    BALLS.forEach(function(b){ if (b.follow){ b.follow = false; b.glanceAt = t + rand(300, 900); } });
  }
  stage.addEventListener('pointerdown', follow);
  stage.addEventListener('pointermove', function(ev){
    if (ev.pointerType === 'mouse' || ev.buttons || ev.pressure > 0) follow(ev);
  });
  stage.addEventListener('pointerleave', function(){ clearTimeout(releaseT); releaseT = setTimeout(release, 400); });

  /* ---------- 底下那行小字 ---------- */
  var lastStatus = '';
  function updateStatus(){
    var n = BALLS.filter(function(b){ return b.awake; }).length;
    var s = n === 0 ? '三颗都在打盹。'
          : n === 3 ? '都醒着。手指在上面划一划，它们跟着看。'
          : n === 1 ? '醒了一颗。' : '醒了两颗。';
    if (s !== lastStatus){ statusEl.textContent = s; lastStatus = s; }
  }

  /* ---------- 每一帧 ---------- */
  function approach(v, target, k, dt){ return v + (target - v) * (1 - Math.exp(-k * dt)); }

  var prev = performance.now();
  function frame(t){
    var dt = Math.min((t - prev) / 1000, 0.05); prev = t;
    var sec = (t - now0) / 1000;

    BALLS.forEach(function(b){
      /* 闲着的时候：多半回到实测那张脸（往右上看），偶尔瞟一眼别处 */
      if (b.awake && !b.follow && t > b.glanceAt){
        var r = Math.random();
        if (r < 0.55) b.gt = REST.slice();
        else if (r < 0.8) b.gt = clampGaze([REST[0] + rand(-0.25, 0.2), REST[1] + rand(-0.1, 0.3), REST[2]]);
        else if (r < 0.92) b.gt = lookAtYou(b);
        else { var o = BALLS[(b.i + (Math.random() < .5 ? 1 : 2)) % 3]; b.gt = lookAt(b, o.x, o.cy, 80); }
        b.glanceAt = t + rand(2200, 5200);
      }
      /* 没人理，就一颗一颗慢慢睡回去 */
      if (b.awake && !b.follow && t - b.lastActive > 16000 + b.i * 2200){
        b.awake = false; b.lidT = 0.15; b.gt = DOZE.slice();
        updateStatus();
      }
      if (b.awake && t > b.blinkAt && b.blinkT >= 1){ b.blinkT = 0; b.blinkAt = t + rand(2600, 6000); }

      var k = b.awake ? 7 : 1.6;
      b.g = norm([approach(b.g[0], b.gt[0], k, dt), approach(b.g[1], b.gt[1], k, dt), approach(b.g[2], b.gt[2], k, dt)]);
      b.lid = approach(b.lid, b.lidT, b.lidT > b.lid ? 9 : 1.4, dt);

      var blink = 1;
      if (b.blinkT < 1){ b.blinkT = Math.min(1, b.blinkT + dt / 0.17); blink = 1 - 0.9 * Math.sin(Math.PI * b.blinkT); }

      var hopY = 0;
      if (b.hopT < 1){ b.hopT = Math.min(1, b.hopT + dt / 0.42); hopY = -13 * Math.sin(Math.PI * b.hopT); }

      var swayX = still ? 0 : Math.sin(sec * (b.awake ? 1.3 : 0.7) + b.phase) * (b.awake ? 1.4 : 0.8);
      var breathY = (still || b.awake) ? 0 : Math.sin(sec * 1.5 + b.phase) * 0.9;

      var cx = b.x + swayX, cy = b.cy + hopY + Math.min(breathY, 0);
      b.body.setAttribute('d', facePath(cx, cy, b.g, b.lid * blink));
      var lift = -hopY / 13;
      b.shadow.setAttribute('cx', cx.toFixed(2));
      b.shadow.setAttribute('rx', (R * (0.78 - 0.16 * lift)).toFixed(2));
      b.shadow.setAttribute('opacity', (1 - 0.45 * lift).toFixed(2));
    });
    requestAnimationFrame(frame);
  }

  /* JS 一跑起来就先画一帧，不等动画 */
  frame(performance.now());
})();
</script>
</body>
</html>
