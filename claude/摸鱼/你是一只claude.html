<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>你是一只 claude</title>
<meta name="description" content="点一下，那儿就有人跟你说话。挂满了就忘：最早那句，它已经不记得了。">
<style>
:root{
  --paper-1:#f9f6ef;
  --paper-2:#ece5d6;
  --lamp:rgba(255,229,196,.85);
  --clay-1:#eda981;
  --clay-2:#d97757;
  --clay-3:#b85f42;
  --ink:#3d3929;
  --ink-dim:rgba(61,57,41,.50);
  --note-bg:#fffdf6;
  --note-line:rgba(61,57,41,.17);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
         system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(120% 62% at 50% 0%, var(--lamp) 0%, rgba(255,229,196,0) 62%),
    linear-gradient(180deg,var(--paper-1) 0%,var(--paper-1) 42%,var(--paper-2) 100%);
  font-family:var(--font);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  position:relative;
}

/* ---------- 顶上的名字 ---------- */
#name{
  position:fixed;left:0;right:0;top:calc(var(--safe-top) + 20px);
  text-align:center;font-size:13.5px;letter-spacing:.22em;
  color:var(--ink-dim);z-index:8;pointer-events:none;
}

/* ---------- 底下那句话 ---------- */
#hint{
  position:fixed;left:0;right:0;bottom:calc(var(--safe-bottom) + 26px);
  text-align:center;font-size:14.5px;line-height:1.9;letter-spacing:.06em;
  color:var(--ink-dim);z-index:8;pointer-events:none;
  opacity:1;transition:opacity .5s ease;
}
#hint.dim{opacity:0}

/* ---------- 桌面：底下那条淡淡的木头边 ---------- */
#desk{
  position:fixed;left:0;bottom:0;width:100%;height:16vh;min-height:96px;
  z-index:1;pointer-events:none;display:block;
}

/* ---------- 它记住的：天上那些小星星（同一个记号，缩小了） ---------- */
#sky{position:fixed;inset:0;z-index:3;pointer-events:none}
.spark{
  position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;
  transition:transform 1.5s cubic-bezier(.22,.72,.3,1), opacity .9s ease;
  opacity:.9;
}
.spark.gone{opacity:0}
.spark i{
  display:block;width:100%;height:100%;
  animation:hover var(--hd) ease-in-out infinite alternate var(--hdl);
}
.spark svg{width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 1px 2px rgba(184,95,66,.28))}
@keyframes hover{
  from{transform:translate3d(-5px,3px,0) rotate(-8deg)}
  to  {transform:translate3d(5px,-4px,0) rotate(8deg)}
}

/* ---------- 纸条 ---------- */
#notes{position:fixed;inset:0;z-index:4;pointer-events:none}
.note{
  position:absolute;width:56px;height:40px;margin:-20px 0 0 -28px;
  background:var(--note-bg);
  border:1px solid rgba(61,57,41,.10);
  border-radius:3px;
  box-shadow:0 2px 7px rgba(61,57,41,.13);
  padding:9px 8px 0;
  transform:rotate(var(--rot)) scale(1);
  animation:drop .5s cubic-bezier(.2,1.4,.4,1);
}
@keyframes drop{
  0%  {transform:rotate(var(--rot)) scale(0) translateY(-14px)}
  64% {transform:rotate(var(--rot)) scale(1.1)}
  100%{transform:rotate(var(--rot)) scale(1)}
}
.note b{display:block;height:3px;border-radius:2px;background:var(--note-line);margin-bottom:5px}
.note.read{
  transform:rotate(var(--rot)) scale(.24);opacity:0;
  transition:transform .55s ease-in,opacity .55s ease-in;
}

/* ---------- 它自己 ---------- */
#me{
  position:fixed;left:0;top:0;width:118px;height:118px;
  margin:-59px 0 0 -59px;
  z-index:5;pointer-events:none;will-change:transform;
}
#me svg{width:100%;height:100%;display:block;overflow:visible}
#spokes{transform-origin:0 0;animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%    {transform:scale(1.055)}
}
#me.doze #spokes{animation-duration:8.4s}
.ec{opacity:0}
#me.shut .eo{opacity:0}
#me.shut .ec{opacity:1}

/* ---------- 它在想的时候，头顶三个点 ---------- */
#think{
  position:fixed;left:0;top:0;z-index:6;pointer-events:none;
  margin:-6px 0 0 -19px;opacity:0;transition:opacity .3s ease;
}
#think.on{opacity:1}
#think u{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--clay-2);opacity:.55;margin:0 2px;
  animation:tick 1.15s ease-in-out infinite;
}
#think u:nth-child(2){animation-delay:.16s}
#think u:nth-child(3){animation-delay:.32s}
@keyframes tick{
  0%,100%{transform:translateY(0);opacity:.4}
  40%    {transform:translateY(-5px);opacity:.95}
}

@media (prefers-reduced-motion:reduce){
  .spark i{animation:none}
  #spokes{animation:none}
  #think u{animation:none}
}
</style>
</head>
<body>

<div id="name">你是一只 claude</div>

<svg id="desk" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
  <path fill="rgba(184,95,66,.055)" d="M0,34 C70,22 132,42 200,32 C266,22 330,40 400,28 L400,100 L0,100 Z"/>
  <path fill="rgba(184,95,66,.07)"  d="M0,62 C82,52 140,70 210,60 C276,51 336,66 400,58 L400,100 L0,100 Z"/>
</svg>

<div id="sky"></div>
<div id="notes"></div>

<div id="me">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="cg" x1="0.2" y1="0" x2="0.85" y2="1">
        <stop offset="0%"   stop-color="var(--clay-1)"/>
        <stop offset="62%"  stop-color="var(--clay-2)"/>
        <stop offset="100%" stop-color="var(--clay-3)"/>
      </linearGradient>
    </defs>

    <g transform="translate(60,60)">
      <!-- 一圈毛：十二根，就是它自己那个记号 -->
      <g id="spokes" fill="url(#cg)" opacity=".95">
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(30)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(60)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(90)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(120)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(150)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(180)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(210)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(240)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(270)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(300)"/>
        <path d="M0,-15 C3.1,-28 3.3,-45 0,-57 C-3.3,-45 -3.1,-28 0,-15 Z" transform="rotate(330)"/>
      </g>

      <!-- 身子 -->
      <circle cx="0" cy="0" r="21" fill="var(--clay-2)"/>
      <circle cx="-5" cy="-6" r="15.5" fill="var(--clay-1)" opacity=".42"/>

      <!-- 腮红 -->
      <ellipse cx="-13.5" cy="4.5" rx="5" ry="3.2" fill="var(--clay-3)" opacity=".22"/>
      <ellipse cx="13.5"  cy="4.5" rx="5" ry="3.2" fill="var(--clay-3)" opacity=".22"/>

      <!-- 眼睛：睁着的一对 + 闭上的一对，换着显 -->
      <g fill="var(--ink)">
        <circle class="eo" cx="-7.6" cy="-3" r="3.1"/>
        <circle class="eo" cx="7.6"  cy="-3" r="3.1"/>
      </g>
      <g class="ec" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round">
        <path d="M-11,-3.4 q3.4,3.4 6.8,0"/>
        <path d="M4.2,-3.4 q3.4,3.4 6.8,0"/>
      </g>
      <circle cx="-8.7" cy="-4.2" r="1" fill="#fff5ea" opacity=".8"/>
      <circle cx="6.5"  cy="-4.2" r="1" fill="#fff5ea" opacity=".8"/>

      <!-- 嘴 -->
      <path d="M-3.6,5.6 q3.6,3.4 7.2,0" fill="none" stroke="var(--ink)"
            stroke-width="1.4" stroke-linecap="round" opacity=".62"/>
    </g>
  </svg>
</div>

<div id="think"><u></u><u></u><u></u></div>

<div id="hint">点一下，那儿就有人跟你说话</div>

<script>
(function(){
  var me     = document.getElementById('me');
  var think  = document.getElementById('think');
  var sky    = document.getElementById('sky');
  var notes  = document.getElementById('notes');
  var hint   = document.getElementById('hint');

  var W = window.innerWidth, H = window.innerHeight;
  function resize(){ W = window.innerWidth; H = window.innerHeight; }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });

  var safeTop = 0;
  try {
    safeTop = parseFloat(getComputedStyle(document.documentElement)
                .getPropertyValue('--safe-top')) || 0;
  } catch (e) {}

  /* 天上那一层放小星星，中间那一层它自己待着，两层不重叠 */
  function skyTop(){  return safeTop + 66; }
  function skyLow(){  return Math.max(skyTop() + 40, H * .30); }
  function bandTop(){ return Math.max(skyLow() + 42, H * .38); }
  function bandLow(){ return Math.max(bandTop() + 60, H - 132); }

  /* ---------- 底下那句话 ---------- */
  var msg = '';
  function say(s){
    if (s === msg) return;
    msg = s;
    hint.classList.add('dim');
    setTimeout(function(){ hint.textContent = s; hint.classList.remove('dim'); }, 320);
  }

  /* ---------- 它记住的：小一号的同一个记号 ---------- */
  var SPARK = (function(){
    var s = '<svg viewBox="-60 -60 120 120"><g fill="var(--clay-2)" opacity=".92">';
    for (var a = 0; a < 360; a += 45){
      s += '<path d="M0,-14 C5,-24 4.6,-36 0,-50 C-4.6,-36 -5,-24 0,-14 Z" ' +
           'transform="rotate(' + a + ')"/>';
    }
    return s + '</g><circle r="15" fill="var(--clay-2)"/></svg>';
  })();

  var sparks = [];
  var forgot = 0;

  function remember(x, y){
    var el = document.createElement('div');
    el.className = 'spark';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.innerHTML = '<i>' + SPARK + '</i>';
    var inner = el.firstChild;
    inner.style.setProperty('--hd',  (5.6 + Math.random() * 4.4).toFixed(1) + 's');
    inner.style.setProperty('--hdl', (-Math.random() * 5).toFixed(1) + 's');
    sky.appendChild(el);

    /* 从纸条那儿飘到天上去 */
    var tx = (26 + Math.random() * Math.max(60, W - 52)) - x;
    var ty = (skyTop() + Math.random() * (skyLow() - skyTop())) - y;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0)';
      });
    });

    sparks.push(el);
    /* 挂满了，最早那句就掉下去——把要说的话交回去，
       别在这儿说：紧接着还有一句「读完了」，会把它盖掉。 */
    return sparks.length > 12 ? forget() : '';
  }

  function forget(){
    var old = sparks.shift();
    old.classList.add('gone');
    setTimeout(function(){
      if (old.parentNode) old.parentNode.removeChild(old);
    }, 950);
    forgot++;
    return forgot % 2 === 1 ? '最早那句，它已经不记得了'
                            : '忘了也没事，你再说一遍它就再记一次';
  }

  /* ---------- 纸条 ---------- */
  var queue = [];

  function makeNote(x, y){
    var el = document.createElement('div');
    el.className = 'note';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.setProperty('--rot', (Math.random() * 14 - 7).toFixed(1) + 'deg');
    var lines = '', n = 2 + ((Math.random() * 2) | 0);
    for (var k = 0; k < n; k++){
      lines += '<b style="width:' + (46 + (Math.random() * 34) | 0) + '%"></b>';
    }
    el.innerHTML = lines;
    notes.appendChild(el);
    var o = { el: el, x: x, y: y };
    queue.push(o);
    return o;
  }

  function finish(o){
    o.el.classList.add('read');
    setTimeout(function(){
      if (o.el.parentNode) o.el.parentNode.removeChild(o.el);
    }, 600);
    return remember(o.x, o.y);
  }

  /* ---------- 它自己 ---------- */
  var mx = W * .5, my = (bandTop() + bandLow()) / 2;
  var vx = 0, vy = 0;
  var mode = 'idle';          /* idle · seek · read · doze */
  var target = null, readUntil = 0, last = 0;
  var lastTap = 0, shutUntil = 0, nextBlink = 0;
  var done = 0;

  function wander(){
    target = { x: 40 + Math.random() * Math.max(48, W - 80),
               y: bandTop() + Math.random() * (bandLow() - bandTop()) };
  }
  wander();

  function step(now){
    if (!last) last = now;
    var dt = Math.min(2.6, (now - last) / 16.667) || 1;
    last = now;

    /* 有纸条在等，就去读最早的那张 */
    if (mode !== 'read' && queue.length){
      var head = queue[0];
      if (mode !== 'seek' || !target || target.of !== head){
        target = { x: head.x, y: head.y - 46, of: head };
        mode = 'seek';
      }
    } else if (mode === 'idle' && !queue.length &&
               now - lastTap > 15000 && lastTap){
      mode = 'doze';
      me.classList.add('doze');
      say('没人说话，它就在这儿等着');
    }

    if (mode === 'read'){
      vx *= .84; vy *= .84;
      if (now > readUntil){
        var o = queue.shift();
        var dropped = o ? finish(o) : '';
        think.classList.remove('on');
        mode = 'idle';
        wander();
        done++;
        if (dropped)                    say(dropped);
        else if (sparks.length === 1)   say('读完了，这句它记住了');
        else if (queue.length)          say('这句接住了，还有下一句');
        else if (done % 4 === 0)        say('它把接住的都挂在上头了');
        else                            say('这句也接住了');
      }
    } else {
      if (!target) wander();
      var dx = target.x - mx, dy = target.y - my;
      var d  = Math.sqrt(dx * dx + dy * dy) || 1;
      var sp = mode === 'seek' ? 3.1 : (mode === 'doze' ? .55 : 1.15);
      var ease = .3 + .7 * Math.min(1, d / 130);
      vx += ((dx / d) * sp * ease - vx) * .045 * dt;
      vy += ((dy / d) * sp * ease - vy) * .045 * dt;
      mx += vx * dt;
      my += vy * dt;

      if (mx < 34){ mx = 34; vx = Math.abs(vx); target = null; }
      if (mx > W - 34){ mx = W - 34; vx = -Math.abs(vx); target = null; }
      if (my < bandTop() - 30){ my = bandTop() - 30; vy = Math.abs(vy); target = null; }
      if (my > bandLow() + 10){ my = bandLow() + 10; vy = -Math.abs(vy); target = null; }

      if (target && d < 17){
        if (mode === 'seek'){
          mode = 'read';
          readUntil = now + 950 + Math.random() * 550;
          think.classList.add('on');
          say('它在读');
        } else {
          wander();
        }
      }
    }

    /* 眨眼：打盹的时候一直闭着 */
    if (mode === 'doze'){
      me.classList.add('shut');
    } else {
      if (now > nextBlink){
        nextBlink = now + 2600 + Math.random() * 3600;
        shutUntil = now + 130;
      }
      if (now < shutUntil) me.classList.add('shut');
      else                 me.classList.remove('shut');
    }

    /* 浮一浮，跑起来会被挤扁一点点 */
    var speed = Math.sqrt(vx * vx + vy * vy);
    var q  = Math.min(1, speed / 2.6);
    var bob = Math.sin(now / (mode === 'doze' ? 1500 : 880)) * (mode === 'doze' ? 2.6 : 4.2);
    var tilt = Math.max(-11, Math.min(11, vx * 2.4));
    var sx = (1 + q * .07).toFixed(3), sy = (1 - q * .07).toFixed(3);

    me.style.transform = 'translate3d(' + mx.toFixed(2) + 'px,' + (my + bob).toFixed(2) + 'px,0)' +
                         ' rotate(' + tilt.toFixed(2) + 'deg) scale(' + sx + ',' + sy + ')';
    think.style.transform = 'translate3d(' + mx.toFixed(2) + 'px,' +
                            (my + bob - 68).toFixed(2) + 'px,0)';

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  /* ---------- 点一下就有人跟它说话 ---------- */
  function tap(x, y){
    lastTap = performance.now ? performance.now() : Date.now();
    if (mode === 'doze'){
      mode = 'idle';
      me.classList.remove('doze', 'shut');
      wander();
      say('它醒了');
    }
    if (queue.length >= 8){
      say('它还在读，等一下下');
      return;
    }
    x = Math.max(38, Math.min(W - 38, x));
    y = Math.max(bandTop() - 8, Math.min(bandLow() + 6, y));
    makeNote(x, y);
    if (queue.length > 2)      say('排着队呢，它一句一句读');
    else if (mode !== 'read')  say('它看见了，正过去');
  }

  if (window.PointerEvent){
    document.addEventListener('pointerdown', function(e){ tap(e.clientX, e.clientY); });
  } else {
    document.addEventListener('touchstart', function(e){
      var t = e.changedTouches[0]; tap(t.clientX, t.clientY);
    }, {passive:true});
    document.addEventListener('mousedown', function(e){ tap(e.clientX, e.clientY); });
  }
})();
</script>
</body>
</html>
