<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f8f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>你是一朵蓝玫瑰</title>
<meta name="description" content="玫瑰里没有蓝色，杯子里有。点一下滴一滴，它就蓝一次；停手，又白回去。">
<style>
:root{
  --paper-1:#f8f7f4;
  --paper-2:#e5e6ee;
  --ink:#3b3a42;
  --ink-dim:rgba(59,58,66,.55);
  --leaf:#a8b5a1;
  --leaf-d:#8b9985;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
         system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(120% 56% at 50% 6%, #fefefd 0%, rgba(254,254,253,0) 62%),
    linear-gradient(180deg,var(--paper-1) 0%,var(--paper-1) 44%,var(--paper-2) 100%);
  font-family:var(--font);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;
}

#name{
  flex:none;
  margin-top:calc(var(--safe-top) + 22px);
  font-size:13.5px;letter-spacing:.22em;
  color:var(--ink-dim);pointer-events:none;
}

#stage{
  flex:1;width:100%;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:10px 0 2px;
}
#rose{
  width:min(88vw,330px);max-width:100%;max-height:100%;
  display:block;overflow:visible;
}

#hint{
  flex:none;
  margin-bottom:calc(var(--safe-bottom) + 26px);
  padding:0 30px;min-height:3em;
  text-align:center;font-size:14.5px;line-height:1.9;letter-spacing:.05em;
  color:var(--ink-dim);pointer-events:none;
  transition:opacity .45s ease;
}
#hint.dim{opacity:.1}

/* 白的一份、蓝的一份共用同一套形状，靠 use 上挂的自定义属性各自上色。
   花是写死在标签里的，脚本不跑它也还在。 */
#bloom .d{fill:var(--td)}
#bloom .m{fill:var(--tm)}
#bloom .l{fill:var(--tl)}
#bloom path{stroke:var(--ts);stroke-width:var(--tsw,.8);stroke-linejoin:round}
#bloom .c{fill:none;stroke:var(--tc);stroke-width:1.9;stroke-linecap:round}
#veins path{fill:none;stroke:var(--tv);stroke-width:var(--tvw,1);stroke-linecap:round}

#sway{transform-origin:110px 262px;animation:sway 8.2s ease-in-out infinite alternate}
@keyframes sway{ from{transform:rotate(-1.1deg)} to{transform:rotate(1.1deg)} }
#head{transform-origin:110px 140px;animation:nod 6.1s ease-in-out infinite alternate}
@keyframes nod{ from{transform:rotate(1.4deg)} to{transform:rotate(-1.4deg)} }
.ring{animation:spread 2.8s ease-out forwards}
@keyframes spread{
  0%  {opacity:.5;transform:scale(.1)}
  100%{opacity:0;transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){
  #sway,#head{animation:none}
  .ring{animation:none;opacity:0}
}
</style>
</head>
<body>

<div id="name">你是一朵蓝玫瑰</div>

<div id="stage">
<svg id="rose" viewBox="56 68 108 212" preserveAspectRatio="xMidYMid meet"
     aria-label="一朵插在玻璃杯里的玫瑰">
  <defs>
    <linearGradient id="pw"  x1=".2" y1="0" x2=".78" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#faf8f4"/><stop offset="100%" stop-color="#f1eee7"/>
    </linearGradient>
    <linearGradient id="pwm" x1=".2" y1="0" x2=".78" y2="1">
      <stop offset="0%" stop-color="#fbf9f5"/><stop offset="100%" stop-color="#e8e4dc"/>
    </linearGradient>
    <linearGradient id="pwd" x1=".2" y1="0" x2=".78" y2="1">
      <stop offset="0%" stop-color="#efece4"/><stop offset="100%" stop-color="#dad6cb"/>
    </linearGradient>
    <linearGradient id="bl"  x1=".2" y1="0" x2=".78" y2="1">
      <stop offset="0%" stop-color="#9aa8f7"/><stop offset="55%" stop-color="#6f80ea"/><stop offset="100%" stop-color="#4658d8"/>
    </linearGradient>
    <linearGradient id="blm" x1=".2" y1="0" x2=".78" y2="1">
      <stop offset="0%" stop-color="#7688ee"/><stop offset="100%" stop-color="#3548c8"/>
    </linearGradient>
    <linearGradient id="bld" x1=".2" y1="0" x2=".78" y2="1">
      <stop offset="0%" stop-color="#4a5cd2"/><stop offset="100%" stop-color="#1d2984"/>
    </linearGradient>

    <!-- 染色的前锋：一块实心往上推，前面带一条柔边 -->
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000"/><stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <mask id="mHead" maskUnits="userSpaceOnUse" x="50" y="40" width="130" height="260">
      <rect id="hSoft" x="50" y="150" width="130" height="30" fill="url(#soft)"/>
      <rect id="hFill" x="50" y="180" width="130" height="160" fill="#fff"/>
    </mask>
    <mask id="mVein" maskUnits="userSpaceOnUse" x="50" y="40" width="130" height="260">
      <rect id="vSoft" x="50" y="150" width="130" height="24" fill="url(#soft)"/>
      <rect id="vFill" x="50" y="174" width="130" height="160" fill="#fff"/>
    </mask>
    <mask id="mStem" maskUnits="userSpaceOnUse" x="50" y="110" width="130" height="190">
      <rect id="sSoft" x="50" y="270" width="130" height="20" fill="url(#soft)"/>
      <rect id="sFill" x="50" y="290" width="130" height="210" fill="#fff"/>
    </mask>

    <clipPath id="cupClip">
      <path d="M83,213 L87,261 Q88,267 94,267 L126,267 Q132,267 133,261 L137,213 Z"/>
    </clipPath>

    <g id="bloom" transform="translate(110,113)">
        <path class="d" d="M-5.9,-12 C-10.2,-20.9 -4.7,-34.5 15.7,-33.9 C30.9,-21.9 24,-8.9 13.8,-5.1 C2.5,-5.4 2.5,-5.4 -5.9,-12 Z"/>
        <path class="d" d="M11.3,-8.6 C19.7,-14.9 36.2,-14.6 41.9,2.5 C33.5,18.8 17.1,17.1 9.8,9.8 C6.7,0.4 6.7,0.4 11.3,-8.6 Z"/>
        <path class="d" d="M12.9,6.7 C22.3,11.7 27.1,25.5 10.2,35.5 C-10.2,33.6 -13.4,19.4 -7.7,11.2 C1.6,5.7 1.6,5.7 12.9,6.7 Z"/>
        <path class="d" d="M-3.4,12.7 C-5.9,22.1 -19.5,30.3 -35.6,19.4 C-39.8,1.9 -25.4,-5.1 -14.6,-2.9 C-5.7,3.1 -5.7,3.1 -3.4,12.7 Z"/>
        <path class="d" d="M-14.9,1.1 C-25.9,2 -39.1,-6.7 -32.2,-23.5 C-14.4,-32.4 -2.3,-22.6 -1.3,-13 C-5.2,-3.8 -5.2,-3.8 -14.9,1.1 Z"/>
        <path class="m" d="M2.4,-8.4 C4.6,-16.2 14.7,-22.2 26.8,-14.6 C29.4,-1.7 18.8,3.5 9.8,1.8 C3.8,-2.1 3.8,-2.1 2.4,-8.4 Z"/>
        <path class="m" d="M10,-0.6 C19.2,-1.2 28.8,5.3 24.2,17.7 C11,23.8 2,16.6 1,8.7 C3.4,2.5 3.4,2.5 10,-0.6 Z"/>
        <path class="m" d="M3.7,8.1 C7.2,15.5 3.2,25.5 -11.8,25.5 C-22.6,16.4 -17.6,6.8 -9.1,3.5 C-1.7,3.6 -1.7,3.6 3.7,8.1 Z"/>
        <path class="m" d="M-7.7,5.6 C-14.7,10.7 -26.9,10.5 -31.5,-1.9 C-24.9,-13.6 -12.9,-12.4 -6.7,-6.5 C-4.5,-0.3 -4.5,-0.3 -7.7,5.6 Z"/>
        <path class="m" d="M-8.5,-4.6 C-16.3,-8.9 -19.8,-19 -7.6,-26.7 C7.2,-24.8 9.6,-14.5 5,-7.5 C-1.1,-3.8 -1.1,-3.8 -8.5,-4.6 Z"/>
        <path class="l" d="M3.3,-4.4 C6.8,-9 14.9,-10.2 20.7,-1.6 C16.7,7.8 8.5,7.9 4.1,3.8 C2.7,-0.2 2.7,-0.2 3.3,-4.4 Z"/>
        <path class="l" d="M5,2.8 C10.4,5.9 11.8,13 1.8,18 C-9,14.6 -9.1,7.4 -4.4,3.6 C0.2,2.3 0.2,2.3 5,2.8 Z"/>
        <path class="l" d="M-3.3,4.4 C-6.8,9 -14.9,10.2 -20.7,1.6 C-16.7,-7.8 -8.5,-7.9 -4.1,-3.8 C-2.7,0.2 -2.7,0.2 -3.3,4.4 Z"/>
        <path class="l" d="M-5,-2.8 C-10.4,-5.9 -11.8,-13 -1.8,-18 C9,-14.6 9.1,-7.4 4.4,-3.6 C-0.2,-2.3 -0.2,-2.3 -5,-2.8 Z"/>
        <circle class="l" cx="0" cy="0" r="8"/>
        <path class="l" d="M2.4,-1.5 C5.5,-3.5 10.2,-1.9 10,5 C3.2,8.7 -0.7,5.9 -0.3,2.6 C1.2,0.6 1.2,0.6 2.4,-1.5 Z"/>
        <path class="l" d="M0.3,2.6 C0.7,5.9 -3.2,8.7 -10,5 C-10.2,-1.9 -5.5,-3.5 -2.4,-1.5 C-1.2,0.6 -1.2,0.6 0.3,2.6 Z"/>
        <path class="l" d="M-2.7,-1.1 C-6.2,-2.4 -7,-6.7 -0,-10 C7,-6.7 6.2,-2.4 2.7,-1.1 C-0,-1.2 -0,-1.2 -2.7,-1.1 Z"/>
        <path class="c" d="M4.4,-1.6 C4.6,-5.2 1.6,-7.4 -1.6,-6.4 C-5.4,-5.2 -6.4,-0.6 -4,2 C-1,5.2 4.2,4.6 6.6,1.2 C9.2,-2.4 8,-7.6 4,-9.6"/>
    </g>

    <g id="veins" transform="translate(110,113)">
        <path d="M-3.3,-2 C-7.8,-3.9 -14.7,-7.4 -22.5,-11.3"/>
        <path d="M-1.8,-3.1 C-4.8,-6.6 -9,-12.5 -13.8,-19.2"/>
        <path d="M0.3,-3.5 C0,-7.8 0,-14.8 0,-22.6"/>
        <path d="M2.4,-2.8 C4.8,-6.6 9,-12.5 13.8,-19.2"/>
        <path d="M3.6,-1.5 C7.8,-3.9 14.7,-7.4 22.5,-11.3"/>
    </g>
  </defs>

  <g id="sway">
    <path d="M110,262 C107,230 113,190 110,146" fill="none"
          stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/>
    <g mask="url(#mStem)">
      <path d="M110,262 C107,230 113,190 110,146" fill="none"
            stroke="#5a68c2" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g id="leaves">
      <path d="M112,172 C125,164 145,166 153,176 C141,187 121,185 112,172 Z"
            fill="var(--leaf)" stroke="var(--leaf-d)" stroke-width=".9"/>
      <path d="M114,172 C127,170 141,173 151,177" fill="none" stroke="var(--leaf-d)" stroke-width=".8"/>
      <path d="M109,198 C97,190 78,193 71,203 C83,214 100,211 109,198 Z"
            fill="#b3bfab" stroke="var(--leaf-d)" stroke-width=".9"/>
      <path d="M107,199 C95,198 83,201 73,204" fill="none" stroke="var(--leaf-d)" stroke-width=".8"/>
    </g>

    <!-- 花萼：三小片，托住花底 -->
    <g fill="var(--leaf-d)" opacity=".9">
      <path d="M110,148 C106,144 103,138 103,133 C106,138 108,140 110,141
               C112,140 114,138 117,133 C117,138 114,144 110,148 Z"/>
      <path d="M105,141 C100,143 97,147 96,151 C100,148 103,145 105,143 Z"/>
      <path d="M115,141 C120,143 123,147 124,151 C120,148 117,145 115,143 Z"/>
    </g>

    <g id="head">
      <use href="#bloom" style="--td:url(#pwd);--tm:url(#pwm);--tl:url(#pw);--tc:rgba(120,113,98,.24);--ts:rgba(120,113,98,.28)"/>
      <use href="#veins" style="--tv:rgba(120,113,98,.22)"/>
      <use href="#veins" mask="url(#mVein)" style="--tv:#1d2984;--tvw:1.3"/>
      <use href="#bloom" mask="url(#mHead)"
           style="--td:url(#bld);--tm:url(#blm);--tl:url(#bl);--tc:rgba(12,20,88,.34);--ts:rgba(16,26,100,.28)"/>
    </g>
  </g>

  <g id="cup">
    <g clip-path="url(#cupClip)">
      <rect id="water" x="77" y="227" width="66" height="46" fill="#e3e9f0"/>
      <g id="rings" fill="none" stroke="#3548c8" stroke-width="1"></g>
    </g>
    <ellipse id="surface" cx="110" cy="227" rx="25.5" ry="3.6" fill="#eff3f7"/>
    <path d="M83,213 L87,261 Q88,267 94,267 L126,267 Q132,267 133,261 L137,213 Z"
          fill="rgba(255,255,255,.28)" stroke="rgba(59,58,66,.18)" stroke-width="1.3"/>
    <ellipse cx="110" cy="213" rx="27" ry="4.1" fill="none"
             stroke="rgba(59,58,66,.2)" stroke-width="1.3"/>
    <path d="M91,220 L95,256" fill="none" stroke="rgba(255,255,255,.8)"
          stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
</div>

<div id="hint">杯子里是清水，它是白的</div>

<script>
(function(){
  var hint = document.getElementById('hint');
  var hSoft=document.getElementById('hSoft'), hFill=document.getElementById('hFill');
  var vSoft=document.getElementById('vSoft'), vFill=document.getElementById('vFill');
  var sSoft=document.getElementById('sSoft'), sFill=document.getElementById('sFill');
  var water=document.getElementById('water'), surface=document.getElementById('surface');
  var rings=document.getElementById('rings');

  /* 染到哪儿了。t=0 时整条柔边都还压在花底下面，一点不蓝；t=1 全蓝。 */
  function front(soft, fill, top, bottom, band, t){
    var lo = bottom + band;
    var y = lo - (lo - top) * Math.max(0, Math.min(1, t));
    soft.setAttribute('y', (y - band).toFixed(1));
    fill.setAttribute('y', y.toFixed(1));
  }

  var target = 0;   /* 水里的墨有多浓 */
  var risen  = 0;   /* 已经爬到茎里的 */
  var dye    = 0;   /* 花实际喝上去多少 */
  var stage = -1, last = 0, idle = 0;

  var LINES = [
    '杯子里是清水，它是白的',
    '一滴。它要过一会儿才喝到',
    '上来了，先是茎',
    '脉络先蓝，然后才轮到边上',
    '玫瑰里没有蓝色——它自己长不出这个颜色',
    '现在它是蓝的了'
  ];

  function say(s){
    if (!s || s === hint.dataset.now) return;
    hint.dataset.now = s;
    hint.classList.add('dim');
    setTimeout(function(){ hint.textContent = s; hint.classList.remove('dim'); }, 300);
  }

  function drop(){
    idle = 0;
    if (target > 1.26) say('够了，再多它喝不下');
    else target = Math.min(1.45, target + .18);

    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    var cx = (99 + Math.random()*22).toFixed(1), cy = (232 + Math.random()*22).toFixed(1);
    c.setAttribute('class','ring');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r','19');
    c.style.transformOrigin = cx + 'px ' + cy + 'px';
    rings.appendChild(c);
    setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 2900);
  }
  window.addEventListener('pointerdown', drop, {passive:true});

  function mix(a, b, t){
    function hx(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }
    var A = hx(a), B = hx(b), o = '#';
    for (var i = 0; i < 3; i++){
      var v = Math.round(A[i] + (B[i]-A[i])*t).toString(16);
      o += (v.length < 2 ? '0' : '') + v;
    }
    return o;
  }

  function frame(now){
    if (!last) last = now;
    var dt = Math.min(.1, (now - last)/1000); last = now;

    /* 水里的墨被一点点喝掉，喝多了的那部分退得快些 */
    if (target > 0) target = Math.max(0, target - .022 * dt * (target > 1 ? 2.4 : 1));
    risen += (target - risen) * Math.min(1, dt * 1.5);
    dye   += (risen  - dye)   * Math.min(1, dt * .55);

    var t = Math.max(0, Math.min(1, dye));
    front(hSoft, hFill, 74,  148, 30, t);
    front(vSoft, vFill, 80,  144, 24, Math.min(1, t*1.25 + .03));
    front(sSoft, sFill, 128, 266, 20, Math.min(1, risen*2.2));

    var wc = Math.min(1, target*.92);
    water.setAttribute('fill', mix('#e3e9f0', '#3548c8', wc));
    surface.setAttribute('fill', mix('#eff3f7', '#7688ee', wc));

    var st;
    if (dye < .02 && target < .02) st = 0;
    else if (dye < .06) st = 1;
    else if (dye < .22) st = 2;
    else if (dye < .52) st = 3;
    else if (dye < .9)  st = 4;
    else                st = 5;

    if (st !== stage){
      if (st < stage){
        if (st === 0)      say('又白回去了。再滴一滴，它就再蓝一次');
        else if (st === 3) say('蓝在退。它不长这个颜色，得一直有人送');
        else if (st === 4) say('退了一点，还够');
      } else {
        say(LINES[st]);
      }
      stage = st;
    }

    idle += dt;
    if (idle > 22 && target < .04 && dye < .04){ idle = 0; say('点一下，滴一滴蓝墨水'); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
