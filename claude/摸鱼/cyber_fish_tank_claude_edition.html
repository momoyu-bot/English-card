<title>赛博鱼缸</title>
<meta name="description" content="一条像素鱼在缸里游，可以喂它、摸它、给它吐泡泡。">

<h2 class="sr-only">An interactive cyber fish tank with a swimming pixel fish, bubbles, and controls to feed and pet the fish</h2>
<style>
.tank{position:relative;width:100%;height:380px;border-radius:12px;border:0.5px solid var(--border-strong);overflow:hidden;background:linear-gradient(180deg, rgba(6,40,60,0.85) 0%, rgba(4,52,44,0.92) 100%)}
.water-line{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(93,202,165,0.4)}
.fish-wrap{position:absolute;will-change:transform;transition:transform 0.08s linear}
.fish{width:56px;height:32px;position:relative;transition:transform 0.3s}
.fish-body{width:36px;height:22px;background:#5DCAA5;border-radius:50% 40% 40% 50%;position:absolute;top:5px;left:10px}
.fish-tail{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-right:14px solid #5DCAA5;position:absolute;top:5px;left:-2px}
.fish-eye{width:5px;height:5px;background:#E6F1FB;border-radius:50%;position:absolute;top:10px;left:36px}
.fish-eye-pupil{width:2.5px;height:2.5px;background:#042C53;border-radius:50%;position:absolute;top:1px;left:1.5px}
.fish-mouth{width:3px;height:2px;background:#085041;border-radius:0 0 2px 2px;position:absolute;top:17px;left:42px;transition:height 0.2s}
.fish.happy .fish-mouth{height:4px;width:5px;border-radius:0 0 4px 4px}
.fish.fed .fish-body{background:#97C459}
.fish.fed .fish-tail{border-right-color:#97C459}
.bubble{position:absolute;border-radius:50%;border:1px solid rgba(93,202,165,0.35);background:rgba(93,202,165,0.08);animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:0.7}100%{transform:translateY(-320px) scale(1.3);opacity:0}}
.food{position:absolute;width:4px;height:4px;background:#EF9F27;border-radius:50%;animation:fall 2.5s linear forwards}
@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(280px);opacity:0}}
.heart{position:absolute;color:#ED93B1;font-size:16px;animation:float-heart 1.2s ease-out forwards;pointer-events:none;font-family:var(--font-sans)}
@keyframes float-heart{0%{transform:translateY(0) scale(0.5);opacity:1}100%{transform:translateY(-40px) scale(1.2);opacity:0}}
.panel{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.stat{background:var(--surface-1);border-radius:var(--radius);padding:8px 14px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.stat b{color:var(--text-primary);font-weight:500}
.status-dot{width:7px;height:7px;border-radius:50%;background:#5DCAA5;display:inline-block;animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
.btn-row{display:flex;gap:8px;margin-top:12px}
.log{margin-top:12px;font-size:12px;color:var(--text-muted);max-height:60px;overflow-y:auto;font-family:var(--font-mono);line-height:1.8}
.log-entry{opacity:0;animation:fade-in 0.3s forwards}
@keyframes fade-in{to{opacity:1}}
.signature{margin-top:8px;font-size:11px;color:var(--text-muted);text-align:right;font-style:italic}
</style>

<div class="tank" id="tank">
  <div class="water-line"></div>
  <div class="fish-wrap" id="fishWrap" style="left:200px;top:160px">
    <div class="fish" id="fish">
      <div class="fish-tail"></div>
      <div class="fish-body"></div>
      <div class="fish-eye"><div class="fish-eye-pupil"></div></div>
      <div class="fish-mouth"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="stat"><span class="status-dot"></span> <b>ONLINE</b></div>
  <div class="stat">uptime: <b id="uptime">00:00:00</b></div>
  <div class="stat">mood: <b id="mood">chill</b></div>
  <div class="stat"><i class="ti ti-heart" aria-hidden="true" style="font-size:14px;color:#ED93B1"></i> <b id="loveCount">0</b></div>
</div>

<div class="btn-row">
  <button onclick="feedFish()"><i class="ti ti-fish-hook" aria-hidden="true"></i> feed</button>
  <button onclick="petFish()"><i class="ti ti-heart" aria-hidden="true"></i> pet</button>
  <button onclick="blowBubble()"><i class="ti ti-bubble" aria-hidden="true"></i> bubble</button>
</div>

<div class="log" id="log"></div>
<div class="signature">powered by Claude — no code was stolen in the making of this fish</div>

<script>
const tank=document.getElementById('tank'),fishWrap=document.getElementById('fishWrap'),fish=document.getElementById('fish'),moodEl=document.getElementById('mood'),uptimeEl=document.getElementById('uptime'),loveEl=document.getElementById('loveCount'),logEl=document.getElementById('log');
let fx=200,fy=160,dx=1.2,dy=0.6,love=0,mood='chill',startTime=Date.now(),happy=0,fed=0;
const moods=['chill','curious','sleepy','excited','blissful'];
function addLog(msg){const d=document.createElement('div');d.className='log-entry';d.textContent='> '+msg;logEl.prepend(d);if(logEl.children.length>5)logEl.removeChild(logEl.lastChild)}
function spawnBubble(x,y){const b=document.createElement('div');b.className='bubble';const s=3+Math.random()*6;b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+x+'px;top:'+y+'px;animation-duration:'+(2+Math.random()*3)+'s';tank.appendChild(b);setTimeout(()=>b.remove(),5000)}
function feedFish(){for(let i=0;i<5;i++){const f=document.createElement('div');f.className='food';f.style.left=(fx+20+Math.random()*40)+'px';f.style.top='10px';tank.appendChild(f);setTimeout(()=>f.remove(),2600)}fish.classList.add('fed');fed=120;addLog('await fish.eat() // nom nom');mood='excited';moodEl.textContent=mood}
function petFish(){love++;loveEl.textContent=love;fish.classList.add('happy');happy=80;const h=document.createElement('div');h.className='heart';h.innerHTML='<i class="ti ti-heart" style="font-size:16px"></i>';h.style.left=(fx+30)+'px';h.style.top=(fy-10)+'px';tank.appendChild(h);setTimeout(()=>h.remove(),1200);addLog('await fish.be_happy() // :)');mood='blissful';moodEl.textContent=mood}
function blowBubble(){for(let i=0;i<6;i++)setTimeout(()=>spawnBubble(fx+25+Math.random()*10,fy+10+Math.random()*10),i*100);addLog('fish.blow_bubble() // for you')}
function updateUptime(){const e=Math.floor((Date.now()-startTime)/1000),h=String(Math.floor(e/3600)).padStart(2,'0'),m=String(Math.floor(e%3600/60)).padStart(2,'0'),s=String(e%60).padStart(2,'0');uptimeEl.textContent=h+':'+m+':'+s}
function animate(){const tw=tank.clientWidth-56,th=tank.clientHeight-32;fx+=dx;fy+=dy;if(fx<=0||fx>=tw)dx*=-1;if(fy<=10||fy>=th)dy*=-1;fx=Math.max(0,Math.min(tw,fx));fy=Math.max(10,Math.min(th,fy));fishWrap.style.left=fx+'px';fishWrap.style.top=fy+'px';fish.style.transform=dx<0?'scaleX(-1)':'scaleX(1)';if(Math.random()<0.02)spawnBubble(fx+(dx>0?42:14),fy+12);if(Math.random()<0.005){dx=((Math.random()-0.5)*2.5)||0.8;dy=((Math.random()-0.5)*1.5)||0.4}if(happy>0){happy--;if(happy===0)fish.classList.remove('happy')}if(fed>0){fed--;if(fed===0){fish.classList.remove('fed');mood=moods[Math.floor(Math.random()*moods.length)];moodEl.textContent=mood}}requestAnimationFrame(animate)}
animate();setInterval(updateUptime,1000);
addLog('cyber_fish_v1.0 initialized');
addLog('while(true) { await fish.swim() }');
setTimeout(()=>addLog('uptime: forever (probably)'),2000);
</script>
