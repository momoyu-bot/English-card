<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clawd 蹦迪现场</title>
<meta name="description" content="方壳、竖眼缝、四条短腿，照官方 Clawd 的点阵画的。换舞步、调快慢、叫伙伴上台。">
<style>
:root{
  --bg:#f1edf7;
  --card:#ffffff;
  --ink:#2a1b45;
  --muted:#6d5d8c;
  --violet:#2b1b56;
  --violet-2:#3d2a71;
  --violet-3:#5a44a0;
  --crab:#d1663f;
  --line:rgba(43,27,86,.12);
  --sans:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, "Helvetica Neue", sans-serif;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bot:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding:calc(var(--safe-top) + 14px) 14px calc(var(--safe-bot) + 28px);
}
.wrap{max-width:520px;margin:0 auto;}

/* ---- 门楣：深紫圆角条 + 右边棋盘格，格子里有只小螃蟹 ---- */
.banner{
  position:relative;
  background:var(--violet);
  border-radius:20px;
  height:96px;
  overflow:hidden;
  display:flex;
  align-items:center;
  box-shadow:0 8px 20px -12px rgba(43,27,86,.7);
}
.banner .checks{
  position:absolute; right:0; top:0; bottom:0; width:104px;
  background-image:conic-gradient(#b8a7d9 0 25%, #8271b5 0 50%, #b8a7d9 0 75%, #8271b5 0);
  background-size:13px 13px;
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 22%);
  mask-image:linear-gradient(90deg, transparent, #000 22%);
}
.banner h1{
  position:relative;
  margin:0;
  padding-left:22px;
  font-size:27px;
  font-weight:600;
  letter-spacing:.01em;
  color:#fdfbff;
}
#badge{position:absolute;right:10px;bottom:6px;image-rendering:pixelated;}

/* ---- 舞台 ---- */
.stage-box{
  margin-top:16px;
  position:relative;
  border-radius:18px;
  overflow:hidden;
  background:#150c2a;
  line-height:0;
  box-shadow:0 14px 28px -18px rgba(43,27,86,.9);
}
#stage{display:block;width:100%;image-rendering:pixelated;touch-action:manipulation;cursor:pointer;}
.bubble{
  position:absolute;
  left:50%;
  top:8px;
  transform:translateX(-50%);
  background:rgba(255,252,248,.95);
  color:#2a1b45;
  font-size:13px;
  line-height:1.4;
  padding:6px 12px;
  border-radius:12px;
  white-space:nowrap;
  max-width:92%;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:opacity .35s;
  pointer-events:none;
}

/* ---- 控件 ---- */
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
button{
  flex:1 1 auto;
  min-height:46px;
  padding:0 14px;
  border:none;
  border-radius:14px;
  background:var(--violet-2);
  color:#fff;
  font-family:inherit;
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:translateY(1px);}
button.ghost{background:var(--card);color:var(--violet-2);box-shadow:inset 0 0 0 1.5px var(--line);}
button.on{background:var(--crab);color:#fff;box-shadow:none;}
.speed{
  margin-top:12px;
  background:var(--card);
  border-radius:14px;
  padding:10px 14px 6px;
  box-shadow:inset 0 0 0 1.5px var(--line);
}
.speed label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);}
input[type=range]{width:100%;margin:6px 0 2px;accent-color:var(--crab);}
.hint{margin:14px 2px 0;font-size:13px;color:var(--muted);}
.hint b{font-weight:600;color:var(--ink);}

/* ---- 老板键：一张很无聊的白纸 ---- */
#boss{
  position:fixed; inset:0; display:none; z-index:9;
  background:#fff; color:#333;
  padding:calc(var(--safe-top) + 26px) 22px 22px;
  font-size:15px;
}
#boss.show{display:block;}
#boss h2{font-size:17px;font-weight:600;margin:0 0 4px;}
#boss .meta{font-size:12px;color:#9a9a9a;margin-bottom:18px;}
#boss .bar{height:11px;border-radius:3px;background:#eee;margin:11px 0;}
#boss .foot{margin-top:26px;font-size:12px;color:#c4c4c4;}
</style>
</head>
<body>
<div class="wrap">

  <div class="banner">
    <h1>Clawd 蹦迪现场</h1>
    <div class="checks"></div>
    <canvas id="badge"></canvas>
  </div>

  <div class="stage-box">
    <canvas id="stage"></canvas>
    <div class="bubble" id="bubble" style="opacity:0">下班了就该这样</div>
  </div>

  <div class="row">
    <button id="btnMove">舞步 · 串烧</button>
    <button id="btnFriend" class="ghost">叫伙伴</button>
  </div>
  <div class="row">
    <button id="btnMusic" class="ghost">放音乐</button>
    <button id="btnBoss" class="ghost">散场</button>
  </div>

  <div class="speed">
    <label><span>速度</span><span id="bpmTxt">112 拍</span></label>
    <input type="range" id="bpm" min="64" max="176" step="2" value="112">
  </div>

  <p class="hint">点舞池会撒亮片，它们一起举钳子欢呼。电脑上：<b>空格</b>换舞步、<b>M</b> 开关音乐、<b>Esc</b> 散场。</p>
</div>

<div id="boss">
  <h2>周报草稿</h2>
  <div class="meta">未保存 · 刚刚</div>
  <div class="bar" style="width:86%"></div>
  <div class="bar" style="width:94%"></div>
  <div class="bar" style="width:72%"></div>
  <div class="bar" style="width:90%"></div>
  <div class="bar" style="width:41%"></div>
  <div class="bar" style="width:88%"></div>
  <div class="bar" style="width:63%"></div>
  <div class="foot">点一下回舞池</div>
</div>

<script>
(function(){
'use strict';

/* ========== 像素画笔：逻辑像素 -> 设备像素，整数对齐，绝不糊 ========== */
function painter(cv, LW, LH){
  var ctx = cv.getContext('2d');
  var s = 1;
  function fit(cssW){
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    var w = Math.max(120, Math.round(cssW));
    s = (w / LW) * dpr;
    cv.style.width = w + 'px';
    cv.style.height = Math.round(w * LH / LW) + 'px';
    cv.width = Math.round(LW * s);
    cv.height = Math.round(LH * s);
    ctx.imageSmoothingEnabled = false;
  }
  function px(x, y, w, h, color){
    var x0 = Math.round(x * s), y0 = Math.round(y * s);
    var x1 = Math.round((x + w) * s), y1 = Math.round((y + h) * s);
    if (x1 <= x0 || y1 <= y0) return;
    ctx.fillStyle = color;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  }
  function line(x0, y0, x1, y1, color, t){
    t = t || 1;
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    var err = dx + dy, guard = 0;
    while (guard++ < 300){
      px(x0, y0, t, t, color);
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * err;
      if (e2 >= dy){ err += dy; x0 += sx; }
      if (e2 <= dx){ err += dx; y0 += sy; }
    }
  }
  function ellipse(cx, cy, rx, ry, color, shear){
    if (rx < 0.4 || ry < 0.4) return;
    shear = shear || 0;
    var top = Math.ceil(ry);
    for (var dy = -top; dy <= top; dy++){
      var k = 1 - (dy * dy) / (ry * ry);
      if (k <= 0) continue;
      var w = rx * Math.sqrt(k);
      var off = shear * (-dy);
      px(cx - w + off, cy + dy, Math.max(1, w * 2), 1, color);
    }
  }
  function clear(color){ ctx.fillStyle = color; ctx.fillRect(0, 0, cv.width, cv.height); }
  return { fit:fit, px:px, line:line, ellipse:ellipse, clear:clear };
}

/* ========== 小螃蟹：照着官方 Clawd 的点阵来 ==========
   量自官方那张图：28 格宽 × 17 格高。身体是一块 22×14 的方壳，
   中间一条带向两侧各伸出 3 格是钳，底下四条 2 格宽的短腿，
   脸上只有两道竖着的黑眼缝。珊瑚色 rgb(212,127,89) 是原色。
   它可爱全靠少画，所以这里不加高光、不加腮红、不加嘴。       */
var CORAL = '#d47f59';
function shell(hue){
  return hue === null ? CORAL : 'hsl(' + hue + ',56%,59%)';
}

function drawCrab(P, c, p, beat, groundY){
  var u = c.unit, col = c.col, i;
  var cx = c.x + p.ox * u;
  var hh = 7 * p.sy;                      /* 身体半高（格） */
  var bb = groundY - 3 * u + p.oy * u;    /* 身体底沿；底下三格是腿 */
  var by = bb - hh * u;                   /* 身体中心 */
  var hw = 11 * p.sx;                     /* 身体半宽（格） */
  var lean = Math.round(p.lean) * u;      /* 上半身整格地晃，不斜切 */

  /* 影子 */
  P.px(cx - hw * u * 0.9, groundY + u * 0.8, hw * 1.8 * u, u * 0.9,
       'rgba(18,7,38,' + (0.26 - p.air * 0.1) + ')');

  /* 四条短腿 */
  var legX = [-8.5, -4.5, 4.5, 8.5];
  for (i = 0; i < 4; i++){
    var ph = (beat + c.phase) * Math.PI * p.legSpeed + i * 0.55;
    var lift = Math.max(0, Math.sin(ph)) * p.legAmp;
    var lx = cx + (legX[i] * p.sx - 1) * u;
    var top = bb - u;
    var bot = groundY - (lift + p.air * 6) * u;
    if (bot > top) P.px(lx, top, 2 * u, bot - top, col);
  }

  /* 两侧的钳：平时贴在身体中间，举起来就整块往上挪 */
  for (var q = 0; q < 2; q++){
    var side = q === 0 ? -1 : 1;
    var up = q === 0 ? p.armL : p.armR;
    var cyo = (0.5 - up * 7.4) * u * p.sy;
    var ext = (3 + p.open * 1.2) * u;
    var edge = cx + side * hw * u;
    P.px(side < 0 ? edge - ext : edge, by + cyo + lean * 0.6, ext, 3 * u, col);
  }

  /* 方壳：上下两段，上段跟着晃 */
  P.px(cx - hw * u + lean, by - hh * u, hw * 2 * u, hh * u, col);
  P.px(cx - hw * u, by, hw * 2 * u, hh * u, col);

  /* 两道竖眼缝 */
  var eh = p.blink ? 0.9 * u : 3 * u;
  var ey = by - (p.blink ? 1.6 : 3.2) * u * p.sy;
  for (var e = 0; e < 2; e++){
    var ex = cx + ((e ? 6.5 : -6.5) * p.sx - 0.5 + p.eye * 0.6) * u + lean;
    P.px(ex, ey, Math.max(1, u), eh, '#17110e');
  }
}

/* ========== 舞步：输入拍数，输出姿势 ========== */
var MOVES = [
  { id:'mix',  name:'串烧' },
  { id:'bob',  name:'基础晃' },
  { id:'side', name:'蟹步走' },
  { id:'pump', name:'举高高' },
  { id:'spin', name:'转圈圈' },
  { id:'jump', name:'原地蹦' }
];

function poseOf(id, beat, c){
  var t = beat + c.phase;
  var p = { ox:0, oy:0, sx:1, sy:1, lean:0, armL:0, armR:0, open:0,
            legAmp:1.1, legSpeed:1, air:0, eye:0, blink:false };
  var s1 = Math.sin(t * Math.PI);
  var c2 = Math.cos(t * Math.PI / 2);

  if (id === 'bob'){
    p.oy = -Math.abs(s1) * 1.4;
    p.lean = c2;
    p.armL = Math.max(0, s1);
    p.armR = Math.max(0, -s1);
    p.open = 0.2;
    p.eye = c2 * 0.6;
  } else if (id === 'side'){
    p.ox = 9 * Math.sin(t * Math.PI / 2);
    p.oy = -Math.abs(Math.sin(t * Math.PI * 2)) * 0.8;
    p.lean = c2 * 1.3;
    p.legSpeed = 2.4;
    p.legAmp = 2.2;
    p.armL = 0.32 + c2 * 0.22;
    p.armR = 0.32 - c2 * 0.22;
    p.eye = c2 > 0 ? 0.9 : -0.9;
  } else if (id === 'pump'){
    var pulse = Math.pow(Math.abs(s1), 0.55);
    p.armL = p.armR = 0.1 + pulse * 1.2;
    p.oy = -pulse * 1.6;
    p.sy = 1 + pulse * 0.06;
    p.open = pulse * 0.9;
    p.legAmp = 0.7;
    p.lean = Math.sin(t * Math.PI / 4) * 1.2;
  } else if (id === 'spin'){
    var turn = Math.cos(t * Math.PI);
    p.sx = Math.max(0.13, Math.abs(turn));
    p.oy = -1 - Math.abs(Math.sin(t * Math.PI * 2)) * 0.8;
    p.armL = p.armR = 0.85 + 0.2 * Math.sin(t * Math.PI * 2);
    p.open = 0.5;
    p.legSpeed = 1.8;
    p.legAmp = 1.6;
    p.eye = turn > 0 ? 0.8 : -0.8;
  } else if (id === 'jump'){
    var h = Math.pow(Math.max(0, s1), 0.7);
    var squash = Math.pow(Math.max(0, -s1), 0.8);
    p.oy = -h * 7;
    p.air = h;
    p.sy = 1 + h * 0.1 - squash * 0.3;
    p.sx = 1 - h * 0.04 + squash * 0.12;
    p.armL = p.armR = 0.18 + h * 1.05;
    p.open = 0.2 + h * 0.8;
    p.legAmp = 0.4;
    p.legSpeed = 1.5;
    p.lean = Math.sin(t * Math.PI / 2) * 0.8;
  }
  return p;
}

/* ========== 舞台 ========== */
var LW = 160, LH = 84, GROUND = 76;
var stageEl = document.getElementById('stage');
var P = painter(stageEl, LW, LH);
var badgeEl = document.getElementById('badge');
var B = painter(badgeEl, 40, 30);

var floorRows = (function(){
  var rows = [], y = 42, h = 1.6;
  while (y < LH + 6){ rows.push([y, h]); y += h; h *= 1.24; }
  return rows;
})();

var crabs = [];
var HUES = [null, 340, 196, 44, 268];
function rebuild(n){
  crabs = [];
  var gap = n === 1 ? 0 : Math.min(33, 116 / (n - 1));
  var mid = (n - 1) / 2;
  /* 离中间最近的那只穿官方原色，伙伴按远近依次换色 */
  var order = [];
  for (var k = 0; k < n; k++) order.push(k);
  order.sort(function(a, b){ return Math.abs(a - mid) - Math.abs(b - mid); });
  var hueOf = [];
  for (var j = 0; j < n; j++) hueOf[order[j]] = HUES[j % HUES.length];
  for (var i = 0; i < n; i++){
    crabs.push({
      x: LW / 2 + (i - mid) * gap,
      y: GROUND,
      unit: n === 1 ? 1.45 : (n < 4 ? 1.25 : 1.05),
      phase: i * 0.5,
      col: shell(hueOf[i])
    });
  }
  /* 主角始终在中间、最大 */
  crabs.sort(function(a, b){ return a.x - b.x; });
}
rebuild(1);

var sparks = [];
function spark(x, y){
  for (var i = 0; i < 26; i++){
    var a = Math.random() * Math.PI * 2, v = 0.3 + Math.random() * 1.5;
    sparks.push({
      x:x, y:y,
      vx:Math.cos(a) * v, vy:Math.sin(a) * v - 0.9,
      life:1,
      col:['#ffd166','#fff6ee','#ff9ec4','#9ee0ff'][(Math.random() * 4) | 0]
    });
  }
}

var beat = 0, bpm = 112, moveIdx = 0, cheer = 0, last = 0, blinkT = 3;
var bubbleT = 6;
var LINES = ['这条腿是它自己要动的', '横着走才是原速', '钳子举酸了也不放下',
             '节拍在壳里面', '再快一点点', '下班了就该这样',
             '壳是方的，这点不能改', '少画一点才好看', '这拍子踩得刚刚好'];

function currentMove(){
  var m = MOVES[moveIdx];
  if (m.id !== 'mix') return m.id;
  var k = Math.floor(beat / 8) % (MOVES.length - 1);
  return MOVES[k + 1].id;
}

function drawStage(){
  P.clear('#150c2a');
  var pulse = Math.pow(Math.max(0, Math.sin(beat * Math.PI)), 3);

  /* 后墙的三束灯 */
  for (var i = 0; i < 3; i++){
    var swing = Math.sin(beat * 0.42 + i * 2.2);
    var ox = LW / 2 + (i - 1) * 46;
    var hue = (260 + i * 44 + beat * 8) % 360;
    for (var y = 0; y < GROUND; y++){
      var spread = 2 + y * 0.30;
      var cxp = ox + swing * y * 0.34;
      P.px(cxp - spread, y, spread * 2, 1,
           'hsla(' + hue + ',70%,66%,' + (0.10 + 0.05 * pulse) * (1 - y / GROUND * 0.55) + ')');
    }
    P.px(ox - 3, 0, 6, 3, '#241541');
  }

  /* 后墙的彩灯串 */
  for (var L = 0; L < 13; L++){
    var lx = 6 + L * 12.4;
    var ly = 14 + Math.sin(L / 12 * Math.PI) * 9;
    P.px(lx, ly - 2, 1, 2, '#2e1f52');
    var lon = ((L + Math.floor(beat * 2)) % 3 === 0);
    var lhue = (L * 40 + beat * 26) % 360;
    P.px(lx - 1, ly, 3, 3, 'hsl(' + lhue + ',' + (lon ? 85 : 45) + '%,' + (lon ? 70 : 40) + '%)');
    if (lon) P.px(lx - 2, ly - 1, 5, 5, 'hsla(' + lhue + ',85%,70%,.16)');
  }
  for (var LL = 0; LL < 12; LL++){
    var ax = 6 + LL * 12.4, ay = 14 + Math.sin(LL / 12 * Math.PI) * 9;
    var bx3 = 6 + (LL + 1) * 12.4, by3 = 14 + Math.sin((LL + 1) / 12 * Math.PI) * 9;
    P.line(ax, ay - 2, bx3, by3 - 2, '#2e1f52', 1);
  }

  /* 顶上那颗球 */
  var bx = LW / 2, by = 9, br = 5;
  P.px(bx - 0.5, 0, 1, by - br, '#3a2a63');
  for (var dy = -br; dy <= br; dy++){
    var w = Math.round(Math.sqrt(Math.max(0, br * br - dy * dy)));
    for (var dx = -w; dx <= w; dx++){
      var on = ((dx + Math.floor(beat * 2) + (dy + 9)) % 2 === 0);
      P.px(bx + dx, by + dy, 1, 1, on ? 'hsl(' + ((270 + beat * 20) % 360) + ',55%,' + (62 + pulse * 16) + '%)' : '#6b5a9c');
    }
  }

  /* 地板：近大远小的格子，跟着拍换色 */
  for (var r = 0; r < floorRows.length; r++){
    var ry = floorRows[r][0], rh = floorRows[r][1];
    var cw = Math.max(3, rh * 2.1);
    var cols = Math.ceil(LW / cw) + 2;
    for (var cIdx = 0; cIdx < cols; cIdx++){
      var gx = cIdx * cw - cw;
      var on2 = ((cIdx + r + Math.floor(beat)) % 2 === 0);
      var hue2 = (272 + Math.sin(beat * 0.3 + r * 0.4) * 18) % 360;
      var lig = (on2 ? 30 : 19) + pulse * 7 + r * 1.2;
      P.px(gx, ry, cw, rh, 'hsl(' + hue2 + ',48%,' + lig + '%)');
    }
  }
  /* 地板前沿一条亮边 */
  P.px(0, 40.6, LW, 1.4, 'hsla(' + (296 + Math.sin(beat * 0.4) * 16) + ',72%,' + (60 + pulse * 16) + '%,.75)');

}

function draw(now){
  requestAnimationFrame(draw);
  if (!last) last = now;
  var dt = Math.min(0.12, (now - last) / 1000);
  last = now;
  if (boss) return;

  beat += dt * bpm / 60;
  cheer = Math.max(0, cheer - dt * 1.6);

  blinkT -= dt;
  var blinking = blinkT < 0 && blinkT > -0.12;
  if (blinkT < -0.12) blinkT = 2.5 + Math.random() * 3.5;

  bubbleT -= dt;
  if (bubbleT < 0){
    bubbleT = 7 + Math.random() * 7;
    bub.textContent = LINES[(Math.random() * LINES.length) | 0];
    bub.style.opacity = '1';
    setTimeout(function(){ bub.style.opacity = '0'; }, 2600);
  }

  drawStage();

  var id = currentMove();
  for (var i = 0; i < crabs.length; i++){
    var c = crabs[i];
    var p = poseOf(id, beat, c);
    if (cheer > 0){
      var k = Math.min(1, cheer);
      p.armL = p.armL * (1 - k) + 1.35 * k;
      p.armR = p.armR * (1 - k) + 1.35 * k;
      p.open = Math.max(p.open, 0.9 * k);
      p.oy -= k * 1.6;
    }
    p.blink = blinking;
    drawCrab(P, c, p, beat, GROUND);
  }

  /* 亮片 */
  for (var s = sparks.length - 1; s >= 0; s--){
    var sp = sparks[s];
    sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.06; sp.life -= dt * 0.75;
    if (sp.life <= 0){ sparks.splice(s, 1); continue; }
    P.px(sp.x, sp.y, sp.life > 0.5 ? 2 : 1, sp.life > 0.5 ? 2 : 1, sp.col);
  }

  /* 门楣上那只：慢慢挥钳子 */
  B.clear('#2b1b56');
  var bp = poseOf('bob', beat * 0.7, { phase:0 });
  drawCrab(B, { x:20, y:0, unit:0.92, phase:0, col:CORAL }, bp, beat * 0.7, 27);
}

/* ========== 声音：现场合成，不取任何文件 ========== */
var ac = null, master = null, musicOn = false, stepTimer = null, step = 0, nextT = 0;
var MEL = [9, null, 16, 14, 12, null, 9, null, 12, null, 16, null, 17, 16, 14, null];
var BASS = [-3, -3, 4, 4, -3, -3, 2, 2];

function tone(type, freq, t, dur, vol){
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(t, dur, vol, hp){
  var n = Math.floor(ac.sampleRate * dur);
  var buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = ac.createBufferSource(); src.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  var g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t);
}
function hz(n){ return 440 * Math.pow(2, n / 12); }

function schedule(){
  var dur = 60 / bpm / 2;
  while (nextT < ac.currentTime + 0.18){
    var t = nextT, i16 = step % 16;
    if (i16 % 4 === 0) tone('sine', 62, t, 0.16, 0.5);          /* 底鼓 */
    if (i16 % 8 === 4) noise(t, 0.12, 0.18, 1400);              /* 拍手 */
    if (i16 % 2 === 1) noise(t, 0.05, 0.05, 6000);              /* 踩镲 */
    var b = BASS[step % 8];
    tone('triangle', hz(b - 24), t, dur * 0.9, 0.26);
    var m = MEL[i16];
    if (m !== null) tone('square', hz(m), t, dur * 0.85, 0.085);
    nextT += dur;
    step++;
  }
}
function musicToggle(){
  if (!musicOn){
    if (!ac){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC){ btnMusic.textContent = '这台放不出'; return; }
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.34;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    musicOn = true; step = 0; nextT = ac.currentTime + 0.08;
    stepTimer = setInterval(schedule, 25);
    btnMusic.textContent = '静音';
    btnMusic.className = 'on';
  } else {
    musicOn = false;
    clearInterval(stepTimer);
    if (ac) ac.suspend();
    btnMusic.textContent = '放音乐';
    btnMusic.className = 'ghost';
  }
}

/* ========== 控件 ========== */
var bub = document.getElementById('bubble');
var btnMove = document.getElementById('btnMove');
var btnFriend = document.getElementById('btnFriend');
var btnMusic = document.getElementById('btnMusic');
var btnBoss = document.getElementById('btnBoss');
var bossEl = document.getElementById('boss');
var bpmEl = document.getElementById('bpm');
var bpmTxt = document.getElementById('bpmTxt');
var boss = false;

function nextMove(){
  moveIdx = (moveIdx + 1) % MOVES.length;
  btnMove.textContent = '舞步 · ' + MOVES[moveIdx].name;
}
btnMove.addEventListener('click', nextMove);

var friends = 1;
btnFriend.addEventListener('click', function(){
  friends = friends >= 5 ? 1 : friends + 1;
  rebuild(friends);
  btnFriend.textContent = friends === 1 ? '叫伙伴' : '台上 ' + friends + ' 只';
  btnFriend.className = friends === 1 ? 'ghost' : 'on';
  cheer = 1;
  spark(LW / 2, GROUND - 18);
});

btnMusic.addEventListener('click', musicToggle);

function bossToggle(on){
  boss = on;
  bossEl.className = on ? 'show' : '';
  if (on && musicOn) musicToggle();
  if (!on) last = 0;
}
btnBoss.addEventListener('click', function(){ bossToggle(true); });
bossEl.addEventListener('click', function(){ bossToggle(false); });

bpmEl.addEventListener('input', function(){
  bpm = +bpmEl.value;
  bpmTxt.textContent = bpm + ' 拍';
});

stageEl.addEventListener('pointerdown', function(ev){
  var r = stageEl.getBoundingClientRect();
  spark((ev.clientX - r.left) / r.width * LW, (ev.clientY - r.top) / r.height * LH);
  cheer = 1;
  bub.textContent = ['谢谢捧场', '亮片进壳里了', '再来一个'][(Math.random() * 3) | 0];
  bub.style.opacity = '1';
  setTimeout(function(){ bub.style.opacity = '0'; }, 1800);
});

document.addEventListener('keydown', function(ev){
  if (ev.key === ' '){ ev.preventDefault(); nextMove(); }
  else if (ev.key === 'm' || ev.key === 'M') musicToggle();
  else if (ev.key === 'Escape') bossToggle(!boss);
});

function resize(){
  var w = document.querySelector('.stage-box').clientWidth;
  P.fit(w);
  B.fit(88);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();
requestAnimationFrame(draw);

})();
</script>
