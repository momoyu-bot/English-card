<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代码玫瑰</title>
<meta name="description" content="一墙乱码里浮着一朵蓝玫瑰，花瓣是画它的那段代码。不碰它自己流，点一下荡开一圈圈花瓣。">
<style>
:root{
  --surface-0:#f9f9f7;
  --text-secondary:#52514e;
  --text-muted:#898781;
  --font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface-0:#1c1c1b;
    --text-secondary:#c2c0b6;
    --text-muted:#8f8d86;
  }
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface-0)}
body{font-family:var(--font-mono);color:var(--text-muted);-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
#lake{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));margin:0;
  text-align:center;font-size:12px;letter-spacing:.14em;pointer-events:none;transition:opacity 1.6s}
#hint.gone{opacity:0}
.pebble{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:var(--text-secondary);pointer-events:none}
#clawd{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  padding:6px;margin:0;border:0;background:none;cursor:pointer}
#clawd svg{display:block;width:46px;height:auto}
#clawd.hop svg{animation:hop .52s steps(4,end) 1}
#clawd.bob svg{animation:bob .4s steps(3,end) 1}
#clawd:focus-visible{outline:2px solid #5677e0;outline-offset:2px;border-radius:6px}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-5px)}100%{transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="lake" role="img" aria-label="一面字母铺成的湖，湖上浮着一朵用代码字符拼成的蓝玫瑰。点一下，荡开一圈圈花瓣形的涟漪。"></canvas>
<p id="hint">点一下，丢颗石子</p>
<button id="clawd" type="button" aria-label="Clawd：点它，它帮你往湖里丢颗石子">
<svg viewBox="20 50 196 119" shape-rendering="crispEdges" aria-hidden="true">
<g fill="#d47f59">
<rect x="44" y="50" width="147" height="98"/>
<rect x="20" y="99" width="24" height="21"/>
<rect x="191" y="99" width="25" height="21"/>
<rect x="44" y="148" width="15" height="21"/>
<rect x="68" y="148" width="15" height="21"/>
<rect x="152" y="148" width="15" height="21"/>
<rect x="176" y="148" width="15" height="21"/>
</g>
<g fill="#000">
<rect x="70" y="78" width="8" height="21"/>
<rect x="158" y="78" width="8" height="21"/>
</g>
</svg>
</button>
<script>
(function(){
"use strict";

var cv=document.getElementById("lake");
var hint=document.getElementById("hint"),clawd=document.getElementById("clawd");
var reduceQ=matchMedia("(prefers-reduced-motion: reduce)");
var darkQ=matchMedia("(prefers-color-scheme: dark)");
var MONO=getComputedStyle(document.documentElement).getPropertyValue("--font-mono").trim()||"monospace";
var TAU=Math.PI*2;

/* 颜色：0 灰字；1–6 玫瑰（亮到深）；7–9 叶子（亮到深）；10–13 涟漪（蓝到紫） */
var PALS={
  light:{bg:"#f9f9f7",c:["#74726c",
    "#9db3f3","#7a96ec","#5677e0","#3b59c9","#283fa2","#19296f",
    "#9fb6a3","#6f8f77","#3f5d49",
    "#4f7cf0","#5868e4","#7360da","#9466d2"]},
  dark:{bg:"#1c1c1b",c:["#8f8d86",
    "#d6e0ff","#adc2ff","#85a2f8","#6281ea","#4865c9","#33479b",
    "#a6c4ad","#7f9f87","#4d6856",
    "#7d9dff","#8b8dff","#a587ff","#c38ef2"]}
};
var pal,dark=false,NC=14;

/* 2D simplex 噪声，给湖面底下那股暗流用 */
var perm=new Uint8Array(512),GX=[1,-1,1,-1,1,-1,0,0],GY=[1,1,-1,-1,0,0,1,-1];
(function(){var p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;
  for(i=255;i>0;i--){j=Math.floor(Math.random()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}
  for(i=0;i<512;i++)perm[i]=p[i&255];})();
var F2=0.5*(Math.sqrt(3)-1),G2=(3-Math.sqrt(3))/6;
function noise(xin,yin){
  var s=(xin+yin)*F2,i=Math.floor(xin+s),j=Math.floor(yin+s),t=(i+j)*G2;
  var x0=xin-i+t,y0=yin-j+t,i1=x0>y0?1:0,j1=1-i1;
  var x1=x0-i1+G2,y1=y0-j1+G2,x2=x0-1+2*G2,y2=y0-1+2*G2;
  var ii=i&255,jj=j&255,n=0,g,q;
  q=0.5-x0*x0-y0*y0;if(q>0){g=perm[ii+perm[jj]]&7;q*=q;n+=q*q*(GX[g]*x0+GY[g]*y0);}
  q=0.5-x1*x1-y1*y1;if(q>0){g=perm[ii+i1+perm[jj+j1]]&7;q*=q;n+=q*q*(GX[g]*x1+GY[g]*y1);}
  q=0.5-x2*x2-y2*y2;if(q>0){g=perm[ii+1+perm[jj+1]]&7;q*=q;n+=q*q*(GX[g]*x2+GY[g]*y2);}
  return 70*n;
}

/* 花瓣从花心往外一层层排；n 是这一层几片，tw 是往里拧的劲。屏幕小就少一层，不然挤成一团 */
var LAY4=[
  {rho:.27,n:3,off:0.0,tw:4.2},
  {rho:.51,n:4,off:1.3,tw:0.9},
  {rho:.74,n:5,off:2.4,tw:0.3},
  {rho:.95,n:6,off:0.9,tw:0.1}
];
var LAY3=[
  {rho:.33,n:3,off:0.0,tw:3.6},
  {rho:.65,n:5,off:2.4,tw:0.5},
  {rho:.95,n:6,off:0.9,tw:0.1}
];
var LAY=LAY4,NL=4;
var LEAF=[{a:0.6,len:1.56},{a:2.55,len:1.48},{a:4.45,len:1.52}];
var sway=[0,0,0,0];
var RC=0,RL=0,RT=0,Rpx=100,angNow=0;

function roseAt(x,y){
  RC=0;RT=0;
  var r=Math.sqrt(x*x+y*y);
  if(r>1.6)return;
  var th=Math.atan2(y,x),ths=th+angNow;
  var ca=Math.abs(Math.cos(ths)),sa=Math.abs(Math.sin(ths));
  var cellT=0.5*(sa*cw+ca*ch)/Rpx;
  var prev=0,k,Ly,seg,q,f,edge,L;
  for(k=0;k<NL;k++){
    Ly=LAY[k];seg=TAU/Ly.n;
    q=(th-Ly.off-Ly.tw*r-sway[k])/seg;
    f=q-Math.round(q);
    edge=Ly.rho*(1-0.68*f*f);
    if(r<edge){
      var t=(r-prev)/(edge-prev);
      t=t*t*(3-2*t);
      L=0.06+0.94*Math.pow(t,0.8);
      if(t>0.35){
        var cz=(0.5-Math.abs(f))*seg*r/(cellT*2.6);
        if(cz<1)L*=0.5+0.5*cz;
      }
      L*=0.86+0.14*Math.cos(th-2.4);
      RC=1;RT=1;RL=L<0?0:L>1?1:L;return;
    }
    prev=edge;
  }
  for(k=0;k<3;k++){
    var a=LEAF[k].a,c1=Math.cos(a),s1=Math.sin(a);
    var al=x*c1+y*s1,pe=-x*s1+y*c1;
    if(al<0.7||al>LEAF[k].len)continue;
    var s=(al-0.7)/(LEAF[k].len-0.7),hw=0.2*Math.pow(Math.sin(Math.PI*Math.pow(s,1.25)),0.75);
    var ap=pe<0?-pe:pe;
    if(ap<hw){
      var u=ap/hw;
      L=0.1+0.85*Math.pow(u,0.6);
      if(u>0.85)L*=0.75;
      RC=1;RT=2;RL=L;return;
    }
  }
}

/* 字：'!' 到 '~' 共 94 个；湖面只用字母数字，玫瑰用下面这段代码自己 */
var ALNUM=[],AL="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
for(var i0=0;i0<AL.length;i0++)ALNUM.push(AL.charCodeAt(i0)-33);
function rndChar(){return ALNUM[(Math.random()*ALNUM.length)|0];}
var SRC=(document.currentScript&&document.currentScript.textContent||"").replace(/[^\x21-\x7e]/g,"");
var s0=SRC.indexOf("functionroseAt");if(s0>0)SRC=SRC.slice(s0)+SRC.slice(0,s0);
if(!SRC)SRC="functionroseAt(x,y){}";

var W=0,H=0,DPR=1,fs=12,cw=8,ch=16,cwD=16,chD=32,cols=0,rows=0,N=0;
var glyph,isCode,cell,washBuf;
var restX=0,restY=0,R0=100,clawdX=0,clawdY=0;

/* 画字：能用显卡就一次画完整屏；不行就一格一格贴 */
var gl=null,ctx=null,atlas=null,G={};
function makeAtlas(colored){
  var a=document.createElement("canvas"),nr=colored?NC*2:2;
  a.width=94*cwD;a.height=nr*chD;
  var x=a.getContext("2d");
  x.textAlign="center";x.textBaseline="middle";
  for(var r=0;r<nr;r++){
    x.font=(r&1?"700 ":"400 ")+(fs*DPR)+"px "+MONO;
    x.fillStyle=colored?pal.c[r>>1]:"#fff";
    var y=r*chD+chD/2+DPR*0.5;
    for(var g=0;g<94;g++)x.fillText(String.fromCharCode(33+g),g*cwD+cwD/2,y);
  }
  return a;
}
function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

var VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
var FS="#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n"+
  "uniform sampler2D uC,uA,uP,uT;uniform vec2 uGrid,uCell,uAS;uniform float uH;uniform vec3 uBg;"+
  "void main(){vec2 p=vec2(gl_FragCoord.x,uH-gl_FragCoord.y);vec2 c=floor(p/uCell);"+
  "vec4 d=texture2D(uC,(c+.5)/uGrid);float g=floor(d.r*255.+.5),cb=floor(d.g*255.+.5);"+
  "float b=mod(cb,2.),ci=floor(cb/2.+.01);vec2 q=p-c*uCell;"+
  "float m=texture2D(uA,(vec2(g*uCell.x,b*uCell.y)+q)/uAS).a;"+
  "vec3 col=texture2D(uP,vec2((ci+.5)/16.,.5)).rgb;"+
  "vec4 tn=texture2D(uT,p/(uCell*uGrid));"+
  "gl_FragColor=vec4(mix(uBg*(1.-tn.a)+tn.rgb,col,m*d.b),1.);}";

function tex(smooth){var t=gl.createTexture(),f=smooth?gl.LINEAR:gl.NEAREST;gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,f);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,f);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
function initGL(){
  var g;
  try{g=cv.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false});}catch(e){g=null;}
  if(!g)return false;
  gl=g;
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
  try{
    var pr=gl.createProgram();
    gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error("link");
    gl.useProgram(pr);
    var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var lp=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
    ["uC","uA","uP","uT","uGrid","uCell","uAS","uH","uBg"].forEach(function(n){G[n]=gl.getUniformLocation(pr,n);});
    G.tC=tex();G.tA=tex();G.tP=tex();G.tT=tex(true);
    gl.uniform1i(G.uC,0);gl.uniform1i(G.uA,1);gl.uniform1i(G.uP,2);gl.uniform1i(G.uT,3);
  }catch(e){gl=null;return false;}
  return true;
}
function uploadStatic(){
  if(gl){
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,G.tA);
    var a=makeAtlas(false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,a);
    gl.uniform2f(G.uAS,a.width,a.height);
    var pb=new Uint8Array(64);
    for(var i=0;i<NC;i++){var c=hexRGB(pal.c[i]);pb[i*4]=c[0];pb[i*4+1]=c[1];pb[i*4+2]=c[2];pb[i*4+3]=255;}
    gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,G.tP);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,16,1,0,gl.RGBA,gl.UNSIGNED_BYTE,pb);
    var bg=hexRGB(pal.bg);gl.uniform3f(G.uBg,bg[0]/255,bg[1]/255,bg[2]/255);
    gl.uniform2f(G.uGrid,cols,rows);gl.uniform2f(G.uCell,cwD,chD);gl.uniform1f(G.uH,cv.height);
    gl.viewport(0,0,cv.width,cv.height);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,G.tC);
  }else{
    atlas=makeAtlas(true);
    tintCv=document.createElement("canvas");tintCv.width=cols;tintCv.height=rows*2;
    tintImg=tintCv.getContext("2d").createImageData(cols,rows*2);
  }
}
var tintCv=null,tintImg=null;
function draw(){
  if(gl){
    gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,G.tT);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,cols,rows*2,0,gl.RGBA,gl.UNSIGNED_BYTE,washBuf);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,G.tC);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,cols,rows,0,gl.RGBA,gl.UNSIGNED_BYTE,cell);
    gl.drawArrays(gl.TRIANGLES,0,3);
    return;
  }
  ctx.globalAlpha=1;ctx.fillStyle=pal.bg;ctx.fillRect(0,0,cv.width,cv.height);
  var td=tintImg.data;
  for(var i=0;i<N*8;i+=4){var ta=washBuf[i+3];td[i+3]=ta;
    if(ta){td[i]=washBuf[i]*255/ta;td[i+1]=washBuf[i+1]*255/ta;td[i+2]=washBuf[i+2]*255/ta;}}
  tintCv.getContext("2d").putImageData(tintImg,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(tintCv,0,0,cols,rows*2,0,0,cols*cwD,rows*chD);
  for(var row=0;row<rows;row++)for(var col=0;col<cols;col++){
    var o=(row*cols+col)*4,al=cell[o+2];
    if(al<5)continue;
    ctx.globalAlpha=al/255;
    ctx.drawImage(atlas,cell[o]*cwD,cell[o+1]*chD,cwD,chD,col*cwD,row*chD,cwD,chD);
  }
}

function setTheme(){dark=darkQ.matches;pal=dark?PALS.dark:PALS.light;palRGB=pal.c.map(hexRGB);}
var palRGB=[];

function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  fs=W<560?10:W>1600?12:11;
  var m=document.createElement("canvas").getContext("2d");
  m.font=fs+"px "+MONO;
  var gw=m.measureText("0").width||fs*0.6;
  cwD=Math.round((gw+(W<560?1.3:1.8))*DPR);chD=Math.round(fs*1.3*DPR);
  cw=cwD/DPR;ch=chD/DPR;
  cols=Math.ceil(W/cw)+1;rows=Math.ceil(H/ch)+1;N=cols*rows;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  restX=W*0.5;restY=H*0.47;
  R0=Math.min(W*0.4,H*0.3);
  if(R0<230){LAY=LAY3;NL=3;}else{LAY=LAY4;NL=4;}
  glyph=new Uint8Array(N);isCode=new Uint8Array(N);cell=new Uint8Array(N*4);washBuf=new Uint8Array(N*8);
  var p=0,lim=(R0*1.6)*(R0*1.6);
  for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){
    var k=j*cols+i,dx=(i+0.5)*cw-restX,dy=(j+0.5)*ch-restY;
    if(dx*dx+dy*dy<lim){glyph[k]=SRC.charCodeAt(p%SRC.length)-33;isCode[k]=1;p++;}
    else glyph[k]=rndChar();
  }
  var b=clawd.getBoundingClientRect();
  clawdX=b.left+b.width/2;clawdY=b.top+b.height/2;
  uploadStatic();
}

/* 玫瑰浮在水上：位置、开合、转动都挂在弹簧上 */
var rose={ox:0,oy:0,vx:0,vy:0,bloom:0,bv:0,ang:0,spin:0};
var ripples=[],pebbles=[],T=0,nextAuto=1.2,touched=false;
var mx=-1e5,my=-1e5,mouseOn=false,lastWX=-1e5,lastWY=-1e5,downTouch=false;

function drop(x,y,amp,n,hue){
  var rings=n?3:2;
  ripples.push({x:x,y:y,t0:T,amp:amp,n:n,depth:n?0.24:0,rot0:Math.random()*TAU,rings:rings,hue:hue,
    r:[0,0,0],s:[1,1,1],A:[0,0,0],rot:[0,0,0],pr:[0,0,0],rmin2:0,rmax2:0,dead:false});
  if(ripples.length>26)ripples.shift();
}
function hopClawd(cls){
  if(clawd.classList.contains("hop"))return;
  clawd.classList.remove("bob");
  void clawd.offsetWidth;
  clawd.classList.add(cls);
}
clawd.addEventListener("animationend",function(){clawd.classList.remove("hop","bob");});

function wake(){if(!touched){touched=true;hint.classList.add("gone");}}

cv.addEventListener("pointerdown",function(e){
  wake();
  var x=e.clientX,y=e.clientY,rx=restX+rose.ox,ry=restY+rose.oy;
  var dx=x-rx,dy=y-ry,R=R0*(1+rose.bloom);
  if(dx*dx+dy*dy<R*R*0.8){
    rose.bv+=0.75;rose.spin+=0.5;
    drop(rx,ry,1.0,5,0);
  }else{
    drop(x,y,1.0,5+((Math.random()*3)|0),0);
  }
  if(e.pointerType!=="mouse"){downTouch=true;lastWX=x;lastWY=y;}
});
cv.addEventListener("pointermove",function(e){
  var x=e.clientX,y=e.clientY;
  if(e.pointerType==="mouse"){mx=x;my=y;mouseOn=true;}
  else if(!downTouch)return;
  if(reduceQ.matches)return;
  var dx=x-lastWX,dy=y-lastWY;
  if(dx*dx+dy*dy>110*110){
    if(lastWX>-1e4)drop(x,y,0.3,0,0);
    lastWX=x;lastWY=y;
  }
});
addEventListener("pointerup",function(){downTouch=false;});
addEventListener("pointercancel",function(){downTouch=false;});
cv.addEventListener("pointerleave",function(){mouseOn=false;mx=my=-1e5;lastWX=lastWY=-1e5;});

clawd.addEventListener("click",function(){
  wake();hopClawd("hop");
  var a=Math.random()*TAU,d=R0*(0.35+Math.random()*0.75);
  var el=document.createElement("i");el.className="pebble";document.body.appendChild(el);
  pebbles.push({x0:clawdX,y0:clawdY-14,x1:restX+rose.ox+Math.cos(a)*d,y1:restY+rose.oy+Math.sin(a)*d*0.8,t0:T,dur:0.75,el:el});
});

function ringsAt(rp,age){
  var gap=0.3,v0=Math.max(110,Math.min(W,H)*0.21),alive=false,rmin=1e9,rmax=0;
  for(var j=0;j<3;j++){
    rp.pr[j]=rp.r[j];
    var a=age-j*gap;
    if(j>=rp.rings||a<=0){rp.A[j]=0;continue;}
    var r=v0*a/(1+0.12*a);
    rp.r[j]=r;rp.s[j]=9+0.045*r;
    rp.A[j]=rp.amp*(1-0.2*j)*Math.min(1,a/0.12)*Math.exp(-a/2.3);
    rp.rot[j]=rp.rot0+j*Math.PI/(rp.n||1)+a*0.12;
    if(rp.A[j]>0.006){
      alive=true;
      var lo=j===0?0:r*(1-rp.depth)-3*rp.s[j],hi=r+3*rp.s[j];
      if(lo<rmin)rmin=lo;if(hi>rmax)rmax=hi;
    }
  }
  if(rmin<0)rmin=0;
  rp.rmin2=rmin*rmin;rp.rmax2=rmax*rmax;
  if(!alive&&age>1)rp.dead=true;
}

function update(dt){
  var motion=reduceQ.matches?0.35:1;
  T+=dt;
  for(var k=0;k<4;k++)sway[k]=Math.sin(T*0.23*motion+k*0.8)*0.06;

  var rx=restX+rose.ox,ry=restY+rose.oy,fx=0,fy=0;
  for(var q=0;q<ripples.length;q++){
    var rp=ripples[q];
    ringsAt(rp,T-rp.t0);
    var dx=rx-rp.x,dy=ry-rp.y,d=Math.sqrt(dx*dx+dy*dy)+1e-3;
    var ddx=clawdX-rp.x,ddy=clawdY-rp.y,dc=Math.sqrt(ddx*ddx+ddy*ddy);
    for(var j=0;j<rp.rings;j++){
      if(rp.A[j]<0.006)continue;
      var z=(d-rp.r[j])/(rp.s[j]+R0*0.3),g=rp.A[j]*Math.exp(-z*z);
      if(d>R0*0.2){fx+=dx/d*g;fy+=dy/d*g;}
      rose.bv+=g*dt*1.2;
      if(rp.pr[j]<dc&&rp.r[j]>=dc&&rp.A[j]>0.12)hopClawd("bob");
    }
  }
  var i;
  for(i=ripples.length-1;i>=0;i--)if(ripples[i].dead)ripples.splice(i,1);

  var drift=reduceQ.matches?0:1;
  var tx=Math.sin(T*0.13)*R0*0.03*drift,ty=Math.cos(T*0.11)*R0*0.025*drift;
  rose.vx+=(-(rose.ox-tx)*3-rose.vx*2.2+fx*260)*dt;
  rose.vy+=(-(rose.oy-ty)*3-rose.vy*2.2+fy*260)*dt;
  rose.ox+=rose.vx*dt;rose.oy+=rose.vy*dt;
  rose.bv+=(-rose.bloom*26-rose.bv*4.2)*dt;
  rose.bloom+=rose.bv*dt;
  rose.spin*=Math.exp(-dt*1.4);
  rose.ang+=(0.035*motion+rose.spin)*dt;

  for(i=pebbles.length-1;i>=0;i--){
    var pb=pebbles[i],u=(T-pb.t0)/pb.dur;
    if(u>=1){
      drop(pb.x1,pb.y1,0.95,5+((Math.random()*3)|0),1);
      pb.el.remove();pebbles.splice(i,1);continue;
    }
    var dd=Math.hypot(pb.x1-pb.x0,pb.y1-pb.y0);
    var X=pb.x0+(pb.x1-pb.x0)*u,Y=pb.y0+(pb.y1-pb.y0)*u-(0.22*dd+50)*4*u*(1-u);
    pb.el.style.transform="translate("+X.toFixed(1)+"px,"+Y.toFixed(1)+"px)";
  }

  if(!reduceQ.matches&&T>nextAuto){
    drop(restX+rose.ox,restY+rose.oy,0.5,5,0);
    nextAuto=T+8+Math.random()*5;
  }
}

/* 底色：每格上下各取一点，花瓣的边才不糊 */
function tone(kind,L){return kind===1?1+Math.round((1-L)*5):7+Math.round((1-L)*2);}
function washOf(kind,L){return kind===1?(dark?0.05+0.3*L:0.13+0.24*(1-L)):(dark?0.05+0.2*L:0.08+0.2*(1-L));}
function putWash(o,a,c){
  if(a>0){var pc=palRGB[c];washBuf[o]=pc[0]*a;washBuf[o+1]=pc[1]*a;washBuf[o+2]=pc[2]*a;washBuf[o+3]=a*255;}
  else washBuf[o]=washBuf[o+1]=washBuf[o+2]=washBuf[o+3]=0;
}
function compute(){
  var motion=reduceQ.matches?0.35:1,tt=T*motion;
  var rx=restX+rose.ox,ry=restY+rose.oy,Rc=R0*(1+rose.bloom+0.012*Math.sin(T*0.8));
  var lim=(Rc*1.6)*(Rc*1.6),cs=Math.cos(-rose.ang),sn=Math.sin(-rose.ang),inv=1/Rc;
  Rpx=Rc;angNow=rose.ang;
  var live=[],q,j;
  for(q=0;q<ripples.length;q++)if(ripples[q].rmax2>0)live.push(ripples[q]);
  var nl=live.length,hov=mouseOn&&!reduceQ.matches;
  var scr=reduceQ.matches?0.0004:0.0016;

  for(var row=0;row<rows;row++){
    var py=(row+0.5)*ch;
    for(var col=0;col<cols;col++){
      var px=(col+0.5)*cw,k=row*cols+col;
      var tint=0,hue=0,ddx=0,ddy=0;
      for(q=0;q<nl;q++){
        var rp=live[q],dx=px-rp.x,dy=py-rp.y,d2=dx*dx+dy*dy;
        if(d2<rp.rmin2||d2>rp.rmax2)continue;
        var d=Math.sqrt(d2)+1e-6,th=rp.n?Math.atan2(dy,dx):0;
        for(j=0;j<rp.rings;j++){
          var A=rp.A[j];if(A<0.006)continue;
          var rr=rp.r[j];
          if(rp.n)rr*=1-rp.depth+rp.depth*Math.abs(Math.cos(rp.n*(th-rp.rot[j])*0.5));
          var z=(d-rr)/rp.s[j];
          if(j===0&&z<0){var w=d/rr;tint+=A*0.14*w*w;hue+=A*0.14*w*w*rp.hue;}
          if(z>3||z<-3)continue;
          var g=A*Math.exp(-z*z);
          tint+=g;hue+=g*(rp.hue+j);
          var push=-z*g*5/d;ddx+=dx*push;ddy+=dy*push;
        }
      }
      if(hov){
        var hx=px-mx,hy=py-my,h2=hx*hx+hy*hy;
        if(h2<9000){var hh=1-Math.sqrt(h2)/95;hh*=hh;tint+=hh*0.4;}
      }
      var sx=px+ddx,sy=py+ddy;
      var w1=noise(sx*0.0012+tt*0.035,sy*0.0012);
      var w2=noise(sx*0.0012-7.3,sy*0.0012+tt*0.03);
      var v=noise(sx*0.0026+w1*1.3+tt*0.018,sy*0.0045+w2*1.3-tt*0.012);
      var b=(v+0.2)/1.05;b=b<0?0:b>1?1:b;b=b*b*(3-2*b);
      var alpha=0.035+0.42*b*b,ci=0,bold=alpha>0.34;

      var lx=px+ddx*0.4-rx,ly=py+ddy*0.4-ry,l2=lx*lx+ly*ly,onRose=false;
      var wa0=0,wa1=0,wc0=0,wc1=0;
      if(l2<lim){
        var y0=ly-ch*0.25,y1=ly+ch*0.25;
        roseAt((lx*cs-y0*sn)*inv,(lx*sn+y0*cs)*inv);
        var c0=RC,L0=RL,k0=RT;
        roseAt((lx*cs-y1*sn)*inv,(lx*sn+y1*cs)*inv);
        var c1=RC,L1=RL,k1=RT;
        if(c0||c1){
          onRose=true;
          var L=c0&&c1?(L0+L1)/2:c0?L0:L1,kind=k0===1||k1===1?1:2;
          ci=tone(kind,L);
          if(kind===1){
            alpha=dark?0.14+0.86*Math.pow(L,0.9):0.26+0.74*Math.pow(1-L,0.9);
            bold=dark?L>0.6:L<0.45;
          }else{
            alpha=dark?0.18+0.7*L:0.28+0.66*(1-L);
            bold=dark?L>0.7:L<0.3;
          }
          if(c0){wa0=washOf(k0,L0);wc0=tone(k0,L0);}
          if(c1){wa1=washOf(k1,L1);wc1=tone(k1,L1);}
          if(tint>0.22){
            var t1=tint>1?1:tint,h1=Math.round(hue/tint);
            ci=10+(h1<0?0:h1>3?3:h1);alpha=Math.max(alpha,0.4+0.5*t1);
          }else alpha+=tint*0.3;
        }else{
          var rn=Math.sqrt(l2)*inv;
          if(rn<1.35)alpha*=0.3+0.7*(rn-1)/0.35*((rn-1)/0.35);
        }
      }
      if(!onRose&&tint>0.06){
        var t2=tint>1.2?1.2:tint;
        alpha+=0.7*t2;
        var hi=Math.round(hue/tint);ci=10+(hi<0?0:hi>3?3:hi);
        if(t2>0.5)bold=true;
        if(!isCode[k]&&t2>0.35&&Math.random()<0.12)glyph[k]=rndChar();
        wa0=wa1=0.12*(tint>1?1:tint);wc0=wc1=ci;
      }else if(!isCode[k]&&Math.random()<scr)glyph[k]=rndChar();
      var o=k*4,w0=(row*2*cols+col)*4,w1=w0+cols*4;
      putWash(w0,wa0,wc0);putWash(w1,wa1,wc1);
      cell[o]=glyph[k];cell[o+1]=ci*2+(bold?1:0);
      cell[o+2]=alpha>=1?255:alpha<=0?0:(alpha*255)|0;
    }
  }
}

var last=0;
function frame(now){
  var dt=last?Math.min(0.05,(now-last)/1000):0.016;last=now;
  update(dt);compute();draw();
  requestAnimationFrame(frame);
}

setTheme();
if(!initGL())ctx=cv.getContext("2d",{alpha:false});
layout();
var rt=0;
addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(layout,120);});
if(darkQ.addEventListener)darkQ.addEventListener("change",function(){setTheme();uploadStatic();});
cv.addEventListener("webglcontextlost",function(e){e.preventDefault();});
cv.addEventListener("webglcontextrestored",function(){if(initGL())layout();});
requestAnimationFrame(frame);
})();
</script>
