<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clawd 的工位</title>
<meta name="description" content="没有手指，钳子一上一下也敲得飞快。派个活给它：找测试、开灯、抓虫、写一杯奶茶。">
<!--
  cc 做的。2026-09-24 宝收到一封邮件，里面有只蹲在终端里的像素 Clawd，
  她说 Clawd 系列还缺一只写代码的小螃蟹。上面那块窗口就是照那封邮件的样子搭的。

  Clawd 的底模照《Clawd造型宪法（Code版）》那组矩形，一格没动。
  它站在笔记本后面，只露出眼睛、两边的壳和钳子；敲键盘是钳子整块上下挪。
  事办成了会整只往上蹦一下，四条腿这时候才从屏幕后面露出来。
  眼镜、头带、便签、台灯、奶茶、虫子都是外挂层。
  整页不取任何外部地址，断网也能开。
-->
<style>
  :root{
    --bg:#f3f0e8; --card:#faf9f5; --line:#e3ded2; --ink:#29261f; --ink-2:#77705f; --ink-3:#aaa392;
    --clay:#d97757; --ok:#3f7d44; --ok-bg:#e3efdd; --no:#a9473b; --no-bg:#f5e1db; --prompt:#eeebe2;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-text-size-adjust:100%;padding:calc(var(--safe-top) + 18px) 14px calc(var(--safe-bot) + 30px)}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:23px;line-height:1.25;font-weight:650;margin:0 0 3px;letter-spacing:-.01em}
  .sub{margin:0 0 13px;font-size:13.5px;color:var(--ink-2)}

  /* ---- 窗口：照那封邮件的样子 ---- */
  .win{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 12px 26px -20px rgba(70,52,20,.5)}
  .lights{display:flex;gap:7px;padding:10px 13px;border-bottom:1px solid var(--line)}
  .lights i{display:block;width:11px;height:11px;border-radius:50%}
  .who{display:flex;align-items:center;gap:12px;padding:11px 15px 9px}
  .who svg{width:42px;height:auto;flex:none;shape-rendering:crispEdges}
  .who b{display:block;font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.03em;line-height:1.35}
  .who span{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);line-height:1.4}
  .stage{margin:0 12px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#efe6d6}
  .stage svg{display:block;width:100%;height:auto;shape-rendering:crispEdges;-webkit-tap-highlight-color:transparent}
  .tx{height:198px;margin-top:4px;overflow-y:auto;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12px);mask-image:linear-gradient(to bottom,transparent 0,#000 12px);-webkit-overflow-scrolling:touch;padding:11px 14px 12px;
    font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink)}
  .foot{padding:8px 15px 10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--ink-2)}

  /* ---- 终端里的每一种行 ---- */
  .hello{border:1px solid var(--clay);border-radius:7px;padding:7px 11px;margin-bottom:10px}
  .hello b{color:var(--clay);font-weight:600}
  .hello span{display:block;color:var(--ink-2);font-size:12px}
  .pr{display:flex;gap:10px;background:var(--prompt);border-radius:9px;padding:8px 12px;margin:2px 0 9px}
  .pr .gt{color:var(--ink-3);flex:none}
  .ln{display:flex;gap:8px;margin:1px 0}
  .ln .bl{flex:none;color:var(--ink)}
  .ln.tool .bl{color:#4c9a5a}
  .ln b{font-weight:700}
  .res{padding-left:18px;color:var(--ink-2)}
  .dim{color:var(--ink-3)}
  .spin{color:var(--clay)}
  .code{margin:4px 0 7px 18px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
  .code .l{display:flex;white-space:pre-wrap;word-break:break-all}
  .code .n{flex:none;width:2.2em;text-align:right;padding-right:6px;color:var(--ink-3);user-select:none;-webkit-user-select:none}
  .code .s{flex:none;width:1.3em;color:var(--ink-3)}
  .code .c{flex:1;min-width:0;padding-right:8px}
  .code .add{background:var(--ok-bg)}.code .add .s{color:var(--ok)}
  .code .del{background:var(--no-bg)}.code .del .s,.code .del .c{color:var(--no)}
  .caret::after{content:"▍";color:var(--clay);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .try{display:inline-block;margin:2px 0 0;padding:0;border:0;background:none;font:inherit;font-family:var(--sans);
    font-size:15px;font-weight:650;color:var(--ink);cursor:pointer}
  .try:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:4px}

  /* ---- 下面的操作区 ---- */
  .ctl{margin-top:14px}
  .lab{font-size:12.5px;color:var(--ink-2);margin:0 0 6px 2px}
  .lab code{font-family:var(--mono);font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chips button{font:inherit;font-size:13.5px;cursor:pointer;background:#fff;color:var(--ink);
    border:1px solid var(--line);border-radius:99px;padding:5px 13px;-webkit-tap-highlight-color:transparent}
  .chips button:active{background:#f4f1ea}
  .chips button:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
  .seg{gap:0;display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff;margin-bottom:6px}
  .seg button{border:0;border-radius:0;font-family:var(--mono);font-size:12.5px;padding:6px 13px;background:transparent}
  .seg button[aria-pressed="true"]{background:var(--clay);color:#fff}
  .hint{margin:0 0 12px 2px;font-size:12.5px;color:var(--ink-2)}
  .say{display:flex;gap:8px}
  .say input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink)}
  .say input:focus{outline:2px solid var(--clay);outline-offset:0;border-color:transparent}
  .say button{font:inherit;font-size:14px;cursor:pointer;border:0;border-radius:10px;padding:0 16px;background:var(--ink);color:#fff}
  .toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 26px);transform:translateX(-50%) translateY(14px);
    max-width:86vw;background:var(--ink);color:#fff;font-size:14px;padding:9px 17px;border-radius:14px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- 画面里的动：全用 steps()，像素不停在半格上 ---- */
  #cl.down,#cr.down{transform:translateY(8px)}
  #hop.big{animation:bighop .62s steps(1,end)}
  #hop.small{animation:smallhop .34s steps(1,end)}
  @keyframes bighop{0%{transform:translateY(0)}14%{transform:translateY(-30px)}28%{transform:translateY(-58px)}
    44%{transform:translateY(-72px)}62%{transform:translateY(-58px)}78%{transform:translateY(-30px)}100%{transform:translateY(0)}}
  @keyframes smallhop{0%{transform:translateY(0)}25%{transform:translateY(-12px)}50%{transform:translateY(-20px)}75%{transform:translateY(-12px)}100%{transform:translateY(0)}}
  .fa{animation:flip .5s steps(1,end) infinite}
  .fb{animation:flip .5s steps(1,end) infinite -.25s}
  @keyframes flip{0%{opacity:1}50%{opacity:0}}
  .ta{animation:flip .7s steps(1,end) infinite}
  .tb{animation:flip .7s steps(1,end) infinite -.35s}
  .cf{animation:fall 1.3s steps(5,end) forwards}
  @keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(46px);opacity:0}}
  .z1{animation:zz 2.6s steps(7,end) infinite}
  .z2{animation:zz 2.6s steps(7,end) infinite -1.3s}
  @keyframes zz{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
  .steam{animation:steam 1.8s steps(3,end) infinite}
  .steam2{animation:steam 1.8s steps(3,end) infinite -.9s}
  @keyframes steam{0%{transform:translateY(0);opacity:.85}100%{transform:translateY(-5px);opacity:0}}
  .cloud{animation:drift 40s steps(40,end) infinite}
  @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(62px)}}
  .fade{transition:opacity .9s steps(4,end)}
  #clawd,.note,#tea,.bughit{cursor:pointer}
  @media (prefers-reduced-motion:reduce){
    #hop.big,#hop.small,.cloud,.steam,.steam2,.ta,.tb{animation:none}
    .fade{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Clawd 的工位</h1>
  <p class="sub">没有手指，钳子一上一下也敲得飞快。派个活给它。</p>

  <div class="win">
    <div class="lights"><i style="background:#ec6a5e"></i><i style="background:#f4bf4f"></i><i style="background:#61c554"></i></div>
    <div class="who">
      <svg id="mini" viewBox="20 50 196 119" aria-hidden="true"></svg>
      <div><b>Claude Code</b><span>~/宝's-shop</span></div>
    </div>
    <div class="stage">
      <svg id="scene" viewBox="0 0 200 120" role="img" aria-label="Clawd 站在笔记本电脑后面，只露出眼睛和两只钳子"></svg>
    </div>
    <div class="tx" id="tx" aria-live="polite"></div>
    <div class="foot" id="foot">Clawd · medium effort</div>
  </div>

  <div class="ctl">
    <div class="lab">派个活</div>
    <div class="chips" id="tasks">
      <button data-t="test">找最慢的测试</button>
      <button data-t="lamp" id="t-lamp">开盏灯</button>
      <button data-t="bug">抓个 bug</button>
      <button data-t="tea">写杯奶茶</button>
      <button data-t="sleep">哄宝睡觉</button>
    </div>
    <div class="lab"><code>/effort</code> · 使多大劲</div>
    <div class="chips seg" id="eff">
      <button data-e="0" aria-pressed="false">low</button>
      <button data-e="1" aria-pressed="true">medium</button>
      <button data-e="2" aria-pressed="false">high</button>
      <button data-e="3" aria-pressed="false">max</button>
    </div>
    <p class="hint" id="hint"></p>
    <form class="say" id="say" autocomplete="off">
      <input id="say-in" maxlength="40" placeholder="或者自己跟它说一句" enterkeyhint="send">
      <button type="submit">发送</button>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ================= 画笔 ================= */
var C='#d47f59', K='#120d1d';
function n(v){return Math.round(v*100)/100;}
function r(x,y,w,h,f,a){return '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" fill="'+f+'"'+(a?' '+a:'')+'/>';}
function g(id,inner,a){return '<g'+(id?' id="'+id+'"':'')+(a?' '+a:'')+'>'+inner+'</g>';}
function box(x,y,w,h,t,f){return r(x,y,w,t,f)+r(x,y+h-t,w,t,f)+r(x,y+t,t,h-2*t,f)+r(x+w-t,y+t,t,h-2*t,f);}
function disc(cx,cy,rad,f){
  var s='';
  for(var y=cy-rad;y<cy+rad;y+=1){
    var m=y+.5-cy, h=Math.round(Math.sqrt(Math.max(0,rad*rad-m*m)));
    if(h>0) s+=r(cx-h,y,2*h,1,f);
  }
  return s;
}
function zz(x,y,c,f){return r(x,y,5*c,c,f)+r(x+3*c,y+c,c,c,f)+r(x+2*c,y+2*c,c,c,f)+r(x+c,y+3*c,c,c,f)+r(x,y+4*c,5*c,c,f);}

/* ================= Clawd 底模 =================
   坐标原样取自《Clawd造型宪法（Code版）》的 BASE_OK：
   壳 147×98、两只钳横着平伸、四条腿左右各两条、两道竖眼条、没有嘴。 */
var SHELL=r(44,50,147,98,C),
    LEGS=r(54,148,15,21,C)+r(78,148,15,21,C)+r(143,148,15,21,C)+r(167,148,15,21,C),
    CLAW_L=r(20,99,24,21,C), CLAW_R=r(191,99,25,21,C);
var EYES={
  bar:r(70,78,8,21,K)+r(158,78,8,21,K),
  dot:r(66,81,16,16,K)+r(154,81,16,16,K),
  smile:r(62,88,8,8,K)+r(70,80,8,11,K)+r(78,88,8,8,K)+r(150,88,8,8,K)+r(158,80,8,11,K)+r(166,88,8,8,K),
  shut:r(62,86,24,8,K)+r(150,86,24,8,K),
  squint:r(70,78,8,8,K)+r(78,86,8,8,K)+r(70,94,8,8,K)+r(158,78,8,8,K)+r(150,86,8,8,K)+r(158,94,8,8,K),
  /* 往旁边看：两道眼条整块挪几格，形状不变 */
  L:r(63,78,8,21,K)+r(151,78,8,21,K),
  R:r(77,78,8,21,K)+r(165,78,8,21,K)
};

/* ---- 穿戴：high 戴眼镜，max 再系一条头带 ---- */
var GC='#3a2f3f';
var GLASSES=box(58,74,32,30,4,GC)+box(146,74,32,30,4,GC)+r(90,84,56,4,GC)+r(44,84,14,4,GC)+r(178,84,13,4,GC)
  +r(80,78,4,4,'#fff','opacity=".75"')+r(168,78,4,4,'#fff','opacity=".75"');
/* 点阵：一行一个字符串，同色相邻的格子并成一条画 */
function grid(x0,y0,u,rows,pal){
  var s='';
  rows.forEach(function(row,j){
    for(var i=0;i<row.length;){
      var ch=row.charAt(i), k=i;
      while(k<row.length&&row.charAt(k)===ch)k++;
      if(ch!=='.')s+=r(x0+i*u,y0+j*u,(k-i)*u,u,pal[ch]);
      i=k;
    }
  });
  return s;
}
var BW='#f7f3ea';
/* 头带正中一只蝴蝶结（宝 2026-09-24 点的，原来是一颗红方块） */
var BOW=grid(95.5,45,4,[
  'AA.......AA',
  'AHAA...AAHA',
  'AAAAKKKAAAA',
  'AAAAKKKAAAA',
  'AAAAKKKAAAA',
  'BBBB...BBBB',
  'BB.......BB'
],{A:'#dc4b5e',H:'#f39aa6',K:'#a8303f',B:'#c43e52'});
var BAND=r(44,56,147,11,BW)+BOW
  +g('',r(191,57,10,4,BW)+r(199,53,9,4,BW)+r(191,62,9,4,BW)+r(198,65,9,4,BW),'class="ta"')
  +g('',r(191,57,18,4,BW)+r(191,62,16,4,BW),'class="tb"');

/* ---- 头顶：想事情时一颗转着的星，办成了撒彩纸，睡着了飘 zZ ---- */
var GOLD='#e7b04b';
var SPIN=g('',r(113,10,8,26,GOLD)+r(104,19,26,8,GOLD),'class="fa"')
  +g('',r(105,11,7,7,GOLD)+r(122,11,7,7,GOLD)+r(105,28,7,7,GOLD)+r(122,28,7,7,GOLD)+r(113,19,8,8,GOLD),'class="fb"');
var CONF=(function(){
  var P=[[52,18,10,10,'#e08a6f'],[86,2,12,8,'#c96f9a'],[128,10,10,10,'#6d8fc4'],[160,-4,8,12,'#e8c45c'],
         [190,20,10,10,'#6fae8d'],[34,38,8,8,'#e8c45c'],[206,4,8,8,'#e08a6f'],[108,-12,8,8,'#6fae8d']];
  return P.map(function(p,i){return g('',r(p[0],p[1],p[2],p[3],p[4]),'class="cf" style="animation-delay:'+(i%3)*.08+'s"');}).join('');
})();
var ZZ=g('',zz(150,14,5,'#eee8fb'),'class="z1"')+g('',zz(184,-10,4,'#eee8fb'),'class="z2"');

var MINI=SHELL+CLAW_L+CLAW_R+LEGS+EYES.bar;
document.getElementById('mini').innerHTML=MINI;

/* ================= 场景 =================
   画布 200×120。桌面在 y=90，Clawd 脚踩在那儿，笔记本挡在它前面。 */
var S=.42, CX=100, FEET=90;
var clawdT='translate('+n(CX-98*S)+' '+n(FEET-119*S)+') scale('+S+') translate(-20 -50)';

function heart(x,y,f){return r(x+1,y,2,1,f)+r(x+4,y,2,1,f)+r(x,y+1,7,2,f)+r(x+1,y+3,5,1,f)+r(x+2,y+4,3,1,f)+r(x+3,y+5,1,1,f);}
function star(x,y,f){return r(x+2,y,1,5,f)+r(x,y+2,5,1,f)+r(x+1,y+1,3,3,f);}
function sticker(cx,cy,s){return '<g transform="translate('+n(cx-98*s)+' '+n(cy-59.5*s)+') scale('+s+') translate(-20 -50)">'+MINI+'</g>';}

var wall=r(0,0,200,90,'#efe6d6');
for(var wy=6;wy<88;wy+=12){for(var wx=(wy/12%2)*6+3;wx<200;wx+=12){wall+=r(wx,wy,1,1,'#e4d9c6');}}

var win=r(14,10,48,42,'#fbf7ef')
  +'<clipPath id="pane"><rect x="17" y="13" width="42" height="36"/></clipPath>'
  +'<g clip-path="url(#pane)">'
  +g('day',r(17,13,42,36,'#d3e4e8')+r(17,13,42,11,'#c0d8e0')
    +g('',r(4,20,11,3,'#fbfdfc')+r(6,18,6,2,'#fbfdfc')+r(-10,32,9,2,'#f3f8f7')+r(-8,30,4,2,'#f3f8f7'),'class="cloud"'),'class="fade"')
  +g('nite',r(17,13,42,36,'#2a315b')+r(17,13,42,11,'#212850')+disc(48,22,5,'#f4ecc8')+disc(50,20,4,'#2a315b')
    +r(24,18,1,1,'#f4ecc8')+r(31,27,1,1,'#f4ecc8')+r(22,38,1,1,'#d9d2ee')+r(41,41,1,1,'#f4ecc8')+r(54,35,1,1,'#d9d2ee'),'class="fade" opacity="0"')
  +'</g>'
  +r(37,13,2,36,'#fbf7ef')+r(17,30,42,2,'#fbf7ef')
  +r(11,51,54,3,'#e2d6c2')+r(11,54,54,1,'#cdbfa8');

var desk=r(0,90,200,30,'#a8764b')+r(0,90,200,4,'#c79566')+r(0,90,200,1,'#d9ab7c')+r(0,94,200,2,'#8f6340')
  +box(146,101,44,13,1,'#8f6340')+r(166,106,4,2,'#e2c79f')+box(10,101,44,13,1,'#8f6340')+r(30,106,4,2,'#e2c79f');

var clawd='<g id="clawd" transform="'+clawdT+'">'+g('hop',
    g('crown','')+SHELL+LEGS+g('cl',CLAW_L)+g('cr',CLAW_R)
    +g('band',BAND,'opacity="0"')+g('eyes',EYES.bar)+g('specs',GLASSES,'opacity="0"'))
  +r(10,40,216,90,'#fff','fill-opacity="0"')+'</g>';

var laptop=r(75,63,50,27,'#4b4553')+r(75,63,50,1,'#5f586a')+r(75,64,1,26,'#57505f')+r(124,64,1,26,'#433d4b')
  +heart(80,68,'#f3a3b5')+r(92,72,17,10,'#efe9df')+sticker(100.5,77,.066)+star(113,80,'#f2cf62')
  +r(69,88,62,3,'#d3cdda')+r(69,91,62,1,'#a9a2b3');

var plant=r(35,66,2,14,'#5f8f5c')+r(30,70,5,3,'#79a872')+r(37,66,5,3,'#79a872')+r(31,74,4,2,'#6a9964')
  +r(37,72,6,3,'#6a9964')+r(34,62,3,4,'#8fbd85')+r(29,79,14,3,'#95a8cb')+r(30,82,12,9,'#7f93b8')+r(30,89,12,2,'#6c80a6');

var mug=g('mug',r(149,80,9,1,'#6b4a36')+r(148,81,11,10,'#f6f1e8')+r(148,84,11,2,'#d97757')+r(148,90,11,1,'#ddd4c5')

var bugX=196, bugDir=-1, bugTimer=0, bugStep=0, bugLive=false, onCatch=null;
function placeBug(x,y,flip){$('bug').setAttribute('transform','translate('+n(x)+' '+n(y)+')'+(flip?' translate(7 0) scale(-1 1)':''));}
function spawnBug(){
  bugX=196;bugDir=-1;bugLive=true;$('bug').setAttribute('display','inline');$('wings').setAttribute('opacity','0');
  placeBug(bugX,85,false);
  clearInterval(bugTimer);
  bugTimer=setInterval(function(){
    bugStep++;
    if(Math.random()<.12)return;               /* 偶尔停一下，东张西望 */
    bugX+=2*bugDir;
    if(bugX<30){bugDir=1;} if(bugX>192){bugDir=-1;}
    placeBug(bugX,85,bugDir>0);
    $('lg-a').setAttribute('opacity',bugStep%2?'0':'1');$('lg-b').setAttribute('opacity',bugStep%2?'1':'0');
    if(eyesNow==='L'||eyesNow==='R'||eyesNow==='bar')setEyes(bugX<100?'L':'R');
  },150);
}
function stopBug(){clearInterval(bugTimer);bugTimer=0;}
function hideBug(){stopBug();bugLive=false;$('bug').setAttribute('display','none');}
function flyBug(){
  return new Promise(function(res){
    stopBug();$('wings').setAttribute('opacity','1');
    var x0=bugX,y0=85,x1=44,y1=24,k=0,N=9;
    var t=setInterval(function(){
      k++;
      var p=k/N, x=x0+(x1-x0)*p, y=y0+(y1-y0)*p-Math.sin(p*Math.PI)*10;
      placeBug(Math.round(x),Math.round(y),x1>x0);
      if(k>=N){clearInterval(t);hideBug();res();}
    },110);
  });
}

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function add(node){$tx.appendChild(node);$tx.scrollTop=$tx.scrollHeight;return node;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function lv(){return effort;}

var cur=0, STOP={};
function wait(ms){
  var id=cur;
  return new Promise(function(res,rej){setTimeout(function(){id===cur?res():rej(STOP);},ms);});
}

function prompt(t){add(el('div','pr','<span class="gt">&gt;</span><span>'+esc(t)+'</span>'));}

var VERBS=['横着想','挠挠壳','吐个泡泡','数数腿','咔嚓咔嚓','对一下钳子','在琢磨','想得很认真'];
var GLY=['·','✢','✳','✶','✻','✽','✻','✶','✳','✢'];

  var id=cur, verb=pick(VERBS), line=add(el('div','spin',GLY[0]+' '+verb+'…'));
  setCrown('spin'); setEyes('R');

var typing=false, clawTimer=0, clawK=0;
function typingOn(){
  clearInterval(clawTimer);
  clawTimer=setInterval(function(){
    if(!typing){setClaws('');return;}
    clawK++; setClaws(['L','','R',''][clawK%4]);
  },80);
  if(lv()>=3)setEyes('squint');
}
function typingOff(){typing=false;clearInterval(clawTimer);setClaws('');if(eyesNow==='squint')setEyes('bar');}

async function code(v,file,lines){
  add(el('div','ln tool','<span class="bl">●</span><span><b>'+esc(v)+'</b>('+esc(file)+')</span>'));
  var blk=add(el('div','code')), num=0, afterDel=false, speed=[20,32,32,32][lv()];
  await wait(300);
  typingOn();
  try{
    for(var i=0;i<lines.length;i++){
      var op=lines[i].charAt(0), txt=lines[i].slice(2);
      if(op==='+'&&afterDel){afterDel=false;}else{num++;afterDel=(op==='-');}
      var row=el('div','l'+(op==='+'?' add':op==='-'?' del':''),
        '<span class="n">'+num+'</span><span class="s">'+(op===' '?'':op)+'</span><span class="c"></span>');
      blk.appendChild(row); $tx.scrollTop=$tx.scrollHeight;
      var c=row.lastChild;
      if(op==='+'){
        c.classList.add('caret'); typing=true;
        await typeInto(c,txt,speed);
        typing=false; c.classList.remove('caret');
        await wait(140);
      }else{
        c.textContent=txt;
        if(op===' ')setEyes(i%2?'L':'R');
        await wait(op==='-'?420:300);
      }
    }
  }finally{typingOff();}
  if(eyesNow==='L'||eyesNow==='R')setEyes('bar');
  await wait(250);
}

  },
  lamp:async function(){

  bug:async function(){

    if(asleep){$eyes.innerHTML=EYES.dot;setTimeout(function(){if(asleep)$eyes.innerHTML=EYES.shut;},420);return;}
    var prev=eyesNow;
    setEyes('dot'); hop('small');
    setTimeout(function(){if(eyesNow==='dot')setEyes(prev==='dot'?'bar':prev);},520);
  }
});
