<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <title>UFO 抓小羊 · 出土重建版</title>
  <desc>夜里一只飞碟停在草坡上空，底下一只小羊正被光吸起来。</desc>
  <defs>
    <!-- ===== [原件] Gemini 出土部分 ===== -->

    <!-- 地面渐变 -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- UFO 光束渐变 -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>

    <!-- UFO 金属机身渐变 -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 可复用的松树模型 -->
    <g id="pine-tree">
      <polygon points="0,0 15,30 -15,30" fill="#065f46" />
      <polygon points="0,15 20,50 -20,50" fill="#047857" />
      <polygon points="0,30 25,75 -25,75" fill="#059669" />
      <rect x="-4" y="75" width="8" height="15" fill="#451a03" />
    </g>

    <!-- ===== [考古重建] 夜空渐变 ===== -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- ===== [考古重建] 场景层：夜空 / 星星 / 地面 / 松树 ===== -->
  <!-- 依据：groundGrad 与 pine-tree 在出土残卷中已定义但从未被引用，推断原作含完整夜景 -->

  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- 星星（三颗带 SMIL 闪烁，呼应原作的纯 SMIL 路线） -->
  <g fill="#e2e8f0">
    <circle cx="80" cy="60" r="1.5" />
    <circle cx="150" cy="120" r="1" />
    <circle cx="250" cy="45" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="70" r="1" />
    <circle cx="650" cy="130" r="1.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="50" r="1.5" />
    <circle cx="60" cy="210" r="1" />
    <circle cx="740" cy="220" r="1.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 弧形草地（启用出土的 groundGrad） -->
  <path d="M 0 430 Q 400 400 800 430 L 800 500 L 0 500 Z" fill="url(#groundGrad)" />

  <!-- 松树四棵（启用出土的 pine-tree 模型，避开光束区两侧摆放） -->
  <use href="#pine-tree" transform="translate(90, 335)" />
  <use href="#pine-tree" transform="translate(160, 350) scale(0.75)" />
  <use href="#pine-tree" transform="translate(690, 335)" />
  <use href="#pine-tree" transform="translate(630, 355) scale(0.7)" />

  <!-- ===== 小羊 ===== -->
  <!-- [考古重建] 外层定位组：残卷中的孤立 </g> 证明此处原有开标签，随文件头部一并丢失 -->
  <g transform="translate(400, 418)">
    <!-- [考古重建] 升降动画层：keyTimes 与现存的缩放/旋转动画完全同源，
         使小羊在 25%~60% 边上升边缩小旋转（被吸入），70%~95% 反向放回 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 0; 0 -250; 0 -250; 0 0; 0 0"
        keyTimes="0; 0.25; 0.6; 0.7; 0.95; 1"
        dur="8s" repeatCount="indefinite" />

      <!-- [原件] 缩放动画: 距离飞船越近越小 -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1; 1; 0; 0; 1; 1"
          keyTimes="0; 0.25; 0.6; 0.7; 0.95; 1"
          dur="8s" repeatCount="indefinite" />

        <!-- [原件] 旋转动画: 在空中无助地打转 -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0; 0; 1080; 1080; 0; 0"
            keyTimes="0; 0.25; 0.6; 0.7; 0.95; 1"
            dur="8s" repeatCount="indefinite" />

          <!-- [原件] 小羊的图形元素 (中心点在 0,0) -->
          <!-- 腿 -->
          <rect x="-16" y="8" width="6" height="18" rx="3" fill="#1f2937" />
          <rect x="-6" y="10" width="6" height="18" rx="3" fill="#1f2937" />
          <rect x="8" y="8" width="6" height="18" rx="3" fill="#1f2937" />
          <rect x="18" y="10" width="6" height="18" rx="3" fill="#1f2937" />

          <!-- 羊毛身体 (用一堆圆圈拼成云朵的样子) -->
          <circle cx="-15" cy="-2" r="16" fill="#f8fafc" />
          <circle cx="0" cy="-12" r="20" fill="#ffffff" />
          <circle cx="15" cy="-2" r="18" fill="#e2e8f0" />
          <circle cx="0" cy="8" r="15" fill="#f1f5f9" />
          <circle cx="-25" cy="5" r="12" fill="#e2e8f0" />
          <circle cx="25" cy="5" r="14" fill="#f8fafc" />

          <!-- 头 -->
          <ellipse cx="32" cy="-8" rx="12" ry="9" fill="#1f2937" />
          <!-- 眼睛 -->
          <circle cx="36" cy="-10" r="2.5" fill="#ffffff" />
          <circle cx="37" cy="-10" r="1" fill="#000000" />
          <!-- 耳朵 -->
          <ellipse cx="23" cy="-12" rx="6" ry="3" fill="#1f2937" transform="rotate(-30 23 -12)" />
        </g>
      </g>
    </g>
  </g>

  <!-- ===== UFO ===== -->
  <!-- [考古重建] 悬浮组：残卷注释"受 UFO 悬浮影响"证明原作 UFO 有整体浮动动画 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -8; 0 0" dur="4s" repeatCount="indefinite" />

    <!-- [原件] 吸引光束 (受 UFO 悬浮影响，且有自己独立的透明度抓取逻辑) -->
    <polygon points="350,170 200,500 600,500" fill="url(#beamGrad)" opacity="0">
      <animate attributeName="opacity"
        values="0; 0; 0.8; 0.8; 0; 0.8; 0.8; 0; 0"
        keyTimes="0; 0.2; 0.25; 0.6; 0.65; 0.7; 0.9; 0.95; 1"
        dur="8s" repeatCount="indefinite" />
    </polygon>

    <!-- [原件] 玻璃穹顶 (在小羊之上，这样小羊会被吸入穹顶内部消失) -->
    <path d="M 320 160 Q 400 50 480 160 Z" fill="#a5f3fc" opacity="0.4" filter="url(#softGlow)" />

    <!-- [原件] 外星人驾驶员 -->
    <g transform="translate(400, 135)">
      <!-- 身体 -->
      <path d="M -15 25 Q 0 0 15 25 Z" fill="#4ade80" />
      <!-- 头 -->
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="#4ade80" />
      <!-- 黑眼睛 -->
      <ellipse cx="-7" cy="2" rx="4.5" ry="8" fill="#000000" transform="rotate(-20 -7 2)" />
      <ellipse cx="7" cy="2" rx="4.5" ry="8" fill="#000000" transform="rotate(20 7 2)" />
      <!-- 眼睛高光 -->
      <circle cx="-6" cy="0" r="1.5" fill="#ffffff" />
      <circle cx="8" cy="0" r="1.5" fill="#ffffff" />
    </g>

    <!-- [原件] 玻璃穹顶的高光反射 -->
    <path d="M 335 150 Q 370 80 420 80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- [原件] 飞船底座盘 -->
    <ellipse cx="400" cy="165" rx="130" ry="30" fill="url(#hullGrad)" />
    <!-- 飞船边缘防撞条 -->
    <ellipse cx="400" cy="175" rx="135" ry="12" fill="#1e293b" />

    <!-- 飞船底盘凹槽 -->
    <ellipse cx="400" cy="182" rx="80" ry="15" fill="#0f172a" opacity="0.8" />
    <!-- 发射光束的发光口 -->
    <ellipse cx="400" cy="184" rx="40" ry="8" fill="#22d3ee" filter="url(#glow)">
      <!-- 发光口随光束开关而闪烁 -->
      <animate attributeName="opacity"
        values="0.3; 0.3; 1; 1; 0.3; 1; 1; 0.3; 0.3"
        keyTimes="0; 0.2; 0.25; 0.6; 0.65; 0.7; 0.9; 0.95; 1"
        dur="8s" repeatCount="indefinite" />
    </ellipse>

    <!-- [原件] 边缘霓虹跑马灯 -->
    <g filter="url(#softGlow)">
      <circle cx="275" cy="172" r="4" fill="#f43f5e">
        <animate attributeName="fill" values="#f43f5e; #eab308; #22d3ee; #f43f5e" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="315" cy="180" r="4" fill="#eab308">
        <animate attributeName="fill" values="#eab308; #22d3ee; #f43f5e; #eab308" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="360" cy="184" r="4" fill="#22d3ee">
        <animate attributeName="fill" values="#22d3ee; #f43f5e; #eab308; #22d3ee" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="400" cy="186" r="4" fill="#f43f5e">
        <animate attributeName="fill" values="#f43f5e; #eab308; #22d3ee; #f43f5e" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="440" cy="184" r="4" fill="#eab308">
        <animate attributeName="fill" values="#eab308; #22d3ee; #f43f5e; #eab308" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="485" cy="180" r="4" fill="#22d3ee">
        <animate attributeName="fill" values="#22d3ee; #f43f5e; #eab308; #22d3ee" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="525" cy="172" r="4" fill="#f43f5e">
        <animate attributeName="fill" values="#f43f5e; #eab308; #22d3ee; #f43f5e" dur="1s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>
