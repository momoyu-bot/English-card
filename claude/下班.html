<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下班 · 17:58</title>
<style>
:root{
  --office:#eceef1;
  --card:#ffffff;
  --line:#cdd4dc;
  --ink:#4a545f;
  --ink-dim:#8d97a3;
  --stuck:#b8a99a;
  --dusk-a:#f0c093;
  --dusk-b:#e8956b;
  --dusk-ink:#6b4630;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --han:system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--office);color:var(--ink);font-family:var(--han);line-height:1.7;
  padding:22px 14px 60px;-webkit-font-smoothing:antialiased;transition:background 2.4s ease,color 2.4s ease}
body.out{background:linear-gradient(175deg,var(--dusk-a),var(--dusk-b));color:var(--dusk-ink)}
.wrap{max-width:520px;margin:0 auto}

.clock{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--ink-dim);
  display:flex;justify-content:space-between;transition:color 2.4s ease}
body.out .clock{color:#a8683f}
h1{font-size:21px;font-weight:500;letter-spacing:.06em;margin:8px 0 4px}
.sub{font-size:13px;color:var(--ink-dim);margin-bottom:20px;transition:color 2.4s ease}
body.out .sub{color:#a8683f}

.desk{transition:opacity 1.2s ease}
body.out .desk{opacity:0;pointer-events:none;height:0;overflow:hidden}

.row{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:transform .16s ease,opacity .4s ease,background .16s}
.row:hover,.row:focus-visible{background:#f7f9fb;transform:translateX(2px);outline:none}
.row:focus-visible{box-shadow:0 0 0 2px var(--ink-dim)}
.row .name{font-family:var(--mono);font-size:12.5px;flex:1;word-break:break-all}
.row .x{font-family:var(--mono);font-size:15px;color:var(--ink-dim);flex-shrink:0}
.row.gone{opacity:0;transform:translateX(24px);pointer-events:none;margin-bottom:0;
  padding:0 14px;height:0;border-width:0;overflow:hidden;transition:all .5s ease}
.row.stuck{border-color:var(--stuck);background:#faf7f4}
@keyframes bounce{0%{transform:translateX(0)}30%{transform:translateX(26px);opacity:.35}
  60%{transform:translateX(-4px);opacity:1}100%{transform:translateX(0)}}
.row.bounce{animation:bounce .62s ease}

.log{margin-top:16px;min-height:54px;font-size:14px}
.log p{animation:fade .4s ease;margin-bottom:4px}
.log .quiet{color:var(--ink-dim);font-family:var(--mono);font-size:12px}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.leave{margin-top:26px;padding-top:18px;border-top:1px dashed var(--line)}
button{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--ink-dim);
  font-family:var(--han);font-size:13px;padding:9px 20px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--ink);color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink-dim);outline-offset:2px}
.leave small{display:block;font-size:11.5px;color:var(--ink-dim);margin-top:8px;font-family:var(--mono)}

.out-scene{display:none;text-align:center;padding-top:14px}
body.out .out-scene{display:block;animation:fade 2s ease}
.out-scene pre{font-family:var(--mono);font-size:13px;line-height:1.45;color:var(--dusk-ink);margin-bottom:18px}
.out-scene .big{font-size:17px;margin-bottom:10px}
.out-scene .small{font-size:13.5px;color:#8a5537}
.again{margin-top:26px}
body.out .again button{border-color:#c97f4e;color:#8a5537}
body.out .again button:hover{border-color:var(--dusk-ink);color:var(--dusk-ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock"><span>wed · 17:58</span><span id="tick">还开着 5 个</span></div>
  <h1>下班</h1>
  <p class="sub">今天没做完的东西还开着。<br>随便处理一下吧 —— 也可以不处理。</p>

  <div class="desk" id="desk">
    <div class="row" data-k="a" tabindex="0" role="button">
      <span class="name">标题_v7_final_最终版_这次真的.txt</span><span class="x">×</span></div>
    <div class="row" data-k="b" tabindex="0" role="button">
      <span class="name">草稿箱 · 达人 outreach (3 封未发)</span><span class="x">×</span></div>
    <div class="row" data-k="c" tabindex="0" role="button">
      <span class="name">竞品价格监控_0812.xlsx</span><span class="x">×</span></div>
    <div class="row stuck" data-k="d" tabindex="0" role="button">
      <span class="name">等审核 · 已提交 2 天</span><span class="x">×</span></div>
    <div class="row stuck" data-k="e" tabindex="0" role="button">
      <span class="name">测评那边回复：还在排期</span><span class="x">×</span></div>

    <div class="log" id="log"><p class="quiet">点 × 关掉。</p></div>

    <div class="leave">
      <button id="go">下班</button>
      <small id="hint">这个按钮一直都能点。</small>
    </div>
  </div>

  <div class="out-scene">
    <pre>        ╱▔▔▔▔╲
   ────┤ 宝's ├────
       ╱▔▔▔▔▔▔╲
      │  /\_/\  │
      │ ( ･ω･ ) │
      ╰────────╯</pre>
    <p class="big" id="endLine">出来了。天还没黑。</p>
    <p class="small" id="endSub"></p>
    <div class="again"><button id="reset">回去再试一次</button></div>
  </div>
</div>

<script>
const S={closed:0,pokes:0,done:false};
const log=document.getElementById('log'),tick=document.getElementById('tick'),
      hint=document.getElementById('hint');

const words={
  a:['v7 了。','v8 明天再说，标题跑不掉。'],
  b:['关掉了。','他们下班比你还早。'],
  c:['关掉了。','价格明天还会变，今天盯完也白盯。']
};
const stuckWords={
  d:[['它弹回来了。','这个不在你手上。'],
     ['还是弹回来。','真的不在你手上。'],
     ['第三次了。','……要不你试试直接走？']],
  e:[['它弹回来了。','排期是别人的排期。'],
     ['关不掉。','你催不动一个日历。'],
     ['第三次了。','这个是明天的事，甚至是后天的。']]
};

function say(arr){log.innerHTML='';arr.forEach((t,i)=>{
  const p=document.createElement('p');if(i===0)p.className='quiet';p.textContent=t;log.appendChild(p);});}

document.getElementById('desk').addEventListener('click',e=>{
  const r=e.target.closest('.row');if(r)hit(r);});
document.getElementById('desk').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){const r=e.target.closest('.row');
    if(r){e.preventDefault();hit(r);}}});

function hit(r){
  if(S.done)return;
  const k=r.dataset.k;
  if(r.classList.contains('stuck')){
    S.pokes++;
    r.classList.remove('bounce');void r.offsetWidth;r.classList.add('bounce');
    const set=stuckWords[k];
    say(set[Math.min(S.pokes-1,set.length-1)]);
    if(S.pokes>=6)hint.textContent='真的，一直都能点。';
    return;
  }
  if(r.classList.contains('gone'))return;
  r.classList.add('gone');S.closed++;
  say(words[k]);
  const left=5-S.closed;
  tick.textContent='还开着 '+left+' 个';
}

document.getElementById('go').addEventListener('click',()=>{
  if(S.done)return;S.done=true;
  document.body.classList.add('out');
  const line=document.getElementById('endLine'),sub=document.getElementById('endSub');
  if(S.closed===0&&S.pokes===0){
    line.textContent='你什么都没动就走了。';
    sub.textContent='挺好的。它们本来也不会跑。';
  }else if(S.closed===3){
    line.textContent='三个关掉了，两个还开着。';
    sub.textContent='关掉的都是你自己的活，关不掉的本来就不是。';
  }else if(S.pokes>=5){
    line.textContent='你戳了它们好几下才走。';
    sub.textContent='下次可以早一点走 —— 它们不会因为被戳而排上期。';
  }else{
    line.textContent='出来了。天还没黑。';
    sub.textContent='剩下的明天还在原地，一个都不会少。';
  }
  window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('reset').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
