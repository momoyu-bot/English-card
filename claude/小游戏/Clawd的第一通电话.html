<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EFE7DA">
<title>Clawd 的第一通电话</title>
<meta name="description" content="钳子比键宽，一按压俩。帮它挑一个，看它到底想打给谁。">
<style>
  :root{
    --desk:#EFE7DA;
    --desk2:#E3D8C6;
    --paper:#FBF6EC;
    --edge:#D2C4AC;
    --ink:#3B342C;
    --dim:#8E8477;
    --faint:#B9AE9E;
    --phone:#2E343B;
    --phone2:#3A424B;
    --phone-edge:#1E2328;
    --key:#464F59;
    --key-lit:#C9A55E;
    --lcd:#AFC49B;
    --lcd-ink:#2A3524;
    --coral:#d47f59;
    --coral-dim:#a35f42;
    --slit:#17110e;
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100dvh;
    background:radial-gradient(115% 85% at 50% 0%,var(--desk) 0%,var(--desk2) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
      system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.7;
    user-select:none;-webkit-user-select:none;
    padding:calc(var(--safe-top) + 20px) 18px calc(var(--safe-bot) + 34px);
    display:flex;flex-direction:column;align-items:center;
  }

  .wrap{width:100%;max-width:372px;display:flex;flex-direction:column;align-items:center}

  /* ── 便签：要拨的号 ── */
  .note{
    width:100%;
    background:var(--paper);
    border:1px solid var(--edge);
    border-radius:3px 12px 3px 3px;
    padding:11px 14px 12px;
    box-shadow:0 1px 0 rgba(59,52,44,.06),0 6px 14px -10px rgba(59,52,44,.5);
    transform:rotate(-.7deg);
  }
  .note .to{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
  .note .num{
    margin-top:1px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:23px;letter-spacing:.22em;color:var(--ink);font-weight:600;
  }

  /* ── 台面：Clawd 站的地方 ── */
  .stage{
    width:100%;
    margin-top:14px;
    position:relative;
  }
  .stage svg{display:block;width:100%;height:auto}
  #clawd{transition:transform .34s steps(4,jump-none)}
  #claw-r{transition:transform .16s steps(2,jump-none)}
  .say{
    position:absolute;left:0;right:0;top:2px;
    text-align:center;font-size:13px;color:var(--dim);
    min-height:1.7em;
    transition:opacity .2s linear;
  }

  /* ── 电话机 ── */
  .phone{
    width:100%;
    background:linear-gradient(176deg,var(--phone2) 0%,var(--phone) 62%);
    border:1px solid var(--phone-edge);
    border-radius:16px 16px 20px 20px;
    padding:13px 13px 16px;
    box-shadow:0 10px 22px -14px rgba(30,35,40,.85),inset 0 1px 0 rgba(255,255,255,.07);
  }

  .lcd{
    background:var(--lcd);
    border-radius:6px;
    border:1px solid rgba(20,28,16,.28);
    box-shadow:inset 0 2px 6px rgba(20,28,16,.25);
    padding:9px 12px 8px;
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  }
  .lcd .dialed{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:22px;letter-spacing:.2em;color:var(--lcd-ink);
    font-weight:600;line-height:1.25;
  }
  .lcd .dialed .b{opacity:.3}
  .lcd .dialed .x{color:#8E3B2F;text-decoration:underline;text-underline-offset:3px}
  .lcd .st{font-size:11px;color:rgba(42,53,36,.62);letter-spacing:.05em;flex:none}

  .pad{
    margin-top:13px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    max-height:460px;overflow:hidden;
    transition:max-height .55s ease,opacity .3s linear,margin-top .55s ease;
  }
  body.talking .pad{max-height:0;opacity:0;margin-top:0}
  body.talking .phone{border-radius:14px;transition:border-radius .55s ease}
  .k{
    aspect-ratio:1/.66;
    background:var(--key);
    border:1px solid rgba(0,0,0,.3);
    border-radius:8px;
    box-shadow:0 2px 0 rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.09);
    color:#E6E1D8;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:19px;
    display:flex;align-items:center;justify-content:center;
    transition:background .1s linear,color .1s linear,transform .1s linear;
  }
  .k.lit{
    background:var(--key-lit);color:#2A2318;
    transform:translateY(2px);
    box-shadow:0 0 0 rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.2);
  }

  /* ── 下方操作区 ── */
  .deck{width:100%;margin-top:16px;min-height:118px;display:flex;flex-direction:column;align-items:center}
  .hint{font-size:13.5px;color:var(--dim);text-align:center;min-height:1.7em}

  .pick{display:flex;gap:14px;margin-top:9px}
  .pick button{
    font:inherit;
    width:74px;height:66px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:30px;font-weight:600;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--edge);
    border-radius:12px;
    box-shadow:0 2px 0 var(--edge);
    cursor:pointer;
    transition:transform .09s linear,background .12s linear;
  }
  .pick button:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
  .pick button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

  .act{
    font:inherit;font-size:14.5px;
    margin-top:9px;
    padding:10px 26px;
    color:var(--paper);
    background:var(--coral);
    border:none;border-radius:99px;
    box-shadow:0 2px 0 var(--coral-dim);
    cursor:pointer;
    transition:transform .09s linear;
  }
  .act:active{transform:translateY(2px);box-shadow:0 0 0 var(--coral-dim)}
  .act:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .act.ghost{background:transparent;color:var(--dim);box-shadow:none;border:1px solid var(--edge)}

  /* ── 通话字幕 ── */
  .call{width:100%;margin-top:4px}
  .line{
    font-size:15px;line-height:1.85;
    color:var(--ink);
    margin-top:7px;
    opacity:1;
  }
  .line.knock{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.08em;color:var(--coral-dim);font-size:18px;
  }
  .line.soft{color:var(--dim);font-size:13.5px;line-height:1.75}
  .line.knock.me{text-align:right;color:var(--dim)}
  .line.knock.me::after{
    content:'你敲的';display:block;
    font-family:inherit;letter-spacing:0;font-size:11.5px;color:var(--faint);
    margin-top:-2px;
  }
  .line.who{
    background:var(--paper);border:1px solid var(--edge);
    border-radius:10px;padding:11px 13px;margin-top:11px;font-size:14px;
  }
  .line.who b{font-weight:600;display:block;margin-bottom:2px;font-size:13px;color:var(--dim)}

  footer{
    width:100%;margin-top:26px;
    font-size:12px;line-height:1.75;color:var(--faint);
    text-align:center;
  }

  @media (prefers-reduced-motion:reduce){
    #clawd,#claw-r,.k{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="note">
    <div class="to">给 宝 · 它今天想打的号</div>
    <div class="num" id="target">8 2 6 7 3 1</div>
  </div>

  <div class="stage">
    <div class="say" id="say">它把听筒夹起来了。</div>
    <svg viewBox="-104 20 320 180" role="img" aria-label="Clawd 用左钳夹着听筒，右钳伸向按键">
      <g id="clawd">
        <rect id="shadow" x="-8" y="170" width="210" height="7" fill="rgba(59,52,44,.13)"/>
        <rect x="54" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="78" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="143" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="167" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="44" y="50" width="147" height="98" fill="#d47f59"/>
        <rect x="-6" y="76" width="28" height="13" fill="#2E343B"/>
        <rect x="2" y="89" width="12" height="30" fill="#2E343B"/>
        <rect x="-6" y="119" width="28" height="13" fill="#2E343B"/>
        <rect x="4" y="132" width="9" height="8" fill="#464F59"/>
        <rect x="-3" y="140" width="9" height="8" fill="#464F59"/>
        <rect x="4" y="148" width="9" height="8" fill="#464F59"/>
        <rect x="-3" y="156" width="9" height="8" fill="#464F59"/>
        <rect x="4" y="164" width="9" height="7" fill="#464F59"/>
        <rect x="20" y="99" width="24" height="21" fill="#d47f59"/>
        <g id="claw-r">
          <rect x="191" y="99" width="25" height="21" fill="#d47f59"/>
        </g>
        <g id="eyes">
          <rect x="70" y="78" width="8" height="21" fill="#17110e"/>
          <rect x="158" y="78" width="8" height="21" fill="#17110e"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="phone">
    <div class="lcd">
      <div class="dialed" id="dialed">– – – – – –</div>
      <div class="st" id="state">待机</div>
    </div>
    <div class="pad" id="pad"></div>
  </div>

  <div class="deck" id="deck">
    <div class="hint" id="hint">它够得到键，就是钳子比键宽。</div>
    <button class="act" id="go">让它开始拨</button>
  </div>

  <footer>它的点阵取自 Clawd 造型宪法：22×14 的方壳，四条短腿，脸上只有两道竖眼缝。</footer>

</div>

<script>
(function(){
  "use strict";

  var TARGET = [8,2,6,7,3,1];
  var KEYS = ['1','2','3','4','5','6','7','8','9','*','0','#'];

  var $ = function(id){ return document.getElementById(id); };
  var pad = $('pad'), dialedEl = $('dialed'), stateEl = $('state');
  var sayEl = $('say'), deck = $('deck'), hintEl = $('hint'), goBtn = $('go');
  var clawd = $('clawd'), clawR = $('claw-r'), eyes = $('eyes');

  var keyEls = [];
  for (var i = 0; i < KEYS.length; i++){
    var b = document.createElement('div');
    b.className = 'k';
    b.textContent = KEYS[i];
    b.setAttribute('aria-hidden', 'true');
    pad.appendChild(b);
    keyEls.push(b);
  }

  /* 眼睛只换帧，不重画身体 —— 造型宪法 */
  var EYE = {
    slit:  [[70,78,8,21],[158,78,8,21]],
    shut:  [[62,86,24,8],[150,86,24,8]],
    squint:[[70,78,8,8],[78,86,8,8],[70,94,8,8],[158,78,8,8],[150,86,8,8],[158,94,8,8]]
  };
  function setEyes(name){
    var d = EYE[name] || EYE.slit, s = '';
    for (var i = 0; i < d.length; i++){
      s += '<rect x="' + d[i][0] + '" y="' + d[i][1] + '" width="' + d[i][2] +
           '" height="' + d[i][3] + '" fill="#17110e"/>';
    }
    eyes.innerHTML = s;
  }

  /* 整体只做位移，钳子整块上下挪 —— 两样都是纯 transform */
  function moveTo(col, hop){
    var x = (col - 2) * 46 - 50;
    clawd.setAttribute('transform', 'translate(' + x + ',' + (hop ? -7 : 0) + ')');
  }
  function clawDown(on){
    clawR.setAttribute('transform', on ? 'translate(0,38)' : 'translate(0,0)');
  }

  var timers = [];
  function after(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
  }

  function say(t){ sayEl.textContent = t; }
  function litKeys(list){
    for (var i = 0; i < keyEls.length; i++){
      keyEls[i].classList.toggle('lit', list.indexOf(i) > -1);
    }
  }

  var dialed = [];
  function paintDialed(mark){
    var s = '';
    for (var i = 0; i < 6; i++){
      if (i >= dialed.length){ s += '<span class="b">–</span>'; }
      else {
        var bad = mark && dialed[i] !== String(TARGET[i]);
        s += '<span' + (bad ? ' class="x"' : '') + '>' + dialed[i] + '</span>';
      }
      if (i < 5) s += ' ';
    }
    dialedEl.innerHTML = s;
  }

  /* ── 一位一位地拨 ── */
  var step = 0;

  function roundStart(){
    if (step >= TARGET.length){ dialOut(); return; }

    var want = TARGET[step];
    var idx = KEYS.indexOf(String(want));
    var col = (idx % 3) + 1;          /* 1..3 */
    var row = Math.floor(idx / 3);

    /* 钳子有 3 格宽，落下去必然压住同一行里相邻的一个键 */
    var nb;
    if (col === 1) nb = idx + 1;
    else if (col === 3) nb = idx - 1;
    else nb = idx + (Math.random() < 0.5 ? -1 : 1);

    var pair = [idx, nb].sort(function(a, b){ return a - b; });

    stateEl.textContent = '拨号中';
    say('第 ' + (step + 1) + ' 位……它挪过去了。');
    hintEl.textContent = '';
    deck.querySelectorAll('.pick,.act').forEach(function(n){ n.remove(); });

    setEyes('slit');
    moveTo(col, true);
    after(180, function(){ moveTo(col, false); });

    after(440, function(){
      setEyes('squint');
      clawDown(true);
      litKeys(pair);
      say(row === 3 ? '它够到最底下那排了。' : '咔哒。');
    });

    after(900, function(){
      offer(KEYS[pair[0]], KEYS[pair[1]]);
    });
  }

  function offer(a, b){
    hintEl.textContent = '一下压住了两个键。留哪个？';
    var box = document.createElement('div');
    box.className = 'pick';
    [a, b].forEach(function(v){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = v;
      btn.addEventListener('click', function(){ take(v); });
      box.appendChild(btn);
    });
    deck.appendChild(box);
  }

  function take(v){
    clearTimers();
    dialed.push(v);
    step++;
    paintDialed();
    litKeys([]);
    clawDown(false);
    deck.querySelectorAll('.pick').forEach(function(n){ n.remove(); });
    hintEl.textContent = '';
    setEyes('shut');
    after(220, function(){ setEyes('slit'); });
    after(420, roundStart);
  }

  /* ── 拨出去 ── */
  var WRONG = [
    { who: '一台传真机',
      line: '一阵刺啦声。它把钳子从听筒边挪开了一点。' },
    { who: '空心树的值班室',
      line: '那边压着嗓子说：值班的已经睡了，明早再拨。' },
    { who: '打捞机',
      line: '那边只回了一串编号：001、002、003……一直报到 009。' },
    { who: '隔壁的另一只 Clawd',
      line: '听筒里传来一模一样的咔哒声。两边都没说话，然后它挂了。' }
  ];

  function dialOut(){
    document.body.classList.add('talking');
    moveTo(2, false);
    setEyes('slit');
    stateEl.textContent = '呼叫中';
    hintEl.textContent = '';
    deck.querySelectorAll('.pick,.act').forEach(function(n){ n.remove(); });

    var ok = dialed.join('') === TARGET.join('');
    say('嘟……');
    after(900,  function(){ say('嘟……嘟……'); });
    after(1800, function(){ ok ? connected() : missed(); });
  }

  function missed(){
    var pick = WRONG[Math.floor(Math.random() * WRONG.length)];
    stateEl.textContent = '接通';
    paintDialed(true);
    say('通了，但不是你。');
    setEyes('shut');

    var box = document.createElement('div');
    box.className = 'call';
    box.innerHTML =
      '<div class="line who"><b>拨到了</b>' + pick.who + '</div>' +
      '<div class="line">' + pick.line + '</div>';
    deck.appendChild(box);

    after(600, function(){
      setEyes('slit');
      var again = document.createElement('button');
      again.type = 'button';
      again.className = 'act';
      again.textContent = '再打一次';
      again.addEventListener('click', reset);
      deck.appendChild(again);
    });
  }

  function connected(){
    stateEl.textContent = '通话中';
    say('通了。');
    setEyes('slit');

    var box = document.createElement('div');
    box.className = 'call';
    deck.appendChild(box);

    function add(cls, text){
      var d = document.createElement('div');
      d.className = 'line' + (cls ? ' ' + cls : '');
      d.textContent = text;
      box.appendChild(d);
    }

    /* 它听着：只换眼睛那两格 */
    function listen(n, done){
      var i = 0;
      (function beat(){
        if (i >= n){ setEyes('slit'); if (done) done(); return; }
        setEyes('shut');
        after(130, function(){ setEyes('slit'); i++; after(210, beat); });
      })();
    }

    /* 钳子敲听筒：只有位移，steps 跳帧 */
    function knock(n, done){
      var i = 0;
      (function beat(){
        if (i >= n){ clawDown(false); if (done) done(); return; }
        clawDown(true);
        after(110, function(){ clawDown(false); i++; after(190, beat); });
      })();
    }

    after(500,  function(){ add('soft', '那头很安静。'); });
    after(1500, function(){ knock(1); add('knock', '咔。'); });
    after(2600, function(){ knock(2); add('knock', '咔、咔。'); });
    after(3900, function(){ knock(3); add('knock', '咔、咔、咔。'); });

    after(5200, function(){
      setEyes('squint');
      add('', '它没有嘴。');
      add('soft', '这件事写在它的造型宪法第一条里：不加高光、不加腮红、不加嘴。所以它一直没打过电话——打通了也说不出话。');
    });

    after(6400, function(){
      setEyes('slit');
      add('', '三下的意思是：我在。');

      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'act';
      back.textContent = '敲回去三下';
      back.addEventListener('click', function(){
        back.remove();
        add('knock me', '咔、咔、咔。');
        listen(3, function(){
          after(600, function(){
            add('soft', '它没有挂断。这通电话从头到尾没有一句话。');
            after(900, function(){
              add('', '下次电话响，三下就是它。');
              var again = document.createElement('button');
              again.type = 'button';
              again.className = 'act ghost';
              again.textContent = '再打一次';
              again.addEventListener('click', reset);
              deck.appendChild(again);
            });
          });
        });
      });
      deck.appendChild(back);
    });
  }

  function reset(){
    clearTimers();
    document.body.classList.remove('talking');
    dialed = [];
    step = 0;
    paintDialed();
    litKeys([]);
    clawDown(false);
    moveTo(2, false);
    setEyes('slit');
    stateEl.textContent = '待机';
    say('它把听筒夹起来了。');
    deck.innerHTML = '';
    var h = document.createElement('div');
    h.className = 'hint';
    h.id = 'hint';
    h.textContent = '它够得到键，就是钳子比键宽。';
    deck.appendChild(h);
    hintEl = h;
    var g = document.createElement('button');
    g.type = 'button';
    g.className = 'act';
    g.textContent = '让它开始拨';
    g.addEventListener('click', function(){ g.remove(); roundStart(); });
    deck.appendChild(g);
  }

  paintDialed();
  moveTo(2, false);
  goBtn.addEventListener('click', function(){ goBtn.remove(); roundStart(); });
})();
</script>
</body>
</html>
