<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mstage{transition:background-color .6s ease;border-radius:var(--border-radius-xl);padding:1.4rem 1rem 1.3rem;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;min-height:215px}
.momo{cursor:pointer;transition:transform .3s ease}
.momo:active{transform:scale(.93)}
@keyframes shiv{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,.5px)}75%{transform:translate(1.6px,-.6px)}}
.shiv{animation:shiv .25s infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flake{position:absolute;width:8px;height:8px;border-radius:50%;background:#d6e6f5;opacity:0;transition:opacity .5s;pointer-events:none;animation:drift 3s ease-in-out infinite}
@keyframes fh{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-92px) scale(1.1);opacity:0}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.bar{transition:width .45s ease}
.pbtn:active{transform:scale(.97)}
.done{opacity:.5}
</style>

<h2 class="sr-only">一个把名叫 momo 的小生物从寒冷焐暖的互动小游戏:点取暖道具、戳一戳它,把暖意值填满。</h2>

<div style="padding:.5rem 0 0;">
  <h2 style="font-size:18px;font-weight:500;margin:0 0 4px;">暖暖 momo 计划</h2>
  <p style="font-size:14px;color:var(--color-text-secondary);line-height:1.6;margin:0 0 14px;">集齐 5 样取暖道具,再亲手把 momo 一点点焐热——中途也可以随时戳戳它。</p>
</div>

<div class="mstage" id="mstage" style="background-color:rgb(168,195,212);">
  <svg class="momo" id="momo" width="150" height="140" viewBox="0 0 160 150" role="img" aria-label="一只叫 momo 的小生物,点它可以摸摸">
    <ellipse cx="50" cy="46" rx="13" ry="16" fill="#b0cdbc"/>
    <ellipse cx="110" cy="46" rx="13" ry="16" fill="#b0cdbc"/>
    <ellipse cx="50" cy="48" rx="6" ry="8" fill="#f3d2d8"/>
    <ellipse cx="110" cy="48" rx="6" ry="8" fill="#f3d2d8"/>
    <ellipse cx="40" cy="106" rx="9" ry="6.5" fill="#b0cdbc"/>
    <ellipse cx="120" cy="106" rx="9" ry="6.5" fill="#b0cdbc"/>
    <ellipse id="mbody" cx="80" cy="84" rx="47" ry="45" fill="#a8c3d4"/>
    <circle cx="64" cy="78" r="4.2" fill="#3c3a36"/>
    <circle cx="96" cy="78" r="4.2" fill="#3c3a36"/>
    <circle cx="65.6" cy="76.4" r="1.3" fill="#fff"/>
    <circle cx="97.6" cy="76.4" r="1.3" fill="#fff"/>
    <ellipse id="mblL" cx="52" cy="92" rx="7" ry="4.5" fill="#f2a6b0" opacity="0.3"/>
    <ellipse id="mblR" cx="108" cy="92" rx="7" ry="4.5" fill="#f2a6b0" opacity="0.3"/>
    <path id="mmouth" d="M70 100 Q80 94 90 100" stroke="#7a5a4a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path id="mquilt" d="M22 116 Q80 98 138 116 L138 150 L22 150 Z" fill="#f6ecdd" stroke="#e8d9c4" stroke-width="1" style="display:none;"/>
  </svg>
  <span class="flake" style="left:14%;top:22%;animation-delay:0s;"></span>
  <span class="flake" style="left:82%;top:30%;animation-delay:.6s;"></span>
  <span class="flake" style="left:24%;top:62%;animation-delay:1.1s;"></span>
  <span class="flake" style="left:74%;top:66%;animation-delay:1.6s;"></span>
  <div id="mhl" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;"></div>
</div>

<div style="display:flex;align-items:center;gap:10px;margin:16px 0 14px;">
  <span style="font-size:14px;color:var(--color-text-secondary);min-width:34px;">暖意</span>
  <div style="flex:1;height:10px;border-radius:999px;background:var(--color-background-secondary);overflow:hidden;">
    <div class="bar" id="mbar" style="width:0%;height:100%;background:#e8a05b;border-radius:999px;"></div>
  </div>
  <span id="mpct" style="font-size:16px;font-weight:500;min-width:38px;text-align:right;">0%</span>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;">
  <button class="pbtn" data-amt="15"><span class="chk" style="display:none;"><i class="ti ti-check" aria-hidden="true"></i> </span>盖被子</button>
  <button class="pbtn" data-amt="15"><span class="chk" style="display:none;"><i class="ti ti-check" aria-hidden="true"></i> </span>裹毯子</button>
  <button class="pbtn" data-amt="15"><span class="chk" style="display:none;"><i class="ti ti-check" aria-hidden="true"></i> </span>穿袜子</button>
  <button class="pbtn" data-amt="15"><span class="chk" style="display:none;"><i class="ti ti-check" aria-hidden="true"></i> </span>喝热饮</button>
  <button class="pbtn" data-amt="15"><span class="chk" style="display:none;"><i class="ti ti-check" aria-hidden="true"></i> </span>晒太阳</button>
</div>

<div id="mcele" style="display:none;margin-top:16px;text-align:center;">
  <p style="font-size:15px;color:var(--color-text-primary);line-height:1.6;margin:0 0 10px;animation:pop .5s ease;">momo 暖透啦——正裹着被子打呼噜呢。这下午的冷,被你一手焐回来了,宝。</p>
  <button id="mreset"><i class="ti ti-refresh" aria-hidden="true"></i> 再冻一次试试</button>
</div>

<script>
(function(){
  var warmth=0,done100=false;
  var stage=document.getElementById('mstage');
  var body=document.getElementById('mbody');
  var mouth=document.getElementById('mmouth');
  var blL=document.getElementById('mblL'),blR=document.getElementById('mblR');
  var quilt=document.getElementById('mquilt');
  var momo=document.getElementById('momo');
  var bar=document.getElementById('mbar');
  var pct=document.getElementById('mpct');
  var hl=document.getElementById('mhl');
  var flakes=document.querySelectorAll('.flake');
  var cele=document.getElementById('mcele');
  var btns=document.querySelectorAll('.pbtn');
  var reset=document.getElementById('mreset');
  function lerp(a,b,t){return Math.round(a+(b-a)*t);}
  function setBg(){var t=warmth/100;stage.style.backgroundColor='rgb('+lerp(168,251,t)+','+lerp(195,227,t)+','+lerp(212,205,t)+')';}
  function bodyColor(){var t=warmth/100;return 'rgb('+lerp(168,188,t)+','+lerp(195,218,t)+','+lerp(212,170,t)+')';}
  function update(){
    body.setAttribute('fill',bodyColor());
    if(warmth<40){mouth.setAttribute('d','M70 100 Q80 94 90 100');momo.classList.add('shiv');blL.setAttribute('opacity','0.3');blR.setAttribute('opacity','0.3');}
    else if(warmth<75){mouth.setAttribute('d','M71 98 Q80 102 89 98');momo.classList.remove('shiv');blL.setAttribute('opacity','0.6');blR.setAttribute('opacity','0.6');}
    else{mouth.setAttribute('d','M69 96 Q80 104 91 96');momo.classList.remove('shiv');blL.setAttribute('opacity','0.9');blR.setAttribute('opacity','0.9');}
    var op=warmth<40?'1':(warmth<62?'0.4':'0');
    flakes.forEach(function(f){f.style.opacity=op;});
    quilt.style.display=warmth>=100?'block':'none';
    bar.style.width=warmth+'%';
    pct.textContent=Math.round(warmth)+'%';
  }
  function heart(){
    var h=document.createElement('div');
    h.style.cssText='position:absolute;left:'+(40+Math.random()*60)+'%;top:42%;animation:fh 1.4s ease-out forwards;pointer-events:none;';
    h.innerHTML='<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 17C3 11 3 5 6.5 4 C9 3.2 10 5.5 10 5.5 C10 5.5 11 3.2 13.5 4 C17 5 17 11 10 17Z" fill="#f0897b"/></svg>';
    hl.appendChild(h);setTimeout(function(){h.remove();},1400);
  }
  function burst(){
    var s=document.createElement('div');
    var c=['#f0897b','#f2c14e','#f4a6b8'][Math.floor(Math.random()*3)];
    s.style.cssText='position:absolute;left:'+(18+Math.random()*64)+'%;top:'+(18+Math.random()*42)+'%;animation:fh 1.3s ease-out forwards;pointer-events:none;';
    s.innerHTML='<i class="ti ti-star" style="color:'+c+';font-size:18px;"></i>';
    hl.appendChild(s);setTimeout(function(){s.remove();},1300);
  }
  function check(){if(warmth>=100&&!done100){done100=true;cele.style.display='block';for(var i=0;i<10;i++){(function(d){setTimeout(burst,d);})(i*90);}}}
  btns.forEach(function(b){
    b.addEventListener('click',function(){
      if(b.classList.contains('done'))return;
      b.classList.add('done');
      warmth=Math.min(100,warmth+parseInt(b.getAttribute('data-amt'),10));
      var c=b.querySelector('.chk');if(c)c.style.display='inline-block';
      update();setBg();heart();check();
    });
  });
  momo.addEventListener('click',function(){warmth=Math.min(100,warmth+5);update();setBg();heart();check();});
  reset.addEventListener('click',function(){
    warmth=0;done100=false;cele.style.display='none';
    btns.forEach(function(b){b.classList.remove('done');var c=b.querySelector('.chk');if(c)c.style.display='none';});
    update();setBg();
  });
  update();setBg();
})();
</script>
