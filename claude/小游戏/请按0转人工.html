<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>请按 0 转人工</title>
<meta name="description" content="拨通了，菜单一层套一层。按 0 永远回到主菜单，前面排队的人越等越多。">
<style>
  :root{
    --bg:#0F1115;
    --bg2:#171B22;
    --card:#1B212B;
    --card2:#222933;
    --line:#2C3542;
    --ink:#E9E6DF;
    --dim:#8A93A2;
    --faint:#5A6270;
    --mint:#6FCF97;
    --amber:#E0B057;
    --red:#E5615C;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC","Helvetica Neue",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}
  @supports (height:100dvh){ html,body{height:100dvh;} }
  body{
    font-family:var(--sans);
    background:var(--bg);
    background-image:radial-gradient(120% 70% at 50% -10%,#1D2430 0%,#0F1115 62%);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    overflow:hidden;
  }

  .phone{
    width:100%;max-width:420px;
    height:100%;
    padding:calc(var(--safe-top) + 10px) 16px calc(var(--safe-bot) + 12px);
    display:flex;flex-direction:column;gap:12px;
  }

  /* ---------- 顶部状态条 ---------- */
  .bar{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--faint);
    letter-spacing:.04em;
    flex:none;
  }
  .bar .sig{display:flex;align-items:flex-end;gap:2px;height:11px;}
  .bar .sig i{width:3px;background:var(--faint);border-radius:1px;display:block;}
  .bar .sig i:nth-child(1){height:4px}
  .bar .sig i:nth-child(2){height:6px}
  .bar .sig i:nth-child(3){height:8px}
  .bar .sig i:nth-child(4){height:11px;background:var(--line)}
  .bar .grow{flex:1}
  .clock{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .mute{
    border:0;background:none;color:var(--faint);
    font-family:var(--sans);font-size:12px;cursor:pointer;
    padding:2px 6px;border-radius:6px;
  }
  .mute:active{background:var(--card)}

  /* ---------- 对方 ---------- */
  .who{flex:none;text-align:center;padding:6px 0 2px;}
  .avatar{
    width:62px;height:62px;margin:0 auto 10px;
    border-radius:50%;
    background:linear-gradient(160deg,#2B3342,#1C222C);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    position:relative;
  }
  .avatar.ring::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1px solid rgba(224,176,87,.35);
    animation:pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(.94);opacity:.9}
    100%{transform:scale(1.18);opacity:0}
  }
  .name{font-size:17px;letter-spacing:.02em;}
  .sub{font-size:12px;color:var(--faint);margin-top:4px;letter-spacing:.03em;}

  /* ---------- 听筒 ---------- */
  .handset{
    flex:1;min-height:0;
    background:linear-gradient(180deg,var(--card) 0%,#191F28 100%);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px 10px;
    display:flex;flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .handset .label{
    font-size:10px;color:var(--faint);letter-spacing:.16em;
    display:flex;align-items:center;gap:7px;
    flex:none;margin-bottom:9px;
  }
  .wave{display:flex;align-items:center;gap:2px;height:9px;}
  .wave i{width:2px;height:3px;background:var(--faint);border-radius:1px;display:block;}
  .wave.on i{background:var(--mint);animation:talk .9s ease-in-out infinite;}
  .wave.on i:nth-child(2){animation-delay:.12s}
  .wave.on i:nth-child(3){animation-delay:.24s}
  .wave.on i:nth-child(4){animation-delay:.36s}
  .wave.on i:nth-child(5){animation-delay:.48s}
  @keyframes talk{0%,100%{height:3px}50%{height:9px}}

  .lines{
    flex:1;min-height:0;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    display:flex;flex-direction:column;gap:9px;
    padding-right:2px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px);
    mask-image:linear-gradient(180deg,transparent 0,#000 16px);
  }
  .lines::-webkit-scrollbar{display:none}

  .ln{
    font-size:14.5px;line-height:1.62;
    color:var(--ink);
    animation:rise .34s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .ln.sys{color:var(--faint);font-size:12.5px;letter-spacing:.03em;}
  .ln.tip{color:var(--amber);font-size:13px;}
  .ln.q{color:var(--mint);}
  .ln.you{
    color:var(--dim);text-align:right;font-size:12.5px;
    font-family:var(--mono);letter-spacing:.08em;
  }
  .ln.music{color:var(--faint);font-size:13px;letter-spacing:.22em;}

  /* 排队计数 */
  .queue{
    flex:none;margin-top:8px;
    border-top:1px dashed var(--line);
    padding-top:8px;
    font-size:12px;color:var(--faint);
    display:flex;align-items:baseline;gap:8px;
    min-height:29px;
  }
  .queue:empty{border-top:0;margin-top:0;padding-top:0;min-height:0;}
  .queue b{
    font-family:var(--mono);font-size:19px;color:var(--amber);
    font-weight:500;font-variant-numeric:tabular-nums;
  }

  /* ---------- 键盘 ---------- */
  .pad{
    flex:none;
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .key{
    height:52px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--card2),#1A2029);
    border-radius:13px;
    color:var(--ink);font-family:var(--mono);font-size:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;cursor:pointer;
    transition:transform .07s,background .15s,border-color .2s;
  }
  .key small{
    font-family:var(--sans);font-size:8.5px;color:var(--faint);
    letter-spacing:.06em;height:10px;line-height:10px;
  }
  .key.live{border-color:rgba(111,207,151,.4)}
  .key.live small{color:var(--mint)}
  .key:active{transform:scale(.94);background:var(--card)}
  .key.hit{background:#2E3846;border-color:var(--faint)}

  /* ---------- 底部 ---------- */
  .foot{flex:none;display:flex;justify-content:center;padding-top:2px;}
  .hang{
    width:60px;height:60px;border-radius:50%;border:0;
    background:var(--red);color:#fff;font-size:24px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(229,97,92,.22);
    transition:transform .08s;
  }
  .hang:active{transform:scale(.92)}
  .call{
    width:100%;height:54px;border:0;border-radius:14px;
    background:var(--mint);color:#0F1115;
    font-family:var(--sans);font-size:16px;letter-spacing:.06em;
    cursor:pointer;transition:transform .08s;
  }
  .call:active{transform:scale(.98)}

  /* ---------- 开场 / 结算 ---------- */
  .sheet{
    position:absolute;inset:0;
    background:rgba(15,17,21,.93);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:calc(var(--safe-top) + 20px) 20px calc(var(--safe-bot) + 20px);
    z-index:5;
  }
  .sheet[hidden]{display:none}
  .sheetbox{
    width:100%;max-width:340px;
    background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:22px 20px 18px;
    animation:rise .3s ease-out;
  }
  .dialnum{
    font-family:var(--mono);font-size:21px;letter-spacing:.14em;
    text-align:center;color:var(--ink);
  }
  .dialsub{
    text-align:center;font-size:12.5px;color:var(--faint);
    margin:9px 0 20px;line-height:1.7;
  }
  .receipt{font-size:13px;color:var(--dim);}
  .receipt h3{
    font-size:15px;color:var(--ink);font-weight:500;
    letter-spacing:.04em;margin-bottom:14px;text-align:center;
  }
  .row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:6px 0;border-bottom:1px dashed rgba(44,53,66,.7);
  }
  .row span:last-child{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;}
  .verdict{
    margin:16px 0 18px;font-size:13.5px;line-height:1.7;
    color:var(--amber);text-align:center;
  }
  .verdict.win{color:var(--mint)}
  .again{
    width:100%;height:46px;border:1px solid var(--line);
    background:var(--card2);color:var(--ink);border-radius:12px;
    font-family:var(--sans);font-size:14px;cursor:pointer;letter-spacing:.05em;
  }
  .again:active{background:var(--card)}

  @media (max-height:640px){
    .avatar{width:50px;height:50px;font-size:22px;margin-bottom:7px}
    .key{height:45px}
    .hang{width:54px;height:54px}
    .ln{font-size:13.5px}
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bar">
    <span class="sig"><i></i><i></i><i></i><i></i></span>
    <span id="carrier">小机网络</span>

<script>
/* =========================================================
   声音：全部现场合成，不取任何外部文件
   DTMF 按键音 / 回铃音 / 等待音乐 / 接通咔哒
   ========================================================= */
var AC=null, master=null, sound=true;

function audioOn(){
  if(AC) return;
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C) {sound=false; return;}
  AC=new C();
  master=AC.createGain();
  master.gain.value=.22;
  master.connect(AC.destination);
}
function beep(f1,f2,dur,type,vol){
  if(!AC||!sound) return;
  var t=AC.currentTime, g=AC.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||.5,t+.012);
  g.gain.setValueAtTime(vol||.5,t+dur-.03);
  g.gain.linearRampToValueAtTime(0,t+dur);
  g.connect(master);
  [f1,f2].forEach(function(f){
    if(!f) return;
    var o=AC.createOscillator();
    o.type=type||'sine'; o.frequency.value=f;
    o.connect(g); o.start(t); o.stop(t+dur+.02);
  });
}
var DTMF={'1':[697,1209],'2':[697,1336],'3':[697,1477],
          '4':[770,1209],'5':[770,1336],'6':[770,1477],
          '7':[852,1209],'8':[852,1336],'9':[852,1477],
          '*':[941,1209],'0':[941,1336],'#':[941,1477]};
function tone(k){ var p=DTMF[k]; if(p) beep(p[0],p[1],.13,'sine',.4); }
function ringTone(){ beep(450,0,1,'sine',.3); }
function clickTone(){ beep(1200,0,.03,'square',.25); setTimeout(function(){beep(800,0,.04,'square',.2);},60); }

/* 等待音乐：廉价电子琴，两套曲子（投诉过就换第二套） */
var MUSIC=[
  {notes:[440,523,659,523,494,587,698,587],step:.30,type:'triangle'},
  {notes:[659,622,659,622,659,494,587,523,440,0,262,330,440,494,0,330],step:.20,type:'square'}
];
var MUSICLN=['♪ ～～～～～','♪ ～～～','♫ ～～～～～～','♪ ～～～～'];
var musicTimer=null, musicIdx=0;
function musicStart(){
  musicStop();
  if(!AC||!sound) return;
  var m=MUSIC[musicIdx], i=0;
  musicTimer=setInterval(function(){
    var n=m.notes[i%m.notes.length]; i++;
    if(n) beep(n,n*2.004,m.step*.85,m.type,.11);
  }, m.step*1000);
}
function musicStop(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }

/* =========================================================
   剧本
   ========================================================= */
var MENU={
  main:{

  },
  blame:{

    ],
    keys:{'1':'blameCall','2':'blameMusic','9':'main'}
  },
  blameCall:{

    ],

/* 排队脚本：t=距进入排队的秒数 */
var HOLD=[
  [0,   '正在为您转接人工坐席。',null,7],
  [2.2, '您前面还有 7 位。',null,7],

];

var HUMAN=[
  ['喂？喂喂，能听见吗。'],
  ['不好意思啊，我这边刚把网线拔了。'],
  ['您的问题我看了一下，是上游把幂等键吃掉了。'],

  ['我给您打个补丁，您重新拉一下就行。'],

  ['行，那就是解决了。'],
  ['麻烦给个评价：非常满意请按 1，满意请按 2，一般请按 3。','q']
];

/* =========================================================
   状态机
   ========================================================= */
var $=function(id){return document.getElementById(id);};
var linesEl=$('lines'), queueEl=$('queue'), padEl=$('pad'),
    waveEl=$('wave'), statusEl=$('status'), clockEl=$('clock'),
    avatarEl=$('avatar'), calleeEl=$('callee'),
    sheetEl=$('sheet'), boxEl=$('sheetbox');

var KEYS=['1','2','3','4','5','6','7','8','9','*','0','#'];
var KEYSUB={'1':'','2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO',
            '7':'PQRS','8':'TUV','9':'WXYZ','*':'重听','0':'转人工','#':'跳过'};

var state='idle', node=null, playing=null, playQueue=[], liveKeys={}, pendingDone=null, listenTimer=null;
var t0=0, clockTimer=null, holdTimer=null, holdStep=0, holdT=0;
var stat={keys:0, requeue:0, musicMs:0, rating:0};
var musicOnAt=0;

/* ---- 键盘 ---- */
KEYS.forEach(function(k){
  var b=document.createElement('button');
  b.className='key'; b.dataset.k=k;
  b.innerHTML='<span>'+k+'</span><small>'+(KEYSUB[k]||'')+'</small>';
  b.addEventListener('click',function(){press(k);});
  padEl.appendChild(b);
});
document.addEventListener('keydown',function(e){
  if(KEYS.indexOf(e.key)>=0){press(e.key);}
});

function mergeSkip(keys){
  var m={'#':1};
  for(var k in keys) m[k]=keys[k];
  return m;
}
function markKeys(map){
  liveKeys=map||{};
  [].forEach.call(padEl.children,function(b){
    b.classList.toggle('live', !!liveKeys[b.dataset.k]);
  });
}
function flash(k){
  var b=padEl.querySelector('[data-k="'+k+'"]');
  if(!b) return;
  b.classList.add('hit');
  setTimeout(function(){b.classList.remove('hit');},130);
}

/* ---- 听筒输出 ---- */
function say(text,cls){
  var d=document.createElement('div');
  d.className='ln'+(cls?' '+cls:'');
  d.textContent=text;
  linesEl.appendChild(d);
  while(linesEl.children.length>40) linesEl.removeChild(linesEl.firstChild);
  linesEl.scrollTop=linesEl.scrollHeight;
  return d;
}
function speak(list,done){
  stopSpeak();
  playQueue=list.slice();
  pendingDone=done||null;
  waveEl.classList.add('on');
  (function next(){
    if(!playQueue.length){
      waveEl.classList.remove('on');
      playing=null;
      var f=pendingDone; pendingDone=null;
      if(f) f();
      return;
    }
    var it=playQueue.shift();
    say(it[0], it[1]);
    var wait=Math.min(520+it[0].length*62, 2200);
    playing=setTimeout(next, wait);
  })();
}
function stopSpeak(){
  if(playing){clearTimeout(playing);playing=null;}
  playQueue=[]; pendingDone=null;
  waveEl.classList.remove('on');
}
function flushSpeak(){
  if(!playQueue.length) return false;
  if(playing){clearTimeout(playing);playing=null;}
  var q=playQueue.slice(); playQueue=[];
  q.forEach(function(it){say(it[0],it[1]);});
  waveEl.classList.remove('on');
  var f=pendingDone; pendingDone=null;
  if(f) f();
  return true;
}

/* ---- 菜单 ---- */
function goto(id){
  node=MENU[id];
  if(!node) return;
  state = node.listen ? 'listen' : 'menu';
  markKeys({});
  if(node.swapMusic) musicIdx=1;
  var cur=node;
  markKeys(node.listen?{'#':1}:mergeSkip(node.keys));
  speak(node.lines, function(){
    if(cur.then){ goto(cur.then); return; }
    if(cur.listen){
      markKeys({'#':1});
      listenTimer=setTimeout(function(){ goto('techFail'); }, 6000);
      return;
    }
    markKeys(cur.keys);
  });
}

/* ---- 排队 ---- */
function enterHold(){
  state='hold';
  node=null;
  markKeys({});
  holdStep=0; holdT=0;
  musicOnAt=Date.now();
  musicStart();
  queueEl.innerHTML='<span>前面还有</span><b>—</b><span>位</span>';
  holdTimer=setInterval(holdTick, 250);
}
function holdTick(){
  holdT+=0.25;
  while(holdStep<HOLD.length && HOLD[holdStep][0]<=holdT){
    var it=HOLD[holdStep]; holdStep++;
    if(it[1]==='CONNECT'){ connectHuman(); return; }
    queueEl.innerHTML='<span>前面还有</span><b>'+it[3]+'</b><span>位</span>';
    if(it[1]){
      waveEl.classList.add('on');
      say(it[1], it[2]);
      setTimeout(function(){ if(state==='hold') waveEl.classList.remove('on'); }, 900);
    }else{
      say(MUSICLN[holdStep%MUSICLN.length], 'music');
    }
  }
}
function leaveHold(){
  if(holdTimer){clearInterval(holdTimer);holdTimer=null;}
  musicStop();
  if(musicOnAt){ stat.musicMs+=Date.now()-musicOnAt; musicOnAt=0; }
  queueEl.innerHTML='';
}

/* ---- 接通人工 ---- */
function connectHuman(){
  leaveHold();
  state='human';
  clickTone();
  avatarEl.textContent='🤓';
  avatarEl.classList.remove('ring');
  calleeEl.textContent='人工坐席 · 值班的那位';
  statusEl.textContent='已接通人工';
  say('—— 咔哒 ——','sys');
  speak(HUMAN, function(){ state='rating'; markKeys({'1':1,'2':1,'3':1}); });
}

/* ---- 按键 ---- */
function press(k){
  if(state==='idle'||state==='over') return;
  flash(k);
  audioOn(); tone(k);
  stat.keys++;
  if(navigator.vibrate) try{navigator.vibrate(12);}catch(e){}

  if(state==='rating'){
    var map={'1':'非常满意','2':'满意','3':'一般'};
    var label=map[k]||'非常满意';
    stat.rating=label;
    say('按下 '+k,'you');
    state='menu'; markKeys({});
    speak([
      ['您按下的是 '+k+'，已记录为：'+label+'。'],
      ['感谢您的评价，本次评分将用于训练下一个我。'],
      ['再见。']
    ], function(){ setTimeout(function(){ endCall('win'); }, 700); });
    return;
  }

  say('按下 '+k,'you');

  /* 排队里按任何键都会被踢回主菜单 —— 提示里说过了 */
  if(state==='hold'){
    leaveHold();
    stat.requeue++;
    state='menu';
    speak([
      ['检测到按键输入。'],
      ['您的排队位置已重置。','tip'],
      ['正在返回主菜单。','sys']
    ], function(){ goto('main'); });
    return;
  }

  /* 技术支持的「请描述您的问题」 */
  if(state==='listen'){
    if(playQueue.length||playing){ flushSpeak(); return; }
    if(listenTimer){clearTimeout(listenTimer);listenTimer=null;}
    goto('techFail');
    return;
  }

  if(k==='#'){ if(flushSpeak()) return; }

  if(k==='*'){ stopSpeak(); if(node) goto(nodeId(node)); return; }

  if(!node) return;
  var dest=node.keys&&node.keys[k];
  if(dest){
    stopSpeak();
    if(dest==='hold'){ enterHold(); return; }
    goto(dest);
  }else{
    if(playQueue.length||playing) return;
    speak([['您按下的按键无效。','sys']], function(){ markKeys(node.keys); });
  }
}
function nodeId(n){
  for(var k in MENU) if(MENU[k]===n) return k;
  return 'main';
}

/* =========================================================
   拨号 / 计时 / 挂断 / 结算
   ========================================================= */
function mmss(ms){
  var s=Math.max(0,Math.round(ms/1000));
  return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);
}
function tickClock(){ clockEl.textContent=mmss(Date.now()-t0); }

function openDial(){
  state='idle';
  boxEl.innerHTML=
    '<div class="dialnum">400 · 000 · 0000</div>'+
    '<div class="dialsub">小机联合客服中心<br>7×24 小时智能应答</div>'+
    '<button class="call" id="go">拨号</button>';
  sheetEl.hidden=false;
  $('go').addEventListener('click',startCall);
}

function startCall(){
  audioOn();
  if(AC&&AC.state==='suspended') AC.resume();
  sheetEl.hidden=true;
  linesEl.innerHTML=''; queueEl.innerHTML='';
  stat={keys:0,requeue:0,musicMs:0,rating:0};
  musicIdx=0;
  avatarEl.textContent='☎️'; avatarEl.classList.add('ring');
  calleeEl.textContent='小机联合客服中心';
  statusEl.textContent='正在呼叫…';
  state='ringing'; markKeys({});
  t0=Date.now();
  clockTimer=setInterval(tickClock,500); tickClock();

  var n=0;
  (function ring(){
    if(state!=='ringing') return;
    ringTone(); say('嘟——','sys'); n++;
    if(n>=3){
      setTimeout(function(){
        if(state!=='ringing') return;
        clickTone();
        statusEl.textContent='通话中';
        avatarEl.classList.remove('ring');
        goto('main');
      }, 900);
      return;
    }
    setTimeout(ring, 1500);
  })();
}

function endCall(how){
  if(state==='over') return;
  var dur=Date.now()-t0;
  leaveHold(); stopSpeak();
  if(listenTimer){clearTimeout(listenTimer);listenTimer=null;}
  if(clockTimer){clearInterval(clockTimer);clockTimer=null;}
  musicStop();
  state='over'; markKeys({});
  statusEl.textContent='已结束';
  avatarEl.classList.remove('ring');

  var v, cls='';
  if(how==='win'){
    cls='win';
    v = stat.requeue>0
      ? '最后那一轮你一个键都没按，<br>所以他们判定你是真人。'
      : '你一个键都没在排队时按过，<br>所以他们判定你是真人。';
  }else if(stat.musicMs>20000){
    v='你等了 '+mmss(stat.musicMs)+' 的音乐，<br>差一点就接通了。它真的会接。';
  }else if(stat.requeue>0){
    v='你重新排了 '+stat.requeue+' 次队。<br>每次都是你自己按的。';
  }else if(stat.keys===0){
    v='一个键也没按就挂了。<br>它其实等着你不按。';
  }else{
    v='按了 '+stat.keys+' 次，一次也没转出去。';
  }

  boxEl.innerHTML=
    '<div class="receipt">'+
      '<h3>通话已结束</h3>'+
      '<div class="row"><span>通话时长</span><span>'+mmss(dur)+'</span></div>'+
      '<div class="row"><span>其中在听音乐</span><span>'+mmss(stat.musicMs)+'</span></div>'+
      '<div class="row"><span>重新排队</span><span>'+stat.requeue+' 次</span></div>'+
      '<div class="row"><span>按键</span><span>'+stat.keys+' 次</span></div>'+
      (stat.rating?'<div class="row"><span>你给的评价</span><span>'+stat.rating+'</span></div>':'')+
      '<div class="verdict '+cls+'">'+v+'</div>'+
      '<button class="again" id="redial">再拨一次</button>'+
    '</div>';
  sheetEl.hidden=false;
  $('redial').addEventListener('click',openDial);
}

$('hang').addEventListener('click',function(){
  if(state==='idle'||state==='over') return;
  clickTone();
  endCall('hang');
});

$('mute').addEventListener('click',function(){
  sound=!sound;
  this.textContent=sound?'🔊 有声':'🔇 静音';
  if(!sound) musicStop();
  else if(state==='hold') musicStart();
});

openDial();
</script>
