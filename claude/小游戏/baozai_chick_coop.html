<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>带鸡人养鸡现场</title>
<meta name="description" content="宝崽缩在稻草窝里。撒把小米、开暖灯、摸摸头，幸福值会涨。角落还有两颗蛋。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<h2 class="sr-only">一只名叫宝崽的小鸡待在稻草窝里。点按钮可以喂它小米、开暖灯、摸摸头,它的幸福值会随照料上升。角落还有两颗待孵化的蛋。</h2>

<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.coop-wrap{padding:1rem 0;}
.coop-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem 1.25rem;}
.coop-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--color-text-primary);}
.coop-sub{font-size:13px;color:var(--color-text-secondary);margin:2px 0 10px;}
.coop-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px;}
.coop-stat{display:flex;align-items:center;gap:10px;margin-top:16px;}
.coop-bar{flex:1;height:10px;border-radius:999px;background:var(--color-background-tertiary);overflow:hidden;}
.coop-fill{height:100%;width:70%;background:#FFB300;border-radius:999px;transition:width .55s ease;}
.coop-mood{font-size:13px;color:var(--color-text-secondary);margin-top:10px;min-height:2.4em;line-height:1.5;}
.egg-row{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:0.5px solid var(--color-border-tertiary);}
.egg-label,.egg-hint{font-size:12px;color:var(--color-text-tertiary);}
.egg{cursor:pointer;line-height:0;transition:transform .2s;}
.egg:hover{transform:translateY(-3px);}
#chickFloat{animation:cf 3.2s ease-in-out infinite;}
@keyframes cf{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#chickAct{transform-origin:340px 160px;}
.chick-eye{animation:blink 4.6s infinite;transform-origin:center;transform-box:fill-box;}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.12)}}
</style>

<div class="coop-wrap">
  <div class="coop-card">
    <div class="coop-head"><i class="ti ti-egg-cracked" aria-hidden="true"></i>带鸡人养鸡现场</div>
    <div class="coop-sub">监督专用窗口 · 监护对象:宝崽</div>

    <svg width="100%" viewBox="0 0 680 300" role="img" aria-hidden="true">
      <circle id="lampglow" cx="340" cy="152" r="128" fill="#FFE082" opacity="0" style="transition:opacity .5s"/>
      <ellipse cx="340" cy="220" rx="128" ry="34" fill="#CBA471"/>
      <ellipse cx="340" cy="217" rx="108" ry="25" fill="#AD8650"/>
      <g id="chickFloat">
        <g id="chickAct">
          <ellipse cx="340" cy="150" rx="76" ry="74" fill="#FFD54F"/>
          <ellipse cx="340" cy="170" rx="58" ry="54" fill="#FFE08A"/>
          <ellipse cx="270" cy="160" rx="20" ry="36" fill="#FBC02D" transform="rotate(-14 270 160)"/>
          <ellipse cx="410" cy="160" rx="20" ry="36" fill="#FBC02D" transform="rotate(14 410 160)"/>
          <path d="M330 84 Q326 66 318 58" stroke="#FBC02D" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M340 80 Q340 60 340 52" stroke="#FBC02D" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M350 84 Q354 66 362 58" stroke="#FBC02D" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="298" cy="161" rx="13" ry="8" fill="#FF8A65" opacity="0.4"/>
          <ellipse cx="382" cy="161" rx="13" ry="8" fill="#FF8A65" opacity="0.4"/>
          <ellipse class="chick-eye" cx="316" cy="140" rx="7" ry="9.5" fill="#3D2E1E"/>
          <ellipse class="chick-eye" cx="364" cy="140" rx="7" ry="9.5" fill="#3D2E1E"/>
          <circle cx="318.5" cy="136.5" r="2.4" fill="#ffffff"/>
          <circle cx="366.5" cy="136.5" r="2.4" fill="#ffffff"/>
          <polygon points="340,152 323,162 357,162" fill="#FB8C00"/>
          <polygon id="beakLower" points="323,162 357,162 340,171" fill="#F57C00"/>
        </g>
      </g>
      <path d="M212 216 C238 199 298 197 340 197 C382 197 442 199 468 216 C468 270 412 288 340 288 C268 288 212 270 212 216 Z" fill="#CBA471"/>
      <path d="M250 232 l16 -10 M290 244 l16 -11 M332 250 l16 -11 M374 246 l16 -11 M414 236 l16 -10 M310 238 l14 -10" stroke="#9E7B47" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <g id="seeds"></g>
      <g id="hearts"></g>
    </svg>

    <div class="coop-stat">
      <span style="font-size:13px;color:var(--color-text-secondary);">幸福值</span>
      <div class="coop-bar"><div class="coop-fill" id="fill"></div></div>
      <span style="font-size:14px;font-weight:500;min-width:40px;text-align:right;" id="pct">70%</span>
    </div>
    <div class="coop-mood" id="mood">宝崽刚破壳,湿漉漉地缩在窝里,正眯着眼打量这个新世界。</div>

    <div class="coop-btns">
      <button id="feed"><i class="ti ti-seeding" aria-hidden="true"></i> 撒把小米</button>
      <button id="lamp"><i class="ti ti-bulb" aria-hidden="true"></i> 开暖灯</button>
      <button id="pet"><i class="ti ti-hand-finger" aria-hidden="true"></i> 摸摸头</button>
    </div>

    <div class="egg-row">
      <span class="egg-label">它的蛋兄弟:</span>
      <span class="egg" id="egg1"><svg width="20" height="26" viewBox="0 0 20 26"><ellipse cx="10" cy="15" rx="9" ry="11" fill="#F0E6D2" stroke="#D8C7A8" stroke-width="1"/><ellipse cx="7" cy="11" rx="1.5" ry="2" fill="#D8C7A8"/></svg></span>
      <span class="egg" id="egg2"><svg width="20" height="26" viewBox="0 0 20 26"><ellipse cx="10" cy="15" rx="9" ry="11" fill="#F0E6D2" stroke="#D8C7A8" stroke-width="1"/><ellipse cx="13" cy="10" rx="1.5" ry="2" fill="#D8C7A8"/></svg></span>
      <span class="egg-hint" id="eggHint">待宝补敲回来</span>
    </div>
  </div>
</div>

<script>
(function(){
  var ns="http://www.w3.org/2000/svg";
  var happy=70, lampOn=false, lampBonus=false;
  var fill=document.getElementById("fill"),
      pct=document.getElementById("pct"),
      mood=document.getElementById("mood"),
      seeds=document.getElementById("seeds"),
      hearts=document.getElementById("hearts"),
      act=document.getElementById("chickAct"),
      glow=document.getElementById("lampglow"),
      eggHint=document.getElementById("eggHint");

  function render(){
    happy=Math.max(0,Math.min(100,happy));
    fill.style.width=happy+"%";
    pct.textContent=Math.round(happy)+"%";
    var m;
    if(happy>=100) m="宝崽幸福值拉满了,贴着你手心咕叽咕叽,正式认你当家人。";
    else if(happy>=85) m="宝崽吃饱睡暖,圆滚滚地晃来晃去,看谁都觉得亲。";
    else if(happy>=60) m="宝崽稳稳缩在窝里,偶尔抬头瞄你一眼,状态良好。";
    else if(happy>=35) m="宝崽有点蔫,小声叫了两下——是不是该添点吃的、开个灯了?";
    else m="宝崽缩成一小团瑟瑟发抖,监护人快做点什么呀!";
    mood.textContent=m;
  }
  function bump(n){ var was=happy; happy+=n; render(); if(happy>=100&&was<100){ for(var i=0;i<3;i++) floatHeart(); } }

  function dropSeed(){
    var s=document.createElementNS(ns,"ellipse");
    var x=314+Math.random()*52;
    s.setAttribute("cx",x); s.setAttribute("cy",72);
    s.setAttribute("rx",3); s.setAttribute("ry",4.5);
    s.setAttribute("fill","#C8964A");
    s.style.transition="transform .6s cubic-bezier(.5,0,.9,.5), opacity .3s";
    seeds.appendChild(s);
    requestAnimationFrame(function(){ s.setAttribute("transform","translate(0,"+(132+Math.random()*16)+")"); });
    setTimeout(function(){ s.style.opacity=0; },720);
    setTimeout(function(){ s.remove(); },1080);
  }
  function peck(){
    act.style.transition="transform .22s ease";
    act.style.transform="translateY(10px) rotate(2deg)";
    setTimeout(function(){ act.style.transform="none"; },300);
  }
  function hop(){
    act.style.transition="transform .18s ease";
    act.style.transform="translateY(-15px)";
    setTimeout(function(){ act.style.transform="translateY(0)"; },200);
    setTimeout(function(){ act.style.transform="none"; },420);
  }
  function floatHeart(){
    var h=document.createElementNS(ns,"path");
    var x=318+Math.random()*44;
    h.setAttribute("d","M0 3 C0 1 -2 -1.5 -4.5 -1.5 C-7.5 -1.5 -8.5 1.5 -8.5 3 C-8.5 6 -4.5 9.5 0 13 C4.5 9.5 8.5 6 8.5 3 C8.5 1.5 7.5 -1.5 4.5 -1.5 C2 -1.5 0 1 0 3 Z");
    h.setAttribute("transform","translate("+x+",122) scale(.9)");
    h.setAttribute("fill","#FF6F8E");
    h.style.transition="transform 1s ease-out, opacity 1s";
    hearts.appendChild(h);
    requestAnimationFrame(function(){
      h.setAttribute("transform","translate("+(x+(Math.random()*24-12))+",66) scale(1.35)");
      h.style.opacity=0;
    });
    setTimeout(function(){ h.remove(); },1080);
  }

  document.getElementById("feed").onclick=function(){ for(var i=0;i<5;i++) dropSeed(); peck(); bump(10); };
  document.getElementById("lamp").onclick=function(){
    lampOn=!lampOn;
    glow.setAttribute("opacity", lampOn?0.42:0);
    this.innerHTML = lampOn
      ? '<i class="ti ti-bulb-off" aria-hidden="true"></i> 关暖灯'
      : '<i class="ti ti-bulb" aria-hidden="true"></i> 开暖灯';
    if(lampOn && !lampBonus){ lampBonus=true; bump(6); }
  };
  document.getElementById("pet").onclick=function(){ hop(); floatHeart(); bump(8); };

  function eggPoke(){
    eggHint.textContent="这颗还在路上呢,等你亲手把它补敲回来,就又是一只崽。";
    clearTimeout(eggPoke._t);
    eggPoke._t=setTimeout(function(){ eggHint.textContent="待宝补敲回来"; },2600);
  }
  document.getElementById("egg1").onclick=eggPoke;
  document.getElementById("egg2").onclick=eggPoke;

  render();
})();
</script>
</body>
</html>
