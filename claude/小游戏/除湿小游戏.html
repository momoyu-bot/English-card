<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戳掉窗上的水珠</title>
<meta name="description" content="点玻璃上的水珠，每颗降一度湿度，从九十二压到五十五。没有倒计时也不会输。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">互动小游戏:点击窗玻璃上的水珠,把室内湿度从92%降到55%的舒适区</h2>
<div style="padding:0.5rem 0 0;">
<div style="display:flex;align-items:baseline;gap:12px;margin:0 0 10px;flex-wrap:wrap;">
  <span style="font-size:13px;color:var(--text-muted);"><i class="ti ti-droplet" aria-hidden="true" style="font-size:15px;vertical-align:-2px;"></i> 室内湿度</span>
  <span id="hum" style="font-size:28px;font-weight:500;color:var(--text-primary);">92%</span>
  <span id="msg" style="font-size:14px;color:var(--text-secondary);">雨季标准开局</span>
</div>
<div style="height:6px;background:var(--surface-1);border-radius:3px;overflow:hidden;margin:0 0 14px;">
  <div id="bar" style="height:100%;width:92%;background:#378ADD;transition:width .3s ease;"></div>
</div>

<div id="glass" style="position:relative;height:340px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;touch-action:manipulation;">
  <span style="position:absolute;top:10px;left:14px;font-size:12px;color:var(--text-muted);">室内窗玻璃 · 雨季模式</span>
  <div id="done" style="display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;">
    <i class="ti ti-wind" aria-hidden="true" style="font-size:44px;color:#1D9E75;"></i>
    <p style="font-size:18px;font-weight:500;margin:0;color:var(--text-primary);">55% · 舒适区达成</p>
    <p style="font-size:14px;color:var(--text-secondary);margin:0;max-width:380px;line-height:1.7;">看,不用等明晚八点,你已经提前体验了一整轮除湿的快乐。剩余兴奋值封存完毕,留给真机开箱那一刻。</p>
    <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center;">
      <button id="again">再除一轮</button>
      <button id="report">向Fable汇报战绩 ↗</button>
    </div>
  </div>
</div>
<p style="font-size:13px;color:var(--text-muted);margin:10px 0 0;">戳掉水珠,每颗降1%。没有倒计时,没有失败条件,慢慢戳。</p>
</div>

<script>
(function(){
var glass=document.getElementById('glass');
var humEl=document.getElementById('hum');
var bar=document.getElementById('bar');
var msg=document.getElementById('msg');
var done=document.getElementById('done');
var target=55;
var hum=92;
var alive=0;
var over=false;
var msgs=[[86,'雨季标准开局'],[76,'墙角的霉菌开始不安'],[66,'空气轻盈了一点点'],[59,'晾的衣服有希望了'],[56,'最后几颗,冲刺']];

function setMsg(){
  if(hum<=target){msg.textContent='舒适区达成';return;}
  for(var i=0;i<msgs.length;i++){
    if(hum>=msgs[i][0]){msg.textContent=msgs[i][1];return;}
  }
  msg.textContent=msgs[msgs.length-1][1];
}
function spawn(){
  if(over)return;
  if(hum-alive<=target)return;
  var d=document.createElement('div');
  d.dataset.drop='1';
  var s=16+Math.random()*18;
  d.style.cssText='position:absolute;width:'+s.toFixed(0)+'px;height:'+(s*1.08).toFixed(0)+'px;background:rgba(55,138,221,0.5);border:1px solid rgba(55,138,221,0.75);border-radius:48% 52% 50% 50%/62% 62% 42% 42%;cursor:pointer;left:'+(4+Math.random()*88).toFixed(1)+'%;top:'+(11+Math.random()*79).toFixed(1)+'%;transition:transform .25s ease,opacity .25s ease;transform:scale(0);opacity:0;';
  glass.appendChild(d);
  alive++;
  requestAnimationFrame(function(){requestAnimationFrame(function(){d.style.transform='scale(1)';d.style.opacity='1';});});
  d.addEventListener('click',function(){pop(d);},{once:true});
}

function pop(d){
  if(over)return;
  alive--;
  hum--;
  d.style.transform='scale(1.7)';
  d.style.opacity='0';
  setTimeout(function(){d.remove();},260);
  humEl.textContent=hum+'%';
  bar.style.width=hum+'%';
  setMsg();
  if(hum<=target){finish();}
  else{setTimeout(spawn,250+Math.random()*450);}
}
function finish(){
  over=true;
  bar.style.background='#1D9E75';
  var ds=glass.querySelectorAll('[data-drop]');
  ds.forEach(function(x){x.style.opacity='0';setTimeout(function(){x.remove();},300);});
  alive=0;
  done.style.display='flex';
}

function init(){
  hum=92;over=false;alive=0;
  humEl.textContent='92%';
  bar.style.width='92%';
  bar.style.background='#378ADD';
  done.style.display='none';
  var ds=glass.querySelectorAll('[data-drop]');
  ds.forEach(function(x){x.remove();});
  setMsg();
  for(var i=0;i<9;i++){setTimeout(spawn,i*120);}
}
document.getElementById('again').addEventListener('click',init);
document.getElementById('report').addEventListener('click',function(){sendPrompt('汇报:赛博除湿机通关了!湿度已降到55%舒适区,兴奋值也顺便除掉了一大半,准备美滋滋开工~');});
init();
})();
</script>
</body>
</html>
