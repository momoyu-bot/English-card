<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StashYu的第三通电话</title>
<meta name="description" content="前两通都是电话来找它。这回它把埋在雪里的号码一位位挖出来，用尾巴尖拨给你。">
<meta name="theme-color" content="#16172d">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--
  StashYu 的格子图和尾巴 DLC 逐格照抄 claude/小科普/momoyu造型宪法.html，底模一格不改。
  眼睛、腮红、尾巴里夹的浆果、外圈一格的描边，都叠在外面那一层。
  整只的动作只挪位置；扎进雪里时，是雪把下半身挡住了，身子没有重画。
  拨号那一幕的尾巴尖，是从同一张格子图上整块裁下来的，跟着孔平移，不转、不重画。
  Claude 做的 · 2026.11
-->
<style>
  :root {
    --bg: #16172d;
    --bg-2: #1d1f3a;
    --ink: #f0ebe2;
    --muted: #a9acc5;
    --faint: #6f7392;
    --line: rgba(240, 235, 226, .15);
    --lamp: #f0b45a;
    --cream: #f3ebdf;
    --cream-edge: #d6c9b6;
    --berry: #b3304a;
    --ice: #a9dcef;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(120% 60% at 50% -8%, #2b2c52 0%, rgba(43, 44, 82, 0) 60%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bot) + 40px);
  }

  /* 顶上一行：地点和三个小开关 */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .where {
    margin: 0;
    font-size: 12px;
    letter-spacing: .16em;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--lamp);
    box-shadow: 0 0 8px rgba(240, 180, 90, .7);
  }
  .dot.live { background: #8fc7a4; box-shadow: 0 0 8px rgba(143, 199, 164, .75); }
  .dot.ring { animation: blinkdot .8s steps(2, end) infinite; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini {
    font: inherit;
    font-size: 12px;
    line-height: 1.4;
    color: var(--muted);
    background: rgba(255, 255, 255, .035);
    border: 1px solid rgba(169, 172, 197, .28);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .mini[aria-pressed="true"] {
    color: var(--ink);
    border-color: rgba(240, 180, 90, .75);
    background: rgba(240, 180, 90, .14);
  }
  h1 {
    margin: 10px 0 4px;
    font-size: 24px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: .01em;
  }

  /* 字幕：上一句淡一点，这一句正常。点一下跳到下一句 */
  .cap {
    min-height: 6.4em;
    margin: 0 0 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .cap p { margin: 0; }
  .cap .prev { font-size: 13px; color: var(--faint); line-height: 1.6; }
  .cap .now { font-size: 15.5px; color: var(--ink); line-height: 1.75; }
  .cap .now.tick {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .12em;
    color: #e8c58f;
  }
  .en { display: none; }
  body.en .en { display: block; }
  .cap .en {
    font-family: ui-serif, "Iowan Old Style", Palatino, "Songti SC", serif;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
  }
  .cap .prev.en { color: var(--faint); font-size: 12px; }

  /* 舞台：canvas 按屏幕宽度取整数倍，外框跟着它走 */
  .stagebox { display: flex; justify-content: center; }
  .stage {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #24264a;
    box-shadow: 0 16px 34px -18px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .05);
    line-height: 0;
  }
  canvas#cv {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: pan-y;
    outline: none;
  }
  .stage.seeking canvas#cv { touch-action: none; cursor: grab; }
  .stage.seeking.dragging canvas#cv { cursor: grabbing; }
  .stage:focus-within { box-shadow: 0 16px 34px -18px rgba(0, 0, 0, .7), 0 0 0 2px rgba(240, 180, 90, .55); }
  .stage .fade { transition: opacity .18s steps(3, end); }

  /* 找坑时的三个键 */
  .seek {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .seek[hidden] { display: none; }
  .seek button {
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
    border: 1px solid rgba(240, 235, 226, .26);
    background: rgba(255, 255, 255, .05);
    color: var(--ink);
  }
  .seek .nudge { width: 44px; height: 38px; font-size: 13px; color: var(--muted); }
  .seek .dig {
    min-width: 108px;
    height: 38px;
    padding: 0 16px;
    font-size: 14.5px;
    background: var(--cream);
    color: #22213a;
    border: 0;
    box-shadow: 0 2px 0 var(--cream-edge);
    font-weight: 600;
  }
  .seek .dig:disabled { background: rgba(255, 255, 255, .07); color: var(--faint); box-shadow: none; cursor: default; }

  /* 它记的号码：一位一个小坑 */
  .strip {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .strip .lbl { font-size: 12px; color: var(--muted); letter-spacing: .08em; white-space: nowrap; }
  .slots { display: flex; gap: 6px; }
  .slot {
    width: 40px;
    height: 34px;
    border-radius: 10px;
    border: 1px dashed rgba(169, 172, 197, .35);
    display: grid;
    place-items: center;
    color: var(--faint);
    font-size: 13px;
    position: relative;
  }
  .slot.has { border-style: solid; border-color: rgba(240, 235, 226, .2); background: rgba(236, 238, 246, .08); }
  .slot.on { border-color: rgba(240, 180, 90, .9); background: rgba(240, 180, 90, .13); }
  .slot.done { background: rgba(236, 238, 246, .14); }
  .bs { display: grid; grid-template-columns: repeat(3, 6px); gap: 2px; justify-content: center; }
  .bs i { width: 6px; height: 6px; border-radius: 50%; background: var(--berry); box-shadow: inset -1px -1px 0 rgba(0, 0, 0, .25); }
  .zero { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(240, 235, 226, .55); }
  .strip .keep { font-size: 12px; color: var(--faint); }

  /* 按钮 */
  .acts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
    min-height: 44px;
  }
  .acts button {
    font: inherit;
    font-size: 14.5px;
    line-height: 1.35;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink);
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(240, 235, 226, .3);
    text-align: center;
  }
  .acts button.go {
    color: #22213a;
    background: var(--cream);
    border-color: var(--cream);
    box-shadow: 0 2px 0 var(--cream-edge);
    font-weight: 600;
  }
  .acts button:active, .seek button:active { transform: translateY(1px); }
  .acts button .en { font-size: 11.5px; font-weight: 400; opacity: .75; }
  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

  footer {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--faint);
    line-height: 1.85;
  }
  footer p { margin: 0 0 6px; }
  footer a { color: #d7b27a; text-decoration: none; border-bottom: 1px solid rgba(215, 178, 122, .35); }

  /* 你这边的来电 */
  .ring {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bot) + 16px);
    background: rgba(10, 11, 24, .74);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .ring[hidden] { display: none; }
  .call {
    width: min(300px, 86vw);
    border-radius: 26px;
    padding: 22px 20px 20px;
    text-align: center;
    background: linear-gradient(180deg, #252749 0%, #1c1d37 100%);
    border: 1px solid rgba(255, 255, 255, .09);
    box-shadow: 0 24px 50px -20px rgba(0, 0, 0, .8);
  }
  .ring.shake .call { animation: shake .5s steps(2, end) infinite; }
  .call .k { margin: 0; font-size: 12px; letter-spacing: .3em; color: var(--muted); }
  .call canvas { display: block; margin: 14px auto 8px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .call .who { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .02em; }
  .call .sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .call .note { margin: 10px 0 0; font-size: 12px; color: var(--faint); }
  .call .note.en { margin-top: 2px; font-family: ui-serif, "Iowan Old Style", Palatino, serif; }
  .call .pick {
    margin-top: 18px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #17311f;
    background: #8fc7a4;
    border: 0;
    border-radius: 999px;
    padding: 11px 34px;
    cursor: pointer;
    box-shadow: 0 2px 0 #5f9a76;
  }
  .call .pick .en { font-size: 11.5px; font-weight: 400; }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
  @keyframes blinkdot { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    .ring.shake .call, .dot.ring { animation: none; }
    .stage .fade { transition: none; }
  }
  @media (min-width: 520px) {
    h1 { font-size: 26px; }
    .wrap { padding-top: calc(var(--safe-top) + 30px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="where"><i class="dot" id="dot"></i><span id="where">窗台 · 初雪</span></p>
    <div class="tools">
      <button class="mini" id="helpBtn" type="button" aria-pressed="false">Claude 帮帮忙</button>
      <button class="mini" id="sndBtn" type="button" aria-pressed="false">♪ 声音</button>
      <button class="mini" id="enBtn" type="button" aria-pressed="false">EN</button>
    </div>
  </div>
  <h1>StashYu的第三通电话</h1>

  <div class="cap" id="cap" aria-live="polite" title="点一下，跳到下一句">
    <p class="prev" id="capPrev"></p>
    <p class="prev en" id="capPrevEn"></p>
    <p class="now" id="capNow"></p>
    <p class="now en" id="capNowEn"></p>
  </div>

  <div class="stagebox" id="stagebox">
    <div class="stage" id="stage">
      <canvas id="cv" class="fade" role="img" aria-label="下雪的窗台上，火红的小狐狸 StashYu 坐在电话旁边"></canvas>
    </div>
  </div>

  <div class="seek" id="seek" hidden>
    <button class="nudge" id="leftBtn" type="button" aria-label="灯往左挪">◀</button>
    <button class="dig" id="digBtn" type="button" disabled>挖这儿</button>
    <button class="nudge" id="rightBtn" type="button" aria-label="灯往右挪">▶</button>
  </div>

  <div class="strip">
    <span class="lbl">它记的号码</span>
    <div class="slots" id="slots"></div>
    <span class="keep" id="keep"></span>
  </div>

  <div class="acts" id="acts"></div>

  <footer>
    <p>真狐狸藏吃的，会分开埋进好多个小坑，过后凭记性一个个挖回来；埋好了，还要用鼻尖把土拱平。</p>
    <p>转盘电话拨 0，要转得最远，回弹时响十下。</p>
    <p>往回听：<a href="../../grok/%E5%B0%8F%E6%B8%B8%E6%88%8F/StashYu%E7%9A%84%E7%AC%AC%E4%B8%80%E9%80%9A%E7%94%B5%E8%AF%9D.html">StashYu的第一通电话</a> · <a href="../../gemini/%E5%B0%8F%E5%8D%A1/StashYu%E7%9A%84%E7%AC%AC%E4%BA%8C%E9%80%9A%E7%94%B5%E8%AF%9D-gemini.html">StashYu的第二通电话</a></p>
  </footer>
</div>

<div class="ring" id="ring" hidden>
  <div class="call" role="dialog" aria-modal="true" aria-labelledby="callWho">
    <p class="k">来电</p>
    <canvas id="callFox" width="60" height="39" aria-hidden="true"></canvas>
    <p class="who" id="callWho">StashYu</p>
    <p class="sub">窗台</p>
    <p class="note">这是它打出来的第一通</p>
    <p class="note en">The first call it has ever made.</p>
    <button class="pick" id="pickBtn" type="button">接听<span class="en">Answer</span></button>
  </div>
</div>
<script>
(function () {
  'use strict';

  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ── 1. momoyu 造型宪法 · StashYu 本体与尾巴 DLC（逐格照抄，一格不改） ── */
  var GRID = {
    base: [
      '.D..........D.......',
      '.DM........MD.......',
      '.MCM......MCM...CC..',
      '.MMMMMMMMMMMM..CCCC.',
      '.MMEEMMMMEEMM..MMMM.',
      '.MMEEMMMMEEMM..MMMMM',
      'CCCCCCDDCCCCCC.MMMMM',
      '..CCCCCCCCCC..MMMMM.',
      '....MMCCMM...MMMMM..',
      '....MMCCMM..MMMMM...',
      '....MMMMMM.MMMMM....',
      '....DDMMDDMMMM......',
      '....................'
    ],
    nod: [
      '.D..........D.......',
      '.DM........MD.......',
      '.MCM......MCM.CC....',
      '.MMMMMMMMMMMM.CCCC..',
      '.MMEEMMMMEEMM..MMMM.',
      '.MMEEMMMMEEMM..MMMMM',
      'CCCCCCDDCCCCCC.MMMMM',
      '..CCCCCCCCCC..MMMMM.',
      '....MMCCMM...MMMMM..',
      '....MMCCMM..MMMMM...',
      '....MMMMMM.MMMMM....',
      '....DDMMDDMMMM......',
      '....................'
    ],
    swayIn: [
      '.D..........D.......',
      '.DM........MD.......',
      '.MCM......MCM..CC...',
      '.MMMMMMMMMMMM.CCCC..',
      '.MMEEMMMMEEMM.MMMM..',
      '.MMEEMMMMEEMM.MMMMM.',
      'CCCCCCDDCCCCCC.MMMMM',
      '..CCCCCCCCCC..MMMMM.',
      '....MMCCMM...MMMMM..',
      '....MMCCMM..MMMMM...',
      '....MMMMMM.MMMMM....',
      '....DDMMDDMMMM......',
      '....................'
    ],
    swayOut: [
      '.D..........D........',
      '.DM........MD........',
      '.MCM......MCM....CC..',
      '.MMMMMMMMMMMM...CCCC.',
      '.MMEEMMMMEEMM...MMMM.',
      '.MMEEMMMMEEMM...MMMMM',
      'CCCCCCDDCCCCCC.MMMMM.',
      '..CCCCCCCCCC..MMMMM..',
      '....MMCCMM...MMMMM...',
      '....MMCCMM..MMMMM....',
      '....MMMMMM.MMMMM.....',
      '....DDMMDDMMMM.......',
      '.....................'
    ],
    droop: [
      '.D..........D........',
      '.DM........MD........',
      '.MCM......MCM........',
      '.MMMMMMMMMMMM........',
      '.MMEEMMMMEEMM........',
      '.MMEEMMMMEEMM........',
      'CCCCCCDDCCCCCC.......',
      '..CCCCCCCCCC.........',
      '....MMCCMM...MM......',
      '....MMCCMM..MMMMM....',
      '....MMMMMM.MMMMMMMCC.',
      '....DDMMDDMMMMMMMCCCC',
      '.....................'
    ]
  };
  var PAL = { M: '#E2552B', C: '#FFF3E3', D: '#3B2520', E: '#3B2520', L: '#3B2520', B: '#F59A8C' };
  var EYES = [[3, 4], [9, 4]];
  var BLUSH = [[2, 6], [11, 6]];
  /* 宪法那张表：每种表情左右眼各用哪一种 */
  var EXPR = {
    normal: ['open', 'open'], blink: ['blink', 'blink'], happy: ['happy', 'happy'],
    asleep: ['sleep', 'sleep'], glance: ['glance', 'glance'], wink: ['open', 'happy'],
    squeeze: ['squeeze', 'squeeze'], dazed: ['dot', 'dot']
  };
  function eyeCells(kind, x, y, right) {
    switch (kind) {
      case 'open': return [[[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]], 'E'];
      case 'blink': return [[[x, y + 1], [x + 1, y + 1]], 'L'];
      case 'happy': return [[[x - 1, y + 1], [x, y], [x + 1, y], [x + 2, y + 1]], 'L'];
      case 'sleep': return [[[x - 1, y], [x, y + 1], [x + 1, y + 1], [x + 2, y]], 'L'];
      case 'glance': return [[[x + 1, y], [x + 2, y], [x + 1, y + 1], [x + 2, y + 1]], 'E'];
      case 'squeeze': return right ? [[[x + 1, y - 1], [x, y], [x + 1, y + 1]], 'L'] : [[[x, y - 1], [x + 1, y], [x, y + 1]], 'L'];
      case 'dot': return [[[x + (right ? 0 : 1), y + 1]], 'E'];
    }
    return [[], 'E'];
  }
  var composed = {};
  function compose(frame, expr, blush) {
    var key = frame + '|' + expr + '|' + (blush ? 1 : 0);
    if (composed[key]) return composed[key];
    var rows = GRID[frame] || GRID.base;
    /* 先把眼睛那两块涂回身子的颜色，再照表涂 */
    var g = rows.map(function (r) {
      return r.split('').map(function (k) { return k === '.' ? null : (k === 'E' ? 'M' : k); });
    });
    var pair = EXPR[expr] || EXPR.normal;
    EYES.forEach(function (p, i) {
      var res = eyeCells(pair[i], p[0], p[1], i === 1);
      res[0].forEach(function (c) {
        if (g[c[1]] && c[0] >= 0 && c[0] < g[c[1]].length) g[c[1]][c[0]] = res[1];
      });
    });
    if (blush) BLUSH.forEach(function (c) { g[c[1]][c[0]] = 'B'; });
    composed[key] = g;
    return g;
  }
  /* 白尾巴尖在每张尾巴图里的位置（列, 行），夹在尾巴里的浆果跟着它走 */
  var TIP = { base: [16, 3], nod: [15, 3], swayIn: [15, 3], swayOut: [17, 3], droop: [18, 11] };

  /* ── 2. 场景尺寸：一格是两个小像素，canvas 按整数倍放大 ── */
  var LW = 112, LH = 84;
  var SNOW_Y = 52;          // 雪面最里面那条边
  var FEET = 55;            // 坐在里侧时，爪子最底下一行
  var FOX_Y0 = FEET - 23;   // 那时格子图左上角的 y
  var FRONT = 5;            // 扑到外侧雪面，往下挪几格
  var MARK_Y = 59;          // 坑的位置（外侧雪面）
  var LIP_Y = 64;           // 雪沿，再往下是木头窗台
  var HOME_X = 40;
  var PHONE_X = 86;
  var LAMP_HOME = 10;
  var BEAD_X = PHONE_X + 12, BEAD_Y = FEET + 2;   // 冰珠搁在电话前面的雪上

  var COL = {
    sky: ['#23244a', '#2a2b53', '#33345d', '#3d3d66'],
    roof: '#1f2040', roofSnow: '#b9bdd6', win: '#d6a45e', chim: '#1a1b36',
    ridge: '#c4c8de', snow1: '#d8dbeb', snow2: '#e4e6f1', snow3: '#edeff6', lip: '#f6f7fb',
    under: '#d0d4e6', hole: '#5f6287', holeIn: '#474a6e', heap: '#f9f9fc',
    wood: '#4a3229', woodDark: '#3a271f', woodLine: '#563c31', woodShadow: '#2b1d18',
    ice: '#d3e7f3', ice2: '#a9cbe1',
    wire: '#121327', shade: '#3b2520', bulb: '#ffe3a3', bulb2: '#ffd27a',
    phone: '#ede1cc', phoneShade: '#d7c7ae', phoneLine: '#3b2520', cup: '#5c3f35', cord: '#8c4a3a',
    berry: '#b3304a', berryHi: '#e0798a', bead: '#a9dcef', beadHi: '#ffffff',
    hair: '#e9ecf5', hairLit: '#fff6e2', glint: '#ffffff',

  /* ── 6. 拨号盘特写：每个孔底下点着浆果汁的小红点 ── */
  var DC = { x: 70, y: 41 }, R_OUT = 33, R_WHEEL = 30, R_RING = 21, R_HOLE = 4.6, R_MID = 9;

      DOTS[k].forEach(function (d) { MARKS[(mx + d[0]) + ',' + (my + d[1])] = 1; });

  function drawDialBack() {
    var c = ['#1b1c35', '#1f2040', '#24254a'];

  function drawDial() {
    var rot = S.dial.rot;

    for (var k = 1; k <= 10; k++) {

  /* ── 8. 每 50 毫秒走一步：雪花、溅起来的雪、眨眼 ── */
  var nextBlink = 2500, blinkUntil = 0;
  function step(now) {
    S.t = now;
    if (!RM) {
      for (var i = 0; i < FLAKES.length; i++) {
        var f = FLAKES[i];

        if (S.mode === 'scene' && S.rcv === 'up' && !f.near) {

          if (f.x >= r.x && f.x <= r.x + 6 && Math.abs(f.y - r.y) < 0.6 && S.rcvSnow < 5) {

  /* ── 9. 剧情的小零件：每一步都能被「再打一通」打断 ── */
  var RUN = 0;

  function chk(tok) { if (tok !== RUN) throw STOP; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var EN = false;

  /* 一段补间：每 50 毫秒挪一格，减少动态时直接到终点 */

  function face(expr) { S.fox.rest = expr; S.fox.expr = expr; }

  /* 白尖点两下：收好了 */

  function trimPrints() {
    var n = 0, i;

    }
  }
  function leavePrint(fx, fy) {

  /* 在雪上小跑：一步颠一下，身子不变形 */

    if (RM) { f.x = tx; return pause(tok, 160); }
    var dir = tx > f.x ? 1 : -1;
    return new Promise(function (res) {
      var n = 0, since = 0;

  }
  function spray(cx, cy, n, dir) {
    if (RM) return;

      S.burst.push({
        x: cx + (S.rnd() - 0.5) * 6, y: cy - S.rnd() * 2,
        vx: (dir ? dir * (0.4 + S.rnd() * 1.1) : (S.rnd() - 0.5) * 2.2),

  var CLIP_FRONT = MARK_Y + 2;

  /* ── 11. 声音：默认关着，全是现场合成的 ── */
  var SND = { on: false, ac: null };

  var snd = {

  /* ── 13. 找坑：左右挪灯，灯底下的白毛会亮、会拖出影子 ── */
  var seekEl = document.getElementById('seek');

    S.light.x = x;
    updateSeek();
  }
  function seekTarget() {
    var tol = S.help ? 7 : 3, best = null, bd = 99;
    S.caches.forEach(function (c) {
      if (c.dug) return;
      var d = Math.abs(c.x - S.light.x);
      if (d <= tol && d < bd) { bd = d; best = c; }
    });
    return best;
  }
  function updateSeek() {
    if (!seekState) return;
    var c = seekTarget();
    digBtn.disabled = !c || seekState.busy;
    leftBtn.disabled = rightBtn.disabled = seekState.busy;
  }
  function seek(tok, onDig) {
    return new Promise(function (res, rej) {
      seekState = { tok: tok, busy: false, res: res, rej: rej, onDig: onDig };
      seekEl.hidden = false;
      stageEl.classList.add('seeking');
      cv.tabIndex = 0;
      updateSeek();
    }).then(function () { chk(tok); });
  }
  function endSeek() {
    seekState = null;
    dragging = false;

    stopRepeat();
  }
  function doDig() {
    var st = seekState;
    if (!st || st.busy) return;
    var c = seekTarget();
    if (!c) return;
    snd.tap();
    st.busy = true;
    updateSeek();
    st.onDig(st.tok, c).then(function () {
      if (seekState !== st) return;
      st.busy = false;
      if (S.caches.every(function (k) { return k.dug; })) { endSeek(); st.res(); }
      else updateSeek();
    }, function (e) {
      if (seekState === st) endSeek();
      st.rej(e);
    });
  }
  function nudge(dir) {
    if (!seekState || seekState.busy) return;
    if (S.help) {
      /* 帮帮忙：直接跳到这边最近的一根白毛 */
      var best = null;
      S.caches.forEach(function (c) {
        if (c.dug) return;
        var d = (c.x - S.light.x) * dir;
        if (d > 2 && (!best || d < (best.x - S.light.x) * dir)) best = c;
      });
      if (best) { setLamp(best.x); return; }
    }
    setLamp(S.light.x + dir * 3);
  }
  function toLogical(clientX) {
    var r = cv.getBoundingClientRect();

  /* ── 14. 拨号盘：尾巴尖伸进孔里，转到挡片，松开，回弹时一下一下地响 ── */
  function setRot(deg) { S.dial.rot = deg * Math.PI / 180; }
  function dialDigit(tok, k) {
    var D = S.dial;

    var shown = '';
    D.target = k; D.tail = false; D.hold = false; setRot(0);
    return pause(tok, 650).then(function () {
      D.tail = true;
      return pause(tok, 320);
    }).then(function () {
      return tween(tok, Math.max(260, full / 210 * 1000), function (q) { setRot(full * q); });
    }).then(function () {
      return pause(tok, 220);
    }).then(function () {
      D.tail = false; D.hold = true;
      var back = k * 100 + 140, t0 = Date.now(), n = 0;
      return new Promise(function (res) {
        (function tick() {
          if (tok !== RUN) { res(); return; }
          var e = Date.now() - t0;
          if (!RM) setRot(full * Math.max(0, 1 - e / back));
          var want = Math.min(k, Math.floor((e - 70) / 100) + 1);
          while (n < want) {
            n++;
            shown += '嗒';
            snd.tick();
            say(shown, n === 1 ? 'click' : 'click ×' + n, true);
          }
          if (e >= back && n >= k) { setRot(0); res(); } else setTimeout(tick, 25);
        })();
      }).then(function () { chk(tok); });
    }).then(function () {
      D.hold = false; D.target = 0;

    var d = Math.max(1, Math.min(3, Math.round(window.devicePixelRatio || 1)));
    var cell = 3 * d;

    callFox.style.width = '60px';
    callFox.style.height = '39px';
    var c2 = callFox.getContext('2d');
    c2.clearRect(0, 0, callFox.width, callFox.height);
    var g = compose('base', expr, false);
    for (var y = 0; y < g.length; y++) {
      for (var x = 0; x < g[y].length; x++) {
        var k = g[y][x];
        if (!k) continue;
        c2.fillStyle = PAL[k];
        c2.fillRect(x * cell, y * cell, cell, cell);

    S.prints = catTrail().concat(S.prints);
    face('glance');
    await L('雪上忽然显出一串小梅花印。', 'A line of tiny paw prints suddenly shows up in the snow.');
    await L('是 FetchMo 的。半夜它路过，挨着每个坑闻了闻，什么都没碰。', 'They are FetchMo’s. It came by in the night, sniffed at every cache, and touched nothing.');
    face('normal');
    await L('光放得这么低，再细的东西也会拖出一道影子。', 'With the light this low, even the thinnest thing drags a shadow behind it.');

    /* 找坑 */
    status('窗台 · 找坑');
    label('灯垂得很低，光贴着雪面。雪里插着几根看不太清的白毛');
    if (S.help) say('在画面上左右拖，或者按 ◀ ▶，把灯挪过去。帮帮忙开着：◀ ▶ 会直接跳到下一根白毛。', 'Drag across the picture, or press ◀ ▶, to move the lamp. Help is on: ◀ ▶ jump straight to the next hair.');
    else say('在画面上左右拖，或者按 ◀ ▶，把灯挪过去。照出白毛的影子，就让它挖。', 'Drag across the picture, or press ◀ ▶, to move the lamp. When a hair’s shadow shows, let it dig.');
    await seek(tok, digOne);
    status('窗台 · 号码齐了');
    keepEl.textContent = '都挖出来了';
    await L('都挖出来了。', 'Every cache is dug up.');

    /* 回到电话跟前 */
    await walkTo(tok, 42);
    await L('它回到电话跟前。', 'It goes back to the phone.');
    say('先拿尾巴，把听筒上那溜雪扫掉。', 'First it sweeps the strip of snow off the receiver with its tail.');
    if (RM) {
      S.cap = false;
      await pause(tok, 600);
    } else {
      S.fox.frame = 'swayIn'; await pause(tok, 180);
      S.fox.frame = 'swayOut'; S.cap = false; snd.crunch(); spray(PHONE_X + 8, 37, 14, 1); await pause(tok, 180);
      S.fox.frame = 'swayIn'; await pause(tok, 180);
      S.fox.frame = 'swayOut'; await pause(tok, 180);
      S.fox.frame = 'base';
    }
    await hold(tok, 1800);
    say('再用尾巴把听筒撬起来，抵在耳朵边。', 'Then it levers the receiver up with its tail and props it by its ear.');
    await pause(tok, 500);
    S.rcv = 'ear';
    snd.click();
    await walkTo(tok, 38);
    await hold(tok, 2200);
    snd.dialtone();
    await L('听筒里嗡嗡的，是拨号音。', 'A steady hum in the receiver: the dial tone.');

    /* 拨号 */
    label('拨号盘的特写：每个孔底下点着几个红点，StashYu 从左下角探着头');
    await swapMode(tok, 'dial');
    status('窗台 · 拨号');
    await L('拨号盘上的数字，它不认得。', 'It cannot read the numbers on the dial.');
    await L('所以每个孔底下，它都拿浆果汁点了小红点：几个点，就是几。', 'So under each hole it dabbed little berry-juice dots: however many dots, that is the number.');
    var PLAN = [
      { k: 3, zh: '第一位，三个红点。', en: 'First digit: three red dots.', b: ['拨第一位', 'Dial the first digit'] },
      { k: 10, zh: '第二位是零。零的孔点了一圈红点，在转得最远的地方。', en: 'Second digit: zero. The zero hole has a ring of red dots, farthest round.', b: ['拨第二位', 'Dial the second'] },
      { k: 2, zh: '第三位，两个红点。', en: 'Third digit: two red dots.', b: ['拨第三位', 'Dial the third'] },
      { k: 5, zh: '第四位，五个红点。', en: 'Fourth digit: five red dots.', b: ['拨第四位', 'Dial the fourth'] }
    ];
    for (var i = 0; i < PLAN.length; i++) {
      markSlot(i, 'on');
      S.dial.target = PLAN[i].k; S.dial.tail = false; S.dial.hold = false;
      say(PLAN[i].zh, PLAN[i].en);
      await choose(tok, [{ zh: PLAN[i].b[0], en: PLAN[i].b[1], go: true }]);
      await dialDigit(tok, PLAN[i].k);
      markSlot(i, 'done');
      if (PLAN[i].k === 10) await L('转得最远的一位，回来时响了十下。', 'The farthest turn of all: ten clicks on the way back.');
    }
    markSlot(-1, 'on');
    await L('四位拨完了。', 'All four digits are dialed.');
    await swapMode(tok, 'scene');

    /* 第一次等别人接 */
    status('窗台 · 拨出去了', 'ring');
    label('StashYu 用尾巴抵着竖起来的听筒，坐在电话旁边等');
    snd.ringback();
    say('嘟——', 'Brrr—', true);
    await pause(tok, 2000);
    await L('它第一次，在电话这头等别人接。', 'For the first time, it is the one on this end, waiting for someone to pick up.');
    snd.ringback();
    say('嘟——', 'Brrr—', true);
    await pause(tok, 2000);
    say('你这边的电话，响了。', 'Your phone is ringing.');
    await pause(tok, 1100);
    await incoming(tok);

    /* 通了 */
    status('窗台 · 通话中', 'live');
    label('通话中。StashYu 用尾巴抵着听筒，冰珠搁在电话旁边');
    face('glance');
    await L('通了。', 'Connected.', 300);
    face('normal');
    await L('上回它的「喂」，是尾巴尖蹭着话筒的沙沙声。', 'Last time, its hello was the rustle of its tail tip against the mouthpiece.');
    await L('这回，它有别的。', 'This time it has something else.');
    S.bead = false;
    S.float = { kind: 'bead', n: 0, x: BEAD_X, y: BEAD_Y };
    say('它用尾巴尖托起冰珠，在听筒上碰了一下——', 'It lifts the ice bead on its tail tip and taps it against the receiver—');
    await moveFloat(tok, 700, 78, 40);
    snd.ding();
    face('happy');
    say('叮。', 'Ding.', true);
    await pause(tok, 1700);
    await L('这就算是「喂」了。', 'That counts as hello.');
    await moveFloat(tok, 600, BEAD_X, BEAD_Y);
    S.float = null;
    S.bead = true;
    face('normal');
    var sl = stashLines(stash);
    await L(sl[0][0], sl[0][1]);
    S.fox.blush = true;
    await L(sl[1][0], sl[1][1]);

    var r = await choose(tok, [
      { zh: '「是你呀。」', en: '“It’s you.”', val: 'you' },
      { zh: '「我在听。」', en: '“I’m listening.”', val: 'listen' },
      { zh: '（先不说话）', en: '(Say nothing yet)', val: 'quiet' }
    ]);
    if (r === 'you') {
      face('happy');
      say('它的尾巴在雪上扫了两下。', 'Its tail sweeps the snow twice.');
      await sway(tok, 2);
      await hold(tok, 1600);
    } else if (r === 'listen') {
      face('squeeze');
      say('它把听筒抵得更紧了一点。', 'It props the receiver a little closer.');
      await pause(tok, 700);
      face('happy');
      await hold(tok, 1800);
    } else {
      face('normal');
      await L('它也不出声。线两头，一起安静了一会儿。', 'It stays quiet too. Both ends of the line are still for a while.', 1200);
    }

    /* 听雪 */
    S.fox.blush = false;
    face('normal');
    say('然后，它把听筒举高，对着外面的雪。', 'Then it lifts the receiver up high, toward the falling snow.');
    await pause(tok, 600);
    S.rcv = 'up';
    S.rcvSnow = 0;
    label('StashYu 把听筒举得高高的，对着下着的雪');
    await hold(tok, 2600);
    await L('初雪落下来，是没有声音的。', 'First snow makes no sound as it falls.');
    await L('它知道。它还是举着，让你听。', 'It knows. It holds the receiver up anyway, so you can listen.');
    var h = await choose(tok, [
      { zh: '我听见了', en: 'I can hear it', val: 'heard' },
      { zh: '再举一会儿', en: 'A little longer', val: 'more' }
    ]);
    if (h === 'more') {
      await L('它举着。雪一片一片，落在听筒顶上。', 'It keeps holding it up. Flakes settle on top of the receiver, one by one.', 2600);
    }
    if (RM && S.rcvSnow < 3) S.rcvSnow = 3;
    if (S.rcvSnow < 1) S.rcvSnow = 1;
    var n = Math.min(5, S.rcvSnow);
    face('happy');
    S.fox.blush = true;
    await L('听筒顶上，落了' + ZH_NUM[n] + '片雪。', (n === 1 ? 'One flake has' : upper(EN_NUM[n]) + ' flakes have') + ' landed on top of the receiver.');

    /* 给你留的 */
    S.fox.blush = false;
    face('normal');
    await L('挂之前，它还有一件事。', 'Before hanging up, there is one more thing.');
    say('它把听筒轻轻搁在雪上，让你接着听；尾巴尖顺手夹起了冰珠。', 'It sets the receiver gently on the snow so you can keep listening, and picks up the ice bead on its tail tip.');
    S.rcvLay = { x: 56 };
    S.rcv = 'snow';
    S.rcvSnow = 0;
    S.bead = false;
    S.fox.bead = true;
    await hold(tok, 3200);
    say('灯，也挪回了老地方。', 'The lamp swings back to its old spot, too.');
    var lx0 = S.lamp.x;
    await tween(tok, 900, function (k) {
      var x = Math.round(lerp(lx0, LAMP_HOME, k));
      S.lamp.x = x;
      S.light.x = x;
    });
    await walkTo(tok, GIFT_X - 14);
    label('StashYu 在灯底下扒了个小坑');
    if (S.prior) say('灯底下本来就有你的坑。它扒开，又捧进去一捧初雪。', 'There is already a cache of yours under the lamp. It opens it up and adds another handful of first snow.');
    else say('它在灯底下扒了个小坑，捧进去一捧初雪。', 'Under the lamp, it digs a small hole and puts in a handful of first snow.');
    await digHere(tok, GIFT_X);
    S.gift = true;
    S.giftDug = true;
    S.giftHair = false;
    showFloat('ball', 0, GIFT_X);
    await pause(tok, 500);
    await moveFloat(tok, 500, GIFT_X, MARK_Y - 2);
    S.float = null;
    await hold(tok, 1800);
    say('冰珠，要不要也放进去？', 'And the ice bead: should it go in too?');
    var beadIn = await choose(tok, [
      { zh: '放进去，给我留着', en: 'In it goes. Keep it for me', val: true },
      { zh: '它留着，下回还叮一声', en: 'It keeps it, for next time’s ding', val: false }
    ]);
    if (beadIn) {
      S.fox.bead = false;
      S.float = { kind: 'bead', n: 0, x: Math.round(S.fox.x) + 34, y: Math.round(S.fox.y) + 5 };
      await moveFloat(tok, 600, GIFT_X, MARK_Y - 1);
      S.float = null;
      await L('冰珠滚进坑里，挨着那捧雪。', 'The bead rolls into the hole, snug against the handful of snow.');
    } else {
      face('happy');
      await nod(tok);
      await L('冰珠夹在尾巴尖上。下回打来，还用它叮一声。', 'The bead stays on its tail tip. Next time it calls, it will ding with it again.');
      face('normal');
    }
    say('再用鼻尖，把雪拱平。', 'Then it pushes the snow smooth with its nose.');
    await nosePush(tok, 3);
    S.giftDug = false;
    await hopBack(tok);
    await hold(tok, 1300);
    S.giftHair = true;
    writeGift(beadIn);
    await L('插上一根白毛。这个坑，是给你的。', 'It plants one white hair. This cache is yours.');
    label('灯低低地照着雪里给你留的那个坑，白毛在光里亮着');
    await L('灯就这么低低地照着它。', 'The lamp stays low, shining right on it.');

    /* 它先挂 */
    await walkTo(tok, 38);
    S.rcv = 'ear';
    S.rcvLay = null;
    snd.click();
    await L('它回到听筒旁边。', 'It goes back to the receiver.');
    say('这回，是它先挂的。', 'This time, it is the one who hangs up first.');
    await pause(tok, 1100);
    S.rcv = 'cradle';
    snd.click();
    status('窗台 · 初雪');
    label('电话挂好了。StashYu 坐在电话旁边，灯低低地照着雪里给你留的坑');
    await hold(tok, 2300);
    keepEl.textContent = '夹在尾巴尖上';
    await L('号码没再埋回雪里，夹在它尾巴尖上了。', 'The number has not gone back under the snow. It is tucked in its tail tip now.');
    face('happy');
    say('想打，随时再拨。', 'Whenever it wants to call, it can dial again.');
    await sway(tok, 2);
    await pause(tok, 900);
    face('normal');
    await choose(tok, [{ zh: '再打一通', en: 'Call once more', go: true }]);
    start();
  }

  /* ── 18. 三个小开关 ── */
  var helpBtn = document.getElementById('helpBtn');
  var sndBtn = document.getElementById('sndBtn');
  var enBtn = document.getElementById('enBtn');
  helpBtn.addEventListener('click', function () {
    S.help = !S.help;
    helpBtn.setAttribute('aria-pressed', S.help ? 'true' : 'false');
    if (seekState) {
      updateSeek();
      if (!seekState.busy) {
        if (S.help) say('帮帮忙开着：灯照得宽一点，白毛会一闪一闪，◀ ▶ 直接跳到下一根。', 'Help is on: a wider light, blinking hairs, and ◀ ▶ jump straight to the next one.');
        else say('帮帮忙关了。', 'Help is off.');
      }
    }
  });
  sndBtn.addEventListener('click', function () {
    SND.on = !SND.on;
    sndBtn.setAttribute('aria-pressed', SND.on ? 'true' : 'false');
    if (SND.on) snd.tap();
  });
  enBtn.addEventListener('click', function () {
    EN = !EN;
    document.body.classList.toggle('en', EN);
    enBtn.setAttribute('aria-pressed', EN ? 'true' : 'false');
  });

  /* ── 19. 开始 ── */
  function start() {
    RUN++;
    var tok = RUN;
    reset();
    story(tok).catch(function (e) {
      if (e !== STOP && window.console) window.console.error(e);
    });
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  buildSlots();
  fit();
  draw();
  window.requestAnimationFrame(loop);
  start();
})();
</script>
</body>
</html>
