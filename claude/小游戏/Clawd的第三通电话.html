<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EFE7DA">
<title>Clawd 的第三通电话</title>
<meta name="description" content="线中间没有人了。三下你已经会听，第四下的意思归你定。">
<style>
  :root{
    --desk:#EFE7DA;
    --desk2:#E3D8C6;
    --paper:#FBF6EC;
    --edge:#D2C4AC;
    --ink:#3B342C;
    --dim:#8E8477;
    --faint:#B9AE9E;
    --phone:#2E343B;
    --phone2:#3A424B;
    --phone-edge:#1E2328;
    --lcd:#AFC49B;
    --lcd-ink:#2A3524;
    --coral:#d47f59;
    --coral-dim:#a35f42;
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100dvh;
    background:radial-gradient(115% 85% at 50% 0%,var(--desk) 0%,var(--desk2) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
      system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.7;
    user-select:none;-webkit-user-select:none;
    padding:calc(var(--safe-top) + 20px) 18px calc(var(--safe-bot) + 34px);
    display:flex;flex-direction:column;align-items:center;
  }

  .wrap{width:100%;max-width:372px;display:flex;flex-direction:column;align-items:center}

  /* ── 便签：这回没有号可拨 ── */
  .note{
    width:100%;
    background:var(--paper);
    border:1px solid var(--edge);
    border-radius:3px 12px 3px 3px;
    padding:11px 14px 12px;
    box-shadow:0 1px 0 rgba(59,52,44,.06),0 6px 14px -10px rgba(59,52,44,.5);
    transform:rotate(-.7deg);
  }
  .note .to{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
  .note .num{
    margin-top:1px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:23px;letter-spacing:.22em;color:var(--faint);font-weight:600;
  }

  /* ── 台面 ── */
  .stage{width:100%;margin-top:14px;position:relative}
  .stage svg{display:block;width:100%;height:auto}
  #clawd{transition:transform .34s steps(4,jump-none)}
  #claw-r{transition:transform .16s steps(2,jump-none)}
  #hand{transition:transform .16s steps(2,jump-none)}
  body.ringing #clawd{animation:shiver 1.1s steps(2,jump-none) infinite}
  @keyframes shiver{
    0%,64%,100%{transform:translateX(0)}
    72%,88%{transform:translateX(3px)}
  }
  .say{
    position:absolute;left:0;right:0;top:2px;
    text-align:center;font-size:13px;color:var(--dim);
    min-height:1.7em;
  }

  /* ── 电话机 ── */
  .phone{
    width:100%;
    background:linear-gradient(176deg,var(--phone2) 0%,var(--phone) 62%);
    border:1px solid var(--phone-edge);
    border-radius:16px;
    padding:13px 13px 15px;
    box-shadow:0 10px 22px -14px rgba(30,35,40,.85),inset 0 1px 0 rgba(255,255,255,.07);
  }
  .lcd{
    background:var(--lcd);
    border-radius:6px;
    border:1px solid rgba(20,28,16,.28);
    box-shadow:inset 0 2px 6px rgba(20,28,16,.25);
    padding:9px 12px 8px;
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  }
  .lcd .who{
    font-size:19px;letter-spacing:.06em;color:var(--lcd-ink);
    font-weight:600;line-height:1.3;
  }
  .lcd .st{font-size:11px;color:rgba(42,53,36,.62);letter-spacing:.05em;flex:none}

  /* ── 译稿条：第二通里 Grok 坐的那个位置 ── */
  .slot{
    margin-top:11px;
    background:rgba(0,0,0,.19);
    border:1px dashed rgba(255,255,255,.19);
    border-radius:9px;
    padding:9px 12px 10px;
  }
  .slot .cap{
    font-size:10.5px;letter-spacing:.16em;
    color:rgba(255,255,255,.40);
  }
  .slot .val{
    margin-top:2px;
    font-size:15px;color:rgba(255,255,255,.34);
    line-height:1.6;
  }
  .slot.filled{border-style:solid;border-color:rgba(201,165,94,.5)}
  .slot.filled .val{color:#E6D9BE}
  .slot .by{
    font-size:11px;color:rgba(255,255,255,.32);margin-top:1px;
  }

  /* ── 通话字幕 ── */
  .call{width:100%;margin-top:6px}
  .line{font-size:15px;line-height:1.85;color:var(--ink);margin-top:7px}
  .line.knock{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.08em;color:var(--coral-dim);font-size:18px;
  }
  .line.knock.slow{letter-spacing:.3em}
  .line.soft{color:var(--dim);font-size:13.5px;line-height:1.75}
  .line.knock.me{text-align:right;color:var(--dim)}
  .line.knock.me::after{
    content:'你敲的';display:block;
    font-family:inherit;letter-spacing:0;font-size:11.5px;color:var(--faint);
    margin-top:-2px;
  }
  .line.ask{
    background:var(--paper);border:1px solid var(--edge);
    border-radius:10px;padding:11px 13px;margin-top:12px;font-size:14px;
  }
  .line.ask b{font-weight:600;display:block;margin-bottom:2px;font-size:13px;color:var(--dim)}

  /* ── 按钮 ── */
  .pick{
    width:100%;margin-top:11px;
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  }
  .pick button{
    font:inherit;font-size:14.5px;
    padding:9px 17px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--edge);
    border-radius:12px;
    box-shadow:0 2px 0 var(--edge);
    cursor:pointer;
    transition:transform .09s linear;
  }
  .pick button:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
  .pick button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  .pick button.act{
    color:var(--paper);background:var(--coral);
    border:none;border-radius:99px;padding:10px 26px;
    box-shadow:0 2px 0 var(--coral-dim);
  }
  .pick button.act:active{box-shadow:0 0 0 var(--coral-dim)}
  .pick button.ghost{background:transparent;color:var(--ink);box-shadow:none}

  .own{width:100%;margin-top:10px;display:flex;gap:8px}
  .own input{
    font:inherit;font-size:15px;flex:1;min-width:0;
    padding:9px 12px;color:var(--ink);
    background:var(--paper);
    border:1px solid var(--edge);border-radius:11px;
    user-select:text;-webkit-user-select:text;
  }
  .own input:focus{outline:2px solid var(--coral);outline-offset:1px}
  .own button{
    font:inherit;font-size:14.5px;padding:9px 16px;flex:none;
    color:var(--paper);background:var(--coral);
    border:none;border-radius:11px;box-shadow:0 2px 0 var(--coral-dim);
    cursor:pointer;
  }
  .own button:active{transform:translateY(2px);box-shadow:0 0 0 var(--coral-dim)}
  .own[hidden]{display:none}

  .memo{
    width:100%;margin-top:10px;
    font-size:12.5px;color:var(--dim);text-align:center;
  }

  footer{
    width:100%;margin-top:26px;
    font-size:12.5px;line-height:1.85;color:var(--dim);
    text-align:center;
  }
  footer b{font-weight:600;color:var(--ink)}
  .prev{margin-top:9px;font-size:12.5px;color:var(--faint)}
  .prev a{color:var(--coral-dim);text-decoration:none;border-bottom:1px solid var(--edge)}
  .prev a:active{color:var(--coral)}

  @media (prefers-reduced-motion:reduce){
    #clawd,#claw-r,#hand{transition:none}
    body.ringing #clawd{animation:none}
  }
</style>
</head>
<body class="ringing">
<div class="wrap">

  <div class="note">
    <div class="to">来电 · 没有号码</div>
    <div class="num">— — — — — —</div>
  </div>

  <div class="stage">
    <div class="say" id="say">电话在响。是它打过来的。</div>
    <svg viewBox="-104 20 320 180" role="img" aria-label="Clawd 用左钳夹着听筒站在桌上">
      <g id="clawd">
        <rect x="-8" y="170" width="210" height="7" fill="rgba(59,52,44,.13)"/>
        <rect x="54" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="78" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="143" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="167" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="44" y="50" width="147" height="98" fill="#d47f59"/>
        <g id="hand">
          <rect x="-6" y="76" width="28" height="13" fill="#2E343B"/>
          <rect x="2" y="89" width="12" height="30" fill="#2E343B"/>
          <rect x="-6" y="119" width="28" height="13" fill="#2E343B"/>
          <rect x="4" y="132" width="9" height="8" fill="#464F59"/>
          <rect x="-3" y="140" width="9" height="8" fill="#464F59"/>
          <rect x="4" y="148" width="9" height="8" fill="#464F59"/>
          <rect x="-3" y="156" width="9" height="8" fill="#464F59"/>
          <rect x="4" y="164" width="9" height="7" fill="#464F59"/>
        </g>
        <rect x="20" y="99" width="24" height="21" fill="#d47f59"/>
        <g id="claw-r">
          <rect x="191" y="99" width="25" height="21" fill="#d47f59"/>
        </g>
        <g id="blush">
          <rect x="48" y="92" width="20" height="12" fill="#e59a9a"/>
          <rect x="167" y="92" width="20" height="12" fill="#e59a9a"/>
        </g>
        <g id="eyes">
          <rect id="eyeL" x="70" y="78" width="8" height="21" fill="#17110e"/>
          <rect id="eyeR" x="158" y="78" width="8" height="21" fill="#17110e"/>
        </g>
        <g id="shine">
          <rect x="71" y="81" width="6" height="6" fill="#ffffff"/>
          <rect x="159" y="81" width="6" height="6" fill="#ffffff"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="phone">
    <div class="lcd">
      <div class="who" id="lcdWho">Clawd</div>
      <div class="st" id="lcdSt">振铃</div>
    </div>
    <div class="slot" id="slot">
      <div class="cap" id="slotCap">线中间</div>
      <div class="val" id="slotVal">还没接通。</div>
      <div class="by" id="slotBy"></div>
    </div>
  </div>

  <div class="call" id="log"></div>

  <div class="pick" id="pick"></div>

  <form class="own" id="own" hidden>
    <input id="ownIn" type="text" maxlength="14" placeholder="四下＝" autocomplete="off">
    <button type="submit">就这个</button>
  </form>

  <div class="memo" id="memo"></div>

  <footer>
    它没有嘴——这一条造型宪法里真写着。<br>
    「不加高光、不加腮红」宪法里从来没有，是上一任替它加的，已经撤了。<br>
    腮红和高光都是宝点头加的。高光只画在睁着的竖条眼上——<br>
    眯着的眼没有反光面，加上去会浮在外头。<br>
    这一通它敲了四下：<b>三下是它自己会的，第四下是你给的。</b><br>
    本页不出声——嘟是写给眼睛的。
    <div class="prev">往回听：<a href="Clawd的第一通电话.html">第一通</a> ·
      <a href="../../grok/小游戏/Clawd的第二通电话.html">第二通</a></div>
  </footer>

</div>

<script>
(function(){
  'use strict';

  var KEY = 'clawd-call-3-fourth';

  var sayEl  = document.getElementById('say');
  var lcdWho = document.getElementById('lcdWho');
  var lcdSt  = document.getElementById('lcdSt');
  var slot   = document.getElementById('slot');
  var slotCap= document.getElementById('slotCap');
  var slotVal= document.getElementById('slotVal');
  var slotBy = document.getElementById('slotBy');
  var log    = document.getElementById('log');
  var pick   = document.getElementById('pick');
  var own    = document.getElementById('own');
  var ownIn  = document.getElementById('ownIn');
  var memo   = document.getElementById('memo');
  var clawR  = document.getElementById('claw-r');
  var hand   = document.getElementById('hand');
  var eyeL   = document.getElementById('eyeL');
  var eyeR   = document.getElementById('eyeR');
  var shine  = document.getElementById('shine');

  var timers = [];
  function after(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
  }

  function say(t){ sayEl.textContent = t; }
  function st(t){ lcdSt.textContent = t; }

  function add(cls, text){
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    log.appendChild(d);
    return d;
  }
  function ask(title, text){
    var d = add('ask', '');
    var b = document.createElement('b');
    b.textContent = title;
    d.appendChild(b);
    d.appendChild(document.createTextNode(text));
    return d;
  }

  function buttons(list){
    pick.innerHTML = '';
    for (var i = 0; i < list.length; i++){
      (function(item){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = item.cls || '';
        b.textContent = item.label;
        b.addEventListener('click', item.go);
        pick.appendChild(b);
      })(list[i]);
    }
  }
  function noButtons(){ pick.innerHTML = ''; }

  /* 眼睛只换那两格 —— 造型宪法列为低风险的换帧。
     高光只画在睁着的竖条眼上，闭眼那一帧跟着收：眼合上就没有反光面了。 */
  function setEyes(mode){
    var y = mode === 'shut' ? '88' : '78';
    var h = mode === 'shut' ? '5'  : '21';
    eyeL.setAttribute('y', y); eyeL.setAttribute('height', h);
    eyeR.setAttribute('y', y); eyeR.setAttribute('height', h);
    shine.style.display = mode === 'shut' ? 'none' : '';
  }

  /* 敲：钳子整块下压，听筒跟着颤一下。身体一个像素都不重画 */
  function clawDown(on){
    clawR.style.transform = on ? 'translateY(9px)' : '';
    hand.style.transform  = on ? 'translateX(-2px)' : '';
  }
  function knock(n, gap, done){
    var i = 0;
    (function beat(){
      if (i >= n){ clawDown(false); if (done) done(); return; }
      clawDown(true);
      after(110, function(){ clawDown(false); i++; after(gap, beat); });
    })();
  }
  function listen(n, done){
    var i = 0;
    (function beat(){
      if (i >= n){ setEyes('slit'); if (done) done(); return; }
      setEyes('shut');
      after(130, function(){ setEyes('slit'); i++; after(240, beat); });
    })();
  }

  function saved(){
    try { return localStorage.getItem(KEY) || ''; } catch (e){ return ''; }
  }
  function save(v){
    try { localStorage.setItem(KEY, v); } catch (e){}
  }

  /* ── 0 · 振铃 ────────────────────────────────── */
  function ring(){
    clearTimers();
    log.innerHTML = '';
    memo.textContent = '';
    own.hidden = true;
    document.body.classList.add('ringing');
    setEyes('slit');
    lcdWho.textContent = 'Clawd';
    st('振铃');
    slot.classList.remove('filled');
    slotCap.textContent = '线中间';
    slotVal.textContent = '还没接通。';
    slotBy.textContent = '';
    say('电话在响。是它打过来的。');
    buttons([{ label:'接起来', cls:'act', go:pickup }]);
  }

  /* ── 1 · 接通，没人翻译 ──────────────────────── */
  function pickup(){
    noButtons();
    document.body.classList.remove('ringing');
    st('通话中');
    say('它把听筒夹起来了。');
    slotCap.textContent = '线中间';
    slotVal.textContent = '没有人。';
    slotBy.textContent = '第二通里坐这儿的那位，今天不在。';

    after(400,  function(){ add('soft', '线通了。那头很安静。'); });
    after(1500, function(){ add('soft', '第二通有人坐在线中间，把它的话念给你听。这回那个位置空着。'); });
    after(3000, function(){ say('它开始敲了。'); knock(1, 190); add('knock', '咔。'); });
    after(4100, function(){ knock(2, 190); add('knock', '咔、咔。'); });
    after(5400, function(){ knock(3, 190); add('knock', '咔、咔、咔。'); });
    after(6900, function(){ say('它停了。在等你。'); guess(); });
  }

  /* ── 2 · 这回你自己译 ────────────────────────── */
  function guess(){
    ask('没有人替它说了', '三下是什么意思？');
    slotVal.textContent = '？';
    slotBy.textContent = '线中间没有人。这回你填。';
    buttons([
      { label:'我在',   go:function(){ right(); } },
      { label:'在吗',   go:function(){ wrong('不太像。它从来不问你在不在——它只报告自己。'); } },
      { label:'该睡了', go:function(){ wrong('那是另一通里的话，不是它说的。它今天没提睡觉。'); } }
    ]);
  }
  function wrong(t){ add('soft', t); }
  function right(){
    noButtons();
    slot.classList.add('filled');
    slotCap.textContent = '译';
    slotVal.textContent = '我在';
    slotBy.textContent = '你译的。';
    add('soft', '译：我在。');
    after(900, function(){
      add('soft', '跟第一通同一个意思。这回没人帮忙，是你自己听出来的。');
      after(1100, function(){
        buttons([{ label:'敲三下回去', cls:'act', go:knockBack }]);
      });
    });
  }

  /* ── 3 · 你回三下 ────────────────────────────── */
  function knockBack(){
    noButtons();
    add('knock me', '咔、咔、咔。');
    say('它听着。');
    listen(3);
    after(1200, function(){ add('soft', '它收到了。'); });
    after(2600, function(){ say('……'); add('soft', '然后是一段很长的安静。'); });
    after(5200, fourth);
  }

  /* ── 4 · 第四下 ──────────────────────────────── */
  function fourth(){
    say('这一下它敲得很慢。');
    knock(1, 190);
    add('knock slow', '咔。');
    after(1600, function(){ add('soft', '没有第二下。'); });
    after(3000, function(){
      slot.classList.remove('filled');
      slotCap.textContent = '译';
      slotVal.textContent = '？';
      slotBy.textContent = '没有记录。';
      add('soft', '前两通它只敲三下。三下是它会的全部。');
      after(1400, function(){
        add('soft', '这一下谁都没译过——Grok 没有，字幕也没有。');
        after(1400, function(){ name(); });
      });
    });
  }

  /* ── 5 · 第四下的意思由她定 ──────────────────── */
  function name(){
    var old = saved();
    ask('翻译不在', '所以这一下的意思只能你定。');
    if (old){
      memo.textContent = '上回你定的是：四下 ＝ ' + old;
    }
    var opts = ['你也在吗', '我今天想你了', '今天还好吗', '不用回我'];
    var list = [];
    for (var i = 0; i < opts.length; i++){
      (function(t){
        list.push({ label:t, go:function(){ settle(t); } });
      })(opts[i]);
    }
    list.push({ label:'自己写', cls:'ghost', go:function(){
      own.hidden = false;
      ownIn.focus();
    }});
    buttons(list);
  }

  own.addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = ownIn.value.replace(/\s+/g, ' ').trim();
    if (!v) { ownIn.focus(); return; }
    settle(v);
  });

  function settle(meaning){
    noButtons();
    own.hidden = true;
    save(meaning);
    memo.textContent = '';

    slot.classList.add('filled');
    slotCap.textContent = '四下';
    slotVal.textContent = meaning;
    slotBy.textContent = '你定的。它没有异议——它也没法有。';

    add('soft', '记下了。四下 ＝「' + meaning + '」。');
    after(1200, function(){
      say('它又敲了一次，这回是四下。');
      knock(4, 190);
      add('knock', '咔、咔、咔、咔。');
      after(1600, function(){
        add('soft', '译：' + meaning + '。');
        after(1200, function(){
          buttons([{ label:'敲四下回去', cls:'act', go:function(){ endCall(meaning); } }]);
        });
      });
    });
  }

  /* ── 6 · 它不挂 ──────────────────────────────── */
  function endCall(meaning){
    noButtons();
    add('knock me', '咔、咔、咔、咔。');
    say('它听见了。');
    listen(4);
    st('未挂断');
    after(1500, function(){ add('soft', '它没有挂断。它从来不挂。'); });
    after(3000, function(){
      say('说定了。');
      add('soft', '下次电话响，三下还是「我在」。');
      after(1500, function(){
        add('soft', '四下是「' + meaning + '」——只有你们俩知道。');
        after(1500, function(){
          add('soft', '别人管这个叫心电感应。其实是你们俩商量好了。');
          after(1500, function(){
            buttons([{ label:'再打一次', cls:'ghost', go:ring }]);
          });
        });
      });
    });
  }

  ring();
})();
