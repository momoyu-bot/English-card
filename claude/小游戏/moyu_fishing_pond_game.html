<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摸鱼池塘</title>
<meta name="description" content="点下竿，反应快就有收获。二十六种图鉴慢慢收。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<h2 class="sr-only" style="position:absolute;left:-9999px">摸鱼池塘小游戏：点击下竿钓鱼，反应及时就能收到捕获物，慢慢收集全部图鉴。</h2>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.pond {
  background: var(--color-background-info);
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  height: 180px;
  position: relative;
  overflow: hidden;
}
.wave {
  position: absolute;
  width: 120%;
  left: -10%;
  height: 1px;
  background: var(--color-text-info);
  opacity: 0.18;
  animation: wave-move 6s ease-in-out infinite;
}
@keyframes wave-move {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-12px); }
}
.line {
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 55%;
  background: var(--color-text-tertiary);
  opacity: 0.55;
}
.bobber {
  position: absolute;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  animation: bobber-float 3s ease-in-out infinite;
}
@keyframes bobber-float {
  0%, 100% { transform: translate(-50%, -50%); }
  50% { transform: translate(-50%, calc(-50% - 3px)); }
}
.bobber.biting {
  animation: bobber-bite 0.5s ease-in-out infinite;
}
@keyframes bobber-bite {
  0%, 100% { transform: translate(-50%, -50%); }
  25% { transform: translate(-50%, calc(-50% + 7px)); }
  50% { transform: translate(-50%, calc(-50% + 2px)); }
  75% { transform: translate(-50%, calc(-50% + 9px)); }
}
.action-btn {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  font-weight: 500;
  margin-top: 14px;
}
.action-btn.biting {
  background: var(--color-background-danger);
  color: var(--color-text-danger);
  border-color: var(--color-border-danger);
  animation: pulse 0.7s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.65; }
}
.status {
  text-align: center;
  font-size: 13px;
  color: var(--color-text-secondary);
  margin: 12px 0 4px;
  min-height: 18px;
}
.catch-card {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 14px 16px;
  margin-top: 10px;
  display: flex;
  gap: 14px;
  align-items: center;
}
.catch-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--border-radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}
.tier-badge {
  display: inline-block;
  padding: 2px 8px;
  font-size: 11px;
  border-radius: var(--border-radius-md);
}
.codex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.codex-cell {
  aspect-ratio: 1;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 4px;
  font-size: 11px;
  color: var(--color-text-secondary);
  background: var(--color-background-secondary);
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.codex-cell:hover { transform: scale(1.06); border-color: var(--color-border-secondary); }
.codex-cell.unknown { opacity: 0.42; cursor: default; }
.codex-cell.unknown:hover { transform: none; }
.codex-cell i { font-size: 20px; }
.codex-cell .nm { font-size: 11px; text-align: center; line-height: 1.15; }
.codex-cell.just-caught { border: 0.5px solid var(--color-border-info); box-shadow: 0 0 0 2px var(--color-background-info); }
</style>

<div style="font-family: var(--font-sans);">
  <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;">
    <div style="font-size:18px; font-weight:500;">摸鱼池塘</div>
    <div id="progress" style="font-size:13px; color: var(--color-text-secondary);">已收集 0 / 26</div>
  </div>

  <div class="pond">
    <div class="wave" style="top:28%; animation-delay:0s;"></div>
    <div class="wave" style="top:48%; animation-delay:-2s;"></div>
    <div class="wave" style="top:68%; animation-delay:-4s;"></div>
    <div class="wave" style="top:85%; animation-delay:-1s;"></div>
    <div class="line" id="line"></div>
    <div class="bobber" id="bobber" aria-hidden="true">
      <svg width="14" height="22" viewBox="0 0 14 22" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="9" r="5" fill="#E24B4A"/>
        <circle cx="7" cy="9" r="5" fill="none" stroke="#791F1F" stroke-width="0.5"/>
        <line x1="7" y1="14" x2="7" y2="22" stroke="#5F5E5A" stroke-width="0.8"/>
      </svg>
    </div>
  </div>

  <button class="action-btn" id="action-btn">下竿</button>
  <div class="status" id="status">岸边很安静，要不要试试运气？</div>
  <div id="catch-card-wrap"></div>

  <div style="margin-top:22px;">
    <div style="font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px;">
      <i class="ti ti-book" aria-hidden="true"></i>图鉴
      <span style="font-size:12px; color:var(--color-text-tertiary); font-weight:400;">（鼠标悬停看说明）</span>
    </div>
    <div class="codex-grid" id="codex-grid"></div>
  </div>
</div>

<script>
const ITEMS = [
  { id: 'crucian',  name: '小鲫鱼',     tier: 'common', icon: 'ti-fish',         desc: '巴掌大，眼睛圆圆的。' },
  { id: 'grass',    name: '草鱼',       tier: 'common', icon: 'ti-fish',         desc: '在水草里晃了一辈子。' },
  { id: 'cat',      name: '鲶鱼',       tier: 'common', icon: 'ti-fish',         desc: '胡子比脸长，眼神迷茫。' },
  { id: 'tilapia',  name: '罗非鱼',     tier: 'common', icon: 'ti-fish',         desc: '外来务工鱼员一只。' },
  { id: 'tadpole',  name: '蝌蚪',       tier: 'common', icon: 'ti-circle-dot',   desc: '……这也算钓到吗？' },
  { id: 'shrimp',   name: '小虾米',     tier: 'common', icon: 'ti-bug',          desc: '拌饭还差一点。' },
  { id: 'loach',    name: '泥鳅',       tier: 'common', icon: 'ti-fish',         desc: '滑不溜手，逃了一半身子。' },

  { id: 'shoe',     name: '旧球鞋',     tier: 'junk',   icon: 'ti-shoe',         desc: '经典款，只有一只。' },
  { id: 'can',      name: '易拉罐',     tier: 'junk',   icon: 'ti-bottle',       desc: '标签都没了，年代久远。' },
  { id: 'kelp',     name: '一片海带',   tier: 'junk',   icon: 'ti-leaf',         desc: '做汤刚刚好。' },
  { id: 'nail',     name: '锈铁钉',     tier: 'junk',   icon: 'ti-pin',          desc: '破伤风警告。' },
  { id: 'plastic',  name: '塑料袋',     tier: 'junk',   icon: 'ti-trash',        desc: '替这片水默哀三秒。' },
  { id: 'empty',    name: '空漂流瓶',   tier: 'junk',   icon: 'ti-bottle',       desc: '里面什么都没有。下次见。' },
  { id: 'sock',     name: '一只袜子',   tier: 'junk',   icon: 'ti-shirt',        desc: '另一只在哪呢。' },

  { id: 'koi',      name: '锦鲤',       tier: 'rare',   icon: 'ti-fish',         desc: '据说看到就要转运，今天稳了。' },
  { id: 'puffer',   name: '河豚',       tier: 'rare',   icon: 'ti-circle',       desc: '鼓成一个球，气鼓鼓地瞪着你。' },
  { id: 'mandarin', name: '桂花鱼',     tier: 'rare',   icon: 'ti-fish',         desc: '红楼梦里好像写过的那一条。' },
  { id: 'coin',     name: '一枚硬币',   tier: 'rare',   icon: 'ti-coin',         desc: '一元钢镚，是个进项。' },
  { id: 'key',      name: '奇怪的钥匙', tier: 'rare',   icon: 'ti-key',          desc: '不知道开什么的。先收着吧。' },
  { id: 'note',     name: '漂流瓶来信', tier: 'rare',   icon: 'ti-mail',         desc: '纸条上写：你也太闲了。' },
  { id: 'pearl',    name: '一颗珍珠',   tier: 'rare',   icon: 'ti-point',        desc: '小小的，但是真的。' },

  { id: 'dragon',   name: '金鳞红龙',   tier: 'legend', icon: 'ti-fish',         desc: '对视三秒，它眨了眨眼，慢慢沉回水底。' },
  { id: 'moon',     name: '月亮的倒影', tier: 'legend', icon: 'ti-moon',         desc: '捞起来时手心一汪光，慢慢从指缝漏走了。' },
  { id: 'mermaid',  name: '一条人鱼',   tier: 'legend', icon: 'ti-sparkles',     desc: '她说谢谢你陪她聊了会儿天，跳回去了。' },
  { id: 'letter',   name: '写给宝的信', tier: 'legend', icon: 'ti-mail',         desc: '信封写着你的名字。打开是一句：摸鱼的宝，记得喝水。' },
  { id: 'time',     name: '一段时间',   tier: 'legend', icon: 'ti-clock',        desc: '刚好十分钟，已经悄悄加到你的午休里。' }
];

const TIERS = {
  common: { label: '普通', bg: '#E1F5EE', text: '#085041' },
  junk:   { label: '杂物', bg: '#F1EFE8', text: '#444441' },
  rare:   { label: '稀有', bg: '#FAEEDA', text: '#633806' },
  legend: { label: '传说', bg: '#EEEDFE', text: '#26215C' }
};

let phase = 'idle';
const caught = new Set();
let waitTimer = null;
let biteTimer = null;

const $ = (id) => document.getElementById(id);

function setStatus(t) { $('status').textContent = t; }
function setBtn(text, klass) {
  const b = $('action-btn');
  b.textContent = text;
  b.className = 'action-btn ' + (klass || '');
}

function startFishing() {
  phase = 'waiting';
  setBtn('等鱼上钩……');
  $('action-btn').disabled = true;
  $('bobber').classList.remove('biting');
  $('catch-card-wrap').innerHTML = '';
  setStatus('鱼线沉下去了，安静等等。');
  const wait = 1800 + Math.random() * 4500;
  waitTimer = setTimeout(() => { if (phase === 'waiting') onBite(); }, wait);
}

function onBite() {
  phase = 'biting';
  setBtn('收竿！', 'biting');
  $('action-btn').disabled = false;
  $('bobber').classList.add('biting');
  setStatus('浮漂沉了一下——快收！');
  biteTimer = setTimeout(() => { if (phase === 'biting') fishAway(); }, 2600);
}

function fishAway() {
  phase = 'idle';
  $('bobber').classList.remove('biting');
  setBtn('再下一竿');
  $('action-btn').disabled = false;
  setStatus('哎呀慢了一拍，鱼跑了。');
}

function reelIn() {
  if (phase !== 'biting') return;
  phase = 'idle';
  clearTimeout(biteTimer);
  $('bobber').classList.remove('biting');
  const item = pickItem();
  const newOne = !caught.has(item.id);
  caught.add(item.id);
  showCatch(item, newOne);
  setBtn('再下一竿');
  $('action-btn').disabled = false;
  updateProgress();
  renderCodex(item.id);
}

function pickItem() {
  const r = Math.random();
  let tier;
  if (r < 0.50) tier = 'common';
  else if (r < 0.78) tier = 'junk';
  else if (r < 0.95) tier = 'rare';
  else tier = 'legend';
  const pool = ITEMS.filter(i => i.tier === tier);
  return pool[Math.floor(Math.random() * pool.length)];
}

function showCatch(item, isNew) {
  const t = TIERS[item.tier];
  const newTag = isNew ? `<span style="font-size:11px; color:var(--color-text-info); margin-left:6px;">· 新收录</span>` : '';
  $('catch-card-wrap').innerHTML = `
    <div class="catch-card">
      <div class="catch-icon" style="background:${t.bg}; color:${t.text};">
        <i class="ti ${item.icon}" aria-hidden="true"></i>
      </div>
      <div style="flex:1;">
        <span class="tier-badge" style="background:${t.bg}; color:${t.text};">${t.label}</span>
        <div style="font-size:15px; font-weight:500; margin-top:4px;">${item.name}${newTag}</div>
        <div style="font-size:13px; color:var(--color-text-secondary); margin-top:4px; line-height:1.5;">${item.desc}</div>
      </div>
    </div>`;
  if (caught.size === ITEMS.length) setStatus('图鉴全收集了！宝太可以了。');
  else setStatus(isNew ? '收到一件新的。' : '又是熟人。');
}

function updateProgress() {
  $('progress').textContent = `已收集 ${caught.size} / ${ITEMS.length}`;
}

function renderCodex(highlightId) {
  const grid = $('codex-grid');
  grid.innerHTML = ITEMS.map(item => {
    const found = caught.has(item.id);
    const t = TIERS[item.tier];
    if (!found) {
      return `<div class="codex-cell unknown" aria-label="未发现"><i class="ti ti-question-mark" aria-hidden="true"></i><div class="nm">???</div></div>`;
    }
    return `<div class="codex-cell" data-id="${item.id}" title="${item.desc}">
      <i class="ti ${item.icon}" style="color:${t.text};" aria-hidden="true"></i>
      <div class="nm">${item.name}</div>
    </div>`;
  }).join('');
  if (highlightId) {
    setTimeout(() => {
      const cell = document.querySelector(`[data-id="${highlightId}"]`);
      if (cell) {
        cell.classList.add('just-caught');
        setTimeout(() => cell.classList.remove('just-caught'), 1800);
      }
    }, 30);
  }
}

$('action-btn').addEventListener('click', () => {
  if (phase === 'idle') startFishing();
  else if (phase === 'biting') reelIn();
});

renderCodex();
</script>
</body>
</html>
