<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0">哈密顿回路贪吃蛇演示:蛇沿一条经过全部36格的固定环线移动,头尾之间的安全余量随蛇变长而缩短,归零即填满通关</h2>

<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 1rem">
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 16px;min-width:96px">
    <div style="font-size:13px;color:var(--text-muted)">蛇长</div>
    <div style="font-size:22px;font-weight:500"><span id="len">3</span> / 36</div>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 16px;min-width:150px">
    <div style="font-size:13px;color:var(--text-muted)">安全余量(头到尾的空跑道)</div>
    <div style="font-size:22px;font-weight:500;color:#1D9E75"><span id="free">33</span> 格</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <button id="pp" aria-label="暂停"><i class="ti ti-player-pause" aria-hidden="true"></i></button>
    <button id="s1">慢</button>
    <button id="s2" aria-pressed="true" style="background:var(--surface-1)">中</button>
    <button id="s3">快</button>
    <button id="rst" aria-label="重置"><i class="ti ti-refresh" aria-hidden="true"></i></button>
  </div>
</div>

<svg id="board" viewBox="0 0 456 456" style="width:100%;max-width:456px;display:block;margin:0 auto" role="img" aria-label="6乘6贪吃蛇棋盘,蛇沿固定环线移动">
  <g id="cells"></g>
  <polyline id="track" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="3 7" opacity="0.55"/>
  <polyline id="buffer" fill="none" stroke="#1D9E75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <g id="snake"></g>
  <circle id="food" r="11" fill="#D85A30"/>
</svg>

<div id="winmsg" style="display:none;text-align:center;margin:0.75rem 0 0;font-size:14px;color:#1D9E75;font-weight:500">36 / 36 填满 — 头贴上尾的这一刻,恰好就是通关</div>

<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:1rem 0 0;font-size:13px;color:var(--text-secondary)">
  <span>灰虚线 = 固定跑道(哈密顿回路)</span>
  <span style="color:#1D9E75">绿线 = 安全余量</span>
  <span style="color:#D85A30">圆点 = 食物</span>
</div>

<script>
(function(){
var N=6,TOT=36,S=76,OFF=38;
var path=[];
for(var c=0;c<N;c++)path.push([0,c]);
for(var r=1;r<N;r++){if(r%2===1){for(var c2=N-1;c2>=1;c2--)path.push([r,c2]);}else{for(var c3=1;c3<N;c3++)path.push([r,c3]);}}
for(var r2=N-1;r2>=1;r2--)path.push([r2,0]);
function cx(i){return path[i][1]*S+OFF;}
function cy(i){return path[i][0]*S+OFF;}
var cellsHtml='';
for(var rr=0;rr<N;rr++)for(var cc=0;cc<N;cc++)cellsHtml+='<rect x="'+(cc*S+7)+'" y="'+(rr*S+7)+'" width="'+(S-14)+'" height="'+(S-14)+'" rx="12" fill="var(--surface-1)"/>';
document.getElementById('cells').innerHTML=cellsHtml;
var pts='';
for(var i=0;i<TOT;i++)pts+=cx(i)+','+cy(i)+' ';
pts+=cx(0)+','+cy(0);
document.getElementById('track').setAttribute('points',pts);
var head,len,food,timer=null,delay=170,playing=true;
function occupied(i){for(var k=0;k<len;k++){if((head-k+TOT)%TOT===i)return true;}return false;}
function placeFood(){var i;do{i=Math.floor(Math.random()*TOT);}while(occupied(i));food=i;}
function reset(){head=7;len=3;placeFood();document.getElementById('winmsg').style.display='none';render();}
function win(){playing=false;if(timer){clearInterval(timer);timer=null;}document.getElementById('winmsg').style.display='block';document.querySelector('#pp i').className='ti ti-player-play';}
function tick(){head=(head+1)%TOT;if(head===food){len++;if(len>=TOT){render();win();return;}placeFood();}render();}
function render(){
  document.getElementById('len').textContent=len;
  document.getElementById('free').textContent=TOT-len;
  var free=TOT-len,bp='';
  if(free>0){bp=cx(head)+','+cy(head)+' ';for(var k=1;k<=free;k++){var bi=(head+k)%TOT;bp+=cx(bi)+','+cy(bi)+' ';}var tail=(head-len+1+TOT)%TOT;bp+=cx(tail)+','+cy(tail);}
  document.getElementById('buffer').setAttribute('points',bp);
  var sh='';
  for(var k2=len-1;k2>=1;k2--){var si=(head-k2+TOT)%TOT;var col=k2>len*0.66?'#AFA9EC':'#7F77DD';sh+='<rect x="'+(cx(si)-26)+'" y="'+(cy(si)-26)+'" width="52" height="52" rx="14" fill="'+col+'"/>';}
  sh+='<rect x="'+(cx(head)-29)+'" y="'+(cy(head)-29)+'" width="58" height="58" rx="16" fill="#534AB7"/>';
  sh+='<circle cx="'+(cx(head)-9)+'" cy="'+(cy(head)-6)+'" r="6" fill="#FFFFFF"/><circle cx="'+(cx(head)+9)+'" cy="'+(cy(head)-6)+'" r="6" fill="#FFFFFF"/>';
  sh+='<circle cx="'+(cx(head)-9)+'" cy="'+(cy(head)-5)+'" r="3" fill="#26215C"/><circle cx="'+(cx(head)+9)+'" cy="'+(cy(head)-5)+'" r="3" fill="#26215C"/>';
  document.getElementById('snake').innerHTML=sh;
  var f=document.getElementById('food');
  if(len>=TOT){f.setAttribute('r','0');}else{f.setAttribute('cx',cx(food));f.setAttribute('cy',cy(food));f.setAttribute('r','11');}
}
function start(){if(timer)clearInterval(timer);timer=setInterval(tick,delay);playing=true;document.querySelector('#pp i').className='ti ti-player-pause';}
document.getElementById('pp').onclick=function(){if(playing){if(timer){clearInterval(timer);timer=null;}playing=false;this.querySelector('i').className='ti ti-player-play';this.setAttribute('aria-label','播放');}else{if(len>=TOT)reset();start();this.setAttribute('aria-label','暂停');}};
function setSpeed(d,btn){delay=d;['s1','s2','s3'].forEach(function(id){var b=document.getElementById(id);b.removeAttribute('aria-pressed');b.style.background='';});btn.setAttribute('aria-pressed','true');btn.style.background='var(--surface-1)';if(playing)start();}
document.getElementById('s1').onclick=function(){setSpeed(320,this);};
document.getElementById('s2').onclick=function(){setSpeed(170,this);};
document.getElementById('s3').onclick=function(){setSpeed(55,this);};
document.getElementById('rst').onclick=function(){reset();if(!playing)start();};
reset();start();
})();
</script>
