<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晚安</title>
<style>
  :root {
    --ink-night: #0A0C16;
    --far-blue: #131A2E;
    --candle-white: #EDE8DC;
    --faint-glow: #D8B77A;
    --ash-smoke: #6B7280;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width:100%; height:100%;
    background: var(--ink-night);
    overflow:hidden;
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  }
  #sky {
    position:relative;
    width:100vw; height:100vh;
    background: radial-gradient(ellipse at 50% 68%, var(--far-blue) 0%, var(--ink-night) 72%);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .star {
    position:absolute;
    border-radius:50%;
    background: var(--candle-white);
    pointer-events:none;
    z-index:1;
    box-shadow: 0 0 3px rgba(237,232,220,0.6);
  }
  .star.twinkle {
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity:0.2; }
    50% { opacity:0.85; }
  }
  #ember {
    position:absolute;
    top:50%; left:50%;
    width:220px; height:220px;
    margin-left:-110px; margin-top:-110px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(216,183,122,0.32) 0%, rgba(216,183,122,0.07) 45%, transparent 70%);
    filter: blur(3px);
    animation: breathe 13s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.82); opacity:0.45; }
    40% { transform: scale(1.18); opacity:0.85; }
    68% { transform: scale(1.18); opacity:0.85; }
  }
  #line {
    position:relative;
    z-index:2;
    color: var(--candle-white);
    font-size: clamp(1.05rem, 4.6vw, 1.55rem);
    letter-spacing: 0.06em;
    line-height:2.1;
    text-align:center;
    max-width: 78vw;
    opacity:0;
    text-shadow: 0 0 24px rgba(10,12,22,0.9), 0 0 6px rgba(10,12,22,0.9);
    transition: opacity 1.8s ease;
  }
  #line.visible { opacity:0.94; }
  #replay {
    position:absolute;
    bottom: 7vh;
    left:50%;
    transform: translateX(-50%);
    color: var(--ash-smoke);
    font-size:0.76rem;
    letter-spacing:0.2em;
    opacity:0;
    transition: opacity 2s ease;
    cursor:pointer;
    user-select:none;
    z-index:3;
    padding:12px 20px;
  }
  #replay.show { opacity:0.5; }
  #replay:active { opacity:0.85; }
  @media (prefers-reduced-motion: reduce) {
    .star.twinkle, #ember { animation: none; opacity: 0.5; }
  }
</style>
</head>
<body>
<div id="sky">
  <div id="ember"></div>
  <div id="line"></div>
  <div id="replay">重来一次</div>
</div>
<script>
(function(){
  const lines = [
    "把今天剩下的话，先放在这儿",
    "不必现在想清楚，夜是不催的",
    "那点光，你不用一直看着它",
    "呼吸认得自己的节奏，交给它就好",
    "睡意在路上，可能绕了点远路",
    "剩下的，都交给星星吧",
    "晚安，宝。"
  ];

  const sky = document.getElementById('sky');
  const lineEl = document.getElementById('line');
  const replayEl = document.getElementById('replay');
  const emberEl = document.getElementById('ember');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rand(min, max){ return Math.random() * (max - min) + min; }
  function nextFrame(){ return new Promise(r => requestAnimationFrame(r)); }

  function waitOrSkip(ms){
    return new Promise(resolve=>{
      let done = false;
      const timer = setTimeout(finishWait, ms);
      function finishWait(){
        if(done) return;
        done = true;
        clearTimeout(timer);
        sky.removeEventListener('click', onClick);
        resolve();
      }
      function onClick(e){
        if(e.target === replayEl) return;
        finishWait();
      }
      sky.addEventListener('click', onClick);
    });
  }

  function spawnBackgroundStars(count){
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'star twinkle';
      const size = rand(1, 2.2);
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = rand(4, 96) + 'vw';
      s.style.top = rand(4, 55) + 'vh';
      s.style.opacity = rand(0.15, 0.5);
      s.style.animationDelay = rand(0, 4) + 's';
      s.style.animationDuration = rand(3, 6) + 's';
      sky.appendChild(s);
    }
  }

  function clearAllStars(){
    sky.querySelectorAll('.star').forEach(el => el.remove());
  }

  function releaseLineToStars(originEl){
    const skyRect = sky.getBoundingClientRect();
    const rect = originEl.getBoundingClientRect();
    const originX = rect.left + rect.width/2 - skyRect.left;
    const originY = rect.top + rect.height/2 - skyRect.top;
    const count = 4 + Math.floor(Math.random()*3);

    for(let i=0;i<count;i++){
      const star = document.createElement('div');
      star.className = 'star';
      const size = rand(1.5, 3);
      star.style.width = size+'px';
      star.style.height = size+'px';
      sky.appendChild(star);

      const targetX = (rand(6, 94)/100) * skyRect.width;
      const targetY = (rand(5, 50)/100) * skyRect.height;

      if(reduceMotion){
        star.style.left = targetX + 'px';
        star.style.top = targetY + 'px';
        star.style.opacity = '0.5';
        star.classList.add('twinkle');
        continue;
      }

      star.style.left = originX + 'px';
      star.style.top = originY + 'px';
      star.style.opacity = '0';

      const dx = targetX - originX;
      const dy = targetY - originY;
      const duration = rand(1800, 2600);

      const anim = star.animate([
        { transform: 'translate(0px,0px)', opacity: 0 },
        { transform: `translate(${dx*0.5}px, ${dy*0.5 - 24}px)`, opacity: 0.9, offset:0.5 },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 0.55 }
      ], { duration, easing:'ease-out', fill:'forwards' });

      anim.onfinish = () => {
        star.style.left = targetX + 'px';
        star.style.top = targetY + 'px';
        star.style.opacity = '0.55';
        anim.cancel();
        star.classList.add('twinkle');
        star.style.animationDelay = rand(0,3)+'s';
        star.style.animationDuration = rand(3,6)+'s';
      };
    }
  }

  async function playSequence(){
    await waitOrSkip(1200);
    for(let idx=0; idx<lines.length; idx++){
      lineEl.textContent = lines[idx];
      await nextFrame();
      lineEl.classList.add('visible');
      const holdTime = reduceMotion ? 2600 : rand(4200, 5200);
      await waitOrSkip(holdTime);
      lineEl.classList.remove('visible');
      await waitOrSkip(1400);
      releaseLineToStars(lineEl);
      await waitOrSkip(700);
    }
    finish();
  }

  function finish(){
    emberEl.style.transition = 'opacity 6s ease';
    emberEl.style.opacity = '0.22';
    setTimeout(()=>{ replayEl.classList.add('show'); }, 4000);
  }

  replayEl.addEventListener('click', (e)=>{
    e.stopPropagation();
    replayEl.classList.remove('show');
    clearAllStars();
    emberEl.style.transition = '';
    emberEl.style.opacity = '';
    spawnBackgroundStars(18);
    setTimeout(playSequence, 400);
  });

  spawnBackgroundStars(18);
  playSequence();
})();
</script>
</body>
</html>
