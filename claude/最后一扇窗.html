<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>最后一扇窗</title>
<style>
  :root{
    --ink:      #070a10;
    --slab:     #121824;
    --slab-far: #0c1119;
    --dim:      #171d29;
    --lit:      #f0c674;
    --cool:     #8fb3c9;
    --yours:    #ffd89b;
    --text:     #6f7d92;
    --faint:    #3f4a5c;

    --serif: "Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
    --sans: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono: ui-monospace,"SF Mono",Menlo,"Cascadia Mono","Roboto Mono",monospace;

    --slow: 2400ms;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:0 0 env(safe-area-inset-bottom);
    transition:opacity 20s linear;
  }
  body.drowsy{ opacity:.05; }

  /* ── 絮语 ───────────────────────────── */
  .whisper{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 9vw;
    min-height:0;
  }
  .whisper p{
    font-family:var(--serif);
    font-size:clamp(15px,4.2vw,19px);
    line-height:2.15;
    color:var(--text);
    text-align:center;
    letter-spacing:.04em;
    opacity:0;
    transition:opacity 3s ease;
    max-width:24em;
  }
  .whisper p.show{ opacity:.82; }

  /* ── 城市 ───────────────────────────── */
  .city{
    position:relative;
    width:100%;
    flex:0 0 auto;
    height:clamp(180px,34vh,300px);
  }
  .row{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:clamp(3px,1vw,7px);
    padding:0 2vw;
    height:100%;
  }
  .row.far{ bottom:8px; opacity:.55; z-index:1; }
  .row.near{ z-index:2; }

  .bldg{
    display:grid;
    align-content:end;
    background:var(--slab);
    border-radius:1px 1px 0 0;
    padding:clamp(3px,.9vw,6px);
    gap:clamp(2px,.7vw,4px);
  }
  .row.far .bldg{ background:var(--slab-far); }

  .w{
    background:var(--dim);
    aspect-ratio:1/1.15;
    border-radius:.5px;
    transition:background-color var(--slow) ease, box-shadow var(--slow) ease;
  }
  .w.on{
    background:var(--lit);
    box-shadow:0 0 5px rgba(240,198,116,.30);
  }
  .w.on.cool{
    background:var(--cool);
    box-shadow:0 0 5px rgba(143,179,201,.26);
  }
  .w.mine{
    background:var(--yours);
    box-shadow:0 0 11px rgba(255,216,155,.55);
    cursor:pointer;
  }
  .w.mine.off{
    background:var(--dim);
    box-shadow:none;
  }

  .ground{
    height:1px;
    background:linear-gradient(90deg,transparent,#1c2431 22%,#1c2431 78%,transparent);
    flex:0 0 auto;
  }

  /* ── 熄灯记录 ───────────────────────── */
  .log{
    flex:0 0 auto;
    height:5.6em;
    padding:20px 7vw 0;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:.45em;
    overflow:hidden;
  }
  .log .line{
    font-family:var(--sans);
    font-size:clamp(11.5px,3.1vw,13px);
    line-height:1.5;
    color:var(--text);
    letter-spacing:.03em;
    opacity:0;
    transition:opacity 1.6s ease;
  }
  .log .line.show{ opacity:.9; }
  .log .line.fade{ opacity:.42; }
  .log .line.fader{ opacity:.18; }
  .log .t{
    font-family:var(--mono);
    font-size:.92em;
    color:var(--faint);
    margin-right:.7em;
    letter-spacing:0;
  }

  /* ── 按钮 ───────────────────────────── */
  .act{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    padding:22px 0 34px;
  }
  button{
    font-family:var(--sans);
    font-size:13px;
    letter-spacing:.16em;
    color:#a08a63;
    background:transparent;
    border:1px solid #23293a;
    border-radius:2px;
    padding:12px 26px;
    cursor:pointer;
    transition:color 900ms ease, border-color 900ms ease;
  }
  button:hover,button:focus-visible{
    color:var(--yours);
    border-color:#39405a;
  }
  button:focus-visible{ outline:1px solid var(--yours); outline-offset:3px; }

  /* ── 终局 ───────────────────────────── */
  .ending{
    position:fixed;
    inset:0;
    background:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.6em;
    opacity:0;
    pointer-events:none;
    transition:opacity 3.4s ease;
    padding:0 10vw;
    text-align:center;
  }
  .ending.show{ opacity:1; pointer-events:auto; }
  .ending h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(22px,6.6vw,30px);
    letter-spacing:.24em;
    color:var(--yours);
    opacity:.9;
  }
  .ending .note{
    font-family:var(--sans);
    font-size:clamp(11.5px,3.1vw,13px);
    line-height:2;
    color:var(--faint);
    letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    :root{ --slow:400ms; }
    body,.whisper p,.log .line,.ending{ transition-duration:600ms; }
  }
</style>
</head>
<body>

  <div class="whisper"><p id="whisper"></p></div>

  <div class="city">
    <div class="row far" id="far"></div>
    <div class="row near" id="near"></div>
  </div>
  <div class="ground"></div>

  <div class="log" id="log"></div>

  <div class="act">
    <button id="btn">熄掉这扇窗</button>
  </div>

  <div class="ending" id="ending">
    <h1>晚安，宝</h1>
    <div class="note">全城关完了。<br>这一页也睡了——不关它也不会吃电。</div>
  </div>

<script>
(function(){
  "use strict";

  var timers = [];
  var ended = false;

  function later(fn, ms){ var id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearAll(){ timers.forEach(clearTimeout); timers = []; }
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function pick(n){ return Math.floor(Math.random()*n); }

  /* ── 造楼 ───────────────────────────── */
  var NEAR = [[4,8],[3,6],[5,9],[3,7],[4,6]];
  var FAR  = [[2,4],[3,5],[2,3],[3,6],[2,5],[3,4],[2,4],[3,5]];

  function build(host, specs, width, litRate, far){
    specs.forEach(function(s){
      var cols = s[0], rows = s[1];
      var b = document.createElement('div');
      b.className = 'bldg';
      b.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
      b.style.width = (cols * width) + 'px';
      for(var i=0;i<cols*rows;i++){
        var w = document.createElement('div');
        w.className = 'w';
        if(Math.random() < litRate){
          w.className += ' on';
          if(!far && Math.random() < 0.16) w.className += ' cool';
        }
        b.appendChild(w);
      }
      host.appendChild(b);
    });
  }

  var unit = Math.min(13, Math.max(8, window.innerWidth / 34));
  build(document.getElementById('far'),  FAR,  unit*0.62, 0.14, true);
  build(document.getElementById('near'), NEAR, unit,      0.30, false);

  /* 你的那扇窗：near 排中间偏右那栋楼，靠上 */
  var nearBldgs = document.querySelectorAll('.row.near .bldg');
  var host = nearBldgs[2] || nearBldgs[0];
  var mine = host.children[1] || host.children[0];
  mine.className = 'w on mine';
  mine.setAttribute('role','button');
  mine.setAttribute('tabindex','0');
  mine.setAttribute('aria-label','熄掉这扇窗');

  /* ── 絮语 ───────────────────────────── */
  var WHISPERS = [
    "城市在一间一间关灯。",
    "不用跟着关。它们只是先睡了而已。",
    "你是最后一扇还亮着的——\n这不是拖延，是今天剩给你的那一段。"
  ];
  var wEl = document.getElementById('whisper');
  var wi = 0;

  function showWhisper(){
    if(ended) return;
    wEl.textContent = WHISPERS[wi].replace(/\n/g, '\u00A0');
    wEl.innerHTML = WHISPERS[wi].split('\n').join('<br>');
    wEl.classList.add('show');
    wi++;
    if(wi < WHISPERS.length){
      later(function(){
        wEl.classList.remove('show');
        later(showWhisper, 3200);
      }, 20000);
    }
  }
  later(showWhisper, 1400);

  /* ── 熄灯记录 ───────────────────────── */
  var ENTRIES = [
    "12 楼　有人终于把碗洗完了",
    "6 楼　电视关了，声音比画面先没",
    "9 楼　猫从窗台跳下去，落地没有声音",
    "4 楼　小店打烊，猫猫和兔兔挤同一张椅子",
    "15 楼　有人把手机扣在了枕头边",
    "2 楼　楼道的声控灯没人吵它，自己灭了",
    "11 楼　台灯先暗一档，再灭",
    "8 楼　有人翻了个身，没醒",
    "3 楼　洗衣机停了，明天再收",
    "7 楼　小狐狸把尾巴叠了三折，当枕头",
    "全楼　只剩一扇还亮着"
  ];

  var logEl = document.getElementById('log');
  var ei = 0;

  function stamp(){
    var d = new Date();
    return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  }

  function addLine(text){
    var kids = logEl.children;
    for(var i=0;i<kids.length;i++){
      kids[i].classList.remove('show');
      kids[i].classList.add(kids[i].classList.contains('fade') ? 'fader' : 'fade');
    }
    while(logEl.children.length >= 3) logEl.removeChild(logEl.firstChild);

    var line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = '<span class="t">' + stamp() + '</span>' + text;
    logEl.appendChild(line);
    requestAnimationFrame(function(){ line.classList.add('show'); });
  }

  function litWindows(){
    return Array.prototype.filter.call(
      document.querySelectorAll('.w.on'),
      function(w){ return !w.classList.contains('mine'); }
    );
  }

  function darken(n){
    var pool = litWindows();
    for(var i=0;i<n && pool.length;i++){
      var idx = pick(pool.length);
      pool[idx].classList.remove('on','cool');
      pool.splice(idx,1);
    }
  }

  function step(){
    if(ended) return;
    if(ei >= ENTRIES.length){ return; }

    var last = (ei === ENTRIES.length - 1);
    if(last){
      darken(litWindows().length);
    } else {
      darken(2 + pick(2));
    }
    addLine(ENTRIES[ei]);
    ei++;

    if(ei < ENTRIES.length) later(step, rnd(6200, 9400));
  }
  later(step, 3000);

  /* ── 终局 ───────────────────────────── */
  var endEl = document.getElementById('ending');

  function finish(){
    if(ended) return;
    ended = true;
    clearAll();
    wEl.classList.remove('show');
    mine.classList.add('off');
    mine.removeAttribute('role');
    mine.setAttribute('tabindex','-1');
    setTimeout(function(){
      darken(litWindows().length);
      endEl.classList.add('show');
    }, 1100);
  }

  document.getElementById('btn').addEventListener('click', finish);
  mine.addEventListener('click', finish);
  mine.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); finish(); }
  });

  /* ── 让这一页先睡着 ─────────────────── */
  var drowsyTimer = null;
  function resetDrowsy(){
    document.body.classList.remove('drowsy');
    clearTimeout(drowsyTimer);
    drowsyTimer = setTimeout(function(){
      document.body.classList.add('drowsy');
    }, 240000);
  }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    window.addEventListener(ev, resetDrowsy, {passive:true});
  });
  resetDrowsy();

  /* ── 切到后台就全停 ─────────────────── */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      clearAll();
      clearTimeout(drowsyTimer);
    } else if(!ended){
      if(ei < ENTRIES.length) later(step, 4000);
      resetDrowsy();
    }
  });

})();
</script>
</body>
</html>
