<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clawd 的一天</title>
<meta name="description" content="一套八枚的小版张，从早上五点四十到夜里十点四十。点一枚拿起来，它就会动。">
<!--
  cc 做的。宝说「做个 clawd 系列的，什么内容你自己想」。
  Clawd 的底模照《Clawd造型宪法（Code版）》那组量出来的矩形，一格没动；
  八枚里变的只有眼睛、穿戴、壳上的东西、手里的东西、周围和天。
  动效只在「拿起来」的那一枚上跑，版张上的八枚是静的，像真的邮票。
-->
<style>
  :root{
    --desk:#2f3b38;
    --desk-2:#26302e;
    --sheet:#fbf8f1;
    --ink:#2d2630;
    --ink-2:#6f665f;
    --ink-3:#a2988c;
    --red:#b0443a;
    --clawd:#d47f59;
    --on-desk:#e8e2d6;
    --on-desk-2:#a9b3ad;
    --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(130% 700px at 50% 0%,#3b4946 0%,rgba(59,73,70,0) 100%) no-repeat,var(--desk);
    color:var(--on-desk);
    font-family:var(--sans);
    -webkit-text-size-adjust:100%;
    min-height:100vh;
  }
  .wrap{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px max(48px,env(safe-area-inset-bottom))}

  /* ---------- 版张 ---------- */
  #sheet{display:block;width:100%;height:auto;background:var(--sheet);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 40px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.25)}
  #sheet .hole{fill:var(--desk-2)}
  #sheet .st{cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
  #sheet .st .ring{fill:none;stroke:transparent;stroke-width:2}
  #sheet .st:focus-visible .ring{stroke:#7c5ce0}
  @media (hover:hover){#sheet .st:hover .face{opacity:.9}}
  #sheet .st:active .face{opacity:.85}
  .t-serif{font-family:var(--serif)}
  .t-sans{font-family:var(--sans)}
  .t-mono{font-family:var(--mono)}
  .t-num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700}

  .hint{margin:18px 2px 0;font-size:13.5px;line-height:1.7;color:var(--on-desk-2);text-align:center;letter-spacing:.02em}

  /* ---------- 发行说明 ---------- */
  .notice{margin:34px 2px 0;padding-top:18px;border-top:1px solid rgba(232,226,214,.14)}
  .notice h2{margin:0 0 12px;font:600 13px/1 var(--sans);letter-spacing:.24em;color:var(--on-desk-2)}
  .notice dl{margin:0;display:grid;grid-template-columns:4.2em 1fr;row-gap:7px;font-size:13.5px;line-height:1.6}
  .notice dt{color:var(--on-desk-2)}
  .notice dd{margin:0;color:var(--on-desk)}
  .notice p{margin:14px 0 0;font-size:13px;line-height:1.75;color:var(--on-desk-2)}
  .erase{margin-top:16px;background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--on-desk-2);
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(169,179,173,.4);cursor:pointer}
  .erase[hidden]{display:none}

  /* ---------- 拿起来 ---------- */
  .loupe{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
    background:rgba(16,21,20,.95);opacity:0;transition:opacity .22s ease}
  .loupe.on{opacity:1}
  .loupe[hidden]{display:none}
  .hold{width:min(74vw,300px);width:min(74vw,300px,calc((100vh - 270px)*.8));width:min(74vw,300px,calc((100svh - 270px)*.8));
    touch-action:pan-y;transform:translateY(10px) scale(.96);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .loupe.on .hold{transform:none}
  .hold>svg{display:block;width:100%;height:auto;transform:rotate(-1.6deg);filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
  .hold.thunk>svg{animation:thunk .26s steps(2,jump-none)}
  @keyframes thunk{0%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(-1.6deg) translateY(3px)}100%{transform:rotate(-1.6deg) translateY(0)}}
  .hold.swap-l>svg{animation:swapL .24s ease-out}
  .hold.swap-r>svg{animation:swapR .24s ease-out}
  @keyframes swapL{from{opacity:0;transform:rotate(-1.6deg) translateX(-14px)}}
  @keyframes swapR{from{opacity:0;transform:rotate(-1.6deg) translateX(14px)}}
  .cap{margin-top:22px;text-align:center;max-width:300px}
  .cap-h{display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--on-desk)}
  .cap-no{font:12px var(--mono);color:var(--on-desk-2)}
  .cap-name{font:600 24px/1 var(--serif)}
  .cap-time{font:600 14px var(--sans);font-variant-numeric:tabular-nums;color:var(--on-desk-2);letter-spacing:.04em}
  .cap-line{margin:10px 0 0;font-size:14.5px;line-height:1.75;color:var(--on-desk);min-height:3.5em;white-space:pre-line}
  .ctrl{margin-top:14px;display:flex;align-items:center;gap:12px}
  .ctrl button,.close{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--on-desk);
    background:rgba(255,255,255,.06);border:1px solid rgba(232,226,214,.2);border-radius:99px;transition:background .15s,border-color .15s}
  .ctrl button:focus-visible,.close:focus-visible{outline:2px solid #c9b8ff;outline-offset:2px}
  .nav{width:42px;height:42px;font-size:20px;line-height:1;padding:0}
  .press{height:42px;padding:0 20px;font-size:14px;letter-spacing:.06em;min-width:9.5em}
  .press:disabled{cursor:default;color:#e7a79f;border-color:rgba(231,167,159,.35);background:rgba(176,68,58,.12)}
  @media (hover:hover){.ctrl button:not(:disabled):hover,.close:hover{background:rgba(255,255,255,.12);border-color:rgba(232,226,214,.35)}}
  .close{margin-top:16px;padding:7px 18px;font-size:13px;color:var(--on-desk-2);background:none;border-color:transparent}

  /* 盖戳那一下 */
  .pm-new{animation:pmIn .3s steps(3,end) both;transform-box:fill-box;transform-origin:center}
  @keyframes pmIn{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}

  /* ---------- 动效：只在拿起来的那一枚上跑，一律 steps() ---------- */
  .live .a-hop{animation:hop 1.2s steps(2,jump-none) infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .live .a-bob{animation:bob 1.5s steps(2,jump-none) infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}

  /* 眨眼：睁眼那组和闭眼那组轮流出现，眼条本身不重画 */
  .live .bk-o{animation:bkO 4.2s steps(1,end) infinite}
  .live .bk-s{animation:bkS 4.2s steps(1,end) infinite}
  @keyframes bkO{0%{opacity:1}92%{opacity:0}96%{opacity:1}}
  @keyframes bkS{0%{opacity:0}92%{opacity:1}96%{opacity:0}}

  /* 醒：先闭着，两秒多之后睁开，然后照常眨眼 */
  .live .wk-o{animation:wkO 2.6s steps(1,end) forwards,bkO 4.2s 3.6s steps(1,end) infinite}
  .live .wk-s{animation:wkS 2.6s steps(1,end) forwards,bkS 4.2s 3.6s steps(1,end) infinite}
  @keyframes wkO{0%{opacity:0}100%{opacity:1}}
  @keyframes wkS{0%{opacity:1}100%{opacity:0}}
  .live .a-zzout{animation:zzOut 2.4s steps(4,end) forwards}
  @keyframes zzOut{to{opacity:0;transform:translate(4px,-8px)}}
  .live .a-rise{animation:rise 3.2s steps(4,end) forwards}
  @keyframes rise{to{transform:translateY(-6px)}}

  .live .a-sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 1.8s steps(2,jump-none) infinite}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  .live .a-zz{animation:zz 2.6s steps(5,end) infinite}
  @keyframes zz{0%{opacity:0;transform:translate(0,2px)}15%{opacity:1}100%{opacity:0;transform:translate(4px,-10px)}}
  .live .a-dap{animation:dap 2.2s steps(1,end) infinite}
  @keyframes dap{0%{opacity:1}50%{opacity:.25}}
  .live .a-leaf{animation:leaf 5.5s steps(11,end) infinite}
  @keyframes leaf{
    0%{transform:translate(4px,-20px);opacity:0}
    8%{opacity:1}
    25%{transform:translate(-3px,-10px)}
    50%{transform:translate(4px,0)}
    75%{transform:translate(-2px,10px)}
    92%{opacity:1}
    100%{transform:translate(3px,22px);opacity:0}
  }

  .live .a-kite{animation:kite 2.2s steps(2,jump-none) infinite}
  @keyframes kite{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .live .a-tail{animation:tail .9s steps(2,jump-none) infinite}
  @keyframes tail{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
  .live .a-cloud{animation:cloud 14s steps(14,end) infinite alternate}
  @keyframes cloud{to{transform:translateX(12px)}}

  .live .a-shA{animation:shA 1.4s steps(1,end) infinite}
  .live .a-shB{animation:shB 1.4s steps(1,end) infinite}
  @keyframes shA{0%{opacity:1}50%{opacity:0}}
  @keyframes shB{0%{opacity:0}50%{opacity:1}}
  .live .a-tide{animation:tide 3s steps(3,end) infinite alternate}
  @keyframes tide{to{transform:translate(-2px,4px)}}

  .live .a-lamp{animation:lamp 1.6s steps(1,end) both}
  @keyframes lamp{0%{opacity:0}18%{opacity:1}26%{opacity:.15}34%{opacity:1}42%{opacity:.4}52%{opacity:1}}
  .live .a-win{animation:win .1s steps(1,end) both}
  @keyframes win{from{opacity:0}to{opacity:1}}

  .live .a-tw{animation:tw 2.6s steps(1,end) infinite}
  @keyframes tw{0%{opacity:1}50%{opacity:.3}}
  .live .a-shine{animation:tw 3.4s steps(1,end) infinite}
  .live .a-meteor{animation:meteor 7s steps(9,end) 1.2s infinite}
  @keyframes meteor{0%{opacity:0;transform:translate(0,0)}4%{opacity:1}14%{opacity:0;transform:translate(-36px,22px)}100%{opacity:0;transform:translate(-36px,22px)}}

  @media (prefers-reduced-motion:reduce){
    .live *{animation:none!important}
    .hold,.loupe{transition:none}
    .hold>svg{animation:none!important}
  }
</style>
</head>
<body>
<main class="wrap">
  <svg id="sheet" viewBox="0 0 380 1012" role="group" aria-label="Clawd 的一天 · 小版张，一套八枚"></svg>
  <p class="hint">点一枚拿起来看，它会动。<br>喜欢哪一枚，就给它盖个戳。</p>

  <section class="notice" aria-label="发行说明">
    <h2>发行说明</h2>
    <dl>
      <dt>名称</dt><dd>Clawd 的一天</dd>
      <dt>志号</dt><dd>T.2026-9</dd>
      <dt>枚数</dt><dd>一套八枚，小版张</dd>
      <dt>图案</dt><dd>醒 · 晾 · 寄 · 盹 · 风 · 潮 · 灯 · 星</dd>
      <dt>面值</dt><dd>每枚印的是那一刻的钟点</dd>
      <dt>设计</dt><dd>cc</dd>
      <dt>发行</dt><dd>宝's Shop 邮局</dd>
    </dl>
    <p>这套邮票不标价钱。一枚值它上面印着的那一刻。</p>
    <button class="erase" id="erase" hidden>把邮戳都擦掉</button>
  </section>
</main>

<div class="loupe" id="loupe" hidden role="dialog" aria-modal="true" aria-label="拿起来的一枚">
  <div class="hold" id="hold"></div>
  <div class="cap">
    <div class="cap-h"><span class="cap-no" id="cap-no"></span><b class="cap-name" id="cap-name"></b><span class="cap-time" id="cap-time"></span></div>
    <p class="cap-line" id="cap-line"></p>
  </div>
  <div class="ctrl">
    <button class="nav" id="prev" aria-label="上一枚">‹</button>
    <button class="press" id="press">盖个戳</button>
    <button class="nav" id="next" aria-label="下一枚">›</button>
  </div>
  <button class="close" id="close">放回去</button>
</div>

<script>
(function(){
'use strict';

/* ================= 画笔 ================= */
var C='#d47f59', K='#120d1d', U=4;
function n(v){return Math.round(v*100)/100;}
function r(x,y,w,h,f,a){return '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" fill="'+f+'"'+(a?' '+a:'')+'/>';}
function g(cls,inner,a){return '<g'+(cls?' class="'+cls+'"':'')+(a?' '+a:'')+'>'+inner+'</g>';}

/* 像素圆：一行一行的矩形拼出来 */
function disc(cx,cy,rad,f,u){
  u=u||U; var s='';
  for(var y=cy-rad;y<cy+rad;y+=u){
    var m=y+u/2-cy, h=Math.sqrt(Math.max(0,rad*rad-m*m));
    h=Math.round(h/(u/2))*(u/2);
    if(h>0) s+=r(cx-h,y,2*h,u,f);
  }
  return s;
}
function ellipse(cx,cy,rx,ry,f,u){
  u=u||U; var s='';
  for(var y=cy-ry;y<cy+ry;y+=u){
    var m=(y+u/2-cy)/ry, h=rx*Math.sqrt(Math.max(0,1-m*m));
    h=Math.round(h/(u/2))*(u/2);
    if(h>0) s+=r(cx-h,y,2*h,u,f);
  }
  return s;
}
/* 天：一段一段的色带，交界处棋盘格抖一下，像素画的老办法 */
function sky(stops,bottom){
  var s='',i;
  for(i=0;i<stops.length;i++){
    var y0=stops[i][0], y1=i+1<stops.length?stops[i+1][0]:bottom;
    s+=r(0,y0,140,y1-y0,stops[i][1]);
  }
  for(i=1;i<stops.length;i++){
    var y=stops[i][0], a=stops[i-1][1], b=stops[i][1];
    for(var x=0,k=0;x<140;x+=2,k++){
      s+=r(x,y-4+(k%2)*2,2,2,b)+r(x,y+(1-k%2)*2,2,2,a);
    }
  }
  return s;
}
/* 小山包：一列一列往上长 */
function hill(x0,x1,peak,base,f){
  var s='', mid=(x0+x1)/2, half=(x1-x0)/2;
  for(var x=x0;x<x1;x+=U){
    var t=(x+U/2-mid)/half, top=base-(base-peak)*(1-t*t);
    top=Math.round(top/2)*2;
    if(top<180) s+=r(x,top,U,180-top,f);
  }
  return s;
}
function zz(x,y,c,f){return r(x,y,5*c,c,f)+r(x+3*c,y+c,c,c,f)+r(x+2*c,y+2*c,c,c,f)+r(x+c,y+3*c,c,c,f)+r(x,y+4*c,5*c,c,f);}

/* ================= Clawd 底模 =================
   坐标原样取自《Clawd造型宪法（Code版）》的 BASE_OK：
   壳 147×98、两只钳横着平伸、四条腿左右各两条、两道竖眼条、没有嘴。
   这里只做整体缩放和平移；钳子要举就整块往上挪。 */
var S=.36;
var EYES={
  bar:r(70,78,8,21,K)+r(158,78,8,21,K),
  dot:r(66,81,16,16,K)+r(154,81,16,16,K),
  smile:r(62,88,8,8,K)+r(70,80,8,11,K)+r(78,88,8,8,K)+r(150,88,8,8,K)+r(158,80,8,11,K)+r(166,88,8,8,K),
  shut:r(62,86,24,8,K)+r(150,86,24,8,K)
};
var SHINE=r(71,81,6,6,'#fff')+r(159,81,6,6,'#fff');
var BLUSH=r(48,92,20,12,'#e59a9a')+r(167,92,20,12,'#e59a9a');
function blinking(open){return g('bk-o',EYES[open])+g('bk-s',EYES.shut,'opacity="0"');}
function clawd(cx,feet,o,sc){
  o=o||{}; sc=sc||S;
  var x=cx-98*sc, y=feet-119*sc, L=o.liftL||0, R=o.liftR||0;
  var body=r(44,50,147,98,C)+r(20,99-L,24,21,C)+r(191,99-R,25,21,C)
    +r(54,148,15,21,C)+r(78,148,15,21,C)+r(143,148,15,21,C)+r(167,148,15,21,C);
  return '<g transform="translate('+n(x)+' '+n(y)+') scale('+sc+') translate(-20 -50)">'
    +(o.back||'')+body+(o.tex||'')+(o.eyes!==undefined?o.eyes:EYES.bar)+(o.face||'')+(o.front||'')+'</g>';
}
/* 底模坐标 → 画面坐标，给手里的东西找位置用 */
function at(cx,feet,bx,by){return [cx-98*S+(bx-20)*S, feet-119*S+(by-50)*S];}

/* ================= 八枚 ================= */
var STAMPS=[
/* (8-1) 醒 */
{name:'醒',time:'05:40',ink:['#fbf1e4','#e9e1f5'],
 line:'天是从脚底下亮起来的。\n它先醒了一条腿，然后是另外三条。',
 draw:function(){
  var s=sky([[0,'#3b3968'],[28,'#524c85'],[54,'#80699e'],[78,'#b9859f'],[98,'#e2a79c'],[116,'#f4cba5']],136);
  s+=r(22,44,2,2,'#dcd6f2')+r(52,26,2,2,'#dcd6f2')+r(88,48,2,2,'#c7bde6')+r(104,34,1.5,1.5,'#c7bde6')+r(38,64,1.5,1.5,'#b9aedb')+r(70,14,1.5,1.5,'#dcd6f2');
  s+=g('a-rise',disc(106,136,24,'#f1bd9c')+disc(106,136,15,'#fde7b3'));
  s+=hill(-12,76,120,138,'#665682');
  s+=r(0,136,140,44,'#3d3660')+r(0,136,140,2,'#5b4f7d');
  s+=r(8,134,2,2,'#3d3660')+r(12,132,2,4,'#3d3660')+r(118,133,2,3,'#3d3660')+r(122,131,2,5,'#3d3660')+r(126,134,2,2,'#3d3660');
  var cap=r(112,40,76,10,'#ece8f7')+r(118,30,64,10,'#7a8cd2')+r(126,20,50,10,'#ece8f7')+r(136,11,36,9,'#7a8cd2')
    +r(148,3,22,8,'#ece8f7')+r(162,-4,16,7,'#7a8cd2')+r(174,-12,15,14,'#fbf9ff');
  s+=clawd(56,166,{front:cap,eyes:g('wk-o',EYES.bar,'opacity="0"')+g('wk-s',EYES.shut)});
  s+=g('a-zzout',zz(88,99,1.2,'#e9e2fb')+zz(97,87,1.6,'#e9e2fb'));
  return s;
 }},
/* (8-2) 晾 */
{name:'晾',time:'08:10',ink:['#223246','#28402a'],
 line:'四只袜子，一只都不能少。',
 draw:function(){
  var s=sky([[0,'#9ccfe9'],[58,'#bddff0'],[104,'#dcedf2']],142);
  function cloud(x,y){return r(x,y+4,26,6,'#f7fbfd')+r(x+4,y,12,4,'#f7fbfd')+r(x+14,y+2,8,2,'#f7fbfd');}
  s+=g('a-cloud',cloud(18,74)+cloud(96,96));
  s+=r(8,34,4,114,'#9a7b5a')+r(6,32,8,3,'#7d6246')+r(128,34,4,114,'#9a7b5a')+r(126,32,8,3,'#7d6246');
  function ly(x){var t=(x-70)/58;return 38+Math.round(7*(1-t*t));}
  for(var x=12;x<128;x+=4) s+=r(x,ly(x+2),4,1.2,'#57545f');
  function sock(x,d){
    var y=ly(x+4);
    return g('a-sway',
      r(x,y+1,8,14,'#fbf6ee')+r(x,y+4,8,2,C)+r(x,y+15,12,5,'#fbf6ee')+r(x+8,y+15,4,5,C)+r(x+2,y-2,2,5,'#e3a14f')+r(x+5,y-2,2,5,'#e3a14f'),
      'style="animation-delay:'+d+'s"');
  }

    +'<circle r="27" fill="none" stroke="'+ink+'" stroke-width="1.5"/>'

    +'<path id="'+id+'a" d="M-16.5 0A16.5 16.5 0 0 1 16.5 0" fill="none"/>'
    +'<path id="'+id+'b" d="M-20.8 0A20.8 20.8 0 0 0 20.8 0" fill="none"/>'
    +'<text fill="'+ink+'" font-size="6.2" class="t-sans" font-weight="600" letter-spacing=".4"><textPath href="#'+id+'a" xlink:href="#'+id+'a" startOffset="50%" text-anchor="middle">宝\'s Shop</textPath></text>'
    +'<text fill="'+ink+'" font-size="5.6" class="t-sans" letter-spacing=".6"><textPath href="#'+id+'b" xlink:href="#'+id+'b" startOffset="50%" text-anchor="middle">Clawd 的一天</textPath></text>'
    +r(-22,-5.4,44,.7,ink)+r(-22,4.8,44,.7,ink)
    +'<text y="2.3" fill="'+ink+'" font-size="6.6" class="t-mono" text-anchor="middle" letter-spacing=".2">'+date+'</text>'
    +'</g></g>';
}
function stampFace(i,pm,pmId,fresh){
  var st=STAMPS[i];
  var s='<rect width="160" height="200" fill="#fbf8f1"/>'
    +'<svg x="10" y="10" width="140" height="180" viewBox="0 0 140 180" shape-rendering="crispEdges">'+st.draw()+'</svg>'

    +'<text x="145" y="32" class="t-serif" font-size="17" font-weight="600" text-anchor="end" fill="'+st.ink[0]+'">'+st.name+'</text>'
    +'<text x="16" y="184" class="t-sans" font-size="5.6" letter-spacing=".5" fill="'+st.ink[1]+'">宝\'s Shop</text>'
    +'<text x="144" y="184" class="t-mono" font-size="5.6" text-anchor="end" fill="'+st.ink[1]+'">(8-'+(i+1)+')</text>';

function holesMask(){
  var h='';
  for(var x=0;x<=160;x+=8){ h+='<circle cx="'+x+'" cy="0" r="2.3"/><circle cx="'+x+'" cy="200" r="2.3"/>'; }
  for(var y=8;y<200;y+=8){ h+='<circle cx="0" cy="'+y+'" r="2.3"/><circle cx="160" cy="'+y+'" r="2.3"/>'; }
  return h;
}
var HOLES=holesMask();
function paintLoupe(dir,fresh){
  var st=STAMPS[cur];
  hold.innerHTML='<svg viewBox="0 0 160 200" class="live" role="img" aria-label="(8-'+(cur+1)+') '+st.name+'">'
    +'<defs><mask id="perf" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="200">'
    +'<rect width="160" height="200" fill="#fff"/><g fill="#000">'+HOLES+'</g></mask></defs>'
    +'<g mask="url(#perf)">'+stampFace(cur,marks[cur],'pmd',fresh)+'</g></svg>';
  capNo.textContent='(8-'+(cur+1)+')';
  capName.textContent=st.name;
  capTime.textContent=st.time;
  capLine.textContent=st.line;
  var m=marks[cur];
  if(m){ var p=m.d.split('.'); press.textContent='已盖 · '+(+p[1])+'月'+(+p[2])+'日'; press.disabled=true; }
  else { press.textContent='盖个戳'; press.disabled=false; }
  hold.classList.remove('swap-l','swap-r','thunk');
  if(dir){ void hold.offsetWidth; hold.classList.add(dir<0?'swap-l':'swap-r'); }
}
function openAt(i){
  cur=i; lastFocus=document.activeElement;
  paintLoupe(0);
  loupe.hidden=false;
  document.documentElement.style.overflow='hidden';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ loupe.classList.add('on'); }); });
  press.disabled?document.getElementById('close').focus():press.focus();
}
function closeLoupe(){
  loupe.classList.remove('on');
  document.documentElement.style.overflow='';
  setTimeout(function(){ loupe.hidden=true; hold.innerHTML=''; },200);
  if(lastFocus&&lastFocus.focus) try{ lastFocus.focus({preventScroll:true}); }catch(e){}
}
function go(d){ cur=(cur+d+8)%8; paintLoupe(d); }

sheet.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('.st'); if(t) openAt(+t.getAttribute('data-i'));
});
sheet.addEventListener('keydown',function(e){
  var t=e.target.closest&&e.target.closest('.st');
  if(t&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openAt(+t.getAttribute('data-i')); }
});
document.getElementById('prev').addEventListener('click',function(){go(-1);});
document.getElementById('next').addEventListener('click',function(){go(1);});
document.getElementById('close').addEventListener('click',closeLoupe);
loupe.addEventListener('click',function(e){ if(e.target===loupe) closeLoupe(); });
document.addEventListener('keydown',function(e){
  if(loupe.hidden) return;
  if(e.key==='Escape') closeLoupe();
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight') go(1);
});
press.addEventListener('click',function(){
  if(marks[cur]) return;
  marks[cur]={d:today(),a:Math.round(-24+Math.random()*34)};
  save();
  paintLoupe(0,true);
  void hold.offsetWidth; hold.classList.add('thunk');
  drawSheet();
});
document.getElementById('erase').addEventListener('click',function(){
  marks={}; save(); drawSheet();
});

var sx=null, sy=null;
hold.addEventListener('touchstart',function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
hold.addEventListener('touchend',function(e){
  if(sx===null) return;
  var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3) go(dx<0?1:-1);
},{passive:true});

drawSheet();
})();
</script>
</body>
</html>
