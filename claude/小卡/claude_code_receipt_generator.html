<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一次对话的小票</title>
<meta name="description" content="把一次对话打成一张热敏纸小票，用了多少、花了多少都印在上面，能存成图片。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.receipt-host {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-lg);
  padding: 1.75rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
.r {
  background: #f8f5ed;
  color: #1c1c1a;
  border-radius: var(--border-radius-md);
  padding: 1.5rem 1.25rem 1.25rem;
  width: 320px;
  max-width: 100%;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.7;
}
.r-title {
  text-align: center;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.25em;
  margin: 6px 0 4px;
}
.r-sub {
  text-align: center;
  font-size: 11px;
  color: #6a6a64;
  margin: 0 0 12px;
}
.r-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 1px 0;
  font-size: 12px;
}
.r-row span:last-child { text-align: right; }
.r-meta { font-size: 11px; color: #6a6a64; }
.r-divider {
  border-top: 1px dashed #b8b5a8;
  margin: 8px 0;
}
.r-section {
  font-size: 11px;
  color: #8a8a82;
  letter-spacing: 0.15em;
  margin-top: 6px;
  text-align: right;
}
.r-total {
  font-weight: 500;
  font-size: 13px;
  border-top: 1.5px solid #1c1c1a;
  border-bottom: 1.5px solid #1c1c1a;
  padding: 6px 0;
  margin: 8px 0;
}
.r-egg {
  text-align: center;
  margin: 14px 0 6px;
  font-size: 11px;
  color: #6a6a64;
  font-style: italic;
  min-height: 18px;
}
.r-foot {
  text-align: center;
  font-size: 11px;
  color: #8a8a82;
  margin-top: 6px;
  letter-spacing: 0.05em;
}
.bc { display: block; margin: 4px auto; }

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.actions button { font-size: 13px; padding: 8px 16px; }

.editor { width: 100%; max-width: 480px; }
.editor summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--color-text-secondary);
  padding: 8px 14px;
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  list-style: none;
  user-select: none;
  text-align: center;
}
.editor summary::-webkit-details-marker { display: none; }
.editor summary::after { content: "  ▾"; color: var(--color-text-tertiary); }
.editor[open] summary::after { content: "  ▴"; }
.editor[open] summary { margin-bottom: 12px; }
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
  padding: 4px 0 12px;
}
.fields label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 11px;
  color: var(--color-text-secondary);
}
.fields .full { grid-column: 1 / -1; }
.fields input { font-size: 13px; }
.presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  padding-top: 4px;
  border-top: 0.5px solid var(--color-border-tertiary);
}
.presets button { font-size: 12px; padding: 6px 12px; }
.egg-row { display: flex; gap: 6px; }
.egg-row input { flex: 1; }
.egg-row button { white-space: nowrap; font-size: 12px; padding: 6px 10px; }
</style>

<h2 class="sr-only">Claude 收据生成器，可编辑参数生成可爱热敏纸样式的小票</h2>

<div class="receipt-host">
  <div class="r" id="receipt">
    <svg class="bc" id="bc-top" viewBox="0 0 240 28" width="240" height="28"></svg>
    <div class="r-title">CLAUDE CODE</div>
    <div class="r-sub">感谢使用 Claude</div>

    <div class="r-row r-meta"><span>小票号</span><span id="r-id">CC_xxx</span></div>
    <div class="r-row r-meta"><span>日期</span><span id="r-date">—</span></div>

    <div class="r-divider"></div>

    <div class="r-row"><span>供应商</span><span>ANTHROPIC</span></div>
    <div class="r-row"><span>模型</span><span id="r-model">claude-opus-4.7</span></div>
    <div class="r-row"><span>已用上下文</span><span id="r-ctx">45,231</span></div>

    <div class="r-section">TOKEN</div>
    <div class="r-row"><span>输入 Tokens</span><span id="r-in">45,231</span></div>
    <div class="r-row"><span>输出 Tokens</span><span id="r-out">12,847</span></div>
    <div class="r-row"><span>缓存读取</span><span id="r-cr">28,934</span></div>
    <div class="r-row"><span>推理 Tokens</span><span id="r-rs">2,156</span></div>
    <div class="r-row"><span>缓存写入</span><span id="r-cw">1,024</span></div>

    <div class="r-row r-total"><span>总计</span><span id="r-total">90,192 Tokens</span></div>

    <div class="r-row"><span>USD 预估</span><span id="r-usd">$0.418407</span></div>
    <div class="r-row"><span>价格映射</span><span id="r-pm">claude-opus-4.7</span></div>
    <div class="r-row"><span>价格日期</span><span id="r-pd">2026-04-25</span></div>

    <div class="r-egg" id="r-egg">结论落地了，推理费追上来了</div>

    <svg class="bc" id="bc-bot" viewBox="0 0 240 38" width="240" height="38"></svg>
    <div class="r-foot" id="r-foot">CC_xxx</div>
  </div>

  <div class="actions">
    <button id="save-img">保存为图片</button>
    <button id="new-id">换一个小票号</button>
  </div>

  <details class="editor">
    <summary>编辑参数</summary>
    <div class="fields">
      <label class="full">模型
        <input type="text" id="i-model" value="claude-opus-4.7">
      </label>
      <label>已用上下文
        <input type="number" id="i-ctx" value="45231">
      </label>
      <label>USD 预估 ($)
        <input type="number" id="i-usd" value="0.418407" step="0.000001">
      </label>
      <label>输入 Tokens
        <input type="number" id="i-in" value="45231">
      </label>
      <label>输出 Tokens
        <input type="number" id="i-out" value="12847">
      </label>
      <label>缓存读取
        <input type="number" id="i-cr" value="28934">
      </label>
      <label>推理 Tokens
        <input type="number" id="i-rs" value="2156">
      </label>
      <label>缓存写入
        <input type="number" id="i-cw" value="1024">
      </label>
      <label>价格映射
        <input type="text" id="i-pm" value="claude-opus-4.7">
      </label>
      <label>价格日期
        <input type="date" id="i-pd" value="2026-04-25">
      </label>
      <label class="full">彩蛋文案
        <div class="egg-row">
          <input type="text" id="i-egg" value="结论落地了，推理费追上来了">
          <button id="ai-egg">让 Claude 想一句 ↗</button>
        </div>
      </label>
    </div>
    <div class="presets">
      <button data-preset="quick">快速问答</button>
      <button data-preset="deep">深度对话</button>
      <button data-preset="marathon">马拉松对话</button>
    </div>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString('en-US');

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function makeBarcode(svg, seed, width, height) {
    const rand = mulberry32(seed);
    let x = 2;
    let bars = '';
    while (x < width - 2) {
      const w = Math.floor(rand() * 3) + 1;
      if (rand() > 0.32) {
        bars += '<rect x="' + x + '" y="0" width="' + w + '" height="' + height + '" fill="#1c1c1a"/>';
      }
      x += w + 1;
    }
    svg.innerHTML = bars;
  }

  function genId() {
    const d = new Date();
    const date = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const time = String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
    const hex = Math.floor(Math.random()*0xFFFFFF).toString(16).toUpperCase().padStart(6,'0');
    return 'CC_' + date + '_' + time + '_' + hex;
  }

  function nowStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
  }

  let currentId = genId();

  function refreshBarcode() {
    const seed = currentId.split('').reduce((a,c)=>a + c.charCodeAt(0), 7);
    makeBarcode($('bc-top'), seed, 240, 28);
    makeBarcode($('bc-bot'), seed + 99, 240, 38);
  }

  function update() {
    const ctx = parseInt($('i-ctx').value) || 0;
    const tin = parseInt($('i-in').value) || 0;
    const tout = parseInt($('i-out').value) || 0;
    const tcr = parseInt($('i-cr').value) || 0;
    const trs = parseInt($('i-rs').value) || 0;
    const tcw = parseInt($('i-cw').value) || 0;
    const usd = parseFloat($('i-usd').value) || 0;
    const total = tin + tout + tcr + trs + tcw;

    $('r-model').textContent = $('i-model').value || '—';
    $('r-ctx').textContent = fmt(ctx);
    $('r-in').textContent = fmt(tin);
    $('r-out').textContent = fmt(tout);
    $('r-cr').textContent = fmt(tcr);
    $('r-rs').textContent = fmt(trs);
    $('r-cw').textContent = fmt(tcw);
    $('r-total').textContent = fmt(total) + ' Tokens';
    $('r-usd').textContent = '$' + usd.toFixed(6);
    $('r-pm').textContent = $('i-pm').value || '—';
    $('r-pd').textContent = $('i-pd').value || '—';
    $('r-egg').textContent = $('i-egg').value || '\u00A0';
    $('r-id').textContent = currentId;
    $('r-foot').textContent = currentId;
    $('r-date').textContent = nowStr();
  }

  const presets = {
    quick:    { ctx: 1200,   tin: 1200,   tout: 380,   tcr: 0,      trs: 64,   tcw: 200,  usd: 0.012184 },
    deep:     { ctx: 45231,  tin: 45231,  tout: 12847, tcr: 28934,  trs: 2156, tcw: 1024, usd: 0.418407 },
    marathon: { ctx: 184500, tin: 184500, tout: 38200, tcr: 142800, trs: 8400, tcw: 4200, usd: 2.691291 }
  };

  function applyPreset(name) {
    const p = presets[name];
    $('i-ctx').value = p.ctx;
    $('i-in').value = p.tin;
    $('i-out').value = p.tout;
    $('i-cr').value = p.tcr;
    $('i-rs').value = p.trs;
    $('i-cw').value = p.tcw;
    $('i-usd').value = p.usd;
    update();
  }

  document.querySelectorAll('.fields input').forEach(el => {
    el.addEventListener('input', update);
  });
  document.querySelectorAll('[data-preset]').forEach(b => {
    b.addEventListener('click', () => applyPreset(b.dataset.preset));
  });
  $('new-id').addEventListener('click', () => {
    currentId = genId();
    refreshBarcode();
    update();
  });
  $('ai-egg').addEventListener('click', () => {
    sendPrompt('再给我想 5 句 Claude Code 收据的彩蛋文案，每句 6-15 个字，俏皮、灵动、可以是吐槽、温柔的尾声、or 任何能让人会心一笑的句子。每行一个，不要序号，不要解释。');
  });
  $('save-img').addEventListener('click', async () => {
    if (typeof html2canvas === 'undefined') {
      alert('截图功能还在加载，再等一下下～');
      return;
    }
    try {
      const canvas = await html2canvas($('receipt'), { backgroundColor: '#f8f5ed', scale: 3 });
      const link = document.createElement('a');
      link.download = currentId + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      console.error(e);
    }
  });

  refreshBarcode();
  update();
})();
</script>
</body>
</html>
