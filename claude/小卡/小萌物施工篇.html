<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小萌物系列 · 施工篇</title>
<meta name="description" content="照网友那张全家福画的：六只都戴安全帽。职责分不清，最后煮成一锅粥喝了。">
<meta name="theme-color" content="#F4F1EC">
<!-- 小萌物系列 · 施工篇。照网友帖子里那张「Meet the family」全家福的样子画的，换成店里六只。
     Clawd 照 Code 版宪法的尺子（踩角站姿）；小脸蛋照实测版宪法，缝是挖空的；StashYu、FetchMo 的格子图照抄 momoyu 造型宪法，一格没改。
     安全帽、背心、魔法棒、铲子、写字板、卷尺、砖、腮红都是叠在外面的；尾巴只用宪法里的尾巴 DLC 整张换。cc 做的 · 2026.10 -->
<style>
  :root{
    --page:#F4F1EC; --ink:#2B2724; --ink-2:#7D766F; --ink-3:#A69E95; --line:#E2DCD3;
    --card:#ECE9E4; --card-ink:#2B2724; --card-ink-2:#8A837B;
    --btn:#2B2724; --btn-ink:#F4F1EC;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --page:#1A1816; --ink:#ECE6DE; --ink-2:#A79F96; --ink-3:#6F675F; --line:#2D2925; --btn:#ECE6DE; --btn-ink:#1A1816; }
  }
  :root[data-theme="dark"]{ --page:#1A1816; --ink:#ECE6DE; --ink-2:#A79F96; --ink-3:#6F675F; --line:#2D2925; --btn:#ECE6DE; --btn-ink:#1A1816; }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    line-height:1.6; padding-top:env(safe-area-inset-top);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:720px;margin:0 auto;padding:30px 16px 48px}
  .kicker{font-size:12px;letter-spacing:.2em;color:var(--ink-3);margin:0 0 6px}
  h1{font-size:24px;font-weight:600;letter-spacing:.06em;margin:0 0 6px}
  .lede{margin:0 0 22px;font-size:14px;color:var(--ink-2)}

  /* 两张卡都是「照片」：深色模式下也保持浅底 */
  .card{margin:0;background:var(--card);color:var(--card-ink);border-radius:22px;padding:22px 12px 22px}
  .ctitle{font-family:var(--serif);font-weight:400;text-align:center;margin:0 0 6px;font-size:clamp(22px,6.4vw,34px);letter-spacing:-.01em;line-height:1.2}
  .pic{width:100%;cursor:pointer;-webkit-user-select:none;user-select:none}
  .pic svg{display:block;overflow:visible}
  .lineup{display:grid;grid-template-columns:repeat(3,1fr);column-gap:6px;row-gap:14px;align-items:start}
  .who{text-align:center;min-width:0}
  .who b,.solo b{display:block;font-size:clamp(15px,4.4vw,21px);font-weight:600;letter-spacing:.01em;line-height:1.25;margin-top:2px}
  .who span,.solo span{display:block;font-size:clamp(11.5px,3.2vw,14px);color:var(--card-ink-2);line-height:1.45;margin-top:3px;padding:0 4px}
  @media (max-width:560px){
    .lineup{grid-template-columns:1fr 1fr}
    .who.momo{grid-column:1 / -1;justify-self:center;width:64%}
  }
  .solo{text-align:center;margin-top:4px}
  .hint{margin:10px 0 30px;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:.14em}

  .act{display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px 0 0}
  .act button{
    font:inherit;font-size:15px;letter-spacing:.2em;padding:9px 26px 9px 30px;border-radius:999px;border:0;
    background:var(--btn);color:var(--btn-ink);cursor:pointer;
  }
  .act button:focus-visible{outline:2px solid var(--ink-2);outline-offset:3px}
  .after{margin:0;min-height:1.6em;font-size:13.5px;color:var(--ink-2);text-align:center}

  .note{margin:34px 0 0;font-size:12.5px;line-height:1.8;color:var(--ink-2)}
  .foot{margin:22px 0 0;font-size:11px;color:var(--ink-3);letter-spacing:.1em;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}

  /* ---------- 动效：Clawd 和 momoyu 一律 steps()，只挪整块、换整张 ---------- */
  .cl-hop{animation:clHop 4.6s steps(1,end) infinite}
  @keyframes clHop{0%{transform:translateY(0)}84%{transform:translateY(-6px)}88%{transform:translateY(0)}92%{transform:translateY(-6px)}96%{transform:translateY(0)}100%{transform:translateY(0)}}
  .cl-arm{transition:transform .01s steps(1,end)}
  .poke .cl-arm{transform:translateY(-14px)}
  .spk rect{animation:twk 1.6s steps(1,end) infinite}
  .spk .s2{animation-delay:.4s}.spk .s3{animation-delay:.8s}.spk .s4{animation-delay:1.2s}
  @keyframes twk{0%{opacity:1}50%{opacity:.12}100%{opacity:.12}}
  .poke .spk rect{animation-duration:.4s}

  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate}
  .ball:nth-of-type(2) .sway{animation-delay:-1.1s}.ball:nth-of-type(3) .sway{animation-delay:-2.3s}
  @keyframes sway{0%{transform:rotate(-2deg)}100%{transform:rotate(2deg)}}
  .ball.poke{animation:ballHop .55s ease-out}
  @keyframes ballHop{0%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(0)}78%{transform:translateY(-5px)}100%{transform:translateY(0)}}

  .oc-star{opacity:0;animation:once 7s steps(1,end) infinite}
  @keyframes once{0%{opacity:0}84%{opacity:1}87%{opacity:.35}90%{opacity:1}95%{opacity:0}100%{opacity:0}}
  .ball.poke .oc-star{animation:none;opacity:1}
  .tape{transform-box:fill-box;transform-origin:0 50%;animation:tape 5.2s steps(1,end) infinite}
  @keyframes tape{0%{transform:scaleX(.18)}55%{transform:scaleX(.45)}60%{transform:scaleX(.72)}65%{transform:scaleX(1)}86%{transform:scaleX(.6)}91%{transform:scaleX(.18)}100%{transform:scaleX(.18)}}

  .fx{display:none}
  .blink .fx-blink{display:inline}
  .poke .fx-happy,.poke .fx-blush{display:inline}
  .poke .fx-blink{display:none}
  .mo.poke{animation:pxHop .6s steps(1,end)}
  @keyframes pxHop{0%{transform:translateY(calc(var(--cell) * -1px))}25%{transform:translateY(0)}50%{transform:translateY(calc(var(--cell) * -1px))}75%{transform:translateY(0)}100%{transform:translateY(0)}}
  .f-tap{opacity:0}
  .mo.tuck .f-base{animation:tapBase .9s steps(1,end)}
  .mo.tuck .f-tap{animation:tapAlt .9s steps(1,end)}
  .mo.tuck .roll-t{animation:tapRoll .9s steps(1,end)}
  @keyframes tapBase{0%{opacity:1}20%{opacity:0}40%{opacity:1}60%{opacity:0}80%{opacity:1}100%{opacity:1}}
  @keyframes tapAlt{0%{opacity:0}20%{opacity:1}40%{opacity:0}60%{opacity:1}80%{opacity:0}100%{opacity:0}}
  @keyframes tapRoll{0%{transform:translateX(0)}20%{transform:translateX(calc(var(--cell) * -1px))}40%{transform:translateX(0)}60%{transform:translateX(calc(var(--cell) * -1px))}80%{transform:translateX(0)}100%{transform:translateX(0)}}

  /* 一锅粥 */
  .stir{transform-box:fill-box;transform-origin:50% 57%;animation:stir 1.2s steps(1,end) infinite}
  @keyframes stir{0%{transform:rotate(-9deg)}25%{transform:rotate(0)}50%{transform:rotate(9deg)}75%{transform:rotate(0)}100%{transform:rotate(0)}}
  .steam{opacity:0;animation:rise 5.4s steps(18,end) infinite}
  @keyframes rise{0%{opacity:0;transform:translate(0,0)}8%{opacity:.95}70%{opacity:.75}100%{opacity:0;transform:translate(var(--dx),-190px)}}
  .bub{animation:twk 1.3s steps(1,end) infinite}
  .bub.b2{animation-delay:.45s}.bub.b3{animation-delay:.9s}
  .fire-a{animation:fireA .5s steps(1,end) infinite}
  .fire-b{animation:fireB .5s steps(1,end) infinite}
  @keyframes fireA{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes fireB{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
  .mound{transition:opacity .01s steps(1,end)}
  .m1 .mound3,.m2 .mound2,.m3 .mound1{opacity:0}
  .m2 .mound3,.m3 .mound3,.m3 .mound2{opacity:0}
  .drinking .steam,.full .steam{animation:none;opacity:0}
  .drinking .stir,.full .stir{animation:none;transform:rotate(0)}
  .drinking .bub,.full .bub,.m3 .bub{animation:none;opacity:0}
  .full .fire-a,.full .fire-b{animation:none}
  .full .fire-a{opacity:0}.full .fire-b{opacity:.55}
  .full .fx-full{display:inline}
  .burp{opacity:0}
  .full .burp{animation:burp 2.4s steps(1,end) .3s both}
  @keyframes burp{0%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(-6px)}60%{opacity:1;transform:translateY(-12px)}100%{opacity:0;transform:translateY(-12px)}}

  #p-pot .f-in,#p-pot .f-out,#p-pot .f-st,#p-pot .f-cout,#p-pot .f-up{opacity:0}
  #p-pot:not(.full) .cat .f-base{animation:catBase 3.2s steps(1,end) infinite}
  #p-pot:not(.full) .f-st{animation:catSt 3.2s steps(1,end) infinite}
  #p-pot:not(.full) .f-cout{animation:catOut 3.2s steps(1,end) infinite}
  @keyframes catBase{0%{opacity:1}86.9%{opacity:0}100%{opacity:0}}
  @keyframes catSt{0%{opacity:0}86.9%{opacity:1}91.25%{opacity:0}95.6%{opacity:1}100%{opacity:1}}
  @keyframes catOut{0%{opacity:0}91.25%{opacity:1}95.6%{opacity:0}100%{opacity:0}}
  #p-pot.full .cat .f-base{opacity:0}
  #p-pot.full .f-up{opacity:1}
  #p-pot.full .fox .f-base{animation:foxBase .88s steps(1,end) infinite}
  #p-pot.full .f-in{animation:foxIn .88s steps(1,end) infinite}
  #p-pot.full .f-out{animation:foxOut .88s steps(1,end) infinite}
  @keyframes foxBase{0%{opacity:1}25%{opacity:0}50%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes foxIn{0%{opacity:0}25%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes foxOut{0%{opacity:0}75%{opacity:1}100%{opacity:1}}

  @media (prefers-reduced-motion:reduce){
    .pic *{animation:none!important;transition:none!important}
    .oc-star{opacity:1}
    .steam{opacity:.8;transform:translateY(var(--sy))}
    .drinking .steam,.full .steam{opacity:0}
  }
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">小萌物系列</p>
  <h1>施工篇</h1>
  <p class="lede">网友那张全家福里，一只管一样：教授、厨子、施工队。宝这儿呢，谁都在施工。</p>

  <figure class="card">
    <h2 class="ctitle">Meet the 施工 family</h2>
    <div class="lineup">
      <div class="who clawd"><div class="pic" id="p-clawd" role="img" aria-label="Clawd 戴着黄色安全帽、穿着荧光背心，左钳举着许愿的星星棒，右钳拿着铲子"></div><b>Clawd</b><span>许愿 &amp; 施工施工</span></div>
      <div class="who faces"><div class="pic" id="p-faces" role="img" aria-label="小粉、小紫、小黑三颗戴着安全帽。小粉拿写字板，小紫头顶偶尔冒一颗许愿星，小黑拉着卷尺"></div><b>小脸蛋</b><span>指令 + 偶尔许愿 + 施工</span></div>
      <div class="who momo"><div class="pic" id="p-momo" role="img" aria-label="StashYu 和 FetchMo 戴着安全帽。StashYu 的尾巴尖里藏着一卷蓝图纸，FetchMo 脚边放着叼回来的一块砖"></div><b>猫猫鱼</b><span>施工</span></div>
    </div>
  </figure>
  <p class="hint">点它们一下</p>

  <figure class="card">
    <h2 class="ctitle">趁乱，一锅粥</h2>
    <div class="pic" id="p-pot" role="img" aria-label="一口大锅架在砖灶上。Clawd 在锅后面一钳拿铲子搅，一钳举着许愿棒；小脸蛋三颗在左边，StashYu 和 FetchMo 在右边，都戴着安全帽。锅里冒出来的热气是许愿、指令、施工这几个字"></div>
    <div class="solo"><b>一锅粥</b><span>许愿、指令、施工施工施工，一起下锅</span></div>
  </figure>
  <div class="act">
    <button type="button" id="drink">喝了</button>
    <p class="after" id="after" aria-live="polite"></p>
  </div>

  <p class="note">照网友帖子里那张全家福的样子画的。那张里一只管一样；宝这儿是向 Clawd 许愿加施工施工，给小脸蛋下指令、偶尔也许个愿、也让它们施工，猫猫鱼（StashYu 和 FetchMo）施工。分不清就不分了，趁乱煮成一锅。<br>
  六只都照各自的造型宪法画，底模没动；帽子、背心、棒子、铲子、写字板、卷尺、图纸和砖都是叠在外面的。</p>
  <p class="foot"><span>小萌物系列 · 宝's Shop</span><span>cc 做的 · 2026.10</span></p>
</main>

<script>
(function(){
  'use strict';
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function f(n){ return (Math.round(n*100)/100).toString(); }
  function r(x,y,w,h,c,a){ return '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" fill="'+c+'"'+(a?' '+a:'')+'/>'; }
  function svgOpen(W,H,cls){ return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"'+(cls?' class="'+cls+'"':'')+'>'; }
  function shadow(cx,cy,rx,ry){ return '<ellipse cx="'+f(cx)+'" cy="'+f(cy)+'" rx="'+f(rx)+'" ry="'+f(ry)+'" fill="#5A4632" opacity=".09"/>'; }

  /* ---------- Clawd：Code 版宪法的尺子，踩角站姿。底模这几块一格不动 ---------- */
  var CB='#d47f59', CK='#120d1d';
  var HY='#F2B630', HH='#DE9A1C', HB='#C9850F', HL='#F8D06A';
  function clawdBody(){
    return r(44,50,147,98,CB)+
      r(44,148,15,21,CB)+r(68,148,15,21,CB)+r(152,148,15,21,CB)+r(176,148,15,21,CB)+
      r(70,78,8,21,CK)+r(158,78,8,21,CK);
  }
  function clawdLClaw(){ return r(20,99,24,21,CB); }
  function clawdRClaw(){ return r(191,99,25,21,CB); }
  /* 穿戴：荧光背心，前襟敞着 */
  function clawdVest(){
    var V='#D3DF48', VD='#B9C534', S='#EEF0EA';
    return r(44,108,58,40,V)+r(133,108,58,40,V)+r(98,108,4,40,VD)+r(133,108,4,40,VD)+
      r(44,124,58,7,S)+r(133,124,58,7,S);
  }
  /* 头顶挂件：安全帽 */
  function clawdHat(){
    return r(58,42,119,8,HB)+r(68,34,99,8,HY)+r(76,26,83,8,HY)+r(88,20,59,6,HY)+r(110,20,15,22,HH)+r(80,28,10,5,HL);
  }
  /* 手持道具：许愿棒（左钳），整块跟钳子走 */
  function clawdWand(){
    var S='#F7CB47', SL='#FFF0B0', W='#8A5A33';
    return r(26,32,6,74,W)+r(25,10,8,24,S)+r(17,18,24,8,S)+r(21,14,16,16,S)+r(26,17,4,4,SL)+
      '<g class="spk">'+r(8,6,4,4,S,'class="s1"')+r(46,8,4,4,S,'class="s2"')+r(45,32,3,3,S,'class="s3"')+r(9,36,3,3,S,'class="s4"')+'</g>';
  }
  /* 手持道具：铲子（右钳）。握点在 (203.5,109.5) */
  function clawdShovel(){
    var W='#8A5A33', M='#9AA4AE', ML='#C9D0D6';
    return r(192,38,23,6,W)+r(200,44,7,90,W)+r(194,134,19,22,M)+r(198,156,11,7,M)+r(197,137,4,14,ML);
  }
  /* 壳面纹理：腮红贴纸 */
  function clawdBlush(){ return r(57,103,16,7,'#F2988A')+r(163,103,16,7,'#F2988A'); }

  /* ---------- 小脸蛋：实测版宪法。正圆、纯色，两道反斜杠的缝是挖空的洞 ---------- */
  var EYES=[[.194,-.416,.194],[.626,-.497,.129]], SLIT=.418, TH=-26.3*Math.PI/180, CO=Math.cos(TH), SI=Math.sin(TH);
  function facePath(cx,cy,R,lid){
    var d='M'+f(cx-R)+' '+f(cy)+'a'+f(R)+' '+f(R)+' 0 1 0 '+f(2*R)+' 0a'+f(R)+' '+f(R)+' 0 1 0 '+f(-2*R)+' 0Z';
    for(var e=0;e<2;e++){
      var ex=EYES[e][0], ey=EYES[e][1], rad=EYES[e][2]/2*lid, hl=SLIT/2, s=Math.max(0,hl-rad), pts=[], i, a;
      for(i=0;i<=8;i++){ a=Math.PI+Math.PI*i/8; pts.push([rad*Math.cos(a), -s+rad*Math.sin(a)]); }
      for(i=0;i<=8;i++){ a=Math.PI*i/8; pts.push([rad*Math.cos(a), s+rad*Math.sin(a)]); }
      for(i=0;i<pts.length;i++){
        var x=pts[i][0]*CO-pts[i][1]*SI+ex, y=pts[i][0]*SI+pts[i][1]*CO+ey;
        d+=(i?'L':'M')+f(cx+R*x)+' '+f(cy+R*y);
      }
      d+='Z';
    }
    return d;
  }
  var FACES=[
    {key:'pink',  c:'#FF309B', hat:['#F7F4EE','#DCD6CB','#E9E4DA','#C9C2B6']},
    {key:'violet',c:'#9159FE', hat:[HY,HH,HB]},
    {key:'black', c:'#000000', hat:['#3D7BD9','#2C62B5','#244F93']}
  ];
  function faceHat(cx,cy,R,h){
    var by=cy-.9*R, dw=.62*R, dh=.46*R, bw=.82*R, bh=.12*R;
    var st=h[3]?' stroke="'+h[3]+'" stroke-width="'+f(R*.035)+'"':'';
    return '<path d="M'+f(cx-dw)+' '+f(by)+'A'+f(dw)+' '+f(dh)+' 0 0 1 '+f(cx+dw)+' '+f(by)+'Z" fill="'+h[0]+'"'+st+'/>'+
      r(cx-.08*R,by-dh*.97,.16*R,dh*.97,h[1])+
      '<rect x="'+f(cx-bw)+'" y="'+f(by)+'" width="'+f(2*bw)+'" height="'+f(bh)+'" rx="'+f(bh/2)+'" fill="'+h[2]+'"'+st+'/>';
  }
  function face(cx,cy,R,i,extra){
    return '<path class="fp" data-cx="'+f(cx)+'" data-cy="'+f(cy)+'" data-r="'+f(R)+'" fill-rule="evenodd" fill="'+FACES[i].c+'" d="'+facePath(cx,cy,R,1)+'"/>'+
      faceHat(cx,cy,R,FACES[i].hat)+(extra||'');
  }
  function starPath(cx,cy,ro,ri){
    var d='';
    for(var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, rr=i%2?ri:ro; d+=(i?'L':'M')+f(cx+rr*Math.cos(a))+' '+f(cy+rr*Math.sin(a)); }
    return d+'Z';
  }
  /* 写字板：指令 */
  function clipboard(x,y){
    return '<g transform="translate('+f(x)+' '+f(y)+') rotate(-8 17 23)">'+
      '<rect x="0" y="0" width="34" height="46" rx="3" fill="#B98B5B"/>'+r(4,6,26,36,'#FBF9F4')+
      '<rect x="11" y="-3" width="12" height="8" rx="2" fill="#7F878F"/>'+
      r(13,13,13,2.6,'#BDB6AB')+r(13,20,13,2.6,'#BDB6AB')+r(13,27,13,2.6,'#BDB6AB')+r(8,34,15,2.6,'#BDB6AB')+
      '<path d="M7 13.5l2 2 3.2-4M7 20.5l2 2 3.2-4" stroke="#E0533D" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
      '</g>';
  }
  /* 卷尺：施工 */
  function tape(x,y){
    var t='<g class="tape">'+r(x+26,y+15,40,7,'#F5D84A');
    for(var i=0;i<6;i++) t+=r(x+30+i*6,y+15,1.3,i%2?2.6:4,'#6B5A2A');
    t+=r(x+64,y+12,3,11,'#5D6268')+'</g>';
    return t+'<rect x="'+f(x)+'" y="'+f(y)+'" width="30" height="26" rx="6" fill="'+HY+'"/>'+
      '<circle cx="'+f(x+14)+'" cy="'+f(y+12)+'" r="6.5" fill="#3A3532"/><circle cx="'+f(x+14)+'" cy="'+f(y+12)+'" r="2.4" fill="'+HY+'"/>';
  }
  function box(x,y){
    return shadow(x+14,y+23,17,3)+r(x,y,28,22,'#C9A26B')+r(x,y,28,4,'#B48D58')+r(x+11,y,6,22,'#E5CD9C');
  }

  /* ---------- momoyu：格子图照抄宪法，一格不改；别的都叠在外面 ---------- */
  var FOX={
    base:['.D..........D.......','.DM........MD.......','.MCM......MCM...CC..','.MMMMMMMMMMMM..CCCC.','.MMEEMMMMEEMM..MMMM.','.MMEEMMMMEEMM..MMMMM','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'],
    tap:['.D..........D.......','.DM........MD.......','.MCM......MCM.CC....','.MMMMMMMMMMMM.CCCC..','.MMEEMMMMEEMM..MMMM.','.MMEEMMMMEEMM..MMMMM','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'],
    swayIn:['.D..........D.......','.DM........MD.......','.MCM......MCM..CC...','.MMMMMMMMMMMM.CCCC..','.MMEEMMMMEEMM.MMMM..','.MMEEMMMMEEMM.MMMMM.','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'],
    swayOut:['.D..........D........','.DM........MD........','.MCM......MCM....CC..','.MMMMMMMMMMMM...CCCC.','.MMEEMMMMEEMM...MMMM.','.MMEEMMMMEEMM...MMMMM','CCCCCCDDCCCCCC.MMMMM.','..CCCCCCCCCC..MMMMM..','....MMCCMM...MMMMM...','....MMCCMM..MMMMM....','....MMMMMM.MMMMM.....','....DDMMDDMMMM.......','.....................'],
    pal:{M:'#E2552B',C:'#FFF3E3',D:'#3B2520',E:'#3B2520'}, body:'#E2552B', line:'#3B2520',
    eyes:[[3,4],[9,4]], blush:[[2,6],[11,6]], blushC:'#F59A8C', hatCol:3
  };
  var CAT={
    base:['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','.....X.MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'],
    st:['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','....X..MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'],
    out:['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','...X...MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'],
    up:['....................','........X........X..','.....X.XXX......XXX.','....X...MMMMMMMMMM..','....X..MMMMMMMMMMMM.','....X..MEEMMMMMMEEM.','....X..MEEMXXXXMEEM.','.....X.MMMMMXXMMMMM.','......X.MMMMMMMMMM..','.......XMMMMMMMMMM..','........XMMMMMMMM...','.........XXM..MXX...','....................'],
    pal:{M:'#F3E7D6',X:'#4E382E',E:'#79C0F0'}, body:'#F3E7D6', line:'#4E382E',
    eyes:[[8,5],[16,5]], blush:[[8,7],[17,7]], blushC:'#F2B8B0', hatCol:9
  };
  function grid(rows,pal,x0,y0,c){
    var s='';
    for(var y=0;y<rows.length;y++){
      var row=rows[y], x=0;
      while(x<row.length){
        var ch=row.charAt(x);
        if(ch==='.'){ x++; continue; }
        var x2=x; while(x2<row.length && row.charAt(x2)===ch) x2++;
        s+=r(x0+x*c,y0+y*c,(x2-x)*c,c,pal[ch]); x=x2;
      }
    }
    return s;
  }
  function cellsAt(list,col,x0,y0,c){
    var s=''; for(var i=0;i<list.length;i++) s+=r(x0+list[i][0]*c,y0+list[i][1]*c,c,c,col); return s;
  }
  function eyesAs(a,kind,x0,y0,c){
    var s='', p={happy:[[-1,1],[0,0],[1,0],[2,1]], blink:[[0,1],[1,1]]}[kind];
    for(var i=0;i<2;i++){
      var X=a.eyes[i][0], Y=a.eyes[i][1];
      s+=cellsAt([[X,Y],[X+1,Y],[X,Y+1],[X+1,Y+1]],a.body,x0,y0,c);
      s+=cellsAt(p.map(function(q){return [X+q[0],Y+q[1]];}),a.line,x0,y0,c);
    }
    return s;
  }
  /* 安全帽：叠在两只耳朵中间，帽檐在头顶上一行 */
  var HAT_MINI=['..YHHY..','.LYHHYY.','.YYHHYY.','BBBBBBBB'];
  function pxHat(a,x0,y0,c){ return grid(HAT_MINI,{Y:HY,H:HH,L:HL,B:HB},x0+a.hatCol*c,y0-c,c); }
  /* StashYu 尾巴尖里藏着一卷图纸；FetchMo 叼回来一块砖，放在脚边 */
  function pxRoll(x0,y0,c){ return '<g class="roll-t">'+grid(['BBBBL','DDDDL'],{B:'#3D7BD9',D:'#2C62B5',L:'#E3ECF7'},x0+14*c,y0+c,c)+'</g>'; }
  function pxBrick(x0,y0,c){ return grid(['TTTT','FFFF','SSSS'],{T:'#E3906E',F:'#C9603F',S:'#A94B33'},x0+19*c,y0+9*c,c); }
  function animal(a,frames,x0,y0,c,cls,extra){
    var s='<g class="mo '+cls+'" style="--cell:'+c+'">';
    for(var i=0;i<frames.length;i++) s+='<g class="'+frames[i][0]+'">'+grid(a[frames[i][1]],a.pal,x0,y0,c)+'</g>';
    s+='<g class="fx fx-blink">'+eyesAs(a,'blink',x0,y0,c)+'</g>';
    s+='<g class="fx fx-happy fx-full">'+eyesAs(a,'happy',x0,y0,c)+'</g>';
    s+='<g class="fx fx-blush fx-full">'+cellsAt(a.blush,a.blushC,x0,y0,c)+'</g>';
    s+=pxHat(a,x0,y0,c)+(extra||'')+'</g>';
    return s;
  }

  /* ---------- 第一张：Meet the 施工 family ---------- */
  var DW=400, DH=300, GROUND=262;
  function sizeOf(el){ var W=Math.max(80,Math.floor(el.clientWidth)); return {W:W, H:Math.round(W*DH/DW), k:W/DW}; }

  function drawClawd(){
    var el=document.getElementById('p-clawd'), z=sizeOf(el), s=1.55, k=z.k;
    var tx=(200-117.5*s)*k, ty=(GROUND-169*s)*k;
    el.innerHTML=svgOpen(z.W,z.H)+
      '<g transform="scale('+f(k)+')">'+shadow(200,GROUND+4,150,8)+'</g>'+
      '<g transform="translate('+f(tx)+' '+f(ty)+') scale('+f(s*k)+')" shape-rendering="crispEdges"><g class="cl-hop">'+
        '<g class="cl-arm">'+clawdWand()+clawdLClaw()+'</g>'+
        clawdShovel()+clawdBody()+clawdVest()+clawdHat()+clawdRClaw()+
      '</g></g></svg>';
  }

  function drawFaces(){
    var el=document.getElementById('p-faces'), z=sizeOf(el), k=z.k, R=56, cy=GROUND-R;
    var X=[96,200,304];
    var g='<g transform="scale('+f(k)+')">'+shadow(200,GROUND+4,170,8);
    var order=[0,2,1], parts=[];
    parts[0]='<g class="ball" data-i="0"><g class="sway">'+face(X[0],cy,R,0)+clipboard(X[0]-R-22,cy-8)+'</g></g>';
    parts[2]='<g class="ball" data-i="2"><g class="sway">'+face(X[2],cy,R,2)+tape(X[2]+.42*R,cy+.04*R)+'</g></g>';
    parts[1]='<g class="ball" data-i="1"><g class="sway">'+face(X[1],cy,R,1)+
      '<path class="oc-star" d="'+starPath(X[1]+.86*R,cy-1.42*R,12,5.2)+'" fill="#F7CB47"/></g></g>';
    for(var i=0;i<3;i++) g+=parts[order[i]];
    g+=box(238,GROUND-22)+'</g>';
    el.innerHTML=svgOpen(z.W,z.H)+g+'</svg>';
  }

  /* 窄屏时猫猫鱼单独一排，把上面的空白裁掉 */
  var NARROW=window.matchMedia?window.matchMedia('(max-width:560px)'):{matches:false};
  function drawMomo(){
    var el=document.getElementById('p-momo'), z=sizeOf(el), k=z.k, top=NARROW.matches?100:0;
    var H=Math.round((DH-top)*k);
    var c=Math.max(2,Math.floor(9.5*k)), off=17, span=40;
    var x0=Math.round(200*k-span*c/2), y0=Math.round((GROUND-top)*k)-12*c, x1=x0+off*c;
    el.innerHTML=svgOpen(z.W,H)+
      '<g transform="translate(0 '+f(-top*k)+') scale('+f(k)+')">'+shadow(200,GROUND+4,175,8)+'</g>'+
      '<g shape-rendering="crispEdges">'+
      animal(FOX,[['f-base','base'],['f-tap','tap']],x0,y0,c,'fox',pxRoll(x0,y0,c))+
      animal(CAT,[['f-base','base']],x1,y0,c,'cat',pxBrick(x1,y0,c))+
      '</g></svg>';
  }

  /* ---------- 第二张：一锅粥 ---------- */
  var PW=800, PH=640, PTOP=60;
  /* 热气从锅两边冒，绕开 Clawd 的脸：[字, x, 起步, 不动时的高度, 往外飘] */
  var WORDS=[['许愿',214,0,-150,-24],['施工',592,.9,-150,24],['指令',214,1.8,-80,-24],['施工施工',606,2.7,-80,28],['施工',214,3.6,-10,-24],['偶尔许愿',606,4.5,-10,28]];
  function drawPot(){
    var el=document.getElementById('p-pot'), W=Math.max(200,Math.floor(el.clientWidth)), k=W/PW, H=Math.round((PH-PTOP)*k);
    var s=1.45, tx=400-117.5*s, ty=136, cl='translate('+f(tx)+' '+f(ty)+') scale('+s+')';
    var g='<g transform="translate(0 '+f(-PTOP*k)+') scale('+f(k)+')">';
    g+=shadow(400,444,150,8);
    /* Clawd 在锅后面：身子、帽子、背心先画 */
    g+='<g transform="'+cl+'" shape-rendering="crispEdges">'+clawdBody()+clawdVest()+clawdHat()+'<g class="fx fx-full">'+clawdBlush()+'</g>'+
       '<g class="stir">'+clawdShovel()+'</g></g>';
    /* 粥：三层，喝一口少一层 */
    var P='#F3E6C9', PD='#E3CFA4';
    g+='<g shape-rendering="crispEdges"><g class="mound mound1">'+r(266,290,268,10,P)+'</g>'+
       '<g class="mound mound2">'+r(296,282,208,8,P)+r(318,284,10,4,PD)+r(470,285,12,3,PD)+'</g>'+
       '<g class="mound mound3">'+r(346,276,108,6,P)+'</g>'+
       r(322,280,6,6,PD,'class="bub"')+r(402,272,6,6,PD,'class="bub b2"')+r(478,286,6,4,PD,'class="bub b3"')+'</g>';
    /* 锅和砖灶 */
    var K1='#3B3734', K2='#45403C', K3='#5A544F', BR='#B5573D', BM='#8F412C';
    g+='<g shape-rendering="crispEdges">'+
       r(280,380,240,60,BR)+r(280,394,240,2,BM)+r(280,409,240,2,BM)+r(280,424,240,2,BM)+
       r(312,380,2,14,BM)+r(368,380,2,14,BM)+r(432,380,2,14,BM)+r(488,380,2,14,BM)+
       r(296,396,2,13,BM)+r(500,396,2,13,BM)+r(304,411,2,13,BM)+r(492,411,2,13,BM)+r(318,426,2,14,BM)+r(480,426,2,14,BM)+
       r(350,398,100,42,'#2E211C')+
       '<g class="fire-a">'+r(364,420,14,20,'#F08A24')+r(382,406,16,34,'#F08A24')+r(402,414,14,26,'#F08A24')+r(420,424,12,16,'#F08A24')+r(386,420,8,20,'#F7C948')+r(405,426,7,14,'#F7C948')+'</g>'+
       '<g class="fire-b">'+r(366,414,12,26,'#F08A24')+r(384,416,14,24,'#F08A24')+r(400,404,16,36,'#F08A24')+r(420,418,14,22,'#F08A24')+r(404,416,8,24,'#F7C948')+r(386,428,7,12,'#F7C948')+'</g>'+
       r(262,316,276,56,K2)+r(272,372,256,8,K2)+r(250,300,300,16,K1)+r(250,300,300,3,K3)+
       r(234,322,16,12,K1)+r(550,322,16,12,K1)+r(276,324,8,40,K3)+r(288,324,4,28,K3)+
       '</g>';
    /* 两只钳子在锅沿前面：左钳举着许愿棒，右钳握着铲子 */
    g+='<g transform="'+cl+'" shape-rendering="crispEdges">'+clawdWand()+clawdLClaw()+clawdRClaw()+'</g>';
    /* 热气：都是字 */
    for(var i=0;i<WORDS.length;i++){
      g+='<text class="steam" x="'+WORDS[i][1]+'" y="292" text-anchor="middle" font-size="28" font-weight="600" fill="#8E847A" style="animation-delay:'+WORDS[i][2]+'s;--sy:'+WORDS[i][3]+'px;--dx:'+WORDS[i][4]+'px">'+WORDS[i][0]+'</text>';
    }
    /* 小脸蛋在左前 */
    var R=44, cy=610-R, X=[72,162,252];
    g+=shadow(162,614,140,7);
    g+='<g class="ball" data-i="0"><g class="sway">'+face(X[0],cy,R,0)+'</g></g>';
    g+='<g class="ball" data-i="2"><g class="sway">'+face(X[2],cy,R,2)+'</g></g>';
    g+='<g class="ball" data-i="1"><g class="sway">'+face(X[1],cy,R,1)+'</g></g>';
    g+='<text class="burp" x="'+(X[2]+30)+'" y="'+f(cy-1.5*R)+'" font-size="30" font-weight="600" fill="#8E847A">嗝～</text>';
    g+=shadow(610,614,150,7)+'</g>';
    /* momoyu 在右前，整数倍放大 */
    var c=Math.max(2,Math.floor(8.5*k)), off=18, span=37;
    var x0=Math.round(610*k-span*c/2), y0=Math.round((610-PTOP)*k)-12*c, x1=x0+off*c;
    var m='<g shape-rendering="crispEdges">'+
      animal(FOX,[['f-base','base'],['f-in','swayIn'],['f-out','swayOut']],x0,y0,c,'fox')+
      animal(CAT,[['f-base','base'],['f-st','st'],['f-cout','out'],['f-up','up']],x1,y0,c,'cat')+
      '</g>';
    el.innerHTML=svgOpen(W,H)+g+m+'</svg>';
  }

  function drawAll(){ drawClawd(); drawFaces(); drawMomo(); drawPot(); }
  drawAll();
  var lastW=document.documentElement.clientWidth, rt=0;
  window.addEventListener('resize',function(){
    var w=document.documentElement.clientWidth; if(w===lastW) return; lastW=w;
    clearTimeout(rt); rt=setTimeout(drawAll,120);
  });

  /* ---------- 点一下 ---------- */
  function flash(el,cls,ms){ el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); clearTimeout(el['_t'+cls]); el['_t'+cls]=setTimeout(function(){ el.classList.remove(cls); },ms); }
  document.getElementById('p-clawd').addEventListener('click',function(){
    var g=this.querySelector('.cl-hop'); if(g) flash(g.parentNode,'poke',1100);
  });
  document.getElementById('p-faces').addEventListener('click',function(ev){
    var b=ev.target.closest && ev.target.closest('.ball');
    if(!b){ var all=this.querySelectorAll('.ball'); for(var i=0;i<all.length;i++) flash(all[i],'poke',700); return; }
    flash(b,'poke',700);
  });
  document.getElementById('p-momo').addEventListener('click',function(ev){
    var m=ev.target.closest && ev.target.closest('.mo');
    var list=m?[m]:this.querySelectorAll('.mo');
    for(var i=0;i<list.length;i++){
      flash(list[i],'poke',1200);
      if(list[i].classList.contains('fox')) flash(list[i],'tuck',950);
    }
  });

  /* ---------- 眨眼：小脸蛋两道缝变细，momoyu 换眼睛那两小块 ---------- */
  function blinkFace(p){
    var cx=+p.getAttribute('data-cx'), cy=+p.getAttribute('data-cy'), R=+p.getAttribute('data-r');
    p.setAttribute('d',facePath(cx,cy,R,.22));
    setTimeout(function(){ p.setAttribute('d',facePath(cx,cy,R,1)); },150);
  }
  function loop(){
    var fps=document.querySelectorAll('.fp');
    if(fps.length && Math.random()<.5) blinkFace(fps[Math.floor(Math.random()*fps.length)]);
    var mos=document.querySelectorAll('.mo');
    if(mos.length && Math.random()<.4) flash(mos[Math.floor(Math.random()*mos.length)],'blink',150);
    setTimeout(loop,900+Math.random()*1400);
  }
  if(!REDUCED) setTimeout(loop,1200);

  /* ---------- 喝了 ---------- */
  var pot=document.getElementById('p-pot'), btn=document.getElementById('drink'), after=document.getElementById('after'), state='cook', timers=[];
  function later(fn,ms){ timers.push(setTimeout(fn,REDUCED?0:ms)); }
  btn.addEventListener('click',function(){
    timers.forEach(clearTimeout); timers=[];
    if(state==='cook'){
      state='drinking'; btn.disabled=true; after.textContent='咕嘟……';
      pot.classList.add('drinking');
      later(function(){ pot.classList.add('m1'); },380);
      later(function(){ pot.classList.add('m2'); },760);
      later(function(){ pot.classList.add('m3'); },1140);
      later(function(){
        pot.classList.add('full'); state='full'; btn.disabled=false; btn.textContent='再煮一锅';
        after.textContent='喝完了。明天接着许愿，接着施工。';
        var bs=pot.querySelectorAll('.ball'); for(var i=0;i<bs.length;i++) (function(b,d){ setTimeout(function(){ flash(b,'poke',700); },d); })(bs[i],i*140);
      },1500);
    }else if(state==='full'){
      pot.classList.remove('drinking','m1','m2','m3','full'); state='cook'; btn.textContent='喝了'; after.textContent='';
    }
  });
})();
</script>
</body>
</html>
