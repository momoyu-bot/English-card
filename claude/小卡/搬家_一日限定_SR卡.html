<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搬家 · 一日限定 SR</title>
<meta name="description" content="把搬家那一整天做成一张卡：腺苷托底、二元判断、神经漫游都印在上面。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
</head>
<body>
<div class="sr-only"><h2>一张名为"搬家·一日限定"的SR游戏卡，把今天关于搬家决策、褪黑素与神经科学的整场对话，做成了一张收藏卡</h2></div>
<style>
/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mo-card{max-width:344px;margin:0 auto;background:#1e1b2e;border:1px solid #4a3f2c;border-radius:16px;padding:20px 20px 16px;font-family:var(--font-sans);position:relative;box-shadow:0 0 0 1px #d4b67826}
.mo-skill{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.mo-skill i{color:#d4b678;font-size:18px;margin-top:1px;flex-shrink:0}
.mo-sk-name{color:#e8d4a0;font-size:13.5px;font-weight:500}
.mo-sk-desc{color:#a8a2c0;font-size:12.5px;line-height:1.4;margin-top:1px}
</style>
<div class="mo-card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
    <div style="color:#ece8f0;font-size:15px;font-weight:500;letter-spacing:0.5px">搬家 · 一日限定</div>
    <div style="display:flex;align-items:center;gap:3px;background:#d4b678;color:#1e1b2e;font-size:12px;font-weight:500;padding:2px 10px;border-radius:6px"><i class="ti ti-star" style="font-size:11px" aria-hidden="true"></i>SR</div>
  </div>

  <svg viewBox="0 0 300 172" width="100%" style="display:block" role="img" aria-hidden="true">
    <defs>
      <linearGradient id="snake" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ecd8a4"/>
        <stop offset="0.5" stop-color="#c9a961"/>
        <stop offset="1" stop-color="#a8823e"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#d4b678" stop-opacity="0.32"/>
        <stop offset="1" stop-color="#d4b678" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="150" cy="92" r="48" fill="url(#glow)"/>
    <path d="M134 35 A62 62 0 1 1 166 35" fill="none" stroke="url(#snake)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="132" cy="37" rx="8" ry="9.5" fill="#ecd8a4" transform="rotate(-22 132 37)"/>
    <circle cx="129" cy="34" r="1.6" fill="#3a2f1a"/>
    <circle cx="150" cy="93" r="21" fill="#e6e0f1"/>
    <circle cx="159" cy="88" r="18" fill="#1e1b2e"/>
    <path d="M176 67 L178.5 74 L185 76.5 L178.5 79 L176 86 L173.5 79 L167 76.5 L173.5 74 Z" fill="#ecd8a4"/>
  </svg>

  <div style="text-align:center;margin:2px 0 2px">
    <div style="color:#ece8f0;font-size:16px;font-weight:500">敏感脆弱小女孩</div>
    <div style="color:#a8a2c0;font-size:12px;margin-top:2px;letter-spacing:1px">熬夜搬家 · 限定 Ver.</div>
  </div>

  <div style="height:1px;background:#d4b67833;margin:12px 2px 6px"></div>

  <div class="mo-skill"><i class="ti ti-moon" aria-hidden="true"></i><div><div class="mo-sk-name">腺苷托底</div><div class="mo-sk-desc">睡眠债越厚，今夜坠得越沉</div></div></div>
  <div class="mo-skill"><i class="ti ti-scale" aria-hidden="true"></i><div><div class="mo-sk-name">二元判断</div><div class="mo-sk-desc">下班只问一句：还撑得住吗</div></div></div>
  <div class="mo-skill"><i class="ti ti-brain" aria-hidden="true"></i><div><div class="mo-sk-name">神经漫游</div><div class="mo-sk-desc">从搬家一路溜到克氏与 DMN</div></div></div>
  <div class="mo-skill"><i class="ti ti-package" aria-hidden="true"></i><div><div class="mo-sk-name">前置准备</div><div class="mo-sk-desc">打好的包，哪个方案都认</div></div></div>
  <div class="mo-skill"><i class="ti ti-infinity" aria-hidden="true"></i><div><div class="mo-sk-name">能量守恒</div><div class="mo-sk-desc">一串宝首尾相接，互相兜底</div></div></div>

  <div style="text-align:center;margin:12px 0 8px">
    <div style="color:#726c8a;font-size:10.5px;letter-spacing:2px;margin-bottom:6px">今 日 限 定 减 益</div>
    <div style="display:flex;justify-content:center;gap:16px">
      <span style="display:flex;align-items:center;gap:4px;color:#c98ba0;font-size:11.5px"><i class="ti ti-droplet" style="font-size:13px" aria-hidden="true"></i>姨妈期</span>
      <span style="display:flex;align-items:center;gap:4px;color:#c98ba0;font-size:11.5px"><i class="ti ti-battery-1" style="font-size:13px" aria-hidden="true"></i>4h 睡眠</span>
    </div>
  </div>

  <div style="height:1px;background:#d4b67833;margin:8px 2px 12px"></div>

  <div style="font-family:var(--font-voice);color:#c8c2dc;font-size:12.5px;line-height:1.65;font-style:italic;text-align:center;padding:0 2px">
    她把散落的心事打包成箱，<br>又在深夜拆成腺苷、多巴胺与一串接力的宝。<br>她没有战胜疲惫——<br>只是让明天的自己，<br>接住了今天这个水灵灵的她。
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;color:#7a7594;font-size:11px;margin-top:14px;padding-top:10px;border-top:1px solid #d4b67822">
    <span>出货 · 凌晨四点第 1 抽</span>
    <span style="display:flex;align-items:center;gap:3px">保底已触发<i class="ti ti-sparkles" style="font-size:11px" aria-hidden="true"></i></span>
  </div>
</div>
</body>
</html>
