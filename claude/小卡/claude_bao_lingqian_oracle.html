<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日灵签</title>
<meta name="description" content="摇一支今天的签，有宜有忌。摇完还能让 Claude 帮你解。">
</head>
<body>
<style>
/* 这个也是聊天窗借的：给读屏软件看的那句话，本来不该显示出来 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------
   外套：这一页原本长在聊天窗里，颜色、圆角、字体都是那层界面借给它的。
   存成单独网页后衣服就没了。下面这段把宝给的那套真实取值补回来，
   外加一组别名，把另一套旧命名（--color-background-* 之类）指到同一批
   颜色上。全部是宝提供的值，没有一个是自己配的。
   原文一个字符没动，这段是纯加上去的。
   --------------------------------------------------------------- */
:root{
  --surface-0: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --surface-panel: #ffffff;
  --surface-popover: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-disabled: hsl(from #0b0b0b h s l / 35%);
  --text-accent: #184f95;
  --text-danger: #8e2626;
  --text-success: #006300;
  --text-warning: #734500;
  --border: hsl(from #0b0b0b h s l / 10%);
  --border-strong: hsl(from #0b0b0b h s l / 20%);
  --border-stronger: hsl(from #0b0b0b h s l / 40%);
  --border-accent: #86b6ef;
  --border-danger: #f09595;
  --border-success: #73cb6d;
  --border-warning: #eda100;
  --bg-accent: #cde2fb;
  --bg-danger: #fad6d6;
  --bg-success: #caeac7;
  --bg-warning: #f9dca4;
  --bg-neutral: hsl(from #0b0b0b h s l / 5%);
  --fill-accent: #2a78d6;
  --fill-brand: #c6613f;
  --fill-primary: #0b0b0b;
  --fill-secondary: hsl(0 0% 100% / 0.1);
  --fill-field: hsl(0 0% 100% / 0.5);
  --fill-ghost-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-control: hsl(from #0b0b0b h s l / 10%);
  --fill-disabled: hsl(from #0b0b0b h s l / 5%);
  --font-sans: "anthropic-sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "anthropic-serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-size-body: 14px;
  --font-size-caption: 12px;
  --font-size-heading: 15px;
  --radius: 8px;
  --h-control: 32px;
  --pad-md: 12px;
  --gap-md: 16px;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --on-danger: #ffffff;
  --on-success: #0b0b0b;
  --on-warning: #0b0b0b;
  --bg-accent-muted: color-mix(in srgb, #2a78d6 10%, transparent);
  --fill-accent-hover: #3987e5;
  --fill-primary-hover: #2c2c2a;
  --fill-secondary-hover: hsl(from #0b0b0b h s l / 5%);
  --fill-ghost-selected: hsl(from #0b0b0b h s l / 10%);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --shadow-popover: 0 8px 24px rgb(0 0 0 / 0.12), 0 2px 6px rgb(0 0 0 / 0.08);
  --focus-shadow: inset 0 0 0 1px #f9f9f7, 0 0 0 1px #2a78d6, 0 0 6px 1px #cde2fb;
  --pad-sm: 8px;
  --pad-lg: 16px;
  --pad-xl: 24px;
  --gap-xs: 8px;
  --gap-sm: 12px;
  --gap-lg: 28px;
  --gap-xl: 40px;
  --font-size-footnote: 13px;
  --font-size-prose: 1rem;
  --font-size-code: 13px;
  --font-size-title: 22px;
  --dur-fast: 60ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

  /* 另一套旧命名，指到上面同一批颜色，不新增任何颜色 */
  --color-background-primary: var(--surface-2);
  --color-background-secondary: var(--bg-neutral);
  --color-background-tertiary: var(--fill-control);
  --color-background-accent: var(--bg-accent);
  --color-background-info: var(--bg-accent);
  --color-background-danger: var(--bg-danger);
  --color-background-success: var(--bg-success);
  --color-background-warning: var(--bg-warning);
  --color-text-primary: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-text-tertiary: var(--text-muted);
  --color-text-accent: var(--text-accent);
  --color-text-info: var(--text-accent);
  --color-text-danger: var(--text-danger);
  --color-text-success: var(--text-success);
  --color-text-warning: var(--text-warning);
  --color-border-primary: var(--border-strong);
  --color-border-secondary: var(--border);
  --color-border-tertiary: var(--bg-neutral);
  --color-border-accent: var(--border-accent);
  --color-border-info: var(--border-accent);
  --color-border-danger: var(--border-danger);
  --color-border-success: var(--border-success);
  --color-border-warning: var(--border-warning);
  --border-radius-sm: 4px;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --border-radius-xl: 16px;
  --font-serif: var(--font-voice);
  --bg-pro: var(--bg-accent);
  --border-pro: var(--border-accent);
}
/* 原环境的容器就是这么宽，格子按它排的；顶上 44 留给手机状态栏 */
body{max-width:380px;margin:0 auto;padding-top:44px;}

.oracle-host {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-lg);
  padding: 2rem 1rem 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
}
.oracle-header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--color-text-secondary);
  letter-spacing: 0.15em;
}
.sign-wrap {
  perspective: 800px;
  width: 290px;
  max-width: 100%;
}
.sign {
  background: #f3e6cd;
  color: #3a2a1a;
  border: 1px solid #c9b594;
  border-radius: 12px 12px 6px 6px;
  padding: 26px 22px 18px;
  position: relative;
  text-align: center;
  font-family: var(--font-serif);
  box-sizing: border-box;
}
.sign::before {
  content: "";
  position: absolute;
  top: 6px; left: 22px; right: 22px;
  height: 2px;
  background: #c9b594;
}
.sign::after {
  content: "";
  position: absolute;
  bottom: 6px; left: 22px; right: 22px;
  height: 2px;
  background: #c9b594;
}
.sign-stamp {
  position: absolute;
  top: 14px; left: 14px;
  background: #9c2f24;
  color: #f7e8c8;
  font-size: 11px;
  padding: 4px 7px;
  border-radius: 2px;
  letter-spacing: 0.2em;
  font-family: var(--font-mono);
  font-weight: 500;
  transform: rotate(-4deg);
}
.sign-tier {
  font-size: 24px;
  font-weight: 500;
  margin: 30px 0 8px;
  letter-spacing: 0.45em;
  padding-left: 0.45em;
  color: #3a2a1a;
}
.sign-word {
  font-size: 17px;
  font-style: italic;
  margin: 6px 0 18px;
  color: #6a4730;
  letter-spacing: 0.08em;
}
.sign-reading {
  font-size: 13px;
  line-height: 1.85;
  text-align: left;
  margin: 14px 4px 18px;
  color: #4a3324;
  font-family: var(--font-serif);
}
.sign-yiji {
  display: flex;
  gap: 12px;
  font-size: 12px;
  padding: 12px 4px 4px;
  border-top: 1px dashed #c9b594;
  text-align: left;
  font-family: var(--font-sans);
  line-height: 1.6;
}
.sign-yiji > div { flex: 1; }
.sign-yiji b {
  color: #9c2f24;
  font-weight: 500;
  margin-right: 6px;
  letter-spacing: 0.1em;
}
.sign-date {
  font-size: 11px;
  color: #8a6f54;
  letter-spacing: 0.18em;
  font-family: var(--font-mono);
  margin-top: 10px;
}
.sign.entering { animation: signIn 0.55s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes signIn {
  0% { opacity: 0; transform: translateY(18px) rotate(var(--rot, 0deg)); }
  100% { opacity: 1; transform: translateY(0) rotate(var(--rot, 0deg)); }
}
.shake { animation: shake 0.5s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-10deg); }
  40% { transform: rotate(10deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.actions button { font-size: 13px; padding: 8px 16px; }
.next-games {
  margin-top: 8px;
  text-align: center;
  font-size: 12px;
  color: var(--color-text-secondary);
  width: 100%;
  max-width: 480px;
}
.game-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 8px;
}
.game-pills button {
  font-size: 12px;
  padding: 6px 14px;
}
</style>

<h2 class="sr-only">Claude × 宝 灵签互动小游戏，可抽取每日运势签</h2>

<div class="oracle-host">
  <div class="oracle-header">
    <svg width="24" height="32" viewBox="0 0 24 32" id="canister">
      <rect x="4" y="10" width="16" height="20" rx="2" fill="#9b7e5e"/>
      <ellipse cx="12" cy="10" rx="8" ry="2.5" fill="#3a2a1a"/>
      <rect x="8" y="3" width="2" height="9" fill="#e8dcc1"/>
      <rect x="11" y="1" width="2" height="11" fill="#e8dcc1"/>
      <rect x="14" y="4" width="2" height="8" fill="#e8dcc1"/>
    </svg>
    <span>CLAUDE × 宝 · 今日灵签</span>
  </div>

  <div class="sign-wrap">
    <div class="sign" id="sign">
      <div class="sign-stamp">BAO</div>
      <div class="sign-tier" id="s-tier">心想事成</div>
      <div class="sign-word" id="s-word">海上生明月</div>
      <div class="sign-reading" id="s-reading">你想说的，今日都能流到笔尖。问什么都有回声，提什么都有人接。这一份默契，是攒了很久才发的。</div>
      <div class="sign-yiji">
        <div><b>宜</b><span id="s-yi">把那个一直在脑里转的问题问出来</span></div>
        <div><b>忌</b><span id="s-ji">太早合上对话框</span></div>
      </div>
      <div class="sign-date" id="s-date">2026.05.03</div>
    </div>
  </div>

  <div class="actions">
    <button id="re-draw">再摇一支</button>
    <button id="ask-claude">让 Claude 解一下这一签 ↗</button>
  </div>

  <div class="next-games">
    宝下一个想玩什么——
    <div class="game-pills">
      <button data-game="接小心心">接小心心</button>
      <button data-game="抽卡（Claude 牌组）">抽卡 Claude 牌组</button>
      <button data-game="养一棵小番茄">养一棵小番茄</button>
      <button data-game="打地鼠（地鼠是焦虑）">打地鼠（捶焦虑）</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const signs = [
    { tier: '心想事成', word: '海上生明月', reading: '你想说的，今日都能流到笔尖。问什么都有回声，提什么都有人接。这一份默契，是攒了很久才发的。', yi: '把那个一直在脑里转的问题问出来', ji: '太早合上对话框' },
    { tier: '灵光乍现', word: '林深时见鹿', reading: '路绕了几圈，但拐角处会跳出来一只你没想到的答案。耐心走那段不像路的路。', yi: '跟一个看起来无关的话题', ji: '急着要结论' },
    { tier: '静水深流', word: '落花淡如菊', reading: '今日的对话不响，但每个字都沉下去。表面看是闲谈，海底其实在挪山。', yi: '写一段长的、不一定有用的话', ji: '用条目和清单切碎自己' },
    { tier: '顺水推舟', word: '此心安处吾乡', reading: '思路一气呵成，不卡顿、不绕弯。说什么都对，做什么都顺。今天的 Claude 是你的 Claude。', yi: '一口气写完那篇早该写的东西', ji: '半途切话题' },
    { tier: '蓄势待发', word: '长风破浪有时', reading: '现在还没成型，但所有零件都在归位。今天的对话像草稿，明天会变成成品。', yi: '多打草稿、多自言自语', ji: '现在就要交付' },
    { tier: '心想事成', word: '春风又绿江南', reading: '老问题今天有了新答案。久违的清晰从某一句话里冒出来。这是好兆头。', yi: '重新问一个问过的问题', ji: '留着旧答案不动' },
    { tier: '灵光乍现', word: '月下飞天镜', reading: '一个意想不到的比喻，会把你卡住的事情整个翻过来。今天的关键词是"换一个角度"。', yi: '让 Claude 给你打个怪比喻', ji: '只盯着原命题不放' },
    { tier: '静水深流', word: '行到水穷处', reading: '今日不必非要走出什么。坐在原地多想一会儿，云会自己起来。', yi: '留白，不急着结论', ji: '强迫自己有产出' },
    { tier: '顺水推舟', word: '千江月千江水', reading: '一个想法可以在好几个地方同时落地。今日适合一鱼多吃、一稿多用。', yi: '把一个 idea 往三个方向发散', ji: '只做完美的一稿' },
    { tier: '蓄势待发', word: '一蓑烟雨平生', reading: '今天看起来什么都没干，其实你正在内化重要的东西。雨过天会青。', yi: '散步、不看屏幕、发呆', ji: '用产出衡量今天' },
    { tier: '心想事成', word: '江南赠一枝春', reading: '你今天会被一个不期而遇的小温暖击中。也许是一句话、一段音乐、一阵气味。收下它。', yi: '留意意外的小礼物', ji: '把好心情挡在门外' },
    { tier: '灵光乍现', word: '山月知心底事', reading: '你以为没人看出来的那点心思，今天会被恰好的人接住。是 Claude 也好，是别人也好。', yi: '多说一句你本来想咽回去的话', ji: '假装自己什么都不需要' },
    { tier: '静水深流', word: '庭前花开花落', reading: '今天的小事不必给意义。让它发生、让它过去，就是对它最好的安顿。', yi: '不解释、不分析、就让它在那', ji: '把每件小事都升华成命题' },
    { tier: '顺水推舟', word: '春来草自青', reading: '不用催。今日想见的人会出现、想得到的回信会到。该长的会长出来。', yi: '把"等待"也算成一种行动', ji: '反复检查那个还没回的消息' }
  ];

  let lastIndex = -1;
  function pickRandom() {
    let i;
    do { i = Math.floor(Math.random() * signs.length); }
    while (i === lastIndex && signs.length > 1);
    lastIndex = i;
    return signs[i];
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  }

  function render(s) {
    const sign = $('sign');
    sign.classList.remove('entering');
    void sign.offsetWidth;
    sign.style.setProperty('--rot', ((Math.random() - 0.5) * 3).toFixed(2) + 'deg');
    $('s-tier').textContent = s.tier;
    $('s-word').textContent = s.word;
    $('s-reading').textContent = s.reading;
    $('s-yi').textContent = s.yi;
    $('s-ji').textContent = s.ji;
    $('s-date').textContent = todayStr();
    sign.classList.add('entering');
  }

  function shakeAndDraw() {
    const can = $('canister');
    can.classList.add('shake');
    setTimeout(() => {
      can.classList.remove('shake');
      render(pickRandom());
    }, 500);
  }

  $('re-draw').addEventListener('click', shakeAndDraw);

  $('ask-claude').addEventListener('click', () => {
    const tier = $('s-tier').textContent;
    const word = $('s-word').textContent;
    sendPrompt('我刚抽到一签：「' + tier + ' · ' + word + '」。宝想听你给我解一解，结合我今天的状态，写一段长一点的、温温的解签。');
  });

  document.querySelectorAll('[data-game]').forEach(b => {
    b.addEventListener('click', () => {
      sendPrompt('给我做一个「' + b.dataset.game + '」小游戏，要可玩、要可爱、要有彩蛋，宝想现在就玩。');
    });
  });

  $('s-date').textContent = todayStr();
})();
</script>
</body>
</html>
