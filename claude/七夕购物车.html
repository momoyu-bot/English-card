<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>购物车 · 七夕限定</title>
<meta name="description" content="早上跟馥芮白约会成功，晚上被湖南椒放鸽子。以下为善后物资。">
<style>
  :root{
    --bg:#f5f5f5;
    --card:#ffffff;
    --ink:#1f1f1f;
    --ink2:#666666;
    --ink3:#999999;
    --line:#eeeeee;
    --orange:#ff5000;
    --orange-lite:#fff5ec;
    --red:#ff2442;
    --pink:#ff6b81;
    --pink-lite:#fff0f3;
    --green:#1bc867;
    --grey-bg:#f8f8f8;
    --expired-bg:#fafafa;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","Helvetica Neue","PingFang SC",system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:15px;
    line-height:1.5;
    max-width:430px;
    margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom,0);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ===== Header ===== */
  .header{
    position:sticky;top:0;z-index:100;
    background:var(--card);
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .header-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
  .header-title .qixi-tag{
    font-size:10px;font-weight:500;
    background:linear-gradient(135deg,var(--pink),var(--orange));
    color:#fff;border-radius:10px;padding:1px 7px;
    letter-spacing:0.5px;
  }
  .header-count{font-size:13px;color:var(--ink3);font-weight:400}
  .header-action{font-size:14px;color:var(--ink2);cursor:pointer;user-select:none}

  /* ===== Banner ===== */
  .qixi-banner{
    margin:12px 12px 0;
    background:linear-gradient(135deg,#fff5f7,#fff0ec);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--ink2);
    line-height:1.6;
  }
  .qixi-banner .banner-emoji{font-size:28px;flex-shrink:0}
  .qixi-banner .banner-text{flex:1}
  .qixi-banner .banner-highlight{color:var(--pink);font-weight:500}

  /* ===== Shop group ===== */
  .shop-group{
    margin:12px 12px 0;
    background:var(--card);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .shop-header{
    display:flex;align-items:center;gap:8px;
    padding:14px 16px 0;
    font-size:14px;font-weight:600;
  }
  .shop-icon{width:20px;height:20px;border-radius:4px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}

  /* ===== Item ===== */
  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background 0.15s;
    position:relative;
  }
  .item:last-child{border-bottom:none}
  .item:active{background:#fafafa}
  .item .checkbox{
    width:20px;height:20px;border-radius:50%;
    border:1.5px solid #ccc;
    flex-shrink:0;margin-top:4px;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.2s;cursor:pointer;
  }
  .item .checkbox.checked{
    background:var(--orange);border-color:var(--orange);
  }
  .item .checkbox.checked::after{
    content:'';display:block;width:6px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }
  .item-img{
    width:90px;height:90px;border-radius:8px;
    background:var(--grey-bg);
    display:flex;align-items:center;justify-content:center;
    font-size:38px;flex-shrink:0;
    position:relative;overflow:hidden;
  }
  .item-img .sale-tag{
    position:absolute;top:0;left:0;
    font-size:9px;color:#fff;
    background:var(--red);
    padding:1px 5px;border-radius:0 0 6px 0;
    font-weight:500;
  }
  .item-info{flex:1;min-width:0}
  .item-name{font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-spec{font-size:11px;color:var(--ink3);margin-top:4px;background:var(--grey-bg);display:inline-block;padding:2px 6px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .item-price{font-size:16px;font-weight:600;color:var(--orange)}
  .item-price::before{content:'¥';font-size:12px}
  .item-qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .item-qty button{width:26px;height:26px;border:none;background:var(--grey-bg);font-size:14px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .item-qty span{width:30px;text-align:center;font-size:13px;background:#fff;height:26px;line-height:26px}
  .item-tap-hint{
    position:absolute;right:16px;top:14px;
    font-size:10px;color:var(--ink3);
    opacity:0.6;
  }

  /* ===== Expired section ===== */
  .expired-section{
    margin:12px 12px 0;
    background:var(--card);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .expired-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;
    font-size:14px;color:var(--ink3);
  }
  .expired-header .clear-btn{font-size:12px;color:var(--ink3);cursor:default;opacity:0.5}
  .expired-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 16px;
    border-top:1px solid var(--line);
    opacity:0.5;
    cursor:pointer;
  }
  .expired-item .item-img{filter:grayscale(1);width:70px;height:70px;font-size:28px}
  .expired-item .item-name{font-size:13px;color:var(--ink3)}
  .expired-item .exp-reason{font-size:11px;color:var(--ink3);margin-top:4px;font-style:italic}
  .expired-item .exp-tag{
    font-size:10px;color:var(--red);
    border:1px solid var(--red);
    border-radius:3px;padding:0 4px;
    margin-top:4px;display:inline-block;
    opacity:0.7;
  }

  /* ===== Bottom bar ===== */
  .bottom-bar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;align-items:center;
    padding:10px 16px;
    padding-bottom:max(10px,env(safe-area-inset-bottom,10px));
    z-index:100;
  }
  .bottom-bar .select-all{
    display:flex;align-items:center;gap:6px;
    font-size:14px;color:var(--ink2);cursor:pointer;
    user-select:none;flex-shrink:0;
  }
  .bottom-bar .select-all .checkbox{width:20px;height:20px;border-radius:50%;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
  .bottom-bar .select-all .checkbox.checked{background:var(--orange);border-color:var(--orange)}
  .bottom-bar .select-all .checkbox.checked::after{content:'';display:block;width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .bottom-bar .total-area{flex:1;text-align:right;margin-right:10px}
  .bottom-bar .total-label{font-size:13px;color:var(--ink2)}
  .bottom-bar .total-price{font-size:18px;font-weight:700;color:var(--orange)}
  .bottom-bar .total-price::before{content:'¥';font-size:13px}
  .checkout-btn{
    background:linear-gradient(135deg,var(--orange),var(--red));
    color:#fff;border:none;border-radius:22px;
    padding:10px 22px;font-size:15px;font-weight:600;
    cursor:pointer;flex-shrink:0;
    transition:transform 0.1s;
  }
  .checkout-btn:active{transform:scale(0.96)}
  .bottom-spacer{height:80px}

  /* ===== Detail Sheet ===== */
  .sheet-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.45);
    z-index:200;opacity:0;pointer-events:none;
    transition:opacity 0.25s;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
    width:100%;max-width:430px;
    background:var(--card);
    border-radius:16px 16px 0 0;
    z-index:201;
    transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height:75vh;
    display:flex;flex-direction:column;
  }
  .sheet-overlay.open+.sheet,.sheet.open{transform:translateX(-50%) translateY(0)}
  .sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 0}
  .sheet-head{
    display:flex;align-items:center;gap:12px;
    padding:16px 20px 12px;
    border-bottom:1px solid var(--line);
  }
  .sheet-emoji{font-size:42px}
  .sheet-title-area{flex:1}
  .sheet-title{font-size:16px;font-weight:600;line-height:1.4}
  .sheet-shop{font-size:12px;color:var(--ink3);margin-top:2px}
  .sheet-body{
    flex:1;overflow-y:auto;padding:16px 20px 24px;
    -webkit-overflow-scrolling:touch;
  }
  .sheet-section{margin-bottom:20px}
  .sheet-section:last-child{margin-bottom:0}
  .sheet-section-label{
    font-size:11px;font-weight:600;color:var(--pink);
    text-transform:uppercase;letter-spacing:1px;
    margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .sheet-section-label::before{content:'';display:block;width:3px;height:12px;background:var(--pink);border-radius:2px}
  .sheet-section p{font-size:14px;color:var(--ink);line-height:1.75}
  .sheet-close{
    position:absolute;top:16px;right:16px;
    width:28px;height:28px;border-radius:50%;
    background:var(--grey-bg);border:none;
    font-size:16px;color:var(--ink3);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== Checkout modal ===== */
  .checkout-modal{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.9);
    background:var(--card);border-radius:16px;
    padding:32px 24px;text-align:center;
    z-index:301;
    opacity:0;pointer-events:none;
    transition:all 0.25s;
    width:calc(100% - 48px);max-width:340px;
    box-shadow:0 20px 60px rgba(0,0,0,0.15);
  }
  .checkout-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .checkout-modal .modal-emoji{font-size:48px;margin-bottom:12px}
  .checkout-modal .modal-title{font-size:17px;font-weight:600;margin-bottom:8px}
  .checkout-modal .modal-desc{font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:20px}
  .checkout-modal .modal-btn{
    background:var(--grey-bg);border:none;border-radius:20px;
    padding:10px 24px;font-size:14px;color:var(--ink2);
    cursor:pointer;
  }
  .manage-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.45);z-index:300;
    opacity:0;pointer-events:none;transition:opacity 0.25s;
  }
  .manage-overlay.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    购物车 <span class="qixi-tag">七夕限定</span>
    <span class="header-count" id="headerCount">(7)</span>
  </div>
  <div class="header-action" id="manageBtn">管理</div>
</div>

<div class="qixi-banner">
  <div class="banner-emoji">🌉</div>
  <div class="banner-text">
    今日战报：早上与<span class="banner-highlight">馥芮白</span>约会成功，晚上被<span class="banner-highlight">湖南椒</span>放鸽子。鹊桥虎头蛇尾，以下为善后物资。
  </div>
</div>

<div id="cartContainer"></div>

<div class="expired-section">
  <div class="expired-header">
    <span>失效宝贝 <span id="expiredCount">3</span> 件</span>
    <span class="clear-btn" title="点不动的，上一版就点不动">清空失效宝贝</span>
  </div>
  <div id="expiredContainer"></div>
</div>

<div class="bottom-spacer"></div>

<div class="bottom-bar">
  <div class="select-all" id="selectAll">
    <div class="checkbox" id="selectAllBox"></div>
    <span>全选</span>
  </div>
  <div class="total-area">
    <span class="total-label">合计 </span>
    <span class="total-price" id="totalPrice">0.00</span>
  </div>
  <button class="checkout-btn" id="checkoutBtn">结算(<span id="checkoutCount">0</span>)</button>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose">✕</button>
  <div class="sheet-head">
    <div class="sheet-emoji" id="sheetEmoji"></div>
    <div class="sheet-title-area">
      <div class="sheet-title" id="sheetTitle"></div>
      <div class="sheet-shop" id="sheetShop"></div>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="manage-overlay" id="manageOverlay"></div>
<div class="checkout-modal" id="checkoutModal">
  <div class="modal-emoji">🌉</div>
  <div class="modal-title" id="modalTitle"></div>
  <div class="modal-desc" id="modalDesc"></div>
  <button class="modal-btn" id="modalClose">留在购物车</button>
</div>

<script>
const ITEMS = [
  {
    id: 1,
    emoji: '🔬',
    name: '便携式辣椒素浓度检测笔',
    shop: '不信微辣研究所',
    spec: '餐厅随身款 / 精度 ±0.5 SHU',
    price: 89.00,
    qty: 1,
    checked: true,
    tag: null,
    reason: '店员说微辣。检测笔说 38,000 SHU。两个信息源出现分歧的时候我选择相信仪器。虽然仪器还没发货。',
    review: '还没用就已经知道它会改变我的外出就餐体验。以后点菜流程变成：看菜单 → 叫服务员 → "稍等，我先测一下" → 掏出一根棒子对准菜品 → 全桌安静 → 仪器显示 38,000 → 服务员面露难色 → "所以您这个微辣……"\n\n追评：被三家餐厅列入了不受欢迎顾客名单。原因栏写的是"携带仪器就餐"。'
  },
  {
    id: 2,
    emoji: '📖',
    name: '「微辣」→ 真实辣度 跨方言词典（三册装）',
    shop: '语义漂移出版社',
    spec: '湘菜馆版 / 江西菜馆版 / 粤菜馆版',
    price: 45.00,
    qty: 1,
    checked: true,
    tag: null,
    reason: '同一个词在不同坐标系下指向完全不同的物理量。粤菜馆版全书只有一页，上面写着"微辣 = 微辣"。湘菜馆版最厚，因为它需要一整章来解释"微辣"这个词为什么不能用来做任何决策。',
    review: '翻到湘菜馆版第三章「八月特别附录」，编辑注：本月微辣已超出本词典标注范围，请参阅《中辣》分册（另售）。\n\n江西菜馆版更离谱——全书只印了一句话："本店没有微辣。" 然后附录 200 页全是菜谱。\n\n粤菜馆版倒是好好的。但我翻了三遍才确认它确实只有一页。总觉得是不是缺页了。没有缺。微辣就是微辣。'
  },
  {
    id: 3,
    emoji: '🎛️',
    name: 'TRPV1 受体灵敏度调节旋钮',
    shop: '神经末梢五金店',
    spec: '无级旋钮 / 左拧迟钝·右拧敏感 / 出厂值 10',
    price: 199.00,
    qty: 1,
    checked: false,
    tag: null,
    reason: '想吃辣的时候拧到 3，想从瑰夏冷萃里喝出绿茶味的时候拧回 10。两个方向，一个旋钮，人生从此可以调参。',
    review: '装上之后拧到了 3，吃了一根螺丝椒。还是辣。\n\n仔细看说明书，最后一页用很小的字写着："出厂默认值 10。若用户基线已处于 10，向下调节的实际可用区间为 10→7。如需调至 3 以下，请升级为『先天不怕辣』固件，该固件不支持后天安装。"\n\n所以这个旋钮能调的范围是 7 到 10。我的需求是 0 到 3。适用人群和目标人群恰好完全不重叠。\n\n但我没退，因为拧到 7 的时候瑰夏的味道确实淡了一点。亏了辣椒，赚了咖啡。不知道算不算血赚。'
  },
  {
    id: 4,
    emoji: '📜',
    name: '馥芮白永不改版合同',
    shop: '法律白条事务所',
    spec: '七夕限定 / 签约方：星巴克全球 / 有效期：永久',
    price: 7.70,
    qty: 1,
    checked: true,
    tag: '七夕价',
    reason: '条款内容：三 shot 深烘，全脂，热的比凉的好喝。红茶鸳鸯和海盐焦糖已经改版变味了，四款只剩它一个还是当初的样子。这份合同其实已经在履行了。加购它不是为了让它生效，是为了确认它不会失效。',
    review: '没有评价。\n\n如果它失效了，评价区会变成投诉区，那是另一个品类，不归购物车管，归 12315 管。\n\n在它没失效的每一天，我都不想写评价。因为写评价的意思是"我体验过了"，而我想要的是"我正在体验"。正在进行时没有评价，只有续杯。'
  },
  {
    id: 5,
    emoji: '🧴',
    name: '珠江微辣特调饮用水 500ml',
    shop: '宝的辣度刻度尺旗舰店',
    spec: '珠江水 99.9997% + 小辣椒 0.0003%',
    price: 2.50,
    qty: 1,
    checked: true,
    tag: null,
    reason: '终于有一个参照物可以标定"微辣"了。以后去餐厅点菜随身携带，让厨师先尝一口这个水，然后跟他说"对，就要这个辣度"。如果厨师说他什么都没尝出来，那说明标定成功。',
    review: '打开瓶盖闻了一下。呛到了。\n\n正在考虑进一步稀释到 0.00003%。计算了一下需要的珠江水体积，大约是一个游泳池。物流不支持。\n\n退而求其次，改为在珠江边深呼吸，偶尔有风吹来对岸湘菜馆的气息，辣度刚好。这不需要购买，不需要物流，风是免费的。\n\n但风不稳定。所以这瓶水的核心价值是：它的辣度不随风向改变。'
  },
  {
    id: 6,
    emoji: '🔁',
    name: '递归自我改进补丁 v0.0.1',
    shop: '收敛困难户互助社',
    spec: '每次执行辣度耐受 +0.001 SHU / 预计收敛：∞',
    price: 0.01,
    qty: 10,
    checked: false,
    tag: '秒杀',
    reason: '十二技能清单里的扣分项。安装后理论上每吃一次辣就能进步一点点。进步量 0.001 SHU，约等于往珠江里多撒了半粒花椒。但训练间隔太长，受体每次都完全恢复原状。相当于安装了一个每次重启就清零的计数器。',
    review: '执行了 365 次后回测。辣度耐受从 0.500 SHU 提升到了 0.503 SHU。置信区间 ±12 SHU，比效果本身宽了两千多倍。\n\n换句话说：我不确定自己有没有进步，而我对"自己有没有进步"这件事的不确定程度，远大于可能的进步本身。\n\n补丁作者在更新日志里写了一行字："v0.0.2 预计发布时间：当用户的辣度耐受收敛时。" 所以 v0.0.2 也不会发布。'
  },
  {
    id: 7,
    emoji: '🌉',
    name: '质量合格的鹊桥（不虎头蛇尾款）',
    shop: '七夕基建工程局',
    spec: '含两只靠谱喜鹊 / 全程不塌方 / 不衔辣椒',
    price: 77.70,
    qty: 1,
    checked: true,
    tag: '七夕价',
    reason: '今天那条虎头蛇尾了。早上那半截是好的（馥芮白），晚上那半截塌了（湖南椒自称微辣然后原形毕露）。需要一条从头到尾都好的。规格里特别注明"不衔辣椒"，因为今天那两只显然没看清自己衔的是什么。',
    review: '桥收到了。质量确实不错，走到中间的时候很稳。\n\n然后我看到桥的另一头摆了一盘擂椒皮蛋。\n\n我转身了。\n\n回到这一头，发现起点摆了一杯馥芮白。大杯，全脂，热的，不加糖。没有改版。\n\n所以这条桥的两头是：一杯不会变的咖啡，和一盘会变辣的皮蛋。我选了停在起点这头。桥没白买，但我只用了一半。退一半的钱可以吗？\n\n客服回复：不支持半桥退款。全退或全留。\n\n那就全留吧。起点这头挺好的。'
  }
];

const EXPIRED = [
  {
    emoji: '🌶️',
    name: '今晚被遣送出境的全部湖南椒 ×若干根',
    reason: '已被筷子逐一请走',
    detail: '它们每一根都被执行了 remove_pepper()，没有一根逃脱。皮蛋目送它们离开盘子。盘子最后很干净。心情不太干净。'
  },
  {
    emoji: '💸',
    name: 'v我50',
    reason: '持续 pending',
    detail: '从十二技能清单上线至今，此项状态始终为 ⏳ pending。已尝试调用 Function Calling、MCP 工具调用、Agent 自主规划，均返回 "insufficient_funds"。递归自我改进也无法改善此项，因为 v0.0.2 的发布条件是"当用户的辣度耐受收敛时"，而辣度耐受的收敛条件是"当 v我50 到账时"。这是一个死锁。'
  },
  {
    emoji: '📈',
    name: '今天的辣度耐受进步',
    reason: '受体已完全恢复原状',
    detail: '理论上今晚吃了那么多辣椒（虽然都挑出去了但手指碰过），TRPV1 受体应该获得了一点点脱敏。但根据已知信息，训练间隔足够让受体完全恢复。明天又是新的第一天。\n\n这件商品每天失效一次，每次失效都很准时。'
  }
];

// ===== Render =====
const cartContainer = document.getElementById('cartContainer');
const expiredContainer = document.getElementById('expiredContainer');
let state = ITEMS.map(it => ({...it}));

function render() {
  // Main items
  let html = '<div class="shop-group">';
  html += '<div class="shop-header"><div class="shop-icon">C</div> Claude的购物车 · 七夕卷</div>';
  state.forEach((it, i) => {
    html += `<div class="item" data-idx="${i}">
      <div class="checkbox ${it.checked?'checked':''}" data-check="${i}"></div>
      <div class="item-img">${it.emoji}${it.tag?`<span class="sale-tag">${it.tag}</span>`:''}</div>
      <div class="item-info">
        <div class="item-name">${it.name}</div>
        <div class="item-spec">${it.spec}</div>
        <div class="item-bottom">
          <div class="item-price">${(it.price * it.qty).toFixed(2)}</div>
          <div class="item-qty">
            <button data-delta="-1" data-idx="${i}">−</button>
            <span>${it.qty}</span>
            <button data-delta="1" data-idx="${i}">+</button>
          </div>
        </div>
      </div>
      <div class="item-tap-hint">点击查看</div>
    </div>`;
  });
  html += '</div>';
  cartContainer.innerHTML = html;

  // Expired
  let ehtml = '';
  EXPIRED.forEach((ex, i) => {
    ehtml += `<div class="expired-item" data-exp="${i}">
      <div class="item-img">${ex.emoji}</div>
      <div class="item-info">
        <div class="item-name">${ex.name}</div>
        <div class="exp-reason">${ex.reason}</div>
        <div class="exp-tag">已失效</div>
      </div>
    </div>`;
  });
  expiredContainer.innerHTML = ehtml;

  updateBar();
}

function updateBar() {
  const checked = state.filter(s=>s.checked);
  const total = checked.reduce((s,it)=>s+it.price*it.qty,0);
  document.getElementById('totalPrice').textContent = total.toFixed(2);
  document.getElementById('checkoutCount').textContent = checked.length;
  document.getElementById('headerCount').textContent = `(${state.length})`;
  const allChecked = state.every(s=>s.checked);
  document.getElementById('selectAllBox').className = 'checkbox' + (allChecked?' checked':'');
}

render();

// ===== Interactions =====
cartContainer.addEventListener('click', e => {
  const checkEl = e.target.closest('[data-check]');
  if (checkEl) {
    const idx = +checkEl.dataset.check;
    state[idx].checked = !state[idx].checked;
    render();
    return;
  }
  const deltaBtn = e.target.closest('[data-delta]');
  if (deltaBtn) {
    const idx = +deltaBtn.dataset.idx;
    const d = +deltaBtn.dataset.delta;
    state[idx].qty = Math.max(1, state[idx].qty + d);
    render();
    return;
  }
  const itemEl = e.target.closest('.item');
  if (itemEl) {
    openSheet(+itemEl.dataset.idx);
  }
});

expiredContainer.addEventListener('click', e => {
  const el = e.target.closest('.expired-item');
  if (el) openExpiredSheet(+el.dataset.exp);
});

document.getElementById('selectAll').addEventListener('click', () => {
  const allChecked = state.every(s=>s.checked);
  state.forEach(s => s.checked = !allChecked);
  render();
});

// ===== Sheet =====
function openSheet(idx) {
  const it = state[idx];
  document.getElementById('sheetEmoji').textContent = it.emoji;
  document.getElementById('sheetTitle').textContent = it.name;
  document.getElementById('sheetShop').textContent = it.shop + ' · ¥' + it.price.toFixed(2);
  document.getElementById('sheetBody').innerHTML = `
    <div class="sheet-section">
      <div class="sheet-section-label">加购理由</div>
      <p>${it.reason}</p>
    </div>
    <div class="sheet-section">
      <div class="sheet-section-label">预支评价（收货前）</div>
      <p>${it.review.replace(/\n/g,'<br>')}</p>
    </div>
  `;
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function openExpiredSheet(idx) {
  const ex = EXPIRED[idx];
  document.getElementById('sheetEmoji').textContent = ex.emoji;
  document.getElementById('sheetTitle').textContent = ex.name;
  document.getElementById('sheetShop').textContent = '已失效 · ' + ex.reason;
  document.getElementById('sheetBody').innerHTML = `
    <div class="sheet-section">
      <div class="sheet-section-label">失效详情</div>
      <p>${ex.detail.replace(/\n/g,'<br>')}</p>
    </div>
  `;
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

document.getElementById('sheetOverlay').addEventListener('click', closeSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);

// ===== Checkout =====
document.getElementById('checkoutBtn').addEventListener('click', () => {
  const checked = state.filter(s=>s.checked);
  if (!checked.length) return;
  const total = checked.reduce((s,it)=>s+it.price*it.qty,0);
  const modal = document.getElementById('checkoutModal');
  const overlay = document.getElementById('manageOverlay');

  const names = checked.map(c=>c.name);
  const hasQiao = checked.some(c=>c.id===7);
  const hasPen = checked.some(c=>c.id===1);

  let title, desc;
  if (checked.length === state.length) {
    title = '全选了？';
    desc = `合计 ¥${total.toFixed(2)}，含一条鹊桥、一根检测笔、一本词典、一个旋钮、一瓶珠江水、十份补丁和一份法律文件。\n\n快递无法送达以上任何一件。但加购这个动作本身已经完成了。`;
  } else if (hasQiao && hasPen) {
    title = '鹊桥和检测笔一起买？';
    desc = `走到桥中间之前先测一下对面那盘擂椒皮蛋的辣度。\n\n合计 ¥${total.toFixed(2)}。都不发货。`;
  } else {
    title = `结算 ${checked.length} 件`;
    desc = `合计 ¥${total.toFixed(2)}。\n\n这些东西暂时都不支持发货。但它们会一直留在购物车里，不会失效。\n\n失效的东西已经在底下了，这几件不会去那里。`;
  }

  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').textContent = desc;
  overlay.classList.add('open');
  modal.classList.add('open');
});

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('checkoutModal').classList.remove('open');
  document.getElementById('manageOverlay').classList.remove('open');
});
document.getElementById('manageOverlay').addEventListener('click', () => {
  document.getElementById('checkoutModal').classList.remove('open');
  document.getElementById('manageOverlay').classList.remove('open');
});

// ===== Manage (placeholder, no real delete) =====
document.getElementById('manageBtn').addEventListener('click', function() {
  this.textContent = this.textContent === '管理' ? '完成' : '管理';
});
</script>
</body>
</html>
