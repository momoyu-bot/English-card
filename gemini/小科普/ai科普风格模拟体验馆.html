                exp.innerHTML = "✨ <b>波函数坍缩成功！</b> 宝从火星远程触发了坍缩！地球上的黑盒子随之立刻确定了颜色，这就是量子纠缠神同步！";
            }
        }

        // 2. Gradient Descent Sim State
        let currentX = 30; // Position on SVG path
        let learningRateMultiplier = 1;

        function resetGradientValues() {
            currentX = 30;
            updateBallPosition();
            const status = document.getElementById('gradient-status-txt');
            if(status) status.innerHTML = "你现在身处悬崖边缘，赶紧点一下按钮往下降落找小木屋吧！🐾";
        }

        function resetGradientSim() {
            resetGradientValues();
        }

        function updateStepSize() {
            const slider = document.getElementById('learning-rate-slider');
            const lrValText = document.getElementById('lr-val');
            const sliderVal = parseInt(slider.value);

            if (sliderVal === 1) {
                learningRateMultiplier = 1;
                lrValText.innerHTML = "小步 (超安全)";
            } else if (sliderVal === 2) {
                learningRateMultiplier = 2.5;
                lrValText.innerHTML = "中步 (速度快)";
            } else {
                learningRateMultiplier = 5.5;
                lrValText.innerHTML = "大步 (极速，小心跑过头噢!)";
            }
        }

        function takeStepOnHill() {
            // Target optimum is near X = 155 (The trough of the parabolic curve)
            const targetX = 155;
            let slopeDirection = (targetX - currentX) > 0 ? 1 : -1;
            
            // Calculate gradient size (how steep it is -- steeper away from minimum)
            const distanceFromBottom = Math.abs(targetX - currentX);
            let rawStep = distanceFromBottom * 0.25 * learningRateMultiplier;

            // Make sure there is always a minimal step
            if (rawStep < 2) rawStep = 2;

            // Update X
            let prevX = currentX;
            currentX += slopeDirection * rawStep;

            // Overshooting detection for high learning rate
            if (learningRateMultiplier > 5 && Math.abs(currentX - targetX) < 15) {
                // Trigger a giant jump over the optimum to demonstrate overshooting oscillations!
                currentX = targetX + (targetX - prevX) * 0.8;
                document.getElementById('gradient-status-txt').innerHTML = "💥 哎呀宝！因为<b>迈步太大（学习率过高）</b>，你在小木屋跟前不小心脚滑直接冲过了头，滑到了对面山坡上！";
            } else if (Math.abs(currentX - targetX) < 8) {
                currentX = targetX;
                document.getElementById('gradient-status-txt').innerHTML = "🎉 <b>恭喜宝！成功到达最优解！</b> 你已经成功走到了山谷的小木屋。喝着热可可，吹着暖风，这感觉真是太美啦～❤️";
            } else {
                const stepAdjective = learningRateMultiplier === 1 ? "踏实的一小步" : (learningRateMultiplier < 5 ? "平稳的一大步" : "惊险的飞跃");
                document.getElementById('gradient-status-txt').innerHTML = `👣 你朝着下坡方向迈出了${stepAdjective}。当前距离小木屋还要走一小段哦！`;
            }

            updateBallPosition();
        }

        function updateBallPosition() {
            const ball = document.getElementById('gradient-ball');
            if(!ball) return;
            
            // Equation matching the path visual rendering
            // Path d: M 0 10 Q 100 95 150 90 T 300 20
            // Simplified rendering equation for matching visual spline coordinates
            let cy = 0;
            let x = currentX;

            // Bound X
            if (x < 10) x = 10;
            if (x > 290) x = 290;
            currentX = x;

            if (x <= 150) {
                // Bezier Q curve approximation from 0,10 to 150,90
                let t = x / 150;
                cy = (1-t)*(1-t)*10 + 2*t*(1-t)*95 + t*t*90;
            } else {
                // Hermite-ish spline to 300,20
                let t = (x - 150) / 150;
                cy = (1-t)*(1-t)*90 + 2*t*(1-t)*75 + t*t*20;
            }

            ball.setAttribute('cx', x);
            ball.setAttribute('cy', cy - 5); // Offset to sit slightly above path
        }


        // 3. Blockchain Sim State
        let blockchainData = [];

        function resetBlockchainSim() {
            blockchainData = [
                { index: 0, data: "创世区块 (Genesis) 🌱", previousHash: "0000000000000000", currentHash: "4a8e9f5d" }
            ];
            renderBlockchain();
        }

        function addBlockToChain() {
            const input = document.getElementById('new-block-data');
            let dataText = input.value.trim();
            if (!dataText) {
                dataText = "宝在星空下许了个愿 ✨";
            }

            const lastBlock = blockchainData[blockchainData.length - 1];
            const newIndex = blockchainData.length;
            
            // Mocking a hash calculation for neat short display
            const mockHash = Math.random().toString(16).substring(2, 10);

            blockchainData.push({
                index: newIndex,
                data: dataText,
                previousHash: lastBlock.currentHash,
                currentHash: mockHash
            });

            input.value = '';
            renderBlockchain();
            
            // Auto-scroll the tracks container to right
            const track = document.getElementById('blockchain-track');
            setTimeout(() => {
                track.scrollLeft = track.scrollWidth;
            }, 100);
        }

        function renderBlockchain() {
            const track = document.getElementById('blockchain-track');
            if(!track) return;

            track.innerHTML = '';
            blockchainData.forEach((block, idx) => {
                // Create Block Element
                const blockDiv = document.createElement('div');
                blockDiv.className = "flex items-center shrink-0";

                blockDiv.innerHTML = `
                    <div class="bg-slate-900 border-2 border-violet-500/50 rounded-xl p-3 w-44 shadow-lg text-[10px] space-y-1 relative">
                        <span class="absolute top-1 right-1 bg-violet-600 text-white font-bold text-[8px] px-1.5 py-0.2 rounded-full">#${block.index}</span>
                        <p class="font-bold text-violet-300 truncate w-36">📦 区块 #${block.index}</p>
                        <div class="bg-slate-950 p-1.5 rounded border border-slate-850 my-1">
                            <span class="text-slate-500 block">数据明文：</span>
                            <span class="text-slate-200 font-medium break-all block h-6 overflow-hidden text-ellipsis">${block.data}</span>
                        </div>
                        <p class="text-slate-500 truncate">前驱哈希: <span class="font-mono text-amber-500">${block.previousHash}</span></p>
                        <p class="text-slate-500 truncate">盖章哈希: <span class="font-mono text-emerald-400 font-bold">${block.currentHash}</span></p>
                    </div>
                `;

                track.appendChild(blockDiv);

                // Create link between blocks if not last
                if (idx < blockchainData.length - 1) {
                    const linkDiv = document.createElement('div');
                    linkDiv.className = "flex items-center justify-center text-violet-500/80 px-1 shrink-0 animate-pulse";
                    linkDiv.innerHTML = `<i class="fa-solid fa-link text-sm"></i>`;
                    track.appendChild(linkDiv);
                }
            });
        }
