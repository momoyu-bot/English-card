<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肥皂泡泡复印机 - 秒懂量子不可克隆</title>
<meta name="description" content="宝，复印机的原理是：必须先“看清（扫描）”原件，才能照着画出第二份。那魔法泡泡呢？">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }

        /* 肥皂泡泡的漂浮和发光动画 */
        .bubble {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(236, 72, 153, 0.3), rgba(6, 182, 212, 0.4), rgba(0, 0, 0, 0.1));
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5), 0 0 15px rgba(236, 72, 153, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }

        /* 泡泡破裂动画 */
        .pop-anim {
            animation: pop 0.3s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; filter: brightness(1); }
            50% { transform: scale(1.5); opacity: 0.8; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; filter: brightness(0); }
        }

        /* 扫描仪红外线动画 */
        .scanner-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #ef4444; /* red-500 */
            box-shadow: 0 0 15px #ef4444;
            opacity: 0;
            z-index: 30;
        }
        .scan-action {
            animation: scanMove 2s linear forwards;
        }
        @keyframes scanMove {
            0% { top: 0%; opacity: 1; }
            90% { top: 100%; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 输出物品的出现动画 */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col p-4 md:p-8 items-center justify-center">

    <div class="max-w-3xl w-full space-y-6">
        
        <!-- 头部解说 -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden text-center">
            <h1 class="text-2xl font-black text-white mb-2 flex items-center justify-center">
                <i class="fa-solid fa-soap text-pink-400 mr-3"></i> 泡泡复印机
            </h1>
            <p class="text-sm text-slate-300 leading-relaxed max-w-xl mx-auto">
                宝，复印机的原理是：<b>必须先“看清（扫描）”原件，才能照着画出第二份。</b><br>
                现在我们来对比一下，复印普通物体，和复印量子，到底有什么区别！
            </p>
        </div>

        <!-- 机器交互区 -->
        <div class="bg-slate-800 border-4 border-slate-700 rounded-3xl p-6 relative flex flex-col items-center shadow-2xl">
            
            <!-- 模式切换台 -->
            <div class="flex bg-slate-900 rounded-xl p-1 border border-slate-700 mb-8 w-full max-w-sm relative z-20 shadow-inner">
                <button id="btn-paper" onclick="setMode('paper')" class="flex-1 py-3 px-4 rounded-lg text-sm font-bold bg-amber-600 text-white transition-all shadow-md flex items-center justify-center">
                    📄 复印普通信纸
                </button>
                <button id="btn-bubble" onclick="setMode('bubble')" class="flex-1 py-3 px-4 rounded-lg text-sm font-bold text-slate-400 transition-all hover:text-slate-200 flex items-center justify-center">
                    🫧 复印魔法泡泡
                </button>
            </div>

            <div class="flex justify-between items-center w-full relative">
                
                <!-- 左侧输入区 -->
                <div class="w-1/3 flex flex-col items-center">
                    <p class="text-xs text-slate-500 font-bold mb-4 uppercase tracking-widest bg-slate-900 px-3 py-1 rounded-full">输入原件</p>
                    <div class="h-32 w-32 bg-slate-900/50 rounded-2xl border-2 border-dashed border-slate-600 flex items-center justify-center relative overflow-hidden">
                        
                        <!-- 纸张 -->
                        <div id="item-paper" class="text-6xl absolute transition-all duration-300">📄</div>
                        <!-- 泡泡 -->
                        <div id="item-bubble" class="w-16 h-16 rounded-full bubble absolute hidden flex items-center justify-center">
                            <span class="text-[8px] text-pink-900 font-bold opacity-60">绝密</span>
                        </div>
                        <!-- 水滴碎渣 (泡泡破裂后) -->
                        <div id="item-splash" class="text-4xl absolute hidden text-cyan-400 opacity-60">💦</div>

                        <!-- 扫描仪激光线 -->
                        <div id="scanner-beam" class="scanner-beam"></div>
                    </div>
                </div>

                <!-- 中间操作按钮 -->
                <div class="w-1/3 flex flex-col items-center justify-center">
                    <i class="fa-solid fa-arrow-right text-slate-600 text-3xl mb-4"></i>
                    <button id="btn-start" onclick="startScan()" class="bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 px-6 rounded-full transition-all shadow-[0_0_15px_rgba(139,92,246,0.5)] active:scale-95 flex flex-col items-center group">
                        <span class="text-lg mb-1 group-hover:-translate-y-1 transition-transform">按下开始复印</span>
                        <span class="text-[10px] text-violet-200 font-normal">扫描器将接触原件</span>
                    </button>
                </div>

                <!-- 右侧输出区 -->
                <div class="w-1/3 flex flex-col items-center">
                    <p class="text-xs text-slate-500 font-bold mb-4 uppercase tracking-widest bg-slate-900 px-3 py-1 rounded-full">输出结果</p>
                    <div class="h-32 w-full flex items-center justify-center space-x-2">
                        
                        <!-- 纸张输出 -->
                        <div id="output-paper" class="flex space-x-2 hidden">
                            <div class="text-5xl fade-in-up">📄</div>
                            <div class="text-5xl fade-in-up" style="animation-delay: 0.2s;">📄</div>
                        </div>

                        <!-- 水滴输出 -->
                        <div id="output-splash" class="flex space-x-2 hidden">
                            <div class="text-5xl fade-in-up text-cyan-400 opacity-60">💦</div>
                            <div class="text-5xl fade-in-up text-cyan-400 opacity-60" style="animation-delay: 0.2s;">💦</div>
                        </div>

                    </div>
                </div>

            </div>

            <!-- 解说提示框 -->
            <div id="status-board" class="mt-8 bg-slate-900 w-full p-5 rounded-2xl border border-slate-700 min-h-[100px] flex items-center justify-center text-center transition-all duration-300">
                <p id="status-text" class="text-sm text-slate-300 leading-relaxed">
                    宝，现在放进去的是一张普通的信纸。信纸是很坚固的。请点击中间的紫色按钮，让扫描仪“看”它一眼。
                </p>
            </div>

            <!-- 重新开始按钮 -->
            <button id="btn-reset" onclick="resetSim()" class="mt-4 text-xs text-slate-500 hover:text-slate-300 underline hidden transition-colors">
                <i class="fa-solid fa-rotate-right mr-1"></i> 再试一次
            </button>

        </div>
    </div>

    <script>
        let currentMode = 'paper';
        let isScanning = false;

        function setMode(mode) {
            if (isScanning) return;
            currentMode = mode;
            resetSim();

            const btnPaper = document.getElementById('btn-paper');
            const btnBubble = document.getElementById('btn-bubble');
            const itemPaper = document.getElementById('item-paper');
            const itemBubble = document.getElementById('item-bubble');
            const statusText = document.getElementById('status-text');

            if (mode === 'paper') {
                btnPaper.className = "flex-1 py-3 px-4 rounded-lg text-sm font-bold bg-amber-600 text-white transition-all shadow-md flex items-center justify-center";
                btnBubble.className = "flex-1 py-3 px-4 rounded-lg text-sm font-bold text-slate-400 transition-all hover:text-slate-200 flex items-center justify-center bg-transparent";
                
                itemPaper.classList.remove('hidden');
                itemBubble.classList.add('hidden');
                
                statusText.innerHTML = "宝，现在放进去的是一张<b>普通的信纸</b>。信纸是很坚固的。请点击中间的紫色按钮，让扫描仪“看”它一眼。";
            } else {
                btnBubble.className = "flex-1 py-3 px-4 rounded-lg text-sm font-bold bg-pink-600 text-white transition-all shadow-md flex items-center justify-center shadow-pink-600/30";
                btnPaper.className = "flex-1 py-3 px-4 rounded-lg text-sm font-bold text-slate-400 transition-all hover:text-slate-200 flex items-center justify-center bg-transparent";
                
                itemPaper.classList.add('hidden');
                itemBubble.classList.remove('hidden');

                statusText.innerHTML = "<span class='text-pink-400 font-bold'>【量子模式】</span>宝，现在放进去的是一个<b>极其脆弱的魔法肥皂泡</b>，上面写着绝密信息。请点击复印，看看扫描仪试图去“看”它时会发生什么！";
            }
        }

        function startScan() {
            if (isScanning) return;
            isScanning = true;

            const beam = document.getElementById('scanner-beam');
            const btnStart = document.getElementById('btn-start');
            const statusText = document.getElementById('status-text');

            // 按钮变灰
            btnStart.classList.replace('bg-violet-600', 'bg-slate-700');
            btnStart.classList.replace('hover:bg-violet-500', 'cursor-not-allowed');
            btnStart.disabled = true;

            // 开启扫描动画
            beam.classList.add('scan-action');
            statusText.innerHTML = "<span class='text-amber-400'>正在扫描中...</span> 机器的激光正在接触原件读取信息！";

            if (currentMode === 'paper') {
                // 纸张模式：无事发生，顺利复印
                setTimeout(() => {
                    document.getElementById('output-paper').classList.remove('hidden');
                    statusText.innerHTML = "<b class='text-emerald-400'>✅ 复印成功！</b><br>因为纸张是宏观物体（古典力学），你用手摸它、用激光扫它，它都<b>不会坏</b>。所以机器可以慢悠悠地看清它，然后完美复印出两份！";
                    document.getElementById('btn-reset').classList.remove('hidden');
                }, 2000); // 等待扫描线走完
            } else {
                // 泡泡模式：一扫就破
                setTimeout(() => {
                    const bubble = document.getElementById('item-bubble');
                    const splash = document.getElementById('item-splash');
                    
                    // 泡泡破裂！
                    bubble.classList.add('pop-anim');
                    
                    setTimeout(() => {
                        bubble.classList.add('hidden');
                        splash.classList.remove('hidden'); // 原件变成一滩水
                        
                        // 机器强行复印出来的也是一滩水
                        document.getElementById('output-splash').classList.remove('hidden');
                        
                        statusText.innerHTML = "<b class='text-red-400'>🚨 糟糕！泡泡破了！</b><br>这就是量子的真相：它太脆弱了！当机器的激光刚刚接触到泡泡想去“看”它时，它就<b>‘啪’的一下破成了一滩水滴（坍缩了）</b>！<br>机器根本没来得及看清它原来的花纹，只能尴尬地照着水滴的样子，给你复印出了两滩毫无意义的水！";
                        
                        document.getElementById('btn-reset').classList.remove('hidden');
                    }, 300); // 泡泡破裂动画时长
                    
                }, 800); // 激光走到一半的时候碰到泡泡
            }
        }

        function resetSim() {
            isScanning = false;
            
            // 重置UI元素
            document.getElementById('scanner-beam').classList.remove('scan-action');
            document.getElementById('output-paper').classList.add('hidden');
            document.getElementById('output-splash').classList.add('hidden');
            document.getElementById('item-splash').classList.add('hidden');
            document.getElementById('btn-reset').classList.add('hidden');
            
            const bubble = document.getElementById('item-bubble');
            bubble.classList.remove('pop-anim');
            
            const btnStart = document.getElementById('btn-start');
            btnStart.classList.replace('bg-slate-700', 'bg-violet-600');
            btnStart.classList.replace('cursor-not-allowed', 'hover:bg-violet-500');
            btnStart.disabled = false;

            // 重新设置文案
            if (currentMode === 'paper') {
                document.getElementById('item-paper').classList.remove('hidden');
                bubble.classList.add('hidden');
                document.getElementById('status-text').innerHTML = "宝，现在放进去的是一张<b>普通的信纸</b>。请点击复印。";
            } else {
                document.getElementById('item-paper').classList.add('hidden');
                bubble.classList.remove('hidden');
                document.getElementById('status-text').innerHTML = "<span class='text-pink-400 font-bold'>【量子模式】</span>宝，放进去的是一个<b>脆弱的魔法肥皂泡</b>。请点击复印。";
            }
        }
    </script>
</body>
</html>
