<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>色彩避难所 · 典藏版</title>
  <style>
    /* 基础光学纪律：暖石基底，同轴文字，拒绝纯黑 */
    :root {
      --bg-base: #F7F5F2; 
      --text-main: #423E3B; 
      --text-mute: #8C857F;
      --card-bg: #FFFFFF;
      --shadow-soft: rgba(110, 100, 95, 0.06);
      --shadow-hover: rgba(110, 100, 95, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 60px 24px;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-image: radial-gradient(var(--shadow-soft) 1px, transparent 0);
      background-size: 32px 32px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 60px auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 600;
      letter-spacing: 2px;
      margin: 0 0 16px 0;
    }

    p.subtitle {
      color: var(--text-mute);
      font-size: 15px;
      margin: 0;
      letter-spacing: 1px;
    }

    /* 瀑布流/网格布局 */
    .museum-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 卡片设计：隐形边框，柔和悬浮 */
    .palette-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px var(--shadow-soft), 0 2px 8px rgba(0,0,0,0.02);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .palette-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 24px 48px var(--shadow-hover), 0 4px 12px rgba(0,0,0,0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 500;
      margin: 0;
      color: var(--text-main);
    }

    .card-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--bg-base);
      color: var(--text-mute);
      letter-spacing: 0.5px;
    }

    /* 色块交互区 */
    .swatches {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .swatch-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .color-circle {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px; 
      cursor: pointer;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-radius 0.2s ease;
      position: relative;
    }

    .color-circle:hover {
      transform: scale(1.1);
      border-radius: 50%; 
      z-index: 10;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1), inset 0 2px 4px rgba(255,255,255,0.2);
    }

    .color-circle:active {
      transform: scale(0.95);
    }

    .hex-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--text-mute);
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }

    .swatch-item:hover .hex-code {
      color: var(--text-main);
      font-weight: 600;
    }

    /* 底部渐变展示带 */
    .gradient-preview {
      width: 100%;
      height: 16px;
      border-radius: 8px;
      opacity: 0.9;
    }

    /* 气泡提示 */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translate(-50%, 20px);
      background: var(--text-main);
      color: #FFF;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 12px 24px rgba(66, 62, 59, 0.25);
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 600px) {
      body { padding: 40px 16px; }
      .museum-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>色彩避难所 · 典藏版</h1>
    <p class="subtitle">点击色块复制 HEX 码，带着神仙配色去给大模型下指令</p>
  </header>

  <div class="museum-grid" id="grid">
    <!-- 卡片将通过 JS 渲染 -->
  </div>

  <div class="toast" id="toast">已复制色号</div>

  <script>
    // 数据库更新：加入黑白冷暖、极浅到极深渐变系列
    const colorDatabase = [
      {
        title: "五彩斑斓的白",
        tag: "冷月光 → 奶油",
        colors: ["#F2F4F8", "#F5F5F7", "#FAFAFA", "#FCFBF7", "#FFF9F0"] // 蓝白, 苹果白, 纯中性, 珍珠白, 奶油白
      },
      {
        title: "五彩斑斓的黑",
        tag: "冷钢 → 暖墨",
        colors: ["#0B0C10", "#111015", "#1C1C1C", "#14110F", "#1A1513"] // 偏青, 偏紫, 中性炭, 暖棕黑, 暖墨
      },
      {
        title: "冰川与深渊",
        tag: "浅蓝 → 藏青",
        colors: ["#E0F2FE", "#7DD3FC", "#0284C7", "#1E3A8A", "#082F49"] // 极浅冰蓝, 天蓝, 海渊蓝, 藏青, 极暗蓝
      },
      {
        title: "晨露祖母绿",
        tag: "薄荷 → 幽林",
        colors: ["#D1FAE5", "#34D399", "#059669", "#065F46", "#022C22"] // 薄荷白, 翠青, 宝石绿, 祖母绿, 深林暗绿
      },
      {
        title: "岁月与暗金",
        tag: "香槟 → 青铜",
        colors: ["#FEF08A", "#FBBF24", "#D97706", "#92400E", "#713F12"] // 浅香槟, 灿金, 琥珀金, 复古暗金, 沉淀青铜
      },
      {
        title: "芝加哥丝绒",
        tag: "重磅·公牛红",
        colors: ["#120A0B", "#3D0C11", "#8B1525", "#C8102E", "#E63946"]
      },
      {
        title: "暗夜深渊",
        tag: "幽闭·神秘紫",
        colors: ["#0B0719", "#1E1135", "#381859", "#562085", "#8343C2"]
      },
      {
        title: "复古宝石匣",
        tag: "低明度·奢华",
        colors: ["#0B1319", "#0F2537", "#0D474A", "#59114D", "#7A1325"]
      },
      {
        title: "揉碎的灰粉",
        tag: "莫兰迪·低饱",
        colors: ["#EAD2D4", "#DDB7BB", "#C59B9F", "#A47B80", "#78585D"]
      },
      {
        title: "初夏马卡龙",
        tag: "甜美·高明度",
        colors: ["#B7E0FF", "#CFEADC", "#FBEDCA", "#FFDCA4", "#FEDEE1"]
      },
      {
        title: "暖轴与可可",
        tag: "阅读·极度松弛",
        colors: ["#F9F8F7", "#F2EBE5", "#E8DED6", "#DAC6B7", "#5B5149"]
      },
      {
        title: "云顶青山",
        tag: "清冷·灰绿",
        colors: ["#E8ECEB", "#C2D1C8", "#9FB2A1", "#B6C2CE", "#96A4B1"]
      }
    ];

    const grid = document.getElementById('grid');
    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(hex) {
      toast.textContent = `已拾取色号：${hex} 🎨`;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function renderCards() {
      // 每次渲染前清空，确保不重复添加
      grid.innerHTML = '';
      
      colorDatabase.forEach(palette => {
        const card = document.createElement('div');
        card.className = 'palette-card';

        // 头部：标题与标签
        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `
          <h2 class="card-title">${palette.title}</h2>
          <span class="card-tag">${palette.tag}</span>
        `;
        card.appendChild(header);

        // 中间：可交互色块
        const swatchesContainer = document.createElement('div');
        swatchesContainer.className = 'swatches';

        palette.colors.forEach(hex => {
          const item = document.createElement('div');
          item.className = 'swatch-item';

          const circle = document.createElement('div');
          circle.className = 'color-circle';
          circle.style.backgroundColor = hex;
          
          circle.addEventListener('click', () => {
            navigator.clipboard.writeText(hex).then(() => showToast(hex));
          });

          const label = document.createElement('div');
          label.className = 'hex-code';
          label.textContent = hex.replace('#', '').toUpperCase();

          item.appendChild(circle);
          item.appendChild(label);
          swatchesContainer.appendChild(item);
        });

        card.appendChild(swatchesContainer);

        // 底部：渐变条
        const gradientBar = document.createElement('div');
        gradientBar.className = 'gradient-preview';
        gradientBar.style.background = `linear-gradient(90deg, ${palette.colors.join(', ')})`;
        card.appendChild(gradientBar);

        grid.appendChild(card);
      });
    }

    // 初始化渲染
    renderCards();
  </script>

</body>
</html>
