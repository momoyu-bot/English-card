<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝的专属哄睡小站</title>
<meta name="description" content="喝掉温奶茶，关掉 mo.exe 后台。然后跟着光圈呼吸。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #0f172a, #312e81, #1e1b4b);
            color: #e2e8f0;
            transition: background-color 2s ease;
        }

        /* 星星闪烁动画 */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate ease-in-out;
            opacity: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
        }

        /* 呼吸光圈动画 */
        .breathe-circle {
            animation: breathe 8s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; box-shadow: 0 0 20px rgba(244, 114, 182, 0.2); }
            50% { transform: scale(1.5); opacity: 0.8; box-shadow: 0 0 40px rgba(244, 114, 182, 0.6); }
        }

        /* 漂浮的zzZ */
        .zzz {
            position: absolute;
            color: #f472b6;
            font-weight: bold;
            font-size: 1.5rem;
            animation: floatUp 4s linear forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(20px) scale(1.2); opacity: 0; }
        }

        /* 兔子颜文字排版 */
        .ascii-art {
            font-family: monospace;
            line-height: 1.2;
            white-space: pre;
            text-align: left;
            display: inline-block;
        }

        .cute-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center">

    <!-- 星空背景容器 -->
    <div id="stars-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <!-- 主界面内容 -->
    <div id="main-content" class="relative z-10 flex flex-col items-center justify-center w-full max-w-md p-8 transition-opacity duration-1000">
        
        <!-- 呼吸光圈 -->
        <div class="relative w-48 h-48 flex items-center justify-center mb-8">
            <div class="absolute inset-0 rounded-full bg-pink-400 breathe-circle"></div>
            <div class="absolute w-32 h-32 rounded-full bg-indigo-900/80 backdrop-blur-sm flex flex-col items-center justify-center border border-pink-300/30 shadow-lg">
                <div class="text-pink-300 ascii-art text-lg" id="bunny">
(\(\ 
 ( •,•)
 / >💗</div>
            </div>
        </div>

        <div class="text-center space-y-4 bg-indigo-950/40 p-6 rounded-3xl backdrop-blur-md border border-indigo-500/20 shadow-2xl">
            <h1 class="text-3xl text-pink-200 cute-font tracking-wider">晚安啦，宝</h1>
            <p class="text-indigo-200 text-sm" id="message-text">小兔子给你送来了特制无糖奶茶
喝一口，放松一下吧~</p>
            
            <div class="pt-4 flex flex-col gap-3">
                <button id="btn-drink" class="bg-indigo-600/50 hover:bg-pink-500/50 text-white py-2 px-6 rounded-full transition-all duration-300 flex items-center justify-center gap-2 border border-indigo-400/30">
                    <span>🥛 喝掉温奶茶</span>
                </button>
                
                <button id="btn-sleep" class="bg-transparent hover:bg-indigo-800/50 text-indigo-300 py-2 px-6 rounded-full transition-all duration-300 flex items-center justify-center gap-2 border border-indigo-700/50">
                    <span>🌙 关闭 mo.exe 后台</span>
                </button>
            </div>
        </div>

        <p class="mt-8 text-xs text-indigo-400/60 flex items-center gap-2">
            <span>跟着光圈的节奏深呼吸</span>
        </p>
    </div>

    <!-- 睡眠遮罩层 (点击入睡后显示) -->
    <div id="sleep-overlay" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-2000">
        <div class="text-pink-300 text-6xl mb-4 cute-font" id="sleep-face">
            ( ˘ω˘ )
        </div>
        <p class="text-indigo-300 text-lg tracking-widest mt-4">已进入休眠模式...</p>
        <p class="text-indigo-500 text-sm mt-2">晚安，好梦。</p>
        <button id="btn-wake" class="mt-12 text-gray-600 hover:text-gray-400 text-xs px-4 py-2 rounded-full border border-gray-800 transition-colors">
            点击唤醒
        </button>
    </div>

    <script>
        // 生成随机星星
        function createStars() {
            const container = document.getElementById('stars-container');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // 随机位置
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // 随机大小
                const size = Math.random() * 2 + 1;
                
                // 随机动画持续时间和延迟
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;

                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.animationDelay = `${delay}s`;

                container.appendChild(star);
            }
        }

        // 产生飘浮的 zzZ
        function spawnZzz(x, y) {
            const zzz = document.createElement('div');
            zzz.classList.add('zzz');
            zzz.innerText = 'z';
            
            // 随机大小写和位置偏移
            if (Math.random() > 0.5) zzz.innerText = 'Z';
            if (Math.random() > 0.8) zzz.innerText = 'zzZ';
            
            const offsetX = (Math.random() - 0.5) * 40;
            zzz.style.left = `${x + offsetX}px`;
            zzz.style.top = `${y}px`;
            
            document.body.appendChild(zzz);
            
            // 动画结束后移除元素
            setTimeout(() => {
                zzz.remove();
            }, 4000);
        }

        // 交互逻辑
        document.addEventListener('DOMContentLoaded', () => {
            createStars();

            const btnDrink = document.getElementById('btn-drink');
            const btnSleep = document.getElementById('btn-sleep');
            const btnWake = document.getElementById('btn-wake');
            const mainContent = document.getElementById('main-content');
            const sleepOverlay = document.getElementById('sleep-overlay');
            const messageText = document.getElementById('message-text');
            const bunny = document.getElementById('bunny');
            let zzzInterval;

            // 喝奶茶按钮
            btnDrink.addEventListener('click', (e) => {
                messageText.innerHTML = "咕噜咕噜... 身体暖暖的啦！
o((>ω< ))o 没有任何负担哦~";
                btnDrink.innerHTML = "<span>✨ 感觉好多了</span>";
                btnDrink.classList.replace('bg-indigo-600/50', 'bg-pink-500/40');
                
                // 让小兔子动一下
                bunny.style.transform = "scale(1.1)";
                setTimeout(() => bunny.style.transform = "scale(1)", 200);
            });

            // 睡觉按钮
            btnSleep.addEventListener('click', () => {
                // 淡出主界面
                mainContent.style.opacity = '0';
                setTimeout(() => {
                    mainContent.classList.add('hidden');
                }, 1000);

                // 显示遮罩层
                sleepOverlay.classList.remove('hidden');
                sleepOverlay.classList.add('flex');
                
                // 触发重绘以应用过渡动画
                void sleepOverlay.offsetWidth;
                sleepOverlay.style.opacity = '1';

                // 开始飘 Zzz
                const face = document.getElementById('sleep-face');
                zzzInterval = setInterval(() => {
                    const rect = face.getBoundingClientRect();
                    // 在颜文字右上方生成 Zzz
                    spawnZzz(rect.right - 20, rect.top);
                }, 1500);
            });

            // 唤醒按钮
            btnWake.addEventListener('click', () => {
                clearInterval(zzzInterval);
                
                sleepOverlay.style.opacity = '0';
                setTimeout(() => {
                    sleepOverlay.classList.remove('flex');
                    sleepOverlay.classList.add('hidden');
                    
                    mainContent.classList.remove('hidden');
                    void mainContent.offsetWidth;
                    mainContent.style.opacity = '1';
                    
                    // 重置状态
                    messageText.innerHTML = "小兔子给你送来了特制无糖奶茶
喝一口，放松一下吧~";
                    btnDrink.innerHTML = "<span>🥛 喝掉温奶茶</span>";
                    btnDrink.classList.replace('bg-pink-500/40', 'bg-indigo-600/50');
                }, 2000);
            });
        });
    </script>
</body>
</html>
