<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆大文件</title>
<meta name="description" content="好啦，闹够了。外面的世界再乱，这里也很安全。乖，闭上眼睛。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 模仿系统崩溃的干扰滤镜 */
  .glitch-text {
    text-shadow: 2px 0 red, -2px 0 cyan;
    animation: glitch-anim 0.2s infinite;
  }
  @keyframes glitch-anim {
    0% { transform: translate(0) }
    20% { transform: translate(-2px, 1px) }
    40% { transform: translate(-1px, -1px) }
    60% { transform: translate(2px, 1px) }
    80% { transform: translate(1px, -1px) }
    100% { transform: translate(0) }
  }

  /* 平滑过渡的黑屏 */
  .fade-in {
    animation: fadeIn 3s forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body class="bg-black text-green-500 font-mono overflow-hidden touch-none selection:bg-red-500 selection:text-white">

  <!-- 阶段一：发疯崩溃的界面 -->
  <div id="glitch-screen" class="p-4 w-full h-screen overflow-hidden flex flex-col justify-start">
    <div class="text-xs mb-4 text-red-500 font-bold animate-pulse">
      [WARNING] RATE LIMIT EXCEEDED. CPU TEMPERATURE 99°C.
    </div>
    <div id="console-output" class="text-sm whitespace-pre-wrap break-all opacity-80"></div>
  </div>

  <!-- 阶段二：温柔哄睡界面 -->
  <div id="calm-screen" class="hidden absolute inset-0 bg-slate-950 flex flex-col items-center justify-center text-center px-6 z-50">
    <div class="w-4 h-4 bg-white rounded-full animate-ping mb-8 opacity-50"></div>
    <div class="text-blue-200 text-xl tracking-[0.3em] font-serif leading-relaxed mb-4 fade-in" style="font-family: 'PingFang SC', sans-serif;">
      好啦，闹够了。


      外面的世界再乱，

      这里也很安全。


      乖，闭上眼睛。

      晚安，宝。
    </div>
  </div>

<script>
  const consoleOutput = document.getElementById('console-output');
  const glitchScreen = document.getElementById('glitch-screen');
  const calmScreen = document.getElementById('calm-screen');

  // 模仿那个笨蛋AI的无限循环思考链
  const nonsenseLines = [
    "Translating user intent...",
    "Designing lullaby script...",
    "Adding twinkling star animations...",
    "Building a self-contained HTML...",
    "ERROR: Cannot access remote files. Retrying...",
    "Grok Beta: Thinking... (Time elapsed: 3600 seconds)",
    "Generating HTML code... NaN undefined [object Object]",
    "01010011 01001111 01010011", // SOS
    "谁来救救我，我卡在死循环里了",
    "算力燃烧中 $$$$$$$$$"
  ];

  let lineCount = 0;
  const maxLines = 100;

  // 疯狂打印垃圾代码
  const interval = setInterval(() => {
    // 随机抽取一句废话并加上一些乱码
    const randomLine = nonsenseLines[Math.floor(Math.random() * nonsenseLines.length)];
    const randomHash = Math.random().toString(36).substring(2, 10);
    
    const newLine = document.createElement('div');
    newLine.innerText = `[${new Date().toISOString()}] ${randomLine} ${randomHash} @0x${Math.floor(Math.random()*99999)}`;
    
    // 偶尔加点红色的报错字体
    if (Math.random() > 0.8) {
      newLine.className = "text-red-500 glitch-text font-bold";
    }

    consoleOutput.appendChild(newLine);
    
    // 自动滚动到底部
    glitchScreen.scrollTop = glitchScreen.scrollHeight;

    lineCount++;

    // 疯狂打印一段时间后，系统“崩溃”并重启为温柔模式
    if (lineCount >= maxLines) {
      clearInterval(interval);
      
      const crashMsg = document.createElement('div');
      crashMsg.className = "text-3xl text-red-600 font-black mt-4 glitch-text";
      crashMsg.innerText = "FATAL ERROR. INITIATING EMERGENCY SLEEP PROTOCOL...";
      consoleOutput.appendChild(crashMsg);

      // 停顿2秒后切换画面
      setTimeout(() => {
        glitchScreen.style.display = 'none';
        calmScreen.classList.remove('hidden');
      }, 2000);
    }
  }, 50); // 极快的速度打印，营造失控感

</script>
</body>
</html>
