<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 赛博宝宝盲盒扭蛋机 | 赛博缝纫机</title>
<meta name="description" content="扭一扭。宝宝专属超可爱版，抽到的能进收藏。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }
        
        .kawaii-bg {
            background: linear-gradient(180deg, #fff0f8 0%, #f0e4ff 100%);
        }
        
        .machine {
            width: 280px;
            height: 320px;
            background: linear-gradient(145deg, #fff, #ffe4f0);
            border-radius: 40px;
            box-shadow: 0 15px 40px rgba(236, 72, 153, 0.25),
                        inset 0 -8px 20px rgba(255,255,255,0.8),
                        inset 0 8px 20px rgba(255,255,255,0.6);
            border: 8px solid #f9a8d4;
            position: relative;
            overflow: hidden;
        }
        
        .machine-top {
            height: 85px;
            background: linear-gradient(#f9a8d4, #f472b6);
            border-radius: 32px 32px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .capsule {
            width: 68px;
            height: 68px;
            background: linear-gradient(145deg, #fff, #ffe4f0);
            border-radius: 9999px;
            box-shadow: 0 6px 15px rgba(236, 72, 153, 0.3),
                        inset 0 4px 10px rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            transition: transform 0.4s ease;
            position: relative;
        }
        
        .capsule.spinning {
            animation: spinCapsule 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        
        @keyframes spinCapsule {
            0% { transform: rotate(0deg) scale(0.8); }
            20% { transform: rotate(180deg) scale(1.1); }
            80% { transform: rotate(720deg) scale(1); }
            100% { transform: rotate(1080deg) scale(1); }
        }
        
        .handle {
            width: 38px;
            height: 38px;
            background: linear-gradient(#f472b6, #c0267a);
            border-radius: 9999px;
            box-shadow: 0 4px 12px rgba(192, 38, 122, 0.5);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .handle:active {
            transform: rotate(45deg) scale(0.92);
        }
        
        .cute-item {
            font-size: 42px;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .rarity-common { box-shadow: 0 0 12px #a5b4fc; }
        .rarity-rare { box-shadow: 0 0 18px #c084fc; }
        .rarity-super { box-shadow: 0 0 25px #f472b6; animation: superGlow 1.5s ease infinite; }
        
        @keyframes superGlow {
            0%, 100% { box-shadow: 0 0 25px #f472b6; }
            50% { box-shadow: 0 0 40px #f472b6, 0 0 60px #c084fc; }
        }
        
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        
        .collected-item {
            width: 42px;
            height: 42px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        
        .collected-item:hover {
            transform: scale(1.15);
        }
        
        .neon-button {
            background: linear-gradient(90deg, #f472b6, #c084fc);
            box-shadow: 0 6px 18px rgba(244, 114, 182, 0.5);
            transition: all 0.2s ease;
        }
        
        .neon-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="kawaii-bg text-[#4c1d95] min-h-screen overflow-hidden">
    <div class="max-w-md mx-auto pt-6 px-5">
        
        <!-- 标题 -->
        <div class="flex items-center justify-center gap-x-3 mb-6">
            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-[0_4px_15px_rgba(244,114,182,0.4)]">
                <span class="text-4xl">🌀</span>
            </div>
            <div class="text-center">
                <h1 class="text-3xl font-black bg-gradient-to-r from-pink-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">赛博盲盒扭蛋机</h1>
                <p class="text-xs text-purple-400 -mt-1">宝宝专属超可爱版 💕</p>
            </div>
        </div>
        
        <!-- 扭蛋机 -->
        <div class="flex justify-center mb-6">
            <div class="machine">
                <!-- 机器上半部分 -->
                <div class="machine-top">
                    <div class="text-white text-xl font-black tracking-widest">扭蛋机</div>
                </div>
                
                <!-- 显示区 -->
                <div class="px-8 pt-5 pb-3 flex justify-center">
                    <div id="display-area" 
                         class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center border-4 border-pink-200 shadow-inner">
                        <div id="capsule" class="capsule">
                            <span id="capsule-emoji">💗</span>
                        </div>
                    </div>
                </div>
                
                <!-- 扭手柄 -->
                <div class="flex justify-center mt-1">
                    <div onclick="twistGacha()" id="handle"
                         class="handle flex items-center justify-center">
                        <div class="w-4 h-4 bg-white rounded-full"></div>
                    </div>
                </div>
                
                <div class="text-center mt-2">
                    <button onclick="twistGacha()" 
                            class="neon-button text-white px-8 py-2 rounded-2xl text-sm font-bold flex items-center gap-x-2 mx-auto">
                        <i class="fa-solid fa-sync-alt"></i>
                        <span>扭一扭！</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 结果显示 -->
        <div id="result-area" class="hidden bg-white rounded-3xl p-4 mb-5 text-center kawaii-shadow border border-pink-100">
            <div class="text-sm text-purple-400 mb-1">你抽到了！</div>
            <div id="result-item" class="text-6xl mb-2"></div>
            <div id="result-name" class="font-bold text-lg text-[#4c1d95]"></div>
            <div id="result-rarity" class="text-xs mt-1"></div>
        </div>
        
        <!-- 收藏册 -->
        <div class="bg-white rounded-3xl p-4 kawaii-shadow border border-pink-100">
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="flex items-center gap-x-2">
                    <span class="text-lg">📖</span>
                    <span class="font-bold text-[#4c1d95]">我的收藏</span>
                </div>
                <div class="text-xs text-purple-400">
                    <span id="collected-count">0</span> / <span id="total-count">15</span>
                </div>
            </div>
            
            <div id="collection-grid" class="collection-grid">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <div class="text-center mt-4">
            <div class="text-[10px] text-purple-300">每扭一次都有惊喜哦～ 稀有度越高越可爱！</div>
        </div>
        
    </div>
    
    <script>
        const items = [
            { emoji: '💗', name: '粉粉爱心', rarity: 'common', weight: 30 },
            { emoji: '🍓', name: '甜甜草莓', rarity: 'common', weight: 25 },
            { emoji: '🌸', name: '樱花小花', rarity: 'common', weight: 25 },
            { emoji: '🍬', name: '彩虹糖果', rarity: 'common', weight: 20 },
            { emoji: '🌷', name: '小郁金香', rarity: 'common', weight: 20 },
            { emoji: '🦄', name: '独角兽宝宝', rarity: 'rare', weight: 12 },
            { emoji: '💎', name: '闪亮水晶', rarity: 'rare', weight: 10 },
            { emoji: '🍭', name: '梦幻棒棒糖', rarity: 'rare', weight: 10 },
            { emoji: '🌟', name: '小星星', rarity: 'rare', weight: 8 },
            { emoji: '🐰', name: '小白兔', rarity: 'rare', weight: 8 },
            { emoji: '🦋', name: '蝴蝶仙子', rarity: 'super', weight: 4 },
            { emoji: '👑', name: '小皇冠', rarity: 'super', weight: 3 },
            { emoji: '🌈', name: '彩虹', rarity: 'super', weight: 3 },
            { emoji: '🦊', name: '小狐狸', rarity: 'super', weight: 2 },
            { emoji: '💖', name: '超级大爱心', rarity: 'super', weight: 2 }
        ];
        
        let collection = new Set();
        let totalCount = items.length;
        
        function updateCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `collected-item ${collection.has(index) ? '' : 'opacity-30 grayscale'}`;
                div.innerHTML = collection.has(index) ? item.emoji : '❓';
                
                if (collection.has(index)) {
                    div.onclick = () => showItemDetail(item);
                }
                
                grid.appendChild(div);
            });
            
            document.getElementById('collected-count').textContent = collection.size;
            document.getElementById('total-count').textContent = totalCount;
        }
        
        function showItemDetail(item) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/60 flex items-center justify-center z-50';
            
            let rarityText = '';
            let rarityColor = '';
            
            if (item.rarity === 'common') {
                rarityText = '普通';
                rarityColor = 'text-blue-400';
            } else if (item.rarity === 'rare') {
                rarityText = '稀有';
                rarityColor = 'text-purple-500';
            } else {
                rarityText = '超稀有！';
                rarityColor = 'text-pink-500';
            }
            
            modal.innerHTML = `
                <div class="bg-white rounded-3xl p-8 max-w-[260px] text-center kawaii-shadow">
                    <div class="text-7xl mb-4">${item.emoji}</div>
                    <div class="font-black text-2xl text-[#4c1d95] mb-1">${item.name}</div>
                    <div class="${rarityColor} text-sm font-bold mb-4">${rarityText}</div>
                    
                    <button onclick="this.closest('.fixed').remove()" 
                            class="mt-2 px-8 py-2 bg-gradient-to-r from-pink-400 to-purple-400 text-white rounded-2xl text-sm font-bold">
                        好可爱！
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function twistGacha() {
            const handle = document.getElementById('handle');
            const capsule = document.getElementById('capsule');
            const emojiEl = document.getElementById('capsule-emoji');
            const resultArea = document.getElementById('result-area');
            
            // 禁用按钮
            handle.style.pointerEvents = 'none';
            
            // 随机选择
            const rand = Math.random() * 100;
            let cumulative = 0;
            let selected = items[0];
            
            for (let item of items) {
                cumulative += item.weight;
                if (rand <= cumulative) {
                    selected = item;
                    break;
                }
            }
            
            // 动画
            capsule.classList.add('spinning');
            emojiEl.style.transition = 'opacity 0.2s';
            emojiEl.style.opacity = '0';
            
            setTimeout(() => {
                emojiEl.textContent = selected.emoji;
                emojiEl.style.opacity = '1';
                
                // 结束动画
                setTimeout(() => {
                    capsule.classList.remove('spinning');
                    
                    // 显示结果
                    resultArea.classList.remove('hidden');
                    resultArea.style.animation = 'popIn 0.4s ease';
                    
                    document.getElementById('result-item').innerHTML = selected.emoji;
                    document.getElementById('result-name').textContent = selected.name;
                    
                    const rarityEl = document.getElementById('result-rarity');
                    if (selected.rarity === 'common') {
                        rarityEl.innerHTML = `<span class="text-blue-400">普通</span>`;
                    } else if (selected.rarity === 'rare') {
                        rarityEl.innerHTML = `<span class="text-purple-500">稀有 ✨</span>`;
                    } else {
                        rarityEl.innerHTML = `<span class="text-pink-500">超稀有！👑</span>`;
                    }
                    
                    // 加入收藏
                    const index = items.indexOf(selected);
                    if (!collection.has(index)) {
                        collection.add(index);
                        updateCollection();
                        
                        // 稀有物品特效
                        if (selected.rarity === 'super') {
                            launchConfetti();
                        }
                    }
                    
                    // 恢复按钮
                    setTimeout(() => {
                        handle.style.pointerEvents = 'auto';
                    }, 600);
                    
                }, 420);
            }, 1100);
        }
        
        function launchConfetti() {
            const colors = ['#f472b6', '#c084fc', '#f9a8d4'];
            const container = document.body;
            
            for (let i = 0; i < 35; i++) {
                const c = document.createElement('div');
                c.textContent = ['✨', '💕', '🌟'][Math.floor(Math.random()*3)];
                c.style.position = 'fixed';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-20px';
                c.style.fontSize = '18px';
                c.style.zIndex = '100';
                c.style.transition = `transform ${1.8 + Math.random()}s ease-out, opacity 1.8s`;
                container.appendChild(c);
                
                setTimeout(() => {
                    c.style.transform = `translateY(${300 + Math.random() * 200}px) rotate(${Math.random()*360}deg)`;
                    c.style.opacity = '0';
                }, 50);
                
                setTimeout(() => c.remove(), 2200);
            }
        }
        
        function initGame() {
            // 初始化收藏格子
            const grid = document.getElementById('collection-grid');
            for (let i = 0; i < items.length; i++) {
                const div = document.createElement('div');
                div.className = 'collected-item opacity-30 grayscale';
                div.innerHTML = '❓';
                grid.appendChild(div);
            }
            
            document.getElementById('collected-count').textContent = '0';
            document.getElementById('total-count').textContent = items.length;
            
            // 欢迎动画
            setTimeout(() => {
                const machine = document.querySelector('.machine');
                machine.style.transition = 'transform 0.4s ease';
                machine.style.transform = 'scale(0.96)';
                setTimeout(() => machine.style.transform = 'scale(1)', 200);
            }, 400);
            
            console.log('%c[赛博缝纫机] 盲盒扭蛋机已准备好 💕', 'color:#f472b6');
        }
        
        window.onload = initGame;
    </script>
</body>
</html>
