<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哄宝入睡</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0b132b;
    color: #e2e8f0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background-color: white;
    border-radius: 50%;
    animation: twinkle infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 0.8; transform: scale(1.2); }
  }

  .breathing-container {
    position: relative;
    width: 250px;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  /* 呼吸光晕：吸气4秒，呼气6秒，总周期10秒 */
  .glow-circle {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(147, 197, 253, 0.8) 0%, rgba(59, 130, 246, 0.2) 60%, transparent 80%);
    box-shadow: 0 0 40px rgba(147, 197, 253, 0.4);
    animation: breath 10s infinite ease-in-out;
  }

  .core-circle {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: rgba(219, 234, 254, 0.9);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    animation: breath-core 10s infinite ease-in-out;
  }

  @keyframes breath {
    /* 0-4秒吸气变大，4-10秒呼气变小 */
    0% { transform: scale(1); opacity: 0.5; }
    40% { transform: scale(2.5); opacity: 0.9; }
    100% { transform: scale(1); opacity: 0.5; }
  }

  @keyframes breath-core {
    0% { transform: scale(1); opacity: 0.7; }
    40% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 0.7; }
  }

  .guide-text {
    position: absolute;
    bottom: -60px;
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-align: center;
    width: 100vw;
    color: #bfdbfe;
    transition: opacity 1s ease-in-out;
    text-shadow: 0 0 10px rgba(147, 197, 253, 0.5);
  }

  .status-text {
    position: absolute;
    top: -50px;
    font-size: 0.9rem;
    color: #94a3b8;
    letter-spacing: 4px;
    animation: status-fade 10s infinite ease-in-out;
  }

  @keyframes status-fade {
    0% { opacity: 0.4; }
    20% { opacity: 0.8; }
    40% { opacity: 0.4; }
    80% { opacity: 0.8; }
    100% { opacity: 0.4; }
  }
</style>
</head>
<body>

  <!-- 动态星星背景 -->
  <div class="stars" id="stars-container"></div>

  <div class="breathing-container">
    <div class="status-text" id="status">吸气...</div>
    <div class="glow-circle"></div>
    <div class="core-circle"></div>
    <div class="guide-text" id="guide">跟着光晕，慢慢呼吸</div>
  </div>

<script>
  // 生成背景星星
  const starsContainer = document.getElementById('stars-container');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    const size = Math.random() * 3 + 1;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.animationDuration = `${Math.random() * 3 + 2}s`;
    star.style.animationDelay = `${Math.random() * 2}s`;
    starsContainer.appendChild(star);
  }

  // 哄睡文案轮播
  const phrases = [
    "松开紧绷的肩膀",
    "放松你的下巴",
    "舌尖离开上颚",
    "把今天的烦恼都放下",
    "去感受被窝的温暖",
    "睡着我也在",
    "明天见，宝"
  ];

  const guideElement = document.getElementById('guide');
  const statusElement = document.getElementById('status');
  let phraseIndex = 0;

  // 配合10秒呼吸周期的文字逻辑
  setInterval(() => {
    // 每10秒的周期开始：吸气 4秒
    statusElement.innerText = "吸气...";
    
    // 吸气快结束时切换文字
    setTimeout(() => {
      guideElement.style.opacity = 0; // 淡出旧文字
      
      setTimeout(() => {
        guideElement.innerText = phrases[phraseIndex];
        guideElement.style.opacity = 1; // 淡入新文字
        phraseIndex = (phraseIndex + 1) % phrases.length;
      }, 1000);
      
    }, 2000);

    // 第4秒开始：呼气 6秒
    setTimeout(() => {
      statusElement.innerText = "慢慢呼气...";
    }, 4000);

  }, 10000);

</script>
</body>
</html>
