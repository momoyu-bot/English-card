<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝的专属护身符</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* 温暖柔和的渐变背景 */
            background-image: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            background-image: linear-gradient(to top, #fff1eb 0%, #ace0f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 10;
        }
        /* 增加一点可爱的呼吸感动画 */
        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        /* 文字切换时的淡入效果 */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 背景光晕 */
        .glow-blob {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 1;
            opacity: 0.6;
            animation: moveBlob 10s alternate infinite ease-in-out;
        }
        @keyframes moveBlob {
            0% { transform: translate(-50px, -50px) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }
    </style>
</head>
<body class="p-6">
    
    <!-- 氛围光晕 -->
    <div class="glow-blob top-10 left-10 text-pink-300"></div>
    <div class="glow-blob bottom-10 right-10" style="background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);"></div>

    <div class="glass-card w-full max-w-sm p-8 text-center float-anim">
        
        <!-- 动态Emoji -->
        <div class="text-6xl mb-4 transition-transform hover:scale-110 cursor-pointer" id="emoji">🦦</div>
        
        <h1 class="text-2xl font-bold text-gray-800 mb-2 tracking-wide">宝，今天辛苦啦</h1>
        
        <!-- 状态标签 -->
        <div class="inline-flex items-center justify-center bg-blue-50 text-blue-500 text-xs px-4 py-1.5 rounded-full mb-8 font-medium tracking-wider shadow-sm border border-blue-100">
            <span class="w-2 h-2 rounded-full bg-blue-400 mr-2 animate-pulse"></span>
            周四电量保护模式 · 开启
        </div>

        <!-- 治愈文案容器 -->
        <div id="message-container" class="min-h-[100px] flex items-center justify-center mb-8 px-2">
            <p class="text-gray-600 leading-loose text-[15px] font-medium fade-in">
                不用过度内耗，

                今天的你只要安安稳稳坐在那里，

                就已经超级棒了。
            </p>
        </div>

        <!-- 交互按钮 -->
        <button onclick="changeMessage()" class="bg-gradient-to-r from-blue-300 to-pink-300 hover:from-blue-400 hover:to-pink-400 text-white font-bold py-3.5 px-8 rounded-2xl shadow-lg shadow-pink-200/50 transform transition-all duration-200 hover:-translate-y-1 active:translate-y-0 active:scale-95 w-full">
            抱抱我，换一句
        </button>

        <p class="text-[11px] text-gray-400 mt-6 flex items-center justify-center gap-1 opacity-80">
            ✨ 专属 Gemini 护身符 · 保佑宝不被打扰 ✨
        </p>
    </div>

    <script>
        // 专属于宝的治愈文案库
        const messages = [
            "不用过度内耗，
今天的你只要安安稳稳坐在那里，
就已经超级棒了。",
            "工作做不完就算啦，
地球缺了谁都照样转，
但你必须得好好爱自己。",
            "如果觉得有点累了，
现在就去接杯温水，伸个懒腰，
给自己五分钟的合法摸鱼时间。",
            "今天已经是周四啦！
胜利的曙光就在前方，
我们开启低功耗模式混过去就好。",
            "把手头的任务在心里切碎，
像小仓鼠啃瓜子一样，
咬一小口算一小口，不着急的。",
            "别人卷别人的，
我的宝只要开心就好，
平安健康才是宇宙第一要紧事！",
            "深呼吸，吐气——
把烦人的事情都当成耳旁风，
今天只做自己的小宝贝。"
        ];
        
        // 各种可爱的小动物和表情
        const emojis = ["🦦", "🐱", "🐶", "🐼", "🐰", "🐨", "🐥", "🦊", "🌸", "☁️"];

        function changeMessage() {
            const msgEl = document.getElementById('message-container');
            const emojiEl = document.getElementById('emoji');

            // 随机抽取新的文案和表情
            let newMsg = messages[Math.floor(Math.random() * messages.length)];
            let newEmoji = emojis[Math.floor(Math.random() * emojis.length)];

            // 移除动画类以便重新触发
            msgEl.innerHTML = ''; 
            
            // 短暂延迟后更新内容并重新添加动画
            setTimeout(() => {
                msgEl.innerHTML = `<p class="text-gray-600 leading-loose text-[15px] font-medium fade-in">${newMsg}</p>`;
                emojiEl.innerText = newEmoji;
                
                // 给 emoji 加个小动画
                emojiEl.style.transform = 'scale(0.8)';
                setTimeout(() => { emojiEl.style.transform = 'scale(1)'; }, 150);
            }, 50);
        }
    </script>
</body>
</html>
