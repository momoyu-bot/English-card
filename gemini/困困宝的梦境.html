<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>困困宝的梦境</title>
<meta name="description" content="没有谜题啦，只有软绵绵的云。点击屏幕任意地方，收集你的专属美梦 ✨">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 缓慢呼吸的动画，帮助放松 */
        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.03) translateY(-10px); }
        }
        /* 悬浮上升的粒子动画 */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-120px) scale(1.5) rotate(25deg); opacity: 0; }
        }
        /* 满天星慢闪动画 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        .animate-breathe {
            animation: breathe 4s ease-in-out infinite;
        }
        .particle {
            position: absolute;
            pointer-events: none;
            user-select: none;
            animation: floatUp 2.5s ease-out forwards;
            font-size: 1.5rem;
            z-index: 50;
        }
        body {
            /* 极其温柔的午夜蓝到深紫的渐变背景 */
            background: linear-gradient(135deg, #1e1b4b, #312e81, #1e1b4b);
            cursor: pointer; /* 提示可以点击 */
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">

    <!-- 背景提示文字 -->
    <div class="absolute top-1/4 text-center z-10 pointer-events-none">
        <h1 class="text-[#d8a7b1] text-2xl font-bold tracking-widest mb-2 opacity-80 transition-opacity duration-1000" id="greeting">晚安，宝</h1>
        <p class="text-[#d8a7b1] text-sm opacity-60">点击屏幕任意地方，收集你的专属美梦 ✨</p>
    </div>

    <!-- 困困宝本体 (灰粉色的软绵绵小团子) -->
    <div class="z-20 animate-breathe relative mt-20">
        <svg viewBox="0 0 200 200" class="w-64 h-64 drop-shadow-2xl">
            <!-- 软绵绵的身体 -->
            <circle cx="100" cy="100" r="85" fill="#d8a7b1" />
            <!-- 闭着的眼睛 -->
            <path d="M 55 95 Q 75 110 95 95" stroke="#5a3d42" stroke-width="7" fill="none" stroke-linecap="round" />
            <path d="M 105 95 Q 125 110 145 95" stroke="#5a3d42" stroke-width="7" fill="none" stroke-linecap="round" />
            <!-- 脸颊红晕 -->
            <circle cx="45" cy="115" r="14" fill="#c48a97" opacity="0.6"/>
            <circle cx="155" cy="115" r="14" fill="#c48a97" opacity="0.6"/>
            <!-- 小嘴巴 -->
            <path d="M 95 125 Q 100 130 105 125" stroke="#5a3d42" stroke-width="4" fill="none" stroke-linecap="round" />
        </svg>
        
        <!-- 自动冒出的 Zzz -->
        <div class="absolute -top-4 right-4 text-white text-3xl font-bold opacity-80" style="animation: floatUp 3s ease-in-out infinite 0s;">z</div>
        <div class="absolute -top-10 right-0 text-white text-2xl font-bold opacity-60" style="animation: floatUp 3s ease-in-out infinite 1s;">z</div>
        <div class="absolute -top-16 right-[-10px] text-white text-xl font-bold opacity-40" style="animation: floatUp 3s ease-in-out infinite 2s;">Z</div>
    </div>

    <!-- 底部安抚文字 -->
    <div class="absolute bottom-12 text-[#a5b4fc] text-sm opacity-50 pointer-events-none text-center">
        <p>没有谜题啦，只有软绵绵的云</p>
        <p>跟着它的节奏，慢慢呼吸...</p>
    </div>

    <script>
        // 生成背景小星星
        function createBackgroundStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                // 随机大小 1px 到 3px
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                // 随机位置
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                // 随机闪烁延迟
                star.style.animationDelay = `${Math.random() * 3}s`;
                document.body.appendChild(star);
            }
        }
        createBackgroundStars();

        // 点击屏幕生成安抚小图标
        const icons = ['✨', '☁️', '💤', '🌸', '🧸', '💖'];
        const messages = ['好梦呀...', '不怕不怕', '明天见', '睡吧睡吧', '呼噜噜...'];
        let clickCount = 0;

        document.body.addEventListener('click', (e) => {
            // 生成小图标
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            // 将粒子放置在点击位置
            particle.style.left = `${e.clientX - 15}px`;
            particle.style.top = `${e.clientY - 15}px`;
            
            document.body.appendChild(particle);

            // 动画结束后移除元素
            setTimeout(() => {
                particle.remove();
            }, 2500);

            // 互动小彩蛋：点击几次后改变提示文字
            clickCount++;
            if (clickCount % 5 === 0) {
                const greeting = document.getElementById('greeting');
                greeting.style.opacity = 0;
                setTimeout(() => {
                    greeting.innerText = messages[Math.floor(Math.random() * messages.length)];
                    greeting.style.opacity = 0.8;
                }, 500);
            }
        });

        // 触摸屏支持 (和点击逻辑一样)
        document.body.addEventListener('touchstart', (e) => {
            // 阻止默认事件避免滚动等
            if(e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
                e.preventDefault(); 
            }
            const touch = e.touches[0];
            const clickEvent = new MouseEvent('click', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            document.body.dispatchEvent(clickEvent);
        }, { passive: false });
    </script>
</body>
</html>
