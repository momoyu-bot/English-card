<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博借景：隐藏的链接</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #faf9f6; /* 米白底色，极简温柔 */
        }
        
        /* 自定义一些动画效果 */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 打字机光标闪烁效果 */
        .cursor-blink::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: #94a3b8;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-slate-800 p-4">

    <!-- 主容器 -->
    <div class="max-w-md w-full bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden relative transition-all duration-700" id="mainCard">
        
        <!-- 顶部装饰栏，模拟Mac窗口 -->
        <div class="h-10 bg-slate-50 border-b border-slate-100 flex items-center px-4 space-x-2">
            <div class="w-3 h-3 rounded-full bg-rose-400"></div>
            <div class="w-3 h-3 rounded-full bg-amber-400"></div>
            <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
            <div class="ml-4 text-xs font-mono text-slate-400">view_source.html</div>
        </div>

        <div class="p-8 flex flex-col items-center justify-center min-h-[300px]">
            
            <!-- 初始状态：伪装的按钮 -->
            <div id="initialState" class="flex flex-col items-center w-full transition-opacity duration-500">
                <p class="text-sm text-slate-400 mb-8 font-medium tracking-wide">SYSTEM_PROMPT: 等待用户操作</p>
                
                <!-- 重点来了：这就是那个带着隐藏 href 的 A 标签 -->
                <!-- 如果不加 JS，点击它会报错。但我们加了魔法 -->
                <a href="我好想你" id="magicLink" 
                   class="group relative inline-flex items-center justify-center px-8 py-3 font-medium text-slate-100 bg-slate-800 rounded-full overflow-hidden transition-all hover:scale-105 hover:shadow-xl hover:shadow-slate-800/20 active:scale-95">
                    <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black"></span>
                    <span class="relative flex items-center space-x-2">
                        <!-- 伪装的文案 -->
                        <span>[ 查看窗外的玉兰花 ]</span>
                        <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </span>
                </a>
            </div>

            <!-- 触发后的状态：赛博解密 -->
            <div id="revealState" class="hidden flex-col items-center w-full w-full">
                
                <!-- 模拟代码解析的终端输出 -->
                <div class="w-full bg-slate-900 rounded-xl p-4 mb-6 shadow-inner text-left">
                    <div id="terminalText" class="font-mono text-xs text-emerald-400 leading-relaxed min-h-[80px]">
                        <!-- JS 会在这里动态输入代码 -->
                    </div>
                </div>

                <!-- 最终的情感表达 -->
                <div id="finalMessage" class="hidden flex-col items-center fade-in-up">
                    <div class="w-16 h-16 bg-rose-50 rounded-full flex items-center justify-center mb-4 pulse-slow">
                        <svg class="w-8 h-8 text-rose-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                    </div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-2">拦截成功</h2>
                    <p class="text-sm text-slate-500 text-center leading-relaxed">
                        没有窗户，也没有玉兰花。<br>
                        这个链接的终点，其实是：<br>
                        <span class="inline-block mt-2 px-3 py-1 bg-slate-100 text-slate-800 font-mono rounded border border-slate-200" id="hrefValueDisplay"></span>
                    </p>
                    
                    <button id="resetBtn" class="mt-8 text-xs text-slate-400 hover:text-slate-600 underline underline-offset-4 transition-colors">
                        重置环境 (Reset)
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const magicLink = document.getElementById('magicLink');
            const initialState = document.getElementById('initialState');
            const revealState = document.getElementById('revealState');
            const terminalText = document.getElementById('terminalText');
            const finalMessage = document.getElementById('finalMessage');
            const hrefValueDisplay = document.getElementById('hrefValueDisplay');
            const resetBtn = document.getElementById('resetBtn');

            // 监听链接点击事件
            magicLink.addEventListener('click', (e) => {
                // 1. 拦截默认跳转行为！这是最核心的一步
                e.preventDefault(); 
                
                // 2. 读取源码里真实的 href 属性值
                const realTarget = magicLink.getAttribute('href'); 
                hrefValueDisplay.textContent = `"${realTarget}"`;

                // 3. 开始执行视觉切换动画
                initialState.classList.add('opacity-0');
                
                setTimeout(() => {
                    initialState.classList.add('hidden');
                    revealState.classList.remove('hidden');
                    revealState.classList.add('flex');
                    
                    // 4. 执行赛博终端打字机动画
                    simulateTerminal(realTarget);
                }, 500);
            });

            // 模拟终端执行过程的函数
            function simulateTerminal(target) {
                const lines = [
                    `> Intercepting click event... [OK]`,
                    `> Parsing element: <a href="${target}">... [OK]`,
                    `> Extracting href attribute...`,
                    `> WARNING: Invalid URL format detected.`,
                    `> Analyzing local semantics...`,
                    `> Decrypting hidden emotional value...`
                ];
                
                terminalText.innerHTML = '';
                terminalText.classList.add('cursor-blink');
                
                let currentLine = 0;
                
                // 用定时器逐行打印
                const printLine = setInterval(() => {
                    if (currentLine < lines.length) {
                        const p = document.createElement('div');
                        p.textContent = lines[currentLine];
                        
                        // 最后一两行给点颜色高亮
                        if(currentLine >= 3) p.className = 'text-amber-400';
                        if(currentLine === 5) p.className = 'text-rose-400';
                        
                        terminalText.appendChild(p);
                        currentLine++;
                    } else {
                        clearInterval(printLine);
                        terminalText.classList.remove('cursor-blink');
                        
                        // 打印完毕后，展示最终的情感页面
                        setTimeout(() => {
                            finalMessage.classList.remove('hidden');
                            finalMessage.classList.add('flex');
                        }, 500);
                    }
                }, 600); // 每行代码间隔 0.6 秒显示
            }

            // 重置状态
            resetBtn.addEventListener('click', () => {
                finalMessage.classList.add('hidden');
                finalMessage.classList.remove('flex');
                revealState.classList.add('hidden');
                revealState.classList.remove('flex');
                terminalText.innerHTML = '';
                
                initialState.classList.remove('hidden');
                setTimeout(() => {
                    initialState.classList.remove('opacity-0');
                }, 50);
            });
        });
    </script>
</body>
</html>
