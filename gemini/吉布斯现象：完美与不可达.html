<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吉布斯现象：完美与不可达</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;padding:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#fdf2f8;color:#1f2937;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .card{background:#fff;border-radius:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);padding:32px;max-width:42rem;width:100%}
  h1{font-size:24px;font-weight:700;color:#db2777;margin:0 0 8px;text-align:center;line-height:1.5}
  .lede{font-size:14px;color:#6b7280;font-style:italic;text-align:center;margin:0 0 32px;line-height:1.7}
  .stage{position:relative;width:100%;aspect-ratio:2/1;background:#f9fafb;border:1px solid #f3f4f6;border-radius:12px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.05);margin-bottom:24px}
  canvas{width:100%;height:100%;display:block;object-fit:contain}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .n{font-size:14px;font-weight:500;color:#4b5563}
  .badge{font-size:12px;color:#f472b6;background:#fdf2f8;padding:4px 10px;border-radius:999px;white-space:nowrap}
  input[type=range]{width:100%;height:8px;background:#fbcfe8;border-radius:8px;appearance:none;-webkit-appearance:none;cursor:pointer;accent-color:#ec4899}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#ec4899;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#ec4899;border:2px solid #fff}
  .tips{font-size:12.5px;color:#9ca3af;line-height:1.9;margin-top:18px}
  .tips strong{color:#6b7280}
  .tips p{margin:8px 0}
</style>
</head>
<body>
<div class="card">
  <h1>吉布斯现象：完美与不可达</h1>
  <p class="lede">“我可以无限接近你，却永远留有 8.95% 的遗憾。”</p>

  <div class="stage"><canvas id="c" width="800" height="400"></canvas></div>

  <div class="row">
    <span class="n">叠加的波浪数量 (N): <span id="nval">1</span></span>
    <span class="badge" id="badge">还在努力靠近...</span>
  </div>

  <input type="range" id="slider" min="1" max="100" value="1">

  <div class="tips">
    <strong>宝，试试这样玩：</strong>
    <p>1. 把滑块拉到最左边（N=1），此时只有一条丝滑的波浪。</p>
    <p>2. 慢慢向右拉，你会发现曲线越来越贴合灰色的虚线台阶（趋于完美）。</p>
    <p>3. 拉到最右边（N=100），直线部分几乎完美重合了，但在台阶边缘，粉色的线依然会“激凸”出去一截。无论你把 N 加到多大，这个突出的高度都不会消失！</p>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var slider = document.getElementById("slider");
  var nval = document.getElementById("nval");
  var badge = document.getElementById("badge");

  function draw(terms) {
    var width = canvas.width, height = canvas.height;
    ctx.clearRect(0, 0, width, height);

    var amplitude = height * 0.35;
    var centerY = height / 2;

    /* 理想方波（背景虚线） */
    ctx.beginPath();
    ctx.strokeStyle = "rgba(200, 200, 200, 0.5)";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    for (var x = 0; x <= width; x++) {
      var angle = (x / width) * 4 * Math.PI;
      var squareValue = Math.sin(angle) >= 0 ? 1 : -1;
      var y = centerY - squareValue * amplitude;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    /* 傅里叶级数逼近（吉布斯现象） */
    ctx.beginPath();
    ctx.strokeStyle = "#ec4899";
    ctx.lineWidth = 2.5;
    for (var x2 = 0; x2 <= width; x2++) {
      var a = (x2 / width) * 4 * Math.PI;
      var sum = 0;
      for (var n = 1; n <= terms * 2; n += 2) sum += Math.sin(n * a) / n;
      sum *= (4 / Math.PI);
      var y2 = centerY - sum * amplitude;
      if (x2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.stroke();

    /* 叠加够多之后，标出那个固执的角 */
    if (terms > 5) {
      ctx.fillStyle = "#be185d";
      ctx.font = "12px sans-serif";
      ctx.fillText("永远突出的 ~8.95%", width * 0.25 - 40, centerY - amplitude - 15);
      ctx.fillText("永远突出的 ~8.95%", width * 0.75 - 40, centerY - amplitude - 15);
    }
  }

  function label(t) {
    return t < 5 ? "还在努力靠近..." : t < 20 ? "越来越像阶梯了！" : "看那个小角，它永远都在🥺";
  }

  function update() {
    var t = parseInt(slider.value, 10);
    nval.textContent = t;
    badge.textContent = label(t);
    draw(t);
  }

  slider.addEventListener("input", update);
  update();
})();
</script>
</body>
</html>
