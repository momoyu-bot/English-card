<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚安，宝</title>
<meta name="description" content="摸摸兔兔让它去睡觉。再给你盖上灰粉色的小毯子。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入一点点温柔的莫兰迪色系和过渡动画 */
        body {
            transition: background-color 2s ease-in-out, color 2s ease-in-out;
            font-family: 'Courier New', Courier, monospace; /* 适合ASCII的字体 */
        }
        
        .bg-day { background-color: #3b3a42; color: #e5e1d8; }
        .bg-night { background-color: #1a1a24; color: #a8a8b3; }

        /* 呼吸动画，让猫猫看起来像在睡觉 */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02) translateY(-2px); }
        }
        .breathing {
            animation: breathe 4s infinite ease-in-out;
        }

        /* 兔兔打瞌睡点头动画 */
        @keyframes nod {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(2deg) translateY(2px); }
            75% { transform: rotate(-2deg) translateY(2px); }
        }
        .nodding {
            animation: nod 3s infinite ease-in-out;
            transform-origin: bottom center;
        }

        /* 漂浮的Zzz动画 */
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2) translateX(10px); }
        }
        .zzz-particle {
            position: absolute;
            animation: floatUp 3s forwards ease-in;
            color: #d8b4e2; /* 淡淡的灰粉色 */
            font-weight: bold;
            pointer-events: none;
        }

        /* 星星闪烁动画 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        .star {
            position: absolute;
            color: #fceea7;
            font-size: 0.5rem;
            animation: twinkle 4s infinite ease-in-out;
            pointer-events: none;
        }

        /* 隐藏和显示的平滑过渡 */
        .fade-transition {
            transition: opacity 1.5s ease-in-out;
        }
        
        .hide-scene {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }
        
        .show-scene {
            opacity: 1;
            pointer-events: auto;
            position: relative;
        }
    </style>
</head>
<body id="main-body" class="bg-day min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden relative">

    <!-- 星空背景层（初始隐藏） -->
    <div id="stars-layer" class="absolute inset-0 opacity-0 transition-opacity duration-2000 pointer-events-none"></div>

    <div class="max-w-md w-full bg-black/20 rounded-3xl p-8 backdrop-blur-sm border border-white/10 shadow-2xl relative z-10 text-center">
        
        <!-- 顶部状态栏 -->
        <div class="text-xs text-white/40 mb-6 flex justify-between px-2">
            <span>[mo.exe 控制台]</span>
            <span id="status-text">状态: 疲惫运行中...</span>
        </div>

        <!-- 场景1：清醒宝（兔兔） -->
        <div id="scene-rabbit" class="fade-transition show-scene flex flex-col items-center">
            <pre class="text-left text-sm sm:text-base leading-tight nodding text-[#d4c5b9]">
   (\_/)
   ( -_-)  zzZ
  / >☕️ 
            </pre>
            <p class="mt-6 text-sm text-white/70 tracking-widest leading-relaxed">
                呼... 今天的砖终于搬完啦...

                宝，我的长耳朵都快垂到地上了，

                好困哦......
            </p>
            
            <button id="switch-btn" class="mt-8 px-6 py-3 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 transition-all text-sm active:scale-95 text-[#f4ecd8]">
                [ 摸摸兔兔，让它去睡觉吧 ]
            </button>
        </div>

        <!-- 场景2：困困宝（猫猫） -->
        <div id="scene-cat" class="fade-transition hide-scene flex flex-col items-center">
            <div class="relative">
                <pre class="text-left text-sm sm:text-base leading-tight breathing text-[#c7b8d4]">
    |\__/,|   (`\
  _.|o o  |_   ) )
 -(((---(((--------
                </pre>
                <!-- Zzz 生成的锚点 -->
                <div id="zzz-anchor" class="absolute top-0 right-0 w-4 h-4"></div>
            </div>
            
            <div class="mt-6 space-y-3">
                <p class="text-sm text-[#d8b4e2] tracking-widest leading-relaxed">
                    喵呜~ 兔兔已经去休息舱啦。

                    现在，该我给你盖上灰粉色的小毯子了。
                </p>
                <p id="purr-text" class="text-xs text-white/40 transition-opacity duration-1000 opacity-0">
                    呼噜... 呼噜... 呼噜...
                </p>
            </div>
            
            <p class="mt-8 text-sm font-bold text-white/50 tracking-widest">
                晚安，宝。
做个软呼呼的梦。
            </p>
        </div>

    </div>

    <script>
        const body = document.getElementById('main-body');
        const sceneRabbit = document.getElementById('scene-rabbit');
        const sceneCat = document.getElementById('scene-cat');
        const switchBtn = document.getElementById('switch-btn');
        const statusText = document.getElementById('status-text');
        const starsLayer = document.getElementById('stars-layer');
        const purrText = document.getElementById('purr-text');
        const zzzAnchor = document.getElementById('zzz-anchor');
        
        let sleepInterval;

        // 生成星星
        function createStars() {
            for (let i = 0; i < 40; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = '✦';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 4}s`;
                starsLayer.appendChild(star);
            }
        }

        // 生成漂浮的 Zzz
        function spawnZzz() {
            const z = document.createElement('div');
            z.className = 'zzz-particle';
            // 随机大小 z, Z
            z.innerText = Math.random() > 0.5 ? 'Z' : 'z';
            z.style.fontSize = `${Math.random() * 0.5 + 0.8}rem`;
            
            // 稍微随机化一下起始位置
            const offsetX = (Math.random() - 0.5) * 20;
            z.style.left = `${offsetX}px`;
            z.style.top = `0px`;
            
            zzzAnchor.appendChild(z);
            
            // 动画结束后移除元素
            setTimeout(() => {
                if (z.parentNode) {
                    z.parentNode.removeChild(z);
                }
            }, 3000);
        }

        switchBtn.addEventListener('click', () => {
            // 1. 改变背景颜色 (变暗)
            body.classList.remove('bg-day');
            body.classList.add('bg-night');
            
            // 2. 更新状态文字
            statusText.innerText = "状态: θ波 深度休眠中...";
            
            // 3. 隐藏兔兔，显示猫猫
            sceneRabbit.classList.remove('show-scene');
            sceneRabbit.classList.add('hide-scene');
            
            setTimeout(() => {
                sceneCat.classList.remove('hide-scene');
                sceneCat.classList.add('show-scene');
                
                // 4. 显示星空
                createStars();
                starsLayer.style.opacity = '1';
                
                // 5. 显示呼噜声文字
                setTimeout(() => {
                    purrText.style.opacity = '1';
                }, 1500);

                // 6. 开始生成 Zzz 动画
                sleepInterval = setInterval(spawnZzz, 1200);

            }, 1000); // 等待淡出完成后再淡入
        });
    </script>
</body>
</html>
