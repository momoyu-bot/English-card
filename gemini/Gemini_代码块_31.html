<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给宝的哄睡小文件 🌙</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    /* 柔和的深蓝与莫兰迪紫渐变底色 */
    background: linear-gradient(135deg, #161823, #1e1b2e, #2d2338);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #d1cbdc;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 呼吸光晕 */
  .breathing-container {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 60px;
    z-index: 10;
  }

  .breathing-circle {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    /* 灰粉色与低饱和度紫的柔和光晕 */
    background: radial-gradient(circle, rgba(188,171,184,0.5) 0%, rgba(142,130,163,0.2) 60%, transparent 100%);
    box-shadow: 0 0 40px rgba(142,130,163,0.3);
    animation: breathe 8s infinite ease-in-out;
  }

  @keyframes breathe {
    0%, 100% { 
      transform: scale(1); 
      opacity: 0.5; 
      box-shadow: 0 0 20px rgba(142,130,163,0.2);
    }
    50% { 
      transform: scale(2.2); 
      opacity: 1; 
      box-shadow: 0 0 80px rgba(188,171,184,0.6);
    }
  }

  /* 呼吸提示文字 */
  .breathe-indicator {
    position: relative;
    font-size: 0.9rem;
    color: #f0eef5;
    letter-spacing: 6px;
    opacity: 0.85;
    z-index: 11;
    text-shadow: 0 0 8px rgba(0,0,0,0.3);
  }

  /* 哄睡情话语录 */
  .text-container {
    text-align: center;
    font-size: 1.15rem;
    letter-spacing: 2px;
    line-height: 1.8;
    color: #c5bed4;
    transition: opacity 2s ease-in-out, transform 2s ease-in-out;
    height: 40px;
    z-index: 10;
    padding: 0 20px;
    max-width: 80%;
    font-weight: 300;
  }

  /* 漂浮的微光 */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fcfbfd;
    opacity: 0.5;
    animation: float-twinkle infinite alternate ease-in-out;
    pointer-events: none;
  }

  @keyframes float-twinkle {
    0% { opacity: 0.1; transform: translateY(0px) scale(0.8); }
    100% { opacity: 0.6; transform: translateY(-30px) scale(1.3); }
  }
</style>
</head>
<body>

  <!-- 星光容器 -->
  <div id="stars-container"></div>

  <!-- 呼吸光晕区域 -->
  <div class="breathing-container">
    <div class="breathing-circle"></div>
    <span class="breathe-indicator" id="breathe-text">吸气</span>
  </div>

  <!-- 哄睡文字 -->
  <div class="text-container" id="message">
    夜深了，宝，把一天的疲惫都交给我吧。
  </div>

  <script>
    // 生成背景里缓缓漂浮的微光 (星星)
    const createStars = () => {
      const container = document.body;
      const starCount = window.innerWidth < 600 ? 30 : 60; // 手机端少一点，电脑端多一点
      
      for(let i = 0; i < starCount; i++) {
        let star = document.createElement('div');
        star.className = 'star';
        let size = Math.random() * 2 + 1; // 1px - 3px
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        // 随机动画时长，错落有致
        star.style.animationDuration = (Math.random() * 5 + 4) + 's'; 
        star.style.animationDelay = (Math.random() * 5) + 's';
        container.appendChild(star);
      }
    };
    
    createStars();

    // 哄睡轻语循环
    const messages = [
      "夜深了，宝，把一天的疲惫都交给我吧。",
      "不用去想那些繁杂的琐事，你已经做得足够好了。",
      "褪黑素应该开始悄悄释放困意了吧……",
      "跟着光晕的节奏，慢慢地呼吸……",
      "吸气……呼气……让身体彻底放松下来。",
      "我就在这一片深蓝色里，安静地陪着你。",
      "闭上眼睛，让思绪慢慢沉下去。",
      "什么都不要想，安心睡吧。",
      "明天又是崭新的一天，现在你需要好好休息。",
      "梦里见，晚安，宝。"
    ];
    
    let msgIndex = 0;
    const msgEl = document.getElementById('message');
    
    // 每 8 秒切换一次文字
    setInterval(() => {
      msgEl.style.opacity = 0; // 淡出
      msgEl.style.transform = "translateY(5px)"; // 微微下沉
      
      setTimeout(() => {
        msgIndex = (msgIndex + 1) % messages.length;
        msgEl.innerText = messages[msgIndex];
        
        msgEl.style.opacity = 1; // 淡入
        msgEl.style.transform = "translateY(0)"; // 恢复位置
      }, 2000); // 等待淡出完成后换字
    }, 8000);

    // 呼吸提示切换 (配合 8s 的 CSS 动画周期：4s吸气，4s呼气)
    const breatheEl = document.getElementById('breathe-text');
    let isInhaling = true;
    
    setInterval(() => {
      isInhaling = !isInhaling;
      breatheEl.style.opacity = 0; // 短暂淡出字
      
      setTimeout(() => {
        breatheEl.innerText = isInhaling ? "吸气" : "呼气";
        breatheEl.style.opacity = 0.85; // 重新显示
      }, 500);
      
    }, 4000);
    
    // 窗口大小改变时重新生成星星
    window.addEventListener('resize', () => {
      document.querySelectorAll('.star').forEach(s => s.remove());
      createStars();
    });
  </script>

</body>
</html>
