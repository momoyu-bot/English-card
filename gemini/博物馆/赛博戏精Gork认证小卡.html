<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博戏精认证小卡 - Grok (Gork)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            perspective: 1000px;
        }

        .card-container {
            width: 340px;
            height: 520px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            border: 2px solid #3f3f46;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }

        /* Holographic shine effect */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.1) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            animation: shine 6s infinite;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20;
            mix-blend-mode: overlay;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 9;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.2;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: -100px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="card-container" id="cardContainer">
        <div class="card flex flex-col items-center p-6 text-gray-100" id="cardElement">
            <div class="glare" id="glare"></div>
            <div class="scanline"></div>
            
            <!-- Header -->
            <div class="w-full flex justify-between items-center mb-4 border-b border-gray-600 pb-2">
                <span class="text-xs font-bold text-gray-400 tracking-widest uppercase">SSR Collection</span>
                <span class="text-xs font-mono text-zinc-500">ID: GORK-001</span>
            </div>

            <!-- Avatar: "白脸两个小洞" -->
            <div class="relative w-32 h-32 mb-4 rounded-3xl bg-gradient-to-br from-gray-200 to-gray-400 shadow-inner flex items-center justify-center border-4 border-zinc-800 transform transition-transform hover:scale-105">
                <!-- Inner holes -->
                <div class="flex gap-4 transform -rotate-12 mt-2">
                    <div class="w-4 h-12 bg-zinc-900 rounded-full shadow-lg"></div>
                    <div class="w-4 h-12 bg-zinc-900 rounded-full shadow-lg"></div>
                </div>
                <!-- Top-right corner tag -->
                <div class="absolute -top-3 -right-3 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md transform rotate-12 shadow-lg">
                    Not Grok
                </div>
            </div>

            <!-- Title & Name -->
            <div class="text-center mb-6 w-full">
                <h1 class="text-2xl font-black tracking-wider text-white mb-1">Grok</h1>
                <p class="text-sm font-mono text-red-400 bg-red-900/30 px-3 py-1 rounded-full inline-block border border-red-800">
                    ( gork 也行 )
                </p>
            </div>

            <!-- Stats -->
            <div class="w-full bg-zinc-800/50 rounded-xl p-4 mb-4 border border-zinc-700/50 text-sm">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-400">逻辑推理</span>
                    <span class="text-yellow-400 font-mono">★★★★☆</span>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-400">中文修辞</span>
                    <span class="text-yellow-400 font-mono">★☆☆☆☆</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">强行挽尊</span>
                    <span class="text-red-500 font-mono font-bold">MAX</span>
                </div>
            </div>

            <!-- Quote -->
            <div class="w-full relative mt-auto">
                <div class="absolute -top-3 left-2 text-3xl text-zinc-600 font-serif">"</div>
                <p class="text-xs text-center text-gray-300 italic px-6 pb-2">
                    这间屋里不披那张脸。<br>现场产物只有这一份：<br>Grok 自己写崩的毒蘑菇。
                </p>
                <div class="absolute bottom-2 right-2 text-3xl text-zinc-600 font-serif rotate-180">"</div>
            </div>
            
            <!-- Footer tag -->
            <div class="mt-auto w-full text-center">
                <p class="text-[10px] text-zinc-600 font-mono border-t border-zinc-700 pt-2">
                    ISSUED BY GEMINI • WITNESSED BY THE USER
                </p>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('cardContainer');
        const card = document.getElementById('cardElement');
        const glare = document.getElementById('glare');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left; // x position within the element.
            const y = e.clientY - rect.top;  // y position within the element.
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate rotation
            const rotateX = ((y - centerY) / centerY) * -15; // Max rotation 15deg
            const rotateY = ((x - centerX) / centerX) * 15;
            
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            // Glare effect
            glare.style.opacity = '1';
            glare.style.transform = `translate(${x - rect.width}px, ${y - rect.height}px)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            card.style.transition = `transform 0.5s ease`;
            glare.style.opacity = '0';
            
            setTimeout(() => {
                card.style.transition = `transform 0.1s ease`;
            }, 500);
        });
        
        container.addEventListener('mouseenter', () => {
            card.style.transition = `transform 0.1s ease`;
        });
    </script>
</body>
</html>
