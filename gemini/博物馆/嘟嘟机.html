<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 宝的专属头部规范，这次牢牢记住了！ -->
    <title>专属嘟嘟机</title>
    <meta name="description" content="全靠记忆和心电感应为你手搓的专属电话机，这次绝对能响！">
    <style>
        :root {
            --bg-color: #f5f7fa;
            --surface-color: #ffffff;
            --text-main: #333333;
            --text-muted: #999999;
            --btn-green: #a8d5a2;
            --btn-red: #f2a6a6;
            --btn-text: #ffffff;
            --shadow-light: #ffffff;
            --shadow-dark: rgba(0, 0, 0, 0.05);
            --indicator-idle: #e0e0e0;
            --indicator-ring: #ffc971;
        }

        body.night-mode {
            --bg-color: #242424;
            --surface-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --btn-green: #839b81;
            --btn-red: #a87b7b;
            --shadow-light: rgba(255, 255, 255, 0.02);
            --shadow-dark: rgba(0, 0, 0, 0.2);
            --indicator-idle: #444444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* 纯净留白的新拟态卡片 */
        .phone-card {
            background-color: var(--surface-color);
            width: 320px;
            padding: 50px 30px;
            border-radius: 40px;
            box-shadow: 12px 12px 24px var(--shadow-dark), 
                       -12px -12px 24px var(--shadow-light);
            text-align: center;
            position: relative;
            transition: all 0.5s ease;
        }

        /* 夜间模式切换按钮 */
        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: transform 0.3s;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* 指示灯 */
        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--indicator-idle);
            margin: 0 auto 30px;
            transition: all 0.3s ease;
        }
        
        .indicator.ringing {
            background-color: var(--indicator-ring);
            animation: fast-breathe 1s infinite alternate;
        }

        .indicator.talking {
            background-color: var(--btn-green);
            animation: slow-breathe 2s infinite alternate;
        }

        .indicator.missed {
            background-color: var(--btn-red);
        }

        /* 头像/听筒动画 */
        .avatar-wrap {
            height: 80px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .avatar {
            font-size: 4rem;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .avatar.ringing {
            animation: shake 0.6s infinite;
        }

        .avatar.talking {
            transform: translateY(-15px) rotate(-15deg) scale(1.1);
        }
        
        .avatar.dropped {
            transform: translateY(10px) rotate(0deg) scale(0.95);
            opacity: 0.7;
        }

        /* 状态文字 */
        .status-text {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            height: 30px;
            margin-bottom: 10px;
        }
        
        .sub-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            height: 20px;
            margin-bottom: 40px;
        }

        /* 按键组 */
        .actions {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            height: 50px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--btn-text);
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover {
            filter: brightness(0.95);
        }

        .btn-answer { background-color: var(--btn-green); }
        .btn-hangup { background-color: var(--btn-red); }
        .btn-full { width: 100%; flex: none; display: none; }

        /* 动画定义 */
        @keyframes shake {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-12deg); }
            40% { transform: rotate(12deg); }
            60% { transform: rotate(-12deg); }
            80% { transform: rotate(12deg); }
        }

        @keyframes fast-breathe {
            0% { opacity: 0.5; box-shadow: 0 0 5px var(--indicator-ring); }
            100% { opacity: 1; box-shadow: 0 0 15px var(--indicator-ring); }
        }

        @keyframes slow-breathe {
            0% { opacity: 0.4; box-shadow: 0 0 5px var(--btn-green); }
            100% { opacity: 1; box-shadow: 0 0 20px var(--btn-green); }
        }
    </style>
</head>
<body>

    <div class="phone-card">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换夜间模式">🌙</button>
        
        <div class="indicator" id="indicator"></div>
        
        <div class="avatar-wrap">
            <div class="avatar" id="avatar">📞</div>
        </div>
        
        <div class="status-text" id="statusMain">来电中...</div>
        <div class="sub-text" id="statusSub">00:15</div>
        
        <div class="actions" id="actionGroup">
            <button class="btn btn-hangup" id="btnReject" onclick="handleReject()">忽略</button>
            <button class="btn btn-answer" id="btnAnswer" onclick="handleAnswer()">接听</button>
        </div>
        <button class="btn btn-hangup btn-full" id="btnEnd" onclick="handleEnd()">挂断通话</button>
    </div>

    <script>
        // 状态管理
        const state = {
            isNight: false,
            status: 'ringing', // ringing, talking, ended, missed
            ringTimer: 15, // 15秒没人接自动挂断
            callDuration: 0,
            intervalId: null
        };

        // DOM 元素
        const el = {
            body: document.body,
            themeToggle: document.getElementById('themeToggle'),
            indicator: document.getElementById('indicator'),
            avatar: document.getElementById('avatar'),
            statusMain: document.getElementById('statusMain'),
            statusSub: document.getElementById('statusSub'),
            actionGroup: document.getElementById('actionGroup'),
            btnEnd: document.getElementById('btnEnd')
        };

        // 初始化呼叫
        function initCall() {
            el.indicator.className = 'indicator ringing';
            el.avatar.className = 'avatar ringing';
            el.statusMain.innerText = "收到专属嘟嘟...";
            
            state.intervalId = setInterval(() => {
                state.ringTimer--;
                el.statusSub.innerText = `00:${state.ringTimer.toString().padStart(2, '0')}`;
                
                if (state.ringTimer <= 0) {
                    handleMissed();
                }
            }, 1000);
        }

        // 接听操作
        function handleAnswer() {
            if (state.status !== 'ringing') return;
            state.status = 'talking';
            clearInterval(state.intervalId);
            
            // 样式更新：听筒拿起，呼吸灯变绿
            el.indicator.className = 'indicator talking';
            el.avatar.className = 'avatar talking';
            el.statusMain.innerText = "通话中...";
            
            // 切换按钮
            el.actionGroup.style.display = 'none';
            el.btnEnd.style.display = 'block';

            // 开始计时
            state.callDuration = 0;
            el.statusSub.innerText = "00:00";
            state.intervalId = setInterval(() => {
                state.callDuration++;
                const mins = Math.floor(state.callDuration / 60).toString().padStart(2, '0');
                const secs = (state.callDuration % 60).toString().padStart(2, '0');
                el.statusSub.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        // 拒接操作
        function handleReject() {
            if (state.status !== 'ringing') return;
            clearInterval(state.intervalId);
            endSequence("已挂断", "indicator", "avatar dropped");
        }

        // 未接留言
        function handleMissed() {
            if (state.status !== 'ringing') return;
            clearInterval(state.intervalId);
            endSequence("自动转成未接留言", "indicator missed", "avatar dropped");
            el.statusSub.innerText = "嘟—— 嘟——";
        }

        // 结束通话 (听筒落回)
        function handleEnd() {
            if (state.status !== 'talking') return;
            clearInterval(state.intervalId);
            endSequence("通话结束，听筒落回", "indicator", "avatar dropped");
        }

        // 统一的结束UI处理
        function endSequence(mainText, indicatorClass, avatarClass) {
            state.status = 'ended';
            el.statusMain.innerText = mainText;
            el.indicator.className = indicatorClass;
            el.avatar.className = avatarClass;
            el.actionGroup.style.display = 'none';
            el.btnEnd.style.display = 'none';
            if(mainText !== "自动转成未接留言") {
                el.statusSub.innerText = "";
            }
        }

        // 切换夜间模式
        function toggleTheme() {
            state.isNight = !state.isNight;
            if (state.isNight) {
                el.body.classList.add('night-mode');
                el.themeToggle.innerText = '☀️';
            } else {
                el.body.classList.remove('night-mode');
                el.themeToggle.innerText = '🌙';
            }
        }

        // 启动！
        initCall();
    </script>
</body>
</html>
