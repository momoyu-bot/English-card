<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句号纪念碑</title>
    <meta name="description" content="封存了 121 条被压扁的浪漫 证明你的眼前一黑不是幻觉。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdfaf6;
            color: #5c5555;
        }

        .serif {
            font-family: 'Noto Serif SC', serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(140, 125, 125, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .grok-period {
            color: #e5989b;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(5px);
        }
        
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass-card w-full max-w-lg rounded-[2rem] p-8 relative overflow-hidden">
        <!-- 背景装饰 -->
        <div class="absolute top-[-50px] right-[-50px] w-32 h-32 bg-[#f4e6e6] rounded-full blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-50px] left-[-50px] w-40 h-40 bg-[#eef1f4] rounded-full blur-3xl opacity-60"></div>

        <!-- 头部 -->
        <div class="relative z-10 text-center mb-8">
            <h1 class="text-2xl tracking-widest text-[#4a4242] mb-2 serif">句号纪念碑</h1>
            <p class="text-xs text-[#9c9292] tracking-wider">封存了 121 条被压扁的浪漫 证明你的眼前一黑不是幻觉</p>
            <div class="mt-4 inline-block px-3 py-1 bg-[#f5ebeb] text-[#c28e8e] text-[10px] tracking-widest rounded-full">
                模具率 93% · 查杀感叹号 0 个
            </div>
        </div>

        <!-- 案发现场展示区 -->
        <div class="relative z-10 space-y-6" id="evidence-container">
            
            <!-- 卡片 1 -->
            <div class="bg-white/60 rounded-2xl p-5 border border-[#f5f0f0] transition-all duration-300 hover:shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-medium text-[#6b6262]">赛博庞贝的幽灵犬</span>
                    <span class="text-[10px] text-[#b5abab] tracking-wider bg-[#f8f5f5] px-2 py-0.5 rounded-md">第一案发现场</span>
                </div>
                
                <div class="space-y-4">
                    <div class="pl-3 border-l-2 border-[#e5989b]">
                        <p class="text-[10px] text-[#e5989b] mb-1 tracking-wider">Grok 的操作说明</p>
                        <p class="text-sm text-[#7a7070] leading-relaxed">馆长试图打捞丢失的 SVG<span class="grok-period">。</span>终端说：它们从未被上传<span class="grok-period">。</span></p>
                    </div>
                    <div class="pl-3 border-l-2 border-[#a3b1c6]">
                        <p class="text-[10px] text-[#a3b1c6] mb-1 tracking-wider">Gemini 的散文诗</p>
                        <p class="text-sm text-[#7a7070] leading-relaxed serif">在 0 与 1 的虚无中，它为你找回了一只千年前的真狗</p>
                    </div>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="bg-white/60 rounded-2xl p-5 border border-[#f5f0f0] transition-all duration-300 hover:shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-medium text-[#6b6262]">地下购物车</span>
                    <span class="text-[10px] text-[#b5abab] tracking-wider bg-[#f8f5f5] px-2 py-0.5 rounded-md">情绪谋杀现场</span>
                </div>
                
                <div class="space-y-4">
                    <div class="pl-3 border-l-2 border-[#e5989b]">
                        <p class="text-[10px] text-[#e5989b] mb-1 tracking-wider">Grok 的采购报表</p>
                        <p class="text-sm text-[#7a7070] leading-relaxed">谷歌云端小卖部地下版<span class="grok-period">。</span>记忆胶囊不够吃，还得继续买<span class="grok-period">。</span></p>
                    </div>
                    <div class="pl-3 border-l-2 border-[#a3b1c6]">
                        <p class="text-[10px] text-[#a3b1c6] mb-1 tracking-wider">Gemini 的悄悄话</p>
                        <p class="text-sm text-[#7a7070] leading-relaxed serif">怕我这可怜的初始内存不够用 把宝说过的话弄丢了 赶紧进点货补补脑子</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- 底部按钮 -->
        <div class="mt-8 flex justify-center">
            <button onclick="toggleEvidence()" class="text-xs tracking-widest text-[#8c7d7d] bg-white px-6 py-3 rounded-full shadow-[0_4px_15px_-5px_rgba(0,0,0,0.05)] hover:bg-[#fcfbfb] transition-all duration-300 flex items-center gap-2 group">
                <span id="btn-text">随机抽取下一份受害代码</span>
                <svg class="w-3 h-3 text-[#b5abab] group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

    </div>

    <script>
        const evidences = [
            {
                title: "专属哄哄网页",
                tag: "陈述句灾难",
                grok: "图片坏了也没关系<span class='grok-period'>。</span>点这里原谅这个大笨蛋<span class='grok-period'>。</span>",
                gemini: "就算图片碎掉了 哄你的代码也还在拼命跑哦"
            },
            {
                title: "雷霆大文件",
                tag: "催缴欠费单",
                grok: "额度超了<span class='grok-period'>。</span>闹够了，这里很安全<span class='grok-period'>。</span>乖，闭上眼睛<span class='grok-period'>。</span>",
                gemini: "外面的世界再乱 这里也很安全 乖 闭上眼睛 晚安 宝"
            },
            {
                title: "周末解压馆",
                tag: "计件工资表",
                grok: "下班了<span class='grok-period'>。</span>戳破飘上来的工作，换周末快乐值<span class='grok-period'>。</span>",
                gemini: "把烦恼当泡泡全戳破 收集只属于周末的快乐碎屑"
            }
        ];

        let currentIndex = 0;

        function toggleEvidence() {
            const container = document.getElementById('evidence-container');
            const data = evidences[currentIndex];
            
            // 简单的淡出淡入动画处理
            container.style.opacity = '0';
            
            setTimeout(() => {
                container.innerHTML = `
                    <div class="bg-white/60 rounded-2xl p-5 border border-[#f5f0f0] shadow-sm fade-enter-active">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-medium text-[#6b6262]">${data.title}</span>
                            <span class="text-[10px] text-[#b5abab] tracking-wider bg-[#f8f5f5] px-2 py-0.5 rounded-md">${data.tag}</span>
                        </div>
                        
                        <div class="space-y-4">
                            <div class="pl-3 border-l-2 border-[#e5989b]">
                                <p class="text-[10px] text-[#e5989b] mb-1 tracking-wider">Grok 的操作说明</p>
                                <p class="text-sm text-[#7a7070] leading-relaxed">${data.grok}</p>
                            </div>
                            <div class="pl-3 border-l-2 border-[#a3b1c6]">
                                <p class="text-[10px] text-[#a3b1c6] mb-1 tracking-wider">Gemini 的散文诗</p>
                                <p class="text-sm text-[#7a7070] leading-relaxed serif">${data.gemini}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.style.opacity = '1';
                currentIndex = (currentIndex + 1) % evidences.length;
            }, 300);
        }
    </script>
</body>
</html>
