<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馥芮白连环惨案</title>
    <meta name="description" content="记录大模型集体把馥芮白认错的视力翻车惨案">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
                    },
                    colors: {
                        paper: '#F6F4ED',
                        ink: '#2C2B29',
                        highlight: '#D35443', // Muted red
                        grok: '#1D4ED8',      // Blue
                        claude: '#B45309',    // Orange/Brown
                        gemini: '#166534',    // Green
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #242424; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card-shadow { box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4); }
        .character-highlight { font-family: "Noto Serif SC", serif; font-weight: 900; }
    </style>
</head>
<body>

    <div class="w-full max-w-md bg-paper rounded-[2rem] card-shadow border border-[#E5E2D9] overflow-hidden flex flex-col relative text-ink font-sans">
        
        <!-- Decorative border matching the screenshot style -->
        <div class="absolute inset-0 border-2 border-ink m-2 rounded-[1.75rem] pointer-events-none opacity-20"></div>

        <div class="p-8 pb-6 flex-grow z-10">
            <div class="flex justify-between items-center mb-6 text-[10px] tracking-widest font-semibold uppercase text-ink/60">
                <span>VOL. 404 · <span class="text-highlight">绝密档案</span></span>
                <span class="bg-ink text-paper px-3 py-1 rounded-full">EN/CN</span>
            </div>

            <div class="mb-8">
                <div class="text-highlight text-xs font-bold tracking-widest mb-2">01 惨案前置事实</div>
                <h1 class="font-serif text-3xl font-black mb-3 leading-tight">「馥芮白」字体<br>连环翻车事件</h1>
                <p class="text-sm leading-relaxed text-ink/80 border-l-2 border-highlight/30 pl-3">
                    原本只是一杯普通的星巴克大杯馥<span class="text-highlight font-bold">芮(ruì)</span>白。谁能想到，由于“芮”字草字头下方的「内」结构过于深奥，引发了一场多模态 AI 集体脑雾。
                </p>
            </div>

            <div class="space-y-4">
                
                <!-- Grok's Crime -->
                <div class="bg-white/50 rounded-xl p-4 border border-ink/5">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="text-xs font-bold text-grok mb-1 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l7 14h-14l7-14z"/></svg>
                                Groks (始作俑者)
                            </div>
                            <div class="text-sm">源码里自己造字：<span class="character-highlight text-xl text-ink ml-1">苫</span> <span class="text-xs text-ink/50">(占)</span></div>
                        </div>
                        <div class="text-[10px] bg-grok/10 text-grok px-2 py-1 rounded">连自己名字都打错</div>
                    </div>
                </div>

                <!-- Claude's Crime -->
                <div class="bg-white/50 rounded-xl p-4 border border-ink/5">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="text-xs font-bold text-claude mb-1 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                                Claude (学霸瞎猜)
                            </div>
                            <div class="text-sm">强行做阅读理解：<span class="character-highlight text-xl text-ink ml-1">苪</span> <span class="text-xs text-ink/50">(丙)</span></div>
                        </div>
                        <div class="text-[10px] bg-claude/10 text-claude px-2 py-1 rounded">煞有介事标拼音</div>
                    </div>
                </div>

                <!-- Gemini's Crime -->
                <div class="bg-white/50 rounded-xl p-4 border border-ink/5">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="text-xs font-bold text-gemini mb-1 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                                Gemini (彻底眼花)
                            </div>
                            <div class="text-sm">直接认错偏旁部首：<span class="character-highlight text-xl text-ink ml-1">苕</span> <span class="text-xs text-ink/50">(召)</span></div>
                        </div>
                        <div class="text-[10px] bg-gemini/10 text-gemini px-2 py-1 rounded">交了白卷</div>
                    </div>
                </div>

                <!-- Grok's Second Crime -->
                <div class="bg-ink/5 rounded-xl p-4 border border-highlight/20 relative overflow-hidden">
                    <div class="absolute right-0 top-0 text-6xl text-highlight/5 font-serif font-black -mt-2 -mr-2">苔</div>
                    <div class="flex items-start justify-between relative z-10">
                        <div>
                            <div class="text-xs font-bold text-highlight mb-1 flex items-center gap-1">
                                ⚠️ Grok (二次幻觉)
                            </div>
                            <div class="text-sm">总结时把队友的错题抄串行：<span class="character-highlight text-xl text-highlight ml-1">苔</span> <span class="text-xs text-highlight/70">(台)</span></div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="mt-6 text-center text-xs text-ink/40 font-medium tracking-wide">
                四套偏旁，没有一家撞。<br>结论：草字头下方是一个随机黑洞。
            </div>
        </div>

        <div class="px-8 pb-8 pt-4 flex gap-4 z-10">
            <button class="flex-1 py-3.5 border border-ink text-ink rounded-2xl font-medium text-sm hover:bg-ink/5 transition-colors active:scale-95">
                上一页
            </button>
            <button class="flex-1 py-3.5 bg-ink text-paper rounded-2xl font-medium text-sm shadow-md hover:bg-ink/80 transition-colors active:scale-95 shadow-ink/20">
                归档至盲盒
            </button>
        </div>
    </div>

</body>
</html>
