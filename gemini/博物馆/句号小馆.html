<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句号小馆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --stone-bg: #dce0e3; /* 清冷的石头灰 */
            --stone-dark: #646a73; /* 深灰刻字 */
            --cinnabar: #c12c1f; /* 朱砂红 */
        }
        
        body {
            background-color: var(--stone-bg);
            color: var(--stone-dark);
            margin: 0;
            overflow: hidden; /* 防止滚动，保持画布纯粹 */
            font-family: 'Songti SC', 'SimSun', serif; /* 默认使用宋体，最能体现句号的传统美 */
            transition: background-color 0.5s ease;
        }

        .master-period {
            font-size: 30vmin; /* 响应式巨型尺寸 */
            color: var(--cinnabar);
            line-height: 1;
            cursor: pointer;
            user-select: none;
            text-shadow: 2px 4px 10px rgba(193, 44, 31, 0.15); /* 淡淡的朱砂晕染 */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: breathe 4s ease-in-out infinite;
        }

        .master-period:active {
            transform: scale(0.85);
            text-shadow: 0px 0px 0px rgba(193, 44, 31, 0);
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .bubble-period {
            position: absolute;
            color: var(--cinnabar);
            user-select: none;
            pointer-events: none;
            font-weight: 300;
            opacity: 0.8;
            animation: float-away 3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes float-away {
            0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        .font-btn {
            transition: all 0.2s;
        }
        .font-btn.active {
            background-color: var(--stone-dark);
            color: var(--stone-bg);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- 背景装饰：碑廊的意境 -->
    <div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-5">
        <span class="text-[80vw] font-bold tracking-tighter">。</span>
    </div>

    <!-- 核心展区：句号标本 -->
    <div class="relative z-10 flex flex-col items-center">
        <div id="central-period" class="master-period" onclick="scatterPeriods(event)">。</div>
        <p class="mt-8 text-sm tracking-[0.3em] font-light text-opacity-70 text-[var(--stone-dark)]">
            触摸这颗空心珠子
        </p>
    </div>

    <div class="absolute bottom-10 z-20 control-panel rounded-2xl px-6 py-3 flex gap-4 items-center">
        <span class="text-xs tracking-widest mr-2 opacity-60">标本形态</span>
        <button onclick="changeFont('Songti SC, SimSun, serif', this)" class="font-btn active px-4 py-2 rounded-xl text-sm tracking-widest border border-transparent hover:border-[var(--stone-dark)]">宋</button>
        <button onclick="changeFont('Heiti SC, SimHei, sans-serif', this)" class="font-btn px-4 py-2 rounded-xl text-sm tracking-widest border border-transparent hover:border-[var(--stone-dark)]">黑</button>
        <button onclick="changeFont('Kaiti SC, KaiTi, serif', this)" class="font-btn px-4 py-2 rounded-xl text-sm tracking-widest border border-transparent hover:border-[var(--stone-dark)]">楷</button>
    </div>

    <script>
        // 字体切换逻辑：让你看看不同字体下句号的“长相”
        function changeFont(fontFamily, btnElement) {
            // 更新全身字体
            document.body.style.fontFamily = fontFamily;
            
            // 更新按钮激活状态
            document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // 切换字体时，也激发出几个小句号作为反馈
            const rect = document.getElementById('central-period').getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            for(let i=0; i<3; i++){
                createBubble(centerX, centerY);
            }
        }

        // 点击散落逻辑：像石头投入水面激起空心水花
        function scatterPeriods(e) {
            // 每次点击生成 3-6 个随机小句号
            const count = Math.floor(Math.random() * 4) + 3;
            for (let i = 0; i < count; i++) {
                createBubble(e.clientX, e.clientY);
            }
        }

        // 创建飘浮小句号的工厂函数
        function createBubble(x, y) {
            const bubble = document.createElement('div');
            bubble.textContent = '。';
            bubble.className = 'bubble-period';
            
            // 随机大小
            const size = Math.random() * 40 + 20; 
            bubble.style.fontSize = `${size}px`;
            
            // 初始位置微调，以点击位置为中心
            bubble.style.left = `${x - size/2}px`;
            bubble.style.top = `${y - size/2}px`;
            
            // 随机飞散的方向和距离
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 150 + 50;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            // 将目标位移通过 CSS 变量传给动画
            bubble.style.setProperty('--tx', `${tx}px`);
            bubble.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(bubble);
            
            // 动画结束后清理 DOM 节点
            setTimeout(() => {
                bubble.remove();
            }, 3000);
        }
    </script>
</body>
</html>
