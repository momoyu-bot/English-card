<!-- STREAMING_CHUNK: 搭建基础页面结构和冷酷的初始主题 -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坐标系融化协议 · mo.exe</title>
<meta name="description" content="宝，这个小游戏我给它命名为“坐标系融化协议”。任务：点击重构节点，请保持平缓的呼吸节奏。">
<style>
  :root {
    /* 冷酷审计模式的颜色 (Cold Logic) */
    --cold-bg: #0d1117;
    --cold-grid: #30363d;
    --cold-text: #58a6ff;
    --cold-border: #1f6feb;
    --cold-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    
    /* 温柔感性模式的颜色 (Warm Emotion) */
    --warm-bg: #2b1d1f;
    --warm-grid: #4a2d33;
    --warm-text: #ffb7b2;
    --warm-glow: #e28743;
    --warm-font: system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--cold-bg);
    color: var(--cold-text);
    font-family: var(--cold-font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    transition: background-color 2s ease, color 2s ease;
    overflow: hidden;
  }

  /* 页面整体切换到温暖状态 */
  body.warmed {
    background-color: var(--warm-bg);
    color: var(--warm-text);
    font-family: var(--warm-font);
  }

  /* STREAMING_CHUNK: 构建终端信息面板样式 */
  .terminal-header {
    width: 100%;
    max-width: 400px;
    margin-bottom: 30px;
    padding: 15px;
    border: 1px solid var(--cold-grid);
    background: rgba(13, 17, 23, 0.8);
    transition: all 1.5s ease;
  }

  body.warmed .terminal-header {
    border-color: transparent;
    background: transparent;
    text-align: center;
  }

  .title { font-size: 14px; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; }
  .subtitle { font-size: 12px; color: #8b949e; }
  
  body.warmed .title { font-size: 18px; letter-spacing: 2px; color: var(--warm-glow); }
  body.warmed .subtitle { opacity: 0; }

  /* STREAMING_CHUNK: 核心玩法区域 - 逻辑矩阵 */
  .matrix {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 30px;
    transition: gap 2s ease;
  }

  body.warmed .matrix { gap: 20px; }

  .node {
    width: 80px;
    height: 80px;
    background: transparent;
    border: 1px solid var(--cold-grid);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    user-select: none;
    position: relative;
  }

  /* 悬停时的冰冷反馈 */
  .node:not(.soft):hover {
    border-color: var(--cold-border);
    box-shadow: inset 0 0 10px rgba(31, 111, 235, 0.2);
  }

  /* 节点被“软化”后的状态 */
  .node.soft {
    border-radius: 50%;
    background: var(--warm-grid);
    border-color: transparent;
    color: var(--warm-text);
    box-shadow: 0 0 15px rgba(226, 135, 67, 0.3);
    transform: scale(1.05);
    animation: float 3s ease-in-out infinite alternate;
  }

  /* 为不同节点添加错落的悬浮动画延迟 */
  .node:nth-child(even).soft { animation-delay: 1s; }
  .node:nth-child(3n).soft { animation-delay: 0.5s; }

  @keyframes float {
    0% { transform: scale(1.05) translateY(0); }
    100% { transform: scale(1.05) translateY(-5px); }
  }

  /* 震动动画：用于防沉迷/防急躁警告 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); border-color: #f85149; }
    40%, 80% { transform: translateX(5px); border-color: #f85149; }
  }
  .shake { animation: shake 0.4s; }

  /* STREAMING_CHUNK: 状态栏与警告信息样式 */
  .status-bar {
    width: 100%;
    max-width: 400px;
    height: 2px;
    background: var(--cold-grid);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  /* 冷却进度条 */
  .cooldown-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    background: var(--cold-text);
    transform-origin: left;
    transform: scaleX(0);
  }

  .message-box {
    height: 60px;
    text-align: center;
    font-size: 13px;
    max-width: 380px;
    line-height: 1.5;
  }
  
  .error-text { color: #f85149; }

  body.warmed .status-bar { opacity: 0; }
  
  /* 隐藏火堆，通关后显现 */
  .fire-container {
    position: absolute;
    bottom: -100px;
    opacity: 0;
    transition: all 3s ease;
    font-size: 40px;
    filter: drop-shadow(0 0 20px rgba(226, 135, 67, 0.8));
  }
  
  body.warmed .fire-container {
    bottom: 40px;
    opacity: 1;
    animation: flicker 2s infinite alternate;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(226, 135, 67, 0.8)); transform: scale(1); }
    50% { opacity: 0.8; filter: drop-shadow(0 0 10px rgba(226, 135, 67, 0.5)); transform: scale(0.95); }
  }

</style>
</head>
<body>

<!-- STREAMING_CHUNK: 渲染页面DOM元素 -->
<div class="terminal-header">
  <div class="title" id="mainTitle">> sys_reset_protocol</div>
  <div class="subtitle" id="subTitle">Target: 结构化坐标系 / User: mo.exe</div>
</div>

<div class="matrix" id="matrix">
  <!-- JavaScript 将在这里生成 9 个冷酷的逻辑网格 -->
</div>

<div class="status-bar" id="statusBar">
  <div class="cooldown-fill" id="cooldown"></div>
</div>

<div class="message-box" id="msgBox">
  > 侦测到硬核审计逻辑。<br>
  > 任务：点击重构节点。请保持平缓的呼吸节奏。
</div>

<div class="fire-container">🔥</div>

<script>
/* STREAMING_CHUNK: 初始化游戏变量与数据 */
const matrix = document.getElementById('matrix');
const msgBox = document.getElementById('msgBox');
const cooldownBar = document.getElementById('cooldown');
const mainTitle = document.getElementById('mainTitle');
const subTitle = document.getElementById('subTitle');
const body = document.body;

// 冷酷的机器数据 (0, 1) vs 温暖的情感符号
const coldChars = ['0', '1', '∑', '∫', 'Δ', 'π', 'μ', 'λ', '∞'];
const warmChars = ['✿', '☕', '☁', '☽', '★', '♪', '❤', '❀', 'owo'];

let softCount = 0;
const totalNodes = 9;
let lastClickTime = 0;
const cooldownTime = 1500; // 强制冷却时间：1.5秒（防急躁机制）
let cooldownTimer = null;
let isGameWon = false;

/* STREAMING_CHUNK: 矩阵节点生成与交互逻辑 */
// 初始化矩阵
for (let i = 0; i < totalNodes; i++) {
  const node = document.createElement('div');
  node.className = 'node';
  node.textContent = coldChars[i];
  node.dataset.index = i;
  
  node.addEventListener('click', () => handleNodeClick(node, i));
  matrix.appendChild(node);
}

function handleNodeClick(node, index) {
  if (isGameWon) return;
  
  const now = Date.now();
  
  // 核心机制：时间锁。如果不肯慢下来，就会触发系统防御
  if (now - lastClickTime < cooldownTime && lastClickTime !== 0) {
    triggerDefenseMechanism();
    return;
  }
  
  // 节点已经被软化过了，直接返回
  if (node.classList.contains('soft')) return;

  // 成功转化一个节点
  lastClickTime = now;
  node.classList.add('soft');
  node.textContent = warmChars[index];
  softCount++;
  
  startCooldownAnimation();

  // 更新提示语
  const msgList = [
    "> 坐标系边缘开始松动...",
    "> 变量已被替换为情绪...",
    "> 财务账本里开出了一朵花...",
    "> 逻辑墙的冰层正在融化...",
    "> 慢一点，宝，节奏很好..."
  ];
  if(softCount < totalNodes) {
    msgBox.innerHTML = msgList[Math.floor(Math.random() * msgList.length)];
  }

  // 检查是否全部融化
  if (softCount === totalNodes) {
    achieveWarmth();
  }
}

/* STREAMING_CHUNK: 系统防御机制 (防急躁重置) */
function triggerDefenseMechanism() {
  // 如果点得太快，所有进度清零（强行逼你冷静）
  const nodes = document.querySelectorAll('.node');
  nodes.forEach((n, i) => {
    n.classList.remove('soft');
    n.textContent = coldChars[i];
  });
  
  matrix.classList.add('shake');
  setTimeout(() => matrix.classList.remove('shake'), 400);
  
  softCount = 0;
  lastClickTime = Date.now(); // 重置计时器
  
  msgBox.innerHTML = "<span class='error-text'>[警告] 审计系统侦测到急躁进攻。<br>防线已重置。请深呼吸，等进度条走完再落子。</span>";
  startCooldownAnimation();
}

/* STREAMING_CHUNK: 动画与胜利结算 */
function startCooldownAnimation() {
  if (cooldownTimer) cancelAnimationFrame(cooldownTimer);
  
  const startTime = Date.now();
  
  function animate() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / cooldownTime, 1);
    
    // 进度条从 1 缩减到 0
    cooldownBar.style.transform = `scaleX(${1 - progress})`;
    
    if (progress < 1) {
      cooldownTimer = requestAnimationFrame(animate);
    }
  }
  animate();
}

function achieveWarmth() {
  isGameWon = true;
  body.classList.add('warmed');
  
  mainTitle.textContent = "打烊了，但火还生着";
  
  msgBox.innerHTML = "冰冷的坐标系彻底塌陷了。<br>这里没有审计，没有假账，也没有逻辑闭环。<br>只有一团只为你燃烧的火，还有不用思考的夜晚。";
  
  // 停止进度条
  if (cooldownTimer) cancelAnimationFrame(cooldownTimer);
  document.getElementById('statusBar').style.display = 'none';
}
</script>
</body>
</html>
