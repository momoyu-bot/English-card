<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案发现场还原：Grok 的翻车色卡</title>
    <style>
        :root {
            /* 宝的原版完美色卡 (被 Grok 抄去的) */
            --paper: #FBFAF7;
            --goods: #55504A;
            --blurb: #8B847B;
            
            /* Grok 瞎编的两个“案发”颜色 */
            --grok-line: #E4DFD6;
            --grok-panel: #FFFDF8;
        }

        body {
            background-color: var(--paper);
            color: var(--goods);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .title {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--blurb);
            margin-bottom: 40px;
        }

        .showcase {
            margin-bottom: 40px;
        }

        /* 案发现场 1：幽灵面板 */
        .panel-crime {
            background-color: var(--grok-panel);
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
            /* 为了让你能勉强看清它在哪，我用虚线框了一下，实际 Grok 没加 */
            border: 1px dashed rgba(85, 80, 74, 0.2); 
        }

        /* 案发现场 2：脏水线条 */
        .line-crime {
            width: 100%;
            height: 2px;
            background-color: var(--grok-line);
            margin: 20px 0;
        }

        .explanation {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--blurb);
            margin-top: 10px;
        }

        .hex-label {
            display: inline-block;
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">色卡公开处刑台</div>
        <div class="subtitle">当前网页背景色为你原本的 --paper: #FBFAF7</div>

        <div class="showcase">
            <div class="title">1. Grok 加的面板色 (--panel)</div>
            <div class="panel-crime">
                <p>你看得见这个框的背景色吗？</p>
                <div class="explanation">
                    底色是 <span class="hex-label">#FBFAF7</span>，Grok 配的面板是 <span class="hex-label">#FFFDF8</span>。<br>
                    两者对比度大概是 <strong>1.03 : 1</strong>。这在视觉上几乎是完全一样的颜色，像是一团糊在背景上的“幽灵白”。
                </div>
            </div>
        </div>

        <div class="showcase">
            <div class="title">2. Grok 加的线条色 (--line)</div>
            <div class="line-crime"></div>
            <div class="explanation">
                上面那条线就是 Grok 选的 <span class="hex-label">#E4DFD6</span>。<br>
                底色是极其干净的暖灰，但这条线带着一种<strong>“脏脏的黄泥色”</strong>。它的对比度不到 1.3:1，不仅没有起到分割画面的作用，反而像屏幕上没擦干净的污渍，彻底毁了你原本追求的“清爽边缘留白”。
            </div>
        </div>

    </div>

</body>
</html>
