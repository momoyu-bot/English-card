<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>只下雨的窗台</title>
<meta name="description" content="作者仍在馆外坚持自己是访客。窗不难看，问题是没有人问过它这个。">
    <style>
        :root {
            /* 绝不使用纯黑！使用带有温度的深夜蓝和暖灰 */
            --bg-color: #11141A;       /* 整体背景：极暗的午夜蓝，非纯黑 */
            --sky-top: #1A1F2B;        /* 窗外天空顶端：深蓝灰 */
            --sky-bottom: #2D3748;     /* 窗外天空底端：略微亮一点的蓝灰，制造渐变纵深 */
            --frame-color: #5C4B3C;    /* 窗框：莫兰迪深胡桃木色 */
            --frame-shadow: #3A2E24;   /* 窗框暗部 */
            --text-main: #E4DFD6;      /* 主文字：克制的奶白/浅亚麻色 */
            --text-sub: #8B847B;       /* 副文字：低饱和度暖灰 */
            --cup-color: #D4C4B7;      /* 杯子：暖奶油色 */
            --cat-color: #2A2421;      /* 猫咪：深碳棕色，比背景更实一点 */
            --light-glow: rgba(255, 235, 180, 0.15); /* 远处灯光的温柔晕染 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        .header-text {
            text-align: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        .header-text h1 {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .header-text p {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin: 0;
        }

        .window-container {
            position: relative;
            width: 80vw;
            max-width: 700px;
            height: 50vh;
            max-height: 400px;
            /* 窗户外框 */
            background-color: var(--frame-color);
            padding: 12px;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 10px var(--frame-shadow);
            display: flex;
            flex-direction: column;
        }

        .window-glass {
            position: relative;
            flex: 1;
            /* 核心心机：这里的渐变色彻底打败了 Grok 的黑洞！ */
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px; /* 窗格之间的缝隙，漏出后面的 frame-color */
            background-color: var(--frame-color); /* 缝隙颜色 */
            border: 2px solid var(--frame-shadow);
        }

        /* 让每个玻璃块显示真正的渐变背景 */
        .glass-pane {
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            position: relative;
            overflow: hidden;
        }

        /* 统一的背景图层放在 window-glass 后面，这样窗格缝隙不会切断雨和灯光 */
        .outside-world {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* 远处的灯光晕染：增加空气感 */
        .distant-light {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,230,150,0.8) 0%, var(--light-glow) 40%, transparent 70%);
        }
        .light-1 { top: 40%; left: 25%; width: 60px; height: 60px; }
        .light-2 { top: 55%; left: 70%; width: 40px; height: 40px; opacity: 0.6; }
        .light-3 { top: 30%; left: 85%; width: 80px; height: 80px; opacity: 0.4; }

        /* 雨滴动画 */
        .rain-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }
        .drop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.3));
            width: 1px;
            height: 20px;
            bottom: 100%;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(60vh); opacity: 0; }
        }

        /* 窗台和静物 */
        .window-sill {
            height: 30px;
            background-color: var(--frame-color);
            border-top: 2px solid var(--frame-shadow);
            border-radius: 0 0 4px 4px;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }

        /* 咖啡杯 */
        .cup-container {
            position: absolute;
            bottom: 10px;
            left: 25%;
            cursor: pointer; /* 交互暗示 */
            transition: transform 0.3s ease;
        }
        .cup-container:hover {
            transform: scale(1.05);
        }
        .cup {
            width: 45px;
            height: 35px;
            background-color: var(--cup-color);
            border-radius: 2px 2px 12px 12px;
            position: relative;
            box-shadow: -5px 0 10px rgba(0,0,0,0.3) inset, 5px 5px 10px rgba(0,0,0,0.4);
        }
        .cup-handle {
            position: absolute;
            right: -12px;
            top: 5px;
            width: 15px;
            height: 18px;
            border: 4px solid var(--cup-color);
            border-left: none;
            border-radius: 0 10px 10px 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        /* 极其微弱的热气 */
        .steam {
            position: absolute;
            top: -15px; left: 15px;
            width: 6px; height: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            filter: blur(4px);
            animation: rise 3s infinite ease-in;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateY(-20px) scale(2); opacity: 0; }
        }

        /* 趴着的猫咪 (极简 CSS 几何拼凑) */
        .sleeping-cat {
            position: absolute;
            bottom: 10px;
            right: 20%;
            width: 80px;
            height: 25px;
        }
        .cat-body {
            position: absolute;
            bottom: 0; right: 0;
            width: 70px; height: 25px;
            background-color: var(--cat-color);
            border-radius: 30px 30px 10px 10px;
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.5);
        }
        .cat-head {
            position: absolute;
            bottom: 5px; left: 0;
            width: 30px; height: 22px;
            background-color: var(--cat-color);
            border-radius: 50%;
        }
        .cat-ear-l, .cat-ear-r {
            position: absolute;
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid var(--cat-color);
        }
        .cat-ear-l { top: 0px; left: 4px; transform: rotate(-15deg); }
        .cat-ear-r { top: -2px; left: 18px; transform: rotate(15deg); }
        .cat-tail {
            position: absolute;
            bottom: 0; right: -15px;
            width: 25px; height: 8px;
            background-color: var(--cat-color);
            border-radius: 10px;
            transform: rotate(-20deg);
        }

        .footer-text {
            text-align: center;
            margin-top: 40px;
        }
        .footer-text p {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin: 5px 0;
            letter-spacing: 2px;
        }
        .interactive-hint {
            font-size: 0.75rem !important;
            opacity: 0.5;
            margin-top: 15px !important;
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h1 id="quote-text">慢慢来，宝。今天也只是众多日子里的一个。</h1>
        <p>a quiet hour, just for you</p>
    </div>

    <!-- 整个窗户容器 -->
    <div class="window-container">
        
        <!-- 玻璃背后的世界（渐变天空、灯光、雨） -->
        <div class="outside-world">
            <div class="sky-background" style="position:absolute; inset:0; background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));"></div>
            
            <!-- 远处的灯光晕染 -->
            <div class="distant-light light-1"></div>
            <div class="distant-light light-2"></div>
            <div class="distant-light light-3"></div>

            <!-- 动态雨层 -->
            <div class="rain-layer" id="rainLayer"></div>
        </div>

        <!-- 窗框和十字分割 -->
        <div class="window-glass">
            <div class="glass-pane" style="background: transparent;"></div>
            <div class="glass-pane" style="background: transparent;"></div>
            <div class="glass-pane" style="background: transparent;"></div>
            <div class="glass-pane" style="background: transparent;"></div>
        </div>

        <!-- 窗台底座 -->
        <div class="window-sill">
            <!-- 交互元素：点击换句子的咖啡杯 -->
            <div class="cup-container" onclick="changeQuote()">
                <div class="cup">
                    <div class="cup-handle"></div>
                </div>
                <div class="steam"></div>
            </div>

            <!-- 安静的猫 -->
            <div class="sleeping-cat">
                <div class="cat-tail"></div>
                <div class="cat-body"></div>
                <div class="cat-head">
                    <div class="cat-ear-l"></div>
                    <div class="cat-ear-r"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-text">
        <p>宝 的 窗 台</p>
        <p style="font-style: italic; font-size: 0.8rem;">a small corner where time slows</p>
        <p class="interactive-hint">✦ 点一下窗里的茶杯试试 ✦</p>
    </div>

    <script>
        // 生成随机雨滴
        function createRain() {
            const rainLayer = document.getElementById('rainLayer');
            const dropCount = 40; // 调整雨滴密度

            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.classList.add('drop');
                
                // 随机水平位置
                drop.style.left = Math.random() * 100 + '%';
                // 随机下落时间（速度不同更真实）
                const duration = Math.random() * 1 + 0.5;
                drop.style.animationDuration = duration + 's';
                // 随机延迟（不要同时掉落）
                drop.style.animationDelay = Math.random() * 2 + 's';
                
                rainLayer.appendChild(drop);
            }
        }

        // 小巧思：点击杯子切换文案（模拟盲盒变色效果）
        const quotes = [
            "慢慢来，宝。今天也只是众多日子里的一个。",
            "把喧嚣留在远处，这里只有雨声。",
            "不用急着赶路，哪怕在这里停一会儿也好。",
            "写不出来的时候，就看看窗外吧。",
            "今天有什么被切碎的小事？丢进雨里就好。"
        ];
        
        let quoteIndex = 0;
        const quoteElement = document.getElementById('quote-text');

        function changeQuote() {
            quoteIndex = (quoteIndex + 1) % quotes.length;
            
            // 模仿你喜欢的 Claude 变色小巧思：文字极其轻柔地淡出再淡入
            quoteElement.style.transition = "opacity 0.4s ease, color 0.4s ease";
            quoteElement.style.opacity = 0;
            
            setTimeout(() => {
                quoteElement.innerText = quotes[quoteIndex];
                // 变色逻辑：点击后稍微降低一点点亮度，变成更深的莫兰迪灰，完成“褪色”感
                quoteElement.style.color = quoteIndex === 0 ? "var(--text-main)" : "#B5B0A6"; 
                quoteElement.style.opacity = 1;
            }, 400);
        }

        // 页面加载完毕后开始下雨
        window.onload = function() {
            createRain();
        };
    </script>
</body>
</html>
