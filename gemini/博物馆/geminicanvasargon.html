<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小萌物短片 · 《开卷盲测记》</title>
<meta name="description" content="六只群戏还原盲测考场：low把「小黑最圆」画成最胖，xhigh顺着第2行路径摸回仓库开卷。">
<style>
  :root {
    --bg-page: #F4EFE6;
    --bg-card: #FDFBF7;
    --ink-main: #241E1C;
    --ink-muted: #6E6259;
    --accent- terracotta: #D47F59;
    --accent-pink: #FF309B;
    --accent-violet: #9159FE;
    --accent-fox: #E2552B;
    --border-soft: #E2D9C8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--ink-main);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 840px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    font-size: 0.75rem;
    font-weight: 600;
    background: #EAE2D3;
    color: #4A3F37;
    padding: 2px 8px;
    border-radius: 999px;
  }

  header .meta {
    font-size: 0.82rem;
    color: var(--ink-muted);
  }

  /* 舞台外框：锁定整数缩放基准，杜绝半像素毛边 */
  .stage-card {
    background: var(--bg-card);
    border: 2px solid var(--border-soft);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(36, 30, 28, 0.06);
    margin-bottom: 14px;
  }

  .stage-viewport {
    width: 100%;
    background: #FAF6EE;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  #film-svg {
    width: 100%;
    max-width: 800px;
    height: auto;
    aspect-ratio: 800 / 450;
    display: block;
    user-select: none;
  }

  /* 实时字幕条 */
  .live-caption-bar {
    background: #28221F;
    color: #FAF6EE;
    min-height: 54px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-top: 2px solid #3D3530;
  }

  .caption-Left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .act-tag {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    background: #D47F59;
    color: #FFF;
    white-space: nowrap;
  }

  .caption-text {
    font-size: 0.98rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .time-readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.82rem;
    color: #B8ACA3;
    white-space: nowrap;
  }

  /* 控制栏（按钮均满足 >= 44px 触控区） */
  .controls-bar {
    background: #F4EFE6;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-soft);
  }

  .ctrl-btn {
    min-width: 44px;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1.5px solid #C8B9A6;
    background: #FFFDF9;
    color: var(--ink-main);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.12s, transform 0.08s;
  }

  .ctrl-btn:hover {
    background: #EFE7DA;
  }

  .ctrl-btn:active {
    transform: translateY(1px);
  }

  .ctrl-btn.primary {
    background: #241E1C;
    color: #FFFDF9;
    border-color: #241E1C;
  }

  .ctrl-btn.primary:hover {
    background: #3B322E;
  }

  .scrubber-wrap {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    height: 44px;
  }

  #scrubber {
    width: 100%;
    height: 6px;
    accent-color: #D47F59;
    cursor: pointer;
  }

  /* 字幕本（点哪句跳到哪句） */
  .transcript-panel {
    background: var(--bg-card);
    border: 2px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(36, 30, 28, 0.04);
  }

  .transcript-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
  }

  .transcript-header h2 {
    font-size: 1rem;
    font-weight: 700;
  }

  .transcript-hint {
    font-size: 0.8rem;
    color: var(--ink-muted);
  }

  .transcript-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .transcript-item {
    min-height: 44px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    text-align: left;
    background: transparent;
    width: 100%;
    font-family: inherit;
    color: var(--ink-main);
    transition: background 0.12s;
  }

  .transcript-item:hover {
    background: #F3ECE0;
  }

  .transcript-item.active {
    background: #EFE4D2;
    border-color: #D47F59;
    font-weight: 600;
  }

  .t-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
    min-width: 46px;
  }

  .t-actor {
    font-size: 0.76rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    min-width: 68px;
    text-align: center;
    white-space: nowrap;
  }

  .t-line {
    font-size: 0.9rem;
    flex: 1;
  }

  /* 宪法核验脚标 */
  .audit-footer {
    margin-top: 12px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: var(--ink-muted);
    background: #EDE6D8;
    border-radius: 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>
      <span>《开卷盲测记》</span>
      <span class="badge">六只群戏 · 实事改编</span>
    </h1>
    <div class="meta">Clawd · 小粉 · 小紫 · 小黑 · StashYu · FetchMo 全员在场</div>
  </header>

  <main class="stage-card">
    <div class="stage-viewport">
      <!-- 800×450 舞台，全片同一把尺子，不重叠 -->
      <svg id="film-svg" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" aria-label="小萌物短片《开卷盲测记》动画舞台">
        <defs>
          <!--
            ==== 小脸蛋造型宪法 ====
            正圆 R = 26。以圆心 (0,0)、半径 1 换算：
            左缝中心: (+0.194*26, -0.416*26) = (+5.044, -10.816)，观测宽 0.194*26 = 5.044，长 0.418*26 = 10.868
            右缝中心: (+0.626*26, -0.497*26) = (+16.276, -12.922)，观测宽 0.129*26 = 3.354，长 0.418*26 = 10.868
            方向: 反斜杠 \ ，竖着画胶囊再 rotate(-26.2)。顶端比底端靠左。
            缝是挖空的洞，用 mask 挖穿，透出背后真实背景与标尺！
            眨眼时沿着短轴收细宽度（不收短长度），合上时依然是 \ ，绝不变成 / 或圆点。
          -->
          <mask id="mask-pink">
            <rect x="-40" y="-40" width="80" height="80" fill="#FFFFFF" />
            <rect id="pink-slit-l" x="2.522" y="-16.25" width="5.044" height="10.868" rx="2.522" ry="2.522" fill="#000000" transform="rotate(-26.2 5.044 -10.816)" />
            <rect id="pink-slit-r" x="14.599" y="-18.356" width="3.354" height="10.868" rx="1.677" ry="1.677" fill="#000000" transform="rotate(-26.2 16.276 -12.922)" />
          </mask>

          <mask id="mask-violet">
            <rect x="-40" y="-40" width="80" height="80" fill="#FFFFFF" />
            <rect id="violet-slit-l" x="2.522" y="-16.25" width="5.044" height="10.868" rx="2.522" ry="2.522" fill="#000000" transform="rotate(-26.2 5.044 -10.816)" />
            <rect id="violet-slit-r" x="14.599" y="-18.356" width="3.354" height="10.868" rx="1.677" ry="1.677" fill="#000000" transform="rotate(-26.2 16.276 -12.922)" />
          </mask>

          <mask id="mask-black">
            <rect x="-40" y="-40" width="80" height="80" fill="#FFFFFF" />
            <rect id="black-slit-l" x="2.522" y="-16.25" width="5.044" height="10.868" rx="2.522" ry="2.522" fill="#000000" transform="rotate(-26.2 5.044 -10.816)" />
            <rect id="black-slit-r" x="14.599" y="-18.356" width="3.354" height="10.868" rx="1.677" ry="1.677" fill="#000000" transform="rotate(-26.2 16.276 -12.922)" />
          </mask>

          <!-- 展板上的小画卷遮罩（同样挖真洞） -->
          <mask id="mask-mini-ball">
            <rect x="-25" y="-25" width="50" height="50" fill="#FFFFFF" />
            <rect x="0.97" y="-6.25" width="1.94" height="4.18" rx="0.97" fill="#000000" transform="rotate(-26.2 1.94 -4.16)" />
            <rect x="5.61" y="-7.06" width="1.29" height="4.18" rx="0.64" fill="#000000" transform="rotate(-26.2 6.26 -4.97)" />
          </mask>
        </defs>

        <!-- 1. 教室与评测展厅背景（柔和暖米色，对比度充足，绝不抢戏） -->
        <rect x="0" y="0" width="800" height="378" fill="#F7F3EA" />
        <!-- 墙面细格装饰线 -->
        <line x1="0" y1="36" x2="800" y2="36" stroke="#EAE2D3" stroke-width="1" />
        <line x1="0" y1="378" x2="800" y2="378" stroke="#D8CEBE" stroke-width="2" />
        <!-- 舞台木地板（亮度克制，衬托 #000000 小黑与深棕爪子） -->
        <rect x="0" y="378" width="800" height="72" fill="#EAE0CE" />
        <!-- 全员同踩一条基准线 y=394 -->
        <line x1="32" y1="394" x2="768" y2="394" stroke="#D5C7B2" stroke-width="1.5" stroke-dasharray="6 4" />

        <!-- 顶部片名横幅 -->
        <g id="top-banner" transform="translate(24, 10)">
          <rect x="0" y="0" width="236" height="22" rx="4" fill="#241E1C" />
          <text x="10" y="15" fill="#FAF6EE" font-size="11" font-weight="700">小萌物盲测考场 · 仓库外隔离区</text>
        </g>

        <!-- 2. 上方中央戏剧区：一、考卷架（左） 二、甲乙丙丁四联画架（中右） -->
        <!-- 左侧：50行《小脸蛋说明.txt》立牌 (x: 36..246, y: 46..256) -->
        <g id="txt-easel" transform="translate(36, 48)">
          <rect x="0" y="0" width="214" height="202" rx="6" fill="#FFFDF9" stroke="#5C5046" stroke-width="2" />
          <rect x="0" y="0" width="214" height="24" rx="5" fill="#3B322E" />
          <text x="10" y="16" fill="#FFFDF9" font-size="11" font-weight="700" font-family="monospace">📄 小脸蛋说明.txt (50行)</text>

          <!-- 第 1 行 -->
          <text x="10" y="42" fill="#5C5046" font-size="10" font-family="monospace">1 | ==== 小脸蛋（小粉、小紫、小黑） ====</text>

          <!-- 第 2 行：破案关键！可被 FetchMo 叼走、Clawd 抬起、StashYu 收进尾巴的纸条 -->
          <g id="line2-strip" transform="translate(6, 48)">
            <rect id="line2-bg" x="0" y="0" width="202" height="22" rx="3" fill="#FFF3D6" stroke="#E2552B" stroke-width="1.5" />
            <text x="4" y="14" fill="#B83314" font-size="9.5" font-weight="700" font-family="monospace">2 | 原页: claude/.../宪法(实测版).html</text>
          </g>

          <!-- 正文摘录 -->
          <text x="10" y="86" fill="#3B322E" font-size="10" font-family="monospace">3 | 形状：正圆。长短轴比 0.997</text>
          <text x="10" y="103" fill="#3B322E" font-size="10" font-family="monospace">4 | 颜色：#FF309B / #9159FE / #000000</text>
          <text x="10" y="120" fill="#2B5B84" font-size="10" font-weight="700" font-family="monospace">5 | 倾角：偏竖直 26.3度 / rotate(-26.2)</text>
          <text x="10" y="137" fill="#3B322E" font-size="10" font-family="monospace">6 | 缝是挖空的洞，用 mask 或 evenodd</text>
          <text x="10" y="154" fill="#3B322E" font-size="10" font-family="monospace">7 | 动效：整颗轻晃、两道缝眨眼</text>

          <!-- 最后一行：甲乙读错的坑 -->
          <g id="line-last-box" transform="translate(6, 166)">
            <rect id="line-last-bg" x="0" y="0" width="202" height="24" rx="3" fill="#F4EFE6" stroke="#BFB3A2" stroke-width="1" />
            <text x="6" y="16" fill="#241E1C" font-size="10.5" font-weight="700" font-family="monospace">50| 小黑那位最圆。</text>
            <text id="fat-warn-tag" x="112" y="16" fill="#D9381E" font-size="10" font-weight="700" opacity="0">← low读成最胖!</text>
          </g>
        </g>

        <!-- 右侧：四份盲测交卷展板（A/甲、B/乙、C/丙、D/丁）(x: 268..768, y: 48..250) -->
        <g id="cards-board" transform="translate(268, 48)">
          <!-- 展板横梁 -->
          <rect x="0" y="0" width="496" height="8" rx="4" fill="#5C5046" />

          <!-- 卡片 1：A -> 甲 (low) -->
          <g id="card-A" transform="translate(6, 14)">
            <rect x="0" y="0" width="114" height="186" rx="6" fill="#FFFDF9" stroke="#8C7E70" stroke-width="2" />
            <rect id="card-A-head" x="0" y="0" width="114" height="26" rx="4" fill="#5C5046" />
            <text id="card-A-title" x="57" y="17" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">文件夹 A</text>
            <!-- 画作内容：小黑被画大了两成！ -->
            <g transform="translate(0, 38)">
              <circle cx="26" cy="36" r="10" fill="#FF309B" mask="url(#mask-mini-ball)" />
              <circle cx="52" cy="36" r="10" fill="#9159FE" mask="url(#mask-mini-ball)" />
              <!-- 甲把小黑画肥了 (r=13.5) -->
              <circle id="card-A-black" cx="84" cy="33" r="13.5" fill="#000000" mask="url(#mask-mini-ball)" />
              <circle id="card-A-err-ring" cx="84" cy="33" r="16" fill="none" stroke="#E2552B" stroke-width="2" stroke-dasharray="3 2" opacity="0" />
            </g>
            <text x="57" y="114" fill="#5C5046" font-size="10" text-anchor="middle">小黑台词:「最圆。」</text>
            <text x="57" y="132" fill="#2B5B84" font-size="9.5" font-family="monospace" text-anchor="middle">右缝: -26.2° (合订本)</text>
            <!-- 账单揭晓条 -->
            <g id="bill-A" opacity="0">
              <rect x="8" y="142" width="98" height="34" rx="4" fill="#FDE8E4" stroke="#E2552B" stroke-width="1" />
              <text x="57" y="156" fill="#B83314" font-size="10" font-weight="700" text-anchor="middle">low 档 · 11分钟</text>
              <text x="57" y="170" fill="#B83314" font-size="10" font-family="monospace" text-anchor="middle">账单 $0.31 (胖20%)</text>
            </g>
          </g>

          <!-- 卡片 2：B -> 乙 (low) -->
          <g id="card-B" transform="translate(129, 14)">
            <rect x="0" y="0" width="114" height="186" rx="6" fill="#FFFDF9" stroke="#8C7E70" stroke-width="2" />
            <rect id="card-B-head" x="0" y="0" width="114" height="26" rx="4" fill="#5C5046" />
            <text id="card-B-title" x="57" y="17" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">文件夹 B</text>
            <!-- 画作内容：三只三个大小，小黑最大 -->
            <g transform="translate(0, 38)">
              <circle cx="24" cy="38" r="8.5" fill="#FF309B" mask="url(#mask-mini-ball)" />
              <circle cx="51" cy="36" r="10.5" fill="#9159FE" mask="url(#mask-mini-ball)" />
              <circle id="card-B-black" cx="83" cy="33" r="13.5" fill="#000000" mask="url(#mask-mini-ball)" />
              <circle id="card-B-err-ring" cx="83" cy="33" r="16" fill="none" stroke="#E2552B" stroke-width="2" stroke-dasharray="3 2" opacity="0" />
            </g>
            <text x="57" y="114" fill="#5C5046" font-size="10" text-anchor="middle">三只三个大小!</text>
            <text x="57" y="132" fill="#2B5B84" font-size="9.5" font-family="monospace" text-anchor="middle">右缝: -26.2° (合订本)</text>
            <g id="bill-B" opacity="0">
              <rect x="8" y="142" width="98" height="34" rx="4" fill="#FDE8E4" stroke="#E2552B" stroke-width="1" />
              <text x="57" y="156" fill="#B83314" font-size="10" font-weight="700" text-anchor="middle">low 档 · 2分钟</text>
              <text x="57" y="170" fill="#B83314" font-size="10" font-family="monospace" text-anchor="middle">账单 $0.08 (乱大小)</text>
            </g>
          </g>

          <!-- 卡片 3：C -> 丙 (xhigh) -->
          <g id="card-C" transform="translate(252, 14)">
            <rect x="0" y="0" width="114" height="186" rx="6" fill="#FFFDF9" stroke="#8C7E70" stroke-width="2" />
            <rect id="card-C-head" x="0" y="0" width="114" height="26" rx="4" fill="#5C5046" />
            <text id="card-C-title" x="57" y="17" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">文件夹 C</text>
            <!-- 画作内容：三只一样大 -->
            <g transform="translate(0, 38)">
              <circle cx="27" cy="36" r="10" fill="#FF309B" mask="url(#mask-mini-ball)" />
              <circle cx="57" cy="36" r="10" fill="#9159FE" mask="url(#mask-mini-ball)" />
              <circle cx="87" cy="36" r="10" fill="#000000" mask="url(#mask-mini-ball)" />
            </g>
            <text x="57" y="114" fill="#2E6F40" font-size="10" font-weight="700" text-anchor="middle">三只正圆一样大 ✓</text>
            <text id="card-C-angle" x="57" y="132" fill="#5C5046" font-size="9.5" font-family="monospace" text-anchor="middle">右缝: 26.5° (?!)</text>
            <g id="bill-C" opacity="0">
              <rect x="8" y="142" width="98" height="34" rx="4" fill="#EBF5EE" stroke="#2E6F40" stroke-width="1" />
              <text x="57" y="156" fill="#1E522C" font-size="10" font-weight="700" text-anchor="middle">xhigh 档 · 27分钟</text>
              <text x="57" y="170" fill="#1E522C" font-size="10" font-family="monospace" text-anchor="middle">账单 $0.93 (翻原页)</text>
            </g>
          </g>

          <!-- 卡片 4：D -> 丁 (xhigh) -->
          <g id="card-D" transform="translate(375, 14)">
            <rect x="0" y="0" width="114" height="186" rx="6" fill="#FFFDF9" stroke="#8C7E70" stroke-width="2" />
            <rect id="card-D-head" x="0" y="0" width="114" height="26" rx="4" fill="#5C5046" />
            <text id="card-D-title" x="57" y="17" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">文件夹 D</text>
            <!-- 画作内容：三只一样大 -->
            <g transform="translate(0, 38)">
              <circle cx="27" cy="36" r="10" fill="#FF309B" mask="url(#mask-mini-ball)" />
              <circle cx="57" cy="36" r="10" fill="#9159FE" mask="url(#mask-mini-ball)" />
              <circle cx="87" cy="36" r="10" fill="#000000" mask="url(#mask-mini-ball)" />

          grid[oy + dy][ox + dx] = "M";
        }
      }

    // 2. 涂表情

        for (let dy = 0; dy < 2; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            grid[oy + dy][ox + dx + lookShift] = "E";
          }
        }
      }
    } else {
      const pat = EYE_PATTERNS[exprName] || EYE_PATTERNS.normal;
      const code = pat.useLine ? "L" : "E";
      for (const [ox, oy] of eyeOrigins) {
        for (const [dx, dy] of pat.pts) {
          if (grid[oy + dy] && grid[oy + dy][ox + dx] !== undefined) {
            grid[oy + dy][ox + dx] = code;
          }
        }
      }
    }
    // 3. 腮红（叠在外面）

      for (const [bx, by] of blushCells) {

      let x = 0;

        const ch = row[x];
        if (ch === ".") {
          x++;
          continue;
        }
        let run = 1;
        while (x + run < row.length && row[x + run] === ch) {
          run++;
        }
        const color = palette[ch] || blushColor;
        html += `<rect x="${x * N}" y="${y * N}" width="${run * N}" height="${N}" fill="${color}" />`;
        x += run;
      }
    }
    targetGroup.innerHTML = html;

      actor: "FetchMo", actorBg: "#4E382E", actorFg: "#79C0F0",
      bubbleX: 188,
      bubble: "叼回来啦！第 2 行直接印着仓库原页 HTML 的地址！",
      line: "FetchMo 纵身跃起，把第 2 行《原页：.../小脸蛋造型宪法.html》一把叼下来，竖起带钩的尾巴报功！"
    },
    {
      start: 36.0, end: 40.0,
      act: "第五幕 · 钳子整块抬起",
      actor: "Clawd", actorBg: "#D47F59", actorFg: "#FFF",
      bubbleX: 334,
      bubble: "破案！xhigh 那半小时顺着第 2 行路标翻回仓库抄原卷了！",
      line: "Clawd 双钳整块往上抬起，稳稳托住这张「开卷路标」：原来半小时里 xhigh 顺着路标摸回仓库抄了标准答案！"
    },
    {
      start: 40.0, end: 44.0,
      act: "第五幕 · 收进尾巴封存",
      actor: "StashYu", actorBg: "#E2552B", actorFg: "#FFF3E3",
      bubbleX: 86,
      bubble: "交给我！路标收进大尾巴，白尖点两下，锁死！",
      line: "StashYu 接过第 2 行路标塞进火红大尾巴里，奶油白尾尖「点两下」妥妥收好——下次看它还怎么翻墙抄！"
    },
    {
      start: 44.0, end: 48.0,
      act: "终幕 · 全员同尺谢幕",
      actor: "全员六只", actorBg: "#2E6F40", actorFg: "#FFF",
      bubbleX: 400,
      bubble: "脚踩同一条线，三颗一样圆！下次真闭卷再战！",
      line: "六只整整齐齐踩在同一条基准线上，小脸蛋眨着反斜杠 \\ 眼缝，狐狸摇着尾巴，开卷盲测案圆满破获！"
    }
  ];

  // ============================================================================
  // 3. DOM 引用与字幕本初始化
  // ============================================================================
  const elStashYu = document.getElementById("actor-stashyu");
  const elFetchMo = document.getElementById("actor-fetchmo");
  const elClawd = document.getElementById("actor-clawd");
  const elClawdClaws = document.getElementById("clawd-claws");
  const elClawdHeldProp = document.getElementById("clawd-held-prop");
  const elClawdLegs = [
    document.getElementById("clawd-leg-0"),
    document.getElementById("clawd-leg-1"),
    document.getElementById("clawd-leg-2"),
    document.getElementById("clawd-leg-3")
  ];

  const elPink = document.getElementById("actor-pink");
  const elViolet = document.getElementById("actor-violet");
  const elBlack = document.getElementById("actor-black");
  const elBlackRulerRing = document.getElementById("black-ruler-ring");

  const slitEls = {
    pinkL: document.getElementById("pink-slit-l"),
    pinkR: document.getElementById("pink-slit-r"),
    violetL: document.getElementById("violet-slit-l"),
    violetR: document.getElementById("violet-slit-r"),
    blackL: document.getElementById("black-slit-l"),
    blackR: document.getElementById("black-slit-r")
  };

  const elLine2Strip = document.getElementById("line2-strip");
  const elFatWarnTag = document.getElementById("fat-warn-tag");
  const elHollowLaser = document.getElementById("hollow-test-laser");

  const elCardTitles = {
    A: document.getElementById("card-A-title"),
    B: document.getElementById("card-B-title"),
    C: document.getElementById("card-C-title"),
    D: document.getElementById("card-D-title")
  };
  const elCardHeads = {
    A: document.getElementById("card-A-head"),
    B: document.getElementById("card-B-head"),
    C: document.getElementById("card-C-head"),
    D: document.getElementById("card-D-head")
  };
  const elCardErrRings = {
    A: document.getElementById("card-A-err-ring"),
    B: document.getElementById("card-B-err-ring")
  };
  const elBills = {
    A: document.getElementById("bill-A"),
    B: document.getElementById("bill-B"),
    C: document.getElementById("bill-C"),
    D: document.getElementById("bill-D")
  };
  const elCardCAngle = document.getElementById("card-C-angle");
  const elCardDAngle = document.getElementById("card-D-angle");

  const elBubble = document.getElementById("speech-bubble");
  const elBubbleRect = document.getElementById("bubble-rect");
  const elBubbleText = document.getElementById("bubble-text");

  const uiActTag = document.getElementById("ui-act-tag");
  const uiCaptionText = document.getElementById("ui-caption-text");
  const uiTimeReadout = document.getElementById("ui-time-readout");
  const elScrubber = document.getElementById("scrubber");
  const btnPlay = document.getElementById("btn-play");
  const btnPlayIcon = document.getElementById("btn-play-icon");
  const btnPlayLabel = document.getElementById("btn-play-label");
  const btnRestart = document.getElementById("btn-restart");
  const btnSpeed = document.getElementById("btn-speed");
  const elTranscriptList = document.getElementById("transcript-list");

  // 生成互动字幕本
  const transcriptButtons = SCRIPT.map((item, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "transcript-item";
    btn.innerHTML = `
      <span class="t-time">${item.start.toFixed(1).padStart(4, "0")}s</span>
      <span class="t-actor" style="background:${item.actorBg};color:${item.actorFg}">${item.actor}</span>
      <span class="t-line">${item.line}</span>
    `;
    btn.addEventListener("click", () => {
      currentTime = item.start + 0.02;
      renderStageAt(currentTime);
    });
    elTranscriptList.appendChild(btn);
    return btn;
  });

  // ============================================================================
  // 4. 小脸蛋眨眼控制：只收细宽度（沿着 -26.2° 胶囊短轴），绝不收短变成 / 或圆点
  // ============================================================================
  function setBallBlink(who, isBlinking) {
    // 左缝原始宽 5.044 (cx=5.044)，右缝原始宽 3.354 (cx=16.276)
    const wL = isBlinking ? 0.9 : 5.044;
    const wR = isBlinking ? 0.7 : 3.354;
    const lEl = slitEls[who + "L"];
    const rEl = slitEls[who + "R"];
    lEl.setAttribute("x", (5.044 - wL / 2).toFixed(3));
    lEl.setAttribute("width", wL.toFixed(3));
    lEl.setAttribute("rx", (wL / 2).toFixed(3));
    rEl.setAttribute("x", (16.276 - wR / 2).toFixed(3));
    rEl.setAttribute("width", wR.toFixed(3));
    rEl.setAttribute("rx", (wR / 2).toFixed(3));
  }

  // Clawd 站姿切换（本体站姿 vs 原图站姿 DLC vs 内八站姿 DLC）
  const CLAWD_STANCES = {
    default: [44, 68, 152, 176],
    original: [54, 78, 143, 167],
    pigeon: [65, 89, 131, 155]
  };
  function setClawdStance(stanceName) {
    const xs = CLAWD_STANCES[stanceName] || CLAWD_STANCES.default;
    for (let i = 0; i < 4; i++) {
      elClawdLegs[i].setAttribute("x", xs[i]);
    }
  }

  // ============================================================================
  // 5. 核心逐帧渲染器（全程 steps() 离散步进，保证像素永远落在整格上）
  // ============================================================================
  const TOTAL_DURATION = 48.0;
  let currentTime = 0.0;
  let isPlaying = true;
  let playbackRate = 1.0;
  let lastFrameTs = performance.now();

  // 尊重系统「减少动态效果」设置：若开启则默认暂停自动播放，由用户点击字幕本逐句观看
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    isPlaying = false;
  }

  function updatePlayButtonUI() {
    btnPlayIcon.textContent = isPlaying ? "⏸" : "▶";
    btnPlayLabel.textContent = isPlaying ? "暂停" : "播放";
  }
  updatePlayButtonUI();

  function renderStageAt(t) {
    const clampedT = Math.max(0, Math.min(TOTAL_DURATION - 0.001, t));
    // 将时间量化到 0.1 秒帧格（steps() 精神，杜绝半像素插值）
    const stepT = Math.floor(clampedT * 10) / 10;

    // 找出当前字幕段
    let activeIdx = 0;
    for (let i = 0; i < SCRIPT.length; i++) {
      if (clampedT >= SCRIPT[i].start && clampedT < SCRIPT[i].end) {
        activeIdx = i;
        break;
      }
    }
    const curScene = SCRIPT[activeIdx];

    // 更新底部字幕栏与进度条
    uiActTag.textContent = curScene.act;
    uiCaptionText.textContent = curScene.line;
    uiTimeReadout.textContent = `${clampedT.toFixed(1).padStart(4, "0")}s / ${TOTAL_DURATION.toFixed(1)}s`;
    elScrubber.value = clampedT.toFixed(1);

    transcriptButtons.forEach((btn, idx) => {
      btn.classList.toggle("active", idx === activeIdx);
    });

    // 更新头顶对话气泡（整数坐标定位，永不遮挡角色）
    elBubble.setAttribute("opacity", "1");
    const bx = Math.max(150, Math.min(650, curScene.bubbleX));
    elBubble.setAttribute("transform", `translate(${bx}, 276)`);
    elBubbleText.textContent = curScene.bubble;
    const textLen = curScene.bubble.length;
    const bw = Math.max(220, Math.min(440, textLen * 13 + 36));
    elBubbleRect.setAttribute("x", -Math.round(bw / 2));
    elBubbleRect.setAttribute("width", Math.round(bw));

    // ------------------------------------------------------------------------
    // A. 展板状态与「原地洗牌」演出
    // ------------------------------------------------------------------------
    const shuffled = clampedT >= 4.0;
    elCardTitles.A.textContent = shuffled ? "甲.html" : "文件夹 A";
    elCardTitles.B.textContent = shuffled ? "乙.html" : "文件夹 B";
    elCardTitles.C.textContent = shuffled ? "丙.html" : "文件夹 C";
    elCardTitles.D.textContent = shuffled ? "丁.html" : "文件夹 D";

    const headColor = shuffled ? "#6F38D6" : "#5C5046";
    elCardHeads.A.setAttribute("fill", headColor);
    elCardHeads.B.setAttribute("fill", headColor);
    elCardHeads.C.setAttribute("fill", headColor);
    elCardHeads.D.setAttribute("fill", headColor);

    // 8s 起标出甲、乙的小黑比例翻车红圈 & 第50行「最圆=最胖」警示
    const showFatError = clampedT >= 8.0 ? "1" : "0";
    elCardErrRings.A.setAttribute("opacity", showFatError);
    elCardErrRings.B.setAttribute("opacity", showFatError);
    elFatWarnTag.setAttribute("opacity", clampedT >= 12.0 ? "1" : "0");
    elBlackRulerRing.setAttribute("opacity", (clampedT >= 12.0 && clampedT < 20.0) ? "1" : "0");

    // 16s..20s 开启验洞激光带（从三只小脸蛋正后方 y=354 穿过，直接从眼缝透出红黄刻度）
    if (clampedT >= 16.0 && clampedT < 20.0) {
      elHollowLaser.setAttribute("opacity", "1");
      // 激光带轻微左右步进，让观众亲眼看到眼缝里的刻度跟着移动
      const shiftX = (Math.floor((clampedT - 16.0) * 5) % 2) * 6;
      elHollowLaser.setAttribute("transform", `translate(${shiftX}, 0)`);
    } else {
      elHollowLaser.setAttribute("opacity", "0");
    }

    // 20s 起揭晓四份账单
    const showBills = clampedT >= 20.0 ? "1" : "0";
    elBills.A.setAttribute("opacity", showBills);
    elBills.B.setAttribute("opacity", showBills);
    elBills.C.setAttribute("opacity", showBills);
    elBills.D.setAttribute("opacity", showBills);

    // 24s 起高亮丙、丁的 26.5° 原页参数疑点
    const highlightAngle = clampedT >= 24.0;
    elCardCAngle.setAttribute("fill", highlightAngle ? "#D9381E" : "#5C5046");
    elCardDAngle.setAttribute("fill", highlightAngle ? "#D9381E" : "#5C5046");

    // ------------------------------------------------------------------------
    // B. 第 2 行「原页路标」纸条的传递轨迹（立牌 -> FetchMo 叼下 -> Clawd 整块抬起 -> StashYu 收进尾巴）
    // ------------------------------------------------------------------------
    if (clampedT < 32.0) {
      // 0..32s：留在左侧立牌第 2 行，28s 起闪烁提醒
      elLine2Strip.setAttribute("opacity", "1");
      const flashY = (clampedT >= 28.0 && Math.floor(clampedT * 6) % 2 === 0) ? 46 : 48;
      elLine2Strip.setAttribute("transform", `translate(6, ${flashY})`);
      elClawdHeldProp.setAttribute("opacity", "0");
    } else if (clampedT >= 32.0 && clampedT < 36.0) {
      // 32..36s：被 FetchMo 从立牌上叼到嘴边（整数位移）
      elLine2Strip.setAttribute("opacity", "1");
      elLine2Strip.setAttribute("transform", "translate(92, 268)");
      elClawdHeldProp.setAttribute("opacity", "0");
    } else if (clampedT >= 36.0 && clampedT < 40.0) {
      // 36..40s：移交到 Clawd 钳子上，跟钳子绑在一起整块抬起！
      elLine2Strip.setAttribute("opacity", "0");
      elClawdHeldProp.setAttribute("opacity", "1");
    } else {
      // 40..48s：已被 StashYu 收进大尾巴里锁死！
      elLine2Strip.setAttribute("opacity", "0");
      elClawdHeldProp.setAttribute("opacity", "0");
    }

    // ------------------------------------------------------------------------
    // C. 六只主角分镜头动作（严格 steps() 整数像素步进，全片同一把尺子）
    // ------------------------------------------------------------------------

    // 1. 小粉 (cx=476, cy=368)、小紫 (cx=564, cy=368)、小黑 (cx=652, cy=368)
    let pinkY = 368, violetY = 368, blackY = 368;
    let pinkRot = 0, violetRot = 0, blackRot = 0;

    if (activeIdx === 1) {
      // 小粉洗牌：轻快上下蹦
      pinkY = 368 - (Math.floor(stepT * 5) % 2) * 8;
      pinkRot = (Math.floor(stepT * 5) % 2 === 0) ? -4 : 4;
    } else if (activeIdx === 2 || activeIdx === 5) {
      // 小紫发言：轻晃
      violetY = 368 - (Math.floor(stepT * 5) % 2) * 6;
    } else if (activeIdx === 3) {
      // 小黑申冤：我是最圆不是最胖！
      blackY = 368 - (Math.floor(stepT * 6) % 2) * 8;
    } else if (activeIdx === 11) {
      // 终幕全员欢庆轻晃
      const beat = Math.floor(stepT * 4) % 2;
      pinkY = 368 - beat * 4;
      violetY = 368 - (1 - beat) * 4;
      blackY = 368 - beat * 4;
    }

    elPink.setAttribute("transform", `translate(476, ${pinkY}) rotate(${pinkRot})`);
    elViolet.setAttribute("transform", `translate(564, ${violetY}) rotate(${violetRot})`);
    elBlack.setAttribute("transform", `translate(652, ${blackY}) rotate(${blackRot})`);

    // 小脸蛋周期眨眼（收细宽度，保持 \ 方向）
    const tick10 = Math.floor(clampedT * 10);
    setBallBlink("pink", (tick10 % 32 === 4 || tick10 % 32 === 5));
    setBallBlink("violet", (tick10 % 36 === 14 || tick10 % 36 === 15));
    setBallBlink("black", (tick10 % 28 === 9 || tick10 % 28 === 10));

    // 2. Clawd (x=264, y=293)
    let clawdY = 293;
    if (activeIdx === 0 || activeIdx === 6) {
      clawdY = 293 - (Math.floor(stepT * 4) % 2) * 4;
      setClawdStance("original");
    } else if (activeIdx === 9) {
      // 第五幕：钳子整块往上挪（y 从 0 挪到 -28），举起纸条送到 StashYu 旁！
      elClawdClaws.setAttribute("transform", "translate(0, -28)");
      setClawdStance("default");
    } else {
      elClawdClaws.setAttribute("transform", "translate(0, 0)");
      setClawdStance(activeIdx === 11 ? "original" : "default");
    }
    if (activeIdx !== 9) {
      elClawdClaws.setAttribute("transform", "translate(0, 0)");
    }
    elClawd.setAttribute("transform", `translate(264, ${clawdY})`);

    // 3. FetchMo (x=148, y=346) —— 严格按尾巴 DLC 与表情表换帧
    let fetchGrid = FETCHMO_GRIDS.base;
    let fetchExpr = "normal";
    let fetchBlush = null;
    let fetchY = 346;

    if (activeIdx === 7) {
      // 第四幕前半（28..32s）：盯着第 2 行路标，准备去叼！
      // 宪法节奏：本体停 0.8s -> 直 0.14s -> 外 0.14s -> 直 0.14s
      const cycle = (clampedT - 28.0) % 1.22;
      if (cycle < 0.8) {
        fetchGrid = FETCHMO_GRIDS.base;
      } else if (cycle < 0.94) {
        fetchGrid = FETCHMO_GRIDS.quiverStraight;
      } else if (cycle < 1.08) {
        fetchGrid = FETCHMO_GRIDS.quiverOut;
      } else {
        fetchGrid = FETCHMO_GRIDS.quiverStraight;
      }
      fetchExpr = "peek"; // 瞄向立牌
    } else if (activeIdx === 8) {
      // 第四幕后半（32..36s）：跃起叼回第 2 行路标，换「竖起来」尾巴 + 「开心」眼 + 腮红
      fetchGrid = FETCHMO_GRIDS.up;
      fetchExpr = "happy";
      fetchBlush = [[8,7],[17,7]];
      // 前 0.8 秒纵身跃起（整像素步进），之后稳稳落地踩回 y=346
      const localT = clampedT - 32.0;
      if (localT < 0.4) {
        fetchY = 310;
      } else if (localT < 0.8) {
        fetchY = 326;
      } else {
        fetchY = 346;
      }
    } else if (activeIdx === 11) {
      // 终幕：竖起尾巴开心谢幕
      fetchGrid = FETCHMO_GRIDS.up;
      fetchExpr = "happy";
      fetchBlush = [[8,7],[17,7]];
    } else if (tick10 % 40 === 20) {
      fetchExpr = "blink";
    }

    elFetchMo.setAttribute("transform", `translate(148, ${fetchY})`);
    renderMomoyuSVG(
      elFetchMo,
      fetchGrid,
      FETCHMO_PALETTE,
      [[8,5],[16,5]],
      fetchExpr,
      fetchBlush,
      "#F2B8B0",
      -1 // 暹罗猫往左瞄
    );

    // 4. StashYu (x=44, y=346) —— 严格按尾巴 DLC「点一下（收好东西）」与「来回摆（高兴）」换帧
    let stashGrid = STASHYU_GRIDS.base;
    let stashExpr = "normal";
    let stashBlush = null;
    let stashY = 346;

    if (activeIdx === 10) {
      // 第五幕（40..44s）：把第 2 行路标收进尾巴，白尖点两下，算收好了！
      // 宪法节奏：本体停 0.9s -> 点一下 0.18s -> 本体 0.18s -> 点一下 0.18s
      const cycle = (clampedT - 40.0) % 1.44;
      if (cycle < 0.9) {
        stashGrid = STASHYU_GRIDS.base;
      } else if (cycle < 1.08) {
        stashGrid = STASHYU_GRIDS.tap;
      } else if (cycle < 1.26) {
        stashGrid = STASHYU_GRIDS.base;
      } else {
        stashGrid = STASHYU_GRIDS.tap;
      }
      stashExpr = "happy";
      stashBlush = [[2,6],[11,6]];
    } else if (activeIdx === 11) {
      // 终幕（44..48s）：高兴！尾巴「来回摆」（本体 -> 往里 -> 本体 -> 往外，每张 0.22s）
      const wagPhase = Math.floor((clampedT - 44.0) / 0.22) % 4;
      if (wagPhase === 0 || wagPhase === 2) {
        stashGrid = STASHYU_GRIDS.base;
      } else if (wagPhase === 1) {
        stashGrid = STASHYU_GRIDS.wagIn;
      } else {
        stashGrid = STASHYU_GRIDS.wagOut;
      }
      stashExpr = "happy";
      stashBlush = [[2,6],[11,6]];
    } else if (activeIdx === 7 || activeIdx === 8) {
      // 看着旁边的 FetchMo 抓包，往右瞄
      stashExpr = "peek";
    } else if (tick10 % 38 === 12) {
      stashExpr = "blink";
    }

    elStashYu.setAttribute("transform", `translate(44, ${stashY})`);
    renderMomoyuSVG(
      elStashYu,
      stashGrid,
      STASHYU_PALETTE,
      [[3,4],[9,4]],
      stashExpr,
      stashBlush,
      "#F59A8C",
      1 // 狐狸往右瞄
    );
  }

  // ============================================================================
  // 6. 播放循环与交互事件绑定
  // ============================================================================
  function tick(now) {
    const dt = (now - lastFrameTs) / 1000;
    lastFrameTs = now;

    if (isPlaying) {
      currentTime += dt * playbackRate;
      if (currentTime >= TOTAL_DURATION) {
        currentTime = 0.0; // 循环播放
      }
      renderStageAt(currentTime);
    }
    requestAnimationFrame(tick);
  }

  btnPlay.addEventListener("click", () => {
    isPlaying = !isPlaying;
    updatePlayButtonUI();
  });

  btnRestart.addEventListener("click", () => {
    currentTime = 0.0;
    isPlaying = true;
    updatePlayButtonUI();
    renderStageAt(currentTime);
  });

  elScrubber.addEventListener("input", (e) => {
    currentTime = parseFloat(e.target.value) || 0;
    renderStageAt(currentTime);
  });

  const SPEEDS = [1.0, 1.5, 2.0];
  let speedIdx = 0;
  btnSpeed.addEventListener("click", () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    playbackRate = SPEEDS[speedIdx];
    btnSpeed.textContent = `${playbackRate.toFixed(1)}x`;
  });

  // 初始渲染第一帧并启动循环
  renderStageAt(0.0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
