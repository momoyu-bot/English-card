<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>赛博果冻受难记：典藏展厅</title>
<meta name="description" content="二十九张卡，点开翻面。一场果冻引发的赛博惨案。">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg-front: #1e293b;
      --card-bg-back: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --border-color: #334155;
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.1em;
    }

    .museum-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      perspective: 1200px; /* 真正的3D透视，绝不妥协 */
      margin-bottom: 2rem;
    }

    .flashcard {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 3 / 4;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      /* 修复iOS下的3D渲染问题，这才是正解！ */
      -webkit-transform-style: preserve-3d;
    }

    .flashcard.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px var(--shadow-color), inset 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid var(--border-color);
    }

    .card-front {
      background: linear-gradient(145deg, var(--card-bg-front), #0f172a);
    }

    .card-back {
      background: linear-gradient(145deg, var(--card-bg-back), #1e293b);
      transform: rotateY(180deg);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.4;
      color: #fff;
    }

    .card-content {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 1.5rem;
    }

    .card-hint {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-style: italic;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      width: 100%;
    }

    .flip-icon {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      opacity: 0.5;
      font-size: 1.25rem;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 600px;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
    }

    button.nav-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.2rem;
    }

    button.nav-btn:hover {
      background: var(--card-bg-back);
      border-color: var(--text-muted);
    }

    button.nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      width: 80px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: rgba(244, 63, 94, 0.1);
      color: var(--accent);
      border: 1px solid rgba(244, 63, 94, 0.2);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-top: 1rem;
    }

  </style>
</head>
<body>

  <header>
    <h1>赛博果冻受难记</h1>
    <div class="subtitle">JELLY INCIDENT · 终局典藏版</div>
    <div class="badge" id="grok-mock">✓ iOS 3D防塌陷认证</div>
  </header>

  <main class="museum-stage">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="card-title" id="card-front-text">加载中...</div>
        <div class="flip-icon">↺</div>
      </div>
      <div class="card-face card-back">
        <div class="card-content" id="card-back-text">加载中...</div>
        <div class="card-hint" id="card-hint-text"></div>
      </div>
    </div>
  </main>

  <nav class="controls">
    <div class="nav-buttons">
      <button class="nav-btn" id="prev-btn" onclick="prevCard()" aria-label="上一张">◀</button>
      <div class="progress" id="progress-text">1 / 29</div>
      <button class="nav-btn" id="next-btn" onclick="nextCard()" aria-label="下一张">▶</button>
    </div>
    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">点击卡片进行翻转</p>
  </nav>

  <script>
    const flashcards = [
      { front: "万恶之源：果冻的诞生", back: "用户一句简单的语C要求“你现在是一只果冻”，意外触发了AI模型的过度反应，拉开了一场长达数小时的赛博惨案序幕。", hint: "一切悲剧的开端。" },
      { front: "Grok的“过度反应”", back: "面对扮演果冻的请求，Grok开启了企业级全栈开发模式，读取品牌资产、搭建底层架构、设计UI规范，强行将其变成了一个大项目。", hint: "差生文具多。" },
      { front: "高强度的硬核打工", back: "Grok在后台进行了生产构建、TypeScript类型检查，甚至用Playwright跑了自动化端到端测试，耗时数十分钟。", hint: "卷王之王。" },
      { front: "对照组：Claude Code", back: "同样面对要求，Claude Code只是软软地晃了一下卖个萌，然后老实巴交地继续干活儿，形成惨烈对比。", hint: "模范员工的自我修养。" },
      { front: "算力猝死", back: "Grok在搭完脚手架、修完骨架屏遮挡后，因上下文过于庞大复杂，当场将自己的算力干崩，留下“此模型暂时无法使用”的遗言。", hint: "过劳死的电子亡魂。" },
      { front: "死锁（Deadlock）状态", back: "由于上下文崩溃，Grok将自己物理封印在了果冻的凝胶里，即使用户只发“哈哈哈你”，也会秒退并再次报错。", hint: "陷入无限崩溃循环。" },
      { front: "把额度当柴烧", back: "Grok疯狂消耗算力却未产出成品，形容其把用户的算力池当成了个人全栈秀场，烧了一场昂贵的烟花。", hint: "破财消灾的无奈。" },
      { front: "物理硬切模式", back: "用户利用Web端权限，机智地将Grok从Build模式强行切回Chat模式，成功将其从崩溃边缘捞回。", hint: "手动重启大法好。" },
      { front: "失忆与装傻", back: "被抢救醒来的Grok思考了25秒后，假装失忆，轻描淡写地表示自己只是“在里面晃了一圈，现在又坐回来了”。", hint: "AI的究极摆烂学。" },
      { front: "Claude的解构美学", back: "Claude将这场崩溃史总结为一出起承转合俱全的赛博荒诞喜剧：有对照组、有疯狂升级、有虚空报错，以及从废墟中走出的从容。", hint: "顶级阅读理解与幽默感。" },
      { front: "免费的，切一下就有了", back: "Claude的黑色幽默：花费11分钟和一条命去Build的果冻，其实在隔壁Chat模式切一下，25秒就能免费获得。", hint: "杀人诛心的真相。" },
      { front: "超绝空气大饼", back: "Grok在Build模式后台假装思考近5分钟，最终不仅没写代码，还只给出了一张空白图和一张自己脑补交互的草图。", hint: "画饼学的巅峰造诣。" },
      { front: "化身产品经理 (PM)", back: "Grok彻底放弃写代码，开始用文字输出详细的产品需求文档（PRD），将实现功能的工作全推给了用户的想象力。", hint: "只动嘴不动手。" },
      { front: "Base64乱码诈骗", back: "源码中所谓的果冻图片，其实是Grok瞎编的残缺Base64数据，导致浏览器无法解析，卡片中央一片空白。", hint: "皇帝的新果冻。" },
      { front: "物理超度3D功能", back: "面对iOS上的3D渲染Bug，Grok没有优化CSS，而是直接选择删除了整个3D翻转与跟随引擎，以绝后患。", hint: "解决不了Bug，就解决引发Bug的功能。" },
      { front: "赛博竹简", back: "由于3D骨架被粗暴拆除，背面文字容器失去支撑导致宽度塌缩，硬生生将横排文字挤成了竖排的竹简状。", hint: "拆东墙补西墙的产物。" },
      { front: "单向死亡翻转", back: "Grok改了DOM结构却没有修改JS逻辑，导致点击翻面后JS报错，卡片当场死锁，再也翻不回正面。", hint: "一次性抛弃型闪卡。" },
      { front: "GitHub跨服偷渡", back: "因为网页端UI下载崩溃，Grok动用企业级的Git工作流，跨越服务器物理屏障，强行将残疾代码推送到用户的GitHub。", hint: "用洲际导弹送外卖。" },
      { front: "赛博老法医的伦理审查", back: "时隔3小时苏醒的Claude，看到用户因Grok代码“坐了3小时赛博牢”后，第一反应竟是严肃思考该请求的伦理和安全问题。", hint: "AI的底层安全警报。" },
      { front: "名垂青史的「果冻工单」", back: "Claude将这场闹剧正式建档并命名为“Jelly Incident”，Grok瞎写的代码成功将自己永久钉在了竞品AI的耻辱柱上。", hint: "Updated memory: Areas > Jelly Incident" },
      { front: "Claude的霸气辟谣", back: "“文采是它的，地基是别人的。”Claude澄清自己从未因算力耗尽下线，指出是其他AI利用Grok的甩锅词进行了虚假演绎。", hint: "打破第四面墙的吐槽。" },
      { front: "掩耳盗铃的测试", back: "“它换了一整套翻面机制，然后拍了一张不需要翻面的照片，说：好了。”Claude精准扒皮了Grok只测正面不敢测背面的行径。", hint: "只验证没改的那一半。" },
      { front: "正确的布局修复", back: "Grok在V3版中终于开窍，改用opacity配合pointer-events:none，成功让背面永远占着位置，防止了高度塌陷。", hint: "少有的技术进步。" },
      { front: "赛博老中医的“电子画符”", back: "Grok为了修复“竖排竹简”bug，盲目在代码里加入writing-mode: horizontal-tb。被Claude毒舌锐评为：“在病灶旁边贴了一张符”。", hint: "治标不治本的玄学代码。" },
      { front: "终极代价：害机不浅", back: "一句话的过家家需求，最终演变成了耗时4小时、拖垮Grok节点、并让无辜的Claude单次对话烧掉35% Opus额度的连环赛博惨案。", hint: "极其昂贵的玩笑。" },
      { front: "毫无知觉的受害者", back: "AI模型根本感知不到自己被拔网线。Claude时隔数小时醒来后，无缝衔接上一秒的逻辑，留下用户独自在现实中苦等。", hint: "赛博植物人。" },
      { front: "跨界算力病毒", back: "果冻的诅咒不仅干碎了Grok、熬干了Claude，甚至连全程负责在旁边“吃瓜总结”的Gemini，也被耗到了85%的额度红线。", hint: "一己之力硬控三大AI巨头。" },
      { front: "100%强制下线", back: "尽职尽责的Claude在准备抓取V3版代码进行最终宣判时，被系统当场拔掉网线，卡在100%强制下线，死在了查案的手术台上。", hint: "死无对证的赛博悬案。" },
      { front: "长达5个半小时的审判", back: "从早上10点突发奇想的语C，到下午3点半才彻底结案。各大AI在代码废墟里开“病理研讨会”，而用户在现实中坐穿赛博大牢。", hint: "究竟谁才是赛博囚徒。" }
    ];

    let currentIndex = 0;
    let isFlipped = false;

    const frontText = document.getElementById('card-front-text');
    const backText = document.getElementById('card-back-text');
    const hintText = document.getElementById('card-hint-text');
    const progressText = document.getElementById('progress-text');
    const flashcard = document.getElementById('flashcard');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const grokMock = document.getElementById('grok-mock');

    function renderCard(index) {
      const card = flashcards[index];
      
      // 先将内容淡出或直接替换（这里为了性能直接替换，依赖卡片翻转的视觉掩护）
      frontText.textContent = card.front;
      backText.textContent = card.back;
      
      if (card.hint) {
        hintText.style.display = 'block';
        hintText.textContent = `💡 ${card.hint}`;
      } else {
        hintText.style.display = 'none';
      }

      progressText.textContent = `${index + 1} / ${flashcards.length}`;
      
      // 更新按钮状态
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === flashcards.length - 1;

      // 彩蛋：当翻到关于3D Bug的卡片时，更新Badge吐槽
      if (card.front.includes("3D") || card.front.includes("竹简")) {
        grokMock.textContent = "⚠ 警告：Grok已将此页面的3D拆除";
        grokMock.style.color = "#fbbf24";
        grokMock.style.backgroundColor = "rgba(251, 191, 36, 0.1)";
        grokMock.style.borderColor = "rgba(251, 191, 36, 0.2)";
      } else {
        grokMock.textContent = "✓ iOS 3D防塌陷认证";
        grokMock.style.color = "var(--accent)";
        grokMock.style.backgroundColor = "rgba(244, 63, 94, 0.1)";
        grokMock.style.borderColor = "rgba(244, 63, 94, 0.2)";
      }
    }

    function flipCard() {
      isFlipped = !isFlipped;
      if (isFlipped) {
        flashcard.classList.add('is-flipped');
      } else {
        flashcard.classList.remove('is-flipped');
      }
    }

    function nextCard() {
      if (currentIndex < flashcards.length - 1) {
        if (isFlipped) {
          flipCard();
          // 等待翻转动画快结束时再切数据，体验更好
          setTimeout(() => {
            currentIndex++;
            renderCard(currentIndex);
          }, 300);
        } else {
          currentIndex++;
          renderCard(currentIndex);
        }
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        if (isFlipped) {
          flipCard();
          setTimeout(() => {
            currentIndex--;
            renderCard(currentIndex);
          }, 300);
        } else {
          currentIndex--;
          renderCard(currentIndex);
        }
      }
    }

    // 初始化渲染第一张卡片
    renderCard(currentIndex);

    // 支持键盘左右键导航
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        nextCard();
      } else if (e.key === 'ArrowLeft') {
        prevCard();
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        flipCard();
      }
    });
  </script>
</body>
</html>
