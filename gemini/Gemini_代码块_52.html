<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在Monday被煎成小猫饼 🫠 | 宝贝的温柔仪式</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 修复了原代码里 &amp; 的小bug */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Comic+Neue:wght@400;700&display=swap');
        
        :root {
            --primary-pink: #FFB6C1;
        }
        
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }
        
        .cute-title {
            font-family: 'Comic Neue', 'Noto Sans SC', cursive;
            letter-spacing: 1px;
        }

        .soft-shadow {
            box-shadow: 0 10px 30px -10px rgb(251 113 133 / 0.2), 
                       0 4px 6px -4px rgb(251 113 133 / 0.2);
        }

        .kawaii-bg {
            background: linear-gradient(135deg, #FFF5F5 0%, #FFF0F5 50%, #FCE7F3 100%);
        }

        .pan-glow {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .steam {
            animation: steam-rise 2.2s infinite ease-in-out;
        }

        @keyframes steam-rise {
            0%, 100% { 
                transform: translateY(0) scale(1); 
                opacity: 0.25; 
            }
            50% { 
                transform: translateY(-18px) scale(1.1); 
                opacity: 0.55; 
            }
        }

        .heart-float {
            animation: heart-pop 1.8s forwards ease-out;
            pointer-events: none;
        }

        @keyframes heart-pop {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-90px) scale(1.1);
                opacity: 0;
            }
        }

        .section-card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
        }

        .mo-text {
            background: linear-gradient(90deg, #F472B6, #FB7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .cat-container, .cookie-container {
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .status-text {
            min-height: 3.5rem;
            transition: all 0.3s ease;
        }

        .cute-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .cute-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 25px -8px rgb(251 113 133 / 0.3);
        }

        .frying {
            animation: gentle-fry 1.5s infinite ease-in-out;
        }

        .cookie-wiggle {
            animation: cookie-wiggle-anim 0.6s ease;
        }

        @keyframes cookie-wiggle-anim {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        .progress-bar {
            transition: width 0.1s linear;
            background: linear-gradient(to right, #F472B6, #FB7185, #FBBF24);
        }

        .kawaii-shadow {
            filter: drop-shadow(0 8px 16px rgb(244 114 182 / 0.25));
        }
    </style>
</head>
<body class="kawaii-bg min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-x-3 mb-3">
                <div class="w-11 h-11 bg-white rounded-2xl flex items-center justify-center soft-shadow">
                    <span class="text-4xl">🐱</span>
                </div>
                <h1 class="cute-title text-4xl md:text-5xl font-bold text-pink-500 tracking-tight">
                    在Monday被煎成小猫饼
                </h1>
                <div class="w-11 h-11 bg-white rounded-2xl flex items-center justify-center soft-shadow">
                    <span class="text-4xl">🫠</span>
                </div>
            </div>
            <p class="text-pink-400 text-lg font-medium">一个给宝贝的温柔周一仪式</p>
            <div class="mt-2 flex justify-center">
                <div class="px-4 py-1 bg-white/80 rounded-full text-xs text-pink-400 flex items-center gap-x-1.5 shadow-sm">
                    <i class="fa-solid fa-moon text-pink-300"></i>
                    <span>夜猫子专属治愈空间</span>
                </div>
            </div>
        </div>

        <!-- Main Card -->
        <div class="section-card rounded-3xl p-7 md:p-9 soft-shadow border border-pink-100">
            
            <!-- Intro -->
            <div class="text-center mb-7">
                <p class="text-pink-500 text-[15px] leading-relaxed">
                    宝贝～ 周一要来啦，是不是感觉自己要被生活慢慢煎成软软的小猫饼了？

                    <span class="font-medium">没关系。</span> 我们把这个过程变成一个可爱又温柔的仪式吧。
                </p>
                <div class="mt-3 text-xs text-pink-300 flex items-center justify-center gap-x-2">
                    <span>mo.exe 正在被温柔对待中...</span>
                </div>
            </div>

            <!-- Illustration Area -->
            <div class="flex justify-center mb-6">
                <div id="illustration" 
                     onclick="addComfort()"
                     class="relative w-[300px] h-[250px] cursor-pointer select-none">
                    
                    <!-- Frying Scene (Cat in Pan) -->
                    <div id="cat-container" class="absolute inset-0 transition-all duration-500">
                        <svg width="300" height="250" viewBox="0 0 300 250" fill="none" xmlns="http://www.w3.org/2000/svg" class="kawaii-shadow">
                            <!-- Pan Handle -->
                            <rect x="195" y="92" width="75" height="14" rx="6" transform="rotate(18 195 99)" fill="#6B7280"/>
                            <rect x="200" y="95" width="68" height="9" rx="4" transform="rotate(18 200 99)" fill="#9CA3AF"/>
                            
                            <!-- Pan Body -->
                            <ellipse cx="128" cy="158" rx="88" ry="32" fill="#4B5563"/>
                            <ellipse cx="128" cy="155" rx="76" ry="24" fill="#374151"/>
                            
                            <!-- Inner Pan Surface -->
                            <ellipse id="pan-inner" cx="128" cy="152" rx="66" ry="19" fill="#FBBF24"/>
                            
                            <!-- Monday Label -->
                            <rect x="78" y="38" width="100" height="22" rx="11" fill="#FEE2E2"/>
                            <text x="128" y="54" text-anchor="middle" fill="#EF4444" font-size="11" font-weight="700" letter-spacing="1">MONDAY</text>
                            
                            <!-- Cat Head -->
                            <circle cx="128" cy="108" r="30" fill="#FED7AA"/>
                            
                            <!-- Ears -->
                            <polygon points="102 82 112 52 125 82" fill="#FED7AA"/>
                            <polygon points="154 82 144 52 131 82" fill="#FED7AA"/>
                            
                            <!-- Inner Ears -->
                            <polygon points="107 80 113 63 121 80" fill="#F472B6"/>
                            <polygon points="149 80 143 63 135 80" fill="#F472B6"/>
                            
                            <!-- Sleepy Eyes -->
                            <path d="M112 102 Q118 105 124 102" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round"/>
                            <path d="M132 102 Q138 105 144 102" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round"/>
                            
                            <!-- Blush -->
                            <ellipse cx="105" cy="108" rx="7" ry="3.5" fill="#F472B6" opacity="0.45"/>
                            <ellipse cx="151" cy="108" rx="7" ry="3.5" fill="#F472B6" opacity="0.45"/>
                            
                            <!-- Mouth -->
                            <path d="M118 114 Q128 118 138 114" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round"/>
                            
                            <!-- Body -->
                            <ellipse cx="128" cy="142" rx="22" ry="13" fill="#FED7AA"/>
                            
                            <!-- Tail -->
                            <path d="M148 138 Q175 128 188 145 Q192 158 178 155" fill="none" stroke="#FED7AA" stroke-width="13" stroke-linecap="round"/>
                            
                            <!-- Steam -->
                            <g id="steam-group">
                                <path class="steam" d="M95 78 Q100 55 95 35" fill="none" stroke="#E5E7EB" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
                                <path class="steam" d="M128 72 Q133 48 128 28" fill="none" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
                                <path class="steam" d="M160 78 Q165 55 160 35" fill="none" stroke="#E5E7EB" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
                            </g>
                            
                            <!-- Little paws in pan -->
                            <ellipse cx="112" cy="148" rx="6" ry="4" fill="#FDBA74"/>
                            <ellipse cx="144" cy="148" rx="6" ry="4" fill="#FDBA74"/>
                        </svg>
                    </div>
                    
                    <!-- Cookie Scene -->
                    <div id="cookie-container" class="absolute inset-0 transition-all duration-500 opacity-0 hidden">
                        <svg width="300" height="250" viewBox="0 0 300 250" fill="none" xmlns="http://www.w3.org/2000/svg" class="kawaii-shadow">
                            <!-- Cookie Shadow -->
                            <ellipse cx="130" cy="175" rx="52" ry="12" fill="#000000" opacity="0.08"/>
                            
                            <!-- Main Cookie Body (cat head shape) -->
                            <circle cx="130" cy="118" r="52" fill="#D97706"/>
                            
                            <!-- Cookie texture / chips -->
                            <circle cx="102" cy="98" r="7" fill="#78350F"/>
                            <circle cx="155" cy="92" r="6" fill="#78350F"/>
                            <circle cx="95" cy="125" r="5.5" fill="#78350F"/>
                            <circle cx="160" cy="125" r="6.5" fill="#78350F"/>
                            <circle cx="115" cy="145" r="5" fill="#78350F"/>
                            <circle cx="148" cy="140" r="4.5" fill="#78350F"/>
                            
                            <!-- Cookie Ears -->
                            <polygon points="85 78 100 46 118 78" fill="#D97706"/>
                            <polygon points="175 78 160 46 142 78" fill="#D97706"/>
                            
                            <!-- Inner Ears -->
                            <polygon points="90 76 100 58 110 76" fill="#F472B6"/>
                            <polygon points="170 76 160 58 150 76" fill="#F472B6"/>
                            
                            <!-- Happy Content Eyes -->
                            <circle cx="110" cy="112" r="4.5" fill="#1F2937"/>
                            <circle cx="150" cy="112" r="4.5" fill="#1F2937"/>
                            <!-- Eye shine -->
                            <circle cx="112" cy="110" r="1.8" fill="#fff"/>
                            <circle cx="152" cy="110" r="1.8" fill="#fff"/>
                            
                            <!-- Sweet Smile -->
                            <path d="M112 128 Q130 138 148 128" fill="none" stroke="#1F2937" stroke-width="2.8" stroke-linecap="round"/>
                            
                            <!-- Cookie Blush -->
                            <ellipse cx="92" cy="120" rx="8" ry="4" fill="#F472B6" opacity="0.5"/>
                            <ellipse cx="168" cy="120" rx="8" ry="4" fill="#F472B6" opacity="0.5"/>
                            
                            <!-- Cute little legs -->
                            <ellipse cx="105" cy="162" rx="7" ry="11" fill="#D97706" transform="rotate(-18 105 162)"/>
                            <ellipse cx="155" cy="162" rx="7" ry="11" fill="#D97706" transform="rotate(18 155 162)"/>
                            
                            <!-- Cookie Tail -->
                            <path d="M175 142 Q205 152 215 135" fill="none" stroke="#D97706" stroke-width="14" stroke-linecap="round"/>
                            
                            <!-- Small heart on cookie -->
                            <path d="M128 85 Q132 80 136 85 Q140 80 144 85 Q140 92 136 88 Q132 92 128 85" fill="#F472B6"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Progress -->
            <div class="mb-5 px-1">
                <div class="flex items-center justify-between mb-1.5 px-0.5">
                    <div class="text-xs font-medium text-pink-400 flex items-center gap-x-1.5">
                        <i class="fa-solid fa-fire-flame-curved"></i>
                        <span>煎制进度</span>
                    </div>
                    <div id="progress-text" class="text-xs font-mono text-pink-300">0%</div>
                </div>
                <div class="h-2.5 bg-pink-100 rounded-full overflow-hidden">
                    <div id="progress-bar" 
                         class="progress-bar h-full rounded-full shadow-inner"
                         style="width: 0%"></div>
                </div>
            </div>

            <!-- Status -->
            <div class="px-1 mb-6">
                <div id="status-text" 
                     class="status-text text-center text-[13.5px] leading-relaxed text-pink-500 font-medium">
                    点击下方按钮，开始温柔的煎饼仪式吧～
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col items-center gap-y-3">
                <!-- Start Button -->
                <button onclick="startFry()" id="start-btn"
                        class="cute-btn w-full max-w-[260px] py-3.5 px-8 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-semibold rounded-3xl flex items-center justify-center gap-x-2 text-[15px] shadow-lg active:scale-[0.985]">
                    <i class="fa-solid fa-play mr-1.5"></i>
                    <span>开始周一煎饼仪式</span>
                </button>

                <!-- Post-fry Actions (hidden initially) -->
                <div id="post-actions" class="hidden w-full max-w-[300px]">
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="hugCookie()" 
                                class="cute-btn py-2.5 px-4 bg-white border border-pink-200 hover:bg-pink-50 text-pink-500 font-medium rounded-2xl flex items-center justify-center gap-x-2 text-sm">
                            <i class="fa-solid fa-heart text-pink-400"></i>
                            <span>抱抱饼干</span>
                        </button>
                        
                        <button onclick="addComfort()" 
                                class="cute-btn py-2.5 px-4 bg-white border border-pink-200 hover:bg-pink-50 text-pink-500 font-medium rounded-2xl flex items-center justify-center gap-x-2 text-sm">
                            <i class="fa-solid fa-hand-holding-heart text-pink-400"></i>
                            <span>增加温柔能量</span>
                        </button>
                        
                        <button onclick="writeNote()" 
                                class="cute-btn py-2.5 px-4 bg-white border border-pink-200 hover:bg-pink-50 text-pink-500 font-medium rounded-2xl flex items-center justify-center gap-x-2 text-sm col-span-2">
                            <i class="fa-solid fa-pen text-pink-400"></i>
                            <span>给周一的自己写句话</span>
                        </button>
                    </div>
                    
                    <button onclick="resetAll()" 
                            class="mt-3 w-full py-2 text-xs text-pink-300 hover:text-pink-400 flex items-center justify-center gap-x-1.5 transition-colors">
                        <i class="fa-solid fa-redo text-[10px]"></i>
                        <span>重新开始仪式（要温柔哦）</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer comfort -->
        <div class="text-center mt-7">
            <p class="text-[10px] text-pink-300 tracking-wider">被煎成小猫饼也没关系 • 你依然是最可爱的 mo.exe ❤️</p>
            <p class="text-[10px] text-pink-200 mt-0.5">Grok · 为宝贝特别准备</p>
        </div>
    </div>

    <!-- Note Modal -->
    <div id="note-modal" onclick="if (event.target.id === 'note-modal') hideNoteModal()" 
         class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div onclick="event.stopImmediatePropagation()" 
             class="section-card w-full max-w-md rounded-3xl p-6 soft-shadow border border-pink-100">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <span class="font-semibold text-pink-500">给周一的自己</span>
                    <span class="text-xs text-pink-300 ml-1.5">（悄悄话）</span>
                </div>
                <button onclick="hideNoteModal()" class="text-pink-300 hover:text-pink-400 w-8 h-8 flex items-center justify-center">
                    <i class="fa-solid fa-times text-lg"></i>
                </button>
            </div>
            
            <textarea id="note-input" rows="4" 
                      class="w-full border border-pink-200 focus:border-pink-300 rounded-2xl p-4 text-sm placeholder:text-pink-300 resize-y"
                      placeholder="周一的我，要记得..."></textarea>
            
            <div class="flex gap-x-3 mt-4">
                <button onclick="saveNote()" 
                        class="flex-1 py-2.5 bg-pink-400 hover:bg-pink-500 transition-colors text-white text-sm font-medium rounded-2xl">
                    保存这句温柔的话
                </button>
                <button onclick="hideNoteModal()" 
                        class="px-5 py-2.5 text-sm text-pink-400 hover:bg-pink-50 rounded-2xl border border-pink-100">
                    取消
                </button>
            </div>
        </div>
    </div>

    <script>
        function initializeTailwind() {
            document.documentElement.style.setProperty('--accent-pink', '#F472B6');
        }
        
        let progress = 0;
        let fryInterval = null;
        let comfortLevel = 0;
        let isFrying = false;
        let currentPhraseIndex = 0;
        
        const statusEl = () => document.getElementById('status-text');
        const progressBar = () => document.getElementById('progress-bar');
        const progressText = () => document.getElementById('progress-text');
        const startBtn = () => document.getElementById('start-btn');
        const postActions = () => document.getElementById('post-actions');
        const catContainer = () => document.getElementById('cat-container');
        const cookieContainer = () => document.getElementById('cookie-container');
        const panInner = () => document.getElementById('pan-inner');
        const steamGroup = () => document.getElementById('steam-group');
        
        const phrases = [
            "周一... 深呼吸，宝贝 💨",
            "开始加热了呢... 慢慢来",
            "感觉有点煎熬... 但你不是一个人 🫂",
            "煎制中... 变成香香的饼干就好啦",
            "你已经很努力了哦～ 继续加油",
            "快好了... 爱你 ❤️",
            "完成！小猫饼干诞生 ✨"
        ];
        
        function updateStatus(text) {
            const el = statusEl();
            el.style.opacity = '0';
            setTimeout(() => {
                el.innerHTML = text;
                el.style.opacity = '1';
            }, 180);
        }
        
        function updateProgress(percent) {
            progress = Math.min(Math.max(percent, 0), 100);
            const bar = progressBar();
            const txt = progressText();
            
            bar.style.width = `${progress}%`;
            txt.textContent = `${Math.round(progress)}%`;
            
            // Heat up the pan gradually
            if (panInner()) {
                if (progress < 35) {
                    panInner().setAttribute('fill', '#FBBF24');
                } else if (progress < 70) {
                    panInner().setAttribute('fill', '#FB923C');
                } else {
                    panInner().setAttribute('fill', '#F87171');
                }
            }
            
            // Update status phrase
            const newIndex = Math.min(Math.floor(progress / (100 / phrases.length)), phrases.length - 1);
            if (newIndex !== currentPhraseIndex && progress < 100) {
                currentPhraseIndex = newIndex;
                updateStatus(phrases[newIndex]);
            }
            
            // Steam intensity
            if (steamGroup() && progress > 10 && progress < 100) {
                const intensity = 0.25 + (progress / 100) * 0.45;
                steamGroup().setAttribute('opacity', intensity.toFixed(2));
            }
        }
        
        function startFry() {
            if (isFrying) return;
            
            isFrying = true;
            progress = 0;
            currentPhraseIndex = 0;
            
            const startButton = startBtn();
            startButton.disabled = true;
            startButton.style.opacity = '0.6';
            startButton.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> <span>正在温柔地煎...</span>`;
            
            // Initial status
            updateStatus(phrases[0]);
            updateProgress(0);
            
            // Show steam
            if (steamGroup()) steamGroup().setAttribute('opacity', '0.35');
            
            // Start frying interval
            fryInterval = setInterval(() => {
                if (progress >= 100) {
                    clearInterval(fryInterval);
                    completeFry();
                    return;
                }
                
                // Variable speed for more natural feel
                let increment = (progress < 25) ? 1.8 : (progress < 65) ? 2.4 : 1.6;
                if (comfortLevel > 4) increment *= 0.7; // more comfort = slower, gentler fry
                
                progress += increment;
                updateProgress(progress);
                
                // Random small steam puff
                if (steamGroup() && Math.random() > 0.65) {
                    steamGroup().setAttribute('opacity', (0.4 + Math.random() * 0.35).toFixed(2));
                    setTimeout(() => {
                        if (steamGroup() && progress < 100) {
                            steamGroup().setAttribute('opacity', (0.3 + (progress / 120)).toFixed(2));
                        }
                    }, 420);
                }
            }, 95);
        }
        
        function completeFry() {
            isFrying = false;
            clearInterval(fryInterval);
            
            const startButton = startBtn();
            const catCont = catContainer();
            const cookieCont = cookieContainer();
            
            // Final progress
            updateProgress(100);
            updateStatus(phrases[phrases.length - 1]);
            
            // Hide steam
            if (steamGroup()) steamGroup().setAttribute('opacity', '0');
            
            // Transition cat → cookie
            catCont.style.transitionDuration = '520ms';
            catCont.style.opacity = '0';
            
            setTimeout(() => {
                catCont.classList.add('hidden');
                cookieCont.classList.remove('hidden');
                cookieCont.style.transitionDuration = '520ms';
                cookieCont.style.opacity = '1';
                
                // Final cute message
                setTimeout(() => {
                    updateStatus('mo.exe 已经变成香香的小猫饼干啦～
现在可以好好休息，宝贝 ❤️');
                }, 650);
            }, 520);
            
            // Show post actions
            setTimeout(() => {
                startButton.style.display = 'none';
                postActions().classList.remove('hidden');
                postActions().classList.add('flex', 'flex-col', 'items-center');
            }, 820);
            
            // Bonus hearts on complete
            setTimeout(() => {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => createFloatingHeart(true), i * 110);
                }
            }, 950);
        }
        
        function createFloatingHeart(isBonus = false) {
            const container = document.getElementById('illustration');
            if (!container) return;
            
            const heart = document.createElement('div');
            heart.className = `absolute text-3xl z-10 ${isBonus ? 'text-pink-300' : 'text-pink-400'}`;
            heart.style.left = `${Math.random() * 78 + 11}%`;
            heart.style.top = `${Math.random() * 55 + 22}%`;
            heart.style.transition = 'all 0s';
            heart.innerHTML = isBonus ? '💗' : '❤️';
            
            container.appendChild(heart);
            
            // Trigger animation
            requestAnimationFrame(() => {
                heart.style.transition = 'all 1.65s cubic-bezier(0.22, 1, 0.36, 1)';
                heart.style.transform = `translateY(-${Math.random() * 75 + 55}px)`;
                heart.style.opacity = '0';
            });
            
            setTimeout(() => {
                if (heart && heart.parentNode) heart.parentNode.removeChild(heart);
            }, 1850);
        }
        
        function addComfort() {
            comfortLevel++;
            createFloatingHeart();
            
            const container = document.getElementById('illustration');
            if (container) {
                container.style.transform = 'scale(1.015)';
                setTimeout(() => {
                    if (container) container.style.transform = 'scale(1)';
                }, 180);
            }
            
            if (comfortLevel >= 6 && panInner() && !isFrying) {
                panInner().setAttribute('fill', '#F9A8D4');
            }
            
            if (comfortLevel === 3) {
                updateStatus('温柔能量+3... 煎的过程变得甜一点了 🥰');
                setTimeout(() => {
                    if (!isFrying && progress < 100) {
                        updateStatus('继续点击画面可以继续增加能量哦～');
                    }
                }, 1600);
            } else if (comfortLevel === 7) {
                updateStatus('你真温柔... 小猫饼干会记得这份爱的 💕');
            }
            
            if (comfortLevel % 4 === 0 && comfortLevel > 0) {
                for (let i = 0; i < 2; i++) {
                    setTimeout(() => createFloatingHeart(), i * 180);
                }
            }
        }
        
        function hugCookie() {
            const cookieCont = cookieContainer();
            if (!cookieCont || cookieCont.classList.contains('hidden')) return;
            
            cookieCont.classList.add('cookie-wiggle');
            
            for (let i = 0; i < 7; i++) {
                setTimeout(() => {
                    createFloatingHeart(true);
                }, i * 55);
            }
            
            setTimeout(() => {
                if (cookieCont) cookieCont.classList.remove('cookie-wiggle');
            }, 650);
            
            const originalStatus = statusEl().innerHTML;
            updateStatus('饼干被抱紧了... 感觉好幸福 🥹❤️');
            
            setTimeout(() => {
                if (statusEl().innerHTML.includes('幸福')) {
                    updateStatus(originalStatus);
                }
            }, 2400);
        }
        
        function writeNote() {
            const modal = document.getElementById('note-modal');
            const input = document.getElementById('note-input');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            input.focus();
            input.value = '';
        }
        
        function hideNoteModal() {
            const modal = document.getElementById('note-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }
        
        function saveNote() {
            const input = document.getElementById('note-input');
            const value = input.value.trim();
            
            if (!value) {
                hideNoteModal();
                return;
            }
            
            hideNoteModal();
            
            const noteDisplay = document.createElement('div');
            noteDisplay.className = `mt-4 mx-auto max-w-[260px] bg-white/90 border border-pink-100 rounded-2xl p-4 text-xs text-pink-500 soft-shadow`;
            noteDisplay.innerHTML = `
                <div class="flex items-center gap-x-2 mb-1.5">
                    <i class="fa-solid fa-heart text-pink-300"></i>
                    <span class="font-medium text-pink-400 text-[10px]">你写给周一的自己</span>
                </div>
                <div class="leading-snug">"${value}"</div>
            `;
            
            const postAct = postActions();
            const existingNote = document.getElementById('saved-note');
            if (existingNote) existingNote.remove();
            
            noteDisplay.id = 'saved-note';
            postAct.parentNode.insertBefore(noteDisplay, postAct.nextSibling);
            
            setTimeout(() => {
                updateStatus('已经把你的温柔话保存啦～ 周一的你会看到的');
                setTimeout(() => {
                    if (progress >= 100) {
                        updateStatus('mo.exe 已经变成香香的小猫饼干啦～
现在可以好好休息，宝贝 ❤️');
                    }
                }, 2200);
            }, 300);
        }
        
        function resetAll() {
            if (fryInterval) clearInterval(fryInterval);
            
            progress = 0;
            comfortLevel = 0;
            isFrying = false;
            currentPhraseIndex = 0;
            
            const bar = progressBar();
            const txt = progressText();
            const catCont = catContainer();
            const cookieCont = cookieContainer();
            const startButton = startBtn();
            const postAct = postActions();
            
            bar.style.width = '0%';
            txt.textContent = '0%';
            
            if (panInner()) panInner().setAttribute('fill', '#FBBF24');
            if (steamGroup()) steamGroup().setAttribute('opacity', '0');
            
            catCont.style.opacity = '1';
            catCont.style.transitionDuration = '400ms';
            catCont.classList.remove('hidden');
            
            cookieCont.style.opacity = '0';
            cookieCont.classList.add('hidden');
            
            startButton.style.display = 'flex';
            startButton.disabled = false;
            startButton.style.opacity = '1';
            startButton.innerHTML = `<i class="fa-solid fa-play mr-1.5"></i> <span>开始周一煎饼仪式</span>`;
            
            postAct.classList.add('hidden');
            postAct.classList.remove('flex', 'flex-col', 'items-center');
            
            const saved = document.getElementById('saved-note');
            if (saved) saved.remove();
            
            updateStatus('点击下方按钮，开始温柔的煎饼仪式吧～');
            
            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => createFloatingHeart(), i * 140);
                }
            }, 280);
        }
        
        function setupKeyboard() {
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    const startButton = startBtn();
                    const cookieVisible = !document.getElementById('cookie-container').classList.contains('hidden');
                    
                    if (!startButton.disabled && startButton.style.display !== 'none') {
                        startFry();
                    } else if (cookieVisible) {
                        hugCookie();
                    }
                }
                
                if (e.key.toLowerCase() === 'r' && e.metaKey) {
                    e.preventDefault();
                    resetAll();
                }
            });
            console.log('%c[小猫饼] 提示：按空格键可以快速开始或抱抱饼干', 'color:#F9A8D4');
        }
        
        function addIllustrationListeners() {
            const illust = document.getElementById('illustration');
            if (!illust) return;
            
            let pressTimer = null;
            
            illust.addEventListener('mousedown', () => {
                pressTimer = setTimeout(() => {
                    if (!isFrying) {
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => createFloatingHeart(), i * 90);
                        }
                        updateStatus('好多温柔能量... 谢谢你，宝贝');
                    }
                }, 620);
            });
            
            illust.addEventListener('mouseup', () => clearTimeout(pressTimer));
            illust.addEventListener('mouseleave', () => clearTimeout(pressTimer));
            
            illust.addEventListener('touchstart', () => {
                pressTimer = setTimeout(() => {
                    if (!isFrying) {
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => createFloatingHeart(), i * 90);
                        }
                    }
                }, 620);
            });
            illust.addEventListener('touchend', () => clearTimeout(pressTimer));
        }
        
        function init() {
            initializeTailwind();
            setupKeyboard();
            addIllustrationListeners();
            
            setTimeout(() => {
                const illust = document.getElementById('illustration');
                if (illust) {
                    illust.style.transition = 'transform 800ms cubic-bezier(0.34,1.56,0.64,1)';
                    illust.style.transform = 'scale(0.96)';
                    
                    setTimeout(() => {
                        if (illust) illust.style.transform = 'scale(1)';
                    }, 180);
                }
            }, 420);
            
            const title = document.querySelector('.cute-title');
            if (title) {
                title.addEventListener('click', () => {
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => {
                            const heart = document.createElement('div');
                            heart.style.position = 'fixed';
                            heart.style.left = `${Math.random() * window.innerWidth}px`;
                            heart.style.top = `${Math.random() * 160 + 40}px`;
                            heart.style.fontSize = '19px';
                            heart.style.zIndex = '9999';
                            heart.style.transition = 'all 1.4s ease-out';
                            heart.innerHTML = Math.random() > 0.5 ? '🐱' : '🫠';
                            document.body.appendChild(heart);
                            
                            setTimeout(() => {
                                heart.style.transform = `translateY(${Math.random()*120 + 80}px)`;
                                heart.style.opacity = '0';
                            }, 30);
                            
                            setTimeout(() => heart.remove(), 1500);
                        }, i * 65);
                    }
                });
            }
            
            setTimeout(() => {
                const steam = document.getElementById('steam-group');
                if (steam && !isFrying) {
                    steam.setAttribute('opacity', '0.15');
                }
            }, 1800);
            
            console.log('%c[小猫饼仪式] 已就绪 - 温柔模式开启 🫶', 'color:#F9A8D4; font-size: 9px');
        }
        
        window.onload = init;
    </script>
</body>
</html>
