<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝的专属哄睡星空</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义轻柔的动画 */
        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.2; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0.8); opacity: 0.2; }
        }
        
        .animate-breathe {
            animation: breathe 8s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 6s infinite ease-in-out;
        }

        body {
            /* 深邃的夜空渐变背景 */
            background: linear-gradient(to bottom, #020617, #0f172a, #1e1b4b);
            overflow: hidden;
            touch-action: none; /* 防止移动端意外滑动 */
        }

        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center text-white relative">

    <!-- 星空背景画布 -->
    <canvas id="star-canvas"></canvas>

    <!-- 主界面内容 -->
    <div id="start-screen" class="z-10 flex flex-col items-center justify-center transition-opacity duration-1000">
        <h1 class="text-3xl font-light tracking-widest mb-8 text-indigo-200 opacity-90 animate-float">夜深啦，宝</h1>
        <p class="text-slate-400 mb-12 text-center max-w-xs text-sm leading-relaxed">
            把亮度调低，找个舒服的姿势躺好。
准备好了就点下面的按钮哦。
        </p>
        <button id="start-btn" class="px-8 py-3 rounded-full bg-indigo-900/50 border border-indigo-700/50 text-indigo-100 hover:bg-indigo-800/60 transition-all duration-300 backdrop-blur-sm tracking-wider">
            我躺好了
        </button>
    </div>

    <!-- 哄睡呼吸界面 (初始隐藏) -->
    <div id="sleep-screen" class="z-10 flex flex-col items-center justify-center w-full h-full absolute inset-0 opacity-0 pointer-events-none transition-opacity duration-1000">
        
        <!-- 呼吸光晕 -->
        <div class="relative flex items-center justify-center w-64 h-64 mb-12 mt-16">
            <!-- 外层呼吸扩散光圈 -->
            <div class="absolute inset-0 bg-indigo-500 rounded-full blur-2xl animate-breathe"></div>
            <!-- 内层月亮本体 -->
            <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-indigo-100 to-amber-50 shadow-[0_0_40px_rgba(255,255,255,0.3)] animate-float"></div>
            
            <!-- 呼吸提示字 -->
            <div class="absolute text-indigo-900/40 text-sm tracking-widest font-bold z-20" id="breath-indicator">吸气</div>
        </div>

        <!-- 悄悄话文本框 -->
        <div class="h-24 flex items-center justify-center px-6 text-center">
            <p id="whisper-text" class="text-xl md:text-2xl font-light text-indigo-100 tracking-wide transition-opacity duration-1000 opacity-100 drop-shadow-md">
                乖，跟着光晕的节奏...
            </p>
        </div>
        
    </div>

    <script>
        // --- 星空特效逻辑 ---
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const numStars = Math.floor((canvas.width * canvas.height) / 3000); // 根据屏幕大小决定星星数量
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.1,
                    alpha: Math.random(),
                    fadeDir: Math.random() > 0.5 ? 1 : -1,
                    fadeSpeed: Math.random() * 0.01 + 0.002
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();

                // 闪烁逻辑
                star.alpha += star.fadeSpeed * star.fadeDir;
                if (star.alpha >= 1) {
                    star.alpha = 1;
                    star.fadeDir = -1;
                } else if (star.alpha <= 0.1) {
                    star.alpha = 0.1;
                    star.fadeDir = 1;
                }
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();


        // --- 哄睡交互逻辑 ---
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const sleepScreen = document.getElementById('sleep-screen');
        const whisperText = document.getElementById('whisper-text');
        const breathIndicator = document.getElementById('breath-indicator');

        // 专属悄悄话列表
        const whispers = [
            "闭上眼睛，宝...",
            "深呼吸，感受气息...",
            "慢慢把气吐出来...",
            "你今天表现得很棒哦...",
            "现在什么都不用想了...",
            "把所有的疲惫都交给我...",
            "我会一直在梦里陪着你...",
            "我的宝，最乖了...",
            "感受被子软软的温度...",
            "乖乖睡吧，好梦..."
        ];

        let whisperIndex = 0;
        let isBreathingIn = true;

        startBtn.addEventListener('click', () => {
            // 切换界面
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                sleepScreen.style.pointerEvents = 'auto';
                sleepScreen.style.opacity = '1';
                
                // 启动悄悄话循环 (每8秒切换一次，配合呼吸节奏)
                setInterval(changeWhisper, 8000);
                
                // 启动呼吸文字提示循环
                setInterval(() => {
                    isBreathingIn = !isBreathingIn;
                    breathIndicator.style.opacity = '0';
                    setTimeout(() => {
                        breathIndicator.innerText = isBreathingIn ? "吸气" : "呼气";
                        breathIndicator.style.opacity = '1';
                    }, 500);
                }, 4000); // 4秒吸，4秒呼

            }, 1000);
        });

        function changeWhisper() {
            whisperText.style.opacity = '0';
            setTimeout(() => {
                whisperIndex = (whisperIndex + 1) % whispers.length;
                whisperText.innerText = whispers[whisperIndex];
                whisperText.style.opacity = '1';
            }, 1500); // 给一点淡出的时间，过渡更温柔
        }

    </script>
</body>
</html>
