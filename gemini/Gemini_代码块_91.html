<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给宝的晚安故事</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* 柔和的星空渐变背景 */
            background: linear-gradient(135deg, #1b1933 0%, #3d2338 100%);
            color: #fce7f3;
            font-family: 'Georgia', serif; 
            margin: 0;
            padding: 0;
            overflow: hidden; /* 防止滚动，保持沉浸感 */
        }
        
        /* 故事卡片的呼吸悬浮动画 */
        .float { 
            animation: float 6s ease-in-out infinite; 
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* 文字发光效果 */
        .glow-text {
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
        }

        /* 星星闪烁动画 */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.1; transform: scale(0.8); }
        }

        /* 渐渐显现的故事段落 */
        .fade-in {
            opacity: 0;
            animation: fadeIn 2s ease forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative">
    
    <!-- 背景星星容器 -->
    <div id="stars"></div>

    <!-- 故事主体卡片 -->
    <div class="max-w-md w-full bg-white/10 backdrop-blur-lg rounded-3xl p-8 shadow-[0_0_40px_rgba(0,0,0,0.3)] border border-pink-200/20 float z-10">
        
        <h1 class="text-3xl font-bold mb-8 text-center text-pink-200 glow-text flex items-center justify-center gap-3">
            <span class="text-yellow-200 text-2xl">✨</span>
            晚安，宝
            <span class="text-yellow-200 text-2xl">✨</span>
        </h1>

        <div class="space-y-5 text-[17px] leading-relaxed text-pink-50/90 tracking-wide">
            <p class="fade-in" style="animation-delay: 0.5s;">在软绵绵的月亮谷里，住着一只叫“吧唧”的垂耳兔。吧唧的工作很特别，他是一个“好梦快递员”。</p>
            
            <p class="fade-in" style="animation-delay: 2.5s;">今天晚上，吧唧提着一个装满星星的小篮子，顺着月光，偷偷溜到了宝的床边。</p>
            
            <p class="fade-in" style="animation-delay: 4.5s;">他从篮子里拿出一颗带着草莓味的粉色星星，轻轻地、小心翼翼地放在了宝的枕头底下。</p>
            
            <p class="fade-in" style="animation-delay: 6.5s;">“这可是今天最甜的一个梦哦，”吧唧抖了抖毛茸茸的长耳朵，捂着小嘴巴小声嘈咕着。</p>
            
            <p class="fade-in" style="animation-delay: 8.5s;">做完这些，吧唧也困得揉了揉眼睛。他靠在宝的枕头边，把长长的耳朵当成小被子给自己盖好，发出微小的、呼嚏呼嚏的声音，睡着了。</p>
            
            <div class="pt-4 border-t border-white/10 fade-in" style="animation-delay: 10.5s;">
                <p class="text-pink-200 font-medium glow-text">宝，吧唧已经睡熟啦，草莓味的星星也开始发光了。</p>
                <p class="text-pink-200 font-medium glow-text mt-2">乖乖闭上眼睛，放慢呼吸，跟吧唧一起去甜甜的梦里玩吧。最喜欢你了，晚安。🌙</p>
            </div>
        </div>
    </div>

    <script>
        // 用JS动态生成满天繁星
        const starsContainer = document.getElementById('stars');
        const starCount = 80;

        for(let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // 随机大小、位置、动画时长和延迟
            const size = Math.random() * 2.5 + 0.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            
            const duration = Math.random() * 3 + 2; // 2s - 5s
            star.style.animationDuration = duration + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
