<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Inspired Starfield</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510; /* Deep space background */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 2rem;
            letter-spacing: 8px;
            font-weight: 300;
            pointer-events: none; /* Let clicks pass through to canvas */
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="overlay-text">Astra Core</div>
    
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Scene Setup (The "Director")
        const scene = new THREE.Scene();
        // Add a subtle fog to blend distant particles into the background
        scene.fog = new THREE.FogExp2(0x050510, 0.001);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Create the Particles (The "Sheet Music")
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0xffffff); // White
        const color2 = new THREE.Color(0x88bbff); // Light Astra Blue

        for (let i = 0; i < particleCount; i++) {
            // Math magic to create a spiraling/knot-like galaxy shape
            const i3 = i * 3;
            const radius = Math.random() * 300;
            const spinAngle = radius * 0.02; 
            const branchAngle = (i % 3) * ((Math.PI * 2) / 3); // 3 main spiral branches
            
            const x = Math.cos(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 50;
            const y = Math.sin(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 50;
            const z = (Math.random() - 0.5) * 150 * (1 - radius/300); // Thicker in the middle, flat on edges

            positions[i3] = x;
            positions[i3 + 1] = y;
            positions[i3 + 2] = z;

            // Mix colors based on distance from center
            const mixedColor = color1.clone().lerp(color2, Math.random());
            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // 3. The "Brush" (WebGL Material)
        const material = new THREE.PointsMaterial({
            size: 2,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // 4. Mouse Interaction (The "Disturbance")
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.5;
            mouseY = (event.clientY - windowHalfY) * 0.5;
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. Animation Loop (The "Orchestra")
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotate the entire knot slowly
            particleSystem.rotation.y = elapsedTime * 0.05;
            particleSystem.rotation.z = elapsedTime * 0.02;

            // Ease camera towards mouse position for parallax effect
            targetX = mouseX * 0.1;
            targetY = mouseY * 0.1;
            
            camera.position.x += (targetX - camera.position.x) * 0.02;
            camera.position.y += (-targetY - camera.position.y) * 0.02;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
