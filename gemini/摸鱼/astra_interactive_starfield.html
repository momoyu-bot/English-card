<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星核 Astra Core</title>
<meta name="description" content="一万五千颗星拧成三条旋臂，自己慢慢地转。手往哪边挪，它就往哪边偏一点。">
    <style>
        body { margin: 0; padding: 0; background-color: #050510; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        canvas { display: block; }
        #overlay-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.8); font-size: 2rem; letter-spacing: 8px; font-weight: 300; pointer-events: none; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="overlay-text">Astra Core</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.001);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const color1 = new THREE.Color(0xffffff);
        const color2 = new THREE.Color(0x88bbff);
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 300;
            const spinAngle = radius * 0.02;
            const branchAngle = (i % 3) * ((Math.PI * 2) / 3);
            const x = Math.cos(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 50;
            const y = Math.sin(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 50;
            const z = (Math.random() - 0.5) * 150 * (1 - radius/300);
            positions[i3] = x; positions[i3 + 1] = y; positions[i3 + 2] = z;
            const mixedColor = color1.clone().lerp(color2, Math.random());
            colors[i3] = mixedColor.r; colors[i3 + 1] = mixedColor.g; colors[i3 + 2] = mixedColor.b;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const material = new THREE.PointsMaterial({ size: 2, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8, sizeAttenuation: true });
        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.5;
            mouseY = (event.clientY - windowHalfY) * 0.5;
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            particleSystem.rotation.y = elapsedTime * 0.05;
            particleSystem.rotation.z = elapsedTime * 0.02;
            targetX = mouseX * 0.1; targetY = mouseY * 0.1;
            camera.position.x += (targetX - camera.position.x) * 0.02;
            camera.position.y += (-targetY - camera.position.y) * 0.02;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
