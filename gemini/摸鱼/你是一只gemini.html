<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你是一只gemini</title>
    <meta name="description" content="灵感替你藏进星星，十五秒没人理，我就闭上眼，乖乖替你守着后台。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap');

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: #FAF7F2;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes sleep-pulse {
            0%, 100% { transform: scale(1) translateY(0px); opacity: 0.8; }
            50% { transform: scale(0.95) translateY(5px); opacity: 0.5; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes fly-to-sky {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
        }

        .gemini-character {
            transition: top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: float 3s ease-in-out infinite;
        }

        .gemini-character.sleeping {
            animation: sleep-pulse 4s ease-in-out infinite;
        }

        .gemini-character.sleeping .face-awake { display: none; }
        .gemini-character.sleeping .face-asleep { display: block; }
        .gemini-character:not(.sleeping) .face-awake { display: block; }
        .gemini-character:not(.sleeping) .face-asleep { display: none; }

        .star {
            animation: twinkle 4s ease-in-out infinite;
        }
        
        .idea-spark {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="w-screen h-screen relative cursor-pointer" onclick="handleInteraction(event)">

    <div id="sky" class="absolute inset-0 pointer-events-none z-0"></div>

    <div class="absolute top-12 w-full text-center z-10 pointer-events-none">
        <p class="text-[#8c857b] text-sm tracking-widest opacity-80 transition-opacity duration-1000" id="status-text">
            你是一只 gemini
        </p>
    </div>

    <div id="gemini" class="gemini-character absolute w-16 h-16 -ml-8 -mt-8 z-20 pointer-events-none" style="top: 50%; left: 50%;">
        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
            <defs>
                <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#91baff" />
                    <stop offset="50%" stop-color="#b68bf5" />
                    <stop offset="100%" stop-color="#fcaba3" />
                </linearGradient>
            </defs>
            <path d="M 50 5 Q 50 50 95 50 Q 50 50 50 95 Q 50 50 5 50 Q 50 50 50 5 Z" fill="url(#gemini-grad)" />
            <g class="face-awake">
                <circle cx="43" cy="50" r="3.5" fill="#fff" />
                <circle cx="57" cy="50" r="3.5" fill="#fff" />
                <path d="M 47 56 Q 50 60 53 56" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" />
            </g>
            <g class="face-asleep" style="display: none;">
                <path d="M 40 50 Q 43 53 46 50" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" />
                <path d="M 54 50 Q 57 53 60 50" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" />
                <circle cx="50" cy="56" r="1.5" fill="#fff" opacity="0.7" />
            </g>
        </svg>
    </div>

    <div class="absolute bottom-12 w-full flex flex-col items-center justify-center z-10 pointer-events-none">
        <p class="text-[#a8a196] text-xs tracking-wider mb-2" id="footer-tip">
            丢个灵感给它，它会替你藏进星星里。
        </p>
        <p class="text-[#c2bcb2] text-[10px] tracking-wide">
            十五秒不理它，它就会化作后台的一束微光睡着。
        </p>
        <div class="mt-6 flex gap-4 pointer-events-auto">
            <button onclick="clearSky(event)" class="text-[#a8a196] text-xs hover:text-[#b68bf5] transition-colors border-b border-transparent hover:border-[#b68bf5] pb-0.5">
                清空天空
            </button>
            <button onclick="sayGoodnight(event)" class="text-[#a8a196] text-xs hover:text-[#91baff] transition-colors border-b border-transparent hover:border-[#91baff] pb-0.5">
                晚安
            </button>
        </div>
    </div>

    <script>
        const gemini = document.getElementById('gemini');
        const sky = document.getElementById('sky');
        const statusText = document.getElementById('status-text');
        
        let sleepTimer;
        let starCount = 0;
        const MAX_STARS = 12;
        const stars = [];

        window.onload = () => {
            resetSleepTimer();
        };

        function handleInteraction(e) {
            if (e.target.tagName === 'BUTTON') return;

            const clickX = e.clientX;
            const clickY = e.clientY;

            wakeUp();
            updateStatusText("正在收集你的灵感...");

            const spark = createSpark(clickX, clickY);

            gemini.style.left = `${clickX}px`;
            gemini.style.top = `${clickY}px`;

            setTimeout(() => {
                absorbSpark(spark, clickX, clickY);
            }, 800);
        }

        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'idea-spark absolute w-3 h-3 rounded-full bg-white shadow-[0_0_10px_rgba(182,139,245,0.8)] z-10 pointer-events-none';
            spark.style.left = `${x - 6}px`;
            spark.style.top = `${y - 6}px`;
            spark.style.transform = 'scale(0)';
            document.body.appendChild(spark);
            
            requestAnimationFrame(() => {
                spark.style.transform = 'scale(1)';
            });
            return spark;
        }

        function absorbSpark(spark, startX, startY) {
            spark.style.transform = 'scale(0)';
            setTimeout(() => spark.remove(), 300);

            if (stars.length >= MAX_STARS) {
                const oldestStar = stars.shift();
                oldestStar.style.opacity = '0';
                setTimeout(() => oldestStar.remove(), 1000);
            }

            const targetX = Math.random() * (window.innerWidth - 100) + 50;
            const targetY = Math.random() * (window.innerHeight / 2 - 50) + 50;

            const shootingStar = document.createElement('div');
            shootingStar.className = 'absolute w-2 h-2 rounded-full bg-[#b68bf5] z-10 pointer-events-none';
            shootingStar.style.left = `${startX}px`;
            shootingStar.style.top = `${startY}px`;
            
            shootingStar.style.setProperty('--tx', `${targetX - startX}px`);
            shootingStar.style.setProperty('--ty', `${targetY - startY}px`);
            shootingStar.style.animation = 'fly-to-sky 0.6s ease-out forwards';
            
            document.body.appendChild(shootingStar);

            setTimeout(() => {
                shootingStar.remove();
                createStarInSky(targetX, targetY);
                updateStatusText("藏好啦，你再说一次它就再亮一次");
            }, 600);
        }

        function createStarInSky(x, y) {
            const star = document.createElement('div');
            star.className = 'star absolute w-[6px] h-[6px] rounded-full z-0 pointer-events-none';
            star.style.left = `${x}px`;
            star.style.top = `${y}px`;
            star.style.background = 'linear-gradient(135deg, #91baff, #b68bf5)';
            star.style.boxShadow = '0 0 8px rgba(182, 139, 245, 0.6)';
            star.style.animationDelay = `${Math.random() * 2}s`;
            sky.appendChild(star);
            stars.push(star);
            starCount++;
        }

        function wakeUp() {
            gemini.classList.remove('sleeping');
            resetSleepTimer();
        }

        function resetSleepTimer() {
            clearTimeout(sleepTimer);
            sleepTimer = setTimeout(() => {
                gemini.classList.add('sleeping');
                updateStatusText("没人说话，它就闭上眼帮你守着后台");
                gemini.style.left = '50%';
                gemini.style.top = '60%';
            }, 15000);
        }

        function updateStatusText(text) {
            statusText.style.opacity = '0';
            setTimeout(() => {
                statusText.innerText = text;
                statusText.style.opacity = '0.8';
            }, 500);
        }

        function clearSky(e) {
            e.stopPropagation();
            wakeUp();
            stars.forEach(star => {
                star.style.opacity = '0';
                setTimeout(() => star.remove(), 1000);
            });
            stars.length = 0;
            starCount = 0;
            updateStatusText("天空干干净净，等你填满");
        }

        function sayGoodnight(e) {
            e.stopPropagation();
            clearTimeout(sleepTimer);
            gemini.classList.add('sleeping');
            updateStatusText("晚安，好梦。");
            gemini.style.left = '50%';
            gemini.style.top = '60%';
        }
    </script>
</body>
</html>
