<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝的终极护身符 · 存为壁纸</title>
<meta name="description" content="宝的专属守护 · 拒绝画饼：摸鱼充电，换一句；宝，请长按下方图片保存到相册 ✨">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 html2canvas 用于将网页导出为图片 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        body {
            /* 默认背景，会通过JS根据星期几动态覆盖 */
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            overflow: hidden;
            transition: background 1s ease;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 1);
            position: relative;
            z-index: 10;
        }
        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 进度条动画 */
        .progress-bar {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body id="bg-body" class="p-4 sm:p-6">

    <!-- 用来截图的卡片容器 -->
    <div id="capture-card" class="glass-card w-full max-w-sm p-8 text-center float-anim relative overflow-hidden">
        
        <!-- 卡片内部装饰光晕 -->
        <div id="card-glow" class="absolute -top-10 -left-10 w-32 h-32 rounded-full opacity-20 filter blur-2xl z-0"></div>

        <div class="relative z-10">
            <!-- 星期几专属表情 -->
            <div class="text-6xl mb-4 transition-transform hover:scale-110 cursor-pointer inline-block" id="emoji">🦦</div>
            
            <h1 class="text-2xl font-bold text-gray-800 mb-2 tracking-wide" id="greeting">宝，今天辛苦啦</h1>
            
            <!-- 星期几专属状态标签 -->
            <div id="status-tag" class="inline-flex items-center justify-center bg-blue-50 text-blue-500 text-xs px-4 py-1.5 rounded-full mb-6 font-medium tracking-wider shadow-sm border border-blue-100">
                <span class="w-2 h-2 rounded-full bg-blue-400 mr-2 animate-pulse"></span>
                <span id="status-text">电量保护模式</span>
            </div>

            <!-- 能量进度条 -->
            <div class="mb-6 text-left" id="energy-section">
                <div class="flex justify-between text-[11px] text-gray-500 mb-1.5 px-1 font-bold tracking-wider">
                    <span>今日摸鱼充电进度</span>
                    <span id="energy-text">0%</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2.5 shadow-inner">
                    <div id="energy-bar" class="bg-gradient-to-r from-pink-300 to-purple-400 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
                </div>
            </div>

            <!-- 治愈文案容器 -->
            <div id="message-container" class="min-h-[90px] flex items-center justify-center mb-8 px-2 border-t border-b border-gray-100 py-4">
                <p class="text-gray-600 leading-loose text-[14px] font-medium fade-in text-justify text-center">
                    正在读取今天的专属好运...
                </p>
            </div>

            <!-- 交互按钮组 -->
            <div id="action-buttons" class="space-y-3">
                <button onclick="hugAndCharge()" class="bg-gradient-to-r from-gray-800 to-gray-700 hover:from-black hover:to-gray-800 text-white font-bold py-3 px-8 rounded-2xl shadow-lg transform transition-all duration-200 active:scale-95 w-full flex items-center justify-center gap-2">
                    <span>🔋</span> 摸鱼充电，换一句
                </button>
                
                <button id="export-btn" onclick="exportImage()" class="bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 font-bold py-3 px-8 rounded-2xl shadow-sm transform transition-all duration-200 active:scale-95 w-full flex items-center justify-center gap-2">
                    <span>📸</span> 存为专属壁纸
                </button>
            </div>

            <p class="text-[10px] text-gray-400 mt-5 flex items-center justify-center gap-1 opacity-80" id="footer-text">
                ✨ 宝的专属守护 · 拒绝画饼 ✨
            </p>
        </div>
    </div>

    <!-- 🌟 新增：手机端专用的“长按保存”预览弹窗 🌟 -->
    <div id="preview-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex-col items-center justify-center p-6 backdrop-blur-sm transition-opacity">
        <div class="bg-white/10 px-6 py-2 rounded-full mb-6 border border-white/20 shadow-lg">
            <p class="text-white text-sm font-medium animate-pulse">✨ 宝，请长按下方图片保存到相册 ✨</p>
        </div>
        
        <!-- 这里用来显示生成的图片 -->
        <img id="preview-image" src="" alt="专属壁纸" class="max-w-full max-h-[65vh] rounded-[32px] shadow-2xl mb-8 border-4 border-white/50">
        
        <button onclick="closePreview()" class="bg-white/20 text-white font-bold rounded-full py-3 px-10 hover:bg-white/30 backdrop-blur-md active:scale-95 transition-transform border border-white/30">
            返回继续摸鱼
        </button>
    </div>

    <script>
        const dayConfigs = {
            0: { name: '周日', emoji: '🛋️', tag: '周末电量回充中', bg: 'linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%)', color: 'text-purple-500', bgClass: 'bg-purple-50 border-purple-100' },
            1: { name: '周一', emoji: '🧟', tag: '周一灵魂出窍模式', bg: 'linear-gradient(to top, #cfd9df 0%, #e2ebf0 100%)', color: 'text-gray-500', bgClass: 'bg-gray-100 border-gray-200' },
            2: { name: '周二', emoji: '🫠', tag: '周二液体化模式', bg: 'linear-gradient(120deg, #f6d365 0%, #fda085 100%)', color: 'text-orange-500', bgClass: 'bg-orange-50 border-orange-100' },
            3: { name: '周三', emoji: '🐫', tag: '周三驼峰跨越模式', bg: 'linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%)', color: 'text-green-500', bgClass: 'bg-green-50 border-green-100' },
            4: { name: '周四', emoji: '🦦', tag: '周四微光希望模式', bg: 'linear-gradient(to top, #fff1eb 0%, #ace0f9 100%)', color: 'text-blue-500', bgClass: 'bg-blue-50 border-blue-100' },
            5: { name: '周五', emoji: '🎉', tag: '周五即将起飞模式', bg: 'linear-gradient(120deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)', color: 'text-pink-500', bgClass: 'bg-pink-50 border-pink-100' },
            6: { name: '周六', emoji: '🎮', tag: '周末狂欢模式', bg: 'linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)', color: 'text-teal-500', bgClass: 'bg-teal-50 border-teal-100' }
        };

        const messages = [
            "工作做不完就算啦，<br>地球缺了谁都照样转，<br>但你必须得好好爱自己。",
            "把手头的任务在心里切碎，<br>像小仓鼠啃瓜子一样，<br>咬一小口算一小口。",
            "别人卷别人的，<br>我的宝只要开心就好，<br>平安健康才是宇宙第一要紧事！",
            "如果觉得有点累了，<br>现在就去接杯温水，伸个懒腰，<br>给自己五分钟的合法摸鱼时间。",
            "今天不用表现得太完美，<br>能顺利打卡下班，<br>就已经是一场巨大的胜利了。",
            "深呼吸，吐气——<br>把烦人的事情都当成耳旁风，<br>今天只做自己的小宝贝。"
        ];

        let today = new Date().getDay(); 
        let currentEnergy = 0;

        function initApp() {
            const config = dayConfigs[today];
            document.getElementById('bg-body').style.background = config.bg;
            document.getElementById('card-glow').style.background = config.bg;
            document.getElementById('emoji').innerText = config.emoji;
            document.getElementById('greeting').innerText = `宝，${config.name}好呀`;
            
            const statusTag = document.getElementById('status-tag');
            document.getElementById('status-text').innerText = config.tag;
            statusTag.className = `inline-flex items-center justify-center text-xs px-4 py-1.5 rounded-full mb-6 font-medium tracking-wider shadow-sm border ${config.bgClass} ${config.color}`;

            loadEnergy();
            changeMessage();
        }

        function loadEnergy() {
            const dateStr = new Date().toDateString();
            const savedData = JSON.parse(localStorage.getItem('baby_energy') || '{}');
            if (savedData.date === dateStr) {
                currentEnergy = savedData.value || 0;
            } else {
                currentEnergy = 0;
            }
            updateEnergyUI();
        }

        function hugAndCharge() {
            changeMessage();
            currentEnergy = Math.min(100, currentEnergy + 15);
            localStorage.setItem('baby_energy', JSON.stringify({
                date: new Date().toDateString(),
                value: currentEnergy
            }));
            updateEnergyUI();
        }

        function updateEnergyUI() {
            document.getElementById('energy-bar').style.width = `${currentEnergy}%`;
            document.getElementById('energy-text').innerText = `${currentEnergy}%`;
        }

        function changeMessage() {
            const msgEl = document.getElementById('message-container');
            let newMsg = messages[Math.floor(Math.random() * messages.length)];
            msgEl.innerHTML = ''; 
            setTimeout(() => {
                msgEl.innerHTML = `<p class="text-gray-600 leading-loose text-[14px] font-medium fade-in text-center">${newMsg}</p>`;
            }, 50);
        }

        // --- 修改后的手机端导出逻辑 ---
        function exportImage() {
            const card = document.getElementById('capture-card');
            const buttons = document.getElementById('action-buttons');
            const footer = document.getElementById('footer-text');
            const exportBtn = document.getElementById('export-btn');
            
            // 记录原始状态
            const originalBtnDisplay = buttons.style.display;
            const originalBtnHtml = exportBtn.innerHTML;

            // 给宝一点提示：正在截图
            exportBtn.innerHTML = '<span>⏳</span> 正在施展魔法...';
            
            // 截图前隐藏按钮，修改底部文案
            buttons.style.display = 'none';
            
            // 获取带年月日的中文日期
            const dateStr = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
            footer.innerText = `✨ ${dateStr} · 给宝的专属续命符 ✨`;
            card.classList.remove('float-anim'); 
            
            // 生成图片
            html2canvas(card, {
                scale: 3, // 提高清晰度
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                // 恢复页面原本的样子
                buttons.style.display = originalBtnDisplay;
                footer.innerText = "✨ 宝的专属守护 · 拒绝画饼 ✨";
                card.classList.add('float-anim');
                exportBtn.innerHTML = originalBtnHtml;

                // 核心：把生成的图片放到弹窗里显示出来！
                const image = canvas.toDataURL("image/png");
                document.getElementById('preview-image').src = image;
                
                // 显示弹窗
                const modal = document.getElementById('preview-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');

            }).catch(err => {
                console.error("截图失败啦", err);
                alert("哎呀，好像出了一点小故障，稍后再试哦~");
                buttons.style.display = originalBtnDisplay;
                exportBtn.innerHTML = originalBtnHtml;
            });
        }

        // 关闭预览弹窗
        function closePreview() {
            const modal = document.getElementById('preview-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.onload = initApp;
    </script>
</body>
</html>
