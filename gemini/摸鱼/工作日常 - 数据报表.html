<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作日常 - 数据报表</title>
<meta name="description" content="你的目标：尽可能多地摸鱼，千万别被老板抓到！🤫 紧急情况请按【空格键】伪装。"> <!-- 伪装的网页标题 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #1e1e2f;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: radial-gradient(circle, #2a2a40 0%, #1a1a2e 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: none; /* 隐藏鼠标，用游戏角色代替 */
        }

        /* 伪装的 Excel 表格样式 */
        #fake-excel {
            display: none; /* 默认隐藏，按下空格显示 */
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            overflow: auto;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .excel-toolbar {
            background-color: #217346;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #164b2e;
        }
        
        .excel-ribbon {
            background-color: #f3f2f1;
            padding: 8px 20px;
            border-bottom: 1px solid #e1dfdd;
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #605e5c;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #e1dfdd;
            padding: 4px 8px;
            text-align: right;
            font-size: 13px;
        }

        th {
            background-color: #f3f2f1;
            text-align: center;
            font-weight: normal;
            color: #605e5c;
        }
        
        td:first-child {
            background-color: #f3f2f1;
            text-align: center;
            width: 40px;
            color: #605e5c;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .tips {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 8px;
        }

        #menu {
            pointer-events: auto;
            background: rgba(30, 30, 47, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        button {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            padding: 12px 30px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="score-board">摸到的鱼: <span id="scoreDisplay">0</span> 🐟</div>
        <div class="tips">🤫 紧急情况请按【空格键】伪装！<br>🖱️ 鼠标移动控制自己躲避老板</div>
        
        <div id="menu">
            <h1 class="text-4xl font-bold mb-4">摸鱼大作战 🐟</h1>
            <p class="text-gray-300 mb-2">你的目标：尽可能多地摸鱼，千万别被老板抓到！</p>
            <p class="text-gray-400 text-sm mb-6">操作：鼠标移动控制 😎，收集 🐟，躲避 👔</p>
            <div id="finalScoreDisplay" class="text-2xl font-bold text-yellow-400 hidden mb-4"></div>
            <button id="startBtn">开始摸鱼</button>
        </div>
    </div>
</div>

<div id="fake-excel">
    <div class="excel-toolbar">
        <span>File</span><span>Home</span><span>Insert</span><span>Page Layout</span><span>Formulas</span><span>Data</span><span>Review</span><span>View</span>
    </div>
    <div class="excel-ribbon">
        <span>Paste</span><span>✂️ Cut</span><span>Arial</span><span>11</span><span>B I U</span><span>Merge & Center</span><span>$ %</span>
    </div>
    <table id="excel-table">
        <thead>
            <tr>
                <th></th>
                <th>A (Region)</th>
                <th>B (Q1 Revenue)</th>
                <th>C (Q2 Revenue)</th>
                <th>D (Q3 Forecast)</th>
                <th>E (YoY Growth)</th>
                <th>F (Status)</th>
            </tr>
        </thead>
        <tbody id="excel-body">
            <!-- JavaScript 动态填充无聊的数据 -->
        </tbody>
    </table>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const menu = document.getElementById('menu');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const finalScoreDisplay = document.getElementById('finalScoreDisplay');
    const fakeExcel = document.getElementById('fake-excel');
    
    let width, height;
    let gameLoop;
    let isPlaying = false;
    let isFakeMode = false; // 老板键状态
    let score = 0;
    let mouse = { x: 0, y: 0 };

    // 游戏实体数组
    let player;
    let enemies = [];
    let fishes = [];

    // 调整画布大小
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        if(player) {
            mouse.x = width / 2;
            mouse.y = height / 2;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    class Player {
        constructor() {
            this.x = width / 2;
            this.y = height / 2;
            this.radius = 20;
            this.emoji = '😎';
        }
        
        update() {
            // 平滑跟随鼠标
            this.x += (mouse.x - this.x) * 0.2;
            this.y += (mouse.y - this.y) * 0.2;
            
            // 边界限制
            this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
            this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
        }
        
        draw() {
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, this.x, this.y);
        }
    }

    class Enemy {
        constructor() {
            // 从边缘生成
            if (Math.random() > 0.5) {
                this.x = Math.random() > 0.5 ? 0 : width;
                this.y = Math.random() * height;
            } else {
                this.x = Math.random() * width;
                this.y = Math.random() > 0.5 ? 0 : height;
            }
            this.radius = 20;
            this.emoji = '👔'; // 老板图标
            
            // 随机速度
            let speed = 2 + Math.random() * 3 + (score * 0.1); // 随分数提速
            let angle = Math.atan2(player.y - this.y, player.x - this.x);
            // 增加一点随机偏差
            angle += (Math.random() - 0.5) * 1;
            
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // 碰到边缘反弹
            if (this.x <= 0 || this.x >= width) this.vx *= -1;
            if (this.y <= 0 || this.y >= height) this.vy *= -1;
        }
        
        draw() {
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, this.x, this.y);
        }
    }

    class Fish {
        constructor() {
            this.radius = 15;
            this.x = this.radius + Math.random() * (width - this.radius * 2);
            this.y = this.radius + Math.random() * (height - this.radius * 2);
            this.emoji = '🐟';
            this.pulse = 0;
        }
        
        draw() {
            this.pulse += 0.1;
            let currentSize = 25 + Math.sin(this.pulse) * 3; // 呼吸效果
            ctx.font = `${currentSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, this.x, this.y);
        }
    }

    function spawnFish() {
        if (fishes.length < 2) {
            fishes.push(new Fish());
        }
    }

    function spawnEnemy() {
        enemies.push(new Enemy());
    }

    function checkCollisions() {
        // 吃鱼检测
        for (let i = fishes.length - 1; i >= 0; i--) {
            let f = fishes[i];
            let dist = Math.hypot(player.x - f.x, player.y - f.y);
            if (dist < player.radius + f.radius) {
                fishes.splice(i, 1);
                score++;
                scoreDisplay.innerText = score;
                spawnFish();
                
                // 每吃3条鱼，增加一个老板，增加难度
                if (score % 3 === 0) {
                    spawnEnemy();
                }
            }
        }

        // 撞老板检测
        for (let e of enemies) {
            let dist = Math.hypot(player.x - e.x, player.y - e.y);
            // 给碰撞体积稍微打个折，防止太容易死
            if (dist < player.radius + e.radius - 10) {
                gameOver();
            }
        }
    }

    function animate() {
        if (!isPlaying || isFakeMode) return;
        
        // 清屏并带有拖影效果
        ctx.fillStyle = 'rgba(26, 26, 46, 0.4)';
        ctx.fillRect(0, 0, width, height);

        player.update();
        player.draw();

        fishes.forEach(f => f.draw());

        enemies.forEach(e => {
            e.update();
            e.draw();
        });

        checkCollisions();

        gameLoop = requestAnimationFrame(animate);
    }

    function startGame() {
        isPlaying = true;
        score = 0;
        scoreDisplay.innerText = score;
        enemies = [];
        fishes = [];
        menu.style.display = 'none';
        
        mouse.x = width / 2;
        mouse.y = height / 2;
        player = new Player();
        
        spawnFish();
        spawnEnemy();
        
        animate();
    }

    function gameOver() {
        isPlaying = false;
        cancelAnimationFrame(gameLoop);
        
        finalScoreDisplay.innerText = `最终战绩: 摸到了 ${score} 条鱼！`;
        finalScoreDisplay.classList.remove('hidden');
        startBtn.innerText = "再摸一次";
        menu.style.display = 'block';
    }

    // 鼠标移动监听 (只有在游戏进行且没伪装时生效)
    window.addEventListener('mousemove', (e) => {
        if (isPlaying && !isFakeMode) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }
    });

    startBtn.addEventListener('click', startGame);

    // 生成假装在工作的 Excel 数据
    function generateFakeExcelData() {
        const tbody = document.getElementById('excel-body');
        const regions = ['North America', 'Europe', 'Asia Pacific', 'Latin America', 'Middle East'];
        const statuses = ['On Track', 'Delayed', 'Review', 'Completed'];
        
        let html = '';
        for (let i = 1; i <= 30; i++) {
            let r1 = (Math.random() * 100000 + 50000).toFixed(2);
            let r2 = (Math.random() * 100000 + 50000).toFixed(2);
            let r3 = (Math.random() * 150000 + 80000).toFixed(2);
            let growth = ((r2 - r1) / r1 * 100).toFixed(1) + '%';
            
            html += `
                <tr>
                    <td>${i}</td>
                    <td style="text-align:left">${regions[i % regions.length]} - Div ${Math.floor(Math.random()*10)}</td>
                    <td>$${r1}</td>
                    <td>$${r2}</td>
                    <td>$${r3}</td>
                    <td style="color: ${growth.includes('-') ? '#d13438' : '#107c41'}">${growth}</td>
                    <td>${statuses[Math.floor(Math.random()*statuses.length)]}</td>
                </tr>
            `;
        }
        tbody.innerHTML = html;
    }
    
    // 初始化伪装表格数据
    generateFakeExcelData();

    // 监听空格键
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault(); // 防止页面滚动
            
            isFakeMode = !isFakeMode; // 切换状态
            
            if (isFakeMode) {
                // 进入伪装模式
                fakeExcel.style.display = 'block';
                document.title = "Annual_Sales_Report_2026.xlsx";
                // 如果正在玩，暂停动画循环
                if (isPlaying) cancelAnimationFrame(gameLoop);
            } else {
                // 退出伪装模式
                fakeExcel.style.display = 'none';
                document.title = "工作日常 - 数据报表"; // 保持低调的标题
                // 恢复动画循环，并重置鼠标位置防止角色瞬移
                if (isPlaying) {
                    mouse.x = player.x;
                    mouse.y = player.y;
                    animate();
                }
            }
        }
    });

</script>
</body>
</html>
