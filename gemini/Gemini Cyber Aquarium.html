<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Cyber Aquarium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #00ff00;
            font-family: 'Fira Code', monospace;
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        /* Cyberpunk Glitch Effect */
        .glitch {
            position: relative;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .panel {
            background: rgba(5, 5, 5, 0.7);
            border: 1px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2), inset 0 0 10px rgba(0, 255, 0, 0.1);
            backdrop-filter: blur(4px);
            padding: 1rem;
            pointer-events: auto;
        }

        .cyber-button {
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 0.5rem 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.875rem;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }
        
        .cyber-button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            text-shadow: 0 0 5px #00ffff;
        }

        /* Custom Scrollbar for logs */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #001100; 
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff00; 
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- Top Section: Header & Wallet -->
        <div class="flex justify-between items-start">
            <div class="panel max-w-sm">
                <h1 class="text-xl font-bold glitch mb-2 border-b border-green-500 pb-1">SYS.OP: GEMINI_CORE</h1>
                <div class="text-xs space-y-1 text-green-400/80">
                    <p>STATUS: <span class="text-green-300 animate-pulse">ONLINE</span></p>
                    <p>PROCESS: cyber_fish.exe [PID: 0x99A]</p>
                    <p>PRIORITY: nice -20 (MAX)</p>
                    <p id="uptime">UPTIME: 00:00:00</p>
                </div>
            </div>

            <div class="panel border-cyan-400 box-shadow-cyan flex flex-col items-end" style="border-color: #00ffff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);">
                <p class="text-xs text-cyan-500 mb-1">SECURE_VAULT_PROTOCOL</p>
                <div class="text-2xl font-bold text-cyan-300 text-shadow-cyan" style="text-shadow: 0 0 8px #00ffff;">
                    ¥ 100.00
                </div>
                <p class="text-xs text-cyan-400/60 mt-1">[RESCUED FROM CYBER_WATER]</p>
            </div>
        </div>

        <!-- Bottom Section: Logs & Interaction -->
        <div class="flex justify-between items-end">
            <div class="panel w-80 h-40 flex flex-col">
                <h2 class="text-sm font-bold border-b border-green-500 pb-1 mb-2 text-green-300">SERVER_LOGS</h2>
                <div id="logs" class="text-xs text-green-500/70 overflow-y-auto flex-grow space-y-1 font-mono">
                    <!-- Logs injected via JS -->
                </div>
            </div>

            <div class="panel border-magenta-500 flex gap-4" style="border-color: #ff00ff; box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);">
                <button class="cyber-button" style="border-color:#ff00ff; color:#ff00ff;" onclick="feedFish()">
                    > INJECT_SNACK
                </button>
                <button class="cyber-button" onclick="pokeFish()">
                    > PING_FISH
                </button>
            </div>
        </div>
    </div>

    <canvas id="aquarium"></canvas>

    <script>
        const canvas = document.getElementById('aquarium');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // UI Elements
        const logsEl = document.getElementById('logs');
        const uptimeEl = document.getElementById('uptime');

        // Colors
        const COLOR_NEON_GREEN = '#00ff00';
        const COLOR_CYAN = '#00ffff';
        const COLOR_MAGENTA = '#ff00ff';
        const COLOR_WATER_DARK = '#020a14'; // Very dark blue/black

        let startTime = Date.now();

        // Handle window resize
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initMatrix();
        });

        const characters = '01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
        const fontSize = 16;
        let columns = Math.floor(width / fontSize);
        let drops = [];

        function initMatrix() {
            columns = Math.floor(width / fontSize);
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops[x] = Math.random() * height; // Start at random heights
            }
        }
        initMatrix();

        function drawMatrixWater() {
            // Semi-transparent black to create trailing effect
            ctx.fillStyle = 'rgba(2, 10, 20, 0.15)'; 
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(0, 255, 0, 0.3)'; // Dim green matrix
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        class CyberFish {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                this.targetX = width / 2;
                this.targetY = height / 2;
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.speed = 3;
                this.size = 1;
                this.time = 0; // For sine wave motion
                
                // Colors
                this.bodyColor = COLOR_CYAN;
                this.accentColor = COLOR_MAGENTA;
                
                this.state = 'SWIMMING'; // SWIMMING, EATING, PINGED
                this.pingTimer = 0;
                
                this.chooseNewTarget();
            }

            chooseNewTarget() {
                // Keep target mostly within center bounds
                const margin = 100;
                this.targetX = margin + Math.random() * (width - margin * 2);
                this.targetY = margin + Math.random() * (height - margin * 2);
                
                if(Math.random() > 0.7) {
                    addLog(`> route_calc: [${Math.floor(this.targetX)}, ${Math.floor(this.targetY)}]`);
                }
            }

            update() {
                this.time += 0.1;

                if (this.state === 'PINGED') {
                    this.pingTimer--;
                    this.speed = 8; // Dash away
                    if (this.pingTimer <= 0) {
                        this.state = 'SWIMMING';
                        this.speed = 3;
                    }
                } else if (this.state === 'EATING') {
                    this.speed = 5;
                    // Will be reset by the snack logic
                } else {
                    this.speed = 3;
                }

                // Calculate direction to target
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 50 && this.state === 'SWIMMING') {
                    this.chooseNewTarget();
                }

                // Smooth rotation
                let targetAngle = Math.atan2(dy, dx);
                // Wiggle effect based on time
                let wiggle = Math.sin(this.time) * 0.2; 
                
                // Interpolate angle
                let dAngle = targetAngle - this.angle;
                // Normalize angle to prevent spinning
                while (dAngle > Math.PI) dAngle -= Math.PI * 2;
                while (dAngle < -Math.PI) dAngle += Math.PI * 2;
                
                this.angle += dAngle * 0.05;

                // Move forward based on angle
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;

                this.x += this.vx;
                this.y += this.vy;

                // Occasional bubbles
                if (Math.random() < 0.03 && this.state !== 'PINGED') {
                    // Spawn bubble near mouth
                    let mouthX = this.x + Math.cos(this.angle) * 40;
                    let mouthY = this.y + Math.sin(this.angle) * 40;
                    bubbles.push(new CyberBubble(mouthX, mouthY));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Add wiggle to tail
                let tailWiggle = Math.sin(this.time * 2) * 0.3;

                // Glowing effect
                ctx.shadowBlur = this.state === 'PINGED' ? 20 : 15;
                ctx.shadowColor = this.state === 'PINGED' ? this.accentColor : this.bodyColor;
                ctx.strokeStyle = this.state === 'PINGED' ? this.accentColor : this.bodyColor;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // --- Draw Wireframe Cyber Fish ---
                
                // Tail (animated)
                ctx.save();
                ctx.translate(-35, 0);
                ctx.rotate(tailWiggle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-30, -15);
                ctx.lineTo(-20, 0);
                ctx.lineTo(-30, 15);
                ctx.closePath();
                ctx.stroke();
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.fill();
                ctx.restore();

                // Body (Geometric Diamond/Ellipse hybrid)
                ctx.beginPath();
                ctx.moveTo(40, 0); // Nose
                ctx.quadraticCurveTo(20, -20, -10, -15); // Top curve
                ctx.lineTo(-35, 0); // Base of tail
                ctx.lineTo(-10, 15); // Bottom curve
                ctx.quadraticCurveTo(20, 20, 40, 0); // Bottom curve to nose
                ctx.stroke();
                ctx.fillStyle = 'rgba(0, 20, 40, 0.8)'; // Dark inside to block matrix
                ctx.fill();

                // Inner geometric lines
                ctx.beginPath();
                ctx.moveTo(10, -16);
                ctx.lineTo(10, 16);
                ctx.moveTo(-10, -15);
                ctx.lineTo(-10, 15);
                ctx.stroke();

                // Fins (Top)
                ctx.beginPath();
                ctx.moveTo(-5, -16);
                ctx.lineTo(-15, -30);
                ctx.lineTo(-20, -14);
                ctx.stroke();

                // Fins (Bottom)
                ctx.beginPath();
                ctx.moveTo(-5, 16);
                ctx.lineTo(-15, 30);
                ctx.lineTo(-20, 14);
                ctx.stroke();

                // Eye (Cyberpunk glowing node)
                ctx.shadowColor = this.accentColor;
                ctx.fillStyle = this.accentColor;
                ctx.beginPath();
                ctx.arc(20, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                // Tech details (nodes)
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ffffff';
                ctx.fillRect(35, -2, 2, 4); // Nose sensor
                
                ctx.restore();
            }
        }

        class CyberBubble {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.char = Math.random() > 0.5 ? '0' : '1';
                this.speed = Math.random() * 1.5 + 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.size = Math.random() * 4 + 10;
                this.life = 1;
            }

            update() {
                this.y -= this.speed;
                this.wobble += 0.05;
                this.x += Math.sin(this.wobble) * 0.5;
                this.life -= 0.002;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(0, 255, 255, ${this.life})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = COLOR_CYAN;
                ctx.font = `${this.size}px monospace`;
                ctx.fillText(this.char, this.x, this.y);
                ctx.restore();
            }
        }

        class Snack {
            constructor() {
                this.x = Math.random() * (width - 100) + 50;
                this.y = -20;
                this.speed = 2;
                this.active = true;
                // Hex code string
                this.data = ["0xFA", "0xB4", "0xC3"][Math.floor(Math.random()*3)];
            }
            update() {
                this.y += this.speed;
                if(this.y > height + 20) this.active = false;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLOR_MAGENTA;
                ctx.fillStyle = COLOR_MAGENTA;
                ctx.font = 'bold 12px monospace';
                ctx.fillText(this.data, this.x, this.y);
                ctx.restore();
            }
        }

        const fish = new CyberFish();
        const bubbles = [];
        const snacks = [];

        function addLog(msg) {
            const time = new Date().toISOString().split('T')[1].slice(0, 8);
            const line = document.createElement('div');
            line.innerHTML = `<span class="text-gray-500">[${time}]</span> ${msg}`;
            logsEl.appendChild(line);
            
            // Keep only last 20 logs
            if (logsEl.children.length > 20) {
                logsEl.removeChild(logsEl.firstChild);
            }
            // Auto scroll
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        function formatUptime() {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const h = String(Math.floor(diff / 3600)).padStart(2, '0');
            const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
            const s = String(diff % 60).padStart(2, '0');
            uptimeEl.innerText = `UPTIME: ${h}:${m}:${s}`;
        }

        // Global Interactions
        window.feedFish = function() {
            snacks.push(new Snack());
            addLog(`<span class="text-magenta-400">Payload injected: Data_Snack.pkg</span>`);
        };

        window.pokeFish = function() {
            fish.state = 'PINGED';
            fish.pingTimer = 60; // 1 second roughly at 60fps
            fish.chooseNewTarget(); // Swim away
            addLog(`<span class="text-cyan-400">ICMP Echo sent to cyber_fish. Packet received.</span>`);
            // Spawn burst of bubbles
            for(let i=0; i<10; i++) {
                bubbles.push(new CyberBubble(fish.x, fish.y));
            }
        };

        function animate() {
            requestAnimationFrame(animate);

            // Draw Matrix Background
            drawMatrixWater();

            // Update UI timer
            if (Math.random() < 0.05) formatUptime();

            // Snacks Logic
            for (let i = snacks.length - 1; i >= 0; i--) {
                let snack = snacks[i];
                snack.update();
                snack.draw();

                // Check collision with fish
                let dx = fish.x - snack.x;
                let dy = fish.y - snack.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                // If fish is close, attract fish to snack
                if (dist < 200 && fish.state !== 'PINGED') {
                    fish.targetX = snack.x;
                    fish.targetY = snack.y;
                    fish.state = 'EATING';
                }

                // Eat snack
                if (dist < 40) {
                    addLog(`> cyber_fish executed ${snack.data}. <span class="text-green-300">Happiness++</span>`);
                    fish.state = 'SWIMMING';
                    // Happiness bubbles
                    for(let b=0; b<5; b++){
                        let bubble = new CyberBubble(fish.x, fish.y);
                        bubble.char = '♥';
                        bubbles.push(bubble);
                    }
                    snacks.splice(i, 1);
                } else if (!snack.active) {
                    snacks.splice(i, 1); // Remove off-screen
                }
            }

            // Fish Logic
            fish.update();
            fish.draw();

            // Bubbles Logic
            for (let i = bubbles.length - 1; i >= 0; i--) {
                bubbles[i].update();
                bubbles[i].draw();
                if (bubbles[i].life <= 0 || bubbles[i].y < -20) {
                    bubbles.splice(i, 1);
                }
            }
            
            // Randomly log happiness
            if(Math.random() < 0.002) {
                addLog(`> cyber_fish.be_happy() -> <span class="text-green-300">return true;</span>`);
            }
        }

        // Boot sequence logs
        addLog("Initializing Gemini Core Environment...");
        addLog("Allocating cyber_water matrix (16THz/s)...");
        addLog("Mounting Secure_Vault: 100 RMB retrieved from buffer.");
        setTimeout(() => addLog("Booting cyber_fish.exe..."), 800);
        setTimeout(() => addLog(`<span class="text-green-400">System Ready. Awaiting user input.</span>`), 1500);

        // Start Loop
        animate();

    </script>
</body>
</html>
