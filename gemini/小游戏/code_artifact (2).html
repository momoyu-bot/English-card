<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猫猫鱼的一天 · 灵感塔罗</title>
<meta name="description" content="今天会抽到哪一种状态？StashYu和FetchMo的灵感塔罗牌。单只出场、换装、新题材，一切皆可。">
<!--
  momoyu 系列 · 灵感塔罗牌
  这是一份专门用来打破“束缚”的示范文件。
  看清楚了：
  1. 它们不是总要成双成对出现，这一页里有大量的单只角色独角戏。
  2. 它们不一定要玩“藏与叼”，占卜、摸鱼、思考，什么题材都可以。
  3. 衣服不是死板的校服，而是根据场景（牌意）当场穿上的。
  底模一格没动，但生命力全长出来了。
-->
<style>
  :root {
    /* 灰粉与月光银的低饱和度色盘 */
    --bg: #F2EFEF; 
    --ink: #3A3238; 
    --ink-light: #7A6F76;
    --card-front: #FCFAFA;
    --card-back: #3A3238;
    --card-back-pattern: #574B53;
    --border: #DED6D8;
    --accent: #B07D8B; /* 灰粉色 */
    --accent-light: #E8D8DB;
    --shadow: rgba(58, 50, 56, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B181A;
      --ink: #E8DFE3;
      --ink-light: #9B8F96;
      --card-front: #262224;
      --card-back: #141113;
      --card-back-pattern: #2D272A;
      --border: #3D3538;
      --accent: #C899A5;
      --accent-light: #4A3A40;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; overflow: hidden;
  }

  .header {
    text-align: center; margin-bottom: 40px; z-index: 10;
  }
  .kicker {
    font-size: 12px; letter-spacing: 0.2em; color: var(--accent); margin: 0 0 8px; text-transform: uppercase;
  }
  h1 {
    font-size: 24px; font-weight: 600; margin: 0; letter-spacing: 0.05em;
  }

  /* 塔罗牌舞台 */
  .stage {
    position: relative; width: 280px; height: 420px; perspective: 1000px; z-index: 20;
  }
  
  .card {
    width: 100%; height: 100%; position: absolute;
    transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.floating { animation: float 6s ease-in-out infinite; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .face {
    width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
    border-radius: 20px; box-shadow: 0 16px 40px var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--border); overflow: hidden;
  }

  /* 牌背设计 - 星芒与网格 */
  .face.back {
    background: var(--card-back); color: var(--card-back-pattern);
    background-image: 
      linear-gradient(var(--card-back-pattern) 1px, transparent 1px),
      linear-gradient(90deg, var(--card-back-pattern) 1px, transparent 1px);
    background-size: 20px 20px; background-position: center;
  }
  .face.back::after {
    content: '✦'; font-size: 60px; color: var(--accent); text-shadow: 0 0 20px var(--accent);
  }
  .click-hint {
    position: absolute; bottom: 30px; font-size: 12px; color: var(--accent);
    letter-spacing: 0.1em; opacity: 0.7; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* 牌面设计 */
  .face.front {
    background: var(--card-front); transform: rotateY(180deg);
    padding: 24px; justify-content: space-between;
  }
  .card-border {
    position: absolute; inset: 12px; border: 1px solid var(--accent-light); border-radius: 12px;
    pointer-events: none;
  }
  .card-num {
    font-size: 18px; font-family: serif; color: var(--accent); font-style: italic; margin-top: 10px;
  }
  .svg-container {
    flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;
  }
  .svg-container svg {
    max-width: 100%; max-height: 180px; filter: drop-shadow(0 8px 16px var(--shadow));
  }
  
  .card-title {
    font-size: 20px; font-weight: 600; margin: 10px 0 6px; letter-spacing: 0.1em;
  }
  .card-desc {
    font-size: 13px; color: var(--ink-light); text-align: center; line-height: 1.6; margin: 0 0 10px;
    height: 42px; display: flex; align-items: center; justify-content: center;
  }

  .controls {
    margin-top: 40px; display: flex; gap: 16px; opacity: 0; transition: opacity 0.5s;
    pointer-events: none;
  }
  .controls.visible { opacity: 1; pointer-events: auto; }
  
  .btn {
    background: transparent; color: var(--ink); border: 1px solid var(--border);
    padding: 10px 24px; border-radius: 999px; font-size: 13px; cursor: pointer;
    letter-spacing: 0.05em; transition: all 0.2s;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
</style>
</head>
<body>

<div class="header">
  <p class="kicker">Momoyu Series</p>
  <h1>灵感塔罗牌</h1>
</div>

<div class="stage">
  <div class="card floating" id="tarot-card">
    <div class="face back">
      <div class="click-hint">CLICK TO DRAW</div>
    </div>
    <div class="face front">
      <div class="card-border"></div>
      <div class="card-num" id="c-num">0</div>
      <div class="svg-container" id="c-img"></div>
      <div style="text-align: center;">
        <div class="card-title" id="c-title">Title</div>
        <div class="card-desc" id="c-desc">Description</div>
      </div>
    </div>
  </div>
</div>

<div class="controls" id="controls">
  <button class="btn" id="btn-reset">把牌放回</button>
  <button class="btn primary" id="btn-draw">再抽一张</button>
</div>

<canvas id="confetti"></canvas>

<script>
/* =========================================================================
   核心宪法数据：严格拷贝自 Code 版宪法，确保格子图一格不差。
   ========================================================================= */
const DATA = {
  fox: {
    rows: [".D..........D.......", ".DM........MD.......", ".MCM......MCM...CC..", ".MMMMMMMMMMMM..CCCC.", ".MMEEMMMMEEMM..MMMM.", ".MMEEMMMMEEMM..MMMMM", "CCCCCCDDCCCCCC.MMMMM", "..CCCCCCCCCC..MMMMM.", "....MMCCMM...MMMMM..", "....MMCCMM..MMMMM...", "....MMMMMM.MMMMM....", "....DDMMDDMMMM......", "...................."],
    pal: { M: "#E2552B", C: "#FFF3E3", D: "#3B2520", E: "#3B2520" }, line: "#3B2520",
    eyes: [[3, 4], [9, 4]], blush: { cells: [[2, 6], [11, 6]], color: "#F59A8C" }, side: [17, -3], glance: 1
  },
  cat: {
    rows: ["....................", "........X........X..", ".......XXX......XXX.", "........MMMMMMMMMM..", ".......MMMMMMMMMMMM.", ".......MEEMMMMMMEEM.", ".....X.MEEMXXXXMEEM.", "....X..MMMMMXXMMMMM.", "....X...MMMMMMMMMM..", "....X...MMMMMMMMMM..", ".....X...MMMMMMMM...", "......XXXXXM..MXX...", "...................."],
    pal: { M: "#F3E7D6", X: "#4E382E", E: "#79C0F0" }, line: "#4E382E",
    eyes: [[8, 5], [16, 5]], blush: { cells: [[8, 7], [17, 7]], color: "#F2B8B0" }, side: [3, 0], glance: -1
  }
};
const W = 20, H = 13;

function band(x0, x1, y, c) { const out = []; for (let x = x0; x <= x1; x++) out.push([x, y, c]); return out; }
function ring(x, y, c) { return [[x - 1, y, c], [x - 1, y + 1, c], [x + 2, y, c], [x + 2, y + 1, c], [x, y - 1, c], [x + 1, y - 1, c], [x, y + 2, c], [x + 1, y + 2, c]]; }

const WEAR = {
  '围巾': {
    fox: band(3, 10, 8, '#4F9A8A').concat([[10, 9, '#4F9A8A'], [10, 10, '#4F9A8A'], [6, 8, '#6DB5A5'], [8, 8, '#6DB5A5']]),
    cat: band(7, 18, 8, '#C0587A').concat([[6, 9, '#C0587A'], [6, 10, '#C0587A'], [10, 8, '#D98AA4'], [14, 8, '#D98AA4']])
  },
  '蝴蝶结': {
    fox: [[4, 8, '#C0587A'], [5, 8, '#C0587A'], [4, 9, '#C0587A'], [5, 9, '#C0587A'], [8, 8, '#C0587A'], [9, 8, '#C0587A'], [8, 9, '#C0587A'], [9, 9, '#C0587A'], [6, 8, '#F2B8B0'], [7, 8, '#F2B8B0']],
    cat: [[10, 1, '#E2552B'], [11, 1, '#E2552B'], [10, 2, '#E2552B'], [11, 2, '#E2552B'], [14, 1, '#E2552B'], [15, 1, '#E2552B'], [14, 2, '#E2552B'], [15, 2, '#E2552B'], [12, 2, '#FFF3E3'], [13, 2, '#FFF3E3'], [12, 1, '#E2552B'], [13, 1, '#E2552B']]
  },
  '毛线帽': {
    fox: band(4, 9, 2, '#3F7FB0').concat(band(4, 9, 1, '#5E9BC9'), band(5, 8, 0, '#5E9BC9'), [[6, -1, '#FFF3E3'], [7, -1, '#FFF3E3']]),
    cat: band(10, 15, 2, '#9C4463').concat(band(10, 15, 1, '#C0587A'), band(11, 14, 0, '#C0587A'), [[12, -1, '#FFF3E3'], [13, -1, '#FFF3E3']])
  },
  '眼镜': {
    fox: ring(3, 4, '#E1A93A').concat(ring(9, 4, '#E1A93A'), [[6, 4, '#E1A93A'], [7, 4, '#E1A93A']]),
    cat: ring(8, 5, '#E1A93A').concat(ring(16, 5, '#E1A93A'), band(11, 14, 5, '#E1A93A'))
  }
};

function eyeCells(kind, x, y, right, dir) {
  switch (kind) {
    case 'open':    return [[[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]], 'eye'];
    case 'happy':   return [[[x - 1, y + 1], [x, y], [x + 1, y], [x + 2, y + 1]], 'line'];
    case 'sleep':   return [[[x - 1, y], [x, y + 1], [x + 1, y + 1], [x + 2, y]], 'line'];
    case 'glance':  return [[[x + dir, y], [x + 1 + dir, y], [x + dir, y + 1], [x + 1 + dir, y + 1]], 'eye'];
    case 'squeeze': return right ? [[[x + 1, y - 1], [x, y], [x + 1, y + 1]], 'line'] : [[[x, y - 1], [x + 1, y], [x, y + 1]], 'line'];
    case 'dot':     return [[[x + (right ? 0 : 1), y + 1]], 'eye'];
  }
  return [[], 'eye'];
}

function buildGrid(name, exprName, wearName, dir) {
  const ch = DATA[name];
  // 1. Base body
  const grid = ch.rows.map(r => r.split('').map(k => (k === '.' ? null : ch.pal[k === 'E' ? 'M' : k])));
  
  // 2. Eyes
  [0, 1].forEach(i => {
    const [x, y] = ch.eyes[i];
    const [cells, which] = eyeCells(exprName, x, y, i === 1, dir !== undefined ? dir : ch.glance);
    const col = which === 'eye' ? ch.pal.E : ch.line;
    cells.forEach(([cx, cy]) => { if (grid[cy] && cx >= 0 && cx < W) grid[cy][cx] = col; });
  });

  // 3. Wearables (Layered on top)
  const over = [];
  if (wearName && WEAR[wearName]) {
    WEAR[wearName][name].forEach(c => over.push(c));
  }
  return { grid, over };
}

function svgOf(who, exprName, wearName) {
  const parts = who === 'both' ? [['fox', 0], ['cat', W + 2]] : [[who, 0]];
  const cells = new Map();
  
  parts.forEach(([name, ox]) => {
    const d = buildGrid(name, exprName, wearName);
    for (let y = 0; y < H - 1; y++) for (let x = 0; x < W; x++) if (d.grid[y][x]) cells.set((ox + x) + ',' + y, d.grid[y][x]);
    d.over.forEach(([x, y, c]) => cells.set((ox + x) + ',' + y, c));
  });

  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  cells.forEach((c, key) => { const [x, y] = key.split(',').map(Number); x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
  y1 = Math.max(y1, H - 2); 
  
  const byColor = new Map();
  for (let y = y0; y <= y1; y++) {
    let x = x0;
    while (x <= x1) {
      const c = cells.get(x + ',' + y);
      if (!c) { x++; continue; }
      let n = 1;
      while (cells.get((x + n) + ',' + y) === c) n++;
      if (!byColor.has(c)) byColor.set(c, []);
      byColor.get(c).push('M' + x + ' ' + y + 'h' + n + 'v1h-' + n + 'z');
      x += n;
    }
  }
  
  const vw = x1 - x0 + 1, vh = y1 - y0 + 1;
  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${vw} ${vh}" width="100%" height="100%" shape-rendering="crispEdges">`;
  [...byColor.keys()].forEach(c => { out += `\n<path fill="${c}" d="${byColor.get(c).join('')}"/>`; });
  return out + '\n</svg>';
}

/* =========================================================================
   塔罗牌逻辑：打破束缚，展示单体与动态穿戴的魅力
   ========================================================================= */
const DECK = [
  { num: "0", title: "愚者 The Fool", who: "fox", expr: "happy", wear: "围巾", desc: "充满好奇，不看报错就敢直接 push 新代码。" },
  { num: "IX", title: "隐者 The Hermit", who: "cat", expr: "dot", wear: "眼镜", desc: "一个人在深夜里 Debug，灵感往往在此时降临。" },
  { num: "XVII", title: "星辰 The Star", who: "both", expr: "glance", wear: "蝴蝶结", desc: "Git 宇宙里的双子星。Fetch 负责同步，Stash 负责兜底，完美化解 Merge Conflict。" },
  { num: "XVIII", title: "月亮 The Moon", who: "fox", expr: "sleep", wear: "毛线帽", desc: "缓存已清空，合上电脑，现在是休息的时间。" },
  { num: "I", title: "魔术师 The Magician", who: "cat", expr: "squeeze", wear: "围巾", desc: "掌握所有语法，把看似不可能的需求变现。" }
];

const cardEl = document.getElementById('tarot-card');
const controlsEl = document.getElementById('controls');
let isFlipped = false;
let isAnimating = false;

function drawCard() {
  if (isAnimating) return;
  isAnimating = true;
  
  // 随机选一张牌
  const card = DECK[Math.floor(Math.random() * DECK.length)];
  
  // 更新牌面内容
  document.getElementById('c-num').innerText = card.num;
  document.getElementById('c-title').innerText = card.title;
  document.getElementById('c-desc').innerText = card.desc;
  document.getElementById('c-img').innerHTML = svgOf(card.who, card.expr, card.wear);
  
  // 翻牌
  cardEl.classList.remove('floating');
  cardEl.classList.add('flipped');
  isFlipped = true;
  
  setTimeout(() => {
    controlsEl.classList.add('visible');
    isAnimating = false;
  }, 800);
}

function resetCard() {
  if (isAnimating) return;
  isAnimating = true;
  controlsEl.classList.remove('visible');
  cardEl.classList.remove('flipped');
  
  setTimeout(() => {
    cardEl.classList.add('floating');
    isFlipped = false;
    isAnimating = false;
  }, 800);
}

cardEl.addEventListener('click', () => { if (!isFlipped) drawCard(); });
document.getElementById('btn-draw').addEventListener('click', () => {
  resetCard();
  setTimeout(drawCard, 900);
});
document.getElementById('btn-reset').addEventListener('click', resetCard);

</script>
</body>
</html>
