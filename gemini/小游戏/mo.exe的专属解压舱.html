<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mo.exe 专属解压舱</title>
<meta name="description" content="防空洞已开启。滑动戳破飘浮的烦恼进程。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            /* 灰粉色调与黄昏蓝的渐变，极致温柔 */
            background: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #eadae1, #d5c3c6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            touch-action: none; /* 防止移动端滑动屏幕 */
            user-select: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 隐藏鼠标指针，我们会有自己的交互反馈 */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让点击穿透UI层，直达Canvas */
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* 呼吸动画效果 */
        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .breathe-text {
            animation: breathe 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 信息层 -->
    <div class="ui-layer">
        <div class="text-center w-full mt-4">
            <h1 class="text-3xl md:text-4xl font-bold text-white tracking-widest drop-shadow-md breathe-text">
                防空洞已开启
            </h1>
            <p class="text-white/80 mt-2 text-sm md:text-base tracking-wider drop-shadow">
                滑动或点击屏幕，戳破飘浮的烦恼
            </p>
        </div>
        
        <div class="flex justify-between items-end w-full">
            <div class="bg-white/20 backdrop-blur-md rounded-2xl px-6 py-3 shadow-[0_8px_32px_0_rgba(31,38,135,0.1)] border border-white/30 text-white">
                <span class="text-xs opacity-70 block mb-1">已清理烦恼进程</span>
                <span id="scoreDisplay" class="text-2xl font-bold">0</span> <span class="text-sm">MB</span>
            </div>
            
            <div class="text-right">
                <p class="text-white/60 text-xs tracking-widest">
                    SYSTEM: mo.exe<br>
                    STATUS: RELAXING
                </p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');

        let width, height;
        let bubbles = [];
        let particles = [];
        let score = 0;

        // 灰粉色、柔和蓝、暖白色系
        const colors = ['#f4e1f9', '#d8b4e2', '#c1cbe0', '#ffffff', '#ffd1dc'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Bubble {
            constructor(x, y, radius, manual = false) {
                this.x = x || Math.random() * width;
                this.y = y || height + radius + 10;
                this.radius = radius || Math.random() * 20 + 15;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                // 向上漂浮的速度，非常缓慢
                this.vy = -(Math.random() * 0.5 + 0.5); 
                // 左右摇摆的参数
                this.vx = 0;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.wobbleAngle = Math.random() * Math.PI * 2;
                this.popped = false;
                this.manual = manual; // 是否是用户点击生成的
                
                // 给手动生成的气泡加一点初始向上速度
                if (manual) {
                    this.vy = -(Math.random() * 2 + 1);
                }
            }

            update() {
                this.y += this.vy;
                this.wobbleAngle += this.wobbleSpeed;
                this.x += Math.sin(this.wobbleAngle) * 0.5;

                // 如果飘出屏幕顶部，则重置到底部（自然生成的）或标记删除（手动生成的）
                if (this.y < -this.radius) {
                    if (this.manual) {
                        this.popped = true;
                    } else {
                        this.y = height + this.radius;
                        this.x = Math.random() * width;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                // 创造柔和的发光效果
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                
                // 略微透明，更有气泡感
                ctx.globalAlpha = 0.8;
                ctx.fill();
                
                // 添加一个小高光
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.shadowBlur = 0;
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 1;
                this.life = 1; // 生命周期 1.0 -> 0
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                // 轻微向上的浮力（像火花一样）
                this.vy -= 0.05; 
            }

            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkPop(clientX, clientY) {
            let poppedAny = false;
            // 倒序遍历，从最上层的气泡开始检查
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                const dist = Math.hypot(b.x - clientX, b.y - clientY);
                if (dist < b.radius + 15) { // 稍微增大判定范围
                    b.popped = true;
                    createExplosion(b.x, b.y, b.color);
                    score += Math.floor(Math.random() * 5) + 1; // 随机释放 1-5 MB
                    scoreDisplay.innerText = score;
                    
                    // 戳破后，补充一个新的自然气泡在底部
                    if(!b.manual){
                        bubbles.push(new Bubble(Math.random() * width, height + 30));
                    }
                    poppedAny = true;
                }
            }
            
            // 如果点击空白处，生成一个新的气泡
            if (!poppedAny) {
                bubbles.push(new Bubble(clientX, clientY, Math.random() * 15 + 10, true));
            }
        }

        // 鼠标交互
        canvas.addEventListener('mousemove', (e) => {
            // 滑动时也判定戳破，更有解压感
            checkPop(e.clientX, e.clientY);
        });
        canvas.addEventListener('mousedown', (e) => {
            checkPop(e.clientX, e.clientY);
        });

        // 移动端触摸交互
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // 阻止默认滚动
            for (let i = 0; i < e.touches.length; i++) {
                checkPop(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, { passive: false });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                checkPop(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, { passive: false });

        // 初始化一些自然飘浮的气泡
        const initialBubbles = Math.min(window.innerWidth / 30, 40); // 根据屏幕宽度决定初始数量
        for (let i = 0; i < initialBubbles; i++) {
            // 初始气泡散布在整个屏幕高度
            bubbles.push(new Bubble(Math.random() * width, Math.random() * height)); 
        }

        function animate() {
            // 清除画布
            ctx.clearRect(0, 0, width, height);

            // 更新和绘制气泡
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                if (b.popped) {
                    bubbles.splice(i, 1);
                } else {
                    b.update();
                    b.draw();
                }
            }

            // 更新和绘制粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // 启动动画循环
        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
