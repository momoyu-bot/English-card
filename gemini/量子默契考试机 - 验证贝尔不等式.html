<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子默契考试机 - 验证贝尔不等式</title>
<meta name="description" content="测双胞胎默契。提前背剧本过不了 2.0，量子能更高。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        
        /* 进度条动画 */
        .gauge-fill {
            transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1), background-color 1s ease;
        }
        
        /* 数字跳动动画 */
        .score-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="max-w-3xl w-full space-y-6">
        
        <!-- 头部解说 -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-violet-600/20 rounded-full blur-3xl"></div>
            
            <h1 class="text-2xl font-black text-white mb-2 flex items-center">
                <i class="fa-solid fa-graduation-cap text-violet-400 mr-3"></i> 宇宙终极默契考试
            </h1>
            <p class="text-sm text-slate-300 leading-relaxed">
                宝，现在你是主考官！你要测试两组双胞胎的默契度 (也就是截图里的 <span class="font-mono text-pink-400 font-bold bg-pink-900/30 px-1 rounded">|S| 值</span>)。
            </p>
            <ul class="text-xs text-slate-400 mt-3 space-y-1.5 list-disc list-inside">
                <li><b class="text-amber-400">爱因斯坦红线 (最高 2.0分)：</b> 只要是靠“提前背剧本、出门前商量好”作弊的，不管多聪明，绝对不可能考过 2.0 分！</li>
                <li><b class="text-pink-400">量子魔法线 (最高 2.83分)：</b> 只有真正拥有“跨时空瞬间心灵感应”的量子，才能突破红线，飙到 2.83 分附近。</li>
            </ul>
        </div>

        <!-- 互动测试区 -->
        <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 shadow-2xl">
            
            <!-- 模式切换卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <!-- 经典模式 -->
                <button id="btn-classic" onclick="setMode('classic')" class="bg-slate-800 border-2 border-amber-500/50 rounded-2xl p-4 text-left transition-all hover:bg-slate-700 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-amber-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-amber-400 font-bold text-lg mb-1">📝 提前背剧本模式</h3>
                            <p class="text-[10px] text-slate-400">(爱因斯坦的“手套”理论)</p>
                        </div>
                        <i class="fa-solid fa-book text-amber-500/50 text-3xl"></i>
                    </div>
                    <div class="mt-3 text-xs text-slate-300">假设粒子就像手套，出门前就决定好了各自的状态。</div>
                    <!-- 选中标识 -->
                    <div id="check-classic" class="absolute top-3 right-3 text-amber-400 hidden"><i class="fa-solid fa-circle-check"></i></div>
                </button>

                <!-- 量子模式 -->
                <button id="btn-quantum" onclick="setMode('quantum')" class="bg-slate-800 border-2 border-slate-700 rounded-2xl p-4 text-left transition-all hover:bg-slate-700 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-pink-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-pink-400 font-bold text-lg mb-1">✨ 真·量子魔法模式</h3>
                            <p class="text-[10px] text-slate-400">(2022年诺贝尔奖证实的真相)</p>
                        </div>
                        <i class="fa-solid fa-wand-magic-sparkles text-pink-500/50 text-3xl"></i>
                    </div>
                    <div class="mt-3 text-xs text-slate-300">粒子之间存在瞬间感应，被观测时才临时随机决定状态。</div>
                    <!-- 选中标识 -->
                    <div id="check-quantum" class="absolute top-3 right-3 text-pink-400 hidden"><i class="fa-solid fa-circle-check"></i></div>
                </button>
            </div>

            <!-- 可视化计分板 -->
            <div class="bg-black/50 rounded-2xl p-6 border border-slate-800 relative">
                
                <!-- 大分数展示 -->
                <div class="text-center mb-8 h-24 flex flex-col justify-center">
                    <p class="text-slate-500 text-sm font-bold tracking-widest uppercase mb-1">当前考试得分 |S|</p>
                    <div class="flex items-end justify-center space-x-2">
                        <span id="score-display" class="text-6xl font-black text-slate-600 font-mono">0.00</span>
                        <span class="text-lg text-slate-500 mb-1 font-mono">分</span>
                    </div>
                </div>

                <!-- 进度条刻度区域 -->
                <div class="relative w-full h-12">
                    
                    <!-- 进度条背景 -->
                    <div class="absolute top-4 left-0 w-full h-4 bg-slate-800 rounded-full overflow-hidden shadow-inner">
                        <!-- 动态填充条 -->
                        <div id="gauge-bar" class="h-full w-[0%] bg-slate-600 gauge-fill"></div>
                    </div>

                    <!-- 刻度 0 -->
                    <div class="absolute top-0 left-0 flex flex-col items-center -translate-x-1/2">
                        <div class="h-10 w-px bg-slate-600"></div>
                        <span class="text-[10px] text-slate-500 mt-1">0</span>
                    </div>

                    <!-- 刻度 1.0 -->
                    <div class="absolute top-0 left-[33.3%] flex flex-col items-center -translate-x-1/2">
                        <div class="h-10 w-px bg-slate-600"></div>
                        <span class="text-[10px] text-slate-500 mt-1">1.0</span>
                    </div>

                    <!-- 经典红线 (2.0) - 非常重要 -->
                    <div class="absolute top-0 left-[66.6%] flex flex-col items-center -translate-x-1/2 z-10">
                        <div class="h-12 w-0.5 bg-red-500 shadow-[0_0_8px_#ef4444]"></div>
                        <span class="text-[10px] text-red-400 font-bold mt-1 bg-slate-900 px-1 rounded">2.0 (极限红线)</span>
                    </div>

                    <!-- 量子极值 (2.83) -->
                    <div class="absolute top-0 left-[94.3%] flex flex-col items-center -translate-x-1/2 z-10">
                        <div class="h-10 w-px bg-pink-400/50 shadow-[0_0_8px_#ec4899]"></div>
                        <span class="text-[10px] text-pink-300 mt-1 font-bold">2.83 (量子极值)</span>
                    </div>

                    <!-- 刻度 3.0 (满格) -->
                    <div class="absolute top-0 left-[100%] flex flex-col items-center -translate-x-1/2">
                        <div class="h-10 w-px bg-slate-600"></div>
                        <span class="text-[10px] text-slate-500 mt-1">3.0</span>
                    </div>
                </div>

                <!-- 结论解说框 -->
                <div id="conclusion-box" class="mt-12 bg-slate-800/30 border border-slate-700/50 rounded-xl p-4 text-center min-h-[80px] flex items-center justify-center transition-all duration-300 opacity-0">
                    <p id="conclusion-text" class="text-sm text-slate-300"></p>
                </div>

            </div>

            <!-- 操作按钮 -->
            <div class="mt-8 flex justify-center">
                <button id="btn-run" onclick="runExperiment()" disabled class="bg-slate-700 text-slate-400 cursor-not-allowed font-bold py-4 px-12 rounded-full transition-all text-lg flex items-center shadow-lg">
                    <i class="fa-solid fa-play mr-2"></i> 请先选择上面的模式
                </button>
            </div>

        </div>
    </div>

    <script>
        let currentMode = null; // 'classic' or 'quantum'
        let isRunning = false;

        function setMode(mode) {
            if (isRunning) return;
            currentMode = mode;

            const btnClassic = document.getElementById('btn-classic');
            const btnQuantum = document.getElementById('btn-quantum');
            const checkClassic = document.getElementById('check-classic');
            const checkQuantum = document.getElementById('check-quantum');
            const btnRun = document.getElementById('btn-run');
            const scoreDisplay = document.getElementById('score-display');
            const gaugeBar = document.getElementById('gauge-bar');
            const conclusionBox = document.getElementById('conclusion-box');

            // Reset UI
            scoreDisplay.innerText = "0.00";
            scoreDisplay.className = "text-6xl font-black text-slate-600 font-mono";
            gaugeBar.style.width = "0%";
            gaugeBar.style.backgroundColor = "#475569"; // slate-600
            conclusionBox.style.opacity = "0";

            if (mode === 'classic') {
                // UI active state for classic
                btnClassic.classList.replace('border-amber-500/50', 'border-amber-500');
                btnClassic.classList.replace('bg-slate-800', 'bg-slate-800');
                checkClassic.classList.remove('hidden');
                
                // UI inactive state for quantum
                btnQuantum.classList.replace('border-pink-500', 'border-slate-700');
                btnQuantum.classList.replace('bg-slate-800', 'bg-slate-800');
                checkQuantum.classList.add('hidden');

                // Update run button
                btnRun.disabled = false;
                btnRun.className = "bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 px-12 rounded-full transition-all text-lg flex items-center shadow-[0_0_15px_rgba(245,158,11,0.4)] active:scale-95";
                btnRun.innerHTML = `<i class="fa-solid fa-dice mr-2"></i> 开始给“背剧本双胞胎”打分`;

            } else {
                // UI active state for quantum
                btnQuantum.classList.replace('border-slate-700', 'border-pink-500');
                btnQuantum.classList.replace('bg-slate-800', 'bg-slate-800');
                checkQuantum.classList.remove('hidden');
                
                // UI inactive state for classic
                btnClassic.classList.replace('border-amber-500', 'border-amber-500/50');
                btnClassic.classList.replace('bg-slate-800', 'bg-slate-800');
                checkClassic.classList.add('hidden');

                // Update run button
                btnRun.disabled = false;
                btnRun.className = "bg-pink-600 hover:bg-pink-500 text-white font-bold py-4 px-12 rounded-full transition-all text-lg flex items-center shadow-[0_0_15px_rgba(236,72,153,0.4)] active:scale-95";
                btnRun.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 开始给“魔法双胞胎”打分`;
            }
        }

        function runExperiment() {
            if (!currentMode || isRunning) return;
            isRunning = true;

            const scoreDisplay = document.getElementById('score-display');
            const gaugeBar = document.getElementById('gauge-bar');
            const conclusionBox = document.getElementById('conclusion-box');
            const conclusionText = document.getElementById('conclusion-text');
            const btnRun = document.getElementById('btn-run');

            // Disabled button while running
            const originalBtnClass = btnRun.className;
            const originalBtnHtml = btnRun.innerHTML;
            btnRun.className = "bg-slate-700 text-slate-400 cursor-not-allowed font-bold py-4 px-12 rounded-full transition-all text-lg flex items-center shadow-lg";
            btnRun.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> 正在进行 10,000 次测量...`;
            
            // Hide previous conclusion
            conclusionBox.style.opacity = "0";
            
            // Quick random number effect
            let ticks = 0;
            const scrambleInterval = setInterval(() => {
                const randomScore = (Math.random() * 3).toFixed(2);
                scoreDisplay.innerText = randomScore;
                scoreDisplay.className = "text-6xl font-black text-slate-500 font-mono";
                ticks++;
                if (ticks > 15) {
                    clearInterval(scrambleInterval);
                    finalizeExperiment(originalBtnClass, originalBtnHtml);
                }
            }, 50);
        }

        function finalizeExperiment(originalBtnClass, originalBtnHtml) {
            const scoreDisplay = document.getElementById('score-display');
            const gaugeBar = document.getElementById('gauge-bar');
            const conclusionBox = document.getElementById('conclusion-box');
            const conclusionText = document.getElementById('conclusion-text');
            const btnRun = document.getElementById('btn-run');

            let finalScore;
            let percent;

            if (currentMode === 'classic') {
                // Classic limits to 2.0. We simulate a score just slightly under 2 for realism.
                // 1.85 ~ 1.98
                finalScore = (1.85 + Math.random() * 0.13).toFixed(2);
                percent = (finalScore / 3.0) * 100;
                
                scoreDisplay.innerText = finalScore;
                scoreDisplay.className = "text-6xl font-black text-amber-400 font-mono score-pop";
                
                gaugeBar.style.width = `${percent}%`;
                gaugeBar.style.backgroundColor = "#fbbf24"; // amber-400

                conclusionText.innerHTML = `
                    <div class="font-bold text-amber-400 text-base mb-1">❌ 挑战失败！得分被死死卡在 2.0 红线以内！</div>
                    宝你看！这组双胞胎无论出门前把剧本背得多熟练，由于随机抽查，他们绝对不可能做到完美蒙混过关。分数永远无法突破 2.0！这证明了：<b>纯靠物理常识是做不到神同步的。</b>
                `;

            } else {
                // Quantum exceeds 2.0, close to 2.828. We simulate 2.75 ~ 2.85
                finalScore = (2.75 + Math.random() * 0.1).toFixed(2);
                percent = (finalScore / 3.0) * 100;

                scoreDisplay.innerText = finalScore;
                scoreDisplay.className = "text-6xl font-black text-pink-400 font-mono score-pop glow-text";
                
                gaugeBar.style.width = `${percent}%`;
                gaugeBar.style.backgroundColor = "#ec4899"; // pink-500

                conclusionText.innerHTML = `
                    <div class="font-bold text-pink-400 text-base mb-1">🎉 见证奇迹！突破爱因斯坦的红线！</div>
                    宝，快看！分数不可思议地飙到了 <b>${finalScore}</b>！完全粉碎了2.0的极限！

                    这就意味着，他们根本没有提前背剧本！而是像有魔法一样在两地“瞬间感应”对方的答卷！

                    <span class="text-xs text-pink-300 mt-1 block">（当年做这个实验的三位爷爷，就是因为测出了这个结果，抱走了诺贝尔奖哦！）</span>
                `;
            }

            conclusionBox.style.opacity = "1";

            // Restore button
            btnRun.className = originalBtnClass;
            btnRun.innerHTML = originalBtnHtml;
            isRunning = false;
        }
    </script>
</body>
</html>
