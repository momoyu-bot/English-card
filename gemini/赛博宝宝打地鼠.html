<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 赛博宝宝打地鼠 | 赛博缝纫机</title>
<meta name="description" content="宝宝专属打地鼠。敲下去，还能换个游戏。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }
        
        .cyber-bg {
            background: linear-gradient(180deg, #1a0033 0%, #2a0055 100%);
        }
        
        .neon-pink {
            text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff69b4;
        }
        
        .hole {
            width: 92px;
            height: 92px;
            background: radial-gradient(circle at 40% 30%, #4a2c6a 0%, #2a1a44 70%, #1a0033 100%);
            border-radius: 9999px;
            border: 6px solid #6b21a8;
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.6),
                        0 0 15px rgba(167, 139, 250, 0.5);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        
        .hole:active {
            transform: scale(0.92);
        }
        
        .mole {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 68px;
            transition: bottom 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            user-select: none;
            pointer-events: none;
        }
        
        .mole.show {
            bottom: 12px;
        }
        
        .mole.hit {
            animation: hitAnim 0.3s ease forwards;
        }
        
        @keyframes hitAnim {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            30% { transform: translateX(-50%) scale(0.6) rotate(-15deg); }
            100% { transform: translateX(-50%) scale(0) rotate(30deg); }
        }
        
        .sparkle {
            position: absolute;
            font-size: 18px;
            animation: sparklePop 0.6s ease forwards;
            pointer-events: none;
            z-index: 20;
        }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            justify-content: center;
        }
        
        .score-float {
            position: absolute;
            font-weight: 900;
            font-size: 22px;
            color: #fef08c;
            text-shadow: 0 0 10px #fef08c;
            animation: scoreFloat 0.8s ease forwards;
            pointer-events: none;
            z-index: 30;
        }
        
        .neon-button {
            background: linear-gradient(90deg, #ff69b4, #c0267a);
            box-shadow: 0 0 20px #ff69b4;
            transition: all 0.2s ease;
        }
        
        .neon-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #ff69b4;
        }
        
        .cyber-grid-bg {
            background-image: 
                linear-gradient(rgba(167,139,250,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(167,139,250,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .timer-bar {
            height: 8px;
            background: linear-gradient(90deg, #a78bfa, #f472b6);
            transition: width 0.1s linear;
            box-shadow: 0 0 12px #c0267a;
        }
    </style>
</head>
<body class="cyber-bg text-white min-h-screen overflow-hidden">
    <!-- 顶部 -->
    <div class="max-w-md mx-auto pt-6 px-5">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-x-3">
                <div class="w-11 h-11 bg-gradient-to-br from-pink-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-[0_0_20px_#ff69b4]">
                    <i class="fa-solid fa-hammer text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black neon-pink tracking-tighter">赛博打地鼠</h1>
                    <p class="text-xs text-purple-300 -mt-1">宝宝专属版</p>
                </div>
            </div>
            
            <div class="text-right">
                <div class="text-xs text-purple-400">最高分</div>
                <div id="high-score" class="font-black text-2xl text-yellow-300">0</div>
            </div>
        </div>
        
        <!-- 状态栏 -->
        <div class="flex items-center justify-between bg-white/10 backdrop-blur rounded-2xl px-5 py-3 mb-4">
            <div class="flex items-center gap-x-2">
                <div class="text-pink-400">
                    <i class="fa-solid fa-heart fa-beat"></i>
                </div>
                <div>
                    <span class="text-sm text-purple-300">得分</span>
                    <span id="score" class="font-black text-4xl ml-1 text-white">0</span>
                </div>
            </div>
            
            <div class="text-right">
                <div class="flex items-center gap-x-1.5 justify-end">
                    <span class="text-sm text-purple-300">时间</span>
                    <span id="timer" class="font-mono font-black text-3xl text-emerald-400">60</span>
                </div>
                <div class="w-20 h-2 bg-white/20 rounded-full overflow-hidden mt-1">
                    <div id="timer-bar" class="timer-bar w-full rounded-full" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 游戏区 -->
    <div class="max-w-md mx-auto px-5">
        <div id="game-board" class="game-grid bg-[#2a1a44]/80 p-6 rounded-3xl border border-purple-500/40 shadow-2xl mb-6">
            <!-- 9个洞 -->
        </div>
        
        <!-- 控制区 -->
        <div class="flex gap-3">
            <button id="start-btn"
                    class="neon-button flex-1 py-4 rounded-3xl font-black text-xl flex items-center justify-center gap-x-3 active:scale-[0.985]">
                <i class="fa-solid fa-play mr-1"></i>
                <span id="start-text">开始游戏</span>
            </button>
            
            <button onclick="showRules()"
                    class="px-6 py-4 rounded-3xl border border-purple-400/60 text-purple-300 hover:bg-white/10 transition-colors">
                <i class="fa-solid fa-question-circle text-xl"></i>
            </button>
        </div>
        
        <div class="text-center mt-4">
            <div id="combo-display" class="hidden text-emerald-400 font-bold text-sm tracking-widest">
                <span id="combo-text">COMBO x1</span>
            </div>
        </div>
    </div>
    
    <!-- 结束弹窗 -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-[#2a1a44] border border-purple-500 rounded-3xl p-8 max-w-xs w-full mx-4 text-center">
            <div class="text-6xl mb-3" id="end-emoji">🎉</div>
            
            <div class="text-3xl font-black mb-1" id="end-title">太棒了宝宝！</div>
            <div class="text-purple-300 mb-4" id="end-subtitle">你敲出了惊人成绩！</div>
            
            <div class="bg-white/10 rounded-2xl py-4 mb-6">
                <div class="text-xs text-purple-400">最终得分</div>
                <div id="final-score" class="text-6xl font-black text-yellow-300">248</div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="restartGame()" 
                        class="flex-1 neon-button py-3.5 rounded-2xl font-bold text-lg">
                    再玩一次
                </button>
                <button onclick="goToOtherGame()" 
                        class="flex-1 py-3.5 rounded-2xl font-bold text-lg border border-purple-400/70 text-purple-300">
                    换个游戏
                </button>
            </div>
            
            <div class="mt-5 text-xs text-purple-400">点击「换个游戏」可以去玩猜数字或接爱心哦～</div>
        </div>
    </div>
    
    <script>
        // Tailwind
        function initTailwind() {
            // already using CDN
        }
        
        // 游戏变量
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let gameRunning = false;
        let holes = [];
        let activeMoles = new Set();
        let combo = 0;
        let lastWhackTime = 0;
        let highScore = 0;
        
        // 创建9个洞
        function createHoles() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            holes = [];
            
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole mx-auto relative';
                hole.dataset.index = i;
                
                // 洞底装饰
                const dirt = document.createElement('div');
                dirt.className = 'absolute bottom-0 left-1/2 -translate-x-1/2 w-11 h-3 bg-[#1a0033] rounded-full';
                hole.appendChild(dirt);
                
                // 地鼠
                const mole = document.createElement('div');
                mole.className = 'mole flex items-center justify-center';
                mole.innerHTML = `
                    <div class="relative w-16 h-16 flex items-center justify-center">
                        <!-- 地鼠身体 -->
                        <div class="w-14 h-14 bg-gradient-to-br from-pink-400 to-rose-500 rounded-full shadow-[0_4px_0_#9f1239,inset_0_3px_8px_rgba(255,255,255,0.5)] flex items-center justify-center">
                            <!-- 脸 -->
                            <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center relative">
                                <!-- 眼睛 -->
                                <div class="absolute top-2 left-1.5 w-2 h-2 bg-[#1a0033] rounded-full"></div>
                                <div class="absolute top-2 right-1.5 w-2 h-2 bg-[#1a0033] rounded-full"></div>
                                <!-- 鼻子 -->
                                <div class="absolute top-5 w-1.5 h-1.5 bg-pink-500 rounded-full"></div>
                            </div>
                        </div>
                        
                        <!-- 爱心装饰 -->
                        <div class="absolute -top-1 text-xl">❤️</div>
                        
                        <!-- 小耳朵 -->
                        <div class="absolute -top-1 -left-1 w-4 h-4 bg-pink-400 rounded-full rotate-[-30deg]"></div>
                        <div class="absolute -top-1 -right-1 w-4 h-4 bg-pink-400 rounded-full rotate-[30deg]"></div>
                    </div>
                `;
                hole.appendChild(mole);
                
                // 点击事件
                hole.addEventListener('click', () => whackMole(i, hole, mole));
                
                board.appendChild(hole);
                holes.push({ hole, mole, index: i });
            }
        }
        
        // 敲地鼠
        function whackMole(index, holeEl, moleEl) {
            if (!gameRunning || activeMoles.has(index)) return;
            
            const now = Date.now();
            const isCombo = now - lastWhackTime < 650;
            
            if (isCombo) {
                combo++;
            } else {
                combo = 1;
            }
            lastWhackTime = now;
            
            // 动画
            moleEl.classList.add('hit');
            
            // 加分
            const points = 10 + (combo - 1) * 5;
            score += points;
            updateScore();
            
            // 飘分
            showFloatingScore(holeEl, points, combo);
            
            // 特效
            createSparkles(holeEl);
            
            // 隐藏地鼠
            setTimeout(() => {
                moleEl.style.bottom = '-10px';
                moleEl.classList.remove('hit');
                activeMoles.delete(index);
            }, 280);
            
            // 连击显示
            showCombo();
            
            // 随机小概率出现金色地鼠（双倍分）
            if (Math.random() < 0.08) {
                setTimeout(() => {
                    if (gameRunning && !activeMoles.has(index)) {
                        spawnGoldenMole(index, holeEl, moleEl);
                    }
                }, 420);
            }
        }
        
        function showFloatingScore(holeEl, points, comboCount) {
            const float = document.createElement('div');
            float.className = 'score-float';
            float.textContent = `+${points}${comboCount > 1 ? '!' : ''}`;
            float.style.left = '50%';
            float.style.top = '10px';
            float.style.transform = 'translateX(-50%)';
            
            holeEl.appendChild(float);
            
            setTimeout(() => {
                float.style.transition = 'all 0.5s ease';
                float.style.opacity = '0';
                float.style.transform = 'translateX(-50%) translateY(-30px)';
                
                setTimeout(() => float.remove(), 500);
            }, 300);
        }
        
        function createSparkles(holeEl) {
            const colors = ['#fef08c', '#f9a8d4', '#c4b5fd'];
            
            for (let i = 0; i < 6; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.textContent = ['✨', '💖', '🌟'][Math.floor(Math.random()*3)];
                s.style.left = (Math.random() * 70 + 12) + 'px';
                s.style.top = (Math.random() * 40 + 15) + 'px';
                s.style.color = colors[Math.floor(Math.random()*3)];
                holeEl.appendChild(s);
                
                setTimeout(() => s.remove(), 650);
            }
        }
        
        // 生成金色地鼠（双倍分）
        function spawnGoldenMole(index, holeEl, moleEl) {
            if (!gameRunning) return;
            
            activeMoles.add(index);
            
            // 变成金色
            const originalHTML = moleEl.innerHTML;
            moleEl.innerHTML = `
                <div class="relative w-16 h-16 flex items-center justify-center">
                    <div class="w-14 h-14 bg-gradient-to-br from-yellow-300 to-amber-400 rounded-full shadow-[0_4px_0_#854d0e,inset_0_3px_8px_rgba(255,255,255,0.7)] flex items-center justify-center animate-pulse">
                        <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center relative">
                            <div class="absolute top-2 left-1.5 w-2 h-2 bg-[#854d0e] rounded-full"></div>
                            <div class="absolute top-2 right-1.5 w-2 h-2 bg-[#854d0e] rounded-full"></div>
                            <div class="absolute top-5 w-2 h-2 bg-yellow-500 rounded-full"></div>
                        </div>
                    </div>
                    <div class="absolute -top-1 text-2xl">👑</div>
                </div>
            `;
            
            // 弹出
            moleEl.style.transition = 'bottom 0.08s ease-out';
            moleEl.style.bottom = '12px';
            
            // 自动收回（更快）
            setTimeout(() => {
                if (activeMoles.has(index) && gameRunning) {
                    moleEl.style.bottom = '-10px';
                    moleEl.innerHTML = originalHTML;
                    activeMoles.delete(index);
                }
            }, 680);
            
            // 点击金色地鼠
            const clickHandler = () => {
                if (!activeMoles.has(index)) return;
                
                moleEl.classList.add('hit');
                const bonus = 30 + combo * 8;
                score += bonus;
                updateScore();
                
                showFloatingScore(holeEl, bonus, combo + 1);
                createSparkles(holeEl);
                
                setTimeout(() => {
                    moleEl.style.bottom = '-10px';
                    moleEl.innerHTML = originalHTML;
                    moleEl.classList.remove('hit');
                    activeMoles.delete(index);
                }, 260);
                
                holeEl.removeEventListener('click', clickHandler);
            };
            
            // 临时绑定
            holeEl.addEventListener('click', clickHandler, { once: true });
        }
        
        // 随机生成地鼠
        function spawnMole() {
            if (!gameRunning) return;
            
            // 找一个空洞
            let available = [];
            for (let i = 0; i < 9; i++) {
                if (!activeMoles.has(i)) available.push(i);
            }
            
            if (available.length === 0) return;
            
            const index = available[Math.floor(Math.random() * available.length)];
            const { hole, mole } = holes[index];
            
            activeMoles.add(index);
            
            // 弹出动画
            mole.style.transition = 'bottom 0.12s cubic-bezier(0.34,1.56,0.64,1)';
            mole.style.bottom = '12px';
            
            // 随机停留时间
            const stayTime = 680 + Math.random() * 520;
            
            setTimeout(() => {
                if (activeMoles.has(index) && gameRunning) {
                    // 收回
                    mole.style.transition = 'bottom 0.18s ease-in';
                    mole.style.bottom = '-10px';
                    
                    setTimeout(() => {
                        activeMoles.delete(index);
                    }, 180);
                }
            }, stayTime);
        }
        
        // 更新分数
        function updateScore() {
            document.getElementById('score').textContent = score;
            
            // 实时更新最高分
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').textContent = highScore;
            }
        }
        
        // 显示连击
        function showCombo() {
            const comboEl = document.getElementById('combo-display');
            const textEl = document.getElementById('combo-text');
            
            if (combo >= 2) {
                textEl.textContent = `COMBO x${combo}`;
                comboEl.style.display = 'block';
                comboEl.classList.remove('hidden');
                
                if (combo >= 5) {
                    comboEl.style.color = '#f472b6';
                    textEl.textContent = `🔥 COMBO x${combo} 🔥`;
                }
                
                setTimeout(() => {
                    if (comboEl.style.display !== 'none') {
                        comboEl.style.transition = 'opacity 0.4s';
                        comboEl.style.opacity = '0';
                        
                        setTimeout(() => {
                            comboEl.style.display = 'none';
                            comboEl.style.opacity = '1';
                            comboEl.style.transition = '';
                            comboEl.style.color = '#10b981';
                            textEl.textContent = `COMBO x1`;
                        }, 300);
                    }
                }, 1100);
            }
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            // 重置
            score = 0;
            timeLeft = 60;
            combo = 0;
            activeMoles.clear();
            
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('combo-display').style.display = 'none';
            
            gameRunning = true;
            
            // 改变按钮
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> <span>暂停</span>`;
            btn.onclick = pauseGame;
            
            // 启动计时器
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('timer-bar').style.width = `${(timeLeft / 60) * 100}%`;
                
                if (timeLeft <= 10) {
                    document.getElementById('timer').classList.add('text-red-400');
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            
            // 每420ms生成一只地鼠
            const spawnInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(spawnInterval);
                    return;
                }
                spawnMole();
                
                // 后期加速
                if (timeLeft < 25 && Math.random() < 0.5) {
                    setTimeout(() => {
                        if (gameRunning) spawnMole();
                    }, 180);
                }
            }, 420);
            
            // 初始生成几只
            setTimeout(() => { if (gameRunning) spawnMole(); }, 180);
            setTimeout(() => { if (gameRunning) spawnMole(); }, 520);
        }
        
        function pauseGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> <span>继续</span>`;
            btn.onclick = resumeGame;
        }
        
        function resumeGame() {
            if (timeLeft <= 0) return;
            
            gameRunning = true;
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> <span>暂停</span>`;
            btn.onclick = pauseGame;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('timer-bar').style.width = `${(timeLeft / 60) * 100}%`;
                
                if (timeLeft <= 10) {
                    document.getElementById('timer').classList.add('text-red-400');
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            
            // 继续生成
            const spawnInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(spawnInterval);
                    return;
                }
                spawnMole();
            }, 420);
        }
        
        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            
            // 收回所有地鼠
            holes.forEach(({ mole }, i) => {
                mole.style.transition = 'bottom 0.2s ease-in';
                mole.style.bottom = '-10px';
            });
            activeMoles.clear();
            
            // 显示结束弹窗
            const modal = document.getElementById('game-over-modal');
            document.getElementById('final-score').textContent = score;
            
            let title = '太棒了宝宝！';
            let subtitle = '你敲出了惊人成绩！';
            let emoji = '🎉';
            
            if (score >= 280) {
                title = '无敌宝宝！';
                subtitle = '你是打地鼠之王！👑';
                emoji = '🏆';
            } else if (score >= 180) {
                title = '超级厉害！';
                subtitle = '宝宝你太会玩了～';
                emoji = '🌟';
            } else if (score >= 100) {
                title = '不错哦宝宝！';
                subtitle = '继续加油～';
            }
            
            document.getElementById('end-emoji').textContent = emoji;
            document.getElementById('end-title').textContent = title;
            document.getElementById('end-subtitle').textContent = subtitle;
            
            modal.style.display = 'flex';
            
            // 重置按钮文字
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-redo mr-2"></i> <span>再来一局</span>`;
            btn.onclick = restartGame;
        }
        
        function restartGame() {
            document.getElementById('game-over-modal').style.display = 'none';
            
            // 重置UI
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('timer').classList.remove('text-red-400');
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('combo-display').style.display = 'none';
            
            // 收回所有地鼠
            holes.forEach(({ mole }) => {
                mole.style.bottom = '-10px';
            });
            
            // 自动开始新局
            setTimeout(() => {
                startGame();
            }, 280);
        }
        
        function showRules() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="bg-[#2a1a44] border border-purple-500 rounded-3xl p-7 max-w-xs w-full mx-4">
                    <div class="text-center mb-5">
                        <div class="text-5xl mb-2">📖</div>
                        <div class="text-2xl font-black">游戏规则</div>
                    </div>
                    
                    <div class="space-y-3 text-sm text-purple-200">
                        <div class="flex gap-3">
                            <div class="w-6 text-center">❤️</div>
                            <div>普通地鼠 = <span class="font-bold text-white">10分</span></div>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-6 text-center">👑</div>
                            <div>金色地鼠 = <span class="font-bold text-white">30分+</span>（双倍奖励）</div>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-6 text-center">🔥</div>
                            <div>连续敲击 = <span class="font-bold text-emerald-400">连击加成</span></div>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-6 text-center">⏱️</div>
                            <div>60秒内敲越多越好！</div>
                        </div>
                    </div>
                    
                    <button onclick="this.closest('.fixed').remove()" 
                            class="mt-6 w-full py-3 rounded-2xl border border-purple-400 text-purple-300 font-bold">
                        知道了！
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function goToOtherGame() {
            // 跳转提示
            const modal = document.getElementById('game-over-modal');
            modal.style.display = 'none';
            
            const tip = document.createElement('div');
            tip.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur px-6 py-3 rounded-2xl text-sm flex items-center gap-x-2 z-50';
            tip.innerHTML = `💖 去玩其他游戏请回到聊天框回复我哦～`;
            document.body.appendChild(tip);
            
            setTimeout(() => {
                tip.style.transition = 'all 0.4s';
                tip.style.opacity = '0';
                setTimeout(() => tip.remove(), 300);
            }, 1600);
        }
        
        // 初始化
        function initGame() {
            initTailwind();
            createHoles();
            
            // 初始最高分
            document.getElementById('high-score').textContent = highScore;
            
            // 开始按钮
            document.getElementById('start-btn').onclick = startGame;
            
            // 欢迎动画
            setTimeout(() => {
                const board = document.getElementById('game-board');
                board.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
                board.style.transform = 'scale(0.96)';
                
                setTimeout(() => {
                    board.style.transform = 'scale(1)';
                }, 180);
            }, 600);
            
            // 小贴士
            setTimeout(() => {
                const tip = document.createElement('div');
                tip.className = 'text-center text-xs text-purple-400/70 mt-1';
                tip.textContent = '💡 连击越快得分越高哦～';
                document.querySelector('.max-w-md').appendChild(tip);
                
                setTimeout(() => tip.remove(), 3800);
            }, 4200);
            
            console.log('%c[赛博缝纫机] 宝宝打地鼠已准备就绪 ❤️', 'color:#f472b6');
        }
        
        window.onload = initGame;
    </script>
</body>
</html>
