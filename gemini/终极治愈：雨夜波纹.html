<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终极治愈：雨夜波纹</title>
<meta name="description" content="点开雨声和波纹。跟着光晕呼吸，轻触屏幕会泛开。">
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background-color: #020617; overflow: hidden; touch-action: none; margin: 0; font-family: "PingFang SC", sans-serif; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* 柔和呼吸月亮 */
    .moon-core {
        box-shadow: 0 0 40px rgba(186, 230, 253, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.8);
        animation: moonBreath 8s infinite ease-in-out;
    }
    .moon-halo {
        animation: haloBreath 8s infinite ease-in-out;
    }
    
    @keyframes moonBreath {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes haloBreath {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(1.5); opacity: 0.5; }
    }

    .fade-transition { transition: opacity 1.5s ease-in-out; }
    
    /* 自定义美化开关 */
    .toggle-checkbox:checked { right: 0; border-color: #38bdf8; }
    .toggle-checkbox:checked + .toggle-label { background-color: #0284c7; }
</style>
</head>
<body class="flex flex-col items-center justify-center h-screen relative text-sky-100 select-none">

    <!-- 画布：用于波纹和背景绘制 -->
    <canvas id="canvas"></canvas>

    <!-- 交互UI层 -->
    <div id="ui-layer" class="z-10 flex flex-col items-center justify-center w-full h-full fade-transition">
        
        <!-- 呼吸月亮 -->
        <div class="relative w-32 h-32 flex items-center justify-center mb-12 cursor-pointer" id="start-btn">
            <div class="moon-halo absolute w-full h-full bg-sky-400 rounded-full blur-2xl"></div>
            <div class="moon-core absolute w-20 h-20 bg-sky-50 rounded-full"></div>
            <div class="absolute text-sky-900/40 text-sm tracking-widest pointer-events-none">点击开启</div>
        </div>

        <div class="text-center fade-transition opacity-0" id="guide-text">
            <div class="text-xl tracking-[0.5em] font-light mb-2" id="breath-instruction">跟着光晕深呼吸</div>
            <div class="text-xs text-sky-200/50 tracking-widest mt-6">轻触屏幕，泛起波纹</div>
        </div>

        <!-- 音频控制 -->
        <div class="absolute bottom-12 flex gap-8 fade-transition opacity-0" id="controls">
            <!-- 雨声开关 -->
            <div class="flex flex-col items-center gap-2">
                <span class="text-xs text-sky-200/60">淅沥雨声</span>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="rain-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-slate-700 appearance-none cursor-pointer z-10 top-0 left-0 transition-all duration-300" checked/>
                    <label for="rain-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer transition-all duration-300"></label>
                </div>
            </div>
            <!-- 空灵音开关 -->
            <div class="flex flex-col items-center gap-2">
                <span class="text-xs text-sky-200/60">空灵波纹</span>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="tone-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-slate-700 appearance-none cursor-pointer z-10 top-0 left-0 transition-all duration-300" checked/>
                    <label for="tone-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer transition-all duration-300"></label>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- 视觉动画逻辑 ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let ripples = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = Math.max(width, height) * 1.2;
            this.speed = 1.5;
            this.alpha = 0.5;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(125, 211, 252, ${this.alpha})`;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha * 0.03})`;
            ctx.fill();
        }
        update() {
            this.radius += this.speed;
            this.speed *= 1.02;
            this.alpha = Math.max(0, 0.5 - (this.radius / this.maxRadius));
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.1)';
        ctx.fillRect(0, 0, width, height);

        for (let i = ripples.length - 1; i >= 0; i--) {
            ripples[i].update();
            ripples[i].draw();
            if (ripples[i].alpha <= 0) ripples.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }
    animate();

    // --- 音频合成逻辑 (Web Audio API) ---
    let audioCtx;
    let rainGainNode;
    let isPlaying = false;
    
    const startBtn = document.getElementById('start-btn');
    const guideText = document.getElementById('guide-text');
    const controls = document.getElementById('controls');
    const rainToggle = document.getElementById('rain-toggle');
    const toneToggle = document.getElementById('tone-toggle');

    // 纯代码生成下雨白噪音
    function createRainNoise() {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1; // 生成白噪音
        }
        
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        noiseSource.loop = true;

        // 使用低通滤波器把刺耳的白噪音过滤成闷闷的雨声
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 350; 

        rainGainNode = audioCtx.createGain();
        rainGainNode.gain.value = 0; // 初始静音

        noiseSource.connect(filter);
        filter.connect(rainGainNode);
        rainGainNode.connect(audioCtx.destination);
        noiseSource.start();
    }

    // 生成空灵正弦波
    function playSoftTone() {
        if (!audioCtx || !toneToggle.checked) return;
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        osc.type = 'sine';
        filter.type = 'lowpass';
        filter.frequency.value = 600;

        // C大调/A小调的安抚音符
        const notes = [196.00, 261.63, 329.63, 392.00]; 
        osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)] * 0.5, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.5);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);

        osc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 4);
    }

    // 启动系统
    startBtn.addEventListener('click', (e) => {
        if (isPlaying) {
            // 如果已经启动，点击中心月亮也会产生波纹
            triggerRipple(e);
            return;
        }
        
        isPlaying = true;
        
        // 隐藏初始提示文字，显示控制栏
        startBtn.querySelector('.text-sky-900\\/40').style.opacity = 0;
        guideText.style.opacity = 1;
        controls.style.opacity = 1;

        // 初始化音频
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            createRainNoise();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // 雨声淡入
        if (rainToggle.checked) {
            rainGainNode.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 3);
        }

        // 呼吸文字循环 (8秒周期：4秒吸，4秒呼)
        const instruction = document.getElementById('breath-instruction');
        setInterval(() => {
            instruction.style.opacity = 0;
            setTimeout(() => {
                instruction.innerText = instruction.innerText.includes('吸气') ? '慢慢呼气...' : '深深吸气...';
                instruction.style.opacity = 1;
            }, 1000);
        }, 4000);
        
        // 第一次启动产生一个波纹
        triggerRipple(e);
    });

    // 交互触发波纹与声音
    function triggerRipple(e) {
        if (!isPlaying) return;
        
        // 排除点击底部开关的情况
        if (e.target.closest('#controls')) return;

        let x = e.clientX || (e.touches && e.touches[0].clientX) || width/2;
        let y = e.clientY || (e.touches && e.touches[0].clientY) || height/2;
        
        ripples.push(new Ripple(x, y));
        playSoftTone();
    }

    window.addEventListener('mousedown', triggerRipple);
    window.addEventListener('touchstart', triggerRipple);

    // 雨声开关控制
    rainToggle.addEventListener('change', (e) => {
        if (!audioCtx) return;
        const targetGain = e.target.checked ? 0.6 : 0;
        rainGainNode.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 1);
    });

</script>
</body>
</html>
