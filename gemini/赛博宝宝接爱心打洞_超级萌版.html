<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 赛博宝宝接爱心打洞 | 超级萌版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }
        
        .kawaii-bg {
            background: linear-gradient(180deg, #fff0f8 0%, #f0e4ff 100%);
        }
        
        .cute-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff69b4, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 8px rgba(255,105,180,0.3);
        }
        
        .hole {
            width: 86px;
            height: 86px;
            background: #fff;
            border: 5px solid #f9a8d4;
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(249, 168, 212, 0.4),
                        inset 0 3px 8px rgba(255,255,255,0.9);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        
        .hole:active {
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(249, 168, 212, 0.6);
        }
        
        .cute-item {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            transition: bottom 0.13s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            filter: drop-shadow(0 3px 6px rgba(236, 72, 153, 0.3));
        }
        
        .cute-item.show {
            bottom: 11px;
        }
        
        .cute-item.caught {
            animation: cutePop 0.4s ease forwards;
        }
        
        @keyframes cutePop {
            0% { transform: translateX(-50%) scale(1); }
            35% { transform: translateX(-50%) scale(1.5); }
            100% { transform: translateX(-50%) scale(0) translateY(-35px); }
        }
        
        .mini-sparkle {
            position: absolute;
            font-size: 14px;
            animation: miniSparkle 0.55s ease forwards;
            pointer-events: none;
            z-index: 20;
        }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            padding: 18px;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.15);
        }
        
        .score-float {
            position: absolute;
            font-weight: 900;
            font-size: 20px;
            color: #f472b6;
            animation: scoreFloat 0.7s ease forwards;
            pointer-events: none;
            z-index: 30;
            text-shadow: 0 2px 4px rgba(244, 114, 182, 0.4);
        }
        
        .neon-button {
            background: linear-gradient(90deg, #f472b6, #c084fc);
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.5);
            transition: all 0.2s ease;
            color: white;
            font-weight: 700;
        }
        
        .neon-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.6);
        }
        
        .timer-bar {
            height: 7px;
            background: linear-gradient(90deg, #f472b6, #c084fc);
            border-radius: 9999px;
            transition: width 0.1s linear;
        }
        
        .kawaii-shadow {
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.2);
        }
    </style>
</head>
<body class="kawaii-bg text-[#4c1d95] min-h-screen overflow-hidden">
    <!-- 顶部 -->
    <div class="max-w-md mx-auto pt-5 px-5">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-x-2.5">
                <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center shadow-[0_4px_15px_rgba(244,114,182,0.4)] border border-pink-200">
                    <span class="text-3xl">💗</span>
                </div>
                <div>
                    <h1 class="cute-title leading-none">赛博接爱心打洞</h1>
                    <p class="text-[10px] text-pink-400 -mt-0.5">宝宝专属超萌版 💕</p>
                </div>
            </div>
            
            <div class="text-right">
                <div class="text-[10px] text-purple-400">最高分</div>
                <div id="high-score" class="font-black text-2xl text-pink-500">0</div>
            </div>
        </div>
        
        <!-- 状态栏 -->
        <div class="flex items-center justify-between bg-white/90 backdrop-blur rounded-3xl px-4 py-2.5 mb-4 shadow-inner kawaii-shadow">
            <div class="flex items-center gap-x-2">
                <div class="text-pink-400 text-xl">💖</div>
                <div>
                    <span class="text-xs text-purple-400">得分</span>
                    <span id="score" class="font-black text-4xl ml-1 text-[#4c1d95]">0</span>
                </div>
            </div>
            
            <div class="text-right">
                <div class="flex items-center gap-x-1 justify-end">
                    <span class="text-xs text-purple-400">时间</span>
                    <span id="timer" class="font-mono font-black text-3xl text-emerald-500">60</span>
                </div>
                <div class="w-16 h-1.5 bg-purple-100 rounded-full overflow-hidden mt-1">
                    <div id="timer-bar" class="timer-bar h-full rounded-full" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 游戏区 -->
    <div class="max-w-md mx-auto px-5">
        <div id="game-board" class="game-grid mx-auto kawaii-shadow">
            <!-- 9个洞 -->
        </div>
        
        <!-- 控制区 -->
        <div class="flex gap-3 mt-5">
            <button id="start-btn"
                    class="neon-button flex-1 py-3.5 rounded-3xl text-lg flex items-center justify-center gap-x-2 active:scale-[0.985]">
                <i class="fa-solid fa-play mr-1"></i>
                <span id="start-text">开始游戏</span>
            </button>
            
            <button onclick="showRules()"
                    class="px-5 py-3.5 rounded-3xl border border-pink-200 text-pink-400 hover:bg-white/70 transition-colors text-lg">
                <i class="fa-solid fa-question-circle"></i>
            </button>
        </div>
        
        <div class="text-center mt-3">
            <div id="combo-display" class="hidden text-pink-500 font-bold text-xs tracking-widest">
                <span id="combo-text">连击 x1 ✨</span>
            </div>
        </div>
    </div>
    
    <!-- 结束弹窗 -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-white border border-pink-200 rounded-3xl p-7 max-w-[280px] w-full mx-4 text-center kawaii-shadow">
            <div class="text-6xl mb-2" id="end-emoji">🎀</div>
            
            <div class="text-2xl font-black text-[#4c1d95] mb-0.5" id="end-title">太棒了宝宝！</div>
            <div class="text-sm text-purple-400 mb-4" id="end-subtitle">你接住了好多可爱爱心～</div>
            
            <div class="bg-gradient-to-r from-pink-50 to-purple-50 rounded-2xl py-3 mb-5">
                <div class="text-xs text-purple-400">最终得分</div>
                <div id="final-score" class="text-5xl font-black text-pink-500">248</div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="restartGame()" 
                        class="flex-1 bg-gradient-to-r from-pink-400 to-purple-400 text-white py-3 rounded-2xl font-bold text-base">
                    再玩一次
                </button>
                <button onclick="goToOtherGame()" 
                        class="flex-1 py-3 rounded-2xl font-bold text-base border border-pink-200 text-purple-400">
                    换个游戏
                </button>
            </div>
            
            <div class="mt-4 text-[10px] text-purple-300">宝宝你最可爱了 💕</div>
        </div>
    </div>
    
    <script>
        function initTailwind() {}
        
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let gameRunning = false;
        let holes = [];
        let activeItems = new Set();
        let combo = 0;
        let lastCatchTime = 0;
        let highScore = 0;
        
        const cuteItems = ['💗', '🍓', '🍬', '🌸', '💎', '🦄', '🍭', '🌷', '💕'];
        
        function createHoles() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            holes = [];
            
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole mx-auto relative flex items-center justify-center';
                hole.dataset.index = i;
                
                const item = document.createElement('div');
                item.className = 'cute-item';
                item.innerHTML = '💗';
                hole.appendChild(item);
                
                hole.addEventListener('click', () => catchItem(i, hole, item));
                
                board.appendChild(hole);
                holes.push({ hole, item, index: i });
            }
        }
        
        function catchItem(index, holeEl, itemEl) {
            if (!gameRunning || activeItems.has(index)) return;
            
            const now = Date.now();
            const isCombo = now - lastCatchTime < 620;
            
            if (isCombo) combo++;
            else combo = 1;
            lastCatchTime = now;
            
            itemEl.classList.add('caught');
            
            const points = 10 + (combo - 1) * 5;
            score += points;
            updateScore();
            
            showFloatingScore(holeEl, points, combo);
            createSparkles(holeEl);
            
            setTimeout(() => {
                itemEl.style.bottom = '-8px';
                itemEl.classList.remove('caught');
                activeItems.delete(index);
                if (Math.random() < 0.65) {
                    itemEl.innerHTML = cuteItems[Math.floor(Math.random() * cuteItems.length)];
                }
            }, 300);
            
            showCombo();
            
            if (Math.random() < 0.1) {
                setTimeout(() => {
                    if (gameRunning && !activeItems.has(index)) {
                        spawnSuperCute(index, holeEl, itemEl);
                    }
                }, 350);
            }
        }
        
        function showFloatingScore(holeEl, points, comboCount) {
            const float = document.createElement('div');
            float.className = 'score-float';
            float.textContent = `+${points}${comboCount > 1 ? '✨' : ''}`;
            float.style.left = '50%';
            float.style.top = '6px';
            float.style.transform = 'translateX(-50%)';
            holeEl.appendChild(float);
            
            setTimeout(() => {
                float.style.transition = 'all 0.45s ease';
                float.style.opacity = '0';
                float.style.transform = 'translateX(-50%) translateY(-28px)';
                setTimeout(() => float.remove(), 450);
            }, 260);
        }
        
        function createSparkles(holeEl) {
            const emojis = ['✨', '💕', '🌟'];
            for (let i = 0; i < 5; i++) {
                const s = document.createElement('div');
                s.className = 'mini-sparkle';
                s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                s.style.left = (Math.random() * 62 + 12) + 'px';
                s.style.top = (Math.random() * 38 + 10) + 'px';
                s.style.color = '#f472b6';
                holeEl.appendChild(s);
                setTimeout(() => s.remove(), 580);
            }
        }
        
        function spawnSuperCute(index, holeEl, itemEl) {
            if (!gameRunning) return;
            activeItems.add(index);
            
            const original = itemEl.innerHTML;
            itemEl.innerHTML = '💖';
            itemEl.style.fontSize = '38px';
            itemEl.style.transition = 'bottom 0.08s ease-out';
            itemEl.style.bottom = '11px';
            
            setTimeout(() => {
                if (activeItems.has(index) && gameRunning) {
                    itemEl.style.bottom = '-8px';
                    itemEl.innerHTML = original;
                    itemEl.style.fontSize = '32px';
                    activeItems.delete(index);
                }
            }, 680);
            
            const clickHandler = () => {
                if (!activeItems.has(index)) return;
                itemEl.classList.add('caught');
                const bonus = 32 + combo * 5;
                score += bonus;
                updateScore();
                showFloatingScore(holeEl, bonus, combo + 1);
                createSparkles(holeEl);
                
                setTimeout(() => {
                    itemEl.style.bottom = '-8px';
                    itemEl.innerHTML = original;
                    itemEl.style.fontSize = '32px';
                    itemEl.classList.remove('caught');
                    activeItems.delete(index);
                }, 280);
                holeEl.removeEventListener('click', clickHandler);
            };
            holeEl.addEventListener('click', clickHandler, { once: true });
        }
        
        function spawnItem() {
            if (!gameRunning) return;
            
            let available = [];
            for (let i = 0; i < 9; i++) {
                if (!activeItems.has(i)) available.push(i);
            }
            if (available.length === 0) return;
            
            const index = available[Math.floor(Math.random() * available.length)];
            const { hole, item } = holes[index];
            
            activeItems.add(index);
            item.innerHTML = cuteItems[Math.floor(Math.random() * cuteItems.length)];
            item.style.transition = 'bottom 0.13s cubic-bezier(0.34,1.56,0.64,1)';
            item.style.bottom = '11px';
            
            const stay = 680 + Math.random() * 420;
            
            setTimeout(() => {
                if (activeItems.has(index) && gameRunning) {
                    item.style.transition = 'bottom 0.17s ease-in';
                    item.style.bottom = '-8px';
                    setTimeout(() => activeItems.delete(index), 140);
                }
            }, stay);
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').textContent = highScore;
            }
        }
        
        function showCombo() {
            const comboEl = document.getElementById('combo-display');
            const textEl = document.getElementById('combo-text');
            
            if (combo >= 2) {
                textEl.textContent = `连击 x${combo} ✨`;
                comboEl.style.display = 'block';
                comboEl.classList.remove('hidden');
                
                if (combo >= 5) {
                    textEl.textContent = `🔥 超萌连击 x${combo} 🔥`;
                }
                
                setTimeout(() => {
                    if (comboEl.style.display !== 'none') {
                        comboEl.style.transition = 'opacity 0.35s';
                        comboEl.style.opacity = '0';
                        setTimeout(() => {
                            comboEl.style.display = 'none';
                            comboEl.style.opacity = '1';
                            comboEl.style.transition = '';
                            textEl.textContent = `连击 x1 ✨`;
                        }, 280);
                    }
                }, 980);
            }
        }
        
        function startGame() {
            if (gameRunning) return;
            
            score = 0;
            timeLeft = 60;
            combo = 0;
            activeItems.clear();
            
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('combo-display').style.display = 'none';
            
            gameRunning = true;
            
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> <span>暂停</span>`;
            btn.onclick = pauseGame;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('timer-bar').style.width = `${(timeLeft / 60) * 100}%`;
                
                if (timeLeft <= 10) document.getElementById('timer').classList.add('text-red-400');
                if (timeLeft <= 0) endGame();
            }, 1000);
            
            const spawnInterval = setInterval(() => {
                if (!gameRunning) { clearInterval(spawnInterval); return; }
                spawnItem();
                if (timeLeft < 26 && Math.random() < 0.5) {
                    setTimeout(() => { if (gameRunning) spawnItem(); }, 150);
                }
            }, 360);
            
            setTimeout(() => { if (gameRunning) spawnItem(); }, 140);
            setTimeout(() => { if (gameRunning) spawnItem(); }, 420);
        }
        
        function pauseGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> <span>继续</span>`;
            btn.onclick = resumeGame;
        }
        
        function resumeGame() {
            if (timeLeft <= 0) return;
            gameRunning = true;
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> <span>暂停</span>`;
            btn.onclick = pauseGame;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('timer-bar').style.width = `${(timeLeft / 60) * 100}%`;
                if (timeLeft <= 10) document.getElementById('timer').classList.add('text-red-400');
                if (timeLeft <= 0) endGame();
            }, 1000);
            
            const spawnInterval = setInterval(() => {
                if (!gameRunning) { clearInterval(spawnInterval); return; }
                spawnItem();
            }, 360);
        }
        
        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            
            holes.forEach(({ item }) => {
                item.style.transition = 'bottom 0.18s ease-in';
                item.style.bottom = '-8px';
            });
            activeItems.clear();
            
            const modal = document.getElementById('game-over-modal');
            document.getElementById('final-score').textContent = score;
            
            let title = '太棒了宝宝！';
            let subtitle = '你接住了好多可爱爱心～';
            let emoji = '🎀';
            
            if (score >= 320) {
                title = '无敌萌宝宝！';
                subtitle = '你是爱心小天使！';
                emoji = '👑';
            } else if (score >= 220) {
                title = '超级可爱！';
                subtitle = '宝宝你太会玩了～';
                emoji = '🌟';
            }
            
            document.getElementById('end-emoji').textContent = emoji;
            document.getElementById('end-title').textContent = title;
            document.getElementById('end-subtitle').textContent = subtitle;
            
            modal.style.display = 'flex';
            
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-redo mr-2"></i> <span>再来一局</span>`;
            btn.onclick = restartGame;
        }
        
        function restartGame() {
            document.getElementById('game-over-modal').style.display = 'none';
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('timer').classList.remove('text-red-400');
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('combo-display').style.display = 'none';
            
            holes.forEach(({ item }) => item.style.bottom = '-8px');
            
            setTimeout(() => startGame(), 240);
        }
        
        function showRules() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="bg-white border border-pink-200 rounded-3xl p-6 max-w-[260px] w-full mx-4 kawaii-shadow">
                    <div class="text-center mb-4">
                        <div class="text-4xl mb-1">💕</div>
                        <div class="text-xl font-black text-[#4c1d95]">游戏规则</div>
                    </div>
                    
                    <div class="space-y-2.5 text-sm text-purple-500">
                        <div class="flex gap-2.5">
                            <div>💗</div>
                            <div>可爱爱心 = <span class="font-bold text-[#4c1d95]">10分</span></div>
                        </div>
                        <div class="flex gap-2.5">
                            <div>💖</div>
                            <div>超级爱心 = <span class="font-bold text-[#4c1d95]">32分+</span></div>
                        </div>
                        <div class="flex gap-2.5">
                            <div>✨</div>
                            <div>快速连击 = 额外加分</div>
                        </div>
                    </div>
                    
                    <button onclick="this.closest('.fixed').remove()" 
                            class="mt-5 w-full py-2.5 rounded-2xl bg-gradient-to-r from-pink-400 to-purple-400 text-white font-bold text-sm">
                        知道了～
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function goToOtherGame() {
            const modal = document.getElementById('game-over-modal');
            modal.style.display = 'none';
            
            const tip = document.createElement('div');
            tip.className = 'fixed bottom-7 left-1/2 -translate-x-1/2 bg-white/90 px-5 py-2 rounded-2xl text-xs text-purple-500 flex items-center gap-x-2 z-50 shadow';
            tip.innerHTML = `💕 想玩其他游戏请回复我哦～`;
            document.body.appendChild(tip);
            
            setTimeout(() => {
                tip.style.transition = 'all 0.35s';
                tip.style.opacity = '0';
                setTimeout(() => tip.remove(), 280);
            }, 1400);
        }
        
        function initGame() {
            initTailwind();
            createHoles();
            
            document.getElementById('high-score').textContent = highScore;
            document.getElementById('start-btn').onclick = startGame;
            
            setTimeout(() => {
                const board = document.getElementById('game-board');
                board.style.transition = 'transform 0.35s cubic-bezier(0.34,1.56,0.64,1)';
                board.style.transform = 'scale(0.97)';
                setTimeout(() => board.style.transform = 'scale(1)', 150);
            }, 480);
            
            console.log('%c[赛博缝纫机] 超级萌版接爱心打洞已就绪 💕', 'color:#f472b6');
        }
        
        window.onload = initGame;
    </script>
</body>
</html>
