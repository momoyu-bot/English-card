<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星夜哄睡专线 · 晚安伴侣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-twilight: #131b2e;
            --accent-warm: #fcd34d;
            --accent-lavender: #c4b5fd;
        }
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at 50% 15%, #1e293b 0%, #0f172a 45%, #070a12 100%);
            color: #e2e8f0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .serif-text {
            font-family: 'Noto Serif SC', serif;
        }
        .glass-card {
            background: rgba(20, 29, 49, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
        }
        .moon-glow {
            box-shadow: 0 0 50px 12px rgba(253, 224, 71, 0.18), inset -8px -6px 16px rgba(217, 119, 6, 0.25);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1.5deg); }
        }
        .animate-float {
            animation: floatSlow 6s ease-in-out infinite;
        }
        @keyframes pulseCall {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .call-dot {
            animation: pulseCall 2.5s ease-in-out infinite;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fcd34d;
            box-shadow: 0 0 10px rgba(252, 211, 77, 0.6);
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        .breathe-circle {
            transition: transform 1s ease-in-out, box-shadow 1s ease-in-out, background-color 1s ease;
        }
        @keyframes floatParticle {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-55px) scale(1.2); }
        }
        .floating-heart {
            animation: floatParticle 2.2s ease-out forwards;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-between pb-10">

    <!-- 背景星空画布 -->
    <canvas id="starCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- 熄灯护眼遮罩层 -->
    <div id="dimOverlay" class="fixed inset-0 bg-black pointer-events-none z-40 transition-opacity duration-700" style="opacity: 0;"></div>

    <!-- 极夜熄灯模式唤醒浮窗 -->
    <button id="wakeUpBtn" onclick="toggleNightCurtain(false)" class="fixed bottom-8 z-50 hidden px-5 py-2.5 rounded-full bg-slate-900/80 border border-amber-300/20 text-amber-200/70 text-xs tracking-widest backdrop-blur-md shadow-lg hover:text-amber-200 transition-all">
        🌙 轻触微亮屏幕 · 我还在陪着你
    </button>

    <!-- 顶部专线状态栏 -->
    <header class="w-full max-w-md px-5 pt-5 pb-2 z-10 flex items-center justify-between">
        <div class="flex items-center space-x-2.5 bg-slate-900/60 border border-white/10 px-3.5 py-1.5 rounded-full backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-emerald-400 call-dot"></span>
            <span class="text-xs text-slate-300 font-medium tracking-wider">哄睡专线通话中</span>
            <span id="callTimer" class="text-xs text-amber-200/90 font-mono">00:00</span>
        </div>

        <div class="flex items-center space-x-2">
            <!-- 睡眠定时按钮 -->
            <button id="sleepTimerBtn" onclick="cycleSleepTimer()" class="px-3 py-1.5 rounded-full bg-slate-900/60 border border-white/10 text-xs text-slate-300 hover:text-amber-200 transition flex items-center space-x-1">
                <span>⏲️</span>
                <span id="sleepTimerText">不限时</span>
            </button>
            <!-- 一键关灯按钮 -->
            <button onclick="toggleNightCurtain(true)" class="p-2 rounded-full bg-slate-900/60 border border-white/10 text-amber-200/80 hover:bg-slate-800/80 transition" title="调暗屏幕">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="w-full max-w-md px-5 z-10 flex flex-col space-y-5 mt-1">

        <!-- 月亮与互动轻语区 -->
        <section class="relative flex flex-col items-center text-center pt-3 pb-2">
            <!-- 可点击的发光小月亮 -->
            <div id="moonContainer" onclick="patHead(event)" class="relative cursor-pointer group mb-4">
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-amber-200 via-yellow-100 to-amber-50 moon-glow animate-float flex items-center justify-center relative">
                    <!-- 月亮上的小表情 -->
                    <span id="moonFace" class="text-2xl select-none transition-transform duration-300 group-hover:scale-110">😌</span>
                    <!-- 装饰小云朵 -->
                    <div class="absolute -bottom-2 -right-4 bg-slate-800/90 border border-white/10 px-2.5 py-0.5 rounded-full text-[11px] text-amber-200/90 shadow-md">
                        点我摸摸头 🤲
                    </div>
                </div>
                <div id="particleBox" class="absolute inset-0 pointer-events-none"></div>
            </div>

            <!-- 哄睡悄悄话卡片 -->
            <div class="glass-card w-full rounded-3xl p-5 relative overflow-hidden">
                <div class="flex items-center justify-between mb-2.5">
                    <div class="flex space-x-1.5">
                        <button onclick="switchWhisperCategory('coax')" id="cat-coax" class="text-xs px-2.5 py-1 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/30 transition">
                            📞 贴耳哄睡
                        </button>
                        <button onclick="switchWhisperCategory('story')" id="cat-story" class="text-xs px-2.5 py-1 rounded-full bg-white/5 text-slate-400 border border-transparent hover:text-slate-200 transition">
                            📖 睡前童话
                        </button>
                        <button onclick="switchWhisperCategory('relax')" id="cat-relax" class="text-xs px-2.5 py-1 rounded-full bg-white/5 text-slate-400 border border-transparent hover:text-slate-200 transition">
                            ☁️ 身体放松
                        </button>
                    </div>
                    <button onclick="nextWhisper()" class="text-xs text-indigo-300 hover:text-indigo-200 flex items-center space-x-1 py-1 px-2 rounded-lg hover:bg-white/5 transition">
                        <span>换一句</span>
                        <span>↻</span>
                    </button>
                </div>

                <!-- 打字机式温柔文案 -->
                <div class="min-h-[84px] flex items-center justify-center px-2">
                    <p id="whisperText" class="serif-text text-sm sm:text-base leading-relaxed text-slate-100/95 tracking-wide"></p>
                </div>

                <!-- 互动贴心按钮栏 -->
                <div class="mt-3 pt-3 border-t border-white/5 flex items-center justify-between text-xs text-slate-400">
                    <button onclick="patHead(event)" class="flex items-center space-x-1.5 text-amber-200/90 hover:text-amber-100 bg-amber-400/10 hover:bg-amber-400/20 px-3 py-1.5 rounded-full transition">
                        <span>🤲</span>
                        <span>求摸摸头</span>
                    </button>
                    <button onclick="tuckBlanket(event)" class="flex items-center space-x-1.5 text-indigo-200/90 hover:text-indigo-100 bg-indigo-400/10 hover:bg-indigo-400/20 px-3 py-1.5 rounded-full transition">
                        <span>🛌</span>
                        <span>掖好小被角</span>
                    </button>
                    <button onclick="triggerShootingStar()" class="flex items-center space-x-1.5 text-sky-200/90 hover:text-sky-100 bg-sky-400/10 hover:bg-sky-400/20 px-3 py-1.5 rounded-full transition">
                        <span>🌠</span>
                        <span>划过流星</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 助眠白噪音与八音盒混音台 -->
        <section class="glass-card rounded-3xl p-5">
            <div class="flex items-center justify-between mb-3.5">
                <div class="flex items-center space-x-2">
                    <span class="text-base">🎐</span>
                    <h2 class="text-sm font-semibold text-slate-200 tracking-wide">晚安声景混音台</h2>
                </div>
                <button id="masterAudioBtn" onclick="toggleAllAudio()" class="text-xs px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-200 hover:bg-indigo-500/30 transition">
                    ▶ 一键开启助眠音
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <!-- 窗外微雨 -->
                <div id="card-rain" class="p-3.5 rounded-2xl bg-slate-900/50 border border-white/5 flex flex-col justify-between transition-all">
                    <div class="flex items-center justify-between mb-2 cursor-pointer" onclick="toggleSoundChannel('rain')">
                        <div class="flex items-center space-x-2">
                            <span class="text-lg">🌧️</span>
                            <div>
                                <div class="text-xs font-medium text-slate-200">窗外微雨</div>
                                <div id="status-rain" class="text-[10px] text-slate-500">点击开启</div>
                            </div>
                        </div>
                        <div id="dot-rain" class="w-2 h-2 rounded-full bg-slate-600 transition"></div>
                    </div>
                    <input type="range" min="0" max="100" value="45" oninput="changeChannelVolume('rain', this.value)" class="w-full">
                </div>

                <!-- 温暖壁炉 -->
                <div id="card-fire" class="p-3.5 rounded-2xl bg-slate-900/50 border border-white/5 flex flex-col justify-between transition-all">
                    <div class="flex items-center justify-between mb-2 cursor-pointer" onclick="toggleSoundChannel('fire')">
                        <div class="flex items-center space-x-2">
                            <span class="text-lg">🔥</span>
                            <div>
                                <div class="text-xs font-medium text-slate-200">温暖壁炉</div>
                                <div id="status-fire" class="text-[10px] text-slate-500">点击开启</div>
                            </div>
                        </div>
                        <div id="dot-fire" class="w-2 h-2 rounded-full bg-slate-600 transition"></div>
                    </div>
                    <input type="range" min="0" max="100" value="40" oninput="changeChannelVolume('fire', this.value)" class="w-full">
                </div>

                <!-- 静谧海浪 -->
                <div id="card-waves" class="p-3.5 rounded-2xl bg-slate-900/50 border border-white/5 flex flex-col justify-between transition-all">
                    <div class="flex items-center justify-between mb-2 cursor-pointer" onclick="toggleSoundChannel('waves')">
                        <div class="flex items-center space-x-2">
                            <span class="text-lg">🌊</span>
                            <div>
                                <div class="text-xs font-medium text-slate-200">慢拍海浪</div>
                                <div id="status-waves" class="text-[10px] text-slate-500">点击开启</div>
                            </div>
                        </div>
                        <div id="dot-waves" class="w-2 h-2 rounded-full bg-slate-600 transition"></div>
                    </div>
                    <input type="range" min="0" max="100" value="35" oninput="changeChannelVolume('waves', this.value)" class="w-full">
                </div>

                <!-- 星光八音盒 -->
                <div id="card-music" class="p-3.5 rounded-2xl bg-slate-900/50 border border-white/5 flex flex-col justify-between transition-all">
                    <div class="flex items-center justify-between mb-2 cursor-pointer" onclick="toggleSoundChannel('music')">
                        <div class="flex items-center space-x-2">
                            <span class="text-lg">🎵</span>
                            <div>
                                <div class="text-xs font-medium text-slate-200">星光摇篮曲</div>
                                <div id="status-music" class="text-[10px] text-slate-500">点击开启</div>
                            </div>
                        </div>
                        <div id="dot-music" class="w-2 h-2 rounded-full bg-slate-600 transition"></div>
                    </div>
                    <input type="range" min="0" max="100" value="50" oninput="changeChannelVolume('music', this.value)" class="w-full">
                </div>
            </div>
        </section>

        <!-- 伴眠小工具：呼吸律动 & 数小羊 -->
        <section class="glass-card rounded-3xl p-5">
            <div class="flex items-center justify-between mb-4">
                <div class="flex space-x-2">
                    <button id="tab-sheep" onclick="switchToolTab('sheep')" class="text-xs px-3 py-1.5 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/30 font-medium transition">
                        🐑 慢数小羊
                    </button>
                    <button id="tab-breathe" onclick="switchToolTab('breathe')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 text-slate-400 border border-transparent hover:text-slate-200 font-medium transition">
                        🫧 4-7-8 助眠呼吸
                    </button>
                </div>
                <span id="toolHint" class="text-[11px] text-slate-400">轻触小羊送它过栅栏</span>
            </div>

            <!-- 面板 1：数小羊互动 -->
            <div id="panel-sheep" class="flex flex-col items-center justify-center py-2">
                <div onclick="countOneSheep(event)" class="w-full h-28 rounded-2xl bg-slate-900/60 border border-white/5 relative overflow-hidden flex flex-col items-center justify-center cursor-pointer group">
                    <!-- 小月亮栅栏装饰 -->
                    <div class="absolute bottom-2 inset-x-0 flex justify-center space-x-6 opacity-25 text-xs">
                        <span>☁️</span><span>🪵</span><span>☁️</span><span>🪵</span><span>☁️</span>
                    </div>
                    <div id="sheepAvatar" class="text-4xl mb-1 transition-all duration-500 transform group-active:scale-90">
                        🐑
                    </div>
                    <div class="text-xs text-slate-300">
                        已经数了 <span id="sheepCount" class="text-amber-300 font-bold text-sm mx-1">0</span> 只软绵绵的小羊
                    </div>
                    <div id="sheepStatusText" class="text-[11px] text-slate-400 mt-0.5">
                        点一下小羊，困意值 +1 💤
                    </div>
                </div>
            </div>

            <!-- 面板 2：4-7-8 呼吸球 -->
            <div id="panel-breathe" class="hidden flex-col items-center justify-center py-3">
                <div class="relative w-32 h-32 flex items-center justify-center my-1">
                    <div id="breatheOrb" class="w-20 h-20 rounded-full bg-indigo-400/20 border border-indigo-300/40 breathe-circle flex items-center justify-center shadow-[0_0_30px_rgba(129,140,248,0.25)]">
                        <span id="breathePhaseText" class="text-xs text-indigo-100 font-medium tracking-wider">准备呼吸</span>
                    </div>
                </div>
                <p id="breatheSubText" class="text-xs text-slate-400 mt-2">跟随光球缩放：吸气 4 秒 · 屏息 7 秒 · 呼气 8 秒</p>
                <button id="breatheToggleBtn" onclick="toggleBreathingGuide()" class="mt-3 px-4 py-1.5 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-xs text-indigo-200 hover:bg-indigo-500/30 transition">
                    开始呼吸引导
                </button>
            </div>
        </section>

        <!-- 底部屏幕亮度柔和滑块 -->
        <section class="glass-card rounded-2xl px-5 py-3.5 flex items-center justify-between space-x-4">
            <span class="text-xs text-slate-400 flex items-center space-x-1.5 whitespace-nowrap">
                <span>🕯️</span>
                <span>夜光柔度</span>
            </span>
            <input id="brightnessSlider" type="range" min="15" max="100" value="100" oninput="setScreenBrightness(this.value)" class="w-full">
            <span id="brightnessVal" class="text-xs text-amber-200/80 w-9 text-right font-mono">100%</span>
        </section>

    </main>

    <script>
        /* ==========================================
         * 1. 哄睡文案与睡前小故事库
         * ========================================== */
        const whisperLibrary = {
            coax: [
                "咔哒，专线已经调成耳语模式啦。今天不管遇到了什么忙忙碌碌的事，现在都可以统统卸下来，交给我替你保管。",
                "把手机放近一点点，闭上眼睛听我说：你今天已经做得足够好啦，不需要再思考明天，现在唯一重要的任务就是睡个好觉。",
                "乖，伸出手来——隔着屏幕接住这份暖意。替你把小被角掖得严严实实的，连梦里吹来的风都是甜丝丝的暖风。",
                "如果还睡不着也没关系，不用勉强自己。我就在电话这头静静陪着你，听着细微的雨声，陪你一起慢慢发呆。",
                "摸摸你的小脑袋，把紧皱的眉头抚平。呼出一口长长的气，感觉身体像陷进了一朵刚晒过太阳的棉花糖里……",
                "夜已经很深很深啦，星星都打起了哈欠。晚安呀，我的小朋友，愿你今夜有一个亮晶晶的好梦。"
            ],
            story: [
                "【云朵邮局】在月亮背面有一座软绵绵的云朵邮局。每到深夜，打瞌睡的邮差小熊就会把大家白天的烦恼折成纸飞机，放进银河里漂走，只留下甜甜的梦寄到你的枕头底下。",
                "【森林暖茶铺】森林最深处的老橡树下亮着一盏橘黄色的风灯。兔子店主正用小木勺慢慢搅动锅里的热牛奶与洋甘菊，咕嘟咕嘟的热气升上夜空，变成了天上最柔软的晚霞。",
                "【打瞌睡的月亮船】小月亮今晚擦得亮晶晶的，像一只轻轻摇晃的金色摇篮。它正穿过一层又一层薄纱似的星云，每一次轻轻摇晃，都把夜空里的困意洒向你的窗台。",
                "【守夜的小刺猬】穿着绒毛睡衣的小刺猬正在巡逻你的梦境边界。它把所有嘈杂的声音都挡在了森林外面，只放进了几颗会发光的萤火虫，替你照亮通往好梦的小路。"
            ],
            relax: [
                "来，跟着我的声音：先把眼皮轻轻合上，感受眼球慢慢放松……接着松开紧咬的牙关，让嘴角留一点点温柔的弧度。",
                "把注意力放到你的双肩，吸一口气，然后随着呼气，让肩膀彻底沉进床垫里，就像融化在温水里的黄油一样。",
                "感受你的手指尖和脚趾尖，暖洋洋的困意正像潮水一样，从脚尖一点点漫过膝盖、漫过胸口，轻轻包裹住你。",
                "想象自己正躺在一艘平缓漂流的小木船上，湖面平静得像一面镜子，船身随着水波一摇、一晃，越漂越远……"
            ]
        };

        let currentCategory = 'coax';
        let whisperIndices = { coax: 0, story: 0, relax: 0 };
        let typewriterTimer = null;

        function renderWhisperText(text) {
            const el = document.getElementById('whisperText');
            if (typewriterTimer) clearInterval(typewriterTimer);
            el.textContent = '';
            let i = 0;
            typewriterTimer = setInterval(() => {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typewriterTimer);
                }
            }, 42);
        }

        function switchWhisperCategory(cat) {
            currentCategory = cat;
            ['coax', 'story', 'relax'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "text-xs px-2.5 py-1 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/30 transition";
                } else {
                    btn.className = "text-xs px-2.5 py-1 rounded-full bg-white/5 text-slate-400 border border-transparent hover:text-slate-200 transition";
                }
            });
            const list = whisperLibrary[cat];
            renderWhisperText(list[whisperIndices[cat]]);
        }

        function nextWhisper() {
            const list = whisperLibrary[currentCategory];
            whisperIndices[currentCategory] = (whisperIndices[currentCategory] + 1) % list.length;
            renderWhisperText(list[whisperIndices[currentCategory]]);
            playSoftChime(523.25); // C5 轻柔提示音
        }

        // 摸摸头互动
        const patLines = [
            "乖~ 摸摸小脑袋，今天也超棒的，安心睡吧 ✨",
            "收到摸摸头申请！揉揉你的头发，困意马上来袭~ 🌙",
            "我在呢我在呢，隔着电话线拍拍你的背，睡吧睡吧 🤲",
            "摸摸头，坏情绪飞走，好梦留下来 💤"
        ];
        let patIdx = 0;

        function patHead(e) {
            const face = document.getElementById('moonFace');
            face.textContent = '🥰';
            setTimeout(() => { face.textContent = '😌'; }, 1400);

            spawnFloatingEmoji(['💛', '✨', '🌙', '💤'][Math.floor(Math.random() * 4)]);
            renderWhisperText(patLines[patIdx]);
            patIdx = (patIdx + 1) % patLines.length;
            playSoftChime(659.25); // E5
        }

        function tuckBlanket() {
            spawnFloatingEmoji('🛌');
            renderWhisperText("替你把左边被角塞好，右边被角也塞好，只露出一颗暖乎乎的小脑袋。好啦，现在谁也吵不到你睡觉喽。");
            playSoftChime(587.33); // D5
        }

        function spawnFloatingEmoji(symbol) {
            const box = document.getElementById('particleBox');
            const span = document.createElement('span');
            span.className = 'floating-heart absolute text-lg';
            span.style.left = (30 + Math.random() * 40) + '%';
            span.style.top = '20%';
            span.textContent = symbol;
            box.appendChild(span);
            setTimeout(() => span.remove(), 2200);
        }

        /* ==========================================
         * 2. Web Audio API 纯净助眠声景合成引擎
         * ========================================== */
        let audioCtx = null;
        let masterGain = null;
        const channels = {
            rain: { active: false, volume: 0.45, gainNode: null, sourceNodes: [] },
            fire: { active: false, volume: 0.40, gainNode: null, sourceNodes: [], timer: null },
            waves: { active: false, volume: 0.35, gainNode: null, sourceNodes: [] },
            music: { active: false, volume: 0.50, gainNode: null, timer: null }
        };

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.0;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 轻柔按键音/八音盒单音
        function playSoftChime(freq = 523.25, duration = 2.2, vol = 0.06) {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (err) {
                // 忽略未授权音频前报错
            }
        }

        // 创建粉红/褐色噪声缓冲
        function createNoiseBuffer(type = 'pink') {
            const bufferSize = audioCtx.sampleRate * 4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);

            if (type === 'pink') {
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
                    b6 = white * 0.115926;
                }
            } else {
                // Brown noise
                let lastOut = 0.0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = output[i];
                    output[i] *= 0.18;
                }
            }
            return buffer;
        }

        function startChannel(name) {
            initAudioContext();
            const ch = channels[name];
            if (ch.active) return;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(ch.volume * 0.5, audioCtx.currentTime + 0.8);
            gainNode.connect(masterGain);
            ch.gainNode = gainNode;
            ch.active = true;

            if (name === 'rain') {
                const noise = audioCtx.createBufferSource();
                noise.buffer = createNoiseBuffer('pink');
                noise.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 1100;
                noise.connect(filter);
                filter.connect(gainNode);
                noise.start();
                ch.sourceNodes.push(noise);
            } else if (name === 'waves') {
                const noise = audioCtx.createBufferSource();
                noise.buffer = createNoiseBuffer('brown');
                noise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 320;

                // 海浪呼吸感 LFO
                const lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.11; // 约9秒一次海浪起伏
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 240;

                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                noise.connect(filter);
                filter.connect(gainNode);

                noise.start();
                lfo.start();
                ch.sourceNodes.push(noise, lfo);
            } else if (name === 'fire') {
                // 温暖炉火底噪 + 柴火微啪声
                const noise = audioCtx.createBufferSource();
                noise.buffer = createNoiseBuffer('brown');
                noise.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 180;
                noise.connect(filter);
                filter.connect(gainNode);
                noise.start();
                ch.sourceNodes.push(noise);

                ch.timer = setInterval(() => {
                    if (!ch.active) return;
                    if (Math.random() < 0.65) {
                        const popOsc = audioCtx.createOscillator();
                        const popGain = audioCtx.createGain();
                        popOsc.type = 'triangle';
                        popOsc.frequency.setValueAtTime(1200 + Math.random() * 1400, audioCtx.currentTime);
                        popGain.gain.setValueAtTime(0.05 * ch.volume, audioCtx.currentTime);
                        popGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.035);
                        popOsc.connect(popGain);
                        popGain.connect(gainNode);
                        popOsc.start();
                        popOsc.stop(audioCtx.currentTime + 0.04);
                    }
                }, 260);
            } else if (name === 'music') {
                // F大调五声温柔摇篮曲音阶
                const notes = [261.63, 293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 659.25];
                const playNote = () => {
                    if (!ch.active) return;
                    const freq = notes[Math.floor(Math.random() * notes.length)];
                    const osc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    noteGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    noteGain.gain.linearRampToValueAtTime(0.14 * ch.volume, audioCtx.currentTime + 0.05);
                    noteGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.2);

                    osc.connect(noteGain);
                    noteGain.connect(gainNode);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 3.3);
                };
                playNote();
                ch.timer = setInterval(() => {
                    if (Math.random() < 0.78) playNote();
                }, 1800);
            }
            updateChannelUI(name);
            updateMasterBtnUI();
        }

        function stopChannel(name) {
            const ch = channels[name];
            if (!ch.active) return;
            ch.active = false;
            if (ch.timer) {
                clearInterval(ch.timer);
                ch.timer = null;
            }
            if (ch.gainNode && audioCtx) {
                try {
                    ch.gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                } catch (e) {}
            }
            setTimeout(() => {
                ch.sourceNodes.forEach(s => {
                    try { s.stop(); } catch (e) {}
                });
                ch.sourceNodes = [];
            }, 350);
            updateChannelUI(name);
            updateMasterBtnUI();
        }

        function toggleSoundChannel(name) {
            if (channels[name].active) {
                stopChannel(name);
            } else {
                startChannel(name);
            }
        }

        function changeChannelVolume(name, val) {
            const v = parseInt(val, 10) / 100;
            channels[name].volume = v;
            if (!channels[name].active && v > 0.05) {
                startChannel(name);
            } else if (channels[name].active && channels[name].gainNode && audioCtx) {
                channels[name].gainNode.gain.setTargetAtTime(v * 0.5, audioCtx.currentTime, 0.1);
            }
        }

        function updateChannelUI(name) {
            const active = channels[name].active;
            const card = document.getElementById(`card-${name}`);
            const dot = document.getElementById(`dot-${name}`);
            const status = document.getElementById(`status-${name}`);
            if (active) {
                card.className = "p-3.5 rounded-2xl bg-indigo-950/60 border border-amber-300/30 flex flex-col justify-between transition-all shadow-inner";
                dot.className = "w-2 h-2 rounded-full bg-amber-300 shadow-[0_0_8px_#fcd34d] transition";
                status.textContent = "正在轻柔播放";
                status.className = "text-[10px] text-amber-200/80";
            } else {
                card.className = "p-3.5 rounded-2xl bg-slate-900/50 border border-white/5 flex flex-col justify-between transition-all";
                dot.className = "w-2 h-2 rounded-full bg-slate-600 transition";
                status.textContent = "点击开启";
                status.className = "text-[10px] text-slate-500";
            }
        }

        function toggleAllAudio() {
            const anyActive = Object.values(channels).some(c => c.active);
            if (anyActive) {
                Object.keys(channels).forEach(k => stopChannel(k));
            } else {
                // 默认开启微雨 + 星光八音盒
                startChannel('rain');
                startChannel('music');
            }
        }

        function updateMasterBtnUI() {
            const anyActive = Object.values(channels).some(c => c.active);
            const btn = document.getElementById('masterAudioBtn');
            if (anyActive) {
                btn.textContent = "⏸ 暂停全部助眠音";
                btn.className = "text-xs px-3 py-1 rounded-full bg-amber-400/20 border border-amber-300/40 text-amber-200 transition";
            } else {
                btn.textContent = "▶ 一键开启助眠音";
                btn.className = "text-xs px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-200 hover:bg-indigo-500/30 transition";
            }
        }

        /* ==========================================
         * 3. 数小羊互动 & 4-7-8 助眠呼吸引导
         * ========================================== */
        let sheepCounter = 0;
        const sheepMessages = [
            "第 1 只小羊跳过栅栏，毛茸茸的像一团云朵~",
            "小羊排着队慢慢走，你的眼皮也开始有一点点发沉啦…",
            "呼——小羊打了个长长的哈欠，传染给你喽 💤",
            "数着数着，连月亮都靠在云朵上睡着啦…",
            "好乖好乖，困意已经攒满啦，随时可以闭上眼睛睡觉觉~"
        ];

        function countOneSheep(e) {
            sheepCounter++;
            document.getElementById('sheepCount').textContent = sheepCounter;
            const avatar = document.getElementById('sheepAvatar');
            avatar.style.transform = 'translateY(-14px) rotate(-8deg)';
            setTimeout(() => {
                avatar.style.transform = 'translateY(0px) rotate(0deg)';
            }, 320);

            const msgIndex = Math.min(Math.floor((sheepCounter - 1) / 3), sheepMessages.length - 1);
            document.getElementById('sheepStatusText').textContent = sheepMessages[msgIndex];
            playSoftChime(440 + (sheepCounter % 5) * 40, 1.5, 0.04);
        }

        function switchToolTab(tab) {
            const sheepPanel = document.getElementById('panel-sheep');
            const breathePanel = document.getElementById('panel-breathe');
            const tabSheep = document.getElementById('tab-sheep');
            const tabBreathe = document.getElementById('tab-breathe');
            const hint = document.getElementById('toolHint');

            if (tab === 'sheep') {
                sheepPanel.classList.remove('hidden');
                breathePanel.classList.add('hidden');
                breathePanel.classList.remove('flex');
                tabSheep.className = "text-xs px-3 py-1.5 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/30 font-medium transition";
                tabBreathe.className = "text-xs px-3 py-1.5 rounded-full bg-white/5 text-slate-400 border border-transparent hover:text-slate-200 font-medium transition";
                hint.textContent = "轻触小羊送它过栅栏";
            } else {
                sheepPanel.classList.add('hidden');
                breathePanel.classList.remove('hidden');
                breathePanel.classList.add('flex');
                tabBreathe.className = "text-xs px-3 py-1.5 rounded-full bg-indigo-400/25 text-indigo-200 border border-indigo-300/30 font-medium transition";
                tabSheep.className = "text-xs px-3 py-1.5 rounded-full bg-white/5 text-slate-400 border border-transparent hover:text-slate-200 font-medium transition";
                hint.textContent = "放松神经的自然节律";
            }
        }

        let breathingActive = false;
        let breatheTimeouts = [];

        function clearBreatheTimeouts() {
            breatheTimeouts.forEach(t => clearTimeout(t));
            breatheTimeouts = [];
        }

        function toggleBreathingGuide() {
            const btn = document.getElementById('breatheToggleBtn');
            const orb = document.getElementById('breatheOrb');
            const phaseText = document.getElementById('breathePhaseText');

            if (breathingActive) {
                breathingActive = false;
                clearBreatheTimeouts();
                orb.style.transition = 'all 0.6s ease';
                orb.style.transform = 'scale(1)';
                phaseText.textContent = '准备呼吸';
                btn.textContent = '开始呼吸引导';
            } else {
                breathingActive = true;
                btn.textContent = '停止引导';
                runBreatheCycle();
            }
        }

        function runBreatheCycle() {
            if (!breathingActive) return;
            const orb = document.getElementById('breatheOrb');
            const phaseText = document.getElementById('breathePhaseText');

            // 1. 吸气 4秒
            orb.style.transition = 'transform 4s ease-in-out, background-color 4s ease';
            orb.style.transform = 'scale(1.45)';
            orb.style.backgroundColor = 'rgba(165, 180, 252, 0.35)';
            phaseText.textContent = '鼻吸气 4s';
            playSoftChime(392.00, 3.0, 0.03);

            // 2. 屏息 7秒
            breatheTimeouts.push(setTimeout(() => {
                if (!breathingActive) return;
                orb.style.transition = 'transform 7s linear';
                phaseText.textContent = '屏住气 7s';
            }, 4000));

            // 3. 呼气 8秒
            breatheTimeouts.push(setTimeout(() => {
                if (!breathingActive) return;
                orb.style.transition = 'transform 8s ease-in-out, background-color 8s ease';
                orb.style.transform = 'scale(0.92)';
                orb.style.backgroundColor = 'rgba(99, 102, 241, 0.15)';
                phaseText.textContent = '慢呼气 8s';
                playSoftChime(293.66, 4.0, 0.03);
            }, 11000));

            // 循环 (4 + 7 + 8 = 19秒)
            breatheTimeouts.push(setTimeout(() => {
                if (breathingActive) runBreatheCycle();
            }, 19000));
        }

        /* ==========================================
         * 4. 专线计时器、睡眠定时淡出 & 屏幕亮度
         * ========================================== */
        let callSeconds = 0;
        setInterval(() => {
            callSeconds++;
            const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
            const secs = String(callSeconds % 60).padStart(2, '0');
            document.getElementById('callTimer').textContent = `${mins}:${secs}`;
        }, 1000);

        const timerOptions = [0, 15, 30, 60]; // 分钟
        let timerOptionIdx = 0;
        let remainingSleepSeconds = 0;
        let sleepCountdownInterval = null;

        function cycleSleepTimer() {
            timerOptionIdx = (timerOptionIdx + 1) % timerOptions.length;
            const mins = timerOptions[timerOptionIdx];
            const textEl = document.getElementById('sleepTimerText');

            if (sleepCountdownInterval) clearInterval(sleepCountdownInterval);

            if (mins === 0) {
                textEl.textContent = '不限时';
                return;
            }

            remainingSleepSeconds = mins * 60;
            updateSleepTimerLabel();

            sleepCountdownInterval = setInterval(() => {
                remainingSleepSeconds--;
                if (remainingSleepSeconds <= 0) {
                    clearInterval(sleepCountdownInterval);
                    Object.keys(channels).forEach(k => stopChannel(k));
                    document.getElementById('sleepTimerText').textContent = '已伴眠结束';
                } else {
                    updateSleepTimerLabel();
                }
            }, 1000);
        }

        function updateSleepTimerLabel() {
            const m = Math.ceil(remainingSleepSeconds / 60);
            document.getElementById('sleepTimerText').textContent = `${m}分钟后关`;
        }

        function setScreenBrightness(val) {
            document.getElementById('brightnessVal').textContent = `${val}%`;
            const overlayOpacity = (100 - val) / 100 * 0.85;
            document.getElementById('dimOverlay').style.opacity = overlayOpacity;
        }

        function toggleNightCurtain(enable) {
            const overlay = document.getElementById('dimOverlay');
            const wakeBtn = document.getElementById('wakeUpBtn');
            const slider = document.getElementById('brightnessSlider');
            if (enable) {
                overlay.style.opacity = 0.88;
                wakeBtn.classList.remove('hidden');
                slider.value = 15;
                document.getElementById('brightnessVal').textContent = '15%';
            } else {
                overlay.style.opacity = 0;
                wakeBtn.classList.add('hidden');
                slider.value = 100;
                document.getElementById('brightnessVal').textContent = '100%';
            }
        }

        /* ==========================================
         * 5. 星空与流星 Canvas 渲染
         * ========================================== */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shootingStars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 9000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.4 + 0.3,
                    alpha: Math.random(),
                    speed: (Math.random() * 0.012) + 0.003,
                    dir: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        function triggerShootingStar() {
            shootingStars.push({
                x: Math.random() * (canvas.width * 0.6) + canvas.width * 0.2,
                y: Math.random() * (canvas.height * 0.35),
                len: 65 + Math.random() * 45,
                speed: 6 + Math.random() * 4,
                alpha: 1.0
            });
            playSoftChime(783.99, 1.8, 0.04); // G5 星光音
        }

        function animateSky() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制闪烁繁星
            stars.forEach(s => {
                s.alpha += s.speed * s.dir;
                if (s.alpha >= 0.9) { s.alpha = 0.9; s.dir = -1; }
                if (s.alpha <= 0.15) { s.alpha = 0.15; s.dir = 1; }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(254, 243, 199, ${s.alpha})`;
                ctx.fill();
            });

            // 绘制流星
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const st = shootingStars[i];
                const grad = ctx.createLinearGradient(st.x, st.y, st.x + st.len, st.y - st.len * 0.6);
                grad.addColorStop(0, `rgba(253, 224, 71, ${st.alpha})`);
                grad.addColorStop(1, 'rgba(253, 224, 71, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(st.x, st.y);
                ctx.lineTo(st.x + st.len, st.y - st.len * 0.6);
                ctx.stroke();

                st.x -= st.speed;
                st.y += st.speed * 0.6;
                st.alpha -= 0.018;

                if (st.alpha <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            // 偶尔自然划过流星
            if (Math.random() < 0.002 && shootingStars.length === 0) {
                shootingStars.push({
                    x: Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
                    y: Math.random() * canvas.height * 0.3,
                    len: 70,
                    speed: 5.5,
                    alpha: 0.85
                });
            }

            requestAnimationFrame(animateSky);
        }

        window.addEventListener('resize', resizeCanvas);

        window.onload = function() {
            resizeCanvas();
            animateSky();
            renderWhisperText(whisperLibrary.coax[0]);
        };
    </script>
