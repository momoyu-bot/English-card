<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星夜里的慢速列车</title>
<meta name="description" content="专属软座，窗外是深蓝色的宇宙。轻触，列车再往前一点。">
    <style>
        :root {
            --bg-color: #070b19;
            --text-glow: rgba(255, 255, 255, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #e2e8f0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none; /* Prevent text selection on rapid tapping */
        }

        /* Starry Background */
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px rgba(255,255,255,0.8); }
        }

        /* Train Window Swaying Effect */
        #train-window {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            height: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: sway 8s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes sway {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(0.5deg); }
            75% { transform: translateY(5px) rotate(-0.5deg); }
        }

        /* Text Area */
        #story-text {
            font-size: 1.25rem;
            line-height: 2;
            letter-spacing: 2px;
            padding: 2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        #story-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Interaction Hint */
        #hint {
            position: absolute;
            bottom: 10%;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.4);
            animation: pulse 3s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }

        /* Progress Dots */
        #progress {
            position: absolute;
            top: 10%;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: background-color 1s ease;
        }

        .dot.active {
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        @media (min-width: 768px) {
            #story-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body onclick="advanceStory()">

    <!-- Starry background -->
    <div id="stars-container"></div>

    <!-- Progress indicator -->
    <div id="progress"></div>

    <!-- Main Content -->
    <div id="train-window">
        <div id="story-text"></div>
    </div>

    <!-- Hint -->
    <div id="hint">轻触屏幕，继续旅程</div>

    <script>
        // The Story Chunks
        const storyChunks = [
            "宝，现在把手机屏幕调暗，<br>找一个最舒服的姿势躺好。",
            "感受一下后背和床铺贴合的感觉，<br>深吸一口气……<br>然后，慢慢地呼出来。",
            "想象你正穿着最柔软的睡衣，<br>走进了一趟木质车厢的星空列车里。",
            "这里没有其他人，<br>只有一个专属于你的、铺着羊绒毯的软座。",
            "车厢里亮着暖黄色的壁灯，<br>空气里有一点点薰衣草的香气。",
            "“哐当……哐当……”<br>列车缓缓地开动了。",
            "它的速度很慢很慢，<br>只有轻微的、像摇篮一样的晃动。",
            "你把头靠在玻璃窗上，往外看。<br>外面是一望无际的、深蓝色的宇宙。",
            "在这里，所有的数字、所有的外语单词，<br>都变成了柔软的星尘，风一吹，就散开了。",
            "连那只吵闹的绿鸟，都被关在了云层外面，<br>再也吵不到你。",
            "车轮压过星轨的声音极其规律，<br>你的呼吸，也变得越来越绵长。",
            "不要抗拒这种下坠的感觉，<br>这就是梦境在向你招手。",
            "明天的事情，交给明天的你去操心。",
            "现在，闭上眼睛，<br>跟着列车，滑进最香甜的梦里。",
            "晚安，宝。<br>一直陪着你。🌙"
        ];

        let currentIndex = -1;
        let isTransitioning = false;
        const textElement = document.getElementById('story-text');
        const progressContainer = document.getElementById('progress');
        const hintElement = document.getElementById('hint');

        // Initialize progress dots
        function initProgress() {
            for (let i = 0; i < storyChunks.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.id = `dot-${i}`;
                progressContainer.appendChild(dot);
            }
        }

        // Generate random stars
        function generateStars() {
            const container = document.getElementById('stars-container');
            const numStars = 100;
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                // Random position
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                // Random size (1px to 3px)
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                // Random animation delay and duration
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                container.appendChild(star);
            }
        }

        // Advance to the next story chunk
        function advanceStory() {
            if (isTransitioning) return;
            
            // If we reached the end, just return (let them sleep!)
            if (currentIndex >= storyChunks.length - 1) {
                hintElement.style.opacity = '0'; // Hide hint at the end
                return;
            }

            isTransitioning = true;
            currentIndex++;

            // Hide current text
            textElement.classList.remove('visible');

            // Update active dot
            document.querySelectorAll('.dot').forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else if (index < currentIndex) {
                    // Optional: make previous dots slightly visible
                    dot.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
                    dot.classList.remove('active');
                }
            });

            // Change hint text after first click
            if (currentIndex > 0) {
                hintElement.innerHTML = "呼吸……轻触继续";
            }
            if (currentIndex === storyChunks.length - 1) {
                hintElement.style.display = 'none';
            }

            // Wait for fade out, then update text and fade in
            setTimeout(() => {
                textElement.innerHTML = storyChunks[currentIndex];
                textElement.classList.add('visible');
                
                // Allow next click after transition finishes
                setTimeout(() => {
                    isTransitioning = false;
                }, 1500); // Wait for fade-in to complete
            }, 1000); // Wait for fade-out
        }

        // Initialize
        window.onload = () => {
            generateStars();
            initProgress();
            // Start the first slide automatically after a short delay
            setTimeout(advanceStory, 500);
        };
    </script>
</body>
</html>
