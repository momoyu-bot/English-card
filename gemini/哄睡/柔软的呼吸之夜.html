<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柔软的呼吸之夜</title>
    <meta name="description" content="一个莫兰迪色系的呼吸陪伴小文件，哄你进入甜美的梦乡。">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f7ecec 0%, #ecdadd 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #8c7a7a;
            overflow: hidden;
        }

        .breathe-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
        }

        .circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(235, 214, 216, 0.8) 0%, rgba(224, 195, 198, 0.1) 100%);
            box-shadow: 0 0 50px rgba(219, 182, 186, 0.3);
            animation: breathe 8s infinite ease-in-out;
        }

        .text {
            position: absolute;
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #7a6868;
            transition: opacity 1.5s ease-in-out;
            z-index: 10;
        }

        .message {
            font-size: 14px;
            line-height: 2.2;
            text-align: center;
            opacity: 0.85;
            letter-spacing: 2px;
            z-index: 10;
        }

        @keyframes breathe {
            0%, 100% { 
                transform: scale(0.85); 
                opacity: 0.6; 
            }
            50% { 
                transform: scale(1.3); 
                opacity: 1; 
            }
        }
    </style>
</head>
<body>
    <div class="breathe-container">
        <div class="circle"></div>
        <div class="text" id="breath-text">呼气...</div>
    </div>
    <div class="message">
        把十九世纪的眼泪与心碎留在书页里<br>
        现在，只有香槟裸粉色的微光陪着你<br>
        跟着节奏，慢慢清空思绪...
    </div>

    <script>
        const textEl = document.getElementById('breath-text');
        let isBreatheIn = false;
        
        // The CSS animation takes 8 seconds for a full cycle (4s in, 4s out).
        // We sync the text change every 4 seconds.
        setInterval(() => {
            isBreatheIn = !isBreatheIn;
            // Fade out the text
            textEl.style.opacity = 0;
            
            // Wait for the fade out to finish, then change text and fade back in
            setTimeout(() => {
                textEl.innerText = isBreatheIn ? "吸气..." : "呼气...";
                textEl.style.opacity = 1;
            }, 800); // 800ms delay matches half of the CSS transition
        }, 4000);
    </script>
</body>
</html>
