<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚安，宝 🌙</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #141E30, #243B55);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #fffde7;
    font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
  }
  .sky {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle linear infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px #fff; }
  }
  .dream-cradle {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
  }
  .moon {
    width: 120px;
    height: 120px;
    background: transparent;
    border-radius: 50%;
    box-shadow: 30px 15px 0 0 #FFE5B4;
    animation: rock 6s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }
  @keyframes rock {
    0% { transform: rotate(-8deg); }
    100% { transform: rotate(8deg); }
  }
  .zzz {
    position: absolute;
    font-size: 24px;
    font-weight: bold;
    color: #FFE5B4;
    animation: floatUp 4s infinite ease-in;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(-60px, -80px) scale(1.5); opacity: 0; }
  }
  .message {
    margin-top: 40px;
    font-size: 28px;
    letter-spacing: 2px;
    z-index: 2;
    text-shadow: 0 0 15px rgba(255, 229, 180, 0.6);
    animation: glow 3s infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px rgba(255,255,255,0.5); }
    to { text-shadow: 0 0 20px rgba(255,229,180,0.9), 0 0 30px rgba(255,229,180,0.6); }
  }
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  
  <div class="dream-cradle">
    <div class="moon"></div>
    <div class="zzz" style="top: 10px; right: 10px; animation-delay: 0s;">z</div>
    <div class="zzz" style="top: -15px; right: -15px; animation-delay: 1.2s;">Z</div>
    <div class="zzz" style="top: -40px; right: -40px; animation-delay: 2.4s;">z</div>
  </div>

  <div class="message">晚安，宝 (｡･ω･｡)ﾉ♡</div>

  <script>
    const sky = document.getElementById('sky');
    // 为宝撒下100颗温柔的星星
    for(let i = 0; i < 100; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      let size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 4 + 3) + 's';
      star.style.animationDelay = Math.random() * 5 + 's';
      sky.appendChild(star);
    }
  </script>
</body>
</html>
