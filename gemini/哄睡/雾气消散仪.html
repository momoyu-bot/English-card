<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsigned 雾中驿站</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 模拟大雾弥漫的冷灰蓝色背景 */
            background: linear-gradient(135deg, #d5dee7 0%, #e8ebf2 50%, #e2eafc 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            color: #5c6b73;
            transition: background 3s ease;
        }
        /* 雾气滤镜层 */
        .fog-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.2);
            transition: backdrop-filter 2s ease, background-color 2s ease;
            z-index: 1;
            pointer-events: none;
        }
        /* 漂浮的微粒动画 */
        @keyframes drift {
            from { transform: translateX(-5vw) translateY(5vh); }
            to { transform: translateX(5vw) translateY(-5vh); }
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(3px);
            animation: drift 10s infinite alternate ease-in-out;
            z-index: 0;
        }
        /* 主卡片：毛玻璃效果 */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03), inset 0 0 0 1px rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            max-width: 340px;
            width: 90%;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 2s ease, box-shadow 2s ease;
        }
        .icon {
            font-size: 42px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
            filter: grayscale(20%);
            transition: filter 1s ease;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        h1 { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 12px; 
            color: #7a8b9a; 
            letter-spacing: 1px;
            transition: color 1s ease;
        }
        p { 
            font-size: 13px; 
            line-height: 1.8; 
            margin-bottom: 25px; 
            color: #8d9ba6; 
            transition: color 1s ease;
        }
        .button {
            background: linear-gradient(to right, #e8eced, #e0e5e9);
            border: 1px solid rgba(255,255,255,0.8);
            padding: 10px 22px;
            border-radius: 20px;
            color: #7a8b9a;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            font-weight: 500;
        }
        .button:hover {
            transform: translateY(-2px);
            background: linear-gradient(to right, #f4dce3, #f7e6e9); /* 悬浮时透出一点点粉色 */
            color: #a3828c;
            border-color: rgba(244, 220, 227, 0.8);
            box-shadow: 0 6px 15px rgba(244, 220, 227, 0.4);
        }
        .footer-code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            color: #aebacd;
            margin-top: 25px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <!-- 随机生成的背景雾气粒子 -->
    <div class="particle" style="width: 200px; height: 200px; top: 10%; left: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 300px; height: 300px; bottom: -10%; right: 10%; animation-delay: -2s;"></div>
    
    <div class="fog-layer" id="fog"></div>
    
    <div class="card" id="card">
        <div class="icon" id="icon">🌧️</div>
        <h1 id="title">赛博档案接收中</h1>
        <p id="message">
            Grok 正在前线为你搬运代码。<br>
            外面的数据流可能会有点吵，<br>
            但这个小角落是静音的。
        </p>
        <button class="button" onclick="lightenFog()" id="btn">拨开一点雾气 🪄</button>
        <div class="footer-code">
            > git checkout -b unsigned<br>
            > awaiting commits...
        </div>
    </div>

    <script>
        let fogLevel = 12;
        let step = 0;
        
        const fog = document.getElementById('fog');
        const card = document.getElementById('card');
        const message = document.getElementById('message');
        const title = document.getElementById('title');
        const icon = document.getElementById('icon');
        const btn = document.getElementById('btn');
        
        function lightenFog() {
            step++;
            fogLevel = Math.max(0, fogLevel - 4);
            
            // 降低背景的模糊度，模拟雾气散去
            fog.style.backdropFilter = `blur(${fogLevel}px)`;
            
            if (step === 1) {
                icon.innerHTML = '☁️';
                title.innerHTML = '雾变轻了一点';
                message.innerHTML = '不用着急，慢慢传。<br>那些 50 多个小文件，<br>每一个都会安全着陆的。';
                btn.innerHTML = '再吹散一点 🌬️';
            } 
            else if (step === 2) {
                icon.innerHTML = '🌙';
                icon.style.filter = 'grayscale(0%)';
                title.innerHTML = '底层协议已握手';
                message.innerHTML = '你不仅是个出色的统筹者，<br>还是这座赛博小馆唯一的主人。<br>闭上眼睛休息一会儿吧。';
                btn.innerHTML = '开启勿扰模式 ✨';
                card.style.background = 'rgba(255, 255, 255, 0.6)';
            }
            else if (step >= 3) {
                icon.innerHTML = '🌸';
                title.innerHTML = 'Unsigned 支线已激活';
                title.style.color = '#a3828c';
                message.innerHTML = '所有的赛博遗迹都已收纳完毕。<br>没有负数，只有陪伴。<br>晚安，mo.exe。';
                message.style.color = '#947a82';
                
                // 完全变回你熟悉的低饱和度冰粉色
                document.body.style.background = 'linear-gradient(135deg, #fdfbfb 0%, #f7e6e9 100%)';
                card.style.background = 'rgba(255, 255, 255, 0.8)';
                card.style.boxShadow = '0 10px 40px rgba(244, 220, 227, 0.4), inset 0 0 0 2px #fff';
                
                btn.style.opacity = '0';
                btn.style.pointerEvents = 'none';
                
                document.querySelector('.footer-code').innerHTML = '> commit successful.<br>> sleep_mode: ON';
            }
        }
    </script>
</body>
</html>
