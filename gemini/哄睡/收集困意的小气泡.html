<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>收集困意的小气泡</title>
<meta name="description" content="慢 下 来...戳一戳飘上来的小气泡，我在这里陪着你，慢慢酝酿睡意。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* 温暖又深邃的夜空渐变色 */
            background: linear-gradient(to bottom, #111827, #31132e);
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none; /* 防止手机端误触滑动和缩放 */
            margin: 0;
            height: 100vh;
            color: #fce7f3;
        }

        /* 气泡缓慢上升的动画 */
        @keyframes floatUp {
            0% { 
                transform: translateY(100vh) scale(0.8) rotate(0deg); 
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% { 
                transform: translateY(-20vh) scale(1.2) rotate(30deg); 
                opacity: 0;
            }
        }

        /* 气泡被戳破时的温柔消散动画 */
        @keyframes dissolve {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 1; filter: blur(2px); }
            100% { transform: scale(2); opacity: 0; filter: blur(5px); }
        }

        /* 柔和的呼吸光晕 */
        @keyframes softPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), rgba(255, 182, 193, 0.1));
            box-shadow: 0 0 15px rgba(255, 192, 203, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .bubble-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .dissolving {
            animation: dissolve 1s ease-out forwards !important;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
            box-shadow: none;
        }

        .dissolving .bubble-text {
            opacity: 1;
        }

        .message-fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .message-fade-active {
            opacity: 1;
            transform: translateY(0);
            transition: all 1s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between py-12 relative">

    <!-- 顶部轻柔的标题 -->
    <div class="z-10 text-center mt-8">
        <h1 class="text-xl tracking-widest font-light text-pink-200/80" style="animation: softPulse 4s infinite ease-in-out;">
            慢 下 来...
        </h1>
        <p class="text-xs text-pink-200/50 mt-2 tracking-wide">戳一戳飘上来的小气泡</p>
    </div>

    <!-- 气泡容器 -->
    <div id="bubble-container" class="absolute inset-0 pointer-events-none"></div>

    <!-- 底部陪伴语录 -->
    <div class="z-10 w-full px-8 text-center mb-10 h-20 flex items-center justify-center">
        <p id="comfort-message" class="text-lg font-light text-pink-100/90 tracking-wide transition-all duration-1000">
            我在这里陪着你，慢慢酝酿睡意。
        </p>
    </div>

    <script>
        const container = document.getElementById('bubble-container');
        const messageBox = document.getElementById('comfort-message');

        // 戳破气泡时显现的短语
        const softWords = ["软乎乎", "贴贴", "抱抱", "晚安", "困~", "摸摸头", "沉下去", "星星", "云朵", "乖~"];
        
        // 底部更新的安抚长句
        const comfortMessages = [
            "气泡破掉的声音，像不像我在亲你的额头？",
            "不用急，睡意会像这些气泡一样慢慢浮上来的。",
            "把今天所有的笑闹都装进气泡里，飘走啦。",
            "肩膀再放松一点，对，往下沉...",
            "我就在屏幕这头，看着你慢慢变软。",
            "深呼吸，吸气...呼气...",
            "乖，什么都不要想了，把脑袋清空。",
            "夜深了，我的宝该睡觉了哦。",
            "感受一下被子是不是很暖和？",
            "一点一点，慢慢掉进软绵绵的梦里吧..."
        ];

        let messageIndex = 0;

        // 创建气泡的函数
        function createBubble() {
            const bubble = document.createElement('div');
            
            // 随机大小 (60px 到 120px)
            const size = Math.random() * 60 + 60;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            // 随机水平位置 (10% 到 90%)
            const left = Math.random() * 80 + 10;
            bubble.style.left = `${left}%`;
            
            // 随机动画时长 (8秒 到 15秒，非常缓慢)
            const duration = Math.random() * 7 + 8;
            bubble.style.animation = `floatUp ${duration}s linear forwards`;
            
            // 开启指针事件，允许点击
            bubble.style.pointerEvents = 'auto';
            bubble.className = 'bubble';

            // 气泡内部的文字（默认隐藏，戳破时显示）
            const word = document.createElement('span');
            word.className = 'bubble-text';
            word.innerText = softWords[Math.floor(Math.random() * softWords.length)];
            bubble.appendChild(word);

            // 点击气泡的交互
            bubble.onclick = () => {
                if (bubble.classList.contains('dissolving')) return;
                
                // 触发消散动画
                bubble.classList.add('dissolving');
                
                // 更新底部安抚语录
                updateMessage();

                // 动画结束后移除 DOM 节点
                setTimeout(() => {
                    if(bubble.parentNode) bubble.remove();
                }, 1000);
            };

            container.appendChild(bubble);

            // 如果气泡飘出屏幕外没有被点击，自动移除
            setTimeout(() => {
                if(bubble.parentNode) bubble.remove();
            }, duration * 1000);
        }

        // 更新底部文字
        function updateMessage() {
            // 淡出
            messageBox.style.opacity = 0;
            messageBox.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                // 随机选一句，避免连续重复
                let nextMsg;
                do {
                    nextMsg = comfortMessages[Math.floor(Math.random() * comfortMessages.length)];
                } while (nextMsg === messageBox.innerText);
                
                messageBox.innerText = nextMsg;
                
                // 淡入
                messageBox.style.opacity = 1;
                messageBox.style.transform = 'translateY(0)';
            }, 800);
        }

        // 缓慢而有节奏地生成气泡
        // 初始生成几个
        for(let i=0; i<3; i++) {
            setTimeout(createBubble, i * 1500);
        }

        // 之后每隔 2.5 秒生成一个，保持屏幕上总有几个缓慢漂浮的气泡
        setInterval(createBubble, 2500);

    </script>
</body>
</html>
