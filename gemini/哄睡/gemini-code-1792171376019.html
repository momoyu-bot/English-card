<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>枕边晚安专线</title>
<meta name="description" content="拨通枕边的低饱和度梦境专线，听着轻柔雨声与慢速八音盒，在温声耳语里慢慢沉入睡眠。">
<style>
  :root {
    --bg-deep: #17161F;
    --bg-mid: #211E2B;
    --glass-bg: rgba(255, 248, 246, 0.055);
    --glass-border: rgba(226, 206, 210, 0.14);
    --glass-active: rgba(216, 178, 186, 0.16);
    --text-main: #E6DFE2;
    --text-soft: #B4A8B0;
    --text-muted: #7C727A;
    --accent-pink: #CCA8B0;
    --accent-champagne: #DFD3C8;
    --accent-lavender: #ABA4BE;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body, html {
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 60%, #1C1924 100%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
    transition: filter 1.2s ease, background 1.2s ease;
  }

  /* 稀疏护眼星点（严格限制16颗，无拖尾） */
  .sky-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--accent-champagne);
    opacity: 0.25;
    animation: twinkle var(--dur, 6s) ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.12; transform: scale(0.85); }
    100% { opacity: 0.55; transform: scale(1.1); }
  }

  /* 主容器 */
  .app-wrap {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 24px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 顶部电话状态栏 */
  .call-header {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .caller-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-pink);
    box-shadow: 0 0 12px var(--accent-pink);
    animation: softPulse 3s ease-in-out infinite;
  }

  @keyframes softPulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 0.95; transform: scale(1.15); }
  }

  .caller-title {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--text-main);
  }

  .caller-sub {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .call-timer {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--accent-champagne);
    background: rgba(255, 255, 255, 0.04);
    padding: 5px 11px;
    border-radius: 99px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  /* 枕边悄悄话卡片 */
  .whisper-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 22px 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 162px;
    justify-content: space-between;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .whisper-card:active {
    background: rgba(255, 248, 246, 0.08);
  }

  .whisper-tag {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--accent-pink);
    letter-spacing: 0.5px;
  }

  .whisper-text {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-main);
    letter-spacing: 0.4px;
    min-height: 54px;
    transition: opacity 0.4s ease;
  }

  .whisper-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    padding-top: 10px;
  }

  .whisper-btn {
    color: var(--accent-champagne);
    background: rgba(223, 211, 200, 0.08);
    padding: 4px 12px;
    border-radius: 99px;
    font-size: 12px;
  }

  /* 助眠声景面板 */
  .section-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 18px 20px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 14px;
    color: var(--text-soft);
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .timer-pills {
    display: flex;
    gap: 6px;
  }

  .pill-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-soft);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .pill-btn.active {
    background: var(--glass-active);
    border-color: var(--accent-pink);
    color: var(--text-main);
  }

  .sound-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .sound-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 18px;
    padding: 14px 10px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .sound-item.active {
    background: var(--glass-active);
    border-color: rgba(204, 168, 176, 0.45);
    box-shadow: 0 4px 20px rgba(204, 168, 176, 0.08);
  }

  .sound-icon {
    font-size: 22px;
    line-height: 1;
    filter: saturate(0.75);
  }

  .sound-name {
    font-size: 13px;
    color: var(--text-main);
  }

  .sound-status {
    font-size: 11px;
    color: var(--text-muted);
  }

  .sound-item.active .sound-status {
    color: var(--accent-pink);
  }

  .volume-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-pink);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(204, 168, 176, 0.5);
  }

  /* 双栏：呼吸球 & 攒困意小云朵 */
  .dual-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .mini-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 176px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .mini-title {
    font-size: 12px;
    color: var(--text-soft);
    align-self: flex-start;
  }

  /* 呼吸球 */
  .breath-orb-wrap {
    position: relative;
    width: 82px;
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 6px 0;
  }

  .breath-orb {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #E5C8CE, #9E7B86);
    opacity: 0.75;
    box-shadow: 0 0 24px rgba(204, 168, 176, 0.35);
    transition: transform 0.6s ease, opacity 0.6s ease;
  }

  .breath-ring {
    position: absolute;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 1px dashed rgba(204, 168, 176, 0.3);
  }

  .mini-hint {
    font-size: 12px;
    color: var(--accent-champagne);
    text-align: center;
    min-height: 18px;
  }

  /* 软云朵戳戳 */
  .cloud-stage {
    width: 100%;
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .sleepy-cloud {
    font-size: 36px;
    filter: drop-shadow(0 4px 12px rgba(255,255,255,0.08));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .sleepy-cloud:active {
    transform: scale(0.84);
  }

  .float-plus {
    position: absolute;
    font-size: 11px;
    color: var(--accent-pink);
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
  }

  @keyframes floatUp {
    0% { opacity: 0.95; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-28px); }
  }

  /* 底部熄屏伴睡按钮 */
  .night-mode-btn {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    padding: 13px 20px;
    color: var(--text-soft);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }

  .night-mode-btn:active {
    background: var(--glass-active);
  }

  /* 极暗熄屏遮罩 */
  .dim-overlay {
    position: fixed;
    inset: 0;
    background: #09080C;
    z-index: 99;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }

  .dim-overlay.active {
    opacity: 0.96;
    pointer-events: auto;
  }

  .dim-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-pink);
    opacity: 0.35;
    animation: slowBreath 8s ease-in-out infinite;
  }

  @keyframes slowBreath {
    0%, 100% { transform: scale(0.8); opacity: 0.2; }
    50% { transform: scale(1.6); opacity: 0.55; }
  }

  .dim-text {
    font-size: 12px;
    color: #564E58;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<!-- 稀疏星点背景（16颗） -->
<div class="sky-layer" id="skyLayer"></div>

<div class="app-wrap">
  <!-- 顶部通话状态 -->
  <div class="call-header">
    <div class="caller-info">
      <div class="pulse-dot"></div>
      <div>
        <div class="caller-title">📞 枕边晚安专线 · 通话中</div>
        <div class="caller-sub" id="subStatus">信号满格 · 我在听着呢，宝</div>
      </div>
    </div>
    <div class="call-timer" id="callTimer">00:00</div>
  </div>

  <!-- 枕边悄悄话卡片 -->
  <div class="whisper-card" id="whisperCard">
    <div class="whisper-tag">
      <span id="whisperTitle">✦ 枕边耳语 · 01</span>
      <span>轻点卡片换一句</span>
    </div>
    <div class="whisper-text" id="whisperText">
      把手机搁在枕头边就好，不用回消息，也不用想明天的事。被子已经把所有的忙碌都挡在外面啦，宝只管找个最舒服的姿势陷进去。
    </div>
    <div class="whisper-footer">
      <span id="whisperHint">声音已调至最低柔雾档</span>
      <span class="whisper-btn">下一句 ↻</span>
    </div>
  </div>

  <!-- 助眠白噪音与八音盒 -->
  <div class="section-card">
    <div class="section-header">
      <span class="section-title">🎧 枕边助眠声景（可叠加）</span>
      <div class="timer-pills">
        <button class="pill-btn" data-min="15">15分</button>
        <button class="pill-btn" data-min="30">30分</button>
        <button class="pill-btn active" data-min="0">常伴</button>
      </div>
    </div>

    <div class="sound-grid">
      <div class="sound-item" data-sound="rain">
        <div class="sound-icon">🌧️</div>
        <div class="sound-name">窗外细雨</div>
        <div class="sound-status">轻点开启</div>
      </div>
      <div class="sound-item" data-sound="waves">
        <div class="sound-icon">🌊</div>
        <div class="sound-name">暖夜潮汐</div>
        <div class="sound-status">轻点开启</div>
      </div>
      <div class="sound-item" data-sound="musicbox">
        <div class="sound-icon">🎠</div>
        <div class="sound-name">慢八音盒</div>
        <div class="sound-status">轻点开启</div>
      </div>
    </div>

    <div class="volume-row">
      <span>柔音</span>
      <input type="range" id="masterVol" min="0.05" max="1" step="0.01" value="0.45">
      <span id="timerDisplay">伴睡中</span>
    </div>
  </div>

  <!-- 双栏小互动：4-7-8呼吸球 & 攒困意云朵 -->
  <div class="dual-grid">
    <!-- 呼吸球 -->
    <div class="mini-card" id="breathCard">
      <div class="mini-title">🫧 4-7-8 助眠呼吸</div>
      <div class="breath-orb-wrap">
        <div class="breath-ring"></div>
        <div class="breath-orb" id="breathOrb"></div>
      </div>
      <div class="mini-hint" id="breathText">轻点跟随呼吸</div>
    </div>

    <!-- 拍拍软云朵 -->
    <div class="mini-card" id="cloudCard">
      <div class="mini-title">☁️ 拍拍软云攒困意</div>
      <div class="cloud-stage" id="cloudStage">
        <div class="sleepy-cloud" id="cloudIcon">☁️</div>
      </div>
      <div class="mini-hint" id="cloudCountText">困意值：0 朵</div>
    </div>
  </div>

  <!-- 熄屏极暗模式按钮 -->
  <div class="night-mode-btn" id="dimBtn">
    🌙 开启「极暗熄屏伴睡」（只留声音与微光）
  </div>
</div>

<!-- 极暗护眼层 -->
<div class="dim-overlay" id="dimOverlay">
  <div class="dim-dot"></div>
  <div class="dim-text">正在电话那头守着宝睡觉 · 轻触屏幕任意处唤醒</div>
</div>

<script>
  // 1. 生成16颗柔和呼吸星点（无拖尾、不密集）
  const skyLayer = document.getElementById('skyLayer');
  for (let i = 0; i < 16; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = (Math.random() * 2.2 + 1.5).toFixed(1);
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.left = `${(Math.random() * 92 + 4).toFixed(1)}%`;
    star.style.top = `${(Math.random() * 88 + 4).toFixed(1)}%`;
    star.style.setProperty('--dur', `${(Math.random() * 4 + 4).toFixed(1)}s`);
    star.style.animationDelay = `${(Math.random() * 5).toFixed(1)}s`;
    skyLayer.appendChild(star);
  }

  // 2. 通话计时器
  let callSeconds = 0;
  const callTimerEl = document.getElementById('callTimer');
  setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    callTimerEl.textContent = `${m}:${s}`;
  }, 1000);

  // 3. 枕边耳语与睡前小碎片库
  const whispers = [
    {
      title: "✦ 枕边耳语 · 01",
      text: "把手机搁在枕头边就好，不用回消息，也不用想明天的事。被子已经把所有的忙碌都挡在外面啦，宝只管找个最舒服的姿势陷进去。"
    },
    {
      title: "✦ 云朵烘培店 · 02",
      text: "月亮今晚在烤一种没有甜腻奶油的清香舒芙蕾，烤好之后全部变成软绵绵的夜雾铺在窗台上了。吸一口气，连呼吸都是暖乎乎的。"
    },
    {
      title: "✦ 枕边耳语 · 03",
      text: "眼皮沉一点也没关系，手松开一点也没关系。电话一直通着呢，就算宝睡着了呼吸变慢，我也会安安静静替你把被角看好的。"
    },
    {
      title: "✦ 夜行列车 · 04",
      text: "想象自己坐在一节只有你一个人的复古软卧车厢里，窗外是深蓝色的树影和远处的星光，铁轨发出极轻的咔哒声，摇着摇着就到了梦境站。"
    },
    {
      title: "✦ 小猫打盹 · 05",
      text: "炉火边的小暹罗猫已经把爪子揣进肚皮底下，耳朵尖抖了一下，发出一串极轻的呼噜声。它往宝的枕边挪了挪，分了你一半暖意。"
    },
    {
      title: "✦ 枕边耳语 · 06",
      text: "今天大脑已经运转了很久啦，现在可以把所有待办都放进抽屉锁起来。肩膀往下沉一厘米，眉头松开，晚安呀，我的宝。"
    },
    {
      title: "✦ 星河标本 · 07",
      text: "夜空把最吵闹的光都关掉了，只留下十几颗灰粉和香槟色的小星星，像书页里夹着的干花一样安静。闭上眼，它们就在眼皮底下轻轻晃。"
    },
    {
      title: "✦ 枕边耳语 · 08",
      text: "不用努力逼自己睡着，闭着眼睛发呆也是在休息。就当是在温水里漂浮着，哪怕只是听着雨声发一会儿呆，身体也会慢慢变轻的。"
    }
  ];

  let whisperIdx = 0;
  const whisperCard = document.getElementById('whisperCard');
  const whisperTitle = document.getElementById('whisperTitle');
  const whisperText = document.getElementById('whisperText');

  whisperCard.addEventListener('click', () => {
    playSoftChime(392); // G4 轻柔木音
    whisperText.style.opacity = '0';
    setTimeout(() => {
      whisperIdx = (whisperIdx + 1) % whispers.length;
      whisperTitle.textContent = whispers[whisperIdx].title;
      whisperText.textContent = whispers[whisperIdx].text;
      whisperText.style.opacity = '1';
    }, 260);
  });

  // 4. Web Audio API 合成器（无需外部音频，纯本地柔和声景）
  let audioCtx = null;
  let masterGain = null;
  const activeNodes = { rain: null, waves: null, musicbox: null };
  let musicBoxInterval = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseFloat(document.getElementById('masterVol').value);
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 轻柔提示木琴音
  function playSoftChime(freq = 440) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.25);
  }

  // 窗外细雨（柔和粉红/棕噪音滤波）
  function toggleRain(enable) {
    initAudio();
    if (!enable && activeNodes.rain) {
      activeNodes.rain.gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
      setTimeout(() => {
        if (activeNodes.rain) {
          activeNodes.rain.source.stop();
          activeNodes.rain = null;
        }
      }, 650);
      return;
    }
    if (enable && !activeNodes.rain) {
      const bufferSize = audioCtx.sampleRate * 3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        data[i] = (lastOut + (0.035 * white)) / 1.035;
        lastOut = data[i];
        data[i] *= 1.8;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 680; // 滤除刺耳高频，保留温暖雨声

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 1.2);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start();
      activeNodes.rain = { source: noise, gain };
    }
  }

  // 暖夜潮汐（慢呼吸滤波海浪）
  function toggleWaves(enable) {
    initAudio();
    if (!enable && activeNodes.waves) {
      activeNodes.waves.gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
      setTimeout(() => {
        if (activeNodes.waves) {
          activeNodes.waves.source.stop();
          activeNodes.waves.lfo.stop();
          activeNodes.waves = null;
        }
      }, 650);
      return;
    }
    if (enable && !activeNodes.waves) {
      const bufferSize = audioCtx.sampleRate * 4;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + white * 0.029;
        b1 = 0.985 * b1 + white * 0.032;
        b2 = 0.950 * b2 + white * 0.048;
        data[i] = b0 + b1 + b2;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 320;

      // 用 LFO 模拟缓慢潮汐起伏 (约9秒一次呼吸)
      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.11;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 180;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.32, audioCtx.currentTime + 1.5);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start();
      lfo.start();
      activeNodes.waves = { source: noise, lfo, gain };
    }
  }

  // 慢速发条八音盒（五声音阶柔和摇篮曲）
  const lullabyNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C4 D4 E4 G4 A4 C5
  function playMusicBoxNote() {
    if (!activeNodes.musicbox || !audioCtx) return;
    const freq = lullabyNotes[Math.floor(Math.random() * lullabyNotes.length)];
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const subOsc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    subOsc.type = 'triangle';
    subOsc.frequency.setValueAtTime(freq * 2, now);

    const subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(0.03, now);
    subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.11, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + 3.2);

    osc.connect(gain);
    subOsc.connect(subGain);
    subGain.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    subOsc.start(now);
    osc.stop(now + 3.3);
    subOsc.stop(now + 3.3);
  }

  function toggleMusicBox(enable) {
    initAudio();
    if (!enable) {
      activeNodes.musicbox = null;
      if (musicBoxInterval) clearInterval(musicBoxInterval);
      musicBoxInterval = null;
      return;
    }
    if (enable && !activeNodes.musicbox) {
      activeNodes.musicbox = true;
      playMusicBoxNote();
      musicBoxInterval = setInterval(() => {
        if (Math.random() > 0.2) playMusicBoxNote();
      }, 2400);
    }
  }

  // 绑定声音按钮事件
  document.querySelectorAll('.sound-item').forEach(item => {
    item.addEventListener('click', () => {
      const type = item.dataset.sound;
      const isActivating = !item.classList.contains('active');
      item.classList.toggle('active', isActivating);
      item.querySelector('.sound-status').textContent = isActivating ? '正在轻响' : '轻点开启';

      if (type === 'rain') toggleRain(isActivating);
      if (type === 'waves') toggleWaves(isActivating);
      if (type === 'musicbox') toggleMusicBox(isActivating);
    });
  });

  // 音量滑块
  document.getElementById('masterVol').addEventListener('input', (e) => {
    if (masterGain && audioCtx) {
      masterGain.gain.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.1);
    }
  });

  // 5. 睡眠定时渐弱功能
  let sleepCountdown = null;
  let remainingSeconds = 0;
  const timerDisplay = document.getElementById('timerDisplay');

  document.querySelectorAll('.pill-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const mins = parseInt(btn.dataset.min, 10);

      if (sleepCountdown) clearInterval(sleepCountdown);
      if (mins === 0) {
        timerDisplay.textContent = '伴睡中';
        return;
      }

      remainingSeconds = mins * 60;
      updateTimerLabel();
      sleepCountdown = setInterval(() => {
        remainingSeconds--;
        if (remainingSeconds <= 30 && masterGain && audioCtx) {
          // 最后30秒温柔渐弱至静音
          const curVol = parseFloat(document.getElementById('masterVol').value);
          masterGain.gain.setTargetAtTime((remainingSeconds / 30) * curVol, audioCtx.currentTime, 0.2);
        }
        if (remainingSeconds <= 0) {
          clearInterval(sleepCountdown);
          toggleRain(false);
          toggleWaves(false);
          toggleMusicBox(false);
          document.querySelectorAll('.sound-item').forEach(el => {
            el.classList.remove('active');
            el.querySelector('.sound-status').textContent = '已轻柔停下';
          });
          timerDisplay.textContent = '晚安好梦';
        } else {
          updateTimerLabel();
        }
      }, 1000);
    });
  });

  function updateTimerLabel() {
    const m = Math.floor(remainingSeconds / 60);
    const s = String(remainingSeconds % 60).padStart(2, '0');
    timerDisplay.textContent = `${m}:${s}后渐弱`;
  }

  // 6. 4-7-8 助眠呼吸球
  let breathActive = false;
  let breathTimers = [];
  const breathCard = document.getElementById('breathCard');
  const breathOrb = document.getElementById('breathOrb');
  const breathText = document.getElementById('breathText');

  function clearBreathTimers() {
    breathTimers.forEach(t => clearTimeout(t));
    breathTimers = [];
  }

  function runBreathCycle() {
    if (!breathActive) return;
    // 吸气 4秒
    breathText.textContent = '鼻吸气 · 4秒';
    breathOrb.style.transition = 'transform 4s ease-in-out, opacity 4s ease-in-out';
    breathOrb.style.transform = 'scale(1.48)';
    breathOrb.style.opacity = '0.95';

    // 屏息 7秒
    breathTimers.push(setTimeout(() => {
      if (!breathActive) return;
      breathText.textContent = '轻屏息 · 7秒';
    }, 4000));

    // 呼气 8秒
    breathTimers.push(setTimeout(() => {
      if (!breathActive) return;
      breathText.textContent = '慢呼气 · 8秒';
      breathOrb.style.transition = 'transform 8s ease-in-out, opacity 8s ease-in-out';
      breathOrb.style.transform = 'scale(0.82)';
      breathOrb.style.opacity = '0.45';
    }, 11000));

    // 循环 (4+7+8 = 19秒)
    breathTimers.push(setTimeout(() => {
      if (breathActive) runBreathCycle();
    }, 19000));
  }

  breathCard.addEventListener('click', () => {
    breathActive = !breathActive;
    clearBreathTimers();
    if (breathActive) {
      playSoftChime(329.63);
      runBreathCycle();
    } else {
      breathOrb.style.transition = 'transform 0.6s ease, opacity 0.6s ease';
      breathOrb.style.transform = 'scale(1)';
      breathOrb.style.opacity = '0.75';
      breathText.textContent = '轻点跟随呼吸';
    }
  });

  // 7. 拍拍软云攒困意
  let sleepyCount = 0;
  const cloudCard = document.getElementById('cloudCard');
  const cloudStage = document.getElementById('cloudStage');
  const cloudCountText = document.getElementById('cloudCountText');
  const cloudIcons = ['☁️', '🫧', '🐑', '🌙', '🐾'];
  const cloudIconEl = document.getElementById('cloudIcon');
  const softNotes = [261.63, 293.66, 329.63, 392.00];

  cloudCard.addEventListener('click', (e) => {
    sleepyCount++;
    playSoftChime(softNotes[sleepyCount % softNotes.length]);

    if (sleepyCount % 5 === 0) {
      cloudIconEl.textContent = cloudIcons[(sleepyCount / 5) % cloudIcons.length];
    }

    const plus = document.createElement('div');
    plus.className = 'float-plus';
    plus.textContent = sleepyCount % 3 === 0 ? '哈欠 +1…' : '困意 +1…';
    plus.style.left = `${30 + Math.random() * 35}%`;
    plus.style.top = '28px';
    cloudStage.appendChild(plus);
    setTimeout(() => plus.remove(), 950);

    if (sleepyCount < 10) {
      cloudCountText.textContent = `困意值：${sleepyCount} 朵`;
    } else if (sleepyCount < 20) {
      cloudCountText.textContent = `眼皮变沉啦 (${sleepyCount})`;
    } else {
      cloudCountText.textContent = `随时可以睡着啦 (${sleepyCount})`;
    }
  });

  // 8. 极暗熄屏伴睡模式
  const dimBtn = document.getElementById('dimBtn');
  const dimOverlay = document.getElementById('dimOverlay');

  dimBtn.addEventListener('click', () => {
    dimOverlay.classList.add('active');
  });

  dimOverlay.addEventListener('click', () => {
    dimOverlay.classList.remove('active');
  });
</script>
</body>
</html>
