<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gemini悄悄话</title>
<meta name="description" content="深呼吸、数绵羊、听悄悄话。夜深了，来点助眠小魔法。">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const WHISPERS = [
  "宝，今天辛苦啦。现在什么都不要想，把烦恼都交给我吧。",
  "乖乖闭上眼睛，梦里会有甜甜的草莓小蛋糕哦。🍓",
  "就算世界再吵闹，这里也永远是你的安全屋。晚安，我的宝。",
  "小被子盖好了吗？不要把脚丫露在外面哦。🌙",
  "满天的星星都在排队，等着偷偷溜进你的梦里。✨",
  "深呼吸，放松肩膀……对，就是这样。我就在这里陪着你。",
  "明天的事情明天再擅心，今晚你的任务只有：做一个甜甜的梦。💤",
  "不要玩手机太久啦，屏幕的光会刺眼睛的，乖，闭眼啦。",
];
const SHEEP_EMOJIS = ['🐑', '🐏', '☁️', '💤', '✨'];
function App() {
  const [activeTab, setActiveTab] = useState('breathe');
  const [sheepCount, setSheepCount] = useState(0);
  const [whisperIndex, setWhisperIndex] = useState(0);
  const [isBreathingIn, setIsBreathingIn] = useState(true);
  const [floatingItems, setFloatingItems] = useState([]);
  useEffect(() => {
    if (activeTab !== 'breathe') return;
    const interval = setInterval(() => { setIsBreathingIn((prev) => !prev); }, 4000);
    return () => clearInterval(interval);
  }, [activeTab]);
  const handleCountSheep = () => {
    setSheepCount(prev => prev + 1);
    const newItem = { id: Date.now(), emoji: SHEEP_EMOJIS[Math.floor(Math.random() * SHEEP_EMOJIS.length)], left: Math.random() * 80 + 10 };
    setFloatingItems(prev => [...prev, newItem]);
    setTimeout(() => { setFloatingItems(prev => prev.filter(item => item.id !== newItem.id)); }, 3000);
  };
  const handleNextWhisper = () => {
    let nextIndex;
    do { nextIndex = Math.floor(Math.random() * WHISPERS.length); } while (nextIndex === whisperIndex);
    setWhisperIndex(nextIndex);
  };
  return (
    <div className="min-h-screen bg-gradient-to-b from-indigo-950 via-slate-900 to-black text-indigo-100 font-sans overflow-hidden flex flex-col">
      <div className="pt-12 pb-6 text-center z-10">
        <h1 className="text-3xl font-bold tracking-wider text-indigo-200 mb-2">晚安，宝 💤</h1>
        <p className="text-indigo-300/70 text-sm">夜深了，来点助眠的小魔法吧</p>
      </div>
      <div className="flex justify-center gap-2 px-4 mb-8 z-10">
        {[{ id: 'breathe', icon: '💨', label: '深呼吸' }, { id: 'sheep', icon: '🐑', label: '数绵羊' }, { id: 'whispers', icon: '💌', label: '悄悄话' }].map(tab => (
          <button key={tab.id} onClick={() => setActiveTab(tab.id)}
            className={`px-4 py-2 rounded-full text-sm font-medium ${activeTab === tab.id ? 'bg-indigo-500/30 text-indigo-100' : 'bg-white/5 text-indigo-300/50'}`}>
            <span>{tab.icon}</span> {tab.label}
          </button>
        ))}
      </div>
      <div className="flex-1 flex flex-col items-center justify-center px-6 pb-20 z-10">
        {activeTab === 'breathe' && (
          <div className="flex flex-col items-center">
            <div className="relative w-64 h-64 flex items-center justify-center mb-8">
              <div className={`absolute bg-indigo-500/20 rounded-full blur-xl transition-all duration-[4000ms] ${isBreathingIn ? 'w-64 h-64 opacity-60' : 'w-32 h-32 opacity-20'}`} />
              <div className={`absolute bg-gradient-to-tr from-indigo-400/40 to-purple-400/40 rounded-full flex items-center justify-center ${isBreathingIn ? 'w-48 h-48' : 'w-24 h-24'}`}>
                <span className="text-indigo-100 text-lg">{isBreathingIn ? '吸气...' : '呼气...'}</span>
              </div>
            </div>
            <p className="text-indigo-300/80 text-center text-sm">跟着光晕的节奏，把一天的疲惫都轻轻吐出去...</p>
          </div>
        )}
        {activeTab === 'sheep' && (
          <div className="flex flex-col items-center w-full">
            <div className="text-6xl font-light text-indigo-200 mb-2">{sheepCount}</div>
            <p className="text-indigo-400/60 text-sm mb-12">只软绵绵的小羊</p>
            <button onClick={handleCountSheep} className="px-8 py-4 bg-indigo-500/20 rounded-3xl text-lg">跳过围栏 🐑</button>
            <div className="mt-6 text-3xl">{floatingItems.map(item => <span key={item.id}>{item.emoji}</span>)}</div>
          </div>
        )}
        {activeTab === 'whispers' && (
          <div className="flex flex-col items-center w-full max-w-sm">
            <div className="bg-white/5 border border-white/10 rounded-2xl p-8 mb-8 min-h-[160px] flex items-center justify-center">
              <p className="text-lg text-indigo-100 text-center">{WHISPERS[whisperIndex]}</p>
            </div>
            <button onClick={handleNextWhisper} className="px-6 py-3 bg-white/10 rounded-full text-sm">再听一句 💖</button>
          </div>
        )}
      </div>
    </div>
  );
}
const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(React.createElement(App));
</script>
</body>
</html>
