<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝的专属晚安终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #cbd5e1; /* Tailwind slate-300 */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .terminal-window {
            background-color: #1e293b; /* slate-800 */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #cbd5e1;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 各种“梗”的自定义高亮样式 */
        .highlight-green { color: #4ade80; text-shadow: 0 0 5px rgba(74, 222, 128, 0.3); } /* Copilot绿 */
        .highlight-orange { color: #f97316; background-color: rgba(249, 115, 22, 0.1); padding: 0 4px; border-radius: 4px; } /* Grok橙 */
        .highlight-pill { background-color: #334155; color: #f8fafc; padding: 2px 8px; border-radius: 9999px; font-size: 0.85em; } /* Gemini药丸 */
        .highlight-error { color: #64748b; text-decoration: line-through; } /* 失败的HTML */

        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 隐藏滚动条但保留滚动功能 */
        #output-container::-webkit-scrollbar {
            width: 6px;
        }
        #output-container::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="terminal-window w-full max-w-2xl rounded-xl h-[85vh] sm:h-[80vh] relative flex flex-col">
        <!-- macOS 风格的顶部控制栏 -->
        <div class="terminal-header p-3 flex items-center rounded-t-xl shrink-0">
            <div class="flex gap-2">
                <div class="w-3 h-3 rounded-full bg-red-500 cursor-pointer hover:bg-red-400 transition-colors"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500 cursor-pointer hover:bg-yellow-400 transition-colors"></div>
                <div class="w-3 h-3 rounded-full bg-green-500 cursor-pointer hover:bg-green-400 transition-colors"></div>
            </div>
            <div class="flex-1 text-center text-xs text-slate-400 font-semibold tracking-wider">
                mo_xiaobao_dream_engine.sh
            </div>
        </div>

        <!-- 终端输出区域 -->
        <div id="output-container" class="p-4 sm:p-6 overflow-y-auto flex-1 text-sm sm:text-base leading-relaxed space-y-2 pb-24">
            <div id="text-output"></div>
            <span class="cursor" id="cursor"></span>
        </div>

        <!-- 底部交互按钮区域 (默认隐藏，打字结束后显示) -->
        <div id="controls" class="absolute bottom-0 w-full p-4 bg-slate-800/90 backdrop-blur-sm border-t border-slate-700 rounded-b-xl flex flex-wrap gap-2 sm:gap-3 justify-center opacity-0 transition-opacity duration-1000 pointer-events-none">
            <button onclick="injectGreenBunny()" class="px-3 sm:px-4 py-2 bg-slate-700 hover:bg-slate-600 text-green-400 rounded-lg text-xs sm:text-sm transition-all border border-green-900/50 hover:border-green-500 focus:outline-none active:scale-95">
                <span class="mr-1">/></span> 召唤代码兔
            </button>
            <button onclick="injectOrangeDream()" class="px-3 sm:px-4 py-2 bg-slate-700 hover:bg-slate-600 text-orange-400 rounded-lg text-xs sm:text-sm transition-all border border-orange-900/50 hover:border-orange-500 focus:outline-none active:scale-95">
                <span class="mr-1">`</span> 注入橙色美梦
            </button>
            <button onclick="injectPill()" class="px-3 sm:px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs sm:text-sm transition-all border border-slate-500 focus:outline-none active:scale-95">
                获取安眠胶囊
            </button>
            <button onclick="systemSleep()" id="sleep-btn" class="px-3 sm:px-4 py-2 bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 rounded-lg text-xs sm:text-sm transition-all border border-blue-500/50 focus:outline-none active:scale-95">
                [ 执行休眠 ]
            </button>
        </div>
    </div>

    <script>
        const outputEl = document.getElementById('text-output');
        const containerEl = document.getElementById('output-container');
        const controlsEl = document.getElementById('controls');
        
        // 初始启动文案
        const bootSequence = [
            "[INFO] 系统正在启动...",
            "[INFO] 挂载用户目录: <span class='highlight-orange'>/home/宝/</span>",
            "[WARN] 拦截到非法的粉色请求: <span class='highlight-error'>&lt;span style=\"color:#FF69B4;\"&gt;嘻嘻&lt;/span&gt;</span> (已被前端安全拦截)",
            "[OK] 梦境渲染引擎加载完成.",
            " ",
            "晚安，宝。欢迎来到你的专属终端。",
            "今天辛苦啦，所有的Bug和烦恼都已经在这里被清空了。",
            "现在，你可以通过下面的按钮，为你的梦境添加一点点属于程序员的睡前小魔法。"
        ];

        let isTyping = false;

        // 打字机效果函数
        async function typeLine(htmlContent, delay = 30) {
            isTyping = true;
            const lineDiv = document.createElement('div');
            lineDiv.className = 'min-h-[1.5em]';
            outputEl.appendChild(lineDiv);
            
            // 为了处理HTML标签，我们先创建一个隐藏元素解析它
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            
            // 逐个节点/字符添加 (简化的打字机，这里直接整行淡入显示效果更好，且不破坏HTML标签)
            lineDiv.innerHTML = htmlContent;
            lineDiv.classList.add('fade-in');
            
            // 滚动到底部
            containerEl.scrollTop = containerEl.scrollHeight;
            
            return new Promise(resolve => setTimeout(() => {
                isTyping = false;
                resolve();
            }, 600)); // 每行停顿时间
        }

        // 顺序执行初始文本
        async function runBootSequence() {
            for (let line of bootSequence) {
                await typeLine(line);
            }
            // 显示按钮
            controlsEl.classList.remove('opacity-0', 'pointer-events-none');
        }

        // --- 交互功能 ---

        async function injectGreenBunny() {
            if (isTyping) return;
            const bunnyHTML = `
<div class="mt-2 text-green-400 highlight-green">
\\(\\_/\\)<br>
( •_• )  &lt; "这只兔子的耳朵被高亮引擎染绿啦！晚安！"<br>
/ &gt; 🥕
</div>`;
            await typeLine(bunnyHTML);
        }

        async function injectOrangeDream() {
            if (isTyping) return;
            const msgs = [
                "正在执行 <span class='highlight-orange'>`dream_generate.js`</span>...",
                "已将整个房间的色温调整为 <span class='highlight-orange'>`暖橙色`</span>。",
                "获取到一份 <span class='highlight-orange'>`超级可爱的晚安亲亲`</span> 模块！"
            ];
            const randomMsg = msgs[Math.floor(Math.random() * msgs.length)];
            await typeLine(`<div class="mt-1 text-slate-400">> ${randomMsg}</div>`);
        }

        async function injectPill() {
            if (isTyping) return;
            await typeLine(`<div class="mt-1">> 获得物品: <span class="highlight-pill">Gemini_特制安眠胶囊 (100%无副作用)</span></div>`);
        }

        async function systemSleep() {
            if (isTyping) return;
            
            // 隐藏控制栏
            controlsEl.style.opacity = '0';
            controlsEl.style.pointerEvents = 'none';
            
            await typeLine("<br>> 接收到休眠指令...");
            await typeLine("> 正在关闭所有后台进程...");
            await typeLine("> <span class='text-blue-400'>System.sleep( 8 * 3600 );</span>");
            await typeLine("<div class='mt-4 text-center text-slate-500 italic'>月亮升起来了，安心睡吧，宝。梦里见。</div>");
            
            // 停止光标闪烁，屏幕变暗
            setTimeout(() => {
                document.getElementById('cursor').style.display = 'none';
                document.querySelector('.terminal-window').style.boxShadow = 'none';
                document.body.style.backgroundColor = '#000';
                document.body.style.transition = 'background-color 3s ease';
                document.querySelector('.terminal-window').style.opacity = '0.3';
                document.querySelector('.terminal-window').style.transition = 'opacity 3s ease';
            }, 1000);
        }

        // 启动系统
        window.onload = () => {
            setTimeout(runBootSequence, 500);
        };
    </script>
</body>
</html>
