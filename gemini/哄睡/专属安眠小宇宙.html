<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专属安眠小宇宙</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
function Sparkles(props){return React.createElement('span', props, '✨');}
function Moon(props){return React.createElement('span', props, '🌙');}
function App() {
  const [stars, setStars] = useState([]);
  const [clickCount, setClickCount] = useState(0);
  const [message, setMessage] = useState("宝，点点屏幕，把今天的烦恼都变成星星吧✨");
  const [showMoon, setShowMoon] = useState(false);
  const [isFinished, setIsFinished] = useState(false);
  useEffect(() => {
    if (clickCount === 3) setMessage("对啦，慢慢来... 深吸一口气，再缓缓呼出...");
    else if (clickCount === 8) setMessage("放松你的肩膀，松开微皱的眉头...");
    else if (clickCount === 15) setMessage("好乖好乖，感觉身体变得像云朵一样轻了吧？");
    else if (clickCount === 20) { setMessage("星星够啦！闭上眼睛，迎接你的专属美梦咯🌙"); setShowMoon(true); setTimeout(() => setIsFinished(true), 4000); }
  }, [clickCount]);
  const handlePointerDown = useCallback((e) => {
    if (isFinished) return;
    const x = e.clientX || (e.touches && e.touches[0].clientX);
    const y = e.clientY || (e.touches && e.touches[0].clientY);
    const size = Math.random() * 15 + 10;
    setStars((prev) => [...prev, { id: Date.now() + Math.random(), x: x + Math.random()*20-10, y: y + Math.random()*20-10, size, rotation: Math.random()*360 }]);
    setClickCount((prev) => prev + 1);
  }, [isFinished]);
  return (
    <div className="relative w-screen h-screen overflow-hidden bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-900 flex flex-col items-center justify-center" onPointerDown={handlePointerDown}>
      {stars.map((star) => (
        <div key={star.id} className="absolute" style={{ left: star.x+'px', top: star.y+'px', width: star.size+'px', height: star.size+'px', borderRadius: '50%', backgroundColor: 'rgba(254,252,232,0.9)', transform: 'translate(-50%,-50%)' }} />
      ))}
      <div className="z-10 text-center px-6">
        <p className="text-xl text-purple-100">{message}</p>
        {clickCount === 0 && <div className="mt-8"><Sparkles /></div>}
      </div>
      {showMoon && <div className="absolute z-20 text-center"><Moon /><p className="text-purple-100 mt-4">{isFinished ? '夜深啦，屏幕要黑咯...' : ''}</p></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
