<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 赛博宝宝睡前小夜灯 | 晚安宝宝</title>
<meta name="description" content="晚安宝宝，赛博小夜灯 · 哄你入睡：吸气...慢慢来～">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }
        
        .night-bg {
            background: linear-gradient(180deg, #1a1433 0%, #0f0a24 100%);
        }
        
        .star {
            position: absolute;
            color: #fef08c;
            animation: twinkle 2.5s ease-in-out infinite;
            text-shadow: 0 0 8px #fef08c;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        
        .breathing-circle {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #c084fc 0%, #7c3aed 70%);
            border-radius: 9999px;
            box-shadow: 0 0 60px #c084fc,
                        inset 0 0 40px rgba(255,255,255,0.4);
            animation: breathe 6s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(0.85); }
            50% { transform: scale(1.15); }
        }
        
        .soft-text {
            text-shadow: 0 2px 12px rgba(192, 132, 252, 0.4);
        }
        
        .story-text {
            animation: fadeInSoft 1.2s ease forwards;
        }
        
        .zzz {
            animation: floatZ 3s ease-in-out infinite;
        }
        
        .night-button {
            background: rgba(124, 58, 237, 0.3);
            border: 1px solid #c084fc;
            transition: all 0.3s ease;
        }
        
        .night-button:hover {
            background: rgba(124, 58, 237, 0.5);
        }
    </style>
</head>
<body class="night-bg text-white min-h-screen overflow-hidden">
    <!-- 星星背景 -->
    <div id="stars" class="absolute inset-0 pointer-events-none"></div>
    
    <div class="max-w-md mx-auto pt-8 px-6 relative z-10">
        
        <!-- 标题 -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-3">
                <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-violet-500 rounded-full flex items-center justify-center shadow-[0_0_40px_#c084fc]">
                    <span class="text-5xl">🌙</span>
                </div>
            </div>
            <h1 class="text-4xl font-black soft-text tracking-tight">晚安宝宝</h1>
            <p class="text-purple-300 text-sm mt-1">赛博小夜灯 · 哄你入睡</p>
        </div>
        
        <!-- 呼吸练习 -->
        <div class="text-center mb-8">
            <div class="mb-4">
                <div class="breathing-circle mx-auto">
                    <div class="text-center">
                        <div id="breathe-text" class="text-white text-xl font-bold">吸气...</div>
                        <div class="text-xs text-purple-200 mt-1">慢慢来～</div>
                    </div>
                </div>
            </div>
            <button onclick="startBreathing()" id="breathe-btn"
                    class="night-button px-8 py-2 rounded-2xl text-sm font-medium">
                开始呼吸练习
            </button>
        </div>
        
        <!-- 睡前故事 -->
        <div class="bg-white/5 backdrop-blur rounded-3xl p-5 border border-purple-400/30 mb-6">
            <div class="flex items-center gap-x-2 mb-4 px-1">
                <span class="text-xl">📖</span>
                <span class="font-bold text-lg">今晚的故事</span>
            </div>
            
            <div class="space-y-3">
                <button onclick="tellStory(0)" 
                        class="w-full text-left px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors flex items-center gap-x-3 text-sm">
                    <span>🌟</span>
                    <span>小星星的晚安歌</span>
                </button>
                
                <button onclick="tellStory(1)" 
                        class="w-full text-left px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors flex items-center gap-x-3 text-sm">
                    <span>🦄</span>
                    <span>独角兽的梦幻城堡</span>
                </button>
                
                <button onclick="tellStory(2)" 
                        class="w-full text-left px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors flex items-center gap-x-3 text-sm">
                    <span>🍓</span>
                    <span>草莓小熊的被子</span>
                </button>
            </div>
        </div>
        
        <!-- 哄睡按钮 -->
        <div class="text-center">
            <button onclick="startSleepMode()" 
                    class="px-10 py-3.5 rounded-3xl bg-gradient-to-r from-purple-500 to-violet-500 text-white font-bold flex items-center gap-x-2 mx-auto shadow-[0_0_25px_#7c3aed]">
                <span>🌙</span>
                <span>开始哄睡模式</span>
            </button>
            <div class="text-xs text-purple-400 mt-3">灯光会慢慢变暗...</div>
        </div>
        
    </div>
    
    <!-- 故事弹窗 -->
    <div id="story-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-[#1a1433] border border-purple-400/40 rounded-3xl p-7 max-w-[300px] w-full mx-4">
            <div id="story-content" class="text-purple-100 leading-relaxed text-[15px]"></div>
            
            <div class="flex justify-center mt-6">
                <button onclick="closeStory()" 
                        class="px-8 py-2 rounded-2xl border border-purple-400/50 text-purple-300 text-sm">
                    晚安... 💤
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // 生成星星
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 45; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = '✧';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.fontSize = (8 + Math.random() * 14) + 'px';
                star.style.animationDelay = '-' + Math.random() * 3 + 's';
                container.appendChild(star);
            }
        }
        
        // 呼吸练习
        let breatheInterval = null;
        
        function startBreathing() {
            const text = document.getElementById('breathe-text');
            const btn = document.getElementById('breathe-btn');
            const circle = document.querySelector('.breathing-circle');
            
            btn.style.display = 'none';
            text.style.transition = 'all 0.4s ease';
            
            let phase = 0; // 0=吸气, 1=屏息, 2=呼气
            
            breatheInterval = setInterval(() => {
                if (phase === 0) {
                    text.innerHTML = '吸气... 🌬️<br><span class="text-xs">慢慢吸满4秒</span>';
                    circle.style.animation = 'breathe 4s ease-in-out forwards';
                    phase = 1;
                } else if (phase === 1) {
                    text.innerHTML = '屏息... ✨<br><span class="text-xs">轻轻保持7秒</span>';
                    phase = 2;
                } else {
                    text.innerHTML = '呼气... 🌙<br><span class="text-xs">慢慢吐出8秒</span>';
                    circle.style.animation = 'breathe 8s ease-in-out forwards reverse';
                    phase = 0;
                }
            }, 4000);
            
            // 30秒后自动停止
            setTimeout(() => {
                if (breatheInterval) {
                    clearInterval(breatheInterval);
                    text.innerHTML = '做得很好～<br>现在可以闭眼休息了';
                    setTimeout(() => {
                        btn.style.display = 'inline-flex';
                        text.innerHTML = '吸气...';
                        circle.style.animation = 'breathe 6s ease-in-out infinite';
                    }, 2200);
                }
            }, 32000);
        }
        
        // 故事内容
        const stories = [
            {
                title: "小星星的晚安歌",
                content: "从前有一颗小星星，每天晚上都会轻轻唱歌给宝宝听。<br><br>「晚安哦～ 闭上眼睛，梦里全是糖果和彩虹。」<br><br>小星星越唱越轻，宝宝的呼吸也越来越平稳……<br><br>晚安，宝宝。🌟"
            },
            {
                title: "独角兽的梦幻城堡",
                content: "有一只粉粉的独角兽，住在云朵上的城堡里。<br><br>它每天都会用魔法把最柔软的云朵变成被子，轻轻盖在宝宝身上。<br><br>「明天醒来，我们一起去摘星星好不好？」<br><br>独角兽亲了亲宝宝的额头……<br><br>晚安，做个甜甜的梦。🦄"
            },
            {
                title: "草莓小熊的被子",
                content: "草莓小熊有一条用草莓味棉花做的被子。<br><br>它最喜欢把被子盖得严严实实的，然后抱着宝宝一起数绵羊。<br><br>「一、二、三…… 宝宝的睫毛在抖了呢～」<br><br>小熊轻轻拍着宝宝的背……<br><br>晚安，甜甜的宝宝。🍓"
            }
        ];
        
        function tellStory(index) {
            const modal = document.getElementById('story-modal');
            const content = document.getElementById('story-content');
            
            content.innerHTML = `
                <div class="text-center mb-4">
                    <div class="text-2xl mb-2">${stories[index].title}</div>
                </div>
                <div class="story-text text-[15px] leading-relaxed">
                    ${stories[index].content}
                </div>
            `;
            
            modal.style.display = 'flex';
            
            // 自动播放柔和语音提示（文字）
            setTimeout(() => {
                content.style.transition = 'opacity 0.8s';
            }, 300);
        }
        
        function closeStory() {
            const modal = document.getElementById('story-modal');
            modal.style.transition = 'opacity 0.4s';
            modal.style.opacity = '0';
            
            setTimeout(() => {
                modal.style.display = 'none';
                modal.style.opacity = '1';
                modal.style.transition = '';
            }, 380);
        }
        
        // 哄睡模式
        function startSleepMode() {
            const body = document.body;
            const btns = document.querySelectorAll('button');
            
            // 逐渐变暗
            body.style.transition = 'filter 8s ease';
            body.style.filter = 'brightness(0.35) saturate(0.6)';
            
            // 隐藏大部分元素
            document.querySelectorAll('.max-w-md > div').forEach((el, i) => {
                if (i > 0) {
                    setTimeout(() => {
                        el.style.transition = 'opacity 3s ease';
                        el.style.opacity = '0.1';
                    }, i * 400);
                }
            });
            
            // 显示晚安文字
            setTimeout(() => {
                const goodnight = document.createElement('div');
                goodnight.className = 'fixed inset-0 flex items-center justify-center z-50 pointer-events-none';
                goodnight.innerHTML = `
                    <div class="text-center">
                        <div class="text-7xl mb-6 opacity-80">🌙</div>
                        <div class="text-3xl font-black text-purple-200 soft-text">晚安宝宝</div>
                        <div class="text-purple-400 mt-3 text-sm">做个好梦哦～</div>
                        <div class="mt-8 text-xs text-purple-500">（点击屏幕任意处恢复）</div>
                    </div>
                `;
                document.body.appendChild(goodnight);
                
                // 点击恢复
                goodnight.onclick = () => {
                    body.style.filter = 'brightness(1) saturate(1)';
                    goodnight.remove();
                    document.querySelectorAll('.max-w-md > div').forEach(el => {
                        el.style.opacity = '1';
                    });
                };
            }, 5200);
        }
        
        function init() {
            createStars();
            
            // 随机闪烁星星
            setInterval(() => {
                const stars = document.querySelectorAll('.star');
                if (stars.length > 0) {
                    const randomStar = stars[Math.floor(Math.random() * stars.length)];
                    randomStar.style.transition = 'opacity 0.3s';
                    randomStar.style.opacity = '1';
                    setTimeout(() => {
                        randomStar.style.opacity = '0.4';
                    }, 600);
                }
            }, 2800);
            
            // 初始呼吸提示
            setTimeout(() => {
                const text = document.getElementById('breathe-text');
                if (text) text.innerHTML = '慢慢呼吸...<br>宝宝乖～';
            }, 1800);
            
            console.log('%c[赛博缝纫机] 睡前小夜灯已准备好 🌙', 'color:#c084fc');
        }
        
        window.onload = init;
    </script>
</body>
</html>
