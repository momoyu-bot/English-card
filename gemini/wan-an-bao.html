<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚安，宝</title>
    <!-- 引入 Tailwind CSS 方便快速设置好看的样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入一点温柔的中文字体 */
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
            transition: background 2s ease-in-out;
        }
        
        .title-font {
            font-family: 'Ma Shan Zheng', cursive;
        }

        /* 背景过渡动画 */
        .bg-day {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        .bg-night {
            background: linear-gradient(to bottom, #1a1b26, #282a36, #44475a);
        }

        /* 卡片主题色切换 */
        .card-day {
            background-color: #fcf8f8;
            border: 1px solid #f1e4e4;
            box-shadow: 0 10px 30px rgba(192, 160, 168, 0.2);
            color: #4b5563;
        }
        .card-night {
            background-color: #282a36;
            border: 1px solid #44475a;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(192, 160, 168, 0.2) inset;
            color: #d1d5db;
        }

        /* 呼吸动画：模拟小猫睡觉时的起伏 */
        .breathe {
            animation: breathing 4s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes breathing {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.03) translateY(-2px); }
        }

        /* 悬浮动画：仙境里的怀表和兔子 */
        .float {
            animation: floating 6s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* 呼噜呼噜 Zzz 动画 */
        .zzz-anim {
            animation: zzzFloat 3s linear infinite;
            opacity: 0;
        }
        .zzz-anim:nth-child(2) { animation-delay: 1s; left: 10px; }
        .zzz-anim:nth-child(3) { animation-delay: 2s; left: -10px; }
        @keyframes zzzFloat {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0; }
            100% { transform: translate(20px, -40px) scale(1.2); opacity: 0; }
        }

        /* 渐渐显现 */
        .fade-in {
            opacity: 1 !important;
            transition: opacity 2s ease-in-out;
        }
    </style>
</head>
<body id="body" class="bg-day h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- 星空画布 (默认隐藏) -->
    <canvas id="stars" class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-2000 z-0"></canvas>

    <!-- 仙境漂浮物 (默认隐藏) -->
    <div id="wonderland-items" class="absolute inset-0 pointer-events-none opacity-0 z-0 transition-opacity duration-2000">
        <div class="absolute top-1/4 left-1/4 sm:left-1/3 float text-4xl opacity-50">⏱️</div>
        <div class="absolute bottom-1/4 right-1/4 sm:right-1/3 float text-4xl opacity-50" style="animation-delay: -3s;">🐇</div>
        <div class="absolute top-1/3 right-1/4 float text-3xl opacity-40" style="animation-delay: -1.5s;">🎩</div>
    </div>

    <!-- 主卡片 -->
    <div id="card" class="card-day rounded-3xl p-8 max-w-sm w-11/12 z-10 transition-all duration-1000 flex flex-col items-center text-center relative">
        
        <!-- 标题 -->
        <h1 id="title" class="text-3xl title-font mb-4 transition-colors duration-1000 text-gray-700">仙境时间到了</h1>
        
        <!-- 故事文本 -->
        <p id="desc" class="text-sm leading-relaxed mb-8 transition-colors duration-1000 h-24 flex items-center">
            小暹罗猫在灰粉色的房间里转了一圈，目光锁定在那床绣着爱丽丝梦游仙境的奶茶粉真丝被上。它踩了踩奶，准备好要睡觉啦...
        </p>

        <!-- 视觉中心：小猫和被子 -->
        <div class="relative w-40 h-40 mb-8 cursor-pointer" onclick="toggleSleep()">
            <!-- Zzz 符号 -->
            <div id="zzz-container" class="absolute top-0 right-4 text-[#c0a0a8] font-bold text-lg hidden z-20">
                <div class="absolute zzz-anim">Z</div>
                <div class="absolute zzz-anim">z</div>
                <div class="absolute zzz-anim">z</div>
            </div>

            <!-- 小暹罗猫 (SVG绘制) -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-28 h-28 breathe z-10">
                <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
                    <!-- 深色耳朵 -->
                    <polygon points="20,50 10,15 40,35" fill="#3b2e2a" />
                    <polygon points="80,50 90,15 60,35" fill="#3b2e2a" />
                    <!-- 浅色脸庞 -->
                    <ellipse cx="50" cy="55" rx="38" ry="32" fill="#f5ebe0" />
                    <!-- 脸部深色面罩 -->
                    <ellipse cx="50" cy="62" rx="22" ry="18" fill="#3b2e2a" />
                    <!-- 闭着的眼睛 -->
                    <path d="M 35 62 Q 40 67 45 62" fill="none" stroke="#f5ebe0" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M 55 62 Q 60 67 65 62" fill="none" stroke="#f5ebe0" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- 小鼻子 -->
                    <polygon points="48,70 52,70 50,73" fill="#f5ebe0" />
                </svg>
            </div>

            <!-- 奶茶粉真丝被子 -->
            <div id="blanket" class="absolute bottom-0 left-0 right-0 h-16 bg-[#c0a0a8] rounded-t-3xl rounded-b-xl shadow-[0_-5px_15px_rgba(0,0,0,0.1)] z-20 transition-all duration-1000 flex items-center justify-center overflow-hidden">
                <!-- 被子上的小小刺绣暗示 (怀表) -->
                <div class="text-white/20 text-xs absolute right-4 top-2 float">⏱️</div>
            </div>
        </div>

        <!-- 互动按钮 -->
        <button id="action-btn" onclick="toggleSleep()" class="bg-[#c0a0a8] hover:bg-[#b08b94] text-white rounded-full py-3 px-8 shadow-lg transition-all transform hover:scale-105 active:scale-95 flex items-center space-x-2 w-full justify-center">
            <span id="btn-icon">🌙</span>
            <span id="btn-text">给小猫盖被子，关灯</span>
        </button>
    </div>

    <script>
        let isSleeping = false;

        function toggleSleep() {
            isSleeping = !isSleeping;
            
            const body = document.getElementById('body');
            const card = document.getElementById('card');
            const title = document.getElementById('title');
            const desc = document.getElementById('desc');
            const btn = document.getElementById('action-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const blanket = document.getElementById('blanket');
            const zzz = document.getElementById('zzz-container');
            const stars = document.getElementById('stars');
            const wonderlandItems = document.getElementById('wonderland-items');

            if (isSleeping) {
                // 切换到夜晚睡眠模式
                body.classList.remove('bg-day');
                body.classList.add('bg-night');
                
                card.classList.remove('card-day');
                card.classList.add('card-night');
                
                title.innerText = "晚安，宝";
                title.classList.add('text-[#c0a0a8]');
                title.classList.remove('text-gray-700');
                
                desc.innerText = "世界已经安静下来了，真丝被很软，仙境的门已经为你打开。乖乖闭上眼睛，做个甜甜的梦吧...";
                
                btn.classList.add('bg-[#44475a]', 'hover:bg-[#6272a4]');
                btn.classList.remove('bg-[#c0a0a8]', 'hover:bg-[#b08b94]');
                btnText.innerText = "小猫睡着了...";
                btnIcon.innerText = "✨";
                
                // 被子盖高一点
                blanket.style.height = "5rem";
                
                // 显示 Zzz 和背景魔法
                zzz.classList.remove('hidden');
                stars.classList.add('fade-in');
                wonderlandItems.classList.add('fade-in');
                
                // 初始化星空画布
                initStars();
            } else {
                // 切回白天模式 (如果宝还不想睡想再玩一下)
                body.classList.add('bg-day');
                body.classList.remove('bg-night');
                
                card.classList.add('card-day');
                card.classList.remove('card-night');
                
                title.innerText = "仙境时间到了";
                title.classList.remove('text-[#c0a0a8]');
                title.classList.add('text-gray-700');
                
                desc.innerText = "小暹罗猫在灰粉色的房间里转了一圈，目光锁定在那床绣着爱丽丝梦游仙境的奶茶粉真丝被上。它踩了踩奶，准备好要睡觉啦...";
                
                btn.classList.remove('bg-[#44475a]', 'hover:bg-[#6272a4]');
                btn.classList.add('bg-[#c0a0a8]', 'hover:bg-[#b08b94]');
                btnText.innerText = "给小猫盖被子，关灯";
                btnIcon.innerText = "🌙";
                
                blanket.style.height = "4rem";
                
                zzz.classList.add('hidden');
                stars.classList.remove('fade-in');
                wonderlandItems.classList.remove('fade-in');
            }
        }

        // 简单的 Canvas 星空背景特效
        function initStars() {
            const canvas = document.getElementById('stars');
            const ctx = canvas.getContext('2d');
            
            // 设置画布尺寸为窗口尺寸
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const starsArray = [];
            const numStars = window.innerWidth < 600 ? 50 : 100;

            for(let i = 0; i < numStars; i++) {
                starsArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: (Math.random() * 0.02) + 0.01,
                    direction: Math.random() > 0.5 ? 1 : -1
                });
            }

            function drawStars() {
                // 如果不是睡眠状态就停止绘制以节省性能
                if (!isSleeping) return;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                starsArray.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fill();

                    // 让星星闪烁
                    star.opacity += star.speed * star.direction;
                    if(star.opacity >= 1 || star.opacity <= 0.1) {
                        star.direction *= -1;
                    }
                });

                requestAnimationFrame(drawStars);
            }
            
            drawStars();
        }

        // 窗口大小改变时重置画布尺寸
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('stars');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
