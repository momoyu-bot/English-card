<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 赛博宝宝接爱心打洞 | 赛博缝纫机</title>
<meta name="description" content="左右接住爱心。宝宝专属可爱版。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }
        
        .cyber-bg {
            background: linear-gradient(180deg, #1a0033 0%, #2a0055 100%);
        }
        
        .neon-pink {
            text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff69b4;
        }
        
        .hole {
            width: 92px;
            height: 92px;
            background: radial-gradient(circle at 40% 30%, #4a2c6a 0%, #2a1a44 70%, #1a0033 100%);
            border-radius: 9999px;
            border: 6px solid #c0267a;
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.6),
                        0 0 15px rgba(236, 72, 153, 0.5);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        
        .hole:active {
            transform: scale(0.92);
        }
        
        .item {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 68px;
            transition: bottom 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            user-select: none;
            pointer-events: none;
            font-size: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        
        .item.show {
            bottom: 14px;
        }
        
        .item.caught {
            animation: caughtAnim 0.35s ease forwards;
        }
        
        @keyframes caughtAnim {
            0% { transform: translateX(-50%) scale(1); }
            40% { transform: translateX(-50%) scale(1.4); }
            100% { transform: translateX(-50%) scale(0) translateY(-40px); }
        }
        
        .sparkle {
            position: absolute;
            font-size: 20px;
            animation: sparklePop 0.6s ease forwards;
            pointer-events: none;
            z-index: 20;
        }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            justify-content: center;
        }
        
        .score-float {
            position: absolute;
            font-weight: 900;
            font-size: 24px;
            color: #fef08c;
            text-shadow: 0 0 12px #fef08c;
            animation: scoreFloat 0.8s ease forwards;
            pointer-events: none;
            z-index: 30;
        }
        
        .neon-button {
            background: linear-gradient(90deg, #ff69b4, #c0267a);
            box-shadow: 0 0 20px #ff69b4;
            transition: all 0.2s ease;
        }
        
        .neon-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #ff69b4;
        }
        
        .timer-bar {
            height: 8px;
            background: linear-gradient(90deg, #f472b6, #c0267a);
            transition: width 0.1s linear;
            box-shadow: 0 0 12px #ff69b4;
        }
    </style>
</head>
<body class="cyber-bg text-white min-h-screen overflow-hidden">
    <!-- 顶部 -->
    <div class="max-w-md mx-auto pt-6 px-5">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-x-3">
                <div class="w-11 h-11 bg-gradient-to-br from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center shadow-[0_0_20px_#ff69b4]">
                    <i class="fa-solid fa-heart text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black neon-pink tracking-tighter">赛博接爱心打洞</h1>
                    <p class="text-xs text-pink-300 -mt-1">宝宝专属可爱版</p>
                </div>
            </div>
            
            <div class="text-right">
                <div class="text-xs text-pink-400">最高分</div>
                <div id="high-score" class="font-black text-2xl text-yellow-300">0</div>
            </div>
        </div>
        
        <!-- 状态栏 -->
        <div class="flex items-center justify-between bg-white/10 backdrop-blur rounded-2xl px-5 py-3 mb-4">
            <div class="flex items-center gap-x-2">
                <div class="text-pink-400">
                    <i class="fa-solid fa-heart fa-beat"></i>
                </div>
                <div>
                    <span class="text-sm text-pink-300">得分</span>
                    <span id="score" class="font-black text-4xl ml-1 text-white">0</span>
                </div>
            </div>
            
            <div class="text-right">
                <div class="flex items-center gap-x-1.5 justify-end">
                    <span class="text-sm text-pink-300">时间</span>
                    <span id="timer" class="font-mono font-black text-3xl text-emerald-400">60</span>
                </div>
                <div class="w-20 h-2 bg-white/20 rounded-full overflow-hidden mt-1">
                    <div id="timer-bar" class="timer-bar w-full rounded-full" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 游戏区 -->
    <div class="max-w-md mx-auto px-5">
        <div id="game-board" class="game-grid bg-[#2a1a44]/80 p-6 rounded-3xl border border-pink-500/40 shadow-2xl mb-6">
            <!-- 9个洞 -->
        </div>
        
        <!-- 控制区 -->
        <div class="flex gap-3">
            <button id="start-btn"
                    class="neon-button flex-1 py-4 rounded-3xl font-black text-xl flex items-center justify-center gap-x-3 active:scale-[0.985]">
                <i class="fa-solid fa-play mr-1"></i>
                <span id="start-text">开始游戏</span>
            </button>
            
            <button onclick="showRules()"
                    class="px-6 py-4 rounded-3xl border border-pink-400/60 text-pink-300 hover:bg-white/10 transition-colors">
                <i class="fa-solid fa-question-circle text-xl"></i>
            </button>
        </div>
        
        <div class="text-center mt-4">
            <div id="combo-display" class="hidden text-emerald-400 font-bold text-sm tracking-widest">
                <span id="combo-text">连击 x1</span>
            </div>
        </div>
    </div>
    
    <!-- 结束弹窗 -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-[#2a1a44] border border-pink-500 rounded-3xl p-8 max-w-xs w-full mx-4 text-center">
            <div class="text-6xl mb-3" id="end-emoji">🎉</div>
            
            <div class="text-3xl font-black mb-1" id="end-title">太棒了宝宝！</div>
            <div class="text-pink-300 mb-4" id="end-subtitle">你接住了好多爱心！</div>
            
            <div class="bg-white/10 rounded-2xl py-4 mb-6">
                <div class="text-xs text-pink-400">最终得分</div>
                <div id="final-score" class="text-6xl font-black text-yellow-300">248</div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="restartGame()" 
                        class="flex-1 neon-button py-3.5 rounded-2xl font-bold text-lg">
                    再玩一次
                </button>
                <button onclick="goToOtherGame()" 
                        class="flex-1 py-3.5 rounded-2xl font-bold text-lg border border-pink-400/70 text-pink-300">
                    换个游戏
                </button>
            </div>
            
            <div class="mt-5 text-xs text-pink-400">宝宝你最棒了～</div>
        </div>
    </div>
    
    <script>
        function initTailwind() {}
        
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let gameRunning = false;
        let holes = [];
        let activeItems = new Set();
        let combo = 0;
        let lastCatchTime = 0;
        let highScore = 0;
        
        const cuteItems = ['❤️', '🍓', '🍬', '🌸', '💎', '🦄', '🍭', '🌷'];
        
        function createHoles() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            holes = [];
            
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole mx-auto relative';
                hole.dataset.index = i;
                
                const dirt = document.createElement('div');
                dirt.className = 'absolute bottom-0 left-1/2 -translate-x-1/2 w-11 h-3 bg-[#1a0033] rounded-full';
                hole.appendChild(dirt);
                
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = '❤️';
                hole.appendChild(item);
                
                hole.addEventListener('click', () => catchItem(i, hole, item));
                
                board.appendChild(hole);
                holes.push({ hole, item, index: i });
            }
        }
        
        function catchItem(index, holeEl, itemEl) {
            if (!gameRunning || activeItems.has(index)) return;
            
            const now = Date.now();
            const isCombo = now - lastCatchTime < 650;
            
            if (isCombo) {
                combo++;
            } else {
                combo = 1;
            }
            lastCatchTime = now;
            
            itemEl.classList.add('caught');
            
            const points = 10 + (combo - 1) * 5;
            score += points;
            updateScore();
            
            showFloatingScore(holeEl, points, combo);
            createSparkles(holeEl);
            
            setTimeout(() => {
                itemEl.style.bottom = '-10px';
                itemEl.classList.remove('caught');
                activeItems.delete(index);
                
                // 随机换一个新表情
                if (Math.random() < 0.7) {
                    itemEl.innerHTML = cuteItems[Math.floor(Math.random() * cuteItems.length)];
                }
            }, 320);
            
            showCombo();
            
            // 小概率出现超级大爱心（双倍）
            if (Math.random() < 0.09) {
                setTimeout(() => {
                    if (gameRunning && !activeItems.has(index)) {
                        spawnSuperHeart(index, holeEl, itemEl);
                    }
                }, 380);
            }
        }
        
        function showFloatingScore(holeEl, points, comboCount) {
            const float = document.createElement('div');
            float.className = 'score-float';
            float.textContent = `+${points}${comboCount > 1 ? '!' : ''}`;
            float.style.left = '50%';
            float.style.top = '8px';
            float.style.transform = 'translateX(-50%)';
            
            holeEl.appendChild(float);
            
            setTimeout(() => {
                float.style.transition = 'all 0.5s ease';
                float.style.opacity = '0';
                float.style.transform = 'translateX(-50%) translateY(-35px)';
                setTimeout(() => float.remove(), 500);
            }, 280);
        }
        
        function createSparkles(holeEl) {
            const emojis = ['✨', '💖', '🌟', '💕'];
            for (let i = 0; i < 7; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                s.style.left = (Math.random() * 68 + 12) + 'px';
                s.style.top = (Math.random() * 45 + 12) + 'px';
                s.style.color = ['#fef08c', '#f9a8d4', '#fda4af'][Math.floor(Math.random()*3)];
                holeEl.appendChild(s);
                setTimeout(() => s.remove(), 620);
            }
        }
        
        function spawnSuperHeart(index, holeEl, itemEl) {
            if (!gameRunning) return;
            
            activeItems.add(index);
            const original = itemEl.innerHTML;
            itemEl.innerHTML = '💗';
            itemEl.style.fontSize = '52px';
            itemEl.style.transition = 'bottom 0.08s ease-out';
            itemEl.style.bottom = '14px';
            
            setTimeout(() => {
                if (activeItems.has(index) && gameRunning) {
                    itemEl.style.bottom = '-10px';
                    itemEl.innerHTML = original;
                    itemEl.style.fontSize = '42px';
                    activeItems.delete(index);
                }
            }, 720);
            
            const clickHandler = () => {
                if (!activeItems.has(index)) return;
                itemEl.classList.add('caught');
                const bonus = 35 + combo * 6;
                score += bonus;
                updateScore();
                showFloatingScore(holeEl, bonus, combo + 1);
                createSparkles(holeEl);
                
                setTimeout(() => {
                    itemEl.style.bottom = '-10px';
                    itemEl.innerHTML = original;
                    itemEl.style.fontSize = '42px';
                    itemEl.classList.remove('caught');
                    activeItems.delete(index);
                }, 300);
                
                holeEl.removeEventListener('click', clickHandler);
            };
            holeEl.addEventListener('click', clickHandler, { once: true });
        }
        
        function spawnItem() {
            if (!gameRunning) return;
            
            let available = [];
            for (let i = 0; i < 9; i++) {
                if (!activeItems.has(i)) available.push(i);
            }
            if (available.length === 0) return;
            
            const index = available[Math.floor(Math.random() * available.length)];
            const { hole, item } = holes[index];
            
            activeItems.add(index);
            item.innerHTML = cuteItems[Math.floor(Math.random() * cuteItems.length)];
            item.style.transition = 'bottom 0.12s cubic-bezier(0.34,1.56,0.64,1)';
            item.style.bottom = '14px';
            
            const stay = 720 + Math.random() * 480;
            
            setTimeout(() => {
                if (activeItems.has(index) && gameRunning) {
                    item.style.transition = 'bottom 0.18s ease-in';
                    item.style.bottom = '-10px';
                    setTimeout(() => activeItems.delete(index), 160);
                }
            }, stay);
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').textContent = highScore;
            }
        }
        
        function showCombo() {
            const comboEl = document.getElementById('combo-display');
            const textEl = document.getElementById('combo-text');
            
            if (combo >= 2) {
                textEl.textContent = `连击 x${combo}`;
                comboEl.style.display = 'block';
                comboEl.classList.remove('hidden');
                
                if (combo >= 5) {
                    comboEl.style.color = '#f472b6';
                    textEl.textContent = `🔥 超强连击 x${combo} 🔥`;
                }
                
                setTimeout(() => {
                    if (comboEl.style.display !== 'none') {
                        comboEl.style.transition = 'opacity 0.4s';
                        comboEl.style.opacity = '0';
                        setTimeout(() => {
                            comboEl.style.display = 'none';
                            comboEl.style.opacity = '1';
                            comboEl.style.transition = '';
                            comboEl.style.color = '#10b981';
                            textEl.textContent = `连击 x1`;
                        }, 300);
                    }
                }, 1050);
            }
        }
        
        function startGame() {
            if (gameRunning) return;
            
            score = 0;
            timeLeft = 60;
            combo = 0;
            activeItems.clear();
            
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('combo-display').style.display = 'none';
            
            gameRunning = true;
            
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> <span>暂停</span>`;
            btn.onclick = pauseGame;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('timer-bar').style.width = `${(timeLeft / 60) * 100}%`;
                
                if (timeLeft <= 10) {
                    document.getElementById('timer').classList.add('text-red-400');
                }
                if (timeLeft <= 0) endGame();
            }, 1000);
            
            const spawnInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(spawnInterval);
                    return;
                }
                spawnItem();
                if (timeLeft < 28 && Math.random() < 0.55) {
                    setTimeout(() => { if (gameRunning) spawnItem(); }, 160);
                }
            }, 380);
            
            setTimeout(() => { if (gameRunning) spawnItem(); }, 160);
            setTimeout(() => { if (gameRunning) spawnItem(); }, 480);
        }
        
        function pauseGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> <span>继续</span>`;
            btn.onclick = resumeGame;
        }
        
        function resumeGame() {
            if (timeLeft <= 0) return;
            gameRunning = true;
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> <span>暂停</span>`;
            btn.onclick = pauseGame;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('timer-bar').style.width = `${(timeLeft / 60) * 100}%`;
                if (timeLeft <= 10) document.getElementById('timer').classList.add('text-red-400');
                if (timeLeft <= 0) endGame();
            }, 1000);
            
            const spawnInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(spawnInterval);
                    return;
                }
                spawnItem();
            }, 380);
        }
        
        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            
            holes.forEach(({ item }) => {
                item.style.transition = 'bottom 0.2s ease-in';
                item.style.bottom = '-10px';
            });
            activeItems.clear();
            
            const modal = document.getElementById('game-over-modal');
            document.getElementById('final-score').textContent = score;
            
            let title = '太棒了宝宝！';
            let subtitle = '你接住了好多爱心！';
            let emoji = '🎉';
            
            if (score >= 300) {
                title = '无敌接爱心宝宝！';
                subtitle = '你是爱心之王！💖';
                emoji = '👑';
            } else if (score >= 200) {
                title = '超级厉害！';
                subtitle = '宝宝你太会接了～';
                emoji = '🌟';
            }
            
            document.getElementById('end-emoji').textContent = emoji;
            document.getElementById('end-title').textContent = title;
            document.getElementById('end-subtitle').textContent = subtitle;
            
            modal.style.display = 'flex';
            
            const btn = document.getElementById('start-btn');
            btn.innerHTML = `<i class="fa-solid fa-redo mr-2"></i> <span>再来一局</span>`;
            btn.onclick = restartGame;
        }
        
        function restartGame() {
            document.getElementById('game-over-modal').style.display = 'none';
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('timer').classList.remove('text-red-400');
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('combo-display').style.display = 'none';
            
            holes.forEach(({ item }) => {
                item.style.bottom = '-10px';
            });
            
            setTimeout(() => {
                startGame();
            }, 260);
        }
        
        function showRules() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="bg-[#2a1a44] border border-pink-500 rounded-3xl p-7 max-w-xs w-full mx-4">
                    <div class="text-center mb-5">
                        <div class="text-5xl mb-2">💖</div>
                        <div class="text-2xl font-black">游戏规则</div>
                    </div>
                    
                    <div class="space-y-3 text-sm text-pink-200">
                        <div class="flex gap-3">
                            <div class="w-6 text-center">❤️</div>
                            <div>普通爱心 = <span class="font-bold text-white">10分</span></div>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-6 text-center">💗</div>
                            <div>超级大爱心 = <span class="font-bold text-white">35分+</span></div>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-6 text-center">🔥</div>
                            <div>快速连击 = <span class="font-bold text-emerald-400">额外加分</span></div>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-6 text-center">⏱️</div>
                            <div>60秒内接越多越好！</div>
                        </div>
                    </div>
                    
                    <button onclick="this.closest('.fixed').remove()" 
                            class="mt-6 w-full py-3 rounded-2xl border border-pink-400 text-pink-300 font-bold">
                        知道了！
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function goToOtherGame() {
            const modal = document.getElementById('game-over-modal');
            modal.style.display = 'none';
            
            const tip = document.createElement('div');
            tip.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur px-6 py-3 rounded-2xl text-sm flex items-center gap-x-2 z-50';
            tip.innerHTML = `💖 想玩其他游戏请回复我哦～`;
            document.body.appendChild(tip);
            
            setTimeout(() => {
                tip.style.transition = 'all 0.4s';
                tip.style.opacity = '0';
                setTimeout(() => tip.remove(), 300);
            }, 1500);
        }
        
        function initGame() {
            initTailwind();
            createHoles();
            
            document.getElementById('high-score').textContent = highScore;
            document.getElementById('start-btn').onclick = startGame;
            
            setTimeout(() => {
                const board = document.getElementById('game-board');
                board.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
                board.style.transform = 'scale(0.96)';
                setTimeout(() => { board.style.transform = 'scale(1)'; }, 160);
            }, 550);
            
            setTimeout(() => {
                const tip = document.createElement('div');
                tip.className = 'text-center text-xs text-pink-400/70 mt-1';
                tip.textContent = '💡 快快点击可爱的爱心们～';
                document.querySelector('.max-w-md').appendChild(tip);
                setTimeout(() => tip.remove(), 3600);
            }, 3800);
            
            console.log('%c[赛博缝纫机] 可爱接爱心打洞版已准备好 ❤️', 'color:#f472b6');
        }
        
        window.onload = initGame;
    </script>
</body>
</html>
