<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>温柔的哄睡小故事</title>
<meta name="description" content="轻触往下翻。月亮点了夜灯，云朵软绵绵地托着你。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap');
        
        body {
            /* 使用柔和的渐变夜空色 */
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #172554 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 星星闪烁动画 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
        }

        /* 月亮的光晕动画 */
        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 40px 10px rgba(253, 230, 138, 0.2); }
            50% { box-shadow: 0 0 60px 20px rgba(253, 230, 138, 0.4); }
        }

        .moon {
            animation: moonGlow 8s infinite ease-in-out;
        }

        /* 云朵漂浮动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            33% { transform: translateY(-10px) translateX(15px); }
            66% { transform: translateY(5px) translateX(-10px); }
        }

        .cloud {
            animation: float 20s infinite ease-in-out;
            opacity: 0.05;
            pointer-events: none;
        }

        /* 文字渐渐浮现与消失的类 */
        .text-fade-in {
            opacity: 1 !important;
            transform: translateY(0) !important;
            filter: blur(0) !important;
        }

        .text-fade-out {
            opacity: 0 !important;
            transform: translateY(-15px) !important;
            filter: blur(4px) !important;
        }

        .story-text {
            opacity: 0;
            transform: translateY(15px);
            filter: blur(4px);
            transition: all 2s ease-out;
        }

        /* 呼吸引导圆圈动画 */
        @keyframes breatheGuide {
            0% { transform: scale(0.5); opacity: 0.3; border-width: 2px;}
            50% { transform: scale(1.5); opacity: 0.1; border-width: 8px;}
            100% { transform: scale(0.5); opacity: 0.3; border-width: 2px;}
        }

        .breathe-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid #e0e7ff;
            animation: breatheGuide 8s infinite ease-in-out;
            pointer-events: none;
            display: none; /* 初始隐藏，按需显示 */
        }
    </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden relative flex flex-col items-center justify-center cursor-pointer select-none" onclick="advanceStory()">
    
    <!-- 星空背景容器 -->
    <div id="stars-container" class="absolute inset-0 z-0"></div>

    <!-- 月亮 -->
    <div class="absolute top-16 right-12 sm:top-24 sm:right-32 w-20 h-20 sm:w-28 sm:h-28 rounded-full bg-yellow-50 moon z-10 opacity-90"></div>

    <!-- 装饰性云朵 (SVG) -->
    <svg class="cloud absolute top-1/4 left-10 w-48 text-white z-0" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.5 19c-2.485 0-4.5-2.015-4.5-4.5 0-.154.008-.306.023-.456C12.33 13.38 11.238 13 10 13c-2.761 0-5 2.239-5 5 0 .142.006.282.018.42A3.5 3.5 0 0 0 2 21.5C2 22.88 3.12 24 4.5 24h13c2.485 0 4.5-2.015 4.5-4.5S19.985 19 17.5 19zM15 14a4.982 4.982 0 0 1-2.923-1.042C11.517 14.223 10.334 15 9 15c-1.895 0-3.52-1.055-4.304-2.617A4.484 4.484 0 0 1 1 12.5C1 10.015 3.015 8 5.5 8c.28 0 .553.027.818.077C7.438 5.673 9.55 4 12 4c3.314 0 6 2.686 6 6 0 .428-.046.845-.13 1.246A3.493 3.493 0 0 1 20 14.5c0 1.933-1.567 3.5-3.5 3.5h-1.5z"/>
    </svg>
    <svg class="cloud absolute bottom-1/3 right-10 w-64 text-white z-0" style="animation-delay: -5s;" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.5 19c-2.485 0-4.5-2.015-4.5-4.5 0-.154.008-.306.023-.456C12.33 13.38 11.238 13 10 13c-2.761 0-5 2.239-5 5 0 .142.006.282.018.42A3.5 3.5 0 0 0 2 21.5C2 22.88 3.12 24 4.5 24h13c2.485 0 4.5-2.015 4.5-4.5S19.985 19 17.5 19zM15 14a4.982 4.982 0 0 1-2.923-1.042C11.517 14.223 10.334 15 9 15c-1.895 0-3.52-1.055-4.304-2.617A4.484 4.484 0 0 1 1 12.5C1 10.015 3.015 8 5.5 8c.28 0 .553.027.818.077C7.438 5.673 9.55 4 12 4c3.314 0 6 2.686 6 6 0 .428-.046.845-.13 1.246A3.493 3.493 0 0 1 20 14.5c0 1.933-1.567 3.5-3.5 3.5h-1.5z"/>
    </svg>

    <!-- 呼吸引导圈 -->
    <div id="breathe-guide" class="breathe-circle z-10"></div>

    <!-- 故事文字显示区域 -->
    <div class="z-20 px-8 w-full max-w-lg min-h-[150px] flex items-center justify-center relative text-center">
        <p id="story-display" class="story-text text-2xl sm:text-3xl text-indigo-100 font-light tracking-widest leading-relaxed drop-shadow-md">
            <!-- 文字将通过JS注入到这里 -->
        </p>
    </div>

    <!-- 操作提示 -->
    <div class="absolute bottom-12 z-20 text-indigo-300/40 text-sm tracking-widest animate-pulse transition-opacity duration-1000" id="tap-hint">
        轻触屏幕继续
    </div>

    <script>
        // 哄睡故事文本数组
        const storyLines = [
            "夜幕悄悄降临了...",
            "月亮姐姐为你点亮了鹅黄色的夜灯。",
            "现在，调整到一个最舒服的姿势...",
            "轻轻地闭上眼睛。",
            "想象你正躺在一朵像棉花糖一样的云朵上。",
            "它软绵绵地托着你...",
            "晚风吹过，带着一点薰衣草的香气。",
            "全世界的喧嚣，都在此刻安静了下来。",
            "小动物们都已经睡着了...",
            "来，我们一起深呼吸......",
            "[BREATHE] 慢慢吸气......",
            "[BREATHE] 缓缓呼气......",
            "[BREATHE] 把今天所有的疲惫，都交给晚风吧。",
            "你今天做得很棒，这一天辛苦啦。",
            "现在什么都不用想，不需要做任何计划...",
            "放松你的肩膀，放松你的手臂...",
            "让整个身体都陷进柔软的云里。",
            "跟随云朵摇晃，飘进那个奇妙的梦境里吧...",
            "那里有巧克力做的城堡，还有一直陪着你的我。",
            "我在梦的入口等你。",
            "晚安，好梦。"
        ];

        let currentLineIndex = -1;
        let isAnimating = false;

        const storyDisplay = document.getElementById('story-display');
        const tapHint = document.getElementById('tap-hint');
        const breatheGuide = document.getElementById('breathe-guide');

        // 生成随机星星
        function createStars() {
            const container = document.getElementById('stars-container');
            const starCount = 80; // 星星数量

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // 随机大小
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // 随机位置
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // 随机动画延迟和持续时间
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;
                star.style.animation = `twinkle ${duration}s infinite ${delay}s ease-in-out`;
                
                container.appendChild(star);
            }
        }

        // 推进故事的主函数
        function advanceStory() {
            // 防止动画播放中途连续点击
            if (isAnimating) return;
            isAnimating = true;

            // 第一次点击后隐藏提示
            if (currentLineIndex === -1) {
                tapHint.style.opacity = '0';
            }

            // 当前文字淡出
            if (currentLineIndex >= 0) {
                storyDisplay.classList.remove('text-fade-in');
                storyDisplay.classList.add('text-fade-out');
            }

            // 如果故事结束了
            if (currentLineIndex >= storyLines.length - 1) {
                setTimeout(() => {
                    storyDisplay.innerText = "";
                    breatheGuide.style.display = 'none'; // 隐藏呼吸圈
                    isAnimating = false;
                }, 2000);
                return;
            }

            // 等待淡出完成后再显示下一句
            setTimeout(() => {
                currentLineIndex++;
                let nextLine = storyLines[currentLineIndex];

                // 检查是否包含呼吸标记
                if (nextLine.includes("[BREATHE]")) {
                    breatheGuide.style.display = 'block'; // 显示呼吸光圈
                    nextLine = nextLine.replace("[BREATHE]", "").trim();
                } else {
                    breatheGuide.style.display = 'none'; // 隐藏呼吸光圈
                }

                // 准备显示新文字
                storyDisplay.innerText = nextLine;
                storyDisplay.classList.remove('text-fade-out');
                
                // 强制浏览器重绘以确保动画触发
                void storyDisplay.offsetWidth; 
                
                // 淡入新文字
                storyDisplay.classList.add('text-fade-in');

                // 解除动画锁定
                setTimeout(() => {
                    isAnimating = false;
                }, 2000); // 这里的2000ms要与CSS中的transition时间匹配

            }, currentLineIndex >= 0 ? 2000 : 100); // 第一次直接显示，不等待淡出
        }

        // 页面加载完成后初始化
        window.onload = () => {
            createStars();
            // 初始状态提示文案
            storyDisplay.innerText = "准备好睡觉了吗？";
            setTimeout(() => {
                storyDisplay.classList.add('text-fade-in');
            }, 500);
        };
    </script>
</body>
</html>
