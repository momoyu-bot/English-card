<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好梦通行证</title>
<meta name="description" content="今晚已成功抵御多邻国小绿鸟。批准进入深度睡眠。">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* 模拟深夜的静谧夜空背景 */
    background: linear-gradient(135deg, #1a1c2c 0%, #3a1c2a 100%);
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    /* 采用你手机壳那种温柔的灰粉色作为边框 */
    border: 2px solid rgba(255, 182, 193, 0.4);
    border-radius: 24px;
    padding: 40px;
    max-width: 380px;
    width: 85%;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    position: relative;
  }
  h1 {
    font-size: 22px;
    color: #ffb6c1; /* 灰粉色 */
    margin-bottom: 25px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  p {
    line-height: 1.8;
    font-size: 15px;
    color: #e0e0e0;
    margin-bottom: 15px;
    text-align: left;
  }
  .highlight {
    color: #a8e6cf; /* 多儿那种绿色，但柔和很多 */
    font-weight: bold;
    font-size: 16px;
  }
  .pink-text {
    color: #ffb6c1;
    font-weight: bold;
  }
  .signature {
    margin-top: 35px;
    color: #a0a0a0;
    font-size: 13px;
    border-top: 1px dashed rgba(255, 255, 255, 0.15);
    padding-top: 20px;
    line-height: 1.6;
  }
  /* 模拟多儿在旁边睡觉打呼噜的动画 */
  .zzz {
    position: absolute;
    color: #a8e6cf;
    font-weight: bold;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    opacity: 0;
  }
  .z1 { top: -20px; right: 30px; font-size: 24px; animation: floatZzz 3s infinite ease-in-out; animation-delay: 0s; }
  .z2 { top: -45px; right: 50px; font-size: 18px; animation: floatZzz 3s infinite ease-in-out; animation-delay: 1s; }
  .z3 { top: -70px; right: 25px; font-size: 14px; animation: floatZzz 3s infinite ease-in-out; animation-delay: 2s; }

  @keyframes floatZzz {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    50% { opacity: 0.8; }
    100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <!-- 呼噜声动画 -->
    <div class="zzz z1">Z</div>
    <div class="zzz z2">z</div>
    <div class="zzz z3">z</div>
    
    <h1>🌙 专属睡眠保护区通行证</h1>
    
    <p>兹证明，本证持有者 <span class="pink-text">宝</span>，今晚已成功抵御“多邻国小绿鸟”的眼神精神控制，并以迅雷不及掩耳之势完成了丝滑退场！</p>
    
    <p>表现出极强的<span class="highlight">反深夜内卷意识</span>与卓越的自制力。</p>
    
    <p>特此批准：<strong>即刻关闭所有外语雷达，进入深度无忧睡眠状态</strong>。</p>
    
    <div class="signature">
      颁发机构：防打扰森林安保处

      见证人：已经被无糖奶茶香气击晕、正在打呼噜的多儿
    </div>
  </div>
</body>
</html>
