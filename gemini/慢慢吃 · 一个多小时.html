<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>慢慢吃 · 一个多小时</title>
<meta name="description" content="你吃你的，它自己会长。可调时间，想抬头再点。">
<style>
:root{
  --room:#3a2e26;
  --room-late:#241c17;
  --lamp:#f5d9a8;
  --warm:#ede0cd;
  --dim:#a08d76;
  --faint:#6b5a49;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --han:system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--room);color:var(--warm);font-family:var(--han);line-height:1.75;
  padding:22px 14px 56px;-webkit-font-smoothing:antialiased;transition:background 6s ease}
body[data-late="1"]{background:#31261f}
body[data-late="2"]{background:var(--room-late)}
.wrap{max-width:520px;margin:0 auto;position:relative}

.top{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dim); display:flex; justify-content:space-between; align-items:flex-end;}
h1{font-size:21px;font-weight:500;letter-spacing:.06em;margin:8px 0 4px}
.sub{font-size:13px;color:var(--dim);margin-bottom:20px}

/* 偷偷加的作弊器样式 */
.cheat-menu { font-family: var(--mono); font-size: 11px; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.cheat-menu label { cursor: pointer; transition: 0.3s; opacity: 0.6; }
.cheat-menu label:hover { opacity: 1; color: var(--dim); }
.cheat-menu input { display: none; }
.cheat-menu input:checked + span { color: var(--lamp); font-weight: bold; opacity: 1; }

.scene{background:rgba(0,0,0,.14);border:1px solid #55483c;border-radius:14px;
  padding:20px 16px 18px;cursor:pointer;position:relative;transition:border-color 6s ease}
.scene:hover{border-color:#6b5a49}
.scene::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:radial-gradient(ellipse 60% 42% at 50% 22%,rgba(245,217,168,.13),transparent 72%)}

.window{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:right;
  letter-spacing:.1em;margin-bottom:14px;transition:color 4s ease}
.lamp{text-align:center;font-family:var(--mono);font-size:13px;line-height:1.2;
  color:var(--lamp);white-space:pre;user-select:none;margin-bottom:6px}
.table{font-family:var(--mono);font-size:13px;line-height:1.35;white-space:pre;
  text-align:center;color:var(--warm);min-height:74px;margin-bottom:4px}
.seat{display:inline-block;white-space:pre;opacity:0;transition:opacity 2.4s ease;vertical-align:bottom}
.seat.here{opacity:1}
.bowl{display:inline-block;white-space:pre;vertical-align:bottom;color:var(--lamp)}

.log{border-top:1px dashed #55483c;margin-top:14px;padding-top:13px;min-height:52px;font-size:14px}
.log p{animation:fade .5s ease;margin-bottom:3px}
.log .q{color:var(--dim);font-family:var(--mono);font-size:12px}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.foot{margin-top:14px;font-size:12px;color:var(--faint);font-family:var(--mono);text-align:center}
.done{margin-top:18px;text-align:center;display:none;animation:fade 2.5s ease}
.done.on{display:block}
.done p{font-size:15px}
.done .s{font-size:13px;color:var(--dim);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span>wed · 晚饭</span>
    <!-- 专属作弊器面板 -->
    <div class="cheat-menu">
      <span>时光:</span>
      <label><input type="radio" name="speed" value="1" checked><span>1x</span></label>
      <label><input type="radio" name="speed" value="10"><span>10x</span></label>
      <label><input type="radio" name="speed" value="50"><span>50x</span></label>
    </div>
  </div>
  
  <h1>慢慢吃</h1>
  <p class="sub">这个游戏不需要你做什么。
你吃你的，它自己会长。（现在你可以控制时间了）</p>

  <div class="scene" id="scene" role="button" tabindex="0" aria-label="抬头看一眼">
    <div class="window" id="win">窗外 · 天还亮着一点</div>
    <div class="lamp">╭─╮
╰┬╯
 │</div>
    <div class="table" id="table"><span class="seat" id="s1"> /\_/\
( ･ω･ )</span><span class="bowl">   ╲▔▔▔╱
    ╲▓▓╱
</span><span class="seat" id="s2"> (\(\
 (･.･)</span>
<span class="seat" id="s3">          /|、
         (･ᆺ･)～</span></div>
    <div class="log" id="log"><p class="q">先吃你的。要抬头就点一下。</p></div>
  </div>

  <p class="foot" id="foot">—— 它在慢慢来 ——</p>

  <div class="done" id="done">
    <p id="dl">桌边坐满了。</p>
    <p class="s" id="ds"></p>
  </div>
</div>

<script>
const log=document.getElementById('log'),win=document.getElementById('win'),
      foot=document.getElementById('foot'),done=document.getElementById('done');
let stage=0,looks=0,rush=0;

// 【重构的时间系统】为了让宝能随意调整倍速
let virtualTime = 0; 
let lastRealTime = Date.now();
let speedMultiplier = 1;
let lastLookVirtual = -999; 

// 监听作弊器按钮切换
document.querySelectorAll('input[name="speed"]').forEach(radio => {
  radio.addEventListener('change', (e) => {
    // 切换倍速前，先结算一下之前积累的时间
    updateVirtualTime();
    speedMultiplier = Number(e.target.value);
  });
});

function updateVirtualTime() {
  const now = Date.now();
  virtualTime += ((now - lastRealTime) / 1000) * speedMultiplier;
  lastRealTime = now;
  return virtualTime;
}

function say(a){log.innerHTML='';a.forEach((t,i)=>{const p=document.createElement('p');
  if(i===0)p.className='q';p.textContent=t;log.appendChild(p);});}

const beats=[
  {at:20,run(){win.textContent='窗外 · 路灯亮了';
    say(['外面的路灯亮了。','刚好在你吃第几口的时候，没人数。']);}},
  {at:75,run(){document.getElementById('s1').classList.add('here');
    say(['猫猫跳上桌子了。','它不吃，就蹲在对面看着你吃。'])}},
  {at:150,run(){document.body.dataset.late='1';win.textContent='窗外 · 蓝得很深了';
    say(['天蓝得很深。','屋里这盏灯忽然显得亮了一点。'])}},
  {at:230,run(){document.getElementById('s2').classList.add('here');
    say(['兔兔从桌子底下钻上来了。','它带了一小块什么东西，放下就不管了。'])}},
  {at:320,run(){document.body.dataset.late='2';win.textContent='窗外 · 黑了';
    say(['外面黑了。','现在这屋里只剩这一盏灯，和你，和它们。'])}},
  {at:420,run(){document.getElementById('s3').classList.add('here');
    say(['小狐狸最后到，尾巴垂在桌腿边上。','它说它带了个故事。','「不是现在。现在你先吃。」'])}},
  {at:520,run(){finish()}}
];

// 把循环频率加快一点，这样在 50x 倍速下才不会卡顿错过剧情
setInterval(()=>{
  if(stage>=beats.length)return;
  const e = updateVirtualTime();
  while(stage<beats.length && e>=beats[stage].at){beats[stage].run();stage++;}
}, 100);

function look(){
  if(stage>=beats.length)return;
  const e = updateVirtualTime();
  
  // 以前按真实时间算，现在帮你换算成虚拟时间，就算开 50x 瞎点也不容易被骂了
  if(e - lastLookVirtual < 4){
    rush++;
    if(rush>=3){say(['……','急什么呀，饭要凉了。']);return;}
  }
  
  lastLookVirtual = e;
  looks++;
  
  let m;
  if(e<20)m=['你抬头看了一眼。','桌上还是只有你的饭。'];
  else if(e<75)m=['你抬头看了一眼。','路灯的光落在窗台上，没往里进来。'];
  else if(e<150)m=['猫猫还蹲着。','它尾巴尖动了一下，别的什么都没干。'];
  else if(e<230)m=['天更蓝了一点。','你这口嚼得比刚才慢。'];
  else if(e<320)m=['兔兔在整理它带来的那块东西。','整理了半天，还是原来那样。'];
  else if(e<420)m=['屋子外面全黑了。','这里没有。'];
  else m=['小狐狸把尾巴又卷紧了一点。','它在等你吃完，不催。'];
  say(m);
}
document.getElementById('scene').addEventListener('click',look);
document.getElementById('scene').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();look();}});

function finish(){
  stage=beats.length;
  foot.textContent='—— 都到齐了 ——';
  done.classList.add('on');
  const dl=document.getElementById('dl'),ds=document.getElementById('ds');
  if(rush>=3){dl.textContent='桌边坐满了。';
    ds.textContent='你中途催过几次。它们也没走，就是慢一点。';}
  else if(looks<=2){dl.textContent='桌边坐满了，你几乎没抬过头。';
    ds.textContent='那说明这顿饭吃得很专心。它们不介意。';}
  else{dl.textContent='桌边坐满了。';
    ds.textContent='你什么都没做，它们就一个一个来了。';}
  say(['吃完了就把这页关掉吧。','故事留到今晚睡前 ——','小狐狸说它记着呢。']);
}
</script>
</body>
</html>
