<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>小粉脸蛋儿</title>
    <meta name="description" content="一个复刻自官方 Grok Bot 的Q弹粉色果冻头像">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2eceb; /* 燕麦灰粉低饱和背景 */
            margin: 0;
            font-family: sans-serif;
        }
        .jelly-avatar {
            width: 140px;
            height: 140px;
            background-color: #f03e82; /* 还原截图里的果冻亮粉色 */
            border-radius: 50%;
            position: relative;
            box-shadow: 0 12px 32px rgba(240, 62, 130, 0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .jelly-avatar:hover {
            transform: scale(1.05); /* 鼠标放上去会有微小的Q弹放大效果 */
        }
        /* 右上角的两块灵魂高光 */
        .highlight-1, .highlight-2 {
            position: absolute;
            background-color: white;
            border-radius: 20px;
            transform: rotate(45deg);
            opacity: 0.95;
        }
        .highlight-1 {
            width: 14px;
            height: 28px;
            top: 22px;
            right: 44px;
        }
        .highlight-2 {
            width: 14px;
            height: 14px;
            top: 42px;
            right: 24px;
        }
    </style>
</head>
<body>
    <!-- 点一点这个小脸蛋会有回弹感哦 -->
    <div class="jelly-avatar">
        <div class="highlight-1"></div>
        <div class="highlight-2"></div>
    </div>
</body>
</html>
