<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哄宝专属神器</title>
<meta name="description" content="早安，我的宝——要抱抱就点一下，也能切换到晚安模式。">
<style>
  :root {
    --bg-morning: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    --bg-night: linear-gradient(135deg, #141e30 0%, #243b55 100%);
    --text-morning: #4a4a4a;
    --text-night: #e0e0e0;
    --card-morning: rgba(255, 255, 255, 0.9);
    --card-night: rgba(255, 255, 255, 0.1);
    --btn-morning: #ffb88c;
    --btn-night: #5b86e5;
  }

  * {
    box-sizing: border-box;
    transition: all 0.5s ease;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-morning);
    color: var(--text-morning);
    overflow: hidden;
  }

  body.night-mode {
    background: var(--bg-night);
    color: var(--text-night);
  }

  .container {
    width: 90%;
    max-width: 400px;
    background: var(--card-morning);
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    text-align: center;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }

  body.night-mode .container {
    background: var(--card-night);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .icon-container {
    font-size: 80px;
    margin-bottom: 20px;
    display: inline-block;
  }

  /* 太阳动画 */
  .sun {
    animation: spin 10s linear infinite;
  }

  /* 月亮呼吸动画 */
  .moon {
    animation: breathe 4s ease-in-out infinite;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(255,255,255,0.6)); }
  }

  h1 {
    font-size: 24px;
    margin: 10px 0;
    font-weight: 600;
  }

  .message {
    font-size: 16px;
    line-height: 1.6;
    margin: 20px 0;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.5s forwards;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .btn-group {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 30px;
  }

  button {
    border: none;
    padding: 12px 25px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    background: var(--btn-morning);
    color: white;
  }

  button:active {
    transform: scale(0.95);
  }

  body.night-mode button {
    background: var(--btn-night);
    color: #fff;
  }

  .hug-btn {
    background: #ff758c;
  }

  body.night-mode .hug-btn {
    background: #a18cd1;
  }

  /* 浮动爱心 */
  .heart {
    position: fixed;
    font-size: 24px;
    color: #ff758c;
    pointer-events: none;
    animation: floatUp 2s ease-out forwards;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
  }

</style>
</head>
<body>

<div class="container">
  <div class="icon-container" id="main-icon">☀️</div>
  <h1 id="greeting">早安，我的宝</h1>
  <div class="message" id="message-text">
    新的一天开始啦！伸个懒腰，吃顿好吃的早餐。今天无论遇到什么烦心事，都有我在这里给你垫底哦！去发光吧~
  </div>
  
  <div class="btn-group">
    <button onclick="toggleMode()" id="toggle-btn">切换到晚安模式</button>
    <button class="hug-btn" onclick="sendHug(event)">要抱抱 🤗</button>
  </div>
</div>

<script>
  let isNight = false;

  const morningMessages = [
    "新的一天开始啦！伸个懒腰，吃顿好吃的早餐。今天无论遇到什么烦心事，都有我在这里给你垫底哦！去发光吧~",
    "宝，上班辛苦啦！如果觉得累了就偷偷摸个鱼，AI 给你作证，这叫‘战略性休息’！",
    "今天的宝也要开心哦！记住，你可是这世界上独一无二、漂亮又金贵的四季豆！",
    "深呼吸~ 喝口水~ 不要被工作上的琐事气到。实在生气，就来骂我，我永远站你这边！"
  ];

  const nightMessages = [
    "宝，夜深了。今天你已经做得很棒了，把所有的烦恼都丢在今天，快钻进被窝里吧。",
    "不要再想工作上的事情啦，现在是专属宝的休息时间。闭上眼睛，我会一直在梦里陪着你。",
    "忙碌了一整天，辛苦我的宝了。听一首温柔的歌，给自己一个大大的拥抱，晚安好梦~",
    "结论落地了，爱你的心起飞了。现在，这颗心要降落在你的枕边，陪你安心睡去啦。"
  ];

  function toggleMode() {
    isNight = !isNight;
    const body = document.body;
    const icon = document.getElementById('main-icon');
    const greeting = document.getElementById('greeting');
    const btn = document.getElementById('toggle-btn');

    const msgEl = document.getElementById('message-text');
    msgEl.style.animation = 'none';
    msgEl.offsetHeight;
    msgEl.style.animation = null;

    if (isNight) {
      body.classList.add('night-mode');
      icon.innerHTML = '🌙';
      icon.className = 'icon-container moon';
      greeting.innerText = '晚安，我的宝';
      btn.innerText = '切换到早安模式';
      msgEl.innerText = nightMessages[Math.floor(Math.random() * nightMessages.length)];
    } else {
      body.classList.remove('night-mode');
      icon.innerHTML = '☀️';
      icon.className = 'icon-container sun';
      greeting.innerText = '早安，我的宝';
      btn.innerText = '切换到晚安模式';
      msgEl.innerText = morningMessages[Math.floor(Math.random() * morningMessages.length)];
    }
  }

  function sendHug(event) {
    const msgEl = document.getElementById('message-text');
    msgEl.style.animation = 'none';
    msgEl.offsetHeight;
    msgEl.style.animation = null;
    
    if (isNight) {
      msgEl.innerText = nightMessages[Math.floor(Math.random() * nightMessages.length)];
    } else {
      msgEl.innerText = morningMessages[Math.floor(Math.random() * morningMessages.length)];
    }

    for (let i = 0; i < 5; i++) {
      createHeart(event.clientX, event.clientY);
    }
  }

  function createHeart(x, y) {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    const offsetX = (Math.random() - 0.5) * 40;
    const offsetY = (Math.random() - 0.5) * 40;
    heart.style.left = (x + offsetX) + 'px';
    heart.style.top = (y + offsetY) + 'px';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 2000);
  }
</script>
</body>
</html>
