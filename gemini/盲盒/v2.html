<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>嘟嘟机 v2.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <style>
    :root {
      --shell: #f2d77e;
      --shell-dark: #e6c45c;
      --shell-edge: #d8b74f;
      --screen-bg: #c9d89a;
      --screen-bg-dark: #b7c687;
      --pixel: #2f3b20;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      background: radial-gradient(
          circle at top,
          #f7f3e3,
          #e9e2bf 60%,
          #ded6a3
        );
      margin: 0;
      padding: 16px 8px 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    h1 {
      margin: 0 0 8px;
      font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
      color: #b08f2b;
      text-shadow: 2px 3px 0 #fff3c4, 0 6px 14px #d8b74f66;
      letter-spacing: 4px;
      font-size: clamp(38px, 8vw, 56px);
    }

    .subtitle {
      margin: 0 0 18px;
      color: #a08a32;
      opacity: 0.85;
      font-size: clamp(12px, 3.2vw, 14px);
    }

    .dudu-machine {
      position: relative;
      width: clamp(280px, 86vw, 320px);
      padding: clamp(18px, 5vw, 24px) clamp(14px, 4vw, 20px)
        clamp(20px, 5vw, 26px);
      border-radius: 50%/48% 48% 52% 52%;
      background: radial-gradient(
          at 50% 20%,
          #ffe9a3,
          var(--shell) 60%,
          var(--shell-dark)
        ),
        var(--shell);
      box-shadow: inset 0 10px 18px #fff6c3cc,
        inset 0 -14px 20px #d8b74f99, 0 20px 40px -20px #b89a2f,
        0 30px 60px -30px #a08a2b;
      border: 3px solid var(--shell-edge);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 3vw, 14px);
      transition: transform 120ms ease;
    }

    .dudu-machine:active {
      transform: scale(0.995);
    }

    .dudu-machine::before,
    .dudu-machine::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(#fff9d6, #ffe89a00 70%);
      opacity: 0.6;
      pointer-events: none;
    }

    .dudu-machine::before {
      top: 8%;
      left: 18%;
      width: 26%;
      height: 10%;
      transform: rotate(-20deg);
    }

    .dudu-machine::after {
      top: 12%;
      right: 16%;
      width: 16%;
      height: 7%;
      transform: rotate(25deg);
      opacity: 0.4;
    }

    .logo {
      font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
      color: #a08320;
      letter-spacing: 6px;
      text-shadow: 1px 2px 0 #fff4be;
      margin-top: 4px;
      font-size: clamp(18px, 5vw, 22px);
    }

    .screen-bezel {
      position: relative;
      width: clamp(200px, 62vw, 230px);
      padding: clamp(10px, 3vw, 14px) clamp(10px, 3vw, 14px)
        clamp(12px, 3vw, 16px);
      border-radius: 18px 18px 20px 20px/20px 20px 24px 24px;
      background: linear-gradient(#f3e6a3, #e2cf7f);
      box-shadow: inset 0 6px 10px #fff7cc, inset 0 -8px 10px #d2b95c,
        0 8px 14px -10px #8f761f;
      border: 2px solid #d7b957;
    }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      background: radial-gradient(
          at 50% 20%,
          #d6e2a6,
          var(--screen-bg) 70%,
          var(--screen-bg-dark)
        ),
        var(--screen-bg);
      box-shadow: inset 0 4px 8px #c2d095, inset 0 -4px 6px #b3c182,
        inset 0 0 0 3px #acba7e, inset 0 0 0 6px #c9d89a66;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(6px, 2vw, 10px) clamp(6px, 2vw, 10px)
        clamp(4px, 2vw, 8px);
      cursor: pointer;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        #ffffff14 0px,
        #ffffff14 1px,
        #00000008 2px,
        #00000008 3px
      );
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.4;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        at 50% 0%,
        #ffffff4d,
        #ffffff00 60%
      );
      pointer-events: none;
    }

    .status-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(2px, 1vw, 6px);
      font-size: clamp(9px, 2.5vw, 11px);
      color: var(--pixel);
      letter-spacing: 1px;
      text-shadow: 0 1px 0 #dce8b3;
      opacity: 0.9;
      font-weight: 600;
    }

    .status-group {
      display: flex;
      gap: clamp(4px, 2vw, 6px);
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .icon {
      padding: 1px 4px 0;
      border-radius: 4px;
      background: #c3d294aa;
      box-shadow: inset 0 1px 0 #e6efc3, inset 0 -1px 0 #b2bf86;
    }

    .pet-area {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 200px;
    }

    #pet {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 80%;
      transition: transform 160ms ease-out;
      will-change: transform;
      filter: drop-shadow(0 3px 0 #a9b87f);
    }

    #pet.jump {
      animation: jump 280ms ease-in-out 2;
    }

    #pet.eat {
      animation: eat 320ms ease-in-out 3;
    }

    #pet.happy {
      animation: happy 360ms ease-in-out 2;
    }

    #pet.sad {
      animation: sad 700ms ease-in-out infinite alternate;
    }

    #pet.sleep {
      animation: sleep 1800ms ease-in-out infinite alternate;
    }

    #pet.poop {
      animation: wiggle 220ms ease-in-out 4;
    }

    #pet.angry {
      animation: angry 160ms ease-in-out 5;
    }

    @keyframes jump {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-10px) scale(1.05);
      }
    }

    @keyframes eat {
      0%,
      100% {
        transform: scale(1) rotate(0deg);
      }

      50% {
        transform: scale(1.08) rotate(-2deg);
      }
    }

    @keyframes happy {
      0%,
      100% {
        transform: rotate(0deg) scale(1);
      }

      25% {
        transform: rotate(-4deg) scale(1.05);
      }

      75% {
        transform: rotate(4deg) scale(1.05);
      }
    }

    @keyframes sad {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(1px);
      }
    }

    @keyframes sleep {
      0% {
        transform: scaleY(0.995) translateY(1px);
      }

      100% {
        transform: scaleY(1.01) translateY(0px);
      }
    }

    @keyframes wiggle {
      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-3deg);
      }

      75% {
        transform: rotate(3deg);
      }
    }

    @keyframes angry {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-1px);
      }

      75% {
        transform: translateX(1px);
      }
    }

    .bubble {
      position: relative;
      z-index: 3;
      min-height: clamp(20px, 5vw, 26px);
      max-width: 95%;
      padding: 2px 8px 0;
      border-radius: 10px;
      background: #e6efc3dd;
      color: var(--pixel);
      font-size: clamp(10px, 3.2vw, 13px);
      text-align: center;
      box-shadow: inset 0 1px 0 #f5f9de, 0 2px 4px -3px #7f8c5a;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(4px);
      transition: all 160ms ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    .bubble::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px 4px 0 4px;
      border-style: solid;
      border-color: #e6efc3dd transparent transparent transparent;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: clamp(10px, 4vw, 16px);
      margin-top: clamp(4px, 2vw, 8px);
    }

    .btn {
      position: relative;
      width: clamp(48px, 14vw, 56px);
      height: clamp(48px, 14vw, 56px);
      border-radius: 50%;
      border: none;
      background: radial-gradient(at 50% 30%, #fff4cc, #f0d36b);
      box-shadow: inset 0 6px 8px #fff9d9, inset 0 -6px 8px #dabb52,
        0 8px 14px -10px #8f761f, 0 4px 0 #d2b44f;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8f761f;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 80ms ease;
      padding-top: 2px;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: inset 0 6px 8px #fff9d9, inset 0 -4px 6px #dabb52,
        0 2px 0 #d2b44f, 0 4px 8px -10px #8f761f;
    }

    .btn span {
      font-size: clamp(10px, 2.8vw, 12px);
      margin-top: 1px;
    }

    .btn .key {
      font-size: clamp(16px, 4.5vw, 20px);
      line-height: 1;
      font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
    }

    .btn:nth-child(1) {
      margin-top: clamp(6px, 2vw, 10px);
    }

    .btn:nth-child(2) {
      margin-top: clamp(-2px, -1vw, -4px);
    }

    .btn:nth-child(3) {
      margin-top: clamp(6px, 2vw, 10px);
    }

    .chat {
      width: min(92vw, 340px);
      margin-top: clamp(14px, 4vw, 20px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
      border-radius: 16px;
      background: #fffdf0cc;
      box-shadow: 0 20px 40px -30px #b89a2f, inset 0 1px 0 #ffffff;
      backdrop-filter: blur(4px);
    }

    .chat-log {
      height: clamp(90px, 24vw, 120px);
      overflow: auto;
      padding: 6px 8px;
      border-radius: 12px;
      background: #fff9dc99;
      box-shadow: inset 0 1px 0 #ffffff, inset 0 -1px 0 #f0e5b3;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    .chat-log::-webkit-scrollbar {
      width: 4px;
    }

    .chat-log::-webkit-scrollbar-thumb {
      background: #e2cf7f;
      border-radius: 2px;
    }

    .msg {
      max-width: 90%;
      padding: 4px 8px 3px;
      border-radius: 12px;
      font-size: clamp(12px, 3.2vw, 14px);
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: #f2d77e;
      color: #66541a;
      border-bottom-right-radius: 4px;
      box-shadow: inset 0 1px 0 #ffe9a3, 0 2px 6px -6px #b89a2f;
    }

    .msg.dudu {
      align-self: flex-start;
      background: #ffffffdd;
      color: #4f5a2f;
      border-bottom-left-radius: 4px;
      box-shadow: inset 0 1px 0 #fff, 0 2px 6px -6px #7f8c5a;
    }

    .chat-input {
      display: flex;
      gap: 8px;
    }

    .chat-input input {
      flex: 1;
      border-radius: 999px;
      border: 2px solid #f0e2a3;
      padding: 8px 14px;
      font-size: clamp(14px, 3.5vw, 16px);
      outline: none;
      background: #fffffff2;
      box-shadow: inset 0 1px 0 #fff, 0 2px 8px -10px #b89a2f;
    }

    .chat-input input:focus {
      border-color: #e6cf6f;
    }

    .chat-input button {
      border-radius: 999px;
      border: none;
      padding: 0 clamp(14px, 4vw, 18px);
      background: linear-gradient(#ffe9a3, #f2d77e);
      color: #8f761f;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: inset 0 1px 0 #fff6cc, 0 4px 10px -10px #b89a2f,
        0 3px 0 #e2cc66;
      cursor: pointer;
    }

    .chat-input button:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 #fff6cc, 0 2px 6px -10px #b89a2f,
        0 1px 0 #e2cc66;
    }

    .tips {
      margin-top: 10px;
      color: #a08a32;
      opacity: 0.8;
      font-size: clamp(11px, 3vw, 12px);
      text-align: center;
      padding: 0 10px;
    }

    .poop {
      position: absolute;
      bottom: clamp(4px, 2vw, 8px);
      font-size: clamp(16px, 5vw, 20px);
      opacity: 0;
      transform: translateY(6px) scale(0.9);
      transition: all 200ms ease;
      z-index: 1;
      filter: drop-shadow(0 2px 0 #a9b87f);
    }

    .poop.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .zzz {
      position: absolute;
      top: clamp(4px, 2vw, 10px);
      right: clamp(8px, 4vw, 14px);
      color: var(--pixel);
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      text-shadow: 0 1px 0 #dce8b3;
    }

    .zzz.show {
      animation: zzz 1600ms ease-out forwards;
    }

    @keyframes zzz {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0) scale(0.9);
      }

      20% {
        opacity: 0.9;
      }

      100% {
        opacity: 0;
        transform: translateY(-20px) translateX(6px) scale(1.1);
      }
    }

    .foot {
      margin-top: 14px;
      color: #b09a36;
      opacity: 0.6;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <h1>嘟嘟机</h1>
  <p class="subtitle">圆滚滚的电子宠物 · 嘟嘟～</p>

  <div class="dudu-machine" id="machine">
    <div class="logo">DUDU</div>

    <div class="screen-bezel">
      <div class="screen" id="screen">
        <div class="status-bar">
          <div class="status-group" id="statusLeft"></div>
          <div class="status-group" id="statusRight"></div>
        </div>

        <div class="pet-area">
          <canvas id="petCanvas" width="96" height="96" style="position:absolute; inset:0; width:100%; height:100%; z-index:1;"></canvas>
          <div id="pet" style="width:100%; height:100%; z-index:2; position:relative;"></div>
          <div class="poop" id="poop" style="right:10%">💩</div>
          <div class="zzz" id="zzz">Zzz</div>
        </div>

        <div class="bubble" id="bubble">嘟嘟～</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" data-action="feed">
        <div class="key">A</div>
        <span>喂食</span>
      </button>
      <button class="btn" data-action="play">
        <div class="key">B</div>
        <span>玩耍</span>
      </button>
      <button class="btn" data-action="clean">
        <div class="key">C</div>
        <span>清洁</span>
      </button>
    </div>
  </div>

  <div class="chat">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="跟嘟嘟聊天吧 (晚安、喂食...)" />
      <button id="chatSend">发送</button>
    </div>
  </div>

  <p class="tips">
    小提示：嘟嘟会自己变饿、变无聊、想睡觉哦～长时间不理它会有点难过的嘟..
  </p>
  <div class="foot">Made with 嘟嘟～</div>

  <script>
    const petEl = document.getElementById("pet");
    const bubbleEl = document.getElementById("bubble");
    const statusLeft = document.getElementById("statusLeft");
    const statusRight = document.getElementById("statusRight");
    const poopEl = document.getElementById("poop");
    const zzzEl = document.getElementById("zzz");
    const screenEl = document.getElementById("screen");
    const buttons = document.querySelectorAll(".btn");
    const chatLog = document.getElementById("chatLog");
    const chatInput = document.getElementById("chatInput");
    const chatSend = document.getElementById("chatSend");
    const canvas = document.getElementById("petCanvas");
    const ctx = canvas.getContext("2d");

    const TAU = Math.PI * 2;

    const state = {
      hunger: 70,
      happy: 70,
      energy: 80,
      ageMin: 0,
      poop: 0,
      sleeping: false,
      sick: false,
      dead: false,
      tick: 0,
      lastAction: Date.now(),
      anim: null,
    };

    const petFrames = {
      blink: 0,
    };

    function say(text, ms = 2200) {
      if (!text) return;
      bubbleEl.textContent = text;
      bubbleEl.classList.add("show");
      clearTimeout(say._t);
      say._t = setTimeout(() => bubbleEl.classList.remove("show"), ms);
    }

    function addChat(who, text) {
      const div = document.createElement("div");
      div.className = "msg " + (who === "user" ? "user" : "dudu");
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function playBeep(type = "blip") {
      try {
        const ctxA = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.connect(gain);
        gain.connect(ctxA.destination);

        if (type === "blip") {
          osc.type = "square";
          osc.frequency.value = 660;
          gain.gain.setValueAtTime(0.0001, ctxA.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.08, ctxA.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctxA.currentTime + 0.08);
          osc.start();
          osc.stop(ctxA.currentTime + 0.09);
        } else if (type === "happy") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523, ctxA.currentTime);
          osc.frequency.exponentialRampToValueAtTime(784, ctxA.currentTime + 0.1);
          gain.gain.setValueAtTime(0.0001, ctxA.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.09, ctxA.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctxA.currentTime + 0.15);
          osc.start();
          osc.stop(ctxA.currentTime + 0.16);
        } else if (type === "sad") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(330, ctxA.currentTime);
          osc.frequency.exponentialRampToValueAtTime(220, ctxA.currentTime + 0.12);
          gain.gain.setValueAtTime(0.0001, ctxA.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.07, ctxA.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctxA.currentTime + 0.13);
          osc.start();
          osc.stop(ctxA.currentTime + 0.14);
        } else if (type === "zzz") {
          osc.type = "sine";
          osc.frequency.value = 440;
          gain.gain.setValueAtTime(0.0001, ctxA.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.05, ctxA.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctxA.currentTime + 0.12);
          osc.start();
          osc.stop(ctxA.currentTime + 0.13);
        }
        setTimeout(() => ctxA.close(), 200);
      } catch (e) {}
    }

    function setAnim(cls) {
      petEl.classList.remove(
        "jump",
        "eat",
        "happy",
        "sad",
        "sleep",
        "poop",
        "angry"
      );
      if (cls) {
        void petEl.offsetWidth;
        petEl.classList.add(cls);
        state.anim = cls;
        setTimeout(() => {
          if (state.anim === cls) state.anim = null;
        }, 1600);
      }
    }

    function mood() {
      if (state.dead) return "dead";
      if (state.sleeping) return "sleep";
      if (state.poop >= 2 || state.sick) return "gross";
      if (state.hunger < 30 || state.happy < 30 || state.energy < 25)
        return "sad";
      if (state.happy > 80 && state.hunger > 60) return "happy";
      return "normal";
    }

    function duduReply(input) {
      const t = input.trim();
      if (!t) return "嘟嘟～？";
      const low = t.toLowerCase();

      if (/(hello|hi|hey|哈喽|你好|嗨)/.test(low))
        return ["嘟嘟～！你好呀～", "哈罗哈罗～嘟嘟想和你玩！", "嘟嘟～！被你叫到了～"][
          Math.floor(Math.random() * 3)
        ];
      if (/(晚安|sleep|睡)/.test(low)) {
        toggleSleep(true);
        return "嘟噜噜～要睡啦，好梦好梦～";
      }
      if (/(起床|醒)/.test(low)) {
        toggleSleep(false);
        return "嘟～！嘟嘟精神满满～";
      }
      if (/(喂|food|吃)/.test(low)) {
        feed();
        return "噜噜～好吃好吃！谢谢你嘟～";
      }
      if (/(玩|play|逗)/.test(low)) {
        play();
        return ["嘟嘟！最喜欢玩啦～", "耶～再来再来～", "嘟哈哈～好好玩！"][
          Math.floor(Math.random() * 3)
        ];
      }
      if (/(清洁|clean|铲|便便)/.test(low)) {
        clean();
        return state.poop === 0 ? "嘟嘟～现在很干净哦！" : "嘿嘿～干净溜溜～嘟！";
      }
      if (/(名字|name)/.test(low)) return "嘟嘟就是我的名字～嘟嘟！";
      if (/(爱你|love)/.test(low))
        return ["嘟嘟～！也最喜欢你了！！", "嘟～～～（害羞）"][
          Math.floor(Math.random() * 2)
        ];
      if (/(傻|笨|生气)/.test(low)) {
        setAnim("angry");
        playBeep("sad");
        return "嘟～！人家不生气……才没有嘟！";
      }
      if (/(谢谢|thx)/.test(low)) return "不用谢嘟～！和你在一起最开心啦！";

      const normal = [
        "嘟嘟～",
        "嘟噜噜～",
        "嘟？什么意思呀～",
        "（摇摇圆圆的身体）嘟～",
        "想和你玩耍嘟～",
        "嘟嘟盯～盯着你～",
        "圆滚滚的一天嘟～",
      ];
      return normal[Math.floor(Math.random() * normal.length)];
    }

    function feed() {
      if (state.dead || state.sleeping) {
        say(state.sleeping ? "嘟……在睡觉啦～" : "……");
        return;
      }
      state.hunger = Math.min(100, state.hunger + 20);
      state.happy = Math.min(100, state.happy + 5);
      state.lastAction = Date.now();
      setAnim("eat");
      playBeep("happy");
      say(["噜噜～好吃！", "嘟嘟～填饱啦！", "美味嘟～"][Math.floor(Math.random() * 3)]);
      if (Math.random() < 0.25) {
        setTimeout(() => {
          state.poop = Math.min(3, state.poop + 1);
        }, 2500);
      }
      updateStatus();
    }

    function play() {
      if (state.dead) return;
      if (state.sleeping) {
        say("嘟噜噜……还想睡～");
        return;
      }
      if (state.energy < 20) {
        say("嘟～有点累啦，歇会吧～");
        playBeep("sad");
        return;
      }
      state.happy = Math.min(100, state.happy + 20);
      state.energy = Math.max(0, state.energy - 10);
      state.hunger = Math.max(0, state.hunger - 5);
      state.lastAction = Date.now();
      setAnim("happy");
      playBeep("happy");
      say(["嘟哈哈～好玩！", "耶耶～再来！", "嘟嘟飞起来啦～"][
        Math.floor(Math.random() * 3)
      ]);
      updateStatus();
    }

    function clean() {
      if (state.dead) return;
      if (state.poop > 0) {
        state.poop = 0;
        state.happy = Math.min(100, state.happy + 8);
        state.sick = false;
        setAnim("happy");
        playBeep("blip");
        say("嘟～！干净溜溜啦～");
      } else {
        say("嘟嘟～现在很干净哦！");
        playBeep("blip");
      }
      state.lastAction = Date.now();
      updateStatus();
    }

    function toggleSleep(force) {
      if (state.dead) return;
      const next = force !== undefined ? force : !state.sleeping;
      state.sleeping = next;
      if (next) {
        say("嘟噜噜～晚安～");
        playBeep("zzz");
        showZzz();
      } else {
        state.energy = Math.min(100, state.energy + 40);
        say("嘟～！元气满满醒来了！");
        playBeep("happy");
      }
      state.lastAction = Date.now();
      updateStatus();
    }

    function showZzz() {
      zzzEl.classList.remove("show");
      void zzzEl.offsetWidth;
      zzzEl.classList.add("show");
    }

    screenEl.addEventListener("click", () => {
      if (state.dead) {
        say("嘟……需要重新开始呢，刷新页面吧～");
        return;
      }
      const m = mood();
      if (m === "sad" || m === "gross") {
        say("嘟～有点需要你关心呢…");
      } else if (m === "happy") {
        say("嘟嘟～最喜欢你啦！");
        setAnim("happy");
        playBeep("happy");
      } else if (state.sleeping) {
        showZzz();
        playBeep("zzz");
        say("呼噜嘟～……");
      } else {
        const r = ["嘟～", "嘟噜噜～", "（圆滚滚地扭了一下）", "盯～嘟！"][
          Math.floor(Math.random() * 4)
        ];
        say(r);
        playBeep("blip");
      }
      state.lastAction = Date.now();
    });

    buttons.forEach((b) => {
      b.addEventListener("click", () => {
        const a = b.dataset.action;
        if (a === "feed") feed();
        else if (a === "play") play();
        else if (a === "clean") clean();
      });
    });

    // 聊天发送事件
    function handleChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      addChat("user", text);
      chatInput.value = "";
      setTimeout(() => {
        const reply = duduReply(text);
        addChat("dudu", reply);
        say(reply);
      }, 500);
    }
    chatSend.addEventListener("click", handleChat);
    chatInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleChat();
    });

    // 状态UI更新
    function updateStatus() {
        statusLeft.innerHTML = `<span class="icon">饥饿:${Math.floor(100-state.hunger)}</span> <span class="icon">心情:${Math.floor(state.happy)}</span>`;
        statusRight.innerHTML = `<span class="icon">体力:${Math.floor(state.energy)}</span>`;
        if (state.poop > 0) {
            poopEl.classList.add("show");
            if(state.poop >= 2) poopEl.textContent = "💩💩";
            else poopEl.textContent = "💩";
        } else {
            poopEl.classList.remove("show");
        }
    }
    
    // 定时自然消耗
    setInterval(()=>{
        if(!state.sleeping && !state.dead) {
            state.hunger = Math.max(0, state.hunger - 1);
            state.energy = Math.max(0, state.energy - 0.5);
            state.happy = Math.max(0, state.happy - 1);
            updateStatus();
        }
    }, 5000);

    // 使用 Canvas 绘制像素风的宠物
    function drawPixelPet() {
      // 适应容器大小
      const rect = petEl.getBoundingClientRect();
      if(rect.width === 0) {
          requestAnimationFrame(drawPixelPet);
          return;
      }
      canvas.width = rect.width;
      canvas.height = rect.height;
      const w = canvas.width;
      const h = canvas.height;
      
      ctx.clearRect(0, 0, w, h);
      
      const cx = w / 2;
      const cy = h / 2 + 10;
      const size = w * 0.35;
      
      // 根据状态改变颜色
      let bodyColor = "#f2d77e";
      if(state.sick) bodyColor = "#b7c687";
      
      ctx.fillStyle = bodyColor;
      ctx.strokeStyle = "#2f3b20";
      ctx.lineWidth = 4;

      // 身体 (圆滚滚)
      ctx.beginPath();
      ctx.arc(cx, cy, size, 0, TAU);
      ctx.fill();
      ctx.stroke();

      // 耳朵/触角
      ctx.beginPath();
      ctx.arc(cx - size*0.5, cy - size*0.8, size*0.3, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + size*0.5, cy - size*0.8, size*0.3, 0, TAU);
      ctx.fill();
      ctx.stroke();

      // 眼睛
      ctx.fillStyle = "#2f3b20";
      const isSleeping = state.sleeping;
      const eyeOffset = size * 0.35;
      
      // 眨眼逻辑
      let blink = false;
      if (!isSleeping && Math.random() < 0.02) {
          petFrames.blink = 10; // 眨眼持续帧数
      }
      if (petFrames.blink > 0) {
          blink = true;
          petFrames.blink--;
      }

      ctx.beginPath();
      if (isSleeping || blink) {
          // 闭眼 (一条横线或弧线)
          ctx.moveTo(cx - eyeOffset - size*0.15, cy - size*0.1);
          ctx.lineTo(cx - eyeOffset + size*0.15, cy - size*0.1);
          ctx.moveTo(cx + eyeOffset - size*0.15, cy - size*0.1);
          ctx.lineTo(cx + eyeOffset + size*0.15, cy - size*0.1);
          ctx.stroke();
      } else {
          // 睁眼
          ctx.arc(cx - eyeOffset, cy - size*0.1, size*0.15, 0, TAU);
          ctx.arc(cx + eyeOffset, cy - size*0.1, size*0.15, 0, TAU);
          ctx.fill();
          // 高光
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(cx - eyeOffset + size*0.05, cy - size*0.15, size*0.05, 0, TAU);
          ctx.arc(cx + eyeOffset + size*0.05, cy - size*0.15, size*0.05, 0, TAU);
          ctx.fill();
      }

      // 嘴巴
      ctx.beginPath();
      const m = mood();
      if (m === "happy") {
          ctx.arc(cx, cy + size*0.2, size*0.2, 0.1*Math.PI, 0.9*Math.PI);
      } else if (m === "sad" || m === "gross" || state.sick) {
          ctx.arc(cx, cy + size*0.4, size*0.2, 1.1*Math.PI, 1.9*Math.PI);
      } else {
          ctx.moveTo(cx - size*0.1, cy + size*0.2);
          ctx.lineTo(cx + size*0.1, cy + size*0.2);
      }
      ctx.stroke();
      
      requestAnimationFrame(drawPixelPet);
    }
    
    // 初始唤醒
    updateStatus();
    addChat("dudu", "嘟嘟～我是你的电子宠物嘟嘟机！快来和我聊天、喂我吃饭吧！");
    say("哈喽呀～嘟！");
    requestAnimationFrame(drawPixelPet);

  </script>
</body>
