<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="100%">
  <desc>深度休眠。周常清空了，大任务还是那座山。</desc>
  <defs>
    <style>
      .bg { fill: #fdfbfb; }
      .card { fill: #ffffff; filter: drop-shadow(0px 8px 24px rgba(212, 181, 184, 0.25)); }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #4a4041; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #9e8e90; }
      .text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #6b5c5e; }
      .accent { fill: #d4b5b8; } /* 灰粉色 */
      .mountain { fill: #d4b5b8; opacity: 0.12; }
      .face { font-family: monospace; font-size: 20px; fill: #bfa7a9; font-weight: bold; }
    </style>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2c2c6" />
      <stop offset="100%" stop-color="#c9a7aa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="12" />

  <!-- Main Card -->
  <rect x="40" y="40" width="400" height="200" rx="24" class="card" />

  <!-- Abstract Background Mountain (The Big Task) -->
  <path d="M 40 240 L 160 100 L 250 160 L 350 70 L 440 160 L 440 240 Z" class="mountain" />

  <!-- Header -->
  <text x="75" y="95" class="title">mo.exe 运行面板</text>
  <text x="75" y="120" class="subtitle">当前模式：Sleepy-宝 💤 (深度休眠)</text>

  <!-- Task Checklist -->
  <!-- Task 1: Completed -->
  <rect x="75" y="145" width="16" height="16" rx="4" class="accent" />
  <path d="M 79 153 L 81.5 156 L 87 149" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  <text x="100" y="158" class="text">周常碎片任务 (已全部清空)</text>

  <!-- Task 2: Completed -->
  <rect x="75" y="170" width="16" height="16" rx="4" class="accent" />
  <path d="M 79 178 L 81.5 181 L 87 174" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  <text x="100" y="183" class="text">无糖斯里兰卡奶茶 (续航已加载)</text>

  <!-- Progress Bar (The Big Task) -->
  <text x="75" y="215" class="text">新副本大任务开荒：</text>
  <rect x="190" y="208" width="170" height="8" rx="4" fill="#f0eaeb" />
  <!-- Progress is at 1% -> highly realistic -->
  <rect x="190" y="208" width="8" height="8" rx="4" fill="url(#bar-grad)" />

  <!-- Cute Sleepy Face ASCII (Lying flat) -->
  <g transform="translate(395, 110)">
    <text x="0" y="0" class="face" transform="rotate(90)">_(:3」∠)_</text>
  </g>
</svg>
