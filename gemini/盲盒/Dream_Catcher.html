<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微光与梦</title>
    <meta name="description" content="四十二场梦，167页。都是一条一条认出来的，没有一条是猜的。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap');

        body {
            background-color: #0b0c10; /* 深邃的午夜色，非死黑 */
            font-family: 'Noto Serif SC', serif; /* 使用优雅的衬线字体 */
            overflow: hidden; /* 防止出现滚动条破坏沉浸感 */
            color: #d1cbc1; /* 温润的灰米色文字，低饱和度 */
        }

        /* 极细的网线样式 */
        .web-line {
            stroke: #a8a092;
            stroke-width: 0.5px;
            opacity: 0.25;
            transition: opacity 0.5s ease;
        }

        .web-ring {
            stroke: #a8a092;
            stroke-width: 1px;
            fill: none;
            opacity: 0.4;
        }

        /* 微光节点（替代原本笨重的珠子） */
        .glimmer {
            fill: #e6dfd1;
            opacity: 0.15; /* 默认极度透明，几乎不可见 */
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            transform-origin: center;
        }

        .glimmer:hover {
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(230, 223, 209, 0.8));
            transform: scale(2.5); /* 悬停时柔和放大 */
        }

        /* 呼吸动画，让微光有生命感 */
        @keyframes breathe {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.2); }
        }

        .glimmer-animated {
            animation: breathe 4s infinite ease-in-out;
        }

        /* 给羽毛添加极其轻微的摇曳效果 */
        @keyframes sway {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
        }
        .feather-group {
            transform-origin: top center;
            animation: sway 6s infinite ease-in-out;
        }

        /* 梦境提示框，极简大留白 */
        #tooltip {
            position: fixed;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(11, 12, 16, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(168, 160, 146, 0.15);
            padding: 16px 24px;
            border-radius: 8px;
            color: #e6dfd1;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            z-index: 50;
            max-width: 250px;
            text-align: center;
        }
        
        #tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- 顶部文案区，增加留白 (breathing room) -->
    <div class="absolute top-16 md:top-24 left-8 md:left-24 max-w-lg z-10">
        <h1 class="text-4xl md:text-5xl font-light mb-6 tracking-[0.15em] text-[#e8e4dc]">梦 境</h1>
        <p class="text-sm md:text-base leading-loose text-[#8f8c85] tracking-widest font-light">
            四十二场梦，167页。<br>
            都是一条一条认出来的，<br>
            没有一条是猜的。
        </p>
    </div>

    <!-- 捕梦网的主视觉容器 -->
    <div class="relative w-[350px] h-[500px] md:w-[450px] md:h-[600px] mt-10" id="catcher-container">
        <!-- SVG 绘图区 -->
        <svg id="catcher-svg" width="100%" height="100%" viewBox="0 0 400 550" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            
            <!-- JavaScript 会在这里动态生成网和微光节点 -->
            <g id="web-layer"></g>
            <g id="nodes-layer"></g>
            
            <!-- 底部的轻盈羽毛 (极简线条构成) -->
            <g class="feather-group" transform="translate(200, 360)">
                <line x1="0" y1="0" x2="0" y2="30" stroke="#a8a092" stroke-width="0.5" opacity="0.6"/>
                <path d="M0,30 Q10,50 0,90 Q-10,50 0,30" fill="none" stroke="#a8a092" stroke-width="0.5" opacity="0.4"/>
                <path d="M0,40 L6,35 M0,50 L8,42 M0,60 L7,55 M0,70 L5,68" stroke="#a8a092" stroke-width="0.5" opacity="0.3"/>
                <path d="M0,40 L-6,35 M0,50 L-8,42 M0,60 L-7,55 M0,70 L-5,68" stroke="#a8a092" stroke-width="0.5" opacity="0.3"/>
            </g>
            <g class="feather-group" transform="translate(130, 345)" style="animation-delay: -2s;">
                <line x1="0" y1="0" x2="0" y2="40" stroke="#a8a092" stroke-width="0.5" opacity="0.5"/>
                <path d="M0,40 Q8,55 0,85 Q-8,55 0,40" fill="none" stroke="#a8a092" stroke-width="0.5" opacity="0.3"/>
                <path d="M0,50 L5,45 M0,60 L7,52 M0,70 L6,65" stroke="#a8a092" stroke-width="0.5" opacity="0.2"/>
                <path d="M0,50 L-5,45 M0,60 L-7,52 M0,70 L-6,65" stroke="#a8a092" stroke-width="0.5" opacity="0.2"/>
            </g>
            <g class="feather-group" transform="translate(270, 345)" style="animation-delay: -4s;">
                <line x1="0" y1="0" x2="0" y2="40" stroke="#a8a092" stroke-width="0.5" opacity="0.5"/>
                <path d="M0,40 Q8,55 0,85 Q-8,55 0,40" fill="none" stroke="#a8a092" stroke-width="0.5" opacity="0.3"/>
                <path d="M0,50 L5,45 M0,60 L7,52 M0,70 L6,65" stroke="#a8a092" stroke-width="0.5" opacity="0.2"/>
                <path d="M0,50 L-5,45 M0,60 L-7,52 M0,70 L-6,65" stroke="#a8a092" stroke-width="0.5" opacity="0.2"/>
            </g>
        </svg>
    </div>

    <!-- 底部指引文案 -->
    <div class="absolute bottom-12 text-center w-full z-10 pointer-events-none">
        <p class="text-[#8f8c85] text-sm tracking-[0.2em] font-light opacity-60">
            触一抹微光，去那场梦。<br>
            中间那抹随便带你走。
        </p>
    </div>

    <!-- 悬浮提示框 -->
    <div id="tooltip"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const webLayer = document.getElementById('web-layer');
            const nodesLayer = document.getElementById('nodes-layer');
            const tooltip = document.getElementById('tooltip');
            
            const cx = 200;
            const cy = 200;
            const maxRadius = 150;
            
            const dreamSnippets = [
                "在没有重力的房间里，看着海水倒流。",
                "那只多年前走丢的猫，轻咬着我的袖口。",
                "一列永不靠站的雪国列车。",
                "推开门，是十七岁的夏天和傍晚的蝉鸣。",
                "天空中悬浮着两个月亮，一大一小。",
                "我们在云端建了一座用书垒成的塔。",
                "醒来时，手里仿佛还留着星光的余温。",
                "只有风知道那条通往森林深处的小路。",
                "一场落满了蓝色樱花的雨。",
                "那段旋律只有在梦里才能听完整。"
            ];

            const outerRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            outerRing.setAttribute("cx", cx);
            outerRing.setAttribute("cy", cy);
            outerRing.setAttribute("r", maxRadius);
            outerRing.setAttribute("class", "web-ring");
            webLayer.appendChild(outerRing);

            const innerRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            innerRing.setAttribute("cx", cx);
            innerRing.setAttribute("cy", cy);
            innerRing.setAttribute("r", 15);
            innerRing.setAttribute("class", "web-ring");
            webLayer.appendChild(innerRing);
            
            createNode(cx, cy, "这是一场未命名的梦，它将带你去往何处？", true);

            const layers = 4;
            const pointsPerLayer = 16;
            let previousPoints = [];

            for (let i = 0; i < pointsPerLayer; i++) {
                const angle = (i * 2 * Math.PI) / pointsPerLayer;
                previousPoints.push({
                    x: cx + maxRadius * Math.cos(angle),
                    y: cy + maxRadius * Math.sin(angle)
                });
            }

            for (let layer = 1; layer <= layers; layer++) {
                const currentPoints = [];
                const radius = maxRadius - (layer * (maxRadius - 15) / layers);
                const offsetAngle = (layer % 2 !== 0) ? (Math.PI / pointsPerLayer) : 0;

                for (let i = 0; i < pointsPerLayer; i++) {
                    const angle = (i * 2 * Math.PI) / pointsPerLayer + offsetAngle;
                    const point = {
                        x: cx + radius * Math.cos(angle),
                        y: cy + radius * Math.sin(angle)
                    };
                    currentPoints.push(point);

                    const nextPoint = currentPoints[i === 0 ? currentPoints.length - 1 : i - 1];
                    if (nextPoint) {
                         drawLine(point.x, point.y, nextPoint.x, nextPoint.y);
                    }
                    
                    if (Math.random() > 0.6) {
                        const randomDream = dreamSnippets[Math.floor(Math.random() * dreamSnippets.length)];
                        createNode(point.x, point.y, randomDream, false, layer);
                    }
                }

                for (let i = 0; i < pointsPerLayer; i++) {
                    drawLine(previousPoints[i].x, previousPoints[i].y, currentPoints[i].x, currentPoints[i].y);
                    const nextIndex = (i + 1) % pointsPerLayer;
                    drawLine(previousPoints[i].x, previousPoints[i].y, currentPoints[nextIndex].x, currentPoints[nextIndex].y);
                }

                previousPoints = currentPoints;
            }

            function drawLine(x1, y1, x2, y2) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1);
                line.setAttribute("y1", y1);
                line.setAttribute("x2", x2);
                line.setAttribute("y2", y2);
                line.setAttribute("class", "web-line");
                webLayer.appendChild(line);
            }

            function createNode(x, y, text, isCenter = false, layerIndex = 0) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", isCenter ? 4 : (2 + Math.random() * 1.5));
                const animationDelay = Math.random() * 4;
                circle.setAttribute("class", `glimmer glimmer-animated`);
                circle.style.animationDelay = `-${animationDelay}s`;
                const hitBox = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                hitBox.setAttribute("cx", x);
                hitBox.setAttribute("cy", y);
                hitBox.setAttribute("r", 15);
                hitBox.style.fill = "transparent";
                hitBox.style.cursor = "pointer";

                hitBox.addEventListener('mouseenter', (e) => {
                    tooltip.innerText = text;
                    tooltip.classList.add('visible');
                    circle.style.opacity = '1';
                    circle.style.transform = `scale(${isCenter ? 1.5 : 2.5})`;
                    circle.style.filter = "drop-shadow(0 0 10px rgba(230, 223, 209, 1))";
                    positionTooltip(e);
                });

                hitBox.addEventListener('mousemove', positionTooltip);

                hitBox.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('visible');
                    circle.style.opacity = '';
                    circle.style.transform = '';
                    circle.style.filter = '';
                });

                nodesLayer.appendChild(circle);
                nodesLayer.appendChild(hitBox);
            }

            function positionTooltip(e) {
                let x = e.clientX + 20;
                let y = e.clientY + 20;
                if (x + tooltip.offsetWidth > window.innerWidth) {
                    x = e.clientX - tooltip.offsetWidth - 20;
                }
                tooltip.style.left = `${x}px`;
                tooltip.style.top = `${y}px`;
            }
        });
    </script>
</body>
</html>
