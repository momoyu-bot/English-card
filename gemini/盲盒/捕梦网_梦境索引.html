<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦境</title>
    <meta name="description" content="悬挂在数字仓库里的捕梦网索引页，用来捕捉和牵引小文件的美梦">
    
    <style>
        body {
            /* 温柔的低饱和度香槟米灰色背景 */
            background-color: #F7F5F0; 
            /* 清冷的灰粉色文字 */
            color: #BBAFAC; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        
        .dreamcatcher-placeholder {
            text-align: center;
            border: 2px dashed #D6CFCB;
            padding: 50px;
            border-radius: 50%;
            width: 240px;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(187, 175, 172, 0.15);
            transition: all 0.5s ease;
            cursor: pointer;
        }
        
        .dreamcatcher-placeholder:hover {
            transform: scale(1.05);
            border-style: solid;
        }
        
        .title-text {
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        
        .sub-text {
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="dreamcatcher-placeholder">
        <div class="title-text">🕸️ 捕梦网编织中</div>
        <div class="sub-text">风吹过的时候<br>等宝来挂上第一枚梦境</div>
    </div>
</body>
</html>
