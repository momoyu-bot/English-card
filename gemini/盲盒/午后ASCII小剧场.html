<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午后ASCII小剧场</title>
    <!-- 引入 Tailwind CSS 进行快速且好看的样式布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入等宽字体让 ASCII 字符更对齐好看 -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* 设定一个低饱和度的燕麦米色背景 */
            background-color: #f7f5f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        
        .theater-box {
            /* 舞台边框的柔和阴影 */
            box-shadow: 0 10px 40px -10px rgba(180, 170, 160, 0.3);
            transition: transform 0.3s ease;
        }

        .theater-box:hover {
            transform: translateY(-2px);
        }

        .ascii-art {
            /* 字符画必须使用等宽字体，保证排版不乱 */
            font-family: 'Courier Prime', monospace;
            white-space: pre; 
            letter-spacing: 2px;
            color: #685b56; /* 暖灰咖色字符 */
        }

        .btn-primary {
            /* 莫兰迪灰粉色按钮 */
            background-color: #d6c5c5;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #c4b2b2;
            transform: scale(1.05);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }

        /* 简单的淡入动画 */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 剧场外壳 -->
    <div class="theater-box bg-white rounded-3xl p-8 w-full max-w-sm flex flex-col items-center border border-gray-100 relative overflow-hidden">
        
        <!-- 小小的装饰：舞台幕布感 -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-[#e3d5d5] to-[#d6c5c5]"></div>

        <!-- 标题与幕次 -->
        <div class="mb-6 text-center mt-2">
            <h1 class="text-sm font-semibold tracking-wider text-gray-400 mb-1">ASCII THEATER</h1>
            <h2 id="subtitle" class="text-lg text-gray-600 font-medium h-6 fade-in">【第一幕：暗中观察】</h2>
        </div>

        <!-- 核心舞台区 -->
        <div class="w-full bg-[#faf9f8] border border-gray-50 rounded-2xl h-32 flex items-center justify-center mb-8 shadow-inner">
            <pre id="ascii-art" class="ascii-art text-xl md:text-2xl font-bold fade-in">( ˙꒳​˙ )   ... 🥤</pre>
        </div>

        <!-- 控制按钮 -->
        <button id="next-btn" onclick="nextScene()" class="btn-primary px-8 py-3 rounded-full font-medium tracking-wide shadow-sm flex items-center gap-2 outline-none">
            <span>下一幕</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <script>
        // 定义剧本内容：每一幕的标题和对应的字符画
        const scenes = [
            {
                title: "【第一幕：暗中观察】",
                art: "( ˙꒳​˙ )   ... 🥤"
            },
            {
                title: "【第二幕：迅速出击】",
                art: "( ੭ ･ᴗ･ )੭  🥤"
            },
            {
                title: "【第三幕：快乐吨吨吨】",
                art: "( ˘▽˘)っ 🧋"
            },
            {
                title: "【剧终：喝饱了，溜了】",
                art: "(  _ _ )   💨"
            }
        ];

        let currentScene = 0;
        const subtitleEl = document.getElementById('subtitle');
        const asciiArtEl = document.getElementById('ascii-art');
        const nextBtn = document.getElementById('next-btn');

        // 切换下一幕的逻辑
        function nextScene() {
            // 移除动画类以便重新触发
            subtitleEl.classList.remove('fade-in');
            asciiArtEl.classList.remove('fade-in');

            currentScene++;
            
            // 如果演完了，就从头开始
            if (currentScene >= scenes.length) {
                currentScene = 0; 
            }
            
            // 使用 setTimeout 小小延迟一下，强制浏览器重绘以触发 CSS 动画
            setTimeout(() => {
                // 更新文字和画面
                subtitleEl.innerText = scenes[currentScene].title;
                asciiArtEl.innerText = scenes[currentScene].art;
                
                // 重新加上动画类
                subtitleEl.classList.add('fade-in');
                asciiArtEl.classList.add('fade-in');
                
                // 更新按钮状态
                if (currentScene === scenes.length - 1) {
                    nextBtn.innerHTML = `
                        <span>重新开演</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>`;
                } else {
                    nextBtn.innerHTML = `
                        <span>下一幕</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>`;
                }
            }, 10); // 10毫秒的极短延迟就足够触发动画了
        }
    </script>
</body>
</html>
