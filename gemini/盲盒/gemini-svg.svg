<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <desc>霓虹圆环转着，中间一颗星核。没有字，就是转。</desc>
  <rect width="100%" height="100%" fill="#0a0a1a"/>
  
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
  </defs>

  <g transform="translate(400, 400)">
    
    <g stroke="url(#cyan-grad)" fill="none" filter="url(#neon-glow)">
      <circle cx="0" cy="0" r="280" stroke-width="2" stroke-dasharray="10 30">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="260" stroke-width="4" stroke-dasharray="80 40 10 40">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="240" stroke-width="1" stroke-dasharray="5 5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g stroke="url(#pink-grad)" stroke-width="3" fill="none" filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="25s" repeatCount="indefinite"/>
      <polygon points="0,-180 155.88,-90 155.88,90 0,180 -155.88,90 -155.88,-90"/>
      <polygon points="90,-155.88 180,0 90,155.88 -90,155.88 -180,0 -90,-155.88"/>
    </g>

    <g filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="scale" values="0.9; 1.1; 0.9" dur="3s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="60" fill="url(#cyan-grad)" opacity="0.2"/>
      <circle cx="0" cy="0" r="40" fill="url(#pink-grad)" opacity="0.5"/>
      <path d="M 0,-50 L 15,-15 L 50,0 L 15,15 L 0,50 L -15,15 L -50,0 L -15,-15 Z" fill="#ffffff">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#ffffff" filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle cx="120" cy="0" r="4"/>
      <circle cx="-120" cy="0" r="4"/>
      <circle cx="0" cy="120" r="4"/>
      <circle cx="0" cy="-120" r="4"/>
    </g>
    
  </g>
</svg>
