<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>小粉脸蛋儿不翻车版</title>
    <meta name="description" content="修正了倾斜方向与透视比例的最终完美果冻球">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f2eceb; 
            margin: 0;
        }
        .jelly-avatar {
            width: 140px;
            height: 140px;
            background-color: #E84798; 
            border-radius: 50%;
            position: relative;
            box-shadow: 0 12px 32px rgba(232, 71, 152, 0.2);
            overflow: hidden; 
        }
        .capsule {
            position: absolute;
            background-color: #fcfcfc; 
            height: 29.26px; 
            border-radius: 20px;
        }
        .left-eye {
            width: 13.58px; 
            left: 59.7%; 
            top: 29.2%;
            transform: translate(-50%, -50%) rotate(-26.3deg); /* 加上负号，向左倾斜 \ */
        }
        .right-eye {
            width: 9.03px; 
            left: 81.3%;
            top: 25.15%;
            transform: translate(-50%, -50%) rotate(-26.3deg); /* 加上负号，向左倾斜 \ */
        }
    </style>
</head>
<body>
    <div class="jelly-avatar">
        <div class="capsule left-eye"></div>
        <div class="capsule right-eye"></div>
    </div>
</body>
</html>
