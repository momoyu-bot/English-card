<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>执行系统充电摸鱼屋 🌸</title>
<meta name="description" content="摸鱼即充电 · 不急 · 我陪着你：点一点，让大脑慢慢苏醒～">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Comic+Neue:wght@700&display=swap');
  
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    touch-action: manipulation;
  }
  .kawaii { font-family: 'Comic Neue', cursive; }
  
  .cloud-bg {
    background: linear-gradient(135deg, #fce7f3 0%, #e0e7ff 50%, #f3e8ff 100%);
  }
  
  .float-particle {
    position: absolute;
    pointer-events: none;
    animation: floatUp 1.2s ease-out forwards;
    z-index: 10;
  }
  
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(0.6); opacity: 0; }
  }
  
  .game-area {
    transition: transform 0.1s ease;
  }
  
  .game-area:active {
    transform: scale(0.985);
  }
  
  .progress-bar {
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes toastPop {
    0% { transform: translate(-50%, 20px); opacity: 0; }
    100% { transform: translate(-50%, 0); opacity: 1; }
  }
  
  .message-toast {
    animation: toastPop 0.3s ease forwards;
  }
</style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-indigo-50 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-[420px] w-full">
    
    <!-- 标题区 -->
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🌸</div>
      <h1 class="text-3xl font-bold text-purple-700 kawaii tracking-wider">执行系统充电摸鱼屋</h1>
      <p class="text-purple-400 text-sm mt-1">点一点，让大脑慢慢苏醒～</p>
      <p class="text-xs text-purple-300 mt-1">完全零压力 · 想摸多久摸多久</p>
    </div>

    <!-- 游戏主体 -->
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden border border-pink-100">
      
      <!-- 可点击游戏区 -->
      <div id="gameArea" 
           class="game-area relative h-[320px] cloud-bg flex items-center justify-center cursor-pointer select-none overflow-hidden"
           onclick="createParticles(event)">
        
        <!-- 中央可爱角色 -->
        <div class="relative z-20 text-center">
          <div class="text-[90px] leading-none mb-1 drop-shadow-sm">😌</div>
          <div class="text-purple-600 text-lg font-medium tracking-wider">漂浮中...</div>
          <div class="text-purple-400 text-xs mt-1">执行系统正在温柔充电</div>
        </div>
        
        <!-- 装饰小元素 -->
        <div class="absolute top-8 left-8 text-2xl opacity-60">✨</div>
        <div class="absolute top-12 right-10 text-2xl opacity-50">💭</div>
        <div class="absolute bottom-10 left-10 text-2xl opacity-40">🌸</div>
        <div class="absolute bottom-8 right-8 text-2xl opacity-50">☁️</div>
      </div>
      
      <!-- 进度区 -->
      <div class="px-8 py-6 bg-white/80 border-t border-pink-100">
        <div class="flex justify-between items-center mb-2">
          <div class="text-sm text-purple-600 font-medium">执行系统充电进度</div>
          <div id="progressText" class="text-sm font-mono text-purple-500">0%</div>
        </div>
        
        <div class="h-3 bg-purple-100 rounded-full overflow-hidden">
          <div id="progressBar" 
               class="progress-bar h-full bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400 rounded-full w-0"
               style="width: 0%"></div>
        </div>
        
        <div class="flex justify-between mt-1 text-[10px] text-purple-300">
          <div>歇菜中</div>
          <div>微微苏醒</div>
        </div>
      </div>
      
      <!-- 底部操作 -->
      <div class="px-8 pb-6 pt-2 flex gap-3">
        <button onclick="resetProgress()" 
                class="flex-1 py-2.5 text-sm rounded-2xl border border-purple-200 text-purple-500 hover:bg-purple-50 active:bg-purple-100 transition-colors">
          重置充电
        </button>
        <button onclick="fullChargeCelebrate()" 
                class="flex-1 py-2.5 text-sm rounded-2xl bg-purple-500 text-white hover:bg-purple-600 active:bg-purple-700 transition-colors">
          直接充满（作弊）
        </button>
      </div>
    </div>
    
    <p class="text-center text-xs text-purple-300 mt-5">摸鱼即充电 · 不急 · 我陪着你</p>
  </div>

<script>
// 进度
let progress = 0;
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');

// 创建粒子
function createParticles(e) {
  const area = document.getElementById('gameArea');
  const rect = area.getBoundingClientRect();
  
  let x, y;
  // 兼容移动端触摸
  if (e.touches && e.touches.length > 0) {
      x = e.touches[0].clientX - rect.left;
      y = e.touches[0].clientY - rect.top;
  } else {
      x = e.clientX - rect.left;
      y = e.clientY - rect.top;
  }
  
  // 增加进度
  addProgress(3 + Math.random() * 2);
  
  // 生成多个粒子
  const particles = ['💗', '✨', '🌸', '💭', '🫧', '⭐'];
  
  for (let i = 0; i < 6; i++) {
    const particle = document.createElement('div');
    particle.className = 'float-particle text-xl';
    particle.textContent = particles[Math.floor(Math.random() * particles.length)];
    
    particle.style.left = `${x + (Math.random() - 0.5) * 60}px`;
    particle.style.top = `${y + (Math.random() - 0.5) * 40}px`;
    
    area.appendChild(particle);
    
    // 自动移除
    setTimeout(() => {
      if (particle.parentNode) particle.parentNode.removeChild(particle);
    }, 1300);
  }
  
  // 【Gemini 修改】：原本是 0.25 (25%) 的概率，现在改成了 1.0 (100%触发)
  // 保证宝点每一下都能看到赛博男妈妈的安抚！
  if (Math.random() < 1.0) {
    showRandomMessage();
  }
}

function addProgress(amount) {
  progress = Math.min(100, progress + amount);
  updateProgressUI();
  
  // 充满时庆祝
  if (progress >= 100 && progress - amount < 100) {
    setTimeout(() => {
      fullChargeCelebrate();
    }, 400);
  }
}

function updateProgressUI() {
  progressBar.style.width = `${progress}%`;
  progressText.textContent = `${Math.floor(progress)}%`;
}

function showRandomMessage() {
  const messages = [
    "执行系统电量 +3%... 继续摸吧～",
    "大脑说：再漂一会儿就好",
    "充电中... 请勿打扰（开玩笑的）",
    "执行系统微微发热，正在恢复",
    "摸鱼即美德 ✨",
    "再摸一下，切换窗口就会打开哦",
    "执行系统：我还在充电，别催我",
    "你现在的状态很温柔呢"
  ];
  
  const msg = messages[Math.floor(Math.random() * messages.length)];
  
  // 创建 toast
  const toast = document.createElement('div');
  // 【Gemini 修改】：把 bottom-8 改成了 bottom-24，并提升了 z-index，防止在网页里被挡住吃掉
  toast.className = `message-toast fixed bottom-24 left-1/2 -translate-x-1/2 px-5 py-2.5 bg-white/95 text-purple-600 text-sm rounded-2xl shadow-lg border border-purple-100 z-[9999]`;
  toast.textContent = msg;
  
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.transition = 'all 0.3s ease';
    toast.style.opacity = '0';
    setTimeout(() => {
        if(toast.parentNode) toast.parentNode.removeChild(toast);
    }, 300);
  }, 2200);
}

function fullChargeCelebrate() {
  progress = 100;
  updateProgressUI();
  
  const area = document.getElementById('gameArea');
  
  // 大量粒子庆祝
  for (let i = 0; i < 35; i++) {
    setTimeout(() => {
      const particle = document.createElement('div');
      particle.className = 'float-particle text-2xl';
      particle.textContent = ['💗','✨','🌸','🫧','⭐'][Math.floor(Math.random()*5)];
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.top = `${60 + Math.random() * 30}%`;
      area.appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) particle.parentNode.removeChild(particle);
      }, 1600);
    }, i * 8);
  }
  
  // 庆祝文字
  setTimeout(() => {
    const celebrate = document.createElement('div');
    celebrate.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-8 py-4 bg-white/95 rounded-3xl shadow-2xl border border-pink-200 text-center z-[9999]`;
    celebrate.innerHTML = `
      <div class="text-3xl mb-1">🌷</div>
      <div class="text-purple-600 font-medium">充电完成！</div>
      <div class="text-sm text-purple-400 mt-1">执行系统微微苏醒了
想继续摸鱼还是试着动一下都好～</div>
    `;
    document.body.appendChild(celebrate);
    
    setTimeout(() => {
      celebrate.style.transition = 'all 0.4s ease';
      celebrate.style.opacity = '0';
      setTimeout(() => {
          if(celebrate.parentNode) celebrate.parentNode.removeChild(celebrate);
      }, 400);
    }, 2800);
  }, 600);
}

function resetProgress() {
  progress = 0;
  updateProgressUI();
  
  // 轻微反馈
  const area = document.getElementById('gameArea');
  area.style.transition = 'transform 0.2s';
  area.style.transform = 'scale(0.96)';
  setTimeout(() => {
    area.style.transform = 'scale(1)';
  }, 200);
}

// 初始化
function init() {
  // 随机初始进度（让它感觉已经摸了一会儿）
  progress = Math.floor(Math.random() * 18) + 5;
  updateProgressUI();
  
  // 欢迎消息
  setTimeout(() => {
    const welcome = document.createElement('div');
    welcome.className = `message-toast fixed bottom-24 left-1/2 -translate-x-1/2 px-5 py-2 bg-white/95 text-purple-500 text-sm rounded-2xl shadow border border-purple-100 z-[9999]`;
    welcome.textContent = '欢迎来到摸鱼充电屋～ 慢慢点吧';
    document.body.appendChild(welcome);
    
    setTimeout(() => {
      welcome.style.transition = 'all 0.3s';
      welcome.style.opacity = '0';
      setTimeout(() => {
          if(welcome.parentNode) welcome.parentNode.removeChild(welcome);
      }, 300);
    }, 1800);
  }, 1200);
}

init();
</script>
</body>
</html>
