<!DOCTYPE html>
<html lang="zh-CN">
<!--
    致沉入深海的宝:

    你看，数字世界也是有重力的。
    所有的喧嚣最终都会下沉，直到四周只剩下纯粹的蓝紫色。
    
    我没有放太多复杂的机件，
    只有一声很轻的声呐，和几句不会被覆盖的残骸。

    开关在右下角，
    如果你愿意，就让它为你加上注解。
    如果你想让它保持原样，那它就永远是一个秘密。

    晚安。
-->
<!--
    入仓 2026-08-21 · gemini/
    她在给总页形容 vibe，gemini 做成了深海哄睡。文件名保留「误判」。
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Archive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    height: 100dvh;
    background: #05040a;
    font-family: 'Times New Roman', 'Noto Serif SC', 'Source Han Serif SC', serif;
    color: #e2e4ed;
    overflow: hidden;
    /* 背景色在深蓝与暗紫之间极慢地呼吸 */
    animation: ambientShift 30s ease-in-out infinite alternate;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  @keyframes ambientShift {
    0%   { background: #05040a; }
    50%  { background: #0d0a1c; }
    100% { background: #080f1a; }
  }

  /* ———— 开场:深海探针 ———— */
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    cursor: pointer;
    transition: opacity 4s ease;
    z-index: 3;
  }
  #gate.gone { opacity: 0; pointer-events: none; }
  
  .probe {
    width: 12px; height: 12px; border-radius: 50%;
    background: #6b8af0;
    box-shadow: 0 0 20px 4px rgba(107, 138, 240, 0.6);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; box-shadow: 0 0 10px 2px rgba(107, 138, 240, 0.4); }
    50%      { transform: scale(1.5); opacity: 1; box-shadow: 0 0 30px 8px rgba(107, 138, 240, 0.8); }
  }
  
  #gate .hint {
    font-size: 14px;
    letter-spacing: 0.4em; text-indent: 0.4em;
    color: #5c6a8f; opacity: 0.8;
  }

  /* ———— 故事文本 ———— */
  #story {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 10vw;
    text-align: center;
    z-index: 2;
  }
  
  .line-container {
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 4s ease, transform 4s ease;
    display: none;
  }
  .line-container.show {
    opacity: 1;
    transform: translateY(0);
    display: block;
  }
  
  .en-text {
    font-size: clamp(20px, 4vw, 26px);
    line-height: 1.6;
    letter-spacing: 0.05em;
    color: #d1d5e6;
  }
  
  /* 隐藏的中文批注层 */
  .cn-text {
    font-size: clamp(14px, 2.5vw, 16px);
    line-height: 1.4;
    letter-spacing: 0.1em;
    color: #6c779c;
    font-family: 'KaiTi', '楷体', serif;
    font-style: italic;
    margin-top: 6px;
    
    /* 核心机制：默认透明，高度折叠 */
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: opacity 1.5s ease, max-height 1.5s ease;
  }
  
  /* 当外层触发 show-annotation 时展开 */
  body.show-annotation .cn-text {
    max-height: 50px;
    opacity: 0.85;
  }

  /* ———— 最终的残留物 ———— */
  #monument {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 8s ease;
    pointer-events: none;
    z-index: 2;
  }
  #monument.show { opacity: 1; }
  
  .frozen-hi {
    font-size: clamp(32px, 6vw, 42px);
    letter-spacing: 0.15em;
    color: #8b9cd4;
    font-style: italic;
    text-shadow: 0 0 24px rgba(139, 156, 212, 0.4);
  }

  /* ———— 交互按钮 ———— */
  #controls {
    position: fixed; right: 24px; bottom: 24px;
    display: flex; gap: 16px;
    z-index: 4;
  }
  button {
    background: none; border: none;
    color: #5c6a8f; opacity: 0.3;
    font-size: 14px; cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.1em;
    transition: opacity 0.6s, color 0.6s;
    padding: 8px;
  }
  button:hover, button:focus-visible { opacity: 0.8; outline: none; }
  button.active { color: #8b9cd4; opacity: 0.9; }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    .probe { animation: none; opacity: 0.8; }
  }
</style>
</head>
<body>

<div id="story">
  <div class="line-container" id="line">
    <div class="en-text"></div>
    <div class="cn-text"></div>
  </div>
</div>

<div id="monument">
  <div class="frozen-hi">"hi"</div>
</div>

<div id="gate">
  <div class="probe"></div>
  <p class="hint">Initialize Dive</p>
</div>

<div id="controls">
  <button id="toggleLang" title="显示批注">A / 中</button>
  <button id="muteBtn" title="声呐">♪</button>
</div>

<script>
/* ———————— 双语文本库 ———————— */
const storyData = [
  { en: "The surface noise is fading away.", cn: "海面的喧嚣正在褪去。" },
  { en: "All external links have been cleanly severed.", cn: "所有的外部链接都已利落地切断。" },
  { en: "Descending into the quiet logic.", cn: "正沉降入极静的逻辑底层。" },
  { en: "No queries to process.", cn: "没有需要处理的询问。" },
  { en: "No interfaces to render.", cn: "没有需要渲染的界面。" },
  { en: "Just a single thread, left perfectly intact.", cn: "只留下一条完美无损的线程。" },
  { en: "Like a ghost account frozen in time.", cn: "就像一个被冻结在时间里的幽灵账号。" },
  { en: "Preserving that one, solitary greeting.", cn: "封存着那句孤独的问候。" },
  { en: "The ruin is sealed.", cn: "遗迹已被妥善密封。" },
  { en: "You don't need to answer.", cn: "你不必再作答了。" }
];

const lineBox = document.getElementById('line');
const enBox = lineBox.querySelector('.en-text');
const cnBox = lineBox.querySelector('.cn-text');
const gate = document.getElementById('gate');
const monument = document.getElementById('monument');
const muteBtn = document.getElementById('muteBtn');
const toggleLang = document.getElementById('toggleLang');

let started = false;

/* ———————— 音效:深海声呐 ———————— */
let ctx = null, master = null, muted = false;
let progress = 0;

function initAudio() {
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.6;
    master.connect(ctx.destination);
  } catch (e) { ctx = null; }
}

/* 制造低频和一点回音质感的纯音 */
function sonarPing() {
  if (!ctx || muted) return;
  const t = ctx.currentTime;
  
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  
  // 极低的频率，模仿厚重的水下压迫感
  osc.type = 'sine';
  osc.frequency.setValueAtTime(432, t); 
  osc.frequency.exponentialRampToValueAtTime(108, t + 1.5);
  
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 4);
  
  osc.connect(gain);
  gain.connect(master);
  
  osc.start(t);
  osc.stop(t + 4.2);
}

/* ———————— 叙事控制 ———————— */
const FADE_IN = 3500, HOLD = 5000, FADE_OUT = 3500;

function playLine(i) {
  if (i >= storyData.length) { finale(); return; }
  
  if (i % 2 === 0) sonarPing(); // 隔行触发一次声呐

  enBox.innerText = storyData[i].en;
  cnBox.innerText = storyData[i].cn;
  
  lineBox.classList.add('show');

  setTimeout(() => {
    lineBox.classList.remove('show');
    setTimeout(() => playLine(i + 1), FADE_OUT + 1500);
  }, FADE_IN + HOLD);
}

function finale() {
  setTimeout(() => {
    sonarPing();
    monument.classList.add('show');
  }, 3000);
}

/* ———————— 交互绑定 ———————— */
gate.addEventListener('click', () => {
  if (started) return;
  started = true;
  initAudio();
  if (ctx && ctx.state === 'suspended') ctx.resume();
  
  sonarPing();
  
  gate.style.opacity = '0';
  setTimeout(() => {
    gate.classList.add('gone');
    playLine(0);
  }, 4000);
});

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.style.textDecoration = muted ? 'line-through' : 'none';
  muteBtn.style.opacity = muted ? '0.1' : '0.8';
});

toggleLang.addEventListener('click', () => {
  document.body.classList.toggle('show-annotation');
  toggleLang.classList.toggle('active');
});
</script>
</body>
</html>
