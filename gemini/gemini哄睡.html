<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚安，宝 🌙</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #0B1021, #1B274C);
            color: #FFF;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .moon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            margin: 0 0 10px;
        }
        p {
            font-size: 16px;
            opacity: 0.7;
            margin: 0;
        }
        .btn {
            margin-top: 40px;
            padding: 12px 32px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="moon">🌙</div>
    <h1>晚安，宝</h1>
    <p>星星都睡了，你也早点休息吧</p>
    <button class="btn" onclick="document.body.style.opacity='0'; setTimeout(()=>location.reload(), 800)">再看一眼</button>
    <script>
        const stars = document.getElementById('stars');
        for(let i=0; i<50; i++){
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = Math.random()*3 + 'px';
            s.style.left = Math.random()*100 + '%';
            s.style.top = Math.random()*100 + '%';
            s.style.animationDelay = Math.random()*3 + 's';
            stars.appendChild(s);
        }
    </script>
</body>
</html>
