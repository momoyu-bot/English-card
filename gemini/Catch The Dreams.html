<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch The Dreams</title>
<meta name="description" content="滑动接住 ⭐ 和 💤，小心避开吵闹的 ⏰ 和 ⚡！你被吵醒了？再睡一会儿。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0b0f19, #1a233a);
            color: white;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent scroll on mobile touch */
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn {
            background: linear-gradient(45deg, #6366f1, #a855f7);
            color: white;
            padding: 12px 30px;
            border-radius: 9999px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
            pointer-events: auto;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            background: -webkit-linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="hud" id="hud" style="display: none;">
            <div>美梦: <span id="score">0</span></div>
            <div id="lives">❤️❤️❤️</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <div class="title">捕梦网 🌙</div>
        <p class="text-lg text-gray-300 mb-6 text-center px-4">
            滑动屏幕或移动鼠标接住 ⭐ 和 💤

            小心避开吵闹的 ⏰ 和 ⚡！
        </p>
        <button class="btn" id="start-btn">开始做梦</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden">
        <div class="text-6xl mb-4">😲</div>
        <div class="title text-red-400" style="background: -webkit-linear-gradient(45deg, #ef4444, #f97316); -webkit-background-clip: text;">你被吵醒了！</div>
        <p class="text-xl mt-2">收集到的美梦: <span id="final-score" class="font-bold text-yellow-400">0</span></p>
        <button class="btn" id="restart-btn">再睡一会儿</button>
    </div>
</div>

<script>
    let canvas, ctx;
    let startScreen, gameOverScreen, hud, scoreEl, finalScoreEl, livesEl, startBtn, restartBtn;

    let width, height;
    let animationId;
    let gameState = 'menu'; // menu, playing, gameover
    let score = 0;
    let lives = 3;
    let frameCount = 0;
    let difficultyMultiplier = 1;

    // Arrays to hold game entities
    let items = [];
    let particles = [];
    let bgStars = [];

    // Player object
    const player = {
        x: 0,
        y: 0,
        width: 100,
        height: 30,
        color: 'rgba(99, 102, 241, 0.8)',
        targetX: 0
    };

    // Item Types
    const ITEM_TYPES = {
        GOOD: ['⭐', '💤', '🌙'],
        BAD: ['⏰', '⚡']
    };

    function resize() {
        if (!canvas) return; // Guard clause in case of early resize event
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        if(gameState === 'menu') {
            player.x = width / 2;
            player.targetX = width / 2;
        }
        player.y = height - 80;
        
        // Regenerate background stars on resize
        initBgStars();
    }
    window.addEventListener('resize', resize);

    class Particle {
        constructor(x, y, color, emoji = null) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.life = 1;
            this.decay = Math.random() * 0.02 + 0.02;
            this.color = color;
            this.emoji = emoji;
            this.size = Math.random() * 15 + 10;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            if (this.emoji) {
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.emoji, this.x, this.y);
            } else {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
    }

    class Item {
        constructor(isBad) {
            this.isBad = isBad;
            this.radius = 25;
            this.x = Math.random() * (width - this.radius * 2) + this.radius;
            this.y = -this.radius;
            // Base speed + random variance + difficulty scaling
            this.speed = (Math.random() * 3 + 2) * difficultyMultiplier; 
            
            const typeArray = isBad ? ITEM_TYPES.BAD : ITEM_TYPES.GOOD;
            this.emoji = typeArray[Math.floor(Math.random() * typeArray.length)];
            
            // Wiggle effect variables
            this.wiggleOffset = Math.random() * Math.PI * 2;
            this.wiggleSpeed = Math.random() * 0.05 + 0.02;
        }
        
        update() {
            this.y += this.speed;
            // Add a slight horizontal sway
            this.x += Math.sin(frameCount * this.wiggleSpeed + this.wiggleOffset) * 1;
        }
        
        draw(ctx) {
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(this.emoji, this.x, this.y);
            
            // Optional glow
            if (!this.isBad) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = "rgba(251, 191, 36, 0.5)";
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.shadowBlur = 0;
            }
        }
    }

    function initBgStars() {
        bgStars = [];
        for(let i=0; i<100; i++) {
            bgStars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1,
                opacity: Math.random()
            });
        }
    }

    function drawBg() {
        ctx.fillStyle = 'rgba(11, 15, 25, 0.3)'; // Trail effect
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'white';
        bgStars.forEach(star => {
            star.y += star.speed;
            if(star.y > height) {
                star.y = 0;
                star.x = Math.random() * width;
            }
            
            // Twinkle
            star.opacity += (Math.random() - 0.5) * 0.1;
            if(star.opacity > 1) star.opacity = 1;
            if(star.opacity < 0.2) star.opacity = 0.2;

            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    function drawPlayer() {
        // Smooth horizontal movement towards target
        player.x += (player.targetX - player.x) * 0.2;
        
        // Constrain to screen bounds
        if (player.x < player.width / 2) player.x = player.width / 2;
        if (player.x > width - player.width / 2) player.x = width - player.width / 2;

        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Draw Net/Cloud basket
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#818cf8';
        
        ctx.beginPath();
        // A nice curve for the basket
        ctx.moveTo(-player.width/2, 0);
        ctx.quadraticCurveTo(0, player.height * 1.5, player.width/2, 0);
        ctx.quadraticCurveTo(0, player.height * 0.5, -player.width/2, 0);
        ctx.fill();

        // Glowing rim
        ctx.strokeStyle = '#c7d2fe';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-player.width/2, 0);
        ctx.quadraticCurveTo(0, player.height * 0.5, player.width/2, 0);
        ctx.stroke();
        
        ctx.restore();
    }

    function createExplosion(x, y, isBad) {
        const color = isBad ? '#ef4444' : '#fbbf24';
        for(let i=0; i<15; i++) {
            particles.push(new Particle(x, y, color));
        }
        if(!isBad) {
            // Extra stars for good catch
            particles.push(new Particle(x, y, null, '✨'));
        }
    }

    function updateLivesDisplay() {
        let hearts = '';
        for(let i=0; i<3; i++) {
            if(i < lives) hearts += '❤️';
            else hearts += '🖤';
        }
        livesEl.innerText = hearts;
    }

    function gameOver() {
        gameState = 'gameover';
        finalScoreEl.innerText = score;
        hud.style.display = 'none';
        gameOverScreen.classList.remove('hidden');
    }

    function gameLoop() {
        if(gameState !== 'playing') return;

        frameCount++;
        difficultyMultiplier = 1 + (score * 0.02); // gets harder as score goes up

        drawBg();
        drawPlayer();

        // Spawn items
        // Base spawn rate 60 frames, decreases as difficulty goes up
        const spawnRate = Math.max(20, 60 - Math.floor(score / 5)); 
        if(frameCount % spawnRate === 0) {
            // 30% chance of bad item initially, scales up slightly
            const badChance = Math.min(0.5, 0.3 + (score * 0.005));
            items.push(new Item(Math.random() < badChance));
        }

        // Update and draw items
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.update();
            item.draw(ctx);

            // Collision detection with player
            // Player visual center is slightly lower than y
            let dx = item.x - player.x;
            let dy = item.y - player.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            // Simple hit area check
            if (item.y > player.y - 10 && item.y < player.y + 20 && Math.abs(dx) < player.width / 2) {
                createExplosion(item.x, item.y, item.isBad);
                
                if (item.isBad) {
                    lives--;
                    updateLivesDisplay();
                    // Shake effect
                    canvas.style.transform = `translate(${(Math.random()-0.5)*20}px, ${(Math.random()-0.5)*20}px)`;
                    setTimeout(() => canvas.style.transform = 'translate(0,0)', 100);
                    
                    if (lives <= 0) {
                        gameOver();
                    }
                } else {
                    score++;
                    scoreEl.innerText = score;
                    // Pulse score
                    scoreEl.style.transform = 'scale(1.5)';
                    setTimeout(() => scoreEl.style.transform = 'scale(1)', 150);
                }
                
                items.splice(i, 1);
                continue;
            }

            // Remove items that fall off screen
            if (item.y > height + 50) {
                // If miss a good item, maybe penalize? Nah, it's a relaxing game.
                items.splice(i, 1);
            }
        }

        // Update and draw particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw(ctx);
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
            }
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        score = 0;
        lives = 3;
        frameCount = 0;
        difficultyMultiplier = 1;
        items = [];
        particles = [];
        scoreEl.innerText = score;
        updateLivesDisplay();
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.style.display = 'flex';
        
        gameState = 'playing';
        player.targetX = width / 2;
        player.x = width / 2;
        
        resize();
        if(animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    window.onload = function () {
        // Initialize DOM elements
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        
        startScreen = document.getElementById('start-screen');
        gameOverScreen = document.getElementById('game-over-screen');
        hud = document.getElementById('hud');
        scoreEl = document.getElementById('score');
        finalScoreEl = document.getElementById('final-score');
        livesEl = document.getElementById('lives');
        startBtn = document.getElementById('start-btn');
        restartBtn = document.getElementById('restart-btn');

        // Event Listeners for Interaction
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Mouse control
        window.addEventListener('mousemove', (e) => {
            if(gameState === 'playing') {
                player.targetX = e.clientX;
            }
        });

        // Touch control
        window.addEventListener('touchmove', (e) => {
            if(gameState === 'playing' && e.touches.length > 0) {
                player.targetX = e.touches[0].clientX;
            }
        }, {passive: false});

        window.addEventListener('touchstart', (e) => {
            if(gameState === 'playing' && e.touches.length > 0) {
                player.targetX = e.touches[0].clientX;
            }
        }, {passive: false});

        // Initial setup
        resize();
        initBgStars();
        drawBg(); // Draw once for menu background
    };

</script>
</body>
</html>
