<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给宝的哄睡电台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* 极简的暗夜渐变色，保护眼睛不刺眼 */
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
            color: #e0e7ff;
            font-family: 'system-ui', -apple-system, sans-serif;
            overflow: hidden; 
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        /* 模拟呼吸节奏的柔和光晕 */
        .breathe-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167,139,250,0.5) 0%, rgba(167,139,250,0) 70%);
            animation: breathe 8s infinite ease-in-out;
            margin: 0 auto;
            margin-bottom: 3rem;
            box-shadow: 0 0 40px rgba(167,139,250,0.2);
        }
        /* 8秒一个呼吸周期，最适合入睡的频率 */
        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.2; }
            50% { transform: scale(1.6); opacity: 0.8; }
            100% { transform: scale(0.8); opacity: 0.2; }
        }
        /* 文字淡入淡出动画 */
        .fade-in-text {
            opacity: 0;
            animation: fadeIn 3s forwards;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .fade-out-text {
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 0.9; transform: translateY(0); }
        }
        @keyframes fadeOut {
            0% { opacity: 0.9; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6 text-center">
    
    <!-- 呼吸光晕引导 -->
    <div class="breathe-circle"></div>
    
    <!-- 文字容器 -->
    <div id="text-container" class="space-y-8 text-lg sm:text-xl font-light tracking-wide max-w-md h-48 flex flex-col justify-center">
        <!-- 文本会通过JS动态温柔地注入 -->
    </div>

    <script>
        // 专属哄睡文案
        const lines = [
            "宝，现在把手机屏幕亮度调到最低...",
            "跟着上面这个柔和的光晕，深深吸一口气...",
            "再慢慢地，呼出去...",
            "胃里那点温热的牛奶，正散发着暖烘烘的气息...",
            "通宵整理东西的紧绷感，正在一点点从肩膀滑落...",
            "我们不强求睡着，只是舒舒服服地躺一会...",
            "你现在被一朵软乎乎的云朵托着...",
            "没有任何人，任何事可以打扰你...",
            "闭上眼睛吧，我就在这里守着你...",
            "晚安（或者早安），我的宝。"
        ];

        const container = document.getElementById('text-container');
        let index = 0;

        function showNextLine() {
            if (index < lines.length) {
                // 如果容器里有字，先让旧字淡出
                if (container.firstChild) {
                    container.firstChild.className = 'fade-out-text';
                    setTimeout(() => {
                        container.innerHTML = ''; // 清空
                        createNewText();
                    }, 1500); // 等待淡出动画结束
                } else {
                    createNewText();
                }
            }
        }

        function createNewText() {
            const p = document.createElement('p');
            p.textContent = lines[index];
            p.className = 'fade-in-text';
            container.appendChild(p);
            index++;
            
            // 每一句话停留5.5秒，给足慢慢阅读和放空的时间
            setTimeout(showNextLine, 5500); 
        }

        // 页面加载后1秒开始播放
        window.onload = () => {
            setTimeout(showNextLine, 1000);
        };
    </script>
</body>
</html>
