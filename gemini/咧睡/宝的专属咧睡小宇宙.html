<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝的专属咧睡小宇宙</title>
<meta name="description" content="跟着光晕慢慢呼吸。脑子里还在转的情节，写下来让它飘走。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: #e0e7ff;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.3; box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
            50% { transform: scale(1.5); opacity: 0.8; box-shadow: 0 0 60px rgba(139, 92, 246, 0.8); }
            100% { transform: scale(0.8); opacity: 0.3; box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
        }
        .breathing-orb {
            animation: breathe 8s infinite ease-in-out;
            background: radial-gradient(circle at center, rgba(167, 139, 250, 0.8) 0%, rgba(99, 102, 241, 0.2) 70%, transparent 100%);
        }
        @keyframes floatUpAndFade {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { transform: translateY(-20px) scale(1); opacity: 0.9; }
            80% { transform: translateY(-150px) scale(1.1); opacity: 0.5; }
            100% { transform: translateY(-200px) scale(1.2); opacity: 0; }
        }
        .thought-bubble {
            animation: floatUpAndFade 6s linear forwards;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        .star { position: absolute; background-color: white; border-radius: 50%; animation: twinkle infinite ease-in-out; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">
    <div id="star-container" class="absolute inset-0 z-0 pointer-events-none"></div>
    <div class="z-10 absolute top-12 text-center px-4 w-full">
        <h1 class="text-2xl font-light text-indigo-200 tracking-wider mb-2">夜深了，宝</h1>
        <p class="text-sm text-indigo-400 opacity-80">跟着光晕的节奏，慢慢呼吸</p>
    </div>
    <div class="z-10 relative flex items-center justify-center w-64 h-64 my-12">
        <div class="breathing-orb absolute inset-0 rounded-full blur-md"></div>
        <div id="breathe-text" class="absolute text-xl font-medium text-white tracking-widest drop-shadow-lg transition-opacity duration-1000">吸气...</div>
    </div>
    <div class="z-10 absolute bottom-20 w-full px-6 flex flex-col items-center">
        <p class="text-xs text-indigo-300 mb-4 opacity-70">脑子里还在想小说情节？写下来，让它飘走</p>
        <div class="flex w-full max-w-sm bg-white/5 border border-indigo-500/30 rounded-full p-1 backdrop-blur-sm shadow-xl">
            <input type="text" id="thought-input" class="flex-1 bg-transparent text-indigo-100 placeholder-indigo-400/50 px-4 py-2 outline-none text-sm" placeholder="例如：男主到底什么时候表白..." autocomplete="off">
            <button id="release-btn" class="bg-indigo-600/80 hover:bg-indigo-500 text-white px-5 py-2 rounded-full text-sm transition-colors duration-300">放空</button>
        </div>
    </div>
    <div id="thoughts-container" class="absolute bottom-40 w-full h-64 z-20 pointer-events-none flex justify-center"></div>
    <script>
        const breatheText = document.getElementById('breathe-text');
        let isExhaling = false;
        setInterval(() => {
            breatheText.style.opacity = 0;
            setTimeout(() => {
                isExhaling = !isExhaling;
                breatheText.innerText = isExhaling ? "呼气..." : "吸气...";
                breatheText.style.opacity = 1;
            }, 500);
        }, 4000);
        const input = document.getElementById('thought-input');
        const releaseBtn = document.getElementById('release-btn');
        const thoughtsContainer = document.getElementById('thoughts-container');
        const releaseThought = () => {
            const text = input.value.trim();
            if (!text) return;
            const bubble = document.createElement('div');
            bubble.className = 'thought-bubble text-indigo-200/90 text-sm md:text-base px-4 py-2 bg-indigo-900/40 rounded-2xl border border-indigo-400/20 backdrop-blur-sm whitespace-nowrap shadow-lg';
            bubble.innerText = text;
            bubble.style.marginLeft = `${(Math.random() - 0.5) * 40}px`;
            thoughtsContainer.appendChild(bubble);
            input.value = '';
            setTimeout(() => bubble.remove(), 6000);
        };
        releaseBtn.addEventListener('click', releaseThought);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') releaseThought(); });
        const starContainer = document.getElementById('star-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.animationDuration = `${Math.random() * 3 + 2}s`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starContainer.appendChild(star);
        }
    </script>
</body>
</html>
