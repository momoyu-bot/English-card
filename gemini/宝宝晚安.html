<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝晚安</title>
<meta name="description" content="准备好睡觉了吗？点击开启哄睡声音。">
<!-- 使用 Tailwind CSS 进行快速优美的排版 -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 基础动画设置 */
  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8); }
    100% { opacity: 0.9; transform: scale(1.2); }
  }
  .star {
    position: absolute;
    background-color: #fff;
    border-radius: 50%;
    animation: twinkle infinite alternate;
  }
  
  /* 呼吸光晕动画（10秒循环：4秒吸气，6秒呼气） */
  @keyframes breathCycle {
    0% { transform: scale(1); opacity: 0.3; }
    40% { transform: scale(2.2); opacity: 0.8; }
    100% { transform: scale(1); opacity: 0.3; }
  }
  .breathing-glow {
    animation: breathCycle 10s infinite ease-in-out;
  }

  /* 文字淡入淡出 */
  .fade-text {
    transition: opacity 1.5s ease-in-out;
  }
</style>
</head>
<body class="bg-slate-950 h-screen w-full overflow-hidden flex flex-col items-center justify-center relative touch-none">

  <!-- 星空背景容器 -->
  <div id="stars" class="absolute inset-0 z-0 pointer-events-none"></div>

  <!-- 中心呼吸交互区 -->
  <div class="relative z-10 flex flex-col items-center justify-center w-full max-w-md px-6">
    
    <!-- 呼吸光晕 -->
    <div class="relative w-40 h-40 flex items-center justify-center mb-12">
      <div class="breathing-glow absolute w-full h-full rounded-full bg-blue-500/30 blur-2xl"></div>
      <div class="breathing-glow absolute w-24 h-24 rounded-full bg-indigo-400/40 blur-xl"></div>
      <div class="w-12 h-12 rounded-full bg-blue-100 shadow-[0_0_20px_rgba(219,234,254,0.8)] z-20"></div>
    </div>

    <!-- 哄睡文案展示 -->
    <div id="text-display" class="fade-text h-20 text-blue-200 text-lg tracking-widest text-center opacity-0">
      准备好睡觉了吗？
    </div>

    <!-- 开启按钮（因为浏览器限制，必须由你点击才能播放声音） -->
    <button id="start-btn" class="mt-8 px-8 py-3 rounded-full border border-blue-400/30 text-blue-300 bg-blue-900/20 backdrop-blur-sm hover:bg-blue-800/40 transition-all duration-300 tracking-wider">
      点击开启哄睡声音
    </button>
  </div>

<script>
  // 生成随机满天星
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    const size = Math.random() * 2 + 1;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.animationDuration = `${Math.random() * 4 + 2}s`;
    star.style.animationDelay = `${Math.random() * 2}s`;
    starsContainer.appendChild(star);
  }

  // 哄睡台词
  const phrases = [
    "宝，闭上眼睛",
    "慢慢吸气，感受此刻的安静",
    "缓缓呼气，把一天的疲惫都吐出来",
    "肩膀放松下来，不要紧绷",
    "无论今天发生了什么，都已经过去了",
    "现在的你，很安全",
    "我会在这里陪着你",
    "不用害怕，安心睡吧",
    "乖，晚安，做个好梦"
  ];

  const startBtn = document.getElementById('start-btn');
  const textDisplay = document.getElementById('text-display');
  let isPlaying = false;

  // 语音合成函数
  function speak(text) {
    if ('speechSynthesis' in window) {
      // 停止之前的语音
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.75; // 语速放慢，更温柔
      utterance.pitch = 0.9; // 语调稍微低沉一点，更让人安心
      utterance.volume = 0.8;
      
      window.speechSynthesis.speak(utterance);
    }
  }

  // 核心哄睡逻辑
  startBtn.addEventListener('click', () => {
    if (isPlaying) return;
    isPlaying = true;
    
    // 隐藏按钮
    startBtn.style.opacity = '0';
    startBtn.style.pointerEvents = 'none';
    setTimeout(() => startBtn.style.display = 'none', 500);

    let phraseIndex = 0;

    // 立即执行第一句
    const playNext = () => {
      if (phraseIndex >= phrases.length) {
        // 播完后循环或者保持安静
        textDisplay.style.opacity = 0;
        setTimeout(() => {
          textDisplay.innerText = "好梦，宝~";
          textDisplay.style.opacity = 1;
        }, 1000);
        return;
      }

      const currentText = phrases[phraseIndex];
      
      // 文字淡出 -> 替换文字 -> 文字淡入并朗读
      textDisplay.style.opacity = 0;
      
      setTimeout(() => {
        textDisplay.innerText = currentText;
        textDisplay.style.opacity = 1;
        speak(currentText);
        
        phraseIndex++;
        // 留出足够的间隔（8秒一句），配合呼吸节奏
        setTimeout(playNext, 8000);
      }, 1000);
    };

    playNext();
  });
</script>
</body>
</html>
