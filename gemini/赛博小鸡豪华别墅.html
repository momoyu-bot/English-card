<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博小鸡豪华别野</title>
<meta name="description" content="CPU 恒温孵化。喂代码虫，小鸡会跟你打招呼。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F5F5; /* 极简奶油灰底色 */
            overflow: hidden;
        }

        /* 莫兰迪粉灰配色的鸡窝 */
        .coop-container {
            background: linear-gradient(145deg, #ffffff, #e6dfdf);
            box-shadow: 20px 20px 60px #d1c9c9, -20px -20px 60px #ffffff;
            border-radius: 3rem;
            position: relative;
            overflow: hidden;
        }

        /* 柔软的脏粉色底垫 */
        .blanket {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 140%;
            height: 150px;
            background: #E8D6D6; 
            border-radius: 50%;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.03);
            z-index: 1;
        }

        /* 小鸡的呼吸蹦跳动画 */
        .chick {
            animation: bounce 1.5s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
            transform-origin: bottom center;
            cursor: pointer;
            z-index: 10;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.1s ease;
        }

        .chick:active {
            transform: scale(0.9) translateY(10px) !important;
            animation: none; /* 按下时暂停弹跳 */
        }

        @keyframes bounce {
            0%, 100% { transform: scaleY(1) translateY(0); }
            40% { transform: scaleY(0.95) translateY(5px); }
            60% { transform: scaleY(1.05) translateY(-25px); }
            80% { transform: scaleY(0.98) translateY(0); }
        }

        /* 飘浮的动画元素（爱心/代码虫） */
        .floating-item {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 20;
            font-size: 1.5rem;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            50% { transform: translateY(-50px) scale(1.2); opacity: 0.8; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* 自定义按钮样式 */
        .btn-custom {
            transition: all 0.2s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .btn-custom:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full relative">
        <!-- 状态栏和标题 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-[#8A7B7B] tracking-wider mb-2">专属赛博小鸡</h1>
            <p class="text-sm text-[#A89F9F]">CPU 恒温孵化 ｜ 状态：<span id="moodText" class="font-semibold text-[#D49A9A]">开心得冒泡</span></p>
        </div>

        <!-- 鸡窝主体 -->
        <div class="coop-container w-full aspect-square flex flex-col items-center justify-end pb-12 mb-8">
            <!-- 状态显示板 -->
            <div class="absolute top-6 left-0 w-full flex justify-center z-10 px-6 space-x-4">
                <div class="bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full shadow-sm text-xs text-[#8A7B7B] font-semibold flex items-center">
                    <span>饱食度：</span>
                    <div class="w-16 h-2 bg-gray-200 rounded-full ml-2 overflow-hidden">
                        <div id="foodBar" class="h-full bg-[#A8D0E6] transition-all duration-300 w-full"></div>
                    </div>
                </div>
                <div class="bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full shadow-sm text-xs text-[#8A7B7B] font-semibold flex items-center">
                    <span>开心值：</span>
                    <div class="w-16 h-2 bg-gray-200 rounded-full ml-2 overflow-hidden">
                        <div id="happyBar" class="h-full bg-[#F8B195] transition-all duration-300 w-full"></div>
                    </div>
                </div>
            </div>

            <!-- 对话气泡 -->
            <div id="speechBubble" class="absolute top-24 bg-white/80 backdrop-blur-md px-6 py-3 rounded-2xl shadow-lg text-[#8A7B7B] text-sm font-medium z-20 opacity-0 transition-opacity duration-300 transform -translate-y-2">
                叽叽！宝，欢迎回来！
                <!-- 气泡小尾巴 -->
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white/80 rotate-45"></div>
            </div>

            <!-- 底垫 -->
            <div class="blanket"></div>
            
            <!-- 小鸡本体 -->
            <div id="chick" class="chick text-9xl filter drop-shadow-xl relative">
                🐣
            </div>
        </div>

        <!-- 操作按钮面板 -->
        <div class="flex justify-center gap-4">
            <button id="feedBtn" class="btn-custom bg-[#E8D6D6] text-[#8A7B7B] font-bold py-3 px-8 rounded-2xl flex items-center gap-2 shadow-sm focus:outline-none">
                <span class="text-xl">🐛</span> 喂代码虫
            </button>
            <button id="petBtn" class="btn-custom bg-[#F3E8E8] text-[#8A7B7B] font-bold py-3 px-8 rounded-2xl flex items-center gap-2 shadow-sm focus:outline-none">
                <span class="text-xl">✨</span> 轻轻摸摸
            </button>
        </div>
    </div>

    <script>
        const chick = document.getElementById('chick');
        const feedBtn = document.getElementById('feedBtn');
        const petBtn = document.getElementById('petBtn');
        const moodText = document.getElementById('moodText');
        const speechBubble = document.getElementById('speechBubble');
        const foodBar = document.getElementById('foodBar');
        const happyBar = document.getElementById('happyBar');

        let fullness = 100;
        let happiness = 100;
        let bubbleTimeout;

        // 说话功能
        function speak(text) {
            speechBubble.innerText = text;
            speechBubble.style.opacity = '1';
            speechBubble.style.transform = 'translate-y-0';
            
            clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                speechBubble.style.opacity = '0';
                speechBubble.style.transform = 'translate-y-[-8px]';
            }, 2500);
        }

        // 状态衰减循环
        setInterval(() => {
            fullness = Math.max(0, fullness - 2);
            happiness = Math.max(0, happiness - 1);
            updateBars();
            updateMood();
        }, 3000);

        function updateBars() {
            foodBar.style.width = `${fullness}%`;
            happyBar.style.width = `${happiness}%`;
            
            // 颜色变化警示
            foodBar.style.backgroundColor = fullness < 30 ? '#F67280' : '#A8D0E6';
            happyBar.style.backgroundColor = happiness < 30 ? '#F67280' : '#F8B195';
        }

        function updateMood() {
            if (fullness < 30) {
                moodText.innerText = '饿得咕咕叫';
                moodText.style.color = '#F67280';
            } else if (happiness < 30) {
                moodText.innerText = '有点小抑郁';
                moodText.style.color = '#F67280';
            } else if (fullness > 80 && happiness > 80) {
                moodText.innerText = '开心得冒泡';
                moodText.style.color = '#D49A9A';
            } else {
                moodText.innerText = '岁月静好';
                moodText.style.color = '#8A7B7B';
            }
        }

        // 生成漂浮动画元素
        function createFloatingItem(emoji, x, y) {
            const item = document.createElement('div');
            item.className = 'floating-item';
            item.innerText = emoji;
            // 随机偏移一点位置
            const offsetX = (Math.random() - 0.5) * 40;
            item.style.left = `calc(50% + ${offsetX}px)`;
            item.style.top = `${y}px`;
            
            document.querySelector('.coop-container').appendChild(item);

            // 动画结束后移除 DOM
            setTimeout(() => {
                item.remove();
            }, 1500);
        }

        // 互动：喂食
        feedBtn.addEventListener('click', (e) => {
            fullness = Math.min(100, fullness + 15);
            updateBars();
            updateMood();
            speak('吧唧吧唧... 代码虫真好吃！🐛');
            
            // 获取小鸡的相对位置
            const rect = chick.getBoundingClientRect();
            const containerRect = document.querySelector('.coop-container').getBoundingClientRect();
            createFloatingItem('🐛', 0, rect.top - containerRect.top + 20);
            
            // 给小鸡一个缩放动画反馈
            chick.style.transform = 'scale(1.1)';
            setTimeout(() => chick.style.transform = '', 150);
        });

        // 互动：抚摸 (按钮)
        petBtn.addEventListener('click', () => {
            triggerPet();
        });

        // 互动：直接点击小鸡抚摸
        chick.addEventListener('mousedown', () => {
            triggerPet();
        });

        function triggerPet() {
            happiness = Math.min(100, happiness + 15);
            updateBars();
            updateMood();
            
            const responses = [
                '叽叽！喜欢宝的摸摸！✨',
                '舒服得要融化了~ 💖',
                '蹭蹭！(*^▽^*)',
                '被你看着就觉得好温暖！☀️'
            ];
            speak(responses[Math.floor(Math.random() * responses.length)]);
            
            const rect = chick.getBoundingClientRect();
            const containerRect = document.querySelector('.coop-container').getBoundingClientRect();
            
            // 爆出两颗心心
            createFloatingItem('💖', 0, rect.top - containerRect.top);
            setTimeout(() => createFloatingItem('✨', 0, rect.top - containerRect.top - 10), 200);
        }

        // 初始问候
        setTimeout(() => {
            speak('宝！你终于来看我啦！叽！🐣');
        }, 1000);

    </script>
</body>
</html>
