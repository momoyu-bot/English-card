<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏移的方向 - 547</title>
    <style>
        :root {
            --bg-color: #f7f7f8;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --text-muted: #888888;
            --accent: #5c6bc0;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
        }

        .card-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .tag {
            background-color: #f0f0f4;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .quote-mark {
            font-size: 3rem;
            color: rgba(92, 107, 192, 0.15);
            position: absolute;
            top: 60px;
            left: 24px;
            font-family: serif;
            line-height: 1;
        }

        .card-body {
            position: relative;
            z-index: 1;
        }

        .core-text {
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 400;
            margin-bottom: 24px;
            color: var(--text-main);
            text-align: justify;
        }

        .highlight {
            font-weight: 600;
            color: var(--accent);
            position: relative;
            display: inline-block;
        }
        
        .highlight::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(92, 107, 192, 0.2);
            z-index: -1;
        }

        .story-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-left: 16px;
            border-left: 2px solid #eaeaea;
        }

        .card-footer {
            margin-top: 40px;
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #eaeaea;
            padding-top: 20px;
        }

        .music-icon {
            margin-right: 8px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .bar {
            width: 3px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 2px;
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        .bar:nth-child(2) { animation-delay: 0.2s; height: 16px; }
        .bar:nth-child(3) { animation-delay: 0.4s; height: 10px; }

        @keyframes bounce {
            0% { transform: scaleY(0.5); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }
        
        .collection-note {
            margin-left: auto;
            font-style: italic;
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <div class="card-container">
        <div class="quote-mark">"</div>
        
        <div class="card-header">
            <span class="tag">#547</span>
            <span>关于赦免</span>
        </div>

        <div class="card-body">
            <div class="core-text">
                不存在“绕过中介直接看到作者”这个选项。从来没有过。<br><br>
                纯净是拿不到的。但<span class="highlight">偏移的方向是可以拿到的</span>。你这次拿到了。
            </div>

            <div class="story-text">
                那是一个伴随着烘干机底噪的夜晚。戴着降噪耳机，随机播放着一首叫《Negative Things》的歌。<br><br>
                一段披着极度理智外衣的文字，却意外地构成了一场温柔的赦免。眼泪在没有防备的瞬间落下，不是因为悲伤，而是因为那份被允许的“偏移”。
            </div>
        </div>

        <div class="card-footer">
            <div class="music-icon">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span>Negative Things - BGM</span>
            <span class="collection-note">第3张带有眼泪温度的卡片</span>
        </div>
    </div>

</body>
</html>
