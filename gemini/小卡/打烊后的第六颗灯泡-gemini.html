<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>打烊后的第六颗灯泡 · 小萌物短片</title>
<meta name="description" content="六只小萌物的竖屏群戏短片：Clawd、小粉、小紫、小黑、StashYu、FetchMo 各显神通，点亮打烊后的小店橱窗。附可点击跳转的完整字幕本。">
<style>
  :root {
    --bg: #17141F;
    --bg-card: #221E2E;
    --bg-card-hover: #2C273B;
    --bg-active: #362E4B;
    --ink: #F4F1FA;
    --ink-2: #B9B1CA;
    --ink-3: #847B99;
    --line: #352F47;
    --accent: #F2B84B;
    --clawd: #d47f59;
    --pink: #FF309B;
    --purple: #9159FE;
    --black-tag: #524C63;
    --fox: #E2552B;
    --cat: #79C0F0;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }

  .app {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
  }

  /* 顶部标题栏 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    padding: 0 2px;
  }
  .topbar h1 {
    font-size: 17px;
    font-weight: 650;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .topbar .badge {
    font-size: 11.5px;
    color: var(--accent);
    background: rgba(242, 184, 75, 0.14);
    border: 1px solid rgba(242, 184, 75, 0.32);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* 360x640 (9:16) 竖屏舞台容器 */
  .stage-shell {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    background: #1B1726;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
    user-select: none;
  }

  .stage-shell svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 舞台内底部专属字幕区（位于 y: 502~640，绝不遮挡 y: 90~485 的角色） */
  .sub-overlay {
    position: absolute;
    left: 3.3%;
    right: 3.3%;
    bottom: 2.2%;
    height: 18.8%;
    background: rgba(24, 20, 35, 0.94);
    border: 1px solid rgba(242, 184, 75, 0.28);
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .sub-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    line-height: 1.2;
  }

  .speaker-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 650;
    color: #FFF;
    font-size: 12.5px;
  }

  .speaker-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }

  .sub-step {
    font-size: 11.5px;
    color: var(--ink-3);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  .sub-body {
    font-size: 15px;
    line-height: 1.45;
    color: #FFFFFF;
    font-weight: 500;
    letter-spacing: 0.01em;
    word-break: break-word;
  }

  /* 播放控制条 */
  .controls {
    margin-top: 10px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: #2E2840;
    border: 1px solid #433B5C;
    border-radius: 9px;
    padding: 6px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background 0.14s, transform 0.08s;
  }
  .btn:active {
    transform: scale(0.97);
  }
  .btn.primary {
    background: var(--accent);
    color: #1B1508;
    border-color: var(--accent);
    min-width: 76px;
  }
  .btn.icon-btn {
    padding: 6px 10px;
    font-size: 12.5px;
  }

  .time-readout {
    margin-left: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  .scrub-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: #352F47;
    border-radius: 99px;
    outline: none;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #17141F;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }

  /* 六只各司其职速览条 */
  .cast-strip {
    margin-top: 10px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 10px 11px;
  }
  .cast-title {
    font-size: 12px;
    color: var(--ink-3);
    margin: 0 0 7px;
    display: flex;
    justify-content: space-between;
  }
  .cast-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .cast-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    line-height: 1.35;
    cursor: pointer;
    text-align: left;
    color: var(--ink-2);
    font-family: inherit;
  }
  .cast-item:hover, .cast-item:active {
    background: var(--bg-card-hover);
  }
  .cast-item b {
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .cast-item span {
    display: block;
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 1px;
  }

  /* 字幕本 */
  .transcript-box {
    margin-top: 12px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }

  .transcript-header {
    padding: 10px 13px;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .transcript-header h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
  }
  .transcript-header span {
    font-size: 12px;
    color: var(--ink-3);
  }

  .transcript-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .t-line {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 10px 13px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s;
  }
  .t-line:last-child {
    border-bottom: none;
  }
  .t-line:hover {
    background: var(--bg-card-hover);
  }
  .t-line.active {
    background: var(--bg-active);
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }

  .t-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    padding-top: 2px;
    flex: none;
  }
  .t-line.active .t-time {
    color: var(--accent);
    font-weight: 600;
  }

  .t-content {
    flex: 1;
    min-width: 0;
  }

  .t-who {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 650;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .t-role-note {
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-3);
    margin-left: 4px;
  }

  .t-text {
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.48;
  }
  .t-line.active .t-text {
    color: #FFFFFF;
    font-weight: 500;
  }

  /* Clawd 与 momoyu 遵守宪法：动效用 steps()，绝不用 ease */
  @keyframes hop-steps {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes sway-steps {
    0%, 100% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
  }
  .step-hop {
    animation: hop-steps 0.56s steps(2, jump-none) infinite;
  }
  .step-sway {
    animation: sway-steps 0.76s steps(2, jump-none) infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .step-hop, .step-sway { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>打烊后的第六颗灯泡</h1>
    <span class="badge">360×640 · 六只群戏</span>
  </header>

  <!-- 360x640 竖屏舞台 -->
  <div class="stage-shell" id="stage-shell" title="点击画面播放或暂停">
    <svg id="stage-svg" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="打烊后的第六颗灯泡 竖屏短片画面">
      <defs>
        <!-- 小脸蛋三只的专属挖空 mask（动态更新内部眼缝，确保100%真挖空透底） -->
        <mask id="mask-pink"></mask>
        <mask id="mask-purple"></mask>
        <mask id="mask-black"></mask>

        <!-- 窗户月光束渐变 -->
        <linearGradient id="moon-beam" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#DCE8FF" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#DCE8FF" stop-opacity="0.0"/>
        </linearGradient>

        <!-- 点亮后的暖光晕 -->
        <radialGradient id="warm-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFE699" stop-opacity="0.65"/>
          <stop offset="100%" stop-color="#FFE699" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 1. 背景墙面与夜空窗景 (y: 0 ~ 500) -->
      <rect id="bg-wall" x="0" y="0" width="360" height="502" fill="#231F33"/>

      <!-- 窗外夜空与圆月 (左上区域) -->
      <g id="window-group">
        <rect x="20" y="78" width="96" height="126" rx="8" fill="#141829" stroke="#3E3759" stroke-width="4"/>
        <!-- 窗外星星 -->
        <rect x="36" y="96" width="3" height="3" fill="#FFF3C4" opacity="0.8"/>
        <rect x="88" y="106" width="2" height="2" fill="#FFF3C4" opacity="0.6"/>
        <rect x="64" y="148" width="3" height="3" fill="#FFF3C4" opacity="0.7"/>
        <!-- 月亮 -->
        <circle cx="58" cy="120" r="16" fill="#F6F0D8"/>
        <circle cx="64" cy="115" r="13" fill="#141829"/>
        <!-- 窗格木条 -->
        <line x1="68" y1="78" x2="68" y2="204" stroke="#3E3759" stroke-width="3"/>
        <line x1="20" y1="142" x2="116" y2="142" stroke="#3E3759" stroke-width="3"/>
      </g>

      <!-- 门楣小牌「宝's Shop」 -->
      <g transform="translate(132, 82)">
        <rect x="0" y="0" width="106" height="28" rx="5" fill="#332B47" stroke="#544873" stroke-width="1.5"/>
        <text x="53" y="18" text-anchor="middle" fill="#F3E7D6" font-size="12" font-weight="600" font-family="ui-monospace, monospace">宝's Shop</text>
      </g>

      <!-- 斜射月光束（第七、八幕小紫借光验钨丝时增强） -->
      <polygon id="moon-polygon" points="48,125 112,125 260,348 145,348" fill="url(#moon-beam)" opacity="0.45"/>

      <!-- 2. 顶部星光灯串 (y: 18 ~ 68) -->
      <g id="fairy-lights">
        <!-- 电线 -->
        <path d="M 10 28 Q 95 48 180 34 Q 265 20 350 38" fill="none" stroke="#4E4566" stroke-width="2.5"/>
        <!-- 6 个灯座与灯泡 -->
        <g id="bulbs-layer"></g>
      </g>

      <!-- 右上角：高处总闸拉线开关 (小粉专属目标) -->
      <g id="pull-switch-group" transform="translate(308, 76)">
        <rect x="-14" y="0" width="28" height="16" rx="3" fill="#4A4163" stroke="#6E6291" stroke-width="1.5"/>
        <circle id="switch-led" cx="0" cy="8" r="3.5" fill="#B23A32"/>
        <line id="pull-cord" x1="0" y1="16" x2="0" y2="66" stroke="#D8CFAF" stroke-width="2" stroke-dasharray="3 2"/>
        <circle id="pull-ring" cx="0" cy="72" r="7" fill="none" stroke="#F2B84B" stroke-width="3"/>
      </g>

      <!-- 3. 中层浅暖色木质工作台 (y: 325 ~ 348) —— 衬托小萌物与挖空眼缝 -->
      <g id="upper-workbench">
        <!-- 浅米白背景护板，让小黑 #000000 轮廓和三只小脸蛋的挖空眼缝都清清楚楚 -->
        <rect x="14" y="224" width="332" height="118" rx="10" fill="#F2EFE9" stroke="#D8D0C5" stroke-width="2"/>
        <!-- 护板上的刻度装饰线 -->
        <line x1="26" y1="318" x2="334" y2="318" stroke="#E2DCD2" stroke-width="1" stroke-dasharray="4 4"/>
        <!-- 工作台木桌面 -->
        <rect x="8" y="334" width="344" height="14" rx="4" fill="#C89F72" stroke="#8C6843" stroke-width="1.5"/>
      </g>

      <!-- 左侧分线盒（StashYu 插铜签处） -->
      <g id="junction-box" transform="translate(24, 240)">
        <rect x="0" y="0" width="44" height="54" rx="5" fill="#352F47" stroke="#5A5075" stroke-width="1.5"/>
        <rect x="8" y="8" width="28" height="14" rx="2" fill="#1D192B"/>
        <circle id="jbox-light" cx="15" cy="15" r="3.5" fill="#C0584A"/>
        <!-- 铜签插槽 -->
        <rect x="24" y="10" width="6" height="10" rx="1" fill="#110E1A" stroke="#7D7299" stroke-width="1"/>
        <!-- 插上的铜签（第14幕起显示） -->
        <rect id="copper-pin-inserted" x="25" y="4" width="4" height="15" fill="#F2B84B" opacity="0"/>
        <text x="22" y="42" text-anchor="middle" fill="#B9B1CA" font-size="8.5" font-family="ui-monospace, monospace">STASH</text>
      </g>

      <!-- 4. 下层地板与深色暗槽 (y: 350 ~ 500) -->
      <g id="lower-floor">
        <!-- 下层浅色木地板条 -->
        <rect x="14" y="356" width="332" height="136" rx="10" fill="#EAE4DC" stroke="#CFC6B8" stroke-width="2"/>
        <!-- 地板中央的「深色暗槽」（小黑探洞与 FetchMo 叼灯泡处） -->
        <rect x="28" y="418" width="210" height="62" rx="8" fill="#0B0912" stroke="#3B334D" stroke-width="2"/>
        <!-- 暗槽底部的夜光刻度条与微光带（当小黑滚过时，从它的挖空眼缝里透出来！） -->
        <g id="trench-glow-bars">
          <rect x="46" y="430" width="12" height="36" rx="2" fill="#3B5249" opacity="0.55"/>
          <rect x="88" y="428" width="42" height="38" rx="3" fill="#FFE885" opacity="0.92"/>
          <rect x="150" y="430" width="16" height="36" rx="2" fill="#466999" opacity="0.65"/>
          <!-- 木榫标尺字 -->
          <text x="109" y="475" text-anchor="middle" fill="#7D7494" font-size="9" font-family="ui-monospace, monospace">#3 木榫</text>
        </g>
        <!-- 右下角：小粉的弹簧跳板垫 -->
        <g id="trampoline" transform="translate(268, 452)">
          <rect x="0" y="14" width="58" height="10" rx="3" fill="#8C6843"/>
          <path d="M 10 14 L 18 4 L 28 14 L 38 4 L 48 14" fill="none" stroke="#9AA0AD" stroke-width="2.5"/>
          <rect id="spring-pad" x="-2" y="0" width="62" height="7" rx="3.5" fill="#FF309B" opacity="0.85"/>
        </g>
      </g>

      <!-- 5. 剧情交互道具层（掉落的六号灯泡、小紫折射光束、电流轨迹） -->
      <g id="Interactive-props">
        <!-- 电线电流脉冲动画线 -->
        <path id="power-pulse" d="M 308 84 L 308 38 L 46 38 L 46 240" fill="none" stroke="#F2B84B" stroke-width="3" stroke-dasharray="6 4" opacity="0"/>
        <!-- 小紫眼缝折射出的两道平行准直光束 -->
        <g id="purple-beams" opacity="0">
          <line x1="162" y1="286" x2="206" y2="306" stroke="#E2D4FF" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="173" y1="283" x2="212" y2="302" stroke="#E2D4FF" stroke-width="2.3" stroke-linecap="round"/>
          <circle cx="210" cy="305" r="11" fill="#FFE699" opacity="0.55"/>
        </g>
        <!-- 关键道具：那颗滚落的六号暖黄小灯泡 -->
        <g id="loose-bulb" transform="translate(128, 448)">
          <circle cx="0" cy="0" r="14" fill="url(#warm-glow)" id="loose-bulb-halo" opacity="0.6"/>
          <circle cx="0" cy="0" r="8.5" fill="#FFE27A" stroke="#D49B27" stroke-width="1.5"/>
          <!-- 灯泡内的钨丝 -->
          <path id="loose-filament" d="M -3 3 L -2 -3 L 0 0 L 2 -3 L 3 3" fill="none" stroke="#9A5B13" stroke-width="1.4"/>
          <!-- 灯头螺口 -->
          <rect x="-4.5" y="7" width="9" height="5" rx="1.5" fill="#9AA0AD" stroke="#5D6470" stroke-width="1"/>
        </g>
      </g>

      <!-- 6. 六只小萌物图层（严格按三页造型宪法绘制，身体绝不逐帧重画） -->
      <g id="characters-layer">
        <!-- ① 小黑 (#000000) -->
        <g id="char-black" transform="translate(62, 384)">
          <circle cx="0" cy="0" r="25" fill="#000000" mask="url(#mask-black)"/>
        </g>

        <!-- ② 小紫 (#9159FE) -->
        <g id="char-purple" transform="translate(154, 304)">
          <circle cx="0" cy="0" r="25" fill="#9159FE" mask="url(#mask-purple)"/>
        </g>

        <!-- ③ 小粉 (#FF309B) -->
        <g id="char-pink" transform="translate(296, 424)">
          <circle cx="0" cy="0" r="25" fill="#FF309B" mask="url(#mask-pink)"/>
        </g>

        <!-- ④ Clawd (严格按 Code 版尺子缩放，原点左上角) -->
        <g id="char-clawd" transform="translate(182, 255) scale(0.46)">
          <g id="clawd-motion-wrap">
            <g id="clawd-crown" transform="translate(0,-8)"></g>
            <g id="clawd-shell-legs"></g>
            <g id="clawd-claws"></g>
            <g id="clawd-eyes"></g>
            <g id="clawd-face"></g>
            <g id="clawd-prop" transform="translate(0,14)"></g>
          </g>
        </g>

        <!-- ⑤ StashYu (火红狐狸 20x13 格，整数倍 s=4，crispEdges) -->
        <g id="char-fox" transform="translate(36, 286)" shape-rendering="crispEdges">
          <g id="fox-motion-wrap">
            <g id="fox-pixels"></g>
            <g id="fox-side"></g>
          </g>
        </g>

        <!-- ⑥ FetchMo (暹罗猫 20x13 格，整数倍 s=4，crispEdges) -->
        <g id="char-cat" transform="translate(114, 368)" shape-rendering="crispEdges">
          <g id="cat-motion-wrap">
            <g id="cat-pixels"></g>
            <g id="cat-side"></g>
          </g>
        </g>
      </g>

      <!-- 7. 舞台底部木底座背景（y: 502 ~ 640，供字幕面板安放，物理隔离不挡角色） -->

  // 圆心为 (0,0)，半径 r = 25
  // 左缝 (+0.194, -0.416) 宽 0.194；右缝 (+0.626, -0.497) 宽 0.129；长 0.418；反斜杠 \ -> SVG rotate(-26.2) / rotate(-26.5)
  var EGG_EYE = {
    L: { dx: 0.194, dy: -0.416, len: 0.418, w: 0.194, ang: 26.2 },
    R: { dx: 0.626, dy: -0.497, len: 0.418, w: 0.129, ang: 26.5 }
  };

  function updateEggMask(maskId, r, blinkFactor) {
    var kLen = (typeof blinkFactor === 'number') ? blinkFactor : 1.0;
    function slit(e) {
      var w = e.w * r;
      var l = Math.max(w * 0.45, e.len * r * kLen);
      var x = e.dx * r;
      var y = e.dy * r;
      var rot = -e.ang; // 负号！顶端偏左、底端偏右（反斜杠 \）
      return '<rect x="' + (x - w / 2).toFixed(2) + '" y="' + (y - l / 2).toFixed(2) +
             '" width="' + w.toFixed(2) + '" height="' + l.toFixed(2) +
             '" rx="' + (w / 2).toFixed(2) + '" fill="#000" transform="rotate(' +
             rot.toFixed(1) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ')"/>';
    }
    var maskEl = document.getElementById(maskId);
    maskEl.innerHTML =
      '<circle cx="0" cy="0" r="' + r + '" fill="#fff"/>' +
      slit(EGG_EYE.L) + slit(EGG_EYE.R);
  }

  /* ---------- 3. momoyu 造型宪法（StashYu 火红狐狸 + FetchMo 暹罗）原装格子图与尾巴 DLC ---------- */

  function momoEyeCells(kind, x, y, right, dir) {
    switch (kind) {
      case 'open':    return [[[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]], 'eye'];
      case 'blink':   return [[[x, y + 1], [x + 1, y + 1]], 'line'];
      case 'happy':   return [[[x - 1, y + 1], [x, y], [x + 1, y], [x + 2, y + 1]], 'line'];
      case 'sleep':   return [[[x - 1, y], [x, y + 1], [x + 1, y + 1], [x + 2, y]], 'line'];
      case 'glance':  return [[[x + dir, y], [x + 1 + dir, y], [x + dir, y + 1], [x + 1 + dir, y + 1]], 'eye'];
      case 'squeeze': return right ? [[[x + 1, y - 1], [x, y], [x + 1, y + 1]], 'line'] : [[[x, y - 1], [x + 1, y], [x, y + 1]], 'line'];
      case 'dot':     return [[[x + (right ? 0 : 1), y + 1]], 'eye'];
    }
    return [[], 'eye'];
  }

  var MOMO_EXPR = {
    normal:  ['open', 'open'],
    blink:   ['blink', 'blink'],
    happy:   ['happy', 'happy'],
    sleep:   ['sleep', 'sleep'],
    glance:  ['glance', 'glance'],
    wink:    ['open', 'happy'],
    squeeze: ['squeeze', 'squeeze'],
    dazed:   ['dot', 'dot']
  };

  // 整数倍 S = 4（1格 = 4x4 像素）
  var MOMO_SCALE = 4;

  function renderMomoSVG(who, opts) {
    opts = opts || {};
    var ch = MOMO_DATA[who];
    var srcRows = (opts.tail && ch.tails[opts.tail]) ? ch.tails[opts.tail] : ch.rows;
    var wCols = srcRows[0].length;
    var hRows = 12; // 裁掉最底下那行空行，脚踩底边
    var g = srcRows.map(function(row) {
      return row.split('').map(function(k) {
        if (k === '.') return null;
        if (k === 'E') k = 'M';
        return ch.pal[k];
      });
    });

    var pair = MOMO_EXPR[opts.expr || 'normal'] || MOMO_EXPR.normal;
    pair.forEach(function(kind, idx) {
      var xy = ch.eyes[idx];
      var res = momoEyeCells(kind, xy[0], xy[1], idx === 1, ch.glance);
      var cells = res[0], which = res[1];
      var col = which === 'eye' ? ch.pal.E : ch.line;
      cells.forEach(function(pt) {
        if (g[pt[1]] && pt[0] >= 0 && pt[0] < wCols) g[pt[1]][pt[0]] = col;
      });
    });

    if (opts.blush) {
      ch.blush.cells.forEach(function(pt) {
        if (g[pt[1]]) g[pt[1]][pt[0]] = ch.blush.color;
      });
    }

    var cellMap = new Map();
    for (var y = 0; y < hRows; y++) {
      for (var x = 0; x < wCols; x++) {
        if (g[y][x]) cellMap.set(x + ',' + y, g[y][x]);
      }
    }

    // 宪法：深色底可加一圈一格宽的白边（贴纸描边）
    var pad = opts.outline ? 1 : 0;
    if (opts.outline) {
      var addWhite = [];
      cellMap.forEach(function(c, key) {
        var parts = key.split(',').map(Number);
        for (var dy = -1; dy <= 1; dy++) {
          for (var dx = -1; dx <= 1; dx++) {
            var k2 = (parts[0] + dx) + ',' + (parts[1] + dy);
            if (!cellMap.has(k2)) addWhite.push(k2);
          }
        }
      });
      addWhite.forEach(function(k2) { cellMap.set(k2, '#FFFFFF'); });
    }

    var byColor = new Map();
    var S = MOMO_SCALE;
    for (var ry = -pad; ry < hRows + pad; ry++) {
      var rx = -pad;
      while (rx < wCols + pad) {
        var colVal = cellMap.get(rx + ',' + ry);
        if (!colVal) { rx++; continue; }
        var n = 1;
        while (cellMap.get((rx + n) + ',' + ry) === colVal) n++;
        if (!byColor.has(colVal)) byColor.set(colVal, []);
        byColor.get(colVal).push('M' + (rx * S) + ' ' + (ry * S) + 'h' + (n * S) + 'v' + S + 'h-' + (n * S) + 'z');
        rx += n;
      }
    }

    var paths = '';
    var keysOrder = ['#FFFFFF'].concat(Array.from(byColor.keys()).filter(function(c){ return c !== '#FFFFFF'; }));
    keysOrder.forEach(function(c) {
      if (byColor.has(c)) {
        paths += '<path fill="' + c + '" d="' + byColor.get(c).join('') + '"/>';
      }
    });

    // 旁边的小东西槽位 (zZ / 音符 / 星星 / 小鱼 / 铜签)
    var sideHtml = '';
    if (opts.side && MOMO_DATA.side[opts.side]) {
      var sp = MOMO_DATA.side[opts.side];
      var scx = ch.side[0], scy = ch.side[1];
      var sx0 = scx - Math.floor(sp.rows[0].length / 2);
      var sy0 = scy - Math.floor(sp.rows.length / 2);
      var spD = [];
      sp.rows.forEach(function(rStr, sy) {
        rStr.split('').forEach(function(chKey, sx) {
          if (chKey !== '.') {
            spD.push('M' + ((sx0 + sx) * S) + ' ' + ((sy0 + sy) * S) + 'h' + S + 'v' + S + 'h-' + S + 'z');
          }
        });
      });
      sideHtml = '<path fill="' + sp.color + '" d="' + spD.join('') + '"/>';
    }
    return { body: paths, side: sideHtml };
  }

        clawdOpts.motion = 'hop';

        foxPos.x = 32; foxPos.y = 286;
        foxOpts.expr = 'happy';
        foxOpts.blush = true;
        foxOpts.side = 'star';
        foxOpts.tail = (Math.floor(localP * 6) % 2 === 0) ? 'swayIn' : 'swayOut';

        catPos.x = 112; catPos.y = 286;
        catOpts.expr = 'happy';
        catOpts.blush = true;
        catOpts.side = 'note';
        catOpts.tail = 'tailUp';

        var swayX = Math.sin(localP * Math.PI * 4) * 5;
        blackPos.x  = 64 + swayX;  blackPos.y  = 382;
        purplePos.x = 162 - swayX; purplePos.y = 382;
        pinkPos.x   = 292 + swayX; pinkPos.y   = 422;
        break;
    }

    // 4. 将计算好的状态应用到 SVG 元素
    renderTopBulbs(topLightsMode, sixthInstalled);
    $bgWall.setAttribute('fill', topLightsMode === 'on' ? '#2B2440' : '#201C2E');
    $moonPolygon.setAttribute('opacity', showPurpleBeam ? '0.78' : '0.42');

    // 掉落灯泡与钨丝
    if (bulbVisible) {
      $looseBulb.setAttribute('opacity', '1');
      $looseBulb.setAttribute('transform', 'translate(' + bulbPos.x.toFixed(1) + ',' + bulbPos.y.toFixed(1) + ')');
      $looseFilament.setAttribute('stroke', filamentBright ? '#FFF7B2' : '#9A5B13');
      $looseFilament.setAttribute('stroke-width', filamentBright ? '2.2' : '1.4');
    } else {
      $looseBulb.setAttribute('opacity', '0');
    }

    // 小紫折射准直光束
    $purpleBeams.setAttribute('opacity', showPurpleBeam ? '1' : '0');

    // 高处拉线开关状态
    $pullCord.setAttribute('y2', switchPulled ? '80' : '66');
    $pullRing.setAttribute('cy', switchPulled ? '86' : '72');
    $switchLed.setAttribute('fill', switchPulled ? '#5E9B7A' : '#B23A32');
    $powerPulse.setAttribute('opacity', showPowerPulse ? '0.9' : '0');

    // 左侧分线盒铜签状态
    $copperPin.setAttribute('opacity', pinInserted ? '1' : '0');
    $jboxLight.setAttribute('fill', pinInserted ? '#5E9B7A' : '#C0584A');

    // 更新三只小脸蛋的位置与眼缝眨眼
    $charBlack.setAttribute('transform', 'translate(' + blackPos.x.toFixed(1) + ',' + blackPos.y.toFixed(1) + ')');
    $charPurple.setAttribute('transform', 'translate(' + purplePos.x.toFixed(1) + ',' + purplePos.y.toFixed(1) + ')');
    $charPink.setAttribute('transform', 'translate(' + pinkPos.x.toFixed(1) + ',' + pinkPos.y.toFixed(1) + ')');
    updateEggMask('mask-black', 25, blackPos.blink);
    updateEggMask('mask-purple', 25, purplePos.blink);
    updateEggMask('mask-pink', 25, pinkPos.blink);

    // 更新 Clawd
    $charClawd.setAttribute('transform', 'translate(' + clawdPos.x + ',' + clawdPos.y + ') scale(0.46)');
    updateClawd(clawdOpts);

    // 更新 StashYu 与 FetchMo
    $charFox.setAttribute('transform', 'translate(' + foxPos.x + ',' + foxPos.y + ')');
    updateMomo('fox', foxOpts);
    $charCat.setAttribute('transform', 'translate(' + catPos.x + ',' + catPos.y + ')');
    updateMomo('cat', catOpts);
  }

  /* =========================================================================
   * 第五部分：播放器控制逻辑（播放/暂停、进度条、点哪句跳哪句）
   * ========================================================================= */
  var currentTime = 0;
  var isPlaying = false;
  var lastTick = 0;

  var $btnPlay     = document.getElementById('btn-play');
  var $btnPrev     = document.getElementById('btn-prev');
  var $btnNext     = document.getElementById('btn-next');
  var $btnRestart  = document.getElementById('btn-restart');
  var $scrubber    = document.getElementById('scrubber');
  var $timeReadout = document.getElementById('time-readout');
  var $stageShell  = document.getElementById('stage-shell');

  function syncUI() {
    $scrubber.value = currentTime.toFixed(2);
    $timeReadout.textContent = formatTime(currentTime) + ' / ' + formatTime(TOTAL_DURATION);
    $btnPlay.textContent = isPlaying ? '⏸ 暂停' : (currentTime >= TOTAL_DURATION ? '↻ 重播' : '▶ 播放');
  }

  function seekTo(targetSec, autoPlay) {
    currentTime = Math.max(0, Math.min(TOTAL_DURATION, targetSec));
    renderSceneAtTime(currentTime);
    if (autoPlay && !isPlaying) {
      startPlayback();
    } else {
      syncUI();
    }
  }

  function startPlayback() {
    if (currentTime >= TOTAL_DURATION) {
      currentTime = 0;
    }
    isPlaying = true;
    lastTick = performance.now();
    syncUI();
  }

  function pausePlayback() {
    isPlaying = false;
    syncUI();
  }

  function togglePlayback() {
    if (isPlaying) pausePlayback();
    else startPlayback();
  }

  function tick(now) {
    if (isPlaying) {
      var dt = (now - lastTick) / 1000;
      lastTick = now;
      currentTime += dt;
      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        isPlaying = false;
      }
      renderSceneAtTime(currentTime);
      syncUI();
    }
    requestAnimationFrame(tick);
  }

  $btnPlay.addEventListener('click', togglePlayback);
  $stageShell.addEventListener('click', togglePlayback);

  $btnRestart.addEventListener('click', function() {
    seekTo(0, true);
  });

  $btnPrev.addEventListener('click', function() {
    var prevIdx = Math.max(0, activeLineIdx - 1);
    seekTo(SUBTITLES[prevIdx].start + 0.02, isPlaying);
  });

  $btnNext.addEventListener('click', function() {
    var nextIdx = Math.min(SUBTITLES.length - 1, activeLineIdx + 1);
    seekTo(SUBTITLES[nextIdx].start + 0.02, isPlaying);
  });

  $scrubber.addEventListener('input', function() {
    seekTo( parseFloat($scrubber.value), false );
  });

  // 初始渲染并自动开演
  renderSceneAtTime(0);
  syncUI();
  startPlayback();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
