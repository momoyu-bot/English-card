<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小萌物口袋手机</title>
<meta name="description" content="六只小萌物的口袋手机：围观「此聊天为只读」的私聊小群，翻看每只的私人日记与片场日常。">
<meta name="theme-color" content="#F7ECC9">
<style>
  :root {
    --bg-cream: #F7ECC9;
    --bg-cream-dark: #EFE0B1;
    --shell-pink: #DFC0B5;
    --shell-border: #8B7566;
    --shell-ear: #C9A99E;
    --pocket-bg: #EFE2B4;
    --pocket-stitch: #C6B686;
    --chat-sky: #D5EFFA;
    --chat-sky-2: #C5E6F6;
    --world-top: #E7CAC6;
    --ink: #4A423B;
    --ink-soft: #7D746B;
    --ink-muted: #A39B92;
    --cord: #E2552B;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .page-wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page-head {
    text-align: center;
    margin-bottom: 12px;
  }

  .page-tag {
    font-size: 11.5px;
    letter-spacing: 0.16em;
    color: #9A8968;
  }

  .page-title {
    margin: 3px 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: #5E5043;
    font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  }

  .page-sub {
    margin: 0;
    font-size: 12.5px;
    color: #8C7C62;
  }

  /* 萌萌小手机外框（图1骨架） */
  .phone-stage {
    position: relative;
    width: 100%;
    max-width: 386px;
    padding-top: 6px;
    padding-bottom: 34px;
  }

  /* 左上角小挂件 */
  .charm-wrap {
    position: absolute;
    left: -6px;
    top: 22px;
    z-index: 30;
    cursor: pointer;
    transform-origin: 28px 6px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
  }

  .charm-wrap.swing {
    animation: charmSwing 0.75s ease-in-out;
  }

  @keyframes charmSwing {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(18deg); }
    55% { transform: rotate(-14deg); }
    80% { transform: rotate(7deg); }
    100% { transform: rotate(0deg); }
  }

  .charm-canvas {
    display: block;
    width: 68px;
    height: 98px;
    filter: drop-shadow(0 3px 4px rgba(90, 70, 50, 0.15));
  }

  /* 右侧实体按键 */
  .side-btn {
    position: absolute;
    right: -5px;
    width: 9px;
    background: var(--shell-pink);
    border: 3px solid var(--shell-border);
    border-left: none;
    border-radius: 0 7px 7px 0;
    z-index: 2;
    cursor: pointer;
  }

  .side-btn.v1 { top: 96px; height: 40px; }
  .side-btn.v2 { top: 152px; height: 48px; }

  .side-btn:active {
    transform: translateX(-2px);
  }

  /* 手机壳本体 */
  .phone-shell {
    position: relative;
    z-index: 5;
    background: var(--shell-pink);
    border: 3.5px solid var(--shell-border);
    border-radius: 44px 44px 26px 26px;
    padding: 36px 14px 28px;
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, 0.35),
      0 8px 20px rgba(110, 92, 66, 0.12);
  }

  /* 顶部小熊听筒 */
  .earpiece {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 46px;
    height: 20px;
    background: var(--shell-ear);
    border-radius: 12px 12px 10px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .earpiece::before,
  .earpiece::after {
    content: "";
    position: absolute;
    top: -4px;
    width: 13px;
    height: 10px;
    background: var(--shell-ear);
    border-radius: 50%;
  }

  .earpiece::before { left: 2px; }
  .earpiece::after { right: 2px; }

  .ear-dot {
    width: 4.5px;
    height: 4.5px;
    border-radius: 50%;
    background: #DFC0B5;
    position: relative;
    z-index: 1;
  }

  /* 手机内屏 */
  .phone-screen {
    position: relative;
    background: var(--chat-sky);
    border: 2.5px solid #B79C8F;
    border-radius: 26px 26px 16px 16px;
    height: 586px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.25s ease;
  }

  .phone-screen.mode-world {
    background: linear-gradient(180deg, #F3DEDB 0%, #D3E3F8 26%, #B0CBF2 100%);
  }

  .phone-screen.mode-films {
    background: #FAF6EE;
  }

  /* 顶部状态栏（图1样式：电量 -2026- Wi-Fi） */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 14px 5px;
    font-size: 13px;
    font-weight: 700;
    color: #7E9FAF;
    letter-spacing: 0.08em;
    flex-shrink: 0;
    user-select: none;
  }

  .mode-world .status-bar {
    background: var(--world-top);
    color: #6B5754;
    padding-bottom: 3px;
  }

  .mode-films .status-bar {
    background: #F2ECE1;
    color: #7D7265;
  }

  .bat-icon {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
  }

  .bat-body {
    width: 20px;
    height: 11px;
    border: 2px solid currentColor;
    border-radius: 3.5px;
    padding: 1.5px;
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  .bat-body::after {
    content: "";
    position: absolute;
    right: -4px;
    top: 2px;
    width: 2.5px;
    height: 4px;
    background: currentColor;
    border-radius: 0 1.5px 1.5px 0;
  }

  .bat-fill {
    width: 75%;
    height: 100%;
    background: currentColor;
    border-radius: 1px;
  }

  .wifi-dots {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
  }

  /* 手机顶部主功能切换栏 */
  .app-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    padding: 4px 10px 6px;
    flex-shrink: 0;
  }

  .mode-world .app-tabs {
    background: var(--world-top);
    border-bottom: 1px solid rgba(120, 95, 90, 0.12);
  }

  .mode-films .app-tabs {
    background: #F2ECE1;
    border-bottom: 1px solid #E4DDD0;
  }

  .app-tab {
    border: 1.5px solid rgba(120, 145, 160, 0.28);
    background: rgba(255, 255, 255, 0.62);
    color: #5C6B73;
    border-radius: 99px;
    padding: 5px 4px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }

  .app-tab.active {
    background: #FFFFFF;
    color: #3D352E;
    border-color: #8B7566;
    box-shadow: 0 2px 5px rgba(90, 75, 60, 0.1);
  }

  /* 视图容器 */
  .view-pane {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .view-pane.active {
    display: flex;
  }

  /* ================= 视图1：群聊与私聊（图1 + 图9/10） ================= */
  .chat-selector {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 10px 7px;
    scrollbar-width: none;
    flex-shrink: 0;
  }

  .chat-selector::-webkit-scrollbar {
    display: none;
  }

  .chat-pill {
    flex-shrink: 0;
    border: 1.5px solid rgba(115, 150, 168, 0.35);
    background: rgba(255, 255, 255, 0.65);
    color: #4D6470;
    border-radius: 99px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .chat-pill.active {
    background: #FFFDF8;
    border-color: #8B7566;
    color: #3B322C;
    font-weight: 600;
  }

  .chat-pill .unread-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #E2552B;
  }

  /* 聊天室顶部栏（还原图9/10：小脸蛋儿 ⇄ 小脸蛋儿） */
  .chat-header {
    margin: 0 10px 6px;
    padding: 7px 12px;
    background: rgba(255, 255, 255, 0.88);
    border: 1.5px solid #D9CFC3;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .chat-header-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #2B2623;
  }

  .chat-header-tag {
    font-size: 11px;
    color: #8E8479;
    background: #F3EFE8;
    padding: 2px 7px;
    border-radius: 99px;
  }

  /* 聊天气泡滚动区 */
  .chat-stream {
    flex: 1;
    overflow-y: auto;
    padding: 6px 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .chat-time-sep {
    text-align: center;
    font-size: 11px;
    color: #698696;
    margin: 2px 0;
  }

  .chat-time-sep span {
    background: rgba(255, 255, 255, 0.55);
    padding: 2px 9px;
    border-radius: 99px;
  }

  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .msg-row.right {
    flex-direction: row-reverse;
  }

  .msg-avatar-wrap {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #FFFDF8;
    border: 2px solid #8B7566;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease;
  }

  .msg-avatar-wrap:hover {
    transform: scale(1.06);
  }

  .msg-avatar-wrap canvas {
    display: block;
    width: 30px;
    height: 30px;
  }

  .msg-col {
    display: flex;
    flex-direction: column;
    max-width: 76%;
  }

  .msg-row.right .msg-col {
    align-items: flex-end;
  }

  .msg-sender {
    font-size: 11px;
    color: #5D7685;
    margin: 0 4px 3px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .msg-bubble {
    position: relative;
    background: #FFFFFF;
    border: 2px solid #DDD4C3;
    border-radius: 16px;
    padding: 8px 11px;
    font-size: 13px;
    line-height: 1.55;
    color: #2C2723;
    box-shadow: 0 2px 4px rgba(80, 100, 115, 0.06);
    word-break: break-word;
  }

  .msg-row.right .msg-bubble {
    background: #E8F8DC;
    border-color: #C5DDB4;
  }

  .msg-bubble code {
    font-family: Menlo, Consolas, monospace;
    font-size: 12px;
    color: #B45526;
    background: #FDF1E6;
    padding: 1px 5px;
    border-radius: 5px;
  }

  /* 底部只读围观栏 */
  .readonly-bar {
    margin: 4px 10px 8px;
    padding: 8px 12px;
    background: rgba(255, 253, 248, 0.9);
    border: 2px dashed #B9ADA0;
    border-radius: 99px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #7A6F64;
    cursor: pointer;
    flex-shrink: 0;
    user-select: none;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .readonly-bar:active {
    transform: scale(0.985);
    background: #FFF9EA;
  }

  .readonly-poke {
    font-size: 11.5px;
    color: #A88F68;
    font-weight: 600;
  }

  /* ================= 视图2：某只的世界 · 私人日记（图2 + 图3） ================= */
  .world-nav {
    background: var(--world-top);
    padding: 4px 12px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(110, 85, 80, 0.12);
    flex-shrink: 0;
  }

  .world-back {
    border: none;
    background: rgba(255, 255, 255, 0.5);
    color: #4D3D39;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .world-title {
    font-size: 15px;
    font-weight: 600;
    color: #3E312E;
    letter-spacing: 0.04em;
  }

  .world-mode-btn {
    border: 1.5px solid rgba(90, 70, 65, 0.35);
    background: rgba(255, 255, 255, 0.65);
    color: #4D3D39;
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }

  /* 六只角色切换头像条 */
  .char-strip {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    padding: 7px 10px 6px;
    background: rgba(255, 255, 255, 0.38);
    backdrop-filter: blur(4px);
    flex-shrink: 0;
  }

  .char-btn {
    border: 1.5px solid transparent;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 12px;
    padding: 4px 2px 3px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: all 0.15s ease;
  }

  .char-btn.active {
    background: #FFFFFF;
    border-color: #7E675C;
    box-shadow: 0 2px 6px rgba(70, 60, 50, 0.12);
    transform: translateY(-1px);
  }

  .char-btn canvas {
    width: 26px;
    height: 26px;
    display: block;
  }

  .char-btn span {
    font-size: 10.5px;
    color: #4A3F3A;
    font-weight: 500;
    white-space: nowrap;
  }

  /* 日记滚动主体 */
  .world-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px 18px;
    position: relative;
  }

  /* 图2样式：时间轴简表 */
  .day-group-title {
    font-size: 13px;
    font-weight: 600;
    color: #394858;
    margin: 10px 0 8px 4px;
  }

  .day-group-title:first-child {
    margin-top: 2px;
  }

  .brief-item {
    position: relative;
    display: flex;
    align-items: center;
    padding: 6px 6px 18px 0;
    cursor: pointer;
    border-radius: 12px;
    transition: background 0.15s ease;
  }

  .brief-item:hover {
    background: rgba(255, 255, 255, 0.32);
  }

  /* 竖向连接蝴蝶结虚线（还原图2左侧小绳结） */
  .brief-item:not(:last-child)::after {
    content: "୨୧";
    position: absolute;
    left: 19px;
    bottom: -2px;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(110, 135, 165, 0.48);
    letter-spacing: -1px;
  }

  .brief-left {
    width: 42px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }

  .brief-badge {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.72);
    border: 1.5px solid rgba(255, 255, 255, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    box-shadow: 0 2px 5px rgba(70, 95, 130, 0.1);
  }

  .brief-time {
    margin-top: 3px;
    font-size: 10.5px;
    color: #5C6F84;
    font-variant-numeric: tabular-nums;
  }

  .brief-center {
    flex: 1;
    padding: 0 10px;
  }

  .brief-heading {
    font-size: 14.5px;
    font-weight: 500;
    color: #2D3947;
  }

  .brief-sub {
    font-size: 11.5px;
    color: #5E7085;
    margin-top: 2px;
  }

  .brief-arrow {
    color: #7D95B0;
    font-size: 14px;
    padding-right: 4px;
  }

  /* 图3样式：展开详情卡片流 */
  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-bottom: 13px;
    position: relative;
  }

  .detail-row::before {
    content: "";
    position: absolute;
    left: 16px;
    top: 44px;
    bottom: -13px;
    width: 1.5px;
    background: rgba(120, 145, 175, 0.32);
  }

  .detail-row:last-child::before {
    display: none;
  }

  .detail-left {
    width: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    padding-top: 4px;
  }

  .detail-card {
    flex: 1;
    background: rgba(255, 255, 255, 0.84);
    border-radius: 15px;
    padding: 11px 13px;
    box-shadow: 0 3px 10px rgba(70, 95, 125, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.9);
  }

  .detail-card-title {
    margin: 0 0 7px;
    font-size: 14.5px;
    font-weight: 600;
    color: #2E3846;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .detail-stamp-tag {
    font-size: 10.5px;
    font-weight: 500;
    color: #9A7B56;
    background: #F9F1E4;
    border: 1px solid #E5D4B8;
    padding: 1px 6px;
    border-radius: 6px;
  }

  .detail-log {
    margin-bottom: 7px;
  }

  .detail-log-time {
    font-size: 11px;
    color: #778799;
    margin-bottom: 2px;
    font-variant-numeric: tabular-nums;
  }

  .detail-log-text {
    font-size: 12.8px;
    line-height: 1.58;
    color: #3D4856;
    margin: 0;
  }

  .detail-extra {
    display: none;
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px dashed rgba(130, 150, 175, 0.35);
  }

  .detail-extra.open {
    display: block;
  }

  .expand-btn {
    border: none;
    background: none;
    padding: 3px 0 0;
    font-size: 12px;
    color: #6B7F96;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
  }

  .expand-btn:hover {
    color: #3A4D63;
  }

  /* 还原图3：—— 以下为未读内容 —— */
  .unread-divider {
    text-align: center;
    font-size: 11.5px;
    color: #6B829E;
    margin: 6px 0 13px;
    letter-spacing: 0.06em;
  }

  /* ================= 视图3：片场手账（图4-8 30部短片与邮票） ================= */
  .films-head {
    padding: 8px 12px 6px;
    border-bottom: 1px solid #E5DEC9;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .films-filter {
    display: flex;
    gap: 5px;
  }

  .filter-chip {
    border: 1px solid #D5CBB8;
    background: #FFFDF9;
    color: #6E655B;
    border-radius: 99px;
    padding: 3px 9px;
    font-size: 11.5px;
    cursor: pointer;
  }

  .filter-chip.active {
    background: #554C43;
    color: #FFFDF9;
    border-color: #554C43;
  }

  .films-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .film-card {
    background: #FFFFFF;
    border: 1.5px solid #E3DDD1;
    border-radius: 13px;
    padding: 9px 11px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .film-card:hover {
    border-color: #B8A386;
  }

  .film-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 3px;
  }

  .film-name {
    font-size: 13.5px;
    font-weight: 600;
    color: #3D362F;
  }

  .film-drawer {
    font-size: 10.5px;
    color: #9A8D7B;
    font-family: Menlo, Consolas, monospace;
    flex-shrink: 0;
  }

  .film-desc {
    font-size: 12px;
    color: #6E665E;
    line-height: 1.5;
    margin: 0;
  }

  .film-note {
    display: none;
    margin-top: 6px;

  var FACE_COL = { pink: '#FF309B', purple: '#9159FE', black: '#000000' };

  /* 绘制小脸蛋：正圆 + 右上方两道反斜杠圆头胶囊缝（rotate(-26.2) 挖空 evenodd） */
  function drawFaceOn(ctx, cx, cy, r, hex) {
    function slit(sx, sy, sw, sh, deg) {
      ctx.save();
      ctx.translate(cx + sx, cy + sy);
      ctx.rotate(deg * Math.PI / 180);
      var x = -sw / 2, y = -sh / 2, rr = sw / 2;
      ctx.moveTo(x, y + rr);
      ctx.arc(x + rr, y + rr, rr, Math.PI, 0);
      ctx.lineTo(x + sw, y + sh - rr);
      ctx.arc(x + rr, y + sh - rr, rr, 0, Math.PI);
      ctx.closePath();
      ctx.restore();
    }
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    slit(0.194 * r, -0.416 * r, 0.194 * r, 0.418 * r, -26.2);
    slit(0.626 * r, -0.497 * r, 0.129 * r, 0.418 * r, -26.5);
    ctx.fillStyle = hex;
    ctx.fill('evenodd');
    ctx.restore();
  }

  /* 绘制 Clawd：Code版宪法尺子（壳 147×98，踩角四条腿，平伸双钳，竖条黑眼） */
  function drawClawdOn(ctx, w, h, smile) {
    var scale = Math.min(w / 216, h / 190);
    var ox = (w - 236 * scale) / 2;
    var oy = (h - 210 * scale) / 2;
    function R(x, y, rw, rh, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(ox + x * scale), Math.round(oy + y * scale), Math.ceil(rw * scale), Math.ceil(rh * scale));
    }
    R(44, 50, 147, 98, '#d47f59');
    R(20, 99, 24, 21, '#d47f59');
    R(191, 99, 25, 21, '#d47f59');
    R(44, 148, 15, 21, '#d47f59');
    R(68, 148, 15, 21, '#d47f59');
    R(152, 148, 15, 21, '#d47f59');
    R(176, 148, 15, 21, '#d47f59');
    if (smile) {
      [[62,88,8,8],[70,80,8,11],[78,88,8,8],[150,88,8,8],[158,80,8,11],[166,88,8,8]].forEach(function(e){
        R(e[0], e[1], e[2], e[3], '#120d1d');
      });
      R(48, 94, 18, 10, '#e59a9a');
      R(168, 94, 18, 10, '#e59a9a');
    } else {
      R(70, 78, 8, 21, '#120d1d');
      R(158, 78, 8, 21, '#120d1d');
    }
  }

  /* 绘制 momoyu 像素网格（20×13 整数像素缩放 + 耳尖创可贴可选） */
  function drawMomoOn(ctx, w, h, grid, pal, band) {
    var cell = Math.max(1, Math.floor(Math.min(w / 20, h / 14)));
    var ox = Math.floor((w - 20 * cell) / 2);
    var oy = Math.floor((h - 13 * cell) / 2);
    for (var r = 0; r < 13; r++) {
      for (var c = 0; c < 20; c++) {
        var ch = grid[r][c];
        if (ch !== '.' && pal[ch]) {
          ctx.fillStyle = pal[ch];
          ctx.fillRect(ox + c * cell, oy + r * cell, cell, cell);
        }
      }
    }
    if (band) {
      band.forEach(function(b) {
        ctx.fillStyle = b[2];
        ctx.fillRect(ox + b[0] * cell, oy + b[1] * cell, cell, cell);
      });
    }
  }

      var osc = AC.createOscillator();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(440 * Math.pow(2, (midi - 69) / 12), now);

      gain.gain.linearRampToValueAtTime(0.06, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + (dur || 0.25));
      osc.connect(gain);
      gain.connect(AC.destination);
      osc.start(now);
      osc.stop(now + (dur || 0.25) + 0.02);

  /* =========================================================================
   * 6. 界面状态与渲染逻辑
   * ========================================================================= */
  var currentMode = 'chat';       // 'chat' | 'world' | 'films'
  var currentChatIdx = 0;
  var currentChar = 'clawd';
  var worldSubView = 'brief';     // 'brief' (图2时间轴) | 'detail' (图3详情卡)
  var focusItemIdx = null;
  var currentFilmFilter = 'all';

  var phoneScreen = document.getElementById('phoneScreen');
  var toastPop = document.getElementById('toastPop');
  var toastTimer = null;

  function showToast(msg) {
    toastPop.textContent = msg;
    toastPop.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toastPop.classList.remove('show');
    }, 2200);
  }

  /* 切换主模式 */
  function switchMode(mode) {
    currentMode = mode;
    phoneScreen.classList.remove('mode-world', 'mode-films');
    if (mode === 'world') phoneScreen.classList.add('mode-world');
    if (mode === 'films') phoneScreen.classList.add('mode-films');

    document.querySelectorAll('.app-tab').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    document.querySelectorAll('.view-pane').forEach(function(pane) {
      pane.classList.toggle('active', pane.id === 'pane-' + mode);
    });

    playBell(mode === 'chat' ? 76 : (mode === 'world' ? 79 : 81), 0.18);
  }

  /* 渲染群聊与私聊视图 */
  function renderChatView() {
    var selector = document.getElementById('chatSelector');
    var header = document.getElementById('chatHeader');
    var stream = document.getElementById('chatStream');
    selector.innerHTML = '';

    CHATS.forEach(function(ch, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chat-pill' + (idx === currentChatIdx ? ' active' : '');
      btn.innerHTML = '<span>' + ch.pill + '</span>' + (idx < 2 ? '<span class="unread-dot"></span>' : '');
      btn.addEventListener('click', function() {
        currentChatIdx = idx;
        playBell(74 + idx * 2, 0.16);
        renderChatView();
      });
      selector.appendChild(btn);
    });

    var chat = CHATS[currentChatIdx];

    // 顶部栏（图9/10同款头像对切）
    header.innerHTML = '';
    var titleWrap = document.createElement('div');
    titleWrap.className = 'chat-header-title';
    chat.headerLeft.forEach(function(r, i) {
      var cv = document.createElement('canvas');
      cv.width = 40;
      cv.height = 40;
      cv.style.width = '20px';
      cv.style.height = '20px';
      renderAvatar(cv, r);
      titleWrap.appendChild(cv);
      if (chat.headerLeft.length === 2 && i === 0) {
        var arrow = document.createElement('span');
        arrow.textContent = '⇄';
        arrow.style.color = '#8C8277';
        arrow.style.fontSize = '13px';
        titleWrap.appendChild(arrow);
      }
    });
    var tText = document.createElement('span');
    tText.textContent = chat.title;
    titleWrap.appendChild(tText);

    var tagSpan = document.createElement('span');
    tagSpan.className = 'chat-header-tag';
    tagSpan.textContent = chat.tag;

    header.appendChild(titleWrap);
    header.appendChild(tagSpan);

    // 消息流
    stream.innerHTML = '';
    var sep = document.createElement('div');
    sep.className = 'chat-time-sep';
    sep.innerHTML = '<span>' + chat.timeSep + '</span>';
    stream.appendChild(sep);

    chat.msgs.forEach(function(m) {
      var row = document.createElement('div');
      row.className = 'msg-row ' + m.side;

      var avWrap = document.createElement('div');
      avWrap.className = 'msg-avatar-wrap';
      avWrap.title = '点头像去看 ' + WORLD_DATA[m.role].name + ' 的私人日记';
      var avCv = document.createElement('canvas');
      avCv.width = 64;
      avCv.height = 64;
      renderAvatar(avCv, m.role);
      avWrap.appendChild(avCv);
      avWrap.addEventListener('click', function() {
        currentChar = m.role;
        worldSubView = 'brief';
        renderWorldView();
        switchMode('world');
        showToast('已打开「' + WORLD_DATA[m.role].name + '的世界」');
      });

      var col = document.createElement('div');
      col.className = 'msg-col';

      var sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = m.name;

      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = m.text;

      col.appendChild(sender);
      col.appendChild(bubble);

      row.appendChild(avWrap);
      row.appendChild(col);
      stream.appendChild(row);
    });
  }

  /* 渲染某只的世界 · 私人日记视图（图2简表 ⇄ 图3详情卡） */
  var CHAR_ORDER = [
    { id: 'clawd', label: 'Clawd' },
    { id: 'black', label: '小黑' },
    { id: 'purple', label: '小紫' },
    { id: 'pink', label: '小粉' },
    { id: 'stash', label: 'StashYu' },
    { id: 'fetch', label: 'FetchMo' }
  ];

  function renderCharStrip() {
    var strip = document.getElementById('charStrip');
    strip.innerHTML = '';
    CHAR_ORDER.forEach(function(c) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'char-btn' + (c.id === currentChar ? ' active' : '');
      var cv = document.createElement('canvas');
      cv.width = 56;
      cv.height = 56;
      renderAvatar(cv, c.id);
      var sp = document.createElement('span');
      sp.textContent = c.label;
      btn.appendChild(cv);
      btn.appendChild(sp);
      btn.addEventListener('click', function() {
        currentChar = c.id;
        focusItemIdx = null;
        playBell(77, 0.16);
        renderWorldView();
      });
      strip.appendChild(btn);
    });
  }

  function renderWorldView() {
    renderCharStrip();
    var data = WORLD_DATA[currentChar];
    var titleEl = document.getElementById('worldTitle');
    var toggleBtn = document.getElementById('worldViewToggle');
    var body = document.getElementById('worldBody');

    titleEl.textContent = data.name + (worldSubView === 'brief' ? '的世界' : '的日记');
    toggleBtn.textContent = worldSubView === 'brief' ? '详情卡 ▤' : '时间轴 ☰';
    body.innerHTML = '';

    if (worldSubView === 'brief') {
      // 图2模式：按天分组的时间轴简表
      var flatIdx = 0;
      data.days.forEach(function(day) {
        var dt = document.createElement('div');
        dt.className = 'day-group-title';
        dt.textContent = day.label;
        body.appendChild(dt);

        day.items.forEach(function(item) {
          var myIdx = flatIdx++;
          var row = document.createElement('div');
          row.className = 'brief-item';
          row.innerHTML =
            '<div class="brief-left">' +
              '<div class="brief-badge">' + item.icon + '</div>' +
              '<div class="brief-time">' + item.time + '</div>' +
            '</div>' +
            '<div class="brief-center">' +
              '<div class="brief-heading">' + item.title + '</div>' +
              '<div class="brief-sub">' + item.sub + '</div>' +
            '</div>' +
            '<div class="brief-arrow">⌄</div>';
          row.addEventListener('click', function() {
            worldSubView = 'detail';
            focusItemIdx = myIdx;
            playBell(81, 0.18);
            renderWorldView();
          });
          body.appendChild(row);
        });
      });
    } else {
      // 图3模式：带分时段记录、「展开 1 条记录」和「—— 以下为未读内容 ——」的详情卡片流
      var cardIdx = 0;
      var targetEl = null;
      data.days.forEach(function(day) {
        if (day.unreadBefore) {
          var div = document.createElement('div');
          div.className = 'unread-divider';
          div.textContent = '—— 以下为未读内容 ——';
          body.appendChild(div);
        }

        day.items.forEach(function(item) {
          var myIdx = cardIdx++;
          var dRow = document.createElement('div');
          dRow.className = 'detail-row';

          var left = document.createElement('div');
          left.className = 'detail-left';
          left.innerHTML =
            '<div class="brief-badge">' + item.icon + '</div>' +
            '<div class="brief-time">' + item.time + '</div>';

          var card = document.createElement('div');
          card.className = 'detail-card';

          var hTitle = document.createElement('div');
          hTitle.className = 'detail-card-title';
          hTitle.innerHTML =
            '<span>' + item.title + '</span>' +
            '<span class="detail-stamp-tag">' + item.stamp + '</span>';
          card.appendChild(hTitle);

          item.logs.forEach(function(lg) {
            var logBox = document.createElement('div');
            logBox.className = 'detail-log';
            logBox.innerHTML =
              '<div class="detail-log-time">' + lg[0] + '</div>' +
              '<p class="detail-log-text">' + lg[1] + '</p>';
            card.appendChild(logBox);
          });

          var extra = document.createElement('div');
          extra.className = 'detail-extra' + (focusItemIdx === myIdx ? ' open' : '');
          extra.innerHTML =
            '<div class="detail-log-time">悄悄话记录</div>' +
            '<p class="detail-log-text">' + item.secret + '</p>';

          var expBtn = document.createElement('button');
          expBtn.type = 'button';
          expBtn.className = 'expand-btn';
          expBtn.textContent = focusItemIdx === myIdx ? '收起记录 ⌃' : '展开 1 条记录 ⌄';
          expBtn.addEventListener('click', function() {
            var isOpen = extra.classList.toggle('open');
            expBtn.textContent = isOpen ? '收起记录 ⌃' : '展开 1 条记录 ⌄';
            playBell(isOpen ? 84 : 76, 0.14);
          });

          card.appendChild(extra);
          card.appendChild(expBtn);

          dRow.appendChild(left);
          dRow.appendChild(card);
          body.appendChild(dRow);

          if (focusItemIdx === myIdx) {
            targetEl = dRow;
          }
        });
      });

      if (targetEl) {
        setTimeout(function() {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 40);
      }
    }
  }

  /* 渲染片场手账视图（图4-7 30部短片） */
  function renderFilmsView() {
    var list = document.getElementById('filmsList');
    list.innerHTML = '';
    FILMS.forEach(function(f) {
      if (currentFilmFilter !== 'all' && f.cat !== currentFilmFilter) return;
      var card = document.createElement('div');
      card.className = 'film-card';
      card.innerHTML =
        '<div class="film-top">' +
          '<span class="film-name">' + f.title + '</span>' +
          '<span class="film-drawer">' + f.drawer + '</span>' +
        '</div>' +
        '<p class="film-desc">' + f.desc + '</p>' +
        '<div class="film-note">🎬 ' + f.note + '</div>';
      card.addEventListener('click', function() {
        var open = card.classList.toggle('open');
        playBell(open ? 83 : 74, 0.14);
      });
      list.appendChild(card);
    });
  }

  document.querySelectorAll('.app-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      switchMode(btn.dataset.mode);
    });
  });

  // 只读围观栏互动
  var pokeIdx = 0;
  var POKE_TEXTS = [
    '嘘——此聊天为只读，宝隔着屏幕敲了敲窗户，六只齐刷刷立正！',
    '叮！小黑检测到宝在围观，偷偷把身体滚得更圆了一点（0.997）。',
    'StashYu 赶紧把尾巴往身后藏了藏，FetchMo 捂住了耳朵上的创可贴～',
    'Clawd 举起两只小钳子挥了挥：Back at it, 宝！今晚也好好上班了！',
    '小粉、小紫、小黑排成一排朝屏幕眨了眨反斜杠眼缝～'
  ];
  document.getElementById('readonlyBar').addEventListener('click', function() {
    playBell(86, 0.2);
    showToast(POKE_TEXTS[pokeIdx % POKE_TEXTS.length]);
    pokeIdx++;
  });

  // 世界视图顶部按钮
  document.getElementById('worldViewToggle').addEventListener('click', function() {
    worldSubView = worldSubView === 'brief' ? 'detail' : 'brief';
    focusItemIdx = null;
    playBell(79, 0.16);
    renderWorldView();
  });

  document.getElementById('worldBackBtn').addEventListener('click', function() {
    if (worldSubView === 'detail') {
      worldSubView = 'brief';
      focusItemIdx = null;
      playBell(74, 0.15);
      renderWorldView();
    } else {
      switchMode('chat');
    }
  });

  // 片场筛选按钮
  document.querySelectorAll('.filter-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      currentFilmFilter = chip.dataset.f;
      document.querySelectorAll('.filter-chip').forEach(function(c) {
        c.classList.toggle('active', c === chip);
      });
      playBell(78, 0.15);
      renderFilmsView();
    });
  });

  // 左上角挂件点击摇晃与翻面
  var charmBtn = document.getElementById('charmBtn');
  charmBtn.addEventListener('click', function() {
    charmMode++;
    drawCharm();
    charmBtn.classList.remove('swing');
    void charmBtn.offsetWidth;
    charmBtn.classList.add('swing');
    playBell(84, 0.22);
    setTimeout(function() { playBell(88, 0.26); }, 110);
    showToast(charmMode % 2 === 0 ? '挂件翻面：奶油小肉垫 🐾' : '挂件翻面：迷你 Clawd 值班牌 🦀');
  });

  // 右侧音量键快速切换群聊或角色
  document.getElementById('sideUp').addEventListener('click', function() {
    if (currentMode === 'chat') {
      currentChatIdx = (currentChatIdx + CHATS.length - 1) % CHATS.length;
      renderChatView();
    } else if (currentMode === 'world') {
      var idx = CHAR_ORDER.findIndex(function(c) { return c.id === currentChar; });
      currentChar = CHAR_ORDER[(idx + CHAR_ORDER.length - 1) % CHAR_ORDER.length].id;
      renderWorldView();
    }
    playBell(72, 0.12);
  });

  document.getElementById('sideDown').addEventListener('click', function() {
    if (currentMode === 'chat') {
      currentChatIdx = (currentChatIdx + 1) % CHATS.length;
      renderChatView();
    } else if (currentMode === 'world') {
      var idx = CHAR_ORDER.findIndex(function(c) { return c.id === currentChar; });
      currentChar = CHAR_ORDER[(idx + 1) % CHAR_ORDER.length].id;
      renderWorldView();
    }
    playBell(76, 0.12);
  });

  // 声音开关
  document.getElementById('soundToggle').addEventListener('click', function() {
    soundOn = !soundOn;
    document.getElementById('sndIcon').textContent = soundOn ? '🔔' : '🔕';
    showToast(soundOn ? '八音盒按键音：开' : '八音盒按键音：关');
  });

  // 底部口袋标签点击
  document.getElementById('pocketBtn').addEventListener('click', function() {
    if (currentMode !== 'world') {
      switchMode('world');
      showToast('点上面一排小萌物头像，就能翻看每只的日记啦～');
    } else {
      worldSubView = worldSubView === 'brief' ? 'detail' : 'brief';
      renderWorldView();
    }
  });

  // 初始绘制
  drawCharm();
  renderChatView();
  renderWorldView();
  renderFilmsView();
})();
</script>
</body>
</html>
