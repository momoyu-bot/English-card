function save(fn) { g.save(); try { fn(); } finally { g.restore(); } }

const MOMO_PAL = {
  fox: { M: '#E2552B', C: '#FFF3E3', D: '#3B2520', E: '#3B2520', line: '#3B2520' },
  cat: { M: '#F3E7D6', X: '#4E382E', E: '#79C0F0', line: '#4E382E' }
};

const momoCache = new Map();
function buildMomoSprite(kind, tail, eye, extraRows = 0, sticker = false) {
  const key = kind + '|' + tail + '|' + eye + '|' + extraRows + '|' + (sticker ? 1 : 0);
  let cv = momoCache.get(key);
  if (cv) return cv;

  const baseRows = MOMO_GRIDS[kind][tail] || MOMO_GRIDS[kind].base;
  let rows = baseRows;
  if (extraRows > 0 && kind === 'cat') {
    const mid = "........MMMMMMMMMM..";
    rows = [
      ...baseRows.slice(0, 9),
      ...Array.from({ length: extraRows }, () => mid),
      ...baseRows.slice(9)
    ];
  }
  const w = Math.max(...rows.map(r => r.length));
  const h = rows.length;
  const pal = MOMO_PAL[kind];

  /* 先建颜色格表，方便贴纸白边计算 */
  const grid = Array.from({ length: h }, () => new Array(w).fill(null));
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (pal[ch]) {
        grid[y][x] = (ch === 'E' && eye !== 'plain') ? pal.M : pal[ch];
      }
    }
  }
  if (eye !== 'plain') {
    const anchors = kind === 'fox' ? [[3, 4], [9, 4]] : [[8, 5], [16, 5]];
    anchors.forEach(([ax, ay], idx) => {
      const put = (dx, dy, col) => {
        if (ay + dy >= 0 && ay + dy < h && ax + dx >= 0 && ax + dx < w) grid[ay + dy][ax + dx] = col;
      };
      if (eye === 'blink') {
        put(0, 1, pal.line); put(1, 1, pal.line);
      } else if (eye === 'smile') {
        put(-1, 1, pal.line); put(0, 0, pal.line); put(1, 0, pal.line); put(2, 1, pal.line);
      } else if (eye === 'sleep') {
        put(-1, 0, pal.line); put(0, 1, pal.line); put(1, 1, pal.line); put(2, 0, pal.line);
      } else if (eye === 'glance') {
        const sh = kind === 'fox' ? 1 : -1;
        put(sh, 0, pal.E); put(1 + sh, 0, pal.E); put(sh, 1, pal.E); put(1 + sh, 1, pal.E);
      } else if (eye === 'effort') {
        if (idx === 0) { put(0, -1, pal.line); put(1, 0, pal.line); put(0, 1, pal.line); }
        else { put(1, -1, pal.line); put(0, 0, pal.line); put(1, 1, pal.line); }
      } else if (eye === 'dot') {
        if (idx === 0) put(1, 1, pal.E); else put(0, 1, pal.E);
      }
    });
  }

  cv = document.createElement('canvas');
  cv.width = w + 2;
  cv.height = h + 2;
  const cx = cv.getContext('2d');
  if (sticker) {
    cx.fillStyle = '#FFF6E6';
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (!grid[y][x]) continue;
        for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || nx >= w || ny < 0 || ny >= h || !grid[ny][nx]) {
            cx.fillRect(nx + 1, ny + 1, 1, 1);
          }
        }
      }
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (grid[y][x]) {
        cx.fillStyle = grid[y][x];
        cx.fillRect(x + 1, y + 1, 1, 1);
      }
    }
  }
  momoCache.set(key, cv);
  return cv;
}

function drawMomoyu(kind, x, feetY, unit, t, opts = {}) {
  const u = Math.max(1, Math.round(unit));
  const blink = !opts.eye && t > 0 && ((t + (kind === 'cat' ? 1.8 : 0.6)) % 5.4) < 0.13;
  const eye = opts.eye || (blink ? 'blink' : 'plain');
  const tail = opts.tail || 'base';
  const extraRows = Math.max(0, Math.round(opts.stretchRows || 0));
  const sp = buildMomoSprite(kind, tail, eye, extraRows, !!opts.sticker);
  const hop = opts.hop ? -Math.floor(Math.abs(Math.sin(t * 8)) * 2) * u : 0;
  if (opts.shadow !== false) {
    ellipse(x, feetY + 1.5, u * 6.8, u * 1.3, 'rgba(15,25,22,0.26)');
  }
  pose(Math.round(x), Math.round(feetY + hop), opts.flip ? -1 : 1, 1, opts.tilt || 0, () => {
    g.imageSmoothingEnabled = false;
    /* 本体脚底在第 11 行（0-indexed），+1 贴纸偏移后脚底位于 sp.height - 2 */
    g.drawImage(sp, -11 * u, -(sp.height - 2) * u, sp.width * u, sp.height * u);
    if (opts.blush) {
      g.fillStyle = kind === 'fox' ? '#F59A8C' : '#F2B8B0';
      const pts = kind === 'fox' ? [[2, 6], [11, 6]] : [[8, 7], [17, 7]];
      for (const [bx, by] of pts) {
        g.fillRect((bx - 10) * u, (by - (sp.height - 3)) * u, u, u);
      }
    }
  });
}

/* StashYu 塔窗垂放像素长尾变形（整格阶梯，末端奶油白尖） */
function drawFoxLongTail(anchorX, anchorY, u, dropRows, t, sticker = true) {
  const rows = Math.max(2, Math.round(dropRows));
  const stepPhase = Math.floor(t * 4.5);
  g.save();
  g.imageSmoothingEnabled = false;
  for (let r = 0; r < rows; r++) {
    const sway = Math.round(Math.sin(r * 0.34 + stepPhase * 0.7) * 1.4);
    const isTipNarrow = r >= rows - 2;
    const isTipWide = r >= rows - 5 && r < rows - 2;
    const wCells = isTipNarrow ? 3 : isTipWide ? 5 : (r < 3 ? 4 : 5);
    const col = (isTipNarrow || isTipWide) ? '#FFF3E3' : '#E2552B';
    const px = Math.round(anchorX + (sway - Math.floor(wCells / 2)) * u);
    const py = Math.round(anchorY + r * u);
    if (sticker) {
      g.fillStyle = '#FFF6E6';
      g.fillRect(px - u, py, (wCells + 2) * u, u);
      if (r === rows - 1) g.fillRect(px, py + u, wCells * u, u);
    }
    g.fillStyle = col;
    g.fillRect(px, py, wCells * u, u);
  }
  g.restore();
}

/* Clawd（Code 版宪法尺子：壳 44,50,147,98；钳 20,99,24,21 与 191,99,25,21；四腿 44,68,152,176 宽15高21；眼 70,158 宽8高21） */
function drawClawd(x, feetY, s, t, opts = {}) {
  const legExt = Math.max(0, opts.legExt || 0);
  const stepOn = !!opts.step;
  const stepPhase = Math.floor(t * 7) % 2;
  const lLift = opts.leftLift || 0;
  const rLift = opts.rightLift || 0;
  const blink = ((t + 0.45) % 6.8) < 0.12;
  if (opts.shadow !== false) {
    ellipse(x, feetY + 1.5, 84 * s, 13 * s, 'rgba(15,25,22,0.26)');
  }
  pose(x, feetY, s, s, opts.tilt || 0, () => {
    const bodyLift = 169 + legExt;
    g.translate(-117.5, -bodyLift);
    if (opts.sticker) {
      const pad = 6;
      rect(44 - pad, 50 - pad, 147 + pad * 2, 98 + pad * 2, '#FFF6E6');
      rect(20 - pad, 99 - lLift - pad, 24 + pad, 21 + pad * 2, '#FFF6E6');
      rect(191, 99 - rLift - pad, 25 + pad, 21 + pad * 2, '#FFF6E6');
    }
    const c = '#d47f59';
    rect(44, 50, 147, 98, c);
    rect(20, 99 - lLift, 24, 21, c);
    rect(191, 99 - rLift, 25, 21, c);
    const legs = [44, 68, 152, 176];
    for (let i = 0; i < 4; i++) {
      const liftFoot = stepOn && (i % 2 === stepPhase) ? 9 : 0;
      const lh = Math.max(8, 21 + legExt - liftFoot);
      if (opts.sticker) rect(legs[i] - 4, 148, 23, lh + 4, '#FFF6E6');
      rect(legs[i], 148, 15, lh, c);
      if (legExt > 24) {
        /* 高跷节痕（壳外小装饰，认得出是拔高的四条腿） */
        for (let yy = 168; yy < 146 + lh; yy += 24) {
          rect(legs[i], yy, 15, 3, '#b86843');
        }
      }
    }
    for (const ex of [70, 158]) {
      rect(ex, blink ? 91 : 78, 8, blink ? 5 : 21, '#181412');
    }
    if (opts.blush) {
      rect(54, 104, 14, 8, '#f09b88');
      rect(167, 104, 14, 8, '#f09b88');
    }
  });
}

/* 小脸蛋（实测版宪法：sRGB #FF309B / #9159FE / #000000，反斜杠 rotate(-26.3°)，右缝窄 1/3，evenodd 真挖空） */
const FACE_HEX = { pink: '#FF309B', violet: '#9159FE', black: '#000000' };
function drawFace(kind, cx, cy, r, t, opts = {}) {
  const sx = opts.sx || 1;
  const sy = opts.sy || 1;
  const tilt = opts.tilt || 0;
  const phase = kind === 'pink' ? 1.1 : kind === 'violet' ? 2.4 : 0.3;
  const blink = !opts.awake && ((t + phase) % 6.2) < 0.12;
  if (opts.shadow !== false) {
    ellipse(cx, cy + r * sy + 1.5, r * sx * 0.85, Math.max(2.2, r * 0.18), 'rgba(15,25,22,0.25)');
  }
  /* 深色背景里给小黑背后垫一圈柔和月华（不在球体上加高光，球内 100% 纯黑，挖空眼缝同时透出月色） */
  if (kind === 'black' && opts.halo) {
    disk(cx, cy, r * Math.max(sx, sy) * 1.28, glow(cx, cy, r * 0.4, r * Math.max(sx, sy) * 1.28, 'rgba(244,234,198,0.34)', 'rgba(244,234,198,0)'));
  }
  pose(cx, cy, r * sx, r * sy, tilt, () => {
    g.beginPath();
    g.arc(0, 0, 1, 0, TAU);
    const slits = [[0.194, -0.416, 0.194], [0.626, -0.497, 0.129]];
    for (let i = 0; i < 2; i++) {
      const [px, py, w] = slits[i];
      const len = blink ? 0.13 : 0.418;
      const rad = Math.min(w / 2, len / 2);
      const half = len / 2 - rad;
      const ang = -26.3 * PI / 180;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      /* 手动把圆头胶囊缝变换进同一条路径，以 evenodd 真正挖穿球面 */
      const Steps = 10;
      for (let k = 0; k <= Steps; k++) {
        const a = PI + (PI * k) / Steps;
        const lx = Math.cos(a) * rad, ly = -half + Math.sin(a) * rad;
        const gx = px + lx * ca - ly * sa, gy = py + lx * sa + ly * ca;
        if (k === 0) g.moveTo(gx, gy); else g.lineTo(gx, gy);
      }
      for (let k = 0; k <= Steps; k++) {
        const a = (PI * k) / Steps;
        const lx = Math.cos(a) * rad, ly = half + Math.sin(a) * rad;
        const gx = px + lx * ca - ly * sa, gy = py + lx * sa + ly * ca;
        g.lineTo(gx, gy);
      }
      g.closePath();
    }
    g.fillStyle = FACE_HEX[kind];
    g.fill('evenodd');
  });
}

/* ---------------- 森林、高塔、风铃草与金藤长辫 ---------------- */
function skyNight(horizon, warmth = 0) {
  const stops = warmth > 0.5
    ? [[0, '#1d3142'], [0.46, '#395564'], [0.78, '#8b7b6e'], [1, '#dfbe8f']]
    : [[0, '#101d29'], [0.45, '#1b3140'], [0.82, '#2d4952'], [1, '#4c6963']];
  rect(0, 0, W, horizon + 20, grad(0, 0, 0, horizon + 20, stops));
  const r = rand(402);
  for (let i = 0; i < 58; i++) {
    const sx = r() * W, sy = r() * (horizon * 0.82);
    const sr = 0.45 + r() * 1.05;
    fade((0.28 + r() * 0.65) * (1 - warmth * 0.45), () => disk(sx, sy, sr, i % 5 === 0 ? '#ffe9ad' : '#e6f0ef'));
  }
}

function moon(x, y, r, warm = false) {
  disk(x, y, r * 2.5, glow(x, y, r * 0.4, r * 2.5, warm ? 'rgba(255,228,168,0.28)' : 'rgba(235,244,225,0.22)', 'rgba(235,244,225,0)'));
  disk(x, y, r, warm ? '#fce8b8' : '#f5efd6');
  disk(x + r * 0.34, y - r * 0.12, r * 0.82, warm ? 'rgba(252,232,184,0.15)' : 'rgba(245,239,214,0.18)');
}

function pineSilhouette(x, y, s, col, seed = 1) {
  const r = rand(seed);
  pose(x, y, s, s, 0, () => {
    rect(-2.2, -14, 4.4, 16, '#23312d');
    for (let i = 0; i < 5; i++) {
      const yy = -12 - i * 11.5;
      const w = 22 - i * 3.1 + (r() - 0.5) * 2;
      poly([[0, yy - 16], [-w, yy + 2], [-w * 0.45, yy], [w * 0.45, yy], [w, yy + 2]], col);
    }
  });
}

function forestBackdrop(horizon = 420, warmth = 0) {
  skyNight(horizon, warmth);
  /* 远山层 */
  poly([[0, horizon], [0, horizon - 92], [68, horizon - 118], [148, horizon - 88], [244, horizon - 126], [322, horizon - 98], [360, horizon - 110], [360, horizon]], warmth > 0.5 ? '#354d4e' : '#1e353b');
  poly([[0, horizon], [0, horizon - 58], [92, horizon - 78], [190, horizon - 52], [285, horizon - 82], [360, horizon - 60], [360, horizon]], warmth > 0.5 ? '#2c443f' : '#182c30');
  const r = rand(77);
  for (let i = 0; i < 28; i++) {
    const px = -8 + i * 13.8 + (r() - 0.5) * 5;
    if (px > 105 && px < 255) continue;
    pineSilhouette(px, horizon + 4, 0.78 + r() * 0.55, i % 2 ? '#172b2a' : '#203835', 100 + i);

}

/* 风铃草（莴苣花叶：翠绿莲座叶 + 蓝紫小钟花，避开小紫色号 #9159FE） */
function rampionRosette(x, y, s, seed = 1) {

/* 圆石高塔（可绘局部或全身、窗钩、藤蔓、塔底暗藏矮木门） */
function stoneTower(cx, topY, botY, halfW, opts = {}) {
  const h = botY - topY;
  const r = rand(opts.seed || 309);
  g.save();
  /* 塔身圆柱体阴影与砌石 */
  rect(cx - halfW, topY, halfW * 2, h, grad(cx - halfW, 0, cx + halfW, 0, [
    [0, '#5a635c'], [0.28, '#8d9283'], [0.62, '#7c8274'], [1, '#49524c']
  ]));
  g.beginPath();
  g.rect(cx - halfW, topY, halfW * 2, h);
  g.clip();
  const rowH = opts.rowH || 13;
  for (let yy = topY; yy < botY; yy += rowH) {
    const rowIdx = Math.floor((yy - topY) / rowH);
    let xx = cx - halfW - (rowIdx % 2) * 14;
    ln(cx - halfW, yy, cx + halfW, yy, 'rgba(42,49,45,0.42)', 0.8);
    while (xx < cx + halfW) {
      const bw = 16 + r() * 18;
      const tint = ['#9ea39138', '#525c5536', '#c8c3a830', '#6d776c34'][Math.floor(r() * 4)];
      rect(xx + 0.6, yy + 0.6, bw - 1.2, rowH - 1.2, tint);
      ln(xx, yy, xx, yy + rowH, 'rgba(42,49,45,0.36)', 0.75);
      xx += bw;
    }
  }
  /* 塔壁青苔与常春藤 */
  for (let i = 0; i < 24; i++) {
    const mx = cx - halfW + r() * halfW * 2;
    const my = topY + 30 + r() * Math.max(20, h - 40);
    ellipse(mx, my, 4 + r() * 8, 2 + r() * 3.5, 'rgba(72,106,79,0.28)');
  }
  g.restore();
  ln(cx - halfW, topY, cx - halfW, botY, '#3d4742', 1.2);
  ln(cx + halfW, topY, cx + halfW, botY, '#313b37', 1.2);

  /* 锥形石板塔顶 */
  if (opts.roof !== false) {
    const eavesW = halfW + 10;
    poly([[cx, topY - h * 0.22 - 34], [cx - eavesW, topY + 3], [cx + eavesW, topY + 3]], grad(cx - eavesW, topY - 60, cx + eavesW, topY, ['#364954', '#536a73', '#293840']), '#25333a', 1.1);
    rect(cx - halfW - 4, topY, (halfW + 4) * 2, 6, '#6f7568');
    ln(cx, topY - h * 0.22 - 34, cx, topY - h * 0.22 - 46, '#cba76b', 1.6);
    disk(cx, topY - h * 0.22 - 47, 2.5, '#ebd08e');
  }

  /* 塔顶独一扇拱窗 */
  if (opts.windowY !== undefined) {
    const wy = opts.windowY;
    const ww = opts.windowW || 28, wh = opts.windowH || 40;
    /* 石拱外框 */
    path('M ' + (cx - ww / 2 - 4) + ' ' + (wy + wh / 2 + 3) +
         ' V ' + (wy - wh * 0.12) +
         ' A ' + (ww / 2 + 4) + ' ' + (ww / 2 + 4) + ' 0 0 1 ' + (cx + ww / 2 + 4) + ' ' + (wy - wh * 0.12) +
         ' V ' + (wy + wh / 2 + 3) + ' Z', '#aba892', '#474f48', 1);
    /* 暖黄灯光内室 */
    const pWin = new Path2D(
      'M ' + (cx - ww / 2) + ' ' + (wy + wh / 2) +
      ' V ' + (wy - wh * 0.12) +
      ' A ' + (ww / 2) + ' ' + (ww / 2) + ' 0 0 1 ' + (cx + ww / 2) + ' ' + (wy - wh * 0.12) +
      ' V ' + (wy + wh / 2) + ' Z'
    );
    g.fillStyle = grad(cx, wy - wh / 2, cx, wy + wh / 2, ['#ffefc2', '#f3be6b', '#b87638']);
    g.fill(pWin);
    if (opts.insideFn) {
      g.save();
      g.clip(pWin);
      opts.insideFn(cx, wy + wh / 2);
      g.restore();
    }
    /* 窗台石板与铁窗钩 */
    rrect(cx - ww / 2 - 7, wy + wh / 2 - 1, ww + 14, 6.5, 1.5, '#c5bfa6', '#4d544c', 0.9);
    const hx = cx + ww / 2 + 3, hy = wy + wh * 0.18;
    path('M ' + (hx - 2) + ' ' + hy + ' Q ' + (hx + 5) + ' ' + (hy + 1) + ' ' + (hx + 4) + ' ' + (hy - 5), null, '#3b3f3d', 2);
    disk(hx + 4, hy - 5.5, 1.6, '#5c615d');
  }

  /* 塔底藤蔓掩映的矮木门（尾声开启） */
  if (opts.doorOpen !== undefined) {
    const open = clamp(opts.doorOpen);
    const dy = botY, dw = 34, dh = 46;
    if (open > 0.02) {
      fade(clamp(open * 1.4), () => {
        path('M ' + (cx - dw / 2 - 4) + ' ' + dy + ' V ' + (dy - dh * 0.55) +
             ' A ' + (dw / 2 + 4) + ' ' + (dw / 2 + 4) + ' 0 0 1 ' + (cx + dw / 2 + 4) + ' ' + (dy - dh * 0.55) +
             ' V ' + dy + ' Z', '#b8b29b', '#49524b', 1);
        const doorIn = new Path2D(
          'M ' + (cx - dw / 2) + ' ' + dy + ' V ' + (dy - dh * 0.55) +
          ' A ' + (dw / 2) + ' ' + (dw / 2) + ' 0 0 1 ' + (cx + dw / 2) + ' ' + (dy - dh * 0.55) +
          ' V ' + dy + ' Z'
        );
        g.fillStyle = grad(cx, dy - dh, cx, dy, ['#ffe8ae', '#eaa958', '#995c2d']);
        g.fill(doorIn);
        /* 推开的橡木门扇 */
        const leafW = dw * (1 - open * 0.72);
        rect(cx - dw / 2, dy - dh * 0.62, leafW, dh * 0.62, '#6e4c33');
        ln(cx - dw / 2 + leafW - 3, dy - dh * 0.3, cx - dw / 2 + leafW - 1, dy - dh * 0.3, '#e3c07d', 2);
      });
    }
    /* 常春藤向两侧分开 */
    const part = open * 22;
    for (const dir of [-1, 1]) {
      for (let k = 0; k < 7; k++) {
        const vx = cx + dir * (4 + k * 2.6 + part);
        const vy = dy - 42 + k * 6;
        ellipse(vx, vy, 5.2, 3.2, k % 2 ? '#3f6e52' : '#538a65', dir * 0.4);
      }
    }
  }
}

/* 三股金藤长辫（沿任意采样点绘制立体编织纹 + 蓝风铃小花） */
function drawGoldenBraid(pts, width = 8, t = 0, withFlowers = true) {
  if (pts.length < 2) return;
  /* 先铺柔和金辉 */
  g.save();
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.strokeStyle = 'rgba(248,214,116,0.25)';
  g.lineWidth = width * 2.1;
  g.stroke();
  g.restore();

  /* 逐节画三股交叠麻花瓣 */
  let dist = 0;
  let stepIdx = 0;
  const stepLen = Math.max(4.2, width * 0.68);
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const dx = x1 - x0, dy = y1 - y0;
    const seg = Math.hypot(dx, dy);
    if (seg < 0.001) continue;
    const ang = Math.atan2(dy, dx);
    while (dist <= seg) {
      const f = dist / seg;
      const px = x0 + dx * f, py = y0 + dy * f;
      const side = (stepIdx % 2 === 0) ? 1 : -1;
      pose(px, py, 1, 1, ang, () => {
        ellipse(0, side * width * 0.22, stepLen * 0.72, width * 0.42, stepIdx % 3 === 0 ? '#f8dc82' : stepIdx % 3 === 1 ? '#e5b347' : '#cfa035', side * 0.42);
        ellipse(0, -side * width * 0.18, stepLen * 0.58, width * 0.34, '#fbeaa6', -side * 0.36);
      });
      if (withFlowers && stepIdx > 1 && stepIdx % 5 === 0) {
        pose(px + side * width * 0.55, py, 0.42, 0.42, Math.sin(t * 2 + stepIdx) * 0.15, () => {
          disk(0, 0, 5.5, '#769ef7');
          disk(0, 0, 2.1, '#fff0a6');
        });
      }
      dist += stepLen * 0.78;
      stepIdx++;
    }
    dist -= seg;
  }
}

/* 枯荆棘丛 -> 露水化作蓝风铃花海 */
function drawBrambles(cx, y, w, bloom = 0, t = 0) {
  const b = clamp(bloom);
  const r = rand(512);
  g.save();
  for (let i = 0; i < 18; i++) {
    const sx = cx - w / 2 + (i / 17) * w + (r() - 0.5) * 8;
    const h = 18 + r() * 22;
    const col = b > 0.45 ? '#3d6e51' : '#332b2a';
    const lean = (r() - 0.5) * 18;
    path('M ' + sx + ' ' + y + ' Q ' + (sx + lean) + ' ' + (y - h * 0.55) + ' ' + (sx - lean * 0.6) + ' ' + (y - h), null, col, mix(2.1, 1.6, b));
    if (b < 0.75) {
      fade(1 - b * 1.2, () => {
        ln(sx + lean * 0.4, y - h * 0.45, sx + lean * 0.4 + 4, y - h * 0.45 - 3, '#544542', 1.1);
        ln(sx + lean * 0.1, y - h * 0.72, sx + lean * 0.1 - 4, y - h * 0.72 - 3, '#544542', 1.1);
      });
    }
    if (b > 0.08) {
      const sc = ease(0.05, 0.9, b - (i % 5) * 0.08) * 0.78;
      if (sc > 0.02) {
        bellflower(sx - lean * 0.4, y - h * 0.35 + 6, sc, Math.sin(t * 1.8 + i) * 0.08, b);
      }
    }
  }
  g.restore();
}

/* 老园艺铁剪 */
function drawIronShears(x, y, s, rot, openAng = 0.42) {
  pose(x, y, s, s, rot, () => {

        g.beginPath();
        g.ellipse(-20, -7.5, 5.2, 3.6, 0.2, 0, TAU);
        g.strokeStyle = '#5a4e46';
        g.lineWidth = 2;
        g.stroke();
      });

    disk(0, 0, 2.2, '#c7a467');
  });
}

/* 萤火微光 */
function fireflies(t, count = 14, yMin = 120, yMax = 520, seed = 88) {
  const r = rand(seed);
  for (let i = 0; i < count; i++) {
    const bx = r() * W, by = mix(yMin, yMax, r());
    const ph = r() * TAU;
    const xx = bx + Math.sin(t * 0.9 + ph) * 14;
    const yy = by + Math.cos(t * 0.7 + ph * 1.3) * 9;
    const pulse = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * 2.6 + ph), 2);
    fade(pulse * 0.85, () => {
      disk(xx, yy, 6, glow(xx, yy, 0.5, 6, 'rgba(255,236,150,0.65)', 'rgba(255,236,150,0)'));
      disk(xx, yy, 1.3, '#fff7c8');
    });
  }
}

function drawBasket(x, y, tilt = 0, withFox = false, t = 0) {

function shotGarden(t) {
  plate('garden', paintGardenPlate);
  const pulleyX = 224, pulleyTop = 148;
  /* 塔顶窗沿的风铃草花盆与铁滑轮 */
  ln(198, pulleyTop, pulleyX + 4, pulleyTop, '#3f4441', 2.4);
  disk(pulleyX, pulleyTop + 3, 4.5, '#686d68');
  bellflower(171, 181, 0.72, -0.15, 0.9);
  bellflower(179, 182, 0.82, 0.12, 1.0);

  if (t < 13.3) {
    /* 狐狸跳进吊篮，随夜风升到窗边 */
    const hopIn = ease(4.2, 5.8, t);
    const lift = ease(6.4, 12.8, t);
    const basketY = mix(432, 184, lift);
    const sway = Math.sin(t * 2.8) * (0.03 + lift * 0.08);
    ln(pulleyX, pulleyTop + 3, pulleyX + Math.sin(sway) * 8, basketY - 22, '#cbb07c', 1.4);
    drawBasket(pulleyX + Math.sin(sway) * 8, basketY, sway, hopIn > 0.55, t);
    if (hopIn <= 0.55) {
      const fx = mix(154, pulleyX - 6, hopIn * 1.8);
      const fy = 468 - Math.sin(hopIn * PI) * 24;
      drawMomoyu('fox', fx, fy, 2, t, { eye: 'glance', tail: 'in', sticker: true });
    }
    /* 其余五只在园中仰望 */
    drawClawd(72, 476, 0.22, t, { rightLift: lift * 8, sticker: false });
    drawFace('pink', 114, 466, 13, t, { tilt: -0.15 * lift });
    drawFace('violet', 142, 472, 12.5, t, { tilt: -0.12 * lift });
    drawFace('black', 40, 470, 14, t, { halo: true });
    drawMomoyu('cat', 284, 476, 2, t, { tail: 'up', sticker: true, flip: true });
  } else {
    /* 13.3s 麻绳啪地断开：狐狸跃上窗台抱住花盆，空篮落地，五只绕塔找门 */
    const fall = ease(13.3, 14.5, t);
    /* 断裂麻绳残端 */
    ln(pulleyX, pulleyTop + 3, pulleyX + 3, pulleyTop + 18, '#cbb07c', 1.3);
    if (t < 14.2) {
      const spark = 1 - (t - 13.3) / 0.9;
      for (let k = 0; k < 5; k++) {
        const a = k * TAU / 5 + 0.4;
        ln(pulleyX, pulleyTop + 16, pulleyX + Math.cos(a) * 11, pulleyTop + 16 + Math.sin(a) * 11, 'rgba(255,232,162,' + spark.toFixed(2) + ')', 1.2);
      }
    }
    /* 塔顶窗里的 StashYu */
    drawMomoyu('fox', 180, 181, 2, t, { eye: 'dot', tail: 'tip', sticker: true, shadow: false });
    /* 空木篮掉在草地上 */
    const by = mix(190, 466, fall * fall);
    drawBasket(pulleyX + fall * 18, by, fall * 0.52, false, t);

    /* 五只绕塔一圈找门（正弦环绕石塔底部） */
    const runU = clamp((t - 15.0) / 4.3);
    const party = [
      ['cat', 0.0], ['clawd', 0.16], ['pink', 0.31], ['violet', 0.45], ['black', 0.60]
    ];
    party.forEach(([id, off]) => {
      const ang = (runU * 1.35 + off) * TAU;
      const rx = 180 + Math.cos(ang) * 70;
      const ry = 466 + Math.sin(ang) * 14;
      const front = Math.sin(ang) >= -0.15;
      if (!front && Math.abs(rx - 180) < 48) return; /* 转到塔背后时被塔身遮挡 */
      if (id === 'cat') drawMomoyu('cat', rx, ry, 2, t, { tail: 'straight', hop: runU < 0.95, sticker: true, flip: Math.sin(ang) > 0 });
      else if (id === 'clawd') drawClawd(rx, ry, 0.21, t, { step: runU < 0.95 });
      else drawFace(id, rx, ry - 13, id === 'black' ? 14 : 12.5, t, { halo: id === 'black' });
    });
  }
  fireflies(t, 12, 160, 490, 91);
}

function shotTailTry(t) {
  plate('wall', paintTowerWallPlate);
  const openBook = ease(20.4, 22.2, t);
  fade(openBook, () => drawStoryPage(104, 504, 1.05, -0.1 + Math.sin(t * 1.5) * 0.02));

  /* 塔顶窗口的 StashYu：26s 起往下放像素长尾，38s 嗖地收回并点两下白尖 */
  const drop = ease(26.2, 33.0, t) * (1 - ease(37.6, 38.5, t));
  const dropRows = Math.round(drop * 40);
  if (dropRows > 2) {
    drawMomoyu('fox', 180, 141, 3, t, { tail: 'notail', eye: 'effort', sticker: true, shadow: false });
    drawFoxLongTail(192, 142, 3, dropRows, t, true);

    const tap = t >= 38.7 && ((Math.floor((t - 38.7) / 0.22) % 2) === 0) && t < 40.2;
    drawMomoyu('fox', 180, 141, 3, t, {
      tail: tap ? 'tip' : 'base',
      eye: t > 38.4 ? 'smile' : 'plain',
      blush: t > 38.4,
      sticker: true,
      shadow: false
    });
  }

  /* 塔下的 FetchMo：31.5s 起竖抻腰身变成 28 格长条猫，探爪够尾尖，38s 缩回 */
  const stretch = ease(31.6, 35.6, t) * (1 - ease(37.7, 38.7, t));
  const extraCatRows = Math.round(stretch * 16);
  const catX = mix(140, 190, ease(29.5, 32.0, t));
  drawMomoyu('cat', catX, 492, 3, t, {
    tail: stretch > 0.2 ? 'up' : 'straight',
    eye: stretch > 0.6 ? 'effort' : 'plain',
    stretchRows: extraCatRows,
    sticker: true
  });

  /* 差着三大截的虚线量尺提示（纯视觉幽默，无文字） */
  if (t > 33.8 && t < 37.6) {
    const tailBottomY = 142 + dropRows * 3 + 4;
    const catTopY = 492 - (12 + extraCatRows) * 3 - 4;
    fade(arch(33.8, 37.6, t) * 0.85, () => {
      g.save();
      g.setLineDash([3, 4]);
      ln(194, tailBottomY + 4, 194, catTopY - 4, '#ffe599', 1.3);
      g.restore();
      ln(189, tailBottomY + 4, 199, tailBottomY + 4, '#ffe599', 1.2);
      ln(189, catTopY - 4, 199, catTopY - 4, '#ffe599', 1.2);
    });
  }

  /* 旁边围观打气的四只伙伴 */
  drawClawd(62, 496, 0.25, t, { rightLift: stretch > 0.4 ? 11 : 0 });
  drawFace('black', 274, 480, 15.5, t, { halo: true, tilt: -0.14 });
  drawFace('violet', 310, 486, 13.5, t, { tilt: -0.18 });
  drawFace('pink', 242, 488, 13.5, t, { tilt: -0.12 });
  fireflies(t, 10, 150, 470, 52);
}

/* 第二场：Clawd 高跷腿 + 三颗长果冻叠梯 -> 飞蛾掠过失衡 -> 小黑小紫摊成软圆蹦床垫 */
function shotStack(t) {
  plate('wall', paintTowerWallPlate);
  /* 塔窗上探头看的 StashYu */
  drawMomoyu('fox', 180, 141, 3, t, {
    tail: 'in',
    eye: t > 56 && t < 59.5 ? 'dot' : 'plain',
    sticker: true,
    shadow: false
  });

  if (t < 58.6) {
    const stilt = ease(43.2, 47.8, t);
    const stack = ease(48.2, 52.8, t);
    const wobble = t > 55.6 ? Math.sin((t - 55.6) * 11) * ease(55.6, 58.2, t) * 18 : 0;
    const legExt = stilt * 138;
    const baseX = 184 + wobble * 0.35;
    const baseY = 492;

    drawClawd(baseX, baseY, 0.28, t, {
      legExt,
      leftLift: wobble !== 0 ? 10 : 0,
      rightLift: wobble !== 0 ? 10 : 0,
      tilt: wobble * 0.006
    });

    /* Clawd 壳顶高度 */
    const shellTopY = baseY - (119 + legExt) * 0.28;
    const stretchY = mix(1, 1.64, stack);
    const squashX = mix(1, 0.76, stack);

    /* 小黑、小紫、小粉依次叠到壳顶拉成长果冻柱 */
    const k1 = ease(48.2, 49.8, t);
    const bX = mix(276, baseX + wobble * 0.55, k1);
    const bR = 15.5;
    const bY = mix(478, shellTopY - bR * stretchY + 2, k1) - Math.sin(k1 * PI) * 18;
    drawFace('black', bX, bY, bR, t, { sx: mix(1, squashX, k1), sy: mix(1, stretchY, k1), halo: true, tilt: wobble * 0.008 });

    const top1 = bY - bR * mix(1, stretchY, k1);
    const k2 = ease(49.4, 51.0, t);
    const vR = 14;
    const vX = mix(312, baseX + wobble * 0.8, k2);
    const vY = mix(484, top1 - vR * stretchY + 2, k2) - Math.sin(k2 * PI) * 20;
    drawFace('violet', vX, vY, vR, t, { sx: mix(1, squashX, k2), sy: mix(1, stretchY, k2), tilt: wobble * 0.01 });

    const top2 = vY - vR * mix(1, stretchY, k2);
    const k3 = ease(50.6, 52.0, t);
    const pR = 13.5;
    const pX = mix(118, baseX + wobble * 1.05, k3);
    const pY = mix(486, top2 - pR * stretchY + 2, k3) - Math.sin(k3 * PI) * 22;
    drawFace('pink', pX, pY, pR, t, { sx: mix(1, squashX, k3), sy: mix(1, stretchY, k3), tilt: wobble * 0.012 });

    const top3 = pY - pR * mix(1, stretchY, k3);
    const k4 = ease(51.6, 53.0, t);
    const cX = mix(78, baseX + wobble * 1.25, k4);
    const cY = mix(492, top3 + 2, k4) - Math.sin(k4 * PI) * 28;
    drawMomoyu('cat', cX, cY, 3, t, { tail: 'up', eye: wobble !== 0 ? 'dot' : 'smile', sticker: true, shadow: k4 < 0.15 });

    /* 55.5s 夜蛾飞过鼻尖 */
    if (t > 55.2) {
      const mu = (t - 55.2) / 3.4;
      const mx = mix(290, 110, mu);
      const my = top3 - 22 + Math.sin(t * 18) * 5;
      pose(mx, my, 1, 1, -0.2, () => {
        const flap = Math.abs(Math.sin(t * 28));
        ellipse(-4, 0, 5 * flap + 1, 3.2, '#f5e2a8', -0.4);
        ellipse(4, 0, 5 * flap + 1, 3.2, '#f5e2a8', 0.4);
      });
    }
  } else {
    /* 58.6s–64.0s：小黑和小紫在草地上摊宽成大软圆蹦床垫，稳稳接住 Clawd、小粉与 FetchMo */
    const u = t - 58.6;
    const bounce = Math.exp(-u * 1.6) * Math.abs(Math.sin(u * 7.2));
    const padSX = 1.92 + bounce * 0.28;
    const padSY = 0.48 - bounce * 0.10;

    drawFace('black', 150, 488, 19, t, { sx: padSX, sy: padSY, halo: true });
    drawFace('violet', 222, 490, 17.5, t, { sx: padSX, sy: padSY });

    const dropH = (1 - ease(0, 0.55, u)) * 130 + bounce * 28;
    drawClawd(148, 478 - dropH, 0.25, t, { leftLift: bounce * 12, rightLift: bounce * 12, shadow: false });
    drawFace('pink', 190, 466 - dropH * 1.08, 14, t, { sx: 1 + bounce * 0.14, sy: 1 - bounce * 0.12, shadow: false });
    drawMomoyu('cat', 226, 480 - dropH * 0.95, 3, t, { tail: 'up', eye: u > 1.2 ? 'smile' : 'dot', sticker: true, shadow: false });
  }
  fireflies(t, 11, 160, 470, 61);
}

/* 第三场：3A 墙角木花架秋藤织辫工坊（64–80s）+ 3B 二十肘金藤长辫挂上窗钩登塔（80–94s） */
function paintWorkshopPlate() {
  forestBackdrop(360, 0.22);
  moon(302, 74, 18, false);
  /* 近景石墙角、木花架横梁与垂挂的金黄秋藤 */
  rect(0, 345, W, 255, grad(0, 345, 0, H, ['#233e35', '#1a3129', '#12221d']));
  poly([[0, 112], [86, 126], [78, 362], [0, 362]], '#6d7366');
  for (let y = 134; y < 356; y += 18) ln(0, y, 80, y, 'rgba(40,46,42,0.4)', 0.9);
  /* 木花架横梁与斜撑，承托整排金秋藤蔓 */
  rect(0, 110, 198, 11, '#6f5238');
  ln(0, 111, 198, 111, '#a9845c', 1.2);
  ln(82, 162, 134, 121, '#59402b', 5);
  for (let k = 0; k < 6; k++) {

  }

  const r = rand(303);
  for (let i = 0; i < 12; i++) {
    const vx = 14 + i * 15.2 + (r() - 0.5) * 4;
    const vh = 88 + r() * 112;
    path('M ' + vx + ' 118 Q ' + (vx + 8) + ' ' + (118 + vh * 0.5) + ' ' + (vx - 4) + ' ' + (118 + vh), null, i % 2 ? '#d9a53b' : '#eec665', 2);
    for (let k = 1; k < 5; k++) {

    if (i % 3 === 0) bellflower(30 + r() * 300, 495 + r() * 55, 0.85, 0.1, 0.85);
  }
}

function shotBraid(t) {
  if (t < 80.0) {
    /* 3A：地面三股金藤编辫舞 */
    plate('workshop', paintWorkshopPlate);
    const u = t - 64.0;
    const shuttlePhase = Math.floor(t * 6) % 2;
    /* Clawd 站在左侧举双钳当梭子引藤 */
    drawClawd(72, 456, 0.30, t, {
      leftLift: shuttlePhase ? 14 : 2,
      rightLift: shuttlePhase ? 2 : 14
    });

    /* 三股金丝从 Clawd 右钳牵向三颗穿花绕股的小脸蛋 */
    const braidGrow = ease(66.0, 78.5, t);
    const centerX = 216, centerY = 444;
    const colors = ['#f8dd84', '#e4b144', '#d1982e'];
    const balls = ['pink', 'violet', 'black'];
    const order = [0, 1, 2].map(i => {
      const ph = t * 2.5 + (i * TAU) / 3;
      return {
        i,
        id: balls[i],
        x: centerX + Math.cos(ph) * 42,
        y: centerY + Math.sin(ph * 2) * 16,
        z: Math.sin(ph)
      };
    }).sort((a, b) => a.z - b.z);

    /* 未编合的三股金藤丝 */
    order.forEach(b => {
      path('M 104 426 Q ' + mix(104, b.x, 0.5) + ' ' + (b.y - 16) + ' ' + b.x + ' ' + b.y, null, colors[b.i], 2.6);
    });

    /* 已经编好的金藤长辫向右下蜿蜒铺展 */
    const pts = [];
    const totalPts = Math.max(3, Math.round(braidGrow * 26));
    for (let k = 0; k < totalPts; k++) {
      const f = k / 25;
      pts.push([
        mix(106, 336, f),
        432 + Math.sin(f * PI * 2.2) * 26 + f * 48
      ]);
    }
    drawGoldenBraid(pts, 10, t, true);

    /* 三颗圆球穿花绕股 */
    order.forEach(b => {
      drawFace(b.id, b.x, b.y, b.id === 'black' ? 16 : 14.5, t, {
        halo: b.id === 'black',
        tilt: Math.cos(t * 2.5 + b.i) * 0.16
      });
    });

    /* FetchMo 竖着尾巴把蓝风铃挑进金辫 */
    const tailWag = Math.floor(t * 4) % 2 === 0 ? 'up' : 'straight';
    drawMomoyu('cat', 298, 492, 3, t, { tail: tailWag, eye: 'smile', sticker: true, flip: true });
    bellflower(272, 472 + Math.sin(t * 4) * 3, 0.9, -0.3, 1.0);
    fireflies(t, 14, 180, 530, 74);
  } else {
    /* 3B：二十肘金藤辫拉上铁窗钩，五只顺着金辫爬进塔顶暖窗 */
    plate('wall', paintTowerWallPlate);
    const haul = ease(80.3, 85.2, t);
    const hookX = 207, hookY = 126;
    const topY = mix(476, hookY, haul);

    if (haul < 0.98) {
      /* 狐狸放下的翠绿风铃草细茎把金辫头拉上去 */
      ln(192, 138, hookX - 4, topY, '#79c28b', 1.5);
    }
    drawMomoyu('fox', 180, 141, 3, t, {
      tail: haul > 0.95 ? 'out' : 'in',
      eye: haul > 0.95 ? 'smile' : 'effort',
      sticker: true,
      shadow: false
    });

    /* 沿塔壁垂下的二十肘金藤长辫 */
    const braidPts = [];
    for (let k = 0; k <= 24; k++) {
      const f = k / 24;
      const yy = mix(topY, 488, f);
      const xx = hookX + Math.sin(f * PI * 3 + t * 1.4) * (2.5 + f * 2);
      braidPts.push([xx, yy]);
    }
    drawGoldenBraid(braidPts, 9, t, true);

    /* 86.2s–93.8s：五只依次顺着金辫往上爬进窗口 */
    const climbers = [
      ['cat', 86.2, 89.2],
      ['pink', 87.2, 90.2],
      ['violet', 88.2, 91.2],
      ['black', 89.2, 92.2],
      ['clawd', 90.2, 93.5]
    ];
    climbers.forEach(([id, t0, t1], idx) => {
      const p = ease(t0, t1, t);
      if (p >= 0.99) return; /* 已进窗内 */
      const cx = p < 0.02 ? (76 + idx * 28) : (hookX + Math.sin(p * PI * 5) * 3);
      const cy = p < 0.02 ? 490 : mix(484, 138, p);
      if (id === 'cat') drawMomoyu('cat', cx - 6, cy, 2.6, t, { tail: 'up', sticker: true, shadow: p < 0.05 });
      else if (id === 'clawd') drawClawd(cx, cy, 0.22, t, { step: p > 0.02, shadow: p < 0.05 });
      else drawFace(id, cx, cy - 10, id === 'black' ? 14 : 12.5, t, { halo: id === 'black', shadow: p < 0.05 });
    });
    fireflies(t, 16, 110, 490, 82);
  }
}

/* 第四场：4A 塔屋暖灯团聚（94–104s）+ 4B 窗外老铁剪咔嚓断辫落进枯荆棘（104–114s） */
function paintRoomPlate() {
  /* 圆石塔屋内景：暖石拱墙、星空大拱窗、木圆桌 */
  rect(0, 0, W, H, grad(0, 0, 0, H, ['#2d241e', '#463529', '#2a2019']));
  const r = rand(811);
  for (let y = 20; y < H; y += 26) {
    ln(0, y, W, y, 'rgba(20,14,10,0.34)', 1);
    let x = (y % 52 === 0) ? 0 : -22;
    while (x < W) {
      const w = 36 + r() * 28;
      rect(x + 1, y + 1, w - 2, 24, 'rgba(255,222,168,0.035)');
      ln(x, y, x, y + 26, 'rgba(20,14,10,0.3)', 1);
      x += w;
    }
  }
  /* 拱形夜空窗 */
  const win = new Path2D('M 106 276 V 136 A 74 74 0 0 1 254 136 V 276 Z');
  g.fillStyle = grad(180, 62, 180, 276, ['#0f1d2a', '#1d3646', '#33525b']);
  g.fill(win);
  g.save();
  g.clip(win);
  moon(216, 116, 16, true);
  for (let i = 0; i < 24; i++) disk(112 + r() * 136, 70 + r() * 170, 0.8 + r() * 0.9, '#fff2c2');
  g.restore();
  g.strokeStyle = '#8b7e6a';
  g.lineWidth = 6;
  g.stroke(win);
  rrect(94, 272, 172, 12, 3, '#a6967d', '#3e3328', 1);

  /* 暖吊灯与圆木桌 */
  ln(180, 0, 180, 42, '#3a2d22', 2);
  disk(180, 48, 96, glow(180, 48, 4, 96, 'rgba(255,220,142,0.36)', 'rgba(255,220,142,0)'));
  rrect(171, 38, 18, 20, 4, '#ffdf96', '#8c6332', 1.2);
  rect(0, 428, W, 172, '#35261c');
  ellipse(180, 426, 134, 28, '#7c5636');
  ellipse(180, 423, 128, 24, '#9b6e47');
}

function shotSnip(t) {
  if (t < 104.0) {
    /* 4A：六只在塔顶暖屋围桌分吃夜露风铃草叶 */
    plate('room', paintRoomPlate);
    /* 窗外铁钩上系着的金辫头 */
    drawGoldenBraid([[244, 274], [254, 284], [258, 304]], 8, t, false);
    /* 桌心陶盆与脆绿风铃草 */
    rrect(162, 398, 36, 22, 4, '#b56e4b', '#593321', 1);
    rampionRosette(180, 398, 1.15, 7);
    bellflower(174, 398, 0.95, -0.18, 1);
    bellflower(186, 398, 1.0, 0.16, 1);

    const bob = Math.sin(t * 3.6) * 2;
    drawMomoyu('fox', 94, 418, 3, t, { tail: 'out', eye: 'smile', blush: true });
    drawMomoyu('cat', 268, 418, 3, t, { tail: 'up', eye: 'smile', blush: true, flip: true });
    drawClawd(138, 404, 0.24, t, { rightLift: 8 + bob, blush: true });
    drawFace('black', 224, 392 + bob * 0.4, 15, t, { halo: true });
    drawFace('pink', 120, 438, 14.5, t, { tilt: 0.12 });
    drawFace('violet', 240, 438, 14, t, { tilt: -0.12 });
  } else if (t < 109.0) {
    /* 4B 上半：塔窗外特写，夜风吹动生锈老园艺剪咔嚓剪断金辫 */
    const snip = ease(106.8, 107.35, t);
    const slip = ease(107.35, 109.0, t);
    rect(0, 0, W, H, grad(0, 0, 0, H, ['#101e2a', '#1d3340', '#2a4448']));
    stoneTower(180, -40, 620, 128, { roof: false, windowY: 226, windowW: 84, windowH: 108, rowH: 22, seed: 55 });

    /* 夜风流线 */
    for (let i = 0; i < 6; i++) {
      const wx = ((t * 150 + i * 85) % 460) - 60;
      const wy = 130 + i * 48;
      fade(0.32, () => path('M ' + wx + ' ' + wy + ' Q ' + (wx + 38) + ' ' + (wy - 8) + ' ' + (wx + 76) + ' ' + (wy + 3), null, '#dcebe6', 1.2));
    }

    /* 窗内探出的小身影 */
    drawMomoyu('fox', 158, 278, 3, t, { eye: snip > 0.5 ? 'dot' : 'plain', sticker: true, shadow: false });
    drawFace('pink', 202, 266, 14, t, { shadow: false });

    /* 窗钩与金藤辫滑落 */
    const dropY = 258 + slip * 320;
    const braidPts = [];
    for (let k = 0; k <= 14; k++) {
      const f = k / 14;
      braidPts.push([232 + Math.sin(f * 5 + t * 4) * 5, dropY + f * 320]);
    }
    drawGoldenBraid(braidPts, 12, t, true);

    /* 挂在窗侧铁钉上的老园艺剪被风吹合拢 */
    const shearOpen = mix(0.46, 0.02, snip);
    drawIronShears(220, 258, 1.55, 0.22 + Math.sin(t * 7) * (1 - snip) * 0.08, shearOpen);
    if (t >= 107.2 && t < 107.8) {
      const sp = 1 - (t - 107.2) / 0.6;
      disk(236, 260, 14 * sp, 'rgba(255,244,196,0.75)');
    }
  } else {
    /* 4B 下半：远景俯看金辫落进塔底枯荆棘，六只挤在塔顶窗口往下看 */
    plate('wall', paintTowerWallPlate);
    drawBrambles(186, 496, 176, 0, t);
    /* 落在荆棘丛上的金藤辫 */
    const settle = ease(109.0, 110.6, t);
    const topBraidY = mix(220, 468, settle);
    const coil = [];
    for (let k = 0; k <= 16; k++) {
      const f = k / 16;
      coil.push([mix(128, 244, f), mix(topBraidY, 488, f) + Math.sin(f * PI * 3) * 8]);
    }
    drawGoldenBraid(coil, 8.5, t, true);

    /* 六只脑袋挤在塔顶唯一的小拱窗里往下张望 */
    drawFace('black', 172, 116, 8.5, t, { halo: true, shadow: false });
    drawFace('violet', 187, 118, 7.8, t, { shadow: false });
    drawFace('pink', 200, 120, 7.8, t, { shadow: false });
    drawClawd(173, 141, 0.12, t, { shadow: false });
    drawMomoyu('fox', 187, 142, 1.6, t, { tail: 'notail', eye: 'dot', sticker: true, shadow: false });
    drawMomoyu('cat', 199, 142, 1.6, t, { tail: 'base', eye: 'dot', sticker: true, shadow: false });
  }
}

/* 第五场：三颗小脸蛋鼓成浮球灯笼伞，六只手尾相连飘落；两滴清露化开枯刺开出蓝花海 */
function shotFloat(t) {
  plate('wall', paintTowerWallPlate);
  const descend = ease(115.4, 125.0, t);
  const puff = ease(114.4, 116.4, t);
  const bloom = ease(125.6, 130.5, t);

  /* 塔底暗藏矮木门随花开显露 */
  if (bloom > 0.25) {
    stoneTower(186, 62, 488, 66, {
      windowY: 118, windowW: 36, windowH: 48, seed: 412,
      doorOpen: ease(0.35, 1.0, bloom) * 0.45
    });
  }

  /* 六只连成一挂轻飘飘的彩色浮球伞缓缓下降 */
  const sway = Math.sin(t * 1.7) * 11 * (1 - descend * 0.6);
  const rigX = 166 + sway;
  const rigY = mix(148, 396, descend);
  const ballScale = mix(1, 1.56, puff);

  /* 细金丝牵引线 */
  const bPositions = [
    ['pink', rigX - 34, rigY - 56, 13.5],
    ['black', rigX, rigY - 68, 15.5],
    ['violet', rigX + 34, rigY - 54, 13.5]
  ];
  bPositions.forEach(([, bx, by]) => {
    ln(bx, by + 14, rigX, rigY - 12, '#f5d989', 1.3);
  });
  ln(rigX - 18, rigY + 4, rigX - 18, rigY + 36, '#f5d989', 1.3);
  ln(rigX + 18, rigY + 4, rigX + 18, rigY + 36, '#f5d989', 1.3);

  /* 上方三颗鼓气圆灯球小脸蛋 */
  bPositions.forEach(([id, bx, by, br]) => {
    disk(bx, by, br * ballScale * 1.35, glow(bx, by, 3, br * ballScale * 1.35, 'rgba(255,236,178,0.22)', 'rgba(255,236,178,0)'));
    drawFace(id, bx, by, br, t, { sx: ballScale, sy: ballScale, halo: id === 'black', shadow: false });
  });

  /* 中间牵绳的 Clawd */
  drawClawd(rigX, rigY + 8, 0.23, t, { leftLift: 12, rightLift: 12, shadow: false, sticker: true });

  /* 下方挂着的 StashYu 与 FetchMo（狐狸尾尖夹着那朵带露水的蓝风铃） */
  drawMomoyu('fox', rigX - 22, rigY + 54, 2, t, { tail: 'out', eye: 'smile', sticker: true, shadow: false });
  bellflower(rigX - 4, rigY + 42, 0.78, 0.25, 1.0);
  drawMomoyu('cat', rigX + 22, rigY + 54, 2, t, { tail: 'up', eye: 'smile', sticker: true, shadow: false, flip: true });

/* 画面内字幕（底部柔和暗衬，全部使用 360×600 逻辑坐标，不二次乘 scale） */
function drawCaptions(t, showSound) {
  const idx = getCueIdx(t, showSound);
  if (idx < 0) return;
  const [on, off, tag, text, kind] = cues[idx];
  const a = Math.min(ease(on, on + 0.22, t), 1 - ease(off - 0.25, off, t));
  fade(a, () => {
    rect(0, 486, W, 114, grad(0, 486, 0, H, [
      [0, 'rgba(12,22,20,0)'],
      [0.42, 'rgba(12,22,20,0.58)'],
      [1, 'rgba(10,18,17,0.88)']
    ]));
    /* 自动按长度折成一或两行，手机竖屏绝不出框 */
    let lines = [text];
    if (text.length > 16) {
      const comma = text.indexOf('，');
      const colon = text.indexOf('：');
      const cut = (comma > 5 && comma < text.length - 4) ? comma + 1
                : (colon > 5 && colon < text.length - 4) ? colon + 1
                : Math.ceil(text.length / 2);
      lines = [text.slice(0, cut), text.slice(cut)];
    }
    const baseY = lines.length === 1 ? 556 : 542;
    if (kind === 'sound') {
      word('〔 ' + tag + ' 〕', 180, baseY - 22, 11, '#ebd094', { family: sans, weight: 500 });
    }
    save(() => {
      g.shadowColor = 'rgba(8,14,13,0.85)';
      g.shadowBlur = 3;
      g.shadowOffsetY = 1;
      lines.forEach((lnStr, i) => {
        word(lnStr, 180, baseY + i * 22, 16.2, '#fff7e2', { weight: 600 });
      });
    });
  });
}

function setup(pxW) {
  const w = Math.max(180, Math.min(2160, Math.round(pxW || W * 2)));
  const h = Math.round((w * H) / W);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  scale = canvas.width / W;
  g = canvas.getContext('2d', { alpha: false });
  g.lineCap = 'round';
  g.lineJoin = 'round';
}

function screenReset() {
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.imageSmoothingEnabled = true;
  g.lineCap = 'round';
  g.lineJoin = 'round';
}

function render(time, showSoundCaptions = false) {
  const t = clamp(Number(time) || 0, 0, TOTAL);
  const sc = getScene(t);
  screenReset();
  switch (sc.id) {
    case 'garden': shotGarden(t); break;
    case 'tail': shotTailTry(t); break;
    case 'stack': shotStack(t); break;
    case 'braid': shotBraid(t); break;
    case 'snip': shotSnip(t); break;
    case 'float': shotFloat(t); break;
    case 'ending': shotEnding(t); break;
  }
  /* 场间轻柔叠化 */
  for (const cut of [20, 42, 64, 94, 114, 131]) {
    const d = Math.abs(t - cut);
    if (d < 0.28) fade((1 - d / 0.28) * 0.42, () => rect(0, 0, W, H, '#14201f'));
  }
  drawCaptions(t, showSoundCaptions);
  return canvas;
}

events.forEach(e => { e.vol *= 1.68; });
events.sort((a, b) => a.t - b.t);

const SR = 24000;
const sampleCache = new Map();
const ctxBuffers = new WeakMap();

function makeWave(e) {
  const key = e.kind + '|' + e.midi + '|' + e.len.toFixed(2);
  const hit = sampleCache.get(key);
  if (hit) return [key, hit];

  const dur = Math.max(0.08, e.len);
  const n = Math.ceil(dur * SR);
  const out = new Float32Array(n);
  const freq = 440 * Math.pow(2, (e.midi - 69) / 12);
  const r = rand((e.midi * 7919 + e.kind.charCodeAt(0) * 313) >>> 0);
  let ph = 0, brown = 0, lp = 0;

  for (let i = 0; i < n; i++) {
    const t = i / SR;
    const u = t / dur;
    const nz = r() * 2 - 1;
    brown = 0.975 * brown + 0.025 * nz;
    lp = 0.82 * lp + 0.18 * nz;
    let s = 0;

    if (e.kind === 'harp') {
      const atk = Math.min(1, t / 0.004);
      s = atk * (
        0.58 * Math.sin(TAU * freq * t) * Math.exp(-t / 1.15) +
        0.24 * Math.sin(TAU * freq * 2 * t + 0.2) * Math.exp(-t / 0.65) +
        0.10 * Math.sin(TAU * freq * 3 * t + 0.5) * Math.exp(-t / 0.36) +
        0.04 * Math.sin(TAU * freq * 4 * t) * Math.exp(-t / 0.2)
      ) + 0.08 * lp * Math.exp(-t / 0.015);
    } else if (e.kind === 'celesta') {
      const atk = Math.min(1, t / 0.003);
      s = atk * (
        0.62 * Math.sin(TAU * freq * t) * Math.exp(-t / 0.75) +
        0.22 * Math.sin(TAU * freq * 2.756 * t + 0.1) * Math.exp(-t / 0.28) +
        0.09 * Math.sin(TAU * freq * 5.404 * t) * Math.exp(-t / 0.12)
      );
    } else if (e.kind === 'flute') {
      const env = ease(0, 0.16, t) * (1 - ease(dur - 0.26, dur, t));
      const vib = 1 + 0.0032 * Math.sin(TAU * 4.8 * t) * ease(0.2, 0.6, t);
      ph += (TAU * freq * vib) / SR;
      s = env * (0.72 * Math.sin(ph) + 0.16 * Math.sin(2 * ph + 0.3) + 0.05 * Math.sin(3 * ph) + 0.05 * (lp - brown));
    } else if (e.kind === 'pad') {
      const env = ease(0, 0.9, t) * (1 - ease(dur - 1.1, dur, t));
      s = env * (
        0.55 * Math.sin(TAU * freq * t) +
        0.26 * Math.sin(TAU * freq * 1.0025 * t + 0.7) +
        0.18 * Math.sin(TAU * freq * 2 * t)
      );
    } else if (e.kind === 'wind') {
      const env = Math.pow(Math.sin(PI * u), 1.6);
      s = env * (brown * 2.4 + (lp - brown) * 0.35);
    } else if (e.kind === 'snap') {
      s = (0.75 * nz * Math.exp(-t / 0.018) + 0.55 * Math.sin(TAU * (320 - 180 * u) * t) * Math.exp(-t / 0.07));
    } else if (e.kind === 'boing') {
      const glide = freq * (1 + 0.42 * Math.sin(TAU * 5.5 * t) * Math.exp(-t / 0.35));
      ph += (TAU * glide) / SR;
      s = Math.min(1, t / 0.006) * (0.72 * Math.sin(ph) + 0.22 * Math.sin(2 * ph)) * Math.exp(-t / 0.28);
    } else if (e.kind === 'shuttle') {
      s = Math.min(1, t / 0.002) * (0.65 * Math.sin(TAU * 620 * t) * Math.exp(-t / 0.025) + 0.45 * lp * Math.exp(-t / 0.018));
    } else if (e.kind === 'snip') {
      const c1 = Math.sin(TAU * 1480 * t) * Math.exp(-t / 0.045) + Math.sin(TAU * 2390 * t) * Math.exp(-t / 0.03);
      const t2 = Math.max(0, t - 0.055);
      const c2 = t > 0.055 ? (Math.sin(TAU * 1820 * t2) * Math.exp(-t2 / 0.05) + 0.6 * nz * Math.exp(-t2 / 0.018)) : 0;
      s = 0.55 * c1 + 0.7 * c2;
    } else if (e.kind === 'drop') {
      const fDrop = freq * (0.78 + 0.45 * Math.min(1, t / 0.09));
      ph += (TAU * fDrop) / SR;
      s = Math.min(1, t / 0.003) * (0.7 * Math.sin(ph) * Math.exp(-t / 0.38) + 0.25 * Math.sin(2.01 * ph) * Math.exp(-t / 0.18));
    } else if (e.kind === 'door') {
      ph += (TAU * (165 + 28 * Math.sin(t * 19))) / SR;
      s = Math.sin(PI * u) * (0.45 * Math.sin(ph) + 0.22 * Math.sin(2 * ph) + 0.18 * brown);
    }
    out[i] = s * (1 - ease(dur - 0.015, dur, t));
  }
  sampleCache.set(key, out);
  return [key, out];
}

function playEvent(ac, dest, e, when, offset = 0) {
  if (offset >= e.len - 0.01) return null;
  let map = ctxBuffers.get(ac);
  if (!map) { map = new Map(); ctxBuffers.set(ac, map); }
  const [key, data] = makeWave(e);
  let buf = map.get(key);
  if (!buf) {
    buf = ac.createBuffer(1, data.length, SR);
    buf.getChannelData(0).set(data);
    map.set(key, buf);
  }
  const src = ac.createBufferSource();
  const gain = ac.createGain();
  src.buffer = buf;
  const dur = Math.min(e.len, buf.duration) - offset;
  if (dur <= 0.008) return null;
  gain.gain.setValueAtTime(offset > 0.03 ? 0 : e.vol, when);
  if (offset > 0.03) gain.gain.linearRampToValueAtTime(e.vol, when + Math.min(0.02, dur * 0.2));
  const rel = Math.min(0.18, dur * 0.3);
  gain.gain.setValueAtTime(e.vol, when + dur - rel);
  gain.gain.linearRampToValueAtTime(0, when + dur);
  src.connect(gain);
  if (ac.createStereoPanner) {
    const p = ac.createStereoPanner();
    p.pan.value = clamp(e.pan || 0, -1, 1);
    gain.connect(p);
    p.connect(dest);
  } else {
    gain.connect(dest);
  }
  src.start(when, Math.max(0, offset), dur);
  return src;
}

async function renderAudio() {
  const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new Offline(2, Math.ceil(TOTAL * SR), SR);
  for (const e of events) playEvent(off, off.destination, e, e.t, 0);
  return off.startRendering();
}

/* ---------------- 播放器与交互（Codex 风格） ---------------- */
const el = id => document.getElementById(id);
const viewer = el('viewer'), stage = el('stage'), entrance = el('entrance'), entranceWord = el('entranceWord');
const toggleBtn = el('toggle'), seekBar = el('seek'), clockOut = el('clock'), volBtn = el('volume'), expBtn = el('expand');

const ICONS = {
  play: '<path d="M6 3.8v16.4L19.2 12z" fill="currentColor"/>',
  pause: '<path d="M6 4.2h4v15.6H6zm8 0h4v15.6h-4z" fill="currentColor"/>',
  replay: '<path d="M4.5 10.2a7.8 7.8 0 1 1 .8 6.4M4.4 4.5v5.8h5.8" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>',
  sound: '<path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.2 8.2q3.6 3.8 0 7.6m2.9-10.6q6.4 6.8 0 13.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  mute: '<path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="m15.8 9 5.2 6m0-6-5.2 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  full: '<path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  shrink: '<path d="M9 3.8v5.2H3.8m11.2-5.2v5.2h5.2m0 6h-5.2v5.2M3.8 15h5.2v5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
};
const svgIcon = name => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
const fmtTime = sec => {
  const s = Math.floor(clamp(sec, 0, TOTAL) + 0.0001);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

let cur = 0, running = false, started = false, soundOn = true, theatre = false;
let ac = null, master = null, bus = null, pumpTimer = 0, raf = 0;
let origin = 0, wallStart = 0, audioStart = null, evIdx = 0, gen = 0;
let dragging = false, resumeAfterDrag = false;
let lastBtn = '', lastClock = '', activeCue = -2, activeScene = '';

/* 生成场次按钮与可跳转字幕本 */
const sceneBtns = scenes.map(s => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'reel-btn';
  b.textContent = s.name;
  b.addEventListener('click', () => {
    seek(s.start + 0.02);
    if (!running) play();
    stage.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  });
  el('reels').appendChild(b);
  return { id: s.id, b };
});

const cueBtns = cues.map(c => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'cue';
  const tm = document.createElement('time');
  tm.textContent = fmtTime(c[0]);
  const wrap = document.createElement('span');
  const sm = document.createElement('small');
  sm.textContent = c[2] + (c[4] === 'sound' ? ' · 拟音' : '');
  const wd = document.createElement('span');
  wd.className = 'word';
  wd.textContent = c[3];
  wrap.append(sm, wd);
  b.append(tm, wrap);
  b.setAttribute('aria-label', '从 ' + fmtTime(c[0]) + ' 播放：' + c[3]);
  b.addEventListener('click', () => {
    seek(c[0] + 0.03);
    if (!running) play();
    viewer.scrollIntoView({ block: 'start', behavior: 'auto' });
  });
  el('lines').appendChild(b);
  return b;
});

function nowTime() {
  if (!running) return cur;
  if (audioStart !== null && ac && ac.state === 'running') {
    return clamp(origin + (ac.currentTime - audioStart), 0, TOTAL);
  }
  return clamp(origin + (performance.now() - wallStart) / 1000, 0, TOTAL);
}

function stopBus() {
  if (bus) { try { bus.disconnect(); } catch (_) {} bus = null; }
  clearInterval(pumpTimer);
}

function syncMasterGain() {
  if (!master || !ac) return;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(soundOn ? 1 : 0, ac.currentTime, 0.015);
}

function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return Promise.resolve(false);
  try {
    if (!ac) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
      ac = new AC();
      master = ac.createGain();
      master.gain.value = soundOn ? 1 : 0;
      master.connect(ac.destination);
      ac.addEventListener('statechange', () => {
        if (running && (ac.state === 'interrupted' || ac.state === 'suspended')) pause();
      });
    }
    if (ac.state === 'running') return Promise.resolve(true);
    return ac.resume().then(() => ac.state === 'running').catch(() => false);
  } catch (_) {
    return Promise.resolve(false);
  }
}

function startScore(from) {
  stopBus();
  if (!ac || ac.state !== 'running') return;
  bus = ac.createGain();
  bus.connect(master);
  audioStart = ac.currentTime;
  origin = from;
  wallStart = performance.now();
  evIdx = 0;
  while (evIdx < events.length && events[evIdx].t < from) {
    const e = events[evIdx++];
    const off = from - e.t;
    if (off < e.len - 0.02) playEvent(ac, bus, e, ac.currentTime + 0.005, off);
  }
  function pump() {
    if (!running || !bus) return;
    const n = nowTime(), base = ac.currentTime;
    while (evIdx < events.length && events[evIdx].t < n + 0.55) {
      const e = events[evIdx++];
      const dt = e.t - n;
      if (dt + e.len > 0.015) playEvent(ac, bus, e, Math.max(base + 0.003, base + dt), Math.max(0, -dt));
    }
  }
  pump();
  pumpTimer = setInterval(pump, 110);
}

function updateUI(t) {
  const ended = started && t >= TOTAL - 0.02 && !running;
  const st = running ? 'pause' : ended ? 'replay' : 'play';
  if (st !== lastBtn) {
    lastBtn = st;
    toggleBtn.innerHTML = svgIcon(st);
    const lbl = st === 'pause' ? '暂停' : st === 'replay' ? '重播' : '播放';
    toggleBtn.setAttribute('aria-label', lbl);
    toggleBtn.title = lbl;
  }
  const clk = fmtTime(t) + ' / ' + fmtTime(TOTAL);
  if (clk !== lastClock) {
    lastClock = clk;
    clockOut.textContent = clk;
    seekBar.setAttribute('aria-valuetext', clk);
  }
  if (!dragging) seekBar.value = String(t);
  seekBar.style.setProperty('--pos', ((t * 100) / TOTAL).toFixed(2) + '%');

  const ci = started ? getCueIdx(t, true) : -1;
  if (ci !== activeCue) {
    if (cueBtns[activeCue]) cueBtns[activeCue].removeAttribute('aria-current');
    if (cueBtns[ci]) cueBtns[ci].setAttribute('aria-current', 'true');
    activeCue = ci;
  }
  const scId = started ? getScene(t).id : '';
  if (scId !== activeScene) {
    sceneBtns.forEach(s => {
      if (s.id === scId) s.b.setAttribute('aria-current', 'true');
      else s.b.removeAttribute('aria-current');
    });
    activeScene = scId;
  }

  entrance.hidden = running || (started && t < TOTAL - 0.02);
  entranceWord.textContent = started ? '再看一回' : '放映';
  entrance.setAttribute('aria-label', started ? '重新放映' : '放映短片');
}

function loop() {
  if (!running) return;
  cur = nowTime();
  render(cur, !soundOn);
  if (cur >= TOTAL - 0.01) {
    cur = TOTAL;
    running = false;
    gen++;
    audioStart = null;
    stopBus();
    render(TOTAL, !soundOn);
    updateUI(TOTAL);
    return;
  }
  updateUI(cur);
  raf = requestAnimationFrame(loop);
}

function play() {
  if (running) return;
  if (cur >= TOTAL - 0.02) cur = 0;
  started = true;
  running = true;
  origin = cur;
  wallStart = performance.now();
  audioStart = null;
  const myGen = ++gen;
  render(cur, !soundOn);
  updateUI(cur);
  unlockAudio().then(ok => {
    if (ok && running && myGen === gen) startScore(nowTime());
  });
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function pause() {
  if (!running) return;
  cur = nowTime();
  running = false;
  gen++;
  audioStart = null;
  cancelAnimationFrame(raf);
  stopBus();
  render(cur, !soundOn);
  updateUI(cur);
}

function seek(val) {
  const v = Number(val);
  if (!Number.isFinite(v)) return;
  cur = clamp(v, 0, TOTAL);
  started = true;
  if (running && cur >= TOTAL - 0.01) {
    running = false;
    gen++;
    cancelAnimationFrame(raf);
    stopBus();
    audioStart = null;
  } else if (running) {
    origin = cur;
    wallStart = performance.now();
    audioStart = null;
    startScore(cur);
  }
  render(cur, !soundOn);
  updateUI(cur);
}

function togglePlay() { running ? pause() : play(); }

function syncVolUI() {
  volBtn.innerHTML = svgIcon(soundOn ? 'sound' : 'mute');
  volBtn.setAttribute('aria-label', soundOn ? '静音' : '开启声音');
  volBtn.title = soundOn ? '静音' : '开启声音';
  volBtn.setAttribute('aria-pressed', String(!soundOn));
  syncMasterGain();
}

function setTheatre(on) {
  theatre = on;
  document.body.classList.toggle('theatre', on);
  expBtn.innerHTML = svgIcon(on ? 'shrink' : 'full');
  expBtn.setAttribute('aria-label', on ? '退出全屏' : '展开全屏');
  expBtn.title = on ? '退出全屏' : '展开全屏';
  expBtn.setAttribute('aria-pressed', String(on));
  requestAnimationFrame(sizeToScreen);
}

toggleBtn.addEventListener('click', togglePlay);
entrance.addEventListener('click', e => { e.stopPropagation(); play(); });
stage.addEventListener('click', togglePlay);

volBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  syncVolUI();
  if (started && !running) render(cur, !soundOn);
  if (soundOn && running && !bus) {
    unlockAudio().then(ok => { if (ok && running && !bus) startScore(nowTime()); });
  }
});

expBtn.addEventListener('click', () => {
  if (theatre) {
    setTheatre(false);
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } else {
    setTheatre(true);
    if (viewer.requestFullscreen) {
      try { const p = viewer.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
    }
  }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && theatre) setTheatre(false);
});

seekBar.addEventListener('pointerdown', () => {
  resumeAfterDrag = running;
  dragging = true;
  if (running) pause();
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  const again = resumeAfterDrag;
  resumeAfterDrag = false;
  if (again && cur < TOTAL - 0.03) play();
}
seekBar.addEventListener('input', () => seek(seekBar.value));
seekBar.addEventListener('change', () => { seek(seekBar.value); endDrag(); });
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && theatre) { setTheatre(false); return; }
  if (ev.repeat || ['BUTTON', 'INPUT', 'SUMMARY', 'A'].includes(ev.target.tagName)) return;
  if (ev.code === 'Space') { ev.preventDefault(); togglePlay(); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    ev.preventDefault();
    seek(nowTime() + (ev.key === 'ArrowLeft' ? -5 : 5));
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
window.addEventListener('pagehide', pause);

function sizeToScreen() {
  const box = stage.getBoundingClientRect();
  if (!box.width) return;
  const px = Math.round(box.width * Math.min(3, window.devicePixelRatio || 1));
  setup(px);
  if (started) render(nowTime(), !soundOn);
  else poster();
}

syncVolUI();
setTheatre(false);
sizeToScreen();
updateUI(0);

if (window.ResizeObserver) new ResizeObserver(sizeToScreen).observe(stage);
window.addEventListener('resize', sizeToScreen, { passive: true });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { if (!running) sizeToScreen(); });
}

/* 导视频与逐格自检口子 */
window.FILM = {
  W, H, TOTAL, width: W, height: H, duration: TOTAL, fps: FPS,
  canvas, events, setup, render, poster, renderAudio,
  cues, scenes: scenes.map(s => ({ id: s.id, name: s.name, start: s.start, duration: s.end - s.start })),
  seek, play, pause,
  get time() { return nowTime(); },
  get playing() { return running; },
  state: () => ({ cur: nowTime(), playing: running, soundOn, started })
};
})();
</script>
</body>
</html>
