    - Clawd：#d47f59 横向扁矩形壳 147×98、平伸双钳、踩角四腿、竖条黑眼、无嘴；
      序场四腿抻高成浅海涉水高跷腿，二场双钳向两侧拉宽比划参天巨烟，四场四腿收进壳底变成月光滑沙板。
    - 小脸蛋（小粉 #FF309B、小紫 #9159FE、小黑 #000000）：右上反斜杠胶囊缝 rotate(-26.3°)、右缝窄三分之一、evenodd 真挖空；

function word(str, x, y, size, color, opt = {}) {
  g.fillStyle = color;
  g.font = (opt.weight || 500) + ' ' + size + 'px ' + (opt.family || serif);
  g.textAlign = opt.align || 'center';
  g.textBaseline = opt.base || 'middle';
  g.fillText(str, x, y);
}

/* 细密画纸肌与静态底板缓存 */
let toothCanvas = null;
let toothPat = null;
function paperTooth() {
  if (toothCanvas) return toothCanvas;
  const c = document.createElement('canvas');
  c.width = 160; c.height = 160;
  const h = c.getContext('2d');
  const im = h.createImageData(160, 160);
  const r = rand(6151);
  for (let i = 0; i < im.data.length; i += 4) {
    const hi = r() > 0.5;
    im.data[i] = hi ? 248 : 22;
    im.data[i + 1] = hi ? 236 : 32;
    im.data[i + 2] = hi ? 206 : 46;
    im.data[i + 3] = Math.round(7 + r() * 16);
  }
  h.putImageData(im, 0, 0);
  toothCanvas = c;
  return c;
}
function grain(alpha = 0.36) {
  fade(alpha, () => {
    if (!toothPat) toothPat = g.createPattern(paperTooth(), 'repeat');
    g.fillStyle = toothPat;
    g.fillRect(0, 0, W, H);
  });
}

const MOMO_PAL = {
  fox: { M: '#E2552B', C: '#FFF3E3', D: '#3B2520', E: '#3B2520', line: '#3B2520' },
  cat: { M: '#F3E7D6', X: '#4E382E', E: '#79C0F0', line: '#4E382E' }
};

const momoCache = new Map();
function buildMomoSprite(kind, tail, eye, stretchCols = 0, sticker = false) {
  const key = kind + '|' + tail + '|' + eye + '|' + stretchCols + '|' + (sticker ? 1 : 0);
  let cv = momoCache.get(key);
  if (cv) return cv;

  const baseRows = MOMO_GRIDS[kind][tail] || MOMO_GRIDS[kind].base;
  let rows = baseRows;
  /* 变形：FetchMo 第四网拔河时，身子横向一格格拉长成 28 格拔河猫 */
  if (stretchCols > 0 && kind === 'cat') {
    rows = baseRows.map((r, ry) => {
      const fillCh = (ry >= 3 && ry <= 10) ? 'M' : '.';
      return r.slice(0, 12) + fillCh.repeat(stretchCols) + r.slice(12);
    });
  }
  const w = Math.max(...rows.map(r => r.length));
  const h = rows.length;
  const pal = MOMO_PAL[kind];

  const grid = Array.from({ length: h }, () => new Array(w).fill(null));
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (pal[ch]) {
        grid[y][x] = (ch === 'E' && eye !== 'plain') ? pal.M : pal[ch];
      }
    }
  }
  if (eye !== 'plain') {
    const anchors = kind === 'fox'
      ? [[3, 4], [9, 4]]
      : [[8, 5], [16 + stretchCols, 5]];
    anchors.forEach(([ax, ay], idx) => {
      const put = (dx, dy, col) => {
        if (ay + dy >= 0 && ay + dy < h && ax + dx >= 0 && ax + dx < w) grid[ay + dy][ax + dx] = col;
      };
      if (eye === 'blink') {
        put(0, 1, pal.line); put(1, 1, pal.line);
      } else if (eye === 'smile') {
        put(-1, 1, pal.line); put(0, 0, pal.line); put(1, 0, pal.line); put(2, 1, pal.line);
      } else if (eye === 'sleep') {
        put(-1, 0, pal.line); put(0, 1, pal.line); put(1, 1, pal.line); put(2, 0, pal.line);
      } else if (eye === 'glance') {
        const sh = kind === 'fox' ? 1 : -1;
        put(sh, 0, pal.E); put(1 + sh, 0, pal.E); put(sh, 1, pal.E); put(1 + sh, 1, pal.E);
      } else if (eye === 'effort') {
        if (idx === 0) { put(0, -1, pal.line); put(1, 0, pal.line); put(0, 1, pal.line); }
        else { put(1, -1, pal.line); put(0, 0, pal.line); put(1, 1, pal.line); }
      } else if (eye === 'dot') {
        if (idx === 0) put(1, 1, pal.E); else put(0, 1, pal.E);
      }
    });
  }

  cv = document.createElement('canvas');
  cv.width = w + 2;
  cv.height = h + 2;
  const cx = cv.getContext('2d');
  if (sticker) {
    cx.fillStyle = '#FFF6E6';
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (!grid[y][x]) continue;
        for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || nx >= w || ny < 0 || ny >= h || !grid[ny][nx]) {
            cx.fillRect(nx + 1, ny + 1, 1, 1);
          }
        }
      }
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (grid[y][x]) {
        cx.fillStyle = grid[y][x];
        cx.fillRect(x + 1, y + 1, 1, 1);
      }
    }
  }
  momoCache.set(key, cv);
  return cv;
}

function drawMomoyu(kind, x, feetY, unit, t, opts = {}) {
  const u = Math.max(1, Math.round(unit));
  const blink = !opts.eye && t > 0 && ((t + (kind === 'cat' ? 1.7 : 0.5)) % 5.2) < 0.13;
  const eye = opts.eye || (blink ? 'blink' : 'plain');
  let tail = opts.tail || 'base';
  if (tail === 'wag') {
    const f = Math.floor(t / 0.22) % 4;
    tail = ['base', 'in', 'base', 'out'][f];
  } else if (tail === 'twitch') {
    const cycT = t % 1.22;
    tail = cycT < 0.80 ? 'base' : cycT < 0.94 ? 'straight' : cycT < 1.08 ? 'out' : 'straight';
  }
  const stretchCols = Math.max(0, Math.round(opts.stretchCols || 0));
  const sp = buildMomoSprite(kind, tail, eye, stretchCols, !!opts.sticker);
  const hop = opts.hop ? -Math.floor(Math.abs(Math.sin(t * 8.5)) * 2) * u : 0;
  if (opts.shadow !== false) {
    ellipse(x, feetY + 1.5, u * (6.8 + stretchCols * 0.45), u * 1.35, 'rgba(10,18,32,0.28)');
  }
  pose(Math.round(x), Math.round(feetY + hop), opts.flip ? -1 : 1, 1, opts.tilt || 0, () => {
    g.imageSmoothingEnabled = false;
    const centerCol = 11 + Math.floor(stretchCols / 2);
    g.drawImage(sp, -centerCol * u, -(sp.height - 2) * u, sp.width * u, sp.height * u);
    if (opts.blush) {
      g.fillStyle = kind === 'fox' ? '#F59A8C' : '#F2B8B0';
      const pts = kind === 'fox' ? [[2, 6], [11, 6]] : [[8, 7], [17 + stretchCols, 7]];
      for (const [bx, by] of pts) {
        g.fillRect((bx - centerCol + 1) * u, (by - (sp.height - 3)) * u, u, u);
      }
    }
  });
}

/* 变形：FetchMo 化成液体细条猫倒栽进铜瓶口，露出两只深棕像素后爪与乱晃尾巴 */
function drawLiquidCatInBottle(mouthX, mouthY, u, t) {
  const kick = Math.floor(t * 10) % 2;
  const tailSwing = Math.floor(t * 7) % 3 - 1;
  g.save();
  g.imageSmoothingEnabled = false;
  const px = (gx, gy, w, h, col) => {
    g.fillStyle = '#FFF6E6';
    g.fillRect(Math.round(mouthX + (gx - 1) * u), Math.round(mouthY + (gy - 1) * u), (w + 2) * u, (h + 2) * u);
  };
  const cell = (gx, gy, w, h, col) => {
    g.fillStyle = col;
    g.fillRect(Math.round(mouthX + gx * u), Math.round(mouthY + gy * u), w * u, h * u);
  };
  /* 先垫贴纸白边，再画奶白液体细腰与深棕后爪、尾巴 */
  px(-2, -6, 4, 6);
  px(-4, -8 + kick, 2, 3);
  px(2, -8 + (1 - kick), 2, 3);
  px(tailSwing - 1, -13, 2, 6);
  cell(-2, -6, 4, 6, '#F3E7D6');
  cell(-3, -4, 6, 2, '#F3E7D6');
  cell(-4, -8 + kick, 2, 3, '#4E382E');
  cell(2, -8 + (1 - kick), 2, 3, '#4E382E');
  for (let i = 0; i < 6; i++) {
    const sx = Math.round(tailSwing * (i / 4));
    cell(sx, -8 - i, 2, 1, '#4E382E');
  }
  g.restore();
}

/* 变形：StashYu 把火红像素大尾巴绕在铜瓶脖子上当红锁绳（白尖搭在外面） */
function drawFoxTailBottleLock(foxX, foxFeetY, neckX, neckY, u, t) {
  drawMomoyu('fox', foxX, foxFeetY, u, t, { tail: 'notail', eye: 'effort', sticker: true });
  g.save();
  g.imageSmoothingEnabled = false;
  const steps = 9;
  const x0 = foxX + 4 * u, y0 = foxFeetY - 4 * u;
  for (let i = 0; i <= steps; i++) {
    const k = i / steps;
    const cx = Math.round(mix(x0, neckX, k));
    const cy = Math.round(mix(y0, neckY, k) - Math.sin(k * PI) * 4 * u);
    g.fillStyle = '#FFF6E6';
    g.fillRect(cx - 2 * u, cy - 2 * u, 4 * u, 4 * u);
  }
  for (let i = 0; i <= steps; i++) {
    const k = i / steps;
    const cx = Math.round(mix(x0, neckX, k));
    const cy = Math.round(mix(y0, neckY, k) - Math.sin(k * PI) * 4 * u);
    g.fillStyle = '#E2552B';
    g.fillRect(cx - u, cy - u, 3 * u, 2 * u);
  }
  /* 绕瓶颈两圈火红格 + 奶油白尾尖 */
  g.fillStyle = '#FFF6E6';
  g.fillRect(Math.round(neckX - 5 * u), Math.round(neckY - 2 * u), 11 * u, 5 * u);
  g.fillStyle = '#E2552B';
  g.fillRect(Math.round(neckX - 4 * u), Math.round(neckY - u), 8 * u, 3 * u);
  const tipBob = (Math.floor(t * 5) % 2) * u;
  g.fillStyle = '#FFF3E3';
  g.fillRect(Math.round(neckX + 4 * u), Math.round(neckY - u - tipBob), 3 * u, 2 * u);
  g.restore();
}

/* Clawd（Code 版宪法尺子：壳 44,50,147,98；钳 20,99,24,21 与 191,99,25,21；踩角四腿 44,68,152,176 宽15高21；眼 70,158 宽8高21） */
function drawClawd(x, feetY, s, t, opts = {}) {
  const legExt = Math.max(0, opts.legExt || 0);
  const flop = clamp(opts.flop || 0, 0, 1);
  const spread = Math.max(0, opts.clawSpread || 0);
  const stepOn = !!opts.step;
  const stepPhase = Math.floor(t * 7) % 2;
  const lLift = opts.leftLift || 0;
  const rLift = opts.rightLift || 0;
  const blink = !opts.sleep && ((t + 0.45) % 6.4) < 0.12;

  if (opts.shadow !== false) {
    ellipse(x, feetY + 1.5, (86 + spread * 0.4) * s, 13 * s, 'rgba(10,18,32,0.28)');
  }
  pose(x, feetY, s, s, opts.tilt || 0, () => {
    const legBaseH = (21 + legExt) * (1 - flop);
    const bodyLift = 148 + legBaseH;
    g.translate(-117.5, -bodyLift);
    const c = '#d47f59';
    const lw = 24 + spread, rw = 25 + spread;
    const lx = 44 - lw, rx = 191;

    rect(44, 50, 147, 98, c);
    rect(lx, 99 - lLift, lw, 21, c);
    rect(rx, 99 - rLift, rw, 21, c);

    if (legBaseH > 1.5) {
      const legs = [44, 68, 152, 176];
      for (let i = 0; i < 4; i++) {
        const liftFoot = stepOn && (i % 2 === stepPhase) ? 8 : 0;
        const lh = Math.max(4, legBaseH - liftFoot);
        rect(legs[i], 148, 15, lh, c);
      }
    }

    for (const ex of [70, 158]) {
      if (opts.sleep || blink) {
        rect(ex - 2, 91, 12, 4, '#181412');
      } else {
        rect(ex, 78, 8, 21, '#181412');
      }
    }

    /* 头顶挂件槽位：渔夫小头巾（奶油细布配黄铜圆扣，歪吹时可偏转） */
    if (opts.turban) {
      const skew = opts.turbanSkew || 0;
      pose(117.5 + skew * 10, 48, 1, 1, skew * 0.16, () => {
        rrect(-46, -16, 92, 20, 9, '#F7EFE0', '#C8A252', 2);
        rrect(-36, -24, 72, 13, 7, '#EFE3CC');
        ln(-34, -6, 34, -6, '#D4B062', 2.2);
        disk(0, -10, 6.5, '#D9A441');
        disk(0, -10, 3.2, '#2B7A8B');
      });
    }
  });
}

/* 小脸蛋（实测版宪法：sRGB #FF309B / #9159FE / #000000，反斜杠 rotate(-26.3°)，右缝窄 1/3，evenodd 真挖空） */
const FACE_HEX = { pink: '#FF309B', violet: '#9159FE', black: '#000000' };
function addFaceSlits(blink, slitShiftY = 0) {
  const slits = [[0.194, -0.416 + slitShiftY, 0.194], [0.626, -0.497 + slitShiftY, 0.129]];
  const ang = -26.3 * PI / 180;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  for (let i = 0; i < 2; i++) {
    const [px, py, w] = slits[i];
    const len = blink ? 0.12 : 0.418;
    const rad = Math.min(w / 2, len / 2);
    const half = Math.max(0, len / 2 - rad);
    const Steps = 10;
    for (let k = 0; k <= Steps; k++) {
      const a = PI + (PI * k) / Steps;
      const lx = Math.cos(a) * rad, ly = -half + Math.sin(a) * rad;
      const gx = px + lx * ca - ly * sa, gy = py + lx * sa + ly * ca;
      if (k === 0) g.moveTo(gx, gy); else g.lineTo(gx, gy);
    }
    for (let k = 0; k <= Steps; k++) {
      const a = (PI * k) / Steps;
      const lx = Math.cos(a) * rad, ly = half + Math.sin(a) * rad;
      const gx = px + lx * ca - ly * sa, gy = py + lx * sa + ly * ca;
      g.lineTo(gx, gy);
    }
    g.closePath();
  }
}

function drawFace(kind, cx, cy, r, t, opts = {}) {
  const sx = opts.sx || 1;
  const sy = opts.sy || 1;
  const tilt = opts.tilt || 0;
  const phase = kind === 'pink' ? 1.1 : kind === 'violet' ? 2.4 : 0.3;
  const blink = opts.sleep || (!opts.awake && ((t + phase) % 6.0) < 0.12);

  if (opts.shadow !== false) {
    ellipse(cx, cy + r * sy + 1.5, r * sx * 0.86, Math.max(2, r * 0.18), 'rgba(10,18,32,0.26)');
  }
  /* 夜色下在小黑背后垫一圈柔和月华，球体本身保持 100% 纯黑无高光，挖空眼缝透出背光 */
  if (kind === 'black' && opts.halo) {
    const hr = r * Math.max(sx, sy) * 1.32;
    disk(cx, cy, hr, glow(cx, cy, r * 0.35, hr, 'rgba(248,236,196,0.36)', 'rgba(248,236,196,0)'));
  }

  pose(cx, cy, r * sx, r * sy, tilt, () => {
    g.beginPath();
    if (opts.shape === 'teardrop') {
      /* 变形：第一网挂底时被拽成长水滴浮漂 */
      const stretch = opts.dropStretch || 1.55;
      g.moveTo(0, -stretch);
      g.bezierCurveTo(0.75, -stretch * 0.32, 1.04, 0.25, 0.96, 0.65);
      g.bezierCurveTo(0.84, 1.12, -0.84, 1.12, -0.96, 0.65);
      g.bezierCurveTo(-1.04, 0.25, -0.75, -stretch * 0.32, 0, -stretch);
      g.closePath();
      addFaceSlits(blink, 0.12);
    } else if (opts.shape === 'hourglass') {
      /* 变形：小粉硬挤窄铜瓶口，卡成两头鼓中间细的沙漏果冻 */
      const pinch = opts.pinch || 0.36;
      g.moveTo(0, -1.35);
      g.bezierCurveTo(0.95, -1.35, 1.12, -0.52, pinch, 0.05);
      g.bezierCurveTo(0.92, 0.48, 0.88, 1.18, 0, 1.18);
      g.bezierCurveTo(-0.88, 1.18, -0.92, 0.48, -pinch, 0.05);
      g.bezierCurveTo(-1.12, -0.52, -0.95, -1.35, 0, -1.35);
      g.closePath();
      addFaceSlits(blink, -0.34);
    } else {
      g.arc(0, 0, 1, 0, TAU);
      g.closePath();
      addFaceSlits(blink, 0);
    }
    g.fillStyle = FACE_HEX[kind];
    g.fill('evenodd');

    /* 第二网捞起海草时给小紫头顶戴一簇绿海草假发（外部穿戴） */
    if (opts.kelpWig) {
      g.fillStyle = '#2E8B6E';
      for (const [kx, ky, kr] of [[-0.55, -0.92, 0.32], [-0.15, -1.05, 0.36], [0.28, -0.98, 0.33], [0.62, -0.82, 0.26]]) {
        g.beginPath(); g.arc(kx, ky, kr, 0, TAU); g.fill();
      }
      g.strokeStyle = '#56B893';
      g.lineWidth = 0.11;
      g.beginPath();
      g.moveTo(-0.45, -0.85); g.quadraticCurveTo(-0.78, -0.35, -0.68, 0.15);
      g.moveTo(0.45, -0.85); g.quadraticCurveTo(0.82, -0.3, 0.75, 0.18);
      g.stroke();
    }
  });
}

/* ---------------- 波斯细密画海湾、黄铜胆瓶、青烟巨魔与四山景物 ---------------- */
function drawCrescentMoon(cx, cy, r, dawn = 0) {
  fade(1 - dawn * 0.78, () => {
    disk(cx, cy, r * 2.5, glow(cx, cy, r * 0.25, r * 2.5, 'rgba(253,238,186,0.30)', 'rgba(253,238,186,0)'));
    pose(cx, cy, 1, 1, -0.38, () => {
      g.beginPath();
      g.arc(0, 0, r, -PI * 0.72, PI * 0.72, false);
      g.quadraticCurveTo(r * 0.22, 0, Math.cos(-PI * 0.72) * r, Math.sin(-PI * 0.72) * r);
      g.closePath();
      g.fillStyle = '#FBF0CE';
      g.fill();
    });
  });
}

function drawArabianSky(horizonY, t, dawn = 0) {
  const stops = dawn < 0.05
    ? [[0, '#0B1630'], [0.45, '#152C52'], [0.80, '#1F496B'], [1, '#2D6B7A']]
    : [
        [0, dawn > 0.6 ? '#243B63' : '#132548'],
        [0.42, dawn > 0.6 ? '#535A7E' : '#2C476D'],
        [0.76, dawn > 0.6 ? '#C9836B' : '#7D6A78'],
        [1, dawn > 0.6 ? '#F6CF8E' : '#D9A778']
      ];
  rect(0, 0, W, horizonY + 12, grad(0, 0, 0, horizonY + 12, stops));

  /* 星辰与四角金星闪烁 */
  const r = rand(1001);
  const starFade = clamp(1 - dawn * 0.82, 0.08, 1);
  for (let i = 0; i < 64; i++) {
    const sx = r() * W;
    const sy = r() * (horizonY * 0.86);
    const tw = 0.45 + 0.55 * Math.sin(t * (1.6 + (i % 5) * 0.4) + i * 1.3);
    const sr = 0.5 + r() * 1.05;
    fade(starFade * (0.28 + 0.68 * tw), () => {
      if (i % 9 === 0) star4(sx, sy, sr * 2.6, '#FFE8A3');
      else disk(sx, sy, sr, i % 4 === 0 ? '#FFEAB3' : '#E3F2F6');
    });
  }
  if (dawn > 0.35) {
    const sunY = mix(horizonY + 18, horizonY - 34, ease(0.35, 1, dawn));
    disk(W * 0.74, sunY, 72, glow(W * 0.74, sunY, 8, 72, 'rgba(255,232,168,0.52)', 'rgba(255,200,140,0)'));
    disk(W * 0.74, sunY, 17, '#FFF2C6');
  }
}

function drawDatePalm(x, baseY, h, sway = 0, dark = false) {
  const topX = x + sway * 12;
  const topY = baseY - h;
  g.save();
  g.strokeStyle = dark ? '#241D29' : '#5B402C';
  g.lineWidth = 6.5;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x, baseY);
  g.quadraticCurveTo(x + sway * 5, baseY - h * 0.52, topX, topY);
  g.stroke();
  /* 树干鳞节 */
  for (let i = 1; i < 7; i++) {
    const k = i / 7;
    const kx = mix(x, topX, k * k * 0.7 + k * 0.3);
    const ky = baseY - h * k;
    ln(kx - 3.2, ky, kx + 3.2, ky + 1.2, dark ? '#382E3D' : '#7B583D', 1.2);
  }
  /* 羽状棕榈叶 */
  const leafCol = dark ? '#1D333B' : '#28645B';
  const hiCol = dark ? '#2B4B54' : '#3F8779';
  const angles = [-2.55, -2.05, -1.5, -0.85, -0.35, 0.22];
  angles.forEach((ang, idx) => {
    const dir = idx < 3 ? -1 : 1;
    const lx = topX + Math.cos(ang) * 36 + sway * 5;
    const ly = topY + Math.sin(ang) * 18 + 14;
    g.beginPath();
    g.moveTo(topX, topY);
    g.quadraticCurveTo((topX + lx) / 2, topY - 12, lx, ly);
    g.quadraticCurveTo((topX + lx) / 2 + dir * 4, topY - 3, topX, topY + 2);
    g.fillStyle = idx % 2 === 0 ? leafCol : hiCol;
    g.fill();
  });
  g.restore();
}

function drawTurquoiseSea(seaY, shoreY, t, dawn = 0) {
  const cTop = dawn > 0.5 ? '#267887' : '#124659';
  const cMid = dawn > 0.5 ? '#3A989E' : '#1B6675';
  const cBot = dawn > 0.5 ? '#68BDB4' : '#2A8991';
  rect(0, seaY, W, shoreY - seaY + 14, grad(0, seaY, 0, shoreY + 14, [[0, cTop], [0.55, cMid], [1, cBot]]));

  /* 波斯细密画卷草金银浪纹 */
  for (let row = 0; row < 5; row++) {
    const wy = seaY + 12 + row * ((shoreY - seaY - 14) / 4.6);
    const amp = 2.2 + row * 0.55;
    const ph = t * (1.2 + row * 0.18) + row * 1.4;
    g.beginPath();
    for (let x = -10; x <= W + 10; x += 8) {
      const yy = wy + Math.sin(x * 0.055 + ph) * amp;
      if (x === -10) g.moveTo(x, yy); else g.lineTo(x, yy);
    }
    g.strokeStyle = dawn > 0.5 ? 'rgba(255,240,196,0.38)' : 'rgba(174,234,232,0.28)';
    g.lineWidth = 1.25;
    g.stroke();
  }
  /* 拍岸碎浪花 */
  g.beginPath();
  g.moveTo(0, shoreY + 8);
  for (let x = 0; x <= W; x += 6) {
    const foam = shoreY - 3 + Math.sin(x * 0.05 + t * 2.3) * 3.5;
    g.lineTo(x, foam);
  }
  g.lineTo(W, H);
  g.lineTo(0, H);
  g.closePath();
  g.fillStyle = dawn > 0.5 ? '#EBC992' : '#B8945E';
  g.fill();

  /* 潮线金白浪沫 */
  g.beginPath();
  for (let x = 0; x <= W; x += 6) {
    const foam = shoreY - 3 + Math.sin(x * 0.05 + t * 2.3) * 3.5;
    if (x === 0) g.moveTo(x, foam); else g.lineTo(x, foam);
  }
  g.strokeStyle = dawn > 0.5 ? 'rgba(255,248,225,0.82)' : 'rgba(232,248,246,0.68)';
  g.lineWidth = 2.4;
  g.stroke();
}

function drawSkiff(cx, cy, tilt = 0) {
  pose(cx, cy, 1, 1, tilt, () => {
    ellipse(0, 12, 48, 6, 'rgba(8,22,34,0.32)');
    g.beginPath();
    g.moveTo(-50, -6);
    g.quadraticCurveTo(-56, -20, -44, -24);
    g.quadraticCurveTo(-36, -10, -24, -4);
    g.lineTo(32, -4);
    g.quadraticCurveTo(44, -10, 50, -22);
    g.quadraticCurveTo(56, -14, 46, 2);
    g.quadraticCurveTo(18, 13, -38, 9);
    g.closePath();
    g.fillStyle = '#7A4E2D';
    g.fill();
    g.strokeStyle = '#D5A756';
    g.lineWidth = 1.5;
    g.stroke();
    ln(-34, 1, 34, 1, '#A67346', 1.4);
  });
}

function drawCreel(cx, bottomY, s = 1) {
  pose(cx, bottomY, s, s, 0, () => {
    ellipse(0, 1, 16, 3.5, 'rgba(12,20,30,0.28)');
    rrect(-14, -24, 28, 24, 7, '#A67B44', '#6E4C24', 1.3);
    for (let y = -19; y <= -5; y += 4.5) ln(-13, y, 13, y, '#7E592C', 1.1);

}

/* 黄铜胆瓶与六角星铅封盖 */
function drawBrassBottle(cx, bottomY, s = 1, tilt = 0, opts = {}) {
  pose(cx, bottomY, s, s, tilt, () => {
    if (opts.shadow !== false) ellipse(0, 2, 22, 4.5, 'rgba(10,18,32,0.34)');
    /* 底座 */
    rrect(-13, -6, 26, 6, 2.5, '#9E6E1E', '#6B4810', 1.2);
    /* 黄瓜肚曲线瓶身 */
    const bodyGrad = grad(-18, -32, 18, -32, [[0, '#9B6B1B'], [0.34, '#F4CF72'], [0.62, '#D9A441'], [1, '#7F5514']]);
    g.beginPath();
    g.moveTo(-11, -5);
    g.bezierCurveTo(-22, -16, -21, -40, -8, -50);
    g.lineTo(-6.5, -63);
    g.lineTo(6.5, -63);
    g.lineTo(8, -50);
    g.bezierCurveTo(21, -40, 22, -16, 11, -5);
    g.closePath();
    g.fillStyle = bodyGrad;
    g.fill();
    g.strokeStyle = '#6B4810';
    g.lineWidth = 1.3;
    g.stroke();

    /* 双耳铜环 */
    g.strokeStyle = '#C8922E';
    g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(-7, -56); g.bezierCurveTo(-18, -56, -19, -39, -13, -36);
    g.moveTo(7, -56); g.bezierCurveTo(18, -56, 19, -39, 13, -36);
    g.stroke();

    /* 瓶口唇边与腰间波斯雕纹 */
    rrect(-9, -67, 18, 5, 2.2, '#EBC15E', '#6B4810', 1.2);
    ln(-16, -29, 16, -29, '#7A5112', 1.2);
    ln(-15, -24, 15, -24, '#F9E096', 1.0);
    for (let dx = -12; dx <= 12; dx += 6) disk(dx, -26.5, 1.3, '#236B78');

    /* 瓶底两豆得意小黄眼（烟刚钻回瓶里那几秒） */
    if (opts.peekingEyes) {
      rrect(-10, -38, 20, 14, 6, 'rgba(22,16,38,0.82)');
      disk(-4.2, -31, 2.3, '#FFD166');
      disk(4.2, -31, 2.3, '#FFD166');
    }
    /* 终场：空铜瓶里插着一枝带露晨光海百合 */
    if (opts.seaLily) {
      g.strokeStyle = '#3B7D5E';
      g.lineWidth = 2.2;
      g.beginPath();
      g.moveTo(0, -66);
      g.quadraticCurveTo(3, -82, -2, -96);
      g.stroke();
      /* 两片修长绿叶 */
      poly([[0, -73], [-12, -82], [-3, -78]], '#4A9470');
      poly([[1, -77], [13, -86], [3, -81]], '#3B7D5E');
      /* 六瓣洁白海百合与金蕊露珠 */
      pose(-2, -98, 1, 1, -0.1, () => {
        for (let k = 0; k < 5; k++) {
          const a = -PI * 0.85 + k * 0.42;
          ellipse(Math.cos(a) * 7, Math.sin(a) * 6, 7.5, 3.2, '#FFFBF0', a);
        }
        disk(0, -2, 3.2, '#F5C242');
        disk(6, -8, 1.6, '#BEE9F7');
      });
    }
    if (opts.sealed) {
      drawLeadCap(0, -69, 1, 0, !!opts.sealGlow);
    }
  });
}

function drawLeadCap(cx, cy, s = 1, rot = 0, sealGlow = false) {
  pose(cx, cy, s, s, rot, () => {
    if (sealGlow) {
      disk(0, -2, 18, glow(0, -2, 2, 18, 'rgba(255,216,112,0.55)', 'rgba(255,216,112,0)'));
    }
    rrect(-10.5, -4, 21, 7, 2.5, '#768291', '#3E4754', 1.2);
    rrect(-8, -7.5, 16, 4.5, 2, '#96A2B0', '#3E4754', 1.1);
    star6(0, -2, 4.4, sealGlow ? '#FFE082' : '#D9B45B', sealGlow ? '#FFF6CC' : '#53431E', 0.8);
  });
}

/* 参天青烟巨魔（波斯细密画云气造型：青金紫与孔雀青层次，无 #E2552B） */
function drawSmokeJinni(mouthX, mouthY, emerge, t, mood = 'proud') {
  const e = clamp(emerge, 0, 1);
  if (e <= 0.01) return;
  const topY = mix(mouthY - 24, 92, e);
  const sway = Math.sin(t * 1.9) * 7 * e;

  g.save();
  /* 从窄瓶口袅袅升起并向上撑开的星烟柱 */
  for (let i = 0; i <= 16; i++) {
    const k = i / 16;
    const py = mix(mouthY - 4, topY + 64, k);
    const px = mouthX + Math.sin(k * 4.5 - t * 2.8) * (4 + k * 22) * e + sway * k;
    const pr = mix(4.5, 68 * e, Math.pow(k, 0.78));
    const col = i % 3 === 0 ? '#241B46' : i % 3 === 1 ? '#1B5668' : '#35265E';
    disk(px, py, pr, col);
  }

  if (e > 0.42) {
    const bodyA = ease(0.42, 0.82, e);
    fade(bodyA, () => {
      const hx = mouthX + sway, hy = topY + 34;
      /* 宽阔云肩与盘抱/挥舞烟臂 */
      ellipse(hx, hy + 44, 82, 46, '#2A1F4D');
      ellipse(hx - 54, hy + 38, 36, 26, '#1E5B6D', -0.3);
      ellipse(hx + 54, hy + 38, 36, 26, '#1E5B6D', 0.3);
      /* 腕上古黄铜云镯 */
      if (mood === 'cramped') {
        /* 揉着憋酸了的脖子 */
        ellipse(hx + 34, hy + 8, 22, 14, '#35265E', -0.5);
        rrect(hx + 18, hy + 2, 14, 6, 3, '#D9A441', '#6B4810', 1);
      } else {
        rrect(hx - 68, hy + 44, 18, 7, 3, '#D9A441', '#6B4810', 1);
        rrect(hx + 50, hy + 44, 18, 7, 3, '#D9A441', '#6B4810', 1);
      }
      /* 烟雾头冠与孔雀青高光涡卷 */
      disk(hx, hy, 38, '#33245C');
      disk(hx, hy - 30, 18, '#236878');
      disk(hx, hy - 44, 9, '#56B4B0');
      /* 云头巾与黄铜额饰 */
      ellipse(hx, hy - 16, 40, 15, '#1D5263');
      disk(hx, hy - 20, 6.5, '#F2CB6D');
      /* 两只琥珀灯笼眼与云眉 */
      const browTilt = mood === 'provoked' ? 0.34 : mood === 'rage' ? 0.28 : 0.14;
      ellipse(hx - 14, hy - 2, 8.5, mood === 'provoked' ? 8.5 : 6.2, '#FFD166');
      ellipse(hx + 14, hy - 2, 8.5, mood === 'provoked' ? 8.5 : 6.2, '#FFD166');
      disk(hx - 14, hy - 2, 2.8, '#241838');
      disk(hx + 14, hy - 2, 2.8, '#241838');
      pose(hx - 15, hy - 10, 1, 1, browTilt, () => rrect(-11, -3, 22, 5, 2.5, '#8EE0D8'));
      pose(hx + 15, hy - 10, 1, 1, -browTilt, () => rrect(-11, -3, 22, 5, 2.5, '#8EE0D8'));
      /* 卷曲青烟胡须 */
      g.strokeStyle = '#56B4B0';
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(hx - 6, hy + 12); g.quadraticCurveTo(hx - 26, hy + 18, hx - 30, hy + (mood === 'provoked' ? 4 : 10));
      g.moveTo(hx + 6, hy + 12); g.quadraticCurveTo(hx + 26, hy + 18, hx + 30, hy + (mood === 'provoked' ? 4 : 10));
      g.stroke();

      /* 烟肚内星尘点缀 */
      const sr = rand(77);
      for (let s = 0; s < 18; s++) {
        const sx = hx + (sr() - 0.5) * 110;
        const sy = hy + 18 + sr() * 75;
        disk(sx, sy, 1.1, 'rgba(255,234,172,0.55)');
      }
    });
  }
  g.restore();
}

/* 第二场：巨魔烟肚里浮现的四百年憋屈日记圆窗 */
function drawCenturyMedallion(cx, cy, centuryIdx, alpha, t) {
  fade(alpha, () => {
    disk(cx, cy, 34, 'rgba(14,25,48,0.88)');
    ring(cx, cy, 34, '#E8C063', 2);
    if (centuryIdx === 0) {
      /* 头一百年：金子堆满无人捞 */
      for (const [dx, dy] of [[-10, 10], [0, 10], [10, 10], [-5, 4], [5, 4], [0, -2]]) {
        ellipse(cx + dx, cy + dy, 6.5, 3.2, '#F4C852');
      }
      star4(cx - 12, cy - 10, 4.5, '#FFF2B2');
      word('一百年', cx, cy - 18, 9.5, '#F9E3A6', { family: sans });
    } else if (centuryIdx === 1) {
      /* 第二百年：宝石箱旁只有小鱼路过 */
      rrect(cx - 13, cy - 2, 26, 15, 3, '#7C4E29', '#E8C063', 1.2);
      disk(cx - 5, cy - 4, 3.5, '#4CC9F0');
      disk(cx + 4, cy - 5, 3.8, '#9159FE');
      ellipse(cx + 14, cy - 14, 5, 2.5, '#72DDF7');
      word('二百年', cx, cy - 18, 9.5, '#F9E3A6', { family: sans });
    } else if (centuryIdx === 2) {
      /* 第三百年：三颗愿望星与倒栽葱铜瓶 */
      drawBrassBottle(cx, cy + 16, 0.34, 2.6, { shadow: false, sealed: true });
      for (const [sx, sy] of [[-14, -6], [0, -11], [14, -6]]) star4(cx + sx, cy + sy, 4.8, '#FFD166');
      word('三百年', cx, cy - 19, 9.5, '#F9E3A6', { family: sans });
    } else {
      /* 第四百年：紫电雷云气歪了眉 */
      ellipse(cx, cy - 2, 19, 11, '#432C6E');
      const flash = Math.sin(t * 18) > 0 ? '#FFE066' : '#F4A261';
      poly([[cx - 2, cy + 4], [cx + 6, cy + 4], [cx + 1, cy + 12], [cx + 8, cy + 12], [cx - 4, cy + 23], [cx, cy + 14], [cx - 6, cy + 14]], flash);
      word('四百年', cx, cy - 19, 9.5, '#FFD166', { family: sans });
    }
  });
}

/* 第三场末：漫天青烟被激得化作旋风漏斗钻回窄铜瓶口 */
function drawSmokeVortex(mouthX, mouthY, progress, t) {
  const p = clamp(progress, 0, 1);
  const maxH = mix(340, 14, ease(0.15, 0.98, p));
  const rings = 22;
  for (let i = 0; i < rings; i++) {
    const k = i / rings;
    const ry = mouthY - 4 - k * maxH;
    const spread = (4 + Math.pow(k, 1.35) * 125) * (1 - p * 0.85);
    const spin = t * 11 + k * 7;
    const rx = mouthX + Math.sin(spin) * spread * 0.26;
    ellipse(rx, ry, spread, Math.max(3, spread * 0.24), i % 2 === 0 ? 'rgba(35,104,120,0.68)' : 'rgba(51,36,92,0.72)');
    if (i % 4 === 0 && p < 0.92) {
      star4(rx + Math.cos(spin) * spread * 0.75, ry, 3.2, '#FFE8A3');
    }
  }
}

/* 第四、五场：约法三章后变成拳头大的夜光引路小烟团 */
function drawSmokeWisp(cx, cy, r, t, opts = {}) {
  const bob = Math.sin(t * 4.2) * 3.2;
  const bow = opts.bow ? Math.sin(opts.bow * PI) * 0.42 : 0;
  const y = cy + bob;
  disk(cx, y, r * 2.4, glow(cx, y, r * 0.2, r * 2.4, 'rgba(130,232,222,0.42)', 'rgba(130,232,222,0)'));
  pose(cx, y, 1, 1, bow, () => {
    /* 小巧烟尾与圆滚滚青绿云团 */
    poly([[0, r * 0.7], [-r * 0.5, r * 1.45], [r * 0.35, r * 1.15]], '#287D8C');
    disk(-r * 0.45, r * 0.1, r * 0.68, '#2F6B8A');
    disk(r * 0.45, r * 0.1, r * 0.68, '#2F6B8A');
    disk(0, 0, r, '#3E96A3');
    disk(0, -r * 0.65, r * 0.42, '#7CE0D3');
    /* 乖巧两粒琥珀小眼（睡觉时眯成弯线） */
    if (opts.sleep) {
      ln(-r * 0.42, -r * 0.05, -r * 0.14, -r * 0.05, '#172836', 1.5);
      ln(r * 0.14, -r * 0.05, r * 0.42, -r * 0.05, '#172836', 1.5);
    } else {
      disk(-r * 0.3, -r * 0.08, r * 0.2, '#FFE082');
      disk(r * 0.3, -r * 0.08, r * 0.2, '#FFE082');
    }
  });
}

/* 小憩睡着时冒出的柔和 z z Z */
function drawSleepZ(x, y, t, ph = 0) {
  const u = ((t + ph) % 2.4) / 2.4;
  ['z', 'z', 'Z'].forEach((ch, idx) => {
    const ku = clamp((u - idx * 0.18) / 0.65);
    if (ku <= 0 || ku >= 1) return;
    fade(Math.sin(ku * PI) * 0.85, () => {
      word(ch, x + idx * 6 + ku * 5, y - idx * 7 - ku * 12, 8.5 + idx * 2, '#6A5B46', { family: sans, weight: 600 });
    });
  });
}

/* ---------------- 分场绘制 ---------------- */
/* 序 · 一日四网（0s – 28s） */
function paintScene0(t) {
  drawArabianSky(305, t, 0);
  drawCrescentMoon(292, 82, 21, 0);
  /* 远岸砂岩拱廊剪影 */
  poly([[0, 305], [0, 272], [28, 272], [38, 254], [52, 272], [96, 272], [112, 305]], '#162947');
  rrect(16, 280, 12, 16, 5, 'rgba(255,216,128,0.45)');
  drawDatePalm(38, 308, 92, Math.sin(t * 1.1) * 0.35, true);

  drawTurquoiseSea(302, 438, t, 0);
  /* 右侧砂岩石栈台与鱼篓 */
  rrect(256, 412, 108, 38, 6, '#9B7848', '#6B4F2B', 1.4);
  drawCreel(332, 414, 1.05);

  /* 计数小牌：今日第几网 */
  const castNo = t < 7.2 ? 1 : t < 12.8 ? 1 : t < 15.7 ? 2 : t < 18.8 ? 3 : 4;
  fade(0.86, () => {
    rrect(14, 14, 78, 22, 11, 'rgba(12,24,46,0.68)', 'rgba(232,192,99,0.55)', 1);
    word('今日第 ' + castNo + ' 网', 53, 25.5, 10.5, '#F9E3A6', { family: sans });
  });

  /* 弯月小舢板（序场前半 FetchMo 蹲在船头盯鱼，第四网跳上岸一起拔河） */
  const skiffX = 96 + Math.sin(t * 1.4) * 4;
  const skiffY = 362 + Math.cos(t * 1.7) * 2.5;
  drawSkiff(skiffX, skiffY, Math.sin(t * 1.5) * 0.04);

  if (t < 18.8) {
    /* 前三网：Clawd 抻长涉水高跷腿站在浪花里，三颗小脸蛋拴在网边当圆浮漂 */
    const haul1 = t >= 7.2 && t < 12.8;
    const haul2 = t >= 12.8 && t < 15.7;
    const haul3 = t >= 15.7 && t < 18.8;
    const pulling = (t > 7.4 && t < 10.4) || (t > 13.0 && t < 14.3) || (t > 15.9 && t < 17.1);

    /* 麻绳渔网弧线 */
    const netDip = (haul1 && t < 10.3) ? ease(7.3, 9.5, t) * 26 : 0;
    g.strokeStyle = 'rgba(242,224,178,0.75)';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(192, 362);
    g.quadraticCurveTo(164, 396 + netDip, 118, 388 + netDip * 0.5);
    g.stroke();

    /* 三颗浮漂小脸蛋（第一网被重物拽成长水滴！） */
    const floatPositions = [['pink', 132, 386], ['violet', 158, 392], ['black', 184, 388]];
    floatPositions.forEach(([k, fx, fy], idx) => {
      const bob = Math.sin(t * 3.1 + idx * 1.3) * 2.5;
      if (haul1 && t < 10.4) {
        const stretch = 1.0 + ease(7.4, 9.2, t) * 0.72;
        drawFace(k, fx, fy + bob + ease(7.4, 9.2, t) * 14, 11.5, t, {
          shape: 'teardrop', dropStretch: stretch, halo: k === 'black', shadow: false
        });
      } else {
        drawFace(k, fx, fy + bob, 11.5, t, {
          halo: k === 'black', shadow: false,
          kelpWig: k === 'violet' && t >= 13.8
        });
      }
    });

    /* 前三网捞上岸的杂物 */
    if (t >= 10.3) {
      /* 第一网：塞满海泥的破陶瓮 */
      pose(114, 468, 1, 1, -0.35, () => {
        ellipse(0, 0, 20, 14, '#9C5B3C');
        poly([[8, -12], [18, -6], [14, 8], [6, 4]], '#6B3D28');
        ellipse(14, 2, 8, 5, '#4A5D5E');
      });
    }
    if (haul2 && t >= 13.8 || haul3) {
      /* 第二网：缠满海草的破木船舵 */
      pose(168, 474, 1, 1, 0.22, () => {
        ring(0, 0, 14, '#6E4B2A', 3.2);
        ln(-18, 0, 18, 0, '#6E4B2A', 2.4);
        ln(0, -18, 0, 18, '#6E4B2A', 2.4);
        ellipse(-4, -6, 12, 5, '#2E8B6E', -0.3);
      });
    }
    if (haul3 && t >= 16.6) {
      /* 第三网：空海螺与漏水旧靴 */
      poly([[208, 476], [222, 470], [218, 482]], '#F2DEC1', '#9C8265', 1);
      rrect(228, 464, 10, 14, 2, '#5C4433');
      rrect(228, 474, 16, 6, 2, '#5C4433');
    }

    /* Clawd 抻高四腿站在海浪里 */
    drawClawd(214, 418, 0.25, t, {
      legExt: 58, turban: true, sticker: true,
      leftLift: pulling ? 18 : 4, rightLift: pulling ? 14 : 0,
      tilt: pulling ? 0.08 : 0
    });
    /* FetchMo 在船头盯水面；第一网破瓮出来后呆住 */
    drawMomoyu('cat', skiffX + 18, skiffY - 3, 2.5, t, {
      tail: pulling ? 'up' : 'twitch',
      eye: (haul1 && t >= 10.4) ? 'dot' : pulling ? 'effort' : 'plain',
      sticker: true, shadow: false
    });
    /* StashYu 守在栈台鱼篓旁，第三网空篓垂下尾巴 */
    drawMomoyu('fox', 292, 413, 2.6, t, {
      tail: haul3 ? 'rest' : pulling ? 'tip' : 'wag',
      eye: pulling ? 'effort' : haul3 ? 'glance' : 'plain',
      flip: true, sticker: true
    });
  } else {
    /* 第四网（18.8s – 28s）：星光最深处挂住黄铜胆瓶，六只岸上合力拔河！ */
    const pullP = clamp((t - 20.2) / 3.8);
    const landed = t >= 24.2;

    if (!landed) {
      /* 海底微光与紧绷渔网绳 */
      const glintX = mix(92, 148, pullP), glintY = mix(398, 430, pullP);
      disk(glintX, glintY, 22, glow(glintX, glintY, 2, 22, 'rgba(244,207,114,0.65)', 'rgba(244,207,114,0)'));
      ln(glintX, glintY, 228, 462, '#F7E8C2', 2.2);

      /* 六只排成拔河长队：FetchMo 身子拉长成 28 格拔河猫！ */
      const stretch = Math.round(arch(20.2, 24.1, t) * 9);
      drawClawd(190 + pullP * 10, 474, 0.25, t, {
        turban: true, leftLift: 16, rightLift: 16, tilt: 0.14, step: true
      });
      drawMomoyu('cat', 252 + pullP * 8, 478, 2.5, t, {
        stretchCols: stretch, eye: 'effort', tail: 'straight', sticker: true
      });
      drawMomoyu('fox', 316, 480, 2.5, t, {
        eye: 'effort', tail: 'out', flip: true, sticker: true
      });
      /* 三颗小脸蛋在绳边压扁发力 */
      drawFace('pink', 142 + pullP * 8, 474, 12.5, t, { sx: 1.24, sy: 0.78 });
      drawFace('violet', 118 + pullP * 8, 477, 12.5, t, { sx: 1.24, sy: 0.78 });
      drawFace('black', 94 + pullP * 8, 480, 12.5, t, { sx: 1.24, sy: 0.78, halo: true });
    } else {
      /* 24.2s – 28s：黄铜胆瓶破水飞出，稳稳落在沙滩正中，六只围拢细看 */
      const arcK = clamp((t - 24.2) / 1.1);
      const bx = mix(126, 180, ease(0, 1, arcK));
      const by = mix(424, 486, ease(0, 1, arcK)) - Math.sin(arcK * PI) * 52;
      if (arcK < 0.95) {
        /* 破水水花 */
        for (let sp = -2; sp <= 2; sp++) {
          disk(126 + sp * 12 * arcK, 424 - Math.sin(arcK * PI) * 26, 3.5 * (1 - arcK), '#E6FAF8');
        }
      }
      drawBrassBottle(bx, by, 1.08, arcK < 1 ? (1 - arcK) * -0.8 : 0.12, {
        sealed: true, sealGlow: arcK >= 1
      });
      const lean = ease(25.3, 27.2, t);
      drawClawd(mix(210, 128, lean), 486, 0.25, t, { turban: true, tilt: lean * 0.08 });
      drawMomoyu('cat', mix(260, 232, lean), 490, 2.5, t, { tail: 'twitch', eye: 'glance', sticker: true });
      drawMomoyu('fox', mix(314, 286, lean), 490, 2.5, t, { tail: 'tip', flip: true, sticker: true });
      drawFace('pink', 76 + lean * 12, 492, 12, t);
      drawFace('violet', 52 + lean * 10, 498, 12, t, { kelpWig: false });
      drawFace('black', 202 + lean * 4, 504, 12, t, { halo: true });
    }
  }
}

/* 一 · 一千八百年（28s – 56s） */
function paintScene1(t) {
  drawArabianSky(330, t, 0);
  drawCrescentMoon(68, 86, 20, 0);
  drawDatePalm(322, 345, 98, Math.sin(t * 1.4 + (t > 36 ? 4 : 0)) * (t > 36 && t < 43 ? 1.1 : 0.3), true);
  drawTurquoiseSea(328, 432, t, 0);

  const bx = 180, by = 488;
  const uncorked = t >= 34.2;

  /* 撬开铅封后的青烟喷薄与参天巨魔 */
  if (uncorked) {
    if (t < 36.0) {
      /* 起初只飘出一缕细细青紫烟丝 */
      const wispH = ease(34.2, 36.0, t) * 76;
      g.strokeStyle = '#6ED6CF';
      g.lineWidth = 3.2;
      g.beginPath();
      g.moveTo(bx, by - 68);
      g.bezierCurveTo(bx - 16, by - 68 - wispH * 0.4, bx + 18, by - 68 - wispH * 0.75, bx - 4, by - 68 - wispH);
      g.stroke();
    } else {
      const emerge = ease(36.0, 40.2, t);
      const mood = (t >= 49.5 && t < 52.8) ? 'cramped' : t >= 52.8 ? 'rage' : 'proud';
      drawSmokeJinni(bx, by - 66, emerge, t, mood);

      /* 四百年憋屈心事圆窗（43.0s – 55.8s） */
      if (t >= 43.0) {
        const spots = [[94, 198, 43.0], [266, 198, 46.2], [94, 282, 49.5], [266, 282, 52.6]];
        spots.forEach(([mx, my, t0], idx) => {
          if (t >= t0) drawCenturyMedallion(mx, my, idx, ease(t0, t0 + 0.6, t), t);
        });
      }
    }
  }

  /* 黄铜瓶与弹飞落地的铅封盖 */
  const pryShake = (t >= 32.0 && t < 34.2) ? Math.sin(t * 36) * 0.06 : 0;
  drawBrassBottle(bx, by, 1.12, pryShake, { sealed: !uncorked, sealGlow: !uncorked });
  if (uncorked) {
    const capT = clamp((t - 34.2) / 0.85);
    const capX = mix(bx, 246, capT);
    const capY = mix(by - 76, 496, capT) - Math.sin(capT * PI) * 44;
    drawLeadCap(capX, capY, 1.12, capT * 2.8, false);
  }

  /* 六只反应：敲瓶 → 贴耳听 → Clawd 双钳撬盖 → 狂风把小脸蛋吹成薄圆饼再弹回！ */
  const gustFlat = (t >= 37.8 && t < 41.6) ? arch(37.6, 41.8, t) : 0;
  const bounceBack = (t >= 41.6 && t < 42.6) ? Math.sin((t - 41.6) * PI * 3) * 0.22 : 0;
  const shakeGround = (t >= 53.2 && t < 54.6) ? Math.abs(Math.sin((t - 53.2) * 22)) * 5 : 0;

  if (!uncorked) {
    const tapReach = (t >= 28.5 && t < 30.0) ? Math.sin((t - 28.5) * PI * 4) * 6 : 0;
    const listenLean = (t >= 30.0 && t < 31.6) ? ease(30.0, 30.6, t) * (1 - ease(31.2, 31.6, t)) : 0;
    const prying = t >= 31.8;

    drawClawd(prying ? 144 : 118, 488, 0.26, t, {
      turban: true, sticker: true,
      rightLift: prying ? 22 : 0, leftLift: prying ? 16 : 0,
      tilt: prying ? -0.14 : 0
    });
    drawMomoyu('cat', 232 - tapReach, 492, 2.6, t, {
      tail: 'twitch', eye: prying ? 'glance' : 'plain', sticker: true
    });
    drawMomoyu('fox', 290 - listenLean * 74, 492, 2.6, t, {
      tail: 'tip', eye: listenLean > 0.3 ? 'glance' : 'plain',
      tilt: listenLean * -0.18, flip: true, sticker: true
    });
    drawFace('pink', 68, 498, 12.5, t);
    drawFace('violet', 42, 506, 12.5, t);
    drawFace('black', 92, 508, 12.5, t, { halo: true });
  } else {
    /* 开封后狂风吹歪头巾、三颗小脸蛋吹成薄圆饼、FetchMo 炸毛竖尾躲到狐狸身后 */
    drawClawd(114, 492 - shakeGround, 0.25, t, {
      turban: true, turbanSkew: t >= 37.5 ? 1.1 : 0,
      leftLift: t >= 37.5 ? 16 : 6, rightLift: t >= 37.5 ? 16 : 6,
      sticker: true
    });
    drawMomoyu('fox', 268, 494 - shakeGround, 2.6, t, {
      tail: t >= 37.5 ? 'out' : 'base', eye: 'dot', flip: true, sticker: true
    });
    drawMomoyu('cat', t >= 37.2 ? 314 : 236, 496 - shakeGround, 2.5, t, {
      tail: 'up', eye: 'dot', sticker: true
    });

    const sx = 1 + gustFlat * 0.72 - bounceBack;
    const sy = Math.max(0.26, 1 - gustFlat * 0.72 + bounceBack);
    drawFace('pink', 64, 502 - shakeGround, 13, t, { sx, sy });
    drawFace('violet', 36, 510 - shakeGround, 13, t, { sx, sy });
    drawFace('black', 90, 512 - shakeGround, 13, t, { sx, sy, halo: true });
  }
}

/* 二 · 塞不进去吧（56s – 88s） */
function paintScene2(t) {
  drawArabianSky(336, t, 0);
  drawCrescentMoon(62, 80, 19, 0);
  drawTurquoiseSea(334, 434, t, 0);

  const bx = 180, by = 492;
  const swirlingIn = t >= 81.8;

  /* 巨魔在半空被激将 → 81.8s 化作青紫旋风漏斗钻进铜瓶 */
  if (!swirlingIn) {
    const provoked = t >= 78.2;
    drawSmokeJinni(bx, by - 66, 1, t, provoked ? 'provoked' : 'proud');
  } else if (t < 86.6) {
    const suckP = ease(81.8, 86.5, t);
    drawSmokeVortex(bx, by - 66, suckP, t);
  }

  /* 56s – 62.2s：Clawd 扶正小头巾，双钳向两边拉宽比划「山那么大怎么塞进窄瓶口」 */
  if (t < 62.2) {
    drawBrassBottle(bx, by, 1.15, 0, { sealed: false });
    drawLeadCap(248, 498, 1.12, 2.8, false);
    const wide = t >= 59.0 ? ease(59.0, 60.4, t) * 28 : 0;
    const headTilt = Math.sin(t * 3.5) * 0.08;
    drawClawd(110, 492, 0.26, t, {
      turban: true, clawSpread: wide, leftLift: wide * 0.4, rightLift: wide * 0.4,
      tilt: headTilt, sticker: true
    });
    drawMomoyu('fox', 268, 494, 2.6, t, { tail: 'tip', flip: true, sticker: true });
    drawMomoyu('cat', 316, 496, 2.5, t, { tail: 'twitch', sticker: true });
    drawFace('pink', 58, 502, 12.5, t, { tilt: headTilt });
    drawFace('violet', 34, 510, 12.5, t, { tilt: -headTilt });
    drawFace('black', 84, 512, 12.5, t, { tilt: headTilt, halo: true });
  } else if (t < 69.0) {
    /* 62.2s – 69.0s：小粉硬往窄瓶口挤，卡成沙漏果冻，66.6s 啵地弹飞撞翻小紫小黑！ */
    drawBrassBottle(bx, by, 1.18, (t > 63.2 && t < 66.6) ? Math.sin(t * 28) * 0.04 : 0, { sealed: false });
    drawLeadCap(248, 498, 1.12, 2.8, false);

    if (t < 66.6) {
      const sq = ease(62.6, 64.5, t);
      drawFace('pink', bx, by - 82 + sq * 5, 14.5, t, {
        shape: 'hourglass', pinch: mix(0.75, 0.34, sq), shadow: false
      });
      const pushX = ease(65.2, 66.4, t) * 22;
      drawFace('violet', 124 + pushX, 468, 12.5, t, { sx: 1.15, sy: 0.88 });
      drawFace('black', 96 + pushX, 474, 12.5, t, { sx: 1.15, sy: 0.88, halo: true });
    } else {
      /* 软木塞般弹飞！ */
      const popK = clamp((t - 66.6) / 1.4);
      const px = mix(bx, 56, popK);
      const py = mix(by - 80, 498, popK) - Math.sin(popK * PI) * 76;
      drawFace('pink', px, py, 13.5, t, { tilt: -popK * 5 });
      drawFace('violet', mix(146, 86, popK), 498, 12.5, t, { sx: 1.25, sy: 0.78, tilt: -popK * 2.5 });
      drawFace('black', mix(118, 114, popK), 506, 12.5, t, { halo: true, tilt: -popK * 1.8 });
    }
    drawClawd(286, 492, 0.25, t, { turban: true, sticker: true });
    drawMomoyu('fox', 238, 496, 2.5, t, { tail: 'wag', flip: true, sticker: true });
    drawMomoyu('cat', 330, 496, 2.4, t, { tail: 'up', sticker: true });
  } else if (t < 75.5) {
    /* 69.0s – 75.5s：FetchMo 化成液体细条猫倒钻进铜瓶口，露出两条后爪乱蹬，被狐狸拽出 */
    const pulled = t >= 73.6;
    drawBrassBottle(bx, by, 1.18, !pulled ? Math.sin(t * 24) * 0.05 : 0, { sealed: false });
    drawLeadCap(248, 498, 1.12, 2.8, false);

    if (!pulled) {
      drawLiquidCatInBottle(bx, by - 78, 2.6, t);
      const reach = ease(72.0, 73.5, t);
      drawMomoyu('fox', mix(264, 224, reach), 494, 2.6, t, {
        tail: 'out', eye: reach > 0.4 ? 'effort' : 'plain', flip: true, sticker: true
      });
    } else {
      const outK = clamp((t - 73.6) / 1.1);
      drawMomoyu('cat', mix(bx + 12, 232, outK), mix(by - 52, 494, outK) - Math.sin(outK * PI) * 26, 2.5, t, {
        tail: 'up', eye: 'dot', tilt: (1 - outK) * 0.8, sticker: true
      });
      drawMomoyu('fox', 284, 494, 2.6, t, { tail: 'wag', eye: 'smile', flip: true, sticker: true });
    }
    drawClawd(106, 492, 0.25, t, { turban: true, leftLift: 10, sticker: true });
    drawFace('pink', 48, 502, 12.5, t);
    drawFace('violet', 74, 508, 12.5, t);
    drawFace('black', 138, 508, 12.5, t, { halo: true });
  } else {
    /* 75.5s – 88.0s：StashYu 拿白尾巴尖比瓶口 → 六只排成一排齐晃脑袋激将 → 烟缩回瓶底露黄眼 */
    const peek = t >= 86.0;
    drawBrassBottle(bx, by, 1.18, 0, { sealed: false, peekingEyes: peek });
    drawLeadCap(256, 498, 1.12, 2.8, false);

    const wagHead = (t >= 78.4 && t < 82.2) ? Math.sin(t * 9.5) * 0.14 : 0;
    const foxTest = t < 78.4 ? ease(75.6, 76.8, t) * (1 - ease(77.6, 78.3, t)) : 0;

    /* 三颗小脸蛋叠罗汉鼓圆摇头 */
    drawFace('black', 66, 504, 13.5, t, { halo: true, tilt: wagHead });
    drawFace('violet', 66 + wagHead * 14, 478, 12.8, t, { tilt: -wagHead, shadow: false });
    drawFace('pink', 66 - wagHead * 14, 454, 12.2, t, { tilt: wagHead, shadow: false });

    drawClawd(124, 494, 0.25, t, {
      turban: true, tilt: wagHead, leftLift: wagHead > 0 ? 10 : 0, rightLift: wagHead < 0 ? 10 : 0, sticker: true
    });
    drawMomoyu('fox', mix(236, 212, foxTest), mix(494, 446, foxTest), 2.6, t, {
      tail: foxTest > 0.3 ? 'tip' : 'wag',
      eye: peek ? 'smile' : 'glance', tilt: wagHead, flip: !foxTest, sticker: true
    });
    drawMomoyu('cat', 302, 496, 2.5, t, {
      tail: peek ? 'up' : 'twitch', eye: peek ? 'smile' : 'plain', tilt: -wagHead, sticker: true
    });
  }
}

/* 三 · 六角星印（88s – 116s） */
function paintScene3(t) {

  drawTurquoiseSea(334, 434, t, 0);

  const bx = 180;
  const sealed = t >= 92.0 && t < 108.6;
  const reopened = t >= 108.6;
  const hopBottle = (t >= 95.6 && t < 98.4) ? Math.abs(Math.sin((t - 95.6) * PI * 3.2)) * 16 : 0;
  const by = 492 - hopBottle;

  if (t < 95.5) {
    /* 88.0s – 95.5s：小粉小紫叠成双层弹簧垫，把小黑高高弹起扣死六角星铅封！ */
    drawBrassBottle(bx, by, 1.18, 0, {
      sealed: t >= 92.0, sealGlow: t >= 92.0, peekingEyes: t < 91.9
    });

    const trampSquash = (t >= 89.2 && t < 90.4) ? arch(89.2, 90.4, t) * 0.42 : 0;
    drawFace('violet', 268, 504 + trampSquash * 6, 15, t, { sx: 1.48 + trampSquash, sy: 0.52 - trampSquash * 0.3 });
    drawFace('pink', 268, 491 + trampSquash * 9, 14, t, { sx: 1.42 + trampSquash, sy: 0.52 - trampSquash * 0.3, shadow: false });

    if (t < 89.8) {
      /* 小黑抱起地上的铅盖跳上双层果冻垫 */
      const prepK = ease(88.0, 89.7, t);
      const kx = mix(314, 268, prepK), ky = mix(498, 474 + trampSquash * 10, prepK);
      drawFace('black', kx, ky, 13, t, { halo: true, shadow: false });
      drawLeadCap(kx - 4, ky - 14, 1.12, -0.2, false);
    } else if (t < 92.0) {
      /* 高空月光抛物线扣向瓶口！ */
      const flyK = clamp((t - 89.8) / 2.2);
      const kx = mix(268, bx, flyK);
      const ky = mix(474, by - 96, flyK) - Math.sin(flyK * PI) * 118;
      drawFace('black', kx, ky, 13, t, { halo: true, shadow: false, tilt: -flyK * 3.2 });
      drawLeadCap(kx, ky + 14, 1.15, (1 - flyK) * 1.4, flyK > 0.85);
    } else {
      /* 92.0s 扣死！Clawd 跳上瓶顶四脚踩实，StashYu 大红尾巴绕瓶颈上锁！ */
      const lockIn = ease(92.0, 92.9, t);
      /* 扣盖金星光环 */
      if (t < 93.4) {
        const ringR = (t - 92.0) * 42;
        fade(1 - (t - 92.0) / 1.4, () => ring(bx, by - 82, ringR, '#FFE082', 2.4));
      }
      drawFoxTailBottleLock(mix(102, 118, lockIn), 494, bx, by - 66, 2.5, t);
      drawClawd(bx, mix(440, by - 85, lockIn), 0.22, t, {
        turban: true, leftLift: 12, rightLift: 12, shadow: false, sticker: true
      });
      drawFace('black', 232, 502, 13, t, { halo: true });
      drawMomoyu('cat', 62, 498, 2.5, t, { tail: 'up', eye: 'smile', sticker: true });
    }
    if (t < 92.0) {
      drawClawd(106, 494, 0.25, t, { turban: true, rightLift: 14, sticker: true });
      drawMomoyu('fox', 52, 496, 2.5, t, { tail: 'out', sticker: true });
      drawMomoyu('cat', 142, 502, 2.4, t, { tail: 'up', sticker: true });
    }
  } else if (t < 106.0) {
    /* 95.5s – 106.0s：铜瓶蹦跳漏不出烟 → 瓶肚透视窗里小烟团求饶画四色湖 → Clawd 敲三下约法三章 */
    drawBrassBottle(bx, by, 1.38, hopBottle > 0 ? Math.sin(t * 26) * 0.06 : 0, {
      sealed: true, sealGlow: true
    });

    /* 铜瓶肚透视暖窗：茶杯大的小烟团在瓶里团团转 */
    if (t >= 98.5) {
      fade(ease(98.5, 99.3, t), () => {
        rrect(bx - 21, by - 58, 42, 44, 14, 'rgba(14,24,44,0.88)', '#F2CB6D', 1.4);
        const nod = t >= 104.2 ? Math.sin(t * 18) * 3 : 0;
        drawSmokeWisp(bx, by - 28 + nod, 8.5, t);
        /* 瓶里冒出迷你四山与四色鱼小图腾 */
        poly([[bx - 15, by - 42], [bx - 9, by - 50], [bx - 3, by - 42]], '#356E82');
        poly([[bx + 3, by - 42], [bx + 9, by - 50], [bx + 15, by - 42]], '#356E82');
        ellipse(bx, by - 42, 13, 3.2, '#4CC9F0');
        disk(bx - 6, by - 42, 1.4, '#D63864');
        disk(bx - 2, by - 42, 1.4, '#FFFBF0');
        disk(bx + 2, by - 42, 1.4, '#3FA7F5');
        disk(bx + 6, by - 42, 1.4, '#F5C242');
      });
    }

    /* Clawd 站在瓶左敲三下瓶壁（103.0s、103.6s、104.2s），浮出三条金章规矩 */
    const tapMoment = [103.0, 103.6, 104.2].some(ts => Math.abs(t - ts) < 0.14);
    drawClawd(104, 494, 0.26, t, {
      turban: true, rightLift: tapMoment ? 20 : 6, sticker: true
    });
    [103.0, 103.6, 104.2].forEach((ts, idx) => {
      if (t >= ts) {
        const badgeY = 392 - idx * 24;
        const labels = ['一 · 只许拳头大', '二 · 不许起狂风', '三 · 带路看鱼湖'];
        fade(ease(ts, ts + 0.35, t), () => {
          rrect(26, badgeY - 9, 98, 18, 9, 'rgba(14,28,52,0.82)', '#E8C063', 1);
          word(labels[idx], 75, badgeY + 0.5, 9.5, '#FFF0B8', { family: sans });
        });
      }
    });

    drawMomoyu('fox', 258, 494, 2.6, t, { tail: 'tip', eye: 'glance', flip: true, sticker: true });
    drawMomoyu('cat', 312, 496, 2.5, t, { tail: 'twitch', sticker: true });
    drawFace('pink', 44, 504, 12.5, t);
    drawFace('violet', 70, 510, 12.5, t);
    drawFace('black', 222, 506, 12.5, t, { halo: true });
  } else {
    /* 106.0s – 116.0s：小烟团连点十下头 → 108.6s 掀开铅盖 → 拳头大夜光小烟团鞠三个躬领路出发！ */
    drawBrassBottle(bx, 492, 1.22, 0, { sealed: !reopened, sealGlow: !reopened });
    if (!reopened) {
      rrect(bx - 18, 442, 36, 36, 12, 'rgba(14,24,44,0.88)', '#F2CB6D', 1.3);
      drawSmokeWisp(bx, 462 + Math.sin(t * 24) * 3.5, 8, t);
    } else {
      drawLeadCap(142, 498, 1.15, -0.25, false);
      const march = ease(112.8, 115.8, t);
      const wispX = mix(bx, 306, march);
      const wispY = mix(402, 376, march) - arch(108.6, 110.0, t) * 18;
      const bowAmt = (t >= 109.8 && t < 112.6) ? Math.abs(Math.sin((t - 109.8) * PI * 3 / 2.8)) : 0;
      drawSmokeWisp(wispX, wispY, 13.5, t, { bow: bowAmt });
    }

    const follow = reopened ? ease(113.0, 115.8, t) * 44 : 0;
    const hopJoy = (t >= 111.5) ? Math.abs(Math.sin(t * 8)) * 6 : 0;
    drawClawd(106 + follow, 494 - hopJoy * 0.6, 0.25, t, {
      turban: true, step: follow > 2, leftLift: reopened ? 12 : 0, rightLift: reopened ? 12 : 0, sticker: true
    });
    drawMomoyu('fox', 238 + follow * 0.8, 494, 2.5, t, {
      tail: 'wag', eye: reopened ? 'smile' : 'plain', hop: follow > 2, sticker: true
    });
    drawMomoyu('cat', 286 + follow * 0.7, 496, 2.5, t, {
      tail: 'up', eye: 'smile', hop: follow > 2, sticker: true
    });
    drawFace('pink', 38 + follow * 1.1, 502 - hopJoy, 12.2, t);
    drawFace('violet', 64 + follow * 1.1, 508 - hopJoy * 0.8, 12.2, t);
    drawFace('black', 148 + follow, 506 - hopJoy * 0.9, 12.5, t, { halo: true });
  }
}

/* 四色发光鱼绘制（红用宝石玫红 #D63864，避开 StashYu 专属 #E2552B） */
function drawMagicFish(x, y, s, rot, colorHex, glowHex) {
  pose(x, y, s, s, rot, () => {
    disk(0, 0, 16, glow(0, 0, 2, 16, glowHex, 'rgba(255,255,255,0)'));
    poly([[-9, 0], [-17, -6.5], [-14, 0], [-17, 6.5]], colorHex);
    ellipse(0, 0, 10.5, 5.2, colorHex);
    poly([[-1, -4.5], [4, -9], [5, -4]], colorHex);
    disk(5.8, -1.2, 1.3, '#142234');
  });
}

/* 四 · 四山琉璃湖（116s – 150s） */
function paintScene4(t) {
  if (t < 125.0) {
    /* 116.0s – 125.0s：翻越四座月光沙丘！Clawd 四腿收进壳底变成滑沙板，驮着 FetchMo 冲坡！ */
    drawArabianSky(460, t, 0.18);
    drawCrescentMoon(296, 74, 19, 0.15);

    /* 远处四座靛青金边沙丘 + 前景大滑沙斜坡 */
    poly([[0, 380], [64, 248], [156, 380]], '#1C3558', '#D9B26A', 1.2);
    poly([[92, 415], [188, 238], [292, 415]], '#234268', '#E4BE74', 1.2);
    poly([[198, 460], [308, 256], [360, 326], [360, 460]], '#1B3354', '#D9B26A', 1.2);

    /* 前景金色大沙坡（左上高，右下低） */
    g.beginPath();
    g.moveTo(0, 276);
    g.quadraticCurveTo(176, 368, 360, 456);
    g.lineTo(360, H);
    g.lineTo(0, H);
    g.closePath();
    g.fillStyle = grad(0, 280, 0, H, [[0, '#D7AE6A'], [0.55, '#B68B4C'], [1, '#8A6535']]);
    g.fill();
    ln(0, 276, 360, 456, '#F6DDA0', 2);

    const slideK = clamp((t - 116.2) / 8.4);
    const slopeAngle = 0.46;
    const sx = mix(36, 308, slideK);
    const sy = mix(296, 434, slideK);

    /* 夜光小烟团飘在最前头引路 */
    drawSmokeWisp(sx + 42, sy - 26, 12, t);

    /* 扬起的金沙星尘轨迹 */
    for (let sp = 1; sp <= 6; sp++) {
      const kx = sx - sp * 13;
      const ky = sy - sp * 6.4 + Math.sin(t * 14 + sp) * 3;
      disk(kx, ky, 3.2 - sp * 0.38, 'rgba(255,236,178,0.68)');
    }

    /* Clawd 收起四腿（flop: 1）化作滑沙板，FetchMo 蹲在壳背上兜风！ */
    drawClawd(sx, sy, 0.26, t, {
      flop: 1, turban: true, tilt: slopeAngle, sticker: true, shadow: false
    });
    drawMomoyu('cat', sx + 4, sy - 24, 2.4, t, {
      tail: 'up', eye: 'smile', tilt: slopeAngle, sticker: true, shadow: false
    });

    /* StashYu 甩着大尾巴在后面欢快冲沙 */
    drawMomoyu('fox', sx - 58, sy - 29 - Math.abs(Math.sin(t * 9)) * 8, 2.5, t, {
      tail: 'wag', eye: 'smile', tilt: slopeAngle * 0.7, sticker: true, shadow: false
    });

    /* 三颗小脸蛋滚成Q弹圆珠一路弹跳滚下沙坡 */
    [['pink', -26, 14], ['violet', -52, 2], ['black', -80, -11]].forEach(([k, dx, dy], idx) => {
      const bounce = Math.abs(Math.sin(t * 8.5 + idx * 1.1)) * 12;
      drawFace(k, sx + dx, sy + dy - bounce, 12, t, {
        sx: bounce < 3 ? 1.24 : 0.94,
        sy: bounce < 3 ? 0.80 : 1.08,
        tilt: t * 6 + idx, halo: k === 'black', shadow: false
      });
    });
  } else if (t < 138.6) {
    /* 125.0s – 138.6s：四山环抱的琉璃静湖与四色鱼跃虹桥！ */
    const dawn = ease(125.0, 138.4, t) * 0.58;
    drawArabianSky(288, t, dawn);
    drawCrescentMoon(66, 72, 18, dawn);

    /* 环抱静湖的四座丝绒山峦 */
    poly([[0, 294], [48, 206], [118, 294]], '#1D3557', '#C9A96E', 1.1);
    poly([[82, 294], [150, 194], [218, 294]], '#264368', '#DFBA78', 1.1);
    poly([[176, 294], [244, 198], [312, 294]], '#1F3A5E', '#C9A96E', 1.1);
    poly([[264, 294], [326, 212], [360, 272], [360, 294]], '#192E4D', '#DFBA78', 1.1);

    /* 琉璃镜湖 */
    rect(0, 290, W, 168, grad(0, 290, 0, 458, [[0, '#164B68'], [0.48, '#23758A'], [1, '#399CA3']]));
    for (let r = 0; r < 4; r++) {
      ellipse(180, 338 + r * 26, 132 - r * 14, 7, 'rgba(198,246,244,0.16)');
    }
    /* 前景湖畔砂金草岸 */
    g.beginPath();
    g.moveTo(0, 444);
    g.quadraticCurveTo(180, 428, 360, 446);
    g.lineTo(360, H);
    g.lineTo(0, H);
    g.closePath();
    g.fillStyle = '#B8945C';
    g.fill();

    const fishes = [
      { col: '#D63864', glow: 'rgba(214,56,100,0.52)', off: 0 },
      { col: '#FFFBF0', glow: 'rgba(255,251,240,0.55)', off: 0.22 },
      { col: '#3FA7F5', glow: 'rgba(63,167,245,0.55)', off: 0.44 },
      { col: '#F5C242', glow: 'rgba(245,194,66,0.55)', off: 0.66 }
    ];

    const rainbowLeap = t >= 132.4;
    if (!rainbowLeap) {
      /* 四色鱼在琉璃水下悠游成环；蓝鱼游近岸边与 FetchMo 鼻尖相对 */
      fishes.forEach((f, idx) => {
        const ang = t * 1.15 + idx * (TAU / 4);
        const fx = 180 + Math.cos(ang) * 92;
        const fy = 368 + Math.sin(ang) * 28;
        drawMagicFish(fx, fy, 1.05, Math.atan2(Math.cos(ang) * 28, -Math.sin(ang) * 92), f.col, f.glow);
      });
    } else {
      /* 小烟团吹出星光泡泡，四色鱼跃出湖面在头顶搭起发光虹桥！ */
      for (let b = 0; b < 7; b++) {
        const bp = ((t - 132.4) * 0.6 + b * 0.14) % 1;
        const bx2 = 180 + Math.sin(b * 2.1 + t * 2) * 58;
        const by2 = mix(332, 224, bp);
        ring(bx2, by2, 3 + (b % 3) * 1.5, 'rgba(255,244,200,0.68)', 1.1);
      }
      /* 柔和虹桥光带 */
      fade(ease(132.6, 134.0, t) * 0.45, () => {
        g.strokeStyle = '#FFE8A3';
        g.lineWidth = 14;
        g.beginPath();
        g.arc(180, 392, 138, PI * 1.12, PI * 1.88);
        g.stroke();
      });
      fishes.forEach((f, idx) => {
        const u = clamp(((t - 132.4) * 0.34 - f.off * 0.45) % 1.15, 0, 1);
        const ang = mix(PI * 1.10, PI * 1.90, u);
        const fx = 180 + Math.cos(ang) * 136;
        const fy = 394 + Math.sin(ang) * 142;
        drawMagicFish(fx, fy, 1.18, ang + PI / 2, f.col, f.glow);
      });
    }

    drawSmokeWisp(180 + Math.sin(t * 2.2) * 22, 314, 12.5, t);
    /* 六只在湖岸静静看鱼，谁也不撒网 */
    drawClawd(106, 476, 0.25, t, {
      turban: true, leftLift: rainbowLeap ? 14 : 2, rightLift: rainbowLeap ? 14 : 2, sticker: true
    });
    drawMomoyu('fox', 176, 480, 2.5, t, {
      tail: 'wag', eye: rainbowLeap ? 'smile' : 'plain', sticker: true
    });
    drawMomoyu('cat', 246, 456, 2.5, t, {
      tail: 'twitch', eye: rainbowLeap ? 'smile' : 'plain', tilt: -0.08, sticker: true
    });
    drawFace('pink', 42, 482, 12, t);
    drawFace('violet', 302, 480, 12, t);
    drawFace('black', 330, 488, 12, t, { halo: true });
  } else {
    /* 138.6s – 150.0s：玫瑰金晨曦海湾，渔网拴成大吊床，空铜瓶插着带露海百合 */
    drawArabianSky(322, t, 0.92);
    drawTurquoiseSea(320, 434, t, 0.92);

    /* 左右两棵晨风棕榈树 */
    const sway = Math.sin(t * 1.1) * 0.25;
    drawDatePalm(36, 462, 198, sway, false);
    drawDatePalm(326, 462, 198, -sway, false);

    /* 两树之间拴起麻绳渔网大吊床 */
    const swingY = Math.sin(t * 1.5) * 4.5;
    g.save();
    g.beginPath();
    g.moveTo(42, 326);
    g.quadraticCurveTo(180, 412 + swingY, 320, 326);
    g.quadraticCurveTo(180, 372 + swingY, 42, 326);
    g.closePath();
    g.fillStyle = 'rgba(247,232,196,0.72)';
    g.fill();
    g.strokeStyle = '#9C733E';
    g.lineWidth = 1.6;
    g.stroke();
    /* 渔网菱格纹 */
    for (let nx = 74; nx <= 286; nx += 18) {
      const k = (nx - 42) / 278;
      const topArc = 326 + 2 * k * (1 - k) * (46 + swingY);
      const botArc = 326 + 2 * k * (1 - k) * (86 + swingY);
      ln(nx, topArc, nx - 6, botArc, 'rgba(156,115,62,0.45)', 1);
      ln(nx - 6, topArc, nx, botArc, 'rgba(156,115,62,0.45)', 1);
    }
    g.restore();

    /* 六只挤在渔网吊床里香甜酣睡 */
    const hy = 368 + swingY;
    drawClawd(156, hy + 2, 0.23, t, { flop: 0.72, turban: true, sleep: true, shadow: false });
    drawMomoyu('fox', 222, hy + 4, 2.4, t, { tail: 'rest', eye: 'sleep', shadow: false });
    drawMomoyu('cat', 104, hy - 2, 2.3, t, { tail: 'base', eye: 'sleep', shadow: false });
    drawFace('pink', 130, hy - 14, 10.8, t, { sleep: true, shadow: false });
    drawFace('violet', 184, hy - 12, 10.8, t, { sleep: true, shadow: false });
    drawFace('black', 256, hy - 10, 11.2, t, { sleep: true, halo: false, shadow: false });
    drawSleepZ(162, hy - 34, t, 0);
    drawSleepZ(226, hy - 28, t, 1.1);

    /* 前景平坦海石上：敞口黄铜瓶插着一枝带露海百合，小烟团围着瓶颈打盹 */
    ellipse(184, 506, 62, 15, '#9E7D4E');
    ellipse(184, 502, 56, 12, '#C7A571');
    drawBrassBottle(174, 502, 1.12, 0, { sealed: false, seaLily: true });
    /* 倒扣在石上盛着晨露的六角星铅盖 */
    drawLeadCap(216, 500, 1.05, PI, false);
    disk(216, 497, 3.2, '#CFF2FA');
    /* 小烟团软绵绵靠在铜瓶肩旁睡着 */
    drawSmokeWisp(150, 474, 9.5, t, { sleep: true });
  }
}

function getScene(t) {
  for (let i = 0; i < scenes.length; i++) {
    if (t < scenes[i].end || i === scenes.length - 1) return scenes[i];
  }
  return scenes[0];
}
function getCueIdx(t) {
  for (let i = 0; i < cues.length; i++) {
    if (t >= cues[i][0] && t <= cues[i][1]) return i;
  }
  return -1;
}

function wrapSubtitle(str, maxW) {
  if (g.measureText(str).width <= maxW) return [str];
  const puncs = '，。；：？！—';
  const mid = Math.floor(str.length / 2);
  let best = -1;
  for (let i = 2; i < str.length - 2; i++) {
    if (puncs.includes(str[i])) {
      if (best < 0 || Math.abs(i + 1 - mid) < Math.abs(best - mid)) best = i + 1;
    }
  }
  if (best > 0) return [str.slice(0, best), str.slice(best)];
  return [str.slice(0, mid), str.slice(mid)];
}

function drawSubtitle(t) {
  const idx = getCueIdx(t);
  if (idx < 0) return;
  const [t0, t1, , text] = cues[idx];
  const a = Math.min(clamp((t - t0) / 0.22), clamp((t1 - t) / 0.24));
  if (a <= 0.01) return;

  /* 画面底部柔和暗衬，当前已经在逻辑坐标 (360×600) 内，不再重复乘缩放因子 */
  fade(a, () => {
    rect(0, H - 94, W, 94, grad(0, H - 94, 0, H, [[0, 'rgba(8,15,28,0)'], [0.42, 'rgba(8,15,28,0.58)'], [1, 'rgba(8,15,28,0.82)']]));
    g.font = '500 13.8px ' + serif;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const lines = wrapSubtitle(text, 316);
    const baseY = lines.length === 1 ? H - 30 : H - 42;
    lines.forEach((lnStr, i) => {
      const yy = baseY + i * 20;
      g.fillStyle = 'rgba(5,10,20,0.88)';
      g.fillText(lnStr, W / 2 + 0.8, yy + 1.1);
      g.fillStyle = '#FCF4E1';
      g.fillText(lnStr, W / 2, yy);
    });
  });
}

/* 波斯细密画双线金框 */
function drawMiniatureBorder() {
  g.save();
  g.strokeStyle = 'rgba(232,196,110,0.42)';
  g.lineWidth = 1;
  g.strokeRect(5.5, 5.5, W - 11, H - 11);
  g.restore();
}

function setup(pxW) {
  const w = Math.max(360, Math.min(1440, Math.round(pxW || 720)));
  const h = Math.round((w * H) / W);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  scale = w / W;
  g = canvas.getContext('2d', { alpha: false });
}

function render(t, mutedBadge = false) {
  const sec = clamp(Number(t) || 0, 0, TOTAL);
  g.save();
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.lineCap = 'round';
  g.lineJoin = 'round';

  if (sec < 28) paintScene0(sec);
  else if (sec < 56) paintScene1(sec);
  else if (sec < 88) paintScene2(sec);
  else if (sec < 116) paintScene3(sec);
  else paintScene4(sec);

  grain(0.28);
  drawMiniatureBorder();
  drawSubtitle(sec);

  if (mutedBadge) {
    rrect(W - 68, 12, 54, 20, 10, 'rgba(10,18,34,0.66)', 'rgba(232,196,110,0.45)', 0.9);
    word('已静音', W - 41, 22.5, 10, '#F5E6C4', { family: sans });
  }
  g.restore();
}

const SR = 24000;
const sampleCache = new Map();
const ctxBuffers = new WeakMap();

function makeWave(e) {
  const key = e.kind + '|' + e.midi + '|' + e.len.toFixed(2);
  const hit = sampleCache.get(key);
  if (hit) return [key, hit];

  const dur = Math.max(0.08, e.len);
  const n = Math.ceil(dur * SR);
  const out = new Float32Array(n);
  const freq = 440 * Math.pow(2, (e.midi - 69) / 12);
  const r = rand((e.midi * 7919 + e.kind.charCodeAt(0) * 331) >>> 0);
  let ph = 0, brown = 0, lp = 0;

  for (let i = 0; i < n; i++) {
    const t = i / SR;
    const u = t / dur;
    const nz = r() * 2 - 1;
    brown = 0.972 * brown + 0.028 * nz;
    lp = 0.80 * lp + 0.20 * nz;
    let s = 0;

    if (e.kind === 'oud') {
      const atk = Math.min(1, t / 0.0035);
      s = atk * (
        0.54 * Math.sin(TAU * freq * t) * Math.exp(-t / 0.95) +
        0.28 * Math.sin(TAU * freq * 2 * t + 0.3) * Math.exp(-t / 0.52) +
        0.14 * Math.sin(TAU * freq * 3 * t + 0.7) * Math.exp(-t / 0.28) +
        0.06 * Math.sin(TAU * freq * 4 * t) * Math.exp(-t / 0.16)
      ) + 0.09 * lp * Math.exp(-t / 0.012);
    } else if (e.kind === 'ney') {
      const env = ease(0, 0.15, t) * (1 - ease(dur - 0.24, dur, t));
      const vib = 1 + 0.0036 * Math.sin(TAU * 5.0 * t) * ease(0.18, 0.55, t);
      ph += (TAU * freq * vib) / SR;
      s = env * (0.68 * Math.sin(ph) + 0.20 * Math.sin(2 * ph + 0.4) + 0.08 * Math.sin(3 * ph) + 0.07 * (lp - brown));
    } else if (e.kind === 'celesta') {
      const atk = Math.min(1, t / 0.003);
      s = atk * (
        0.62 * Math.sin(TAU * freq * t) * Math.exp(-t / 0.72) +
        0.22 * Math.sin(TAU * freq * 2.756 * t + 0.1) * Math.exp(-t / 0.26) +
        0.08 * Math.sin(TAU * freq * 5.404 * t) * Math.exp(-t / 0.11)
      );
    } else if (e.kind === 'pad') {
      const env = ease(0, 0.85, t) * (1 - ease(dur - 1.0, dur, t));
      s = env * (
        0.54 * Math.sin(TAU * freq * t) +
        0.26 * Math.sin(TAU * freq * 1.0025 * t + 0.7) +
        0.18 * Math.sin(TAU * freq * 2 * t)
      );
    } else if (e.kind === 'dum') {
      const fDrop = freq * (1 + 0.55 * Math.exp(-t / 0.035));
      ph += (TAU * fDrop) / SR;
      s = Math.min(1, t / 0.003) * 0.78 * Math.sin(ph) * Math.exp(-t / 0.14);
    } else if (e.kind === 'tek') {
      s = Math.min(1, t / 0.0015) * (0.45 * Math.sin(TAU * freq * t) * Math.exp(-t / 0.035) + 0.55 * lp * Math.exp(-t / 0.018));
    } else if (e.kind === 'splash') {
      const env = Math.sin(PI * Math.pow(u, 0.7));
      s = env * (0.55 * lp + 0.45 * brown * 1.8) * Math.exp(-t / 0.45);
    } else if (e.kind === 'cork') {
      const fPop = freq * (0.65 + 1.15 * Math.min(1, t / 0.045));
      ph += (TAU * fPop) / SR;
      s = Math.min(1, t / 0.002) * (0.75 * Math.sin(ph) * Math.exp(-t / 0.065) + 0.35 * nz * Math.exp(-t / 0.012));
    } else if (e.kind === 'whoosh') {
      const env = Math.pow(Math.sin(PI * u), 1.3);
      const sweep = 180 + 260 * Math.sin(PI * u);
      ph += (TAU * sweep) / SR;
      s = env * (brown * 2.1 + 0.25 * Math.sin(ph) + 0.25 * (lp - brown));
    } else if (e.kind === 'boing') {
      const glide = freq * (1 + 0.42 * Math.sin(TAU * 5.8 * t) * Math.exp(-t / 0.34));
      ph += (TAU * glide) / SR;
      s = Math.min(1, t / 0.005) * (0.72 * Math.sin(ph) + 0.22 * Math.sin(2 * ph)) * Math.exp(-t / 0.28);
    } else if (e.kind === 'clang') {
      const atk = Math.min(1, t / 0.002);
      s = atk * (
        0.50 * Math.sin(TAU * freq * t) * Math.exp(-t / 0.55) +
        0.32 * Math.sin(TAU * freq * 1.58 * t) * Math.exp(-t / 0.32) +
        0.24 * Math.sin(TAU * freq * 2.41 * t) * Math.exp(-t / 0.18) +
        0.30 * nz * Math.exp(-t / 0.015)
      );
    } else if (e.kind === 'tap') {
      s = Math.min(1, t / 0.002) * (
        0.62 * Math.sin(TAU * freq * t) * Math.exp(-t / 0.09) +
        0.28 * Math.sin(TAU * freq * 2.32 * t) * Math.exp(-t / 0.045)
      );
    } else if (e.kind === 'bubble') {
      const fUp = freq * (0.76 + 0.48 * Math.min(1, t / 0.085));
      ph += (TAU * fUp) / SR;
      s = Math.min(1, t / 0.003) * (0.68 * Math.sin(ph) * Math.exp(-t / 0.34) + 0.24 * Math.sin(2.02 * ph) * Math.exp(-t / 0.16));
    }
    out[i] = s * (1 - ease(dur - 0.015, dur, t));
  }
  sampleCache.set(key, out);
  return [key, out];
}

function playEvent(ac, dest, e, when, offset = 0) {
  if (offset >= e.len - 0.01) return null;
  let map = ctxBuffers.get(ac);
  if (!map) { map = new Map(); ctxBuffers.set(ac, map); }
  const [key, data] = makeWave(e);
  let buf = map.get(key);
  if (!buf) {
    buf = ac.createBuffer(1, data.length, SR);
    buf.getChannelData(0).set(data);
    map.set(key, buf);
  }
  const src = ac.createBufferSource();
  const gain = ac.createGain();
  src.buffer = buf;
  const dur = Math.min(e.len, buf.duration) - offset;
  if (dur <= 0.008) return null;
  gain.gain.setValueAtTime(offset > 0.03 ? 0 : e.vol, when);
  if (offset > 0.03) gain.gain.linearRampToValueAtTime(e.vol, when + Math.min(0.02, dur * 0.2));
  const rel = Math.min(0.16, dur * 0.3);
  gain.gain.setValueAtTime(e.vol, when + dur - rel);
  gain.gain.linearRampToValueAtTime(0, when + dur);
  src.connect(gain);
  if (ac.createStereoPanner) {
    const p = ac.createStereoPanner();
    p.pan.value = clamp(e.pan || 0, -1, 1);
    gain.connect(p);
    p.connect(dest);
  } else {
    gain.connect(dest);
  }
  src.start(when, Math.max(0, offset), dur);
  return src;
}

async function renderAudio() {
  const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new Offline(2, Math.ceil(TOTAL * SR), SR);
  for (const e of events) playEvent(off, off.destination, e, e.t, 0);
  return off.startRendering();
}

/* ---------------- 播放器、唤醒锁与字幕本联动 ---------------- */
const el = id => document.getElementById(id);
const viewer = el('viewer'), stage = el('stage'), entrance = el('entrance'), entranceWord = el('entranceWord');
const toggleBtn = el('toggle'), seekBar = el('seek'), clockOut = el('clock'), volBtn = el('volume'), expBtn = el('expand');

const ICONS = {
  play: '<path d="M6 3.8v16.4L19.2 12z" fill="currentColor"/>',
  pause: '<path d="M6 4.2h4v15.6H6zm8 0h4v15.6h-4z" fill="currentColor"/>',
  replay: '<path d="M4.5 10.2a7.8 7.8 0 1 1 .8 6.4M4.4 4.5v5.8h5.8" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>',
  sound: '<path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.2 8.2q3.6 3.8 0 7.6m2.9-10.6q6.4 6.8 0 13.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  mute: '<path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="m15.8 9 5.2 6m0-6-5.2 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  full: '<path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  shrink: '<path d="M9 3.8v5.2H3.8m11.2-5.2v5.2h5.2m0 6h-5.2v5.2M3.8 15h5.2v5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
};
const svgIcon = name => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
const fmtTime = sec => {
  const s = Math.floor(clamp(sec, 0, TOTAL) + 0.0001);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

let cur = 0, running = false, started = false, soundOn = true, theatre = false;
let ac = null, master = null, bus = null, pumpTimer = 0, raf = 0, wakeLock = null;
let origin = 0, wallStart = 0, audioStart = null, evIdx = 0, gen = 0;
let dragging = false, resumeAfterDrag = false;
let lastBtn = '', lastClock = '', activeCue = -2, activeScene = '';

function acquireWake() {
  try {
    if (!navigator.wakeLock || wakeLock) return;
    navigator.wakeLock.request('screen').then(lk => {
      wakeLock = lk;
      lk.addEventListener('release', () => { if (wakeLock === lk) wakeLock = null; });
      if (!running) releaseWake();
    }).catch(() => {});
  } catch (_) {}
}
function releaseWake() {
  try { if (wakeLock) { const lk = wakeLock; wakeLock = null; lk.release(); } } catch (_) {}
}

const sceneBtns = scenes.map(s => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'reel-btn';
  b.textContent = s.name;
  b.addEventListener('click', () => {
    seek(s.start + 0.02);
    if (!running) play();
    stage.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  });
  el('reels').appendChild(b);
  return { id: s.id, b };
});

const cueBtns = cues.map(c => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'cue';
  const tm = document.createElement('time');
  tm.textContent = fmtTime(c[0]);
  const wrap = document.createElement('span');
  const sm = document.createElement('small');
  sm.textContent = c[2];
  const wd = document.createElement('span');
  wd.className = 'word';
  wd.textContent = c[3];
  wrap.append(sm, wd);
  b.append(tm, wrap);
  b.setAttribute('aria-label', '从 ' + fmtTime(c[0]) + ' 播放：' + c[3]);
  b.addEventListener('click', () => {
    seek(c[0] + 0.05);
    if (!running) play();
    viewer.scrollIntoView({ block: 'start', behavior: 'auto' });
  });
  el('lines').appendChild(b);
  return b;
});

function nowTime() {
  if (!running) return cur;
  if (audioStart !== null && ac && ac.state === 'running') {
    return clamp(origin + (ac.currentTime - audioStart), 0, TOTAL);
  }
  return clamp(origin + (performance.now() - wallStart) / 1000, 0, TOTAL);
}

function stopBus() {
  if (bus) { try { bus.disconnect(); } catch (_) {} bus = null; }
  clearInterval(pumpTimer);
}

function syncMasterGain() {
  if (!master || !ac) return;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(soundOn ? 1 : 0, ac.currentTime, 0.015);
}

function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return Promise.resolve(false);
  try {
    if (!ac) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
      ac = new AC();
      master = ac.createGain();
      master.gain.value = soundOn ? 1 : 0;
      master.connect(ac.destination);
      ac.addEventListener('statechange', () => {
        if (running && (ac.state === 'interrupted' || ac.state === 'suspended')) pause();
      });
    }
    if (ac.state === 'running') return Promise.resolve(true);
    return ac.resume().then(() => ac.state === 'running').catch(() => false);
  } catch (_) {
    return Promise.resolve(false);
  }
}

function startScore(from) {
  stopBus();
  if (!ac || ac.state !== 'running') return;
  bus = ac.createGain();
  bus.connect(master);
  audioStart = ac.currentTime;
  origin = from;
  wallStart = performance.now();
  evIdx = 0;
  while (evIdx < events.length && events[evIdx].t < from) {
    const e = events[evIdx++];
    const off = from - e.t;
    if (off < e.len - 0.02) playEvent(ac, bus, e, ac.currentTime + 0.005, off);
  }
  function pump() {
    if (!running || !bus) return;
    const n = nowTime(), base = ac.currentTime;
    while (evIdx < events.length && events[evIdx].t < n + 0.55) {
      const e = events[evIdx++];
      const dt = e.t - n;
      if (dt + e.len > 0.015) playEvent(ac, bus, e, Math.max(base + 0.003, base + dt), Math.max(0, -dt));
    }
  }
  pump();
  pumpTimer = setInterval(pump, 110);
}

function updateUI(t) {
  const ended = started && t >= TOTAL - 0.02 && !running;
  const st = running ? 'pause' : ended ? 'replay' : 'play';
  if (st !== lastBtn) {
    lastBtn = st;
    toggleBtn.innerHTML = svgIcon(st);
    const lbl = st === 'pause' ? '暂停' : st === 'replay' ? '重播' : '播放';
    toggleBtn.setAttribute('aria-label', lbl);
    toggleBtn.title = lbl;
  }
  const clk = fmtTime(t) + ' / ' + fmtTime(TOTAL);
  if (clk !== lastClock) {
    lastClock = clk;
    clockOut.textContent = clk;
    seekBar.setAttribute('aria-valuetext', clk);
  }
  if (!dragging) seekBar.value = String(t);
  seekBar.style.setProperty('--pos', ((t * 100) / TOTAL).toFixed(2) + '%');

  const ci = started ? getCueIdx(t) : -1;
  if (ci !== activeCue) {
    if (cueBtns[activeCue]) cueBtns[activeCue].removeAttribute('aria-current');
    if (cueBtns[ci]) cueBtns[ci].setAttribute('aria-current', 'true');
    activeCue = ci;
  }
  const scId = started ? getScene(t).id : '';
  if (scId !== activeScene) {
    sceneBtns.forEach(s => {
      if (s.id === scId) s.b.setAttribute('aria-current', 'true');
      else s.b.removeAttribute('aria-current');
    });
    activeScene = scId;
  }

  entrance.hidden = running || (started && t < TOTAL - 0.02);
  entranceWord.textContent = started ? '再看一回' : '放映';
  entrance.setAttribute('aria-label', started ? '重新放映' : '放映短片');
}

function loop() {
  if (!running) return;
  cur = nowTime();
  render(cur, !soundOn);
  if (cur >= TOTAL - 0.01) {
    cur = TOTAL;
    running = false;
    gen++;
    audioStart = null;
    stopBus();
    releaseWake();
    render(TOTAL, !soundOn);
    updateUI(TOTAL);
    return;
  }
  updateUI(cur);
  raf = requestAnimationFrame(loop);
}

function play() {
  if (running) return;
  if (cur >= TOTAL - 0.02) cur = 0;
  started = true;
  running = true;
  origin = cur;
  wallStart = performance.now();
  audioStart = null;
  const myGen = ++gen;
  acquireWake();
  render(cur, !soundOn);
  updateUI(cur);
  unlockAudio().then(ok => {
    if (ok && running && myGen === gen) startScore(nowTime());
  });
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function pause() {
  if (!running) return;
  cur = nowTime();
  running = false;
  gen++;
  audioStart = null;
  cancelAnimationFrame(raf);
  stopBus();
  releaseWake();
  render(cur, !soundOn);
  updateUI(cur);
}

function seek(val) {
  const v = Number(val);
  if (!Number.isFinite(v)) return;
  cur = clamp(v, 0, TOTAL);
  started = true;
  if (running && cur >= TOTAL - 0.01) {
    running = false;
    gen++;
    cancelAnimationFrame(raf);
    stopBus();
    releaseWake();
    audioStart = null;
  } else if (running) {
    origin = cur;
    wallStart = performance.now();
    audioStart = null;
    startScore(cur);
  }
  render(cur, !soundOn);
  updateUI(cur);
}

function togglePlay() { running ? pause() : play(); }

function syncVolUI() {
  volBtn.innerHTML = svgIcon(soundOn ? 'sound' : 'mute');
  volBtn.setAttribute('aria-label', soundOn ? '静音' : '开启声音');
  volBtn.title = soundOn ? '静音' : '开启声音';
  volBtn.setAttribute('aria-pressed', String(!soundOn));
  syncMasterGain();
}

function setTheatre(on) {
  theatre = on;
  document.body.classList.toggle('theatre', on);
  expBtn.innerHTML = svgIcon(on ? 'shrink' : 'full');
  expBtn.setAttribute('aria-label', on ? '退出全屏' : '展开全屏');
  expBtn.title = on ? '退出全屏' : '展开全屏';
  expBtn.setAttribute('aria-pressed', String(on));
  requestAnimationFrame(sizeToScreen);
}

toggleBtn.addEventListener('click', togglePlay);
entrance.addEventListener('click', e => { e.stopPropagation(); play(); });
stage.addEventListener('click', togglePlay);

volBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  syncVolUI();
  if (started && !running) render(cur, !soundOn);
  if (soundOn && running && !bus) {
    unlockAudio().then(ok => { if (ok && running && !bus) startScore(nowTime()); });
  }
});

expBtn.addEventListener('click', () => {
  if (theatre) {
    setTheatre(false);
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } else {
    setTheatre(true);
    if (viewer.requestFullscreen) {
      try { const p = viewer.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
    }
  }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && theatre) setTheatre(false);
});

seekBar.addEventListener('pointerdown', () => {
  resumeAfterDrag = running;
  dragging = true;
  if (running) pause();
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  const again = resumeAfterDrag;
  resumeAfterDrag = false;
  if (again && cur < TOTAL - 0.03) play();
}
seekBar.addEventListener('input', () => seek(seekBar.value));
seekBar.addEventListener('change', () => { seek(seekBar.value); endDrag(); });
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && theatre) { setTheatre(false); return; }
  if (ev.repeat || ['BUTTON', 'INPUT', 'SUMMARY', 'A'].includes(ev.target.tagName)) return;
  if (ev.code === 'Space') { ev.preventDefault(); togglePlay(); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    ev.preventDefault();
    seek(nowTime() + (ev.key === 'ArrowLeft' ? -5 : 5));
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
window.addEventListener('pagehide', pause);

function sizeToScreen() {
  const box = stage.getBoundingClientRect();
  if (!box.width) return;
  const px = Math.round(box.width * Math.min(3, window.devicePixelRatio || 1));
  setup(px);
  if (started) render(nowTime(), !soundOn);
  else poster();
}

syncVolUI();
setTheatre(false);
sizeToScreen();
updateUI(0);

if (window.ResizeObserver) new ResizeObserver(sizeToScreen).observe(stage);
window.addEventListener('resize', sizeToScreen, { passive: true });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { if (!running) sizeToScreen(); });
}

/* 导视频与逐格自检口子（切勿拆除） */
window.FILM = {
  W, H, TOTAL, width: W, height: H, duration: TOTAL, fps: FPS,
  canvas, events, setup, render, poster, renderAudio,
  cues, scenes: scenes.map(s => ({ id: s.id, name: s.name, start: s.start, duration: s.end - s.start })),
  seek, play, pause,
  get time() { return nowTime(); },
  get playing() { return running; },
  state: () => ({ cur: nowTime(), playing: running, soundOn, started })
};
})();
</script>
</body>
</html>
