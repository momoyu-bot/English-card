<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>口袋小手机群聊</title>
<meta name="description" content="装进奶油口袋的小手机，圆圈里蹲着送挂件的小萌物，屏幕里六只正热火朝天地群聊。">
<style>
  :root {
    --bg-cream: #F7E8BA;
    --phone-shell: #DFBFB6;
    --phone-border: #8B7169;
    --screen-blue: #D5EEF3;
    --pocket-cream: #F5E5B8;
    --pocket-line: #D5C597;
    --text-brown: #6E584F;
    --btn-brown: #574A43;
    --bubble-green: #E3F3D3;
    --bubble-green-border: #C3DFB2;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--bg-cream);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: var(--text-brown);
  }

  /* 手机海报容器 */
  .poster-stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    min-height: 820px;
    background-color: var(--bg-cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 36px;
    overflow: hidden;
  }

  /* 四角手绘小烟花 */
  .sparkle-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  /* 顶部小标签 */
  .top-pill {
    position: relative;
    z-index: 2;
    background: #E54D52;
    color: #FFFDF8;
    font-size: 13px;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 999px;
    letter-spacing: 1px;
    box-shadow: 0 2px 0 rgba(110, 88, 79, 0.12);
    margin-bottom: 18px;
  }

  /* 标题与大圆圈挂件区 */
  .hero-header {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    padding-left: 10px;
  }

  .title-block {
    text-align: center;
    transform: rotate(-2deg);
  }

  .title-sub {
    font-size: 26px;
    font-weight: 900;
    color: var(--text-brown);
    letter-spacing: 2px;
    line-height: 1.15;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .title-sub .slash {
    font-size: 22px;
    color: #7E665C;
  }

  .title-main {
    font-size: 42px;
    font-weight: 900;
    color: var(--text-brown);
    letter-spacing: 3px;
    line-height: 1.1;
    margin-top: 2px;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.45);
  }

  /* 右侧大圆圈：头像挂件展示窗 */
  .pendant-showcase {
    position: relative;
    width: 96px;
    height: 96px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .pendant-bubble {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 62%, #FFFFFF 38%, #FAD4E2 82%, #F6B9CE 100%);
    border: 3.5px solid var(--phone-border);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    box-shadow: 0 4px 0 rgba(110, 88, 79, 0.12);
  }

  /* 气泡左下角的小尖尖 */
  .pendant-tail {
    position: absolute;
    bottom: 6px;
    left: -4px;
    width: 18px;
    height: 18px;
    background: #F7C4D6;
    border-left: 3.5px solid var(--phone-border);
    border-bottom: 3.5px solid var(--phone-border);
    transform: rotate(15deg) skewX(-18deg);
    border-bottom-left-radius: 4px;
    z-index: 0;
  }

  .showcase-mascot {
    position: relative;
    z-index: 2;
    width: 78px;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(6px);
    animation: stepBob 1.2s steps(2, end) infinite;
  }

  /* 挂在圆圈右上角的亲子装小挂件 */
  .pendant-accessory {
    position: absolute;
    top: -10px;
    right: -8px;
    width: 48px;
    height: 44px;
    z-index: 5;
    pointer-events: none;
    animation: stepSwing 1.4s steps(2, end) infinite;
  }

  .pendant-tag {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 11px;
    font-weight: 700;
    color: #7D645A;
    background: rgba(255, 252, 240, 0.85);
    padding: 2px 8px;
    border-radius: 99px;
    border: 1.5px solid #C8B496;
    z-index: 6;
  }

  /* 小手机与口袋主舞台 */
  .phone-pocket-wrap {
    position: relative;
    z-index: 2;
    width: 326px;
    height: 410px;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 左上角拴着的肉垫/像素挂件 */
  .phone-charm {
    position: absolute;
    top: -6px;
    left: -14px;
    width: 68px;
    height: 110px;
    z-index: 10;
    cursor: pointer;
    transform-origin: 28px 18px;
    animation: charmStep 1.6s steps(2, end) infinite;
  }

  /* 藕粉小手机外壳 */
  .mini-phone {
    position: relative;
    width: 286px;
    height: 368px;
    background: var(--phone-shell);
    border: 3.5px solid var(--phone-border);
    border-radius: 38px 38px 12px 12px;
    padding: 34px 16px 24px;
    box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.35);
    z-index: 3;
  }

  /* 手机顶部听筒小耳朵装饰 */
  .earpiece {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 38px;
    height: 16px;
    background: #CEACA2;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 7px;
  }

  .earpiece::before,
  .earpiece::after {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #EBE0DA;
  }

  /* 手机右侧按键 */
  .side-btn-top {
    position: absolute;
    right: -8px;
    top: 84px;
    width: 8px;
    height: 42px;
    background: var(--phone-shell);
    border: 3px solid var(--phone-border);
    border-left: none;
    border-radius: 0 6px 6px 0;
  }

  .side-btn-bottom {
    position: absolute;
    right: -8px;
    top: 142px;
    width: 8px;
    height: 42px;
    background: var(--phone-shell);
    border: 3px solid var(--phone-border);
    border-left: none;
    border-radius: 0 6px 6px 0;
  }

  /* 手机冰蓝屏幕 */
  .phone-screen {
    width: 100%;
    height: 100%;
    background: var(--screen-blue);
    border-radius: 22px 22px 6px 6px;
    padding: 12px 12px 28px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* 屏幕状态栏 */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 6px;
    color: #A9CDD6;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .group-title-bar {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: #6B8E98;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 99px;
    padding: 3px 10px;
    margin: 0 auto 8px;
    cursor: pointer;
  }

  /* 群聊消息流 */
  .chat-stream {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    padding: 2px 2px 12px;
    scrollbar-width: none;
  }
  .chat-stream::-webkit-scrollbar {
    display: none;
  }

  .chat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    animation: popStep 0.25s steps(2, end) forwards;
  }

  .chat-row.right {
    flex-direction: row-reverse;
  }

  /* 聊天圆圈头像框 */
  .avatar-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2.5px solid var(--phone-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  /* 聊天气泡 */
  .chat-bubble {
    position: relative;
    max-width: 172px;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    color: #5E4B43;
    background: #FFFDF9;
    border: 2.5px solid #EAE2D3;
    cursor: pointer;
  }

  .chat-row.right .chat-bubble {
    background: var(--bubble-green);
    border-color: var(--bubble-green-border);
  }

  .speaker-name {
    display: block;
    font-size: 10px;
    color: #9A8479;
    margin-bottom: 2px;
    font-weight: 800;
  }

  /* 下半截奶油布袋口袋 */
  .pocket-front {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 318px;
    height: 78px;
    background: var(--pocket-cream);
    border-top: 3.5px solid #B5A47B;
    border-left: 3.5px solid #B5A47B;
    border-right: 3.5px solid #B5A47B;
    border-radius: 14px 14px 4px 4px;
    z-index: 6;
    display: flex;
     flex-direction: column;
    align-items: center;
    padding-top: 14px;
  }

  .pocket-back-rim {
    position: absolute;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    width: 318px;
    height: 22px;
    border: 3.5px solid #B5A47B;
    border-radius: 50%;
    background: #E2D1A0;
    z-index: 2;
  }

  .pocket-stitches {
    width: 88%;
    border-top: 3.5px dashed var(--pocket-line);
    margin-bottom: 10px;
  }

  /* 六只小萌物快速点选栏 */
  .roster-dock {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    z-index: 7;
  }

  .roster-chip {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 99px;
    background: rgba(255, 253, 245, 0.75);
    border: 1.5px solid #C6B489;
    color: #6E584F;
    cursor: pointer;
  }

  .roster-chip.active {
    background: var(--btn-brown);
    color: #FFFDF6;
    border-color: var(--btn-brown);
  }

  /* 底部按钮区 */
  .bottom-actions {
    position: relative;
    z-index: 8;
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .main-cta-btn {
    background: var(--btn-brown);
    color: #FFFDF7;
    border: none;
    border-radius: 999px;
    padding: 15px 38px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(62, 50, 44, 0.22);
  }

  .main-cta-btn:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(62, 50, 44, 0.22);
  }

  .sub-tip {
    font-size: 12px;
    color: #8C756A;
    font-weight: 600;
  }

  /* 严格遵循宪法：动效全用 steps()，不用 ease */
  @keyframes stepBob {
    0% { transform: translateY(6px); }
    50% { transform: translateY(2px); }
    100% { transform: translateY(6px); }
  }

  @keyframes stepSwing {
    0% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
    100% { transform: rotate(-6deg); }
  }

  @keyframes charmStep {
    0% { transform: rotate(-4deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(-4deg); }
  }

  @keyframes popStep {
    0% { transform: translateY(6px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>

<div class="poster-stage">
  <!-- 四角手绘烟花线条 SVG -->
  <svg class="sparkle-bg" viewBox="0 0 420 820" fill="none" xmlns="http://www.w3.org/2000/svg">
    <title>小萌物挂件海报背景装饰</title>
    <desc>四角散落的手绘彩色礼花线条与奶油色星星点缀。</desc>
    <!-- 左上礼花 -->
    <g stroke-width="5" stroke-linecap="round">
      <line x1="18" y1="115" x2="14" y2="152" stroke="#E8664A"/>
      <line x1="28" y1="138" x2="48" y2="122" stroke="#E8664A"/>
      <line x1="28" y1="158" x2="54" y2="154" stroke="#E8664A"/>
      <line x1="26" y1="172" x2="44" y2="188" stroke="#6EC0C8"/>
      <line x1="10" y1="176" x2="22" y2="205" stroke="#6EC0C8"/>
    </g>
    <!-- 右上礼花 -->
    <g stroke-width="5.5" stroke-linecap="round">
      <line x1="365" y1="32" x2="352" y2="66" stroke="#E8664A"/>
      <line x1="374" y1="62" x2="404" y2="45" stroke="#6EC0C8"/>
      <line x1="378" y1="78" x2="412" y2="82" stroke="#E8664A"/>
      <line x1="358" y1="88" x2="394" y2="112" stroke="#E8664A"/>
    </g>
    <!-- 奶油白小火花 -->
    <g stroke="#FDF8DF" stroke-width="4" stroke-linecap="round">
      <line x1="88" y1="92" x2="88" y2="104"/>
      <line x1="74" y1="106" x2="82" y2="110"/>
      <line x1="104" y1="104" x2="96" y2="110"/>
      <line x1="312" y1="78" x2="312" y2="92"/>
      <line x1="294" y1="96" x2="306" y2="96"/>
      <line x1="322" y1="96" x2="334" y2="96"/>
      <line x1="312" y1="104" x2="312" y2="116"/>
    </g>
  </svg>

  <div class="top-pill">小萌物图鉴</div>

  <!-- 顶部大标题 + 右侧圆圈小萌物挂件窗 -->
  <div class="hero-header">
    <div class="title-block">
      <div class="title-sub">
        <span class="slash">\</span>
        <span>小萌物送你</span>
        <span class="slash">/</span>
      </div>
      <div class="title-main">头像挂件</div>
    </div>

    <div class="pendant-showcase" id="pendantShowcase" title="点我换一只小萌物驻守圆圈">
      <div class="pendant-tail"></div>
      <div class="pendant-bubble" id="showcaseBubble">
        <div class="showcase-mascot" id="showcaseMascot"></div>
      </div>
      <div class="pendant-accessory" id="showcaseAccessory"></div>
      <div class="pendant-tag" id="showcaseTag">Clawd·小蟹钳</div>
    </div>
  </div>

  <!-- 口袋小手机区域 -->
  <div class="phone-pocket-wrap">
    <!-- 左上角挂着的肉垫小挂件（点击可互动冒泡） -->
    <svg class="phone-charm" id="phoneCharm" viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">
      <title>手机左上角肉垫挂绳</title>
      <desc>系在藕粉手机左上角的红绳与奶油黄猫爪肉垫挂件。</desc>
      <!-- 红绳 -->
      <path d="M44 18 C24 10, 16 32, 26 52" fill="none" stroke="#E45C3A" stroke-width="6" stroke-linecap="round"/>
      <path d="M44 18 C24 10, 16 32, 26 52" fill="none" stroke="#7A5A50" stroke-width="2" stroke-linecap="round"/>
      <!-- 挂环 -->
      <rect x="21" y="48" width="12" height="7" rx="3" fill="#D5B885" stroke="#7A5A50" stroke-width="2.5"/>

      <path d="M16 64 C8 62, 6 76, 14 82 C10 92, 20 104, 32 100 C44 104, 56 94, 52 82 C60 74, 54 60, 44 62 C38 52, 22 52, 16 64 Z"
            fill="#F8E7A2" stroke="#7D685E" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- 浅金肉垫心 -->
      <ellipse cx="32" cy="84" rx="10" ry="8" fill="#EBD082"/>
      <circle cx="20" cy="70" r="4.5" fill="#EBD082"/>
      <circle cx="32" cy="65" r="4.5" fill="#EBD082"/>
      <circle cx="44" cy="70" r="4.5" fill="#EBD082"/>
    </svg>

    <!-- 藕粉色小手机 -->
    <div class="mini-phone">
      <div class="earpiece"></div>
      <div class="side-btn-top"></div>
      <div class="side-btn-bottom"></div>

      <div class="phone-screen">
        <div class="status-bar">
          <!-- 电池图标 -->
          <svg width="24" height="14" viewBox="0 0 24 14" fill="none">
            <title>电量图标</title>
            <desc>小手机屏幕左上角的浅蓝电池小图标。</desc>
            <rect x="1" y="2" width="18" height="10" rx="3" stroke="#A9CDD6" stroke-width="2.2"/>
            <rect x="3.5" y="4.5" width="11" height="5" rx="1.2" fill="#A9CDD6"/>
            <rect x="20" y="4.5" width="2.5" height="5" rx="1" fill="#A9CDD6"/>
          </svg>
          <span>-2026-</span>
          <!-- Wi-Fi 图标 -->
          <svg width="22" height="16" viewBox="0 0 22 16" fill="none">
            <title>信号图标</title>
            <desc>小手机屏幕右上角的浅蓝无线网络小图标。</desc>
            <path d="M2 6 C7 1.5, 15 1.5, 20 6" stroke="#A9CDD6" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M5.5 9.5 C8.8 6.8, 13.2 6.8, 16.5 9.5" stroke="#A9CDD6" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="11" cy="13" r="2" fill="#A9CDD6"/>
          </svg>
        </div>

        <div class="group-title-bar" id="groupTopicBtn">
          💬 小萌物茶话会 (6) · 点此换话题
        </div>

        <!-- 屏幕内的小萌物群聊列表 -->
        <div class="chat-stream" id="chatStream"></div>
      </div>
    </div>

    <!-- 奶油色布袋后沿与前袋 -->
    <div class="pocket-back-rim"></div>
    <div class="pocket-front">
      <div class="pocket-stitches"></div>
      <div class="roster-dock" id="rosterDock"></div>
    </div>
  </div>

  <!-- 底部深咖色按钮 -->
  <div class="bottom-actions">
    <button class="main-cta-btn" id="nextActionBtn">换一只小萌物送挂件</button>
    <div class="sub-tip">点小手机里的气泡，看六只继续往下接话 ✨</div>
  </div>
</div>

<script>
  // ==========================================
  // 严格遵照《小萌物画法.txt》绘制六只小萌物 SVG
  // ==========================================

  // 1. momoyu 20x13 像素格子定义（一格不改）
  const STASHYU_GRID = [
    ".D..........D.......",
    ".DM........MD.......",
    ".MCM......MCM...CC..",
    ".MMMMMMMMMMMM..CCCC.",
    ".MMEEMMMMEEMM..MMMM.",
    ".MMEEMMMMEEMM..MMMMM",
    "CCCCCCDDCCCCCC.MMMMM",
    "..CCCCCCCCCC..MMMMM.",
    "....MMCCMM...MMMMM..",
    "....MMCCMM..MMMMM...",
    "....MMMMMM.MMMMM....",
    "....DDMMDDMMMM......",
    "...................."
  ];

  const FETCHMO_GRID = [
    "....................",
    "........X........X..",
    ".......XXX......XXX.",
    "........MMMMMMMMMM..",
    ".......MMMMMMMMMMMM.",
    ".......MEEMMMMMMEEM.",
    ".....X.MEEMXXXXMEEM.",
    "....X..MMMMMXXMMMMM.",
    "....X...MMMMMMMMMM..",
    "....X...MMMMMMMMMM..",
    ".....X...MMMMMMMM...",
    "......XXXXXM..MXX...",
    "...................."
  ];

  function renderPixelGridSVG(grid, palette, blushCoords, blushColor, titleText, descText) {
    let rects = "";
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch !== "." && palette[ch]) {
          rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="${palette[ch]}"/>`;
        }
      }
    }
    if (blushCoords && blushColor) {
      for (const [bx, by] of blushCoords) {
        rects += `<rect x="${bx}" y="${by}" width="1" height="1" fill="${blushColor}"/>`;
      }
    }
    return `
      <svg viewBox="0 0 20 13" width="100%" height="100%" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
        <title>${titleText}</title>
        <desc>${descText}</desc>
        ${rects}
      </svg>
    `;
  }

  // 2. Clawd 严格尺子比例：壳(44,50,147,98)，左钳(20,99,24,21)，右钳(191,99,25,21)，四腿(44,68,152,176; y=148, 15x21)，眼(70,158; y=78, 8x21)
  function renderClawdSVG() {
    return `
      <svg viewBox="10 35 216 145" width="100%" height="100%" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
        <title>Clawd</title>
        <desc>遵循造型宪法尺子比例绘制的纯色扁矩形壳Clawd。</desc>
        <!-- 壳 -->
        <rect x="44" y="50" width="147" height="98" fill="#d47f59"/>
        <!-- 左右钳 -->
        <rect x="20" y="99" width="24" height="21" fill="#d47f59"/>
        <rect x="191" y="99" width="25" height="21" fill="#d47f59"/>
        <!-- 四条短腿（本体站姿） -->
        <rect x="44" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="68" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="152" y="148" width="15" height="21" fill="#d47f59"/>
        <rect x="176" y="148" width="15" height="21" fill="#d47f59"/>
        <!-- 壳面外挂层腮红 -->
        <rect x="54" y="102" width="14" height="8" fill="#E99B82"/>
        <rect x="167" y="102" width="14" height="8" fill="#E99B82"/>
        <!-- 两道竖黑条眼 -->
        <rect x="70" y="78" width="8" height="21" fill="#000000"/>
        <rect x="158" y="78" width="8" height="21" fill="#000000"/>
      </svg>
    `;
  }

  // 3. 小脸蛋（小粉 #FF309B、小紫 #9159FE、小黑 #000000）
  // 严格实测：正圆 R=100，圆心(100,100)
  // 左缝中心 (119.4, 58.4) 宽 19.4 长 41.8；右缝中心 (162.6, 50.3) 宽 12.9 长 41.8
  // 先画竖直胶囊再围绕各自中心 rotate(-26.3)，用 mask 挖空透出背景色！
  let maskUid = 0;
  function renderLittleFaceSVG(colorHex, nameText) {
    maskUid++;
    const maskId = `faceHoleMask_${maskUid}`;
    return `
      <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>${nameText}</title>
        <desc>正圆纯平色与右上角反斜杠透底胶囊缝的${nameText}。</desc>
        <defs>
          <mask id="${maskId}">
            <rect x="0" y="0" width="200" height="200" fill="white"/>
            <!-- 左眼缝：宽 19.4，长 41.8，中心 (119.4, 58.4)，旋转 -26.3 度 -->
            <rect x="109.7" y="37.5" width="19.4" height="41.8" rx="9.7"
                  fill="black" transform="rotate(-26.3 119.4 58.4)"/>
            <!-- 右眼缝：宽 12.9，长 41.8，中心 (162.6, 50.3)，旋转 -26.3 度 -->
            <rect x="156.15" y="29.4" width="12.9" height="41.8" rx="6.45"
                  fill="black" transform="rotate(-26.3 162.6 50.3)"/>
          </mask>
        </defs>
        <circle cx="100" cy="100" r="90" fill="${colorHex}" mask="url(#${maskId})"/>
      </svg>
    `;
  }

  // 挂在圆圈右上角的六款专属小挂件 SVG
  const ACCESSORIES = {
    clawd: `
      <svg viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
        <title>Clawd像素蟹钳挂件</title>
        <desc>挂在头像圈右上角的橘棕像素风小蟹钳挂件。</desc>
        <g transform="rotate(18 30 27)" shape-rendering="crispEdges">
          <rect x="12" y="18" width="14" height="10" fill="#d47f59" stroke="#6E4533" stroke-width="2.5"/>
          <rect x="26" y="12" width="20" height="22" fill="#d47f59" stroke="#6E4533" stroke-width="2.5"/>
          <rect x="32" y="17" width="3" height="8" fill="#000"/>
          <rect x="40" y="17" width="3" height="8" fill="#000"/>
        </g>
      </svg>
    `,
    stashyu: `
      <svg viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
        <title>StashYu火红狐尾挂件</title>
        <desc>挂在头像圈右上角带奶油白尖的火红像素狐狸尾挂件。</desc>
        <path d="M12 36 C14 18, 32 10, 48 16 C46 32, 30 42, 12 36 Z" fill="#E2552B" stroke="#3B2520" stroke-width="3"/>
        <path d="M36 13 C42 13, 46 15, 48 16 C47 22, 43 27, 38 29 C35 24, 34 18, 36 13 Z" fill="#FFF3E3" stroke="#3B2520" stroke-width="2.5"/>
      </svg>
    `,
    fetchmo: `
      <svg viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
        <title>FetchMo小恶魔翅膀挂件</title>
        <desc>复刻图1右上角甜酷风的小恶魔翅膀与粉珠挂件。</desc>
        <path d="M16 24 C10 10, 26 8, 28 22 C22 22, 18 26, 16 24 Z" fill="#D84A3A" stroke="#5A342E" stroke-width="2.5"/>
        <path d="M34 26 C44 16, 54 26, 42 36 C38 32, 34 30, 34 26 Z" fill="#D84A3A" stroke="#5A342E" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="4.5" fill="#F5A4B8" stroke="#5A342E" stroke-width="2"/>
        <circle cx="31" cy="27" r="5.5" fill="#F5A4B8" stroke="#5A342E" stroke-width="2"/>
        <circle cx="38" cy="31" r="4.5" fill="#F5A4B8" stroke="#5A342E" stroke-width="2"/>
      </svg>
    `,
    pink: `
      <svg viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
        <title>小粉蝴蝶结挂件</title>
        <desc>挂在头像圈右上角的甜粉蝴蝶结挂件。</desc>
        <g transform="rotate(22 30 27)">
          <path d="M12 18 L28 27 L12 36 Z" fill="#FF309B" stroke="#6E3B56" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M48 18 L32 27 L48 36 Z" fill="#FF309B" stroke="#6E3B56" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="30" cy="27" r="5.5" fill="#FFD6EC" stroke="#6E3B56" stroke-width="2.5"/>
        </g>
      </svg>
    `,
    purple: `
      <svg viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
        <title>小紫魔法帽挂件</title>
        <desc>挂在头像圈右上角的紫罗兰小巫师帽挂件。</desc>
        <g transform="rotate(16 30 27)">
          <path d="M18 34 L30 10 L42 34 Z" fill="#9159FE" stroke="#4A3570" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="30" cy="34" rx="18" ry="5" fill="#9159FE" stroke="#4A3570" stroke-width="2.5"/>
          <rect x="23" y="27" width="14" height="4" rx="1" fill="#F8D866"/>
        </g>
      </svg>
    `,
    black: `
      <svg viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
        <title>小黑暖金小皇冠挂件</title>
        <desc>挂在头像圈右上角的极简暖金小皇冠挂件。</desc>
        <g transform="rotate(18 30 27)">
          <path d="M14 34 L16 16 L25 25 L30 14 L35 25 L44 16 L46 34 Z" fill="#F3C969" stroke="#52432B" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
      </svg>
    `
  };

  // 六只小萌物角色配置表
  const MASCOTS = [
    {
      id: "clawd",
      name: "Clawd",
      tag: "Clawd·小蟹钳",
      avatarBg: "#FFF5EC",
      render: () => renderClawdSVG()
    },
    {
      id: "stashyu",
      name: "StashYu",
      tag: "StashYu·火红狐尾",
      avatarBg: "#FFF4EE",
      render: () => renderPixelGridSVG(
        STASHYU_GRID,
        { M: "#E2552B", C: "#FFF3E3", D: "#3B2520", E: "#3B2520" },
        [[2, 6], [11, 6]],
        "#F59A8C",
        "StashYu",
        "20乘13像素格子的火红狐狸StashYu。"
      )
    },
    {
      id: "fetchmo",
      name: "FetchMo",
      tag: "FetchMo·恶魔小翅膀",
      avatarBg: "#F3F8FC",
      render: () => renderPixelGridSVG(
        FETCHMO_GRID,
        { M: "#F3E7D6", X: "#4E382E", E: "#79C0F0" },
        [[8, 7], [17, 7]],
        "#F2B8B0",
        "FetchMo",
        "20乘13像素格子的蓝眼暹罗猫FetchMo。"
      )
    },
    {
      id: "pink",
      name: "小粉",
      tag: "小粉·甜粉蝴蝶结",
      avatarBg: "#FFF0F7",
      render: () => renderLittleFaceSVG("#FF309B", "小粉脸蛋儿")
    },
    {
      id: "purple",
      name: "小紫",
      tag: "小紫·小巫师帽",
      avatarBg: "#F4EFFF",
      render: () => renderLittleFaceSVG("#9159FE", "小紫脸蛋儿")
    },
    {
      id: "black",
      name: "小黑",
      tag: "小黑·暖金小皇冠",
      avatarBg: "#F7F4EB",
      render: () => renderLittleFaceSVG("#000000", "小黑脸蛋儿")
    }
  ];

  // 小手机里的多幕群聊剧本（全员在场，符合各自性格）
  const CHAT_SCRIPTS = [
    {
      title: "💬 挂件试戴大会 (6)",
      lines: [
        { who: "pink", side: "left", text: "快看右上角的大圆圈！今天轮到谁进去送挂件啦？" },
        { who: "fetchmo", side: "right", text: "我把恶魔小翅膀擦亮叼过来啦，戴在头像角上超酷！" },
        { who: "stashyu", side: "left", text: "尾巴尖点两下～其余的小礼帽和发箍我都收进尾巴里存好啦。" },
        { who: "clawd", side: "right", text: "（平举两只短蟹钳）我负责把圆圈框扶稳，绝对不晃！" },
        { who: "purple", side: "left", text: "那我把小巫师帽歪着挂上去，咱们六个排排坐！" },
        { who: "black", side: "right", text: "完美。宝一点底部按钮，我们就轮流进圈值班。" }
      ]
    },
    {
      title: "💬 口袋小手机值班室 (6)",
      lines: [
        { who: "clawd", side: "left", text: "这台藕粉小手机塞在奶油布袋里，刚刚好够我们六个窝着。" },
        { who: "stashyu", side: "right", text: "左上角那个奶油小肉垫挂绳晃呀晃，看着好想拿尾巴勾一下！" },
        { who: "pink", side: "left", text: "哈哈别勾歪啦，我还想跟宝戴同款的「亲子装」挂件呢！" },
        { who: "purple", side: "right", text: "我已经帮大家算好角度了，挂在右上角刚好露出半边小脸。" },
        { who: "fetchmo", side: "left", text: "（尾巴竖起来带个小钩）宝来了！快戳屏幕跟她打招呼！" },
        { who: "black", side: "right", text: "全员就位，今天的小手机电量也是满格。" }
      ]
    }
  ];

  let currentMascotIdx = 0;
  let currentScriptIdx = 0;
  let visibleLineCount = 2;

  const showcaseMascotEl = document.getElementById("showcaseMascot");
  const showcaseAccessoryEl = document.getElementById("showcaseAccessory");
  const showcaseTagEl = document.getElementById("showcaseTag");
  const rosterDockEl = document.getElementById("rosterDock");
  const chatStreamEl = document.getElementById("chatStream");
  const groupTopicBtn = document.getElementById("groupTopicBtn");

  function getMascotById(id) {
    return MASCOTS.find(m => m.id === id) || MASCOTS[0];
  }

  // 更新大圆圈里驻守的小萌物与右上角挂件
  function renderShowcase() {
    const m = MASCOTS[currentMascotIdx];
    showcaseMascotEl.innerHTML = m.render();
    showcaseAccessoryEl.innerHTML = ACCESSORIES[m.id];
    showcaseTagEl.textContent = m.tag;

    // 同步口袋上的角色点选栏
    rosterDockEl.innerHTML = "";
    MASCOTS.forEach((item, idx) => {
      const chip = document.createElement("span");
      chip.className = "roster-chip" + (idx === currentMascotIdx ? " active" : "");
      chip.textContent = item.name;
      chip.addEventListener("click", () => {
        currentMascotIdx = idx;
        renderShowcase();
      });
      rosterDockEl.appendChild(chip);
    });
  }

  // 渲染小手机屏幕里的群聊消息
  function renderChatStream() {
    const script = CHAT_SCRIPTS[currentScriptIdx];
    groupTopicBtn.textContent = script.title + " · 点气泡继续聊";
    chatStreamEl.innerHTML = "";

    const linesToShow = script.lines.slice(0, visibleLineCount);
    linesToShow.forEach((line, idx) => {
      const mascot = getMascotById(line.who);
      const row = document.createElement("div");
      row.className = `chat-row ${line.side}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar-circle";
      avatar.style.backgroundColor = mascot.avatarBg;
      avatar.innerHTML = mascot.render();
      avatar.title = `点我让 ${mascot.name} 进右上角大圆圈`;
      avatar.addEventListener("click", (e) => {
        e.stopPropagation();
        currentMascotIdx = MASCOTS.findIndex(m => m.id === mascot.id);
        renderShowcase();
      });

      const bubble = document.createElement("div");
      bubble.className = "chat-bubble";
      bubble.innerHTML = `<span class="speaker-name">${mascot.name}</span>${line.text}`;
      bubble.addEventListener("click", () => advanceChatLine());

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatStreamEl.appendChild(row);
    });

    chatStreamEl.scrollTop = chatStreamEl.scrollHeight;
  }

  function advanceChatLine() {
    const script = CHAT_SCRIPTS[currentScriptIdx];
    if (visibleLineCount < script.lines.length) {
      visibleLineCount++;
    } else {
      visibleLineCount = 2;
      currentScriptIdx = (currentScriptIdx + 1) % CHAT_SCRIPTS.length;
    }
    renderChatStream();
  }

  // 事件绑定
  document.getElementById("pendantShowcase").addEventListener("click", () => {
    currentMascotIdx = (currentMascotIdx + 1) % MASCOTS.length;
    renderShowcase();
  });

  document.getElementById("nextActionBtn").addEventListener("click", () => {
    currentMascotIdx = (currentMascotIdx + 1) % MASCOTS.length;
    renderShowcase();
    advanceChatLine();
  });

  document.getElementById("phoneCharm").addEventListener("click", () => {
    advanceChatLine();
  });

  groupTopicBtn.addEventListener("click", () => {
    currentScriptIdx = (currentScriptIdx + 1) % CHAT_SCRIPTS.length;
    visibleLineCount = 3;
    renderChatStream();
  });

  // 初始化
  renderShowcase();
  renderChatStream();
</script>
</body>
</html>
