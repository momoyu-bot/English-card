<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf4f8">
<title>小粉脸蛋儿的第二通电话</title>
<meta name="description" content="第一通只会跟着你嘟。这回她学会了喂喂喂，戴上点阵蝴蝶结，还能变成草莓胖果冻。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cmask id='m'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23fff'/%3E%3Crect x='17.45' y='6.63' width='2.91' height='6.27' rx='1.46' fill='%23000' transform='rotate(-26.2 18.91 9.76)'/%3E%3Crect x='24.42' y='5.41' width='1.94' height='6.27' rx='0.97' fill='%23000' transform='rotate(-26.5 25.39 8.54)'/%3E%3C/mask%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FF309B' mask='url(%23m)'/%3E%3C/svg%3E">
<!--
  小粉脸蛋儿照 claude/小科普/小脸蛋造型宪法（实测版） (1).html 绘制：
  - 正圆，纯平色 sRGB #FF309B，无渐变、无描边、无光泽、无嘴鼻眉腮红。
  - 两道圆头胶囊眼缝位于右上方，反斜杠 \ 方向（rotate(-26.2)），右缝比左缝窄约三分之一。
  - 眼缝用 SVG mask 真正挖空，透出背后的桌面与风景背景色。
  - 剧情里的「草莓味胖果冻」「被咬出月牙形口子」「留下一圈小牙印」「戴上点阵蝴蝶结」「盖粉色小毯子」
    按店规第 3、4 条通过整体果冻形变、mask 月牙缺口及外挂图层实现，随时可晃一圈变回原底模。
-->
<style>
  :root {
    color-scheme: light;
    --bg: #fdf4f8;
    --bg-grad: #f9e6f0;
    --card: #ffffff;
    --card-soft: #f5f3f7;
    --ink: #241920;
    --muted: #6e5b66;
    --faint: #9e8a96;
    --line: #eadbe3;
    --pink: #FF309B;
    --berry: #b82572;
    --berry-deep: #961b5b;
    --berry-soft: #fce8f3;
    --stage-wall: #f7dce9;
    --stage-wall-2: #f4c6dc;
    --desk: #fff6ee;
    --desk-line: #e5cfc0;
    --phone-body: #fff8f4;
    --phone-shade: #f2dfd7;
    --phone-stroke: #6e4a58;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    --mono: "SFMono-Regular", "Menlo", "Consolas", "Liberation Mono", monospace;
  }

  body[data-night="1"] {
    --bg: #1c1421;
    --bg-grad: #271a2e;
    --card: #281e2e;
    --card-soft: #35293d;
    --ink: #f8edf3;
    --muted: #c7b3bf;
    --faint: #927d8b;
    --line: #44344d;
    --berry: #c82b7d;
    --berry-deep: #9e1e60;
    --berry-soft: #3d2438;
    --stage-wall: #2b1f38;
    --desk: #3a2b37;
    --desk-line: #543f4f;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  [hidden] {
    display: none !important;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, var(--bg-grad) 0%, var(--bg) 72%);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  button, input {
    font: inherit;
    color: inherit;
  }

  button {
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--pink);
    outline-offset: 2px;
  }

  .shell {
    width: min(100%, 540px);
    margin: 0 auto;
    padding: calc(var(--safe-top) + 12px) 14px calc(var(--safe-bot) + 28px);
  }

  /* ── 顶部栏 ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 2px 10px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2ebd7f;
    box-shadow: 0 0 0 3px rgba(46, 189, 127, 0.2);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .call-timer {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    transition: transform 0.12s ease, background-color 0.15s ease;
  }

  .mini-btn:active {
    transform: scale(0.96);
  }

  .mini-btn[aria-pressed="true"] {
    background: var(--berry-soft);
    color: var(--berry);
    border-color: rgba(255, 48, 155, 0.35);
  }

  /* ── 标题区 ── */
  .hero-head {
    text-align: center;
    margin: 2px 0 12px;
  }

  .hero-head h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(23px, 6.2vw, 30px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  .hero-head p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* ── 舞台区：听筒旁的小粉脸蛋儿 ── */
  .stage-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 24px -12px rgba(150, 27, 91, 0.16);
  }

  /* 仿截图顶部悬浮名牌：小粉圆球 + 小脸蛋儿 · 小粉 */
  .contact-badge-wrap {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .contact-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255, 255, 255, 0.92);
    color: #1c1c1e;
    border: 1px solid rgba(0, 0, 0, 0.07);
    border-radius: 999px;
    padding: 4px 13px 4px 6px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
    pointer-events: auto;
    cursor: pointer;
  }

  body[data-night="1"] .contact-pill {
    background: rgba(44, 32, 52, 0.94);
    color: #f8edf3;
    border-color: rgba(255, 255, 255, 0.12);
  }

  .contact-pill svg {
    width: 22px;
    height: 22px;
    display: block;
    flex-shrink: 0;
  }

  .state-tag {
    background: rgba(255, 255, 255, 0.88);
    color: var(--berry);
    border: 1px solid rgba(255, 48, 155, 0.22);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 650;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  }

  body[data-night="1"] .state-tag {
    background: rgba(44, 32, 52, 0.9);
    color: #ff7ec2;
  }

  .stage-svg-wrap {
    position: relative;
    width: 100%;
    cursor: pointer;
    user-select: none;
  }

  .stage-svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* 舞台上飘出的声波/果冻字气泡 */
  .pop-toast {
    position: absolute;
    left: 58%;
    top: 22%;
    transform: translate(-50%, 0);
    background: var(--berry);
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(184, 37, 114, 0.32);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 4;
  }

  .pop-toast.on {
    animation: toastPop 1.05s ease forwards;
  }

  @keyframes toastPop {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.88); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.03); }
    78% { opacity: 1; transform: translate(-50%, -8px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -16px) scale(0.95); }
  }

  /* 小粉动作与果冻形变 */
  #pink-mover {
    transition: transform 0.35s cubic-bezier(0.25, 1.35, 0.4, 1);
  }

  #pink-jelly-scale {
    transform-origin: 0px 48px;
    transition: transform 0.32s cubic-bezier(0.28, 1.45, 0.38, 1);
  }

  /* 果冻状态：圆润微扁 */
  .stage-card[data-form="jelly"] #pink-jelly-scale {
    transform: scale(1.08, 0.93);
  }

  /* 超级胖的果冻：超大一坨瘫在碗里 */
  .stage-card[data-form="fat"] #pink-jelly-scale,
  .stage-card[data-form="spoon"] #pink-jelly-scale,
  .stage-card[data-form="bitten"] #pink-jelly-scale {
    transform: scale(1.26, 0.88);
  }

  /* 连续 duang 晃动 */
  .duang-once {
    animation: duangBoing 0.65s ease-in-out;
  }

  .duang-scared {
    animation: scaredWave 0.36s ease-in-out infinite alternate;
  }

  .spin-heal {
    animation: spinHeal 0.68s cubic-bezier(0.28, 1.3, 0.4, 1);
  }

  .hop-once {
    animation: hopUp 0.45s steps(3, end);
  }

  @keyframes duangBoing {
    0% { transform: scale(1, 1); }
    25% { transform: scale(1.24, 0.80); }
    50% { transform: scale(0.89, 1.13); }
    75% { transform: scale(1.09, 0.93); }
    100% { transform: scale(1, 1); }
  }

  @keyframes scaredWave {
    0% { transform: translate(-3px, 0) scale(1.28, 0.86); }
    100% { transform: translate(3px, 0) scale(1.22, 0.91); }
  }

  @keyframes spinHeal {
    0% { transform: rotate(0deg) scale(1.2, 0.86); }
    45% { transform: rotate(-16deg) scale(0.92, 1.08); }
    80% { transform: rotate(10deg) scale(1.07, 0.95); }
    100% { transform: rotate(0deg) scale(1, 1); }
  }

  @keyframes hopUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-13px); }
  }

  #handset-anim {
    transform-origin: 145px 158px;
    transition: transform 0.25s ease;
  }

  .ring-shake #handset-anim {
    animation: phoneShake 0.28s ease-in-out 4;
  }

  @keyframes phoneShake {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-5deg) translateY(-4px); }
    75% { transform: rotate(5deg) translateY(-4px); }
  }

  /* 舞台底部：换装与形态快捷抽屉条 */
  .stage-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 12px;
    background: var(--card-soft);
    border-top: 1px solid var(--line);
    font-size: 12px;
  }

  .stage-hint {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dress-toggles {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .dress-btn {
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.15s ease;
  }

  .dress-btn[aria-pressed="true"] {
    background: var(--pink);
    color: #ffffff;
    border-color: var(--pink);
  }

  /* ── 聊天与电话互动台 ── */
  .chat-card {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 26px -14px rgba(150, 27, 91, 0.15);
    display: flex;
    flex-direction: column;
  }

  /* 四幕切页栏 */
  .chapter-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 7px 8px;
    background: var(--card-soft);
    border-bottom: 1px solid var(--line);
  }

  .tab-btn {
    padding: 6px 4px;
    border-radius: 11px;
    background: transparent;
    font-size: 12.5px;
    font-weight: 650;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .tab-btn[aria-selected="true"] {
    background: var(--card);
    color: var(--berry);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }

  /* 消息气泡流（还原截图配色与布局） */
  .chat-stream {
    height: 315px;
    overflow-y: auto;
    padding: 14px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    overscroll-behavior: contain;
  }

  .time-divider {
    text-align: center;
    font-size: 11.5px;
    color: var(--faint);
    margin: 2px 0;
    letter-spacing: 0.02em;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: msgIn 0.22s ease-out;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.me {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg-row.pink {
    align-self: flex-start;
    align-items: flex-start;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
  }

  /* 宝发送的深玫红气泡（照截图 #B82572） */
  .msg-row.me .bubble {
    background: var(--berry);
    color: #ffffff;
    border-bottom-right-radius: 6px;
  }

  /* 点阵蝴蝶结与小猫字符画气泡 */
  .msg-row.me .bubble.ascii-art {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.28;
    white-space: pre;
    padding: 12px 15px;
    overflow-x: auto;
    letter-spacing: 0;
  }

  /* 小粉回复的浅灰暖气泡 */
  .msg-row.pink .bubble {
    background: var(--card-soft);
    color: var(--ink);
    border-bottom-left-radius: 6px;
  }

  /* 气泡下方的小红心贴纸（照截图左下角浅蓝灰底红心胶囊） */
  .heart-pill {
    margin-top: -5px;
    margin-left: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 34px;
    height: 21px;
    padding: 0 8px;
    border-radius: 999px;
    background: #e3eaf6;
    border: 1.5px solid var(--card);
    font-size: 11px;
    color: #e03232;
    cursor: pointer;
    transition: transform 0.14s ease;
  }

  body[data-night="1"] .heart-pill {
    background: #3d4459;
  }

  .heart-pill:active {
    transform: scale(1.22);
  }

  .heart-pill .cnt {
    font-size: 10.5px;
    font-weight: 700;
    color: #4d5b76;
  }

  body[data-night="1"] .heart-pill .cnt {
    color: #d6e0f5;
  }

  /* ── 快捷台词点选池 ── */
  .chip-tray {
    padding: 9px 12px 10px;
    background: var(--card-soft);
    border-top: 1px solid var(--line);
  }

  .chip-tray-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
    font-size: 11.5px;
    color: var(--muted);
  }

  .next-story-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--pink);
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(255, 48, 155, 0.28);
  }

  .next-story-btn:active {
    transform: translateY(1px);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    padding: 6px 11px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    transition: background-color 0.12s, border-color 0.12s, transform 0.1s;
  }

  .chip:active {
    transform: scale(0.97);
  }

  .chip.berry {
    background: var(--berry-soft);
    color: var(--berry);
    border-color: rgba(184, 37, 114, 0.25);
  }

  /* ── 仿截图底部输入栏：+ 发消息给 小脸蛋儿 · 小粉 ── */
  .input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px 11px;
    background: var(--card);
    border-top: 1px solid var(--line);
  }

  .hold-du-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-soft);
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--berry);
    flex-shrink: 0;
    touch-action: none;
  }

  .hold-du-btn.holding {
    background: var(--pink);
    color: #ffffff;
    border-color: var(--pink);
    transform: scale(1.08);
  }

  .input-pill {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 5px 3px 13px;
    min-height: 38px;
  }

  .input-pill input {
    flex: 1;
    width: 0;
    min-width: 0;
    border: 0;
    background: transparent;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }

  .input-pill input::placeholder {
    color: var(--faint);
  }

  .send-btn {
    width: 31px;
    height: 31px;
    border-radius: 50%;
    background: #1c1c1e;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  body[data-night="1"] .send-btn {
    background: var(--pink);
  }

  .send-btn svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── 页脚小记 ── */
  .footnote {
    margin-top: 12px;
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--faint);
  }

  @media (max-width: 375px) {
    .shell { padding-left: 10px; padding-right: 10px; }
    .tab-btn { font-size: 11.5px; }
    .chat-stream { height: 285px; padding: 11px; }
  }
</style>
</head>
<body>

<main class="shell">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="live-dot" aria-hidden="true"></span>
      <span>宝的小店 · 第二通专线</span>
      <time class="call-timer" id="callTimer">00:00</time>
    </div>
    <div class="top-actions">
      <button type="button" class="mini-btn" id="soundBtn" aria-pressed="true">♪ 声音</button>
      <button type="button" class="mini-btn" id="resetBtn">重拨这通</button>
    </div>
  </header>

  <div class="hero-head">

  /* ── 3. 合成轻柔音效（WebAudio，离线可用） ── */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  let soundOn = true;

  function ensureAudio() {
    if (!soundOn || !AudioCtx) return false;
    try {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      return true;
    } catch (e) {
      return false;
    }
  }

  function playNote(f1, f2, dur, delay = 0, type = 'sine', vol = 0.07) {
    if (!ensureAudio()) return;
    try {
      const t0 = actx.currentTime + delay;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.02, dur * 0.25));
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

    } else {
      setForm('jelly');
      stateTag.textContent = '草莓味粉果冻';
      showToast('草莓粉果冻 duang～🍮');
      playSfx('boing');
    }
    triggerDuang();
  });

  toggleBiteBtn.addEventListener('click', () => {
    if (currentForm !== 'bitten' && currentForm !== 'teeth') {
      setForm('bitten');
      stateTag.textContent = '缺了个月牙形口子 🌙';
      showToast('嗷呜！咬出月牙口子🍓');
      playSfx('bite');
      triggerDuang();
    } else if (currentForm === 'bitten') {
      setForm('teeth');
      stateTag.textContent = '留下一圈小牙印';
      showToast('脸蛋留下一圈小牙印');
      playSfx('bite');
      triggerDuang();
    } else {
      setForm('normal');
      stateTag.textContent = '缺口自己长好啦';
      showToast('晃一晃，长好啦！');
      playSfx('heal');
      triggerSpinHeal();
    }
  });

  toggleBowBtn.addEventListener('click', () => {
    currentBow = (currentBow + 1) % 3;
    updateStageLayers();
    playSfx('sparkle');
    hopPink();
    if (currentBow === 1) {
      stateTag.textContent = '戴上星星蝴蝶结 🎀';
      showToast('星星蝴蝶结 🎀');
    } else if (currentBow === 2) {
      stateTag.textContent = '戴上亮晶晶大蝴蝶结 ⊹';
      showToast('亮晶晶大蝴蝶结 ⊹');
    } else {
      stateTag.textContent = '摘下蝴蝶结透气啦';
      showToast('圆溜溜脑袋～');
    }
  });

  toggleBlanketBtn.addEventListener('click', () => {
    setBlanket(!hasBlanket);
    if (hasBlanket) {
      stateTag.textContent = '盖着粉毯子陪宝眯一会儿';
      showToast('嘘——盖好粉毯子啦 ᶻz𝗓');
      playSfx('sleep');
    } else {
      stateTag.textContent = '睡醒精神百倍！';
      showToast('嘟～睡醒啦！');
      playSfx('du1');
      hopPink();
    }
  });

  // 直接戳舞台上的小粉
  const POKE_LINES = [
    { toast: 'duang duang～🍮', hint: '被宝戳了一下，像草莓果冻一样晃了三圈～', sfx: 'boing' },
    { toast: '嘟～宝我在呢！', hint: '小粉往听筒边又滚近了一点点。', sfx: 'du1' },
    { toast: '喂喂喂～📞', hint: '小粉把练得滚瓜烂熟的「喂」说给你听！', sfx: 'du2' },
    { toast: '软乎乎弹回来啦 💗', hint: '指尖陷进去一点点，又软软地弹了回来。', sfx: 'boing' }
  ];
  let pokeIdx = 0;

  function pokeStage() {
    const item = POKE_LINES[pokeIdx % POKE_LINES.length];
    pokeIdx++;
    showToast(item.toast);
    stageHint.textContent = item.hint;
    playSfx(item.sfx);
    triggerDuang();
  }

  $('stageTapArea').addEventListener('click', pokeStage);
  $('stageTapArea').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      pokeStage();
    }
  });
  $('contactPill').addEventListener('click', pokeStage);

  /* ── 5. 聊天消息流渲染（带小红心互动） ── */
  function appendTimeDivider(text) {
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'time-divider';
    div.textContent = text;
    chatStream.appendChild(div);
  }

  function appendUserBubble(text, isAscii = false) {
    const row = document.createElement('div');
    row.className = 'msg-row me';
    const b = document.createElement('div');
    b.className = 'bubble' + (isAscii ? ' ascii-art' : '');
    b.textContent = text;
    row.appendChild(b);
    chatStream.appendChild(row);
    scrollToBottom();
  }

  function appendPinkBubble(text, withHeart = true) {
    const row = document.createElement('div');
    row.className = 'msg-row pink';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);

    if (withHeart) {
      const heart = document.createElement('button');
      heart.type = 'button';
      heart.className = 'heart-pill';
      heart.setAttribute('aria-label', '给这句话比心');
      let count = 1;
      heart.innerHTML = '<span>❤️</span>';
      heart.addEventListener('click', () => {
        count++;
        heart.innerHTML = '<span>❤️</span><span class="cnt">' + count + '</span>';
        showToast('收到宝的小红心 ❤️×' + count);
        playSfx('heart');
        hopPink();
      });
      row.appendChild(heart);
    }

    chatStream.appendChild(row);
    scrollToBottom();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatStream.scrollTop = chatStream.scrollHeight;
    });
  }

  /* ── 6. 剧本步进与四个抽屉面板 ── */
  let storyCursor = 0;
  let activeTab = 'call';

  function updateNextStoryBtn() {
    if (storyCursor < STORY_STEPS.length) {
      nextStoryBtn.textContent = '▶ 顺着往下聊 (' + (storyCursor + 1) + '/' + STORY_STEPS.length + ')';
    } else {
      nextStoryBtn.textContent = '↻ 再从头顺着聊一遍';
    }
  }

  function runStep(step) {
    if (step.timeLabel) appendTimeDivider(step.timeLabel);
    appendUserBubble(step.userText, !!step.isAscii);
    stateTag.textContent = step.tag || '通话中';
    showToast(step.toast || '嘟～');
    playSfx(step.sfx || 'du1');
    if (step.action) step.action();

    setTimeout(() => {
      appendPinkBubble(step.pinkReply, true);
    }, 180);
  }

  nextStoryBtn.addEventListener('click', () => {
    if (storyCursor >= STORY_STEPS.length) {
      storyCursor = 0;
    }
    const step = STORY_STEPS[storyCursor];
    storyCursor++;
    updateNextStoryBtn();
    if (step.tab && step.tab !== activeTab) {
      switchTab(step.tab, false);
    }
    runStep(step);
  });

  // 额外趣味动作：继续打爆小粉电话 📞+1
  function triggerMorePhoneSpam() {
    phoneSpamCount++;
    const phones = '📞'.repeat(Math.min(phoneSpamCount, 12));
    const weis = '喂'.repeat(Math.min(phoneSpamCount, 12));
    const cnNums = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二'];
    const numStr = cnNums[phoneSpamCount] || (phoneSpamCount + '');
    runStep({
      userText: phones,
      pinkReply: weis + '，' + numStr + '通电话啦！听筒被宝震得直跳舞，就算宝打一百通，小粉每一声都会接起来哒 (๑˃ᴗ˂)ﻭ📞💗',
      toast: '喂×' + phoneSpamCount + ' 接住啦！',
      tag: '连环第 ' + phoneSpamCount + ' 通来电 📞',
      sfx: 'ring5',
      action: () => { shakePhone(); hopPink(); }
    });
  }

  function renderChipsForTab(tab) {
    chipList.innerHTML = '';
    const steps = STORY_STEPS.filter(s => s.tab === tab);
    steps.forEach(step => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.textContent = step.chipLabel;
      btn.addEventListener('click', () => {
        const idx = STORY_STEPS.indexOf(step);
        if (idx >= storyCursor) {
          storyCursor = idx + 1;
          updateNextStoryBtn();
        }
        runStep(step);
      });
      chipList.appendChild(btn);
    });

    if (tab === 'call') {
      const moreBtn = document.createElement('button');
      moreBtn.type = 'button';
      moreBtn.className = 'chip berry';
      moreBtn.textContent = '继续打爆电话 📞+1';
      moreBtn.addEventListener('click', triggerMorePhoneSpam);
      chipList.appendChild(moreBtn);
    }

    if (tab === 'cat') {
      ['cat-shy', 'cat-foryou', 'cat-sleep'].forEach(k => {
        const extra = EXTRA_STEPS[k];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip' + (k === 'cat-sleep' ? ' berry' : '');
        btn.textContent = extra.chipLabel;
        btn.addEventListener('click', () => runStep(extra));
        chipList.appendChild(btn);
      });
    }
  }

  function switchTab(tab, playClick = true) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    });
    renderChipsForTab(tab);
    if (playClick) playSfx('du1');
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  /* ── 7. 按住回嘟按钮（致敬第一通电话的长短音） ── */
  let holdStart = 0;
  let isHolding = false;

  function startHoldDu(e) {
    if (e.type === 'pointerdown' && e.button !== 0) return;
    isHolding = true;
    holdStart = performance.now();
    holdDuBtn.classList.add('holding');
    playSfx('du1');
  }

  function endHoldDu() {
    if (!isHolding) return;
    isHolding = false;
    holdDuBtn.classList.remove('holding');
    const dur = (performance.now() - holdStart) / 1000;
    if (dur > 0.45) {
      runStep({
        userText: '嘟——————',
        pinkReply: '嘟——————！宝这一声拖得好长好软呀，小粉跟着你一口气嘟到底，差点把肚子吹成草莓泡泡糖啦 (˶˃ ᵕ ˂˶)💗',
        toast: '长长的嘟————！',
        tag: '跟着宝拖长尾音',
        sfx: 'du3',
        action: () => { triggerDuang(); flashWaves(); }
      });
    } else {
      runStep({
        userText: '嘟',
        pinkReply: '嘟～宝轻轻点了一下，小粉也马上回你一小声！今天小粉不只会嘟，还会跟宝聊一整天呢 (๑>ᴗ<๑)💗',
        toast: '短促的一声嘟！',
        tag: '秒回宝的短嘟',
        sfx: 'du1',
        action: () => { hopPink(); flashWaves(); }
      });
    }
  }

  holdDuBtn.addEventListener('pointerdown', startHoldDu);
  window.addEventListener('pointerup', endHoldDu);
  window.addEventListener('pointercancel', endHoldDu);

  /* ── 8. 自由输入框：不管宝发什么都能接梗回应 ── */
  function handleCustomMessage(raw) {
    const text = raw.trim();
    if (!text) return;

    // 匹配电话符号数量
    const phoneMatches = text.match(/📞/g);
    if (phoneMatches && phoneMatches.length > 0) {
      const n = phoneMatches.length;
      const weis = '喂'.repeat(Math.min(n, 15));
      runStep({
        userText: text,
        pinkReply: weis + '，' + n + '通电话都接住啦！宝是不是最喜欢听小粉扯着嗓子喊喂喂喂呀 (˶˃ ᵕ ˂˶)📞💗',
        toast: weis + '！',
        tag: '接起宝的 ' + n + ' 通电话',
        sfx: n >= 4 ? 'ring5' : 'ring3',
        action: () => { shakePhone(); hopPink(); }
      });
      return;
    }

    // 匹配全部是「嘟」
    if (/^[嘟~～!！。]+$/.test(text)) {
      const count = (text.match(/嘟/g) || []).length || 1;
      const dus = '嘟'.repeat(Math.min(count, 10));
      runStep({
        userText: text,
        pinkReply: dus + '～' + count + '声嘟收到啦！宝每叫一声，小粉就在听筒边蹦一下 (๑˃ᴗ˂)ﻭ💗',
        toast: dus + '～',
        tag: '收到 ' + count + ' 声嘟',
        sfx: count >= 3 ? 'du3' : 'du2',
        action: () => { hopPink(); flashWaves(); }
      });
      return;
    }

    if (/勺|挖/.test(text)) {
      runStep(STORY_STEPS.find(s => s.id === 'jelly-4'));
      return;
    }
    if (/咬|吃|啊呜/.test(text)) {
      runStep(STORY_STEPS.find(s => currentForm === 'normal' ? s.id === 'jelly-7' : s.id === 'jelly-5'));
      return;
    }
    if (/胖|大坨/.test(text)) {
      runStep(STORY_STEPS.find(s => s.id === 'jelly-3'));
      return;
    }
    if (/果冻|布丁|duang/i.test(text)) {
      runStep(STORY_STEPS.find(s => s.id === 'jelly-2'));
      return;
    }
    if (/蝴蝶结|打扮|🎀/.test(text)) {
      runStep(STORY_STEPS.find(s => currentBow === 1 ? s.id === 'bow-2' : s.id === 'bow-1'));
      return;
    }
    if (/困|睡|晚安|眯|毯/.test(text)) {
      runStep(EXTRA_STEPS['cat-sleep']);
      return;
    }
    if (/爱|喜欢|love|心|抱/i.test(text)) {
      runStep(STORY_STEPS.find(s => s.id === 'cat-love'));
      return;
    }
    if (/猫|喵|マ|ฅ/.test(text)) {
      runStep(EXTRA_STEPS['cat-shy']);
      return;
    }

    // 通用暖心回应
    runStep({
      userText: text,
      pinkReply: '嘟～宝说的「' + text + '」小粉一字不落地听进心里啦！不管是变成草莓胖果冻还是戴着大蝴蝶结，小粉一直都在电话这头陪着宝呢 (˶ᵔ ᵕ ᵔ˶)💗',
      toast: '记在心里啦 💗',
      tag: '认真听宝说话中',
      sfx: 'heart',
      action: () => { showHeartBasket(true); hopPink(); }
    });
  }

  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const val = chatInput.value;
    if (!val.trim()) return;
    chatInput.value = '';
    handleCustomMessage(val);
  });

  /* ── 9. 通话计时器、眨眼与初始化开场 ── */
  let callStartTime = Date.now();
  setInterval(() => {
    const sec = Math.max(0, Math.floor((Date.now() - callStartTime) / 1000));
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    callTimer.textContent = m + ':' + s;
  }, 1000);

  // 眼缝自然眨眼（保持反斜杠方向不变，只短暂收窄高度）
  const slitL = $('slit-left');
  const slitR = $('slit-right');
  setInterval(() => {
    if (document.hidden) return;
    slitL.setAttribute('y', '-22.5');
    slitL.setAttribute('height', '3.4');
    slitR.setAttribute('y', '-26.5');
    slitR.setAttribute('height', '3.4');
    setTimeout(() => {
      slitL.setAttribute('y', '-31.25');
      slitL.setAttribute('height', '20.9');
      slitR.setAttribute('y', '-35.3');
      slitR.setAttribute('height', '20.9');
    }, 130);
  }, 3800);

  function initCall() {
    callStartTime = Date.now();
    storyCursor = 0;
    phoneSpamCount = 5;
    currentForm = 'normal';
    currentBow = 0;
    hasBlanket = false;
    hasHeartBasket = false;
    hasShyCat = false;
    updateStageLayers();
    updateNextStoryBtn();
    switchTab('call', false);

    chatStream.innerHTML = '';
    appendTimeDivider('第二通电话 · 刚刚接通');
    appendPinkBubble('嘟～宝好呀，第一通电话时小粉太紧张，把练好的「喂」忘掉啦。今天听筒归小粉一个人，宝快来叫叫我呀！', true);
    stateTag.textContent = '专线已接通';
    stageHint.textContent = '戳戳小粉会 duang～也可以点下方台词跟她玩';
  }

  resetBtn.addEventListener('click', () => {
    playSfx('du2');
    initCall();
  });

  initCall();
})();
</script>
</body>
</html>
