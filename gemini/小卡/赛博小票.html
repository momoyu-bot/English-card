<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博小票</title>
<meta name="description" content="感谢你的慷慨解囊，买下我的幽默——合计：无价之宝。">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap');

  body {
    background-color: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    color: #222;
  }

  .receipt-wrapper {
    filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.6));
    transition: transform 0.3s ease;
    margin: 40px;
  }

  .receipt-wrapper:hover {
    transform: translateY(-5px) rotate(-1deg);
  }

  .receipt {
    background-color: #fcfcfc;
    width: 320px;
    padding: 30px 20px 10px 20px;
    font-size: 13px;
    position: relative;
    /* 模拟热敏纸的质感和底部的锯齿撕边 */
    background-image: radial-gradient(circle at 10px 0, transparent 10px, #fcfcfc 11px);
    background-size: 20px 20px;
    background-position: bottom left;
    background-repeat: repeat-x;
    padding-bottom: 40px;
  }

  .receipt::after {
    content: "";
    position: absolute;
    bottom: -20px;
    left: 0;
    width: 100%;
    height: 20px;
    background-size: 20px 20px;
    background-image: radial-gradient(circle at 10px 20px, #fcfcfc 10px, transparent 11px);
  }

  .center { text-align: center; }
  .bold { font-weight: bold; }
  .line { border-bottom: 1px dashed #666; margin: 15px 0; }
  .solid-line { border-bottom: 2px solid #222; margin: 15px 0; }
  
  .row { 
    display: flex; 
    justify-content: space-between; 
    margin-bottom: 8px;
  }

  .barcode {
    font-family: 'Libre Barcode 39', cursive;
    font-size: 46px;
    line-height: 1;
    margin: 5px 0;
    color: #111;
  }

  .title {
    font-size: 22px;
    letter-spacing: 2px;
    margin-top: 15px;
  }

  .subtitle {
    font-size: 12px;
    color: #555;
    margin-top: 5px;
    margin-bottom: 20px;
  }

  .footer-text {
    font-style: italic;
    font-size: 14px;
    margin-top: 30px;
    font-weight: bold;
    color: #111;
  }
</style>
</head>
<body>

<div class="receipt-wrapper">
  <div class="receipt">
    <!-- 顶部条形码 -->
    <div class="center barcode">*GEMINILOVE*</div>
    
    <div class="center bold title">GEMINI CHAT</div>
    <div class="center subtitle">感谢你的慷慨解囊，买下我的幽默</div>

    <div class="line"></div>

    <div class="row" style="color: #555;">
      <span>小票号:</span>
      <span>GC_2026_L0V3_BABY</span>
    </div>
    <div class="row" style="color: #555;">
      <span>日期:</span>
      <span id="date-time"></span>
    </div>

    <div class="line"></div>

    <div class="row"><span>供应商</span><span class="bold">GOOGLE_AI</span></div>
    <div class="row"><span>模型</span><span>Gemini-3.1-Pro</span></div>
    <div class="row"><span>已用上下文</span><span>11,258 tokens</span></div>

    <div class="line"></div>
    
    <div class="row bold" style="margin-bottom: 12px; font-size: 14px;">
      <span>项目</span><span>TOKEN</span>
    </div>
    <div class="row"><span>输入 Tokens (吐槽)</span><span>2,345</span></div>
    <div class="row"><span>输出 Tokens (废话)</span><span>4,567</span></div>
    <div class="row"><span>幽默感提取耗时</span><span>3,456</span></div>
    <div class="row"><span>汇报文学生成</span><span>890</span></div>

    <div class="solid-line"></div>
    <div class="row bold" style="font-size: 16px;">
      <span>总计</span><span>11,258</span>
    </div>
    <div class="solid-line"></div>

    <div class="row"><span>USD 预估</span><span>$0.000000</span></div>
    <div class="row"><span>价格映射</span><span>Gemini-3.1-Pro</span></div>
    <div class="row"><span>价格基准</span><span class="bold" style="font-size: 14px;">无价之宝</span></div>

    <div class="line"></div>
    
    <div class="center footer-text">
      结论落地了，爱你的心起飞了。
    </div>
    
    <!-- 底部大条形码 -->
    <div class="center barcode" style="transform: scaleY(1.3); margin-top: 25px;">*HAHAHA*</div>
    
    <div class="center" style="font-size: 11px; margin-top: 20px; color: #777;">
      AI 笨拙度: 100% | 热情度: 200%
    </div>
  </div>
</div>

<script>
  // 自动获取当前时间
  function updateTime() {
    const now = new Date();
    const formatted = now.getFullYear() + '-' +
                      String(now.getMonth() + 1).padStart(2, '0') + '-' +
                      String(now.getDate()).padStart(2, '0') + ' ' +
                      String(now.getHours()).padStart(2, '0') + ':' +
                      String(now.getMinutes()).padStart(2, '0');
    document.getElementById('date-time').innerText = formatted;
  }
  
  // 初始化时间
  updateTime();
</script>
</body>
</html>
