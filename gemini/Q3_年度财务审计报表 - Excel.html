<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3_年度财务审计报表.xlsx - Excel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f3f2f1;
            user-select: none;
        }

        /* 顶部绿色标题栏 */
        .excel-header {
            background-color: #107c41;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 10px;
            height: 48px;
            font-size: 14px;
        }

        /* 伪装的 Ribbon 菜单 */
        .ribbon {
            background-color: #f3f2f1;
            border-bottom: 1px solid #e1e1e1;
            padding: 8px 10px 0 10px;
            display: flex;
            gap: 20px;
            font-size: 13px;
        }
        .ribbon-tab {
            padding: 4px 12px;
            cursor: default;
            color: #333;
            border-bottom: 2px solid transparent;
        }
        .ribbon-tab.active {
            background-color: white;
            color: #107c41;
            border-bottom: 2px solid #107c41;
            font-weight: 600;
        }

        /* 伪装的工具栏 */
        .toolbar {
            background-color: white;
            height: 60px;
            border-bottom: 1px solid #e1e1e1;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
        }
        .tool-group {
            border-right: 1px solid #e1e1e1;
            padding-right: 15px;
            display: flex;
            gap: 8px;
            height: 40px;
            align-items: center;
        }
        .fake-btn {
            width: 24px;
            height: 24px;
            background-color: #eee;
            border-radius: 2px;
        }

        /* 公式栏 */
        .formula-bar {
            background-color: white;
            height: 30px;
            border-bottom: 1px solid #e1e1e1;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 13px;
        }
        .name-box {
            width: 80px;
            border: 1px solid #ccc;
            padding: 2px 5px;
            margin-right: 10px;
        }
        .fx {
            color: #666;
            font-style: italic;
            font-weight: bold;
            margin-right: 10px;
        }
        .formula-input {
            flex-grow: 1;
            border: 1px solid transparent;
            padding: 2px 5px;
            color: #333;
        }

        /* 核心表格区域 */
        .spreadsheet-container {
            display: flex;
            height: calc(100vh - 164px); /* 减去顶部各种栏的高度 */
            background-color: white;
            overflow: hidden;
        }
        
        .row-headers {
            width: 40px;
            background-color: #f3f2f1;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }
        
        .grid-area {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .col-headers {
            display: flex;
            background-color: #f3f2f1;
            border-bottom: 1px solid #ccc;
            height: 24px;
        }

        .header-cell {
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            background-color: #f3f2f1;
            box-sizing: border-box;
        }

        .row-header-cell {
            height: 24px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
        }

        .cells-container {
            display: grid;
            /* 行列数将在 JS 中动态生成 */
            background-color: #e1e1e1; /* 网格线颜色 */
            gap: 1px; /* 产生网格线效果 */
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }

        .data-cell {
            background-color: white;
            height: 23px; /* 24 - gap */
            padding: 0 4px;
            font-size: 12px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-family: 'Calibri', sans-serif;
            transition: background-color 0.05s; /* 平滑变色 */
        }

        /* 游戏特定的样式 - 伪装成正常的选中/错误高亮 */
        .snake-body {
            background-color: #c6e4f6 !important; /* 伪装成鼠标选中多个单元格的蓝色 */
            color: transparent !important; /* 隐藏原本的数字 */
        }
        .snake-head {
            background-color: #107c41 !important; /* Excel 主题绿 */
            color: white !important;
            font-weight: bold;
        }
        .food {
            background-color: #ffeb9c !important; /* 伪装成标记重点数据的黄色 */
            color: #9c6500 !important;
            font-weight: bold;
        }

        /* 底部状态栏 */
        .status-bar {
            height: 26px;
            background-color: #f3f2f1;
            border-top: 1px solid #ccc;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            color: #333;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- 顶部绿条 -->
    <div class="excel-header">
        <div class="flex items-center gap-3 w-full">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" fill="white"/><path d="M14 2V8H20" stroke="#107c41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13H16M8 17H16M8 9H10" stroke="#107c41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="font-semibold">Q3_年度财务审计报表.xlsx</span>
            <span class="text-green-200 ml-2">- 保存到这台电脑</span>
            
            <!-- 搜索框伪装 -->
            <div class="ml-auto bg-green-800/50 rounded flex items-center px-2 py-1 w-64 text-green-100">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span>搜索 (Alt+Q)</span>
            </div>
            
            <!-- 假的最小化/最大化/关闭按钮 -->
            <div class="flex ml-4 gap-2">
                <div class="w-8 h-8 flex items-center justify-center hover:bg-green-700 cursor-pointer">—</div>
                <div class="w-8 h-8 flex items-center justify-center hover:bg-green-700 cursor-pointer">□</div>
                <div class="w-8 h-8 flex items-center justify-center hover:bg-red-500 cursor-pointer">✕</div>
            </div>
        </div>
    </div>

    <!-- 菜单栏 -->
    <div class="ribbon">
        <div class="ribbon-tab text-green-700">文件</div>
        <div class="ribbon-tab active">开始</div>
        <div class="ribbon-tab">插入</div>
        <div class="ribbon-tab">页面布局</div>
        <div class="ribbon-tab">公式</div>
        <div class="ribbon-tab">数据</div>
        <div class="ribbon-tab">审阅</div>
        <div class="ribbon-tab">视图</div>
    </div>

    <!-- 工具栏 (全为假图标) -->
    <div class="toolbar">
        <div class="tool-group">
            <div class="fake-btn" style="background: #ffecb3;"></div>
            <div class="flex flex-col gap-1">
                <div class="h-2 w-8 bg-gray-200 rounded"></div>
                <div class="h-2 w-8 bg-gray-200 rounded"></div>
            </div>
        </div>
        <div class="tool-group">
            <select class="border border-gray-300 rounded text-xs p-1"><option>等线</option></select>
            <select class="border border-gray-300 rounded text-xs p-1"><option>11</option></select>
            <div class="font-bold cursor-pointer px-1">B</div>
            <div class="italic cursor-pointer px-1">I</div>
            <div class="underline cursor-pointer px-1">U</div>
        </div>
        <div class="tool-group">
            <div class="w-4 h-4 bg-yellow-200 border border-gray-400"></div>
            <div class="text-red-600 font-bold">A</div>
        </div>
        <div class="tool-group flex-col items-start justify-center text-xs text-gray-500">
            <span>[Enter] 启动数据分析</span>
            <span>[Esc] 终止并隐藏</span>
        </div>
    </div>

    <!-- 公式栏 -->
    <div class="formula-bar">
        <div class="name-box" id="active-cell-name">A1</div>
        <div class="fx">fx</div>
        <div class="formula-input" id="formula-content">=SUM(C2:C10) * 1.05</div>
    </div>

    <!-- 表格核心区域 -->
    <div class="spreadsheet-container">
        <!-- 行号 -->
        <div class="row-headers" id="row-headers">
            <div class="header-cell" style="height: 24px;"></div>
            <!-- JS 生成 1, 2, 3... -->
        </div>
        
        <div class="grid-area">
            <!-- 列标 A, B, C... -->
            <div class="col-headers" id="col-headers">
                <!-- JS 生成 A, B, C... -->
            </div>
            
            <!-- 单元格 -->
            <div class="cells-container" id="cells-container">
                <!-- JS 生成海量单元格 -->
            </div>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="status-bar">
        <div class="flex items-center gap-4">
            <span id="status-text">就绪</span>
            <span class="text-gray-400">|</span>
            <span id="score-text" style="display: none;">数据核对进度: 0</span>
        </div>
        <div class="flex items-center gap-4">
            <span>求和: ￥5,234,102.00</span>
            <span>100%</span>
            <input type="range" min="10" max="200" value="100" class="w-24">
        </div>
    </div>

    <script>
        // --- 游戏和表格配置 ---
        const COLS = 28; // 列数 (A到AB)
        const ROWS = 22; // 行数
        const INITIAL_SPEED = 150; // 初始速度 (ms)
        
        let grid = []; // 存储所有DOM单元格的二维数组
        let snake = []; // 蛇身体坐标 [{r, c}]
        let direction = { r: 0, c: 1 }; // 初始方向：向右
        let nextDirection = { r: 0, c: 1 }; // 防止按键过快导致的倒退自杀
        let food = { r: 0, c: 0 };
        let gameInterval = null;
        let isPlaying = false;
        let score = 0;
        let originalData = []; // 备份原本的财务数据

        const container = document.getElementById('cells-container');
        const colHeaders = document.getElementById('col-headers');
        const rowHeaders = document.getElementById('row-headers');
        const statusText = document.getElementById('status-text');
        const scoreText = document.getElementById('score-text');
        const activeCellName = document.getElementById('active-cell-name');
        const formulaContent = document.getElementById('formula-content');

        // 生成列字母 (A, B, C... Z, AA, AB)
        function getColName(index) {
            let name = '';
            while (index >= 0) {
                name = String.fromCharCode((index % 26) + 65) + name;
                index = Math.floor(index / 26) - 1;
            }
            return name;
        }

        // --- 初始化表格伪装 ---
        function initSpreadsheet() {
            // 设置 CSS Grid 列宽
            container.style.gridTemplateColumns = `repeat(${COLS}, 70px)`;
            colHeaders.style.width = `${COLS * 70}px`;

            for (let c = 0; c < COLS; c++) {
                const header = document.createElement('div');
                header.className = 'header-cell';
                header.style.width = '70px';
                header.innerText = getColName(c);
                colHeaders.appendChild(header);
            }

            for (let r = 0; r < ROWS; r++) {
                // 行号
                const rowHeader = document.createElement('div');
                rowHeader.className = 'row-header-cell';
                rowHeader.innerText = r + 1;
                rowHeaders.appendChild(rowHeader);

                grid[r] = [];
                originalData[r] = [];
                
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'data-cell';
                    
                    // 制造虚假的财务数据
                    let fakeData = "";
                    if (r === 0) {
                        // 第一行加粗当表头
                        const headers = ["日期", "部门", "项目编号", "预算金额", "实际支出", "差额", "完成率", "审批人"];
                        fakeData = headers[c % headers.length];
                        cell.style.fontWeight = "bold";
                        cell.style.backgroundColor = "#f9f9f9";
                    } else if (c === 0) {
                        fakeData = `2026/0${(r%9)+1}/15`;
                    } else if (c === 1) {
                        const depts = ["研发部", "市场部", "销售部", "HR", "财务部"];
                        fakeData = depts[r % depts.length];
                    } else if (c === 6) {
                        fakeData = (Math.random() * 40 + 60).toFixed(1) + "%";
                    } else {
                        // 随机财务数字
                        fakeData = (Math.random() * 100000).toFixed(2);
                        // 添加千分位
                        fakeData = fakeData.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                    }
                    
                    cell.innerText = fakeData;
                    originalData[r][c] = fakeData; // 保存原始数据用于老板键恢复

                    container.appendChild(cell);
                    grid[r][c] = cell;
                }
            }
        }

        // --- 游戏逻辑部分 ---
        function startGame() {
            if (isPlaying) return;
            isPlaying = true;
            score = 0;
            
            // 重置状态UI
            statusText.innerText = "数据分析运行中...";
            statusText.style.color = "#107c41";
            scoreText.style.display = "inline";
            scoreText.innerText = `核对异常数据: 0`;

            // 初始蛇位置 (居中)
            let startR = Math.floor(ROWS / 2);
            let startC = Math.floor(COLS / 2);
            snake = [
                { r: startR, c: startC },
                { r: startR, c: startC - 1 },
                { r: startR, c: startC - 2 }
            ];
            direction = { r: 0, c: 1 };
            nextDirection = { r: 0, c: 1 };

            clearGridColors();
            spawnFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, INITIAL_SPEED);
        }

        function stopGame(isBossKey = false) {
            isPlaying = false;
            clearInterval(gameInterval);
            
            if (isBossKey) {
                // 老板键触发：瞬间抹除痕迹
                clearGridColors();
                statusText.innerText = "就绪";
                statusText.style.color = "#333";
                scoreText.style.display = "none";
                activeCellName.innerText = "A1";
                formulaContent.innerText = "=SUM(C2:C10) * 1.05";
            } else {
                // 普通死亡
                statusText.innerText = "数据异常！[Enter] 重试，[Esc] 退出";
                statusText.style.color = "#d13438"; // 红色
            }
        }

        function clearGridColors() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    grid[r][c].classList.remove('snake-body', 'snake-head', 'food');
                    if (r === 0) {
                        grid[r][c].style.backgroundColor = "#f9f9f9";
                    } else {
                        grid[r][c].style.backgroundColor = "white";
                    }
                    grid[r][c].innerText = originalData[r][c]; // 恢复文字
                }
            }
        }

        function spawnFood() {
            let emptyCells = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    // 检查是否在蛇身上
                    let isSnake = snake.some(segment => segment.r === r && segment.c === c);
                    if (!isSnake) {
                        emptyCells.push({ r, c });
                    }
                }
            }
            if (emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                food = randomCell;
                
                // 更新UI显示
                const foodElem = grid[food.r][food.c];
                foodElem.classList.add('food');
                foodElem.innerText = "!!异常!!"; 
            }
        }

        function gameLoop() {
            direction = nextDirection;
            
            const head = snake[0];
            const newHead = {
                r: head.r + direction.r,
                c: head.c + direction.c
            };

            // 撞墙检测
            if (newHead.r < 0 || newHead.r >= ROWS || newHead.c < 0 || newHead.c >= COLS) {
                stopGame(false);
                return;
            }

            // 撞自己检测
            if (snake.some(segment => segment.r === newHead.r && segment.c === newHead.c)) {
                stopGame(false);
                return;
            }

            // 更新公式栏以增加伪装感
            activeCellName.innerText = `${getColName(newHead.c)}${newHead.r + 1}`;
            formulaContent.innerText = `=VLOOKUP(A${newHead.r + 1}, Data!$A$1:$D$500, 3, FALSE)`;

            snake.unshift(newHead);

            // 吃食物检测
            if (newHead.r === food.r && newHead.c === food.c) {
                score++;
                scoreText.innerText = `核对异常数据: ${score}`;
                grid[food.r][food.c].classList.remove('food');
                // 每吃5个，稍微加速一点 (封顶50ms)
                if (score % 5 === 0) {
                    let newSpeed = Math.max(50, INITIAL_SPEED - (score * 2));
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, newSpeed);
                }
                spawnFood();
            } else {
                // 没吃到食物，尾巴缩进
                const tail = snake.pop();
                grid[tail.r][tail.c].classList.remove('snake-body', 'snake-head');
                grid[tail.r][tail.c].innerText = originalData[tail.r][tail.c]; // 恢复该格子的数据
            }

            drawSnake();
        }

        function drawSnake() {
            // 先将所有蛇身标记为 body
            snake.forEach((segment, index) => {
                const cell = grid[segment.r][segment.c];
                cell.classList.remove('snake-head'); // 清除旧头
                cell.classList.add('snake-body');
                // 隐藏蛇身上的文字以凸显颜色块
                cell.innerText = ""; 
            });
            // 蛇头特殊样式
            grid[snake[0].r][snake[0].c].classList.add('snake-head');
        }

        // --- 事件监听 (按键控制) ---
        window.addEventListener('keydown', (e) => {
            // 防止滚动
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }

            // 老板键：Esc
            if (e.key === 'Escape') {
                stopGame(true); // true 代表瞬间隐藏
                return;
            }

            // 回车键：开始游戏
            if (e.key === 'Enter') {
                if (!isPlaying) {
                    startGame();
                }
                return;
            }

            if (!isPlaying) return;

            // 方向控制
            if (e.key === 'ArrowUp' && direction.r !== 1) {
                nextDirection = { r: -1, c: 0 };
            } else if (e.key === 'ArrowDown' && direction.r !== -1) {
                nextDirection = { r: 1, c: 0 };
            } else if (e.key === 'ArrowLeft' && direction.c !== 1) {
                nextDirection = { r: 0, c: -1 };
            } else if (e.key === 'ArrowRight' && direction.c !== -1) {
                nextDirection = { r: 0, c: 1 };
            }
        });

        // 屏蔽鼠标点击单元格，防止破坏 UI 布局
        container.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });

        // 初始化
        initSpreadsheet();

    </script>
</body>
</html>
