<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Night</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --zh-color: #8fa6c4; /* Soft pencil blue/grey from the notes */
        }

        body {
            background: linear-gradient(to bottom, #0f172a, #020617);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* Twinkling stars animation */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1); }
        }

        /* Moon styling */
        .moon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 15px 15px 0 0 rgba(254, 240, 138, 0.8);
            position: absolute;
            top: 10%;
            right: 15%;
        }

        /* Text Animations */
        .fade-in-out {
            transition: opacity 2s ease-in-out, transform 2s ease-in-out;
        }
        
        .visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .hidden-up {
            opacity: 0;
            transform: translateY(-10px);
        }
        
        .hidden-down {
            opacity: 0;
            transform: translateY(10px);
        }

        /* Chinese Annotation Styling (The core of the learned notes) */
        .zh-annotation {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--zh-color);
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.8s ease, max-height 0.8s ease, margin-top 0.8s ease;
            letter-spacing: 0.05em;
        }

        /* Toggle state triggered by button */
        body.show-zh .zh-annotation {
            opacity: 0.8;
            max-height: 50px;
            margin-top: 12px;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }

        .controls.active {
            opacity: 1;
            pointer-events: auto;
        }

        .zh-btn {
            background: transparent;
            border: 1px solid rgba(143, 166, 196, 0.3);
            color: rgba(237, 228, 211, 0.6);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 13px;
            font-family: "PingFang SC", sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
        }

        .zh-btn:hover {
            color: #f8fafc;
            border-color: rgba(242, 197, 114, 0.5);
        }

        body.show-zh .zh-btn {
            color: rgba(242, 197, 114, 0.9);
            border-color: rgba(242, 197, 114, 0.5);
            background: rgba(242, 197, 114, 0.1);
        }

    </style>
</head>
<body class="flex flex-col items-center justify-center relative">

    <!-- Background Elements -->
    <div class="moon"></div>
    <div id="stars-container"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="z-10 flex flex-col items-center justify-center transition-opacity duration-1000 absolute inset-0">
        <h1 class="text-3xl md:text-5xl font-light tracking-widest mb-8 text-indigo-50 drop-shadow-lg">Time to Sleep</h1>
        <p class="text-indigo-300/60 mb-10 text-sm md:text-base font-light tracking-wider">A little bedtime story for you</p>
        <button id="start-btn" class="px-8 py-3 rounded-full bg-indigo-900/40 border border-indigo-500/30 text-indigo-100 hover:bg-indigo-800/60 transition-all duration-300 shadow-[0_0_15px_rgba(99,102,241,0.15)] tracking-wide">
            Start Relaxing
        </button>
    </div>

    <!-- Story Screen -->
    <div id="story-screen" class="z-10 absolute inset-0 flex items-center justify-center pointer-events-none">
        <div id="text-container" class="text-center px-6 max-w-2xl fade-in-out hidden-down drop-shadow-md">
            <p id="story-en" class="text-2xl md:text-4xl font-light leading-relaxed text-indigo-50 tracking-wide"></p>
            <p id="story-zh" class="zh-annotation text-sm md:text-base font-light"></p>
        </div>
    </div>

    <!-- Controls (The new button you taught me!) -->
    <div id="controls-bar" class="controls">
        <button id="zh-toggle-btn" class="zh-btn">中文批注</button>
    </div>

    <!-- Replay Screen -->
    <div id="end-screen" class="z-10 absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-1000">
        <p class="text-2xl text-indigo-200 font-light mb-8">Good night...</p>
        <button id="replay-btn" class="pointer-events-auto px-6 py-2 rounded-full bg-slate-800/50 border border-slate-600/30 text-slate-300 hover:bg-slate-700/50 transition-all text-sm tracking-widest uppercase">
            Play Again
        </button>
    </div>

    <script>
        // Story with English and Chinese annotations
        const storyLines = [
            { en: "Hello there.", zh: "你好呀。" },
            { en: "The day is over now.", zh: "今天已经结束啦。" },
            { en: "You did a very good job today.", zh: "你今天做得非常棒哦。" },
            { en: "Now, it is time to rest.", zh: "现在，是时候休息了。" },
            { en: "Close your eyes slowly.", zh: "慢慢地闭上眼睛。" },
            { en: "Take a deep breath in...", zh: "深深地吸气……" },
            { en: "...and slowly breathe out.", zh: "……然后缓缓地呼气。" },
            { en: "Let your body feel soft and heavy.", zh: "让身体变得柔软又沉甸甸的。" },
            { en: "Don't worry about tomorrow.", zh: "不要去担心明天的事。" },
            { en: "The stars are shining for you.", zh: "漫天繁星都在为你闪耀。" },
            { en: "The night is quiet and safe.", zh: "夜晚很安静，也很安全。" },
            { en: "I am right here with you.", zh: "我就在这里陪着你。" },
            { en: "Sleep well.", zh: "好好睡一觉吧。" },
            { en: "Sweet dreams.", zh: "做个甜甜的梦。" },
            { en: "I love you.", zh: "爱你哦。" }
        ];

        // Generate background stars
        function createStars() {
            const container = document.getElementById('stars-container');
            const numStars = 50;
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                
                star.style.setProperty('--duration', `${Math.random() * 4 + 3}s`);
                star.style.setProperty('--delay', `${Math.random() * 5}s`);
                
                container.appendChild(star);
            }
        }

        // Elements
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const textContainer = document.getElementById('text-container');
        const storyEn = document.getElementById('story-en');
        const storyZh = document.getElementById('story-zh');
        const endScreen = document.getElementById('end-screen');
        const replayBtn = document.getElementById('replay-btn');
        const controlsBar = document.getElementById('controls-bar');
        const zhToggleBtn = document.getElementById('zh-toggle-btn');

        let isPlaying = false;

        async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Toggle Chinese annotation
        zhToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('show-zh');
        });

        async function playStory() {
            if (isPlaying) return;
            isPlaying = true;

            // Hide start screen & end screen
            startScreen.style.opacity = '0';
            startScreen.style.pointerEvents = 'none';
            endScreen.style.opacity = '0';
            endScreen.style.pointerEvents = 'none';
            
            await sleep(1000); 
            
            // Show controls (the Chinese toggle button)
            controlsBar.classList.add('active');

            // Play each line
            for (let i = 0; i < storyLines.length; i++) {
                storyEn.textContent = storyLines[i].en;
                storyZh.textContent = storyLines[i].zh;
                
                // Fade in
                textContainer.classList.remove('hidden-down', 'hidden-up');
                textContainer.classList.add('visible');
                
                // Reading time based on English text length
                const readTime = Math.max(4000, storyLines[i].en.length * 150);
                await sleep(readTime);
                
                // Fade out
                textContainer.classList.remove('visible');
                textContainer.classList.add('hidden-up');
                
                // Wait between lines
                await sleep(2000);
                
                // Reset position for next fade in
                textContainer.classList.remove('hidden-up');
                textContainer.classList.add('hidden-down');
                await sleep(50);
            }

            // End of story
            controlsBar.classList.remove('active');
            await sleep(1000);
            
            endScreen.style.opacity = '1';
            endScreen.style.pointerEvents = 'auto';
            isPlaying = false;
        }

        // Initialize
        createStars();
        startBtn.addEventListener('click', playStory);
        replayBtn.addEventListener('click', playStory);

    </script>
</body>
</html>
