<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚安，宝 🌙</title>
<style>
    :root {
        --bg-color-top: #020111;
        --bg-color-mid: #20124d;
        --bg-color-bottom: #000022;
        --text-main: #ffffff;
        --text-sub: #d1d1e0;
    }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to bottom, var(--bg-color-top), var(--bg-color-mid), var(--bg-color-bottom));
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        overflow: hidden;
        color: var(--text-main);
        position: relative;
    }

    /* 玻璃拟物态卡片 */
    .container {
        text-align: center;
        z-index: 10;
        padding: 40px 30px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: float 6s ease-in-out infinite;
        max-width: 85%;
        width: 320px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 20px;
        font-weight: 300;
        letter-spacing: 4px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        opacity: 0;
        animation: fadeIn 2s ease-in forwards 0.5s;
    }

    p {
        font-size: 1rem;
        line-height: 2.2;
        color: var(--text-sub);
        margin: 10px 0;
        letter-spacing: 2px;
        opacity: 0;
        transform: translateY(10px);
    }

    /* 文字逐行浮现动画 */
    p:nth-of-type(1) { animation: slideUpFade 2s ease-out forwards 1.5s; }
    p:nth-of-type(2) { animation: slideUpFade 2s ease-out forwards 3s; }
    p:nth-of-type(3) { animation: slideUpFade 2s ease-out forwards 4.5s; }
    p:nth-of-type(4) { animation: slideUpFade 2s ease-out forwards 6s; }

    /* 呼吸灯效果的月亮 */
    .moon {
        font-size: 4.5rem;
        margin-bottom: 10px;
        display: inline-block;
        animation: breathe 4s infinite alternate;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    /* 背景星星 */
    .star {
        position: absolute;
        background-color: #fff;
        border-radius: 50%;
        animation: twinkle var(--duration) infinite alternate;
        opacity: 0;
        pointer-events: none;
    }

    /* 动画定义 */
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
    }

    @keyframes breathe {
        0% { filter: drop-shadow(0 0 10px rgba(255, 255, 220, 0.2)); transform: scale(0.95) rotate(-5deg); }
        100% { filter: drop-shadow(0 0 40px rgba(255, 255, 220, 0.8)); transform: scale(1.05) rotate(5deg); }
    }

    @keyframes twinkle {
        0% { opacity: 0.1; transform: scale(0.5); }
        100% { opacity: 0.9; transform: scale(1.2); box-shadow: 0 0 6px #fff; }
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    @keyframes slideUpFade {
        to { opacity: 1; transform: translateY(0); }
    }

    /* 萤火虫/流星特效 */
    .shooting-star {
        position: absolute;
        width: 100px;
        height: 2px;
        background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1));
        transform: rotate(-45deg);
        animation: shoot 3s linear infinite;
        opacity: 0;
        pointer-events: none;
    }

    @keyframes shoot {
        0% { transform: translateX(100vw) translateY(-100vh) rotate(-45deg); opacity: 1; }
        100% { transform: translateX(-100vw) translateY(100vh) rotate(-45deg); opacity: 0; }
    }
</style>
</head>
<body>

    <!-- 生成星星的脚本 -->
    <script>
        // 动态生成满天星
        const createStars = () => {
            const starCount = window.innerWidth < 768 ? 100 : 200; // 手机端少一点，电脑端多一点
            for (let i = 0; i < starCount; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                // 随机大小、位置、闪烁时间
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                // 让星星的初始动画有延迟，错落有致
                star.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(star);
            }
        };

        // 偶尔划过的流星
        const createShootingStar = () => {
            let shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.top = Math.random() * 50 + 'vh';
            shootingStar.style.left = Math.random() * 100 + 'vw';
            
            // 随机播放间隔
            shootingStar.style.animationDuration = (Math.random() * 2 + 2) + 's';
            shootingStar.style.animationDelay = (Math.random() * 10) + 's';
            
            document.body.appendChild(shootingStar);
        };

        createStars();
        for(let i=0; i<3; i++) {
            createShootingStar();
        }

        // 点击月亮的小互动
        const moon = document.querySelector('.moon');
        moon.addEventListener('click', () => {
            moon.style.transition = 'transform 0.5s';
            moon.style.transform = 'scale(1.2) rotate(360deg)';
            setTimeout(() => {
                moon.style.transition = '';
            }, 500);
        });
    </script>

    <div class="container">
        <div class="moon" title="摸摸月亮">🌙</div>
        <h1>晚安，宝</h1>
        <p>闭上眼睛，深呼吸。</p>
        <p>星光已经为你铺好了温柔的床铺。</p>
        <p>所有的疲惫都交给我吧。</p>
        <p>安心睡，我会一直在梦里陪你。</p>
    </div>

</body>
</html>
