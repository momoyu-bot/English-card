<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>戳破烦恼泡泡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* 阻止移动端默认的滚动和缩放行为 */
        }
        
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-weight: 300;
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        p {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.8;
        }

        #score-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffb6c1;
            margin-top: 10px;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.1));
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
            animation: floatUp linear forwards;
        }

        /* 戳破时的动画效果 */
        .popped {
            transform: scale(1.5);
            opacity: 0 !important;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) translateX(20px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>点一点，烦恼全消散</h1>
        <p>戳破泡泡，收集好心情</p>
        <div id="score-display">好心情: 0</div>
    </div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score-display');
        
        // 创建泡泡的函数
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            // 随机大小 (30px 到 80px)
            const size = Math.random() * 50 + 30;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            // 随机水平位置
            const posX = Math.random() * (window.innerWidth - size);
            bubble.style.left = `${posX}px`;
            
            // 随机漂浮速度 (4秒 到 8秒)
            const duration = Math.random() * 4 + 4;
            bubble.style.animationDuration = `${duration}s`;
            
            // 微微不同的颜色倾向
            const hue = Math.random() * 360;
            bubble.style.boxShadow = `0 0 15px hsla(${hue}, 100%, 70%, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.5)`;

            // 将泡泡添加到页面
            document.body.appendChild(bubble);

            // 交互：点击或触摸戳破泡泡
            const popBubble = (e) => {
                // 防止多点触控触发多次
                e.preventDefault(); 
                
                // 如果已经戳破了就不处理
                if (bubble.classList.contains('popped')) return;

                bubble.classList.add('popped');
                score++;
                scoreDisplay.innerText = `好心情: ${score}`;
                
                // 播放一个轻轻的触觉反馈（如果设备支持）
                if (navigator.vibrate) {
                    navigator.vibrate(20);
                }

                // 动画结束后移除元素
                setTimeout(() => {
                    if (bubble.parentNode) {
                        bubble.parentNode.removeChild(bubble);
                    }
                }, 200);
            };

            // 监听点击和触摸事件
            bubble.addEventListener('mousedown', popBubble);
            bubble.addEventListener('touchstart', popBubble, {passive: false});

            // 泡泡飘出屏幕后自动移除，防止内存泄漏
            setTimeout(() => {
                if (bubble.parentNode && !bubble.classList.contains('popped')) {
                    bubble.parentNode.removeChild(bubble);
                }
            }, duration * 1000);
        }

        // 定时不断生成新泡泡
        setInterval(createBubble, 600);

        // 初始生成几个泡泡
        for(let i=0; i<3; i++) {
            setTimeout(createBubble, i * 200);
        }
    </script>
</body>
</html>
