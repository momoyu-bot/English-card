<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作管理系统 v2.1</title>
<meta name="description" content="躲避红色的“紧急任务”，收集蓝色的“续命咖啡”。遇到危险请立即按下老板键 ESC。"> <!-- Sneaky title -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling */
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }

        #game-canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            cursor: none; /* Hide cursor in game */
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 10;
            border-radius: 12px;
        }

        #boss-screen {
            font-family: 'Calibri', 'Arial', sans-serif;
            background-color: #fff;
            color: #000;
        }
        
        .excel-ribbon {
            background-color: #217346;
            color: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .excel-toolbar {
            background-color: #f3f2f1;
            border-bottom: 1px solid #e1dfdd;
            padding: 6px 12px;
            display: flex;
            gap: 15px;
            font-size: 13px;
        }

        .excel-formula-bar {
            background-color: #fff;
            border-bottom: 1px solid #e1dfdd;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            font-size: 13px;
        }

        .excel-grid {
            display: grid;
            grid-template-columns: 40px repeat(10, minmax(100px, 1fr));
            grid-auto-rows: 24px;
            overflow: hidden;
            height: calc(100vh - 100px);
        }

        .excel-cell {
            border-right: 1px solid #e1dfdd;
            border-bottom: 1px solid #e1dfdd;
            padding: 2px 6px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .excel-header {
            background-color: #f3f2f1;
            text-align: center;
            font-weight: bold;
            color: #605e5c;
        }
        
        .excel-row-header {
            background-color: #f3f2f1;
            text-align: center;
            color: #605e5c;
        }

        .selected-cell {
            border: 2px solid #217346 !important;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

    <!-- GAME CONTAINER -->
    <div id="game-container" class="relative w-full h-full flex flex-col items-center justify-center bg-slate-900 text-white">
        
        <div class="absolute top-6 left-8 text-slate-400 font-mono text-sm">
            <span class="text-emerald-400 animate-pulse font-bold border border-emerald-400 px-2 py-1 rounded">老板键: ESC</span>
        </div>

        <div class="absolute top-6 right-8 text-xl font-bold text-slate-200">
            得分: <span id="score-display">0</span>
        </div>

        <div class="relative">
            <canvas id="game-canvas" width="800" height="600"></canvas>
            <div class="crt-overlay"></div>
            
            <!-- Start / Game Over Screen Overlay -->
            <div id="menu-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 rounded-xl z-20 backdrop-blur-sm">
                <h1 id="menu-title" class="text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">周一摸鱼生存战</h1>
                <p id="menu-subtitle" class="text-slate-300 mb-8 max-w-md text-center">躲避红色的“紧急任务”，收集蓝色的“续命咖啡”。使用鼠标移动。</p>
                <button id="start-btn" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-full shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all transform hover:scale-105 active:scale-95">
                    开始摸鱼
                </button>
            </div>
        </div>
        
        <div class="mt-6 text-slate-500 text-sm max-w-lg text-center">
            操作说明：移动鼠标控制绿色小球。躲避红色方块。收集蓝色圆圈获得额外加分。遇到危险请立即按下 <strong>ESC</strong> 键隐藏屏幕！
        </div>
    </div>

    <!-- FAKE BOSS SCREEN (EXCEL CLONE) -->
    <div id="boss-screen" class="hidden absolute inset-0 z-50 w-full h-full flex flex-col">
        <!-- Ribbon -->
        <div class="excel-ribbon">
            <div class="font-semibold text-lg flex items-center gap-3">
                <svg viewBox="0 0 24 24" fill="white" width="18" height="18"><path d="M21.17 3.25q.33 0 .59.25.24.24.24.58v15.84q0 .34-.24.58-.26.25-.59.25H2.83q-.33 0-.59-.25-.24-.24-.24-.58V4.08q0-.34.24-.58.26-.25.59-.25zM14 11.75V5H4v14h10v-6.75h6V11.75zM15 13v4.75h4V13zM15 5v5.75h4V5z"/></svg>
                Q3_财务预测_最终版_v3.xlsx - Excel
            </div>
        </div>
        
        <!-- Toolbar -->
        <div class="excel-toolbar">
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer">文件</span>
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer font-bold border-b-2 border-green-600">开始</span>
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer">插入</span>
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer">页面布局</span>
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer">公式</span>
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer">数据</span>
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer">审阅</span>
            <span class="hover:bg-gray-200 px-2 rounded cursor-pointer">视图</span>
        </div>

        <!-- Formula Bar -->
        <div class="excel-formula-bar text-gray-600">
            <span class="font-bold border-r pr-2 mr-2 border-gray-300">C7</span>
            <span class="text-green-700 font-bold mr-2">fx</span>
            <span class="flex-1 text-black">=SUM(C2:C6) * 1.15</span>
        </div>

        <!-- Grid Container -->
        <div class="excel-grid" id="excel-grid-container">
            <!-- Headers and Cells generated via JS to keep HTML clean -->
        </div>
        
        <!-- Bottom Status Bar -->
        <div class="bg-gray-100 border-t border-gray-300 px-4 py-1 text-xs text-gray-600 flex justify-between">
            <span>就绪</span>
            <div class="flex gap-4">
                <span>平均值: 45,230.12</span>
                <span>计数: 15</span>
                <span>求和: 678,451.80</span>
                <span>100% &nbsp; - [======|] +</span>
            </div>
        </div>
    </div>

    <script>
        // --- GAME LOGIC ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const menuOverlay = document.getElementById('menu-overlay');
        const startBtn = document.getElementById('start-btn');
        const menuTitle = document.getElementById('menu-title');
        const menuSubtitle = document.getElementById('menu-subtitle');

        // Game State
        let isPlaying = false;
        let animationId;
        let score = 0;
        let frameCount = 0;
        let difficultyMultiplier = 1;

        // Player Object
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            size: 20,
            color: '#10b981', // Tailwind Emerald 500
            speed: 0
        };

        // Entities Arrays
        let obstacles = [];
        let collectibles = [];
        let particles = [];

        // Mouse tracking
        let mouseX = canvas.width / 2;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        // Touch support for mobile/trackpads
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
        }, { passive: false });

        startBtn.addEventListener('click', startGame);

        function spawnObstacle() {
            const size = Math.random() * 25 + 15;
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: (Math.random() * 3 + 2) * difficultyMultiplier,
                color: '#ef4444', // Tailwind Red 500 (Urgent Tasks)
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function spawnCollectible() {
            collectibles.push({
                x: Math.random() * (canvas.width - 20),
                y: -20,
                radius: 10,
                speed: (Math.random() * 2 + 1.5) * difficultyMultiplier,
                color: '#3b82f6' // Tailwind Blue 500 (Coffee)
            });
        }

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color
                });
            }
        }

        function update() {
            if (!isPlaying) return;

            // Player movement (smooth follow mouse)
            player.x += (mouseX - player.x) * 0.15;
            
            // Constrain player
            if (player.x < player.size) player.x = player.size;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;

            frameCount++;
            if (frameCount % 60 === 0) score++;
            
            // Increase difficulty over time
            difficultyMultiplier = 1 + (score / 500);

            // Spawning logic
            if (frameCount % Math.max(15, Math.floor(40 / difficultyMultiplier)) === 0) {
                spawnObstacle();
            }
            if (frameCount % 120 === 0) {
                spawnCollectible();
            }

            scoreDisplay.innerText = score;

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;
                obs.rotation += obs.rotationSpeed;

                // Collision detection (Circle vs Rect approx)
                let dx = player.x - (obs.x + obs.size/2);
                let dy = player.y - (obs.y + obs.size/2);
                let distance = Math.sqrt(dx*dx + dy*dy);

                if (distance < player.size + (obs.size/2) - 4) {
                    gameOver();
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // Update Collectibles
            for (let i = collectibles.length - 1; i >= 0; i--) {
                let col = collectibles[i];
                col.y += col.speed;

                let dx = player.x - col.x;
                let dy = player.y - col.y;
                let distance = Math.sqrt(dx*dx + dy*dy);

                if (distance < player.size + col.radius) {
                    score += 50;
                    createParticles(col.x, col.y, col.color);
                    collectibles.splice(i, 1);
                } else if (col.y > canvas.height) {
                    collectibles.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0f172a'; // Match background
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines for movement effect
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            let offset = (frameCount * 2) % 40;
            for(let y = offset; y < canvas.height; y += 40) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Collectibles
            collectibles.forEach(col => {
                ctx.fillStyle = col.color;
                ctx.beginPath();
                ctx.arc(col.x, col.y, col.radius, 0, Math.PI * 2);
                ctx.fill();
                // Inner glow
                ctx.fillStyle = '#93c5fd';
                ctx.beginPath();
                ctx.arc(col.x - 2, col.y - 2, col.radius/2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Obstacles
            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x + obs.size/2, obs.y + obs.size/2);
                ctx.rotate(obs.rotation);
                ctx.fillStyle = obs.color;
                // Add a border to obstacles
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#991b1b';
                ctx.fillRect(-obs.size/2, -obs.size/2, obs.size, obs.size);
                ctx.strokeRect(-obs.size/2, -obs.size/2, obs.size, obs.size);
                
                // Exclamation mark indicating "urgent task"
                ctx.fillStyle = 'white';
                ctx.font = `bold ${obs.size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('!', 0, 0);
                
                ctx.restore();
            });

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            // Player core
            ctx.fillStyle = '#6ee7b7';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size/2, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            if (!isPlaying) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            frameCount = 0;
            difficultyMultiplier = 1;
            obstacles = [];
            collectibles = [];
            particles = [];
            player.x = canvas.width / 2;
            isPlaying = true;
            menuOverlay.classList.add('hidden');
            scoreDisplay.innerText = score;
            gameLoop();
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            createParticles(player.x, player.y, player.color);
            draw(); // Draw final state with particles
            
            setTimeout(() => {
                menuTitle.innerText = "社畜当场阵亡！";
                menuTitle.className = "text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500";
                menuSubtitle.innerText = `摸鱼得分：${score}。该去接杯水了吧？`;
                startBtn.innerText = "再摸一次";
                menuOverlay.classList.remove('hidden');
            }, 500);
        }

        // --- BOSS KEY LOGIC & FAKE UI GENERATION ---
        const excelGrid = document.getElementById('excel-grid-container');
        let isBossScreenActive = false;

        function populateExcelGrid() {
            // Columns A-J
            const columns = ['', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
            
            // Headers
            columns.forEach(col => {
                const div = document.createElement('div');
                div.className = 'excel-cell excel-header';
                div.innerText = col;
                excelGrid.appendChild(div);
            });

            // Rows
            const departments = ['市场部', '研发部', '销售部', '人事部', '运营部', '财务部', '法务部'];
            const statuses = ['待处理', '已完成', '进行中', '已延期', '审核中'];

            for (let i = 1; i <= 35; i++) {
                // Row Number
                const rowHead = document.createElement('div');
                rowHead.className = 'excel-cell excel-row-header';
                rowHead.innerText = i;
                excelGrid.appendChild(rowHead);

                // Populate 10 cells per row
                for(let j = 1; j <= 10; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'excel-cell';
                    
                    // Add fake realistic data
                    if (i === 1) {
                        // Table headers
                        const headers = ['项目编号', '负责部门', 'Q1 实际', 'Q2 实际', 'Q3 预测', '状态', '偏差', '风险等级', '负责人', '备注'];
                        cell.innerText = headers[j-1];
                        cell.style.fontWeight = 'bold';
                        cell.style.backgroundColor = '#f3f2f1';
                    } else {
                        if (j === 1) cell.innerText = `PRJ-${1000 + i}`;
                        else if (j === 2) cell.innerText = departments[Math.floor(Math.random() * departments.length)];
                        else if (j >= 3 && j <= 5) {
                            const val = (Math.random() * 100000).toFixed(2);
                            cell.innerText = `¥${val.replace(/\B(?=(\d{3})+(?!\d))/g, ",")}`;
                            cell.style.textAlign = 'right';
                        }
                        else if (j === 6) cell.innerText = statuses[Math.floor(Math.random() * statuses.length)];
                        else if (j === 7) {
                            const variance = ((Math.random() - 0.5) * 15).toFixed(1);
                            cell.innerText = `${variance}%`;
                            cell.style.color = variance < 0 ? 'red' : 'green';
                            cell.style.textAlign = 'right';
                        }
                        else if (j === 8) {
                            const risks = ['低', '中', '高'];
                            cell.innerText = risks[Math.floor(Math.random() * risks.length)];
                        }
                        else if (j === 9) cell.innerText = ['张三', '李四', '王五', '赵六'][Math.floor(Math.random() * 4)];
                        
                        // Fake selection box on a specific cell to look active
                        if (i === 7 && j === 4) {
                            cell.classList.add('selected-cell');
                        }
                    }
                    excelGrid.appendChild(cell);
                }
            }
        }

        populateExcelGrid();

        function toggleBossScreen() {
            isBossScreenActive = !isBossScreenActive;
            const gameContainer = document.getElementById('game-container');
            const bossScreen = document.getElementById('boss-screen');

            if (isBossScreenActive) {
                // HIDE GAME, SHOW WORK
                gameContainer.classList.add('hidden');
                bossScreen.classList.remove('hidden');
                
                // Pause game logic
                if (isPlaying) {
                    cancelAnimationFrame(animationId);
                }
            } else {
                // SHOW GAME, HIDE WORK
                bossScreen.classList.add('hidden');
                gameContainer.classList.remove('hidden');
                
                // Resume game logic
                if (isPlaying) {
                    // Update mouse position to current to prevent jump
                    // (Requires re-capturing mouse on next move)
                    gameLoop();
                }
            }
        }

        // Listen for the Escape Key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                toggleBossScreen();
            }
        });

        // Initial draw to show something before clicking start
        draw();
    </script>
</body>
</html>
