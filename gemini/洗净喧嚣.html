<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洗净喧嚣</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background-color: #020617; overflow: hidden; touch-action: none; margin: 0; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .text-fade { transition: opacity 2s ease-in-out; }
</style>
</head>
<body class="flex items-center justify-center h-screen relative">
    <canvas id="canvas"></canvas>
    <div id="msg" class="text-fade absolute text-blue-200/60 text-xl font-light tracking-[0.5em] pointer-events-none select-none text-center" style="font-family: 'PingFang SC', sans-serif;">
        点击屏幕
<span class="text-sm mt-4 block tracking-widest text-blue-200/40">洗掉所有吵闹的代码</span>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let ripples = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // 音频上下文 (用户交互后启动)
    let audioCtx;

    function playSoftTone() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const filterNode = audioCtx.createBiquadFilter();
        
        // 温柔的正弦波
        osc.type = 'sine';
        
        // 低通滤波器让声音更圆润闷厚，不刺耳
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 800;

        // 随机产生一个低沉舒缓的频率 (大三和弦的几个音)
        const notes = [261.63, 329.63, 392.00, 523.25];
        // 降低八度，更适合哄睡
        osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)] * 0.5, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.8); // 缓慢淡入
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4); // 极慢淡出

        osc.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 4);
    }

    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = Math.max(width, height) * 1.5;
            this.speed = 2;
            this.alpha = 0.6;
            // 随机选取温柔的深蓝色/青色系
            const colors = ['14, 165, 233', '56, 189, 248', '125, 211, 252', '167, 139, 250'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // 内部填充极其微弱的光晕
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha * 0.05})`;
            ctx.fill();
        }
        update() {
            this.radius += this.speed;
            this.speed *= 1.015; // 缓慢加速扩散
            this.alpha = Math.max(0, 0.6 - (this.radius / this.maxRadius));
        }
    }

    function animate() {
        // 半透明纯黑底色填充，产生柔和的拖尾效果
        ctx.fillStyle = 'rgba(2, 6, 23, 0.08)';
        ctx.fillRect(0, 0, width, height);

        for (let i = ripples.length - 1; i >= 0; i--) {
            ripples[i].update();
            ripples[i].draw();
            if (ripples[i].alpha <= 0) {
                ripples.splice(i, 1);
            }
        }
        requestAnimationFrame(animate);
    }
    animate();

    const msg = document.getElementById('msg');
    let msgHidden = false;

    function triggerRipple(e) {
        // 第一次点击后更换文字
        if (!msgHidden) {
            msg.style.opacity = '0';
            msgHidden = true;
            setTimeout(() => {
                msg.innerHTML = "什么都不要想了...
<span class='text-sm mt-4 block tracking-widest text-blue-200/40'>乖乖睡吧，宝。</span>";
                msg.style.opacity = '1';
                
                // 10秒后彻底隐藏文字，只留纯净画面
                setTimeout(() => {
                    msg.style.opacity = '0';
                }, 10000);
            }, 2000);
        }

        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        
        ripples.push(new Ripple(x, y));
        playSoftTone();
    }

    window.addEventListener('mousedown', triggerRipple);
    window.addEventListener('touchstart', triggerRipple);

</script>
</body>
</html>
