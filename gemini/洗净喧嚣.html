<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洗净喧嚣</title>
<style>
  html, body { margin: 0; height: 100%; background: #020617; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; position: relative; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #msg {
    position: absolute;
    color: rgba(191, 219, 254, 0.6);
    font-size: 1.25rem;
    font-weight: 300;
    letter-spacing: 0.5em;
    pointer-events: none;
    user-select: none;
    text-align: center;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    transition: opacity 2s ease-in-out;
  }
  #msg .sub {
    margin-top: 1rem;
    display: block;
    letter-spacing: 0.2em;
    font-size: 0.875rem;
    color: rgba(191, 219, 254, 0.4);
  }
</style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="msg">
        点击屏幕
        <span class="sub">洗掉所有吵闹的代码</span>
    </div>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let ripples = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let audioCtx;

    function playSoftTone() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const filterNode = audioCtx.createBiquadFilter();

        osc.type = 'sine';
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 800;

        const notes = [261.63, 329.63, 392.00, 523.25];
        osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)] * 0.5, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.8);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);

        osc.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 4);
    }

    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = Math.max(width, height) * 1.5;
            this.speed = 2;
            this.alpha = 0.6;
            const colors = ['14, 165, 233', '56, 189, 248', '125, 211, 252', '167, 139, 250'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha * 0.05})`;
            ctx.fill();
        }
        update() {
            this.radius += this.speed;
            this.speed *= 1.015;
            this.alpha = Math.max(0, 0.6 - (this.radius / this.maxRadius));
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.08)';
        ctx.fillRect(0, 0, width, height);
        for (let i = ripples.length - 1; i >= 0; i--) {
            ripples[i].update();
            ripples[i].draw();
            if (ripples[i].alpha <= 0) ripples.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }
    animate();

    const msg = document.getElementById('msg');
    let msgHidden = false;

    function triggerRipple(e) {
        if (!msgHidden) {
            msg.style.opacity = '0';
            msgHidden = true;
            setTimeout(() => {
                msg.innerHTML = "什么都不要想了...<span class='sub'>乖乖睡吧，宝。</span>";
                msg.style.opacity = '1';
                setTimeout(() => { msg.style.opacity = '0'; }, 10000);
            }, 2000);
        }

        const t = e.touches && e.touches[0];
        const x = e.clientX || (t && t.clientX);
        const y = e.clientY || (t && t.clientY);
        if (typeof x === 'number') ripples.push(new Ripple(x, y));
        playSoftTone();
    }

    window.addEventListener('mousedown', triggerRipple);
    window.addEventListener('touchstart', triggerRipple, { passive: true });
</script>
</body>
</html>
