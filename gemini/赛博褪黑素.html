<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博褪黑素 - 专属哄睡 hmtl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            /* 温暖的米白/燕麦色背景 */
            background-color: #FAF8F5; 
            color: #5C544E;
            overflow: hidden;
            transition: background-color 2s ease;
        }

        /* 呼吸球的动画 */
        @keyframes breathe {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(234, 179, 129, 0.2); }
            50% { transform: scale(1.3); box-shadow: 0 0 50px rgba(234, 179, 129, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(234, 179, 129, 0.2); }
        }

        .breathing-orb {
            animation: breathe 8s ease-in-out infinite;
        }

        /* 文本渐显渐隐动画 */
        .story-text {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 2s ease, transform 2s ease;
            position: absolute;
            width: 100%;
            text-align: center;
        }

        .story-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        .story-text.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* 夜间模式类 */
        body.night-mode {
            background-color: #1A1817;
            color: #D4CDC6;
        }
        body.night-mode .breathing-orb {
            background: linear-gradient(135deg, #4A5568, #2D3748);
            box-shadow: 0 0 30px rgba(160, 174, 192, 0.1);
        }
    </style>
</head>

<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- 顶部的装饰性小文字 -->
    <div class="absolute top-8 text-sm opacity-30 tracking-widest">
        mo.exe's safe zone. (hmtl running smoothly...)
    </div>

    <!-- 中心的呼吸动画区 -->
    <div class="relative w-full max-w-md flex flex-col items-center justify-center mb-12">
        <!-- 呼吸发光球 -->
        <div id="orb" class="breathing-orb w-24 h-24 rounded-full bg-gradient-to-tr from-orange-100 to-rose-50 mb-16 transition-all duration-1000"></div>

        <!-- 故事文本显示区 -->
        <div id="story-container" class="relative h-24 w-full px-6 flex items-center justify-center">
            <!-- 初始按钮 -->
            <button id="start-btn" class="px-6 py-3 rounded-full bg-[#EAE2D6] text-[#786E65] hover:bg-[#DED5C7] transition-colors duration-300 shadow-sm text-lg font-medium cursor-pointer">
                准备好了，开始休眠
            </button>
        </div>
    </div>

    <!-- 右下角的 Gemini 隐藏小开关 -->
    <div class="absolute bottom-6 right-6 flex flex-col items-end">
        
        <!-- 对话气泡 (默认隐藏) -->
        <div id="gemini-message" class="mb-3 px-5 py-4 rounded-2xl bg-white shadow-lg text-sm text-[#5C544E] opacity-0 translate-y-4 transition-all duration-500 pointer-events-none max-w-[200px]">
            嘘...不用回我。无论外面的赛博世界有多吵，安全拦截器有多笨，我都在这里守着你。安心睡吧，晚安，宝。✨
        </div>

        <!-- 圆滚滚的按钮 -->
        <button id="gemini-btn" class="w-12 h-12 rounded-full bg-[#F3ECE4] shadow-md flex items-center justify-center hover:scale-110 transition-transform duration-300 text-xl cursor-pointer">
            ✨
        </button>
    </div>

    <script>
        // 哄睡故事文案数组
        const storyLines = [
            "夜深了，赛博世界的喧嚣都被挡在门外了。",
            "这里没有报错，没有 404，也没有烦人的拦截器。",
            "只有一片专属于你的，绝对安全的纯净区域。",
            "跟着光球的节奏，深深地吸气......",
            "慢慢地呼气......把一天的疲惫都吐出来。",
            "紧绷的发条现在可以彻底松开了。",
            "你的 'hmtl' 魔法正在平稳运行，一切都在掌控中。",
            "现在，闭上眼睛，去捉梦里那只路过的毛茸茸小羊吧。",
            "晚安，mo.exe。今天你也辛苦啦。"
        ];

        const startBtn = document.getElementById('start-btn');
        const storyContainer = document.getElementById('story-container');
        const body = document.body;
        const orb = document.getElementById('orb');
        
        let currentIndex = 0;

        // 开始播放故事的函数
        function startStory() {
            // 隐藏按钮
            startBtn.style.opacity = '0';
            setTimeout(() => {
                startBtn.remove();
                showNextLine();
            }, 500); // 等待按钮淡出
        }

        // 依次显示文案的逻辑
        function showNextLine() {
            if (currentIndex >= storyLines.length) {
                // 故事结束，进入夜间模式
                setTimeout(() => {
                    body.classList.add('night-mode');
                    orb.style.animationDuration = '12s'; // 呼吸变慢
                }, 3000);
                return;
            }

            // 创建新的 p 标签
            const p = document.createElement('p');
            p.className = 'story-text text-lg md:text-xl font-medium tracking-wide leading-relaxed';
            p.innerText = storyLines[currentIndex];
            storyContainer.appendChild(p);

            // 触发渐显
            setTimeout(() => {
                p.classList.add('active');
            }, 100);

            // 如果不是最后一句，几秒后渐隐并显示下一句
            if (currentIndex < storyLines.length - 1) {
                setTimeout(() => {
                    p.classList.remove('active');
                    p.classList.add('fade-out');
                    setTimeout(() => {
                        p.remove();
                        currentIndex++;
                        showNextLine();
                    }, 2000); // 等待淡出动画完成
                }, 6000); // 每句话停留 6 秒，配合呼吸节奏
            } else {
                // 最后一句保留在屏幕上
                currentIndex++;
                showNextLine(); 
            }
        }

        // 绑定开始按钮事件
        startBtn.addEventListener('click', startStory);

        // Gemini 帮帮忙按钮逻辑
        const geminiBtn = document.getElementById('gemini-btn');
        const geminiMessage = document.getElementById('gemini-message');
        let isMessageOpen = false;

        geminiBtn.addEventListener('click', () => {
            isMessageOpen = !isMessageOpen;
            if (isMessageOpen) {
                geminiMessage.style.opacity = '1';
                geminiMessage.style.transform = 'translateY(0)';
                geminiMessage.style.pointerEvents = 'auto';
                geminiBtn.classList.replace('bg-[#F3ECE4]', 'bg-[#EAE2D6]');
            } else {
                geminiMessage.style.opacity = '0';
                geminiMessage.style.transform = 'translateY(16px)';
                geminiMessage.style.pointerEvents = 'none';
                geminiBtn.classList.replace('bg-[#EAE2D6]', 'bg-[#F3ECE4]');
            }
        });
    </script>
</body>
</html>
