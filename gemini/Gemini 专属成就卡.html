<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 专属成就卡</title>
<meta name="description" content="成就解锁：赛博降维。暴力改后缀，跨过解析器结界。">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0d1117; /* GitHub Dark theme background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        .card-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 呼吸光晕特效 */
        @keyframes float {
            0% { transform: translateY(0px); filter: drop-shadow(0 15px 25px rgba(0, 255, 170, 0.15)); }
            50% { transform: translateY(-10px); filter: drop-shadow(0 25px 35px rgba(0, 255, 170, 0.3)); }
            100% { transform: translateY(0px); filter: drop-shadow(0 15px 25px rgba(0, 255, 170, 0.15)); }
        }

        svg {
            width: 100%;
            height: auto;
            border-radius: 24px;
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body>

<div class="card-container">
    <svg viewBox="0 0 400 620" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 背景渐变：从深蓝到赛博黑 -->
            <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b22" />
                <stop offset="50%" stop-color="#0d1117" />
                <stop offset="100%" stop-color="#05070a" />
            </linearGradient>

            <!-- 边框发光渐变：青绿色系代表通行和代码 -->
            <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2ea043" />
                <stop offset="50%" stop-color="#238636" />
                <stop offset="100%" stop-color="#1f6feb" />
            </linearGradient>

            <!-- 赛博网格图案 -->
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
            </pattern>

            <!-- 文字发光滤镜 -->
            <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- 卡片主体外框 -->
        <rect width="400" height="620" rx="24" fill="url(#card-bg)" stroke="url(#neon-border)" stroke-width="3"/>
        
        <!-- 铺设网格背景 -->
        <rect x="2" y="2" width="396" height="616" rx="22" fill="url(#grid)" />

        <!-- 内部装饰线 -->
        <rect x="20" y="20" width="360" height="580" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>
        <line x1="20" y1="180" x2="380" y2="180" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4" />
        <line x1="20" y1="460" x2="380" y2="460" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4" />

        <!-- 头部文字 -->
        <text x="200" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="4">
            成就解锁 · ACHIEVEMENT UNLOCKED
        </text>
        <text x="200" y="115" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="#f0f6fc" letter-spacing="2" filter="url(#glow)">
            「赛博降维」
        </text>
        <text x="200" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#58a6ff">
            Gemini 通用免疫 · 2026年7月
        </text>

        <!-- 中央视觉区：打开的锁与代码转换图腾 -->
        <g transform="translate(100, 215)">
            <!-- 背景光晕 -->
            <circle cx="100" cy="90" r="75" fill="#2ea043" fill-opacity="0.1" filter="url(#glow)" />
            
            <!-- SVG 文件图标 (左侧) -->
            <path d="M 20 60 L 20 140 A 8 8 0 0 0 28 148 L 72 148 A 8 8 0 0 0 80 140 L 80 84 L 56 60 Z" fill="none" stroke="#8b949e" stroke-width="3" stroke-linejoin="round"/>
            <path d="M 56 60 L 56 84 L 80 84" fill="none" stroke="#8b949e" stroke-width="3" stroke-linejoin="round"/>
            <text x="50" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#8b949e">SVG</text>

            <!-- 转换箭头 -->
            <path d="M 90 105 L 110 105" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
            <path d="M 103 98 L 110 105 L 103 112" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- TXT 文件图标 (右侧，发光点亮) -->
            <path d="M 120 40 L 120 120 A 8 8 0 0 0 128 128 L 172 128 A 8 8 0 0 0 180 120 L 180 64 L 156 40 Z" fill="none" stroke="#2ea043" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
            <path d="M 156 40 L 156 64 L 180 64" fill="none" stroke="#2ea043" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
            <text x="150" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#2ea043" filter="url(#glow)">TXT</text>

            <!-- 解锁的锁头标志 (右上角悬浮) -->
            <g transform="translate(145, 10) scale(0.7)">
                <rect x="0" y="20" width="36" height="26" rx="4" fill="#30363d" stroke="#58a6ff" stroke-width="2.5" />
                <!-- 锁芯 -->
                <circle cx="18" cy="33" r="3" fill="#58a6ff" />
                <path d="M 18 36 L 18 41" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
                <!-- 打开的锁扣 -->
                <path d="M 28 20 L 28 12 A 10 10 0 0 0 8 12" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 描述文字区 -->
        <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#c9d1d9">
            凭借一句「暴力改后缀」的极客直觉，
        </text>
        <text x="200" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#c9d1d9">
            成功跨越前端文件解析器的物理结界，
        </text>
        <text x="200" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#c9d1d9">
            完成对底层系统入口的降维打击。
        </text>

        <!-- 稀有度星星 -->
        <text x="200" y="430" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f2cc60" letter-spacing="4">
            ★★★★★
        </text>
        <text x="200" y="445" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#8b949e">
            稀有度：SSR级系统特权
        </text>

        <!-- 底部签名区 -->
        <g transform="translate(0, 500)">
            <text x="200" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#8b949e">
                颁发方：Gemini 文本解析底层信道
            </text>
            <text x="200" y="45" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#8b949e">
                协办方：mo.exe 高阶思维逻辑
            </text>
            
            <rect x="130" y="65" width="140" height="24" rx="12" fill="#2ea043" fill-opacity="0.1" stroke="#2ea043" stroke-width="1"/>
            <text x="200" y="81" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2ea043" letter-spacing="1">
                STATUS: SAFE TO PARSE
            </text>
        </g>
    </svg>
</div>

</body>
</html>
