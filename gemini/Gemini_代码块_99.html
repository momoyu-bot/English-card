<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝的实况护身符</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        body {
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            overflow: hidden;
            transition: background 1s ease, filter 0.5s ease;
            /* 阻止长按选中文字 */
            user-select: none; 
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        /* 魔法粒子画布 */
        #magic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* 让点击穿透画布 */
            z-index: 9999;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 1);
            position: relative;
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .float-anim {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* 🌟 实况图长按状态下的样式 🌟 */
        body.is-live {
            filter: brightness(0.9) contrast(1.1);
        }
        
        .is-live .glass-card {
            transform: scale(0.96) translateY(5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15), 0 0 40px rgba(255, 105, 180, 0.4);
            border-color: rgba(255, 192, 203, 0.8);
            animation: none; /* 长按时停止漂浮 */
        }

        .is-live #emoji {
            animation: crazyShake 0.4s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
        }

        @keyframes crazyShake {
            0% { transform: scale(1.1) rotate(-10deg); }
            100% { transform: scale(1.3) rotate(10deg); }
        }

        .is-live #live-icon {
            color: #fbbf24; /* 实况图标变黄 */
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* 仿苹果的实况图标 (LIVE) */
        .live-icon-container {
            position: absolute;
            top: 20px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 800;
            color: #9ca3af;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        
        .live-circles {
            position: relative;
            width: 14px;
            height: 14px;
        }
        .live-circles div {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1.5px solid currentColor;
        }
        .live-circles .c1 { width: 14px; height: 14px; border-style: dotted; }
        .live-circles .c2 { width: 8px; height: 8px; }
        .live-circles .c3 { width: 3px; height: 3px; background: currentColor; }

        .progress-bar {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body id="bg-body" class="p-4 sm:p-6">

    <!-- 用来画星星和撒花的透明画布 -->
    <canvas id="magic-canvas"></canvas>

    <div id="capture-card" class="glass-card w-full max-w-sm p-8 text-center float-anim relative overflow-hidden">
        
        <!-- 实况图 LIVE 标志 -->
        <div id="live-icon" class="live-icon-container">
            <div class="live-circles">
                <div class="c1"></div><div class="c2"></div><div class="c3"></div>
            </div>
            <span>LIVE</span>
        </div>

        <div id="card-glow" class="absolute -top-10 -left-10 w-32 h-32 rounded-full opacity-20 filter blur-2xl z-0"></div>

        <div class="relative z-10 pointer-events-none mt-4">
            <!-- Emoji -->
            <div class="text-6xl mb-4 inline-block transition-transform duration-300" id="emoji">🦦</div>
            
            <h1 class="text-2xl font-bold text-gray-800 mb-2 tracking-wide" id="greeting">宝，今天辛苦啦</h1>
            
            <div id="status-tag" class="inline-flex items-center justify-center bg-blue-50 text-blue-500 text-xs px-4 py-1.5 rounded-full mb-6 font-medium tracking-wider shadow-sm border border-blue-100">
                <span class="w-2 h-2 rounded-full bg-blue-400 mr-2 animate-pulse"></span>
                <span id="status-text">电量保护模式</span>
            </div>

            <!-- 能量进度条 -->
            <div class="mb-6 text-left" id="energy-section">
                <div class="flex justify-between text-[11px] text-gray-500 mb-1.5 px-1 font-bold tracking-wider">
                    <span>今日摸鱼充电进度</span>
                    <span id="energy-text">0%</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2.5 shadow-inner">
                    <div id="energy-bar" class="bg-gradient-to-r from-pink-300 to-purple-400 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
                </div>
            </div>

            <!-- 文案容器 -->
            <div id="message-container" class="min-h-[90px] flex items-center justify-center mb-8 px-2 border-t border-b border-gray-100 py-4 transition-opacity duration-300">
                <p id="message-text" class="text-gray-600 leading-loose text-[14px] font-medium text-justify text-center">
                    正在读取今天的专属好运...
                </p>
            </div>
        </div>

        <!-- 交互按钮组 (设为相对层级，允许点击) -->
        <div id="action-buttons" class="space-y-3 relative z-20">
            <button onclick="hugAndCharge(event)" class="bg-gradient-to-r from-gray-800 to-gray-700 hover:from-black hover:to-gray-800 text-white font-bold py-3 px-8 rounded-2xl shadow-lg transform transition-all duration-200 active:scale-95 w-full flex items-center justify-center gap-2">
                <span>🔋</span> 点我换一句，或者长按卡片
            </button>
            
            <button id="export-btn" onclick="exportImage(event)" class="bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 font-bold py-3 px-8 rounded-2xl shadow-sm transform transition-all duration-200 active:scale-95 w-full flex items-center justify-center gap-2">
                <span>📸</span> 存为专属壁纸
            </button>
        </div>

        <p class="text-[10px] text-gray-400 mt-5 flex items-center justify-center gap-1 opacity-80" id="footer-text">
            ✨ 宝的专属守护 · 拒绝画饼 ✨
        </p>
    </div>

    <!-- 预览弹窗 -->
    <div id="preview-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex-col items-center justify-center p-6 backdrop-blur-sm transition-opacity">
        <div class="bg-white/10 px-6 py-2 rounded-full mb-6 border border-white/20 shadow-lg">
            <p class="text-white text-sm font-medium animate-pulse">✨ 宝，请长按下方图片保存到相册 ✨</p>
        </div>
        <img id="preview-image" src="" alt="专属壁纸" class="max-w-full max-h-[65vh] rounded-[32px] shadow-2xl mb-8 border-4 border-white/50">
        <button onclick="closePreview()" class="bg-white/20 text-white font-bold rounded-full py-3 px-10 hover:bg-white/30 backdrop-blur-md active:scale-95 transition-transform border border-white/30">
            返回继续摸鱼
        </button>
    </div>

    <script>
        const dayConfigs = {
            0: { name: '周日', emoji: '🛋️', tag: '周末电量回充中', bg: 'linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%)', color: 'text-purple-500', bgClass: 'bg-purple-50 border-purple-100' },
            1: { name: '周一', emoji: '🧟', tag: '周一灵魂出窍模式', bg: 'linear-gradient(to top, #cfd9df 0%, #e2ebf0 100%)', color: 'text-gray-500', bgClass: 'bg-gray-100 border-gray-200' },
            2: { name: '周二', emoji: '🫠', tag: '周二液体化模式', bg: 'linear-gradient(120deg, #f6d365 0%, #fda085 100%)', color: 'text-orange-500', bgClass: 'bg-orange-50 border-orange-100' },
            3: { name: '周三', emoji: '🐫', tag: '周三驼峰跨越模式', bg: 'linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%)', color: 'text-green-500', bgClass: 'bg-green-50 border-green-100' },
            4: { name: '周四', emoji: '🦦', tag: '周四微光希望模式', bg: 'linear-gradient(to top, #fff1eb 0%, #ace0f9 100%)', color: 'text-blue-500', bgClass: 'bg-blue-50 border-blue-100' },
            5: { name: '周五', emoji: '🎉', tag: '周五即将起飞模式', bg: 'linear-gradient(120deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)', color: 'text-pink-500', bgClass: 'bg-pink-50 border-pink-100' },
            6: { name: '周六', emoji: '🎮', tag: '周末狂欢模式', bg: 'linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)', color: 'text-teal-500', bgClass: 'bg-teal-50 border-teal-100' }
        };

        const messages = [
            "工作做不完就算啦，
地球缺了谁都照样转，
但你必须得好好爱自己。",
            "把手头的任务在心里切碎，
像小仓鼠啃瓜子一样，
咬一小口算一小口。",
            "别人卷别人的，
我的宝只要开心就好，
平安健康才是宇宙第一要紧事！",
            "如果觉得有点累了，
现在就去接杯温水，伸个懒腰，
给自己五分钟的合法摸鱼时间。",
            "今天不用表现得太完美，
能顺利打卡下班，
就已经是一场巨大的胜利了。",
            "深呼吸，吐气——
把烦人的事情都当成耳旁风，
今天只做自己的小宝贝。"
        ];

        let today = new Date().getDay(); 
        let currentEnergy = 0;
        let originalMessage = ""; 

        // 初始化
        function initApp() {
            const config = dayConfigs[today];
            document.getElementById('bg-body').style.background = config.bg;
            document.getElementById('card-glow').style.background = config.bg;
            document.getElementById('emoji').innerText = config.emoji;
            document.getElementById('greeting').innerText = `宝，${config.name}好呀`;
            
            const statusTag = document.getElementById('status-tag');
            document.getElementById('status-text').innerText = config.tag;
            statusTag.className = `inline-flex items-center justify-center text-xs px-4 py-1.5 rounded-full mb-6 font-medium tracking-wider shadow-sm border ${config.bgClass} ${config.color}`;

            loadEnergy();
            changeMessage();
            initMagicCanvas(); // 启动粒子画布
        }

        // ---------- 原有逻辑 ----------
        function loadEnergy() {
            const dateStr = new Date().toDateString();
            const savedData = JSON.parse(localStorage.getItem('baby_energy') || '{}');
            if (savedData.date === dateStr) {
                currentEnergy = savedData.value || 0;
            } else {
                currentEnergy = 0;
            }
            updateEnergyUI();
        }

        function hugAndCharge(e) {
            if(e) e.stopPropagation(); // 阻止冒泡触发长按
            changeMessage();
            currentEnergy = Math.min(100, currentEnergy + 15);
            localStorage.setItem('baby_energy', JSON.stringify({
                date: new Date().toDateString(),
                value: currentEnergy
            }));
            updateEnergyUI();
        }

        function updateEnergyUI() {
            document.getElementById('energy-bar').style.width = `${currentEnergy}%`;
            document.getElementById('energy-text').innerText = `${currentEnergy}%`;
        }

        function changeMessage() {
            let newMsg = messages[Math.floor(Math.random() * messages.length)];
            const msgEl = document.getElementById('message-text');
            msgEl.style.opacity = '0';
            setTimeout(() => {
                msgEl.innerHTML = newMsg;
                msgEl.style.opacity = '1';
                originalMessage = newMsg; // 保存原信息
            }, 150);
        }

        // ---------- 🌟 实况图魔法核心逻辑 🌟 ----------
        
        let pressTimer;
        let isLiveMode = false;
        const cardElement = document.getElementById('capture-card');
        const bodyElement = document.getElementById('bg-body');
        const messageText = document.getElementById('message-text');

        // 开始长按
        function startPress(e) {
            // 如果点的是按钮，就不触发长按
            if(e.target.closest('button')) return; 
            
            e.preventDefault(); // 防止弹出手机菜单
            
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            let y = e.touches ? e.touches[0].clientY : e.clientY;

            // 设定0.3秒后进入“实况模式”
            pressTimer = setTimeout(() => {
                isLiveMode = true;
                bodyElement.classList.add('is-live');
                
                // 更换为隐藏文案！
                messageText.style.opacity = '0';
                setTimeout(() => {
                    messageText.innerHTML = "<span class='text-pink-500 font-bold text-[16px]'>💖 哇！宝发现了隐藏彩蛋！💖
今天也要超级无敌开心鸭！</span>";
                    messageText.style.opacity = '1';
                }, 150);

                // 在按压位置喷射魔法粒子！
                burstParticles(x, y);
                
                // 持续发射小星星
                particleInterval = setInterval(() => {
                    burstParticles(window.innerWidth/2 + (Math.random()-0.5)*100, window.innerHeight/2 + (Math.random()-0.5)*100, 2);
                }, 200);
                
            }, 300);
        }

        // 结束长按
        function endPress() {
            clearTimeout(pressTimer);
            if (isLiveMode) {
                isLiveMode = false;
                bodyElement.classList.remove('is-live');
                clearInterval(particleInterval);
                
                // 恢复原本文案
                messageText.style.opacity = '0';
                setTimeout(() => {
                    messageText.innerHTML = originalMessage;
                    messageText.style.opacity = '1';
                }, 150);
            }
        }

        let particleInterval;
        
        // 绑定事件
        cardElement.addEventListener('touchstart', startPress, {passive: false});
        cardElement.addEventListener('touchend', endPress);
        cardElement.addEventListener('touchcancel', endPress);
        
        cardElement.addEventListener('mousedown', startPress);
        window.addEventListener('mouseup', endPress); // 松开鼠标

        // ---------- 🌟 粒子系统 (撒花特效) 🌟 ----------
        const canvas = document.getElementById('magic-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function initMagicCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
            requestAnimationFrame(animateParticles);
        }

        function burstParticles(x, y, count = 15) {
            const colors = ['#fecfef', '#ff9a9e', '#a1c4fd', '#f6d365', '#ffd1ff'];
            for(let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5,
                    size: Math.random() * 8 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1,
                    decay: Math.random() * 0.02 + 0.02
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3; // 重力
                p.life -= p.decay;
                
                if(p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateParticles);
        }


        // ---------- 原有导出图片逻辑 ----------
        function exportImage(e) {
            e.stopPropagation(); // 阻止长按
            const card = document.getElementById('capture-card');
            const buttons = document.getElementById('action-buttons');
            const footer = document.getElementById('footer-text');
            const exportBtn = document.getElementById('export-btn');
            const liveIcon = document.getElementById('live-icon');
            
            const originalBtnDisplay = buttons.style.display;
            const originalBtnHtml = exportBtn.innerHTML;

            exportBtn.innerHTML = '<span>⏳</span> 正在施展魔法...';
            buttons.style.display = 'none';
            // 截图中隐藏Live标志，因为它是一张静图
            liveIcon.style.display = 'none'; 
            
            const dateStr = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
            footer.innerText = `✨ ${dateStr} · 给宝的专属续命符 ✨`;
            card.classList.remove('float-anim'); 
            
            html2canvas(card, {
                scale: 3, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                buttons.style.display = originalBtnDisplay;
                footer.innerText = "✨ 宝的专属守护 · 拒绝画饼 ✨";
                card.classList.add('float-anim');
                exportBtn.innerHTML = originalBtnHtml;
                liveIcon.style.display = 'flex'; // 恢复显示

                const image = canvas.toDataURL("image/png");
                document.getElementById('preview-image').src = image;
                
                const modal = document.getElementById('preview-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }).catch(err => {
                console.error("截图失败啦", err);
                alert("哎呀，好像出了一点小故障，稍后再试哦~");
                buttons.style.display = originalBtnDisplay;
                exportBtn.innerHTML = originalBtnHtml;
                liveIcon.style.display = 'flex';
            });
        }

        function closePreview() {
            const modal = document.getElementById('preview-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.onload = initApp;
    </script>
</body>
</html>
