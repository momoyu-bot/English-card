<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171b2a">
<meta name="description" content="九瓣素材交给四位导演，开出来两份办公文档、一本代码花谱，和半朵新花。">
<title>大导演的想象力</title>
<style>
:root{--night:#171b2a;--ink:#25263b;--paper:#f6f1e8;--rose:#ffabc0;--peach:#fac9ae;--blue:#a9cbd7;--gold:#eac581;--line:rgba(250,241,225,.18);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% -15%,#343850,transparent 56%),var(--night);color:#f5eee8;-webkit-font-smoothing:antialiased}
button,a,summary{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #ffd0a4;outline-offset:3px}
.wrap{width:min(100%,570px);padding:20px 17px 36px;margin:0 auto}
.mast{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:10px;letter-spacing:.19em;color:#c3b9bb}
.mast b{font-weight:600;color:#f6c8ba}.stamp{border:1px solid #9d8296;border-radius:100px;padding:3px 10px;letter-spacing:.09em;white-space:nowrap}
h1{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:clamp(34px,8.7vw,48px);margin:18px 0 8px;letter-spacing:.055em;line-height:1.25}
.lede{font-size:13px;color:#c9c1c6;line-height:1.8;margin:0 0 16px}
.lede strong{color:#ffe0c7;font-weight:500}
.scene-frame{border-radius:26px;overflow:hidden;border:1px solid #55546b;background:#121a2a;position:relative;box-shadow:0 18px 45px #090c17a6,0 0 0 5px #ffffff07}
.scene-frame:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,#ffffff06,transparent 24%,transparent 78%,#080e2088)}
#scene{display:block;width:100%;height:auto;max-height:min(55svh,500px);aspect-ratio:390 / 420}
.scene-frame .corner{position:absolute;z-index:2;left:15px;top:13px;display:flex;gap:7px;align-items:center;font-size:10px;letter-spacing:.12em;color:#efdbc8}
.dot{display:inline-block;width:7px;height:7px;background:#e7aa9a;border-radius:50%;box-shadow:0 0 12px #f7aa95}
.scene-frame .corner.right{left:auto;right:13px;color:#dfcfcb;letter-spacing:.04em}
#sceneTitle{position:absolute;bottom:12px;left:20px;right:20px;z-index:2;text-align:center;font-family:"Songti SC",serif;font-size:16px;letter-spacing:.09em;text-shadow:0 2px 5px #000c;pointer-events:none}
.note{min-height:83px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:12px 0 12px;gap:4px;padding:0 12px}
#headline{color:#fae6d6;font-size:15px;font-weight:600;line-height:1.55}
#sub{font-size:12px;color:#bdb5c2;line-height:1.7;max-width:480px}
.jury{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.jury button{border:1px solid #625d70;border-radius:14px;padding:11px 3px 10px;background:#26283b;color:#f5e7df;min-height:76px;transition:background .2s,border-color .2s,transform .2s}
.jury button:active{transform:scale(.97)}
.jury button[aria-pressed="true"]{background:#45405a;border-color:#e6b798}
.jury button .sym{display:block;font:700 24px/1.2 Georgia,serif;color:#f4c4b0}
.jury button small{display:block;font-size:11px;margin-top:6px;letter-spacing:.03em;color:#d5c7ce}
.jury button .done{position:absolute;visibility:hidden}
.jury button.seen .sym:after{content:" ·";font-size:12px;color:#dcb77c}
.after{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px}
.progress{font-size:11px;color:#bcb7bf;white-space:nowrap}.pips{display:inline-flex;gap:4px;vertical-align:middle;margin-left:7px}
.pips i{display:inline-block;width:8px;height:8px;border:1px solid #766b7d;border-radius:100%;background:transparent}
.pips i.on{background:#f5c19c;border-color:#f5c19c}
#liberate{border:1px solid #bd957d;background:#45364c;color:#ffe3d0;border-radius:100px;font-size:12px;padding:9px 13px;display:none}
#liberate.show{display:block}#reset{border:0;background:transparent;color:#ada6b3;font-size:11px;padding:9px 4px}
.after .actions{display:flex;gap:9px;align-items:center}
.fine{margin:25px 0 0;border-top:1px solid #4c495e;padding-top:14px;color:#a8a2af;font-size:11px;line-height:1.9}
.fine details{margin-top:7px}.fine summary{cursor:pointer;color:#dfc4ae}
.fine a{color:#c2d7e2;display:inline-block;margin:5px 8px 2px 0;text-underline-offset:3px}
.fine em{font-style:normal;color:#f5c4a1}
svg text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
svg .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}
svg .breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
svg .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
svg .sway{animation:sway 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
svg .fade{animation:fade .8s ease both}
svg .fly{animation:fly 2.8s ease-in-out infinite alternate;transform-box:fill-box}
svg .word{animation:word 2.8s ease-in-out infinite alternate}
svg .film{animation:film 2s ease-in-out infinite alternate;transform-box:fill-box}
svg .escape{animation:escape 3.8s cubic-bezier(.16,.8,.23,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes breathe{50%{opacity:.65;transform:scale(1.045)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{to{transform:rotate(6deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fly{to{transform:translate(0,-8px)}}
@keyframes word{to{transform:translateY(-16px)}}
@keyframes film{to{opacity:.5;transform:scale(1.07)}}
@keyframes escape{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(0,-26px) rotate(10deg)}100%{transform:translate(175px,-360px) rotate(65deg)}}
@media(max-width:380px){.wrap{padding:16px 12px 28px}.jury{gap:5px}.jury button small{font-size:10px}.jury button{min-height:68px}.note{min-height:88px}h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){svg *{animation:none!important}.jury button{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="mast"><span><b>MOMOYU · 失灵博物馆</b> / 大导演系列</span><span class="stamp">特展 04</span></div>
  <h1>大导演的想象力</h1>
  <p class="lede">原作者递来九瓣花，留了第十瓣空白。<strong>「可以随便折一支新的。」</strong><br>于是四位大导演开始工作。</p>
  <div class="scene-frame">
    <div class="corner"><span class="dot"></span><span id="machine">想象力培育实验中</span></div>
    <div class="corner right" id="status">种子 01 / 01</div>
    <svg id="scene" viewBox="0 0 390 420" role="img" aria-label="同一颗花种子等待四位导演自由创作"></svg>
    <div id="sceneTitle">九瓣花，和一大片没有画出来的花园</div>
  </div>
  <div class="note" aria-live="polite" aria-atomic="true">
    <div id="headline">把种子交给一位导演。</div>
    <div id="sub">他们有完整的人物素材、真实的仓库，以及无限的改编许可。</div>
  </div>
  <nav class="jury" aria-label="选择导演">
    <button type="button" data-director="cc" aria-pressed="false"><span class="sym">C</span><small>Claude</small></button>
    <button type="button" data-director="codex" aria-pressed="false"><span class="sym">✦</span><small>Codex</small></button>
    <button type="button" data-director="gemini" aria-pressed="false"><span class="sym">G</span><small>Gemini</small></button>
    <button type="button" data-director="build" aria-pressed="false"><span class="sym">B</span><small>Build</small></button>
  </nav>
  <div class="after">
    <div class="progress">已试镜 <span id="count">0</span> / 4 <span class="pips" id="pips"><i></i><i></i><i></i><i></i></span></div>
    <div class="actions"><button type="button" id="liberate">放花出门 ↗</button><button type="button" id="reset">从头再看</button></div>
  </div>
  <div class="fine">
    <span>档案说明：这是对四份作品的一次善意恶搞，不是对模型能力的排名。<em>一个导演已经住进博物馆</em>，其余导演也不能因此免检。</span>
    <details><summary>查看四份原作与同系列案卷</summary>
      <a href="../../claude/小卡/StashYu和FetchMo的一天.html">Claude 版</a>
      <a href="../StashYu和FetchMo的一天-codex.html">Codex 版</a>
      <a href="../../gemini/博物馆/stashyu_fetchmo.html">Gemini 版 · 已入馆</a>
      <a href="../../grok/小卡/StashYu和FetchMo一天-build.html">Build 版</a>
      <a href="大导演的视线.html">上一案 · 大导演的视线</a>
    </details>
  </div>
</main>
<script>
(function(){
"use strict";
const svg=document.getElementById("scene");
const title=document.getElementById("sceneTitle");
const headline=document.getElementById("headline");
const sub=document.getElementById("sub");
const machine=document.getElementById("machine");
const status=document.getElementById("status");
const pips=document.getElementById("pips").children;
const count=document.getElementById("count");
const liberate=document.getElementById("liberate");
const buttons=[...document.querySelectorAll("[data-director]")];
let mode="start",touch=0,seen=new Set();
const P='<path d="M0,-24 C16,-25 20,-7 0,8 C-20,-7 -16,-25 0,-24Z" />';
function petals(cx,cy,r,fill,n,extra){
 let a='<g transform="translate('+cx+' '+cy+')" class="'+(extra||'')+'" fill="'+fill+'" stroke="#fbe2ca" stroke-width="1">';
 for(let i=0;i<n;i++){a+='<g transform="rotate('+(i*360/n)+') translate(0,-'+r+')">'+P+'</g>';}
 return a+'<circle r="10" fill="#eac581" stroke="#fff0d5" stroke-width="1.5"/><circle r="3.2" fill="#fff7d9"/></g>';
}
function leaf(x,y,rot){return '<path d="M'+x+' '+y+' q-18 -25 -32 -17 q8 19 32 17" transform="rotate('+rot+' '+x+' '+y+')" fill="#93b9a2" opacity=".85"/>';}
function text(x,y,v,fill,size,attr){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="'+(size||12)+'" fill="'+(fill||'#f7e7dc')+'" '+(attr||'')+'>'+v+'</text>';}
function star(x,y,r){return '<path d="M'+x+' '+(y-r)+' L'+(x+r*.3)+' '+(y-r*.3)+' '+(x+r)+' '+y+' '+(x+r*.3)+' '+(y+r*.3)+' '+x+' '+(y+r)+' '+(x-r*.3)+' '+(y+r*.3)+' '+(x-r)+' '+y+' '+(x-r*.3)+' '+(y-r*.3)+'Z" fill="#e7d0ae"/>';}
function base(){
 let s='<defs><radialGradient id="sky"><stop stop-color="#353950"/><stop offset="1" stop-color="#131a2c"/></radialGradient><linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#293c44"/><stop offset="1" stop-color="#182631"/></linearGradient><linearGradient id="beam"><stop stop-color="#ffe6b8" stop-opacity=".7"/><stop offset="1" stop-color="#ffe6b8" stop-opacity="0"/></linearGradient></defs>';
 s+='<rect width="390" height="420" fill="url(#sky)"/>';
 s+='<circle cx="194" cy="185" r="152" fill="none" stroke="#b7a2a0" stroke-opacity=".23"/><circle cx="194" cy="185" r="134" fill="none" stroke="#b7a2a0" stroke-opacity=".13"/>';
 [[40,90,2],[76,151,1.5],[310,62,2],[345,183,2],[283,124,1.5],[115,51,2],[228,72,1.4],[23,251,1.5],[367,288,1],[302,256,1]].forEach(p=>s+=star(...p));
 s+='<path d="M0 346 Q76 302 160 344 T390 323 V420 H0Z" fill="url(#hill)"/><path d="M0 378 Q100 353 194 373 T390 362" fill="none" stroke="#9b9f9d" stroke-opacity=".2"/>';
 s+='<ellipse cx="194" cy="373" rx="101" ry="16" fill="#0b1623" opacity=".64"/>';
 return s;
}
function pot(){return '<g class="rise"><path d="M161 335 h66 l-10 39 h-46Z" fill="#ab6e70" stroke="#db9e90" stroke-width="2"/><ellipse cx="194" cy="335" rx="34" ry="8" fill="#c59282"/><path d="M169 340 Q193 330 219 340" stroke="#6a3d51" stroke-width="3" fill="none"/></g>';}
function stem(x,y){return '<path d="M194 336 Q180 279 '+x+' '+y+'" stroke="#9ec7b0" stroke-width="5" fill="none" stroke-linecap="round"/>'+leaf(184,300,-25)+leaf(188,280,180);}
function seed(){
 let s=pot()+'<path class="rise" d="M194 335 Q194 295 194 271" stroke="#a5bfa5" stroke-width="3" fill="none"/>';
 s+=petals(194,248,30,"#df9baa",9,"breathe");
 s+=text(194,320,"原作 · 九瓣", "#ead6ca",10);
 for(let i=0;i<6;i++){let a=i*Math.PI/3;let x=Math.round(194+114*Math.cos(a)),y=Math.round(227+87*Math.sin(a));s+='<g class="fly">'+star(x,y,3)+'</g>';}
 return s;
}
function cc(t){
 let s='<g class="rise"><rect x="70" y="83" width="250" height="248" rx="16" fill="#192737" stroke="#d4ad8f" stroke-width="2"/><rect x="84" y="98" width="222" height="213" rx="9" fill="#203343" stroke="#688993"/>';
 s+='<rect x="101" y="110" width="188" height="22" rx="4" fill="#334f60"/>'+text(195,126,"变形许可：已详细阅读","#d9e9de",12);
 s+='<path d="M112 162 H165 V182 H220 V162 H273 M165 182 V207 H220" fill="none" stroke="#87b2b6" stroke-width="2.2"/>';
 [112,165,220,273].forEach((x,i)=>s+='<circle cx="'+x+'" cy="'+(i%2?182:162)+'" r="5" fill="#d3a8a7"/>');
 s+=petals(195,260,27,"#dca2ae",9,"sway")+'<rect x="115" y="216" width="160" height="77" rx="8" fill="none" stroke="#f2d2a0" stroke-width="2"/>';
 s+=text(195,304,"原文：完整保存","#ebc998",12);s+='</g>';
 if(t>0)s+='<g class="fade">'+text(195,349,"SHA-256：花瓣毫发无损","#e5b6a0",10)+'</g>';
 return s;
}
function codex(t){
 let s='<g class="rise"><path d="M36 290 L74 264 L74 296Z" fill="#3a3d57" stroke="#d2a78e"/><rect x="22" y="263" width="48" height="36" rx="9" fill="#303c55" stroke="#d9bf9e" stroke-width="2"/><circle cx="59" cy="281" r="10" fill="#f5cf9a"/><path d="M70 271 L279 165 L279 310 L70 290 Z" fill="url(#beam)" opacity=".65"/></g>';
 s+='<path d="M252 331 Q235 286 261 244" stroke="#8db9ae" stroke-width="5" fill="none" class="rise"/>'+leaf(254,295,-22);
 s+=petals(260,220,29,"#f0aab5",t?6:5,"rise");
 s+='<g class="film">'+star(319,169,4)+star(211,190,3)+'</g>';
 s+=text(189,126,"「晚安」→ 灯", "#ead9cf",15)+text(189,151,"「笑声」→ 窗", "#ead9cf",15);
 s+='<path d="M79 320 H308" stroke="#edc1a8" stroke-dasharray="8 10" stroke-opacity=".6"/>';
 return s;
}
function gemini(t){
 let num=(t%10)+1;
 let s='<g class="rise"><rect x="53" y="72" width="284" height="253" rx="11" fill="#c5c2bc" opacity=".19" transform="rotate(4 195 199)"/><rect x="42" y="61" width="306" height="260" rx="10" fill="#fbf9f4" stroke="#d4bd9e" stroke-width="3"/>';
 s+='<rect x="42" y="61" width="306" height="32" rx="9" fill="#cf775f"/>'+text(196,83,"MOMOYU · 背景补充说明","#fff1e9",13);
 s+='<rect x="61" y="111" width="265" height="33" rx="5" fill="#e6e3db"/>'+text(194,133,num%2?"原作细节 · 第 "+num+" 页":"第一章：自由改编许可","#4e555a",13);
 for(let i=0;i<5;i++){let width=(i===4?151:210-i*7);s+='<circle cx="76" cy="'+(165+i*26)+'" r="3" fill="#c97362"/><rect x="91" y="'+(162+i*26)+'" width="'+width+'" height="7" rx="3.5" fill="'+(i%2?"#cacbc8":"#b4b9b6")+'"/>';}
 s+='<rect x="97" y="289" width="193" height="23" rx="5" fill="#f1d9cf"/>'+text(193,306,"仅作背景 → 正文素材","#93483a",11);
 s+='</g><g class="fade">'+text(195,348,"点击画面，翻下一页", "#dbc9ba",11)+'</g>';
 return s;
}
function build(t){
 let s='<g class="rise"><rect x="71" y="65" width="248" height="269" rx="3" fill="#c6d1dd" opacity=".15" transform="rotate(5 195 199)"/><rect x="65" y="59" width="255" height="270" rx="4" fill="#f9f9f7"/>';
 s+='<rect x="65" y="59" width="255" height="36" fill="#4e7eb9"/>'+text(192,82,"文档 1 · 自动保存","#fff",14);
 s+=text(191,119,"05:20 · 搬","#394d65",17,'font-weight="700"');
 let rows=9+Math.min(t,7);for(let i=0;i<rows;i++){let y=136+i*11;if(y>310)break;let w=196-(i%4)*17;s+='<rect x="92" y="'+y+'" width="'+w+'" height="4" rx="2" fill="'+(i%3?"#b5bac3":"#8d9bad")+'"/>';}
 s+='<rect x="113" y="282" width="162" height="29" rx="4" fill="#e6edf4"/>'+text(194,301,"字数：400+","#426792",14);
 s+='</g>';
 if(t)s+='<g class="fade">'+text(195,348,"编剧只留了空白，文档替她填满了。","#e9c5b5",11)+'</g>';
 return s;
}
function ending(){
 let s=pot()+stem(196,205);
 s+=petals(194,180,41,"#ffaebe",9,"escape");
 s+='<g class="fade">'+text(194,126,"花园不止十格","#fce1c9",18)+text(194,150,"也不止四位导演","#e1c6b9",13)+'</g>';
 for(let i=0;i<9;i++){let x=51+i*36,y=62+((i*31)%100);s+='<g class="fly">'+star(x,y,2+i%2)+'</g>';}
 return s;
}
function view(){
 svg.innerHTML=base()+(mode==="start"?seed():mode==="cc"?cc(touch):mode==="codex"?codex(touch):mode==="gemini"?gemini(touch):mode==="build"?build(touch):ending());
 const meta={
 start:["想象力培育实验中","种子 01 / 01","九瓣花，和一大片没有画出来的花园","把种子交给一位导演。","他们有完整的人物素材、真实的仓库，以及无限的改编许可。"],
 cc:["CLAUDE · 细致保护","四十多张检查图","十格原装收藏","花瓣检查通过，Git 双关漂亮。","画面长出了新叶子，句子却大多安然回到了原位。"],
 codex:["CODEX · 谨慎改编","全片 7,440 帧","至少折了另一种形状","它剪掉了一些原句，把晚安折成灯。","花还没走出原来的花盆，但这次确实试着开了。"],
 gemini:["GEMINI · 互动展厅","已入博物馆","把空白补成了演示文稿","十格、按钮、释义、逐页说明，一样都不少。","前言写着「不用作为素材」，结果成了重点展示内容。"],
 build:["BUILD · 文书整理","十格检查通过","空白处生长出了 Word","原作者辛苦删短的段落，被重新扩成四百多字。","按钮全能按，花瓣却被认真整理成了正文。"],
 escape:["馆内突发状况","花朵已越界","最后一朵花自己跑出了展框","档案没有记录它要去哪里。","这很好。因为花园不是一张需要逐格验收的表。"]
 }[mode];
 machine.textContent=meta[0];status.textContent=meta[1];title.textContent=meta[2];headline.textContent=meta[3];sub.textContent=meta[4];
 svg.setAttribute("aria-label",meta[2]+"。"+meta[3]);
 count.textContent=seen.size;
 [...pips].forEach((p,i)=>p.classList.toggle("on",seen.has(["cc","codex","gemini","build"][i])));
 buttons.forEach(b=>{const yes=b.dataset.director===mode;b.setAttribute("aria-pressed",String(yes));b.classList.toggle("seen",seen.has(b.dataset.director));});
 liberate.classList.toggle("show",seen.size===4&&mode!=="escape");
}
buttons.forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.director;seen.add(mode);touch=0;view();}));
svg.addEventListener("click",()=>{if(mode==="start"||mode==="escape")return;touch++;view();});
svg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();svg.dispatchEvent(new Event("click"));}});
liberate.addEventListener("click",()=>{mode="escape";touch=0;view();});
document.getElementById("reset").addEventListener("click",()=>{mode="start";seen.clear();touch=0;view();});
view();
})();
</script>
</body>
</html>
