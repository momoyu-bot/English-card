const events=[];function tone(t,n,d=.9,v=.08,type='sine'){events.push({t,n,d,v,type})}
// An original melody in two halves; the missing note returns near the end.
const motif=[69,72,74,null,72,69,65,null,67,69,72,null,69,67,65,null];
for(let k=0;k<10;k++){
 const start=k*16+.6,trans=(k===4||k===5||k===6)?-2:0;
 for(let i=0;i<motif.length;i++){let n=motif[i];if(n!==null&&start+i*.88<END-3){const muted=k===3||k===4||k===6,mod=(k===8?2:0);tone(start+i*.88,n+trans+mod,1.5,muted?.024:.047,i%4===0?'triangle':'sine')}}
 tone(start,45+(k%3)*2,5.7,.024,'triangle');
}

events.sort((a,b)=>a.t-b.t);
let audio=null,gain=null,cursor=0,audioOffset=0,soundOn=true;
function stopAudio(){if(gain&&audio){let g=gain;gain=null;const s=audio.currentTime;try{g.gain.cancelScheduledValues(s);g.gain.setValueAtTime(g.gain.value,s);g.gain.linearRampToValueAtTime(0,s+.04);setTimeout(()=>g.disconnect(),120)}catch(e){}}}
function playTone(evt,when){if(!gain||!audio)return;const o=audio.createOscillator(),v=audio.createGain();o.type=evt.type;o.frequency.value=440*Math.pow(2,(evt.n-69)/12);v.gain.setValueAtTime(.00001,when);v.gain.exponentialRampToValueAtTime(Math.max(.000015,evt.v),when+.018);v.gain.exponentialRampToValueAtTime(.00001,when+evt.d);
 o.connect(v);v.connect(gain);o.start(when);o.stop(when+evt.d+.08);o.onended=()=>{try{o.disconnect();v.disconnect()}catch(e){}}}
async function startAudio(){if(!soundOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{if(!audio)audio=new AC();await audio.resume();gain=audio.createGain();gain.gain.value=.28;gain.connect(audio.destination);audioOffset=audio.currentTime-now;cursor=events.findIndex(e=>e.t>=now-.001);if(cursor<0)cursor=events.length}catch(e){}}
function tickAudio(){if(!audio||!gain||!soundOn)return;if(Math.abs(audio.currentTime-audioOffset-now)>.3)audioOffset=audio.currentTime-now;while(cursor<events.length&&events[cursor].t<now+.18){const e=events[cursor++];if(e.t>=now-.08)playTone(e,Math.max(audio.currentTime+.005,audioOffset+e.t));}}
let playing=false,now=0,anchor=0,frame=0;const toggle=document.getElementById('toggle'),cover=document.getElementById('cover'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),chapter=document.getElementById('chapter'),sound=document.getElementById('sound'),transcript=document.getElementById('transcript');
const timeFmt=v=>Math.floor(v/60)+':'+String(Math.floor(v%60)).padStart(2,'0');
for(const cue of lines){const li=document.createElement('li'),at=document.createElement('span'),sentence=document.createElement('span');at.className='stamp';at.textContent=timeFmt(cue.a);sentence.textContent=cue.s;li.append(at,sentence);li.addEventListener('click',()=>{jump(cue.a);if(!playing)play()});transcript.appendChild(li)}
const rows=[...transcript.children];let active=-1;
function ui(){seek.value=now;clock.textContent=timeFmt(now)+' / '+timeFmt(END);const sc=scenes.find(x=>now>=x.s&&now<x.e)||scenes[scenes.length-1];chapter.textContent='· '+sc.label;let idx=lines.findIndex(x=>now>=x.a&&now<x.b);if(idx!==active){rows[active]?.classList.remove('active');rows[idx]?.classList.add('active');active=idx}}
function frameStep(ms){if(!playing)return;now=Math.min(END,(ms-anchor)/1000);render(now);ui();tickAudio();if(now>=END){pause();return}frame=requestAnimationFrame(frameStep)}
function play(){if(now>=END)now=0;if(playing)return;playing=true;anchor=performance.now()-now*1000;cover.hidden=true;toggle.textContent='暂停';startAudio();frame=requestAnimationFrame(frameStep)}
function pause(){playing=false;cancelAnimationFrame(frame);stopAudio();toggle.textContent='播放';if(now>=END)cover.hidden=false}
function jump(t){now=clamp(t,0,END);if(playing){anchor=performance.now()-now*1000;stopAudio();startAudio()}render(now);ui()}
toggle.addEventListener('click',()=>playing?pause():play());cover.addEventListener('click',play);cv.addEventListener('click',()=>playing?pause():play());seek.addEventListener('input',e=>jump(+e.target.value));sound.addEventListener('click',()=>{soundOn=!soundOn;sound.textContent='声音 '+(soundOn?'开':'关');sound.setAttribute('aria-pressed',soundOn?'true':'false');stopAudio();if(soundOn&&playing)startAudio()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});window.addEventListener('resize',resize);
