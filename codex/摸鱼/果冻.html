<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>果冻</title>
  <meta name="description" content="一只可以戳、揉、晃的草莓果冻，松开手就慢慢弹回来。">
  <meta name="theme-color" content="#faf7f2">
  <style>
    :root { color-scheme:light; --paper:#faf7f2; --ink:#493a37; --muted:#9b8982; --rose:#cc655f; --line:#e9dfd7; }
    * { box-sizing:border-box; }
    html { min-width:300px; background:var(--paper); }
    body { margin:0; color:var(--ink); background:radial-gradient(ellipse at 50% 49%,#fffaf7 0,transparent 62%),var(--paper); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--rose); outline-offset:5px; }
    .shell { width:min(1080px,calc(100% - 64px)); margin:0 auto; }
    header { height:88px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:650; letter-spacing:2px; }
    .mark { width:25px; height:22px; border-radius:50% 48% 37% 37%; background:linear-gradient(140deg,#fac7bd,#e68f8b); position:relative; box-shadow:inset 2px 2px 3px #ffffff7a; transform:rotate(-7deg); }
    .mark:before,.mark:after { content:""; position:absolute; width:3px;height:4px;background:#6b443f;border-radius:50%;top:10px; }
    .mark:before { left:7px; }.mark:after { right:7px; }
    .header-right { display:flex;align-items:center;gap:24px; }
    .dedication { font-size:12px;letter-spacing:1px;color:var(--muted); }
    .sound { display:flex;align-items:center;gap:7px;border:0;padding:9px 0 9px 10px;background:transparent;color:#87746e;font-size:12px;cursor:pointer; }
    .sound svg { width:17px;height:17px; }
    .sound[aria-pressed="true"] { color:var(--rose); }
    .intro { text-align:center;padding-top:37px; }
    .eyebrow { margin:0 0 9px;color:#b07e71;font-size:11px;letter-spacing:4px; }
    h1 { margin:0;font-family:"Noto Serif SC","Songti SC","STSong",Georgia,serif;font-size:38px;line-height:1.55;font-weight:600;letter-spacing:3px; }
    .intro p:last-child { margin:10px 0 0;font-size:13px;letter-spacing:1px;color:var(--muted); }
    .stage { position:relative;height:414px;max-width:850px;margin:6px auto 0; }
    canvas { width:100%;height:100%;display:block;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent;outline:none; }
    canvas:active { cursor:grabbing; }
    canvas:focus-visible { border-radius:30px;outline:2px dashed #d4a39a;outline-offset:-8px; }
    .speech { position:absolute;top:19px;left:50%;transform:translateX(-50%);margin:0;padding:12px 20px;border:1px solid #eadbd3;border-radius:18px;background:#fffcf8e8;color:#95655d;font-size:13px;line-height:1.65;white-space:nowrap;pointer-events:none;box-shadow:0 5px 18px #9e645505;transition:opacity .18s; }
    .speech:before { content:"";position:absolute;bottom:-6px;left:calc(50% - 6px);width:10px;height:10px;border-bottom:1px solid #eadbd3;border-right:1px solid #eadbd3;background:#fffcf8;transform:rotate(45deg); }
    .side-note { position:absolute;left:18px;bottom:93px;transform:rotate(-7deg);font-family:"Songti SC","STSong",serif;font-size:13px;color:#aa9487;line-height:1.9;pointer-events:none; }
    .side-note:after { content:"";position:absolute;left:100%;top:18px;margin-left:13px;width:40px;height:18px;border-bottom:1px solid #c8b5a5;border-radius:0 0 80% 0;transform:rotate(-24deg); }
    .stage-caption { position:absolute;bottom:4px;left:0;right:0;text-align:center;color:#b29f95;font-size:11px;letter-spacing:2px;pointer-events:none; }
    .controls { text-align:center;padding:23px 0 30px; }
    .actions { display:flex;justify-content:center;gap:12px; }
    .action { min-width:128px;height:49px;padding:0 23px;border:1px solid #e5d6cc;border-radius:17px;background:#fffcf6;color:#745b51;font-size:14px;font-weight:550;cursor:pointer;transition:transform .16s,background .16s,box-shadow .16s; }
    .action:hover { transform:translateY(-2px);box-shadow:0 5px 13px #9d6c4210;background:#fff; }
    .action:active { transform:translateY(1px) scale(.97); }
    .action.primary { color:#9b514e;background:#f9e5df;border-color:#eecac3; }
    .action.primary:hover { background:#fbdad4; }
    .action.bounce { background:#f6efdc;border-color:#e6dbbd;color:#8a7450; }
    .settings { display:flex;align-items:center;justify-content:center;gap:12px;margin:23px auto 0;font-size:11px;color:#a18b7f; }
    .settings label { color:#8d756c; }
    .settings input { width:128px;height:4px;appearance:none;-webkit-appearance:none;background:linear-gradient(to right,#d49287 var(--fill,68%),#e7ded5 var(--fill,68%));border-radius:9px;cursor:pointer;accent-color:#ca867b; }
    .settings input::-webkit-slider-thumb { appearance:none;-webkit-appearance:none;width:13px;height:13px;border:2px solid var(--paper);border-radius:50%;background:#ca867b;box-shadow:0 0 0 1px #d6a69b; }
    .settings input::-moz-range-thumb { width:10px;height:10px;border:2px solid var(--paper);border-radius:50%;background:#ca867b;box-shadow:0 0 0 1px #d6a69b; }
    .soft-value { width:44px;text-align:left;color:#b28c79; }
    .reset { margin-left:8px;padding:0 0 0 17px;border:0;border-left:1px solid #e2d8cd;background:none;color:#9a8a80;font-size:11px;cursor:pointer; }
    .reset:hover { color:#b35e57; }
    footer { display:flex;align-items:center;justify-content:space-between;padding:19px 0 22px;border-top:1px solid var(--line);color:#af9c8e;font-size:10px;letter-spacing:1px; }
    kbd { font:inherit;padding:2px 6px;margin:0 3px;border:1px solid #e3d9cf;border-radius:4px;background:#fffcf7; }
    .live-dot { display:inline-block;width:5px;height:5px;margin-right:7px;background:#a5ad85;border-radius:50%;vertical-align:middle; }
    @media(max-width:650px) { .shell{width:calc(100% - 36px)} header{height:70px}.header-right{gap:10px}.dedication{display:none}.intro{padding-top:30px} h1{font-size:32px;letter-spacing:2px}.intro p:last-child{font-size:11px;letter-spacing:.4px}.stage{height:365px;margin-top:8px}.side-note{display:none}.speech{font-size:12px;top:14px;padding:11px 15px;max-width:calc(100% - 12px);white-space:normal;width:max-content;text-align:center}.actions{gap:9px}.action{min-width:0;padding:0 19px;height:47px;font-size:13px;border-radius:15px}.controls{padding-top:17px;padding-bottom:26px}.settings{gap:9px}.settings input{width:105px}.reset{margin-left:3px;padding-left:12px}footer{font-size:9px;letter-spacing:.3px}footer .key-tip{display:none} }
    @media(max-height:760px) and (min-width:651px) { header{height:68px}.intro{padding-top:20px}h1{font-size:33px}.stage{height:345px}.speech{top:12px}.controls{padding:15px 0 20px}.settings{margin-top:19px}footer{padding:15px 0} }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after{transition:none!important} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"></span>一只果冻</div>
      <div class="header-right"><span class="dedication">给宝的软乎乎</span><button class="sound" id="sound" type="button" aria-pressed="false" aria-label="开启果冻音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><title>声音</title><desc>开启或关闭果冻的轻柔音效。</desc><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sound-mark" d="m17 9 5 6m0-6-5 6"/></svg>
        <span id="sound-label">声音关着</span></button></div>
    </header>
    <main>
      <section class="intro" aria-labelledby="heading"><p class="eyebrow">一小份柔软，随时在场</p><h1 id="heading">宝，我在这儿。</h1><p>轻轻戳，按住揉。松开手，我会慢慢弹回来。</p></section>
      <div class="stage" id="stage">
        <canvas id="jelly" tabindex="0" role="button" aria-label="草莓果冻。点击轻戳，按住拖动可揉捏。空格或回车轻戳，方向键揉捏。">一只柔软的草莓果冻。请使用下方的按钮和它互动。</canvas>
        <p class="speech" id="speech" role="status" aria-live="polite">轻点戳，里面的草莓刚坐稳。</p>
        <div class="side-note" aria-hidden="true">小小一颗草莓，<br>住在软乎乎里面。</div>
        <div class="stage-caption" id="stage-caption">可以直接碰我</div>
      </div>
      <section class="controls" aria-label="和果冻玩">
        <div class="actions"><button class="action primary" id="poke" type="button">戳一下</button><button class="action" id="knead" type="button">揉一揉</button><button class="action bounce" id="bounce" type="button">Duang 一下</button></div>
        <div class="settings"><label for="softness">软度</label><span aria-hidden="true">弹</span><input id="softness" type="range" min="0" max="100" value="68" aria-valuetext="软乎乎"><span aria-hidden="true">糯</span><output class="soft-value" id="soft-value" for="softness">软乎乎</output><button class="reset" id="reset" type="button">重新坐好</button></div>
      </section>
    </main>
    <footer><span><span class="live-dot"></span><span id="mood">今日状态：软乎乎</span></span><span class="key-tip">按 <kbd>空格</kbd>，也可以戳我</span><span>不赶时间，慢慢戳。</span></footer>
  </div>
  <script>
  (() => {
    'use strict';
    const canvas=document.getElementById('jelly'), ctx=canvas.getContext('2d');
    if(!ctx) { document.getElementById('speech').textContent='这个浏览器暂时画不了果冻，试试用新版浏览器打开。'; return; }
    const $=id=>document.getElementById(id), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
    const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
    let width=0,height=0,scale=1,cx=0,cy=0,soft=.68,time=0,last=0,frame=0;
    let q=0,qv=0,tilt=0,tiltV=0,jump=0,jumpV=0,fruitAngle=-.20,fruitV=0,fruitX=0,fruitXV=0;
    let faceMood='happy',moodUntil=0,blink=0,nextBlink=2.8,eyesX=0,eyesY=0,speechTimer=0;
    let hold=null,autoKnead=0,autoElapsed=0,pokes=0,soundEnabled=false,audioCtx=null;
    let pointer={x:0,y:0,inside:false},ripples=[];
    const N=56,nodes=[];
    for(let i=0;i<N;i++) {
      const a=i/N*Math.PI*2,sy=Math.sin(a),bx=Math.cos(a)*(135+13*(sy+1)/2);
      let by=sy*130;if(by>72)by=72+(by-72)*.54;
      nodes.push({bx,by,x:bx,y:by,vx:0,vy:0});
    }
    function resize(){ const r=canvas.getBoundingClientRect();width=r.width;height=r.height;const d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);scale=Math.min(width/438,height/395,1.08);cx=width/2;cy=height*.59; }
    const observer=new ResizeObserver(resize);observer.observe(canvas);resize();
    function speak(s,m='happy',duration=3600){clearTimeout(speechTimer);$('speech').textContent=s;faceMood=m;moodUntil=time+duration/1000;$('mood').textContent='今日状态：'+({happy:'软乎乎',squish:'正在被揉',surprise:'晃晃悠悠',dizzy:'草莓晕车了',sleepy:'慢慢回弹'}[m]||'软乎乎');speechTimer=setTimeout(()=>{if(!hold&&!autoKnead){$('speech').textContent='我坐好了。宝，你还在吗？';$('mood').textContent='今日状态：软乎乎';}},duration+1800);}
    function audio(kind='poke',force=1){if(!soundEnabled)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(kind==='bounce'?270:450,t);o.frequency.exponentialRampToValueAtTime(kind==='bounce'?80:130,t+.17);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10*Math.min(force,1.4),t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.27);}catch{soundEnabled=false;$('sound').setAttribute('aria-pressed','false');$('sound-label').textContent='声音不可用';}}
    function local(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-cx)/scale,y:(e.clientY-r.top-cy+jump*scale)/scale};}
    function hit(p){return (p.x/165)**2+((p.y+12)/145)**2<1.15;}
    function ring(x,y){ripples.push({x,y,t:0});}
    function forceAt(x,y,power){for(const n of nodes){const dx=n.x-x,dy=n.y-y,dist=Math.hypot(dx,dy),w=Math.exp(-dist*dist/8500);const len=Math.hypot(n.bx,n.by)||1;n.vx-=n.bx/len*power*w;n.vy-=n.by/len*power*w;}fruitV+=(x>0?-1:1)*power*.007;}
    function poke(x=43,y=-55){pokes++;const k=reduced.matches?.4:1;qv+=1.7*k;forceAt(x,y,195*k);fruitV+=(pokes%2?1:-1)*1.5*k;ring(x,y);audio();const lines=['宝，我还手了哦。你可能没感觉到。','啵叽。这个小窝，要慢慢弹回来。','里面的草莓说：收到。','软吧？是刚好接住你指尖的软。','宝，你戳的是我的小肚子。'];speak(lines[(pokes-1)%lines.length],'happy');}
    function bounce(){hold=null;autoKnead=0;const k=reduced.matches?.35:1;jumpV=330*k;qv=-3.4*k;fruitV+=5*k;tiltV+=1.2*k;audio('bounce');speak('Duang～～宝，我里面的草莓晕车了。','surprise',4000);ring(0,80);}
    function knead(){hold=null;autoKnead=1.5;autoElapsed=0;audio('bounce',.7);speak('宝……我的正面被你揉到背面去了。','squish',3500);}
    function reset(){hold=null;autoKnead=0;for(const n of nodes){n.vx+=(n.bx-n.x)*3;n.vy+=(n.by-n.y)*3;}qv=-q*5;jumpV=0;tiltV=-tilt*5;fruitV=-fruitAngle*2;speak('好了，草莓坐稳了，我也坐稳了。','happy');}
    canvas.addEventListener('pointerdown',e=>{if(e.button!==0||hold)return;const p=local(e);if(!hit(p))return;e.preventDefault();canvas.focus({preventScroll:true});autoKnead=0;hold={id:e.pointerId,start:p,p:{...p},dx:0,dy:0,t:time,moved:0,said:false};canvas.setPointerCapture(e.pointerId);poke(p.x,p.y);$('stage-caption').textContent='按住揉一揉，松开就回弹';});
    canvas.addEventListener('pointermove',e=>{const p=local(e);pointer={...p,inside:hit(p)};canvas.style.cursor=hold?'grabbing':pointer.inside?'grab':'default';if(hold&&hold.id===e.pointerId){const prev=hold.p;hold.p=p;hold.dx=clamp(p.x-hold.start.x,-115,115);hold.dy=clamp(p.y-hold.start.y,-90,80);hold.moved+=Math.hypot(p.x-prev.x,p.y-prev.y);fruitV+=clamp((p.x-prev.x)*.025,-.45,.45);if(hold.moved>24&&!hold.said){speak('宝……我的正面被你揉到背面去了。','squish',5000);hold.said=true;} }});
    function release(e){if(!hold||(e&&hold.id!==e.pointerId))return;const h=hold;hold=null;if(canvas.hasPointerCapture(h.id))canvas.releasePointerCapture(h.id);if(h.moved>24||time-h.t>.65){qv+=1.7;tiltV+=h.dx*.016;fruitV+=h.dx*.024;speak(h.moved>150?'宝，先别动，让草莓缓一缓……':'松手啦。我慢慢变回圆乎乎。',h.moved>150?'dizzy':'sleepy');audio('bounce',.6);}canvas.style.cursor='grab';$('stage-caption').textContent='可以直接碰我';}
    canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);canvas.addEventListener('pointerleave',()=>{pointer.inside=false;});
    $('poke').addEventListener('click',()=>poke());$('knead').addEventListener('click',knead);$('bounce').addEventListener('click',bounce);$('reset').addEventListener('click',reset);
    $('softness').addEventListener('input',e=>{soft=Number(e.target.value)/100;e.target.style.setProperty('--fill',e.target.value+'%');const label=soft<.33?'弹嘟嘟':soft>.8?'糯叽叽':'软乎乎';$('soft-value').textContent=label;e.target.setAttribute('aria-valuetext',label);qv+=.45;});
    $('sound').addEventListener('click',()=>{soundEnabled=!soundEnabled;$('sound').setAttribute('aria-pressed',String(soundEnabled));$('sound').setAttribute('aria-label',soundEnabled?'关闭果冻音效':'开启果冻音效');$('sound-label').textContent=soundEnabled?'声音开着':'声音关着';$('sound-mark').setAttribute('d',soundEnabled?'M17 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14':'m17 9 5 6m0-6-5 6');if(soundEnabled)audio();});
    document.addEventListener('keydown',e=>{if(e.repeat||/INPUT|TEXTAREA|BUTTON|SELECT/.test(e.target.tagName))return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();poke();}else if(e.target===canvas&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();forceAt(e.code==='ArrowLeft'?-110:e.code==='ArrowRight'?110:0,e.code==='ArrowUp'?-100:75,220);qv+=1.5;fruitV+=2;speak('键盘也摸得到我，宝。','happy');}});
    function path(){ctx.beginPath();let first=nodes[0],lastNode=nodes[N-1];ctx.moveTo((first.x+lastNode.x)/2,(first.y+lastNode.y)/2);for(let i=0;i<N;i++){const a=nodes[i],b=nodes[(i+1)%N];ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);}ctx.closePath();}
    function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
    function line(points,color,width=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
    function fruit(x,y,angle){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(.82,.82);
      ctx.beginPath();ctx.moveTo(0,-27);ctx.bezierCurveTo(-45,-51,-58,-12,-40,17);ctx.bezierCurveTo(-30,35,-12,58,0,61);ctx.bezierCurveTo(12,58,30,35,40,17);ctx.bezierCurveTo(58,-12,45,-51,0,-27);ctx.closePath();
      const g=ctx.createLinearGradient(-36,-30,38,45);g.addColorStop(0,'#ff8670');g.addColorStop(.38,'#ee594e');g.addColorStop(.74,'#da4842');g.addColorStop(1,'#b53f3b');ctx.fillStyle=g;ctx.shadowColor='#c7624c35';ctx.shadowBlur=14;ctx.shadowOffsetY=5;ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
      ctx.save();ctx.clip();const sh=ctx.createRadialGradient(-22,-20,0,-7,0,63);sh.addColorStop(0,'#ffd6a646');sh.addColorStop(.7,'#ffad8c00');sh.addColorStop(1,'#9a29452c');ctx.fillStyle=sh;ctx.fillRect(-65,-50,130,120);
      for(let row=0;row<6;row++){const yy=-23+row*13,columns=row<3?5:row===3?4:row===4?3:2;for(let col=0;col<columns;col++){const xx=(col-(columns-1)/2)*14+(row%2?2:0);ctx.save();ctx.translate(xx,yy+Math.sin(col*3+row)*2);ctx.rotate(-xx*.008);ellipse(0,0,1.8,3.2,'#a6383d66');ellipse(-.35,-.75,1.15,2.3,'#ffe3a0c7');ctx.restore();}}
      ctx.beginPath();ctx.moveTo(-29,-18);ctx.bezierCurveTo(-37,-9,-32,1,-32,4);ctx.strokeStyle='#ffe7c480';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();ctx.restore();
      for(let i=0;i<6;i++){ctx.save();ctx.translate(0,-29);ctx.rotate(-1.35+i*.52);ctx.beginPath();ctx.moveTo(0,3);ctx.quadraticCurveTo(-12,-10,0,-29-(i%2)*6);ctx.quadraticCurveTo(12,-11,0,3);const lg=ctx.createLinearGradient(-8,-22,8,0);lg.addColorStop(0,'#9aa66b');lg.addColorStop(1,'#547b55');ctx.fillStyle=lg;ctx.fill();line([[0,0],[0,-22]],'#bec38b80',.8);ctx.restore();}ctx.beginPath();ctx.moveTo(0,-28);ctx.quadraticCurveTo(5,-40,0,-46);ctx.strokeStyle='#68804f';ctx.lineWidth=3.5;ctx.stroke();ctx.restore();
    }
    function face(dx,dy){ctx.save();ctx.translate(dx,dy);const squint=!!hold||autoKnead>0,mood=faceMood;let open=1;if(blink>0)open=Math.max(.06,1-Math.sin(blink/.16*Math.PI));
      for(const sign of [-1,1]){const ex=sign*40;ctx.save();ctx.translate(ex,-32);if(squint){ctx.beginPath();ctx.moveTo(-8,0);ctx.quadraticCurveTo(0,7,8,-1);ctx.strokeStyle='#62413b';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();}else if(mood==='dizzy'){ctx.beginPath();for(let k=0;k<29;k++){const a=k*.26,r=k*.25;const x=Math.cos(a)*r,y=Math.sin(a)*r;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.strokeStyle='#62413b';ctx.lineWidth=2.2;ctx.stroke();}else{ellipse(eyesX,eyesY,8.3,10.1*open,'#593a35');if(open>.5){ellipse(eyesX-2.5,eyesY-3.3,2.3,2.6,'#fff7e9');ellipse(eyesX+2.3,eyesY+4,1.05,1.05,'#a2765a');}}ctx.restore();}
      for(const sign of [-1,1]){const blush=ctx.createRadialGradient(sign*62,-10,0,sign*62,-10,20);blush.addColorStop(0,'#e7656a50');blush.addColorStop(1,'#e7656a00');ellipse(sign*62,-10,23,13,blush);for(let i=0;i<3;i++)line([[sign*62-7+i*6,-13],[sign*62-8+i*6,-8]],'#d66b6a55',1.3);}
      if(mood==='surprise'&&!squint)ellipse(0,-15,4.6,6.8,'#82534b');else{ctx.beginPath();ctx.moveTo(-7,-15);ctx.quadraticCurveTo(0,squint?-7:-6,8,-16);ctx.strokeStyle='#754941';ctx.lineWidth=2.9;ctx.lineCap='round';ctx.stroke();}ctx.restore();}
    function physics(dt){time+=dt;if(autoKnead>0){autoKnead-=dt;autoElapsed+=dt;if(autoKnead<=0){qv+=2.3;fruitV+=2;speak('松手啦。我慢慢变回圆乎乎。','sleepy');}}
      const active=!!hold||autoKnead>0,moveX=hold?hold.dx:autoKnead>0?Math.sin(autoElapsed*13)*58:0,moveY=hold?hold.dy:autoKnead>0?Math.cos(autoElapsed*11)*25:0;
      const gripX=hold?hold.start.x:35,gripY=hold?hold.start.y:-60;
      const stiffness=165-soft*110,damping=7.5-soft*2.9;
      qv+=(-q*(90-soft*45)-qv*(7.5-soft*3))*dt;q=clamp(q+qv*dt,-.75,.85);
      tiltV+=((active?moveX*.0012:0)-tilt)*75*dt-tiltV*6*dt;tilt=clamp(tilt+tiltV*dt,-.45,.45);
      if(jump>0||jumpV>0){jumpV-=1020*dt;jump+=jumpV*dt;if(jump<0){jump=0;qv+=Math.min(6,-jumpV*.011);fruitV+=2;jumpV=0;ring(0,106);audio('bounce',.7);}}
      fruitV+=(-.20-fruitAngle)*30*dt-fruitV*3.8*dt+tiltV*.7*dt;fruitAngle=clamp(fruitAngle+fruitV*dt,-1.2,1.2);fruitXV+=((active?moveX*.17:0)-fruitX)*35*dt-fruitXV*4.5*dt;fruitX=clamp(fruitX+fruitXV*dt,-25,25);
      const squeeze=active?Math.min(.19,(hold?time-hold.t:autoElapsed)*.24):0;
      const breathing=reduced.matches?0:Math.sin(time*1.8)*1.0;
      for(let i=0;i<N;i++){const n=nodes[i],prev=nodes[(i+N-1)%N],next=nodes[(i+1)%N],dist=Math.hypot(n.bx-gripX,n.by-gripY),w=Math.exp(-dist*dist/16000);
        const tx=n.bx*(1+squeeze*.45)+moveX*(.12+w*.62),ty=n.by*(1-squeeze)+squeeze*65+moveY*(.10+w*.58)+breathing*(1-n.by/140);
        const smoothX=((prev.x-prev.bx)+(next.x-next.bx))/2-(n.x-n.bx),smoothY=((prev.y-prev.by)+(next.y-next.by))/2-(n.y-n.by);
        n.vx+=((tx-n.x)*stiffness+smoothX*38-n.vx*damping)*dt;n.vy+=((ty-n.y)*stiffness+smoothY*38-n.vy*damping)*dt;n.x=clamp(n.x+n.vx*dt,n.bx-110,n.bx+110);n.y=clamp(n.y+n.vy*dt,n.by-100,n.by+100);
      }
      if(!reduced.matches&&time>nextBlink){blink=.16;nextBlink=time+3.1+Math.random()*2.5;}blink=Math.max(0,blink-dt);const lookX=pointer.inside?clamp(pointer.x*.026,-3.5,3.5):0,lookY=pointer.inside?clamp((pointer.y+30)*.024,-2.8,3):0;eyesX+=(lookX-eyesX)*dt*8;eyesY+=(lookY-eyesY)*dt*8;
      if(time>moodUntil&&!active)faceMood='happy';for(const r of ripples)r.t+=dt;ripples=ripples.filter(r=>r.t<.7);
    }
    function render(){ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(cx,cy);
      const floorY=107*scale,shadowW=(155-jump*.23)*scale,shadow=ctx.createRadialGradient(0,0,4,0,0,Math.max(10,shadowW));shadow.addColorStop(0,'#b7776242');shadow.addColorStop(.5,'#c68b6d20');shadow.addColorStop(1,'#d2a08300');ctx.save();ctx.translate(0,floorY);ctx.scale(1,.17);ellipse(0,0,Math.max(20,shadowW),Math.max(20,shadowW),shadow);ctx.restore();
      ctx.beginPath();ctx.ellipse(0,floorY+3*scale,185*scale,23*scale,0,0,Math.PI*2);ctx.strokeStyle='#d9c5ac45';ctx.lineWidth=1;ctx.stroke();
      ctx.translate(0,-jump*scale);ctx.scale(scale,scale);ctx.rotate(tilt);ctx.scale(1+q*.24,1-q*.18);
      let avgX=0,avgY=0;for(const n of nodes){avgX+=n.x-n.bx;avgY+=n.y-n.by;}avgX/=N;avgY/=N;
      for(const sign of [-1,1]){ctx.save();ctx.translate(sign*144+avgX*.6,26+avgY*.5);ctx.rotate(sign*-.25+tilt);const arm=ctx.createLinearGradient(-14,-18,12,18);arm.addColorStop(0,'#ffdfd4b5');arm.addColorStop(.5,'#f5b1a7af');arm.addColorStop(1,'#d9877b80');ellipse(0,0,18,26,arm);ctx.beginPath();ctx.ellipse(0,0,18,26,0,0,Math.PI*2);ctx.strokeStyle='#e6a99b70';ctx.lineWidth=1;ctx.stroke();ellipse(-5,-7,4,10,'#fffbf064');ctx.restore();}
      path();const body=ctx.createRadialGradient(-66,-82,8,15,20,205);body.addColorStop(0,'#ffe4d6ef');body.addColorStop(.34,'#fbc9bdbd');body.addColorStop(.70,'#efa49bab');body.addColorStop(.88,'#e99a8dca');body.addColorStop(1,'#d88b7bdb');ctx.fillStyle=body;ctx.fill();
      ctx.save();path();ctx.clip();
      const inner=ctx.createRadialGradient(0,15,5,0,25,124);inner.addColorStop(0,'#fff5da6b');inner.addColorStop(.67,'#ffe6ca38');inner.addColorStop(1,'#ffdab000');ellipse(0,30,150,135,inner);
      ellipse(avgX*.6,87+avgY*.6,111,14,'#fff9e83b');ellipse(avgX*.6,94+avgY*.6,104,6,'#fef2d548');
      fruit(avgX*.52+fruitX+4,45+avgY*.7+Math.sin(time*1.7)*(reduced.matches?0:1.8),fruitAngle);
      const veil=ctx.createLinearGradient(-150,-130,140,120);veil.addColorStop(0,'#fff1db0d');veil.addColorStop(.47,'#fff6e313');veil.addColorStop(.65,'#ffdfc708');veil.addColorStop(1,'#f7c5a929');ctx.fillStyle=veil;ctx.fillRect(-260,-210,520,420);
      for(let i=0;i<12;i++){const xx=Math.sin(i*17.19)*119+avgX*.7,yy=-70+(i*47)%159+avgY*.65+Math.sin(time*.7+i)*1.8,rr=1.8+(i*7%5)*.75;const b=ctx.createRadialGradient(xx-rr*.3,yy-rr*.3,.2,xx,yy,rr);b.addColorStop(0,'#fffef27d');b.addColorStop(.45,'#fff3d80c');b.addColorStop(.8,'#c4786630');b.addColorStop(1,'#fff9e878');ellipse(xx,yy,rr,rr,b);ellipse(xx-rr*.3,yy-rr*.4,rr*.22,rr*.16,'#fffbeaaf');}
      const edge=ctx.createLinearGradient(-146,0,146,0);edge.addColorStop(0,'#fff8e98c');edge.addColorStop(.1,'#fff8e900');edge.addColorStop(.9,'#fff8e900');edge.addColorStop(1,'#fff8e97a');ctx.fillStyle=edge;ctx.fillRect(-200,-180,400,360);
      // Reflections follow the deforming upper surface, not a rigid overlay.
      for(const [start,end,offset,lw,alpha] of [[29,38,5,6,.70],[39,46,6,3,.54],[48,52,5,2,.62],[1,8,7,4,.40]]){ctx.beginPath();for(let i=start;i<=end;i++){const n=nodes[i%N],len=Math.hypot(n.x,n.y)||1,x=n.x-n.x/len*offset,y=n.y-n.y/len*offset;i===start?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.strokeStyle='rgba(255,253,238,'+alpha+')';ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
      ctx.save();ctx.translate(-85+avgX*.7,-68+avgY*.6);ctx.rotate(.5);ellipse(0,0,7,19,'#fffbed6b');ellipse(15,-23,3.2,6.2,'#fffdf27d');ctx.restore();
      face(avgX*.75,avgY*.70);
      for(const r of ripples){ctx.beginPath();ctx.ellipse(r.x,r.y,8+r.t*37,4+r.t*19,0,0,Math.PI*2);ctx.strokeStyle='rgba(255,250,235,'+(.8*(1-r.t/.7))+')';ctx.lineWidth=1.4;ctx.stroke();}
      ctx.restore();path();ctx.strokeStyle='#d58c7c63';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
    }
    function tick(now){if(!last)last=now;const elapsed=Math.min((now-last)/1000,.04);last=now;const count=Math.max(1,Math.ceil(elapsed/(1/120)));for(let i=0;i<count;i++)physics(elapsed/count);render();frame=requestAnimationFrame(tick);}
    document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);release();last=0;}else{last=0;frame=requestAnimationFrame(tick);}});
    frame=requestAnimationFrame(tick);
  })();
  </script>
