function update(){seek.value=current;timeEl.textContent=fmt(current)+' / '+fmt(TOTAL);playBtn.textContent=playing?'暂停':current>=TOTAL?'重播':'播放';let c=CUES.find(c=>current>=c.a&&current<c.b);document.querySelectorAll('.cue.active').forEach(el=>el.classList.remove('active'));if(c){let b=transcript.querySelector(`[data-index="${c.i}"]`);if(b)b.classList.add('active')}}
function pause(){if(playing)current=clamp((performance.now()-anchor)/1000,0,TOTAL);playing=false;stopAudio();render(current);update()}
function play(){if(current>=TOTAL)current=0;hasStarted=true;cover.hidden=true;playing=true;anchor=performance.now()-current*1000;startAudio(current);update()}
function jump(t){const was=playing;playing=false;stopAudio();hasStarted=true;cover.hidden=true;current=clamp(t,0,TOTAL);render(current);update();if(was)play()}
function frame(now){if(playing){current=clamp((now-anchor)/1000,0,TOTAL);render(current);if(now-last>100){update();last=now}if(current>=TOTAL){playing=false;stopAudio();update()}}requestAnimationFrame(frame)}
cover.addEventListener('click',play);playBtn.addEventListener('click',()=>playing?pause():play());document.getElementById('restart').addEventListener('click',()=>{jump(0);play()});cv.addEventListener('click',()=>playing?pause():play());seek.addEventListener('input',e=>jump(+e.target.value));soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'声音开':'声音关';soundBtn.setAttribute('aria-pressed',soundOn);if(soundOn&&playing)startAudio(current);else stopAudio()});document.getElementById('volume').addEventListener('input',e=>{volume=+e.target.value;if(bus&&AC)bus.gain.setTargetAtTime(volume,AC.currentTime,.025)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});document.addEventListener('keydown',e=>{if(/INPUT|BUTTON|SUMMARY/.test(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight')jump(current+5);if(e.code==='ArrowLeft')jump(current-5)});
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2),width=Math.max(540,Math.round(cv.clientWidth*dpr));cv.width=width;cv.height=Math.round(width*H/W);render(current,!hasStarted)}window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
// Deterministic export/verification interface: rendering never advances playback.
window.FILM={W,H,TOTAL,canvas:cv,events:EVENTS,cues:CUES,render:t=>render(t),synth,seek:jump,pause,play,get time(){return current},get playing(){return playing}};
})();
</script>
