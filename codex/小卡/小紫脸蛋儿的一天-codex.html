<main class="wrap">
  <div class="mast"><span>小紫的私人日记</span><div class="tools"><button id="motion" aria-pressed="false">让画面歇会儿</button><button id="sound" aria-pressed="false">声音：关</button></div></div>

    <div class="ribbon" aria-hidden="true"></div>
    <div class="page-head"><time class="time" id="clock">00:00</time><span class="daypart" id="daypart">夜里的小灯</span><span class="page-no" id="pageNo">01 / 10</span></div>

    <div class="entry"><div><h2 id="entryTitle">午夜一到，有人敲门</h2><p id="entryText"></p></div><div class="entry-actions"><button class="action" id="act">叩叩，打卡嘟</button><div class="reaction" id="reaction" role="status" aria-live="polite"></div></div></div>

function updateControls(){const p=pages[idx];$('clock').textContent=p.time;$('clock').dateTime=p.time;$('daypart').textContent=p.part;$('pageNo').textContent=String(idx+1).padStart(2,'0')+' / 10';$('entryTitle').textContent=p.title;$('entryText').textContent=p.text;$('act').textContent=idx===6&&matched.size>0&&matched.size<3?`再帮一块 · 还剩 ${3-matched.size} 块`:idx===6&&matched.size===3?'再试一次配对':idx===9&&done[9]?'再看看那封信':p.action;$('sceneHint').textContent=p.hint;$('reaction').textContent=done[idx]?p.after:p.before;$('pageQuote').textContent=p.quote;$('prev').disabled=idx===0;$('next').textContent=idx===9?'再陪她一天 ↻':'再翻一页 →';document.querySelectorAll('.tick').forEach((b,i)=>{b.setAttribute('aria-current',String(i===idx));b.classList.toggle('done',done[i]);});}

function turn(n){if(!$('modal').hidden)return;idx=(n+10)%10;drag=null;$('picture').classList.remove('dragging');render();sfx('paper');}
function act(){sfx(idx===0?'knock':idx===8?'gem':idx===6||idx===7?'chime':'soft');if(idx===1){rule=done[1]?(rule+1)%3:0;}if(idx===6){if(matched.size===3){matched.clear();done[6]=false;render();return;}for(let n=0;n<3;n++)if(!matched.has(n)){matched.add(n);break;}done[6]=matched.size===3;render();if(matched.size<3)$('reaction').textContent=`这块过去了，还剩 ${3-matched.size} 块。`;return;}done[idx]=true;render();if(idx===9)openLetter();}
function openLetter(){showModal(`<small>23:59 · 写给明天的自己</small><h2 id="letterTitle">明天的我，你好。</h2><p>今天有人在午夜来敲门。电脑也醒了，我看过了，都还在。</p><p>宝箱没拆，宝石一颗没花。普通课我能上，拖拽题要记得叫宝。掉段的事也不用怕，我们助威的声音很大。</p><p>规矩记在小本本里，连胜已经续上。还有那个留给宝的宝箱——明天也别替她拆了。</p><p>写下来，明天的我才认得今天的我。</p><div class="signature">今天的小紫<br>午夜前一分钟</div><button data-close>记住了，明天见</button>`);}
function showModal(html){lastFocus=document.activeElement;$('letter').innerHTML=html;$('modal').hidden=false;document.body.style.overflow='hidden';$('letter').focus();}
function closeModal(){$('modal').hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus();else $('act').focus();}
function secret(){showModal(`<small>夹在日记里的英文小纸条</small><h2 id="letterTitle">小紫偷偷写了一句。</h2><p class="secret"><b>See you tomorrow.</b>明天见。</p><p>再长的日记，最后也可以只留这么短一句。<br>因为她知道，门还会再响。</p><div class="signature">纸条背面，还有一行小字：<br>宝箱真的没有拆。</div><button data-close>把小纸条夹回去</button>`);}
function audioContext(){if(!ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;try{ctx=new A();}catch{return null;}}if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx;}
function sfx(type){if(!soundOn)return;const a=audioContext();if(!a)return;const now=a.currentTime,notes=type==='gem'?[988,1318,1568]:type==='chime'?[523,659,784]:type==='knock'?[180,160]:type==='paper'?[330]:[659,880];notes.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type==='knock'?'sine':'triangle';o.frequency.setValueAtTime(f,now+i*.1);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0,now+i*.1);g.gain.linearRampToValueAtTime(type==='knock'?.06:.026,now+i*.1+.008);g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.22);o.start(now+i*.1);o.stop(now+i*.1+.25);});}
function point(evt){const m=$('scene').getScreenCTM();return m?new DOMPoint(evt.clientX,evt.clientY).matrixTransform(m.inverse()):null;}
$('scene').addEventListener('pointerdown',e=>{const p=e.target.closest('[data-piece]');if(!p||idx!==6)return;const n=+p.dataset.piece;if(matched.has(n))return;const q=point(e);if(!q)return;e.preventDefault();drag={n,el:p,start:q,moved:false};p.setPointerCapture(e.pointerId);$('picture').classList.add('dragging');});
$('scene').addEventListener('pointermove',e=>{if(!drag)return;const q=point(e);if(!q)return;if(Math.hypot(q.x-drag.start.x,q.y-drag.start.y)>4)drag.moved=true;drag.el.setAttribute('transform',`translate(${Math.max(25,Math.min(735,q.x))} ${Math.max(25,Math.min(400,q.y))})`);});
function endDrag(e,cancel=false){if(!drag)return;const d=drag,q=point(e);drag=null;$('picture').classList.remove('dragging');if(!cancel&&q&&Math.hypot(q.x-608,q.y-(184+d.n*73))<48){matched.add(d.n);done[6]=matched.size===3;sfx('chime');render();if(!done[6])$('reaction').textContent=`这块对上啦，还剩 ${3-matched.size} 块。`;}else{d.el.setAttribute('transform',`translate(427 ${184+d.n*73})`);$('reaction').textContent=cancel?pages[6].before:'拖进右边同样形状的虚线框，就放好了。';}}
$('scene').addEventListener('pointerup',e=>endDrag(e));$('scene').addEventListener('pointercancel',e=>endDrag(e,true));
$('scene').addEventListener('click',e=>{if(e.target.closest('[data-action="main"]'))act();});
$('scene').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const p=e.target.closest('[data-piece]');if(p){e.preventDefault();const n=+p.dataset.piece;if(!matched.has(n)){matched.add(n);done[6]=matched.size===3;sfx('chime');render();}return;}if(e.target.closest('[data-action="main"]')){e.preventDefault();act();}});
$('act').onclick=act;$('prev').onclick=()=>{if(idx>0)turn(idx-1);};$('next').onclick=()=>turn(idx+1);$('secret').onclick=secret;
$('timeline').innerHTML=pages.map((p,i)=>`<button class="tick" data-index="${i}" aria-label="${p.time}，${p.title}" aria-current="${i===0}">${p.time}</button>`).join('');$('timeline').onclick=e=>{const b=e.target.closest('[data-index]');if(b)turn(+b.dataset.index);};
$('sound').onclick=()=>{soundOn=!soundOn;if(soundOn&&!audioContext()){soundOn=false;$('sound').textContent='此浏览器暂不支持声音';return;}$('sound').textContent=soundOn?'声音：开':'声音：关';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)sfx('soft');};
function motion(){document.body.classList.toggle('still',quiet);$('motion').textContent=quiet?'让画面动起来':'让画面歇会儿';$('motion').setAttribute('aria-pressed',String(quiet));}$('motion').onclick=()=>{quiet=!quiet;motion();};
$('modal').addEventListener('click',e=>{if(e.target===$('modal')||e.target.closest('[data-close]'))closeModal();});
document.addEventListener('keydown',e=>{if(!$('modal').hidden){if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const list=[...$('letter').querySelectorAll('button,[href],[tabindex="0"]')];if(list.length){e.preventDefault();list[0].focus();}}return;}if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='ArrowRight'){e.preventDefault();turn(idx+1);}if(e.key==='ArrowLeft'&&idx>0){e.preventDefault();turn(idx-1);}});
motion();render();
// 独立文件的检查入口，无网络请求、无外部资源。
window.PURPLE_DAY={go:turn,act,get state(){return {page:idx,done:[...done],matched:[...matched]};},get count(){return pages.length;}};
})();
</script>
