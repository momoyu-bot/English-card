<script>
(()=>{
'use strict';
const cv=document.getElementById('film'),g=cv.getContext('2d'),W=360,H=640;
const TAU=Math.PI*2,INK='#263730',PAPER='#eadfc7',MINT='#b7d2ad',GOLD='#dbb77a';
let S=2,TOTAL=0;
const scenes=Array.from(document.querySelectorAll('.scene')).map(el=>{
  const sc={id:el.dataset.id,name:el.dataset.name,start:TOTAL,dur:+el.dataset.duration,el};
  sc.caps=Array.from(el.querySelectorAll('button[data-t]')).map(el=>{const [a,b]=el.dataset.t.split(',').map(Number);return {a,b,text:el.textContent,who:el.dataset.who,el};});
  TOTAL+=sc.dur;return sc;
});
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),lerp=(a,b,p)=>a+(b-a)*clamp(p),ease=p=>{p=clamp(p);return p*p*(3-2*p)},range=(t,a,b)=>ease((t-a)/(b-a));
const q=n=>Math.round(n),move=(a,b,t,t0,t1)=>q(lerp(a,b,range(t,t0,t1))),step=(t,period=.24)=>Math.floor(t/period),bob=(t,i=0)=>((step(t,.36)+i)%2)*2;
function sceneAt(t){return scenes.find(s=>t<s.start+s.dur)||scenes[scenes.length-1];}
function setup(pxW){cv.width=Math.max(180,Math.round(pxW));cv.height=Math.round(cv.width*H/W);S=cv.width/W;g.imageSmoothingEnabled=false;}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function round(x,y,w,h,r,c){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();}
function circle(x,y,r,c){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();}
function line(x1,y1,x2,y2,c,w=1){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=c;g.lineWidth=w;g.stroke();}
function poly(points,c){g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();}
function text(s,x,y,size=15,c=INK,align='center',serif=false){g.fillStyle=c;g.font=`${size}px ${serif?'"Songti SC","SimSun",serif':'"PingFang SC","Microsoft YaHei",sans-serif'}`;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function alpha(a,fn){g.save();g.globalAlpha*=clamp(a);fn();g.restore();}
function at(x,y,angle,scale,fn){g.save();g.translate(x,y);g.rotate(angle);g.scale(scale,scale);fn();g.restore();}
function star(x,y,r,c=GOLD,rot=0){at(x,y,rot,1,()=>{const pts=[];for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.42:r;pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);}poly(pts,c);});}
function shadow(x,y,w=24){g.beginPath();g.ellipse(x,y,w,w*.2,0,0,TAU);g.fillStyle='#11261e24';g.fill();}
function paper(x,y,w,h,ang=0,fn=()=>{}){at(x+w/2,y+h/2,ang,1,()=>{rect(-w/2+3,-h/2+5,w,h,'#15251f20');rect(-w/2,-h/2,w,h,'#f5eacf');rect(-9,-h/2-4,18,9,'#ccb988a0');fn(-w/2,-h/2);});}
function beam(x,y,tx,ty,w,color='#ffe2a8'){alpha(.19,()=>poly([[x-5,y],[x+5,y],[tx+w,ty],[tx-w,ty]],color));}

// 小脸蛋的两条反斜杠眼缝是洞；画面先画好，再以 evenodd 透出原背景。
function face(x,foot,r,c,t=0,rot=0){
  shadow(x,foot+2,r*.78);at(x,foot-r,rot,1,()=>{
    g.beginPath();g.arc(0,0,r,0,TAU);
    const blink=(Math.floor(t*10)%49===0)?.22:1;
    [[.194,-.416,.194],[.626,-.497,.129]].forEach(([ex,ey,ww])=>{
      g.save();g.translate(ex*r,ey*r);g.rotate(-26.3*Math.PI/180);const h=.418*r*blink,w=ww*r;
      g.roundRect(-w/2,-h/2,w,h,Math.min(w,h)/2);g.restore();
    });g.fillStyle=c;g.fill('evenodd');
  });
}
function clawd(x,foot,k=.4,o={}){
  shadow(x,foot+2,72*k);at(q(x-117.5*k),q(foot-169*k),0,k,()=>{
    rect(44,50,147,98,'#d47f59');rect(20,99+(o.lift||0),24,21,'#d47f59');rect(191,99+(o.lift||0),25,21,'#d47f59');
    [44,68,152,176].forEach(xx=>rect(xx,148,15,21,'#d47f59'));
    [70,158].forEach(xx=>rect(xx,o.blink?88:78,8,o.blink?5:21,'#241b19'));
  });
}
const FOX=['.D..........D.......','.DM........MD.......','.MCM......MCM...CC..','.MMMMMMMMMMMM..CCCC.','.MMEEMMMMEEMM..MMMM.','.MMEEMMMMEEMM..MMMMM','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'];
const CAT=['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','.....X.MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'];
function pet(kind,x,foot,n=3,t=0,o={}){
  const rows=kind==='fox'?FOX:CAT,pal=kind==='fox'?{M:'#E2552B',C:'#FFF3E3',D:'#3B2520',E:'#3B2520'}:{M:'#F3E7D6',X:'#4E382E',E:'#79C0F0'};
  x=q(x-10*n);const y=q(foot-12*n);shadow(x+10*n,foot+2,9*n);
  rows.forEach((row,j)=>Array.from(row).forEach((ch,i)=>{if(ch==='.')return;let col=pal[ch];if(ch==='E'&&((step(t,.1)%57===0)||o.blink)&&(j===(kind==='fox'?4:5)))col=pal.M;rect(x+i*n,y+j*n,n,n,col);}));
}
const WHO=['clawd','pink','purple','black','fox','cat'];
function actor(id,x,foot,t=0,scale=1){if(id==='clawd')clawd(x,foot,.37*scale,{blink:step(t,.1)%57===0});else if(id==='fox'||id==='cat')pet(id,x,foot,Math.max(1,Math.round(3*scale)),t);else face(x,foot,21*scale,{pink:'#FF309B',purple:'#9159FE',black:'#000000'}[id],t,0);}
function cast(t,y=475,positions=[48,101,151,204,254,311]){WHO.forEach((id,i)=>actor(id,positions[i],y-bob(t,i),t+i*.7,.85));}
function bulb(x,y,on=true){line(x,0,x,y-10,'#535e50',2);poly([[x-18,y],[x+18,y],[x+11,y-12],[x-11,y-12]],'#4d6657');circle(x,y+2,6,on?'#ffdda0':'#8f977a');if(on)beam(x,y+5,x,y+300,110);}
function room(t=0,warm=false){
  rect(0,0,W,540,warm?'#d7c7a7':'#b8bda5');rect(0,43,W,260,warm?'#ddceb0':'#c2c5ad');

function caption(cap){

/* 原创配乐：前半段的拨弦问句，追车时加快，最后落到三拍子。
   音效也按电影时间排在同一张表里，拖动、重播和静音不会积攒旧声音。 */
function score(){
  const ev=[];
  const add=(t,m,d=.3,v=.045,w='pluck',s=1)=>{if(t>=0&&t<TOTAL)ev.push({t,m,f:440*Math.pow(2,(m-69)/12),d:Math.min(d,TOTAL-t),v,w,s});};
  const motif=[62,69,74,0,72,69,65,0,64,69,0,77,74,0,69,0];
  for(let t=1,i=0;t<78;t+=.46,i++){
    const m=motif[i%motif.length];if(m)add(t,m,.23,i%4===0?.045:.029);
    if(i%8===0)add(t,38+(Math.floor(i/32)%2?5:0),1.05,.031,'soft');
    if(i%16===12)add(t+.13,81,.64,.016,'bell');
  }
  for(let t=78,i=0;t<106;t+=.26,i++){
    const m=[62,65,69,74,72,69,65,64][i%8];add(t,m,.15,.036,'pluck');
    if(i%4===0)add(t,38+(i%8===0?0:7),.3,.04);
  }
  for(let t=108,i=0;t<128;t+=.83,i++){const m=[69,74,77,76,72,69,65,0][i%8];if(m)add(t,m,1.6,.031,'bell');if(i%4===0)add(t,50,2.5,.02,'soft');}
  const warm=[[50,57,62,66],[55,62,67,71],[47,54,59,62],[45,52,57,61]],mel=[74,0,78,81,78,74,73,0,76,81,79,76,71,0,74,78,76,74,73,69,0,73,74,0];
  for(let t=128,i=0;t<199;t+=.49,i++){
    const c=warm[Math.floor(i/12)%4];if(i%3===0)add(t,c[0],.85,.035,'soft');else{add(t,c[1],.6,.018);add(t,c[2],.7,.017);}
    if(mel[i%24])add(t+.02,mel[i%24],.8,.03,'bell');
  }
  [50,57,62,66,74].forEach((m,i)=>add(199+i*.09,m,2.5,.032,'bell'));
  // 道具声：敲门、滚轮、飞布、场记铃。所有音量都保留余地。
  [59,59.52,60.04].forEach(t=>{add(t,45,.17,.11,'tap');add(t,57,.09,.045);});
  [30,38,42,50,53,57,87,91,101,104].forEach((t,i)=>add(t,76+i%4*3,.12,.04));
  for(let t=78.5;t<94;t+=.28)add(t,42,.05,.032,'tap');
  add(90.4,81,.8,.08,'air',.3);add(96.6,45,.13,.07,'tap');add(100,42,.3,.12,'tap');
  [104.1,157,199].forEach(t=>{add(t,88,1.1,.08,'bell');add(t+.04,95,.8,.035,'bell');});
  for(let i=0;i<16;i++)add(140.5+i*.13,74+i%8*2,.32,.028,'bell');
  add(155.8,43,.1,.09,'tap');
  return ev.sort((a,b)=>a.t-b.t);
}
const EVENTS=score();
function noise(ac){
  if(ac.__guestNoise)return ac.__guestNoise;
  const b=ac.createBuffer(1,Math.ceil(ac.sampleRate),ac.sampleRate),d=b.getChannelData(0);let seed=19;
  for(let i=0;i<d.length;i++){seed=(Math.imul(seed,1664525)+1013904223)|0;d[i]=((seed>>>0)/4294967296)*2-1;}
  ac.__guestNoise=b;return b;
}
function synth(ac,dest,e,when){
  const gain=ac.createGain();gain.connect(dest);const dur=Math.max(.03,e.d),attack=e.w==='soft'?.08:.005;
  gain.gain.setValueAtTime(.0001,when);gain.gain.linearRampToValueAtTime(e.v,when+Math.min(attack,dur*.25));gain.gain.exponentialRampToValueAtTime(.0001,when+dur);
  if(e.w==='tap'||e.w==='air'){
    const src=ac.createBufferSource(),filter=ac.createBiquadFilter();src.buffer=noise(ac);filter.type='bandpass';filter.frequency.setValueAtTime(e.w==='tap'?340:1700,when);filter.Q.value=e.w==='tap'?1.4:.55;
    if(e.w==='air')filter.frequency.exponentialRampToValueAtTime(350,when+dur);src.connect(filter);filter.connect(gain);src.start(when);src.stop(when+dur+.01);src.onended=()=>gain.disconnect();return;
  }
  const partials=e.w==='bell'?[[1,1],[2.76,.12]]:[[1,1]];
  partials.forEach(([mult,level],i)=>{const osc=ac.createOscillator(),hg=ac.createGain();osc.type=e.w==='pluck'?'triangle':'sine';osc.frequency.value=e.f*mult;hg.gain.value=level;osc.connect(hg);hg.connect(gain);osc.start(when);osc.stop(when+dur+.02);if(i===0)osc.onended=()=>gain.disconnect();});
}
const player=document.getElementById('player'),screen=document.getElementById('screen'),big=document.getElementById('big'),pp=document.getElementById('pp'),seek=document.getElementById('seek'),time=document.getElementById('time'),sound=document.getElementById('sound'),chapters=document.getElementById('chapters');
let playing=false,started=false,cur=0,anchor=0,base=0,raf=0,soundOn=true,AC=null,bus=null,pumpId=0,audioEpoch=0,nextEvent=0,lastCap=null,lastScene=null;
seek.max=String(TOTAL);
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function clockNow(){return playing?Math.min(TOTAL,base+(performance.now()-anchor)/1000):cur;}
function audioStop(){
  audioEpoch++;if(pumpId)clearInterval(pumpId);pumpId=0;
  if(bus){const old=bus;bus=null;try{old.gain.setTargetAtTime(0,AC.currentTime,.012);setTimeout(()=>old.disconnect(),120);}catch(_){old.disconnect();}}
}
function audioStart(){
  audioStop();if(!soundOn||!playing)return;
  try{
    const AudioClass=window.AudioContext||window.webkitAudioContext;if(!AudioClass){sound.textContent='此浏览器无声';sound.disabled=true;return;}
    if(!AC)AC=new AudioClass();const epoch=audioEpoch;
    AC.resume().then(()=>{
      if(epoch!==audioEpoch||!playing||!soundOn)return;
      bus=AC.createGain();bus.gain.value=2.2;bus.connect(AC.destination);const start=clockNow();nextEvent=EVENTS.findIndex(e=>e.t>=start);if(nextEvent<0)nextEvent=EVENTS.length;
      const pump=()=>{if(!bus||!playing)return;const now=clockNow();while(nextEvent<EVENTS.length&&EVENTS[nextEvent].t<now+.2){const e=EVENTS[nextEvent++];if(e.t>=now-.06)synth(AC,bus,e,AC.currentTime+Math.max(.005,e.t-now));}};
      pump();pumpId=setInterval(pump,65);
    }).catch(()=>{sound.textContent='点此重试声音';});
  }catch(_){sound.textContent='点此重试声音';}
}
function ui(){
  time.textContent=`${fmt(cur)} / ${fmt(TOTAL)}`;seek.value=String(cur);seek.setAttribute('aria-valuetext',`${fmt(cur)}，共 ${fmt(TOTAL)}`);
  player.classList.toggle('playing',playing);player.classList.toggle('started',started);pp.textContent=playing?'暂停':cur>=TOTAL?'重播':'播放';
  if(started){big.textContent=cur>=TOTAL?'↺ 重看':'▶ 继续';big.setAttribute('aria-label',cur>=TOTAL?'从头重播短片':'继续播放短片');}
  const sc=sceneAt(cur),cap=started?sc.caps.find(c=>cur-sc.start>=c.a&&cur-sc.start<c.b):null;
  if(cap!==lastCap){if(lastCap){lastCap.el.classList.remove('on');lastCap.el.removeAttribute('aria-current');}if(cap){cap.el.classList.add('on');cap.el.setAttribute('aria-current','true');}lastCap=cap;}
  if(started&&sc!==lastScene){if(lastScene){lastScene.chip.classList.remove('on');lastScene.chip.removeAttribute('aria-current');}sc.chip.classList.add('on');sc.chip.setAttribute('aria-current','true');lastScene=sc;}
}
function tick(){if(!playing)return;cur=clockNow();render(cur);ui();if(cur>=TOTAL){pause();return;}raf=requestAnimationFrame(tick);}
function play(){if(playing)return;if(cur>=TOTAL-.01)cur=0;started=true;playing=true;base=cur;anchor=performance.now();audioStart();render(cur);ui();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);}
function pause(){cur=clockNow();playing=false;cancelAnimationFrame(raf);audioStop();if(started)render(cur);ui();}
function go(t){cur=clamp(t,0,TOTAL);started=true;base=cur;anchor=performance.now();if(playing)audioStart();render(cur);ui();if(cur>=TOTAL&&playing)pause();}
function toggle(){playing?pause():play();}
screen.addEventListener('click',toggle);pp.addEventListener('click',toggle);seek.addEventListener('input',()=>go(+seek.value));
document.getElementById('back').addEventListener('click',()=>go(clockNow()-10));document.getElementById('forward').addEventListener('click',()=>go(clockNow()+10));
sound.addEventListener('click',()=>{soundOn=!soundOn;sound.textContent=soundOn?'声音 开':'声音 关';sound.setAttribute('aria-pressed',String(soundOn));if(soundOn)audioStart();else audioStop();});
scenes.forEach(sc=>{
  const b=document.createElement('button');b.type='button';b.textContent=sc.name;b.addEventListener('click',()=>go(sc.start+.05));sc.chip=b;chapters.appendChild(b);
  sc.caps.forEach(cap=>cap.el.addEventListener('click',()=>{go(sc.start+cap.a+.02);screen.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}));
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('button,input,summary')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'){e.preventDefault();toggle();}if(e.code==='ArrowLeft'){e.preventDefault();go(clockNow()-5);}if(e.code==='ArrowRight'){e.preventDefault();go(clockNow()+5);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause();});
function fit(){setup(Math.min(1080,Math.max(360,screen.clientWidth*Math.min(window.devicePixelRatio||1,3))));started?render(cur):poster();}
window.addEventListener('resize',fit);fit();ui();
// 导视频用的口子：保留确定时间画帧和同一套离线声音；本页不导出视频。
window.FILM={W,H,TOTAL,canvas:cv,events:EVENTS,synth,setup,render,seek:go,play,pause,state:()=>({cur:clockNow(),playing,soundOn,started}),scenes:scenes.map(s=>({id:s.id,start:s.start,duration:s.dur}))};
})();
