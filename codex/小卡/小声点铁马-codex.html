function frame(now){if(!playing)return;time=Math.min(DURATION,(now-anchor)/1000);render(time);scheduleAudio(time);if(now-lastUI>90){ui(time);lastUI=now}if(time>=DURATION){playing=false;hushAudio();ui(time);return}raf=requestAnimationFrame(frame)}
async function play(){if(playing)return;if(time>=DURATION)time=0;started=true;$('curtain').classList.add('hidden');try{initAudio();if(ac&&ac.state!=='running')await ac.resume();alignAudio(time)}catch(e){$('error').textContent='画面正常播放；声音可稍后再开。';$('error').style.display='block'}playing=true;anchor=performance.now()-time*1000;ui(time);cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function pause(){if(playing)time=Math.min(DURATION,(performance.now()-anchor)/1000);playing=false;cancelAnimationFrame(raf);hushAudio();render(time);ui(time)}
function seek(t,resume=playing){pause();time=clamp(t,0,DURATION);started=true;$('curtain').classList.add('hidden');render(time);ui(time);if(resume)play()}
$('start').addEventListener('click',play);$('play').addEventListener('click',()=>playing?pause():play());$('restart').addEventListener('click',()=>{seek(0,false);play()});$('seek').addEventListener('input',e=>seek(Number(e.target.value),playing));
$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'♫ 声音关':'♫ 声音开';$('sound').setAttribute('aria-pressed',String(!muted));if(ac)master.gain.setTargetAtTime(muted?0:.42,ac.currentTime,.05)});
for(const [a,b,who,txt]of captions){const button=document.createElement('button');button.className='line';button.innerHTML=`<time>${format(a)}</time><span><b>${who}</b>${txt}</span>`;button.addEventListener('click',()=>seek(a,true));$('script').append(button)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});window.addEventListener('pagehide',pause);window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON','SUMMARY'].includes(document.activeElement.tagName)){e.preventDefault();playing?pause():play()}});
window.FILM={duration:DURATION,width:W,height:H,fps:30,canvas:cv,render,seek,pause,play,captions:captions.map(c=>({start:c[0],end:c[1],speaker:c[2],text:c[3]})),get time(){return time},get playing(){return playing}};
resize();render(0);ui(0);
})();
</script>
