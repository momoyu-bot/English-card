function ui(){seek.value=String(current);timeLabel.textContent=fmt(current)+' / '+fmt(TOTAL);playButton.textContent=playing?'暂停':current>=TOTAL?'重播':'播放';playButton.setAttribute('aria-label',playing?'暂停短片':'播放短片');if(capIndex!==uiLast){if(capButtons[uiLast])capButtons[uiLast].classList.remove('active');if(capButtons[capIndex])capButtons[capIndex].classList.add('active');uiLast=capIndex}}
function tick(){if(!playing)return;current=Math.min(TOTAL,clock());render(current);ui();if(current>=TOTAL){playing=false;audioStop();ui();return}raf=requestAnimationFrame(tick)}
function play(){if(playing)return;if(current>=TOTAL)current=0;started=true;startButton.hidden=true;playing=true;origin=current;perfEpoch=performance.now();pendingPlay++;audioStart(current);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);ui()}
function pause(){if(playing)current=Math.min(TOTAL,clock());playing=false;pendingPlay++;cancelAnimationFrame(raf);audioStop();render(current);ui()}
function go(t){current=clamp(t,0,TOTAL);started=true;startButton.hidden=true;origin=current;perfEpoch=performance.now();if(playing)audioStart(current);render(current);ui()}
startButton.addEventListener('click',play);playButton.addEventListener('click',()=>playing?pause():play());cv.addEventListener('click',()=>playing?pause():play());byId('replay').addEventListener('click',()=>{go(0);play()});soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.setAttribute('aria-pressed',String(soundOn));soundButton.textContent=soundOn?'声音 开':'声音 关';if(playing){current=clock();origin=current;perfEpoch=performance.now();if(soundOn)audioStart(current);else audioStop()}});
let wasPlaying=false;seek.addEventListener('pointerdown',()=>{wasPlaying=playing;if(playing)pause()});seek.addEventListener('input',()=>go(Number(seek.value)));seek.addEventListener('change',()=>{if(wasPlaying)play();wasPlaying=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});window.addEventListener('pagehide',()=>{if(playing)pause()});document.addEventListener('keydown',e=>{if(e.target.matches('input,button,summary,a'))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();go(current+5)}if(e.code==='ArrowLeft'){e.preventDefault();go(current-5)}});
function setup(w=960){cv.width=Math.round(w);cv.height=Math.round(w*H/W)}
function fit(){const w=Math.min(1440,Math.round((cv.clientWidth||400)*Math.min(3,devicePixelRatio||1)));setup(w);render(current,!started)}
window.addEventListener('resize',fit);fit();ui();
window.FILM={W,H,TOTAL,duration:TOTAL,canvas:cv,events:EVENTS,synth,makeBus,setup,render:t=>render(t),seek:go,pause,play,get current(){return current},get playing(){return playing},get audioState(){return ac?ac.state:'uninitialized'}};
})();
</script>
