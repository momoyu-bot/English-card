const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const transcript=$('transcript');cues.forEach((q,i)=>{const b=document.createElement('button');b.className='cue';b.type='button';const tm=document.createElement('time');tm.textContent=fmt(q[0]);const sp=document.createElement('span');if(q[2]){const strong=document.createElement('b');strong.textContent=q[2]+' · ';sp.appendChild(strong)}sp.appendChild(document.createTextNode(q[3]));b.append(tm,sp);b.addEventListener('click',()=>{seekTo(q[0]+.2);cv.scrollIntoView({behavior:'auto',block:'start'})});transcript.appendChild(b)});
function syncUI(){ $('clock').textContent=fmt(time);$('seek').value=time;$('play').textContent=playing?'Ⅱ 暂停':'▶ 播放';$('play').setAttribute('aria-label',playing?'暂停':'播放');$('status').textContent=time>=DURATION?'故事放完啦':playing?'放映中':started?'已暂停':'等你开场';const idx=cues.findIndex(q=>time>=q[0]&&time<q[1]);if(idx!==activeCue){if(activeCue>=0)transcript.children[activeCue].classList.remove('active');if(idx>=0)transcript.children[idx].classList.add('active');activeCue=idx}}

/* Original, gently syncopated score. Notes and printer foley share the film clock. */
let ac=null,master=null,lastBeat=-1,lastFoley=-1,liveNodes=[];
function initAudio(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();master=ac.createGain();master.gain.value=muted?0:.23;master.connect(ac.destination)}ac.resume().catch(()=>{})}catch(e){ac=null}}
function hush(){if(!ac)return;for(const n of liveNodes){try{n.stop()}catch(e){}}liveNodes=[]}
function note(freq,dur=.6,gain=.14,type='sine',delay=0){if(!ac||muted)return;const now=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=freq;v.gain.setValueAtTime(0,now);v.gain.linearRampToValueAtTime(gain,now+.012);v.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(v);v.connect(master);o.start(now);o.stop(now+dur+.02);liveNodes.push(o);o.onended=()=>{o.disconnect();v.disconnect();liveNodes=liveNodes.filter(n=>n!==o)}}
function rustle(gain=.1,dur=.09){if(!ac||muted)return;const n=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,n,ac.sampleRate),arr=buf.getChannelData(0);for(let i=0;i<n;i++)arr[i]=Math.sin(i*131.31)*Math.sin(i*17.71)*(1-i/n);const src=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();src.buffer=buf;f.type='bandpass';f.frequency.value=1100;f.Q.value=.7;v.gain.value=gain;src.connect(f);f.connect(v);v.connect(master);src.start();liveNodes.push(src);src.onended=()=>{src.disconnect();f.disconnect();v.disconnect();liveNodes=liveNodes.filter(x=>x!==src)}}
const score=[72,76,79,76,74,71,67,71,69,72,76,72,67,71,74,71,72,76,79,81,79,76,74,71,69,72,74,76,74,71,67,0];
function audioAt(t){if(!ac||muted)return;const beat=Math.floor(t/.48);if(beat!==lastBeat){lastBeat=beat;let silent=(t>68&&t<71.5)||(t>77.5&&t<81.3)||(t>114&&t<120)||(t>134.8&&t<138.1);if(!silent&&t<143){const idx=beat%score.length,n=score[idx];if(n){const oct=t<57?-12:t<68?0:-12;note(440*Math.pow(2,(n+oct-69)/12),t>105?1.3:.62,t>105?.15:.12,'sine');if(beat%4===0)note(440*Math.pow(2,([48,43,45,43][Math.floor(beat/8)%4]-69)/12),1.5,.10,'triangle')}if(t>57&&t<67&&beat%2===0)note(146.83,.06,.065,'triangle')}}let f=Math.floor(t*8);if(f!==lastFoley){lastFoley=f;if((t>37&&t<68)||(t>131&&t<136.8))rustle(.12,.07);if((t>95.8&&t<99))rustle(.10,.12)}if(t>=136.9&&t<137.1&&Math.abs(t-136.96)<.05)note(392,.035,.08,'triangle')}
function tick(stamp){if(!playing)return;const dt=Math.min((stamp-lastStamp)/1000,.1);lastStamp=stamp;time=Math.min(DURATION,time+dt);render(time);audioAt(time);syncUI();if(time>=DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(playing)return;if(time>=DURATION)time=0;started=true;$('cover').hidden=true;initAudio();playing=true;lastBeat=Math.floor(time/.48)-1;lastFoley=Math.floor(time*8);lastStamp=performance.now();syncUI();raf=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(raf);hush();syncUI()}
function seekTo(t){pause();started=true;$('cover').hidden=true;time=clamp(t,0,DURATION);render(time);syncUI()}
