const audioEvents=[];const beat=.56,bar=beat*6;

function tone(ctx,dest,e,when){let f=440*Math.pow(2,(e.m-69)/12),gain=ctx.createGain();gain.gain.setValueAtTime(0,when);gain.gain.linearRampToValueAtTime(e.v,when+.035);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,e.v*.3),when+Math.min(.65,e.len*.4));gain.gain.exponentialRampToValueAtTime(.0001,when+e.len);gain.connect(dest);

document.getElementById('sound').addEventListener('click',async e=>{muted=!muted;if(started)await ensureAudio();if(master)master.gain.setTargetAtTime(muted?0:volume*2.8,ac.currentTime,.06);e.currentTarget.textContent=muted?'♪ 静音':'♫';e.currentTarget.setAttribute('aria-label',muted?'开启音乐':'关闭音乐');e.currentTarget.setAttribute('aria-pressed',String(!muted))});
document.getElementById('volume').addEventListener('input',e=>{volume=Number(e.target.value);if(master)master.gain.setTargetAtTime(muted?0:volume*2.8,ac.currentTime,.04)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});document.addEventListener('keydown',e=>{if(e.target.matches('input,button,summary'))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight')setTime(current+5);if(e.code==='ArrowLeft')setTime(current-5)});
subtitleData.forEach(([t,,who,words])=>{let b=document.createElement('button');let tm=document.createElement('time');tm.textContent=fmt(t);let span=document.createElement('span');span.textContent=(who?who+'：':'')+words.replace('\n','');b.append(tm,span);b.addEventListener('click',()=>{started=true;cover.classList.add('hidden');setTime(t+.4);document.querySelector('.cinema').scrollIntoView({block:'start',behavior:'auto'});if(!playing)play()});document.getElementById('lines').appendChild(b)});
window.FILM={duration:DURATION,render,seek:setTime,play,pause,subtitles:subtitleData,audioEvents,tone,state:()=>({time:current,playing,ended,audio:ac?ac.state:'unstarted',voices:voices.size}),get canvas(){return canvas}};
render(0);updateUI();requestAnimationFrame(frame);
})();
</script>
</body>
