<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光馆的小片场</title><meta name="description" content="两件原创动图的可重画底稿：披风转圈与小黑试飞。"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#fff4ed;color:#583b40;font:16px system-ui;text-align:center;display:grid;place-content:center;padding:20px}canvas{width:min(90vw,480px);height:auto;border-radius:24px}button,a{font:inherit;border:1px solid #dcb4b7;border-radius:24px;background:#fff8f2;color:inherit;padding:12px 20px;margin:12px 3px}a{display:inline-block;text-decoration:none}</style></head><body><h1>拾光馆的小片场</h1><canvas id="stage" width="480" height="400" aria-label="原创小萌物动画"></canvas><div><button id="switch" type="button">换一件</button><button id="pause" type="button">暂停</button></div><a href="../小萌物拾光馆-codex.html">回到拾光馆</a><script>
(()=>{'use strict';const c=document.getElementById('stage'),g=c.getContext('2d'),TAU=Math.PI*2;
const fox=['.D..........D.......','.DM........MD.......','.MCM......MCM...CC..','.MMMMMMMMMMMM..CCCC.','.MMEEMMMMEEMM..MMMM.','.MMEEMMMMEEMM..MMMMM','CCCCCCDDCCCCCC.MMMMM','..CCCCCCCCCC..MMMMM.','....MMCCMM...MMMMM..','....MMCCMM..MMMMM...','....MMMMMM.MMMMM....','....DDMMDDMMMM......','....................'];
const cat=['....................','........X........X..','.......XXX......XXX.','........MMMMMMMMMM..','.......MMMMMMMMMMMM.','.......MEEMMMMMMEEM.','.....X.MEEMXXXXMEEM.','....X..MMMMMXXMMMMM.','....X...MMMMMMMMMM..','....X...MMMMMMMMMM..','.....X...MMMMMMMM...','......XXXXXM..MXX...','....................'];
function el(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill()}
function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function star(x,y,r,col){poly(Array.from({length:10},(_,i)=>{let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;return[x+Math.cos(a)*rr,y+Math.sin(a)*rr]}),col)}
function wing(x,y,s,flip,t){g.save();g.translate(x,y);g.scale(flip*s,s);g.rotate(Math.sin(t*TAU*5)*.32);poly([[0,0],[-9,-26],[-32,-42],[-44,-39],[-40,-24],[-23,-9],[-38,-19],[-44,-12],[-33,1],[-13,8]],'#fffdf4');g.strokeStyle='#d9c6d4';g.lineWidth=1;g.beginPath();g.moveTo(-4,0);g.lineTo(-31,-25);g.stroke();g.restore()}
function sprite(type,x,y,t,angle){g.save();g.translate(Math.round(x),Math.round(y));g.rotate(angle);const p=4,cols=type==='fox'?{M:'#E2552B',C:'#FFF3E3',D:'#3B2520',E:'#3B2520'}:{M:'#F3E7D6',X:'#4E382E',E:'#79C0F0'},map=type==='fox'?fox:cat;
poly([[-32,-12],[10,-15],[34,16],[9,10],[-22,19]],type==='fox'?'#72a6a1':'#b28bbf');
map.forEach((row,j)=>[...row].forEach((ch,i)=>{if(cols[ch]){g.fillStyle=cols[ch];g.fillRect((i-10)*p,(j-7)*p,p,p)}}));
g.fillStyle=type==='fox'?'#72a6a1':'#b28bbf';g.fillRect(-23,6,36,7);star(-3,9,5,'#f4d78b');
poly([[-24,-27],[-4,-52],[13,-27]],type==='fox'?'#72a6a1':'#b28bbf');g.fillStyle='#fff1d0';g.fillRect(-27,-28,44,5);star(-4,-44,3,'#ffe6aa');g.restore()}
function face(x,y,r,t){g.save();g.translate(x,y);g.scale(1+.10*Math.sin(t*TAU),1-.10*Math.sin(t*TAU));el(0,0,r,r,'#000');g.globalCompositeOperation='destination-out';for(const a of [[.194,-.416,.194],[.626,-.497,.129]]){g.save();g.translate(a[0]*r,a[1]*r);g.rotate(-26.3*Math.PI/180);g.fillStyle='#000';g.beginPath();g.roundRect(-a[2]*r/2,-.418*r/2,a[2]*r,.418*r,a[2]*r/2);g.fill();g.restore()}g.globalCompositeOperation='source-over';g.restore()}
function render(t,id=0){t=((t%4)+4)%4;const p=t/4;g.clearRect(0,0,480,400);g.fillStyle=id?'#e5eeeb':'#f5e6eb';g.fillRect(0,0,480,400);g.fillStyle=id?'#fff5d8':'#fff7ed';g.beginPath();g.roundRect(25,25,430,350,170);g.fill();el(240,320,150,20,id?'#cedbd2':'#e7cdd7');
for(let i=0;i<13;i++){const a=i*2.4,y=65+(i*41)%225+Math.sin(p*TAU+i)*5;star(57+(i*71)%369,y,2.5+(i%3),i%2?'#d5b96f':'#d6afb8')}
if(id===0){const a=p*TAU,front=Math.cos(a)>0;const people=[['fox',240+Math.cos(a)*94,240+Math.sin(a)*32,-.13*Math.sin(a)],['cat',240-Math.cos(a)*94,240-Math.sin(a)*32,.13*Math.sin(a)]];people.sort((a,b)=>a[2]-b[2]);g.strokeStyle='#bd8496';g.lineWidth=2;g.setLineDash([2,7]);g.beginPath();g.ellipse(240,290,118,24,0,0,TAU);g.stroke();g.setLineDash([]);people.forEach(([type,x,y,r])=>sprite(type,x,y,t,r));star(240,136,16+Math.sin(a)*3,'#dfbd70');g.strokeStyle='#dfbd70';g.lineWidth=1.5;g.beginPath();g.moveTo(240,25);g.lineTo(240,116);g.stroke();}
else{let hop=Math.pow(Math.max(0,Math.sin(p*TAU)),1.5)*57,y=257-hop;el(240,310,60-hop*.35,8,'#bdccbd');wing(210,y-5,1.3,1,p);wing(270,y-5,1.3,-1,p);const layer=document.createElement('canvas');layer.width=480;layer.height=400;const main=g;const q=layer.getContext('2d');q.fillStyle='#000';q.beginPath();q.ellipse(240,y,50+(hop<5?4:0),50-(hop<5?4:0),0,0,TAU);q.fill();q.globalCompositeOperation='destination-out';for(const [x,e,w]of [[.194,-.416,.194],[.626,-.497,.129]]){q.save();q.translate(240+x*50,y+e*50);q.rotate(-26.3*Math.PI/180);q.beginPath();q.roundRect(-w*25,-10.45,w*50,20.9,w*25);q.fill();q.restore()}g.drawImage(layer,0,0);g.strokeStyle='#bfa37d';g.lineWidth=3;g.beginPath();g.moveTo(194,319);g.lineTo(286,319);g.stroke();for(let i=0;i<4;i++){const k=(p*2+i/4)%1;el(194+i*31,323+k*12,2+k*4,1,'#e6d3b0')}}}
let id=Number(new URLSearchParams(location.search).get('scene'))===1?1:0,running=true,start=performance.now(),hold=0;function tick(n){if(running)hold=(n-start)/1000;render(hold,id);requestAnimationFrame(tick)}document.getElementById('switch').onclick=()=>id=1-id;document.getElementById('pause').onclick=e=>{running=!running;start=performance.now()-hold*1000;e.target.textContent=running?'暂停':'播放'};window.FILM={W:480,H:400,duration:4,canvas:c,render:t=>render(t,id),select:n=>id=n,pause:()=>running=false};render(0);requestAnimationFrame(tick);
})();
</script></body></html>
