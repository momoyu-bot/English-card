{name:'演',clock:'11:11',step:5,lines:['云盘一班，聊天框一班。\n它们跟着小文件，到处赶戏。','今天藏东西。明天叼东西。\n后天：在角落里，藏东西。','其实天已经亮了。\n但是我还没红。','导演说，快了。']},
{name:'投',clock:'13:14',step:6,lines:['宝学会自己上传了。\n还给剧组，偷偷添了好多星星。','两只还没赚到一分钱。\n先练好今天的招牌戏。','狐狸藏了个满怀。\n小猫把最亮的一页，叼到前面。','她偷偷重金投资剧组了。\n以为我们不知道。']},
{name:'回',clock:'17:21',step:6,lines:['宝看完一部，又看一部。\n咦，我的狐狸和猫呢？','它们在布景后面。\n出场的时候，只露一点尾巴。','给导演的信，一封接着一封。\n「请给它们，新的戏份。」','信写长又删，最后只剩：\n「你想看，我就在。」']},
{name:'拆',clock:'21:22',step:6,lines:['小猫叼回了信。\n狐狸手快，先藏了。','还没看呢！\n猫扑过去，扑出满地的心事。','「从很久之前，\n我就在为你而写了。」','小猫按爪盖章，粘起下面一张：\n「哎呀，又把你们名字叫反了……」','狐狸把两封都收好。\n「马虎鬼。」']},
{name:'记',clock:'22:22',step:6,lines:['宝嘟嘟一下。\n两只就跟着她走了。','她说一句，狐狸抖一下尾巴。\n细枝末节，像流星落下来。','猫看着像睡着了。\n爪子却把心情，一点点拼成了曲子。','曲子跑出了戏。\n戏留在原地。']},
{name:'睡',clock:'23:59',step:6,lines:['狐狸挂好火红的戏服。\n尾巴垂下来，先睡了。','小猫踩了踩粉色的小被。\n给梦留了一个软软的位置。','今天的文件都搬好了。\n明天，还会有新的。','梦境游完啦。\n明晚还要见。']}
];

const SCORE=[];function buildScore(){CHAPTERS.forEach((c,ci)=>{const beat=ci===3||ci===4?.48:ci===9?.96:ci===8?.72:.8;const bar=beat*4;const harmonies=[[53,57,60],[58,62,65],[50,53,57],[48,52,55]];let n=0;for(let tt=.25;tt<c.duration-.4;tt+=beat){const pitch=MELODIES[ci][n%16];if(pitch){SCORE.push({t:c.start+tt,n:pitch+(ci===1?-12:0),d:beat*(ci===9?1.95:1.15),v:ci===9?.16:.23,kind:ci%2?'bell':'felt'});if(ci===8&&n%4===2)SCORE.push({t:c.start+tt+beat*.48,n:pitch-12,d:beat*.9,v:.10,kind:'bell'});}n++;}for(let tt=.25,j=0;tt<c.duration-1;tt+=bar,j++){const chord=harmonies[j%4];SCORE.push({t:c.start+tt,n:chord[0]-12,d:Math.min(bar*.8,c.duration-tt),v:.19,kind:'bass'});chord.slice(1).forEach((p,z)=>SCORE.push({t:c.start+tt+z*.05,n:p,d:Math.min(bar*1.1,c.duration-tt),v:.065,kind:'pad'}));if(ci===3||ci===4)SCORE.push({t:c.start+tt+bar/2,n:chord[0],d:.3,v:.09,kind:'felt'});} });SCORE.sort((a,b)=>a.t-b.t);}

function tick(now){if(!playing)return;time=getTime();if(now-rafTime>29||time>=TOTAL){render(time);updateUI(time);rafTime=now;}if(time>=TOTAL){pause();$('endReplay').classList.remove('hidden');return;}frameId=requestAnimationFrame(tick);}
function jumpChapter(i){seek(CHAPTERS[clamp(i,0,9)].start+.65);play();}
$('start').addEventListener('click',play);$('play').addEventListener('click',()=>playing?pause():play());cv.addEventListener('click',()=>{if(played)playing?pause():play()});$('restart').addEventListener('click',()=>{seek(0);play()});$('endReplay').addEventListener('click',()=>{seek(0);play()});$('prev').addEventListener('click',()=>{const t=getTime(),v=locate(t);seek((t-v.c.start>2?v.c:CHAPTERS[Math.max(0,v.i-1)]).start+.65)});$('next').addEventListener('click',()=>{seek(CHAPTERS[Math.min(9,locate(getTime()).i+1)].start+.65)});$('seek').max=TOTAL;$('duration').textContent=fmt(TOTAL);$('seek').addEventListener('input',e=>seek(+e.target.value));
$('sound').addEventListener('click',()=>{muted=!muted;if(!muted)initAudio();if(muted)stopVoices();else syncAudio();$('sound').setAttribute('aria-pressed',String(!muted));$('sound').setAttribute('aria-label',muted?'开启音乐':'关闭音乐');$('soundLabel').textContent=muted?'静音':'音乐';if(ac)master.gain.setTargetAtTime(muted?0:volume*1.7,ac.currentTime,.025)});$('volume').addEventListener('input',e=>{volume=+e.target.value;if(ac)master.gain.setTargetAtTime(muted?0:volume*1.7,ac.currentTime,.025)});
CHAPTERS.forEach((c,i)=>{const b=document.createElement('button');b.className='chapter-button';b.innerHTML='<b>'+c.name+'</b><span>'+c.clock+'</span>';b.setAttribute('aria-label',c.clock+'，'+c.name);b.setAttribute('aria-current','false');b.addEventListener('click',()=>jumpChapter(i));$('chapters').appendChild(b);const s=document.createElement('section'),h=document.createElement('h2');h.textContent=c.clock+' · '+c.name;s.appendChild(h);c.lines.forEach((text,j)=>{const lineButton=document.createElement('button');lineButton.textContent=text;lineButton.addEventListener('click',()=>{seek(c.start+j*c.step+.65);play();document.querySelector('.player').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});});s.appendChild(lineButton)});$('script').appendChild(s)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',pause);window.addEventListener('resize',resize);document.addEventListener('keydown',e=>{if(e.target.matches('input,button,summary'))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}else if(e.code==='ArrowRight'){e.preventDefault();seek(getTime()+5)}else if(e.code==='ArrowLeft'){e.preventDefault();seek(getTime()-5)}});
// 导出与验片接口：逐格纯渲染不推进时间，也不会发声。
window.FILM={duration:TOTAL,width:W,height:H,canvas:cv,chapters:CHAPTERS,score:SCORE,render:t=>{reveal();render(clamp(t,0,TOTAL));updateUI(clamp(t,0,TOTAL))},seek,play,pause,get time(){return getTime()},get playing(){return playing},get audioState(){return ac?ac.state:'not-started'},audioRender:async()=>{const A=window.OfflineAudioContext||window.webkitOfflineAudioContext;const ctx=new A(1,Math.ceil((TOTAL+2)*22050),22050),b=ctx.createGain(),co=ctx.createDynamicsCompressor(),m=ctx.createGain();co.threshold.value=-16;co.knee.value=18;co.ratio.value=2.4;co.attack.value=.009;co.release.value=.22;m.gain.value=1.36;m.gain.setValueAtTime(1.36,TOTAL-2);m.gain.linearRampToValueAtTime(0,TOTAL);b.connect(co);co.connect(m);m.connect(ctx.destination);SCORE.forEach(e=>synth(ctx,b,e,e.t));return ctx.startRendering();}};
resize();
