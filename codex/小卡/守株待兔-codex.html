class Music{constructor(){this.ctx=null;this.voices=new Set();this.on=true;this.ready=false;this.idx=0;this.running=false;this.timer=null;this.stopTimer=null}
 init(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();const c=this.ctx;this.gate=c.createGain();this.gate.gain.value=0;const low=c.createBiquadFilter();low.type='lowpass';low.frequency.value=2200;low.Q.value=.4;const comp=c.createDynamicsCompressor();comp.threshold.value=-17;comp.knee.value=15;comp.ratio.value=3;comp.attack.value=.015;comp.release.value=.25;this.bus=c.createGain();this.bus.gain.value=.95;this.bus.connect(low);low.connect(comp);comp.connect(this.gate);this.gate.connect(c.destination);const delay=c.createDelay(.5),dg=c.createGain(),damp=c.createBiquadFilter();delay.delayTime.value=.18;dg.gain.value=.14;damp.type='lowpass';damp.frequency.value=1100;this.bus.connect(delay);delay.connect(damp);damp.connect(dg);dg.connect(low);this.ready=true;}

 async start(t){this.init();if(!this.ctx||!this.on)return;clearTimeout(this.stopTimer);await this.ctx.resume();this.haltVoices();this.running=true;this.anchor=this.ctx.currentTime+.06-t;this.idx=SCORE.findIndex(e=>e.at>=t-.02);if(this.idx<0)this.idx=SCORE.length;this.gate.gain.cancelScheduledValues(this.ctx.currentTime);this.gate.gain.setTargetAtTime(.98,this.ctx.currentTime,.035);this.tick();clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),100)}
 tick(){if(!this.running||!this.ctx)return;const now=this.ctx.currentTime;while(this.idx<SCORE.length&&this.anchor+SCORE[this.idx].at<now+.5){const e=SCORE[this.idx++],at=this.anchor+e.at;if(at>=now-.02)this.note(e,Math.max(at,now+.005))}}
 haltVoices(){for(const o of this.voices){try{o.stop()}catch{}}this.voices.clear();clearInterval(this.timer)}
 stop(){this.running=false;clearInterval(this.timer);if(!this.ctx)return;const c=this.ctx;this.gate.gain.cancelScheduledValues(c.currentTime);this.gate.gain.setTargetAtTime(.00001,c.currentTime,.018);clearTimeout(this.stopTimer);this.stopTimer=setTimeout(()=>{this.haltVoices();if(c.state==='running')c.suspend()},85)}
}

function go(t,auto=false){const was=playing;position=clamp(t,0,DURATION);anchor=performance.now()-position*1000;started=true;cover.hidden=true;++audioRequest;music.stop();if(auto&&!was){play()}else if(was){runAudio(position)}render(position);refresh(position)}
