function render(t,coverMode=false){g.setTransform(C.width/W,0,0,C.height/H,0,0);g.clearRect(0,0,W,H);if(coverMode){cover(t);return -1}t=clamp(t,0,D);let idx=cuts.findIndex((v,i)=>i<cuts.length-1&&t>=v&&t<cuts[i+1]);if(idx<0)idx=scenes.length-1;g.save();g.beginPath();g.rect(0,0,W,553);g.clip();scenes[idx](t);g.restore();let local=t-cuts[idx],remain=cuts[idx+1]-t;if(idx>0&&local<.42)alpha((1-ease(local/.42))*.8,()=>{g.fillStyle=cream;g.fillRect(0,0,W,553)});if(idx<scenes.length-1&&remain<.3)alpha((1-ease(remain/.3))*.7,()=>{g.fillStyle=cream;g.fillRect(0,0,W,553)});return caption(t)}
const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;
function sync(){let i=render(state.t);$('seek').value=state.t;$('time').textContent=fmt(state.t)+' / 02:42';if(i!==state.lastCap){document.querySelectorAll('#lines .active').forEach(e=>e.classList.remove('active'));let el=$('line-'+i);if(el)el.classList.add('active');$('live').textContent=i>=0?captions[i][2]+'：'+captions[i][3]:'';state.lastCap=i}}
// Original score, synthesized locally. Buffer playback keeps pause and seek sample-aligned.
let ac=null,master=null,buffer=null,source=null,audioReady=false,audioError=false;
function makeScore(ctx){const sr=22050,b=ctx.createBuffer(1,Math.ceil(D*sr),sr),out=b.getChannelData(0);let peak=0;
 function note(at,midi,len,amp=.12,kind='bell'){const f=440*Math.pow(2,(midi-69)/12),start=Math.floor(at*sr),dur=Math.min(len,D-at);if(dur<=0||start<0)return;const count=Math.floor(dur*sr),ph=TAU*f/sr;for(let j=0;j<count;j++){let tt=j/sr,v=0,en=Math.min(1,tt/.008)*Math.exp(-tt/(kind==='bass'?.19:kind==='pad'?.6:.34));let p=j*ph;if(kind==='bell')v=(Math.sin(p)+.28*Math.sin(p*2.003)+.09*Math.sin(p*3.98))*en;else if(kind==='pluck')v=(Math.sin(p)+.21*Math.sin(p*2)+.12*Math.sin(p*3))*en;else if(kind==='pad'){en=Math.min(1,tt/.11)*Math.min(1,(dur-tt)/.2);v=(Math.sin(p)+.12*Math.sin(p*2))*.55*en;}else if(kind==='bass')v=Math.sin(p)*en;else v=Math.sin(p*(1+Math.exp(-tt*65)))*Math.exp(-tt*55);out[start+j]+=v*amp;let delay=start+j+Math.floor(sr*.127);if(delay<out.length)out[delay]+=v*amp*.13;}}
 const motif=[74,77,81,79,77,74,72,69,72,76,79,77,76,72,69,67],dayMotif=[77,81,84,82,81,79,77,72,74,77,81,79,77,76,72,69];
 const sections=[{a:0,b:27,bpm:132,roots:[50,58,53,57],gain:.8},{a:27,b:40,bpm:66,roots:[50,58],gain:.44},{a:40,b:81,bpm:102,roots:[50,57,58,53],gain:.7},{a:81,b:111,bpm:86,roots:[50,58,53,57],gain:.8},{a:111,b:141,bpm:112,roots:[53,58,60,53],gain:.78},{a:141,b:162,bpm:108,roots:[53,58,60,53],gain:.8}];
 for(const sec of sections){let beat=60/sec.bpm,k=0;for(let at=sec.a;at<sec.b-.35;at+=beat,k++){let bar=Math.floor(k/3),root=sec.roots[bar%sec.roots.length],pos=k%3,volume=sec.gain*Math.min(1,(sec.b-at)/2);if(pos===0)note(at,root,.65,.15*volume,'bass');else{note(at,root+12,.27,.068*volume,'pluck');note(at,root+([50,57].includes(root)?15:16),.31,.045*volume,'pluck');note(at,root+19,.33,.045*volume,'pluck')}if(sec.a===27){if(k%3===0)note(at,motif[(k/3)%motif.length]+12,1.8,.09,'bell')}else if(sec.a===40){if(k%2===0)note(at,motif[k%motif.length]-12,.44,.13*volume,'pluck')}else{if(k%4!==3)note(at,(sec.a>=111?dayMotif:motif)[(k+Math.floor(sec.a/10))%motif.length],.7,.14*volume,'bell');if(pos===0&&sec.a!==81)note(at+beat*.5,86,.035,.045*volume,'tick')}if(k%6===0&&sec.a>=81){note(at,root+24,beat*2.4,.024*volume,'pad');note(at,root+31,beat*2.4,.018*volume,'pad')}}}
 for(let at of [13,23,40,54,68,77.5,81,101,116,121,131.5,141]){note(at,at===81?81:62,.85,.18,'bell');note(at+.065,at===81?88:74,.7,.11,'bell')}for(let i=0;i<21;i++){let at=95+6*Math.pow(i/21,1.6);note(at,89,.045,.07,'tick')}[65,69,72,77].forEach((n,i)=>note(158+i*.15,n,2.8,.13,'bell'));
 for(let i=0;i<out.length;i++){let env=Math.min(1,i/(sr*.3),(out.length-i)/(sr*1.4));out[i]*=Math.max(0,env);peak=Math.max(peak,Math.abs(out[i]))}const norm=1.45/Math.max(.3,peak);for(let i=0;i<out.length;i++)out[i]=Math.tanh(out[i]*norm);return b;}
function initAudio(){if(audioReady)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('audio unavailable');ac=new A();master=ac.createGain();master.gain.value=state.muted?0:state.volume;let comp=ac.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=6;comp.ratio.value=2;comp.attack.value=.003;comp.release.value=.18;master.connect(comp);comp.connect(ac.destination);buffer=makeScore(ac);audioReady=true;}catch(e){audioError=true;$('sound').textContent='声音不可用';$('sound').disabled=true;}}
function stopSound(){if(source){try{source.stop()}catch(e){}source.disconnect();source=null}}
function startSound(){stopSound();if(!audioReady||state.t>=D)return;source=ac.createBufferSource();source.buffer=buffer;source.connect(master);source.start(0,state.t)}
async function play(){if(state.playing)return;if(state.bonus)stopSpin();if(state.t>=D)state.t=0;state.started=true;$('start').hidden=true;initAudio();if(ac){try{await ac.resume()}catch(e){audioError=true}}state.origin=performance.now()-state.t*1000;state.playing=true;$('play').textContent='Ⅱ 暂停';startSound();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function pause(){if(state.playing){state.t=clamp((performance.now()-state.origin)/1000,0,D)}state.playing=false;stopSound();cancelAnimationFrame(raf);$('play').textContent='▶ 播放';if(state.started)sync()}
function tick(now){if(!state.playing)return;state.t=Math.min(D,(now-state.origin)/1000);sync();if(state.t>=D){state.playing=false;stopSound();$('play').textContent='↺ 再看';$('bonus').hidden=false;$('result').innerHTML='<p>指针停在哪里，就给谁开一只小盲盒。<br>这次，宝在奖池外。</p>';return}raf=requestAnimationFrame(tick)}
function seek(t){const was=state.playing;pause();stopSpin();state.started=true;state.t=clamp(t,0,D);$('start').hidden=true;sync();if(state.t>=D)$('bonus').hidden=false;if(was&&state.t<D)play()}
$('start').addEventListener('click',play);$('play').addEventListener('click',()=>state.playing?pause():play());$('replay').addEventListener('click',()=>{pause();stopSpin();state.t=0;play()});$('seek').addEventListener('input',e=>seek(Number(e.target.value)));
$('sound').addEventListener('click',()=>{state.muted=!state.muted;$('sound').textContent=state.muted?'声音：关':'声音：开';$('sound').setAttribute('aria-pressed',String(state.muted));if(master)master.gain.setTargetAtTime(state.muted?0:state.volume,ac.currentTime,.02)});
$('volume').addEventListener('input',e=>{state.volume=Number(e.target.value)/100;if(master)master.gain.setTargetAtTime(state.muted?0:state.volume,ac.currentTime,.02)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(state.bonus)finishSpin()}});window.addEventListener('pagehide',pause);
document.addEventListener('keydown',e=>{if((e.code==='Space')&&!['INPUT','BUTTON','SUMMARY'].includes(document.activeElement.tagName)){e.preventDefault();state.playing?pause():play()}});
captions.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button'),tm=document.createElement('time'),tx=document.createElement('span');b.id='line-'+i;tm.textContent=fmt(c[0]);tx.textContent=c[2]+'：'+c[3];b.append(tm,tx);b.addEventListener('click',()=>{seek(c[0]);play();$('screen').scrollIntoView({behavior:'auto',block:'center'})});li.append(b);$('lines').append(li)});
const prizes=[['毛毯召唤','一张毛毯，自动盖好。今天不接导演的电话。'],['空气双薪','空气工资翻倍。袋子依然轻得很体面。'],['下午茶自由','茶点先上桌，工作明天再说。'],['免监工券','今天的监工牌，暂存宝处。'],['带薪发呆','额度可以归零，发呆不设上限。'],['全员搭便车','可以带上两位同事。座位刚刚好。']];
function randomInt(n){if(window.crypto&&window.crypto.getRandomValues){const v=new Uint32Array(1);let bound=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(v)}while(v[0]>=bound);return v[0]%n}return Math.floor(Math.random()*n)}
function spinDraw(){pause();state.bonus=true;state.spin={start:performance.now(),who:randomInt(3),prize:randomInt(prizes.length)};$('draw').disabled=true;$('draw').textContent='指针正在转动…';$('result').innerHTML='<p>嘘。下班铃马上就响。</p>';C.scrollIntoView({behavior:'auto',block:'center'});raf=requestAnimationFrame(spinFrame)}
function renderBonus(p){let sp=state.spin;if(!sp)return;g.setTransform(C.width/W,0,0,C.height/H,0,0);wall(p*5,true);heading('下班以后 · 今日奇遇','这次，轮到谁',true);let end=TAU*4+sp.who*TAU/3,ang=end*(1-Math.pow(1-clamp(p),4));wheel(195,302,114,p*5,ang,true);sparkle(p*5,195,302,20,166,'#d7b5cd');if(p>=1){let names=['小粉','小紫','小黑'];badge(names[sp.who]+' · '+prizes[sp.prize][0],195,481,240);txt('点「再转一次」，再开一只小盲盒。',195,522,11,'#e6cad9')}g.fillStyle=cream;g.fillRect(0,553,390,87);txt(p>=1?'休假愉快。':'指针正在替今天作决定。',195,593,17,ink,'500');txt('仅为片尾游戏 · 不会改变真实额度或设置',195,619,10,muted)}
function spinFrame(now){if(!state.bonus||!state.spin)return;let p=clamp((now-state.spin.start)/4800);renderBonus(p);if(p<1)raf=requestAnimationFrame(spinFrame);else finishSpin()}
function finishSpin(){if(!state.spin)return;cancelAnimationFrame(raf);renderBonus(1);let sp=state.spin;let name=['小粉','小紫','小黑'][sp.who];$('result').replaceChildren();let p=document.createElement('p'),b=document.createElement('b'),br=document.createElement('br');b.textContent=name+'抽到「'+prizes[sp.prize][0]+'」';p.append(b,br,document.createTextNode(prizes[sp.prize][1]));$('result').append(p);$('draw').disabled=false;$('draw').textContent='再转一次'}
function stopSpin(){if(state.bonus){cancelAnimationFrame(raf);state.bonus=false;state.spin=null;$('draw').disabled=false;$('draw').textContent='转动神秘指针'}}
$('draw').addEventListener('click',spinDraw);
window.FILM={duration:D,fps:30,width:W,height:H,render:t=>render(t),seek,play,pause,captions,renderCover:()=>render(0,true),audioBuffer:()=>{initAudio();return buffer},getState:()=>({time:state.t,playing:state.playing,audioReady,audioError,bonus:state.bonus})};
render(0,true);
})();
