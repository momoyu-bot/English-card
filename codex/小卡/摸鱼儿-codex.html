function synth(ac,dest,e,when){
  const amp=ac.createGain(),end=when+e.d,reed=e.voice==="breath",soft=e.voice==="low";

    e.voice==="water"?[[1,1],[2.48,.25]]:e.voice==="glass"?[[1,1],[2.012,.23],[3.88,.15]]:
    reed?[[1,1],[2,.20],[3,.082]]:soft?[[1,1],[2,.21],[3,.09]]:[[1,1],[2,.39],[3.012,.18],[4.002,.045]];

const $=s=>document.getElementById(s);

function cutSound(){
  if(!ac||!bus)return;const old=bus;bus=null;const a=ac.currentTime;
  old.gain.cancelScheduledValues(a);old.gain.setValueAtTime(old.gain.value,a);old.gain.linearRampToValueAtTime(0,a+.025);

}
function cueSound(){
  if(!bus||!ac||ac.state!=="running")return;
  const t=now();if(Math.abs(ac.currentTime-(soundBase+t))>.22)soundBase=ac.currentTime-t;
  while(nextEvent<events.length&&events[nextEvent].t<=t+.28){
