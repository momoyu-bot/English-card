// An original, sparse pentatonic phrase, with room for the rain and the pauses.
const musicEvents=[];
const melody=[74,69,67,null,62,67,69,null,74,76,74,null,69,67,62,null];
for(let beat=0;beat*1.85<TOTAL-5;beat++){
 const at=1.3+beat*1.85;
 const note=melody[beat%melody.length];
 if(note!==null && !(at>66&&at<73)) musicEvents.push({t:at,m:note,d:2.6,v:at>94?.047:.064,kind:'string'});
 if(beat%8===0) musicEvents.push({t:at+.06,m:beat%16===0?38:43,d:4.8,v:.046,kind:'warm'});
}
for(const at of [15.1,18.7,25.3,28.2,33.1,43.4,48.2,57.2,61.4,68.6,71.4,76.2,81.1,83.7,87.3,91.2,99.1]){

// Also usable with an OfflineAudioContext when exporting the film later.
function synth(context,event,when,destination){
 const target=destination||context.destination;
 const gain=context.createGain();
 const fade=Math.max(0,Math.min(1,(TOTAL-event.t)/9));
 const volume=event.v*fade;
 const end=when+event.d;
 gain.gain.setValueAtTime(.00001,when);
 gain.gain.exponentialRampToValueAtTime(Math.max(.00002,volume),when+.012);
 gain.gain.exponentialRampToValueAtTime(.00001,end);
 gain.connect(target);
 const freq=440*Math.pow(2,(event.m-69)/12);
 const oscillators=[];
 const partials=event.kind==='warm'?[[1,1],[2,.13]]:event.kind==='dew'?[[1,1],[2.76,.12]]:[[1,1],[2,.16],[3,.045]];
 let pending=partials.length;
 const voice={stop(){for(const o of oscillators){try{o.stop()}catch(_){}}gain.disconnect();activeVoices.delete(voice)}};
 activeVoices.add(voice);
 for(const [ratio,amount] of partials){
  const oscillator=context.createOscillator(),partial=context.createGain();
  oscillator.type='sine';oscillator.frequency.setValueAtTime(freq*ratio,when);
  if(event.kind==='dew')oscillator.frequency.exponentialRampToValueAtTime(freq*ratio*.91,end);
  partial.gain.value=amount;oscillator.connect(partial);partial.connect(gain);
  oscillator.onended=()=>{oscillator.disconnect();partial.disconnect();if(--pending===0){gain.disconnect();activeVoices.delete(voice)}};
  oscillator.start(when);oscillator.stop(end+.03);oscillators.push(oscillator);
 }
 return voice;
}
synth.events=musicEvents;
function stopSound(){for(const voice of [...activeVoices])voice.stop()}
function updateSoundButton(){

 soundButton.setAttribute('aria-pressed',String(soundEnabled&&!audioUnavailable));
 soundButton.setAttribute('aria-label',audioUnavailable?'此浏览器无法播放声音':soundEnabled?'关闭声音':'打开声音');
}
function soundFailed(){audioUnavailable=true;soundEnabled=false;stopSound();updateSoundButton()}
function prepareAudio(){
 if(!soundEnabled||audioUnavailable)return;
 try{
  if(!audioContext){
   const AudioCtor=window.AudioContext||window.webkitAudioContext;
   if(!AudioCtor){soundFailed();return}
   audioContext=new AudioCtor();
   masterGain=audioContext.createGain();masterGain.gain.value=.7;
   const soften=audioContext.createBiquadFilter();soften.type='lowpass';soften.frequency.value=2900;
   masterGain.connect(soften);soften.connect(audioContext.destination);
  }
  if(audioContext.state==='suspended')audioContext.resume().then(()=>{if(isPlaying)resetSoundClock()}).catch(soundFailed);
  resetSoundClock();
 }catch(_){soundFailed()}
}
function resetSoundClock(){
 stopSound();
 if(!audioContext)return;
 audioOrigin=audioContext.currentTime-filmTime;
 audioCursor=musicEvents.findIndex(e=>e.t>=filmTime-.025);
 if(audioCursor<0)audioCursor=musicEvents.length;
}
function pumpSound(){
 if(!soundEnabled||audioUnavailable||!audioContext||audioContext.state!=='running')return;
 while(audioCursor<musicEvents.length && musicEvents[audioCursor].t<filmTime+.18){
  const event=musicEvents[audioCursor++];
  if(event.t<filmTime-.05)continue;
  try{synth(audioContext,event,Math.max(audioContext.currentTime+.004,audioOrigin+event.t),masterGain)}catch(_){soundFailed();break}
 }
}

function pauseFilm(){

}
function playbackFrame(stamp){
 if(!isPlaying)return;
 filmTime=safeTime(startTime+(stamp-startStamp)/1000);
 render(filmTime);updatePlayerUI();pumpSound();
 if(filmTime>=TOTAL){isPlaying=false;frameRequest=0;stopSound();updatePlayerUI();return}

function playFilm(){
 if(isPlaying)return;
 if(filmTime>=TOTAL)filmTime=0;
 hasStarted=true;coverButton.hidden=true;isPlaying=true;
 startTime=filmTime;startStamp=performance.now();prepareAudio();updatePlayerUI();
 cancelAnimationFrame(frameRequest);frameRequest=requestAnimationFrame(playbackFrame);
}
function seekFilm(value){
 filmTime=safeTime(value);startTime=filmTime;startStamp=performance.now();
 hasStarted=true;coverButton.hidden=true;resetSoundClock();
 if(filmTime>=TOTAL){isPlaying=false;cancelAnimationFrame(frameRequest);frameRequest=0}
 render(filmTime);updatePlayerUI();
}
function toggleFilm(){if(isPlaying)pauseFilm();else playFilm()}
playButton.addEventListener('click',toggleFilm);
coverButton.addEventListener('click',playFilm);
restartButton.addEventListener('click',()=>{seekFilm(0);playFilm()});
timeline.min='0';timeline.max=String(TOTAL);timeline.step='.05';
timeline.addEventListener('input',()=>seekFilm(Number(timeline.value)));
soundButton.addEventListener('click',()=>{
 if(audioUnavailable)return;
 soundEnabled=!soundEnabled;if(soundEnabled&&isPlaying)prepareAudio();else stopSound();updateSoundButton();
});
function fullUI(){
 const on=Boolean(document.fullscreenElement||screenBox.classList.contains('theater'));
 fullButton.textContent=on?'收起':'全屏';fullButton.setAttribute('aria-pressed',String(on));
 requestAnimationFrame(()=>{setup();render(hasStarted?filmTime:4,!hasStarted)});
}
function fallbackTheater(){
 theaterScroll=window.scrollY;screenBox.classList.add('theater');document.body.classList.add('cinema-open');fullUI();
}
function leaveTheater(){
 if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return}
 screenBox.classList.remove('theater');document.body.classList.remove('cinema-open');window.scrollTo(0,theaterScroll);fullUI();
}
async function toggleTheater(){
 if(document.fullscreenElement||screenBox.classList.contains('theater')){leaveTheater();return}
 if(screenBox.requestFullscreen){try{await screenBox.requestFullscreen();fullUI()}catch(_){fallbackTheater()}}else fallbackTheater();
}
fullButton.addEventListener('click',toggleTheater);exitButton.addEventListener('click',leaveTheater);
document.addEventListener('fullscreenchange',fullUI);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&isPlaying)pauseFilm()});
window.addEventListener('pagehide',()=>{if(isPlaying)pauseFilm();else stopSound()});
document.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey)return;
 const tag=(event.target.tagName||'').toLowerCase();
 if(['input','textarea','select','button','summary','a'].includes(tag)||event.target.isContentEditable)return;
 if(event.code==='Space'){event.preventDefault();toggleFilm()}
 else if(event.code==='ArrowRight'){event.preventDefault();seekFilm(filmTime+5)}
 else if(event.code==='ArrowLeft'){event.preventDefault();seekFilm(filmTime-5)}
 else if(event.code==='Escape'&&screenBox.classList.contains('theater')){leaveTheater()}
});
window.FILM={W,H,TOTAL,canvas:cv,setup,render,seek:seekFilm,pause:pauseFilm,
 get time(){return filmTime},get playing(){return isPlaying},events:LINES,synth};
updateSoundButton();updatePlayerUI();render(0);

const resizeFilm=()=>{setup();render(hasStarted?filmTime:4,!hasStarted)};
if(window.ResizeObserver)new ResizeObserver(resizeFilm).observe(cv);
window.addEventListener('resize',resizeFilm);
resizeFilm();
})();
</script>
</body>
