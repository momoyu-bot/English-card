const $=id=>document.getElementById(id),cover=$('cover'),player=$('player'),seek=$('seek'),status=$('status');
const canvas=$('film'),ctx=canvas.getContext('2d'),poster=$('artwork'),pc=poster.getContext('2d');
canvas.width=poster.width=900;canvas.height=poster.height=1600;ctx.scale(2,2);pc.scale(2,2);render(pc,2,{poster:true});
let time=0,playing=false,muted=false,last=0,raf=0,lastLine=-1,audioCtx=null,master=null,noteIndex=-1,liveNotes=[];
const lines=SHOTS.flatMap(s=>s.lines),clock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');
const playIcon='<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg>',pauseIcon='<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>';
function sound(){if(master)master.gain.setTargetAtTime(muted?0:.48,audioCtx.currentTime,.08);$('coverSound').setAttribute('aria-pressed',String(!muted));$('coverSound').lastElementChild.textContent=muted?'配乐已关闭':'配乐已开启';$('sound').setAttribute('aria-pressed',String(!muted));$('sound').setAttribute('aria-label',muted?'开启配乐':'关闭配乐');$('sound').innerHTML=muted?'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 4 5 6m0-6-5 6"/></svg>':'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 3c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></svg>'}
function initSound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audioCtx){audioCtx=new A();master=audioCtx.createGain();master.gain.value=muted?0:.48;master.connect(audioCtx.destination)}audioCtx.resume().catch(()=>{});}catch{}}
function note(midi,volume=.12,duration=1.3){if(!audioCtx||audioCtx.state!=='running'||muted)return;const now=audioCtx.currentTime,f=440*Math.pow(2,(midi-69)/12);[1,2].forEach((h,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f*h;g.gain.setValueAtTime(.00001,now);g.gain.exponentialRampToValueAtTime(volume*(i?.16:1),now+.012);g.gain.exponentialRampToValueAtTime(.00001,now+duration);o.connect(g);g.connect(master);o.start();o.stop(now+duration+.03);liveNotes.push(o);o.onended=()=>{o.disconnect();g.disconnect();liveNotes=liveNotes.filter(v=>v!==o)}})}
function silence(){for(const o of liveNotes){try{o.stop()}catch{}}liveNotes=[];noteIndex=-1}
function music(){let n=Math.floor(time/.62);if(n===noteIndex)return;noteIndex=n;const chords=[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]],chord=chords[Math.floor(n/6)%4],melody=[76,79,81,79,76,72,74,76,79,76,74,72,69,72,76,74,72,69,67,71,74,76,74,71];if(n%3===0)note(chord[0],.09,1.9);else note(chord[2+n%2],.05,1.2);if(n%2===0)note(melody[Math.floor(n/2)%melody.length]+(time>14&&time<23?12:time>49&&time<58?-12:0),.09,1.6)}
function sync(){ $('pauseIndicator').hidden=playing||time>=DURATION;$('toggle').setAttribute('aria-label',playing?'暂停':'播放');$('tap').setAttribute('aria-label',playing?'暂停动画':'播放动画');$('toggle').innerHTML=playing?pauseIcon:playIcon;}
function update(){seek.value=time;seek.style.setProperty('--p',(time/DURATION*100)+'%');$('elapsed').textContent=clock(time);seek.setAttribute('aria-valuetext',Math.floor(time/60)+' 分 '+Math.floor(time%60)+' 秒');$('chapter').textContent=SHOTS.find(s=>time<s.end)?.name||SHOTS.at(-1).name;let idx=lines.findLastIndex(l=>time>=l[0]);if(idx!==lastLine){document.querySelectorAll('.subtitle-line').forEach((el,i)=>{el.classList.toggle('current',i===idx);if(i===idx)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});lastLine=idx}}
function frame(now){if(!playing)return;if(last)time=Math.min(DURATION,time+(now-last)/1000);last=now;render(ctx,time);update();music();if(time>=DURATION){playing=false;silence();$('ending').hidden=false;sync();return}raf=requestAnimationFrame(frame)}
function play(){if(time>=DURATION)time=0;initSound();playing=true;last=0;status.textContent='';$('ending').hidden=true;sync();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function pause(){playing=false;last=0;cancelAnimationFrame(raf);silence();sync()}
function go(t,autoplay=false){time=clamp(Number(t)||0,0,DURATION);last=0;silence();$('ending').hidden=true;render(ctx,time);update();if(autoplay)play();else sync()}
function openFilm(){cover.hidden=true;player.hidden=false;}
$('start').addEventListener('click',()=>{openFilm();go(0,true)});
$('back').addEventListener('click',()=>{pause();player.hidden=true;cover.hidden=false;$('ending').hidden=true;$('start').focus({preventScroll:true})});
for(const id of ['coverSound','sound'])$(id).addEventListener('click',()=>{muted=!muted;initSound();sound()});
for(const id of ['toggle','tap'])$(id).addEventListener('click',()=>playing?pause():play());
$('replay').addEventListener('click',()=>go(0,true));
seek.addEventListener('input',()=>go(Number(seek.value)));
$('transcriptJump').addEventListener('click',()=>{pause();$('book').scrollIntoView({behavior:'smooth',block:'start'})});
$('coverBook').addEventListener('click',()=>{$('book').scrollIntoView({behavior:'smooth',block:'start'})});
$('endBook').addEventListener('click',()=>{$('book').scrollIntoView({behavior:'smooth',block:'start'})});
lines.forEach(([at,who,words],i)=>{const b=document.createElement('button');b.className='subtitle-line';b.type='button';b.setAttribute('aria-label',clock(at)+' '+who+'：'+words);const ts=document.createElement('time');ts.textContent=clock(at);const col=document.createElement('span');const name=document.createElement('small');name.textContent=who;const txt=document.createElement('span');txt.textContent=words;col.append(name,txt);b.append(ts,col);b.addEventListener('click',()=>{openFilm();go(at,true);$('cinema').scrollIntoView({behavior:'smooth',block:'start'})});$('transcript').append(b)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});
document.addEventListener('keydown',e=>{if(player.hidden||['BUTTON','INPUT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight')go(time+5);if(e.code==='ArrowLeft')go(time-5)});
window.FILM={duration:DURATION,fps:30,canvas,render(t){render(ctx,clamp(t,0,DURATION));},seek(t){openFilm();go(t);},play,pause,get time(){return time}};
render(ctx,0);sound();update();
