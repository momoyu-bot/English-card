<script>

  [71.3,74.45,["狐狸等了一会儿，伸出爪子。"]],

const clip=(v,lo=0,hi=1)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=(a,b,t)=>{const q=clip((t-a)/(b-a));return q*q*(3-2*q)};
const bell=(a,b,t)=>Math.sin(Math.PI*clip((t-a)/(b-a)));
const osc=(n)=>Math.sin(n);
function random(seed){let k=seed>>>0;return ()=>{k=(Math.imul(k,1664525)+1013904223)>>>0;return k/4294967296}}
function makeSurface(w,h,paint,density=1){
  const s=document.createElement("canvas");s.width=Math.round(w*density);s.height=Math.round(h*density);
  const g=s.getContext("2d");g.scale(density,density);paint(g);return s;
}
const grain=makeSurface(120,120,g=>{
  const rand=random(47);
  for(let i=0;i<1500;i++){
    const v=rand();g.fillStyle=v>.46?"rgba(255,247,208,.16)":"rgba(36,53,40,.13)";
    const x=rand()*120,y=rand()*120;g.fillRect(x,y,rand()*1.8+.35,rand()*.65+.3);
  }
  for(let i=0;i<50;i++){const x=rand()*120,y=rand()*120;g.strokeStyle="rgba(78,73,45,.07)";
    g.lineWidth=.45;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+3,y-.7,x+7*rand()+3,y+.5);g.stroke();}
});
const grainPattern=ctx.createPattern(grain,"repeat");
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function oval(x,y,rx,ry,color,a=0){

  ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,a,0,TAU);ctx.fill();
}
function line(x1,y1,x2,y2,color,width=1){
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function poly(coords,color,stroke=null,width=1){
  ctx.beginPath();ctx.moveTo(coords[0],coords[1]);
  for(let i=2;i<coords.length;i+=2)ctx.lineTo(coords[i],coords[i+1]);
  ctx.closePath();if(color){ctx.fillStyle=color;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
}
const shapes=new Map();
function path(d,fill,stroke=null,width=1){
  let p=shapes.get(d);if(!p){p=new Path2D(d);if(shapes.size<420)shapes.set(d,p)}
  if(fill){ctx.fillStyle=fill;ctx.fill(p)}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke(p)}
}
function withPose(x,y,s,a,draw){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);draw();ctx.restore();
}
function clipped(x,y,w,h,draw){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();draw();ctx.restore();
}
function myText(str,x,y,size,color,opts={}){
  ctx.save();ctx.font=(opts.weight||500)+" "+size+"px "+(opts.font||serif);
  ctx.fillStyle=color;ctx.textAlign=opts.align||"center";ctx.textBaseline="middle";ctx.fillText(str,x,y);ctx.restore();
}
function vertical(str,x,top,size,color,space=1.12){

}
function gleam(x,y,size,color){

    x,y+size,x-size*.16,y+size*.16,x-size*.65,y,x-size*.16,y-size*.16],color);

function glow(x,y,r,inner,outer="rgba(251,205,127,0)"){

function paperTexture(x,y,w,h,alpha=1){ctx.save();ctx.globalAlpha*=alpha;rect(x,y,w,h,grainPattern);ctx.restore()}
function ridgeline(base,amp,peaks){

  ridgeline(235,67,[[-7,63,1.1],[49,25,.53],[132,38,.5],[168,26,.63],[256,43,.36],[349,42,1.35]]),
  ridgeline(255,53,[[-5,48,1.1],[59,23,.5],[141,46,.45],[232,34,.22],[335,65,.72]])

function ridge(points,base,fill,carve,index){
  ctx.beginPath();ctx.moveTo(points[0][0],base+4);for(const [x,y] of points)ctx.lineTo(x,y);
  ctx.lineTo(points[points.length-1][0],base+4);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.save();ctx.clip();const rand=random(453+index);

    if(i%2){ctx.moveTo(x+2.2,y+off+2);ctx.quadraticCurveTo(x+1,y+len*.5,x-3,y+len*.83)}

function cloud(x,y,s,color){

    path("M-43 4h22c7 0 7-5 13-5 4 0 5 2 5 3 0-7 5-10 11-10 7 0 12 4 12 9h9c3 0 6 1 7 3h13 M-18 9h24c6 0 7-3 11-3h20 M-1-2c3-4 8-5 11-2",null,color,1);
  });

function moon(x,y,r,night=true){

function willow(x,y,s,t,color){
  withPose(x,y,s,0,()=>{
    path("M-12-12Q12 3 32 2T73-5",null,color,3.3);
    for(let i=0;i<10;i++){

function landscape(theme){

    dusk:["#839c8e","#e6cda1","#587973","#a0ad8f","#3a625d","#789386","#244c48","#517566","#648781","#325e59"],

function synth(ac,dest,e,when){
  const g=ac.createGain();g.connect(dest);const end=when+e.d;
  const attack=e.kind==="reed"?.21:e.kind==="wood"?.004:e.kind==="drop"?.009:.017;
  g.gain.setValueAtTime(.00001,when);g.gain.linearRampToValueAtTime(e.v,when+attack);
  if(e.kind==="reed"){g.gain.linearRampToValueAtTime(e.v*.68,when+e.d*.68);g.gain.exponentialRampToValueAtTime(.00002,end)}
  else g.gain.exponentialRampToValueAtTime(.00002,end);
  const partials=e.kind==="wood"?[[1,1],[1.48,.60],[2.41,.22]]:
    e.kind==="reed"?[[1,1],[2,.19],[3,.08]]:e.kind==="chime"?[[1,.72],[2.69,.28]]:[[1,1],[2,.28],[3.015,.105]];
  let left=partials.length;
  for(const [mult,gain] of partials){
    const tone=ac.createOscillator(),part=ac.createGain();tone.type="sine";
    const f=e.f*mult;tone.frequency.setValueAtTime(e.kind==="drop"?f*1.38:f,when);
    if(e.kind==="wood"||e.kind==="drop")tone.frequency.exponentialRampToValueAtTime(f*(e.kind==="wood"?.73:.8),end);
    if(e.kind==="reed"){tone.detune.setValueAtTime(-9,when);tone.detune.linearRampToValueAtTime(2,when+.28);tone.detune.linearRampToValueAtTime(-3,end)}
    part.gain.value=gain;tone.connect(part);part.connect(g);tone.start(when);tone.stop(end+.02);
    tone.onended=()=>{tone.disconnect();part.disconnect();if(--left===0)g.disconnect()};
  }
}
const openBtn=document.getElementById("openFilm"),playBtn=document.getElementById("play");
const playLabel=document.getElementById("playLabel"),playShape=document.getElementById("playShape");
const soundBtn=document.getElementById("sound"),soundLabel=document.getElementById("soundLabel"),waves=document.getElementById("waves");
const seek=document.getElementById("seek"),nowLabel=document.getElementById("now"),cueList=document.getElementById("cues");
let audio=null,bus=null,eventIndex=0,audioStart=0,soundOn=true;
let current=0,playing=false,started=false,anchor=0,raf=0,lastFrame=-1,lastUI=-1,activeCue=-1;
const timeText=n=>Math.floor(n/60)+":"+String(Math.floor(n)%60).padStart(2,"0");
const cueButtons=cues.map(item=>{
  const row=document.createElement("li"),b=document.createElement("button"),stamp=document.createElement("time"),text=document.createElement("span");
  b.type="button";b.className="cue";stamp.textContent=timeText(item.a);text.textContent=item.lines.join("");
  b.append(stamp,text);row.appendChild(b);cueList.appendChild(row);
  b.addEventListener("click",()=>{jump(item.a,true);document.querySelector("header").scrollIntoView({block:"start",behavior:"auto"})});return b;
});
function dropBus(){
  if(bus){const dead=bus;bus=null;const at=audio.currentTime;dead.gain.cancelScheduledValues(at);dead.gain.setValueAtTime(dead.gain.value,at);dead.gain.linearRampToValueAtTime(0,at+.035);setTimeout(()=>{try{dead.disconnect()}catch(_){}},80)}
}
function schedule(){
  if(!playing||!audio||!bus||!soundOn)return;
  const filmNow=clip((performance.now()-anchor)/1000,0,TOTAL);
  // Re-anchor after mobile Safari interrupts the audio hardware mid-playback.
  if(Math.abs(audio.currentTime-(audioStart+filmNow))>.20)audioStart=audio.currentTime-filmNow;
  while(eventIndex<events.length&&events[eventIndex].t<filmNow+.28){
    const e=events[eventIndex++];if(e.t<filmNow-.08)continue;
    synth(audio,bus,e,Math.max(audio.currentTime+.008,audioStart+e.t));
  }
}
function startSound(){
  dropBus();if(!soundOn||!playing)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    if(!audio)audio=new AC();
    if(audio.state!=="running"){const resume=audio.resume();if(resume&&resume.catch)resume.catch(()=>{})}
    bus=audio.createGain();bus.gain.value=.56;bus.connect(audio.destination);
    const filmNow=clip((performance.now()-anchor)/1000,0,TOTAL);audioStart=audio.currentTime-filmNow;
    eventIndex=events.findIndex(e=>e.t>=filmNow-.05);if(eventIndex<0)eventIndex=events.length;schedule();
  }catch(_){dropBus()}
}
function ui(){
  const p=100*current/TOTAL;seek.value=String(current);seek.style.setProperty("--progress",p+"%");
  seek.setAttribute("aria-valuetext",timeText(current)+"，全长 "+timeText(TOTAL));
  nowLabel.textContent=timeText(current);
  const label=playing?"暂停":current>=TOTAL?"重播":"播放";
  playLabel.textContent=label;playBtn.setAttribute("aria-label",label);
  playShape.setAttribute("d",playing?"M3 2h3.5v12H3zm6.5 0H13v12H9.5z":current>=TOTAL?"M8 1a7 7 0 1 1-6.6 9H4a4.6 4.6 0 1 0 1-5L8 8H1V1l2.3 2.3A7 7 0 0 1 8 1z":"M3 2 14 8 3 14z");
  const match=cues.find(c=>current>=c.a&&(current<c.b||(current===TOTAL&&c.b===TOTAL))),id=match?match.i:-1;
  if(id!==activeCue){if(activeCue>=0)cueButtons[activeCue].removeAttribute("aria-current");activeCue=id;if(id>=0)cueButtons[id].setAttribute("aria-current","true")}
}
function tick(ms){
  raf=0;if(!playing)return;current=clip((ms-anchor)/1000,0,TOTAL);
  const frame=Math.floor(current*30);
  if(frame!==lastFrame){render(current);lastFrame=frame}
  schedule();if(ms-lastUI>95){ui();lastUI=ms}
  if(current>=TOTAL){playing=false;dropBus();ui();return}
  raf=requestAnimationFrame(tick);
}
function play(){
  if(playing)return;if(current>=TOTAL)current=0;
  started=true;openBtn.hidden=true;playing=true;anchor=performance.now()-current*1000;
  lastFrame=-1;render(current);startSound();ui();if(!raf)raf=requestAnimationFrame(tick);
}
function pause(){
  if(playing)current=clip((performance.now()-anchor)/1000,0,TOTAL);
  playing=false;if(raf)cancelAnimationFrame(raf);raf=0;dropBus();if(started)render(current);ui();
}
function jump(t,run=playing){
  pause();started=true;openBtn.hidden=true;current=clip(Number(t)||0,0,TOTAL);
  render(current);ui();if(run&&current<TOTAL)play();
}
function toggle(){if(playing)pause();else play()}
let scrubbing=false,resumeAfterScrub=false;
function beginScrub(){if(scrubbing)return;scrubbing=true;resumeAfterScrub=playing;pause()}
function endScrub(){if(!scrubbing)return;scrubbing=false;if(resumeAfterScrub&&current<TOTAL)play();resumeAfterScrub=false}
seek.addEventListener("pointerdown",beginScrub);
seek.addEventListener("input",()=>{const value=Number(seek.value);if(scrubbing)jump(value,false);else jump(value,playing)});
seek.addEventListener("change",endScrub);window.addEventListener("pointerup",endScrub);window.addEventListener("pointercancel",endScrub);
