let playing=false,started=false,time=0,prevStamp=null,lastCue=-2,lastChapter=-1;
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const lineEls=cues.map((q,i)=>{let b=document.createElement('button');b.className='line';b.type='button';let tm=document.createElement('time');tm.textContent=fmt(q[0]);b.append(tm);let sp=document.createElement('span');if(q[2]){let who=document.createElement('b');who.textContent=q[2]+'：';sp.append(who)}sp.append(document.createTextNode(q[3].replace('｜',' / ')));b.append(sp);b.addEventListener('click',()=>{seekTo(q[0]);start()});$('lines').append(b);return b});
const chapterEls=chapters.map((q,i)=>{let b=document.createElement('button');b.type='button';b.textContent=`${String(i+1).padStart(2,'0')} ${q.name}`;b.addEventListener('click',()=>{seekTo(q.t);start()});$('chapters').append(b);return b});
function update(){ $('clock').textContent=fmt(time)+' / '+fmt(DURATION);$('seek').value=time;$('play').textContent=playing?'Ⅱ 暂停':time>=DURATION?'↺ 重播':'▶ 播放';$('play').setAttribute('aria-label',playing?'暂停短片':'播放短片');$('paused').hidden=playing||!started||time>=DURATION;let k=currentCue(time);if(k!==lastCue){if(lastCue>=0)lineEls[lastCue].classList.remove('on');if(k>=0){lineEls[k].classList.add('on');$('accessible').textContent=(cues[k][2]?cues[k][2]+'：':'')+cues[k][3].replace('｜','。')}lastCue=k}let ch=chapters.reduce((acc,q,i)=>time>=q.t?i:acc,0);if(ch!==lastChapter){chapterEls.forEach((b,i)=>{b.classList.toggle('active',i===ch);b.setAttribute('aria-current',i===ch?'true':'false')});lastChapter=ch}}
function start(){if(time>=DURATION)time=0;started=true;playing=true;prevStamp=null;$('cover').hidden=true;initAudio();if(master&&audioCtx)master.gain.setTargetAtTime(muted?0:.28,audioCtx.currentTime,.02);update()}
function pause(){playing=false;prevStamp=null;hush();update()}
function seekTo(t){time=clamp(Number(t)||0,0,DURATION);prevStamp=null;lastBeat=-1;started=true;$('cover').hidden=true;hush();if(playing&&master&&audioCtx)master.gain.setTargetAtTime(muted?0:.28,audioCtx.currentTime,.025);render(time);update()}
function toggle(){playing?pause():start()}
$('cover').addEventListener('click',start);$('play').addEventListener('click',toggle);$('replay').addEventListener('click',()=>{seekTo(0);start()});cv.addEventListener('click',toggle);$('seek').addEventListener('input',e=>seekTo(e.target.value));$('sound').addEventListener('click',()=>{muted=!muted;initAudio();if(master&&audioCtx)master.gain.setTargetAtTime(muted||!playing?0:.28,audioCtx.currentTime,.02);$('sound').textContent=muted?'声音 关':'声音 开';$('sound').setAttribute('aria-pressed',String(!muted))});
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('screen').requestFullscreen)await $('screen').requestFullscreen();else{ $('screen').scrollIntoView({behavior:'smooth',block:'center'});$('full').textContent='横屏更大'}}catch(_){$('full').textContent='横屏更大'}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});document.addEventListener('keydown',e=>{if(['INPUT','BUTTON','SUMMARY'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.code==='ArrowRight'){e.preventDefault();seekTo(time+5)}else if(e.code==='ArrowLeft'){e.preventDefault();seekTo(time-5)}});
function frame(stamp){if(playing){if(prevStamp!==null){let before=time;time=Math.min(DURATION,time+Math.min((stamp-prevStamp)/1000,.1));soundTick(before,time)}prevStamp=stamp;render(time);update();if(time>=DURATION){pause();$('coverTitle').textContent='再 看 一 遍';$('coverHint').textContent='这次播放，不扣片中额度。';$('cover').hidden=false}}requestAnimationFrame(frame)}
window.FILM={duration:DURATION,width:W,height:H,canvas:cv,render,seek:seekTo,play:start,pause,get time(){return time},get playing(){return playing},captions:cues.map(q=>({start:q[0],end:q[1],speaker:q[2],text:q[3].replace('｜',' / ')}))};
render(0);update();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
