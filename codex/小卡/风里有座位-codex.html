for(let t=1,i=0;t<144;t+=2.16,i++){if(t>9&&t<18)continue;if(t>85&&t<93)continue;let ch=chords[i%4],v=t>76&&t<92?.045:.075;note(t,ch[0]-12,1.9,v,'bass');note(t+.72,ch[1],1.0,v*.7,'pluck');note(t+1.44,ch[2],1.0,v*.7,'pluck');if(t>36&&t<76)note(t+1.8,ch[2]+12,.45,.035,'bell')}
EVENTS.sort((a,b)=>a.t-b.t);
function synth(ac,dest,e){let start=e.t,end=Math.min(TOTAL,e.t+e.d),gain=ac.createGain(),f=440*Math.pow(2,(e.n-69)/12);gain.connect(dest);gain.gain.setValueAtTime(0,start);let attack=e.kind==='flute'?.09:e.kind==='bass'?.035:.012;gain.gain.linearRampToValueAtTime(e.v,start+attack);gain.gain.exponentialRampToValueAtTime(.00001,end);gain.gain.linearRampToValueAtTime(0,end+.025);const parts=e.kind==='bell'?[[1,1],[2,.22],[3,.075]]:e.kind==='flute'?[[1,1],[2,.18],[3,.035]]:e.kind==='bass'?[[1,1],[2,.25]]:e.kind==='pluck'?[[1,1],[2,.25],[3,.08]]:[[1,1]];parts.forEach(([h,v])=>{let osc=ac.createOscillator(),g=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(f*h,start);if(e.kind==='boing')osc.frequency.exponentialRampToValueAtTime(f*.5,end);if(e.kind==='wood')osc.frequency.exponentialRampToValueAtTime(f*.82,end);g.gain.value=v;osc.connect(g);g.connect(gain);osc.start(start);osc.stop(end+.04)})}
let scorePromise=null,score=null;
function prepareScore(){if(scorePromise)return scorePromise;scorePromise=(async()=>{let O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O)return null;let ac=new O(1,Math.ceil((TOTAL+.1)*22050),22050),dest=ac.createGain();dest.gain.value=1;dest.connect(ac.destination);EVENTS.forEach(e=>synth(ac,dest,e));let b=await ac.startRendering(),a=b.getChannelData(0),peak=0;for(let i=0;i<a.length;i++)peak=Math.max(peak,Math.abs(a[i]));let level=peak>0?Math.min(2.8,.78/peak):1;for(let i=0;i<a.length;i++){let t=i/b.sampleRate;let fade=clamp((TOTAL-t)/2.2);a[i]*=level*fade}score=b;return b})().catch(()=>null);return scorePromise}
let AC=null,source=null,gain=null,audioToken=0,soundOn=true,volume=.8;
function stopAudio(){audioToken++;if(source){let old=source;source=null;try{old.stop()}catch(e){}old.disconnect()}if(gain){gain.disconnect();gain=null}}
async function startAudio(){stopAudio();let token=audioToken;if(!soundOn)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!AC)AC=new A();await AC.resume();let b=await prepareScore();if(token!==audioToken||!playing||!soundOn)return;if(!b){document.getElementById('status').textContent='音乐暂时未能开启，画面仍可播放。';return}source=AC.createBufferSource();source.buffer=b;gain=AC.createGain();gain.gain.setValueAtTime(0,AC.currentTime);gain.gain.linearRampToValueAtTime(volume,AC.currentTime+.025);source.connect(gain);gain.connect(AC.destination);let offset=clamp((performance.now()-anchor)/1000,0,TOTAL-.001);source.start(0,offset)}catch(e){document.getElementById('status').textContent='点「声音开」可再试一次音乐。'}}
const cover=document.getElementById('cover'),playBtn=document.getElementById('play'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),soundBtn=document.getElementById('sound'),transcript=document.getElementById('transcript');
let current=0,playing=false,hasStarted=false,anchor=0,lastUi=0,lastCue=-2,dragWasPlaying=false;
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let actIndex=-1;const cueButtons=[];CUES.forEach(c=>{let ai=ACTS.reduce((a,s,i)=>s.t<=c.a?i:a,0);if(ai!==actIndex){let h=document.createElement('h2');h.className='act';h.textContent=ACTS[ai].n;transcript.append(h);actIndex=ai}let b=document.createElement('button');b.className='cue';let tm=document.createElement('time'),tx=document.createElement('span');tm.textContent=fmt(c.a);tx.textContent=(c.who?c.who+'：':'')+c.text;b.append(tm,tx);b.addEventListener('click',()=>{jump(c.a+.24);document.getElementById('screen').scrollIntoView({behavior:'smooth',block:'start'})});transcript.append(b);cueButtons.push(b)});
function update(){seek.value=current;timeEl.textContent=fmt(current)+' / '+fmt(TOTAL);playBtn.textContent=playing?'暂停':current>=TOTAL?'重播':'播放';playBtn.setAttribute('aria-label',playing?'暂停短片':'播放短片');let c=CUES.find(q=>current>=q.a&&current<q.b),i=c?c.i:-1;if(i!==lastCue){if(lastCue>=0)cueButtons[lastCue].classList.remove('active');if(i>=0)cueButtons[i].classList.add('active');lastCue=i}}
function play(){if(playing)return;if(current>=TOTAL)current=0;hasStarted=true;cover.hidden=true;playing=true;anchor=performance.now()-current*1000;render(current);startAudio();update()}
function pause(){if(playing)current=clamp((performance.now()-anchor)/1000,0,TOTAL);playing=false;stopAudio();render(current,!hasStarted);update()}
function jump(t){let was=playing;playing=false;stopAudio();current=clamp(t,0,TOTAL);hasStarted=true;cover.hidden=true;render(current);update();if(was)play()}
function frame(now){if(playing){current=clamp((now-anchor)/1000,0,TOTAL);render(current);if(now-lastUi>100){update();lastUi=now}if(current>=TOTAL){playing=false;stopAudio();update()}}requestAnimationFrame(frame)}
cover.addEventListener('click',play);playBtn.addEventListener('click',()=>playing?pause():play());cv.addEventListener('click',()=>playing?pause():play());document.getElementById('restart').addEventListener('click',()=>{pause();jump(0);play()});seek.addEventListener('input',()=>{if(playing){dragWasPlaying=true;pause()}jump(+seek.value)});seek.addEventListener('change',()=>{if(dragWasPlaying){dragWasPlaying=false;play()}});soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'声音开':'声音关';soundBtn.setAttribute('aria-pressed',String(soundOn));if(soundOn&&playing)startAudio();else stopAudio()});document.getElementById('volume').addEventListener('input',e=>{volume=+e.target.value;if(gain&&AC)gain.gain.setTargetAtTime(volume,AC.currentTime,.025)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});document.addEventListener('keydown',e=>{if(/INPUT|BUTTON|SUMMARY/.test(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight')jump(current+5);if(e.code==='ArrowLeft')jump(current-5)});
function resize(){let dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(540,Math.round(cv.clientWidth*dpr));cv.height=Math.round(cv.width*H/W);render(current,!hasStarted)}window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);prepareScore();
