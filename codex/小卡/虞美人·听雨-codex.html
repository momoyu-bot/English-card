<style>

<section class="sc" data-card="歌楼" data-dur="32"><h2>歌楼</h2>
<p data-t="1.0-6.6">少年听雨歌楼上，红烛昏罗帐。</p>
<p data-t="9.3-13.1" data-say="小粉">再往左，一点点。</p>
<p data-t="17.1-21.0" data-say="小紫">这一声，算我的。</p>
<p data-t="23.1-27.0" data-say="小黑">那我等下一滴。</p>
</section>
<section class="sc" data-card="客舟" data-dur="34"><h2>客舟</h2>
<p data-t="0.9-5.6">壮年听雨客舟中，</p>
<p data-t="6.2-11.0">江阔云低断雁叫西风。</p>
<p data-t="17.5-21.2" data-say="小粉">到岸了？</p>
<p data-t="22.1-25.8" data-say="StashYu">还早。你睡。</p>
</section>
<section class="sc" data-card="僧庐" data-dur="40"><h2>僧庐</h2>
<p data-t="1.2-6.2">而今听雨僧庐下，</p>
<p data-t="7.0-11.4">鬓已星星也。</p>
<p data-t="13.1-17.4" data-say="FetchMo">碗还往前挪么？</p>
<p data-t="22.8-27.5">悲欢离合总无情，</p>
<p data-t="29.2-35.2">一任阶前点滴到天明。</p>
</section>
<p class="source">词作取自蒋捷《虞美人（听雨）》 · <a href="https://zh.wikisource.org/wiki/虞美人_(蔣捷)" target="_blank" rel="noopener noreferrer">维基文库</a></p>

function endSound(){

  const previous=bus,now=audioCtx.currentTime;
  try{previous.gain.cancelScheduledValues(now);previous.gain.setValueAtTime(previous.gain.value,now);previous.gain.linearRampToValueAtTime(0,now+.028);}catch(_){}
  window.setTimeout(()=>{try{previous.disconnect();}catch(_){}},85);bus=null;

function activateSound(start){

function pumpSound(t){

  const e=events[cueIndex++],when=audioClock+e.t-filmClock,late=max(0,now-when);

 }
}
if(sum!==TOTAL)throw new Error('字幕与影片时长不同');
function lineAt(t){return lines.find(l=>t>=l.start&&t<l.end);}
function caption(t){
 const line=lineAt(t);if(!line)return;
 const a=min(ease(line.start,line.start+.23,t),1-ease(line.end-.31,line.end,t));
 alpha(a,()=>{
  captionBand();const col='#fff0d7';
  if(line.say){
   const name={StashYu:'StashYu',FetchMo:'FetchMo'}[line.say]||line.say;
   words(name,180,503,12,'#f4d8a8','center',sans,500);
   words(line.str,180,536,19,col);
  }else{
   let parts=[line.str];
   if(line.str==='少年听雨歌楼上，红烛昏罗帐。')parts=['少年听雨歌楼上，','红烛昏罗帐。'];
   const y=parts.length===2?506:533;
   parts.forEach((s,i)=>words(s,180,y+i*27,20,col));
  }
 });
}
function render(t){t=clamp(Number(t)||0,0,TOTAL);baseFrame(t);caption(t);}
let at=0,playing=false,started=false,frameId=0,stamp0=0,play0=0,lastPaint=-1,selected=null,scrubResume=false;
function showPoster(){c=mainPen;c.setTransform(cv.width/W,0,0,cv.height/H,0,0);c.lineCap='round';c.lineJoin='round';c.globalAlpha=1;poster();}
function draw(){if(started)render(at);else showPoster();}
function fit(){
 const bounds=cv.getBoundingClientRect();const px=max(1,Math.round(bounds.width*min(3,window.devicePixelRatio||1)));
 if(px!==cv.width){setup(px);}draw();
}
function useIcon(el,id){el.setAttribute('href','#i-'+id);el.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','#i-'+id);}
function stateUI(){
 const ended=started&&at>=TOTAL-.001;
 const action=playing?'暂停':ended?'重听':started?'继续播放':'播放短片';
 chipLabel.textContent=action;playButton.setAttribute('aria-label',action);surface.setAttribute('aria-label',action);
 surface.setAttribute('aria-pressed',playing?'true':'false');useIcon(chipIcon,ended?'again':'play');useIcon(playIcon,playing?'pause':ended?'again':'play');
 useIcon(soundIcon,audioAllowed?'sound':'mute');soundButton.setAttribute('aria-pressed',String(audioAllowed));soundButton.setAttribute('aria-label',audioAllowed?'关闭声音':'打开声音');
}
function progressUI(){
 slider.value=String(at);slider.style.setProperty('--pct',(at/TOTAL*100).toFixed(3)+'%');
 slider.setAttribute('aria-valuetext',timestamp(at)+'，总长 '+timestamp(TOTAL));
 const str=timestamp(at)+' / '+timestamp(TOTAL);if(clock.textContent!==str)clock.textContent=str;
 const line=lineAt(at);if(line!==selected){if(selected)selected.button.removeAttribute('aria-current');selected=line;if(line)line.button.setAttribute('aria-current','true');}
}
function freezeTime(){
 if(playing)at=min(TOTAL,play0+(performance.now()-stamp0)/1000);
 playing=false;cancelAnimationFrame(frameId);endSound();progressUI();stateUI();draw();
}
function animate(now){
 if(!playing)return;
 at=min(TOTAL,play0+(now-stamp0)/1000);
 if(at>=TOTAL){freezeTime();return;}
 pumpSound(at);
 if(now-lastPaint>=1000/30-1){render(at);progressUI();lastPaint=now;}
 frameId=requestAnimationFrame(animate);
}
function begin(){
 if(playing)return;if(at>=TOTAL-.001)at=0;
 started=true;playing=true;stamp0=performance.now();play0=at;lastPaint=-100;
 activateSound(at);draw();stateUI();progressUI();frameId=requestAnimationFrame(animate);
}
function toggle(){if(playing)freezeTime();else begin();}
function seekTo(t,resume){
 cancelAnimationFrame(frameId);playing=false;endSound();at=clamp(t,0,TOTAL);started=true;
 if(resume&&at<TOTAL){begin();return;}draw();stateUI();progressUI();
}
surface.addEventListener('click',toggle);playButton.addEventListener('click',toggle);
soundButton.addEventListener('click',()=>{audioAllowed=!audioAllowed;if(playing){if(audioAllowed)activateSound(at);else endSound();}stateUI();});
slider.addEventListener('pointerdown',()=>{scrubResume=playing;if(playing)freezeTime();});
slider.addEventListener('input',()=>{const v=Number(slider.value);if(playing){scrubResume=true;}seekTo(v,false);});
function finishScrub(){if(scrubResume){scrubResume=false;if(at<TOTAL)begin();}}
slider.addEventListener('change',finishScrub);slider.addEventListener('pointerup',finishScrub);slider.addEventListener('pointercancel',finishScrub);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)freezeTime();});
window.addEventListener('pagehide',()=>{if(playing)freezeTime();});
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(cv.parentElement);
stateUI();fit();progressUI();
window.FILM={W,H,TOTAL,duration:TOTAL,canvas:cv,events,synth,setup,render};

})();
</script>
</body>
