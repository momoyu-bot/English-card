 try{const a=document.createElement("a"),url=URL.createObjectURL(new Blob([SOURCE],{type:"text/html;charset=utf-8"}));a.href=url;a.download="归心似箭-codex.html";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);$("notice").textContent="保存后放进 codex / 小卡，打开就能重看。";}
 catch(e){$("notice").textContent="当前预览窗口拦住了下载，可复制整份 HTML 保存为「归心似箭-codex.html」。";}
});
document.addEventListener("keydown",e=>{
 if(/INPUT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName))return;
 if(e.code==="Space"){e.preventDefault();play();}
 if(e.code==="ArrowLeft"){e.preventDefault();seek(at-5);}
 if(e.code==="ArrowRight"){e.preventDefault();seek(at+5);}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing){playing=false;silence();sync();}});
function frame(now){
 if(playing){at=Math.min(DURATION,at+Math.min((now-last)/1000,.10));music();render(at);sync();if(at>=DURATION){playing=false;silence();sync();}}
 last=now;requestAnimationFrame(frame);
}
window.FILM={
 duration:DURATION,fps:30,width:W,height:H,
 render:t=>{at=clamp(Number(t),0,DURATION);render(at);sync();},
 seek,play,pause:()=>{playing=false;silence();sync();},
 captions:captions.map(c=>({start:c[0],end:c[1],speaker:c[2],text:c[3]}))
};
render(0);sync();requestAnimationFrame(frame);
})();
