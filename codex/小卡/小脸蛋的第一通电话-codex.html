<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4e8">
<meta name="description" content="三颗圆脑袋挤着一只听筒。小粉学你的嘟，小紫记你的铃声，小黑给这个号码写名字。">
<title>小脸蛋的第一通电话</title>
<style>
:root {
  color-scheme:light;
  --paper:#f8f4e8; --ink:#203c35; --muted:#54645a; --line:#b8bca7;
  --deep:#205449; --soft:#e7e9d5; --orange:#b34024; --card:#fffbef;
  --text:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  --mono:"SFMono-Regular","IBM Plex Mono","Menlo",monospace;
}
* {box-sizing:border-box}
[hidden] {display:none!important}
html {min-height:100%;background:var(--paper);-webkit-text-size-adjust:100%}
body {margin:0;color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;
  background:radial-gradient(ellipse at 48% 8%,#fffbf0 0,transparent 70%),
    repeating-linear-gradient(94deg,rgba(96,78,45,.018) 0 1px,transparent 1px 5px),var(--paper)}
button,input {font:inherit;color:inherit}
button {border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible {outline:3px solid #9f4d25;outline-offset:3px}
button:disabled {opacity:.55;cursor:default}
button svg {width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button {transition:background-color .15s,box-shadow .15s,transform .15s}
button:active:not(:disabled) {transform:translateY(1px)}
.shell {width:min(100%,580px);margin:0 auto;padding: max(9px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.mast {display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:51px;border-bottom:1px solid var(--ink)}
.brand {display:inline-flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.08em}
.brandmark {width:28px;height:28px;display:block}
.sound {display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;font-size:13px;font-weight:600;min-height:44px;padding:4px 1px 4px 12px}
.sound svg {width:18px;height:18px}
.heading {padding:19px 1px 15px}
h1,h2,p,figure {margin:0}
h1 {font-family:var(--serif);font-weight:900;font-size:clamp(27px,7.8vw,39px);letter-spacing:-.055em;line-height:1.22}
.heading p {font-size:14px;color:var(--muted);margin-top:7px;letter-spacing:.025em}
.artframe {position:relative;border:1px solid #7d8f79;border-radius:15px;overflow:hidden;background:#ccddc8;isolation:isolate}
.scene {display:block;width:100%;height:auto}
.statusrow {position:absolute;z-index:1;left:12px;right:12px;top:10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.lamp-label,.counter {background:#f7f6e7ec;color:#234637;border:1px solid #96a88f;border-radius:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:650;line-height:1;padding:6px 9px;white-space:nowrap}
.lamp {width:7px;height:7px;border-radius:50%;background:#a84227}
[data-mode="ring"] .lamp {animation:lamp 2.7s ease-in-out infinite}
[data-mode="call"] .lamp {background:#236a51}
[data-mode="ended"] .lamp {background:#777a6c}
.counter {font:11px/1 var(--mono);letter-spacing:.035em}
.counter[hidden] {display:none}
.scene .friend {transition:transform .42s cubic-bezier(.23,.72,.24,1)}
#pink-position {transform:translate(316px,133px)}
#purple-position {transform:translate(349px,179px)}
#black-position {transform:translate(128px,160px)}
[data-mode="call"][data-who="pink"] #pink-position {transform:translate(296px,113px)}
[data-mode="call"][data-who="purple"] #purple-position {transform:translate(300px,115px)}
[data-mode="call"][data-who="purple"] #pink-position {transform:translate(343px,163px)}
[data-mode="call"][data-who="black"] #black-position {transform:translate(127px,118px)}
[data-mode="call"][data-who="black"] #pink-position {transform:translate(329px,145px)}
#handset-lift {transition:transform .4s ease}
[data-mode="call"] #handset-lift {transform:translateY(-8px)}
[data-mode="ring"] #handset-rock {transform-origin:216px 110px;animation:ring-rock 2.7s ease-in-out infinite}
[data-mode="ring"] .ring-lines {animation:ring-lines 2.7s ease-in-out infinite}
.ring-lines {opacity:0}
.voice-lines,.tap-lines {opacity:0;transition:opacity .12s}
.scene[data-signal="voice"] .voice-lines,.scene[data-signal="tap"] .tap-lines {opacity:1}
.scene[data-signal="voice"] #pink-core {animation:bob .32s ease-in-out infinite alternate}
#paper-peek {opacity:0;transform:translateY(5px);transition:opacity .2s,transform .3s}
[data-mode="call"]:is([data-who="black"],[data-who="purple"]) #paper-peek,[data-mode="mail"] #paper-peek {opacity:1;transform:translateY(0)}
@keyframes lamp {0%,25%,100% {opacity:1} 55%,82% {opacity:.4}}
@keyframes ring-rock {0%,25%,100% {transform:rotate(0)} 3%,12%,21% {transform:rotate(-1.7deg)} 7%,16% {transform:rotate(1.5deg)}}
@keyframes ring-lines {0%,25% {opacity:1} 43%,95% {opacity:0} 100% {opacity:1}}
@keyframes bob {to {transform:translateY(-2.5px)}}
.console {margin-top:14px;background:var(--card);border:1px solid #b6b8a4;border-radius:13px;box-shadow:0 3px 0 #e6e2d4;overflow:hidden}
.ticket {padding:16px 17px 15px}
.eyebrow {display:flex;align-items:center;gap:8px;color:#566756;font-size:12px;font-weight:650;letter-spacing:.08em;line-height:1.4}
.eyebrow::before {content:"";height:2px;width:18px;background:var(--orange)}
.titleline {font:800 clamp(21px,5.8vw,29px)/1.35 var(--serif);letter-spacing:-.022em;overflow-wrap:anywhere;margin-top:6px}
.copy {font-size:14px;line-height:1.65;margin-top:5px;color:#46554a;overflow-wrap:anywhere}
.controls {display:flex;flex-wrap:wrap;gap:9px;margin-top:15px;align-items:center}
.key {display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:45px;border-radius:10px;padding:9px 13px;font-size:15px;font-weight:650;letter-spacing:.015em;line-height:1.3}
.primary {background:var(--deep);color:#fffbee;border:1px solid #214c40;box-shadow:0 2px 0 #173d34}
.secondary {background:#f2f1e3;border:1px solid #a8b095;color:#314d40;box-shadow:0 1px 0 #d9dac8}
#idlePanel .primary {flex:1.2}
#idlePanel .secondary {flex:1}
.talknav {display:flex;align-items:center;gap:8px;border-bottom:1px dashed #b8bba6;background:#f3f2e5;padding:4px 12px}
.talknav > span {flex:none;color:#586554;font-size:12px}
.friends {display:flex;flex:1;gap:2px;justify-content:space-between}
.route {flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;position:relative;min-height:44px;background:transparent;padding:4px 1px;font-size:14px;font-weight:600;border-radius:4px}
.route[aria-pressed="true"]::after {position:absolute;content:"";height:3px;background:var(--deep);bottom:2px;left:18%;right:18%;border-radius:2px}
.route .mini {width:19px;height:19px;stroke:none;fill:currentColor}
#hang {background:transparent;color:#9c3925;min-height:43px;display:flex;gap:5px;align-items:center;justify-content:center;font-size:13px;font-weight:650;padding:5px 3px 5px 10px;margin-left:auto}
#hang svg {width:17px;height:17px}
.livehead {display:flex;align-items:center;justify-content:space-between;min-height:36px;margin-top:-7px;margin-bottom:-4px}
#hold {touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#hold.down {background:#ae386b;border-color:#862e53;box-shadow:inset 0 2px 1px #812c58;transform:translateY(1px)}
.soundstrip {margin-left:3px;display:inline-flex;align-items:center;gap:3px;height:28px;color:#8f4963}
.soundstrip i {display:block;width:3px;height:var(--height);background:currentColor;border-radius:2px;transform:scaleY(.42);transform-origin:center;transition:transform .18s}
.soundstrip.play i {animation:wave .3s ease-in-out infinite alternate;animation-delay:var(--delay)}
@keyframes wave {from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.nameform {display:flex;flex:1;align-items:center;gap:8px;width:100%}
.nameform input {width:0;min-width:0;flex:1;min-height:45px;border-radius:8px;border:1px solid #8a9986;background:#fffef4;padding:6px 10px;font-size:16px}
.nameform .key {flex:none}
.pad {color:#4d397b;border-color:#9b8eb1;background:#ece6f5}
.markers {display:flex;align-items:center;gap:6px;height:17px;margin-top:9px}
.markers span {width:10px;height:10px;border:1px solid #c0b6c8;border-radius:50%}
.markers span.hit {background:#9159fe;border-color:#7750ad}
.callfoot {display:flex;align-items:center;gap:11px;padding:13px 2px 1px;color:var(--muted);line-height:1.4;font-size:12px}
.callfoot .wire {display:block;width:38px;height:14px;flex:none}
.callfoot .meta {overflow-wrap:anywhere}
.defs {width:0;height:0;position:absolute;overflow:hidden}
@media (hover:hover) {
 .key.primary:hover {background:#2c6555}
 .key.secondary:hover,.route:hover {background:#e6e8d7}
 .sound:hover,#hang:hover {text-decoration:underline;text-underline-offset:4px}
}
@media(max-width:360px) {
 .shell {padding-left:12px;padding-right:12px}
 .heading {padding:14px 0 12px}
 .ticket {padding:13px 12px}
 .key {padding-left:10px;padding-right:10px}
 .talknav {padding-left:9px;padding-right:8px;gap:5px}
 .controls {gap:7px}
}
@media(max-height:720px) and (max-width:650px) {
 .mast {min-height:43px}
 .heading {padding-top:12px;padding-bottom:12px}
 .heading p {margin-top:3px}
 .console {margin-top:10px}
 .callfoot {padding-top:9px}
}
@media(min-width:820px) {
 .shell {width:min(calc(100% - 72px),1000px);padding:25px 0}
 .mast {min-height:53px}
 .heading {padding:34px 0 25px}
 h1 {font-size:46px}
 .heading p {font-size:16px}
 .desk {display:grid;grid-template-columns:minmax(0,1.4fr) minmax(310px,1fr);align-items:center;gap:22px}
 .console {margin:0}
 .ticket {padding:20px}
 .talknav {padding:7px 13px}
 .callfoot {padding-top:18px}
}
@media(prefers-reduced-motion:reduce) {
 *,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important}
 [data-mode="ring"] .ring-lines {opacity:.9}
}
</style>
</head>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const app = $('phoneApp');
  const scene = $('scene');
  const ns = 'http://www.w3.org/2000/svg';
  const friends = [...document.querySelectorAll('[data-friend]')];
  const storeKey = 'xiaoliandan.first-call.v1';
  const beatLimit = 6;
  const defaultBell = [0, 310];

  // The phone and its moving parts are drawn here; everything works offline.
  function svgNode(tag, attrs) {
    const node = document.createElementNS(ns, tag);
    for (const [key,value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  }
  for (let i=0; i<10; i++) {
    const angle = (-18 - i*29.5) * Math.PI/180;
    const x = Math.cos(angle)*35.6, y = Math.sin(angle)*35.6;
    const group = $('dial-holes');
    group.append(svgNode('circle',{cx:x,cy:y,r:6.9,fill:'#ac9d79',stroke:'#8c795a','stroke-width':'.65'}));
    group.append(svgNode('circle',{cx:x,cy:y+.85,r:5.6,fill:'#6a604b'}));
    const number = svgNode('text',{x:x,y:y+3.5,'text-anchor':'middle',fill:'#fff5d8','font-family':'sans-serif','font-weight':700,'font-size':8.6});
    number.textContent = (i+1)%10;
    group.append(number);
  }
  function drawCord() {
    const spine = [[133,119],[102,97],[63,195],[83,216],[94,229],[118,215],[132,200]];
    const points = [];
    for (let n=0; n<=400; n++) {
      const t=n/400, split=.72;
      const part=t<split?0:3, u=t<split?t/split:(t-split)/(1-split), w=1-u;
      const [a,b,c,d]=spine.slice(part,part+4);
      const x=w*w*w*a[0]+3*w*w*u*b[0]+3*w*u*u*c[0]+u*u*u*d[0];
      const y=w*w*w*a[1]+3*w*w*u*b[1]+3*w*u*u*c[1]+u*u*u*d[1];
      const dx=3*(w*w*(b[0]-a[0])+2*w*u*(c[0]-b[0])+u*u*(d[0]-c[0]));
      const dy=3*(w*w*(b[1]-a[1])+2*w*u*(c[1]-b[1])+u*u*(d[1]-c[1]));
      const length=Math.hypot(dx,dy)||1, phase=t*Math.PI*2*22;
      const rise=Math.min(1,t*14,(1-t)*16);
      const cross=4.6*rise*Math.sin(phase), along=2.75*rise*Math.cos(phase);
      points.push((n?'L':'M')+(x+(dx*along-dy*cross)/length).toFixed(2)+' '+(y+(dy*along+dx*cross)/length).toFixed(2));
    }
    for (const id of ['cord','cord-shadow','cord-shine']) $(id).setAttribute('d',points.join(' '));
  }
  drawCord();
  [4,9,15,22,12,19,26,15,9,14,6].forEach((height,i) => {
    const bar=document.createElement('i');
    bar.style.setProperty('--height',height+'px');
    bar.style.setProperty('--delay',(-i*.06)+'s');
    $('meter').append(bar);
  });
  for(let i=0;i<beatLimit;i++) $('markers').append(document.createElement('span'));

  function readContact() {
    try {
      const saved=JSON.parse(localStorage.getItem(storeKey)) || {};
      const name=typeof saved.name==='string'?Array.from(saved.name.trim()).slice(0,12).join(''):'';
      const beats=Array.isArray(saved.beats) && saved.beats.length>0 && saved.beats.length<=beatLimit &&
        saved.beats[0]===0 && saved.beats.every(v=>Number.isInteger(v) && v>=0 && v<86400000)
        ?saved.beats.slice():null;
      return {name,beats};
    } catch (_) {return {name:'',beats:null};}
  }
  const contact=readContact();
  let durable=true;
  function saveContact() {
    try {localStorage.setItem(storeKey,JSON.stringify(contact));durable=true;}
    catch (_) {durable=false;}
  }
  function bellName() {return contact.beats?'你和小紫敲的 '+contact.beats.length+' 下':'小店的双响铃';}

  let mode='ring', who='pink', callStart=0, clockTimer=0;
  let visitedBefore=false, pinkWords=null, purpleDraft=null, lastKnock=null, nameEdited=false;
  const transient=new Set();
  function later(fn,ms) {
    const id=window.setTimeout(()=>{transient.delete(id);fn();},ms);
    transient.add(id);
    return id;
  }
  function clearTransient() {for(const id of transient) clearTimeout(id);transient.clear();}

  // A small, warm telephone bell, a dry key click, and two different "du" voices.
  const AudioClass=window.AudioContext || window.webkitAudioContext;
  let audio=null, output=null, soundOn=!!AudioClass, touched=false;
  const oscillators=new Set();
  let ringLoop=0, held=null, signalTimer=0;
  function wakeAudio() {
    if(!soundOn || !AudioClass) return;
    try {
      if(!audio) {
        audio=new AudioClass();
        output=audio.createGain();
        output.gain.value=.67;
        output.connect(audio.destination);
      }
      if(audio.state!=='running') audio.resume().catch(()=>{});
    } catch (_) {soundOn=false;updateSound();}
  }
  function tone(hz,toHz,duration,delay,volume,type='sine',tail=.045) {
    if(!soundOn || !audio || !output) return null;
    const start=audio.currentTime+delay, stop=start+duration;
    const oscillator=audio.createOscillator(), gain=audio.createGain();
    oscillator.type=type;
    oscillator.frequency.setValueAtTime(hz,start);
    oscillator.frequency.exponentialRampToValueAtTime(toHz,stop);
    gain.gain.setValueAtTime(.0001,start);
    gain.gain.exponentialRampToValueAtTime(volume,start+Math.min(.018,duration*.2));
    gain.gain.setValueAtTime(volume,Math.max(start+duration*.25,stop-tail));
    gain.gain.exponentialRampToValueAtTime(.0001,stop);
    oscillator.connect(gain);gain.connect(output);
    oscillators.add(oscillator);
    oscillator.onended=()=>{oscillators.delete(oscillator);oscillator.disconnect();gain.disconnect();};
    oscillator.start(start);oscillator.stop(stop+.012);
    return {oscillator,gain};
  }
  function silence() {
    for(const node of oscillators) {try {node.stop();} catch (_) {}}
    oscillators.clear();
  }
  function bellStrike() {
    tone(620,618,.32,0,.095,'sine',.285);
    tone(940,934,.25,.008,.055,'sine',.215);
    tone(1530,1505,.17,.003,.019,'sine',.145);
  }
  function clickKey() {tone(225,121,.062,0,.09,'triangle',.042);tone(1190,850,.037,0,.018);}
  function du(duration,pink=false) {
    const start=pink?518:392, finish=pink?578:407;
    return [tone(start,finish,duration,0,.15),tone(start*2,finish*2,duration,0,.026,'sine')].filter(Boolean);
  }
  function signal(kind,ms) {
    clearTimeout(signalTimer);
    scene.dataset.signal=kind;
    $('meter').classList.toggle('play',kind==='voice');
    signalTimer=window.setTimeout(()=>{scene.dataset.signal='';$('meter').classList.remove('play');},ms);
  }
  function updateSound() {
    const initial=mode==='ring'&&!touched&&soundOn;
    const label=initial?'听铃声':(soundOn?'静音':(AudioClass?'开声音':'文字模式'));
    $('soundLabel').textContent=label;
    $('soundIcon').setAttribute('href',initial?'#i-bell':soundOn?'#i-sound':'#i-mute');
    $('soundBtn').disabled=!AudioClass;
    $('soundBtn').setAttribute('aria-label',initial?'听来电铃声':soundOn?'静音':'打开声音');
  }
  function playBell(gaps,watch) {
    let offset=0;
    gaps.forEach((gap,index)=>{
      offset+=gap;
      const strike=()=>{bellStrike();if(watch)watch(index);};
      if(offset===0) strike(); else later(strike,offset);
    });
    return offset+350;
  }
  function playIncoming() {
    clearTimeout(ringLoop);
    if(mode!=='ring'||!soundOn||document.hidden) return;
    const length=playBell(contact.beats||defaultBell);
    ringLoop=window.setTimeout(playIncoming,length+2050);
  }
  function endHold(cancel=false) {
    if(!held) return;
    const prev=held;held=null;clearTimeout(prev.limit);
    $('hold').classList.remove('down');$('holdLabel').textContent='按住回嘟';
    const duration=Math.max(.16,Math.min(1.65,(performance.now()-prev.start)/1000));
    if(audio) {
      for(const node of prev.notes) {
        try {
          const t=audio.currentTime;
          node.gain.gain.cancelScheduledValues(t);
          node.gain.gain.setTargetAtTime(.0001,t,.012);node.oscillator.stop(t+.055);
        } catch (_) {}
      }
    }
    if(!cancel && mode==='call' && who==='pink') echoPink(duration);
  }
  function stopMoment() {
    endHold(true);clearTimeout(ringLoop);clearTransient();clearTimeout(signalTimer);
    scene.dataset.signal='';$('meter').classList.remove('play');silence();
  }
  function interact() {touched=true;wakeAudio();updateSound();}
  $('soundBtn').addEventListener('click',()=>{
    if(!touched && mode==='ring' && soundOn) {
      interact();playIncoming();return;
    }
    touched=true;soundOn=!soundOn;
    if(soundOn) {
      wakeAudio();
      if(mode==='ring') playIncoming();
      else if(mode==='mail') playMail();
      else clickKey();
    } else {
      stopMoment();
      if(mode==='mail' || mode==='ended') renderMessage();
      if(mode==='call' && who==='purple') renderPurple();
    }
    updateSound();
  });

  function asClock(ms) {
    const s=Math.max(0,Math.floor(ms/1000));
    return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
  function tick() {$('clock').textContent=asClock(Date.now()-callStart);}
  function setMode(next) {
    stopMoment();clearInterval(clockTimer);mode=next;app.dataset.mode=next;
    $('idlePanel').hidden=next!=='ring';$('livePanel').hidden=next!=='call';
    $('messagePanel').hidden=next!=='mail' && next!=='ended';
    $('clock').hidden=next!=='call';
    $('status').textContent={ring:'正在来电',call:'通话中',mail:'一条留言',ended:'已挂断'}[next];
    updateSound();
  }
  function keyboardFocus(element,event) {
    if(event && event.detail===0) element.focus({preventScroll:true});
  }
  function renderIncoming() {
    $('incomingName').textContent=contact.name||'还没存的号码';
    if(visitedBefore || contact.name || contact.beats) {
      $('incomingCopy').textContent=contact.beats?'这次先到的是那串熟悉的铃声。小紫盯着听筒，等你认出来。':'电话又响了。小粉这回占到了听筒最前面的位置。';
    }
    $('foot').textContent='铃声 · '+bellName();
  }
  function showRing(event) {
    setMode('ring');renderIncoming();wakeAudio();if(touched)playIncoming();
    keyboardFocus($('answer'),event);
  }
  function words(title,copy) {
    if($('quote').textContent!==title) $('quote').textContent=title;
    if($('narration').textContent!==copy) $('narration').textContent=copy;
  }
  const pictureText={
    pink:'小粉滚到橘红色听筒边。小黑抵着机身，小紫在后面等。',
    purple:'小粉挪开，小紫滚到听筒跟前，一张记铃声的小纸条翘了起来。',
    black:'小黑从电话座旁滚到听筒下。小纸条从转盘后面露出一截。'
  };
  const restingDesc=$('art-desc').textContent;
  function openLine(callback,event) {
    interact();setMode('call');callStart=Date.now();tick();clockTimer=setInterval(tick,1000);
    purpleDraft=contact.beats?null:[];lastKnock=null;nameEdited=false;
    $('nameInput').value=contact.name||'小脸蛋们';
    pinkWords=callback?['嘟——！','小粉一看是你回拨，把练好的「喂」又忘掉了。']:
      ['嘟？','小粉练了半天的「喂」，听见你接起来，还是嘟出了声。'];
    pickFriend('pink',false);clickKey();
    later(()=>{du(.32,true);signal('voice',340);},180);
    visitedBefore=true;keyboardFocus($('hold'),event);
  }
  function renderPink() {
    words(...pinkWords);
    $('foot').textContent='轻点是短嘟，按住就拉长。松手听小粉回你。';
  }
  function pickFriend(next,play=true) {
    if(play) {stopMoment();interact();clickKey();}
    who=next;app.dataset.who=next;
    for(const button of friends) button.setAttribute('aria-pressed',String(button.dataset.friend===next));
    $('pinkActions').hidden=next!=='pink';$('purpleActions').hidden=next!=='purple';
    $('blackActions').hidden=next!=='black';
    $('medium').textContent={pink:'小粉的声音',purple:'小紫的字条',black:'小黑的字条'}[next];
    $('art-desc').textContent=pictureText[next];
    lastKnock=null;
    if(next==='pink') renderPink();
    if(next==='purple') renderPurple();
    if(next==='black') renderBlack();
  }
  friends.forEach(button=>button.addEventListener('click',()=>{
    if(mode==='call' && who!==button.dataset.friend) pickFriend(button.dataset.friend);
  }));
  function echoPink(duration) {
    stopMoment();
    const long=duration>.58;
    pinkWords=long?['嘟——！','小粉跟着你拖长尾音。旁边两颗本来要接话，愣是等到这声嘟拐完了弯。']:
      ['嘟！','你轻轻点了一下。小粉立刻也回你一小声，尾音比你的高一点。'];
    renderPink();
    later(()=>{du(duration,true);signal('voice',duration*1000);},160);
  }
  function startHold() {
    if(held || mode!=='call' || who!=='pink') return;
    stopMoment();interact();
    held={start:performance.now(),notes:du(1.72),limit:window.setTimeout(()=>endHold(),1650)};
    $('hold').classList.add('down');$('holdLabel').textContent='松手送出';
    signal('voice',1700);
  }
  const hold=$('hold');
  let ignoreClickUntil=0;
  hold.addEventListener('pointerdown',event=>{
    if(!event.isPrimary || event.button!==0) return;
    startHold();
    if(hold.setPointerCapture) {try{hold.setPointerCapture(event.pointerId);}catch(_){}}
  });
  hold.addEventListener('pointerup',event=>{if(event.isPrimary){ignoreClickUntil=performance.now()+450;endHold();}});
  hold.addEventListener('pointercancel',()=>{endHold(true);});
  hold.addEventListener('lostpointercapture',()=>{if(held)endHold(true);});
  hold.addEventListener('contextmenu',event=>event.preventDefault());
  hold.addEventListener('keydown',event=>{
    if(event.key===' '||event.key==='Enter') {event.preventDefault();if(!event.repeat)startHold();}
  });
  hold.addEventListener('keyup',event=>{
    if(event.key===' '||event.key==='Enter') {event.preventDefault();ignoreClickUntil=performance.now()+450;endHold();}
  });
  hold.addEventListener('click',()=>{
    if(performance.now()>=ignoreClickUntil && !held) {interact();echoPink(.2);}
  });
  hold.addEventListener('blur',()=>endHold(true));

  function renderPurple() {
    const saved=purpleDraft===null && contact.beats;
    const beats=saved?contact.beats:(purpleDraft||[]);
    [...$('markers').children].forEach((mark,i)=>mark.classList.toggle('hit',i<beats.length));
    $('tapLabel').textContent=saved?'重新敲':'敲一下';
    $('tap').disabled=!saved&&beats.length>=beatLimit;
    $('keepLabel').textContent=saved?'试听铃声':'用作铃声';
    $('keep').disabled=!beats.length;
    if(saved) {
      words('这串铃，归我们啦。','小紫把 '+beats.length+' 个圆点圈在一起。下次来电，你敲的那一串会先响起来。');
      $('foot').textContent=durable?'铃声 · '+bellName():'小紫先把铃声留在这一次打开的电话里。';
    } else if(!beats.length) {
      words('宝，给我们敲一串铃声？','小紫在纸上画了六个空格。你敲几下，她就记几下，中间的停顿也算。');
      $('foot').textContent='敲好了就点「用作铃声」，一个圆点也行。';
    } else {
      words('记下第 '+beats.length+' 下了。',beats.length===beatLimit?'六个格子刚好装满。小紫把最后一个圆点描得特别圆。':'小紫落下一颗紫圆点，笔尖停在纸上等你。');
      $('foot').textContent='这一串有 '+beats.length+' 下。点「用作铃声」就能听见。';
    }
  }
  $('tap').addEventListener('click',()=>{
    if(mode!=='call'||who!=='purple')return;
    stopMoment();interact();
    if(purpleDraft===null) {purpleDraft=[];lastKnock=null;renderPurple();return;}
    if(purpleDraft.length>=beatLimit)return;
    const now=performance.now();
    const gap=purpleDraft.length?(lastKnock===null?350:Math.max(0,Math.round(now-lastKnock))):0;
    purpleDraft.push(gap);lastKnock=now;
    clickKey();signal('tap',180);renderPurple();
  });
  $('keep').addEventListener('click',()=>{
    if(mode!=='call'||who!=='purple')return;
    stopMoment();interact();
    if(purpleDraft && purpleDraft.length) {
      contact.beats=purpleDraft.slice();saveContact();purpleDraft=null;lastKnock=null;
    }
    if(!contact.beats)return;
    renderPurple();
    playBell(contact.beats,()=>signal('tap',180));
  });
  function renderBlack() {
    if(nameEdited) {
      words('「'+contact.name+'」','小黑把纸条抚平，贴到你的来电显示上。她盯着那几个字，看了好一会儿。');
      $('foot').textContent=durable?'下回来电，屏幕上就是这个名字。':'小黑先把名字留在这一次打开的电话里。';
    } else if(contact.name) {
      words('名字还好好地贴着。','小黑把纸条举给你看：「'+contact.name+'」。宝，还用这个名字吗？');
      $('foot').textContent='可以改字，也可以把听筒递回去。';
    } else {
      words('宝，把我们的号码存一下？','小黑推来一张空白的姓名条。她连笔都备好了，名字留给你起。');
      $('foot').textContent='纸条上写什么，下回来电就显示什么。';
    }
  }
  $('nameForm').addEventListener('submit',event=>{
    event.preventDefault();if(mode!=='call'||who!=='black')return;
    interact();
    const name=Array.from($('nameInput').value.trim()).slice(0,12).join('');
    if(!name) {words('纸条还是空的。','写个你喜欢的名字，小黑好把它贴上。');$('nameInput').focus();return;}
    contact.name=name;saveContact();nameEdited=true;$('nameInput').value=name;
    $('nameInput').blur();clickKey();renderBlack();
  });
  let endedTime='00:00';
  function renderMessage() {
    const mail=mode==='mail';
    $('messageType').textContent=mail?'听筒里的留言':'通话结束 · '+endedTime;
    $('messageTitle').textContent=mail?'嘟。……嘟嘟！':'听筒搁好啦。';
    $('messageBody').textContent=mail?'小粉试了一声，又凑近嘟了两声。小黑打来一行字：「宝，换你拨给我们呀。」小紫在末尾补了个圆点。':
      (contact.name?'小黑收好了写着「'+contact.name+'」的字条。':'小黑把听筒扶正。')+
      (contact.beats?'小紫还在桌上悄悄敲你留下的铃声。':'小紫刚松开，小粉又把听筒往自己这边挪了挪。');
    $('againLabel').textContent=mail?'回拨给她们':'让她们再打来';
    $('replay').hidden=!mail;
    $('foot').textContent=mail?'留言 · 小粉、小黑和小紫':'下次来电 · '+bellName();
    $('art-desc').textContent=restingDesc;
  }
  function playMail() {
    if(mode!=='mail')return;
    stopMoment();
    [[0,.19],[660,.18],[950,.29]].forEach(([delay,duration])=>{
      later(()=>{du(duration,true);signal('voice',duration*1000);},delay);
    });
    later(clickKey,1470);
  }
  $('answer').addEventListener('click',event=>openLine(false,event));
  $('toMail').addEventListener('click',event=>{
    interact();setMode('mail');renderMessage();playMail();keyboardFocus($('mainAgain'),event);
  });
  $('hang').addEventListener('click',event=>{
    endedTime=asClock(Date.now()-callStart);setMode('ended');renderMessage();clickKey();
    keyboardFocus($('mainAgain'),event);
  });
  $('mainAgain').addEventListener('click',event=>{
    if(mode==='mail')openLine(true,event);else if(mode==='ended')showRing(event);
  });
  $('replay').addEventListener('click',()=>{interact();playMail();});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) {stopMoment();lastKnock=null;}
    else if(mode==='call')tick();
  });
  window.addEventListener('pagehide',stopMoment);
  renderIncoming();updateSound();
})();
</script>
</body>
</html>
