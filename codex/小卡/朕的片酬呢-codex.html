function setupAudio(){if(!ac){let A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();master=ac.createGain();master.gain.value=.65;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume().catch(()=>{})}
function soundEvent(e,when){if(!ac||!master)return;const o=ac.createOscillator(),v=ac.createGain(),hz=440*Math.pow(2,(e.note-69)/12),end=when+e.dur;
o.type=e.kind==='wood'?'triangle':'sine';o.frequency.setValueAtTime(hz,when);
if(e.kind==='boing'){o.frequency.setValueAtTime(hz*1.7,when);o.frequency.exponentialRampToValueAtTime(hz*.55,end)}
if(e.kind==='gong')o.frequency.exponentialRampToValueAtTime(hz*.86,end);

}
