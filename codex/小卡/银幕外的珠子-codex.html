function schedule(){if(!audioCtx||!playing||audioCtx.state!=='running')return;while(nextEvent<EVENTS.length&&EVENTS[nextEvent].t<now+.16){const e=EVENTS[nextEvent++],time=audioEpoch+e.t;if(time>=audioCtx.currentTime-.04)synth(audioCtx,bus,e,Math.max(audioCtx.currentTime+.005,time))}}
const cover=document.querySelector('#cover'),playButton=document.querySelector('#play'),seekInput=document.querySelector('#seek'),clock=document.querySelector('#clock');
function updateUI(){seekInput.value=String(now);clock.textContent=fmt(now)+' / '+fmt(TOTAL);playButton.textContent=playing?'暂停':now>=TOTAL?'重播':'播放';cover.hidden=playing||started;chapterButtons.forEach((b,i)=>b.classList.toggle('active',i===sceneIndex(now)));lineButtons.forEach(({l,a})=>{const active=now>=l.a&&now<l.b;a.classList.toggle('active',active);a.setAttribute('aria-current',active?'true':'false')})}
let uiTime=-1;
function tick(stamp){if(!playing)return;if(lastStamp)now=Math.min(TOTAL,now+(stamp-lastStamp)/1000);lastStamp=stamp;render(now);schedule();if(stamp-uiTime>90){updateUI();uiTime=stamp}if(now>=TOTAL){pause();return}raf=requestAnimationFrame(tick)}
async function start(){if(playing)return;if(now>=TOTAL)now=0;started=true;playing=true;lastStamp=0;await initAudio();if(audioCtx&&audioCtx.state==='suspended'){try{await audioCtx.resume()}catch(e){audioWarning=true}}if(!playing)return;resetAudio();updateUI();raf=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(raf);lastStamp=0;if(bus){try{bus.disconnect()}catch(e){}}updateUI();render(now)}
function seek(t,autoplay=false){now=clamp(t,0,TOTAL);lastStamp=0;if(playing)resetAudio();render(now);updateUI();if(autoplay&&!playing)start()}
function toggle(){playing?pause():start()}
cover.addEventListener('click',start);playButton.addEventListener('click',toggle);cv.addEventListener('click',toggle);document.querySelector('#restart').addEventListener('click',()=>{seek(0);start()});seekInput.addEventListener('input',()=>seek(+seekInput.value));
document.querySelector('#sound').addEventListener('click',async()=>{muted=!muted;await initAudio();if(master)master.gain.setTargetAtTime(muted?0:MASTER_GAIN,audioCtx.currentTime,.02);document.querySelector('#sound').textContent='声音 '+(muted?'关':'开');document.querySelector('#sound').setAttribute('aria-pressed',String(!muted))});
function theater(on){document.querySelector('#screen').classList.toggle('theater',on);document.body.classList.toggle('cinema-open',on)}
document.querySelector('#full').addEventListener('click',async()=>{const s=document.querySelector('#screen');try{if(document.fullscreenElement)await document.exitFullscreen();else if(s.requestFullscreen)await s.requestFullscreen();else theater(true)}catch(e){theater(true)}});
document.querySelector('#leaveFull').addEventListener('click',async()=>{theater(false);if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){}});
document.addEventListener('keydown',e=>{if(e.code==='Escape')theater(false)});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.code==='ArrowRight'){e.preventDefault();seek(now+5)}else if(e.code==='ArrowLeft'){e.preventDefault();seek(now-5)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});
// Deterministic export and validation hook. render() never starts playback or audio.
window.FILM={W,H,TOTAL,canvas:cv,events:EVENTS,chapters,subtitles:LINES,render,seek,pause,play:start,synth,
 setSize(width){width=Math.max(240,Math.round(width));cv.width=width;cv.height=Math.round(width*H/W);render(now)},
 get state(){return{time:now,playing,muted,audioState:audioCtx?.state||'not-started',audioWarning}},
 async audioBuffer(){const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O)throw new Error('此浏览器不支持离线音频');const c=new O(2,Math.ceil((TOTAL+3)*44100),44100),m=c.createGain();m.gain.value=MASTER_GAIN;m.connect(c.destination);EVENTS.forEach(e=>synth(c,m,e,e.t));return c.startRendering()}
};
render(0);updateUI();
})();
</script>
