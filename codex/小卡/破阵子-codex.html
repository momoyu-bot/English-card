function poster(){render(5.3);rect(0,VIEW,W,H-VIEW,'#101e2b');txt('Clawd · 小粉 · 小紫 · 小黑',180,581,10,'#c6c8b6');txt('StashYu · FetchMo',180,603,10,'#c6c8b6');txt('六只入阵 · 一起回家',180,624,8,'#8faaa7')}
// 音符与动作共用影片时间。暂停、跳转、熄屏都会撤销旧声部。
const audioEvents=[];function event(t,type,data={}){audioEvents.push({t,type,...data})}
const scale=[0,2,4,7,9,12,14,16],mel=[0,3,4,3,2,1,0,2,3,5,4,3,2,0,1,3];
for(let k=0;k<224;k++){const t=k*.5;if(t>=D)break;const action=t>=22&&t<94,calm=t>=94;let n=scale[mel[k%16]];if(k%2===0||action)event(t,'pluck',{f:196*Math.pow(2,n/12)*(calm?1.0:1),dur:calm?1.3:.55,vol:calm?.045:.037});if(k%8===0)event(t,'pad',{f:[98,110,130.81,87.31][Math.floor(k/8)%4],dur:3.8,vol:.026});if(action&&k%2===0)event(t,'drum',{vol:t>72?.14:.075});if(action&&k%2===1)event(t,'tick',{vol:.018})}
for(let t of [12.65,32.1,74.4,91])event(t,'hit',{vol:t===91?.3:.19});
for(let t of [16,28.7,53.4,79.5,109])event(t,'boing');
for(let t of [23.5,25.8,28,40,41.3,42.6,44,48,50,52,74,76,78,80,82,84,86,89])event(t,'whoosh',{dur:t<70?.5:.8});
for(let t of [27,30,68,92,94,100])event(t,'chime');
for(let t of [63.8,67.8,71.8])event(t,'drum',{vol:.22});
for(let i=0;i<6;i++)event(101.2+i*.25,'pluck',{f:523.25*Math.pow(2,[0,2,4,7,9,12][i]/12),dur:.8,vol:.07});
audioEvents.sort((a,b)=>a.t-b.t);
let ac=null,master=null,noiseBuffer=null,soundOn=true,eventIndex=0;const sounding=new Set();
function ensureAudio(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();master=ac.createGain();master.gain.value=soundOn?.68:0;const compressor=ac.createDynamicsCompressor();compressor.threshold.value=-12;compressor.ratio.value=3;master.connect(compressor);compressor.connect(ac.destination);noiseBuffer=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const ar=noiseBuffer.getChannelData(0);let seed=173;for(let i=0;i<ar.length;i++){seed=(seed*16807)%2147483647;ar[i]=seed/1073741823.5-1}}if(ac.state!=='running')ac.resume().catch(()=>{})}catch(e){soundOn=false;updateSound()}}
function tone(f,at,dur,vol=.04,type='sine',end){if(!ac)return;const o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,f),at);if(end)o.frequency.exponentialRampToValueAtTime(end,at+dur);a.gain.setValueAtTime(.0001,at);a.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),at+.012);a.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(a);a.connect(master);sounding.add(o);o.onended=()=>{sounding.delete(o);o.disconnect();a.disconnect()};o.start(at);o.stop(at+dur+.03)}
function noise(at,dur,vol,f=1700,high=false){if(!ac)return;let o=ac.createBufferSource(),a=ac.createGain(),filter=ac.createBiquadFilter();o.buffer=noiseBuffer;o.loop=true;filter.type=high?'bandpass':'lowpass';filter.frequency.value=f;filter.Q.value=.7;o.connect(filter);filter.connect(a);a.connect(master);a.gain.setValueAtTime(.0001,at);a.gain.linearRampToValueAtTime(vol,at+.02);a.gain.exponentialRampToValueAtTime(.0001,at+dur);sounding.add(o);o.onended=()=>{sounding.delete(o);o.disconnect();filter.disconnect();a.disconnect()};o.start(at);o.stop(at+dur)}
function emit(e,at){if(!ac||!soundOn)return;switch(e.type){case'pluck':tone(e.f,at,e.dur,e.vol,'triangle');tone(e.f*2.002,at,e.dur*.4,e.vol*.3);break;case'pad':tone(e.f,at,e.dur,e.vol);tone(e.f*1.5,at,e.dur,e.vol*.25);break;case'drum':tone(118,at,.5,e.vol,'sine',40);noise(at,.12,e.vol*.4,380);break;case'tick':noise(at,.04,e.vol,3100);break;case'hit':tone(100,at,1,e.vol,'sine',30);noise(at,.5,e.vol*.45,1000);tone(196,at,1.4,.04);break;case'boing':tone(180,at,.25,.045,'sine',560);tone(540,at+.2,.4,.03,'sine',190);break;case'whoosh':noise(at,e.dur,.045,1700,true);break;case'chime':[0,4,7,12].forEach((n,i)=>tone(392*Math.pow(2,n/12),at+i*.09,1.6,.045));break}}
function hush(){for(let s of [...sounding]){try{s.stop()}catch(_){}}sounding.clear()}
function syncEvents(){eventIndex=audioEvents.findIndex(e=>e.t>=current-.002);if(eventIndex<0)eventIndex=audioEvents.length}
function schedule(){if(!ac||!soundOn||ac.state!=='running')return;while(eventIndex<audioEvents.length&&audioEvents[eventIndex].t<current+.12){let e=audioEvents[eventIndex++];if(e.t>=current-.1)emit(e,ac.currentTime+Math.max(0,e.t-current))}}
const screen=document.getElementById('screen'),cover=document.getElementById('cover'),playBtn=document.getElementById('play'),seekEl=document.getElementById('seek'),clock=document.getElementById('clock'),soundBtn=document.getElementById('sound'),linesEl=document.getElementById('lines'),chapEl=document.getElementById('chapters');
const format=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
subs.forEach((s,i)=>{let b=document.createElement('button');b.className='line';let time=document.createElement('time'),who=document.createElement('b'),words=document.createElement('span');time.textContent=format(s[0]);who.textContent=s[2];words.textContent=s[3];b.append(time,who,words);b.addEventListener('click',()=>{seek(s[0]);play()});linesEl.append(b)});
chapters.forEach(([t,name])=>{let b=document.createElement('button'),time=document.createElement('time');time.textContent=format(t);b.append(time,document.createTextNode(name));b.onclick=()=>{seek(t);play()};chapEl.append(b)});
let activeLine=-1,activeChapter=-1,wake=null;
function updateSound(){soundBtn.textContent=soundOn?'♪ 声音开':'♪ 声音关';soundBtn.setAttribute('aria-pressed',String(soundOn))}
function ui(){seekEl.value=current;clock.textContent=format(current)+' / '+format(D);seekEl.setAttribute('aria-valuetext',format(current)+'，共 '+format(D));screen.classList.toggle('playing',playing);screen.classList.toggle('started',started);playBtn.textContent=playing?'暂停':current>=D?'重播':'播放';playBtn.setAttribute('aria-label',playing?'暂停短片':'播放短片');cover.textContent=current>=D?'再入一阵 ↻':started?'继续 ▶':'入阵 ▶';const n=subs.findIndex(s=>current>=s[0]&&current<s[1]);if(n!==activeLine){if(activeLine>=0)linesEl.children[activeLine].classList.remove('current');if(n>=0)linesEl.children[n].classList.add('current');activeLine=n}const c=chapters.reduce((v,p,i)=>current>=p[0]?i:v,0);if(c!==activeChapter){if(activeChapter>=0)chapEl.children[activeChapter].classList.remove('current');chapEl.children[c].classList.add('current');activeChapter=c}}
function wakeOff(){if(wake){let w=wake;wake=null;w.release().catch(()=>{})}}
function wakeOn(){if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null});if(!playing)wakeOff()}).catch(()=>{})}
function play(){if(playing)return;if(current>=D)current=0;started=true;playing=true;ensureAudio();syncEvents();wakeOn();lastTime=performance.now();render(current);schedule();ui();frameId=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(frameId);hush();wakeOff();ui()}
function seek(t){current=clamp(Number(t)||0,0,D);started=true;hush();syncEvents();lastTime=performance.now();render(current);ui();if(current>=D)pause()}
function tick(now){if(!playing)return;current=Math.min(D,current+Math.max(0,(now-lastTime)/1000));lastTime=now;try{render(current)}catch(e){pause();let err=document.getElementById('error');err.hidden=false;err.textContent='这一格没能放出来。可以从字幕本跳到下一场。';console.error(e);return}schedule();ui();if(current>=D){pause();return}frameId=requestAnimationFrame(tick)}
function toggle(){playing?pause():play()}
function resize(){let r=cv.getBoundingClientRect(),ratio=Math.min(3,window.devicePixelRatio||1),w=Math.max(1,Math.round(r.width*ratio));cv.width=w;cv.height=Math.round(w*H/W);started?render(current):poster()}
playBtn.onclick=toggle;cv.onclick=toggle;cover.onclick=e=>{e.stopPropagation();play()};document.getElementById('restart').onclick=()=>{seek(0);play()};seekEl.oninput=()=>seek(seekEl.value);soundBtn.onclick=()=>{soundOn=!soundOn;ensureAudio();if(master)master.gain.setValueAtTime(soundOn?.68:0,ac.currentTime);hush();syncEvents();updateSound()};
async function full(){if(document.fullscreenElement){await document.exitFullscreen();return}if(screen.classList.contains('full')){exitFull();return}if(screen.requestFullscreen){try{await screen.requestFullscreen();return}catch(_){}}screen.classList.add('full');document.body.style.overflow='hidden';resize()}
