// 在浏览器中手工弹奏的原创配乐；音画共用播放时钟，暂停和跳转会清掉旧音。
let ac=null,master=null,voices=[],audioReady=false,sound=false,nextBeat=-1;
const NOTES=[196,246.9417,293.6648,369.9944,392,493.8833,587.3295,739.9888];
function initAudio(){if(ac)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('浏览器暂不支持声音');ac=new A();master=ac.createGain();master.gain.value=.33;master.connect(ac.destination);audioReady=true;}
function tone(freq,duration=.3,type='sine',volume=.1,when=0){if(!ac||!sound)return;const start=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(volume,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(master);o.start(start);o.stop(start+duration+.025);const v={o,g};voices.push(v);o.onended=()=>{o.disconnect();g.disconnect();const i=voices.indexOf(v);if(i>=0)voices.splice(i,1)};}
function silence(){for(const v of voices){try{v.o.stop();v.o.disconnect();v.g.disconnect()}catch(e){}}voices=[];nextBeat=-1;}
function soundAt(t){const beat=Math.floor(t*2);if(beat===nextBeat)return;nextBeat=beat;const scene=sceneAt(t);if(scene===6&&t>85)return;const calm=scene>=8||scene===0;const melody=calm?[0,2,4,2,1,3,2,0]:[0,2,1,4,2,5,3,1];const pitch=NOTES[melody[beat%8]];tone(pitch,calm?.9:.21,'sine',calm?.16:.12);if(beat%4===0)tone(NOTES[scene%3]/2,1.1,'sine',.13);if(scene===5){const i=Math.min(5,Math.floor(Math.max(0,t-62)/2.65));if(i===1)tone(880,.085,'square',.035);if(i===2)tone(180+beat%3*90,.15,'triangle',.07);if(i===3)tone(100,.28,'sawtooth',.025);}if(scene===7&&t>=98&&t<99){tone(523,.45,'triangle',.16);tone(659,.7,'sine',.1,.08)}if(t>=137&&t<137.5)tone(146.8,.08,'triangle',.22);}
let cur=0,playing=false,started=false,speed=1,last=0,raf=0,activeLine=-1,scrubbing=false,resumeScrub=false;
const lineButtons=[];
function mm(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
const book=$('transcript');SCENES.forEach(([start,name],i)=>{const h=document.createElement('h3');h.className='chapter-title';h.textContent=String(i+1).padStart(2,'0')+' / '+name;book.append(h);const end=SCENES[i+1]?.[0]??TOTAL;LINES.forEach(([time,who,words],idx)=>{if(time<start||time>=end)return;const b=document.createElement('button');b.className='line';b.type='button';b.dataset.time=time;b.setAttribute('aria-label',`${mm(time)}，${who}，${words}，跳到这句`);const tm=document.createElement('time');tm.textContent=mm(time);const w=document.createElement('span');w.className='who';w.textContent=who;const tx=document.createElement('span');tx.className='words';tx.textContent=words;b.append(tm,w,tx);b.addEventListener('click',()=>{go(time);play();$('cinema').scrollIntoView({block:'start',behavior:'auto'})});book.append(b);lineButtons[idx]=b;})});
function ui(){if(!scrubbing)$('seek').value=cur;$('time').textContent=mm(cur)+' / '+mm(TOTAL);const si=sceneAt(cur);$('chapter').textContent=String(si+1).padStart(2,'0')+' / '+SCENES[si][1];$('play').textContent=playing?'暂停':cur>=TOTAL?'再看一遍':'播放';$('play').setAttribute('aria-pressed',String(playing));const li=lineAt(cur);if(li!==activeLine){if(activeLine>=0){lineButtons[activeLine].classList.remove('active');lineButtons[activeLine].removeAttribute('aria-current')}lineButtons[li].classList.add('active');lineButtons[li].setAttribute('aria-current','true');activeLine=li;$('live').textContent=LINES[li][1]+'：'+LINES[li][2]}$('start').hidden=playing||started;}
function tick(now){if(!playing)return;const dt=Math.min(.25,(now-last)/1000);last=now;cur=Math.min(TOTAL,cur+dt*speed);try{render(cur);if(sound)soundAt(cur)}catch(e){pause();$('error').textContent='这一格没有放出来。可以点字幕换到下一场。';console.error(e);return}ui();if(cur>=TOTAL){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(playing)return;if(cur>=TOTAL)cur=0;started=true;playing=true;last=performance.now();if(sound&&ac)ac.resume().catch(()=>{});nextBeat=-1;ui();raf=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(raf);silence();ui()}
function go(t){cur=clamp(Number(t)||0,0,TOTAL);silence();render(cur);last=performance.now();ui();return cur}
function toggle(){playing?pause():play()}
$('startBtn').addEventListener('click',play);$('play').addEventListener('click',toggle);cv.addEventListener('click',toggle);$('replay').addEventListener('click',()=>{go(0);play()});
$('speed').addEventListener('click',()=>{speed=speed===1?1.25:speed===1.25?.75:1;$('speed').textContent=speed+'×';silence()});
$('seek').addEventListener('pointerdown',()=>{scrubbing=true;resumeScrub=playing;if(playing)pause()});
$('seek').addEventListener('input',()=>{go(Number($('seek').value))});
function endSeek(){if(!scrubbing)return;scrubbing=false;if(resumeScrub)play();resumeScrub=false;ui()}
window.addEventListener('pointerup',endSeek);window.addEventListener('pointercancel',endSeek);$('seek').addEventListener('change',endSeek);
$('sound').addEventListener('click',async()=>{try{initAudio();await ac.resume();sound=!sound;$('sound').textContent='声音：'+(sound?'开':'关');$('sound').setAttribute('aria-pressed',String(sound));silence();if(sound){tone(392,.35,'sine',.15);nextBeat=-1}}catch(e){$('error').textContent='这个浏览器暂时不能放声音，画面和字幕仍可正常观看。'}});
async function fullscreen(){const el=$('cinema');if(document.fullscreenElement){await document.exitFullscreen();return}if(el.classList.contains('expanded')){el.classList.remove('expanded');document.body.style.overflow='';return}if(el.requestFullscreen){try{await el.requestFullscreen();return}catch(e){}}el.classList.add('expanded');document.body.style.overflow='hidden'}
$('full').addEventListener('click',fullscreen);$('exit').addEventListener('click',fullscreen);
document.addEventListener('keydown',e=>{if(e.target.matches('input,button,summary,a,textarea,select'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'){e.preventDefault();go(cur+5)}if(e.code==='ArrowLeft'){e.preventDefault();go(cur-5)}if(e.code==='Escape'&&$('cinema').classList.contains('expanded')){$('cinema').classList.remove('expanded');document.body.style.overflow=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});
window.FILM={W,H,TOTAL,duration:TOTAL,canvas:cv,render,seek:go,play,pause,scenes:SCENES,subtitles:LINES,get time(){return cur},get playing(){return playing},get speed(){return speed}};
render(0);ui();
})();
</script>
