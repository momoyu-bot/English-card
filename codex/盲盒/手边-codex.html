<main class="page">

<div class="toolbar"><div class="tabs" role="group" aria-label="筛选任务"><button class="tab" data-filter="all" aria-pressed="true">全部</button><button class="tab" data-filter="open" aria-pressed="false">未完成</button><button class="tab" data-filter="done" aria-pressed="false">已完成</button></div><div class="toolbar-right"><button id="searchToggle" class="icon-btn" aria-label="搜索任务" aria-expanded="false"><svg class="icon"><use href="#i-search"/></svg></button><button id="organize" class="quiet organize" aria-pressed="false">整理</button></div></div>
<div id="searchWrap" class="search-wrap" hidden><label for="search" class="sr-only">搜索标题或备注</label><input type="search" id="search" placeholder="找一找标题或备注…" autocomplete="off"></div>

<div class="demo-banner" id="demoBanner" hidden><span>这几条是练手的示例</span><button id="removeDemo">收起示例</button></div>

</section><p class="outside-foot">StashYu & FetchMo · 陪工中</p>

function openOptions(){openSheet('便笺的小抽屉',`<div class="option-list"><button class="option-button" id="portable"><span>下载这张便笺<small>带上现有任务，换个地方也能打开</small></span>${icon('download')}</button><button class="option-button" id="backup"><span>导出任务备份<small>保存为 JSON，方便以后导入</small></span>${icon('download')}</button><button class="option-button" id="import"><span>导入任务备份<small>可以追加，也可以替换这张便笺</small></span>${icon('plus')}</button></div><hr class="divider"><span class="field-label">纸面的颜色</span><div class="theme-buttons">${[['light','浅色'],['dark','深色'],['auto','跟随系统']].map(([v,l])=>`<button class="action" data-theme-option="${v}" aria-pressed="${state.theme===v}">${l}</button>`).join('')}</div><hr class="divider"><div class="help-copy"><p><b>写下来：</b>每行一件事，点「＋」加入。点任务文字可以改内容、留备注、拆成小步。</p><p><b>拢一拢：</b>点「整理」多选后合并、移动。小步骤也能单独选走，勾完不会自动乱跑。</p><p><b>收好它：</b>内容保存在当前浏览器，不会自动同步到其他设备。换设备可下载含任务的便笺，或导出、导入备份。</p></div>`);$('#portable').onclick=portable;$('#backup').onclick=backup;$('#import').onclick=()=>$('#importFile').click();$$('[data-theme-option]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.themeOption;theme();save();$$('[data-theme-option]').forEach(x=>x.setAttribute('aria-pressed',x===b));});}
$('#options').onclick=openOptions;
$('#importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;let imported;try{if(file.size>6*1024*1024)throw Error('备份太大了，请选择 6 MB 以内的文件。');imported=validate(JSON.parse(await file.text()));}catch(err){toast(err instanceof SyntaxError?'这个文件无法读取，请选导出的 JSON 备份。':err.message);return;}
 openSheet('接住这份备份',`<p class="hint">读到 ${imported.tasks.length} 件任务。追加会放在便笺底部；替换会换成备份里的任务和输入草稿。两种方式都能撤销任务变化。</p><div class="sheet-footer"><button class="action" id="importAppend">追加进来</button><button class="action primary" id="importReplace">替换便笺</button></div>`);
 const fresh=ts=>ts.map(t=>({...t,id:uid(),example:false,children:fresh(t.children)}));
 $('#importAppend').onclick=()=>{if(all().length+all(imported.tasks,[]).length>5000){toast('合在一起超过 5000 条，请换用替换。');return;}commit(()=>state.tasks.push(...fresh(imported.tasks)),'备份接住了，放在最后面。');closeSheet();};
 $('#importReplace').onclick=()=>{commit(()=>{state.tasks=fresh(imported.tasks);state.draft=imported.draft;$('#newTask').value=state.draft;filter='all';query='';$('#search').value='';selected.clear();},'已换成备份里的任务。');autoHeight();closeSheet();};
};
// Pointer sorting works with touch, pen and mouse. A tap opens the same move picker.
let drag=null,dragSuppressed=false;
function clearMarkers(){$$('.drop-before,.drop-after').forEach(n=>n.classList.remove('drop-before','drop-after'));}
function detectTarget(){if(!drag?.active)return;clearMarkers();let best=null,dist=Infinity;for(const n of $$('#tasks .node')){if(drag.blocked.has(n.dataset.id))continue;const row=n.querySelector(':scope > .row'),r=row.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;const d=Math.abs(drag.y-(r.top+r.height/2));if(d<dist){dist=d;best={id:n.dataset.id,where:drag.y<r.top+r.height/2?'before':'after',node:n};}}drag.target=best;if(best)best.node.classList.add('drop-'+best.where);}
function dragTick(){if(!drag?.active)return;const edge=80,speed=drag.y<edge?-Math.ceil((edge-drag.y)/7):drag.y>innerHeight-edge?Math.ceil((drag.y-innerHeight+edge)/7):0;if(speed)window.scrollBy(0,speed);detectTarget();drag.frame=requestAnimationFrame(dragTick);}
function endDrag(cancel=false){if(!drag)return;const d=drag;drag=null;cancelAnimationFrame(d.frame);d.ghost?.remove();clearMarkers();$$('.drag-source').forEach(n=>n.classList.remove('drag-source'));document.body.classList.remove('dragging');if(d.active){dragSuppressed=true;setTimeout(()=>dragSuppressed=false,120);if(!cancel&&d.target)commit(()=>moveTo(d.ids,d.target.id,d.target.where),'顺序排好了。');}try{d.handle.releasePointerCapture(d.pointerId);}catch(e){}}
$('#tasks').addEventListener('pointerdown',e=>{const h=e.target.closest('.drag-handle');if(!h||e.button!==0)return;const id=h.closest('.node').dataset.id,ids=isSelected(id)?roots([...selected]).map(t=>t.id):[id];drag={handle:h,ids,blocked:forbidden(ids),pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,active:false};h.setPointerCapture(e.pointerId);});
$('#tasks').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;drag.x=e.clientX;drag.y=e.clientY;if(!drag.active&&Math.hypot(drag.x-drag.startX,drag.y-drag.startY)>7){drag.active=true;document.body.classList.add('dragging');for(const n of $$('#tasks .node'))if(drag.ids.includes(n.dataset.id))n.classList.add('drag-source');drag.ghost=document.createElement('div');drag.ghost.className='drag-ghost';drag.ghost.textContent=drag.ids.length>1?`移动 ${drag.ids.length} 件事`:find(drag.ids[0]).task.title;document.body.appendChild(drag.ghost);dragTick();}if(drag.active){e.preventDefault();drag.ghost.style.left=Math.max(12,Math.min(innerWidth-drag.ghost.offsetWidth-12,e.clientX-drag.ghost.offsetWidth/2))+'px';drag.ghost.style.top=Math.max(8,e.clientY-65)+'px';detectTarget();}});
$('#tasks').addEventListener('pointerup',()=>endDrag());$('#tasks').addEventListener('pointercancel',()=>endDrag(true));document.addEventListener('keydown',e=>{if(e.key==='Escape')endDrag(true);});
$('#tasks').addEventListener('keydown',e=>{const h=e.target.closest('.drag-handle');if(!h||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const id=h.closest('.node').dataset.id,f=find(id),delta=e.key==='ArrowUp'?-1:1,other=f.list[f.index+delta];if(!other)return;commit(()=>moveTo([id],other.id,delta<0?'before':'after'));$$('.node').find(n=>n.dataset.id===id)?.querySelector('.drag-handle').focus();});
// Original pixel grids: momoyu造型宪法 / StashYu and FetchMo.
const PALS={"fox":{"rows":[".D..........D.......",".DM........MD.......",".MCM......MCM...CC..",".MMMMMMMMMMMM..CCCC.",".MMEEMMMMEEMM..MMMM.",".MMEEMMMMEEMM..MMMMM","CCCCCCDDCCCCCC.MMMMM","..CCCCCCCCCC..MMMMM.","....MMCCMM...MMMMM..","....MMCCMM..MMMMM...","....MMMMMM.MMMMM....","....DDMMDDMMMM......","...................."],"pal":{"M":"#E2552B","C":"#FFF3E3","D":"#3B2520","E":"#3B2520"},"eyes":[[3,4],[9,4]]},"cat":{"rows":["....................","........X........X..",".......XXX......XXX.","........MMMMMMMMMM..",".......MMMMMMMMMMMM.",".......MEEMMMMMMEEM.",".....X.MEEMXXXXMEEM.","....X..MMMMMXXMMMMM.","....X...MMMMMMMMMM..","....X...MMMMMMMMMM..",".....X...MMMMMMMM...","......XXXXXM..MXX...","...................."],"pal":{"M":"#F3E7D6","X":"#4E382E","E":"#79C0F0"},"eyes":[[8,5],[16,5]]}};
function drawPet(name,expression='normal'){const p=PALS[name],g=p.rows.map(r=>r.split(''));p.eyes.forEach(([x,y])=>{for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)g[y+dy][x+dx]='M';const cells=expression==='blink'?[[0,1],[1,1]]:expression==='happy'?[[-1,1],[0,0],[1,0],[2,1]]:[[0,0],[1,0],[0,1],[1,1]];cells.forEach(([dx,dy])=>g[y+dy][x+dx]=expression==='normal'?'E':(name==='fox'?'D':'X'));});const colors={};g.forEach((r,y)=>{let x=0;while(x<r.length){const k=r[x];if(k==='.'){x++;continue;}let n=1;while(r[x+n]===k)n++;(colors[p.pal[k]]??=[]).push(`M${x} ${y}h${n}v1h-${n}z`);x+=n;}});const title=name==='fox'?'StashYu':'FetchMo';$('#'+name).innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 13" width="60" height="39" shape-rendering="crispEdges" role="img"><title>${title}</title><desc>${name==='fox'?'火红狐狸，白尖大尾巴。':'奶白暹罗，深棕重点色与蓝眼睛。'}</desc>${Object.entries(colors).map(([c,path])=>`<path fill="${c}" d="${path.join('')}"/>`).join('')}</svg>`;}
function petSay(words,who){clearTimeout(petTimer);$('#petWords').textContent=words;drawPet(who,'happy');const span=$('#'+who);span.classList.remove('pet-hop');void span.offsetWidth;if(!reduced.matches)span.classList.add('pet-hop');petTimer=setTimeout(()=>{drawPet('fox');drawPet('cat');$('#petWords').textContent='零碎有人收，事情慢慢做。';},3400);}
$('#pals').onclick=()=>petSay(['FetchMo：今天这一步，我陪你。','StashYu：不用一口气做完。','FetchMo：奶茶先放旁边。'][Math.floor(Math.random()*3)],Math.random()>.5?'fox':'cat');
setInterval(()=>{if(document.hidden||reduced.matches||$('#sheet').open)return;const name=Math.random()>.5?'fox':'cat';drawPet(name,'blink');setTimeout(()=>drawPet(name),150);},5300);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
refreshDone();theme();$('#newTask').value=state.draft;autoHeight();render();drawPet('fox');drawPet('cat');
$('#date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
if(loaded)$('#saveStatus').textContent='已存到本机';if(!saveOK){$('#saveStatus').textContent='未能读取 · 可导入备份';$('#saveStatus').classList.add('failed');}else save();
})();
</script>
