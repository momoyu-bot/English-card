<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>对照3 · 状态栏透明</title>
<style>
  :root{
    --paper:#FBFAF7;
    --goods:#55504A;
    --shelf:#3D3830;
    --sign:#A9A29A;
    --note:#BEB7AD;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
           "Noto Sans CJK SC",system-ui,sans-serif;
    --font-sign:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --bar1:40px;
    --bar2:34px;
    --gutter:30px;
    --safe-top:env(safe-area-inset-top,0px);
  }

  *{box-sizing:border-box;}

  html{
    background:var(--paper);
    -webkit-text-size-adjust:100%;
  }

  body{
    margin:0;
    padding:var(--safe-top) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
    background:var(--paper);
    color:var(--goods);
    font-family:var(--font);
    font-size:16px;
  }

  /* ==== A 方案：跟现在的索引页一模一样 ==== */
  body::before{
    content:"";
    position:fixed;
    top:0; left:0; right:0;
    height:var(--safe-top);
    background:var(--paper);
    z-index:5;
    pointer-events:none;
    transform:translateZ(0);
    will-change:transform;
  }

  main{
    max-width:32rem;
    margin:0 auto;
    padding:0 var(--gutter) 160px;
  }

  .tag{
    list-style:none; cursor:pointer;
    position:sticky;
    top:var(--safe-top);
    z-index:4;
    display:block;
    font-family:var(--font-sign);
    height:var(--bar1);
    line-height:var(--bar1);
    background:var(--paper);
    font-size:14.5px;
    letter-spacing:0.15em;
    text-transform:lowercase;
    color:var(--sign);
    white-space:nowrap;
  }
  .tag::-webkit-details-marker{display:none;}
  .tag::marker{content:"";}
  .tag .n{margin-left:7px;font-size:11px;vertical-align:0.32em;color:var(--note);}

  .pack-tag{
    list-style:none; cursor:pointer;
    position:sticky;
    top:calc(var(--safe-top) + var(--bar1));
    z-index:3;
    display:block;
    height:var(--bar2);
    line-height:var(--bar2);
    padding-left:14px;
    background:var(--paper);
    font-size:15.5px;
    letter-spacing:0.09em;
    color:var(--shelf);
    white-space:nowrap;
  }
  .pack-tag::-webkit-details-marker{display:none;}
  .pack-tag::marker{content:"";}

  details.group{margin:0 0 10px;}
  details.group[open]{margin-bottom:34px;}
  details.pack{margin:0 0 30px;}
  .item{margin:0 0 10px;line-height:1.8;padding-left:14px;}
  ul{list-style:none;margin:0;padding:0;}

  /* ==== B 方案：内容物理上进不去安全区 ==== */
  body.mode-b{padding-top:0;height:100vh;overflow:hidden;}
  body.mode-b::before{display:none;}
  body.mode-b main{
    position:fixed;
    top:var(--safe-top); left:0; right:0; bottom:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-top:0;
  }
  body.mode-b .tag{top:0;}
  body.mode-b .pack-tag{top:var(--bar1);}

  /* ==== 读数面板 ==== */
  #panel{
    position:fixed;
    left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    z-index:99;
    background:#161310;
    color:#F2EFE9;
    border-radius:14px;
    padding:12px 14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;
    line-height:1.75;
    box-shadow:0 6px 26px rgba(0,0,0,.28);
  }
  #panel b{color:#FFD9A0;font-weight:600;}
  #panel .hi{color:#8FE3B0;}
  #panel .lo{color:#FF9B8A;}
  #panel .row{display:flex;justify-content:space-between;gap:10px;}
  #btn{
    display:block;width:100%;margin-top:10px;
    padding:11px 0;border:0;border-radius:10px;
    background:#F2EFE9;color:#161310;
    font-family:inherit;font-size:13px;font-weight:600;
    -webkit-tap-highlight-color:transparent;
  }
  /* 探针：一个和盖纸同样高的隐形块，用来量 safe-top 的真实计算值 */
  #probe{position:fixed;top:0;left:0;width:1px;height:var(--safe-top);pointer-events:none;opacity:0;}
  /* 影子：跟盖纸完全同样的定位方式，用来量它滑动时到底跑到哪去了 */
  #shadow{position:fixed;top:0;left:0;width:1px;height:var(--safe-top);pointer-events:none;opacity:0;
          transform:translateZ(0);will-change:transform;}
</style>
</head>
<body>

<div id="probe"></div>
<div id="shadow"></div>

<main>
  <ul id="list"></ul>
</main>

<div id="panel">
  <div class="row"><span>safe-top 现在</span><b id="v-now">–</b></div>
  <div class="row"><span>滑动中最小 / 最大</span><b><span class="lo" id="v-min">–</span> / <span class="hi" id="v-max">–</span></b></div>
  <div class="row"><span>盖纸实际顶边</span><b id="v-cap">–</b></div>
  <div class="row"><span>视口高 innerH / visualV</span><b id="v-vh">–</b></div>
  <div class="row"><span>屏幕高 screen.height</span><b id="v-sh">–</b></div>
  <div class="row"><span>全屏模式</span><b id="v-sa">–</b></div>
  <button id="btn">切到 C 方案（JS 兜底补高）</button>
</div>

<script>
(function(){
  // 造一份跟索引页同构的长列表
  var groups = [
    ["claude", 80, "摸鱼", ["宝的摸鱼小屋 · 反向摸鱼版","慢慢吃 · 半倍速","摸鱼大师五分钟下班","周一摸鱼老板键","下班 · 17:58"]],
    ["gemini", 112, "小游戏", ["宝的迷你游乐园","打小咪 · 洞洞乐","Token 小切糕机","SVG 小猫互动实验室"]],
    ["grok", 70, "小卡", ["GPT 专属小票生成器 | 只要你","宝的睡觉觉小窝","给宝的困困小窝","给宝的抱抱页"]],
    ["copilot", 12, "购物车", ["赛博购物车 · 一等座","失效宝贝区","清空失效宝贝"]],
    ["unsigned", 45, "哄睡", ["宝，晚安觉觉","宝，起床上班啦","工位核桃眼急救小窝","忧郁小眼睛上班补给站","早安服务台 · 宝专属","晚安，宝 · 只有字","猫猫哄睡小窝","睡前小窝","粉嘟嘟哄哄","给宝的上班续命小符咒","给宝的晚安小屋","给宝的月眠舱","给宝的睡前收摊小屋","给宝的软乎乎小文件","起床小助手"]]
  ];
  var html = "";
  groups.forEach(function(g){
    html += '<li><details class="group" open><summary class="tag">'+g[0]+'<span class="n">'+g[1]+'</span></summary>'
          + '<ul><li><details class="pack" open><summary class="pack-tag">'+g[2]+'</summary><ul>';
    // 每组重复几遍，撑出足够滑的长度
    for(var r=0;r<3;r++){
      g[3].forEach(function(name){ html += '<li class="item">'+name+'</li>'; });
    }
    html += '</ul></details></li></ul></details></li>';
  });
  document.getElementById('list').innerHTML = html;

  var probe  = document.getElementById('probe');
  var shadow = document.getElementById('shadow');
  var vNow=document.getElementById('v-now'), vMin=document.getElementById('v-min'),
      vMax=document.getElementById('v-max'), vCap=document.getElementById('v-cap'),
      vVh =document.getElementById('v-vh'),  vSa =document.getElementById('v-sa'),
      vSh =document.getElementById('v-sh');

  var min=Infinity, max=-Infinity;

  var standalone = (window.navigator.standalone===true) ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  vSa.textContent = standalone ? "是（standalone）" : "否（Safari）";

  function tick(){
    var h = probe.getBoundingClientRect().height;   // safe-top 的真实计算值
    var capTop = shadow.getBoundingClientRect().top; // 盖纸此刻的实际顶边，应恒为 0
    if(h<min) min=h;
    if(h>max) max=h;
    vNow.textContent = h.toFixed(1)+"px";
    vMin.textContent = (min===Infinity?"–":min.toFixed(1));
    vMax.textContent = (max===-Infinity?"–":max.toFixed(1));
    vCap.textContent = capTop.toFixed(1)+"px";
    var vv = window.visualViewport;
    vVh.textContent = Math.round(window.innerHeight) + " / " + (vv?Math.round(vv.height):"–");
    vSh.textContent = Math.round(screen.height);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var btn=document.getElementById('btn');
  btn.addEventListener('click',function(){
    var b=document.body;
    var toB = !b.classList.contains('mode-b');
    btn.textContent = toB ? "切回 A 方案（现在的做法）" : "切到 C 方案（JS 兜底补高）";
    min=Infinity; max=-Infinity;   // 换方案重新计峰值
  });
})();
</script>
</body>
</html>
